<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Validation boundary decision map</title><desc id="desc">Decision map separating caller preconditions, internal state invariants, and domain validation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="line-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1640" height="1040"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#canvas)"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Reject Invalid State at the Owning Boundary</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#b6c4d6">The exception type tells the caller which contract was broken.</text>
  <rect x="530" y="195" width="540" height="105" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4" filter="url(#shadow)"/><text x="800" y="238" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#c4b5fd">What kind of rule failed?</text><text x="800" y="272" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">validate before side effects begin</text>
  <g fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#line-glow)"><path d="M 650 300 V 330 Q 650 350 630 350 H 300 Q 280 350 280 370 V 405" marker-end="url(#arrow)"/><path d="M 800 300 V 405" marker-end="url(#arrow)"/><path d="M 950 300 V 330 Q 950 350 970 350 H 1300 Q 1320 350 1320 370 V 405" marker-end="url(#arrow)"/></g>
  <g filter="url(#shadow)"><rect x="90" y="405" width="380" height="410" rx="28" fill="#172033" stroke="#159c92" stroke-width="4"/><rect x="610" y="405" width="380" height="410" rx="28" fill="#172033" stroke="#c58b2a" stroke-width="4"/><rect x="1130" y="405" width="380" height="410" rx="28" fill="#172033" stroke="#8b6bd6" stroke-width="4"/></g>
  <text x="280" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#5eead4">Caller argument</text><text x="800" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#f6c96b">Object state</text><text x="1320" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#c4b5fd">Domain rule</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#b6c4d6" text-anchor="middle"><text x="280" y="505">require / require* helpers</text><text x="800" y="505">check / state guard</text><text x="1320" y="505">domain-specific validator</text></g>
  <g fill="#111827" stroke-width="3"><rect x="120" y="545" width="320" height="105" rx="20" stroke="#159c92"/><rect x="640" y="545" width="320" height="105" rx="20" stroke="#c58b2a"/><rect x="1160" y="545" width="320" height="105" rx="20" stroke="#8b6bd6"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="24" text-anchor="middle"><text x="280" y="588" fill="#5eead4">IllegalArgumentException</text><text x="800" y="588" fill="#f6c96b">IllegalStateException</text><text x="1320" y="588" fill="#c4b5fd">Domain exception / result</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb"><text x="135" y="700">Examples:</text><text x="135" y="733">• null / blank / empty</text><text x="135" y="766">• positive capacity</text><text x="655" y="700">Examples:</text><text x="655" y="733">• already closed</text><text x="655" y="766">• transition not allowed</text><text x="1175" y="700">Examples:</text><text x="1175" y="733">• insufficient balance</text><text x="1175" y="766">• booking conflict</text></g>
  <rect x="230" y="850" width="1140" height="55" rx="20" fill="#201923" stroke="#d16f75" stroke-width="3"/><text x="800" y="885" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">Never include secrets in messages; never replace a domain error with a generic precondition.</text>
</svg>
