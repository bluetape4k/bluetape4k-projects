<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Validation boundary decision map</title><desc id="desc">Decision map separating caller preconditions, internal state invariants, and domain validation.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#527fb3"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="980" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Reject Invalid State at the Owning Boundary</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">The exception type tells the caller which contract was broken.</text>
  <rect x="530" y="195" width="540" height="105" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3" filter="url(#shadow)"/><text x="800" y="238" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#294e76">What kind of rule failed?</text><text x="800" y="272" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">validate before side effects begin</text>
  <path d="M 800 300 V 330 Q 800 350 780 350 H 300 Q 280 350 280 370 V 390" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/><path d="M 800 300 V 390" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/><path d="M 800 350 H 1300 Q 1320 350 1320 370 V 390" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="90" y="405" width="380" height="410" rx="28" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="610" y="405" width="380" height="410" rx="28" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="1130" y="405" width="380" height="410" rx="28" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3"/></g>
  <text x="280" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#356c5b">Caller argument</text><text x="800" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#8c6427">Object state</text><text x="1320" y="462" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#705197">Domain rule</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="280" y="505">require / require* helpers</text><text x="800" y="505">check / state guard</text><text x="1320" y="505">domain-specific validator</text></g>
  <g fill="#fffefb" stroke-width="3"><rect x="135" y="545" width="290" height="105" rx="20" stroke="#82b6a5"/><rect x="655" y="545" width="290" height="105" rx="20" stroke="#c79d58"/><rect x="1175" y="545" width="290" height="105" rx="20" stroke="#9b7bc2"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="24" text-anchor="middle"><text x="280" y="588" fill="#356c5b">IllegalArgumentException</text><text x="800" y="588" fill="#8c6427">IllegalStateException</text><text x="1320" y="588" fill="#705197">Domain exception / result</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f"><text x="135" y="700">Examples:</text><text x="135" y="733">• null / blank / empty</text><text x="135" y="766">• positive capacity</text><text x="655" y="700">Examples:</text><text x="655" y="733">• already closed</text><text x="655" y="766">• transition not allowed</text><text x="1175" y="700">Examples:</text><text x="1175" y="733">• insufficient balance</text><text x="1175" y="766">• booking conflict</text></g>
  <rect x="230" y="850" width="1140" height="55" rx="20" fill="#fff0f1" stroke="#b96f73" stroke-width="3"/><text x="800" y="885" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8e4d52">Never include secrets in messages; never replace a domain error with a generic precondition.</text>
</svg>
