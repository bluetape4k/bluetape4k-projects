<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ShutdownQueue reverse close order</title><desc id="desc">Resources registered database, cache, and server are closed server, cache, and database.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <marker id="arrow-red" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#fda4af" stroke="#fda4af"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="line-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1640" height="1040"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#canvas)"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Create Forward, Close in Reverse</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#b6c4d6">ShutdownQueue is a process-wide LIFO safety net for AutoCloseable resources.</text>
  <text x="210" y="220" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#9ed8ff">Registration</text><text x="1130" y="220" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#fda4af">JVM shutdown drain</text>
  <g filter="url(#shadow)"><rect x="160" y="285" width="330" height="110" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/><rect x="160" y="465" width="330" height="110" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/><rect x="160" y="645" width="330" height="110" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/><rect x="1110" y="285" width="330" height="110" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/><rect x="1110" y="465" width="330" height="110" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/><rect x="1110" y="645" width="330" height="110" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" text-anchor="middle"><text x="325" y="350" fill="#9ed8ff">1. Database</text><text x="325" y="530" fill="#5eead4">2. Cache</text><text x="325" y="710" fill="#f6c96b">3. Server</text><text x="1275" y="350" fill="#f6c96b">1. close Server</text><text x="1275" y="530" fill="#5eead4">2. close Cache</text><text x="1275" y="710" fill="#9ed8ff">3. close Database</text></g>
  <g fill="none" stroke-width="4" stroke-linecap="round" filter="url(#line-glow)"><path d="M 325 395 V 465" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/><path d="M 325 575 V 645" stroke="#9ed8ff" marker-end="url(#arrow-blue)"/><path d="M 1275 395 V 465" stroke="#fda4af" marker-end="url(#arrow-red)"/><path d="M 1275 575 V 645" stroke="#fda4af" marker-end="url(#arrow-red)"/></g>
  <rect x="600" y="300" width="400" height="430" rx="30" fill="#172033" stroke="#8b6bd6" stroke-width="4" filter="url(#shadow)"/><text x="800" y="365" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#c4b5fd">ShutdownQueue</text><text x="800" y="410" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb">ConcurrentLinkedDeque</text><text x="800" y="442" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#b6c4d6">identity de-dup set</text><rect x="655" y="490" width="290" height="105" rx="20" fill="#111827" stroke="#8b6bd6" stroke-width="3"/><text x="800" y="535" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#c4b5fd">pollLast()</text><text x="800" y="568" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#d5dfeb">closeSafe()</text><text x="800" y="650" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">same instance registers once</text><text x="800" y="686" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#b6c4d6">one failure does not stop later cleanup</text>
  <rect x="190" y="825" width="1220" height="65" rx="22" fill="#201923" stroke="#d16f75" stroke-width="3"/><text x="800" y="865" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">Use explicit component close for normal lifecycle; keep ShutdownQueue as the final process-exit guard.</text>
</svg>
