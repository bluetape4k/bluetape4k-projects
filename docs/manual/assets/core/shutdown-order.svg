<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">ShutdownQueue reverse close order</title><desc id="desc">Resources registered database, cache, and server are closed server, cache, and database.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#527fb3"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="980" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Create Forward, Close in Reverse</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">ShutdownQueue is a process-wide LIFO safety net for AutoCloseable resources.</text>
  <text x="210" y="220" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#294e76">Registration</text><text x="1130" y="220" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#8e4d52">JVM shutdown drain</text>
  <g filter="url(#shadow)"><rect x="160" y="285" width="330" height="110" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="160" y="465" width="330" height="110" rx="24" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="160" y="645" width="330" height="110" rx="24" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="1110" y="285" width="330" height="110" rx="24" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="1110" y="465" width="330" height="110" rx="24" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="1110" y="645" width="330" height="110" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" text-anchor="middle"><text x="325" y="350" fill="#294e76">1. Database</text><text x="325" y="530" fill="#356c5b">2. Cache</text><text x="325" y="710" fill="#8c6427">3. Server</text><text x="1275" y="350" fill="#8c6427">1. close Server</text><text x="1275" y="530" fill="#356c5b">2. close Cache</text><text x="1275" y="710" fill="#294e76">3. close Database</text></g>
  <path d="M 325 395 V 450" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/><path d="M 325 575 V 630" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1275 395 V 450" fill="none" stroke="#b96f73" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1275 575 V 630" fill="none" stroke="#b96f73" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="600" y="300" width="400" height="430" rx="30" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3" filter="url(#shadow)"/><text x="800" y="365" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#705197">ShutdownQueue</text><text x="800" y="410" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">ConcurrentLinkedDeque</text><text x="800" y="442" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">identity de-dup set</text><rect x="655" y="490" width="290" height="105" rx="20" fill="#fffefb" stroke="#9b7bc2" stroke-width="3"/><text x="800" y="535" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#705197">pollLast()</text><text x="800" y="568" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f">closeSafe()</text><text x="800" y="650" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8e4d52">same instance registers once</text><text x="800" y="686" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">one failure does not stop later cleanup</text>
  <rect x="190" y="825" width="1220" height="65" rx="22" fill="#fff0f1" stroke="#b96f73" stroke-width="3"/><text x="800" y="865" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8e4d52">Use explicit component close for normal lifecycle; keep ShutdownQueue as the final process-exit guard.</text>
</svg>
