<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ConcurrentReducer capacity model</title><desc id="desc">Submission, bounded queue, semaphore permits, completion stage, and rejection paths.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#527fb3"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b96f73"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="1000" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="928" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Bound Running Work and Waiting Work Separately</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">ConcurrentReducer owns admission capacity, not the lifecycle of external stages.</text>
  <g filter="url(#shadow)"><rect x="90" y="255" width="270" height="150" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="465" y="225" width="310" height="210" rx="24" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="885" y="225" width="310" height="210" rx="24" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="1300" y="255" width="220" height="150" rx="24" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3"/></g>
  <text x="225" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#294e76">add(task)</text><text x="620" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#8c6427">ArrayBlockingQueue</text><text x="1040" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#356c5b">Semaphore</text><text x="1410" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#705197">CompletionStage</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="225" y="350">returns CompletableFuture</text><text x="620" y="320">queuedCount</text><text x="620" y="352">remainingQueueCapacity</text><text x="620" y="384">maxQueueSize</text><text x="1040" y="320">activeCount</text><text x="1040" y="352">remainingActiveCapacity</text><text x="1040" y="384">maxConcurrency</text><text x="1410" y="350">external async work</text></g>
  <path d="M 360 330 H 450" fill="none" stroke="#527fb3" stroke-width="5" marker-end="url(#arrow)"/><path d="M 775 330 H 870" fill="none" stroke="#527fb3" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1195 330 H 1285" fill="none" stroke="#527fb3" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="160" y="525" width="570" height="150" rx="24" fill="#fff0f1" stroke="#b96f73" stroke-width="3"/><rect x="870" y="525" width="570" height="150" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/>
  <text x="445" y="575" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#8e4d52">Admission failure</text><text x="1155" y="575" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#294e76">Completion path</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="445" y="615">full: CapacityReachedException</text><text x="445" y="647">closed: RejectedExecutionException</text><text x="1155" y="615">release permit, complete promise</text><text x="1155" y="647">schedule pump on owned executor</text></g>
  <path d="M 620 435 V 495 Q 620 510 605 510 H 465 Q 445 510 445 530" fill="none" stroke="#b96f73" stroke-width="4" marker-end="url(#arrow-red)"/><path d="M 1410 405 V 480 Q 1410 495 1395 495 H 1175 Q 1155 495 1155 530" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="170" y="750" width="1260" height="150" rx="25" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><text x="800" y="793" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#356c5b">close()</text><text x="800" y="833" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#53697f">reject new add | cancel queued promises | shutdown pump executor</text><text x="800" y="866" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8e4d52">Already-running external CompletionStage work is not forcibly cancelled.</text>
</svg>
