<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">ConcurrentReducer capacity model</title><desc id="desc">Submission, bounded queue, semaphore permits, completion stage, and rejection paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#9ed8ff" stroke="#9ed8ff"/></marker>
    <marker id="arrow-red" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#fda4af" stroke="#fda4af"/></marker>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
    <filter id="line-glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1640" height="1040"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#67e8f9" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#canvas)"/><rect x="42" y="36" width="1516" height="928" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Bound Running Work and Waiting Work Separately</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#b6c4d6">ConcurrentReducer owns admission capacity, not the lifecycle of external stages.</text>
  <g filter="url(#shadow)"><rect x="90" y="255" width="270" height="150" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/><rect x="465" y="225" width="310" height="210" rx="24" fill="#172033" stroke="#c58b2a" stroke-width="4"/><rect x="885" y="225" width="310" height="210" rx="24" fill="#172033" stroke="#159c92" stroke-width="4"/><rect x="1270" y="255" width="250" height="150" rx="24" fill="#172033" stroke="#8b6bd6" stroke-width="4"/></g>
  <text x="225" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#9ed8ff">add(task)</text><text x="620" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#f6c96b">ArrayBlockingQueue</text><text x="1040" y="280" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#5eead4">Semaphore</text><text x="1395" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="28" fill="#c4b5fd">CompletionStage</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb" text-anchor="middle"><text x="225" y="350">returns CompletableFuture</text><text x="620" y="320">queuedCount</text><text x="620" y="352">remainingQueueCapacity</text><text x="620" y="384">maxQueueSize</text><text x="1040" y="320">activeCount</text><text x="1040" y="352">remainingActiveCapacity</text><text x="1040" y="384">maxConcurrency</text><text x="1395" y="350">external async work</text></g>
  <g fill="none" stroke="#9ed8ff" stroke-width="5" stroke-linecap="round" filter="url(#line-glow)"><path d="M 360 330 H 465" marker-end="url(#arrow)"/><path d="M 775 330 H 885" marker-end="url(#arrow)"/><path d="M 1195 330 H 1270" marker-end="url(#arrow)"/></g>
  <rect x="160" y="525" width="570" height="150" rx="24" fill="#201923" stroke="#d16f75" stroke-width="4"/><rect x="870" y="525" width="570" height="150" rx="24" fill="#172033" stroke="#4c8cc8" stroke-width="4"/>
  <text x="445" y="575" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#fda4af">Admission failure</text><text x="1155" y="575" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#9ed8ff">Completion path</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb" text-anchor="middle"><text x="445" y="615">full: CapacityReachedException</text><text x="445" y="647">closed: RejectedExecutionException</text><text x="1155" y="615">release permit, complete promise</text><text x="1155" y="647">schedule pump on owned executor</text></g>
  <path d="M 620 435 V 465 Q 620 485 600 485 H 465 Q 445 485 445 505 V 525" fill="none" stroke="#fda4af" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M 1395 405 V 475 Q 1395 495 1375 495 H 1175 Q 1155 495 1155 515 V 525" fill="none" stroke="#9ed8ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" filter="url(#line-glow)"/>
  <rect x="170" y="750" width="1260" height="150" rx="25" fill="#152624" stroke="#159c92" stroke-width="4"/><text x="800" y="793" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#5eead4">close()</text><text x="800" y="833" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#d5dfeb">reject new add | cancel queued promises | shutdown pump executor</text><text x="800" y="866" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#fda4af">Already-running external CompletionStage work is not forcibly cancelled.</text>
</svg>
