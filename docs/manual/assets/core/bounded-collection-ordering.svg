<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">BoundedStack and RingBuffer ordering</title><desc id="desc">Capacity-three comparison after adding one, two, three, and four.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111827"/><stop offset="58%" stop-color="#182331"/><stop offset="100%" stop-color="#223047"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1f2937"/><stop offset="100%" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1600" height="980" fill="url(#canvas)"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="url(#panel)" stroke="#536377" stroke-width="4" filter="url(#shadow)"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#f8fafc">Same Capacity, Different Read Order</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#b6c4d6">Both evict the oldest value; iteration semantics choose the type.</text>
  <rect x="455" y="174" width="690" height="56" rx="20" fill="#172033" stroke="#536377" stroke-width="2"/><text x="800" y="210" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#d5dfeb">capacity = 3   |   writes = 1, 2, 3, 4   |   value 1 is evicted</text>
  <g filter="url(#shadow)"><rect x="100" y="250" width="650" height="550" rx="30" fill="#172033" stroke="#4c8cc8" stroke-width="4"/><rect x="850" y="250" width="650" height="550" rx="30" fill="#172033" stroke="#159c92" stroke-width="4"/></g>
  <text x="425" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#9ed8ff">BoundedStack</text><text x="1175" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#5eead4">RingBuffer</text>
  <text x="425" y="348" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#b6c4d6">index 0 = newest / top</text><text x="1175" y="348" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#b6c4d6">index 0 = oldest / read head</text>
  <g fill="#111827" stroke-width="4"><rect x="255" y="410" width="340" height="95" rx="20" stroke="#4c8cc8"/><rect x="255" y="525" width="340" height="95" rx="20" stroke="#4c8cc8"/><rect x="255" y="640" width="340" height="95" rx="20" stroke="#4c8cc8"/><rect x="1005" y="410" width="340" height="95" rx="20" stroke="#159c92"/><rect x="1005" y="525" width="340" height="95" rx="20" stroke="#159c92"/><rect x="1005" y="640" width="340" height="95" rx="20" stroke="#159c92"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" text-anchor="middle"><text x="425" y="470" fill="#9ed8ff">4  newest</text><text x="425" y="585" fill="#9ed8ff">3</text><text x="425" y="700" fill="#9ed8ff">2  oldest</text><text x="1175" y="470" fill="#5eead4">2  oldest</text><text x="1175" y="585" fill="#5eead4">3</text><text x="1175" y="700" fill="#5eead4">4  newest</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#d5dfeb" text-anchor="middle"><text x="425" y="770">toList() = [4, 3, 2]</text><text x="1175" y="770">toList() = [2, 3, 4]</text></g>
  <rect x="170" y="840" width="1260" height="65" rx="22" fill="#211d18" stroke="#c58b2a" stroke-width="3"/><text x="800" y="880" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#f6c96b">Thread-safe via ReentrantLock; bounded memory does not provide backpressure or delivery guarantees.</text>
</svg>
