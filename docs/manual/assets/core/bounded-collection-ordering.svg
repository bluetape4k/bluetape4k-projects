<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">BoundedStack and RingBuffer ordering</title><desc id="desc">Capacity-three comparison after adding one, two, three, and four.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="980" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Same Capacity, Different Read Order</text><text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">Both evict the oldest value; iteration semantics choose the type.</text>
  <text x="800" y="205" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="19" fill="#53697f">capacity = 3   |   writes = 1, 2, 3, 4   |   value 1 is evicted</text>
  <g filter="url(#shadow)"><rect x="100" y="250" width="650" height="550" rx="30" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="850" y="250" width="650" height="550" rx="30" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/></g>
  <text x="425" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#294e76">BoundedStack</text><text x="1175" y="310" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" fill="#356c5b">RingBuffer</text>
  <text x="425" y="348" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#53697f">index 0 = newest / top</text><text x="1175" y="348" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#53697f">index 0 = oldest / read head</text>
  <g fill="#fffefb" stroke-width="4"><rect x="255" y="410" width="340" height="95" rx="20" stroke="#6e96c7"/><rect x="255" y="525" width="340" height="95" rx="20" stroke="#6e96c7"/><rect x="255" y="640" width="340" height="95" rx="20" stroke="#6e96c7"/><rect x="1005" y="410" width="340" height="95" rx="20" stroke="#82b6a5"/><rect x="1005" y="525" width="340" height="95" rx="20" stroke="#82b6a5"/><rect x="1005" y="640" width="340" height="95" rx="20" stroke="#82b6a5"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="34" text-anchor="middle"><text x="425" y="470" fill="#294e76">4  newest</text><text x="425" y="585" fill="#294e76">3</text><text x="425" y="700" fill="#294e76">2  oldest</text><text x="1175" y="470" fill="#356c5b">2  oldest</text><text x="1175" y="585" fill="#356c5b">3</text><text x="1175" y="700" fill="#356c5b">4  newest</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="425" y="770">toList() = [4, 3, 2]</text><text x="1175" y="770">toList() = [2, 3, 4]</text></g>
  <rect x="170" y="840" width="1260" height="65" rx="22" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><text x="800" y="880" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8c6427">Thread-safe via ReentrantLock; bounded memory does not provide backpressure or delivery guarantees.</text>
</svg>
