<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Scoped MDC lifecycle</title>
  <desc id="desc">Nested MDC values are installed for one block and then restored or removed even after an exception.</desc>
  <defs><marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#527fb3"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="980" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="908" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="105" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="52" fill="#263d56">MDC Belongs to the Smallest Operation</text>
  <text x="800" y="148" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="20" fill="#53697f">Capture previous values before install; restore them in finally.</text>
  <g filter="url(#shadow)"><rect x="90" y="240" width="390" height="390" rx="28" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="605" y="240" width="390" height="390" rx="28" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="1120" y="240" width="390" height="390" rx="28" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/></g>
  <text x="285" y="300" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#294e76">1. Capture Outer</text>
  <text x="800" y="300" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#8c6427">2. Run Inner Block</text>
  <text x="1315" y="300" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#356c5b">3. Restore in finally</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="20" fill="#53697f"><text x="145" y="365">traceId = outer</text><text x="145" y="405">spanId  = absent</text><text x="145" y="475">save each previous value</text><text x="145" y="515">before any put</text><text x="660" y="365">traceId = inner</text><text x="660" y="405">spanId  = span-42</text><text x="660" y="475">success or exception</text><text x="660" y="515">uses the same cleanup</text><text x="1175" y="365">traceId = outer</text><text x="1175" y="405">spanId  = removed</text><text x="1175" y="475">restorePrevious=false:</text><text x="1175" y="515">remove applied keys</text></g>
  <path d="M 480 435 H 605" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/><path d="M 995 435 H 1120" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="210" y="700" width="1180" height="130" rx="28" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3"/>
  <text x="800" y="750" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#705197">Coroutine boundary?</text>
  <text x="800" y="792" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#53697f">Wrap the operation with MDCContext so the captured snapshot crosses dispatcher switches.</text>
  <text x="800" y="900" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8e4d52">Never store secrets or unbounded payloads. Configuration must emit the keys you install.</text>
</svg>
