<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Structured concurrency policy map</title><desc id="desc">Comparison of fail-fast, first-success, and supervised task scopes.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="1040" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="968" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Failure Policy Is Part of the Result Type</text>
  <text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">Atomic result, one successful result, or partial results: choose exactly one.</text>
  <g filter="url(#shadow)"><rect x="90" y="202" width="440" height="690" rx="28" fill="#fff0f1" stroke="#b96f73" stroke-width="3"/><rect x="580" y="202" width="440" height="690" rx="28" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="1070" y="202" width="440" height="690" rx="28" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3"/></g>
  <text x="310" y="258" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#8e4d52">taskScope / failFast</text>
  <text x="800" y="258" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#356c5b">firstSuccessTaskScope</text>
  <text x="1290" y="258" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#705197">supervisedTaskScope</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="310" y="300">all branches form one result</text><text x="800" y="300">one successful branch is enough</text><text x="1290" y="300">branches remain independent</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="19" text-anchor="middle"><circle cx="220" cy="390" r="34" fill="#fffefb" stroke="#82b6a5" stroke-width="4"/><text x="220" y="397" fill="#356c5b">A ok</text><circle cx="310" cy="390" r="34" fill="#fffefb" stroke="#b96f73" stroke-width="4"/><text x="310" y="397" fill="#8e4d52">B x</text><circle cx="400" cy="390" r="34" fill="#fffefb" stroke="#90a1b3" stroke-width="4"/><text x="400" y="397" fill="#53697f">C !</text><circle cx="710" cy="390" r="34" fill="#fffefb" stroke="#b96f73" stroke-width="4"/><text x="710" y="397" fill="#8e4d52">A x</text><circle cx="800" cy="390" r="34" fill="#fffefb" stroke="#82b6a5" stroke-width="4"/><text x="800" y="397" fill="#356c5b">B ok</text><circle cx="890" cy="390" r="34" fill="#fffefb" stroke="#90a1b3" stroke-width="4"/><text x="890" y="397" fill="#53697f">C !</text><circle cx="1200" cy="390" r="34" fill="#fffefb" stroke="#82b6a5" stroke-width="4"/><text x="1200" y="397" fill="#356c5b">A ok</text><circle cx="1290" cy="390" r="34" fill="#fffefb" stroke="#b96f73" stroke-width="4"/><text x="1290" y="397" fill="#8e4d52">B x</text><circle cx="1380" cy="390" r="34" fill="#fffefb" stroke="#82b6a5" stroke-width="4"/><text x="1380" y="397" fill="#356c5b">C ok</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" text-anchor="middle"><text x="310" y="465" fill="#8e4d52">B failure cancels unfinished C</text><text x="800" y="465" fill="#356c5b">B success cancels unfinished C</text><text x="1290" y="465" fill="#705197">B failure does not stop A or C</text></g>
  <g fill="#fffefb" stroke-width="3"><rect x="135" y="510" width="350" height="125" rx="20" stroke="#b96f73"/><rect x="625" y="510" width="350" height="125" rx="20" stroke="#82b6a5"/><rect x="1115" y="510" width="350" height="125" rx="20" stroke="#9b7bc2"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" text-anchor="middle"><text x="310" y="555" fill="#8e4d52">Returns or throws once</text><text x="800" y="555" fill="#356c5b">Returns the winner</text><text x="1290" y="555" fill="#705197">Returns Result per branch</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f" text-anchor="middle"><text x="310" y="595">join().throwIfFailed()</text><text x="800" y="595">join().result(mapper)</text><text x="1290" y="595">results() / successfulResults()</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f"><text x="135" y="700">Use for:</text><text x="135" y="735">• atomic dashboard composition</text><text x="135" y="770">• all required dependencies</text><text x="625" y="700">Use for:</text><text x="625" y="735">• replica/provider fallback</text><text x="625" y="770">• first valid answer</text><text x="1115" y="700">Use for:</text><text x="1115" y="735">• independent widgets</text><text x="1115" y="770">• partial result reporting</text></g>
  <text x="310" y="842" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#8e4d52">Do not use when partial data is valid.</text><text x="800" y="842" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#356c5b">All failed must map to a domain error.</text><text x="1290" y="842" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#705197">Do not let supervision hide failures.</text>
  <rect x="230" y="925" width="1140" height="55" rx="20" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><text x="800" y="960" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#294e76">All three execute on the virtual-thread bridge and close child work at the scope boundary.</text>
</svg>
