<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Ordered asynchronous flow versus parallel map</title>
  <desc id="desc">Two execution lanes show concurrent work with ordered emission and bounded parallel work with completion-order emission.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#527fb3"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="1040" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="968" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Concurrency Does Not Define Output Order</text>
  <text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">Choose the emission contract before choosing parallelism.</text>

  <rect x="95" y="195" width="1410" height="330" rx="28" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3" filter="url(#shadow)"/>
  <text x="135" y="246" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#294e76">flow.async — work overlaps, emit waits in input order</text>
  <text x="135" y="280" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">Input</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="20" text-anchor="middle"><circle cx="260" cy="320" r="31" fill="#fffefb" stroke="#6e96c7" stroke-width="3"/><text x="260" y="327" fill="#294e76">A</text><circle cx="460" cy="320" r="31" fill="#fffefb" stroke="#6e96c7" stroke-width="3"/><text x="460" y="327" fill="#294e76">B</text><circle cx="660" cy="320" r="31" fill="#fffefb" stroke="#6e96c7" stroke-width="3"/><text x="660" y="327" fill="#294e76">C</text></g>
  <g stroke-width="22" stroke-linecap="round"><path d="M 260 385 H 720" stroke="#c79d58"/><path d="M 460 425 H 770" stroke="#82b6a5"/><path d="M 660 465 H 850" stroke="#9b7bc2"/></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f"><text x="260" y="377">slow</text><text x="460" y="417">medium</text><text x="660" y="457">fast</text></g>
  <path d="M 900 410 H 1050" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1130" y="350" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">Output</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="20" text-anchor="middle"><circle cx="1130" cy="410" r="31" fill="#fffefb" stroke="#c79d58" stroke-width="3"/><text x="1130" y="417" fill="#8c6427">A</text><circle cx="1230" cy="410" r="31" fill="#fffefb" stroke="#82b6a5" stroke-width="3"/><text x="1230" y="417" fill="#356c5b">B</text><circle cx="1330" cy="410" r="31" fill="#fffefb" stroke="#9b7bc2" stroke-width="3"/><text x="1330" y="417" fill="#705197">C</text></g>
  <text x="1230" y="470" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#294e76">A - B - C; A causes head-of-line waiting</text>

  <rect x="95" y="565" width="1410" height="330" rx="28" fill="#eef8f4" stroke="#82b6a5" stroke-width="3" filter="url(#shadow)"/>
  <text x="135" y="616" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="31" fill="#356c5b">mapParallel(n) — bounded workers, emit on completion</text>
  <text x="135" y="650" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f">Same input, parallelism = 3</text>
  <g stroke-width="22" stroke-linecap="round"><path d="M 260 735 H 720" stroke="#c79d58"/><path d="M 460 775 H 770" stroke="#82b6a5"/><path d="M 660 815 H 850" stroke="#9b7bc2"/></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f"><text x="260" y="727">A / slow</text><text x="460" y="767">B / medium</text><text x="660" y="807">C / fast</text></g>
  <path d="M 900 775 H 1050" fill="none" stroke="#527fb3" stroke-width="4" marker-end="url(#arrow)"/>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="20" text-anchor="middle"><circle cx="1130" cy="775" r="31" fill="#fffefb" stroke="#9b7bc2" stroke-width="3"/><text x="1130" y="782" fill="#705197">C</text><circle cx="1230" cy="775" r="31" fill="#fffefb" stroke="#82b6a5" stroke-width="3"/><text x="1230" y="782" fill="#356c5b">B</text><circle cx="1330" cy="775" r="31" fill="#fffefb" stroke="#c79d58" stroke-width="3"/><text x="1330" y="782" fill="#8c6427">A</text></g>
  <text x="1230" y="835" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#356c5b">C - B - A; capacity is explicit, order is not</text>

  <rect x="245" y="925" width="1110" height="55" rx="20" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/>
  <text x="800" y="960" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#8c6427">parallelism &lt;= 1 takes the sequential map path; size it from downstream capacity.</text>
</svg>
