<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Subject delivery contract map</title><desc id="desc">Decision table for Publish, Behavior, Replay, Multicast, and UnicastWork subjects.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <rect width="1600" height="1100" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="1028" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">A Subject Is a Delivery Contract</text>
  <text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">Choose what a late collector receives and who consumes each item.</text>
  <rect x="90" y="190" width="1420" height="690" rx="28" fill="#f8fafc" stroke="#90a1b3" stroke-width="3" filter="url(#shadow)"/>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle">
    <text x="275" y="235">TYPE</text><text x="610" y="235">LATE COLLECTOR</text><text x="955" y="235">DELIVERY</text><text x="1310" y="235">DEFAULT USE</text>
  </g>
  <g stroke="#c7d1dc" stroke-width="2"><path d="M 110 260 H 1490"/><path d="M 110 380 H 1490"/><path d="M 110 500 H 1490"/><path d="M 110 620 H 1490"/><path d="M 110 740 H 1490"/><path d="M 450 210 V 850"/><path d="M 790 210 V 850"/><path d="M 1120 210 V 850"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" text-anchor="middle"><text x="275" y="330" fill="#294e76">Publish</text><text x="275" y="450" fill="#356c5b">Behavior</text><text x="275" y="570" fill="#8c6427">Replay</text><text x="275" y="690" fill="#705197">Multicast</text><text x="275" y="810" fill="#8e4d52">UnicastWork</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle">
    <text x="620" y="315">future events only</text><text x="620" y="435">latest state first</text><text x="620" y="555">bounded history first</text><text x="620" y="675">no implicit replay</text><text x="620" y="795">queued work</text>
    <text x="955" y="315">same event to active collectors</text><text x="955" y="435">current value + updates</text><text x="955" y="555">history + updates</text><text x="955" y="675">coordinated fan-out</text><text x="955" y="795">one item to one collector</text>
    <text x="1310" y="315">ephemeral callback</text><text x="1310" y="435">observable state</text><text x="1310" y="555">late subscriber catch-up</text><text x="1310" y="675">fan-out boundary</text><text x="1310" y="795">work distribution</text>
  </g>
  <g fill="#fffefb" stroke-width="3"><circle cx="510" cy="330" r="13" stroke="#6e96c7"/><circle cx="555" cy="330" r="13" stroke="#6e96c7"/><circle cx="600" cy="330" r="13" stroke="#6e96c7"/><circle cx="555" cy="450" r="13" stroke="#82b6a5"/><circle cx="600" cy="450" r="13" stroke="#82b6a5"/><circle cx="510" cy="570" r="13" stroke="#c79d58"/><circle cx="555" cy="570" r="13" stroke="#c79d58"/><circle cx="600" cy="570" r="13" stroke="#c79d58"/><circle cx="510" cy="690" r="13" stroke="#9b7bc2"/><circle cx="555" cy="690" r="13" stroke="#9b7bc2"/><circle cx="600" cy="810" r="13" stroke="#b96f73"/></g>
  <rect x="145" y="910" width="620" height="105" rx="22" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/>
  <rect x="835" y="910" width="620" height="105" rx="22" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/>
  <text x="455" y="950" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#294e76">Startup rule</text>
  <text x="455" y="982" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f">awaitCollector() when the first event must not race registration.</text>
  <text x="1145" y="950" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" fill="#8c6427">Terminal rule</text>
  <text x="1145" y="982" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f">complete() or emitError(); cancellation is never swallowed.</text>
</svg>
