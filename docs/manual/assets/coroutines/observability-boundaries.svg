<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Coroutine observability boundaries</title><desc id="desc">Operational map from intake through owned scope and downstream capacity to metrics and deterministic shutdown.</desc>
  <defs><marker id="arrow" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#527fb3"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#16324f" flood-opacity="0.12"/></filter></defs>
  <style>
    [fill="#f5f8fc"] { fill: #111827; } [fill="#fffefb"], [fill="#f8fafc"] { fill: #172033; }
    [fill="#e8f1fc"] { fill: #17243b; } [fill="#eef8f4"] { fill: #132c2c; } [fill="#fff6e8"] { fill: #302718; } [fill="#f4edfc"] { fill: #241d35; } [fill="#fff0f1"] { fill: #301c25; }
    [fill="#263d56"] { fill: #f8fafc; } [fill="#53697f"], [fill="#506a84"], [fill="#55766b"], [fill="#60758a"], [fill="#6d7f91"], [fill="#6d5b85"], [fill="#90a1b3"] { fill: #b6c4d6; }
    [fill="#294e76"], [fill="#405b75"], [fill="#527fb3"] { fill: #9ed8ff; } [fill="#356c5b"] { fill: #5eead4; } [fill="#8c6427"] { fill: #f6c96b; }
    [fill="#705197"] { fill: #c4b5fd; } [fill="#8e4d52"] { fill: #fda4af; } [fill="#536e2f"] { fill: #bef264; }
    [stroke="#6f8daa"], [stroke="#90a1b3"], [stroke="#c7d1dc"] { stroke: #536377; } [stroke="#6e96c7"], [stroke="#527fb3"] { stroke: #4c8cc8; }
    [stroke="#82b6a5"] { stroke: #159c92; } [stroke="#c79d58"], [stroke="#c39a55"] { stroke: #c58b2a; } [stroke="#9b7bc2"], [stroke="#9677bd"] { stroke: #8b6bd6; }
    [stroke="#b96f73"] { stroke: #d16f75; } [stroke="#8da95b"], [stroke="#82a45c"] { stroke: #7fa34b; }
  </style>
  <rect width="1600" height="1080" fill="#f5f8fc"/><rect x="42" y="36" width="1516" height="1008" rx="34" fill="#fffefb" stroke="#6f8daa" stroke-width="4"/>
  <text x="800" y="104" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="50" fill="#263d56">Observe the Boundary, Not Just Coroutine Count</text>
  <text x="800" y="145" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="21" fill="#53697f">Demand, pressure, service time, cancellation, and ownership explain the system together.</text>
  <g filter="url(#shadow)"><rect x="95" y="215" width="300" height="170" rx="24" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="495" y="215" width="610" height="170" rx="24" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="1205" y="215" width="300" height="170" rx="24" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/></g>
  <text x="245" y="268" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#294e76">Intake</text><text x="800" y="268" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#356c5b">Owned Coroutine Boundary</text><text x="1355" y="268" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="29" fill="#8c6427">Downstream</text>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="17" fill="#53697f" text-anchor="middle"><text x="245" y="310">request / event rate</text><text x="245" y="342">readiness gate</text><text x="800" y="310">parent job | children | queue / buffer</text><text x="800" y="342">timeout | cancellation | dispatcher</text><text x="1355" y="310">connection / thread limit</text><text x="1355" y="342">remote service latency</text></g>
  <path d="M 395 300 H 480" fill="none" stroke="#527fb3" stroke-width="5" marker-end="url(#arrow)"/><path d="M 1105 300 H 1190" fill="none" stroke="#527fb3" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="120" y="465" width="1360" height="330" rx="28" fill="#f8fafc" stroke="#90a1b3" stroke-width="3"/>
  <text x="800" y="515" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="30" fill="#263d56">Minimum signal set</text>
  <g filter="url(#shadow)"><rect x="165" y="555" width="225" height="170" rx="22" fill="#e8f1fc" stroke="#6e96c7" stroke-width="3"/><rect x="425" y="555" width="225" height="170" rx="22" fill="#fff6e8" stroke="#c79d58" stroke-width="3"/><rect x="685" y="555" width="225" height="170" rx="22" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/><rect x="945" y="555" width="225" height="170" rx="22" fill="#f4edfc" stroke="#9b7bc2" stroke-width="3"/><rect x="1205" y="555" width="225" height="170" rx="22" fill="#fff0f1" stroke="#b96f73" stroke-width="3"/></g>
  <g font-family="Architects Daughter, Comic Sans MS, cursive" font-size="25" text-anchor="middle"><text x="278" y="605" fill="#294e76">In-flight</text><text x="538" y="605" fill="#8c6427">Queue</text><text x="798" y="605" fill="#356c5b">Latency</text><text x="1058" y="605" fill="#705197">Cancellation</text><text x="1318" y="605" fill="#8e4d52">Shutdown</text></g>
  <g font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#53697f" text-anchor="middle"><text x="278" y="645">active jobs</text><text x="278" y="677">parallel workers</text><text x="538" y="645">depth / capacity</text><text x="538" y="677">time waiting</text><text x="798" y="645">P50 / P95 / P99</text><text x="798" y="677">item + request</text><text x="1058" y="645">reason / owner</text><text x="1058" y="677">timeout separated</text><text x="1318" y="645">drain duration</text><text x="1318" y="677">jobs / threads left</text></g>

  <rect x="145" y="845" width="1310" height="135" rx="24" fill="#eef8f4" stroke="#82b6a5" stroke-width="3"/>
  <text x="800" y="887" text-anchor="middle" font-family="Architects Daughter, Comic Sans MS, cursive" font-size="27" fill="#356c5b">Deterministic shutdown</text>
  <text x="800" y="925" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="18" fill="#53697f">1. readiness off  |  2. stop intake  |  3. drain bounded work  |  4. close channel / scope / dispatcher</text>
  <text x="800" y="955" text-anchor="middle" font-family="Comic Mono, ui-monospace, monospace" font-size="16" fill="#6d7f91">CancellationException is a control signal; record it without turning normal caller cancellation into an error.</text>
</svg>
