<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="760" viewBox="0 0 1480 760" role="img" aria-label="Spring Boot Cassandra data access layer">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect width="1480" height="760" fill="#ffffff"/>
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">Spring Boot Cassandra Data Access Layer</text>
  <text x="72" y="92" font-size="15" fill="#64748b">Application code moves left to right through bluetape4k coroutine adapters, Spring Data Cassandra operations, driver calls, and Cassandra.</text>

  <g class="layer" data-layer="APPLICATION CONTRACT">
    <rect x="60" y="130" width="306" height="512" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="78" y="156" font-size="14" font-weight="700" fill="#2563eb">APPLICATION CONTRACT</text>
    <text x="78" y="177" font-size="12.3" fill="#6b7280">Call sites and entities choose entrypoints.</text>
  </g>

  <g class="layer" data-layer="BLUETAPE4K ADAPTERS">
    <rect x="408" y="130" width="306" height="512" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="426" y="156" font-size="14" font-weight="700" fill="#16a34a">BLUETAPE4K ADAPTERS</text>
    <text x="426" y="177" font-size="12.3" fill="#6b7280">Coroutine bridges and DSL helpers.</text>
  </g>

  <g class="layer" data-layer="SPRING DATA CASSANDRA">
    <rect x="756" y="130" width="306" height="512" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="774" y="156" font-size="14" font-weight="700" fill="#ea580c">SPRING DATA CASSANDRA</text>
    <text x="774" y="177" font-size="12.3" fill="#6b7280">Operations, CQL, mapping metadata.</text>
  </g>

  <g class="layer" data-layer="DRIVER AND CASSANDRA">
    <rect x="1114" y="130" width="306" height="512" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="1132" y="156" font-size="14" font-weight="700" fill="#64748b">DRIVER AND CASSANDRA</text>
    <text x="1132" y="177" font-size="12.3" fill="#6b7280">Session, async result, and backend.</text>
  </g>

  <g class="card" data-card="Service / Repository">
    <rect x="84" y="220" width="258" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="84" y="220" width="10" height="86" rx="5" fill="#2563eb" opacity="0.9"/>
    <text x="110" y="253" font-size="17" font-weight="700" fill="#111827">Service / Repository</text>
    <text x="110" y="280" font-size="12.6" fill="#475569">suspend calls</text>
<text x="110" y="298" font-size="12.6" fill="#475569">Flow collection</text>
  </g>

  <g class="card" data-card="Batch / Select Use">
    <rect x="84" y="362" width="258" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="84" y="362" width="10" height="86" rx="5" fill="#7c3aed" opacity="0.9"/>
    <text x="110" y="395" font-size="17" font-weight="700" fill="#111827">Batch / Select Use</text>
    <text x="110" y="422" font-size="12.6" fill="#475569">Flow batch calls</text>
<text x="110" y="440" font-size="12.6" fill="#475569">select helpers</text>
  </g>

  <g class="card" data-card="Schema Bootstrap">
    <rect x="84" y="504" width="258" height="86" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
    <rect x="84" y="504" width="10" height="86" rx="5" fill="#db2777" opacity="0.9"/>
    <text x="110" y="537" font-size="17" font-weight="700" fill="#111827">Schema Bootstrap</text>
    <text x="110" y="564" font-size="12.6" fill="#475569">createTableAndTypes&lt;T&gt;()</text>
<text x="110" y="582" font-size="12.6" fill="#475569">truncate&lt;T&gt;()</text>
  </g>

  <g class="card" data-card="Coroutine Extensions">
    <rect x="432" y="211" width="258" height="104" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="432" y="211" width="10" height="104" rx="5" fill="#16a34a" opacity="0.9"/>
    <text x="458" y="244" font-size="17" font-weight="700" fill="#111827">Coroutine Extensions</text>
    <text x="458" y="271" font-size="12.6" fill="#475569">ReactiveSession bridge</text>
<text x="458" y="289" font-size="12.6" fill="#475569">operations *Suspending</text>
<text x="458" y="307" font-size="12.6" fill="#475569">awaitSingle / asFlow</text>
  </g>

  <g class="card" data-card="Batch / Select Helpers">
    <rect x="432" y="357" width="258" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="432" y="357" width="10" height="96" rx="5" fill="#7c3aed" opacity="0.9"/>
    <text x="458" y="390" font-size="17" font-weight="700" fill="#111827">Batch / Select Helpers</text>
    <text x="458" y="417" font-size="12.6" fill="#475569">insert/update/delete Flow</text>
<text x="458" y="435" font-size="12.6" fill="#475569">count/exists/first/one/all</text>
  </g>

  <g class="card" data-card="Options / Criteria DSL">
    <rect x="432" y="495" width="258" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <rect x="432" y="495" width="10" height="104" rx="5" fill="#ea580c" opacity="0.9"/>
    <text x="458" y="528" font-size="17" font-weight="700" fill="#111827">Options / Criteria DSL</text>
    <text x="458" y="555" font-size="12.6" fill="#475569">query/write option builders</text>
<text x="458" y="573" font-size="12.6" fill="#475569">addWriteOptions(...)</text>
<text x="458" y="591" font-size="12.6" fill="#475569">Criteria.where(...) eq</text>
  </g>

  <g class="card" data-card="Operations APIs">
    <rect x="780" y="211" width="258" height="104" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="780" y="211" width="10" height="104" rx="5" fill="#16a34a" opacity="0.9"/>
    <text x="806" y="244" font-size="17" font-weight="700" fill="#111827">Operations APIs</text>
    <text x="806" y="271" font-size="12.6" fill="#475569">ReactiveCassandraOperations</text>
<text x="806" y="289" font-size="12.6" fill="#475569">AsyncCassandraOperations</text>
<text x="806" y="307" font-size="12.6" fill="#475569">CRUD/select/count/exists</text>
  </g>

  <g class="card" data-card="Batch Operations">
    <rect x="780" y="357" width="258" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <rect x="780" y="357" width="10" height="96" rx="5" fill="#7c3aed" opacity="0.9"/>
    <text x="806" y="390" font-size="17" font-weight="700" fill="#111827">Batch Operations</text>
    <text x="806" y="417" font-size="12.6" fill="#475569">Reactive batch contract</text>
<text x="806" y="435" font-size="12.6" fill="#475569">Spring template batch path</text>
  </g>

  <g class="card" data-card="CQL / Mapping">
    <rect x="780" y="495" width="258" height="104" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <rect x="780" y="495" width="10" height="104" rx="5" fill="#ea580c" opacity="0.9"/>
    <text x="806" y="528" font-size="17" font-weight="700" fill="#111827">CQL / Mapping</text>
    <text x="806" y="555" font-size="12.6" fill="#475569">QueryOptions, WriteOptions</text>
<text x="806" y="573" font-size="12.6" fill="#475569">SchemaFactory</text>
<text x="806" y="591" font-size="12.6" fill="#475569">mappingContext</text>
  </g>

  <g class="card" data-card="ReactiveSession">
    <rect x="1138" y="220" width="258" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="1138" y="220" width="10" height="86" rx="5" fill="#2563eb" opacity="0.9"/>
    <text x="1164" y="253" font-size="17" font-weight="700" fill="#111827">ReactiveSession</text>
    <text x="1164" y="280" font-size="12.6" fill="#475569">execute(statement)</text>
<text x="1164" y="298" font-size="12.6" fill="#475569">prepare(statement)</text>
  </g>

  <g class="card" data-card="Async Driver Path">
    <rect x="1138" y="362" width="258" height="86" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="1138" y="362" width="10" height="86" rx="5" fill="#2563eb" opacity="0.9"/>
    <text x="1164" y="395" font-size="17" font-weight="700" fill="#111827">Async Driver Path</text>
    <text x="1164" y="422" font-size="12.6" fill="#475569">CompletableFuture</text>
<text x="1164" y="440" font-size="12.6" fill="#475569">AsyncResultSet</text>
  </g>

  <g class="card" data-card="Apache Cassandra">
    <rect x="1138" y="504" width="258" height="86" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <image data-bluetape4k-icon="testcontainers/storage/apache-cassandra.svg" x="1164" y="520" width="38" height="38" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <rect x="1138" y="504" width="10" height="86" rx="5" fill="#64748b" opacity="0.9"/>
    <text x="1216" y="537" font-size="17" font-weight="700" fill="#111827">Apache Cassandra</text>
    <text x="1216" y="564" font-size="12.6" fill="#475569">CQL execution</text>
<text x="1216" y="582" font-size="12.6" fill="#475569">metadata / keyspace</text>
  </g>
  <path class="edge" d="M342 263 L432 263" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M342 405 L432 405" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polygon points="420,411 432,405 420,399" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="edge" d="M342 547 L432 547" fill="none" stroke="#db2777" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polygon points="420,553 432,547 420,541" fill="#db2777" stroke="#db2777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="edge" d="M690 263 L780 263" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M690 405 L780 405" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M690 547 L780 547" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M1038 263 L1138 263" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 1038 263 L 1072 263 Q 1086 263 1086 277 L 1086 391 Q 1086 405 1100 405 L 1138 405" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5"/>
<polygon points="1126,411 1138,405 1126,399" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="edge" d="M1038 547 L1138 547" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <g class="legend" transform="translate(72 714)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arrow-green)"/><text x="58" y="5" font-size="13" fill="#475569">main coroutine bridge</text>
    <line x1="280" y1="0" x2="322" y2="0" stroke="#7c3aed" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><text x="338" y="5" font-size="13" fill="#475569">batch/select helper path</text>
    <line x1="590" y1="0" x2="632" y2="0" stroke="#db2777" stroke-width="2.8" stroke-dasharray="7 5" marker-end="url(#arrow-pink)"/><text x="648" y="5" font-size="13" fill="#475569">schema metadata path</text>
    <line x1="890" y1="0" x2="932" y2="0" stroke="#2563eb" stroke-width="2.8" marker-end="url(#arrow-blue)"/><text x="948" y="5" font-size="13" fill="#475569">driver execution</text>
  </g>
</svg>
