<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-label="Virtual Thread Runtime Selection Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#0D9488" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#D97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DB2777" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748B" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .layer{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.layerPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.3}.layerTitle{font-family:"Architects Daughter";font-size:20px;fill:#0F172A}
    .card{filter:url(#shadow);stroke-width:1.8}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}.small{font-family:"Comic Mono";font-size:12px;fill:#64748B}
    .route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.routeSoft{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
    .label{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.3}
  </style>
</defs>
<rect class="canvas" width="1600" height="1040"/>
<rect class="frame" x="34" y="30" width="1532" height="980" rx="8"/>
<text class="title" x="72" y="84">Virtual Thread Runtime Selection Flow</text>
<text class="subtitle" x="76" y="116">VirtualThreads chooses the highest-priority supported ServiceLoader provider, then falls back to platform threads.</text>

<g id="layer-api"><rect class="layer" x="82" y="156" width="1436" height="194" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/><rect class="layerPill" x="112" y="178" width="300" height="34" rx="8"/><text class="layerTitle" x="262" y="197" text-anchor="middle" dominant-baseline="middle">Application-facing API</text></g>
<g id="layer-selector"><rect class="layer" x="82" y="378" width="1436" height="270" rx="8" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/><rect class="layerPill" x="112" y="400" width="510" height="34" rx="8"/><text class="layerTitle" x="367" y="419" text-anchor="middle" dominant-baseline="middle">Lazy runtime selector in VirtualThreads</text></g>
<g id="layer-runtime"><rect class="layer" x="82" y="708" width="1436" height="210" rx="8" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/><rect class="layerPill" x="112" y="730" width="510" height="34" rx="8"/><text class="layerTitle" x="367" y="749" text-anchor="middle" dominant-baseline="middle">Runtime implementations on the classpath</text></g>

<g id="app">
  <rect class="card" x="140" y="218" width="360" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="320" y="247" text-anchor="middle" dominant-baseline="middle">Application code</text>
  <text class="detail" x="320" y="273" text-anchor="middle" dominant-baseline="middle">calls VirtualThreads.*</text>
</g>
<g id="api">
  <rect class="card" x="620" y="208" width="360" height="90" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="800" y="240" text-anchor="middle" dominant-baseline="middle">VirtualThreads facade</text>
  <text class="detail" x="800" y="267" text-anchor="middle" dominant-baseline="middle">runtime, threadFactory, executorService</text>
</g>
<g id="result">
  <rect class="card" x="1100" y="218" width="340" height="70" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1270" y="247" text-anchor="middle" dominant-baseline="middle">Selected runtime</text>
  <text class="detail" x="1270" y="273" text-anchor="middle" dominant-baseline="middle">used by all API calls</text>
</g>

<g id="loader">
  <rect class="card" x="150" y="466" width="290" height="88" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="295" y="500" text-anchor="middle" dominant-baseline="middle">ServiceLoader.load</text>
  <text class="detail" x="295" y="528" text-anchor="middle" dominant-baseline="middle">VirtualThreadRuntime providers</text>
</g>
<g id="supported">
  <rect class="card" x="510" y="466" width="270" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="645" y="500" text-anchor="middle" dominant-baseline="middle">Filter supported</text>
  <text class="detail" x="645" y="528" text-anchor="middle" dominant-baseline="middle">provider.isSupported()</text>
</g>
<g id="priority">
  <rect class="card" x="850" y="466" width="270" height="88" rx="8" fill="#FFF7ED" stroke="#D97706"/>
  <text class="cardTitle" x="985" y="500" text-anchor="middle" dominant-baseline="middle">Sort by priority</text>
  <text class="detail" x="985" y="528" text-anchor="middle" dominant-baseline="middle">highest value wins</text>
</g>
<g id="fallback">
  <rect class="card" x="1190" y="466" width="270" height="88" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="cardTitle" x="1325" y="500" text-anchor="middle" dominant-baseline="middle">Fallback path</text>
  <text class="detail" x="1325" y="528" text-anchor="middle" dominant-baseline="middle">no supported provider</text>
</g>

<g id="jdk25">
  <rect class="card" x="170" y="780" width="320" height="88" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="330" y="812" text-anchor="middle" dominant-baseline="middle">JDK 25 provider</text>
  <text class="detail" x="330" y="839" text-anchor="middle" dominant-baseline="middle">priority 25, feature >= 25</text>
</g>
<g id="jdk21">
  <rect class="card" x="640" y="780" width="320" height="88" rx="8" fill="#ECFDF5" stroke="#16A34A"/>
  <text class="cardTitle" x="800" y="812" text-anchor="middle" dominant-baseline="middle">JDK 21 provider</text>
  <text class="detail" x="800" y="839" text-anchor="middle" dominant-baseline="middle">priority 21, feature >= 21</text>
</g>
<g id="platform">
  <rect class="card" x="1110" y="780" width="320" height="88" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="cardTitle" x="1270" y="812" text-anchor="middle" dominant-baseline="middle">Platform fallback</text>
  <text class="detail" x="1270" y="839" text-anchor="middle" dominant-baseline="middle">cached platform-thread pool</text>
</g>

<path class="route" d="M500 253 L620 253" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="route" d="M980 253 L1100 253" stroke="#16A34A" marker-end="url(#arrow-green)"/>
<path class="route" d="M 800 298 L 800 346 Q 800 360 786 360 L 309 360 Q 295 360 295 374 L 295 466" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="route" d="M440 510 L510 510" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
<path class="route" d="M780 510 L850 510" stroke="#D97706" marker-end="url(#arrow-amber)"/>
<path class="route" d="M1120 510 L1190 510" stroke="#64748B" marker-end="url(#arrow-gray)"/>
<path class="route" d="M 985 554 L 985 604 Q 985 618 999 618 L 1256 618 Q 1270 618 1270 632 L 1270 708 L 1270 780" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="routeSoft" d="M 490 824 L 526 824 Q 540 824 540 810 L 540 704 Q 540 690 554 690 L 846 690 Q 860 690 860 676 L 860 554" stroke="#DB2777"/>
<polygon points="866,566 860,554 854,566" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="routeSoft" d="M 800 780 L 800 704 Q 800 690 814 690 L 911 690 Q 925 690 925 676 L 925 554" stroke="#16A34A"/>
<polygon points="931,566 925,554 919,566" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="routeSoft" d="M 1270 780 L 1270 666 Q 1270 652 1284 652 L 1311 652 Q 1325 652 1325 638 L 1325 554" stroke="#64748B"/>
<polygon points="1331,566 1325,554 1319,566" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<g><rect class="label" x="1015" y="590" width="178" height="28" rx="8"/><text class="small" x="1104" y="605" text-anchor="middle" dominant-baseline="middle">providers.firstOrNull()</text></g>
<g><rect class="label" x="548" y="658" width="200" height="28" rx="8"/><text class="small" x="648" y="673" text-anchor="middle" dominant-baseline="middle">registered by META-INF/services</text></g>
</svg>
