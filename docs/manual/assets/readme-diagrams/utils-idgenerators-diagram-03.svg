<svg data-intent="Explain the Snowflake 64-bit layout from current constants and make/parse functions." data-evidence="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/SnowflakeSupport.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/SnowflakeId.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/sequencer/DefaultSequencer.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/sequencer/GlobalSequencer.kt" data-source-read="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/SnowflakeSupport.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/SnowflakeId.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/sequencer/DefaultSequencer.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/snowflake/sequencer/GlobalSequencer.kt" xmlns="http://www.w3.org/2000/svg" width="3000" height="1700" viewBox="0 0 3000 1700" role="img" aria-label="Snowflake Bit Layout">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}
    .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:58px;fill:#0F172A}
    .subtitle{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .bitLabel{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .segmentBits{font-family:"Comic Mono";font-size:28px;fill:#0F172A;font-weight:700}
    .segmentTitle{font-family:"Architects Daughter";font-size:38px;fill:#0F172A}
    .segmentRange{font-family:"Comic Mono";font-size:18px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}
    .cardTitle{font-family:"Architects Daughter";font-size:34px;fill:#0F172A}
    .cardText{font-family:"Comic Mono";font-size:18px;fill:#334155}
    .divider{stroke-width:1;opacity:.36}
    .guide{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
    .tick{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 8}
