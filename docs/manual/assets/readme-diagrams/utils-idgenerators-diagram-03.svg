  <rect x="1915.625" y="430" width="415.625" height="190" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="3"/>
  <text class="segmentBits" x="2123.4375" y="488" text-anchor="middle">10 bits</text>
  <text class="segmentTitle" x="2123.4375" y="542" text-anchor="middle">machineId</text>
  <text class="segmentRange" x="2123.4375" y="582" text-anchor="middle">bits 21..12</text>
  <path class="guide" d="M 2123.44 620 L 2123.44 710 Q 2123.44 724 2109.44 724 L 1414 724 Q 1400 724 1400 738 L 1400 760" stroke="#15803D"/>
</g>
