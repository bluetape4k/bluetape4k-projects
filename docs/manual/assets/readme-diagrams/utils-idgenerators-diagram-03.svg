<rect class="canvas" width="3000" height="1700"/>
<rect class="frame" x="36" y="30" width="2928" height="1640" rx="8"/>
<text class="title" x="76" y="104">Snowflake Bit Layout</text>
<text class="subtitle" x="80" y="142">64-bit Long = 42-bit timestamp + 10-bit machine id + 12-bit sequence, packed by SnowflakeSupport.makeId.</text>
<text class="bitLabel" x="170" y="344">Most significant bit</text>
<text class="bitLabel" x="2830" y="344" text-anchor="end">Least significant bit</text>
<g><path class="tick" d="M170 412V638"/><text class="tickText" x="170" y="396" text-anchor="middle">63</text></g>
<g><path class="tick" d="M1874.0625 412V638"/><text class="tickText" x="1874.0625" y="396" text-anchor="middle">22</text></g>
<g><path class="tick" d="M1957.1875 412V638"/><text class="tickText" x="1957.1875" y="396" text-anchor="middle">21</text></g>
<g><path class="tick" d="M2289.6875 412V638"/><text class="tickText" x="2289.6875" y="396" text-anchor="middle">12</text></g>
<g><path class="tick" d="M2372.8125 412V638"/><text class="tickText" x="2372.8125" y="396" text-anchor="middle">11</text></g>
<g><path class="tick" d="M2830 412V638"/><text class="tickText" x="2830" y="396" text-anchor="middle">0</text></g>
