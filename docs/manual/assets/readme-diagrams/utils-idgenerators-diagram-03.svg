  <rect x="2331.25" y="430" width="498.75" height="190" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="3"/>
  <text class="segmentBits" x="2580.625" y="488" text-anchor="middle">12 bits</text>
  <text class="segmentTitle" x="2580.625" y="542" text-anchor="middle">sequence</text>
  <text class="segmentRange" x="2580.625" y="582" text-anchor="middle">bits 11..0</text>
  <path class="guide" d="M 2580.63 620 L 2580.63 710 Q 2580.63 724 2566.63 724 L 2244 724 Q 2230 724 2230 738 L 2230 760" stroke="#B45309"/>
</g>
<g>
  <rect class="card" x="190" y="760" width="760" height="240" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="570" y="814" text-anchor="middle">Timestamp</text>
  <path class="divider" d="M190 842H950" stroke="#1D4ED8"/>
  <text class="cardText" x="218" y="882">TIMESTAMP_BITS = 42</text>
<text class="cardText" x="218" y="916">stored as timestamp - EPOCH</text>
<text class="cardText" x="218" y="950">EPOCH = 2015-01-01T00:00:00Z</text>
<text class="cardText" x="218" y="984">parse: (id &gt;&gt;&gt; 22) + EPOCH</text>
</g>
<g>
  <rect class="card" x="1120" y="760" width="560" height="240" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1400" y="814" text-anchor="middle">Machine</text>
  <path class="divider" d="M1120 842H1680" stroke="#15803D"/>
  <text class="cardText" x="1148" y="882">MACHINE_BITS = 10</text>
<text class="cardText" x="1148" y="916">MAX_MACHINE_ID = 1024</text>
<text class="cardText" x="1148" y="950">mask = 1023</text>
<text class="cardText" x="1148" y="984">parse: (id &gt;&gt;&gt; 12) &amp; mask</text>
</g>
<g>
  <rect class="card" x="1850" y="760" width="760" height="240" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="2230" y="814" text-anchor="middle">Sequence</text>
  <path class="divider" d="M1850 842H2610" stroke="#C2410C"/>
  <text class="cardText" x="1878" y="882">SEQUENCE_BITS = 12</text>
<text class="cardText" x="1878" y="916">MAX_SEQUENCE = 4096</text>
<text class="cardText" x="1878" y="950">mask = 4095</text>
<text class="cardText" x="1878" y="984">rolls over on next millisecond</text>
</g>
<g>
  <rect class="card" x="310" y="1130" width="1120" height="270" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="cardTitle" x="870" y="1184" text-anchor="middle">Packing</text>
  <path class="divider" d="M310 1212H1430" stroke="#6D28D9"/>
  <text class="cardText" x="338" y="1252">makeId(timestamp, machineId, sequence)</text>
<text class="cardText" x="338" y="1286">((timestamp - EPOCH) &lt;&lt; 22)</text>
<text class="cardText" x="338" y="1320">| (machineId &lt;&lt; 12)</text>
<text class="cardText" x="338" y="1354">| sequence</text>
</g>
<g>
  <rect class="card" x="1570" y="1130" width="1120" height="270" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="cardTitle" x="2130" y="1184" text-anchor="middle">Result</text>
  <path class="divider" d="M1570 1212H2690" stroke="#475569"/>
  <text class="cardText" x="1598" y="1252">SnowflakeId(timestamp, machineId, sequence)</text>
<text class="cardText" x="1598" y="1286">value: Long by makeId(...)</text>
<text class="cardText" x="1598" y="1320">valueAsString: base-36 Long string</text>
<text class="cardText" x="1598" y="1354">DefaultSequencer uses ReentrantLock</text>
</g>
</svg>