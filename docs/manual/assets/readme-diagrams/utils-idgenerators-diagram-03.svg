  <text class="segmentBits" x="1042.8125" y="488" text-anchor="middle">42 bits</text>
  <text class="segmentTitle" x="1042.8125" y="542" text-anchor="middle">timestamp</text>
  <text class="segmentRange" x="1042.8125" y="582" text-anchor="middle">bits 63..22</text>
  <path class="guide" d="M 1042.81 620 L 1042.81 710 Q 1042.81 724 1028.81 724 L 584 724 Q 570 724 570 738 L 570 760" stroke="#0369A1"/>
</g>
