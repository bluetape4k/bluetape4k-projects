<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1320">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#64748B" stroke="#64748B" stroke-width="1"/>
  </marker>

  <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#15803D" stroke="#15803D" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#0F8B87" stroke="#0F8B87" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#C47A00" stroke="#C47A00" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#BE185D" stroke="#BE185D" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="openArrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#0F8B87" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="openArrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="openArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
</defs>
<style>
  text{font-family:"Architects Daughter","Comic Mono",monospace;letter-spacing:0;fill:#263447}
  .canvas{fill:#F7FAFC}
  .frame{fill:#FFFFFF;stroke:#D5E0EA;stroke-width:3}
  .title{font-size:48px;font-weight:700;fill:#172033}
  .subtitle{font-family:"Comic Mono",monospace;font-size:20px;font-weight:700;fill:#526174}
  .section rect{fill:#FFFFFF;stroke:#D5E0EA;stroke-width:2.4}
  .sectionTitle{font-size:28px;font-weight:700;fill:#263447}
  .sectionSub{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700;fill:#66788D}
  .card rect{filter:url(#shadow);stroke-width:3;fill:#FFFFFF}
  .blue rect{fill:#EAF3FF;stroke:#3B82F6}.green rect{fill:#EAF9F0;stroke:#21A366}
  .teal rect{fill:#E8FAF8;stroke:#139B91}.amber rect{fill:#FFF4D8;stroke:#D4860B}
  .purple rect{fill:#F2EAFF;stroke:#8B5CF6}.pink rect{fill:#FFEAF1;stroke:#DB2777}
  .gray rect{fill:#F4F6F8;stroke:#64748B}.orange rect{fill:#FFF0E4;stroke:#F05A1A}
  .cardTitle{font-size:27px;font-weight:700}.cardBody{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700;fill:#526174}
  .note{font-family:"Comic Mono",monospace;font-size:16px;font-weight:700;fill:#526174}
  .edge{fill:none;stroke:#344052;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeBlue{fill:none;stroke:#2563EB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeGreen{fill:none;stroke:#15803D;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeTeal{fill:none;stroke:#0F8B87;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeAmber{fill:none;stroke:#C47A00;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgePink{fill:none;stroke:#BE185D;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeDashed{fill:none;stroke:#7C3AED;stroke-width:3.6;stroke-dasharray:10 8;stroke-linecap:round;stroke-linejoin:round}
  .labelBg{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}.edgeLabel{font-family:"Comic Mono",monospace;font-size:14px;font-weight:700;fill:#526174}
</style>
<rect class="canvas" width="1900" height="1320"/>
<rect class="frame" x="36" y="36" width="1828" height="1248" rx="22"/>
<text class="title" x="84" y="96">Redisson Codec Selection Map</text>
<text class="subtitle" x="86" y="132">Read this as a selection model: Default is Fory, compression is opt-in, and map codecs use CompositeCodec.</text>
<g id="factory" class="card blue">
<rect x="760" y="184" width="380" height="118" rx="18"/>
<text class="cardTitle" x="950" y="222" text-anchor="middle">RedissonCodecs</text>
<text class="cardBody" x="950" y="256" text-anchor="middle">lazy constants</text>
<text class="cardBody" x="950" y="281" text-anchor="middle">use-case factories</text>
</g>
<g class="section">
<rect x="90" y="360" width="410" height="760" rx="20"/>
<text class="sectionTitle" x="124" y="408">Serializers</text>
<text class="sectionSub" x="124" y="440">Raw value codecs exposed as constants.</text>
</g>
<g class="section">
<rect x="530" y="360" width="410" height="760" rx="20"/>
<text class="sectionTitle" x="564" y="408">Compression</text>
<text class="sectionSub" x="564" y="440">Wrappers around a selected value codec.</text>
</g>
<g class="section">
<rect x="970" y="360" width="410" height="760" rx="20"/>
<text class="sectionTitle" x="1004" y="408">Map composition</text>
<text class="sectionSub" x="1004" y="440">String key codec plus value codec.</text>
</g>
<g class="section">
<rect x="1410" y="360" width="400" height="760" rx="20"/>
<text class="sectionTitle" x="1444" y="408">Use-case factories</text>
<text class="sectionSub" x="1444" y="440">Reader-facing names return source constants.</text>
</g>
<g id="default" class="card green">
<rect x="135" y="458" width="320" height="112" rx="18"/>
<text class="cardTitle" x="295" y="496" text-anchor="middle">Default = Fory</text>
<text class="cardBody" x="295" y="530" text-anchor="middle">plain Fory</text>
<text class="cardBody" x="295" y="555" text-anchor="middle">fallback: Kryo5</text>
</g>
<g id="fastfory" class="card purple">
<rect x="135" y="616" width="320" height="126" rx="18"/>
<text class="cardTitle" x="295" y="654" text-anchor="middle">FastFory</text>
<text class="cardBody" x="295" y="688" text-anchor="middle">faster schema mode</text>
<text class="cardBody" x="295" y="713" text-anchor="middle">volatile cache only</text>
</g>
<g id="json" class="card amber">
<rect x="135" y="796" width="320" height="126" rx="18"/>
<text class="cardTitle" x="295" y="834" text-anchor="middle">JSON codecs</text>
<text class="cardBody" x="295" y="868" text-anchor="middle">Jackson3 / Fastjson2</text>
<text class="cardBody" x="295" y="893" text-anchor="middle">safe factories allow-list</text>
</g>
<g id="builtin" class="card gray">
<rect x="135" y="968" width="320" height="104" rx="18"/>
<text class="cardTitle" x="295" y="1006" text-anchor="middle">Built-ins</text>
<text class="cardBody" x="295" y="1040" text-anchor="middle">Kryo5, JDK</text>
<text class="cardBody" x="295" y="1065" text-anchor="middle">String, numeric</text>
</g>
<g id="wrap" class="card teal">
<rect x="570" y="458" width="330" height="118" rx="18"/>
<text class="cardTitle" x="735" y="496" text-anchor="middle">Wrapper classes</text>
<text class="cardBody" x="735" y="530" text-anchor="middle">Lz4Codec, ZstdCodec</text>
<text class="cardBody" x="735" y="555" text-anchor="middle">GzipCodec</text>
</g>
<g id="snappy" class="card teal">
<rect x="570" y="632" width="330" height="112" rx="18"/>
<text class="cardTitle" x="735" y="670" text-anchor="middle">SnappyCodecV2</text>
<text class="cardBody" x="735" y="704" text-anchor="middle">Redisson wrapper</text>
<text class="cardBody" x="735" y="729" text-anchor="middle">same value-codec idea</text>
</g>
<g id="compressed" class="card teal">
<rect x="570" y="816" width="330" height="136" rx="18"/>
<text class="cardTitle" x="735" y="854" text-anchor="middle">Compressed constants</text>
<text class="cardBody" x="735" y="888" text-anchor="middle">LZ4Fory / ZstdFory</text>
<text class="cardBody" x="735" y="913" text-anchor="middle">Snappy* / Gzip*</text>
</g>
<g id="compression-note" class="card pink">
<rect x="570" y="990" width="330" height="92" rx="18"/>
<text class="cardTitle" x="735" y="1028" text-anchor="middle">Opt-in compression</text>
<text class="cardBody" x="735" y="1062" text-anchor="middle">choose it explicitly</text>
</g>
<g id="composite" class="card orange">
<rect x="1010" y="458" width="330" height="120" rx="18"/>
<text class="cardTitle" x="1175" y="496" text-anchor="middle">CompositeCodec</text>
<text class="cardBody" x="1175" y="530" text-anchor="middle">String key codec</text>
<text class="cardBody" x="1175" y="555" text-anchor="middle">value codec twice</text>
</g>
<g id="mapvalue" class="card orange">
<rect x="1010" y="650" width="330" height="126" rx="18"/>
<text class="cardTitle" x="1175" y="688" text-anchor="middle">Map constants</text>
<text class="cardBody" x="1175" y="722" text-anchor="middle">ForyComposite</text>
<text class="cardBody" x="1175" y="747" text-anchor="middle">LZ4ForyComposite</text>
</g>
<g id="near" class="card teal">
<rect x="1010" y="850" width="330" height="136" rx="18"/>
<text class="cardTitle" x="1175" y="888" text-anchor="middle">NearCache default</text>
<text class="cardBody" x="1175" y="922" text-anchor="middle">RedissonNearCache</text>
<text class="cardBody" x="1175" y="947" text-anchor="middle">uses LZ4Fory</text>
</g>
<g id="general" class="card green">
<rect x="1452" y="444" width="320" height="76" rx="18"/>
<text class="cardTitle" x="1612" y="482" text-anchor="middle">forGeneral()</text>
<text class="cardBody" x="1612" y="516" text-anchor="middle">Fory</text>
</g>
<g id="small" class="card gray">
<rect x="1452" y="532" width="320" height="76" rx="18"/>
<text class="cardTitle" x="1612" y="570" text-anchor="middle">forSmallValue()</text>
<text class="cardBody" x="1612" y="604" text-anchor="middle">Kryo5</text>
</g>
<g id="cache" class="card teal">
<rect x="1452" y="620" width="320" height="82" rx="18"/>
<text class="cardTitle" x="1612" y="658" text-anchor="middle">forCache()</text>
<text class="cardBody" x="1612" y="692" text-anchor="middle">LZ4Fory; value cache</text>
</g>
<g id="cachemap" class="card orange">
<rect x="1452" y="718" width="320" height="82" rx="18"/>
<text class="cardTitle" x="1612" y="756" text-anchor="middle">forCacheMap()</text>
<text class="cardBody" x="1612" y="790" text-anchor="middle">LZ4ForyComposite</text>
</g>
<g id="high" class="card purple">
<rect x="1452" y="816" width="320" height="88" rx="18"/>
<text class="cardTitle" x="1612" y="854" text-anchor="middle">forHighThroughput()</text>
<text class="cardBody" x="1612" y="888" text-anchor="middle">LZ4FastFory; volatile only</text>
</g>
<g id="archive" class="card amber">
<rect x="1452" y="922" width="320" height="76" rx="18"/>
<text class="cardTitle" x="1612" y="960" text-anchor="middle">forArchival()</text>
<text class="cardBody" x="1612" y="994" text-anchor="middle">ZstdFory</text>
</g>
<g id="compat" class="card gray">
<rect x="1452" y="1010" width="320" height="76" rx="18"/>
<text class="cardTitle" x="1612" y="1048" text-anchor="middle">forCompatibility()</text>
<text class="cardBody" x="1612" y="1082" text-anchor="middle">JDK</text>
</g>
<path id="p-to-serial" class="edgeGreen" d="M 840 302 L 840 317 Q 840 330 827 330 L 309 330 Q 295 330 295 344 L 295 458" marker-end="url(#arrow-green)"/>
<path id="p-to-compression" class="edgeTeal" d="M 900 302 L 900 317 Q 900 330 887 330 L 749 330 Q 735 330 735 344 L 735 458" marker-end="url(#arrow-teal)"/>
<path id="p-to-composite" class="edgeAmber" d="M 960 302 L 960 317 Q 960 330 973 330 L 1161 330 Q 1175 330 1175 344 L 1175 458" marker-end="url(#arrow-amber)"/>
<path id="p-to-usecase" class="edgeBlue" d="M 1020 302 L 1020 317 Q 1020 330 1033 330 L 1788 330 Q 1802 330 1802 344 L 1802 468 Q 1802 482 1794 482 L 1772 482" marker-end="url(#arrow-blue)"/>
<path id="p-fory-wrap" class="edgeTeal" d="M 455 514 L 570 514"/>

<polyline points="552,522 570,514 552,506" fill="none" stroke="#0F8B87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
<path id="p-fast-wrap" class="edgeDashed" d="M 455 678 L 570 678" stroke-linecap="round" stroke-linejoin="round"/>

<polyline points="552,686 570,678 552,670" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
<path id="p-wrap-out" class="edgeTeal" d="M 900 517 L 916 517 Q 930 517 930 531 L 930 870 Q 930 884 922 884 L 900 884" marker-end="url(#arrow-teal)"/>
<path id="p-composite-map" class="edgeAmber" d="M 1175 578 L 1175 650" marker-end="url(#arrow-amber)"/>
<path id="p-map-near" class="edgeTeal" d="M 1175 776 L 1175 850" marker-end="url(#arrow-teal)"/>
<rect class="labelBg" x="132" y="1148" width="1636" height="42" rx="12"/>
<text class="note" x="950" y="1175" text-anchor="middle">FastFory can read legacy Fory through fallback, but Fory cannot read FastFory data; keep FastFory for volatile caches.</text>
</svg>
