<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" width="1360" height="960">
<style>
  text { font-family: 'Architects Daughter', 'Comic Mono', 'Comic Sans MS', sans-serif; letter-spacing: 0; }
</style>
<rect width="1360" height="960" fill="#ffffff" />
<text x="680" y="43" fill="#111827" font-size="28" font-weight="700" text-anchor="middle">OpenTelemetry Core Class Structure</text>
<text x="680" y="72" fill="#6b7280" font-size="14" font-weight="500" text-anchor="middle">Kotlin extension groups wrap OpenTelemetry SDK types without adding a new runtime object model</text>
<rect x="70" y="112" width="1220" height="70" rx="11" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.6" />
<text x="88" y="142" fill="#111827" font-size="15" font-weight="700" text-anchor="start">Reading rule</text>
<text x="88" y="169" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">Dashed open arrows mean dependency/use: each function group adds Kotlin extension functions to, or builds, the OTel type it points to.</text>
<g id="otel">
<rect x="86" y="228" width="260" height="208" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.8" />
<line x1="86" y1="286" x2="346" y2="286" stroke="#d1d5db" stroke-width="1.2" />
<line x1="86" y1="342" x2="346" y2="342" stroke="#d1d5db" stroke-width="1.2" />
<text x="216" y="251" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;OTel API / SDK&gt;&gt;</text>
<text x="216" y="273" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">OpenTelemetry</text>
<text x="104" y="310" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ GlobalOpenTelemetry</text>
<text x="104" y="329" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ OpenTelemetrySdkBuilder</text>
<text x="104" y="367" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ tracerBuilder(name)</text>
<text x="104" y="386" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ meterBuilder(name)</text>
<text x="104" y="405" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ propagating(props)</text>
</g>
<g id="trace-types">
<rect x="386" y="228" width="260" height="208" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.8" />
<line x1="386" y1="286" x2="646" y2="286" stroke="#d1d5db" stroke-width="1.2" />
<line x1="386" y1="361" x2="646" y2="361" stroke="#d1d5db" stroke-width="1.2" />
<text x="516" y="251" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;OTel trace API&gt;&gt;</text>
<text x="516" y="273" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Tracer / Span</text>
<text x="404" y="310" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Tracer</text>
<text x="404" y="329" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ SpanBuilder</text>
<text x="404" y="348" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Span</text>
<text x="404" y="386" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ startSpan()</text>
<text x="404" y="405" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ makeCurrent()</text>
<text x="404" y="424" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ end()</text>
</g>
<g id="context-flow">
<rect x="686" y="228" width="260" height="208" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.8" />
<line x1="686" y1="286" x2="946" y2="286" stroke="#d1d5db" stroke-width="1.2" />
<line x1="686" y1="361" x2="946" y2="361" stroke="#d1d5db" stroke-width="1.2" />
<text x="816" y="251" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;coroutine bridge&gt;&gt;</text>
<text x="816" y="273" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Context / Flow</text>
<text x="704" y="310" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Context</text>
<text x="704" y="329" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ CoroutineContext</text>
<text x="704" y="348" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Flow&lt;T&gt;</text>
<text x="704" y="386" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ asContextElement()</text>
<text x="704" y="405" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ collect()</text>
<text x="704" y="424" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ channelFlow()</text>
</g>
<g id="metrics-attrs">
<rect x="986" y="228" width="260" height="208" rx="9" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.8" />
<line x1="986" y1="286" x2="1246" y2="286" stroke="#d1d5db" stroke-width="1.2" />
<line x1="986" y1="342" x2="1246" y2="342" stroke="#d1d5db" stroke-width="1.2" />
<text x="1116" y="251" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;OTel common API&gt;&gt;</text>
<text x="1116" y="273" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Metrics / Attributes</text>
<text x="1004" y="310" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ AttributesBuilder</text>
<text x="1004" y="329" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ SdkMeterProviderBuilder</text>
<text x="1004" y="367" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ build()</text>
<text x="1004" y="386" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ registerMetricReader()</text>
<text x="1004" y="405" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ put(key, value)</text>
</g>
<g id="support">
<rect x="86" y="590" width="260" height="212" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8" />
<line x1="86" y1="648" x2="346" y2="648" stroke="#bfdbfe" stroke-width="1.2" />
<line x1="86" y1="704" x2="346" y2="704" stroke="#bfdbfe" stroke-width="1.2" />
<text x="216" y="613" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;top-level extensions&gt;&gt;</text>
<text x="216" y="635" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">OpenTelemetrySupport.kt</text>
<text x="104" y="672" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ globalOpenTelemetry</text>
<text x="104" y="691" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ NoopOpenTelemetry</text>
<text x="104" y="729" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ openTelemetrySdk { }</text>
<text x="104" y="748" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ openTelemetrySdkGlobal { }</text>
<text x="104" y="767" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ OpenTelemetry.tracer(...)</text>
</g>
<g id="trace-support">
<rect x="386" y="590" width="260" height="212" rx="9" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8" />
<line x1="386" y1="648" x2="646" y2="648" stroke="#bbf7d0" stroke-width="1.2" />
<line x1="386" y1="704" x2="646" y2="704" stroke="#bbf7d0" stroke-width="1.2" />
<text x="516" y="613" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;span lifecycle&gt;&gt;</text>
<text x="516" y="635" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Trace Support</text>
<text x="404" y="672" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ noopTraceProvider</text>
<text x="404" y="691" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ InvalidSpanContext</text>
<text x="404" y="729" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Tracer.startSpan(...)</text>
<text x="404" y="748" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Span.use { }</text>
<text x="404" y="767" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Tracer.withSpan(...)</text>
</g>
<g id="coroutine-support">
<rect x="686" y="590" width="260" height="212" rx="9" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.8" />
<line x1="686" y1="648" x2="946" y2="648" stroke="#ddd6fe" stroke-width="1.2" />
<line x1="686" y1="704" x2="946" y2="704" stroke="#ddd6fe" stroke-width="1.2" />
<text x="816" y="613" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;context propagation&gt;&gt;</text>
<text x="816" y="635" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Coroutine / Flow Support</text>
<text x="704" y="672" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Span.useSuspending</text>
<text x="704" y="691" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Flow.traced</text>
<text x="704" y="729" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ withSpanContext(...)</text>
<text x="704" y="748" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Flow.tracedCollect(...)</text>
<text x="704" y="767" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ withOtelContext { }</text>
</g>
<g id="dsl-support">
<rect x="986" y="590" width="260" height="212" rx="9" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8" />
<line x1="986" y1="648" x2="1246" y2="648" stroke="#fed7aa" stroke-width="1.2" />
<line x1="986" y1="704" x2="1246" y2="704" stroke="#fed7aa" stroke-width="1.2" />
<text x="1116" y="613" fill="#6b7280" font-size="12" font-weight="600" text-anchor="middle">&lt;&lt;builder helpers&gt;&gt;</text>
<text x="1116" y="635" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">Common / Metrics DSL</text>
<text x="1004" y="672" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ AttributeKey helpers</text>
<text x="1004" y="691" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ NoopMeterProvider</text>
<text x="1004" y="729" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ attributes { }</text>
<text x="1004" y="748" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ Map.toAttributes()</text>
<text x="1004" y="767" fill="#4b5563" font-size="12.5" font-weight="500" text-anchor="start">+ sdkMeterProvider { }</text>
</g>
