<text x="520" y="512" fill="#16a34a" font-size="12" font-weight="700" text-anchor="middle">manages span</text>
<path id="coro-trace" d="M 746 590 L 746 526 Q 746 512 732 512 L 600 512 Q 586 512 586 498 L 586 436" fill="none" stroke="#9333ea" stroke-width="2.7" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" />

