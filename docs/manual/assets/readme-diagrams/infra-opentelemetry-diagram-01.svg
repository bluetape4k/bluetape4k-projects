<text x="218" y="512" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle">builds / registers</text>
<path id="trace-tracer" d="M 516 590 V 436" fill="none" stroke="#16a34a" stroke-width="2.7" stroke-dasharray="7 5" stroke-linecap="round" stroke-linejoin="round" />

<polyline points="524,454 516,436 508,454" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
