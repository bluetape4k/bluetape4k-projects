<g transform="translate(86, 900)">
<text x="0" y="0" fill="#111827" font-size="13" font-weight="700" text-anchor="start">Relationship</text>
<line x1="110" y1="-4" x2="154" y2="-4" stroke="#16a34a" stroke-width="2.7" stroke-dasharray="7 5" />
<path d="M 154 -9 L 164 -4 L 154 1" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" />
