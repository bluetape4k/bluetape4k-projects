  <path class="edge dashed" d="M1090 1180 L1090 915" stroke="#7E22CE" />

  <polygon points="1090,915 1100,937 1080,937" fill="#FFFFFF" stroke="none" />

  <polygon class="markerSolid" points="1090,915 1100,937 1080,937" fill="#FFFFFF" stroke="#7E22CE" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1114" y="1040">implements</text>
</g>
<g data-from="SuspendNearCacheOperations" data-to="NearCacheStatistics">
  <path class="edge dashed"  d="M1620 770 L1695 770" stroke="#15803D" />

  <polyline points="1677,778 1695,770 1677,762" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1638" y="749">stats()</text>
</g>
<g data-from="DefaultNearCacheStatistics" data-to="NearCacheStatistics">
  <path class="edge dashed" d="M1978 1088 L1978 915" stroke="#15803D" />

  <polygon points="1978,915 1988,937 1968,937" fill="#FFFFFF" stroke="none" />

  <polygon class="markerSolid" points="1978,915 1988,937 1968,937" fill="#FFFFFF" stroke="#15803D" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="2003" y="988">implements</text>
</g>
<g data-from="ResilientSuspendNearCacheDecorator" data-to="NearCacheResilienceConfig">
  <path class="edge dashed"  d="M 560 1285 L 555 1285 Q 545 1285 545 1275 L 545 974 Q 545 960 531 960 L 469 960 Q 455 960 455 946 L 455 915" stroke="#C2410C" stroke-linecap="round" stroke-linejoin="round" />

  <polyline points="463,933 455,915 447,933" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="556" y="992">uses</text>
</g>
