<rect class="canvas" width="2330" height="1645" />
<rect class="frame" x="34" y="30" width="2262" height="1585" rx="8" />
<text class="title" x="72" y="86">SuspendNearCacheOperations Coroutine Contract</text>
<text class="subtitle" x="76" y="120">cache-core suspend near-cache API, coroutine cancellation contract, retry policy, and local statistics boundary.</text>
<g>
  <rect class="chip" x="1340" y="78" width="205" height="54" rx="18" fill="#F0FDFA" stroke="#0D9488" />
  <text class="chipText" x="1442.5" y="112" text-anchor="middle">suspend API</text>
</g>
<g>
  <rect class="chip" x="1570" y="78" width="190" height="54" rx="18" fill="#FAF5FF" stroke="#9333EA" />
  <text class="chipText" x="1665" y="112" text-anchor="middle">decorator</text>
</g>
<g>
  <rect class="chip" x="1785" y="78" width="190" height="54" rx="18" fill="#F0FDF4" stroke="#16A34A" />
  <text class="chipText" x="1880" y="112" text-anchor="middle">statistics</text>
</g>
<g>
  <rect class="chip" x="2000" y="78" width="190" height="54" rx="18" fill="#FFF7ED" stroke="#EA580C" />
  <text class="chipText" x="2095" y="112" text-anchor="middle">policy</text>
</g>
<text class="sectionLabel" x="710" y="205">Coroutine API surface</text>
<text class="sectionLabel" x="172" y="610">Retry and cancellation policy</text>
<text class="sectionLabel" x="1740" y="610">Local snapshot boundary</text>
<g>
  <rect class="noteBox" x="700" y="235" width="780" height="190" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="noteTitle" x="728" y="283">No AutoCloseable inheritance</text>
  <text class="noteLine" x="730" y="327">AutoCloseable.close() is non-suspend</text>
<text class="noteLine" x="730" y="359">Suspend contract declares suspend close()</text>
<text class="noteLine" x="730" y="391">Lifecycle cleanup keeps coroutine cancellation semantics</text>
</g>
<g id="SuspendNearCacheOperations">
  <rect class="classBox" x="560" y="520" width="1060" height="395" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="stereotype" x="1090" y="548" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="classTitle" x="1090" y="578" text-anchor="middle">SuspendNearCacheOperations&lt;V&gt;</text>
  <path class="divider" d="M560 596H1620" stroke="#0F766E" />
  <text class="member" x="584" y="622">+ cacheName: String</text>
<text class="member" x="584" y="644">+ isClosed: Boolean</text>
<text class="member" x="584" y="666">+ key type fixed to String</text>
  <path class="divider" d="M560 696H1620" stroke="#0F766E" />
  <text class="member" x="584" y="722">+ suspend read: get / getAll / containsKey</text>
<text class="member" x="584" y="744">+ suspend write: put / putAll / putIfAbsent / replace</text>
<text class="member" x="584" y="766">+ suspend delete: remove / removeAll / getAndRemove / getAndReplace</text>
<text class="member" x="584" y="788">+ local only: clearLocal() / localCacheSize() / stats()</text>
<text class="member" x="584" y="810">+ suspend back/lifecycle: clearAll() / backCacheSize() / close()</text>
</g>
<g id="ResilientSuspendNearCacheDecorator">
  <rect class="classBox" x="560" y="1180" width="1060" height="315" rx="8" fill="#FAF5FF" stroke="#9333EA" />
  <text class="stereotype" x="1090" y="1208" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="classTitle" x="1090" y="1238" text-anchor="middle">ResilientSuspendNearCacheDecorator&lt;V&gt;</text>
  <path class="divider" d="M560 1256H1620" stroke="#7E22CE" />
  <text class="member" x="584" y="1282">delegate: SuspendNearCacheOperations&lt;V&gt;</text>
<text class="member" x="584" y="1304">config: NearCacheResilienceConfig</text>
<text class="member" x="584" y="1326">retry: resilience4j Retry</text>
  <path class="divider" d="M560 1356H1620" stroke="#7E22CE" />
  <text class="member" x="584" y="1382">implements the same suspend contract</text>
<text class="member" x="584" y="1404">executeSuspendFunction wraps remote operations</text>
<text class="member" x="584" y="1426">ignoreExceptions(CancellationException)</text>
<text class="member" x="584" y="1448">CancellationException is rethrown from get/getAll/containsKey/close</text>
<text class="member" x="584" y="1470">stats(), clearLocal(), localCacheSize() delegate directly</text>
</g>
<g id="NearCacheResilienceConfig">
  <rect class="classBox" x="145" y="665" width="390" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereotype" x="340" y="693" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="classTitle" x="340" y="723" text-anchor="middle">NearCacheResilienceConfig</text>
  <path class="divider" d="M145 741H535" stroke="#C2410C" />
  <text class="member" x="169" y="767">retryMaxAttempts</text>
<text class="member" x="169" y="789">retryWaitDuration</text>
<text class="member" x="169" y="811">retryExponentialBackoff</text>
<text class="member" x="169" y="833">getFailureStrategy</text>
  <path class="divider" d="M145 863H535" stroke="#C2410C" />
  <text class="member" x="169" y="889">drives suspend retry policy</text>
</g>
<g id="GetFailureStrategy">
  <rect class="classBox" x="145" y="1088" width="390" height="210" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereotype" x="340" y="1116" text-anchor="middle">&lt;&lt;enum&gt;&gt;</text>
  <text class="classTitle" x="340" y="1146" text-anchor="middle">GetFailureStrategy</text>
  <path class="divider" d="M145 1164H535" stroke="#C2410C" />
  <text class="member" x="169" y="1190">RETURN_FRONT_OR_NULL</text>
<text class="member" x="169" y="1212">PROPAGATE_EXCEPTION</text>
  <path class="divider" d="M145 1242H535" stroke="#C2410C" />
  <text class="member" x="169" y="1268">handles ordinary get failures only</text>
</g>
<g id="CancellationException">
  <rect class="classBox" x="145" y="1360" width="390" height="185" rx="8" fill="#FDF2F8" stroke="#DB2777" />
  <text class="stereotype" x="340" y="1388" text-anchor="middle">&lt;&lt;coroutine signal&gt;&gt;</text>
  <text class="classTitle" x="340" y="1418" text-anchor="middle">CancellationException</text>
  <path class="divider" d="M145 1436H535" stroke="#BE185D" />
  <text class="member" x="169" y="1462">not a fallback case</text>
<text class="member" x="169" y="1484">not retried</text>
  <path class="divider" d="M145 1514H535" stroke="#BE185D" />
  <text class="member" x="169" y="1540">must be rethrown</text>
</g>
<g id="NearCacheStatistics">
  <rect class="classBox" x="1695" y="665" width="565" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereotype" x="1977.5" y="693" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="classTitle" x="1977.5" y="723" text-anchor="middle">NearCacheStatistics</text>
  <path class="divider" d="M1695 741H2260" stroke="#15803D" />
  <text class="member" x="1719" y="767">localHits / localMisses / localSize</text>
<text class="member" x="1719" y="789">localEvictions</text>
<text class="member" x="1719" y="811">backHits / backMisses</text>
  <path class="divider" d="M1695 841H2260" stroke="#15803D" />
  <text class="member" x="1719" y="867">+ hitRate: Double</text>
</g>
<g id="DefaultNearCacheStatistics">
  <rect class="classBox" x="1695" y="1088" width="565" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereotype" x="1977.5" y="1116" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="classTitle" x="1977.5" y="1146" text-anchor="middle">DefaultNearCacheStatistics</text>
  <path class="divider" d="M1695 1164H2260" stroke="#15803D" />
  <text class="member" x="1719" y="1190">immutable counter snapshot</text>
<text class="member" x="1719" y="1212">same model as blocking API</text>
  <path class="divider" d="M1695 1242H2260" stroke="#15803D" />
  <text class="member" x="1719" y="1268">hitRate derived from local/back counters</text>
<text class="member" x="1719" y="1290">stats() is non-suspend because local counters</text>
</g>
<g>
  <rect class="noteBox" x="1695" y="1360" width="565" height="205" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="noteTitle" x="1723" y="1408">Reading rule</text>
  <text class="noteLine" x="1725" y="1452">Hollow triangle = interface realization</text>
<text class="noteLine" x="1725" y="1484">Dashed arrow = dependency</text>
<text class="noteLine" x="1725" y="1516">This diagram is coroutine-only</text>
</g>
<g data-from="SuspendNearCacheOperations" data-to="NoAutoCloseable">
  <path class="edge dashed"  d="M1090 520 L1090 425" stroke="#475569" />

  <polyline points="1098,443 1090,425 1082,443" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1114" y="467">declares close()</text>
</g>
