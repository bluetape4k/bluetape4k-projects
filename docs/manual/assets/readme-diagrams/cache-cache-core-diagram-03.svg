  <path class="edge dashed"  d="M560 1415 L535 1415" stroke="#BE185D" />

  <polyline points="553,1407 535,1415 553,1423" fill="none" stroke="#BE185D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />

</g>
</svg>
