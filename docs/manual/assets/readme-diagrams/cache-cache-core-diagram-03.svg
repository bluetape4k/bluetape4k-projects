  <path class="edge dashed"  d="M340 915 L340 1088" stroke="#C2410C" />

  <polyline points="332,1070 340,1088 348,1070" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="365" y="1002">selects</text>
</g>
