  <text class="edgeLabel" x="1605" y="747">implements</text>
</g>
<g data-from="SuspendJCache" data-to="SuspendJCacheEntry">
  <path class="edge dashed"  d="M1650 405 L1790 405" stroke="#C2410C" />

  <polyline points="1772,413 1790,405 1772,397" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1688" y="384">Flow entry</text>
</g>
<g data-from="SuspendJCacheEntryEventListener" data-to="SuspendJCache">
  <path class="edge dashed"  d="M590 405 L650 405" stroke="#BE185D" />

  <polyline points="632,413 650,405 632,397" fill="none" stroke="#BE185D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />

</g>
<g data-from="SuspendNearJCache" data-to="CaffeineSuspendJCache">
  <path class="edge dashed"  d="M1200 1035 L990 1035" stroke="#1D4ED8" />

  <polyline points="1008,1027 990,1035 1008,1043" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1088" y="1014">front</text>
</g>
<g data-from="SuspendNearJCache" data-to="ProviderBoundary">
  <path class="edge dashed"  d="M 1580 1200 L 1580 1236 Q 1580 1250 1566 1250 L 680 1250 Q 670 1250 670 1260 L 670 1260" stroke="#475569" stroke-linecap="round" stroke-linejoin="round" />

  <polyline points="662,1242 670,1260 678,1242" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="938" y="1229">back implementations</text>
</g>
</svg>
