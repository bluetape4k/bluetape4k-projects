<rect class="canvas" width="1600" height="920" />
<rect class="frame" x="34" y="30" width="1532" height="860" rx="8" />
<text class="title" x="72" y="84">bluetape4k-virtualthread-jdk21</text>
<text class="subtitle" x="76" y="116">JDK 21 module registers runtime and StructuredTaskScope providers backed by Java 21 virtual threads.</text>

<text class="section" x="100" y="178">Runtime service entry</text>
<text class="section" x="900" y="178">Structured scope service entry</text>
<g id="serviceRuntime"><rect class="card" x="145" y="210" width="470" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="className" x="380" y="245" text-anchor="middle" dominant-baseline="middle">VirtualThreadRuntime service</text><text class="member" x="380" y="272" text-anchor="middle" dominant-baseline="middle">META-INF/services entry loads Jdk21VirtualThreadRuntime</text></g>
<g id="serviceProvider"><rect class="card" x="915" y="210" width="510" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="className" x="1170" y="245" text-anchor="middle" dominant-baseline="middle">StructuredTaskScopeProvider service</text><text class="member" x="1170" y="272" text-anchor="middle" dominant-baseline="middle">META-INF/services entry loads Jdk21StructuredTaskScopeProvider</text></g>

<g id="runtime"><rect class="card" x="160" y="410" width="440" height="132" rx="8" fill="#ECFDF5" stroke="#16A34A" /><text class="stereo" x="380" y="438" text-anchor="middle">final class</text><text class="className" x="380" y="468" text-anchor="middle">Jdk21VirtualThreadRuntime</text><line class="divider" x1="180" y1="486" x2="580" y2="486" /><text class="member" x="180" y="512">runtimeName = jdk21, priority = 21</text><text class="member" x="180" y="534">isSupported when Java feature &gt;= 21</text></g>
<g id="executor"><rect class="card" x="160" y="680" width="440" height="132" rx="8" fill="#FFF7ED" stroke="#D97706" /><text class="stereo" x="380" y="708" text-anchor="middle">JDK 21 API</text><text class="className" x="380" y="738" text-anchor="middle">Virtual thread executor</text><line class="divider" x1="180" y1="756" x2="580" y2="756" /><text class="member" x="180" y="782">Thread.ofVirtual().name(prefix, 0)</text><text class="member" x="180" y="804">Executors.newThreadPerTaskExecutor</text></g>

<g id="provider"><rect class="card" x="940" y="410" width="460" height="132" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="stereo" x="1170" y="438" text-anchor="middle">class</text><text class="className" x="1170" y="468" text-anchor="middle">Jdk21StructuredTaskScopeProvider</text><line class="divider" x1="960" y1="486" x2="1380" y2="486" /><text class="member" x="960" y="512">withAll: ShutdownOnFailure</text><text class="member" x="960" y="534">withAny: ShutdownOnSuccess</text></g>
<g id="wrappers"><rect class="card" x="760" y="680" width="410" height="170" rx="8" fill="#FFF7ED" stroke="#D97706" /><text class="className" x="965" y="716" text-anchor="middle">JDK21 wrapper scopes</text><line class="divider" x1="780" y1="734" x2="1150" y2="734" /><text class="member" x="780" y="760">Jdk21AllScope, Jdk21AnyScope</text><text class="member" x="780" y="782">Jdk21SupervisedScope</text><text class="member" x="780" y="804">Jdk21Subtask adapts Subtask.State</text></g>
<g id="supervised"><rect class="card" x="1240" y="700" width="300" height="132" rx="8" fill="#FDF2F8" stroke="#DB2777" /><text class="className" x="1390" y="736" text-anchor="middle">Supervised scope</text><text class="member" x="1390" y="764" text-anchor="middle">extends StructuredTaskScope</text><text class="member" x="1390" y="786" text-anchor="middle">collects Result on completion</text></g>

