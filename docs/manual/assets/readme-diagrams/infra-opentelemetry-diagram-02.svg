<line x1="76" y1="-4" x2="118" y2="-4" stroke="#2563eb" stroke-width="3.4" marker-end="url(#arrow-blue)"/>
<text x="132" y="0" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">span lifecycle</text>
<line x1="278" y1="-4" x2="320" y2="-4" stroke="#16a34a" stroke-width="3.4" marker-end="url(#arrow-green)"/>
<text x="334" y="0" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">SDK setup</text>
<line x1="468" y1="-4" x2="510" y2="-4" stroke="#ea580c" stroke-width="3.0" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/>
<text x="524" y="0" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">legacy/optional instrumentation</text>
</g>
</svg>