<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 820" width="1360" height="820">
<style>
  text { font-family: 'Architects Daughter', 'Comic Mono', 'Comic Sans MS', sans-serif; letter-spacing: 0; }
</style>
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
<marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
<marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9333ea" stroke="#9333ea" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
<marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
<marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 14 7 L 0 14 Z" fill="#0d9488" stroke="#0d9488" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
</defs>
<rect width="1360" height="820" fill="#ffffff"/>
<text x="680" y="43" fill="#111827" font-size="28" font-weight="700" text-anchor="middle">OpenTelemetry Component Overview</text>
<text x="680" y="72" fill="#6b7280" font-size="14" font-weight="500" text-anchor="middle">Application instrumentation enters bluetape4k helpers, then the OTel SDK ships traces and metrics to exporters</text>
<rect x="56" y="118" width="232" height="580" rx="16" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.7"/>
<text x="76" y="149" fill="#111827" font-size="15" font-weight="700" text-anchor="start">Application</text>
<text x="76" y="171" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start">instrumented code</text>
<rect x="324" y="118" width="316" height="580" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.7"/>
<text x="344" y="149" fill="#111827" font-size="15" font-weight="700" text-anchor="start">bluetape4k helpers</text>
<text x="344" y="171" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start">Kotlin DSL and lifecycle guards</text>
<rect x="676" y="118" width="300" height="580" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.7"/>
<text x="696" y="149" fill="#111827" font-size="15" font-weight="700" text-anchor="start">OpenTelemetry SDK</text>
<text x="696" y="171" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start">providers, processors, readers</text>
<rect x="1012" y="118" width="292" height="580" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.7"/>
<text x="1032" y="149" fill="#111827" font-size="15" font-weight="700" text-anchor="start">Export targets</text>
<text x="1032" y="171" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start">logging, memory, external backends</text>
<g id="app">
<rect x="86" y="214" width="172" height="138" rx="11" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.9"/>
<text x="104" y="244" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Service code</text>
<text x="104" y="266" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">manual spans</text>
<text x="104" y="292" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">Tracer.withSpan</text>
<text x="104" y="310" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">Span.use</text>
<text x="104" y="328" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">Flow.traced</text>
</g>
<g id="webflux">
<rect x="86" y="464" width="172" height="118" rx="11" fill="#fef2f2" stroke="#fecaca" stroke-width="1.9"/>
<text x="104" y="494" fill="#111827" font-size="16" font-weight="700" text-anchor="start">WebFlux app</text>
<text x="104" y="516" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">legacy helper</text>
<text x="104" y="542" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">createTracingWebFilter</text>
<text x="104" y="560" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">registers Reactor hook</text>
</g>
<g id="helpers">
<rect x="362" y="184" width="240" height="142" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.9"/>
<text x="380" y="214" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Trace lifecycle helpers</text>
<text x="380" y="236" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">blocking + suspend</text>
<text x="380" y="262" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">set OK / ERROR</text>
<text x="380" y="280" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">preserve cancellation</text>
<text x="380" y="298" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">always end Span</text>
</g>
<g id="sdkdsl">
<rect x="362" y="374" width="240" height="142" rx="11" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.9"/>
<text x="380" y="404" fill="#111827" font-size="16" font-weight="700" text-anchor="start">SDK builder DSL</text>
<text x="380" y="426" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">setup helpers</text>
<text x="380" y="452" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">openTelemetrySdk</text>
<text x="380" y="470" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">sdkTracerProvider</text>
<text x="380" y="488" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">sdkMeterProvider</text>
</g>
<g id="attrs">
<rect x="362" y="566" width="240" height="82" rx="11" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.9"/>
<text x="380" y="596" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Attribute DSL</text>
<text x="380" y="624" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">attributes { } and Map.toAttributes()</text>
</g>
<g id="trace-sdk">
<rect x="714" y="184" width="224" height="142" rx="11" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.9"/>
<text x="732" y="214" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Trace SDK</text>
<text x="732" y="236" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">provider + processors</text>
<text x="732" y="262" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">SdkTracerProvider</text>
<text x="732" y="280" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">SimpleSpanProcessor</text>
<text x="732" y="298" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">BatchSpanProcessor</text>
</g>
<g id="metric-sdk">
<rect x="714" y="374" width="224" height="142" rx="11" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.9"/>
<text x="732" y="404" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Metric SDK</text>
<text x="732" y="426" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">provider + readers</text>
<text x="732" y="452" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">SdkMeterProvider</text>
<text x="732" y="470" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">PeriodicMetricReader</text>
<text x="732" y="488" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">InMemoryMetricReader</text>
</g>
<g id="context">
<rect x="714" y="566" width="224" height="82" rx="11" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.9"/>
<text x="732" y="596" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Context bridge</text>
<text x="732" y="624" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">Context.asContextElement for coroutines</text>
</g>
<g id="trace-export">
<rect x="1048" y="184" width="218" height="142" rx="11" fill="#ffffff" stroke="#99f6e4" stroke-width="1.9"/>
<text x="1066" y="214" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Span exporters</text>
<text x="1066" y="236" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">trace output</text>
<text x="1066" y="262" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">LoggingSpanExporter</text>
<text x="1066" y="280" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">SpanExporter.composite</text>
<text x="1066" y="298" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">vararg export helper</text>
</g>
<g id="metric-export">
<rect x="1048" y="374" width="218" height="142" rx="11" fill="#ffffff" stroke="#99f6e4" stroke-width="1.9"/>
<text x="1066" y="404" fill="#111827" font-size="16" font-weight="700" text-anchor="start">Metric exporters</text>
<text x="1066" y="426" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start">metric output</text>
<text x="1066" y="452" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">LoggingMetricExporter</text>
<text x="1066" y="470" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">InMemoryMetricExporter</text>
<text x="1066" y="488" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">reader-driven export</text>
</g>
<g id="external">
<rect x="1048" y="566" width="218" height="82" rx="11" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.9"/>
<text x="1066" y="596" fill="#111827" font-size="16" font-weight="700" text-anchor="start">External backend</text>
<text x="1066" y="624" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">OTel collector or vendor exporter</text>
<text x="1066" y="642" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start">configured by the application</text>
</g>
