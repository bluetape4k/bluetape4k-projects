<rect class="canvas" width="2320" height="1600" />
<rect class="frame" x="38" y="34" width="2244" height="1532" rx="22" />
<text class="title" x="86" y="100">Resilience4j Coroutine Class Structure</text>
<text class="subtitle" x="88" y="134">Source-backed class map: suspend entrypoints, decorator builders, cache contracts, and cancellation-safe fallback behavior.</text>
<text class="clusterLabel" x="112" y="184">External Resilience4j policy types used by coroutine wrappers</text>
<g id="policies" class="noteBox gray">
<rect x="112" y="208" width="700" height="174" rx="12" />
<text class="noteTitle" x="140" y="250">Policy primitives</text>
<text class="noteText" x="140" y="284" text-anchor="start">CircuitBreaker / Retry / RateLimiter</text>
<text class="noteText" x="140" y="309" text-anchor="start">Bulkhead / TimeLimiter</text>
<text class="noteText" x="140" y="334" text-anchor="start">Cache&lt;K,V&gt; facade</text>
</g>
<g id="extensions" class="noteBox blue">
<rect x="892" y="208" width="560" height="174" rx="12" />
<text class="noteTitle" x="920" y="250">Coroutine extension functions</text>
<text class="noteText" x="920" y="284" text-anchor="start">withXxx(policy) { suspend block }</text>
<text class="noteText" x="920" y="309" text-anchor="start">decorateSuspendFunction1 / BiFunction</text>
<text class="noteText" x="920" y="334" text-anchor="start">Retry preserves CancellationException</text>
</g>
<g id="fallback" class="noteBox pink">
<rect x="1578" y="208" width="560" height="174" rx="12" />
<text class="noteTitle" x="1606" y="250">Fallback helpers</text>
<text class="noteText" x="1606" y="284" text-anchor="start">recover(...) and andThen(...)</text>
<text class="noteText" x="1606" y="309" text-anchor="start">typed exception fallback</text>
<text class="noteText" x="1606" y="334" text-anchor="start">CancellationException is rethrown</text>
</g>
<g id="decorators" class="classBox gray">
<rect x="800" y="470" width="720" height="220" rx="12" />
<text class="stereo" x="1160" y="504" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
<text class="classTitle" x="1160" y="540" text-anchor="middle">SuspendDecorators</text>
<line class="divider" x1="800" y1="562" x2="1520" y2="562" />
<text class="member" x="828" y="595" text-anchor="start">+ ofSupplier() / ofRunnable()</text>
<text class="member" x="828" y="624" text-anchor="start">+ ofFunction1() / ofFunction2()</text>
<text class="member" x="828" y="653" text-anchor="start">+ returns a decorator builder</text>
</g>
<text class="clusterLabel" x="112" y="762">Decorator builder classes returned by SuspendDecorators</text>
<g id="supplier" class="classBox blue">
<rect x="112" y="812" width="540" height="216" rx="12" />
<text class="classTitle" x="382" y="860" text-anchor="middle">DecoratorForSuspendSupplier&lt;T&gt;</text>
<line class="divider" x1="112" y1="882" x2="652" y2="882" />
<text class="member" x="140" y="915" text-anchor="start">+ withCircuitBreaker(policy)</text>
<text class="member" x="140" y="944" text-anchor="start">+ withRetry(policy) / withFallback(...)</text>
<text class="member" x="140" y="973" text-anchor="start">+ withCache(Cache&lt;K,T&gt;)</text>
<text class="member" x="140" y="1002" text-anchor="start">+ decorate() / invoke()</text>
</g>
<g id="function1" class="classBox green">
<rect x="890" y="812" width="540" height="216" rx="12" />
<text class="classTitle" x="1160" y="860" text-anchor="middle">DecoratorForSuspendFunction1&lt;T,R&gt;</text>
<line class="divider" x1="890" y1="882" x2="1430" y2="882" />
<text class="member" x="918" y="915" text-anchor="start">+ withXxx(policy)</text>
<text class="member" x="918" y="944" text-anchor="start">+ withCache(Cache&lt;T,R&gt;)</text>
<text class="member" x="918" y="973" text-anchor="start">+ withSuspendCache(SuspendCache&lt;T,R&gt;)</text>
<text class="member" x="918" y="1002" text-anchor="start">+ decorate() / invoke(input)</text>
</g>
<g id="function2" class="classBox teal">
<rect x="1668" y="812" width="540" height="216" rx="12" />
<text class="classTitle" x="1938" y="860" text-anchor="middle">DecoratorForSuspendFunction2&lt;T,U,R&gt;</text>
<line class="divider" x1="1668" y1="882" x2="2208" y2="882" />
<text class="member" x="1696" y="915" text-anchor="start">+ withCircuitBreaker(policy)</text>
<text class="member" x="1696" y="944" text-anchor="start">+ withRetry(policy) / withRateLimit(policy)</text>
<text class="member" x="1696" y="973" text-anchor="start">+ withBulkhead(policy) / withTimeLimiter(policy)</text>
<text class="member" x="1696" y="1002" text-anchor="start">+ decorate() / invoke(t, u)</text>
</g>
<text class="clusterLabel" x="112" y="1120">Cache contract and direct JCache-backed implementation</text>
<g id="r4jcache" class="classBox pink">
<rect x="112" y="1160" width="420" height="192" rx="12" />
<text class="stereo" x="322" y="1194" text-anchor="middle">&lt;&lt;external&gt;&gt;</text>
<text class="classTitle" x="322" y="1230" text-anchor="middle">Cache&lt;K,V&gt;</text>
<line class="divider" x1="112" y1="1252" x2="532" y2="1252" />
<text class="member" x="140" y="1285" text-anchor="start">+ computeIfAbsent(key)</text>
<text class="member" x="140" y="1314" text-anchor="start">Resilience4j facade</text>
<text class="member" x="140" y="1343" text-anchor="start">no public backing JCache accessor</text>
</g>
<g id="suspendcache" class="classBox purple">
<rect x="652" y="1160" width="472" height="222" rx="12" />
<text class="stereo" x="888" y="1194" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="classTitle" x="888" y="1230" text-anchor="middle">SuspendCache&lt;K,V&gt;</text>
<line class="divider" x1="652" y1="1252" x2="1124" y2="1252" />
<text class="member" x="680" y="1285" text-anchor="start">+ computeIfAbsent(key, loader)</text>
<text class="member" x="680" y="1314" text-anchor="start">+ containsKey(key)</text>
<text class="member" x="680" y="1343" text-anchor="start">+ metrics / eventPublisher</text>
<text class="member" x="680" y="1372" text-anchor="start">+ of(jcache)</text>
</g>
<g id="suspendcacheimpl" class="classBox purple">
<rect x="1252" y="1160" width="456" height="222" rx="12" />
<text class="classTitle" x="1480" y="1208" text-anchor="middle">SuspendCacheImpl&lt;K,V&gt;</text>
<line class="divider" x1="1252" y1="1230" x2="1708" y2="1230" />
<text class="member" x="1280" y="1263" text-anchor="start">- keyLocks: ConcurrentHashMap</text>
<text class="member" x="1280" y="1292" text-anchor="start">+ jcache: javax.cache.Cache</text>
<text class="member" x="1280" y="1321" text-anchor="start">+ emits hit / miss / error events</text>
<text class="member" x="1280" y="1350" text-anchor="start">+ per-key Mutex on misses</text>
</g>
<g id="jcache" class="classBox orange">
<rect x="1836" y="1160" width="372" height="192" rx="12" />
<text class="stereo" x="2022" y="1194" text-anchor="middle">&lt;&lt;external&gt;&gt;</text>
<text class="classTitle" x="2022" y="1230" text-anchor="middle">javax.cache.Cache&lt;K,V&gt;</text>
<line class="divider" x1="1836" y1="1252" x2="2208" y2="1252" />
<text class="member" x="1864" y="1285" text-anchor="start">+ containsKey(key)</text>
<text class="member" x="1864" y="1314" text-anchor="start">+ get(key) / put(key, value)</text>
<text class="member" x="1864" y="1343" text-anchor="start">blocking provider boundary</text>
</g>
