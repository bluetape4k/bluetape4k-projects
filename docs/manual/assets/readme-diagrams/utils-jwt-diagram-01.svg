  <rect x="140" y="916" width="50" height="50" rx="12" fill="#7C3AED"/><rect x="145" y="925" width="34" height="26" rx="5" fill="none" stroke="#fff" stroke-width="3"/><circle cx="154" cy="938" r="2.8" fill="#fff"/><circle cx="162" cy="938" r="2.8" fill="#fff"/><circle cx="170" cy="938" r="2.8" fill="#fff"/>
  <text class="kicker" x="214" y="928">parse(jwtString)</text>
  <text class="cardTitle" x="214" y="958">Incoming JWT</text>
  <text class="detail" x="214" y="992">same compact JWS</text>
  <text class="detail" x="214" y="1015">header exposes kid + alg</text>
  <text class="detail" x="214" y="1038">claims require signature</text>
</g>
