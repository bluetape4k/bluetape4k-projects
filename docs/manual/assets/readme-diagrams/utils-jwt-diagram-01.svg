  <text class="cardTitle" x="734" y="953">currentJwtParser()</text>
  <text class="detail" x="734" y="987">ConcurrentHashMap cache</text>
  <text class="detail" x="734" y="1010">jjwt parser instance</text>
  <text class="detail" x="734" y="1033">built with key locator</text>
  <text class="detail" x="734" y="1056">DEF/GZIP supported</text>
</g>
