ight="140" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><rect class="icon" x="434" y="1028" width="48" height="48" rx="8" fill="#fff" stroke="#7C3AED"/><text class="iconText" x="458" y="1060" text-anchor="middle" fill="#7C3AED">K</text><text class="cardTitle" x="502" y="1045">Coroutine Boundary</text><text class="body" x="502" y="1078">withSessionSuspending</text><text class="body" x="502" y="1102">withTransactionSuspending</text><text class="body" x="502" y="1126">CancellationException rethrow</text></g><g><rect class="card" x="1060" y="1000" width="500" height="140" rx="8" fill="#ECFDF5" stroke="#16A34A"/><rect class="icon" x="1084" y="1028" width="48" height="48" rx="8" fill="#fff" stroke="#16A34A"/><text class="iconText" x="1108" y="1060" text-anchor="middle" fill="#16A34A">T</text><text class="cardTitle" x="1152" y="1045">Tenant + Transaction Scope</text><text class="body" x="1152" y="1078">tenant overloads</text><text class="body" x="1152" y="1102">session + transaction callbacks</text><text class="body" x="1152" y="1126">stateless transaction helpers</text></g><g><rect class="card" x="1640" y="1000" width="300" height="140" rx="8" fill="#F8FAFC" stroke="#64748B"/><rect class="icon" x="1664" y="1028" width="48" height="48" rx="8" fill="#fff" stroke="#64748B"/><text class="iconText" x="1688" y="1060" text-anchor="middle" fill="#64748B">R</text><text class="cardTitle" x="1732" y="1045">Reactive Runtime</text><text class="body" x="1732" y="1078">Vert.x dispatcher</text><text class="body" x="1732" y="1102">non-blocking DB I/O</text><text class="body" x="1732" y="1126">Hibernate Reactive</text></g></svg>