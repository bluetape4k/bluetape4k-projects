<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" role="img" aria-label="JUnit5 Mermaid report sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 5 L 0 10 Z" fill="#3B82F6"/></marker>
  <marker id="arrowGreen" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 5 L 0 10 Z" fill="#16A34A"/></marker>
  <marker id="arrowPurple" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 5 L 0 10 Z" fill="#7C3AED"/></marker>
  <marker id="arrowOrange" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 5 L 0 10 Z" fill="#D97706"/></marker>
  <marker id="arrowTeal" markerWidth="13" markerHeight="10" refX="12" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 5 L 0 10 Z" fill="#0D9488"/></marker>
  <marker id="arrowReturn" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 0 0 L 11 5 L 0 10 Z" fill="#64748B" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .participant{stroke-width:1.9;filter:url(#shadow)}.pblue{fill:#EFF6FF;stroke:#3B82F6}.ppurple{fill:#F5F3FF;stroke:#7C3AED}.pgreen{fill:#F0FDF4;stroke:#16A34A}.porange{fill:#FFFBEB;stroke:#D97706}.pteal{fill:#F0FDFA;stroke:#0D9488}
    .ptext{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}.psub{font-family:"Comic Mono";font-size:12px;fill:#64748B}
    .lifeline{stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:7 7}
    .activation{fill:#FFFFFF;stroke-width:1.6;rx:5}.actBlue{stroke:#3B82F6}.actGreen{stroke:#16A34A}.actPurple{stroke:#7C3AED}.actOrange{stroke:#D97706}.actTeal{stroke:#0D9488}
    .region{fill:#FFFFFF;stroke-width:1.8;stroke-dasharray:8 7;rx:10}.regionTest{fill:#DBEAFE;fill-opacity:.12;stroke:#3B82F6}.regionFinish{fill:#FEF3C7;fill-opacity:.13;stroke:#D97706}
    .regionLabel{font-family:"Comic Mono";font-size:12px;fill:#475569}
    .callBlue{stroke:#3B82F6;marker-end:url(#arrowBlue)}.callGreen{stroke:#16A34A;marker-end:url(#arrowGreen)}.callPurple{stroke:#7C3AED;marker-end:url(#arrowPurple)}.callOrange{stroke:#D97706;marker-end:url(#arrowOrange)}.callTeal{stroke:#0D9488;marker-end:url(#arrowTeal)}
    .message{fill:none;stroke-width:3.0;stroke-linecap:round}.return{fill:none;stroke:#64748B;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;marker-end:url(#arrowReturn)}
    .badge{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2;rx:7}.num{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#FFFFFF}.numCircle{stroke:#FFFFFF;stroke-width:2}.label{font-family:"Comic Mono";font-size:13px;fill:#334155}
  </style>
</defs>
<rect class="canvas" width="1800" height="1020"/>
<rect class="frame" x="30" y="28" width="1740" height="940" rx="6"/>
<text class="title" x="72" y="82">Mermaid Report Sequence</text>
<text class="subtitle" x="76" y="116">JUnit Platform callbacks collect per-test tasks, then render a Mermaid Gantt chart when the test plan finishes.</text>

<g id="participants">
  <rect class="participant pblue" x="120" y="160" width="260" height="82" rx="8"/>
  <text class="ptext" x="250" y="197" text-anchor="middle">JUnit Platform</text>
  <text class="psub" x="250" y="219" text-anchor="middle">TestExecutionListener callbacks</text>

  <rect class="participant ppurple" x="450" y="160" width="340" height="82" rx="8"/>
  <text class="ptext" x="620" y="197" text-anchor="middle">MermaidTestExecutionListener</text>
  <text class="psub" x="620" y="219" text-anchor="middle">filters tests and formats output</text>

  <rect class="participant pgreen" x="840" y="160" width="250" height="82" rx="8"/>
  <text class="ptext" x="965" y="197" text-anchor="middle">Task Map</text>
  <text class="psub" x="965" y="219" text-anchor="middle">ConcurrentHashMap&lt;uniqueId, Task&gt;</text>

  <rect class="participant porange" x="1170" y="160" width="260" height="82" rx="8"/>
  <text class="ptext" x="1300" y="197" text-anchor="middle">Gantt Builder</text>
  <text class="psub" x="1300" y="219" text-anchor="middle">toMermaidGanttChart(tasks)</text>

  <rect class="participant pteal" x="1490" y="160" width="240" height="82" rx="8"/>
  <text class="ptext" x="1610" y="197" text-anchor="middle">Printer / Console</text>
  <text class="psub" x="1610" y="219" text-anchor="middle">configured printer sink</text>
</g>

<line class="lifeline" x1="250" y1="242" x2="250" y2="910"/>
<line class="lifeline" x1="620" y1="242" x2="620" y2="910"/>
<line class="lifeline" x1="965" y1="242" x2="965" y2="910"/>
<line class="lifeline" x1="1300" y1="242" x2="1300" y2="910"/>
<line class="lifeline" x1="1610" y1="242" x2="1610" y2="910"/>

<rect class="region regionTest" x="82" y="270" width="1038" height="312" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/>
<rect class="badge" x="106" y="260" width="170" height="24"/>
<text class="regionLabel" x="122" y="277">only when isTest</text>
<rect class="region regionFinish" x="430" y="604" width="1235" height="315" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/>
<rect class="badge" x="1268" y="594" width="182" height="24"/>
<text class="regionLabel" x="1284" y="611">after plan finishes</text>

<rect class="activation actPurple" x="612" y="292" width="16" height="86"/>
<rect class="activation actGreen" x="957" y="350" width="16" height="42"/>
<rect class="activation actPurple" x="612" y="442" width="16" height="116"/>
<rect class="activation actGreen" x="957" y="512" width="16" height="52"/>
<rect class="activation actPurple" x="612" y="612" width="16" height="288"/>
<rect class="activation actGreen" x="957" y="670" width="16" height="58"/>
<rect class="activation actOrange" x="1292" y="780" width="16" height="58"/>
<rect class="activation actTeal" x="1602" y="872" width="16" height="42"/>

<path class="message callBlue" d="M250 310 L620 310"/>
<rect class="badge" x="300" y="282" width="276" height="28"/>
<circle class="numCircle" cx="320" cy="296" r="13" fill="#3B82F6"/><text class="num" x="320" y="301" text-anchor="middle">1</text>
<text class="label" x="356" y="301">executionStarted(testIdentifier)</text>

<path class="message callGreen" d="M620 370 L965 370"/>
<rect class="badge" x="678" y="342" width="230" height="28"/>
<circle class="numCircle" cx="698" cy="356" r="13" fill="#16A34A"/><text class="num" x="698" y="361" text-anchor="middle">2</text>
<text class="label" x="734" y="361">put Task(startTime)</text>

<path class="message callBlue" d="M250 460 L620 460"/>
<rect class="badge" x="306" y="432" width="250" height="28"/>
<circle class="numCircle" cx="326" cy="446" r="13" fill="#3B82F6"/><text class="num" x="326" y="451" text-anchor="middle">3</text>
<text class="label" x="362" y="451">executionFinished(result)</text>

<path class="message callGreen" d="M620 532 L965 532"/>
<rect class="badge" x="662" y="504" width="284" height="28"/>
<circle class="numCircle" cx="682" cy="518" r="13" fill="#16A34A"/><text class="num" x="682" y="523" text-anchor="middle">4</text>
<text class="label" x="718" y="523">compute endTime + status</text>

<path class="message callPurple" d="M250 632 L620 632"/>
<rect class="badge" x="298" y="604" width="284" height="28"/>
<circle class="numCircle" cx="318" cy="618" r="13" fill="#7C3AED"/><text class="num" x="318" y="623" text-anchor="middle">5</text>
<text class="label" x="354" y="623">testPlanExecutionFinished()</text>

<path class="message callGreen" d="M620 694 L965 694"/>
<rect class="badge" x="725" y="666" width="150" height="28"/>
<circle class="numCircle" cx="745" cy="680" r="13" fill="#16A34A"/><text class="num" x="745" y="685" text-anchor="middle">6</text>
<text class="label" x="781" y="685">values()</text>

<path class="return" d="M965 738 L620 738" style="marker-end:none"/>
<polygon points="632,732 620,738 632,744" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<rect class="badge" x="744" y="710" width="132" height="28"/>
<circle class="numCircle" cx="764" cy="724" r="13" fill="#64748B"/><text class="num" x="764" y="729" text-anchor="middle">7</text>
<text class="label" x="800" y="729">tasks</text>

<path class="message callOrange" d="M620 800 L1300 800"/>
<rect class="badge" x="816" y="772" width="318" height="28"/>
<circle class="numCircle" cx="836" cy="786" r="13" fill="#D97706"/><text class="num" x="836" y="791" text-anchor="middle">8</text>
<text class="label" x="872" y="791">toMermaidGanttChart(tasks)</text>

<path class="return" d="M1300 850 L620 850" style="marker-end:none"/>
<polygon points="632,844 620,850 632,856" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<rect class="badge" x="896" y="822" width="228" height="28"/>
<circle class="numCircle" cx="916" cy="836" r="13" fill="#64748B"/><text class="num" x="916" y="841" text-anchor="middle">9</text>
<text class="label" x="952" y="841">Mermaid Gantt text</text>

<path class="message callTeal" d="M620 894 L1610 894"/>
<rect class="badge" x="962" y="866" width="306" height="28"/>
<circle class="numCircle" cx="982" cy="880" r="13" fill="#0D9488"/><text class="num" x="982" y="885" text-anchor="middle">10</text>
<text class="label" x="1024" y="885">print completion + gantt</text>
</svg>
