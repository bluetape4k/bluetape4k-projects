<rect class="canvas" width="1540" height="1160"/>
<rect class="frame" x="34" y="30" width="1472" height="1100" rx="8"/>
<text class="title" x="72" y="84">Spring Boot Observability Demo Architecture</text>
<text class="subtitle" x="76" y="116">The demo records HTTP and order-event observations locally, then Spring Boot Actuator exposes Prometheus metrics while OTLP tracing remains optional.</text>
<g><rect class="panel" x="82" y="160" width="1376" height="190" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">HTTP entry</text></g>
<g><rect class="panel" x="82" y="415" width="1376" height="200" rx="8"/><text class="panelTitle" x="110" y="451" dominant-baseline="middle">Application work</text></g>
<g><rect class="panel" x="82" y="680" width="1376" height="220" rx="8"/><text class="panelTitle" x="110" y="716" dominant-baseline="middle">Observation model</text></g>
<g><rect class="panel" x="82" y="960" width="1376" height="130" rx="8"/><text class="panelTitle" x="110" y="996" dominant-baseline="middle">Export endpoints</text></g>
<g id="client">
  <rect class="card" x="170" y="235" width="320" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="330" y="258" text-anchor="middle" dominant-baseline="middle">HTTP client</text>
  <text class="detail" x="330" y="288" text-anchor="middle" dominant-baseline="middle">POST /orders/{id}/events</text>
  <text class="detail" x="330" y="306" text-anchor="middle" dominant-baseline="middle">optional X-Request-Id</text>
</g>
<g id="controller">
  <rect class="card" x="600" y="230" width="360" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="780" y="258" text-anchor="middle" dominant-baseline="middle">OrderEventController</text>
  <text class="detail" x="780" y="288" text-anchor="middle" dominant-baseline="middle">Spring MVC route</text>
  <text class="detail" x="780" y="306" text-anchor="middle" dominant-baseline="middle">delegates to service</text>
</g>
<g id="health">
  <rect class="card" x="1065" y="235" width="300" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1215" y="267" text-anchor="middle" dominant-baseline="middle">Actuator / health</text>
  <text class="detail" x="1215" y="297" text-anchor="middle" dominant-baseline="middle">Spring Boot owned endpoint</text>
</g>
<g id="service">
  <rect class="card" x="600" y="490" width="360" height="92" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="780" y="520" text-anchor="middle" dominant-baseline="middle">OrderEventService</text>
  <text class="detail" x="780" y="550" text-anchor="middle" dominant-baseline="middle">creates EventTelemetry</text>
  <text class="detail" x="780" y="568" text-anchor="middle" dominant-baseline="middle">returns accepted JSON</text>
</g>
<g id="observeSpring">
  <rect class="card" x="180" y="760" width="340" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="350" y="790" text-anchor="middle" dominant-baseline="middle">observeSpring</text>
  <text class="detail" x="350" y="820" text-anchor="middle" dominant-baseline="middle">orders.http.publish</text>
  <text class="detail" x="350" y="838" text-anchor="middle" dominant-baseline="middle">HTTP/service boundary</text>
</g>
<g id="registry">
  <rect class="card" x="600" y="760" width="340" height="92" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="770" y="790" text-anchor="middle" dominant-baseline="middle">ObservationRegistry</text>
  <text class="detail" x="770" y="820" text-anchor="middle" dominant-baseline="middle">Micrometer handlers</text>
  <text class="detail" x="770" y="838" text-anchor="middle" dominant-baseline="middle">metrics and optional spans</text>
</g>
<g id="eventTelemetry">
  <rect class="card" x="1030" y="760" width="340" height="92" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1200" y="790" text-anchor="middle" dominant-baseline="middle">EventTelemetry</text>
  <text class="detail" x="1200" y="820" text-anchor="middle" dominant-baseline="middle">event.publish</text>
  <text class="detail" x="1200" y="838" text-anchor="middle" dominant-baseline="middle">event.consume</text>
</g>
<g id="prometheus">
  <rect class="card" x="365" y="1010" width="350" height="66" rx="8" fill="#FFF7ED" stroke="#EA580C"/><image data-bluetape4k-icon="testcontainers/infra/prometheus.svg" x="385" y="1027" width="32" height="32" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text class="cardTitle" x="560" y="1036" text-anchor="middle" dominant-baseline="middle">Actuator Prometheus</text>
  <text class="detail" x="540" y="1066" text-anchor="middle" dominant-baseline="middle">/actuator/prometheus</text>
</g>
<g id="otlp">
  <rect class="card" x="825" y="1010" width="350" height="66" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1000" y="1036" text-anchor="middle" dominant-baseline="middle">Optional OTLP traces</text>
  <text class="detail" x="1000" y="1066" text-anchor="middle" dominant-baseline="middle">configured by Spring properties</text>
</g>
