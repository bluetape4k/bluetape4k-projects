<path class="route dashed" data-from="controller" data-to="health" d="M960 274 L1065 274" stroke="#7E22CE"/>
<polygon points="1053,280 1065,274 1053,268" fill="#7E22CE" stroke="#7E22CE" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" data-from="controller" data-to="service" d="M780 318 L780 490" stroke="#0F766E" marker-end="url(#seqArrow-teal)"/>
<path class="route" data-from="service" data-to="observeSpring" d="M 695 582 L 695 636 Q 695 650 681 650 L 364 650 Q 350 650 350 664 L 350 760" stroke="#0F766E" marker-end="url(#seqArrow-teal)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="route" data-from="service" data-to="eventTelemetry" d="M 865 582 L 865 636 Q 865 650 879 650 L 1186 650 Q 1200 650 1200 664 L 1200 760" stroke="#15803D" marker-end="url(#seqArrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="route" data-from="observeSpring" data-to="registry" d="M520 806 L600 806" stroke="#7E22CE" marker-end="url(#seqArrow-purple)"/>
<path class="route" data-from="eventTelemetry" data-to="registry" d="M1030 806 L940 806" stroke="#15803D" marker-end="url(#seqArrow-green)"/>
<path class="route" data-from="registry" data-to="prometheus" d="M 710 852 L 710 911 Q 710 925 696 925 L 554 925 Q 540 925 540 939 L 540 1010" stroke="#C2410C" marker-end="url(#seqArrow-amber)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="route dashed" data-from="registry" data-to="otlp" d="M 830 852 L 830 916 Q 830 930 844 930 L 986 930 Q 1000 930 1000 944 L 1000 1010" stroke="#7E22CE" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="994,998 1000,1010 1006,998" fill="#7E22CE" stroke="#7E22CE" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
</svg>
