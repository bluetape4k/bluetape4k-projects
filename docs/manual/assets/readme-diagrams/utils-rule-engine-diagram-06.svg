<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="880" viewBox="0 0 2300 880" role="img" aria-label="rule engine selection guide"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle,.detail{font-family:"Comic Mono";fill:#475569}.subtitle{font-size:15.5px}.scenario{font-family:"Comic Mono";font-size:15px;fill:#475569}.choice{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}.detail{font-size:14px}.row{stroke-width:1.9;filter:url(#softShadow)}.divider{stroke-width:1.1;opacity:.42}</style></defs><rect class="canvas" width="2300" height="880"/><rect class="frame" x="34" y="30" width="2232" height="816" rx="8"/><text class="title" x="74" y="88">Rule Engine Selection Guide</text><text class="subtitle" x="78" y="121">Choose the smallest rule-engine shape that matches execution semantics; composite groups are still single Rule instances to the engine.</text><g><rect class="row" x="105" y="210" width="650" height="245" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="scenario" x="133" y="258">Need ordinary sync rules</text><text class="choice" x="133" y="310">DefaultRuleEngine</text><path class="divider" d="M105 334H755" stroke="#2563EB"/><text class="detail" x="133" y="374">RuleSet + Facts, listeners, skip policies</text><text class="detail" x="133" y="402">Stops by priority threshold or configured skip flags</text></g><g><rect class="row" x="835" y="210" width="650" height="245" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="scenario" x="863" y="258">Need suspend rules</text><text class="choice" x="863" y="310">DefaultSuspendRuleEngine</text><path class="divider" d="M835 334H1485" stroke="#0D9488"/><text class="detail" x="863" y="374">Coroutine API, cancellation-safe checks</text><text class="detail" x="863" y="402">Rethrows CancellationException instead of swallowing it</text></g><g><rect class="row" x="1565" y="210" width="650" height="245" rx="8" fill="#FAF5FF" stroke="#7C3AED"/><text class="scenario" x="1593" y="258">Need fact chaining</text><text class="choice" x="1593" y="310">InferenceRuleEngine</text><path class="divider" d="M1565 334H2215" stroke="#7C3AED"/><text class="detail" x="1593" y="374">Select matching rules, execute, then re-evaluate</text><text class="detail" x="1593" y="402">Use when actions can unlock later rules</text></g><g><rect class="row" x="105" y="525" width="650" height="245" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="scenario" x="133" y="573">Exclusive child rules</text><text class="choice" x="133" y="625">ActivationRuleGroup</text><path class="divider" d="M105 649H755" stroke="#16A34A"/><text class="detail" x="133" y="689">First evaluated child wins</text><text class="detail" x="133" y="717">Use for mutually exclusive alternatives</text></g><g><rect class="row" x="835" y="525" width="650" height="245" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="scenario" x="863" y="573">Prerequisite gate</text><text class="choice" x="863" y="625">ConditionalRuleGroup</text><path class="divider" d="M835 649H1485" stroke="#EA580C"/><text class="detail" x="863" y="689">Highest-priority child gates dependent matches</text><text class="detail" x="863" y="717">Use when one rule must pass before the rest</text></g><g><rect class="row" x="1565" y="525" width="650" height="245" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="scenario" x="1593" y="573">All children must pass</text><text class="choice" x="1593" y="625">UnitRuleGroup</text><path class="divider" d="M1565 649H2215" stroke="#64748B"/><text class="detail" x="1593" y="689">All evaluate() calls pass before any action</text><text class="detail" x="1593" y="717">Use for required rule bundles</text></g></svg>