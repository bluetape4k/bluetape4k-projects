  <rect x="128" y="276" width="48" height="48" rx="12" fill="#2563EB"/><path d="M134 296 H162" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <text class="cardTitle" x="202" y="306">Inputs</text>
  <text class="detail" x="202" y="342">Number or MonetaryAmount</text>
  <text class="detail" x="202" y="366">currency code / Locale</text>
  <text class="detail" x="202" y="390">Money vs FastMoney choice</text>
</g>
<g id="currency">
  <rect class="card" x="560" y="250" width="340" height="185" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <rect x="578" y="276" width="48" height="48" rx="12" fill="#64748B"/><text x="598" y="306" text-anchor="middle" font-family="Comic Mono" font-size="28" font-weight="700" fill="#FFFFFF">$</text>
  <text class="cardTitle" x="652" y="306">Currency lookup</text>
  <text class="detail" x="652" y="342">currencyUnitOf(...)</text>
  <text class="detail" x="652" y="366">ConcurrentHashMap cache</text>
  <text class="detail" x="652" y="390">KRW / USD / EUR / CNY / JPY</text>
</g>
<g id="create">
  <rect class="card" x="1010" y="250" width="380" height="185" rx="8" fill="#ECFDF5" stroke="#16A34A"/>
  <rect x="1028" y="276" width="48" height="48" rx="12" fill="#16A34A"/><path d="M 1033 286 L 1053 286 Q 1063 286 1063 296 L 1063 308 L 1033 308 Z M 1040 278 L 1056 278" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="1102" y="306">Amount factories</text>
  <text class="detail" x="1102" y="342">moneyOf -&gt; Money</text>
  <text class="detail" x="1102" y="366">fastMoneyOf -&gt; FastMoney</text>
  <text class="detail" x="1102" y="390">monetaryAmountOf -&gt; default factory</text>
</g>
<g id="arithmetic">
