  <rect x="1538" y="276" width="48" height="48" rx="12" fill="#0D9488"/><path d="M1544 296 H1572 M1558 282 V310" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><circle cx="1572" cy="310" r="3" fill="#FFFFFF"/>
  <text class="cardTitle" x="1612" y="306">Local operations</text>
  <text class="detail" x="1612" y="342">+  -  *  /  unary -</text>
  <text class="detail" x="1612" y="366">numberValue properties</text>
  <text class="detail" x="1612" y="390">same-currency arithmetic</text>
</g>
