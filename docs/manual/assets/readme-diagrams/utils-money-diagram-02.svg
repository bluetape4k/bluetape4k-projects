<g class="edgeLabel" transform="translate(1243 787)"><rect width="84" height="30" rx="8"/><text x="42" y="20" text-anchor="middle">rounded</text></g>
<g class="edgeLabel" transform="translate(1572 800)"><rect width="66" height="30" rx="8"/><text x="33" y="20" text-anchor="middle">total</text></g></g>
<g id="inputs">
