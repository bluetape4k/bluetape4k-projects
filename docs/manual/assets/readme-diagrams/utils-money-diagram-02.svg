<g class="edgeLabel" transform="translate(901 300)"><rect width="108" height="30" rx="8"/><text x="54" y="20" text-anchor="middle">CurrencyUnit</text></g>
<g class="edgeLabel" transform="translate(1387 300)"><rect width="136" height="30" rx="8"/><text x="68" y="20" text-anchor="middle">Money/FastMoney</text></g>
