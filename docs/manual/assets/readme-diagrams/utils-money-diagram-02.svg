  <rect x="578" y="581" width="48" height="48" rx="12" fill="#EA580C"/><path d="M 582 593 L 614 593 L 606 585 L 614 593 L 609.2 597.8 Q 606 601 609.01 604.38 L 610.8 606.4 Q 614 610 609.18 610 L 582 610 L 590 602 L 582 610 L 590 618" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="652" y="611">Exchange conversion</text>
  <text class="detail" x="652" y="647">convertTo(code/unit)</text>
  <text class="detail" x="652" y="671">CurrencyConvertor cache</text>
  <text class="detail" x="652" y="695">MonetaryConversions</text>
</g>
<g id="providers">
  <rect class="card" x="110" y="555" width="340" height="170" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <rect x="128" y="581" width="48" height="48" rx="12" fill="#9333EA"/><path d="M130 609 H163 C170 609, 170 597, 161 597 C158 584, 140 586, 139 597 C128 595, 124 609, 130 609 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <text class="cardTitle" x="202" y="611">Rate providers</text>
  <text class="detail" x="202" y="647">ECB</text>
  <text class="detail" x="202" y="671">IMF</text>
  <text class="detail" x="202" y="695">availability checks</text>
</g>
<g id="aggregation">
  <rect class="card" x="1520" y="555" width="360" height="170" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <rect x="1538" y="581" width="48" height="48" rx="12" fill="#DB2777"/><path d="M1545 587 H1572 L1556 601 L1572 615 H1545" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="1612" y="611">Aggregation</text>
  <text class="detail" x="1612" y="647">Collection&lt;MonetaryAmount&gt;.sum()</text>
  <text class="detail" x="1612" y="671">empty -&gt; zero amount</text>
  <text class="detail" x="1612" y="695">convert each item to target</text>
</g>
<g id="result">
