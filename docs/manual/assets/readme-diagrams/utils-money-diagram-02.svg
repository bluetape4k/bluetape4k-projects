<style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}.lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4;stroke-dasharray:10 8}.laneTitle{font-family:"Comic Mono";font-size:13px;fill:#475569}.card{filter:url(#softShadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13.4px;fill:#475569}.edge{fill:none;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.2px;fill:#475569}</style></defs>
<rect class="canvas" width="2040" height="1100"/><rect class="frame" x="38" y="30" width="1964" height="1034" rx="8"/>
<text class="title" x="78" y="88">Currency Operation Flow</text>
<text class="subtitle" x="82" y="120">From currency lookup to amount creation, local arithmetic, rounding, aggregation, and provider-backed exchange conversion.</text>
<rect class="lane" x="30" y="205" width="1930" height="555" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/><text class="laneTitle" x="108" y="232">operations provided by bluetape4k-money</text>
