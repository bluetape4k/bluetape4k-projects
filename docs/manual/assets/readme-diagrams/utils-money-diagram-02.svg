  <text class="cardTitle" x="1102" y="611">Rounding</text>
  <text class="detail" x="1102" y="647">round(currency rule)</text>
  <text class="detail" x="1102" y="671">defaultRound()</text>
  <text class="detail" x="1102" y="695">returns same amount type</text>
</g>
<g id="conversion">
