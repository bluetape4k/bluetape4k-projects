  <rect x="438" y="901" width="48" height="48" rx="12" fill="#64748B"/><path d="M443 921 L453 931 L475 909" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cardTitle" x="538" y="931">Result</text>
  <text class="detail" x="538" y="967">A typed MonetaryAmount in the requested currency, rounded or converted according to JSR-354 provider rules.</text>
</g>
