<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-okio compression factory</title>
  <desc id="desc">Compressable factory diagram showing algorithm presets, Source decompression layer, Sink compression layer, one-shot wrappers, streaming wrappers, and close/read contracts.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .factory-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .source-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .sink-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .choice-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .factory-card { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .source-card { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-card { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .stream-card { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .safety-card { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowPurple { fill: none; stroke: #8870a8; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .flowRed { fill: none; stroke: #b65f68; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
      .source-icon { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-icon { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .icon-line-green { fill: none; stroke: #5d7b63; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-line-gold { fill: none; stroke: #a2743d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#8870a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1032" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-okio Compression Factory</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">Compressable splits factory shortcuts into Source decompression and Sink compression wrappers.</text>

  <rect x="72" y="150" width="1656" height="204" rx="16" class="factory-panel"/>
  <text x="102" y="190" class="panel-title">Factory Layer</text>
  <text x="102" y="218" class="small">Compressable exposes named algorithm shortcuts and typed overloads for one-shot Compressor or StreamingCompressor.</text>

  <rect x="170" y="252" width="360" height="72" rx="7" class="factory-card" filter="url(#softShadow)"/>
  <text x="350" y="281" text-anchor="middle" class="class-title">Compressable.Sources</text>
  <text x="350" y="306" text-anchor="middle" class="member">deflate, gzip, lz4, snappy, zstd, bzip2</text>

  <rect x="570" y="252" width="660" height="72" rx="7" class="factory-card" filter="url(#softShadow)"/>
  <text x="900" y="281" text-anchor="middle" class="class-title">Compressors presets</text>
  <text x="900" y="306" text-anchor="middle" class="member">Deflate / GZip / LZ4 / Snappy / Zstd / BZip2</text>

  <rect x="1270" y="252" width="360" height="72" rx="7" class="factory-card" filter="url(#softShadow)"/>
  <text x="1450" y="281" text-anchor="middle" class="class-title">Compressable.Sinks</text>
  <text x="1450" y="306" text-anchor="middle" class="member">deflate, gzip, lz4, snappy, zstd, bzip2</text>

  <rect x="72" y="400" width="806" height="398" rx="16" class="source-panel"/>
  <g transform="translate(828 418)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="source-icon"/>
    <path d="M -9 -5 H 4 M 4 -5 L -1 -10 M 4 -5 L -1 0" class="icon-line-green"/>
    <path d="M -10 8 H 10" class="icon-line-green"/>
  </g>
  <text x="102" y="440" class="panel-title">Source Layer: decompress while reading</text>
  <text x="102" y="468" class="small">A compressed okio.Source becomes a DecompressableSource.</text>
  <text x="102" y="492" class="small">Streaming mode reads through the compressor stream incrementally.</text>

  <rect x="136" y="532" width="334" height="124" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="303" y="563" text-anchor="middle" class="class-title">DecompressableSource</text>
  <line x1="136" y1="583" x2="470" y2="583" class="sep"/>
  <text x="164" y="609" class="member">Compressor overload</text>
  <text x="164" y="631" class="member">loads compressed bytes once</text>

  <rect x="518" y="532" width="320" height="124" rx="7" class="stream-card" filter="url(#softShadow)"/>
  <text x="678" y="563" text-anchor="middle" class="class-title">StreamingDecompressSource</text>
  <line x1="518" y1="583" x2="838" y2="583" class="sep"/>
  <text x="546" y="609" class="member">StreamingCompressor overload</text>
  <text x="546" y="631" class="member">returns chunks per read call</text>

  <rect x="262" y="706" width="450" height="62" rx="7" class="safety-card" filter="url(#softShadow)"/>
  <text x="487" y="732" text-anchor="middle" class="class-title">Read guard</text>
  <text x="487" y="755" text-anchor="middle" class="member">0-byte progress loops fail after bounded retries</text>

  <rect x="922" y="400" width="806" height="398" rx="16" class="sink-panel"/>
  <g transform="translate(1678 418)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="sink-icon"/>
    <path d="M -4 5 H 9 M 9 5 L 4 0 M 9 5 L 4 10" class="icon-line-gold"/>
    <path d="M -10 -8 H 10" class="icon-line-gold"/>
  </g>
  <text x="952" y="440" class="panel-title">Sink Layer: compress while writing</text>
  <text x="952" y="468" class="small">A plain okio.Sink becomes a CompressableSink.</text>
  <text x="952" y="492" class="small">One-shot mode buffers writes and finalizes output on close().</text>

  <rect x="986" y="532" width="334" height="124" rx="7" class="sink-card" filter="url(#softShadow)"/>
  <text x="1153" y="563" text-anchor="middle" class="class-title">CompressableSink</text>
  <line x1="986" y1="583" x2="1320" y2="583" class="sep"/>
  <text x="1014" y="609" class="member">Compressor overload</text>
  <text x="1014" y="631" class="member">buffers writes until close()</text>

  <rect x="1368" y="532" width="320" height="124" rx="7" class="stream-card" filter="url(#softShadow)"/>
  <text x="1528" y="563" text-anchor="middle" class="class-title">StreamingCompressSink</text>
  <line x1="1368" y1="583" x2="1688" y2="583" class="sep"/>
  <text x="1396" y="609" class="member">StreamingCompressor overload</text>
  <text x="1396" y="631" class="member">writes chunks before close()</text>

  <rect x="1112" y="706" width="450" height="62" rx="7" class="safety-card" filter="url(#softShadow)"/>
  <text x="1337" y="732" text-anchor="middle" class="class-title">Close boundary</text>
  <text x="1337" y="755" text-anchor="middle" class="member">use close() or use { } to finish compressed bytes</text>

  <rect x="98" y="850" width="1604" height="104" rx="14" class="choice-panel"/>
  <text x="128" y="884" class="panel-title">Reader choice</text>
  <text x="128" y="914" class="small">Use one-shot wrappers for bounded payloads where whole-buffer compression is acceptable.</text>
  <text x="128" y="938" class="small">Use streaming wrappers for large or unknown payloads where read/write progress should happen incrementally.</text>

  <path d="M 350 324 V 400" class="flowGreen"/>
  <path d="M 1450 324 V 400" class="flowGold"/>
  <path d="M 303 656 L 303 671.6 Q 303 682 313.4 682 L 477 682 Q 487 682 487 692 L 487 706" class="flowGreen"/>
  <path d="M 678 656 L 678 671.6 Q 678 682 667.6 682 L 497 682 Q 487 682 487 692 L 487 706" class="flowPurple"/>
  <path d="M 1153 656 L 1153 671.6 Q 1153 682 1163.4 682 L 1327 682 Q 1337 682 1337 692 L 1337 706" class="flowGold"/>
  <path d="M 1528 656 L 1528 671.6 Q 1528 682 1517.6 682 L 1347 682 Q 1337 682 1337 692 L 1337 706" class="flowPurple"/>

  <path d="M 487 768 L 487 810 Q 487 824 501 824 L 890 824 Q 900 824 900 834 L 900 850" class="flowRed"/>
  <path d="M 1337 768 L 1337 810 Q 1337 824 1323 824 L 910 824 Q 900 824 900 834 L 900 850" class="flowRed"/>
</svg>
