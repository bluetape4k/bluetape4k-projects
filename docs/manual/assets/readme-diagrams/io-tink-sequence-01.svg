<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">AEAD Encrypt/Decrypt Flow</title>
  <desc id="desc">Sequence showing TinkAeadEncryptor delegating String and byte encryption to TinkAead and the Google Tink Aead primitive with associated-data authentication.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .msg, .note, .role, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 17px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .participant { font-family: "Architects Daughter"; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #e6f2ec; stroke: #5b7e67; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; marker-end: url(#arrowCall); }
      .crypto { fill: none; stroke: #6e8f4f; stroke-width: 3.2; marker-end: url(#arrowCrypto); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .fail { fill: none; stroke: #b86868; stroke-width: 3.2; marker-end: url(#arrowFail); }
      .alt { fill: #ffffff; fill-opacity: .12; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
      .divider { stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 8; }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .callLabel { stroke: #9cc2d1; }
      .cryptoLabel { stroke: #b6c9a4; }
      .returnLabel { stroke: #c8b38f; }
      .failLabel { stroke: #d9abab; }
      .branchOk { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.8; }
      .branchFail { fill: #fff5f5; stroke: #b86868; stroke-width: 1.8; }
      .badge { stroke-width: 1.8; }
      .callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .cryptoBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .failBadge { fill: #fff0f0; stroke: #b86868; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .callText, .badgeText.callText { fill: #2f6f8e; }
      .cryptoText, .badgeText.cryptoText { fill: #55783f; }
      .returnText, .badgeText.returnText { fill: #7f6038; }
      .failText, .badgeText.failText { fill: #9d4f4f; }
      .footer { font-size: 14px; fill: #60727d; }

    /* sequence-style: spring-boot-cassandra-sequence-01 */
    .title{font-family:"Architects Daughter";fill:#263238}.subtitle,.msg,.note,.footer,.detail,.role{font-family:"Comic Mono";fill:#36464f}.subtitle{font-size:16px}text.participant,.cardTitle{font-family:"Architects Daughter";fill:#1f3138}.role{fill:#546a73}.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}.inner,.panel{fill:#ffffff;stroke:#d7e0e4;stroke-width:2}.header,.card{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}.actor{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}rect.participant{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#e6f2ec!important;stroke:#5b7e67!important;stroke-width:1.5}.seq,.call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.work,.crypto{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.async{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn,.return{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}.fail,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.alt,.altBox{fill:#eef7f0;fill-opacity:.12;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider,.branchDivider{stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 8}rect.label,.labelPill,.pill{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.workLabel,.cryptoLabel{stroke:#b6c9a4}.returnLabel{stroke:#c8b38f}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.workBadge,.cryptoBadge{fill:#eef7f0;stroke:#6e8f4f}.returnBadge{fill:#fff7e8;stroke:#9b7d54}.asyncBadge{fill:#f3ecff;stroke:#7c5aa6}.failBadge{fill:#fff0f0;stroke:#b86868}text.label{font-family:"Comic Mono";font-size:14px;font-weight:700;stroke:none}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText{fill:#2f6f8e}.workText,.cryptoText{fill:#55783f}.returnText{fill:#7f6038}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}.footer{fill:#60727d}
  </style>
    <marker id="arrowCall" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowCrypto" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowReturn" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowFail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">AEAD Encrypt/Decrypt Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">String wrappers convert UTF-8/Base64; the Tink Aead primitive authenticates ciphertext with the same associated data.</text>

  <g>
    <rect x="80" y="150" width="170" height="68" rx="10" class="header"/>
    <text x="165" y="179" text-anchor="middle" class="participant">Caller</text>
    <text x="165" y="201" text-anchor="middle" class="role">application code</text>
    <rect x="392" y="150" width="244" height="68" rx="10" class="header"/>
    <text x="514" y="179" text-anchor="middle" class="participant">TinkAeadEncryptor</text>
    <text x="514" y="201" text-anchor="middle" class="role">TinkEncryptor impl</text>
    <rect x="775" y="150" width="190" height="68" rx="10" class="header"/>
    <text x="870" y="179" text-anchor="middle" class="participant">TinkAead</text>
    <text x="870" y="201" text-anchor="middle" class="role">Kotlin wrapper</text>
    <rect x="1162" y="150" width="230" height="68" rx="10" class="header"/>
    <text x="1277" y="179" text-anchor="middle" class="participant">Google Tink Aead</text>
    <text x="1277" y="201" text-anchor="middle" class="role">primitive + keyset</text>
  </g>

  <line x1="165" y1="218" x2="165" y2="980" class="lifeline"/>
  <line x1="514" y1="218" x2="514" y2="980" class="lifeline"/>
  <line x1="870" y1="218" x2="870" y2="980" class="lifeline"/>
  <line x1="1277" y1="218" x2="1277" y2="980" class="lifeline"/>
  <rect x="507" y="300" width="14" height="568" rx="6" class="activation"/>
  <rect x="863" y="382" width="14" height="430" rx="6" class="activation"/>
  <rect x="1270" y="470" width="14" height="250" rx="6" class="activation"/>

  <rect x="88" y="262" width="386" height="34" rx="17" class="label callLabel"/>
  <circle cx="112" cy="279" r="13" class="badge callBadge"/><text fill="#2f6f8e" x="112" y="284" text-anchor="middle" class="badgeText callText">1</text>
  <text x="136" y="284" class="msg callText">encrypt(String or ByteArray, associatedData)</text>
  <path d="M 165 318 L 514 318" class="call"/>

  <rect x="430" y="344" width="386" height="34" rx="17" class="label callLabel"/>
  <circle cx="454" cy="361" r="13" class="badge callBadge"/><text fill="#2f6f8e" x="454" y="366" text-anchor="middle" class="badgeText callText">2</text>
  <text x="478" y="366" class="msg callText">delegate to TinkAead; String uses UTF-8 bytes</text>
  <path d="M 514 400 L 870 400" class="call"/>

  <rect x="816" y="432" width="368" height="34" rx="17" class="label cryptoLabel"/>
  <circle cx="840" cy="449" r="13" class="badge cryptoBadge"/><text fill="#55783f" x="840" y="454" text-anchor="middle" class="badgeText cryptoText">3</text>
  <text x="864" y="454" class="msg cryptoText">aead.encrypt(plainBytes, associatedData)</text>
  <path d="M 870 488 L 1277 488" class="crypto"/>

  <rect x="858" y="536" width="386" height="34" rx="17" class="label returnLabel"/>
  <circle cx="882" cy="553" r="13" class="badge returnBadge"/><text fill="#7f6038" x="882" y="558" text-anchor="middle" class="badgeText returnText">4</text>
  <text x="906" y="558" class="msg returnText">cipherBytes include nonce, ciphertext, and tag</text>
  <path d="M 1277 598 L 870 598" class="return"/>

  <rect x="430" y="628" width="360" height="34" rx="17" class="label returnLabel"/>
  <circle cx="454" cy="645" r="13" class="badge returnBadge"/><text fill="#7f6038" x="454" y="650" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="478" y="650" class="msg returnText">String API Base64-encodes the ciphertext</text>
  <path d="M 870 688 L 514 688" class="return"/>

  <rect x="160" y="724" width="282" height="34" rx="17" class="label returnLabel"/>
  <circle cx="184" cy="741" r="13" class="badge returnBadge"/><text fill="#7f6038" x="184" y="746" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="208" y="746" class="msg returnText">Base64 String or raw ciphertext</text>
  <path d="M 514 784 L 165 784" class="return"/>

  <rect x="78" y="816" width="1344" height="180" rx="14" class="alt"/>
  <rect x="102" y="834" width="248" height="30" rx="15" class="branchOk"/>
  <text x="122" y="854" class="note">decrypt path uses the same associated data</text>
  <rect x="102" y="914" width="292" height="30" rx="15" class="branchFail"/>
  <text x="122" y="934" class="note">else tag mismatch, tamper, or wrong key</text>
  <line x1="78" y1="898" x2="1422" y2="898" class="divider"/>

  <rect x="452" y="842" width="520" height="34" rx="17" class="label cryptoLabel"/>
  <circle cx="476" cy="859" r="13" class="badge cryptoBadge"/><text fill="#55783f" x="476" y="864" text-anchor="middle" class="badgeText cryptoText">7</text>
  <text x="500" y="864" class="msg cryptoText">Base64 decode if needed; aead.decrypt(cipherBytes, associatedData)</text>
  <path d="M 870 888 L 1277 888" class="crypto"/>

  <rect x="472" y="926" width="422" height="34" rx="17" class="label failLabel"/>
  <circle cx="496" cy="943" r="13" class="badge failBadge"/><text fill="#9d4f4f" x="496" y="948" text-anchor="middle" class="badgeText failText">8</text>
  <text x="520" y="948" class="msg failText">GeneralSecurityException; no plaintext returned</text>
  <path d="M 1277 978 L 514 978" class="fail"/>

  <rect x="98" y="1008" width="1404" height="44" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="2"/>
  <text x="118" y="1036" class="note">For rotation, VersionedTinkAead encrypts with current() and prepends the keyset version; decrypt reads that version and calls find(version).</text>
  <text x="800" y="1088" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/tink README</text>
</svg>
