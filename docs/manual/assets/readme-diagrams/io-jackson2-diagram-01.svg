  <rect x="24" y="24" width="1752" height="1172" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-jackson2 Class Structure</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">Kotlin mapper defaults sit at the center; serializers, streaming parsers, and field annotations are separate extension surfaces.</text>

  <rect x="72" y="150" width="510" height="842" rx="16" class="core-panel"/>
  <text x="102" y="190" class="panel-title">Core mapper and JSON serializer</text>
  <text x="102" y="218" class="small">Shared JsonMapper defaults plus the JsonSerializer adapter.</text>

  <rect x="138" y="278" width="348" height="128" rx="7" class="mapper" filter="url(#softShadow)"/>
  <text x="312" y="310" text-anchor="middle" class="class-title">Jackson</text>
  <line x1="138" y1="330" x2="486" y2="330" class="sep"/>
  <text x="162" y="356" class="member">defaultJsonMapper / pretty writer</text>
  <text x="162" y="378" class="member">createTypedJsonMapper(allow-list)</text>

  <rect x="138" y="508" width="348" height="126" rx="7" class="api" filter="url(#softShadow)"/>
  <text x="312" y="540" text-anchor="middle" class="class-title">JsonSerializer</text>
  <line x1="138" y1="560" x2="486" y2="560" class="sep"/>
  <text x="162" y="586" class="member">+ serialize(graph): ByteArray</text>
  <text x="162" y="608" class="member">+ deserialize(bytes, clazz)</text>

  <rect x="138" y="840" width="348" height="126" rx="7" class="serializer" filter="url(#softShadow)"/>
  <text x="312" y="872" text-anchor="middle" class="class-title">JacksonSerializer</text>
  <line x1="138" y1="892" x2="486" y2="892" class="sep"/>
  <text x="162" y="918" class="member">uses ObjectMapper.writeAsBytes</text>
  <text x="162" y="940" class="member">throws JsonSerializationException</text>

  <rect x="640" y="150" width="540" height="842" rx="16" class="format-panel"/>
  <text x="670" y="190" class="panel-title">Format serializer families</text>
  <text x="670" y="218" class="small">Lazy mapper, factory, and serializer triplets by format.</text>

  <rect x="730" y="282" width="360" height="118" rx="7" class="mapper" filter="url(#softShadow)"/>
  <text x="910" y="314" text-anchor="middle" class="class-title">ObjectMapper extensions</text>
  <line x1="730" y1="334" x2="1090" y2="334" class="sep"/>
  <text x="754" y="360" class="member">readValueOrNull from text, stream, file</text>
  <text x="754" y="382" class="member">writeAsString / writeAsBytes helpers</text>

  <rect x="674" y="492" width="228" height="144" rx="7" class="format" filter="url(#softShadow)"/>
  <text x="788" y="524" text-anchor="middle" class="class-title">JacksonBinary</text>
  <line x1="674" y1="544" x2="902" y2="544" class="sep"/>
  <text x="698" y="570" class="member">CBOR, Ion, Smile</text>
  <text x="698" y="592" class="member">default mapper/factory</text>
  <text x="698" y="614" class="member">format serializers</text>

  <rect x="922" y="492" width="228" height="144" rx="7" class="format" filter="url(#softShadow)"/>
  <text x="1036" y="524" text-anchor="middle" class="class-title">JacksonText</text>
  <line x1="922" y1="544" x2="1150" y2="544" class="sep"/>
  <text x="946" y="570" class="member">CSV, Props, TOML, YAML</text>
  <text x="946" y="592" class="member">default mapper/factory</text>
  <text x="946" y="614" class="member">text serializers</text>

  <rect x="674" y="746" width="228" height="110" rx="7" class="serializer" filter="url(#softShadow)"/>
  <text x="788" y="778" text-anchor="middle" class="class-title">Binary serializers</text>
  <line x1="674" y1="798" x2="902" y2="798" class="sep"/>
  <text x="698" y="824" class="member">Cbor / Ion / Smile</text>
  <text x="698" y="846" class="member">extend JacksonSerializer</text>

  <rect x="922" y="746" width="228" height="110" rx="7" class="serializer" filter="url(#softShadow)"/>
  <text x="1036" y="778" text-anchor="middle" class="class-title">Text serializers</text>
  <line x1="922" y1="798" x2="1150" y2="798" class="sep"/>
  <text x="946" y="824" class="member">Csv / Props / Toml / Yaml</text>
  <text x="946" y="846" class="member">string oriented formats</text>

  <rect x="1238" y="150" width="490" height="842" rx="16" class="feature-panel"/>
  <text x="1268" y="190" class="panel-title">Streaming and field-level features</text>
  <text x="1268" y="218" class="small">Chunked JSON roots and field annotations stay separate.</text>

  <rect x="1298" y="278" width="360" height="132" rx="7" class="async" filter="url(#softShadow)"/>
  <text x="1478" y="310" text-anchor="middle" class="class-title">AsyncJsonParser</text>
  <line x1="1298" y1="330" x2="1658" y2="330" class="sep"/>
  <text x="1322" y="356" class="member">callback ByteArray chunks</text>
  <text x="1322" y="378" class="member">endOfInput validates truncated JSON</text>

  <rect x="1298" y="470" width="360" height="132" rx="7" class="async" filter="url(#softShadow)"/>
  <text x="1478" y="502" text-anchor="middle" class="class-title">SuspendJsonParser</text>
  <line x1="1298" y1="522" x2="1658" y2="522" class="sep"/>
  <text x="1322" y="548" class="member">Flow&lt;ByteArray&gt; pipelines</text>
  <text x="1322" y="570" class="member">consumeComplete sends EOF</text>

  <rect x="1298" y="664" width="360" height="126" rx="7" class="annotation" filter="url(#softShadow)"/>
  <text x="1478" y="696" text-anchor="middle" class="class-title">UUID module</text>
  <line x1="1298" y1="716" x2="1658" y2="716" class="sep"/>
  <text x="1322" y="742" class="member">@JsonUuidEncoder</text>
  <text x="1322" y="764" class="member">Base62 serializer/deserializer</text>

  <rect x="1298" y="838" width="360" height="110" rx="7" class="annotation" filter="url(#softShadow)"/>
  <text x="1478" y="870" text-anchor="middle" class="class-title">Field annotations</text>
  <line x1="1298" y1="890" x2="1658" y2="890" class="sep"/>
  <text x="1322" y="916" class="member">@JsonTinkEncrypt encrypts fields</text>
  <text x="1322" y="938" class="member">@JsonMasker writes masked values</text>

  <rect x="92" y="1034" width="1616" height="82" rx="14" class="rule-panel"/>
  <text x="122" y="1066" class="panel-title">Reader contract</text>
  <text x="122" y="1094" class="small">Pick Jackson.defaultJsonMapper for JSON, JacksonBinary or JacksonText for explicit formats, Async/Suspend parsers for chunked streams, and annotations for field-only representation changes.</text>

  <path d="M 312 840 L 312 634" class="realize" style="marker-end:none"/>
<polygon points="318,646 312,634 306,646" fill="#455a64" stroke="#455a64" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect x="334" y="724" width="90" height="24" rx="12" fill="#ffffff" stroke="#d7e0e4"/>
  <text x="379" y="741" text-anchor="middle" class="label">implements</text>

  <path d="M 312 406 L 312 508" class="usesBlue" style="marker-end:none"/>
<polyline points="306,496 312,508 318,496" fill="none" stroke="#4b74a5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 788 856 V 903" class="inheritBus"/>
  <path d="M 1036 856 V 903" class="inheritBus"/>
  <path d="M 1036 903 H 486" class="extends"/>

