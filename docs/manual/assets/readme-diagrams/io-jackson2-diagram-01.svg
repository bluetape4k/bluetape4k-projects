<polyline points="718,348 730,342 718,336" fill="none" stroke="#4b74a5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 910 400 L 910 442 Q 910 456 896 456 L 802 456 Q 788 456 788 470 L 788 492" class="usesGreen" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="782,480 788,492 794,480" fill="none" stroke="#5d7b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 910 400 L 910 442 Q 910 456 924 456 L 1022 456 Q 1036 456 1036 470 L 1036 492" class="usesGreen" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1030,480 1036,492 1042,480" fill="none" stroke="#5d7b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 788 636 L 788 746" class="flowBlue"/>
  <path d="M 1036 636 L 1036 746" class="flowBlue"/>

  <path d="M 1180 344 L 1230 344 L 1230 344 L 1298 344" class="usesGold" style="marker-end:none"/>
<polyline points="1286,350 1298,344 1286,338" fill="none" stroke="#a2743d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1180 536 L 1230 536 L 1230 536 L 1298 536" class="usesGold" style="marker-end:none"/>
<polyline points="1286,542 1298,536 1286,530" fill="none" stroke="#a2743d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1180 726 L 1226 726 Q 1230 726 1230 730 L 1230 723 Q 1230 727 1234 727 L 1298 727" class="usesRed" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1286,733 1298,727 1286,721" fill="none" stroke="#b65f68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1180 868 L 1220 868 Q 1230 868 1230 878 L 1230 883 Q 1230 893 1240 893 L 1298 893" class="usesRed" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1286,899 1298,893 1286,887" fill="none" stroke="#b65f68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <text x="900" y="1158" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/jackson2 README</text>
</svg>
