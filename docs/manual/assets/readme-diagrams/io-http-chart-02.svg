<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title desc">
  <title id="title">HTTP client high-latency benchmark throughput</title>
  <desc id="desc">Equal-thread WebFlux fixture snapshot for GET /httpbin/delay/0.05. OkHttp virtual threads lead at 1902.171 ops/s, Ktor CIO records 1515.026 ops/s.</desc>
  <rect width="1040" height="690" fill="#ffffff"/>
  <text x="40" y="42" font-family="Architects Daughter, Comic Mono" font-size="24" font-weight="700" fill="#172033">HTTP client high-latency throughput</text>
  <text x="40" y="70" font-family="Comic Mono" font-size="14" fill="#526070">WebFlux fixture, @Threads(100), warmup 1x1s, measurement 1x1s, ops/s higher is better</text>
  <line x1="280" y1="552" x2="980" y2="552" stroke="#d6dbe4" stroke-width="1"/>
  <line x1="280" y1="105" x2="280" y2="552" stroke="#d6dbe4" stroke-width="1"/>
  <text x="280" y="578" font-family="Comic Mono" font-size="12" fill="#6b7280">0</text>
  <text x="449" y="578" font-family="Comic Mono" font-size="12" fill="#6b7280">500</text>
  <text x="617" y="578" font-family="Comic Mono" font-size="12" fill="#6b7280">1,000</text>
  <text x="792" y="578" font-family="Comic Mono" font-size="12" fill="#6b7280">1,500</text>
  <text x="956" y="578" font-family="Comic Mono" font-size="12" fill="#6b7280">2,000</text>

  <text x="40" y="120" font-family="Comic Mono" font-size="13" fill="#172033">OkHttp3 VirtualThread</text>
  <rect x="280" y="104" width="666" height="20" rx="3" fill="#2563eb"/>
  <text x="956" y="120" font-family="Comic Mono" font-size="12" fill="#172033">1,902.171</text>

  <text x="40" y="156" font-family="Comic Mono" font-size="13" fill="#172033">HC5 Classic VirtualThread</text>
  <rect x="280" y="140" width="661" height="20" rx="3" fill="#2563eb"/>
  <text x="951" y="156" font-family="Comic Mono" font-size="12" fill="#172033">1,888.018</text>

  <text x="40" y="192" font-family="Comic Mono" font-size="13" fill="#172033">JDK VirtualThread</text>
  <rect x="280" y="176" width="659" height="20" rx="3" fill="#2563eb"/>
  <text x="949" y="192" font-family="Comic Mono" font-size="12" fill="#172033">1,883.634</text>

  <text x="40" y="228" font-family="Comic Mono" font-size="13" fill="#172033">HC5 Classic</text>
  <rect x="280" y="212" width="658" height="20" rx="3" fill="#2563eb"/>
  <text x="948" y="228" font-family="Comic Mono" font-size="12" fill="#172033">1,880.023</text>

  <text x="40" y="264" font-family="Comic Mono" font-size="13" fill="#172033">OkHttp3 Sync</text>
  <rect x="280" y="248" width="655" height="20" rx="3" fill="#2563eb"/>
  <text x="945" y="264" font-family="Comic Mono" font-size="12" fill="#172033">1,870.124</text>

  <text x="40" y="300" font-family="Comic Mono" font-size="13" fill="#172033">JDK Sync</text>
  <rect x="280" y="284" width="653" height="20" rx="3" fill="#2563eb"/>
  <text x="943" y="300" font-family="Comic Mono" font-size="12" fill="#172033">1,865.997</text>

  <text x="40" y="336" font-family="Comic Mono" font-size="13" fill="#172033">JDK Coroutines</text>
  <rect x="280" y="320" width="652" height="20" rx="3" fill="#059669"/>
  <text x="942" y="336" font-family="Comic Mono" font-size="12" fill="#172033">1,863.948</text>

  <text x="40" y="372" font-family="Comic Mono" font-size="13" fill="#172033">HC5 Async Coroutines</text>
  <rect x="280" y="356" width="651" height="20" rx="3" fill="#059669"/>
  <text x="941" y="372" font-family="Comic Mono" font-size="12" fill="#172033">1,860.655</text>

  <text x="40" y="408" font-family="Comic Mono" font-size="13" fill="#172033">Vert.x WebClient Coroutines</text>
  <rect x="280" y="392" width="651" height="20" rx="3" fill="#059669"/>
  <text x="941" y="408" font-family="Comic Mono" font-size="12" fill="#172033">1,859.003</text>

  <text x="40" y="444" font-family="Comic Mono" font-size="13" fill="#172033">OkHttp3 Coroutines</text>
  <rect x="280" y="428" width="650" height="20" rx="3" fill="#059669"/>
  <text x="940" y="444" font-family="Comic Mono" font-size="12" fill="#172033">1,856.895</text>

  <text x="40" y="480" font-family="Comic Mono" font-size="13" fill="#172033">Ktor CIO Coroutines</text>
  <rect x="280" y="464" width="530" height="20" rx="3" fill="#dc2626"/>
  <text x="820" y="480" font-family="Comic Mono" font-size="12" fill="#172033">1,515.026</text>

  <text x="40" y="516" font-family="Comic Mono" font-size="13" fill="#172033">HC5 Classic Coroutines</text>
  <rect x="280" y="500" width="426" height="20" rx="3" fill="#f59e0b"/>
  <text x="716" y="516" font-family="Comic Mono" font-size="12" fill="#172033">1,216.306</text>

  <rect x="40" y="602" width="960" height="58" rx="12" fill="#f8fafc" stroke="#d8e0ea" stroke-width="1"/>
  <text x="520" y="623" text-anchor="middle" font-family="Comic Mono" font-size="11" fill="#6b7280">Source: io/http README high-latency WebFlux benchmark snapshot for GET /httpbin/delay/0.05</text>
  <text x="520" y="645" text-anchor="middle" font-family="Comic Mono" font-size="11" fill="#6b7280">Unit/direction: ops/s, higher is better; equal-thread delayed fixture emphasizes latency hiding, not raw client overhead.</text>
</svg>
