<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1080" viewBox="0 0 1760 1080" role="img" aria-label="Feign + Coroutines Integration Architecture">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg {
        font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif;
      }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#soft-shadow); }
      .title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 44px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 16px; fill: #475569; }
      .lane { stroke-width: 1.7; }
      .lane-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 27px; fill: #0f172a; }
      .lane-sub { font-family: "Comic Mono", monospace; font-size: 13.5px; fill: #64748b; }
      .card { stroke-width: 1.8; filter: url(#soft-shadow); }
      .card-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 22px; fill: #0f172a; }
      .card-sub { font-family: "Comic Mono", monospace; font-size: 12.8px; fill: #475569; }
      .tag { font-family: "Comic Mono", monospace; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .sync-flow { fill: none; stroke: #2563eb; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .async-flow { fill: none; stroke: #7c3aed; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .label { font-family: "Comic Mono", monospace; font-size: 12px; fill: #475569; }
      .legend { font-family: "Comic Mono", monospace; font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1080"/>
  <rect class="frame" x="36" y="30" width="1688" height="1020" rx="8"/>
  <text class="title" x="78" y="86">Feign + Coroutines Integration Architecture</text>
  <text class="subtitle" x="82" y="118">A user-declared REST interface is materialized through either the sync Feign builder or the coroutine builder.</text>

  <g id="sync-lane">
    <rect class="lane" x="82" y="160" width="1596" height="310" rx="8" fill="#DBEAFE" stroke="#bfdbfe" fill-opacity="1"/>
    <text class="lane-title" x="116" y="205">Synchronous client path</text>
    <text class="lane-sub" x="118" y="232">Use for ordinary blocking interface methods where the caller owns the request thread.</text>

    <g transform="translate(118 284)">
      <rect class="card" width="230" height="106" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">API interface</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">@RequestLine methods</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">dynamic URI allowed</text>
    </g>
    <g transform="translate(420 284)">
      <rect class="card" width="250" height="106" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <text class="card-title" x="125" y="36" text-anchor="middle">feignBuilderOf</text>
      <text class="card-sub" x="125" y="64" text-anchor="middle">client / encoder / decoder</text>
      <text class="card-sub" x="125" y="84" text-anchor="middle">options + log level</text>
    </g>
    <g transform="translate(742 284)">
      <rect class="card" width="240" height="106" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text class="card-title" x="120" y="36" text-anchor="middle">Feign.Builder</text>
      <text class="card-sub" x="120" y="64" text-anchor="middle">target&lt;T&gt;(baseUrl)</text>
      <text class="card-sub" x="120" y="84" text-anchor="middle">EmptyTarget for dynamic URL</text>
    </g>
    <g transform="translate(1054 284)">
      <rect class="card" width="250" height="106" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text class="card-title" x="125" y="36" text-anchor="middle">Sync transport</text>
      <text class="card-sub" x="125" y="64" text-anchor="middle">ApacheHttp5Client</text>
      <text class="card-sub" x="125" y="84" text-anchor="middle">VertxHttpClient guarded</text>
    </g>
    <g transform="translate(1380 284)">
      <rect class="card" width="230" height="106" rx="8" fill="#ffffff" stroke="#2563eb"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">Remote HTTP API</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">request / response</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">decoded result</text>
    </g>

    <path class="sync-flow" d="M 348 337 L 410 337"/>
    <path class="sync-flow" d="M 670 337 L 732 337"/>
    <path class="sync-flow" d="M 982 337 L 1044 337"/>
    <path class="sync-flow" d="M 1304 337 L 1370 337"/>
  </g>

  <g id="async-lane">
    <rect class="lane" x="82" y="510" width="1596" height="310" rx="8" fill="#EDE9FE" stroke="#ddd6fe" fill-opacity="1"/>
    <text class="lane-title" x="116" y="555">Coroutine client path</text>
    <text class="lane-sub" x="118" y="582">Use for suspend functions backed by AsyncClient and CompletableFuture completion.</text>

    <g transform="translate(118 634)">
      <rect class="card" width="230" height="106" rx="8" fill="#ffffff" stroke="#7c3aed"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">Suspend API</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">suspend fun methods</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">CoroutineFeign target</text>
    </g>
    <g transform="translate(420 634)">
      <rect class="card" width="250" height="106" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
      <text class="card-title" x="125" y="36" text-anchor="middle">coroutineBuilderOf</text>
      <text class="card-sub" x="125" y="64" text-anchor="middle">AsyncClient + codecs</text>
      <text class="card-sub" x="125" y="84" text-anchor="middle">default virtual-thread async</text>
    </g>
    <g transform="translate(742 634)">
      <rect class="card" width="240" height="106" rx="8" fill="#ffffff" stroke="#7c3aed"/>
      <text class="card-title" x="120" y="36" text-anchor="middle">CoroutineBuilder</text>
      <text class="card-sub" x="120" y="64" text-anchor="middle">target&lt;T&gt;(baseUrl)</text>
      <text class="card-sub" x="120" y="84" text-anchor="middle">suspend adapter</text>
    </g>
    <g transform="translate(1054 634)">
      <rect class="card" width="250" height="106" rx="8" fill="#ffffff" stroke="#7c3aed"/>
      <text class="card-title" x="125" y="36" text-anchor="middle">Async transport</text>
      <text class="card-sub" x="125" y="64" text-anchor="middle">AsyncApacheHttp5Client</text>
      <text class="card-sub" x="125" y="84" text-anchor="middle">AsyncVertxHttpClient</text>
    </g>
    <g transform="translate(1380 634)">
      <rect class="card" width="230" height="106" rx="8" fill="#ffffff" stroke="#7c3aed"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">Remote HTTP API</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">CompletableFuture</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">suspend result</text>
    </g>

    <path class="async-flow" d="M 348 687 L 410 687"/>
    <path class="async-flow" d="M 670 687 L 732 687"/>
    <path class="async-flow" d="M 982 687 L 1044 687"/>
    <path class="async-flow" d="M 1304 687 L 1370 687"/>
  </g>

  <g id="shared-support">
    <rect class="lane" x="250" y="858" width="1260" height="126" rx="8" fill="#E5E7EB" stroke="#cbd5e1" fill-opacity="1"/>
    <text class="lane-title" x="286" y="900">Shared support</text>
    <g transform="translate(516 890)">
      <rect class="card" width="250" height="62" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
      <text class="card-title" x="125" y="25" text-anchor="middle">Encoder / Decoder</text>
      <text class="card-sub" x="125" y="47" text-anchor="middle">Jackson or Fastjson2</text>
    </g>
    <g transform="translate(824 890)">
      <rect class="card" width="250" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
      <text class="card-title" x="125" y="25" text-anchor="middle">Request helpers</text>
      <text class="card-sub" x="125" y="47" text-anchor="middle">options, headers, body</text>
    </g>
    <g transform="translate(1132 890)">
      <rect class="card" width="250" height="62" rx="8" fill="#fff7ed" stroke="#ea580c"/>
      <text class="card-title" x="125" y="25" text-anchor="middle">Response helpers</text>
      <text class="card-sub" x="125" y="47" text-anchor="middle">isJsonBody, bodyAsReader</text>
    </g>
  </g>

  <g transform="translate(128 1010)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="4.5" marker-end="url(#arrow-blue)"/>
    <text class="legend" x="50" y="5">sync Feign path</text>
    <line x1="220" y1="0" x2="254" y2="0" stroke="#7c3aed" stroke-width="4.5" marker-end="url(#arrow-purple)"/>
    <text class="legend" x="270" y="5">coroutine path</text>
  </g>
</svg>
