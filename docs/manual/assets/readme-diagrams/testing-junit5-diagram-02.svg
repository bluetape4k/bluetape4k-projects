<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-label="JUnit5 source-backed class structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10" /></filter>
  <marker id="useArrow" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
  <marker id="hasArrow" viewBox="0 0 18 18" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .classBox{filter:url(#shadow);stroke-width:1.8}.iface{fill:#F8FAFC;stroke:#64748B}.extension{fill:#EFF6FF;stroke:#2563EB}.helper{fill:#F0FDF4;stroke:#16A34A}.tester{fill:#FFF7ED;stroke:#D97706}.report{fill:#FAF5FF;stroke:#7C3AED}
    .divider{stroke:#CBD5E1;stroke-width:1.2}.stereo{font-family:"Comic Mono";font-size:12px;fill:#64748B}.name{font-family:"Architects Daughter";font-size:20px;fill:#0F172A}.smallName{font-family:"Architects Daughter";font-size:18px;fill:#0F172A}.member{font-family:"Comic Mono";font-size:12px;fill:#475569}
    .impl{fill:none;stroke:#64748B;stroke-width:2.3;stroke-dasharray:7 5;stroke-linecap:round;stroke-linejoin:round}
    .implHead{fill:#FFFFFF;stroke:#64748B;stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:none!important}
    .use{fill:none;stroke:#2563EB;stroke-width:2.1;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#useArrow)}
    .has{fill:none;stroke:#16A34A;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#hasArrow)}
    .legend{font-family:"Comic Mono";font-size:12px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="1800" height="1280" />
<rect class="frame" x="34" y="30" width="1732" height="1218" rx="6" />
<text class="title" x="72" y="84">JUnit5 Class Structure</text>
<text class="subtitle" x="76" y="116">Extension classes implement JUnit contracts; helpers hold captured output, fake/random values, temp folders, reports, and stress execution state.</text>

<g id="lifecycleIface">
  <rect class="classBox iface" x="80" y="160" width="300" height="128" rx="5" />
  <text class="stereo" x="230" y="188" text-anchor="middle">&lt;&lt;interfaces&gt;&gt;</text>
  <text class="smallName" x="230" y="214" text-anchor="middle">Lifecycle callbacks</text>
  <line class="divider" x1="80" y1="232" x2="380" y2="232" />
  <text class="member" x="100" y="258">BeforeAll / BeforeEach</text>
  <text class="member" x="100" y="278">AfterEach / AfterAll</text>
</g>
<g id="captureIface">
  <rect class="classBox iface" x="420" y="160" width="300" height="128" rx="5" />
  <text class="stereo" x="570" y="188" text-anchor="middle">&lt;&lt;interfaces&gt;&gt;</text>
  <text class="smallName" x="570" y="214" text-anchor="middle">Capture callbacks</text>
  <line class="divider" x1="420" y1="232" x2="720" y2="232" />
  <text class="member" x="440" y="258">BeforeEach / AfterEach</text>
  <text class="member" x="440" y="278">ParameterResolver</text>
</g>
<g id="resolverIface">
  <rect class="classBox iface" x="760" y="160" width="300" height="128" rx="5" />
  <text class="stereo" x="910" y="188" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="smallName" x="910" y="214" text-anchor="middle">ParameterResolver</text>
  <line class="divider" x1="760" y1="232" x2="1060" y2="232" />
  <text class="member" x="780" y="258">supportsParameter()</text>
  <text class="member" x="780" y="278">resolveParameter()</text>
</g>
<g id="postProcessorIface">
  <rect class="classBox iface" x="1100" y="160" width="640" height="128" rx="5" />
  <text class="stereo" x="1420" y="188" text-anchor="middle">&lt;&lt;interfaces&gt;&gt;</text>
  <text class="smallName" x="1420" y="214" text-anchor="middle">Field/parameter injection</text>
  <line class="divider" x1="1100" y1="232" x2="1740" y2="232" />
  <text class="member" x="1120" y="258">TestInstancePostProcessor</text>
  <text class="member" x="1120" y="278">ParameterResolver</text>
</g>

<g id="systemExt">
  <rect class="classBox extension" x="80" y="370" width="300" height="164" rx="5" />
  <text class="stereo" x="230" y="398" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
  <text class="name" x="230" y="426" text-anchor="middle">SystemPropertyExtension</text>
  <line class="divider" x1="80" y1="444" x2="380" y2="444" />
  <text class="member" x="100" y="470">- restoreContext key</text>
  <line class="divider" x1="80" y1="486" x2="380" y2="486" />
  <text class="member" x="100" y="512">+ beforeAll(), beforeEach()</text>
  <text class="member" x="100" y="532">+ afterEach(), afterAll()</text>
</g>
<g id="outputExt">
  <rect class="classBox extension" x="420" y="370" width="300" height="164" rx="5" />
  <text class="stereo" x="570" y="398" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
  <text class="name" x="570" y="426" text-anchor="middle">OutputCaptureExtension</text>
  <line class="divider" x1="420" y1="444" x2="720" y2="444" />
  <text class="member" x="440" y="470">- ExtensionContext store</text>
  <line class="divider" x1="420" y1="486" x2="720" y2="486" />
  <text class="member" x="440" y="512">+ beforeEach(), afterEach()</text>
  <text class="member" x="440" y="532">+ resolveParameter()</text>
</g>
<g id="tempExt">
  <rect class="classBox extension" x="760" y="370" width="300" height="164" rx="5" />
  <text class="stereo" x="910" y="398" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
  <text class="name" x="910" y="426" text-anchor="middle">TempFolderExtension</text>
  <line class="divider" x1="760" y1="444" x2="1060" y2="444" />
  <text class="member" x="780" y="470">- ParameterContext key</text>
  <line class="divider" x1="760" y1="486" x2="1060" y2="486" />
  <text class="member" x="780" y="512">+ supportsParameter()</text>
  <text class="member" x="780" y="532">+ resolveParameter()</text>
</g>
<g id="fakeExt">
  <rect class="classBox extension" x="1100" y="344" width="300" height="164" rx="5" />
  <text class="stereo" x="1250" y="372" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
  <text class="name" x="1250" y="400" text-anchor="middle">FakeValueExtension</text>
  <line class="divider" x1="1100" y1="418" x2="1400" y2="418" />
  <text class="member" x="1120" y="444">- DataFaker provider path</text>
  <line class="divider" x1="1100" y1="460" x2="1400" y2="460" />
  <text class="member" x="1120" y="486">+ postProcessTestInstance()</text>
  <text class="member" x="1120" y="506">+ resolveParameter()</text>
</g>
<g id="randomExt">
  <rect class="classBox extension" x="1440" y="344" width="300" height="164" rx="5" />
  <text class="stereo" x="1590" y="372" text-anchor="middle">&lt;&lt;extension&gt;&gt;</text>
  <text class="name" x="1590" y="400" text-anchor="middle">RandomExtension</text>
  <line class="divider" x1="1440" y1="418" x2="1740" y2="418" />
  <text class="member" x="1460" y="444">- EnhancedRandom lazy</text>
  <line class="divider" x1="1440" y1="460" x2="1740" y2="460" />
  <text class="member" x="1460" y="486">+ postProcessTestInstance()</text>
  <text class="member" x="1460" y="506">+ resolveParameter()</text>
</g>

<g id="systemHelper">
  <rect class="classBox helper" x="80" y="620" width="300" height="118" rx="5" />
  <text class="smallName" x="230" y="654" text-anchor="middle">SystemPropertyRestoreContext</text>
  <line class="divider" x1="80" y1="672" x2="380" y2="672" />
  <text class="member" x="100" y="698">+ addPropertyName()</text>
  <text class="member" x="100" y="718">+ restore()</text>
</g>
<g id="outputHelper">
  <rect class="classBox helper" x="420" y="620" width="300" height="118" rx="5" />
  <text class="smallName" x="570" y="654" text-anchor="middle">OutputCapturer</text>
  <line class="divider" x1="420" y1="672" x2="720" y2="672" />
  <text class="member" x="440" y="698">+ startCapture()</text>
  <text class="member" x="440" y="718">+ finishCapture()</text>
</g>
<g id="tempHelper">
  <rect class="classBox helper" x="760" y="620" width="300" height="118" rx="5" />
  <text class="smallName" x="910" y="654" text-anchor="middle">TempFolder</text>
  <line class="divider" x1="760" y1="672" x2="1060" y2="672" />
  <text class="member" x="780" y="698">+ createFile()</text>
  <text class="member" x="780" y="718">+ close()</text>
</g>
<g id="valueHelpers">
  <rect class="classBox helper" x="1190" y="620" width="470" height="118" rx="5" />
  <text class="smallName" x="1425" y="654" text-anchor="middle">Value providers</text>
  <line class="divider" x1="1190" y1="672" x2="1660" y2="672" />
  <text class="member" x="1210" y="698">FakeValue annotation / Fakers provider path</text>
  <text class="member" x="1210" y="718">RandomValue annotation / DefaultEnhancedRandom</text>
</g>

<g id="workerIface">
  <rect class="classBox iface" x="260" y="820" width="320" height="128" rx="5" />
  <text class="stereo" x="420" y="848" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="smallName" x="420" y="874" text-anchor="middle">WorkerStressTester&lt;SELF&gt;</text>
  <line class="divider" x1="260" y1="892" x2="580" y2="892" />
  <text class="member" x="280" y="918">+ workers(value): SELF</text>
  <text class="member" x="280" y="938">+ rounds(value): SELF</text>
</g>
<g id="multiTester">
  <rect class="classBox tester" x="80" y="1030" width="300" height="146" rx="5" />
  <text class="name" x="230" y="1066" text-anchor="middle">MultithreadingTester</text>
  <line class="divider" x1="80" y1="1084" x2="380" y2="1084" />
  <text class="member" x="100" y="1110">- ExecutorService</text>
  <text class="member" x="100" y="1130">- Future list</text>
  <line class="divider" x1="80" y1="1144" x2="380" y2="1144" />
  <text class="member" x="100" y="1168">+ add(), run()</text>
</g>
<g id="suspendedTester">
  <rect class="classBox tester" x="430" y="1030" width="300" height="146" rx="5" />
  <text class="name" x="580" y="1066" text-anchor="middle">SuspendedJobTester</text>
  <line class="divider" x1="430" y1="1084" x2="730" y2="1084" />
  <text class="member" x="450" y="1110">- suspend block list</text>
  <text class="member" x="450" y="1130">- CoroutineDispatcher</text>
  <line class="divider" x1="430" y1="1144" x2="730" y2="1144" />
  <text class="member" x="450" y="1168">+ add(), run()</text>
</g>
<g id="scopeTester">
  <rect class="classBox tester" x="780" y="1030" width="320" height="146" rx="5" />
  <text class="name" x="940" y="1066" text-anchor="middle">StructuredTaskScopeTester</text>
  <line class="divider" x1="780" y1="1084" x2="1100" y2="1084" />
  <text class="member" x="800" y="1110">- ThreadFactory / timeout</text>
  <text class="member" x="800" y="1130">- Semaphore worker cap</text>
  <line class="divider" x1="780" y1="1144" x2="1100" y2="1144" />
  <text class="member" x="800" y="1168">+ add(), withTimeout(), run()</text>
</g>

<g id="platformListeners">
  <rect class="classBox iface" x="1210" y="820" width="330" height="128" rx="5" />
  <text class="stereo" x="1375" y="848" text-anchor="middle">&lt;&lt;interfaces&gt;&gt;</text>
  <text class="smallName" x="1375" y="874" text-anchor="middle">JUnit platform listeners</text>
  <line class="divider" x1="1210" y1="892" x2="1540" y2="892" />
  <text class="member" x="1230" y="918">EngineExecutionListener</text>
  <text class="member" x="1230" y="938">TestExecutionListener</text>
</g>
<g id="recordingListener">
  <rect class="classBox report" x="1160" y="1030" width="290" height="146" rx="5" />
  <text class="name" x="1305" y="1066" text-anchor="middle">RecordingExecutionListener</text>
  <line class="divider" x1="1160" y1="1084" x2="1450" y2="1084" />
  <text class="member" x="1180" y="1110">- ConcurrentLinkedQueue</text>
  <line class="divider" x1="1160" y1="1124" x2="1450" y2="1124" />
  <text class="member" x="1180" y="1150">+ getEventsByType()</text>
  <text class="member" x="1180" y="1170">+ countEventsByType()</text>
</g>
<g id="mermaidListener">
  <rect class="classBox report" x="1480" y="1030" width="260" height="146" rx="5" />
  <text class="smallName" x="1610" y="1058" text-anchor="middle">MermaidTestExecution</text>
  <text class="smallName" x="1610" y="1080" text-anchor="middle">Listener</text>
  <line class="divider" x1="1480" y1="1084" x2="1740" y2="1084" />
  <text class="member" x="1500" y="1110">- ConcurrentHashMap</text>
  <text class="member" x="1500" y="1130">- Task model</text>
  <line class="divider" x1="1480" y1="1144" x2="1740" y2="1144" />
  <text class="member" x="1500" y="1168">+ mermaidGanttChart()</text>
</g>

