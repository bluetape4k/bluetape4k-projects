<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-label="HTTP Transport Layer Options">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" markerWidth="14" markerHeight="14" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg {
        font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif;
      }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#soft-shadow); }
      .title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 44px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", monospace; font-size: 16px; fill: #475569; }
      .axis-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 24px; fill: #0f172a; }
      .axis-sub { font-family: "Comic Mono", monospace; font-size: 13px; fill: #64748b; }
      .panel { stroke-width: 1.7; }
      .card { stroke-width: 1.8; filter: url(#soft-shadow); }
      .card-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 25px; fill: #0f172a; }
      .card-sub { font-family: "Comic Mono", monospace; font-size: 14px; fill: #475569; }
      .tag { font-family: "Comic Mono", monospace; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .flow-purple { fill: none; stroke: #7c3aed; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .label { font-family: "Comic Mono", monospace; font-size: 12px; fill: #475569; }
      .legend { font-family: "Comic Mono", monospace; font-size: 13px; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1680" height="1080"/>
  <rect class="frame" x="36" y="30" width="1608" height="1020" rx="8"/>
  <text class="title" x="78" y="86">HTTP Transport Layer Options</text>
  <text class="subtitle" x="82" y="118">Choose the Feign transport by call model first, then by Apache HC5 vs Vert.x runtime constraints.</text>

  <g transform="translate(128 168)">
    <rect class="panel" x="0" y="0" width="660" height="638" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text class="axis-title" x="36" y="48">Synchronous Feign.Builder</text>
    <text class="axis-sub" x="38" y="76">Interface methods block the caller until a Feign Response is decoded.</text>
  </g>

  <g transform="translate(892 168)">
    <rect class="panel" x="0" y="0" width="660" height="638" rx="8" fill="#faf5ff" stroke="#ddd6fe"/>
    <text class="axis-title" x="36" y="48">CoroutineFeign.CoroutineBuilder</text>
    <text class="axis-sub" x="38" y="76">Suspend APIs use AsyncClient and expose CompletableFuture-backed execution.</text>
  </g>

  <g transform="translate(176 286)">
    <rect class="card" width="560" height="190" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <rect x="0" y="0" width="560" height="48" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="0"/>
    <text class="card-title" x="28" y="34">ApacheHttp5Client</text>
    <text class="tag" x="378" y="32" fill="#1d4ed8">stable sync</text>
    <text class="card-sub" x="28" y="78">Use when request threads may block normally.</text>
    <text class="card-sub" x="28" y="104">Rich Apache HC5 configuration and retry behavior.</text>
    <text class="card-sub" x="28" y="130">Good default for ordinary synchronous API clients.</text>
    <path class="flow-blue" d="M 342 154 L 470 154"/>
    <text class="label" x="390" y="140">execute</text>
  </g>

  <g transform="translate(176 546)">
    <rect class="card" width="560" height="190" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <rect x="0" y="0" width="560" height="48" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="0"/>
    <text class="card-title" x="28" y="34">VertxHttpClient</text>
    <text class="tag" x="384" y="32" fill="#9a3412">worker only</text>
    <text class="card-sub" x="28" y="78">Wraps Vert.x HttpClient through sendAsync().</text>
    <text class="card-sub" x="28" y="104">Blocks with readTimeout while waiting for the future.</text>
    <text class="card-sub" x="28" y="130">Throws if called from a Vert.x event-loop thread.</text>
    <path class="flow-orange" d="M 338 154 L 470 154"/>
    <text class="label" x="388" y="140">guarded sync</text>
  </g>

  <g transform="translate(940 286)">
    <rect class="card" width="560" height="190" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="0" y="0" width="560" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0"/>
    <text class="card-title" x="28" y="34">AsyncApacheHttp5Client</text>
    <text class="tag" x="356" y="32" fill="#6d28d9">coroutine high-throughput</text>
    <text class="card-sub" x="28" y="78">Use with CoroutineFeign for suspend methods.</text>
    <text class="card-sub" x="28" y="104">Completes delayed responses and read-timeout failures.</text>
    <text class="card-sub" x="28" y="130">Cancellable CompletableFuture result path.</text>
    <path class="flow-purple" d="M 338 154 L 470 154"/>
    <text class="label" x="392" y="140">future</text>
  </g>

  <g transform="translate(940 546)">
    <rect class="card" width="560" height="190" rx="8" fill="#ffffff" stroke="#7c3aed"/>
    <rect x="0" y="0" width="560" height="48" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0"/>
    <text class="card-title" x="28" y="34">AsyncVertxHttpClient</text>
    <text class="tag" x="360" y="32" fill="#6d28d9">event-loop friendly</text>
    <text class="card-sub" x="28" y="78">Use inside Vert.x or other non-blocking flows.</text>
    <text class="card-sub" x="28" y="104">Returns the Vert.x sendAsync() CompletableFuture.</text>
    <text class="card-sub" x="28" y="130">Preferred Vert.x choice for coroutine clients.</text>
    <path class="flow-purple" d="M 338 154 L 470 154"/>
    <text class="label" x="386" y="140">non-blocking</text>
  </g>

  <g transform="translate(332 826)">
    <rect class="panel" width="1016" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="axis-title" x="28" y="42">Transport contract from README and tests</text>
    <text class="card-sub" x="28" y="72">Apache HC5 and Vert.x sync clients finish delayed local responses and honor read timeouts.</text>
    <text class="card-sub" x="28" y="98">Async clients complete delayed responses, fail exceptionally on read timeout, and expose cancellable futures.</text>
  </g>

  <g transform="translate(196 982)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="4.4" marker-end="url(#arrow-blue)"/>
    <text class="legend" x="50" y="5">blocking call path</text>
    <line x1="230" y1="0" x2="264" y2="0" stroke="#7c3aed" stroke-width="4.4" marker-end="url(#arrow-purple)"/>
    <text class="legend" x="280" y="5">async/coroutine path</text>
    <line x1="502" y1="0" x2="536" y2="0" stroke="#ea580c" stroke-width="3.6" marker-end="url(#arrow-orange)"/>
    <text class="legend" x="552" y="5">Vert.x sync guard</text>
  </g>
</svg>
