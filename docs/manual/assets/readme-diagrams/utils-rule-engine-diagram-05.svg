<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1480" viewBox="0 0 1780 1480" role="img" aria-label="InferenceRuleEngine forward chaining"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><marker id="arrow-input" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#1D4ED8"/></marker><marker id="arrow-loop" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#0F766E"/></marker><marker id="arrow-exec" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#6D28D9"/></marker><marker id="arrow-facts" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#15803D"/></marker><marker id="arrow-stop" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#C2410C"/></marker><marker id="arrow-out" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#475569"/></marker><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15.5px;fill:#475569}.card{stroke-width:1.9;filter:url(#softShadow)}.kicker{font-family:"Comic Mono";font-size:13px;fill:#475569}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.body{font-family:"Comic Mono";font-size:13.4px;fill:#334155}.divider{stroke-width:1.15;opacity:.45}.edge{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.edgeLabelBg{fill:#fff;stroke:#E2E8F0;stroke-width:1;opacity:.95}.edgeLabel{font-family:"Comic Mono";font-size:12.7px;fill:#334155}</style></defs><rect class="canvas" width="1780" height="1480"/><rect class="frame" x="34" y="30" width="1712" height="1416" rx="8"/><text class="title" x="74" y="88">InferenceRuleEngine Forward Chaining</text><text class="subtitle" x="78" y="121">The engine repeatedly selects currently matching rules, delegates one execution cycle, and re-evaluates until no rule remains applicable.</text><g id="edges"><path class="edge" d="M890 395 L890 480" stroke="#1D4ED8" marker-end="url(#arrow-input)"/><rect class="edgeLabelBg" x="902" y="422" width="146" height="26" rx="6"/><text class="edgeLabel" x="910" y="440">start selection</text><path class="edge" d="M890 705 L890 790" stroke="#0F766E" marker-end="url(#arrow-loop)"/><rect class="edgeLabelBg" x="902" y="732" width="130" height="26" rx="6"/><text class="edgeLabel" x="910" y="750">selectedRules</text><path class="edge" d="M890 985 L890 1070" stroke="#6D28D9" marker-end="url(#arrow-exec)"/><rect class="edgeLabelBg" x="902" y="1012" width="98" height="26" rx="6"/><text class="edgeLabel" x="910" y="1030">non-empty</text><path class="edge" d="M610 1188 L470 1188" stroke="#15803D" marker-end="url(#arrow-facts)"/><rect class="edgeLabelBg" x="478" y="1140" width="138" height="26" rx="6"/><text class="edgeLabel" x="486" y="1158">actions mutate</text><path class="edge" d="M 275 1045 L 275 599 Q 275 585 289 585 L 610 585" stroke="#15803D" marker-end="url(#arrow-facts)" stroke-linecap="round" stroke-linejoin="round"/><rect class="edgeLabelBg" x="292" y="787" width="114" height="26" rx="6"/><text class="edgeLabel" x="300" y="805">re-evaluate</text><path class="edge" d="M1140 887 L1260 887" stroke="#C2410C" marker-end="url(#arrow-stop)"/><rect class="edgeLabelBg" x="1160" y="840" width="94" height="26" rx="6"/><text class="edgeLabel" x="1168" y="858">empty</text></g><g id="cards"><g id="start"><rect class="card" x="610" y="190" width="560" height="205" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="kicker" x="634" y="224">entrypoint</text><text class="cardTitle" x="634" y="260">InferenceRuleEngine.fire()</text><path class="divider" d="M610 284H1170" stroke="#1D4ED8"/><text class="body" x="634" y="320">accepts RuleSet + Facts</text><text class="body" x="634" y="345">keeps DefaultRuleEngine delegate</text><text class="body" x="634" y="370">starts with all configured rules</text></g><g id="select"><rect class="card" x="610" y="480" width="560" height="225" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="kicker" x="634" y="514">evaluation pass</text><text class="cardTitle" x="634" y="550">selectCandidates()</text><path class="divider" d="M610 574H1170" stroke="#0F766E"/><text class="body" x="634" y="610">evaluate every rule against current Facts</text><text class="body" x="634" y="635">keep only rules that return true</text><text class="body" x="634" y="660">TreeSet preserves priority order</text></g><g id="any"><rect class="card" x="640" y="790" width="500" height="195" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="kicker" x="664" y="824">loop condition</text><text class="cardTitle" x="664" y="860">any candidates?</text><path class="divider" d="M640 884H1140" stroke="#C2410C"/><text class="body" x="664" y="920">empty set stops the chain</text><text class="body" x="664" y="945">non-empty set executes one cycle</text></g><g id="fire"><rect class="card" x="610" y="1070" width="560" height="235" rx="8" fill="#FAF5FF" stroke="#7C3AED"/><text class="kicker" x="634" y="1104">execution pass</text><text class="cardTitle" x="634" y="1140">delegate.doFire()</text><path class="divider" d="M610 1164H1170" stroke="#6D28D9"/><text class="body" x="634" y="1200">wrap selected rules as RuleSet</text><text class="body" x="634" y="1225">execute selected rules in priority order</text><text class="body" x="634" y="1250">actions mutate the same Facts</text></g><g id="facts"><rect class="card" x="80" y="1045" width="390" height="245" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="kicker" x="104" y="1079">working memory</text><text class="cardTitle" x="104" y="1115">Facts changes</text><path class="divider" d="M80 1139H470" stroke="#15803D"/><text class="body" x="104" y="1175">new or changed facts may satisfy more rules</text><text class="body" x="104" y="1200">same Facts instance flows into next cycle</text><text class="body" x="104" y="1225">no snapshot is created</text></g><g id="done"><rect class="card" x="1260" y="790" width="390" height="220" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="kicker" x="1284" y="824">terminal state</text><text class="cardTitle" x="1284" y="860">no candidates remain</text><path class="divider" d="M1260 884H1650" stroke="#475569"/><text class="body" x="1284" y="920">last Facts state is the result</text><text class="body" x="1284" y="945">engine returns to caller</text><text class="body" x="1284" y="970">check() still delegates once</text></g></g></svg>