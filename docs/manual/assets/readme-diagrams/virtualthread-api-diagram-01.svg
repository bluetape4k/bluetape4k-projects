<text class="title" x="72" y="84">virtualthread-api Class Structure</text>
<text class="subtitle" x="76" y="116">The API module owns facades, contracts, scope abstractions, and ScopedValue context helpers; JDK modules implement the SPI.</text>

<text class="section" x="92" y="176">Runtime selection contracts</text>
<g id="VirtualThreads"><rect class="card" x="120" y="210" width="340" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="stereo" x="290" y="238" text-anchor="middle">object facade</text><text class="className" x="290" y="268" text-anchor="middle">VirtualThreads</text><line class="divider" x1="140" y1="286" x2="440" y2="286" /><text class="member" x="140" y="312">+ runtime()</text><text class="member" x="140" y="334">+ runtimeName()</text><text class="member" x="140" y="356">+ executorService()</text></g>
<g id="VirtualThreadRuntime"><rect class="card" x="620" y="198" width="370" height="156" rx="8" fill="#F0FDF4" stroke="#16A34A" /><text class="stereo" x="805" y="226" text-anchor="middle">interface</text><text class="className" x="805" y="256" text-anchor="middle">VirtualThreadRuntime</text><line class="divider" x1="640" y1="274" x2="970" y2="274" /><text class="member" x="640" y="300">+ runtimeName: String</text><text class="member" x="640" y="322">+ priority: Int</text><text class="member" x="640" y="344">+ threadFactory(prefix)</text></g>
<g id="RuntimeModules"><rect class="card" x="1160" y="218" width="330" height="104" rx="8" fill="#FDF2F8" stroke="#DB2777" /><text class="stereo" x="1325" y="246" text-anchor="middle">external implementations</text><text class="className" x="1325" y="276" text-anchor="middle">jdk21 / jdk25 runtime</text><text class="member" x="1325" y="304" text-anchor="middle">loaded from META-INF/services</text></g>

<text class="section" x="92" y="442">StructuredTaskScope contracts</text>
<g id="StructuredTaskScopes"><rect class="card" x="120" y="476" width="340" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="stereo" x="290" y="504" text-anchor="middle">object facade</text><text class="className" x="290" y="534" text-anchor="middle">StructuredTaskScopes</text><line class="divider" x1="140" y1="552" x2="440" y2="552" /><text class="member" x="140" y="578">+ failFast { }</text><text class="member" x="140" y="600">+ firstSuccess { }</text><text class="member" x="140" y="622">+ supervised { }</text></g>
<g id="StructuredTaskScopeProvider"><rect class="card" x="600" y="464" width="410" height="156" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="stereo" x="805" y="492" text-anchor="middle">interface</text><text class="className" x="805" y="522" text-anchor="middle">StructuredTaskScopeProvider</text><line class="divider" x1="620" y1="540" x2="990" y2="540" /><text class="member" x="620" y="566">+ withAll / withFailFast</text><text class="member" x="620" y="588">+ withAny / withFirstSuccess</text><text class="member" x="620" y="610">+ withSupervised</text></g>
<g id="ScopeContracts"><rect class="card" x="1120" y="464" width="390" height="156" rx="8" fill="#FFF7ED" stroke="#D97706" /><text class="stereo" x="1315" y="492" text-anchor="middle">interfaces</text><text class="className" x="1315" y="522" text-anchor="middle">Scope contracts</text><line class="divider" x1="1140" y1="540" x2="1490" y2="540" /><text class="member" x="1140" y="566">StructuredTaskScopeAll</text><text class="member" x="1140" y="588">StructuredTaskScopeAny</text><text class="member" x="1140" y="610">StructuredTaskScopeSupervised, Subtask</text></g>

<text class="section" x="92" y="736">ScopedValue context helpers</text>
<g id="TaskContext"><rect class="card" x="180" y="780" width="370" height="118" rx="8" fill="#FAF5FF" stroke="#9333EA" /><text class="stereo" x="365" y="808" text-anchor="middle">object</text><text class="className" x="365" y="838" text-anchor="middle">TaskContext</text><text class="member" x="365" y="866" text-anchor="middle">newKey, get, run, bind</text></g>
<g id="TaskContextBindings"><rect class="card" x="680" y="780" width="370" height="118" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="stereo" x="865" y="808" text-anchor="middle">builder</text><text class="className" x="865" y="838" text-anchor="middle">TaskContextBindings</text><text class="member" x="865" y="866" text-anchor="middle">and(...), run { }, call { }</text></g>
<g id="ScopedValue"><rect class="card" x="1180" y="780" width="300" height="118" rx="8" fill="#F8FAFC" stroke="#64748B" /><text class="stereo" x="1330" y="808" text-anchor="middle">JDK API</text><text class="className" x="1330" y="838" text-anchor="middle">ScopedValue</text><text class="member" x="1330" y="866" text-anchor="middle">immutable scoped binding</text></g>

