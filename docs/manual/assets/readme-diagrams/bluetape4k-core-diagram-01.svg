<svg data-intent="Explain bluetape4k-core as the shared foundation: caller contracts and type helpers feed value models, collections, time, codec, functional, and concurrency utilities used by other modules." data-evidence="bluetape4k/core/README.md; bluetape4k/core/src/main/kotlin/io/bluetape4k" data-source-read="bluetape4k/core/README.md; bluetape4k/core/src/main/kotlin/io/bluetape4k" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Bluetape4k Core architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="12" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#64748B"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="8"/>
<text class="title" x="72" y="84">Bluetape4k Core architecture</text>
<text class="subtitle" x="76" y="116">Core provides shared contracts and value/runtime helpers used by higher-level modules.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Caller contracts</text></g>
<g id="require">
  <rect class="card" x="146" y="256" width="280" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="286" y="291" text-anchor="middle" dominant-baseline="middle">RequireSupport</text>
  <text class="detail" x="286" y="321" text-anchor="middle" dominant-baseline="middle">typed preconditions</text>
</g>
<g id="types">
  <rect class="card" x="610" y="256" width="280" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="750" y="291" text-anchor="middle" dominant-baseline="middle">Type extensions</text>
  <text class="detail" x="750" y="321" text-anchor="middle" dominant-baseline="middle">strings, numbers, reflection</text>
</g>
<g id="codec">
  <rect class="card" x="1074" y="256" width="280" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1214" y="291" text-anchor="middle" dominant-baseline="middle">Codec utilities</text>
  <text class="detail" x="1214" y="321" text-anchor="middle" dominant-baseline="middle">Base58, Base62, Hex</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Domain value model</text></g>
<g id="range">
  <rect class="card" x="146" y="574" width="280" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="286" y="609" text-anchor="middle" dominant-baseline="middle">Range model</text>
  <text class="detail" x="286" y="639" text-anchor="middle" dominant-baseline="middle">open/closed ranges</text>
</g>
<g id="collections">
  <rect class="card" x="610" y="574" width="280" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Collection helpers</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">ring buffer, bounded stack</text>
</g>
<g id="value">
  <rect class="card" x="1074" y="574" width="280" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1214" y="609" text-anchor="middle" dominant-baseline="middle">ValueObject</text>
  <text class="detail" x="1214" y="639" text-anchor="middle" dominant-baseline="middle">stable equality contract</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Runtime helpers</text></g>
<g id="time">
  <rect class="card" x="146" y="892" width="280" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="286" y="927" text-anchor="middle" dominant-baseline="middle">Java time DSL</text>
  <text class="detail" x="286" y="957" text-anchor="middle" dominant-baseline="middle">duration and temporal ranges</text>
</g>
<g id="concurrent">
  <rect class="card" x="610" y="892" width="280" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="750" y="927" text-anchor="middle" dominant-baseline="middle">Concurrent helpers</text>
  <text class="detail" x="750" y="957" text-anchor="middle" dominant-baseline="middle">Future and VT adapters</text>
</g>
<g id="functional">
  <rect class="card" x="1074" y="892" width="280" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1214" y="927" text-anchor="middle" dominant-baseline="middle">Functional helpers</text>
  <text class="detail" x="1214" y="957" text-anchor="middle" dominant-baseline="middle">currying, decorators</text>
</g>
<path class="route" data-from="require" data-to="range" d="M358 340 L358 574" stroke="#15803D"/>
<path class="route" data-from="types" data-to="collections" d="M750 340 L750 574" stroke="#0F766E"/>
<path class="route dashed" data-from="codec" data-to="value" d="M1214 340 L1214 574" stroke="#C2410C" style="marker-end:none"/>
<polygon points="1208,562 1214,574 1220,562" fill="#C2410C" stroke="#C2410C" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" data-from="range" data-to="time" d="M358 658 L358 892" stroke="#BE185D"/>
<path class="route" data-from="collections" data-to="concurrent" d="M750 658 L750 892" stroke="#4D7C0F"/>
<path class="route" data-from="value" data-to="functional" d="M1214 658 L1214 892" stroke="#7E22CE"/>
</svg>
