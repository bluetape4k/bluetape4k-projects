<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1120" viewBox="0 0 1740 1120" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-ktor-openapi route helpers</title>
  <desc id="desc">Ktor OpenAPI route helper diagram showing application-owned OpenAPI inputs, shared argument guards, explicit route helpers, official Ktor route functions, and served documentation endpoints.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .card-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .card-title { font-size: 22px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .source-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .lane-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .swagger-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .source-card { fill: #f7fbff; stroke: #4b74a5; stroke-width: 2; }
      .guard-card { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .guard-highlight { fill: #fff4f5; stroke: #b65f68; stroke-width: 3; }
      .route-card { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .plugin-card { fill: #fffdf7; stroke: #a2743d; stroke-width: 2; }
      .ui-card { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .flowBlue { fill: none; stroke: #4b74a5; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flowRed { fill: none; stroke: #b65f68; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowPurple { fill: none; stroke: #8870a8; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .icon-ring { fill: #ffffff; stroke-width: 2; }
      .icon-line { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#8870a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1692" height="1072" rx="20" class="frame"/>
  <text x="870" y="78" text-anchor="middle" class="title">bluetape4k-ktor-openapi Route Helpers</text>
  <text x="870" y="108" text-anchor="middle" class="subtitle">Add documentation routes explicitly; keep API behavior and OpenAPI ownership in the application.</text>

  <rect x="72" y="150" width="1596" height="200" rx="16" class="source-panel"/>
  <g transform="translate(1618 174)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="icon-ring" stroke="#4b74a5"/>
    <path d="M -8 -9 H 5 L 10 -4 V 9 H -8 Z M 5 -9 V -4 H 10" class="icon-line" stroke="#4b74a5"/>
  </g>
  <text x="102" y="190" class="panel-title">Application-owned OpenAPI source</text>
  <text x="102" y="218" class="small">The application owns the document and route metadata lifecycle.</text>

  <rect x="130" y="250" width="360" height="54" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="310" y="285" text-anchor="middle" class="card-title">Static YAML resource</text>

  <rect x="690" y="250" width="360" height="54" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="870" y="285" text-anchor="middle" class="card-title">Route .describe metadata</text>

  <rect x="1250" y="250" width="360" height="54" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="1430" y="285" text-anchor="middle" class="card-title">Compiler OpenAPI metadata</text>

  <rect x="600" y="322" width="540" height="50" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="870" y="354" text-anchor="middle" class="card-title">OpenAPI document or metadata tree</text>

  <rect x="610" y="398" width="520" height="78" rx="10" class="guard-highlight" filter="url(#softShadow)"/>
  <text x="870" y="428" text-anchor="middle" class="card-title">Shared argument guards</text>
  <line x1="610" y1="446" x2="1130" y2="446" class="sep"/>
  <text x="704" y="468" class="member">path and swaggerFile must not be blank</text>

  <rect x="90" y="540" width="760" height="390" rx="16" class="lane-panel" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/>
  <g transform="translate(800 566)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="icon-ring" stroke="#5d7b63"/>
    <path d="M -9 -6 H 9 M -9 2 H 9 M -2 9 L 9 2 L -2 -5" class="icon-line" stroke="#5d7b63"/>
  </g>
  <text x="122" y="582" class="panel-title">OpenAPI document route</text>
  <text x="122" y="612" class="small">Expose the document through Ktor's official OpenAPI route.</text>

  <rect x="260" y="650" width="420" height="62" rx="7" class="route-card" filter="url(#softShadow)"/>
  <text x="470" y="689" text-anchor="middle" class="card-title">bluetape4kOpenApi()</text>

  <rect x="300" y="762" width="340" height="62" rx="7" class="plugin-card" filter="url(#softShadow)"/>
  <text x="470" y="801" text-anchor="middle" class="card-title">Ktor openAPI()</text>

  <rect x="300" y="874" width="340" height="50" rx="7" class="plugin-card" filter="url(#softShadow)"/>
  <text x="470" y="906" text-anchor="middle" class="card-title">GET /openapi</text>

  <rect x="890" y="540" width="760" height="390" rx="16" class="swagger-panel"/>
  <g transform="translate(1600 566)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="icon-ring" stroke="#8870a8"/>
    <path d="M -8 -7 H 8 M -8 0 H 8 M -8 7 H 2" class="icon-line" stroke="#8870a8"/>
  </g>
  <text x="922" y="582" class="panel-title">Swagger UI route</text>
  <text x="922" y="612" class="small">Expose the same application-owned document through Swagger UI.</text>

  <rect x="1060" y="650" width="420" height="62" rx="7" class="route-card" filter="url(#softShadow)"/>
  <text x="1270" y="689" text-anchor="middle" class="card-title">bluetape4kSwaggerUi()</text>

  <rect x="1100" y="762" width="340" height="62" rx="7" class="ui-card" filter="url(#softShadow)"/>
  <text x="1270" y="801" text-anchor="middle" class="card-title">Ktor swaggerUI()</text>

  <rect x="1100" y="874" width="340" height="50" rx="7" class="ui-card" filter="url(#softShadow)"/>
  <text x="1270" y="906" text-anchor="middle" class="card-title">GET /swagger</text>

  <rect x="110" y="990" width="1520" height="62" rx="14" class="source-panel"/>
  <text x="142" y="1028" class="panel-title">Boundary</text>
  <text x="282" y="1028" class="small">This module adds documentation routes only; application routes, schemas, and runtime behavior stay caller-owned.</text>

  <path d="M 310 304 L 310 333 Q 310 347 324 347 L 600 347" class="flowBlue"/>
  <path d="M 870 304 V 322" class="flowBlue"/>
  <path d="M 1430 304 L 1430 333 Q 1430 347 1416 347 L 1140 347" class="flowBlue"/>
  <path d="M 870 372 V 398" class="flowBlue"/>

  <path d="M 870 476 L 870 492.8 Q 870 504 858.8 504 L 484 504 Q 470 504 470 518 L 470 540" class="flowRed"/>
  <path d="M 870 476 L 870 492.8 Q 870 504 881.2 504 L 1256 504 Q 1270 504 1270 518 L 1270 540" class="flowRed"/>

  <path d="M 470 712 V 762" class="flowGreen"/>
  <path d="M 470 824 V 874" class="flowGold"/>
  <path d="M 470 924 L 470 946 Q 470 960 484 960 L 862 960 Q 870 960 870 968 L 870 990" class="flowGold"/>

  <path d="M 1270 712 V 762" class="flowGreen"/>
  <path d="M 1270 824 V 874" class="flowPurple"/>
  <path d="M 1270 924 L 1270 946 Q 1270 960 1256 960 L 878 960 Q 870 960 870 968 L 870 990" class="flowPurple"/>
</svg>
