<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-okio NIO channel adapter hierarchy</title>
  <desc id="desc">NIO channel source and sink adapters that bridge ReadableByteChannel, WritableByteChannel, and FileChannel into Okio Source and Sink contracts.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small, .label { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; fill: #566b73; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .channel-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .source-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .sink-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .contract-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .nio { fill: #ffffff; stroke: #4f6c77; stroke-width: 2; }
      .source-card { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-card { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .file-card { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .timeout-card { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .flowSlate { fill: none; stroke: #455a64; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowBlue { fill: none; stroke: #4b74a5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flowPurple { fill: none; stroke: #8870a8; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .source-icon { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-icon { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .icon-line-green { fill: none; stroke: #5d7b63; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-line-gold { fill: none; stroke: #a2743d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowSlate" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#8870a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="992" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-okio NIO Channel Adapter Hierarchy</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">NIO adapters keep channel ownership explicit while exposing Okio Source and Sink contracts.</text>

  <rect x="72" y="150" width="1656" height="176" rx="16" class="channel-panel"/>
  <text x="102" y="190" class="panel-title">NIO inputs and outputs</text>
  <text x="102" y="218" class="small">The module wraps channel types directly; buffering remains an Okio caller choice through Source.buffered() or Sink.buffered().</text>

  <rect x="150" y="246" width="360" height="64" rx="7" class="nio" filter="url(#softShadow)"/>
  <text x="330" y="274" text-anchor="middle" class="class-title">ReadableByteChannel</text>
  <text x="330" y="298" text-anchor="middle" class="member">asSource(timeout)</text>

  <rect x="550" y="246" width="320" height="64" rx="7" class="file-card" filter="url(#softShadow)"/>
  <text x="710" y="274" text-anchor="middle" class="class-title">FileChannel read</text>
  <text x="710" y="298" text-anchor="middle" class="member">asSource(timeout)</text>

  <rect x="930" y="246" width="360" height="64" rx="7" class="nio" filter="url(#softShadow)"/>
  <text x="1110" y="274" text-anchor="middle" class="class-title">WritableByteChannel</text>
  <text x="1110" y="298" text-anchor="middle" class="member">asSink(timeout)</text>

  <rect x="1330" y="246" width="320" height="64" rx="7" class="file-card" filter="url(#softShadow)"/>
  <text x="1490" y="274" text-anchor="middle" class="class-title">FileChannel write</text>
  <text x="1490" y="298" text-anchor="middle" class="member">asSink(timeout)</text>

  <rect x="72" y="370" width="806" height="450" rx="16" class="source-panel"/>
  <g transform="translate(828 388)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="source-icon"/>
    <path d="M -9 -5 H 4 M 4 -5 L -1 -10 M 4 -5 L -1 0" class="icon-line-green"/>
    <path d="M -10 8 H 10" class="icon-line-green"/>
  </g>
  <text x="102" y="410" class="panel-title">Source adapters</text>
  <text x="102" y="438" class="small">Read operations append channel bytes into an Okio Buffer and return byte counts or EOF.</text>

  <rect x="138" y="506" width="340" height="136" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="308" y="538" text-anchor="middle" class="class-title">ByteChannelSource</text>
  <line x1="138" y1="558" x2="478" y2="558" class="sep"/>
  <text x="166" y="584" class="member">implements Source</text>
  <text x="166" y="606" class="member">channel.read(ByteBuffer.wrap(...))</text>
  <text x="166" y="628" class="member">0L can mean no progress yet</text>

  <rect x="518" y="506" width="320" height="136" rx="7" class="file-card" filter="url(#softShadow)"/>
  <text x="678" y="538" text-anchor="middle" class="class-title">FileChannelSource</text>
  <line x1="518" y1="558" x2="838" y2="558" class="sep"/>
  <text x="546" y="584" class="member">implements Source</text>
  <text x="546" y="606" class="member">transferTo(position, count, sink)</text>
  <text x="546" y="628" class="member">advances channel position</text>

  <rect x="224" y="692" width="520" height="90" rx="7" class="timeout-card" filter="url(#softShadow)"/>
  <text x="484" y="720" text-anchor="middle" class="class-title">Read-side contract</text>
  <text x="484" y="746" text-anchor="middle" class="member">validate byteCount and check open channel</text>
  <text x="484" y="768" text-anchor="middle" class="member">return -1L at EOF and close channel on close()</text>

  <rect x="922" y="370" width="806" height="450" rx="16" class="sink-panel"/>
  <g transform="translate(1678 388)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="sink-icon"/>
    <path d="M -4 5 H 9 M 9 5 L 4 0 M 9 5 L 4 10" class="icon-line-gold"/>
    <path d="M -10 -8 H 10" class="icon-line-gold"/>
  </g>
  <text x="952" y="410" class="panel-title">Sink adapters</text>
  <text x="952" y="438" class="small">Write operations drain bytes from the caller Buffer and push them into writable channels.</text>

  <rect x="988" y="506" width="340" height="136" rx="7" class="sink-card" filter="url(#softShadow)"/>
  <text x="1158" y="538" text-anchor="middle" class="class-title">ByteChannelSink</text>
  <line x1="988" y1="558" x2="1328" y2="558" class="sep"/>
  <text x="1016" y="584" class="member">implements Sink</text>
  <text x="1016" y="606" class="member">channel.write(ByteBuffer.wrap(...))</text>
  <text x="1016" y="628" class="member">throws when no bytes are written</text>

  <rect x="1368" y="506" width="320" height="136" rx="7" class="file-card" filter="url(#softShadow)"/>
  <text x="1528" y="538" text-anchor="middle" class="class-title">FileChannelSink</text>
  <line x1="1368" y1="558" x2="1688" y2="558" class="sep"/>
  <text x="1396" y="584" class="member">implements Sink</text>
  <text x="1396" y="606" class="member">transferFrom(source, position, count)</text>
  <text x="1396" y="628" class="member">flush forces file data</text>

  <rect x="1074" y="692" width="520" height="90" rx="7" class="timeout-card" filter="url(#softShadow)"/>
  <text x="1334" y="720" text-anchor="middle" class="class-title">Write-side contract</text>
  <text x="1334" y="746" text-anchor="middle" class="member">validate byteCount and throw on stalled writes</text>
  <text x="1334" y="768" text-anchor="middle" class="member">flush when supported and close channel on close()</text>

  <rect x="98" y="870" width="1604" height="92" rx="14" class="contract-panel"/>
  <text x="128" y="904" class="panel-title">Bridge contract</text>
  <text x="128" y="934" class="small">Use ByteChannel adapters for generic NIO streams; use FileChannel adapters when file position and transferTo/transferFrom semantics matter.</text>

  <path d="M 330 310 V 370" class="flowGreen"/>
  <path d="M 710 310 V 370" class="flowBlue"/>
  <path d="M 1110 310 V 370" class="flowGold"/>
  <path d="M 1490 310 V 370" class="flowBlue"/>

  <path d="M 308 642 L 308 661.2 Q 308 674 320.8 674 L 474 674 Q 484 674 484 684 L 484 692" class="flowGreen"/>
  <path d="M 678 642 L 678 661.2 Q 678 674 665.2 674 L 494 674 Q 484 674 484 684 L 484 692" class="flowBlue"/>
  <path d="M 1158 642 L 1158 661.2 Q 1158 674 1170.8 674 L 1324 674 Q 1334 674 1334 684 L 1334 692" class="flowGold"/>
  <path d="M 1528 642 L 1528 661.2 Q 1528 674 1515.2 674 L 1344 674 Q 1334 674 1334 684 L 1334 692" class="flowBlue"/>

  <path d="M 484 782 L 484 830 Q 484 844 498 844 L 890 844 Q 900 844 900 854 L 900 870" class="flowPurple"/>
  <path d="M 1334 782 L 1334 830 Q 1334 844 1320 844 L 910 844 Q 900 844 900 854 L 900 870" class="flowPurple"/>
</svg>
