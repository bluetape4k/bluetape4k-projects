  <rect class="alt" x="72" y="757.2" width="620" height="267.4" rx="16" stroke="#4F83BF"/>
  <rect class="pill" x="114" y="739.2" width="198" height="34" rx="17"/><text class="altTitle" x="213" y="763.6" text-anchor="middle">composition</text>
  <text class="altNote" x="336" y="789.3">map/flatMap create another DeferredValue.</text>
  <text class="altNote" x="336" y="812.8" fill="#4F83BF">The new supplier awaits the previous result first.</text>
</g>
