  <rect class="pill" x="770" y="919.2" width="178" height="34" rx="17"/><text class="altTitle" x="859" y="943.6" text-anchor="middle">result access</text>
  <text class="altNote" x="974" y="969.3">await() waits without blocking a thread.</text>
  <text class="altNote" x="974" y="992.8" fill="#4F83BF">value blocks via runBlocking when the Deferred is not done.</text>
</g>
