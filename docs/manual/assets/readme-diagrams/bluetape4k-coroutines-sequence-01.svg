<rect class="noteBox" x="96" y="1527.7" width="1288" height="58" rx="12"/>
<text class="note" x="122" y="1557.7">Lifecycle note: DeferredValue owns its scope, so callers that abandon the wrapper should close it or manage async work in their own CoroutineScope.</text>
</svg>
