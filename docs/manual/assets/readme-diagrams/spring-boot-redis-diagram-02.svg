<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="820" viewBox="0 0 1530 820" role="img" aria-label="ReactiveRedisTemplate serialization flow">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="open-gray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="16" refY="9" orient="auto" overflow="visible"><path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="hollow-blue" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="1530" height="820" fill="#ffffff" />
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">ReactiveRedisTemplate Serialization Flow</text>
  <text x="72" y="92" font-size="15" fill="#64748b">The DSL builds a RedisSerializationContext; template operations then serialize writes and deserialize reads through the selected adapters.</text>

  <g class="group" data-group="APPLICATION CALL SITE">
    <rect x="60" y="132" width="446" height="534" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="78" y="158" font-size="14" font-weight="700" fill="#2563eb">APPLICATION CALL SITE</text>
    <text x="78" y="179" font-size="12.5" fill="#6b7280">Code selects serializers and receives decoded reads.</text>
  </g>

  <g class="group" data-group="SERIALIZATION CONTEXT">
    <rect x="497" y="132" width="590" height="534" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="515" y="158" font-size="14" font-weight="700" fill="#16a34a">SERIALIZATION CONTEXT</text>
    <text x="515" y="179" font-size="12.5" fill="#6b7280">Context owns slots and Redis byte representation.</text>
  </g>

  <g class="group" data-group="TEMPLATE WRITE PATH">
    <rect x="1064" y="132" width="406" height="534" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="1082" y="158" font-size="14" font-weight="700" fill="#7c3aed">TEMPLATE WRITE PATH</text>
    <text x="1082" y="179" font-size="12.5" fill="#6b7280">Template applies the context to operations.</text>
  </g>
  <path class="edge" d="M468 290 L555 290" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <path class="edge" d="M905 290 L1102 290" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" />
  <path class="edge" d="M1267 350 L1267 482" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M1102 542 L1070 542" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M535 542 L468 542" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M263 482 L263 350" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" />

  <polyline points="271,368 263,350 255,368" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <g class="card" data-card="Configuration Code">
    <rect x="98" y="230" width="370" height="120" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <rect x="98" y="230" width="10" height="120" rx="5" fill="#2563eb" opacity="0.9" />
    <text x="124" y="264" font-size="18" font-weight="700" fill="#111827">Configuration Code</text>
    <text x="124" y="292" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">redisSerializationContext {}</text>
<text x="124" y="311" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">or redisSerializationContextOf(...)</text>
<text x="124" y="330" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">choose key/value/hash serializers</text>
  </g>

  <g class="card" data-card="Serialization Context">
    <rect x="555" y="230" width="350" height="120" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <rect x="555" y="230" width="10" height="120" rx="5" fill="#16a34a" opacity="0.9" />
    <text x="581" y="264" font-size="18" font-weight="700" fill="#111827">Serialization Context</text>
    <text x="581" y="292" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">RedisSerializationContext&lt;K, V&gt;</text>
<text x="581" y="311" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">key, value, hashKey, hashValue</text>
<text x="581" y="330" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">built before template creation</text>
  </g>

  <g class="card" data-card="ReactiveRedisTemplate">
    <rect x="1102" y="230" width="330" height="120" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="1102" y="230" width="10" height="120" rx="5" fill="#7c3aed" opacity="0.9" />
    <text x="1128" y="264" font-size="18" font-weight="700" fill="#111827">ReactiveRedisTemplate</text>
    <text x="1128" y="292" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">uses context for every operation</text>
<text x="1128" y="311" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">String keys can use UTF_8 serializer</text>
<text x="1128" y="330" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">values use chosen binary serializer</text>
  </g>

  <g class="card" data-card="Write Path">
    <rect x="1102" y="482" width="380" height="120" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <rect x="1102" y="482" width="10" height="120" rx="5" fill="#16a34a" opacity="0.9" />
    <text x="1128" y="516" font-size="18" font-weight="700" fill="#111827">Write Path</text>
    <text x="1128" y="544" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">value -&gt; RedisBinarySerializer</text>
<text x="1128" y="563" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">BinarySerializer serializes/compresses</text>
<text x="1128" y="582" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">Redis stores ByteArray</text>
  </g>

  <g class="card" data-card="Redis Storage">
    <rect x="535" y="482" width="535" height="120" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <rect x="535" y="482" width="10" height="120" rx="5" fill="#64748b" opacity="0.9" />
    <image data-bluetape4k-icon="redis/redis-icon.svg" href="data:image/svg+xml;base64," x="561" y="512" width="46" height="46" preserveAspectRatio="xMidYMid meet" />
    <text x="627" y="516" font-size="18" font-weight="700" fill="#111827">Redis Storage</text>
    <text x="627" y="544" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">stored bytes are codec-specific</text>
<text x="627" y="563" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">compression-only variants keep ByteArray contract</text>
<text x="627" y="582" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">null serializes to emptyByteArray</text>
  </g>

  <g class="card" data-card="Decoded Read Result">
    <rect x="98" y="482" width="370" height="120" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <rect x="98" y="482" width="10" height="120" rx="5" fill="#ea580c" opacity="0.9" />
    <text x="124" y="516" font-size="18" font-weight="700" fill="#111827">Decoded Read Result</text>
    <text x="124" y="544" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">ByteArray -&gt; deserialize</text>
<text x="124" y="563" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">decompress when compressor is present</text>
<text x="124" y="582" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">returns domain value or ByteArray</text>
  </g>
  <g class="legend" transform="translate(72 758)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)" /><text x="58" y="5" font-size="13" fill="#475569">context construction</text>
    <line x1="290" y1="0" x2="332" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" /><text x="348" y="5" font-size="13" fill="#475569">write serialization</text>
    <line x1="560" y1="0" x2="602" y2="0" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-orange)" /><text x="618" y="5" font-size="13" fill="#475569">read deserialization</text>
    <line x1="850" y1="0" x2="892" y2="0" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 5" />

    <polyline points="874,8 892,0 874,-8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/><text x="908" y="5" font-size="13" fill="#475569">read result returns</text>
  </g>
</svg>
