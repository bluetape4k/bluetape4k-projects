<svg data-intent="Explain ULID timestamp/randomness layout from current ULID source." data-evidence="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/ULID.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/Constants.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/ULIDValue.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/ULIDFactory.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/Crockford.kt" data-source-read="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/ULID.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/Constants.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/ULIDValue.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/ULIDFactory.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ulid/internal/Crockford.kt" xmlns="http://www.w3.org/2000/svg" width="3000" height="1900" viewBox="0 0 3000 1900" role="img" aria-label="ULID Layout">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}
    .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:58px;fill:#0F172A}
    .subtitle,.sample{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .sampleValue{font-family:"Comic Mono";font-size:34px;fill:#0F172A;font-weight:700;letter-spacing:0}
    .segmentBits{font-family:"Comic Mono";font-size:26px;fill:#0F172A;font-weight:700}
    .segmentTitle{font-family:"Architects Daughter";font-size:36px;fill:#0F172A}
    .segmentRange{font-family:"Comic Mono";font-size:17px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}
    .cardTitle{font-family:"Architects Daughter";font-size:34px;fill:#0F172A}
    .cardText{font-family:"Comic Mono";font-size:18px;fill:#334155}
    .divider{stroke-width:1;opacity:.36}
    .guide{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
    .bitLabel{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .tick{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 8}
    .tickText{font-family:"Comic Mono";font-size:17px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="3000" height="1900"/>
<rect class="frame" x="36" y="30" width="2928" height="1840" rx="8"/>
<text class="title" x="76" y="104">ULID Layout</text>
<text class="subtitle" x="80" y="142">128-bit value: 48-bit timestamp + 80-bit randomness; 26 Crockford chars render 10 time + 16 random chars.</text>
<text class="sample" x="170" y="228">example</text>
<text class="sampleValue" x="170" y="278">01ARZ3NDEKTSV4RRFFQ69G5FAV</text>
<text class="bitLabel" x="170" y="312">Most significant bit</text>
<text class="bitLabel" x="2830" y="312" text-anchor="end">Least significant bit</text>
<g><path class="tick" d="M170 402V618"/><text class="tickText" x="170" y="386" text-anchor="middle">127</text></g>
<g><path class="tick" d="M1133.5 402V618"/><text class="tickText" x="1133.5" y="386" text-anchor="middle">80</text></g>
<g><path class="tick" d="M1201.5 402V618"/><text class="tickText" x="1201.5" y="386" text-anchor="middle">79</text></g>
<g><path class="tick" d="M2830 402V618"/><text class="tickText" x="2830" y="386" text-anchor="middle">0</text></g>
<g>
  <rect x="170" y="420" width="997.5" height="180" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text class="segmentBits" x="668.75" y="474" text-anchor="middle">48 bits</text>
  <text class="segmentTitle" x="668.75" y="524" text-anchor="middle">timestamp</text>
  <text class="segmentRange" x="668.75" y="563" text-anchor="middle">mostSignificantBits &gt;&gt;&gt; 16</text>
</g>
<g>
  <rect x="1167.5" y="420" width="1662.5" height="180" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
  <text class="segmentBits" x="1998.75" y="474" text-anchor="middle">80 bits</text>
  <text class="segmentTitle" x="1998.75" y="524" text-anchor="middle">randomness</text>
  <text class="segmentRange" x="1998.75" y="563" text-anchor="middle">16 high bits + 64 low bits</text>
</g>
<g>
  <rect x="170" y="780" width="1023.0769230769231" height="170" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text class="segmentBits" x="681.5384615384615" y="834" text-anchor="middle">10 chars</text>
  <text class="segmentTitle" x="681.5384615384615" y="884" text-anchor="middle">time string</text>
  <text class="segmentRange" x="681.5384615384615" y="923" text-anchor="middle">write(timestamp, 10, offset 0)</text>
</g>
<g>
  <rect x="1193.076923076923" y="780" width="1636.923076923077" height="170" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <text class="segmentBits" x="2011.5384615384614" y="834" text-anchor="middle">16 chars</text>
  <text class="segmentTitle" x="2011.5384615384614" y="884" text-anchor="middle">random string</text>
  <text class="segmentRange" x="2011.5384615384614" y="923" text-anchor="middle">80 random bits in Crockford Base32</text>
</g>
<path class="guide" d="M 668.75 600 L 668.75 676 Q 668.75 690 654.75 690 L 104 690 Q 90 690 90 704 L 90 996 Q 90 1010 104 1010 L 756 1010 Q 770 1010 770 1024 L 770 1060" stroke="#1D4ED8"/>
<path class="guide" d="M 1998.75 600 L 1998.75 676 Q 1998.75 690 2012.75 690 L 2896 690 Q 2910 690 2910 704 L 2910 996 Q 2910 1010 2896 1010 L 2244 1010 Q 2230 1010 2230 1024 L 2230 1060" stroke="#C2410C"/>
<path class="guide" d="M 681.54 950 L 681.54 1386 Q 681.54 1400 695.54 1400 L 756 1400 Q 770 1400 770 1414 L 770 1450" stroke="#15803D"/>
<path class="guide" d="M 2011.54 950 L 2011.54 1386 Q 2011.54 1400 2025.54 1400 L 2216 1400 Q 2230 1400 2230 1414 L 2230 1450" stroke="#6D28D9"/>
<g>
  <rect class="card" x="170" y="1060" width="1200" height="290" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="770" y="1114" text-anchor="middle">Timestamp bits</text>
  <path class="divider" d="M170 1142H1370" stroke="#1D4ED8"/>
  <text class="cardText" x="198" y="1182">48-bit millisecond timestamp</text>
<text class="cardText" x="198" y="1216">stored in mostSignificantBits</text>
<text class="cardText" x="198" y="1250">timestamp = msb &gt;&gt;&gt; 16</text>
<text class="cardText" x="198" y="1284">10 time chars render this field</text>
</g>
<g>
  <rect class="card" x="1630" y="1060" width="1200" height="290" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="2230" y="1114" text-anchor="middle">Randomness bits</text>
  <path class="divider" d="M1630 1142H2830" stroke="#C2410C"/>
  <text class="cardText" x="1658" y="1182">80-bit random payload</text>
<text class="cardText" x="1658" y="1216">randomHigh: 16 bits</text>
<text class="cardText" x="1658" y="1250">randomLow: 64 bits</text>
<text class="cardText" x="1658" y="1284">Factory writes both into ULIDValue</text>
<text class="cardText" x="1658" y="1318">monotonic variants increment payload</text>
</g>
<g>
  <rect class="card" x="170" y="1450" width="1200" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="770" y="1504" text-anchor="middle">Time string</text>
  <path class="divider" d="M170 1532H1370" stroke="#15803D"/>
  <text class="cardText" x="198" y="1572">first 10 Crockford chars</text>
<text class="cardText" x="198" y="1606">buffer.write(timestamp, 10, 0)</text>
<text class="cardText" x="198" y="1640">50 char-slots encode 48 useful bits</text>
<text class="cardText" x="198" y="1674">lexicographic order starts here</text>
</g>
<g>
  <rect class="card" x="1630" y="1450" width="1200" height="250" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="cardTitle" x="2230" y="1504" text-anchor="middle">Random string</text>
  <path class="divider" d="M1630 1532H2830" stroke="#6D28D9"/>
  <text class="cardText" x="1658" y="1572">last 16 Crockford chars</text>
<text class="cardText" x="1658" y="1606">80 random bits total</text>
<text class="cardText" x="1658" y="1640">source code writes this as 8 + 8 chars</text>
<text class="cardText" x="1658" y="1674">not an 80-bit-to-8-char mapping</text>
</g>
</svg>