  <path class="dep" d="M 750 636 L 750 656 Q 750 670 736 670 L 549 670 Q 535 670 535 684 L 535 704" stroke="#0d9488"/>

  <polyline points="527,686 535,704 543,686" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 750 636 L 750 656.4 Q 750 670 763.6 670 L 843 670 Q 857 670 857 684 L 857 706" stroke="#ea580c"/>

  <polyline points="849,688 857,706 865,688" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 952 603 L 1014 603 Q 1028 603 1028 617 L 1028 751 Q 1028 765 1042 765 L 1080 765" stroke="#16a34a"/>

  <polyline points="1062,773 1080,765 1062,757" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 1222 842 V 896" stroke="#16a34a"/>

  <polyline points="1214,878 1222,896 1230,878" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
</svg>
