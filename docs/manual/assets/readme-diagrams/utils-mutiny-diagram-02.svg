<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1540" viewBox="0 0 2700 1540" role="img" aria-label="Mutiny Processing Flow Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>

  <marker id="arrow-teal" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#0F766E" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-blue" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#1D4ED8" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-green" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#15803D" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-amber" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#C2410C" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-pink" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#BE185D" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-violet" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#6D28D9" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-slate" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16"><path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#475569" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:47px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .card{stroke-width:1.8;filter:url(#shadow)}.kicker{font-family:"Comic Mono";font-size:14px;fill:#475569}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
    .body{font-family:"Comic Mono";font-size:14px;fill:#334155}.foot{font-family:"Comic Mono";font-size:13px;fill:#475569}.divider{stroke-width:1.1;opacity:.42}
    .lane{font-family:"Comic Mono";font-size:16px;font-weight:700;letter-spacing:0}
    .edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:13px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="2700" height="1540"/>
<rect class="frame" x="34" y="30" width="2632" height="1480" rx="8"/>
<text class="title" x="72" y="86">Mutiny Processing Flow</text>
<text class="subtitle" x="76" y="120">Inputs become Uni or Multi through bluetape4k helpers, pass through Mutiny item callbacks, and finish at await, collect, or subscription boundaries.</text>
<text class="lane" x="95" y="205" fill="#1D4ED8">Uni processing lane</text>
<g id="UniSources">
  <rect class="card" x="110" y="240" width="430" height="230" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="132" y="271">source</text>
  <text class="cardTitle" x="132" y="305">single result inputs</text>
  <path class="divider" d="M110 326H540" stroke="#1D4ED8"/>
  <text class="body" x="132" y="358">item, supplier, failure</text>
<text class="body" x="132" y="382">CompletionStage</text>
<text class="body" x="132" y="406">Future with timeout</text>
  <path class="divider" d="M110 424H540" stroke="#1D4ED8"/><text class="foot" x="132" y="453">0 or 1 item intent</text>
</g>
<g id="UniHelpers">
  <rect class="card" x="700" y="240" width="460" height="230" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="722" y="271">UniSupport.kt</text>
  <text class="cardTitle" x="722" y="305">Uni creation helpers</text>
  <path class="divider" d="M700 326H1160" stroke="#15803D"/>
  <text class="body" x="722" y="358">uniOf(...)</text>
<text class="body" x="722" y="382">uniFailureOf(...)</text>
<text class="body" x="722" y="406">uniCompletionStageOf(...)</text>
<text class="body" x="722" y="430">uniFutureOf(...)</text>
  <path class="divider" d="M700 424H1160" stroke="#15803D"/><text class="foot" x="722" y="453">creates Uni&lt;T&gt;</text>
</g>
<g id="UniPipeline">
  <rect class="card" x="1320" y="240" width="460" height="230" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1342" y="271">Mutiny pipeline</text>
  <text class="cardTitle" x="1342" y="305">Uni&lt;T&gt; processing</text>
  <path class="divider" d="M1320 326H1780" stroke="#0F766E"/>
  <text class="body" x="1342" y="358">onEach { callback }</text>
<text class="body" x="1342" y="382">onItem().invoke(...)</text>
<text class="body" x="1342" y="406">failure propagates downstream</text>
  <path class="divider" d="M1320 424H1780" stroke="#0F766E"/><text class="foot" x="1342" y="453">item is passed through unchanged</text>
</g>
<g id="UniTerminal">
  <rect class="card" x="1940" y="240" width="520" height="230" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="1962" y="271">terminal boundary</text>
  <text class="cardTitle" x="1962" y="305">await or CompletionStage</text>
  <path class="divider" d="M1940 326H2460" stroke="#475569"/>
  <text class="body" x="1962" y="358">await().atMost(...)</text>
<text class="body" x="1962" y="382">await().indefinitely()</text>
<text class="body" x="1962" y="406">subscribeAsCompletionStage()</text>
  <path class="divider" d="M1940 424H2460" stroke="#475569"/><text class="foot" x="1962" y="453">caller observes T, null, or failure</text>
</g>
<text class="lane" x="95" y="620" fill="#6D28D9">Multi processing lane</text>
<g id="MultiSources">
  <rect class="card" x="110" y="655" width="430" height="250" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="132" y="686">source</text>
  <text class="cardTitle" x="132" y="720">stream inputs</text>
  <path class="divider" d="M110 741H540" stroke="#6D28D9"/>
  <text class="body" x="132" y="773">vararg and range</text>
<text class="body" x="132" y="797">Iterable, Sequence, Stream</text>
<text class="body" x="132" y="821">arrays and progressions</text>
<text class="body" x="132" y="845">deferred Uni or CompletionStage repeats</text>
  <path class="divider" d="M110 859H540" stroke="#6D28D9"/><text class="foot" x="132" y="888">0 or more items intent</text>
</g>
<g id="MultiHelpers">
  <rect class="card" x="700" y="655" width="460" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="kicker" x="722" y="686">MultiSupport.kt</text>
  <text class="cardTitle" x="722" y="720">Multi creation helpers</text>
  <path class="divider" d="M700 741H1160" stroke="#C2410C"/>
  <text class="body" x="722" y="773">multiOf(...)</text>
<text class="body" x="722" y="797">multiRangeOf(...)</text>
<text class="body" x="722" y="821">asMulti() conversions</text>
<text class="body" x="722" y="845">deferUni / deferCompletionStage</text>
  <path class="divider" d="M700 859H1160" stroke="#C2410C"/><text class="foot" x="722" y="888">creates Multi&lt;T&gt; or UniRepeat&lt;T&gt;</text>
</g>
<g id="MultiPipeline">
  <rect class="card" x="1320" y="655" width="460" height="250" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1342" y="686">Mutiny pipeline</text>
  <text class="cardTitle" x="1342" y="720">Multi&lt;T&gt; processing</text>
  <path class="divider" d="M1320 741H1780" stroke="#0F766E"/>
  <text class="body" x="1342" y="773">onEach { callback }</text>
<text class="body" x="1342" y="797">onItem().invoke(...)</text>
<text class="body" x="1342" y="821">source order is preserved</text>
<text class="body" x="1342" y="845">callback failure fails stream</text>
  <path class="divider" d="M1320 859H1780" stroke="#0F766E"/><text class="foot" x="1342" y="888">items continue downstream</text>
</g>
<g id="MultiTerminal">
  <rect class="card" x="1940" y="655" width="520" height="250" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="1962" y="686">terminal boundary</text>
  <text class="cardTitle" x="1962" y="720">collect or subscribe</text>
  <path class="divider" d="M1940 741H2460" stroke="#475569"/>
  <text class="body" x="1962" y="773">collect().asList()</text>
<text class="body" x="1962" y="797">await().indefinitely()</text>
<text class="body" x="1962" y="821">subscriber consumes stream</text>
  <path class="divider" d="M1940 859H2460" stroke="#475569"/><text class="foot" x="1962" y="888">caller observes list, stream, or failure</text>
</g>
<text class="lane" x="95" y="1060" fill="#0F766E">Coroutine interop lane</text>
<g id="CoroutineBlock">
  <rect class="card" x="420" y="1095" width="520" height="220" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="442" y="1126">CoroutineScope</text>
  <text class="cardTitle" x="442" y="1160">suspend block</text>
  <path class="divider" d="M420 1181H940" stroke="#0F766E"/>
  <text class="body" x="442" y="1213">CoroutineScope.asUni { ... }</text>
<text class="body" x="442" y="1237">runs async in current scope</text>
<text class="body" x="442" y="1261">does not change receiver scope</text>
  <path class="divider" d="M420 1269H940" stroke="#0F766E"/><text class="foot" x="442" y="1298">source is coroutine code</text>
</g>
<g id="CoroutineBridge">
  <rect class="card" x="1110" y="1095" width="520" height="220" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1132" y="1126">kotlinx.coroutines.mutiny</text>
  <text class="cardTitle" x="1132" y="1160">async(...).asUni()</text>
  <path class="divider" d="M1110 1181H1630" stroke="#0F766E"/>
  <text class="body" x="1132" y="1213">Deferred result becomes Uni</text>
<text class="body" x="1132" y="1237">block exception becomes failed Uni</text>
<text class="body" x="1132" y="1261">cancellation follows coroutine machinery</text>
  <path class="divider" d="M1110 1269H1630" stroke="#0F766E"/><text class="foot" x="1132" y="1298">bridge targets Uni&lt;T&gt;</text>
</g>
<g id="InteropResult">
  <rect class="card" x="1800" y="1095" width="520" height="220" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="1822" y="1126">Mutiny result</text>
  <text class="cardTitle" x="1822" y="1160">Uni&lt;T&gt;</text>
  <path class="divider" d="M1800 1181H2320" stroke="#1D4ED8"/>
  <text class="body" x="1822" y="1213">continues through normal Uni pipeline</text>
<text class="body" x="1822" y="1237">can use onEach</text>
<text class="body" x="1822" y="1261">can await or subscribe</text>
  <path class="divider" d="M1800 1269H2320" stroke="#1D4ED8"/><text class="foot" x="1822" y="1298">same terminal surface as UniSupport</text>
</g>
<g data-from="UniSources" data-to="UniHelpers">
  <path class="edge " d="M540 355 L700 355" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <g class="edgeLabel" transform="translate(567 319)"><rect width="106" height="30" rx="8"/><text x="53" y="20" text-anchor="middle">wrapped by</text></g>
</g>
<g data-from="UniHelpers" data-to="UniPipeline">
  <path class="edge " d="M1160 355 L1320 355" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <g class="edgeLabel" transform="translate(1179 319)"><rect width="122" height="30" rx="8"/><text x="61" y="20" text-anchor="middle">produces Uni</text></g>
</g>
<g data-from="UniPipeline" data-to="UniTerminal">
  <path class="edge " d="M1780 355 L1940 355" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <g class="edgeLabel" transform="translate(1787 319)"><rect width="146" height="30" rx="8"/><text x="73" y="20" text-anchor="middle">terminal choice</text></g>
</g>
<g data-from="MultiSources" data-to="MultiHelpers">
  <path class="edge " d="M540 780 L700 780" stroke="#6D28D9" marker-end="url(#arrow-violet)"/>
  <g class="edgeLabel" transform="translate(559 744)"><rect width="122" height="30" rx="8"/><text x="61" y="20" text-anchor="middle">converted by</text></g>
</g>
<g data-from="MultiHelpers" data-to="MultiPipeline">
  <path class="edge " d="M1160 780 L1320 780" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <g class="edgeLabel" transform="translate(1171 744)"><rect width="138" height="30" rx="8"/><text x="69" y="20" text-anchor="middle">produces Multi</text></g>
</g>
<g data-from="MultiPipeline" data-to="MultiTerminal">
  <path class="edge " d="M1780 780 L1940 780" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <g class="edgeLabel" transform="translate(1787 744)"><rect width="146" height="30" rx="8"/><text x="73" y="20" text-anchor="middle">terminal choice</text></g>
</g>
<g data-from="CoroutineBlock" data-to="CoroutineBridge">
  <path class="edge " d="M940 1205 L1110 1205" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <g class="edgeLabel" transform="translate(990 1169)"><rect width="70" height="30" rx="8"/><text x="35" y="20" text-anchor="middle">async</text></g>
</g>
<g data-from="CoroutineBridge" data-to="InteropResult">
  <path class="edge " d="M1630 1205 L1800 1205" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <g class="edgeLabel" transform="translate(1680 1169)"><rect width="70" height="30" rx="8"/><text x="35" y="20" text-anchor="middle">asUni</text></g>
</g>
<g data-from="InteropResult" data-to="UniPipeline">
  <path class="edge dashed" d="M 2060 1095 L 2060 1004 Q 2060 990 2074 990 L 2506 990 Q 2520 990 2520 976 L 2520 544 Q 2520 530 2506 530 L 1564 530 Q 1550 530 1550 516 L 1550 470" stroke="#1D4ED8" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1556,482 1550,470 1544,482" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <g class="edgeLabel" transform="translate(2094 956)"><rect width="162" height="30" rx="8"/><text x="81" y="20" text-anchor="middle">uses Uni pipeline</text></g>
</g>
</svg>