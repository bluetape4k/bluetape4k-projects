<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-netty ByteBuf processing flow</title>
  <desc id="desc">Source-backed flow showing how callers use ByteBuf helpers to read, transform, encode, write, release, and inspect Netty buffers.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small, .footer, .label { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; fill: #546a73; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .input-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .transform-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .output-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .rule-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .source { fill: #ffffff; stroke: #4f6c77; stroke-width: 2; }
      .indexed { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .sequential { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .encoding { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .string { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .result { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .safety { fill: #f0f7f8; stroke: #5f8d94; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .flowSlate { fill: none; stroke: #455a64; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
      .flowBlue { fill: none; stroke: #4b74a5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowRed { fill: none; stroke: #b65f68; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
      .flowTeal { fill: none; stroke: #5f8d94; stroke-width: 2.2; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowTeal); }
    </style>
    <marker id="arrowSlate" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5f8d94" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1052" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-netty ByteBuf Processing Flow</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">The module does not build ChannelPipeline stages; it gives callers precise ByteBuf read, transform, write, and cleanup helpers.</text>

  <rect x="72" y="150" width="1656" height="250" rx="16" class="input-panel"/>
  <text x="102" y="190" class="panel-title">1. Start from a Netty buffer</text>
  <text x="102" y="218" class="small">A caller owns a ByteBuf from Netty, an allocator, or a test fixture and decides whether indexes may move.</text>

  <rect x="130" y="270" width="330" height="88" rx="7" class="source" filter="url(#softShadow)"/>
  <text x="295" y="302" text-anchor="middle" class="class-title">Incoming ByteBuf</text>
  <line x1="130" y1="322" x2="460" y2="322" class="sep"/>
  <text x="158" y="348" class="member">network frame or binary payload</text>

  <rect x="620" y="252" width="420" height="124" rx="7" class="source" filter="url(#softShadow)"/>
  <text x="830" y="284" text-anchor="middle" class="class-title">Index decision</text>
  <line x1="620" y1="304" x2="1040" y2="304" class="sep"/>
  <text x="652" y="330" class="member">get/set: positional access</text>
  <text x="652" y="352" class="member">read/write: move readerIndex or writerIndex</text>

  <rect x="1210" y="270" width="330" height="88" rx="7" class="source" filter="url(#softShadow)"/>
  <text x="1375" y="302" text-anchor="middle" class="class-title">ByteBufUtil bridge</text>
  <line x1="1210" y1="322" x2="1540" y2="322" class="sep"/>
  <text x="1238" y="348" class="member">hex, compare, text detection</text>

  <rect x="72" y="440" width="1656" height="320" rx="16" class="transform-panel"/>
  <text x="102" y="480" class="panel-title">2. Apply the needed binary transform</text>
  <text x="102" y="508" class="small">Families mirror get/set and read/write variants.</text>

  <rect x="126" y="562" width="330" height="132" rx="7" class="indexed" filter="url(#softShadow)"/>
  <text x="291" y="594" text-anchor="middle" class="class-title">Endian and offset bytes</text>
  <line x1="126" y1="614" x2="456" y2="614" class="sep"/>
  <text x="154" y="640" class="member">Add / Sub / Neg byte transforms</text>
  <text x="154" y="662" class="member">LE, LME, RME, ME, IME layouts</text>

  <rect x="532" y="562" width="330" height="132" rx="7" class="encoding" filter="url(#softShadow)"/>
  <text x="697" y="594" text-anchor="middle" class="class-title">Smart and VarInt numbers</text>
  <line x1="532" y1="614" x2="862" y2="614" class="sep"/>
  <text x="560" y="640" class="member">ShortSmart / IntSmart ranges</text>
  <text x="560" y="662" class="member">USmart and nullable sentinel</text>

  <rect x="938" y="562" width="330" height="132" rx="7" class="string" filter="url(#softShadow)"/>
  <text x="1103" y="594" text-anchor="middle" class="class-title">Strings and byte arrays</text>
  <line x1="938" y1="614" x2="1268" y2="614" class="sep"/>
  <text x="966" y="640" class="member">NUL-terminated and versioned strings</text>
  <text x="966" y="662" class="member">reversed / add-offset arrays</text>

  <rect x="1344" y="562" width="330" height="132" rx="7" class="sequential" filter="url(#softShadow)"/>
  <text x="1509" y="594" text-anchor="middle" class="class-title">Bit-level wrapper</text>
  <line x1="1344" y1="614" x2="1674" y2="614" class="sep"/>
  <text x="1372" y="640" class="member">ByteBuf.toBitBuf()</text>
  <text x="1372" y="662" class="member">read/write arbitrary bit widths</text>

  <rect x="72" y="810" width="1656" height="210" rx="16" class="output-panel"/>
  <text x="102" y="850" class="panel-title">3. Return values, write bytes, then release safely</text>

  <rect x="180" y="902" width="350" height="68" rx="7" class="result" filter="url(#softShadow)"/>
  <text x="355" y="930" text-anchor="middle" class="class-title">Decoded domain values</text>
  <text x="355" y="956" text-anchor="middle" class="member">numbers, text, byte arrays, bits</text>

  <rect x="720" y="902" width="350" height="68" rx="7" class="result" filter="url(#softShadow)"/>
  <text x="895" y="930" text-anchor="middle" class="class-title">Encoded response bytes</text>
  <text x="895" y="956" text-anchor="middle" class="member">write* mirrors read* families</text>

  <rect x="1260" y="902" width="350" height="68" rx="7" class="safety" filter="url(#softShadow)"/>
  <text x="1435" y="930" text-anchor="middle" class="class-title">ReferenceCounted cleanup</text>
  <text x="1435" y="956" text-anchor="middle" class="member">use { } releases even on failure</text>

  <path d="M 460 314 H 620" class="flowSlate"/>
  <path d="M 1040 314 H 1210" class="flowTeal" style="marker-end:none"/>
<polyline points="1198,320 1210,314 1198,308" fill="none" stroke="#5f8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path d="M 830 376 V 530" class="bus"/>
  <path d="M 291 562 V 530 H 1509 V 562" class="bus"/>
  <path d="M 697 530 V 562" class="flowGold"/>
  <path d="M 1103 530 V 562" class="flowRed"/>

  <path d="M 291 694 L 291 766 Q 291 780 305 780 L 341 780 Q 355 780 355 794 L 355 902" class="flowBlue"/>
  <path d="M 697 694 L 697 766 Q 697 780 711 780 L 881 780 Q 895 780 895 794 L 895 902" class="flowGold"/>
  <path d="M 1103 694 L 1103 766 Q 1103 780 1089 780 L 909 780 Q 895 780 895 794 L 895 902" class="flowRed"/>
  <path d="M 1509 694 L 1509 766 Q 1509 780 1495 780 L 1449 780 Q 1435 780 1435 794 L 1435 902" class="flowGreen"/>
  <path d="M 1070 936 H 1260" class="flowTeal" style="marker-end:none"/>
<polyline points="1248,942 1260,936 1248,930" fill="none" stroke="#5f8d94" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
</svg>
