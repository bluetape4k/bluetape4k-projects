<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-netty ByteBuf extension API structure</title>
  <desc id="desc">Source-backed map of ByteBuf extension families: indexed access, sequential reads and writes, smart encodings, string and byte-array helpers, bit-level wrapper, and ByteBufUtil bridge functions.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small, .footer, .label { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; fill: #546a73; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .api-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .side-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .rule-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .api { fill: #ffffff; stroke: #4f6c77; stroke-width: 2; }
      .indexed { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .read { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .write { fill: #fff8ec; stroke: #b48748; stroke-width: 2; }
      .encoding { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .string { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .value { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .bridge { fill: #f0f7f8; stroke: #5f8d94; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .flow { fill: none; stroke: #455a64; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
      .usesBlue { fill: none; stroke: #4b74a5; stroke-width: 1.8; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .usesGold { fill: none; stroke: #a2743d; stroke-width: 1.8; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
    </style>
    <marker id="arrowSlate" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1132" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-netty ByteBuf Extension API</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">ByteBuf remains the runtime buffer; bluetape4k adds indexed, sequential, encoded, string, and bit-level helpers around it.</text>

  <rect x="72" y="150" width="1168" height="820" rx="16" class="api-panel"/>
  <text x="102" y="190" class="panel-title">ByteBuf extension families</text>
  <text x="102" y="218" class="small">Extension functions keep Netty readerIndex and writerIndex semantics explicit: get/set are positional, read/write move indexes.</text>

  <rect x="430" y="258" width="450" height="130" rx="7" class="api" filter="url(#softShadow)"/>
  <text x="655" y="290" text-anchor="middle" class="class-title">Netty ByteBuf</text>
  <line x1="430" y1="312" x2="880" y2="312" class="sep"/>
  <text x="462" y="338" class="member">readerIndex / writerIndex ownership</text>
  <text x="462" y="360" class="member">ByteBuf is still the storage and lifecycle boundary</text>

  <rect x="118" y="506" width="300" height="140" rx="7" class="indexed" filter="url(#softShadow)"/>
  <text x="268" y="538" text-anchor="middle" class="class-title">Indexed get / set</text>
  <line x1="118" y1="558" x2="418" y2="558" class="sep"/>
  <text x="146" y="584" class="member">getByteAdd / getByteSub</text>
  <text x="146" y="606" class="member">setMediumLME / setIntIME</text>
  <text x="146" y="628" class="member">does not move readerIndex</text>

  <rect x="506" y="506" width="300" height="140" rx="7" class="read" filter="url(#softShadow)"/>
  <text x="656" y="538" text-anchor="middle" class="class-title">Sequential reads</text>
  <line x1="506" y1="558" x2="806" y2="558" class="sep"/>
  <text x="534" y="584" class="member">readByteNeg / readUIntME</text>
  <text x="534" y="606" class="member">readString / readBytesAdd</text>
  <text x="534" y="628" class="member">advances readerIndex</text>

  <rect x="894" y="506" width="300" height="140" rx="7" class="write" filter="url(#softShadow)"/>
  <text x="1044" y="538" text-anchor="middle" class="class-title">Sequential writes</text>
  <line x1="894" y1="558" x2="1194" y2="558" class="sep"/>
  <text x="922" y="584" class="member">writeByteAdd / writeIntME</text>
  <text x="922" y="606" class="member">writeString / writeBytesReversed</text>
  <text x="922" y="628" class="member">advances writerIndex</text>

  <rect x="118" y="744" width="300" height="140" rx="7" class="encoding" filter="url(#softShadow)"/>
  <text x="268" y="776" text-anchor="middle" class="class-title">Smart and varint</text>
  <line x1="118" y1="796" x2="418" y2="796" class="sep"/>
  <text x="146" y="822" class="member">Smart / USmart range constants</text>
  <text x="146" y="844" class="member">short, int, nullable UInt smart</text>
  <text x="146" y="866" class="member">readVarInt / writeVarInt</text>

  <rect x="506" y="744" width="300" height="140" rx="7" class="string" filter="url(#softShadow)"/>
  <text x="656" y="776" text-anchor="middle" class="class-title">Strings and byte arrays</text>
  <line x1="506" y1="796" x2="806" y2="796" class="sep"/>
  <text x="534" y="822" class="member">NUL-terminated readString</text>
  <text x="534" y="844" class="member">versioned string guard</text>
  <text x="534" y="866" class="member">reversed and add-offset arrays</text>

  <rect x="894" y="744" width="300" height="140" rx="7" class="value" filter="url(#softShadow)"/>
  <text x="1044" y="776" text-anchor="middle" class="class-title">24 and 48-bit values</text>
  <line x1="894" y1="796" x2="1194" y2="796" class="sep"/>
  <text x="922" y="822" class="member">Medium / UMedium = 3 bytes</text>
  <text x="922" y="844" class="member">SmallLong / USmallLong = 6 bytes</text>
  <text x="922" y="866" class="member">mixed-endian helpers</text>

  <rect x="1280" y="150" width="448" height="820" rx="16" class="side-panel"/>
  <text x="1310" y="190" class="panel-title">Wrappers and Netty utility bridge</text>
  <text x="1310" y="218" class="small">Side APIs expose bit-level access and ByteBufUtil conveniences.</text>
  <text x="1310" y="240" class="small">They wrap or delegate to ByteBuf instead of replacing it.</text>

  <rect x="1330" y="284" width="348" height="156" rx="7" class="api" filter="url(#softShadow)"/>
  <text x="1504" y="316" text-anchor="middle" class="class-title">BitBuf wrapper</text>
  <line x1="1330" y1="336" x2="1678" y2="336" class="sep"/>
  <text x="1358" y="362" class="member">ByteBuf.toBitBuf()</text>
  <text x="1358" y="384" class="member">bit readerIndex / writerIndex</text>
  <text x="1358" y="406" class="member">get/set/read/write bits</text>

  <rect x="1330" y="530" width="348" height="176" rx="7" class="bridge" filter="url(#softShadow)"/>
  <text x="1504" y="562" text-anchor="middle" class="class-title">ByteBufUtil bridge</text>
  <line x1="1330" y1="582" x2="1678" y2="582" class="sep"/>
  <text x="1358" y="608" class="member">hexDump / prettyHexDump</text>
  <text x="1358" y="630" class="member">equals / compare / indexOf</text>
  <text x="1358" y="652" class="member">writeUtf8 / writeAscii</text>
  <text x="1358" y="674" class="member">isText / isUtf8 / isAscii</text>

  <rect x="1330" y="796" width="348" height="88" rx="7" class="value" filter="url(#softShadow)"/>
  <text x="1504" y="828" text-anchor="middle" class="class-title">Transport probe</text>
  <line x1="1330" y1="848" x2="1678" y2="848" class="sep"/>
  <text x="1358" y="874" class="member">epoll / kqueue availability checks</text>

  <rect x="92" y="1012" width="1616" height="82" rx="14" class="rule-panel"/>
  <text x="122" y="1044" class="panel-title">Reader contract</text>
  <text x="122" y="1072" class="small">Use positional get/set when indexes must not move; use read/write for protocol streams; use Smart, Medium, SmallLong, and BitBuf when wire format width matters.</text>

  <path d="M 655 388 V 454" class="bus"/>
  <path d="M 268 506 V 454 H 1044 V 506" class="bus"/>
  <path d="M 656 454 V 506" class="flow"/>

  <path d="M 268 646 V 700" class="bus"/>
  <path d="M 1044 646 V 700" class="bus"/>
  <path d="M 268 700 H 1044" class="bus"/>
  <path d="M 268 700 V 744" class="flow"/>
  <path d="M 656 646 V 744" class="flow"/>
  <path d="M 1044 700 V 744" class="flow"/>

  <path d="M 880 316 L 1232 316 Q 1246 316 1246 330 L 1246 348 Q 1246 362 1260 362 L 1330 362" class="usesGold" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1318,368 1330,362 1318,356" fill="none" stroke="#a2743d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 880 350 L 1198 350 Q 1212 350 1212 364 L 1212 604 Q 1212 618 1226 618 L 1330 618" class="usesBlue" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1318,624 1330,618 1318,612" fill="none" stroke="#4b74a5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
</svg>
