<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-label="Spring Boot Core capability map">
  <style>
    text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }
    .subtitle { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect width="1360" height="820" fill="#ffffff"/>
  <text x="64" y="62" font-size="30" font-weight="700" fill="#111827">Spring Boot Core Capability Map</text>
  <text class="subtitle" x="64" y="92" font-size="15" fill="#64748b">Source-backed module surface: Kotlin-friendly Spring APIs, coroutine runtime helpers, HTTP clients, and observability boundaries.</text>


  <g class="lane" data-lane="DEVELOPER-FACING APIS">
    <rect x="42" y="122" width="404" height="430" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="60" y="148" font-size="14" font-weight="700" fill="#2563eb">DEVELOPER-FACING APIS</text>
    <text x="60" y="169" font-size="12.5" fill="#6b7280">Small Kotlin extensions used directly by application code.</text>
  </g>

  <g class="lane" data-lane="COROUTINE AND HTTP RUNTIME">
    <rect x="478" y="122" width="404" height="430" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="496" y="148" font-size="14" font-weight="700" fill="#ea580c">COROUTINE AND HTTP RUNTIME</text>
    <text x="496" y="169" font-size="12.5" fill="#6b7280">Runtime adapters that bind Spring APIs to coroutine usage.</text>
  </g>

  <g class="lane" data-lane="OBSERVABILITY OWNERSHIP">
    <rect x="914" y="122" width="404" height="430" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="932" y="148" font-size="14" font-weight="700" fill="#16a34a">OBSERVABILITY OWNERSHIP</text>
    <text x="932" y="169" font-size="12.5" fill="#6b7280">Helpers create scopes; the application owns exporters.</text>
  </g>

  <path class="edge" d="M424 258 L500 258" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M424 417 L500 417" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M860 260 L936 260" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M1116 320 L1116 354" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="1110,342 1116,354 1122,342" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g class="card" data-card="Core Kotlin Extensions">
    <rect x="64" y="194" width="360" height="126" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <circle cx="89" cy="221" r="13" fill="#2563eb" opacity="0.18"/>
       <text x="89" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">{}</text>
    <text x="112" y="225" font-size="18" font-weight="700" fill="#111827">Core Kotlin Extensions</text>
    <text x="82" y="253" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">BeanFactory get/findBean operators</text>
<text x="82" y="271" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Merged annotation lookup + copy</text>
<text x="82" y="289" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">PropertyResolver and profile annotations</text>
  </g>

  <g class="card" data-card="Support Utilities">
    <rect x="64" y="354" width="360" height="126" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <circle cx="89" cy="381" r="13" fill="#0f766e" opacity="0.18"/>
       <text x="89" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#0f766e">+</text>
    <text x="112" y="385" font-size="18" font-weight="700" fill="#111827">Support Utilities</text>
    <text x="82" y="413" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">API error response and exception helpers</text>
<text x="82" y="431" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">ExampleMatcher, DataBuffer, MessageBuilder</text>
<text x="82" y="449" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Model, StopWatch, member/toString helpers</text>
  </g>

  <g class="card" data-card="WebFlux Coroutine Bases">
    <rect x="500" y="194" width="360" height="132" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <circle cx="525" cy="221" r="13" fill="#ea580c" opacity="0.18"/>
       <text x="525" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#ea580c">~</text>
    <text x="548" y="225" font-size="18" font-weight="700" fill="#111827">WebFlux Coroutine Bases</text>
    <text x="518" y="253" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Default, IO, and virtual-thread scopes</text>
<text x="518" y="271" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">SupervisorJob isolates sibling failures</text>
<text x="518" y="289" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">@PreDestroy cancels controller scope</text>
  </g>

  <g class="card" data-card="HTTP Client Helpers">
    <rect x="500" y="366" width="360" height="132" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <circle cx="525" cy="393" r="13" fill="#7c3aed" opacity="0.18"/>
       <text x="525" y="398" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">-&gt;</text>
    <text x="548" y="397" font-size="18" font-weight="700" fill="#111827">HTTP Client Helpers</text>
    <text x="518" y="425" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">RestClient suspend verbs on Dispatchers.IO</text>
<text x="518" y="443" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">WebClient/WebTestClient verb extensions</text>
<text x="518" y="461" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Flow and Publisher request-body overloads</text>
  </g>

  <g class="card" data-card="Observation Boundary">
    <rect x="936" y="194" width="360" height="126" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <circle cx="961" cy="221" r="13" fill="#16a34a" opacity="0.18"/>
       <text x="961" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">o</text>
    <text x="984" y="225" font-size="18" font-weight="700" fill="#111827">Observation Boundary</text>
    <text x="954" y="253" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">observeSpring and suspending variants</text>
<text x="954" y="271" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Low/high cardinality key values</text>
<text x="954" y="289" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Reactor + coroutine observation context</text>
  </g>

  <g class="card" data-card="Application-Owned Export">
    <rect x="936" y="354" width="360" height="126" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
    <circle cx="961" cy="381" r="13" fill="#475569" opacity="0.18"/>
       <text x="961" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">*</text>
    <text x="984" y="385" font-size="18" font-weight="700" fill="#111827">Application-Owned Export</text>
    <text x="954" y="413" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Prometheus and OTLP stay in Actuator config</text>
<text x="954" y="431" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">No custom exporter or global SDK mutation</text>
<text x="954" y="449" text-anchor="start" font-size="13.5" font-weight="400" fill="#4b5563">Boot app keeps backend ownership</text>
  </g>

  <g class="boundary" data-boundary="spring-boot-app">
    <rect x="218" y="612" width="924" height="106" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="680" y="652" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Spring Boot 4 Application</text>
    <text x="680" y="680" text-anchor="middle" font-size="14" fill="#475569">Imports the module, chooses which extension surface to use, and keeps concrete infrastructure configuration in the app.</text>
  </g>
  <path class="edge" d="M244 480 L244 612" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M680 498 L680 612" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M1116 480 L1116 612" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

  <g class="legend" transform="translate(64 760)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
    <text x="52" y="5" font-size="13" fill="#475569">Kotlin API surface</text>
    <line x1="230" y1="0" x2="268" y2="0" stroke="#7c3aed" stroke-width="3.2" marker-end="url(#arrow-purple)"/>
    <text x="282" y="5" font-size="13" fill="#475569">Coroutine/HTTP adapter</text>
    <line x1="510" y1="0" x2="548" y2="0" stroke="#16a34a" stroke-width="3.2" marker-end="url(#arrow-green)"/>
    <text x="562" y="5" font-size="13" fill="#475569">Observation scope</text>
    <line x1="750" y1="0" x2="788" y2="0" stroke="#64748b" stroke-width="2.8" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
    <text x="802" y="5" font-size="13" fill="#475569">Application-owned config</text>
  </g>
</svg>