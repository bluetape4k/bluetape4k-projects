<rect class="boundary" x="105" y="680" width="1590" height="165" rx="10"/>
<g><rect class="card" x="145" y="710" width="240" height="108" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="helperTitle" x="265" y="748" text-anchor="middle">matchStage</text><g><text class="code" x="186.25" y="784" fill="#9333EA">Aggregates</text><text class="code" x="253.75" y="784" fill="#64748B">.</text><text class="code" x="259" y="784" fill="#0D9488">match</text><text class="code" x="292.75" y="784" fill="#64748B">(</text><text class="code" x="298" y="784" fill="#0F172A">filter</text><text class="code" x="338.5" y="784" fill="#64748B">)</text></g></g><g><rect class="card" x="430" y="710" width="240" height="108" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="helperTitle" x="550" y="748" text-anchor="middle">groupStage</text><g><text class="code" x="488.425" y="784" fill="#0D9488">group</text><text class="code" x="522.175" y="784" fill="#64748B">(&quot;$</text><text class="code" x="537.925" y="784" fill="#0F172A">id</text><text class="code" x="551.425" y="784" fill="#64748B">&quot;,</text><text class="code" x="561.925" y="784" fill="#0F172A"> </text><text class="code" x="565.8249999999999" y="784" fill="#0F172A">fields</text><text class="code" x="606.3249999999999" y="784" fill="#64748B">)</text></g></g><g><rect class="card" x="715" y="710" width="240" height="108" rx="8" fill="#FAF5FF" stroke="#9333EA"/><text class="helperTitle" x="835" y="748" text-anchor="middle">sortStage</text><g><text class="code" x="766.375" y="784" fill="#9333EA">Aggregates</text><text class="code" x="833.875" y="784" fill="#64748B">.</text><text class="code" x="839.125" y="784" fill="#0D9488">sort</text><text class="code" x="866.125" y="784" fill="#64748B">(</text><text class="code" x="871.375" y="784" fill="#0D9488">sort</text><text class="code" x="898.375" y="784" fill="#64748B">)</text></g></g><g><rect class="card" x="1000" y="710" width="240" height="108" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="helperTitle" x="1120" y="748" text-anchor="middle">limit / skip</text><g><text class="code" x="1062.1" y="784" fill="#0F172A">page</text><text class="code" x="1089.1" y="784" fill="#0F172A"> </text><text class="code" x="1093" y="784" fill="#0F172A">stream</text><text class="code" x="1133.5" y="784" fill="#0F172A"> </text><text class="code" x="1137.4" y="784" fill="#0F172A">source</text></g></g><g><rect class="card" x="1285" y="710" width="240" height="108" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="helperTitle" x="1405" y="748" text-anchor="middle">projectStage</text><g><text class="code" x="1355.8" y="784" fill="#0F172A">projection</text><text class="code" x="1423.3" y="784" fill="#0F172A"> </text><text class="code" x="1427.2" y="784" fill="#7C3AED">Bson</text></g></g><g><rect class="card" x="1560" y="710" width="130" height="108" rx="8" fill="#FDF2F8" stroke="#DB2777"/><text class="helperTitle" x="1625" y="748" text-anchor="middle">unwind</text><g><text class="code" x="1600.25" y="784" fill="#64748B">&quot;$</text><text class="code" x="1610.75" y="784" fill="#0F172A">field</text><text class="code" x="1644.5" y="784" fill="#64748B">&quot;</text></g></g>
<path class="helper" d="M 900 680 L 900 589 Q 900 575 886 575 L 749 575 Q 735 575 735 561 L 735 422"/>
<text class="sub" x="680" y="836">stage helpers return Bson values that the builder appends in caller-defined order</text>
<rect class="lane" x="70" y="905" width="1660" height="100" rx="10" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/>
<text class="laneTitle" x="104" y="960">Design contract</text>
<text class="sub" x="350" y="935">The DSL only composes ordered Bson stages; it does not own execution, cursor lifecycle, or collection typing.</text>
<text class="sub" x="350" y="965">Execute with native aggregate(stages), then use Flow operators such as collect(), toList(), map(), or filter().</text>
</svg>