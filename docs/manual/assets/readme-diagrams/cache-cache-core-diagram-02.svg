</defs>
<rect class="canvas" width="2200" height="1565" />
<rect class="frame" x="34" y="30" width="2132" height="1505" rx="8" />
<text class="title" x="72" y="86">NearCacheOperations Blocking Contract</text>
<text class="subtitle" x="76" y="120">cache-core blocking near-cache API, retry decorator, failure policy, and statistics snapshot model.</text>
<g>
  <rect class="chip" x="1325" y="78" width="180" height="54" rx="18" fill="#EFF6FF" stroke="#2563EB" />
  <text class="chipText" x="1415" y="112" text-anchor="middle">interface</text>
</g>
<g>
  <rect class="chip" x="1528" y="78" width="180" height="54" rx="18" fill="#FDF2F8" stroke="#DB2777" />
  <text class="chipText" x="1618" y="112" text-anchor="middle">decorator</text>
</g>
<g>
  <rect class="chip" x="1731" y="78" width="180" height="54" rx="18" fill="#F0FDF4" stroke="#16A34A" />
  <text class="chipText" x="1821" y="112" text-anchor="middle">statistics</text>
</g>
<g>
  <rect class="chip" x="1934" y="78" width="180" height="54" rx="18" fill="#FFF7ED" stroke="#EA580C" />
  <text class="chipText" x="2024" y="112" text-anchor="middle">config</text>
</g>
<text class="sectionLabel" x="650" y="205">Blocking API surface</text>
<text class="sectionLabel" x="178" y="600">Retry and failure policy</text>
<text class="sectionLabel" x="1508" y="600">Statistics snapshot model</text>
<g id="AutoCloseable">
  <rect class="classBox" x="765" y="235" width="560" height="190" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="stereotype" x="1045" y="263" text-anchor="middle">&lt;&lt;JDK interface&gt;&gt;</text>
  <text class="classTitle" x="1045" y="293" text-anchor="middle">AutoCloseable</text>
  <path class="divider" d="M765 311H1325" stroke="#475569" />

  <path class="divider" d="M765 369H1325" stroke="#475569" />
  <text class="member" x="789" y="395">+ close(): Unit</text>
</g>
<g id="NearCacheOperations">
  <rect class="classBox" x="605" y="525" width="880" height="365" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereotype" x="1045" y="553" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="classTitle" x="1045" y="583" text-anchor="middle">NearCacheOperations&lt;V&gt;</text>
  <path class="divider" d="M605 601H1485" stroke="#1D4ED8" />
  <text class="member" x="629" y="627">+ cacheName: String</text>
<text class="member" x="629" y="649">+ isClosed: Boolean</text>
<text class="member" x="629" y="671">+ key type fixed to String</text>
  <path class="divider" d="M605 701H1485" stroke="#1D4ED8" />
  <text class="member" x="629" y="727">+ read: get / getAll / containsKey</text>
<text class="member" x="629" y="749">+ write: put / putAll / putIfAbsent / replace</text>
<text class="member" x="629" y="771">+ delete: remove / removeAll / getAndRemove / getAndReplace</text>
<text class="member" x="629" y="793">+ manage: clearLocal / clearAll / localCacheSize / backCacheSize</text>
<text class="member" x="629" y="815">+ stats(): NearCacheStatistics</text>
<text class="member" x="629" y="837">+ close(): Unit</text>
</g>
<g id="ResilientNearCacheDecorator">
  <rect class="classBox" x="605" y="1110" width="880" height="320" rx="8" fill="#FDF2F8" stroke="#DB2777" />
  <text class="stereotype" x="1045" y="1138" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="classTitle" x="1045" y="1168" text-anchor="middle">ResilientNearCacheDecorator&lt;V&gt;</text>
  <path class="divider" d="M605 1186H1485" stroke="#BE185D" />
  <text class="member" x="629" y="1212">delegate: NearCacheOperations&lt;V&gt;</text>
<text class="member" x="629" y="1234">config: NearCacheResilienceConfig</text>
<text class="member" x="629" y="1256">retry: resilience4j Retry</text>
  <path class="divider" d="M605 1286H1485" stroke="#BE185D" />
  <text class="member" x="629" y="1312">implements the same blocking contract</text>
<text class="member" x="629" y="1334">read failures use GetFailureStrategy</text>
<text class="member" x="629" y="1356">write/back operations run through retry</text>
<text class="member" x="629" y="1378">clearLocal(), stats(), close() delegate directly</text>
</g>
<g id="NearCacheResilienceConfig">
  <rect class="classBox" x="155" y="650" width="385" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereotype" x="347.5" y="678" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="classTitle" x="347.5" y="708" text-anchor="middle">NearCacheResilienceConfig</text>
  <path class="divider" d="M155 726H540" stroke="#C2410C" />
  <text class="member" x="179" y="752">retryMaxAttempts</text>
<text class="member" x="179" y="774">retryWaitDuration</text>
<text class="member" x="179" y="796">retryExponentialBackoff</text>
<text class="member" x="179" y="818">getFailureStrategy</text>
  <path class="divider" d="M155 848H540" stroke="#C2410C" />
  <text class="member" x="179" y="874">validated positive retry settings</text>
</g>
<g id="GetFailureStrategy">
  <rect class="classBox" x="155" y="1048" width="385" height="210" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereotype" x="347.5" y="1076" text-anchor="middle">&lt;&lt;enum&gt;&gt;</text>
  <text class="classTitle" x="347.5" y="1106" text-anchor="middle">GetFailureStrategy</text>
  <path class="divider" d="M155 1124H540" stroke="#C2410C" />
  <text class="member" x="179" y="1150">RETURN_FRONT_OR_NULL</text>
<text class="member" x="179" y="1172">PROPAGATE_EXCEPTION</text>
  <path class="divider" d="M155 1202H540" stroke="#C2410C" />
  <text class="member" x="179" y="1228">applies to back-cache GET failures</text>
</g>
<g id="NearCacheStatistics">
  <rect class="classBox" x="1555" y="650" width="565" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereotype" x="1837.5" y="678" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="classTitle" x="1837.5" y="708" text-anchor="middle">NearCacheStatistics</text>
  <path class="divider" d="M1555 726H2120" stroke="#15803D" />
  <text class="member" x="1579" y="752">localHits / localMisses / localSize</text>
<text class="member" x="1579" y="774">localEvictions</text>
<text class="member" x="1579" y="796">backHits / backMisses</text>
  <path class="divider" d="M1555 826H2120" stroke="#15803D" />
  <text class="member" x="1579" y="852">+ hitRate: Double</text>
</g>
<g id="DefaultNearCacheStatistics">
  <rect class="classBox" x="1555" y="1048" width="565" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereotype" x="1837.5" y="1076" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="classTitle" x="1837.5" y="1106" text-anchor="middle">DefaultNearCacheStatistics</text>
  <path class="divider" d="M1555 1124H2120" stroke="#15803D" />
  <text class="member" x="1579" y="1150">immutable counter snapshot</text>
<text class="member" x="1579" y="1172">defaults all counters to zero</text>
  <path class="divider" d="M1555 1202H2120" stroke="#15803D" />
  <text class="member" x="1579" y="1228">hitRate = (localHits + backHits) / total</text>
<text class="member" x="1579" y="1250">returns 0.0 when total is zero</text>
</g>
<g>
  <rect class="noteBox" x="155" y="1322" width="385" height="165" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="noteTitle" x="183" y="1370">Reading rule</text>
  <text class="noteLine" x="185" y="1414">Hollow triangle = interface realization</text>
<text class="noteLine" x="185" y="1446">Dashed arrow = dependency</text>
<text class="noteLine" x="185" y="1478">This diagram is blocking-only</text>
</g>
<g data-from="NearCacheOperations" data-to="AutoCloseable">
  <path class="edge " d="M1045 525 L1045 425" stroke="#1D4ED8" marker-end="url(#triangle-blue)" />
  <text class="edgeLabel" x="1070" y="470">extends</text>
</g>
<g data-from="ResilientNearCacheDecorator" data-to="NearCacheOperations">
  <path class="edge dashed" d="M1045 1110 L1045 890" stroke="#BE185D" />

  <polygon points="1045,890 1055,912 1035,912" fill="#FFFFFF" stroke="none" />

  <polygon class="markerSolid" points="1045,890 1055,912 1035,912" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1070" y="994">implements</text>
</g>
<g data-from="NearCacheOperations" data-to="NearCacheStatistics">
  <path class="edge dashed"  d="M1485 755 L1555 755" stroke="#15803D" />

  <polyline points="1537,763 1555,755 1537,747" fill="none" stroke="#15803D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1503" y="734">stats()</text>
</g>
<g data-from="DefaultNearCacheStatistics" data-to="NearCacheStatistics">
  <path class="edge dashed" d="M1838 1048 L1838 900" stroke="#15803D" />

  <polygon points="1838,900 1848,922 1828,922" fill="#FFFFFF" stroke="none" />

  <polygon class="markerSolid" points="1838,900 1848,922 1828,922" fill="#FFFFFF" stroke="#15803D" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="butt" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="1863" y="968">implements</text>
</g>
<g data-from="ResilientNearCacheDecorator" data-to="NearCacheResilienceConfig">
  <path class="edge dashed"  d="M 605 1220 L 579 1220 Q 565 1220 565 1206 L 565 785 Q 565 775 555 775 L 540 775" stroke="#C2410C" stroke-linecap="round" stroke-linejoin="round" />

  <polyline points="558,767 540,775 558,783" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="585" y="976">uses</text>
</g>
<g data-from="NearCacheResilienceConfig" data-to="GetFailureStrategy">
  <path class="edge dashed"  d="M348 900 L348 1048" stroke="#C2410C" />

  <polyline points="340,1030 348,1048 356,1030" fill="none" stroke="#C2410C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" />
  <text class="edgeLabel" x="373" y="974">selects</text>
</g>
</svg>
