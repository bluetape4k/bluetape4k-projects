<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="980" viewBox="0 0 1760 980" role="img" aria-label="Workflow Concept Overview">
<defs>
  <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-builds" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#2563EB" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-adds" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#2563EB" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-contextInput" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#EA580C" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-dispatch" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#16A34A" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-returns" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#0D9488" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-controls" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 20 16">
    <path stroke-dasharray="none" d="M2 2 L18 8 L2 14 Z" fill="#9333EA" style="stroke-dasharray:none"/>
  </marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}
    .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .card{filter:url(#softShadow);stroke-width:1.9}
    .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
    .detail{font-family:"Comic Mono";font-size:13.5px;fill:#475569}
    .icon{stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
    .edge{fill:none;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}
    .dashed{stroke-dasharray:9 8}
    .edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}
    .edgeLabel text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}
    .legend text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="1760" height="980"/>
<rect class="frame" x="38" y="30" width="1684" height="914" rx="8"/>
<text class="title" x="78" y="86">Workflow Concept Overview</text>
<text class="subtitle" x="82" y="118">DSL builders compose sync and suspend work units; each unit receives shared context and returns a WorkReport that drives flow control.</text>

<g id="edges">
  <path class="edge" data-from="dsl" data-to="flow" d="M470 255 L1180 255" stroke="#2563EB" marker-end="url(#arrow-builds)"/>
  <path class="edge dashed" data-from="dsl" data-to="work" d="M 290 320 L 290 431 Q 290 445 304 445 L 946 445 Q 960 445 960 459 L 960 500" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="954,488 960,500 966,488" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="edge" data-from="context" data-to="work" d="M760 584 L900 584" stroke="#EA580C" marker-end="url(#arrow-contextInput)"/>
  <path class="edge" data-from="flow" data-to="work" d="M 1395 328 L 1395 550 Q 1395 564 1381 564 L 1310 564" stroke="#16A34A" marker-end="url(#arrow-dispatch)" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="edge" data-from="work" data-to="report" d="M1105 632 L1105 730" stroke="#0D9488" marker-end="url(#arrow-returns)"/>
  <path class="edge dashed" data-from="report" data-to="flow" d="M 1310 796 L 1496 796 Q 1510 796 1510 782 L 1510 328" stroke="#9333EA" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1516,340 1510,328 1504,340" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
</g>
<g id="labels">
  <g class="edgeLabel" transform="translate(712 215)">
  <rect width="226" height="30" rx="8"/>
  <text x="113" y="20" text-anchor="middle">builds orchestration graph</text>
</g>
  <g class="edgeLabel" transform="translate(538 405)">
  <rect width="176" height="30" rx="8"/>
  <text x="88" y="20" text-anchor="middle">adds execute blocks</text>
</g>
  <g class="edgeLabel" transform="translate(777 600)">
  <rect width="106" height="30" rx="8"/>
  <text x="53" y="20" text-anchor="middle">input state</text>
</g>
  <g class="edgeLabel" transform="translate(1356 437)">
  <rect width="144" height="30" rx="8"/>
  <text x="72" y="20" text-anchor="middle">dispatches units</text>
</g>
  <g class="edgeLabel" transform="translate(1124 669)">
  <rect width="124" height="30" rx="8"/>
  <text x="62" y="20" text-anchor="middle">returns result</text>
</g>
  <g class="edgeLabel" transform="translate(1463 565)">
  <rect width="158" height="30" rx="8"/>
  <text x="79" y="20" text-anchor="middle">controls next step</text>
</g>
</g>

<g id="dsl">
  <rect class="card" x="110" y="190" width="360" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(134 214)" stroke="#2563EB">
    <path d="M22 4 C12 4 13 18 8 21 C13 24 12 38 22 38" fill="none"/>
    <path d="M42 4 C52 4 51 18 56 21 C51 24 52 38 42 38" fill="none"/>
    <circle cx="32" cy="21" r="4" fill="#2563EB" stroke="none"/>
  </g>
  <text class="cardTitle" x="290" y="230" text-anchor="middle">Workflow DSL</text>
  <text class="detail" x="290" y="268" text-anchor="middle">workflow { ... }</text>
<text class="detail" x="290" y="287" text-anchor="middle">sequential, parallel, retry</text>
</g>
<g id="context">
  <rect class="card" x="350" y="500" width="410" height="132" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <g class="icon" transform="translate(374 524)" stroke="#EA580C">
    <ellipse cx="31" cy="9" rx="25" ry="8" fill="#FFFFFF"/>
    <path d="M6 9 V35 C6 40 56 40 56 35 V9" fill="#FFFFFF"/>
    <path d="M6 22 C6 27 56 27 56 22" fill="none"/>
    <ellipse cx="31" cy="9" rx="25" ry="8" fill="none"/>
  </g>
  <text class="cardTitle" x="555" y="540" text-anchor="middle">WorkContext</text>
  <text class="detail" x="555" y="578" text-anchor="middle">ConcurrentHashMap-backed state</text>
<text class="detail" x="555" y="597" text-anchor="middle">get, set, compute, merge</text>
</g>
<g id="work">
  <rect class="card" x="900" y="500" width="410" height="132" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <g class="icon" transform="translate(924 524)" stroke="#16A34A">
    <rect x="5" y="6" width="52" height="36" rx="7" fill="#FFFFFF"/>
    <path d="M20 17 L13 24 L20 31" fill="none"/>
    <path d="M42 17 L49 24 L42 31" fill="none"/>
    <path d="M35 14 L27 34" fill="none"/>
  </g>
  <text class="cardTitle" x="1127" y="540" text-anchor="middle">Work / SuspendWork</text>
  <text class="detail" x="1105" y="578" text-anchor="middle">execute(context): WorkReport</text>
<text class="detail" x="1105" y="597" text-anchor="middle">sync Work and suspend Work</text>
</g>
<g id="flow">
  <rect class="card" x="1180" y="190" width="430" height="138" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <g class="icon" transform="translate(1204 214)" stroke="#9333EA">
    <circle cx="13" cy="22" r="8" fill="#FFFFFF"/>
    <circle cx="49" cy="10" r="8" fill="#FFFFFF"/>
    <circle cx="49" cy="34" r="8" fill="#FFFFFF"/>
    <path d="M21 22 H32 C38 22 37 10 41 10" fill="none"/>
    <path d="M21 22 H32 C38 22 37 34 41 34" fill="none"/>
  </g>
  <text class="cardTitle" x="1429" y="230" text-anchor="middle">Flow implementations</text>
  <text class="detail" x="1395" y="268" text-anchor="middle">Sequential, Parallel, Conditional</text>
<text class="detail" x="1395" y="287" text-anchor="middle">Repeat and Retry strategies</text>
</g>
<g id="report">
  <rect class="card" x="900" y="730" width="410" height="132" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(924 754)" stroke="#0D9488">
    <rect x="6" y="7" width="50" height="36" rx="7" fill="#FFFFFF"/>
    <path d="M17 19 H45 M17 30 H38" fill="none"/>
    <circle cx="47" cy="31" r="5" fill="#0D9488" stroke="none"/>
  </g>
  <text class="cardTitle" x="1127" y="770" text-anchor="middle">WorkReport outcomes</text>
  <text class="detail" x="1105" y="808" text-anchor="middle">Success / Failure / PartialSuccess</text>
<text class="detail" x="1105" y="827" text-anchor="middle">Aborted and Cancelled terminate</text>
</g>

<g class="legend" transform="translate(94 900)">
  <line x1="0" y1="0" x2="34" y2="0" stroke="#2563EB" stroke-width="3.3" marker-end="url(#arrow-builds)"/>
  <text x="48" y="5">definition</text>
  <line x1="158" y1="0" x2="192" y2="0" stroke="#EA580C" stroke-width="3.3" marker-end="url(#arrow-contextInput)"/>
  <text x="206" y="5">context</text>
  <line x1="304" y1="0" x2="338" y2="0" stroke="#16A34A" stroke-width="3.3" marker-end="url(#arrow-dispatch)"/>
  <text x="352" y="5">execution</text>
  <line x1="468" y1="0" x2="502" y2="0" stroke="#9333EA" stroke-width="3.3" stroke-dasharray="9 8" marker-end="url(#arrow-controls)"/>
  <text x="516" y="5">flow decision</text>
</g>
</svg>
