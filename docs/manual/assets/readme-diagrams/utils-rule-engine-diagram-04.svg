<svg xmlns="http://www.w3.org/2000/svg" width="2380" height="1240" viewBox="0 0 2380 1240" role="img" aria-label="composite rule groups"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><marker id="arrow-base" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#1D4ED8" stroke="#1D4ED8"/></marker><marker id="arrow-act" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#0F766E" stroke="#0F766E"/></marker><marker id="arrow-cond" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#C2410C" stroke="#C2410C"/></marker><marker id="arrow-unit" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#15803D" stroke="#15803D"/></marker><marker id="arrow-out" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#475569" stroke="#475569"/></marker><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15.5px;fill:#475569}.card{stroke-width:1.9;filter:url(#softShadow)}.kicker{font-family:"Comic Mono";font-size:13px;fill:#475569}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.body{font-family:"Comic Mono";font-size:13.4px;fill:#334155}.foot{font-family:"Comic Mono";font-size:12.6px;fill:#475569}.divider{stroke-width:1.15;opacity:.45}.edge{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.edgeLabelBg{fill:#fff;stroke:#E2E8F0;stroke-width:1;opacity:.95}.edgeLabel{font-family:"Comic Mono";font-size:12.7px;fill:#334155}</style></defs><rect class="canvas" width="2380" height="1240"/><rect class="frame" x="34" y="30" width="2312" height="1176" rx="8"/><text class="title" x="74" y="88">Composite Rules</text><text class="subtitle" x="78" y="121">CompositeRule lets several child rules behave as one Rule; each concrete group changes only the child selection and execution policy.</text><g id="edges"><path class="edge" d="M425 480 L425 610" stroke="#1D4ED8" marker-end="url(#arrow-base)"/><rect class="edgeLabelBg" x="437" y="537" width="106" height="26" rx="6"/><text class="edgeLabel" x="445" y="555">owns rules</text><path class="edge" d="M730 305 L900 305" stroke="#0F766E" marker-end="url(#arrow-act)"/><rect class="edgeLabelBg" x="762" y="260" width="96" height="26" rx="6"/><text class="edgeLabel" x="770" y="278">variant</text><path class="edge" d="M 730 345 L 786 345 Q 800 345 800 359 L 800 678 Q 800 692 814 692 L 900 692" stroke="#C2410C" marker-end="url(#arrow-cond)" stroke-linecap="round" stroke-linejoin="round"/><rect class="edgeLabelBg" x="804" y="482" width="96" height="26" rx="6"/><text class="edgeLabel" x="812" y="500">variant</text><path class="edge" d="M 730 385 L 756 385 Q 770 385 770 399 L 770 1021 Q 770 1035 784 1035 L 900 1035" stroke="#15803D" marker-end="url(#arrow-unit)" stroke-linecap="round" stroke-linejoin="round"/><rect class="edgeLabelBg" x="774" y="777" width="96" height="26" rx="6"/><text class="edgeLabel" x="782" y="795">variant</text><path class="edge" d="M 1500 338 L 1576 338 Q 1590 338 1590 352 L 1590 586 Q 1590 600 1604 600 L 1685 600" stroke="#0F766E" marker-end="url(#arrow-act)" stroke-linecap="round" stroke-linejoin="round"/><rect class="edgeLabelBg" x="1597" y="537" width="106" height="26" rx="6"/><text class="edgeLabel" x="1605" y="555">first true</text><path class="edge" d="M1500 692 L1685 692" stroke="#C2410C" marker-end="url(#arrow-cond)"/><rect class="edgeLabelBg" x="1522" y="647" width="138" height="26" rx="6"/><text class="edgeLabel" x="1530" y="665">gate + matches</text><path class="edge" d="M 1500 1035 L 1576 1035 Q 1590 1035 1590 1021 L 1590 754 Q 1590 740 1604 740 L 1685 740" stroke="#15803D" marker-end="url(#arrow-unit)" stroke-linecap="round" stroke-linejoin="round"/><rect class="edgeLabelBg" x="1597" y="889" width="96" height="26" rx="6"/><text class="edgeLabel" x="1605" y="907">all pass</text></g><g id="cards"><g id="composite"><rect class="card" x="120" y="210" width="610" height="270" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="kicker" x="144" y="244">abstract Rule</text><text class="cardTitle" x="144" y="280">CompositeRule</text><path class="divider" d="M120 304H730" stroke="#1D4ED8"/><text class="body" x="144" y="340">extends AbstractRule</text><text class="body" x="144" y="365">stores rules in priority-sorted TreeSet</text><text class="body" x="144" y="390">addRule() accepts Rule or annotated object</text><text class="body" x="144" y="415">RuleProxy.asRule() adapts objects</text><path class="divider" d="M120 434H730" stroke="#1D4ED8"/><text class="foot" x="144" y="463">a group is itself a Rule</text></g><g id="input"><rect class="card" x="120" y="610" width="610" height="230" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="kicker" x="144" y="644">Rule children</text><text class="cardTitle" x="144" y="680">member rules</text><path class="divider" d="M120 704H730" stroke="#475569"/><text class="body" x="144" y="740">rules are sorted by priority</text><text class="body" x="144" y="765">each child still evaluates against Facts</text><text class="body" x="144" y="790">each child action mutates the same Facts</text><path class="divider" d="M120 794H730" stroke="#475569"/><text class="foot" x="144" y="823">composition changes selection policy</text></g><g id="activation"><rect class="card" x="900" y="210" width="600" height="255" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="kicker" x="924" y="244">first matching rule wins</text><text class="cardTitle" x="924" y="280">ActivationRuleGroup</text><path class="divider" d="M900 304H1500" stroke="#0F766E"/><text class="body" x="924" y="340">evaluate: first rule whose condition is true</text><text class="body" x="924" y="365">execute: only selectedRule</text><text class="body" x="924" y="390">later matching rules are ignored</text><path class="divider" d="M900 419H1500" stroke="#0F766E"/><text class="foot" x="924" y="448">use for exclusive alternatives</text></g><g id="conditional"><rect class="card" x="900" y="550" width="600" height="285" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="kicker" x="924" y="584">highest-priority rule gates the group</text><text class="cardTitle" x="924" y="620">ConditionalRuleGroup</text><path class="divider" d="M900 644H1500" stroke="#C2410C"/><text class="body" x="924" y="680">evaluate gate rule first</text><text class="body" x="924" y="705">if gate passes, collect matching remaining rules</text><text class="body" x="924" y="730">execute gate, then successfulEvaluations</text><text class="body" x="924" y="755">throws if two rules share highest priority</text><path class="divider" d="M900 789H1500" stroke="#C2410C"/><text class="foot" x="924" y="818">use for prerequisite + dependent rules</text></g><g id="unit"><rect class="card" x="900" y="920" width="600" height="230" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="kicker" x="924" y="954">all-or-nothing group</text><text class="cardTitle" x="924" y="990">UnitRuleGroup</text><path class="divider" d="M900 1014H1500" stroke="#15803D"/><text class="body" x="924" y="1050">evaluate: all child rules must pass</text><text class="body" x="924" y="1075">execute: every child rule action</text><text class="body" x="924" y="1100">empty group evaluates false</text><path class="divider" d="M900 1104H1500" stroke="#15803D"/><text class="foot" x="924" y="1133">use for required rule bundles</text></g><g id="result"><rect class="card" x="1685" y="520" width="560" height="300" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="kicker" x="1709" y="554">single Rule contract</text><text class="cardTitle" x="1709" y="590">what the engine sees</text><path class="divider" d="M1685 614H2245" stroke="#475569"/><text class="body" x="1709" y="650">RuleEngine only calls evaluate(facts)</text><text class="body" x="1709" y="675">then execute(facts) if the group matches</text><text class="body" x="1709" y="700">selection logic is hidden inside the group</text><text class="body" x="1709" y="725">Facts instance is shared through children</text><path class="divider" d="M1685 774H2245" stroke="#475569"/><text class="foot" x="1709" y="803">composite policies stay local</text></g></g></svg>