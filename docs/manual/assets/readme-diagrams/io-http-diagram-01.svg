<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-label="Multi-backend HTTP client architecture">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-green" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#16A34A" stroke="#16A34A" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-pink" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#DB2777" stroke="#DB2777" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-lime" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#65A30D" stroke="#65A30D" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-purple" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#9333EA" stroke="#9333EA" stroke-width="1.5"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .layer{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .layerLabel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .layerTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
      .card{stroke-width:2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .text{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .textSmall{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .badgeText{font-family:"Comic Mono";font-size:12px;fill:#0F172A}
      .flow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .hint{fill:#FFFFFF;stroke-width:1.5}
      .icon{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1180"/>
  <rect class="frame" x="36" y="30" width="1688" height="1120" rx="8"/>

  <text class="title" x="76" y="86">Multi-Backend HTTP Client Architecture</text>
  <text class="subtitle" x="80" y="120">The module keeps backend-specific clients explicit, then adds Kotlin DSLs, coroutine bridges, and virtual-thread friendly factories where each backend supports them.</text>

  <g id="api-layer">
    <rect class="layer" x="48" y="158" width="1626" height="226" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/>
    <rect class="layerLabel" x="116" y="178" width="220" height="38" rx="8"/>
    <text class="layerTitle" x="226" y="198" text-anchor="middle" dominant-baseline="middle">Caller-facing API</text>

    <g id="app-code">
      <rect class="card" x="140" y="232" width="290" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text class="icon" x="166" y="263" dominant-baseline="middle">=&gt;</text>
      <text class="cardTitleSmall" x="285" y="256" text-anchor="middle" dominant-baseline="middle">Application code</text>
      <text class="text" x="285" y="286" text-anchor="middle" dominant-baseline="middle">choose a client per use case</text>
    </g>

    <g id="module-helpers">
      <rect class="card" x="556" y="216" width="430" height="110" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
      <text class="icon" x="586" y="252" dominant-baseline="middle">{ }</text>
      <text class="cardTitle" x="771" y="247" text-anchor="middle" dominant-baseline="middle">bluetape4k-http helpers</text>
      <text class="text" x="771" y="281" text-anchor="middle" dominant-baseline="middle">Kotlin builders, request helpers</text>
      <text class="text" x="771" y="302" text-anchor="middle" dominant-baseline="middle">timeouts, pools, cache, SSL, retry defaults</text>
    </g>

    <g id="call-models">
      <rect class="card" x="1112" y="232" width="470" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
      <text class="icon" x="1142" y="263" dominant-baseline="middle">~</text>
      <text class="cardTitleSmall" x="1347" y="256" text-anchor="middle" dominant-baseline="middle">Call model adapters</text>
      <text class="text" x="1347" y="286" text-anchor="middle" dominant-baseline="middle">synchronous, suspend, async, virtual-thread friendly</text>
    </g>

    <path class="flow" d="M 430 271 L 556 271" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
    <path class="flow" d="M 986 271 L 1112 271" stroke="#16A34A" marker-end="url(#arrow-green)"/>
  </g>

  <g id="backend-layer">
    <rect class="layer" x="86" y="406" width="1588" height="430" rx="8" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/>
    <rect class="layerLabel" x="116" y="426" width="280" height="38" rx="8"/>
    <text class="layerTitle" x="256" y="446" text-anchor="middle" dominant-baseline="middle">Backend client stacks</text>

    <g id="hc5-card">
      <rect class="card" x="124" y="506" width="296" height="226" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
      <rect class="hint" x="150" y="532" width="108" height="25" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
      <text class="badgeText" x="204" y="546" text-anchor="middle" dominant-baseline="middle">primary</text>
      <text class="cardTitle" x="272" y="585" text-anchor="middle" dominant-baseline="middle">Apache HC5</text>
      <text class="text" x="272" y="625" text-anchor="middle" dominant-baseline="middle">classic + async clients</text>
      <text class="text" x="272" y="651" text-anchor="middle" dominant-baseline="middle">HTTP/2, cache, SSL/TLS</text>
      <text class="text" x="272" y="677" text-anchor="middle" dominant-baseline="middle">production pool defaults</text>
      <text class="text" x="272" y="703" text-anchor="middle" dominant-baseline="middle">coroutine executeSuspending</text>
    </g>

    <g id="okhttp-card">
      <rect class="card" x="448" y="506" width="296" height="226" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
      <text class="cardTitle" x="596" y="585" text-anchor="middle" dominant-baseline="middle">OkHttp3</text>
      <text class="text" x="596" y="625" text-anchor="middle" dominant-baseline="middle">pool + dispatcher builders</text>
      <text class="text" x="596" y="651" text-anchor="middle" dominant-baseline="middle">virtual-thread dispatcher</text>
      <text class="text" x="596" y="677" text-anchor="middle" dominant-baseline="middle">interceptors and cache control</text>
      <text class="text" x="596" y="703" text-anchor="middle" dominant-baseline="middle">cancel-aware suspend Call</text>
    </g>

    <g id="vertx-card">
      <rect class="card" x="772" y="506" width="296" height="226" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
      <text class="cardTitle" x="920" y="585" text-anchor="middle" dominant-baseline="middle">Vert.x</text>
      <text class="text" x="920" y="625" text-anchor="middle" dominant-baseline="middle">event-loop HttpClient</text>
      <text class="text" x="920" y="651" text-anchor="middle" dominant-baseline="middle">keep-alive and ALPN defaults</text>
      <text class="text" x="920" y="677" text-anchor="middle" dominant-baseline="middle">TLS verification on by default</text>
      <text class="text" x="920" y="703" text-anchor="middle" dominant-baseline="middle">created from current Vert.x</text>
    </g>

    <g id="ktor-card">
      <rect class="card" x="1096" y="506" width="296" height="226" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
      <text class="cardTitle" x="1244" y="585" text-anchor="middle" dominant-baseline="middle">Ktor Client</text>
      <text class="text" x="1244" y="625" text-anchor="middle" dominant-baseline="middle">explicit engine selection</text>
      <text class="text" x="1244" y="651" text-anchor="middle" dominant-baseline="middle">JSON content negotiation</text>
      <text class="text" x="1244" y="677" text-anchor="middle" dominant-baseline="middle">HttpTimeout defaults only</text>
      <text class="text" x="1244" y="703" text-anchor="middle" dominant-baseline="middle">no hidden retry policy</text>
    </g>

    <g id="jdk-card">
      <rect class="card" x="1420" y="506" width="210" height="226" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
      <text class="cardTitleSmall" x="1525" y="585" text-anchor="middle" dominant-baseline="middle">JDK</text>
      <text class="textSmall" x="1525" y="625" text-anchor="middle" dominant-baseline="middle">HttpClient</text>
      <text class="textSmall" x="1525" y="651" text-anchor="middle" dominant-baseline="middle">HTTP/2 default</text>
      <text class="textSmall" x="1525" y="677" text-anchor="middle" dominant-baseline="middle">sendAwait bridge</text>
      <text class="textSmall" x="1525" y="703" text-anchor="middle" dominant-baseline="middle">VT executor option</text>
    </g>

    <path class="flow" d="M 771 326 V368 Q 771 384 755 384 H288 Q 272 384 272 400 V506" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
    <path class="flow" d="M 771 326 V368 Q 771 384 755 384 H612 Q 596 384 596 400 V506" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
    <path class="flow" d="M 771 326 V374 Q 771 390 787 390 H904 Q 920 390 920 406 V506" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
    <path class="flow" d="M 1347 310 V390 Q 1347 406 1331 406 H1260 Q 1244 406 1244 422 V506" stroke="#65A30D" marker-end="url(#arrow-lime)"/>
    <path class="flow" d="M 1347 310 V390 Q 1347 406 1363 406 H1509 Q 1525 406 1525 422 V506" stroke="#9333EA" marker-end="url(#arrow-purple)"/>
  </g>

  <g id="wire-layer">
    <rect class="layer" x="48" y="890" width="1626" height="256" rx="8" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/>
    <rect class="layerLabel" x="116" y="910" width="270" height="38" rx="8"/>
    <text class="layerTitle" x="251" y="930" text-anchor="middle" dominant-baseline="middle">HTTP wire boundary</text>

    <g id="wire">
      <rect class="card" x="188" y="982" width="650" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text class="cardTitleSmall" x="513" y="1009" text-anchor="middle" dominant-baseline="middle">Request / response bytes</text>
      <text class="text" x="513" y="1039" text-anchor="middle" dominant-baseline="middle">method, URI, headers, body, status, payload</text>
    </g>

    <g id="service">
      <rect class="card" x="974" y="982" width="560" height="72" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
      <text class="cardTitleSmall" x="1254" y="1009" text-anchor="middle" dominant-baseline="middle">Remote HTTP service</text>
      <text class="text" x="1254" y="1039" text-anchor="middle" dominant-baseline="middle">real endpoint, test server, or benchmark target</text>
    </g>

    <path class="flow" d="M 838 1018 L 974 1018" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
  </g>

  <path class="flow" d="M 272 732 V880 Q 272 896 288 896 H294 Q 310 896 310 912 V982" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
  <path class="flow" d="M 596 732 V812 Q 596 828 580 828 H446 Q 430 828 430 844 V982" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  <path class="flow" d="M 920 732 V842 Q 920 858 904 858 H576 Q 560 858 560 874 V982" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
  <path class="flow" d="M 1244 732 V874 Q 1244 890 1228 890 H706 Q 690 890 690 906 V982" stroke="#65A30D" marker-end="url(#arrow-lime)"/>
  <path class="flow" d="M 1525 732 V906 Q 1525 922 1509 922 H806 Q 790 922 790 938 V982" stroke="#9333EA" marker-end="url(#arrow-purple)"/>
</svg>
