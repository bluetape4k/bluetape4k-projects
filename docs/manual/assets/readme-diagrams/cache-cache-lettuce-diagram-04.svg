<rect class="canvas" width="2260" height="1380" />
<rect class="frame" x="34" y="30" width="2192" height="1316" rx="8" />
<text class="title" x="72" y="88">Native Lettuce NearCache Structure</text>
<text class="subtitle" x="76" y="121">Runtime structure for native sync/suspend Lettuce NearCache, L1/L2 access, and RESP3 invalidation.</text>
<g><rect class="note" x="92" y="210" width="410" height="150" rx="8" fill="#FAF5FF" stroke="#7C3AED" />
    <text class="noteTitle" x="118" y="255">Application call site</text>
    <text class="noteLine" x="120" y="292">LettuceCaches.nearCache()</text><text class="noteLine" x="120" y="320">LettuceCaches.suspendNearCache()</text><text class="noteLine" x="120" y="348">same 2-tier contract, different call style</text>
  </g>
<g id="SyncFacade">
    <rect class="card" x="665" y="190" width="560" height="265" rx="8" fill="#EFF6FF" stroke="#2563EB" />
    <text class="stereo" x="945" y="218" text-anchor="middle">&lt;&lt;blocking facade&gt;&gt;</text>
    <text class="cardTitle" x="945" y="248" text-anchor="middle">LettuceNearCache&lt;V&gt;</text>
    <path class="divider" d="M665 268H1225" stroke="#1D4ED8" />
    <text class="member" x="689" y="296">NearCacheOperations&lt;V&gt;</text><text class="member" x="689" y="320">RedisCommands&lt;String,V&gt;</text>
    <path class="divider" d="M665 344H1225" stroke="#1D4ED8" />
    <text class="member" x="689" y="372">get: L1 hit or Redis GET + fill</text><text class="member" x="689" y="396">put/remove: write-through</text><text class="member" x="689" y="420">replace: Lua CAS with fallback</text>
  </g>
<g id="SuspendFacade">
    <rect class="card" x="1490" y="190" width="560" height="265" rx="8" fill="#F0FDFA" stroke="#0D9488" />
    <text class="stereo" x="1770" y="218" text-anchor="middle">&lt;&lt;coroutine facade&gt;&gt;</text>
    <text class="cardTitle" x="1770" y="248" text-anchor="middle">LettuceSuspendNearCache&lt;V&gt;</text>
    <path class="divider" d="M1490 268H2050" stroke="#0F766E" />
    <text class="member" x="1514" y="296">SuspendNearCacheOperations&lt;V&gt;</text><text class="member" x="1514" y="320">RedisCoroutinesCommands&lt;String,V&gt;</text>
    <path class="divider" d="M1490 344H2050" stroke="#0F766E" />
    <text class="member" x="1514" y="372">suspend get/put/remove</text><text class="member" x="1514" y="396">preserves CancellationException</text><text class="member" x="1514" y="420">close releases listener/connection</text>
  </g>
<g id="Config">
    <rect class="card" x="825" y="580" width="610" height="220" rx="8" fill="#FFF7ED" stroke="#EA580C" />
    <text class="stereo" x="1130" y="608" text-anchor="middle">&lt;&lt;shared config&gt;&gt;</text>
    <text class="cardTitle" x="1130" y="638" text-anchor="middle">LettuceNearCacheConfig&lt;K,V&gt;</text>
    <path class="divider" d="M825 658H1435" stroke="#C2410C" />
    <text class="member" x="849" y="686">cacheName -&gt; redis key prefix</text><text class="member" x="849" y="710">maxLocalSize, front TTL, redis TTL</text>
    <path class="divider" d="M825 734H1435" stroke="#C2410C" />
    <text class="member" x="849" y="762">redisKey(key) = cacheName:key</text><text class="member" x="849" y="786">RESP3 tracking and stats toggles</text>
  </g>
<g id="Front">
    <rect class="card" x="265" y="900" width="520" height="235" rx="8" fill="#F0FDF4" stroke="#16A34A" />
    <text class="stereo" x="525" y="928" text-anchor="middle">&lt;&lt;L1 local&gt;&gt;</text>
    <text class="cardTitle" x="525" y="958" text-anchor="middle">Caffeine Local Cache</text>
    <path class="divider" d="M265 978H785" stroke="#15803D" />
    <text class="member" x="289" y="1006">fast front-cache hit path</text><text class="member" x="289" y="1030">optional stats</text>
    <path class="divider" d="M265 1054H785" stroke="#15803D" />
    <text class="member" x="289" y="1082">get/put/remove/clear</text><text class="member" x="289" y="1106">invalidateAll(keys) from tracking</text>
  </g>
<g id="Redis">
    <rect class="card" x="875" y="900" width="520" height="235" rx="8" fill="#F8FAFC" stroke="#64748B" />
    <text class="stereo" x="1135" y="928" text-anchor="middle">&lt;&lt;L2 remote&gt;&gt;</text>
    <text class="cardTitle" x="1135" y="958" text-anchor="middle">Redis via Lettuce</text>
    <path class="divider" d="M875 978H1395" stroke="#475569" />
    <text class="member" x="899" y="1006">keys are isolated by cacheName</text><text class="member" x="899" y="1030">RESP3 CLIENT TRACKING enabled</text>
    <path class="divider" d="M875 1054H1395" stroke="#475569" />
    <text class="member" x="899" y="1082">GET/MGET, SET/MSET</text><text class="member" x="899" y="1106">UNLINK + SCAN for bulk cleanup</text>
  </g>
<g id="Listener">
    <rect class="card" x="1485" y="900" width="520" height="235" rx="8" fill="#FDF2F8" stroke="#DB2777" />
    <text class="stereo" x="1745" y="928" text-anchor="middle">&lt;&lt;push listener&gt;&gt;</text>
    <text class="cardTitle" x="1745" y="958" text-anchor="middle">TrackingInvalidationListener</text>
    <path class="divider" d="M1485 978H2005" stroke="#BE185D" />
    <text class="member" x="1509" y="1006">listens for Redis invalidation pushes</text><text class="member" x="1509" y="1030">filters cacheName-prefixed keys</text>
    <path class="divider" d="M1485 1054H2005" stroke="#BE185D" />
    <text class="member" x="1509" y="1082">null payload -&gt; clear front</text><text class="member" x="1509" y="1106">matching keys -&gt; invalidate local entries</text>
  </g>
<g><rect class="note" x="500" y="1200" width="1260" height="96" rx="8" fill="#F0FDF4" stroke="#16A34A" />
    <text class="noteTitle" x="526" y="1245">Runtime guarantee</text>
    <text class="noteLine" x="528" y="1282">Reads prefer L1, misses hydrate from Redis, writes update Redis and front cache, and Redis tracking pushes keep peer front caches coherent.</text>
  </g>
