<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120" role="img" aria-label="CSV Class Structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="open-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0F172A; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #475569; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .panelTitle { font-family: "Comic Mono"; font-size: 18px; fill: #334155; }
      .card { stroke-width: 1.8; filter: url(#softShadow); }
      .className { font-family: "Architects Daughter"; font-size: 24px; fill: #0F172A; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .member { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .divider { stroke: #CBD5E1; stroke-width: 1; }
      .useBlue { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#open-blue); }
      .useGreen { fill: none; stroke: #16A34A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#open-green); }
      .flowOrange { fill: none; stroke: #EA580C; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-orange); }
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1120"/>
  <rect class="frame" x="34" y="30" width="1692" height="1058" rx="8"/>

  <text class="title" x="72" y="82">CSV / TSV Class Structure</text>
  <text class="subtitle" x="76" y="114">Self-implemented RFC 4180 engine with V1 Sequence APIs, coroutine Flow APIs, and V2 Flow DSL.</text>

  <g>
    <rect class="panel" x="70" y="150" width="1620" height="220" rx="8"/>
    <text class="panelTitle" x="96" y="182">Reader and writer contracts</text>
  </g>
  <g>
    <rect class="panel" x="70" y="430" width="1620" height="260" rx="8"/>
    <text class="panelTitle" x="96" y="462">Concrete APIs exposed to README users</text>
  </g>
  <g>
    <rect class="panel" x="70" y="750" width="1620" height="250" rx="8"/>
    <text class="panelTitle" x="96" y="782">Internal engine, settings, and row model</text>
  </g>

  <g id="sync-contract">
    <rect class="card" x="110" y="215" width="450" height="115" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="stereo" x="335" y="243" text-anchor="middle">V1 sync contracts</text>
    <text class="className" x="335" y="273" text-anchor="middle">RecordReader / RecordWriter</text>
    <line class="divider" x1="135" y1="288" x2="535" y2="288"/>
    <text class="member" x="145" y="312">read() returns lazy Sequence&lt;T&gt;</text>
  </g>
  <g id="suspend-contract">
    <rect class="card" x="655" y="215" width="450" height="115" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="stereo" x="880" y="243" text-anchor="middle">Coroutine contracts</text>
    <text class="className" x="880" y="273" text-anchor="middle">SuspendRecordReader / Writer</text>
    <line class="divider" x1="680" y1="288" x2="1080" y2="288"/>
    <text class="member" x="690" y="312">read() returns cold Flow&lt;T&gt;</text>
  </g>
  <g id="v2-contract">
    <rect class="card" x="1200" y="215" width="450" height="115" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <text class="stereo" x="1425" y="243" text-anchor="middle">V2 Flow DSL</text>
    <text class="className" x="1425" y="273" text-anchor="middle">FlowCsvReader / FlowCsvWriter</text>
    <line class="divider" x1="1225" y1="288" x2="1625" y2="288"/>
    <text class="member" x="1235" y="312">CsvRow model + builder configs</text>
  </g>

  <g id="sync-api">
    <rect class="card" x="110" y="500" width="450" height="145" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="className" x="335" y="535" text-anchor="middle">Csv/Tsv Record APIs</text>
    <line class="divider" x1="135" y1="552" x2="535" y2="552"/>
    <text class="member" x="145" y="577">CsvRecordReader, TsvRecordReader</text>
    <text class="member" x="145" y="598">CsvRecordWriter, TsvRecordWriter</text>
    <text class="member" x="145" y="619">File/InputStream extension helpers</text>
  </g>
  <g id="suspend-api">
    <rect class="card" x="655" y="500" width="450" height="145" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
    <text class="className" x="880" y="535" text-anchor="middle">Suspend Csv/Tsv APIs</text>
    <line class="divider" x1="680" y1="552" x2="1080" y2="552"/>
    <text class="member" x="690" y="577">SuspendCsvRecordReader / Writer</text>
    <text class="member" x="690" y="598">SuspendTsvRecordReader / Writer</text>
    <text class="member" x="690" y="619">channelFlow + Dispatchers.IO</text>
  </g>
  <g id="v2-api">
    <rect class="card" x="1200" y="500" width="450" height="145" rx="8" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="className" x="1425" y="535" text-anchor="middle">V2 Flow DSL APIs</text>
    <line class="divider" x1="1225" y1="552" x2="1625" y2="552"/>
    <text class="member" x="1235" y="577">csvReader(), tsvReader()</text>
    <text class="member" x="1235" y="598">csvWriter(), tsvWriter()</text>
    <text class="member" x="1235" y="619">quoteAll + UTF-8 Okio file path</text>
  </g>

  <path class="useBlue" d="M 560 572 L 578 572 Q 590 572 590 560 L 590 404 Q 590 390 576 390 L 349 390 Q 335 390 335 376 L 335 330" style="marker-end:none"/>
<polyline points="341,342 335,330 329,342" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="useGreen" d="M 880 500 L 880 330" style="marker-end:none"/>
<polyline points="886,342 880,330 874,342" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="useGreen" d="M 1425 500 L 1425 330" style="marker-end:none"/>
<polyline points="1431,342 1425,330 1419,342" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="lexers">
    <rect class="card" x="110" y="825" width="345" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="className" x="282" y="858" text-anchor="middle">CsvLexer / TsvLexer</text>
    <text class="member" x="135" y="884">self-implemented parser</text>
    <text class="member" x="135" y="905">headers, max columns, field limits</text>
  </g>
  <g id="writers">
    <rect class="card" x="515" y="825" width="345" height="110" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="className" x="688" y="858" text-anchor="middle">Delimited writers</text>
    <text class="member" x="540" y="884">CsvLineWriter / TsvLineWriter</text>
    <text class="member" x="540" y="905">DelimitedWriter + Okio variant</text>
  </g>
  <g id="settings">
    <rect class="card" x="920" y="825" width="345" height="110" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="className" x="1092" y="858" text-anchor="middle">Settings</text>
    <text class="member" x="945" y="884">CsvSettings / TsvSettings</text>
    <text class="member" x="945" y="905">delimiter, quote, null policy</text>
  </g>
  <g id="row-model">
    <rect class="card" x="1325" y="825" width="315" height="110" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
    <text class="className" x="1482" y="858" text-anchor="middle">Record / CsvRow</text>
    <text class="member" x="1350" y="884">ArrayRecord + HeaderIndex</text>
    <text class="member" x="1350" y="905">V1 to V2 conversion</text>
  </g>

  <path class="useBlue" d="M 335 645 L 335 701 Q 335 715 321 715 L 104 715 Q 90 715 90 729 L 90 876 Q 90 880 94 880 L 110 880" style="marker-end:none"/>
<polyline points="98,886 110,880 98,874" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="flowOrange" d="M 335 645 L 335 701 Q 335 715 349 715 L 674 715 Q 688 715 688 729 L 688 825"/>
  <path class="useGreen" d="M 880 645 L 880 721 Q 880 735 894 735 L 1078 735 Q 1092 735 1092 749 L 1092 825" style="marker-end:none"/>
<polyline points="1086,813 1092,825 1098,813" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="useGreen" d="M 1425 645 L 1425 721 Q 1425 735 1439 735 L 1468 735 Q 1482 735 1482 749 L 1482 825" style="marker-end:none"/>
<polyline points="1476,813 1482,825 1488,813" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g transform="translate(110, 1030)">
    <path class="useBlue" d="M 0 8 L 34 8" style="marker-end:none"/>
<polyline points="22,14 34,8 22,2" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
    <text class="small" x="48" y="13">uses reader engine</text>
    <path class="useGreen" d="M 240 8 L 274 8" style="marker-end:none"/>
<polyline points="262,14 274,8 262,2" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
    <text class="small" x="288" y="13">uses settings/model</text>
    <path class="flowOrange" d="M 510 8 L 544 8"/>
    <text class="small" x="558" y="13">write path</text>
  </g>
</svg>
