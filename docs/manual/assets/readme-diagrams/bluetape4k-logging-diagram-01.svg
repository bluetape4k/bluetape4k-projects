<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="bluetape4k logging class structure">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <marker id="openBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="openGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="openPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="hollowTriangle" markerWidth="15" markerHeight="13" refX="13" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6.5 L 1 12 Z" fill="#ffffff" stroke="#9333ea" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" />
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .classBox { filter: url(#softShadow); stroke-width: 1.7; }
      .className { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .member { font-family: "Comic Mono"; font-size: 12.5px; fill: #334155; }
      .noteTitle { font-family: "Architects Daughter"; font-size: 20px; fill: #0f172a; }
      .note { font-family: "Comic Mono"; font-size: 12.5px; fill: #475569; }
      .inherit { fill: none; stroke: #9333ea; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowTriangle); }
      .useBlue { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openBlue); }
      .useGreen { fill: none; stroke: #16a34a; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openGreen); }
      .usePurple { fill: none; stroke: #9333ea; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openPurple); }
      .has { fill: none; stroke: #0f766e; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openGreen); }
      .label { font-family: "Comic Mono"; font-size: 12px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1000" />
  <rect class="frame" x="34" y="30" width="1432" height="940" rx="10" />
  <text class="title" x="72" y="86">bluetape4k-logging Class Structure</text>
  <text class="subtitle" x="76" y="118">Logger entrypoints, lazy extensions, MDC scopes, and coroutine-backed async logging</text>

  <rect class="panel" x="74" y="154" width="1352" height="460" rx="10" />
  <text class="panelTitle" x="104" y="193">Logger creation and hierarchy</text>

  <rect class="panel" x="74" y="648" width="1352" height="282" rx="10" />
  <text class="panelTitle" x="104" y="687">Public API surfaces over SLF4J Logger</text>

  <g id="kotlinLogging">
    <rect class="classBox" x="104" y="228" width="282" height="154" rx="8" fill="#eff6ff" stroke="#2563eb" />
    <text class="stereo" x="245" y="254" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text class="className" x="245" y="284" text-anchor="middle">KotlinLogging</text>
    <line x1="104" y1="300" x2="386" y2="300" stroke="#bfdbfe" stroke-width="1.2" />
    <text class="member" x="126" y="328">+ logger(name): Logger</text>
    <text class="member" x="126" y="352">+ logger(action): Logger</text>
    <text class="member" x="126" y="376">+ logger(KClass): Logger</text>
  </g>

  <g id="kLogging">
    <rect class="classBox" x="504" y="218" width="294" height="152" rx="8" fill="#f0fdf4" stroke="#16a34a" />
    <text class="className" x="651" y="262" text-anchor="middle">KLogging</text>
    <line x1="504" y1="286" x2="798" y2="286" stroke="#bbf7d0" stroke-width="1.2" />
    <text class="member" x="526" y="316">+ log: Logger by lazy</text>
    <text class="member" x="526" y="340">  name from current class</text>
  </g>

  <g id="channel">
    <rect class="classBox" x="486" y="422" width="330" height="160" rx="8" fill="#faf5ff" stroke="#9333ea" />
    <text class="className" x="651" y="456" text-anchor="middle">KLoggingChannel</text>
    <text class="stereo" x="651" y="478" text-anchor="middle">extends KLogging, AutoCloseable</text>
    <line x1="486" y1="492" x2="816" y2="492" stroke="#e9d5ff" stroke-width="1.2" />
    <text class="member" x="510" y="520">- sharedFlow: MutableSharedFlow</text>
    <text class="member" x="510" y="544">+ send(LogEvent)</text>
    <text class="member" x="510" y="568">+ close(), closeAndJoin()</text>
  </g>

  <g id="factory">
    <rect class="classBox" x="930" y="214" width="286" height="166" rx="8" fill="#fff7ed" stroke="#ea580c" />
    <text class="stereo" x="1073" y="240" text-anchor="middle">&lt;&lt;internal object&gt;&gt;</text>
    <text class="className" x="1073" y="270" text-anchor="middle">KLoggerFactory</text>
    <line x1="930" y1="288" x2="1216" y2="288" stroke="#fed7aa" stroke-width="1.2" />
    <text class="member" x="952" y="316">+ logger(name)</text>
    <text class="member" x="952" y="340">+ logger(action)</text>
    <text class="member" x="952" y="364">+ logger(Class)</text>
  </g>

  <g id="resolver">
    <rect class="classBox" x="970" y="438" width="250" height="118" rx="8" fill="#f0fdfa" stroke="#0d9488" />
    <text class="stereo" x="1095" y="464" text-anchor="middle">&lt;&lt;internal object&gt;&gt;</text>
    <text class="className" x="1095" y="494" text-anchor="middle">KLoggerNameResolver</text>
    <line x1="970" y1="510" x2="1220" y2="510" stroke="#99f6e4" stroke-width="1.2" />
    <text class="member" x="992" y="538">unwraps companions</text>
  </g>

  <g id="slf4j">
    <rect class="classBox" x="1248" y="302" width="134" height="146" rx="8" fill="#f1f5f9" stroke="#64748b" />
    <text class="stereo" x="1315" y="332" text-anchor="middle">&lt;&lt;SLF4J&gt;&gt;</text>
    <text class="className" x="1315" y="364" text-anchor="middle">Logger</text>
    <line x1="1248" y1="382" x2="1382" y2="382" stroke="#cbd5e1" stroke-width="1.2" />
    <text class="member" x="1270" y="410">trace/debug</text>
    <text class="member" x="1270" y="434">info/warn/error</text>
  </g>

  <path class="inherit" d="M 651 422 L 651 370" />

  <path class="useBlue" d="M 386 320 L 424 320 Q 438 320 438 306 L 438 216 Q 438 202 452 202 L 886 202 Q 900 202 900 216 L 900 254 Q 900 262 908 262 L 930 262" style="marker-end:none" />
<polyline points="918,268 930,262 918,256" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path class="useGreen" d="M 798 320 L 930 320" style="marker-end:none" />
<polyline points="918,326 930,320 918,314" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path class="usePurple" d="M 816 520 L 874 520 Q 888 520 888 506 L 888 368 Q 888 354 902 354 L 930 354" style="marker-end:none" />
<polyline points="918,360 930,354 918,348" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path class="useGreen" d="M 1073 380 L 1073 438" style="marker-end:none" />
<polyline points="1067,426 1073,438 1079,426" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path class="has" d="M 1216 324 L 1248 352" />

  <g id="lazyExtensions">
    <rect class="classBox" x="116" y="724" width="278" height="132" rx="8" fill="#eff6ff" stroke="#2563eb" />
    <text class="noteTitle" x="255" y="758" text-anchor="middle">Slf4jExtensions</text>
    <text class="note" x="138" y="790">trace/debug/info/warn/error</text>
    <text class="note" x="138" y="814">evaluate lambda only when enabled</text>
    <text class="note" x="138" y="838">warn/error add configured prefix</text>
  </g>

  <g id="mdc">
    <rect class="classBox" x="442" y="724" width="278" height="132" rx="8" fill="#f0fdf4" stroke="#16a34a" />
    <text class="noteTitle" x="581" y="758" text-anchor="middle">MDC helpers</text>
    <text class="note" x="464" y="790">withLoggingContext(...)</text>
    <text class="note" x="464" y="814">traceMdc/debugMdc/... wrappers</text>
    <text class="note" x="464" y="838">restore previous values on exit</text>
  </g>

  <g id="coroutineMdc">
    <rect class="classBox" x="768" y="724" width="278" height="132" rx="8" fill="#faf5ff" stroke="#9333ea" />
    <text class="noteTitle" x="907" y="758" text-anchor="middle">Coroutine MDC</text>
    <text class="note" x="790" y="790">withCoroutineLoggingContext</text>
    <text class="note" x="790" y="814">runs with MDCContext()</text>
    <text class="note" x="790" y="838">cleans keys when not restoring</text>
  </g>

  <g id="eventApi">
    <rect class="classBox" x="1094" y="724" width="278" height="132" rx="8" fill="#fff7ed" stroke="#ea580c" />
    <text class="noteTitle" x="1233" y="758" text-anchor="middle">Async LogEvent API</text>
    <text class="note" x="1116" y="790">LogEvent(level, msg, error)</text>
    <text class="note" x="1116" y="814">buffer capacity: 64</text>
    <text class="note" x="1116" y="838">default IO scope + shutdown hook</text>
  </g>

  <g transform="translate(104,896)">
    <path d="M 0 0 L 44 0" class="inherit" />
    <text class="note" x="56" y="5">extends</text>
    <path d="M 160 0 L 204 0" class="useBlue" style="marker-end:none" />
<polyline points="192,6 204,0 192,-6" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
    <text class="note" x="216" y="5">uses/dependency</text>
    <path d="M 380 0 L 424 0" class="has" />
    <text class="note" x="436" y="5">returns/has reference</text>
  </g>
</svg>
