<g id="m3"><rect class="labelPill" x="664" y="461.2" width="182" height="34" rx="17" stroke="#B9851B"/><circle cx="682" cy="478.7" r="11" fill="#FFF7E8" stroke="#B9851B"/><text class="detail" x="682" y="479.7" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">3</text><text class="detail" x="767" y="479.7" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">create JSON client</text><path class="seq" d="M 470 517.2 L 1040 517.2" stroke="#B9851B" marker-end="url(#seqArrow-amber-B9851B)"/></g>
<g id="m4"><rect class="labelPill" x="817.5" y="549.2" width="170" height="34" rx="17" stroke="#755BC6"/><circle cx="835.5" cy="566.7" r="11" fill="#F3ECFF" stroke="#755BC6"/><text class="detail" x="835.5" y="567.7" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">4</text><text class="detail" x="914.5" y="567.7" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">execute request</text><path class="seq" d="M 1040 605.2 L 765 605.2" stroke="#755BC6" marker-end="url(#seqArrow-purple-755BC6)"/></g>
<g id="m5"><rect class="labelPill" x="907.5" y="637.2" width="245" height="34" rx="17" stroke="#C94D68"/><circle cx="925.5" cy="654.7" r="11" fill="#FFF0F0" stroke="#C94D68"/><text class="detail" x="925.5" y="655.7" text-anchor="middle" dominant-baseline="middle" fill="#C94D68">5</text><text class="detail" x="1042" y="655.7" text-anchor="middle" dominant-baseline="middle" fill="#C94D68">decode body / assert status</text><path class="seq" d="M 765 693.2 L 1295 693.2" stroke="#C94D68" marker-end="url(#seqArrow-pink-C94D68)"/></g>
<g id="m6"><rect class="labelPill" x="635.5" y="725.2" width="224" height="34" rx="17" stroke="#3E9868"/><circle cx="653.5" cy="742.7" r="11" fill="#EEF7F0" stroke="#3E9868"/><text class="detail" x="653.5" y="743.7" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">6</text><text class="detail" x="759.5" y="743.7" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">return verified response</text><path class="seqReturn" d="M 1295 781.2 L 200 781.2" stroke="#3E9868"/>
<polygon points="212,775 200,781.2 212,787.4" fill="#3E9868" stroke="#3E9868" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/></g>
