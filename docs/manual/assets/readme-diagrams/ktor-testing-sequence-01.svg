<g id="app"><rect class="card" x="660" y="170" width="210" height="76" rx="10" fill="#F3ECFF" stroke="#755BC6"/><text class="cardTitle" x="765" y="210" text-anchor="middle" dominant-baseline="middle">Ktor app</text><line class="lifeline dashed" x1="765" y1="246" x2="765" y2="809.1" stroke="#755BC6"/></g>
