<rect class="canvas" width="1500" height="903"/>
<rect class="frame" x="34" y="30" width="1432" height="847" rx="32"/>
<text class="title" x="72" y="84">Ktor Testing Helper Sequence</text>
<text class="subtitle" x="76" y="116">The sequence shows the real test path: install core defaults, create a JSON client, execute, then assert or use MockEngine helpers.</text>
<g id="test"><rect class="card" x="100" y="170" width="200" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="200" y="210" text-anchor="middle" dominant-baseline="middle">Test</text><line class="lifeline dashed" x1="200" y1="246" x2="200" y2="809.1" stroke="#4F83BF"/></g>
