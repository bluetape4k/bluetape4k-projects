<g id="m1"><rect class="labelPill" x="250" y="285.2" width="170" height="34" rx="17" stroke="#4F83BF"/><circle cx="268" cy="302.7" r="11" fill="#EAF4F8" stroke="#4F83BF"/><text class="detail" x="268" y="303.7" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">1</text><text class="detail" x="347" y="303.7" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">testApplication</text><path class="seq" d="M 200 341.2 L 470 341.2" stroke="#4F83BF" marker-end="url(#seqArrow-blue-4F83BF)"/></g>
