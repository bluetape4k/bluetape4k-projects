  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#755BC6"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .zone{fill:#FFFFFF;stroke-width:2;stroke-dasharray:9 8}.zoneTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .hub{filter:url(#shadow);stroke-width:2.4}.hubTitle{font-family:"Architects Daughter";font-size:28px;fill:#22344A}.hubNote{font-family:"Comic Mono";font-size:13px;fill:#536476}
