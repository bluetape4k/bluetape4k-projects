<svg data-intent="Explain the bluetape4k-coroutines module capability groups from README and source contracts." data-evidence="bluetape4k/coroutines/README.md; DeferredValue.kt; DeferredSupport.kt; AsyncFlow.kt; ReactorContextSupport.kt; *CoroutineScope.kt" xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" role="img" aria-labelledby="title desc">
<title id="title">bluetape4k-coroutines module overview</title>
<desc id="desc">Capability map for async values, Flow operators, runtime scopes, Reactor context helpers, and test support in bluetape4k-coroutines.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#203040" flood-opacity="0.11"/></filter>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B"/></marker>
