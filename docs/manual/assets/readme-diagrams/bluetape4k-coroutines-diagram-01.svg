<rect class="canvas" width="1520" height="1040"/>
<rect class="frame" x="30" y="28" width="1460" height="984" rx="30"/>
<text class="title" x="70" y="86">bluetape4k-coroutines Module Overview</text>
<text class="subtitle" x="74" y="118">The module adds small coroutine-first building blocks around Deferred, Flow, reusable scopes, Reactor context, and tests.</text>

<g id="hub">
  <rect class="hub" x="548" y="164" width="424" height="96" rx="14" fill="#FBFCF8" stroke="#546E7A"/>
  <text class="hubTitle" x="760" y="202" text-anchor="middle">Coroutine-first APIs</text>
  <text class="hubNote" x="760" y="230" text-anchor="middle">compose suspend work without changing caller ownership</text>
</g>

<g id="async-zone">
  <rect class="zone" x="78" y="312" width="640" height="268" rx="18" stroke="#3E9868"/>
  <rect class="pill" x="118" y="296" width="174" height="34" rx="10"/>
  <text class="zoneTitle" x="205" y="321" text-anchor="middle">Async values</text>
  <g id="deferred-value">
    <rect class="card" x="122" y="374" width="254" height="124" rx="10" fill="#EAF7EF" stroke="#3E9868"/>
    <text class="cardTitle" x="249" y="410" text-anchor="middle">DeferredValue</text>
    <text class="detail" x="249" y="442" text-anchor="middle">eager async wrapper</text>
    <text class="detail" x="249" y="464" text-anchor="middle">await() suspend access</text>
  </g>
  <g id="deferred-support">
    <rect class="card" x="418" y="374" width="254" height="124" rx="10" fill="#E9F7F6" stroke="#2E8F89"/>
    <text class="cardTitle" x="545" y="410" text-anchor="middle">Deferred helpers</text>
    <text class="detail" x="545" y="442" text-anchor="middle">zip, map, concatMap</text>
    <text class="detail" x="545" y="464" text-anchor="middle">awaitAny winner logic</text>
  </g>
</g>

<g id="flow-zone">
  <rect class="zone" x="802" y="312" width="640" height="268" rx="18" stroke="#B9851B"/>
  <rect class="pill" x="842" y="296" width="194" height="34" rx="10"/>
  <text class="zoneTitle" x="939" y="321" text-anchor="middle">Flow processing</text>
  <g id="flow-operators">
    <rect class="card" x="846" y="374" width="254" height="124" rx="10" fill="#FFF7E6" stroke="#B9851B"/>
    <text class="cardTitle" x="973" y="410" text-anchor="middle">Flow operators</text>
    <text class="detail" x="973" y="442" text-anchor="middle">chunked, windowed</text>
    <text class="detail" x="973" y="464" text-anchor="middle">throttle, merge, gates</text>
  </g>
  <g id="async-flow">
    <rect class="card" x="1142" y="374" width="254" height="124" rx="10" fill="#FDF2F8" stroke="#C94D68"/>
    <text class="cardTitle" x="1269" y="410" text-anchor="middle">AsyncFlow</text>
    <text class="detail" x="1269" y="442" text-anchor="middle">Deferred per element</text>
    <text class="detail" x="1269" y="464" text-anchor="middle">emit in input order</text>
  </g>
</g>

<g id="runtime-zone">
  <rect class="zone" x="78" y="654" width="640" height="246" rx="18" stroke="#4F83BF"/>
  <rect class="pill" x="118" y="638" width="176" height="34" rx="10"/>
