<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060" role="img" aria-label="Lettuce distributed primitive API families">
  <defs>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="openBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openTeal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#shadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .colTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #0f172a; }
      .colSub { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .column { fill-opacity: 0.42; stroke-width: 1.35; stroke-dasharray: 7 6; }
      .card { stroke-width: 1.7; filter: url(#shadow); }
      .cardTitle { font-family: "Architects Daughter"; font-size: 19.5px; fill: #0f172a; }
      .detail { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 11.5px; fill: #64748b; }
      .dep { fill: none; stroke-width: 2.35; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; }
      .flow { fill: none; stroke-width: 2.55; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: "Comic Mono"; font-size: 11px; fill: #64748b; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1060"/>
  <rect class="frame" x="36" y="30" width="1428" height="996" rx="8"/>
  <text class="title" x="74" y="84">Lettuce Distributed Primitive API Families</text>
  <text class="subtitle" x="78" y="116">Each Redis-backed primitive has a sync/CompletableFuture wrapper and a suspend-first counterpart instead of one shared superclass.</text>

  <rect class="column" x="78" y="156" width="318" height="790" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="colTitle" x="110" y="194">Redis backing model</text>
  <text class="colSub" x="110" y="216">what each primitive stores in Redis</text>

  <rect class="column" x="444" y="156" width="412" height="790" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text class="colTitle" x="476" y="194">Sync + async classes</text>
  <text class="colSub" x="476" y="216">blocking APIs plus CompletableFuture variants</text>

  <rect class="column" x="904" y="156" width="518" height="790" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text class="colTitle" x="936" y="194">Suspend classes</text>
  <text class="colSub" x="936" y="216">RedisFuture.await() and coroutine-native control paths</text>

  <g id="hash">
    <rect class="card" x="108" y="254" width="258" height="86" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="237" y="287" text-anchor="middle">Redis Hash</text>
    <text class="detail" x="237" y="314" text-anchor="middle">HGET / HSET / HDEL</text>
  </g>
  <g id="stringCounter">
    <rect class="card" x="108" y="370" width="258" height="78" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="237" y="401" text-anchor="middle">String counter</text>
    <text class="detail" x="237" y="426" text-anchor="middle">INCR / DECR / Lua CAS</text>
  </g>
  <g id="lockKey">
    <rect class="card" x="108" y="478" width="258" height="78" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="237" y="509" text-anchor="middle">Lease key</text>
    <text class="detail" x="237" y="534" text-anchor="middle">SET NX PX + token Lua</text>
  </g>
  <g id="semaphoreKey">
    <rect class="card" x="108" y="586" width="258" height="78" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="237" y="617" text-anchor="middle">Permit counter</text>
    <text class="detail" x="237" y="642" text-anchor="middle">decr/incr Lua scripts</text>
  </g>
  <g id="probabilistic">
    <rect class="card" x="108" y="694" width="258" height="88" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="237" y="726" text-anchor="middle">Approx structures</text>
    <text class="detail" x="237" y="753" text-anchor="middle">PFADD / PFCOUNT</text>
    <text class="detail" x="237" y="773" text-anchor="middle">BitSet / bucket arrays</text>
  </g>

  <g id="maps">
    <rect class="card" x="484" y="244" width="332" height="104" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="650" y="277" text-anchor="middle">Map wrappers</text>
    <text class="detail" x="650" y="305" text-anchor="middle">LettuceMap / LettuceStringMap</text>
    <text class="detail" x="650" y="326" text-anchor="middle">LettuceLoadedMap + loader/writer</text>
  </g>
  <g id="atomic">
    <rect class="card" x="484" y="374" width="332" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="650" y="404" text-anchor="middle">LettuceAtomicLong</text>
    <text class="detail" x="650" y="428" text-anchor="middle">sync and async counter operations</text>
  </g>
  <g id="lock">
    <rect class="card" x="484" y="482" width="332" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="650" y="512" text-anchor="middle">LettuceLock</text>
    <text class="detail" x="650" y="536" text-anchor="middle">non-reentrant mutex with UUID token</text>
  </g>
  <g id="semaphore">
    <rect class="card" x="484" y="590" width="332" height="70" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="650" y="620" text-anchor="middle">LettuceSemaphore</text>
    <text class="detail" x="650" y="644" text-anchor="middle">bounded permits with Lua guards</text>
  </g>
  <g id="approx">
    <rect class="card" x="484" y="708" width="332" height="100" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="650" y="740" text-anchor="middle">Cardinality and filters</text>
    <text class="detail" x="650" y="767" text-anchor="middle">LettuceHyperLogLog</text>
    <text class="detail" x="650" y="788" text-anchor="middle">LettuceBloomFilter / CuckooFilter</text>
  </g>
  <g id="scripts">
    <rect class="card" x="484" y="846" width="332" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="650" y="873" text-anchor="middle">RedisScriptRunner</text>
    <text class="detail" x="650" y="895" text-anchor="middle">EVALSHA-first fallback for Lua paths</text>
  </g>

  <g id="suspendMaps">
    <rect class="card" x="946" y="244" width="420" height="104" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1156" y="277" text-anchor="middle">Suspend map wrappers</text>
    <text class="detail" x="1156" y="305" text-anchor="middle">LettuceSuspendMap / SuspendStringMap</text>
    <text class="detail" x="1156" y="326" text-anchor="middle">LettuceSuspendedLoadedMap</text>
  </g>
  <g id="suspendAtomic">
    <rect class="card" x="946" y="374" width="420" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1156" y="404" text-anchor="middle">LettuceSuspendAtomicLong</text>
    <text class="detail" x="1156" y="428" text-anchor="middle">awaits async commands and Lua CAS</text>
  </g>
  <g id="suspendLock">
    <rect class="card" x="946" y="482" width="420" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1156" y="512" text-anchor="middle">LettuceSuspendLock</text>
    <text class="detail" x="1156" y="536" text-anchor="middle">delay-based retry without thread pinning</text>
  </g>
  <g id="suspendSemaphore">
    <rect class="card" x="946" y="590" width="420" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1156" y="620" text-anchor="middle">LettuceSuspendSemaphore</text>
    <text class="detail" x="1156" y="644" text-anchor="middle">suspend acquire/release operations</text>
  </g>
  <g id="suspendApprox">
    <rect class="card" x="946" y="708" width="420" height="100" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1156" y="740" text-anchor="middle">Suspend cardinality and filters</text>
    <text class="detail" x="1156" y="767" text-anchor="middle">LettuceSuspendHyperLogLog</text>
    <text class="detail" x="1156" y="788" text-anchor="middle">SuspendBloomFilter / SuspendCuckooFilter</text>
  </g>
  <g id="future">
    <rect class="card" x="946" y="846" width="420" height="62" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="1156" y="873" text-anchor="middle">RedisFuture adapters</text>
    <text class="detail" x="1156" y="895" text-anchor="middle">awaitSuspending() / awaitAll()</text>
  </g>

  <path class="flow" d="M 366 297 H 484" stroke="#2563eb"/>


  <polyline points="466,305 484,297 466,289" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="flow" d="M 366 409 H 484" stroke="#2563eb"/>

  <polyline points="466,417 484,409 466,401" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="flow" d="M 366 517 H 484" stroke="#2563eb"/>

  <polyline points="466,525 484,517 466,509" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="flow" d="M 366 625 H 484" stroke="#2563eb"/>

  <polyline points="466,633 484,625 466,617" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="flow" d="M 366 738 H 484" stroke="#2563eb"/>

  <polyline points="466,746 484,738 466,730" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="dep" d="M 816 296 H 946" stroke="#0d9488"/>


  <polyline points="928,304 946,296 928,288" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 816 409 H 946" stroke="#0d9488"/>

  <polyline points="928,417 946,409 928,401" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 816 517 H 946" stroke="#0d9488"/>

  <polyline points="928,525 946,517 928,509" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 816 625 H 946" stroke="#0d9488"/>

  <polyline points="928,633 946,625 928,617" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="dep" d="M 816 758 H 946" stroke="#0d9488"/>

  <polyline points="928,766 946,758 928,750" fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

</svg>
