<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Spring WebFlux coroutine request flow">
  <style>
    text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }
  </style>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect width="1440" height="900" fill="#ffffff"/>
  <text x="70" y="62" font-size="30" font-weight="700" fill="#111827">Spring WebFlux + Coroutines Request Flow</text>
  <text x="70" y="92" font-size="15" fill="#64748b">A request enters Spring WebFlux, app code chooses the coroutine controller base, and the selected scope drives service work.</text>


  <g class="lane" data-lane="WEBFLUX ENTRY">
    <rect x="46" y="122" width="1220" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="64" y="148" font-size="14" font-weight="700" fill="#2563eb">WEBFLUX ENTRY</text>
    <text x="64" y="169" font-size="12.5" fill="#6b7280">Spring routes the HTTP call to an application handler method.</text>
  </g>

  <g class="lane" data-lane="CONTROLLER-OWNED COROUTINE SCOPE">
    <rect x="46" y="376" width="1220" height="210" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="64" y="402" font-size="14" font-weight="700" fill="#ea580c">CONTROLLER-OWNED COROUTINE SCOPE</text>
    <text x="64" y="423" font-size="12.5" fill="#6b7280">The abstract base class chooses the Dispatcher and owns cancellation on bean destruction.</text>
  </g>

  <g class="lane" data-lane="APPLICATION WORK AND RESPONSE">
    <rect x="46" y="630" width="1220" height="210" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="64" y="656" font-size="14" font-weight="700" fill="#64748b">APPLICATION WORK AND RESPONSE</text>
    <text x="64" y="677" font-size="12.5" fill="#6b7280">The service result flows back through WebFlux response encoding.</text>
  </g>

  <path class="edge" d="M440 248 L530 248" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M780 248 L870 248" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 1000 294 L 1000 340 Q 1000 354 986 354 L 379 354 Q 365 354 365 368 L 365 456" fill="none" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 1000 294 L 1000 340 Q 1000 354 986 354 L 714 354 Q 700 354 700 368 L 700 456" fill="none" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 1000 294 L 1000 340 Q 1000 354 1014 354 L 1021 354 Q 1035 354 1035 368 L 1035 456" fill="none" stroke="#ea580c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M 365 556 L 365 590 Q 365 604 379 604 L 631 604 Q 645 604 645 618 L 645 710" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M 700 556 L 700 590 Q 700 604 686 604 L 659 604 Q 645 604 645 618 L 645 710" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M 1035 556 L 1035 590 Q 1035 604 1021 604 L 659 604 Q 645 604 645 618 L 645 710" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M770 758 L860 758" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>


  <g class="card" data-card="HTTP Request">
    <rect x="210" y="202" width="230" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="325" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">HTTP Request</text>
    <text x="325" y="260" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">WebFlux server</text>
<text x="325" y="277" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">receives the call</text>
  </g>

  <g class="card" data-card="Handler Method">
    <rect x="530" y="202" width="250" height="92" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="655" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Handler Method</text>
    <text x="655" y="260" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">suspend result or Flow</text>
<text x="655" y="277" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">declared by app code</text>
  </g>

  <g class="card" data-card="Controller Base">
    <rect x="870" y="202" width="260" height="92" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="1000" y="233" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Controller Base</text>
    <text x="1000" y="260" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Default, IO, or VT</text>
<text x="1000" y="277" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">CoroutineScope is delegated</text>
  </g>

  <g class="card" data-card="Default Scope">
    <rect x="240" y="456" width="250" height="100" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="365" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Default Scope</text>
    <text x="365" y="514" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Dispatchers.Default</text>
<text x="365" y="531" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">CPU-oriented work</text>
  </g>

  <g class="card" data-card="IO Scope">
    <rect x="575" y="456" width="250" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="700" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">IO Scope</text>
    <text x="700" y="514" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Dispatchers.IO</text>
<text x="700" y="531" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">blocking bridge work</text>
  </g>

  <g class="card" data-card="Virtual Thread Scope">
    <rect x="910" y="456" width="250" height="100" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <text x="1035" y="487" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Virtual Thread Scope</text>
    <text x="1035" y="514" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Dispatchers.VT</text>
<text x="1035" y="531" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">virtual-thread adapter</text>
  </g>

  <g class="card" data-card="Service Work">
    <rect x="520" y="710" width="250" height="96" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
    <text x="645" y="741" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Service Work</text>
    <text x="645" y="768" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">child coroutines run</text>
<text x="645" y="785" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">SupervisorJob isolates failures</text>
  </g>

  <g class="card" data-card="Response Bridge">
    <rect x="860" y="710" width="260" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="990" y="741" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Response Bridge</text>
    <text x="990" y="768" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Flow/Publisher/Mono</text>
<text x="990" y="785" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">encoded by WebFlux</text>
  </g>

  <g class="note" data-note="security-context">
    <rect x="1300" y="200" width="96" height="132" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1348" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Caveat</text>
    <text x="1348" y="262" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Security</text>
<text x="1348" y="279" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">context is</text>
<text x="1348" y="296" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">manual</text>
  </g>
  <path class="edge" d="M1130 248 L1300 248" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="1288,254 1300,248 1288,242" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g class="legend" transform="translate(70 858)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
    <text x="52" y="5" font-size="13" fill="#475569">Request/response path</text>
    <line x1="260" y1="0" x2="298" y2="0" stroke="#ea580c" stroke-width="3.2" marker-end="url(#arrow-orange)"/>
    <text x="312" y="5" font-size="13" fill="#475569">Dispatcher choice</text>
    <line x1="500" y1="0" x2="538" y2="0" stroke="#64748b" stroke-width="2.8" marker-end="url(#arrow-gray)"/>
    <text x="552" y="5" font-size="13" fill="#475569">Scope-owned work</text>
  </g>
</svg>