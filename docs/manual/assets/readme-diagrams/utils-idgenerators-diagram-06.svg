<svg data-intent="Explain KSUID second and millisecond layouts from current source constants." data-evidence="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/Ksuid.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/KsuidGenerator.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/BytesBase62.kt" data-source-read="utils/idgenerators/README.md; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/Ksuid.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/KsuidGenerator.kt; utils/idgenerators/src/main/kotlin/io/bluetape4k/idgenerators/ksuid/BytesBase62.kt" xmlns="http://www.w3.org/2000/svg" width="3100" height="1740" viewBox="0 0 3100 1740" role="img" aria-label="KSUID Layout">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}
    .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:58px;fill:#0F172A}
    .subtitle,.rowSubtitle{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .rowTitle{font-family:"Architects Daughter";font-size:34px;fill:#0F172A}
    .segmentBits{font-family:"Comic Mono";font-size:26px;fill:#0F172A;font-weight:700}
    .segmentTitle{font-family:"Architects Daughter";font-size:36px;fill:#0F172A}
    .segmentRange{font-family:"Comic Mono";font-size:17px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}
    .cardTitle{font-family:"Architects Daughter";font-size:34px;fill:#0F172A}
    .cardText{font-family:"Comic Mono";font-size:18px;fill:#334155}
    .divider{stroke-width:1;opacity:.36}
    .guide{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
    .bitLabel{font-family:"Comic Mono";font-size:18px;fill:#475569}
    .tick{stroke:#94A3B8;stroke-width:1.5;stroke-dasharray:6 8}
    .tickText{font-family:"Comic Mono";font-size:17px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="3100" height="1740"/>
<rect class="frame" x="36" y="30" width="3028" height="1680" rx="8"/>
<text class="title" x="76" y="104">KSUID Layout</text>
<text class="subtitle" x="80" y="142">Two 20-byte layouts render to the same 27-character Base62 ID: seconds precision or milliseconds precision.</text>
<g>
  <text class="bitLabel" x="220" y="214">Most significant bit</text>
  <text class="bitLabel" x="2880" y="214" text-anchor="end">Least significant bit</text>
  <text class="rowTitle" x="220" y="254">Ksuid.Seconds</text>
  <text class="rowSubtitle" x="640" y="254">20 bytes = 4-byte second timestamp + 16-byte random payload</text>
  <g><path class="tick" d="M220 312V518"/><text class="tickText" x="220" y="296" text-anchor="middle">159</text></g>
<g><path class="tick" d="M718 312V518"/><text class="tickText" x="718" y="296" text-anchor="middle">128</text></g>
<g><path class="tick" d="M786 312V518"/><text class="tickText" x="786" y="296" text-anchor="middle">127</text></g>
<g><path class="tick" d="M2880 312V518"/><text class="tickText" x="2880" y="296" text-anchor="middle">0</text></g>
  <g>
  <rect x="220" y="330" width="532" height="170" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <text class="segmentBits" x="486" y="380" text-anchor="middle">4 bytes</text>
  <text class="segmentTitle" x="486" y="428" text-anchor="middle">seconds timestamp</text>
  <text class="segmentRange" x="486" y="466" text-anchor="middle">epoch offset from 2014-05-13</text>
</g>
  <g>
  <rect x="752" y="330" width="2128" height="170" rx="8" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
  <text class="segmentBits" x="1816" y="380" text-anchor="middle">16 bytes</text>
  <text class="segmentTitle" x="1816" y="428" text-anchor="middle">random payload</text>
  <text class="segmentRange" x="1816" y="466" text-anchor="middle">SecureRandom bytes</text>
</g>
</g>
<g>
  <text class="bitLabel" x="220" y="934">Most significant bit</text>
  <text class="bitLabel" x="2880" y="934" text-anchor="end">Least significant bit</text>
  <text class="rowTitle" x="220" y="974">Ksuid.Millis</text>
  <text class="rowSubtitle" x="640" y="974">20 bytes = 8-byte millisecond timestamp + 12-byte random payload</text>
  <g><path class="tick" d="M220 1032V1238"/><text class="tickText" x="220" y="1016" text-anchor="middle">159</text></g>
<g><path class="tick" d="M1250 1032V1238"/><text class="tickText" x="1250" y="1016" text-anchor="middle">96</text></g>
<g><path class="tick" d="M1318 1032V1238"/><text class="tickText" x="1318" y="1016" text-anchor="middle">95</text></g>
<g><path class="tick" d="M2880 1032V1238"/><text class="tickText" x="2880" y="1016" text-anchor="middle">0</text></g>
  <g>
  <rect x="220" y="1050" width="1064" height="170" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <text class="segmentBits" x="752" y="1100" text-anchor="middle">8 bytes</text>
  <text class="segmentTitle" x="752" y="1148" text-anchor="middle">millis timestamp</text>
  <text class="segmentRange" x="752" y="1186" text-anchor="middle">epoch offset from 2014-05-13</text>
</g>
  <g>
  <rect x="1284" y="1050" width="1596" height="170" rx="8" fill="#F0FDF4" stroke="#16A34A" stroke-width="3"/>
  <text class="segmentBits" x="2082" y="1100" text-anchor="middle">12 bytes</text>
  <text class="segmentTitle" x="2082" y="1148" text-anchor="middle">random payload</text>
  <text class="segmentRange" x="2082" y="1186" text-anchor="middle">SecureRandom bytes</text>
</g>
</g>
<path class="guide" d="M 486 500 L 486 526 Q 486 540 500 540 L 808 540 Q 820 540 820 552 L 820 570" stroke="#1D4ED8"/>
<path class="guide" d="M 1816 500 L 1816 526 Q 1816 540 1830 540 L 2268 540 Q 2280 540 2280 552 L 2280 570" stroke="#C2410C"/>
<path class="guide" d="M 752 1220 L 752 1246 Q 752 1260 766 1260 L 808 1260 Q 820 1260 820 1272 L 820 1290" stroke="#6D28D9"/>
<path class="guide" d="M 2082 1220 L 2082 1246 Q 2082 1260 2096 1260 L 2268 1260 Q 2280 1260 2280 1272 L 2280 1290" stroke="#15803D"/>
<g>
  <rect class="card" x="220" y="570" width="1200" height="250" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="820" y="624" text-anchor="middle">Seconds timestamp</text>
  <path class="divider" d="M220 652H1420" stroke="#1D4ED8"/>
  <text class="cardText" x="248" y="692">Ksuid.Seconds.TIMESTAMP_LEN = 4</text>
<text class="cardText" x="248" y="726">timestamp = epoch seconds - 1_400_000_000</text>
<text class="cardText" x="248" y="760">bytes.writeInt(timestamp.toInt())</text>
<text class="cardText" x="248" y="794">placed before the random payload</text>
</g>
<g>
  <rect class="card" x="1680" y="570" width="1200" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="2280" y="624" text-anchor="middle">Seconds payload</text>
  <path class="divider" d="M1680 652H2880" stroke="#C2410C"/>
  <text class="cardText" x="1708" y="692">Ksuid.Seconds.PAYLOAD_LEN = 16</text>
<text class="cardText" x="1708" y="726">SecureRandom fills 16 payload bytes</text>
<text class="cardText" x="1708" y="760">20 bytes total before Base62</text>
<text class="cardText" x="1708" y="794">default KsuidGenerator uses this strategy</text>
</g>
<g>
  <rect class="card" x="220" y="1290" width="1200" height="250" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="cardTitle" x="820" y="1344" text-anchor="middle">Millis timestamp</text>
  <path class="divider" d="M220 1372H1420" stroke="#6D28D9"/>
  <text class="cardText" x="248" y="1412">Ksuid.Millis.TIMESTAMP_LEN = 8</text>
<text class="cardText" x="248" y="1446">timestamp = epoch millis - 1_400_000_000_000</text>
<text class="cardText" x="248" y="1480">bytes.writeLong(timestamp)</text>
<text class="cardText" x="248" y="1514">switch here when ms precision matters</text>
</g>
<g>
  <rect class="card" x="1680" y="1290" width="1200" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="2280" y="1344" text-anchor="middle">Millis payload</text>
  <path class="divider" d="M1680 1372H2880" stroke="#15803D"/>
  <text class="cardText" x="1708" y="1412">Ksuid.Millis.PAYLOAD_LEN = 12</text>
<text class="cardText" x="1708" y="1446">SecureRandom fills 12 payload bytes</text>
<text class="cardText" x="1708" y="1480">20 bytes total before Base62</text>
<text class="cardText" x="1708" y="1514">all variants render substring(0, 27)</text>
</g>
</svg>