  <text class="stereo" x="1100" y="180" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="1100" y="208" text-anchor="middle">ITimePeriod</text>
  <line class="divider" x1="918" y1="222" x2="1282" y2="222" />
