<rect class="canvas" width="1680" height="1160" />
<rect class="frame" x="34" y="30" width="1612" height="1100" rx="8" />
<text class="title" x="72" y="84">Virtual Thread Class Structure</text>
<text class="subtitle" x="76" y="116">API facades select ServiceLoader providers; JDK modules implement runtime and StructuredTaskScope contracts.</text>

<text class="section" x="92" y="178">Virtual thread runtime API</text>
<text class="section" x="92" y="514">Structured concurrency API</text>
<text class="section" x="92" y="872">ScopedValue task context</text>

<g id="VirtualThreads">
  <rect class="card" x="110" y="210" width="330" height="128" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereo" x="275" y="238" text-anchor="middle">object facade</text>
  <text class="className" x="275" y="268" text-anchor="middle">VirtualThreads</text>
  <line class="divider" x1="130" y1="286" x2="420" y2="286" />
  <text class="member" x="130" y="312">+ runtime()</text>
  <text class="member" x="130" y="334">+ threadFactory(prefix)</text>
  <text class="member" x="130" y="356">+ executorService()</text>
</g>
<g id="VirtualThreadRuntime">
  <rect class="card" x="610" y="198" width="350" height="152" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereo" x="785" y="226" text-anchor="middle">interface</text>
  <text class="className" x="785" y="256" text-anchor="middle">VirtualThreadRuntime</text>
  <line class="divider" x1="630" y1="274" x2="940" y2="274" />
  <text class="member" x="630" y="300">+ runtimeName: String</text>
  <text class="member" x="630" y="322">+ priority: Int</text>
  <text class="member" x="630" y="344">+ isSupported()</text>
</g>
<g id="Jdk25Runtime">
  <rect class="card" x="1140" y="170" width="360" height="92" rx="8" fill="#FDF2F8" stroke="#DB2777" />
  <text class="className" x="1320" y="207" text-anchor="middle">Jdk25VirtualThreadRuntime</text>
  <text class="member" x="1320" y="234" text-anchor="middle">priority 25, vt25 executor</text>
</g>
<g id="Jdk21Runtime">
  <rect class="card" x="1140" y="286" width="360" height="92" rx="8" fill="#ECFDF5" stroke="#16A34A" />
  <text class="className" x="1320" y="323" text-anchor="middle">Jdk21VirtualThreadRuntime</text>
  <text class="member" x="1320" y="350" text-anchor="middle">priority 21, vt21 executor</text>
</g>
<g id="PlatformRuntime">
  <rect class="card" x="520" y="382" width="330" height="76" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="className" x="685" y="413" text-anchor="middle">PlatformThreadRuntime</text>
  <text class="member" x="685" y="438" text-anchor="middle">internal fallback in VirtualThreads</text>
</g>

<g id="StructuredTaskScopes">
  <rect class="card" x="110" y="548" width="330" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereo" x="275" y="576" text-anchor="middle">object facade</text>
  <text class="className" x="275" y="606" text-anchor="middle">StructuredTaskScopes</text>
  <line class="divider" x1="130" y1="624" x2="420" y2="624" />
  <text class="member" x="130" y="650">+ failFast { }</text>
  <text class="member" x="130" y="672">+ firstSuccess { }</text>
  <text class="member" x="130" y="694">+ supervised { }</text>
</g>
<g id="StructuredTaskScopeProvider">
  <rect class="card" x="590" y="536" width="390" height="156" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="stereo" x="785" y="564" text-anchor="middle">interface</text>
  <text class="className" x="785" y="594" text-anchor="middle">StructuredTaskScopeProvider</text>
  <line class="divider" x1="610" y1="612" x2="960" y2="612" />
  <text class="member" x="610" y="638">+ withAll / withFailFast</text>
  <text class="member" x="610" y="660">+ withAny / withFirstSuccess</text>
  <text class="member" x="610" y="682">+ withSupervised</text>
</g>
<g id="Jdk25Provider">
  <rect class="card" x="1120" y="500" width="440" height="98" rx="8" fill="#FDF2F8" stroke="#DB2777" />
  <text class="className" x="1340" y="536" text-anchor="middle">Jdk25StructuredTaskScopeProvider</text>
  <text class="member" x="1340" y="564" text-anchor="middle">StructuredTaskScope.open + Joiner</text>
</g>
<g id="Jdk21Provider">
  <rect class="card" x="1120" y="632" width="440" height="98" rx="8" fill="#ECFDF5" stroke="#16A34A" />
  <text class="className" x="1340" y="668" text-anchor="middle">Jdk21StructuredTaskScopeProvider</text>
  <text class="member" x="1340" y="696" text-anchor="middle">ShutdownOnFailure / ShutdownOnSuccess</text>
</g>
<g id="ScopeContracts">
  <rect class="card" x="500" y="734" width="560" height="96" rx="8" fill="#FFF7ED" stroke="#D97706" />
  <text class="className" x="780" y="770" text-anchor="middle">Scope and subtask contracts</text>
  <text class="member" x="780" y="798" text-anchor="middle">StructuredTaskScopeAll, Any, Supervised, StructuredSubtask</text>
</g>

<g id="TaskContext">
  <rect class="card" x="180" y="908" width="360" height="112" rx="8" fill="#FAF5FF" stroke="#9333EA" />
  <text class="stereo" x="360" y="936" text-anchor="middle">object</text>
  <text class="className" x="360" y="966" text-anchor="middle">TaskContext</text>
  <text class="member" x="360" y="994" text-anchor="middle">newKey, get, run, bind</text>
</g>
<g id="TaskContextBindings">
  <rect class="card" x="690" y="908" width="360" height="112" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="stereo" x="870" y="936" text-anchor="middle">builder</text>
  <text class="className" x="870" y="966" text-anchor="middle">TaskContextBindings</text>
  <text class="member" x="870" y="994" text-anchor="middle">and(...), run { }, call { }</text>
</g>
<g id="ScopedValue">
  <rect class="card" x="1200" y="908" width="300" height="112" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="stereo" x="1350" y="936" text-anchor="middle">JDK API</text>
  <text class="className" x="1350" y="966" text-anchor="middle">ScopedValue</text>
  <text class="member" x="1350" y="994" text-anchor="middle">immutable scoped binding</text>
</g>

