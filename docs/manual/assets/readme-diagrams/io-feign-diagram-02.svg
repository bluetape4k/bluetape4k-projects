  <rect class="canvas" width="1800" height="1040" />
  <rect class="frame" x="36" y="30" width="1728" height="980" rx="8" />
  <text class="title" x="78" y="86">Class Hierarchy: Feign + Coroutines</text>
  <text class="subtitle" x="82" y="118">Builder DSL functions configure OpenFeign builders; transport and codec classes implement Feign extension points.</text>

  <rect class="zone" x="82" y="158" width="520" height="420" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
  <text class="zone-title" x="112" y="198">Builder DSL</text>

