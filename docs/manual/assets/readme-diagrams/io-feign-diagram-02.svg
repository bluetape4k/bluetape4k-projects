  <text class="zone-title" x="664" y="198">HTTP transport</text>

  <rect class="zone" x="1186" y="158" width="532" height="754" rx="8" fill="#f0fdfa" stroke="#99f6e4" />
  <text class="zone-title" x="1216" y="198">JSON codec integration</text>

  <rect class="zone" x="82" y="618" width="1072" height="294" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="zone-title" x="112" y="658">Request / response support</text>

