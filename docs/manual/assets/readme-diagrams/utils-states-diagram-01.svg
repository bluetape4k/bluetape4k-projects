<style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}.card{filter:url(#softShadow);stroke-width:1.9}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13.5px;fill:#475569}.icon{stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 8}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}</style></defs>
<rect class="canvas" width="1720" height="940"/><rect class="frame" x="38" y="30" width="1644" height="874" rx="8"/>
<text class="title" x="78" y="86">States Concept Overview</text>
<text class="subtitle" x="82" y="118">Typed states and events become transition rules. Runtime checks final states and guards before returning results or publishing observations.</text>
<text class="subtitle" x="860" y="650" text-anchor="middle">Runtime implementations share the same transition contract with different concurrency and observation models.</text>
<g id="edges"><path class="edge" d="M490 250 L670 250" stroke="#2563EB" marker-end="url(#arrow-dslRegistry)"/>
<path class="edge" d="M1050 250 L1230 250" stroke="#9333EA" marker-end="url(#arrow-registryRuntime)"/>
<path class="edge" d="M490 489 L670 489" stroke="#0D9488" marker-end="url(#arrow-eventRules)"/>
<path class="edge" d="M 1420 315 L 1420 351 Q 1420 365 1406 365 L 1014 365 Q 1000 365 1000 379 L 1000 405" stroke="#16A34A" marker-end="url(#arrow-runtimeRules)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="edge" d="M1050 489 L1230 489" stroke="#EA580C" marker-end="url(#arrow-rulesResult)"/>
<path class="edge dashed" d="M860 405 L860 315" stroke="#9333EA"/>
<polygon points="866,327 860,315 854,327" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/></g>
<g id="labels"><g class="edgeLabel" transform="translate(545 209)"><rect width="70" height="30" rx="8"/><text x="35" y="20" text-anchor="middle">builds</text></g>
<g class="edgeLabel" transform="translate(1099 209)"><rect width="82" height="30" rx="8"/><text x="41" y="20" text-anchor="middle">resolves</text></g>
<g class="edgeLabel" transform="translate(516 448)"><rect width="128" height="30" rx="8"/><text x="64" y="20" text-anchor="middle">transition(event)</text></g>
<g class="edgeLabel" transform="translate(1164 325)"><rect width="112" height="30" rx="8"/><text x="56" y="20" text-anchor="middle">current state</text></g>
<g class="edgeLabel" transform="translate(1097 448)"><rect width="86" height="30" rx="8"/><text x="43" y="20" text-anchor="middle">accepted</text></g>
<g class="edgeLabel" transform="translate(884 345)"><rect width="112" height="30" rx="8"/><text x="56" y="20" text-anchor="middle">exact or parent</text></g></g>
<g id="dsl"><rect class="card" x="110" y="185" width="380" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(134 209)" stroke="#2563EB"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M24 17 L40 28 L24 39 Z" fill="#2563EB" stroke="none"/></g>
  <text class="cardTitle" x="324" y="227" text-anchor="middle">Typed FSM DSL</text>
  <text class="detail" x="300" y="263" text-anchor="middle">initialState / finalStates</text>
  <text class="detail" x="300" y="282" text-anchor="middle">transition(from, on&lt;E&gt;(), to)</text></g>
<g id="registry"><rect class="card" x="670" y="185" width="380" height="130" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <g class="icon" transform="translate(694 209)" stroke="#9333EA"><path d="M28 7 L51 28 L28 49 L5 28 Z" fill="#fff"/><path d="M18 24 H38 M18 33 H38" fill="none"/></g>
  <text class="cardTitle" x="884" y="227" text-anchor="middle">TransitionRegistry</text>
  <text class="detail" x="860" y="263" text-anchor="middle">TransitionKey + Target</text>
  <text class="detail" x="860" y="282" text-anchor="middle">exact state wins over parent</text></g>
<g id="runtime"><rect class="card" x="1230" y="185" width="380" height="130" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <g class="icon" transform="translate(1254 209)" stroke="#16A34A"><rect x="8" y="12" width="48" height="34" rx="7" fill="#fff"/><path d="M18 24 H46 M18 34 H38" fill="none"/></g>
  <text class="cardTitle" x="1444" y="227" text-anchor="middle">StateMachine runtime</text>
  <text class="detail" x="1420" y="263" text-anchor="middle">holds current state</text>
  <text class="detail" x="1420" y="282" text-anchor="middle">blocks final-state changes</text></g>
<g id="event"><rect class="card" x="110" y="430" width="380" height="118" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(134 454)" stroke="#0D9488"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M19 28 H40 M34 20 L42 28 L34 36" fill="none"/></g>
  <text class="cardTitle" x="324" y="472" text-anchor="middle">Event arrives</text>
  <text class="detail" x="300" y="508" text-anchor="middle">event instance</text>
  <text class="detail" x="300" y="527" text-anchor="middle">typed by event class</text></g>
<g id="rules"><rect class="card" x="670" y="405" width="380" height="170" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <g class="icon" transform="translate(694 429)" stroke="#EA580C"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M17 29 L25 37 L41 19" fill="none"/></g>
  <text class="cardTitle" x="884" y="447" text-anchor="middle">Transition checks</text>
  <text class="detail" x="860" y="483" text-anchor="middle">resolve transition</text>
  <text class="detail" x="860" y="502" text-anchor="middle">evaluate guard condition</text></g>
<g id="result"><rect class="card" x="1230" y="430" width="380" height="118" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <g class="icon" transform="translate(1254 454)" stroke="#DB2777"><rect x="8" y="10" width="48" height="36" rx="7" fill="#fff"/><path d="M18 24 H44 M18 34 H38" fill="none"/><circle cx="46" cy="35" r="4" fill="#DB2777" stroke="none"/></g>
  <text class="cardTitle" x="1444" y="472" text-anchor="middle">TransitionResult</text>
  <text class="detail" x="1420" y="508" text-anchor="middle">previous + event + current</text>
  <text class="detail" x="1420" y="527" text-anchor="middle">callback after accepted change</text></g>
<g id="sync"><rect class="card" x="175" y="685" width="330" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(199 709)" stroke="#2563EB"><rect x="8" y="12" width="48" height="34" rx="7" fill="#fff"/><path d="M18 24 H46 M18 34 H38" fill="none"/></g>
  <text class="cardTitle" x="364" y="727" text-anchor="middle">Sync FSM</text>
  <text class="detail" x="340" y="763" text-anchor="middle">AtomicReference CAS</text>
  <text class="detail" x="340" y="782" text-anchor="middle">synchronous transition()</text></g>
<g id="suspend"><rect class="card" x="695" y="685" width="330" height="112" rx="8" fill="#ECFDF5" stroke="#16A34A"/>
  <g class="icon" transform="translate(719 709)" stroke="#16A34A"><rect x="8" y="12" width="48" height="34" rx="7" fill="#fff"/><path d="M18 24 H46 M18 34 H38" fill="none"/></g>
  <text class="cardTitle" x="884" y="727" text-anchor="middle">Suspend FSM</text>
  <text class="detail" x="860" y="763" text-anchor="middle">Mutex serialization</text>
  <text class="detail" x="860" y="782" text-anchor="middle">StateFlow observation</text></g>
<g id="reactive"><rect class="card" x="1215" y="685" width="330" height="112" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(1239 709)" stroke="#0D9488"><rect x="8" y="12" width="48" height="34" rx="7" fill="#fff"/><path d="M18 24 H46 M18 34 H38" fill="none"/></g>
  <text class="cardTitle" x="1404" y="727" text-anchor="middle">Reactive runtime</text>
  <text class="detail" x="1380" y="763" text-anchor="middle">queued send(event)</text>
  <text class="detail" x="1380" y="782" text-anchor="middle">one-time effects</text></g>
</svg>