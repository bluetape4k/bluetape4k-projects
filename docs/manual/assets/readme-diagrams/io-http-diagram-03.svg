<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1180" viewBox="0 0 1760 1180" role="img" aria-label="OkHttp3 Client Hierarchy">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <marker id="open-orange" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" viewBox="0 0 18 18">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" />
    </marker>
    <marker id="open-blue" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-green" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" viewBox="0 0 18 18">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" />
    </marker>
    <marker id="open-gray" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" viewBox="0 0 18 18">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#64748B" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" />
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .laneTitle{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
      .card{stroke-width:2;filter:url(#softShadow)}
      .className{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
      .member{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .label{font-family:"Comic Mono";font-size:12px;fill:#334155}
      .badge{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
      .solid{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .dashed{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1180" />
  <rect class="frame" x="36" y="30" width="1688" height="1120" rx="8" />
  <text class="title" x="76" y="86">OkHttp3 Client Hierarchy</text>
  <text class="subtitle" x="80" y="120">OkHttp support centers on builder defaults, virtual-thread dispatching, request helpers, coroutine execution, interceptors, disk cache, and test utilities.</text>

  <g id="legend">
    <rect class="badge" x="1130" y="62" width="236" height="34" rx="8" />
    <path class="solid" d="M1152 79 L1200 79" stroke="#2563EB" />

    <polyline points="1182,87 1200,79 1182,71" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <text class="label" x="1216" y="83">returns / wraps</text>
    <rect class="badge" x="1392" y="62" width="236" height="34" rx="8" />
    <path class="dashed" d="M1414 79 L1462 79" stroke="#64748B" />

    <polyline points="1444,87 1462,79 1444,71" fill="none" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <text class="label" x="1478" y="83">configures / uses</text>
  </g>

  <g id="builder-lane">
    <rect class="lane" x="94" y="166" width="500" height="858" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1" />
    <text class="laneTitle" x="130" y="212" dominant-baseline="middle">Client construction</text>

    <g id="builder">
      <rect class="card" x="144" y="260" width="400" height="148" rx="8" fill="#FFF7ED" stroke="#EA580C" />
      <text class="className" x="344" y="296" text-anchor="middle" dominant-baseline="middle">OkHttp3 builders</text>
      <text class="member" x="344" y="334" text-anchor="middle">okhttp3ClientBuilderOf(...)</text>
      <text class="member" x="344" y="358" text-anchor="middle">okhttp3Client(...)</text>
      <text class="member" x="344" y="382" text-anchor="middle">10s connect/read, 30s write</text>
    </g>

    <g id="pool-dispatcher">
      <rect class="card" x="144" y="496" width="400" height="126" rx="8" fill="#FFFFFF" stroke="#EA580C" />
      <text class="className" x="344" y="532" text-anchor="middle" dominant-baseline="middle">Pool and dispatcher</text>
      <text class="member" x="344" y="570" text-anchor="middle">okHttp3ConnectionPool(...)</text>
      <text class="member" x="344" y="594" text-anchor="middle">okhttp3DispatcherWithVirtualThread(...)</text>
      <text class="member" x="344" y="618" text-anchor="middle">maxRequests 200 / perHost 100</text>
    </g>

    <g id="client">
      <rect class="card" x="144" y="820" width="400" height="110" rx="8" fill="#FFF7ED" stroke="#EA580C" />
      <text class="className" x="344" y="858" text-anchor="middle" dominant-baseline="middle">OkHttpClient</text>
      <text class="member" x="344" y="896" text-anchor="middle">connection pool + dispatcher</text>
      <text class="member" x="344" y="920" text-anchor="middle">customizable builder block</text>
    </g>
  </g>

  <g id="execution-lane">
    <rect class="lane" x="630" y="166" width="500" height="858" rx="8" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1" />
    <text class="laneTitle" x="666" y="212" dominant-baseline="middle">Request execution</text>

    <g id="request">
      <rect class="card" x="680" y="260" width="400" height="126" rx="8" fill="#EFF6FF" stroke="#2563EB" />
      <text class="className" x="880" y="296" text-anchor="middle" dominant-baseline="middle">Request helpers</text>
      <text class="member" x="880" y="334" text-anchor="middle">okhttp3Request(...)</text>
      <text class="member" x="880" y="358" text-anchor="middle">okhttp3RequestOf(url, headers)</text>
    </g>

    <g id="call">
      <rect class="card" x="680" y="496" width="400" height="126" rx="8" fill="#FFFFFF" stroke="#2563EB" />
      <text class="className" x="880" y="532" text-anchor="middle" dominant-baseline="middle">Call execution</text>
      <text class="member" x="880" y="570" text-anchor="middle">OkHttpClient.execute(request)</text>
      <text class="member" x="880" y="594" text-anchor="middle">executeAsync(request)</text>
      <text class="member" x="880" y="618" text-anchor="middle">newCall(request).enqueue(...)</text>
    </g>

    <g id="coroutine">
      <rect class="card" x="680" y="820" width="400" height="110" rx="8" fill="#EFF6FF" stroke="#2563EB" />
      <text class="className" x="880" y="858" text-anchor="middle" dominant-baseline="middle">executeSuspending(...)</text>
      <text class="member" x="880" y="896" text-anchor="middle">suspendCancellableCoroutine</text>
      <text class="member" x="880" y="920" text-anchor="middle">cancels the underlying Call</text>
    </g>
  </g>

  <g id="support-lane">
    <rect class="lane" x="1166" y="166" width="500" height="858" rx="8" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1" />
    <text class="laneTitle" x="1202" y="212" dominant-baseline="middle">Interceptors, cache, tests</text>

    <g id="interceptors">
      <rect class="card" x="1216" y="260" width="400" height="148" rx="8" fill="#F0FDF4" stroke="#16A34A" />
      <text class="className" x="1416" y="296" text-anchor="middle" dominant-baseline="middle">Interceptors</text>
      <text class="member" x="1416" y="334" text-anchor="middle">LoggingInterceptor(logger)</text>
      <text class="member" x="1416" y="358" text-anchor="middle">CachingRequestInterceptor(...)</text>
      <text class="member" x="1416" y="382" text-anchor="middle">CachingResponseInterceptor(...)</text>
    </g>

    <g id="cache">
      <rect class="card" x="1216" y="496" width="400" height="126" rx="8" fill="#FFFFFF" stroke="#16A34A" />
      <text class="className" x="1416" y="532" text-anchor="middle" dominant-baseline="middle">Disk cache support</text>
      <text class="member" x="1416" y="570" text-anchor="middle">okhttp3ClientWithCache(...)</text>
      <text class="member" x="1416" y="594" text-anchor="middle">Cache.metrics(), Cache.logMetrics(...)</text>
    </g>

    <g id="mock">
      <rect class="card" x="1216" y="820" width="400" height="110" rx="8" fill="#F0FDF4" stroke="#16A34A" />
      <text class="className" x="1416" y="858" text-anchor="middle" dominant-baseline="middle">MockWebServer helpers</text>
      <text class="member" x="1416" y="896" text-anchor="middle">MockResponse support</text>
      <text class="member" x="1416" y="920" text-anchor="middle">test server extensions</text>
    </g>
  </g>

  <path class="dashed" d="M 344 408 L 344 496" stroke="#EA580C" />


  <polyline points="336,478 344,496 352,478" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="solid" d="M 344 622 L 344 820" stroke="#EA580C" />

  <polyline points="336,802 344,820 352,802" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="solid" d="M 880 386 L 880 496" stroke="#2563EB" />


  <polyline points="872,478 880,496 888,478" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="solid" d="M 880 622 L 880 820" stroke="#2563EB" />

  <polyline points="872,802 880,820 888,802" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <path class="dashed" d="M 1416 408 L 1416 496" stroke="#16A34A" />


  <polyline points="1408,478 1416,496 1424,478" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="solid" d="M 1416 622 L 1416 820" stroke="#16A34A" />

  <polyline points="1408,802 1416,820 1424,802" fill="none" stroke="#16A34A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <g id="usage-notes">
    <rect class="card" x="144" y="1032" width="1472" height="72" rx="8" fill="#F8FAFC" stroke="#64748B" />
    <text class="className" x="330" y="1069" text-anchor="middle" dominant-baseline="middle">Usage contract</text>
    <text class="member" x="684" y="1069" text-anchor="middle">builder defaults are overrideable</text>
    <text class="member" x="1020" y="1069" text-anchor="middle">coroutine cancellation closes Response safely</text>
    <text class="member" x="1370" y="1069" text-anchor="middle">interceptors and cache are opt-in</text>
  </g>
</svg>
