<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940" role="img" aria-label="Sequential Flow Error Strategy">
<defs>
  <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-startExecute" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#2563EB"/></marker>
  <marker id="arrow-executeInspect" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#16A34A"/></marker>
  <marker id="arrow-noFailure" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#65A30D"/></marker>
  <marker id="arrow-failure" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#DB2777"/></marker>
  <marker id="arrow-stop" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#DB2777"/></marker>
  <marker id="arrow-continue" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#EA580C"/></marker>
  <marker id="arrow-successFinal" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#65A30D"/></marker>
  <marker id="arrow-partialFinal" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#EA580C"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .card{filter:url(#softShadow);stroke-width:1.9}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13.5px;fill:#475569}
    .icon{stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 8}
    .edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="1680" height="940"/>
<rect class="frame" x="38" y="30" width="1604" height="874" rx="8"/>
<text class="title" x="78" y="86">Sequential Flow Error Strategy</text>
<text class="subtitle" x="82" y="118">Sequential flows run work in order; STOP returns the first failure, while CONTINUE accumulates failures and keeps running later work.</text>
<g id="edges">
  <path class="edge" d="M440 307 L540 307" stroke="#2563EB" marker-end="url(#arrow-startExecute)"/>
  <path class="edge" d="M900 307 L1000 307" stroke="#16A34A" marker-end="url(#arrow-executeInspect)"/>
  <path class="edge" d="M 1360 307 L 1441 307 Q 1455 307 1455 321 L 1455 495" stroke="#65A30D" marker-end="url(#arrow-noFailure)"/>
  <path class="edge" d="M 1180 369 L 1180 436 Q 1180 450 1166 450 L 969 450 Q 955 450 955 464 L 955 495" stroke="#DB2777" marker-end="url(#arrow-failure)"/>
  <path class="edge" d="M 780 554 L 689 554 Q 675 554 675 568 L 675 780 Q 675 794 662 794 L 640 794" stroke="#DB2777" marker-end="url(#arrow-stop)"/>
  <path class="edge" d="M955 613 L955 735" stroke="#EA580C" marker-end="url(#arrow-continue)"/>
  <path class="edge" d="M1385 613 L1385 735" stroke="#65A30D" marker-end="url(#arrow-successFinal)"/>
  <path class="edge" d="M1140 794 L1240 794" stroke="#EA580C" marker-end="url(#arrow-partialFinal)"/>
</g>
<g id="labels">
  <g class="edgeLabel" transform="translate(427 221)"><rect width="126" height="30" rx="8"/><text x="63" y="20" text-anchor="middle">initial context</text></g>
  <g class="edgeLabel" transform="translate(914 267)"><rect width="72" height="30" rx="8"/><text x="36" y="20" text-anchor="middle">report</text></g>
  <g class="edgeLabel" transform="translate(1436 392)"><rect width="104" height="30" rx="8"/><text x="52" y="20" text-anchor="middle">not failure</text></g>
  <g class="edgeLabel" transform="translate(1025 410)"><rect width="82" height="30" rx="8"/><text x="41" y="20" text-anchor="middle">Failure</text></g>
  <g class="edgeLabel" transform="translate(636 659)"><rect width="64" height="30" rx="8"/><text x="32" y="20" text-anchor="middle">STOP</text></g>
  <g class="edgeLabel" transform="translate(976 661)"><rect width="104" height="30" rx="8"/><text x="52" y="20" text-anchor="middle">CONTINUE</text></g>
  <g class="edgeLabel" transform="translate(1410 661)"><rect width="96" height="30" rx="8"/><text x="48" y="20" text-anchor="middle">no failures</text></g>
  <g class="edgeLabel" transform="translate(1136 754)"><rect width="108" height="30" rx="8"/><text x="54" y="20" text-anchor="middle">has failures</text></g>
</g>
<g id="start">
  <rect class="card" x="110" y="245" width="330" height="124" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(134 269)" stroke="#2563EB"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M24 17 L40 28 L24 39 Z" fill="#2563EB" stroke="none"/></g>
  <text class="cardTitle" x="299" y="285" text-anchor="middle">Start sequential flow</text>
  <text class="detail" x="275" y="323" text-anchor="middle">initial WorkContext</text>
  <text class="detail" x="275" y="342" text-anchor="middle">ordered work list</text>
</g>
<g id="execute">
  <rect class="card" x="540" y="245" width="360" height="124" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <g class="icon" transform="translate(564 269)" stroke="#16A34A"><rect x="7" y="10" width="50" height="34" rx="7" fill="#fff"/><path d="M18 27 H45 M37 19 L45 27 L37 35" fill="none"/></g>
  <text class="cardTitle" x="744" y="285" text-anchor="middle">Execute next Work</text>
  <text class="detail" x="720" y="323" text-anchor="middle">calls execute(context)</text>
  <text class="detail" x="720" y="342" text-anchor="middle">exceptions become Failure</text>
</g>
<g id="inspect">
  <rect class="card" x="1000" y="245" width="360" height="124" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(1024 269)" stroke="#0D9488"><rect x="9" y="10" width="42" height="36" rx="7" fill="#fff"/><path d="M18 23 H42 M18 33 H35" fill="none"/><circle cx="44" cy="34" r="4" fill="#0D9488" stroke="none"/></g>
  <text class="cardTitle" x="1204" y="285" text-anchor="middle">Inspect WorkReport</text>
  <text class="detail" x="1180" y="323" text-anchor="middle">Success continues</text>
  <text class="detail" x="1180" y="342" text-anchor="middle">Failure checks strategy</text>
</g>
<g id="success">
  <rect class="card" x="1210" y="495" width="350" height="118" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <g class="icon" transform="translate(1234 519)" stroke="#65A30D"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M17 29 L25 37 L42 18" fill="none"/></g>
  <text class="cardTitle" x="1409" y="535" text-anchor="middle">Success path</text>
  <text class="detail" x="1385" y="573" text-anchor="middle">advance in order</text>
  <text class="detail" x="1385" y="592" text-anchor="middle">or finish with Success</text>
</g>
<g id="failure">
  <rect class="card" x="780" y="495" width="350" height="118" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <g class="icon" transform="translate(804 519)" stroke="#DB2777"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M18 18 L38 38 M38 18 L18 38" fill="none"/></g>
  <text class="cardTitle" x="979" y="535" text-anchor="middle">Failure path</text>
  <text class="detail" x="955" y="573" text-anchor="middle">only Failure uses strategy</text>
  <text class="detail" x="955" y="592" text-anchor="middle">Aborted/Cancelled exit earlier</text>
</g>
<g id="stop">
  <rect class="card" x="290" y="735" width="350" height="118" rx="8" fill="#FFF1F2" stroke="#DB2777"/>
  <g class="icon" transform="translate(314 759)" stroke="#DB2777"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M18 18 L38 38 M38 18 L18 38" fill="none"/></g>
  <text class="cardTitle" x="489" y="775" text-anchor="middle">STOP strategy</text>
  <text class="detail" x="465" y="813" text-anchor="middle">return first Failure</text>
  <text class="detail" x="465" y="832" text-anchor="middle">flow exits immediately</text>
</g>
<g id="cont">
  <rect class="card" x="760" y="735" width="380" height="118" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <g class="icon" transform="translate(784 759)" stroke="#EA580C"><path d="M43 20 A17 17 0 1 0 43 38" fill="none"/><path d="M42 14 L44 22 L36 20" fill="none"/></g>
  <text class="cardTitle" x="974" y="775" text-anchor="middle">CONTINUE strategy</text>
  <text class="detail" x="950" y="813" text-anchor="middle">record failed report</text>
  <text class="detail" x="950" y="832" text-anchor="middle">continue remaining work</text>
</g>
<g id="final">
  <rect class="card" x="1240" y="735" width="350" height="118" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <g class="icon" transform="translate(1264 759)" stroke="#9333EA"><rect x="8" y="10" width="48" height="36" rx="7" fill="#fff"/><path d="M18 24 H44 M18 34 H38" fill="none"/></g>
  <text class="cardTitle" x="1439" y="775" text-anchor="middle">Final result</text>
  <text class="detail" x="1415" y="813" text-anchor="middle">Success if no failures</text>
  <text class="detail" x="1415" y="832" text-anchor="middle">PartialSuccess if accumulated</text>
</g>
</svg>
