<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="860" viewBox="0 0 1460 860" role="img" aria-label="Spring Boot Redis serializer class structure">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/></marker>
    <marker id="open-gray" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round"  style="stroke-dasharray:none"/></marker>
    <marker id="hollow-blue" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" viewBox="0 0 12 12" refX="11" refY="6" orient="auto"><path d="M 1 1 L 11 6 L 1 11 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="none" style="stroke-dasharray:none" stroke-linejoin="round" /></marker>
  </defs>
  <rect width="1460" height="860" fill="#ffffff" />
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">Spring Boot Redis Serializer Class Structure</text>
  <text x="72" y="92" font-size="15" fill="#64748b">RedisSerializer adapters wrap bluetape4k binary serializers or compressors, while factory constants and context DSL wire them into Redis templates.</text>
  <text x="280" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">object value adapter</text>
  <text x="760" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">ByteArray compression adapter</text>
  <text x="1180" y="342" text-anchor="middle" font-size="14" font-weight="700" fill="#7c3aed">factory and context helpers</text>
  <path class="edge" d="M 280 382 L 280 354 Q 280 340 294 340 L 451 340 Q 465 340 465 326 L 465 298" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" />
<polygon points="474,319 465,298 456,319" fill="#FFFFFF" stroke="#2563eb" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge" d="M 760 382 L 760 354 Q 760 340 746 340 L 629 340 Q 615 340 615 326 L 615 298" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" />
<polygon points="624,319 615,298 606,319" fill="#FFFFFF" stroke="#2563eb" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge" d="M280 634 L280 554" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M760 634 L760 554" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M1180 554 L1180 634" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />

  <g class="card" data-card="RedisSerializer&lt;T&gt;">
    <rect x="355" y="172" width="330" height="126" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="520" y="193" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;Spring Data interface&gt;&gt;</text>
    <text x="520" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RedisSerializer&lt;T&gt;</text>
    <line x1="355" y1="227" x2="685" y2="227" stroke="#2563eb" stroke-width="1.1" opacity="0.55" />
    <line x1="355" y1="281" x2="685" y2="281" stroke="#2563eb" stroke-width="1.1" opacity="0.45" />
    <text x="371" y="250" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">serialize(value): ByteArray</text>
<text x="371" y="268" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">deserialize(bytes): T?</text>

  </g>

  <g class="card" data-card="RedisBinarySerializer">
    <rect x="115" y="382" width="330" height="172" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <text x="280" y="403" text-anchor="middle" font-size="12.5" fill="#16a34a">&lt;&lt;RedisSerializer Any&gt;&gt;</text>
    <text x="280" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RedisBinarySerializer</text>
    <line x1="115" y1="437" x2="445" y2="437" stroke="#16a34a" stroke-width="1.1" opacity="0.55" />
    <line x1="115" y1="473" x2="445" y2="473" stroke="#16a34a" stroke-width="1.1" opacity="0.45" />
    <text x="131" y="460" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">BinarySerializer</text>
    <text x="131" y="496" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">serialize(null) -&gt; emptyByteArray</text>
<text x="131" y="514" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">deserialize delegates to BinarySerializer</text>
  </g>

  <g class="card" data-card="RedisCompressSerializer">
    <rect x="595" y="382" width="330" height="172" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="760" y="403" text-anchor="middle" font-size="12.5" fill="#ea580c">&lt;&lt;RedisSerializer ByteArray&gt;&gt;</text>
    <text x="760" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RedisCompressSerializer</text>
    <line x1="595" y1="437" x2="925" y2="437" stroke="#ea580c" stroke-width="1.1" opacity="0.55" />
    <line x1="595" y1="473" x2="925" y2="473" stroke="#ea580c" stroke-width="1.1" opacity="0.45" />
    <text x="611" y="460" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">Compressor = LZ4 by default</text>
    <text x="611" y="496" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">compress ByteArray values</text>
<text x="611" y="514" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">decompress stored bytes</text>
  </g>

  <g class="card" data-card="RedisBinarySerializers">
    <rect x="1015" y="382" width="330" height="172" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <text x="1180" y="403" text-anchor="middle" font-size="12.5" fill="#7c3aed">&lt;&lt;object factory&gt;&gt;</text>
    <text x="1180" y="426" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RedisBinarySerializers</text>
    <line x1="1015" y1="437" x2="1345" y2="437" stroke="#7c3aed" stroke-width="1.1" opacity="0.55" />
    <line x1="1015" y1="473" x2="1345" y2="473" stroke="#7c3aed" stroke-width="1.1" opacity="0.45" />
    <text x="1031" y="460" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">lazy singleton serializers</text>
    <text x="1031" y="496" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">Jdk, Kryo, Fory</text>
<text x="1031" y="514" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">Gzip/LZ4/Snappy/Zstd variants</text>
<text x="1031" y="532" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">compression-only serializers</text>
  </g>

  <g class="card" data-card="BinarySerializers">
    <rect x="115" y="634" width="330" height="128" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <text x="280" y="655" text-anchor="middle" font-size="12.5" fill="#64748b">&lt;&lt;bluetape4k-io&gt;&gt;</text>
    <text x="280" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">BinarySerializers</text>
    <line x1="115" y1="689" x2="445" y2="689" stroke="#64748b" stroke-width="1.1" opacity="0.55" />
    <line x1="115" y1="743" x2="445" y2="743" stroke="#64748b" stroke-width="1.1" opacity="0.45" />
    <text x="131" y="712" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">Jdk/Kryo/Fory</text>
<text x="131" y="730" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">compressed binary combinations</text>

  </g>

  <g class="card" data-card="Compressors">
    <rect x="595" y="634" width="330" height="128" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <text x="760" y="655" text-anchor="middle" font-size="12.5" fill="#64748b">&lt;&lt;bluetape4k-io&gt;&gt;</text>
    <text x="760" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Compressors</text>
    <line x1="595" y1="689" x2="925" y2="689" stroke="#64748b" stroke-width="1.1" opacity="0.55" />
    <line x1="595" y1="725" x2="925" y2="725" stroke="#64748b" stroke-width="1.1" opacity="0.45" />
    <text x="611" y="712" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">GZip, LZ4, Snappy, Zstd</text>

  </g>

  <g class="card" data-card="Redis Context DSL">
    <rect x="1015" y="634" width="330" height="128" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="1180" y="655" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;functions&gt;&gt;</text>
    <text x="1180" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Redis Context DSL</text>
    <line x1="1015" y1="689" x2="1345" y2="689" stroke="#2563eb" stroke-width="1.1" opacity="0.55" />
    <line x1="1015" y1="743" x2="1345" y2="743" stroke="#2563eb" stroke-width="1.1" opacity="0.45" />
    <text x="1031" y="712" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">redisSerializationContext {}</text>
<text x="1031" y="730" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">redisSerializationContextOf(...)</text>

  </g>
  <g class="legend" transform="translate(72 822)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="2.2" stroke-dasharray="7 5" />
<polygon points="17,9 38,0 17,-9" fill="#FFFFFF" stroke="#2563eb" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/><text x="54" y="5" font-size="13" fill="#475569">implements RedisSerializer</text>
    <line x1="340" y1="0" x2="378" y2="0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrow-green)" /><text x="394" y="5" font-size="13" fill="#475569">delegates object serialization</text>
    <line x1="660" y1="0" x2="698" y2="0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)" /><text x="714" y="5" font-size="13" fill="#475569">delegates compression</text>
    <line x1="940" y1="0" x2="978" y2="0" stroke="#2563eb" stroke-width="2.6" marker-end="url(#arrow-blue)" /><text x="994" y="5" font-size="13" fill="#475569">DSL entrypoint</text>
  </g>
</svg>
