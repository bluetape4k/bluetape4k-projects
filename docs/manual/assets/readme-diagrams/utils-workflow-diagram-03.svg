  <path class="edge" d="M760 733 L930 733" stroke="#2563EB" marker-end="url(#arrow-familiesReport)"/>
</g>
<g id="labels">
  <g class="edgeLabel" transform="translate(442 277)"><rect width="122" height="30" rx="8"/><text x="61" y="20" text-anchor="middle">sync builders</text></g>
  <g class="edgeLabel" transform="translate(432 411)"><rect width="148" height="30" rx="8"/><text x="74" y="20" text-anchor="middle">suspend builders</text></g>
  <g class="edgeLabel" transform="translate(972 213)"><rect width="112" height="30" rx="8"/><text x="56" y="20" text-anchor="middle">parallel uses</text></g>
  <g class="edgeLabel" transform="translate(972 443)"><rect width="112" height="30" rx="8"/><text x="56" y="20" text-anchor="middle">parallel uses</text></g>
  <g class="edgeLabel" transform="translate(198 595)"><rect width="148" height="30" rx="8"/><text x="74" y="20" text-anchor="middle">shared flow types</text></g>
  <g class="edgeLabel" transform="translate(1518 491)"><rect width="128" height="30" rx="8"/><text x="64" y="20" text-anchor="middle">returns report</text></g>
  <g class="edgeLabel" transform="translate(1178 577)"><rect width="108" height="30" rx="8"/><text x="54" y="20" text-anchor="middle">same result</text></g>
  <g class="edgeLabel" transform="translate(774 693)"><rect width="142" height="30" rx="8"/><text x="71" y="20" text-anchor="middle">unified contract</text></g>
</g>
<g id="dsl">
  <rect class="card" x="95" y="280" width="350" height="132" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(119 304)" stroke="#2563EB"><path d="M22 4 C12 4 13 18 8 21 C13 24 12 38 22 38" fill="none"/><path d="M42 4 C52 4 51 18 56 21 C51 24 52 38 42 38" fill="none"/><circle cx="32" cy="21" r="4" fill="#2563EB" stroke="none"/></g>
  <text class="cardTitle" x="292" y="320" text-anchor="middle">Caller DSL</text>
  <text class="detail" x="270" y="358" text-anchor="middle">workflow / sequentialFlow</text>
  <text class="detail" x="270" y="377" text-anchor="middle">suspendWorkflow variants</text>
</g>
<g id="sync">
  <rect class="card" x="555" y="190" width="390" height="126" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <g class="icon" transform="translate(579 214)" stroke="#16A34A"><rect x="7" y="10" width="50" height="34" rx="7" fill="#fff"/><path d="M18 27 H46 M38 19 L46 27 L38 35" fill="none"/></g>
  <text class="cardTitle" x="772" y="230" text-anchor="middle">Sync WorkFlow</text>
  <text class="detail" x="750" y="268" text-anchor="middle">WorkFlow extends Work</text>
  <text class="detail" x="750" y="287" text-anchor="middle">blocking API, virtual-thread friendly</text>
</g>
<g id="suspend">
  <rect class="card" x="555" y="420" width="390" height="126" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(579 444)" stroke="#0D9488"><circle cx="18" cy="28" r="9" fill="#fff"/><circle cx="42" cy="28" r="9" fill="#fff"/><path d="M27 28 H33" fill="none"/></g>
  <text class="cardTitle" x="772" y="460" text-anchor="middle">SuspendWorkFlow</text>
  <text class="detail" x="750" y="498" text-anchor="middle">SuspendWorkFlow extends SuspendWork</text>
  <text class="detail" x="750" y="517" text-anchor="middle">cancellation-aware suspend API</text>
</g>
<g id="syncRuntime">
  <rect class="card" x="1110" y="190" width="410" height="126" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <g class="icon" transform="translate(1134 214)" stroke="#65A30D"><circle cx="30" cy="28" r="22" fill="#fff"/><path d="M30 12 V28 L43 36" fill="none"/></g>
  <text class="cardTitle" x="1337" y="230" text-anchor="middle">Virtual-thread runtime</text>
  <text class="detail" x="1315" y="268" text-anchor="middle">StructuredTaskScope</text>
  <text class="detail" x="1315" y="287" text-anchor="middle">timeout returns Cancelled</text>
</g>
<g id="suspendRuntime">
  <rect class="card" x="1110" y="420" width="410" height="126" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <g class="icon" transform="translate(1134 444)" stroke="#9333EA"><circle cx="18" cy="28" r="9" fill="#fff"/><circle cx="42" cy="28" r="9" fill="#fff"/><path d="M27 28 H33" fill="none"/></g>
  <text class="cardTitle" x="1337" y="460" text-anchor="middle">Coroutine runtime</text>
  <text class="detail" x="1315" y="498" text-anchor="middle">coroutineScope, async, awaitAll</text>
  <text class="detail" x="1315" y="517" text-anchor="middle">delay and CancellationException</text>
</g>
<g id="families">
  <rect class="card" x="330" y="670" width="430" height="126" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <g class="icon" transform="translate(354 694)" stroke="#EA580C"><circle cx="12" cy="28" r="7" fill="#fff"/><circle cx="32" cy="16" r="7" fill="#fff"/><circle cx="52" cy="28" r="7" fill="#fff"/><circle cx="32" cy="40" r="7" fill="#fff"/><path d="M19 26 L25 20 M39 20 L46 26 M45 31 L39 37 M25 36 L19 30" fill="none"/></g>
  <text class="cardTitle" x="567" y="710" text-anchor="middle">Flow families</text>
  <text class="detail" x="545" y="748" text-anchor="middle">sequential, parallel, conditional</text>
  <text class="detail" x="545" y="767" text-anchor="middle">repeat and retry</text>
</g>
<g id="report">
  <rect class="card" x="930" y="670" width="430" height="126" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <g class="icon" transform="translate(954 694)" stroke="#DB2777"><rect x="8" y="10" width="48" height="36" rx="7" fill="#fff"/><path d="M18 24 H44 M18 34 H38" fill="none"/><circle cx="46" cy="35" r="4" fill="#DB2777" stroke="none"/></g>
  <text class="cardTitle" x="1167" y="710" text-anchor="middle">WorkReport contract</text>
  <text class="detail" x="1145" y="748" text-anchor="middle">Success / Failure / PartialSuccess</text>
  <text class="detail" x="1145" y="767" text-anchor="middle">Aborted / Cancelled</text>
</g>
