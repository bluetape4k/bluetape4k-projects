<svg xmlns="http://www.w3.org/2000/svg" width="2360" height="980" viewBox="0 0 2360 980" role="img" aria-label="script engine selection guide">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/>
    </filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle,.detail,.tag{font-family:"Comic Mono";fill:#475569}
      .subtitle{font-size:15.4px}
      .scenario{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .engine{font-family:"Architects Daughter";font-size:30px;fill:#0F172A}
      .tag{font-size:15px}
      .detail{font-size:15.6px}
      .card{stroke-width:2;filter:url(#softShadow)}
      .note{font-family:"Comic Mono";font-size:13.6px;fill:#475569}
    </style>
  </defs>
  <rect class="canvas" width="2360" height="980"/>
  <rect class="frame" x="34" y="30" width="2292" height="916" rx="8"/>
  <text class="title" x="76" y="92">Script Engine Selection Guide</text>
  <text class="subtitle" x="80" y="126">Pick the scripting engine by authoring model first, then by runtime cost. All choices still produce Rule instances for the same engine pipeline.</text>
  <g>
    <rect class="card" x="100" y="225" width="690" height="250" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <rect x="100" y="225" width="14" height="250" rx="7" fill="#2563EB"/>
    <text class="scenario" x="142" y="275">Price / threshold checks</text>
    <text class="engine" x="142" y="326">Janino</text>
    <text class="tag" x="142" y="367">Java subset</text>
    <text class="detail" x="142" y="415">Bytecode evaluator; fastest repeated checks.</text>
  </g><g>
    <rect class="card" x="850" y="225" width="690" height="250" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <rect x="850" y="225" width="14" height="250" rx="7" fill="#0D9488"/>
    <text class="scenario" x="892" y="275">Spring bean references</text>
    <text class="engine" x="892" y="326">SpEL</text>
    <text class="tag" x="892" y="367">Spring EL</text>
    <text class="detail" x="892" y="415">EvaluationContext + BeanResolver.</text>
  </g><g>
    <rect class="card" x="1600" y="225" width="690" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <rect x="1600" y="225" width="14" height="250" rx="7" fill="#16A34A"/>
    <text class="scenario" x="1642" y="275">Discount / tier formulas</text>
    <text class="engine" x="1642" y="326">MVEL2 or Groovy</text>
    <text class="tag" x="1642" y="367">Dynamic expr</text>
    <text class="detail" x="1642" y="415">Short business-authored expressions.</text>
  </g><g>
    <rect class="card" x="100" y="535" width="690" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <rect x="100" y="535" width="14" height="250" rx="7" fill="#EA580C"/>
    <text class="scenario" x="142" y="585">Collection transforms</text>
    <text class="engine" x="142" y="636">Groovy</text>
    <text class="tag" x="142" y="677">Groovy script</text>
    <text class="detail" x="142" y="725">Closures, ranges, branching, script actions.</text>
  </g><g>
    <rect class="card" x="850" y="535" width="690" height="250" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
    <rect x="850" y="535" width="14" height="250" rx="7" fill="#DB2777"/>
    <text class="scenario" x="892" y="585">Optional / missing facts</text>
    <text class="engine" x="892" y="636">Groovy</text>
    <text class="tag" x="892" y="677">Null-safe facts</text>
    <text class="detail" x="892" y="725">NullSafeBinding enables Elvis/safe navigation.</text>
  </g><g>
    <rect class="card" x="1600" y="535" width="690" height="250" rx="8" fill="#FAF5FF" stroke="#7C3AED"/>
    <rect x="1600" y="535" width="14" height="250" rx="7" fill="#7C3AED"/>
    <text class="scenario" x="1642" y="585">Type-sensitive logic</text>
    <text class="engine" x="1642" y="636">Kotlin Script</text>
    <text class="tag" x="1642" y="677">Kotlin</text>
    <text class="detail" x="1642" y="725">Full Kotlin syntax; slower cold start.</text>
  </g>
  <text class="note" x="110" y="890">Janino favors throughput, SpEL favors Spring integration, Groovy favors expressive rules and null-safe facts, Kotlin Script favors type-aware scripts despite slower cold start.</text>
</svg>