<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="960" viewBox="0 0 1480 960" role="img" aria-label="Hibernate Lettuce demo class structure">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-gray" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#64748b" stroke-width="1.7" stroke-dasharray="none" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect width="1480" height="960" fill="#ffffff"/>
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">Hibernate Lettuce Demo Class Structure</text>
  <text x="72" y="92" font-size="15" fill="#64748b">The demo exposes product CRUD and L1 cache management around a cached Product entity and the Lettuce Near Cache RegionFactory.</text>

  <g class="group" data-group="HTTP ENTRYPOINTS">
    <rect x="42" y="132" width="390" height="726" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="60" y="158" font-size="14" font-weight="700" fill="#2563eb">HTTP ENTRYPOINTS</text>
    <text x="60" y="179" font-size="12.5" fill="#6b7280">Controllers demonstrate CRUD and cache management APIs.</text>
  </g>

  <g class="group" data-group="DOMAIN AND REPOSITORY">
    <rect x="510" y="132" width="410" height="726" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="528" y="158" font-size="14" font-weight="700" fill="#16a34a">DOMAIN AND REPOSITORY</text>
    <text x="528" y="179" font-size="12.5" fill="#6b7280">Spring Data JPA persists the cached Product entity.</text>
  </g>

  <g class="group" data-group="HIBERNATE CACHE RUNTIME">
    <rect x="1000" y="132" width="410" height="726" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="1018" y="158" font-size="14" font-weight="700" fill="#64748b">HIBERNATE CACHE RUNTIME</text>
    <text x="1018" y="179" font-size="12.5" fill="#6b7280">Runtime services expose the near-cache region map.</text>
  </g>
  <path class="edge" d="M392 472 L548 472" fill="none" stroke="#16a34a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M713 510 L713 590" fill="none" stroke="#7c3aed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="707,578 713,590 719,578" fill="#7c3aed" stroke="#7c3aed" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="edge" d="M 392 728 L 464 728 Q 478 728 478 742 L 478 814 Q 478 828 492 828 L 978 828 Q 992 828 992 814 L 992 449 Q 992 435 1006 435 L 1038 435" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>
  <path class="edge" d="M1203 512 L1203 604" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="1197,592 1203,604 1209,592" fill="#2563eb" stroke="#2563eb" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g class="card" data-card="DemoApplication">
    <rect x="72" y="194" width="320" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="232" y="215" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;SpringBootApplication&gt;&gt;</text>
    <text x="232" y="238" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">DemoApplication</text>
    <line x1="72" y1="249" x2="392" y2="249" stroke="#2563eb" stroke-width="1.1" opacity="0.55"/>
    <line x1="72" y1="285" x2="392" y2="285" stroke="#2563eb" stroke-width="1.1" opacity="0.45"/>
    <text x="88" y="272" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">proxyBeanMethods = false</text>
    <text x="88" y="308" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">runApplication&lt;DemoApplication&gt;()</text>
  </g>

  <g class="card" data-card="ProductController">
    <rect x="72" y="398" width="320" height="166" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <text x="232" y="419" text-anchor="middle" font-size="12.5" fill="#16a34a">&lt;&lt;RestController&gt;&gt;</text>
    <text x="232" y="442" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ProductController</text>
    <line x1="72" y1="453" x2="392" y2="453" stroke="#16a34a" stroke-width="1.1" opacity="0.55"/>
    <line x1="72" y1="507" x2="392" y2="507" stroke="#16a34a" stroke-width="1.1" opacity="0.45"/>
    <text x="88" y="476" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">/api/products</text>
<text x="88" y="494" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">ProductRepository</text>
    <text x="88" y="530" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ getProduct(id)</text>
<text x="88" y="548" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ create/update/delete product</text>
  </g>

  <g class="card" data-card="CacheController">
    <rect x="72" y="646" width="320" height="206" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="232" y="667" text-anchor="middle" font-size="12.5" fill="#ea580c">&lt;&lt;RestController&gt;&gt;</text>
    <text x="232" y="690" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">CacheController</text>
    <line x1="72" y1="701" x2="392" y2="701" stroke="#ea580c" stroke-width="1.1" opacity="0.55"/>
    <line x1="72" y1="755" x2="392" y2="755" stroke="#ea580c" stroke-width="1.1" opacity="0.45"/>
    <text x="88" y="724" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">/api/cache</text>
<text x="88" y="742" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">EntityManagerFactory</text>
    <text x="88" y="778" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ getCacheStats()</text>
<text x="88" y="796" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ evictRegion(region)</text>
<text x="88" y="814" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ evictAll()</text>
  </g>

  <g class="card" data-card="ProductRepository">
    <rect x="548" y="358" width="330" height="152" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="713" y="379" text-anchor="middle" font-size="12.5" fill="#0f766e">&lt;&lt;JpaRepository&gt;&gt;</text>
    <text x="713" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ProductRepository</text>
    <line x1="548" y1="413" x2="878" y2="413" stroke="#0f766e" stroke-width="1.1" opacity="0.55"/>
    <line x1="548" y1="449" x2="878" y2="449" stroke="#0f766e" stroke-width="1.1" opacity="0.45"/>
    <text x="564" y="436" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">JpaRepository&lt;Product, Long&gt;</text>
    <text x="564" y="472" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ findByName(name)</text>
<text x="564" y="490" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">QueryHint cache.retrieveMode=USE</text>
  </g>

  <g class="card" data-card="Product">
    <rect x="548" y="590" width="330" height="178" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="713" y="611" text-anchor="middle" font-size="12.5" fill="#7c3aed">&lt;&lt;Entity&gt;&gt;</text>
    <text x="713" y="634" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Product</text>
    <line x1="548" y1="645" x2="878" y2="645" stroke="#7c3aed" stroke-width="1.1" opacity="0.55"/>
    <line x1="548" y1="717" x2="878" y2="717" stroke="#7c3aed" stroke-width="1.1" opacity="0.45"/>
    <text x="564" y="668" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">@Cacheable</text>
<text x="564" y="686" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">@Cache(region = product)</text>
<text x="564" y="704" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">id, name, description, price</text>
    <text x="564" y="740" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">NONSTRICT_READ_WRITE 2LC region</text>
  </g>

  <g class="card" data-card="EntityManagerFactory">
    <rect x="1038" y="358" width="330" height="154" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="1203" y="379" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;JPA runtime&gt;&gt;</text>
    <text x="1203" y="402" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">EntityManagerFactory</text>
    <line x1="1038" y1="413" x2="1368" y2="413" stroke="#2563eb" stroke-width="1.1" opacity="0.55"/>
    <line x1="1038" y1="449" x2="1368" y2="449" stroke="#2563eb" stroke-width="1.1" opacity="0.45"/>
    <text x="1054" y="436" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">unwrapped to SessionFactoryImplementor</text>
    <text x="1054" y="472" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">serviceRegistry.getService(RegionFactory)</text>
  </g>

  <g class="card" data-card="LettuceNearCache RegionFactory">
    <rect x="1038" y="604" width="390" height="164" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <image data-bluetape4k-icon="redis/redis-icon.svg" x="1054" y="675" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="1233" y="625" text-anchor="middle" font-size="12.5" fill="#16a34a">&lt;&lt;Hibernate RegionFactory&gt;&gt;</text>
    <text x="1233" y="648" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCache</text>
<text x="1233" y="668" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RegionFactory</text>
    <line x1="1038" y1="680" x2="1428" y2="680" stroke="#16a34a" stroke-width="1.1" opacity="0.55"/>
    <line x1="1038" y1="734" x2="1428" y2="734" stroke="#16a34a" stroke-width="1.1" opacity="0.45"/>
    <text x="1110" y="703" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">getCaches(): Map&lt;String, cache&gt;</text>
<text x="1110" y="721" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">L1 Caffeine + L2 Redis</text>
    <text x="1054" y="757" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">CacheController clears local cache only</text>
  </g>
  <g class="legend" transform="translate(72 914)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#16a34a" stroke-width="2.6" marker-end="url(#arrow-green)"/><text x="56" y="5" font-size="13" fill="#475569">controller calls repository</text>
    <line x1="300" y1="0" x2="340" y2="0" stroke="#7c3aed" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><text x="356" y="5" font-size="13" fill="#475569">repository manages entity</text>
    <line x1="610" y1="0" x2="650" y2="0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)"/><text x="666" y="5" font-size="13" fill="#475569">cache API unwraps EMF</text>
    <line x1="884" y1="0" x2="924" y2="0" stroke="#2563eb" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/><text x="940" y="5" font-size="13" fill="#475569">EMF exposes RegionFactory</text>
  </g>
</svg>