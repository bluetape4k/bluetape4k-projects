<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="990" viewBox="0 0 1640 990" role="img" aria-label="Fastjson2 Class Structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="tri-blue" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6 L 1 11 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0F172A; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #475569; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .panelTitle { font-family: "Comic Mono"; font-size: 18px; fill: #334155; }
      .card { stroke-width: 1.8; filter: url(#softShadow); }
      .className { font-family: "Architects Daughter"; font-size: 24px; fill: #0F172A; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .member { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .divider { stroke: #CBD5E1; stroke-width: 1; }
      .impl { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#tri-blue); }
      .useGreen { fill: none; stroke: #16A34A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#open-green); }
      .flowOrange { fill: none; stroke: #EA580C; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-orange); }
    </style>
  </defs>

  <rect class="canvas" width="1640" height="990"/>
  <rect class="frame" x="34" y="30" width="1572" height="928" rx="8"/>

  <text class="title" x="72" y="82">Fastjson2 Class Structure</text>
  <text class="subtitle" x="76" y="114">JSONB byte serialization, JSON string serialization, and type-safe extension surfaces.</text>

  <g>
    <rect class="panel" x="70" y="150" width="1500" height="320" rx="8"/>
    <text class="panelTitle" x="96" y="182">Serializer implementation and Fastjson2 backends</text>
  </g>
  <g>
    <rect class="panel" x="70" y="530" width="1500" height="330" rx="8"/>
    <text class="panelTitle" x="96" y="562">Kotlin extension surfaces</text>
  </g>

  <g id="json-serializer">
    <rect class="card" x="110" y="235" width="360" height="120" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="stereo" x="290" y="264" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="className" x="290" y="292" text-anchor="middle">JsonSerializer</text>
    <line class="divider" x1="135" y1="308" x2="445" y2="308"/>
    <text class="member" x="145" y="332">serialize(), deserialize()</text>
  </g>
  <g id="fastjson-serializer">
    <rect class="card" x="585" y="215" width="470" height="160" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="className" x="820" y="248" text-anchor="middle">FastjsonSerializer</text>
    <text class="stereo" x="820" y="272" text-anchor="middle">Default singleton + stateless calls</text>
    <line class="divider" x1="610" y1="288" x2="1030" y2="288"/>
    <text class="member" x="620" y="312">ByteArray API uses JSONB.toBytes / parseObject</text>
    <text class="member" x="620" y="333">String API uses JSON.toJSONString / parseObject</text>
    <text class="member" x="620" y="354">failures throw JsonSerializationException</text>
  </g>
  <g id="failure-policy">
    <rect class="card" x="1150" y="235" width="360" height="120" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
    <text class="className" x="1330" y="270" text-anchor="middle">Failure policy</text>
    <text class="member" x="1175" y="300">null serialize =&gt; empty bytes/string</text>
    <text class="member" x="1175" y="321">null deserialize input =&gt; null</text>
    <text class="member" x="1175" y="342">invalid payload =&gt; exception</text>
  </g>

  <path class="impl" d="M 585 295 L 470 295" style="marker-end:none"/>
<polygon points="482,289 470,295 482,301" fill="#ffffff" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="useGreen" d="M 1055 295 L 1150 295" style="marker-end:none"/>
<polyline points="1138,301 1150,295 1138,289" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="jsonb-backend">
    <rect class="card" x="585" y="405" width="220" height="48" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="member" x="695" y="435" text-anchor="middle">JSONB binary backend</text>
  </g>
  <g id="json-backend">
    <rect class="card" x="835" y="405" width="220" height="48" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="member" x="945" y="435" text-anchor="middle">JSON text backend</text>
  </g>
  <path class="flowOrange" d="M 720 375 L 720 405"/>
  <path class="useGreen" d="M 920 375 L 920 405" style="marker-end:none"/>
<polyline points="914,393 920,405 926,393" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="json-ext">
    <rect class="card" x="115" y="625" width="340" height="145" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="className" x="285" y="660" text-anchor="middle">JSONExtensions</text>
    <line class="divider" x1="140" y1="677" x2="430" y2="677"/>
    <text class="member" x="150" y="702">Any?.toJsonString()</text>
    <text class="member" x="150" y="723">String?.readValueOrNull()</text>
    <text class="member" x="150" y="744">InputStream.readValueAsList()</text>
  </g>
  <g id="jsonb-ext">
    <rect class="card" x="505" y="625" width="340" height="145" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="className" x="675" y="660" text-anchor="middle">JSONBExtensions</text>
    <line class="divider" x1="530" y1="677" x2="820" y2="677"/>
    <text class="member" x="540" y="702">Any?.toJsonBytes()</text>
    <text class="member" x="540" y="723">ByteArray?.readBytesOrNull()</text>
    <text class="member" x="540" y="744">InputStream?.readBytesOrNull()</text>
  </g>
  <g id="object-ext">
    <rect class="card" x="895" y="625" width="300" height="145" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="className" x="1045" y="660" text-anchor="middle">JSONObjectExtensions</text>
    <line class="divider" x1="920" y1="677" x2="1170" y2="677"/>
    <text class="member" x="930" y="702">obj.readValueOrNull&lt;T&gt;()</text>
    <text class="member" x="930" y="723">obj.readValueOrNull(key)</text>
  </g>
  <g id="array-ext">
    <rect class="card" x="1245" y="625" width="300" height="145" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
    <text class="className" x="1395" y="660" text-anchor="middle">JSONArrayExtensions</text>
    <line class="divider" x1="1270" y1="677" x2="1520" y2="677"/>
    <text class="member" x="1280" y="702">array.readValueOrNull()</text>
    <text class="member" x="1280" y="723">readList(), readArray()</text>
  </g>

  <path class="useGreen" d="M 945 453 L 945 491 Q 945 505 931 505 L 104 505 Q 90 505 90 519 L 90 696 Q 90 700 94 700 L 115 700" style="marker-end:none"/>
<polyline points="103,706 115,700 103,694" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="flowOrange" d="M 695 453 L 695 625"/>
  <path class="useGreen" d="M 945 453 L 945 566 Q 945 580 959 580 L 1031 580 Q 1045 580 1045 594 L 1045 625" style="marker-end:none"/>
<polyline points="1039,613 1045,625 1051,613" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="useGreen" d="M 945 453 L 945 546 Q 945 560 959 560 L 1381 560 Q 1395 560 1395 574 L 1395 625" style="marker-end:none"/>
<polyline points="1389,613 1395,625 1401,613" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g transform="translate(115, 900)">
    <path class="impl" d="M 0 8 L 34 8" style="marker-end:none"/>
<polygon points="22,14 34,8 22,2" fill="#ffffff" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
    <text class="small" x="48" y="13">implements</text>
    <path class="flowOrange" d="M 190 8 L 224 8"/>
    <text class="small" x="238" y="13">JSONB binary path</text>
    <path class="useGreen" d="M 430 8 L 464 8" style="marker-end:none"/>
<polyline points="452,14 464,8 452,2" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
    <text class="small" x="478" y="13">JSON text/object path</text>
  </g>
</svg>
