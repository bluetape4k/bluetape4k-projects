<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="1220" viewBox="0 0 2180 1220" role="img" aria-label="Hazelcast near-cache read write and invalidation flow">
<defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><marker id="arrow-call" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#1D4ED8" stroke="#1D4ED8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-front" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#15803D" stroke="#15803D" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-back" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#0F766E" stroke="#0F766E" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-event" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#C2410C" stroke="#C2410C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-option" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#6D28D9" stroke="#6D28D9" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-note" markerWidth="22" markerHeight="16" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L20 8 L2 14 Z" fill="#475569" stroke="#475569" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:45px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#475569}.lane{fill:#fff;stroke:#CBD5E1;stroke-width:1.45;stroke-dasharray:12 8}.laneTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.laneText{font-family:"Comic Mono";font-size:12.5px;fill:#475569}.card{stroke-width:1.9;filter:url(#softShadow)}.kicker{font-family:"Comic Mono";font-size:12.5px;fill:#475569}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.body{font-family:"Comic Mono";font-size:12.5px;fill:#334155}.foot{font-family:"Comic Mono";font-size:11.8px;fill:#475569}.divider{stroke-width:1.1;opacity:.42}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:10 8}.edgeLabel rect{fill:#fff;stroke:#CBD5E1;stroke-width:1.15;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12px;fill:#475569}</style></defs>
<rect class="canvas" width="2180" height="1220"/><rect class="frame" x="34" y="30" width="2112" height="1154" rx="8"/>
<text class="title" x="72" y="86">Hazelcast NearCache Runtime Flow</text><text class="subtitle" x="76" y="119">Two ordinary lanes explain the default behavior: reads are read-through, writes are write-through, and remote IMap events invalidate peer front caches.</text>
<rect class="lane" x="65" y="165" width="1915" height="285" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/><text class="laneTitle" x="92" y="198">read-through lane</text><text class="laneText" x="92" y="222">front hit returns immediately; front miss reads IMap and refills the local Caffeine tier</text>
<rect class="lane" x="65" y="520" width="1915" height="285" rx="8" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/><text class="laneTitle" x="92" y="553">write-through and coherence lane</text><text class="laneText" x="92" y="577">writes update local and remote tiers; remote member changes travel back through the EntryListener</text>
<rect class="lane" x="15" y="850" width="2100" height="295" rx="8" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/><text class="laneTitle" x="92" y="883">side variants and lifecycle</text>
<g id="edges"><g><path class="edge " d="M440 320 L555 320" stroke="#1D4ED8" marker-end="url(#arrow-call)"/><g class="edgeLabel" transform="translate(457 278)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">calls</text></g></g>
<g><path class="edge " d="M935 320 L1050 320" stroke="#0F766E" marker-end="url(#arrow-back)"/><g class="edgeLabel" transform="translate(951 278)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">miss</text></g></g>
<g><path class="edge " d="M1430 320 L1545 320" stroke="#15803D" marker-end="url(#arrow-front)"/><g class="edgeLabel" transform="translate(1447 278)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">refill</text></g></g>
<g><path class="edge " d="M440 675 L555 675" stroke="#1D4ED8" marker-end="url(#arrow-call)"/><g class="edgeLabel" transform="translate(457 633)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">writes</text></g></g>
<g><path class="edge " d="M935 675 L1050 675" stroke="#15803D" marker-end="url(#arrow-front)"/><g class="edgeLabel" transform="translate(932 633)"><rect width="120" height="28" rx="8"/><text x="60" y="19" text-anchor="middle">front update</text></g></g>
<g><path class="edge " d="M1430 675 L1545 675" stroke="#C2410C" marker-end="url(#arrow-event)"/><g class="edgeLabel" transform="translate(1428 633)"><rect width="120" height="28" rx="8"/><text x="60" y="19" text-anchor="middle">remote event</text></g></g>
<g><path class="edge dashed" d="M 1740 595 L 1740 489 Q 1740 475 1726 475 L 749 475 Q 735 475 735 461 L 735 400" stroke="#C2410C"/>
<polygon points="741,412 735,400 729,412" fill="#C2410C" stroke="#C2410C" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/><g class="edgeLabel" transform="translate(1142 433)"><rect width="192" height="28" rx="8"/><text x="96" y="19" text-anchor="middle">invalidate peer front</text></g></g>
<g><path class="edge " d="M 275 755 L 275 836 Q 275 850 289 850 L 491 850 Q 505 850 505 864 L 505 910" stroke="#C2410C" marker-end="url(#arrow-event)"/><g class="edgeLabel" transform="translate(346 808)"><rect width="88" height="28" rx="8"/><text x="44" y="19" text-anchor="middle">optional</text></g></g>
<g><path class="edge dashed" d="M 1240 755 L 1240 836 Q 1240 850 1226 850 L 1119 850 Q 1105 850 1105 864 L 1105 910" stroke="#6D28D9"/>
<polygon points="1099,898 1105,910 1111,898" fill="#6D28D9" stroke="#6D28D9" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/><g class="edgeLabel" transform="translate(1129 808)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">factory</text></g></g>
<g><path class="edge " d="M1740 755 L1740 910" stroke="#475569" marker-end="url(#arrow-note)"/><g class="edgeLabel" transform="translate(1744 821)"><rect width="82" height="28" rx="8"/><text x="41" y="19" text-anchor="middle">cleanup</text></g></g></g>
<g id="cards"><g id="readCall"><rect class="card" x="110" y="240" width="330" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="kicker" x="132" y="268">1 read call</text><text class="cardTitle" x="132" y="300">get(key)</text><path class="divider" d="M110 318H440" stroke="#1D4ED8"/><text class="body" x="132" y="346">HazelcastNearCache</text><text class="body" x="132" y="367">or suspend get(key)</text><text class="body" x="132" y="388">key is validated</text></g>
<g id="frontCheck"><rect class="card" x="555" y="240" width="380" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="kicker" x="577" y="268">2 local check</text><text class="cardTitle" x="577" y="300">Caffeine front</text><path class="divider" d="M555 318H935" stroke="#15803D"/><text class="body" x="577" y="346">frontCache.get(key)</text><text class="body" x="577" y="367">hit returns immediately</text><text class="body" x="577" y="388">miss continues to IMap</text></g>
<g id="backRead"><rect class="card" x="1050" y="240" width="380" height="160" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="kicker" x="1072" y="268">3 miss path</text><text class="cardTitle" x="1072" y="300">Hazelcast IMap</text><path class="divider" d="M1050 318H1430" stroke="#0F766E"/><text class="body" x="1072" y="346">get / getAsync</text><text class="body" x="1072" y="367">back hit/miss stats</text><text class="body" x="1072" y="388">source of truth</text></g>
<g id="populate"><rect class="card" x="1545" y="240" width="390" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="kicker" x="1567" y="268">4 refill</text><text class="cardTitle" x="1567" y="300">frontCache.put</text><path class="divider" d="M1545 318H1935" stroke="#15803D"/><text class="body" x="1567" y="346">store remote value locally</text><text class="body" x="1567" y="367">return value to caller</text><text class="body" x="1567" y="388">future reads hit front</text></g>
<g id="writeCall"><rect class="card" x="110" y="595" width="330" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="kicker" x="132" y="623">1 write call</text><text class="cardTitle" x="132" y="655">put/remove</text><path class="divider" d="M110 673H440" stroke="#1D4ED8"/><text class="body" x="132" y="701">put / putAll</text><text class="body" x="132" y="722">remove / replace</text><text class="body" x="132" y="743">clearAll</text></g>
<g id="frontUpdate"><rect class="card" x="555" y="595" width="380" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="kicker" x="577" y="623">2 local update</text><text class="cardTitle" x="577" y="655">front first</text><path class="divider" d="M555 673H935" stroke="#15803D"/><text class="body" x="577" y="701">put/remove local entry</text><text class="body" x="577" y="722">clearLocal affects front only</text><text class="body" x="577" y="743">local member events ignored</text></g>
<g id="backWrite"><rect class="card" x="1050" y="595" width="380" height="160" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="kicker" x="1072" y="623">3 remote write</text><text class="cardTitle" x="1072" y="655">IMap mutation</text><path class="divider" d="M1050 673H1430" stroke="#0F766E"/><text class="body" x="1072" y="701">set / delete</text><text class="body" x="1072" y="722">putAll bulk write</text><text class="body" x="1072" y="743">clearAll clears IMap</text></g>
<g id="listener"><rect class="card" x="1545" y="595" width="390" height="160" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="kicker" x="1567" y="623">4 peer coherence</text><text class="cardTitle" x="1567" y="655">EntryListener</text><path class="divider" d="M1545 673H1935" stroke="#C2410C"/><text class="body" x="1567" y="701">remote update/remove invalidates</text><text class="body" x="1567" y="722">expiry invalidates local key</text><text class="body" x="1567" y="743">ADD is ignored</text></g>
<g id="resilient"><rect class="card" x="270" y="910" width="470" height="175" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="kicker" x="292" y="938">write-behind variant</text><text class="cardTitle" x="292" y="970">Resilient near-cache</text><path class="divider" d="M270 988H740" stroke="#C2410C"/><text class="body" x="292" y="1016">front updates immediately</text><text class="body" x="292" y="1037">queue/channel writes IMap later</text><text class="body" x="292" y="1058">retry + stale-read guards</text></g>
<g id="jcache"><rect class="card" x="870" y="910" width="470" height="175" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><text class="kicker" x="892" y="938">factory caveat</text><text class="cardTitle" x="892" y="970">NearJCache mode</text><path class="divider" d="M870 988H1340" stroke="#6D28D9"/><text class="body" x="892" y="1016">same front/back shape</text><text class="body" x="892" y="1037">listener-free factory path</text><text class="body" x="892" y="1058">no peer propagation guarantee</text></g>
<g id="close"><rect class="card" x="1470" y="910" width="390" height="175" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="kicker" x="1492" y="938">lifecycle</text><text class="cardTitle" x="1492" y="970">close()</text><path class="divider" d="M1470 988H1860" stroke="#475569"/><text class="body" x="1492" y="1016">remove IMap listener</text><text class="body" x="1492" y="1037">close front cache</text><text class="body" x="1492" y="1058">release local resources</text></g></g>
</svg>
