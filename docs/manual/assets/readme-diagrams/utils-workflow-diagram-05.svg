<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900" role="img" aria-label="Parallel Flow Policy">
<defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow-startPolicy" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#2563EB" style="stroke-dasharray:none"/></marker>
<marker id="arrow-all" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#16A34A" style="stroke-dasharray:none"/></marker>
<marker id="arrow-any" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#0D9488" style="stroke-dasharray:none"/></marker>
<marker id="arrow-allReport" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#16A34A" style="stroke-dasharray:none"/></marker>
<marker id="arrow-anyReport" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#0D9488" style="stroke-dasharray:none"/></marker>
<marker id="arrow-timeoutReport" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#EA580C" style="stroke-dasharray:none"/></marker>
<marker id="arrow-startTimeout" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path stroke-dasharray="none" d="M2 2 L16 7 L2 12 Z" fill="#EA580C" style="stroke-dasharray:none"/></marker>
<style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}.card{filter:url(#softShadow);stroke-width:1.9}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13.5px;fill:#475569}.icon{stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 8}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}</style></defs>
<rect class="canvas" width="1680" height="900"/><rect class="frame" x="38" y="30" width="1604" height="834" rx="8"/>
<text class="title" x="78" y="86">Parallel Flow Policy</text>
<text class="subtitle" x="82" y="118">ALL waits with fail-fast semantics; ANY returns the first Success. Timeout and non-success reports still become WorkReport outcomes.</text>
<g id="edges"><path class="edge" d="M840 286 L840 325" stroke="#2563EB" marker-end="url(#arrow-startPolicy)"/>
<path class="edge" d="M 635 387 L 479 387 Q 465 387 465 401 L 465 535" stroke="#16A34A" marker-end="url(#arrow-all)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="edge" d="M 1045 387 L 1201 387 Q 1215 387 1215 401 L 1215 535" stroke="#0D9488" marker-end="url(#arrow-any)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="edge" d="M 465 667 L 465 780 Q 465 794 479 794 L 605 794" stroke="#16A34A" marker-end="url(#arrow-allReport)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="edge" d="M 1215 667 L 1215 780 Q 1215 794 1201 794 L 1075 794" stroke="#0D9488" marker-end="url(#arrow-anyReport)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="edge dashed" d="M 160 433 L 160 806 Q 160 820 174 820 L 605 820" stroke="#EA580C" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="593,826 605,820 593,814" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="edge dashed" d="M 635 228 L 249 228 Q 235 228 235 242 L 235 315" stroke="#EA580C" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="229,303 235,315 241,303" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/></g>
<g id="labels"><g class="edgeLabel" transform="translate(865 294)"><rect width="126" height="30" rx="8"/><text x="63" y="20" text-anchor="middle">shared context</text></g>
<g class="edgeLabel" transform="translate(502 347)"><rect width="56" height="30" rx="8"/><text x="28" y="20" text-anchor="middle">ALL</text></g>
<g class="edgeLabel" transform="translate(1122 347)"><rect width="56" height="30" rx="8"/><text x="28" y="20" text-anchor="middle">ANY</text></g>
<g class="edgeLabel" transform="translate(468 757)"><rect width="132" height="30" rx="8"/><text x="66" y="20" text-anchor="middle">collect reports</text></g>
<g class="edgeLabel" transform="translate(1072 757)"><rect width="148" height="30" rx="8"/><text x="74" y="20" text-anchor="middle">winner or failures</text></g>
<g class="edgeLabel" transform="translate(237 783)"><rect width="96" height="30" rx="8"/><text x="48" y="20" text-anchor="middle">Cancelled</text></g>
<g class="edgeLabel" transform="translate(377 190)"><rect width="86" height="30" rx="8"/><text x="43" y="20" text-anchor="middle">deadline</text></g></g>
<g id="start"><rect class="card" x="635" y="170" width="410" height="116" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <g class="icon" transform="translate(659 194)" stroke="#2563EB"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M24 17 L40 28 L24 39 Z" fill="#2563EB" stroke="none"/></g>
  <text class="cardTitle" x="864" y="210" text-anchor="middle">Parallel flow starts</text>
  <text class="detail" x="840" y="248" text-anchor="middle">shared WorkContext</text>
  <text class="detail" x="840" y="267" text-anchor="middle">same input to every fork</text></g>
<g id="policy"><rect class="card" x="635" y="325" width="410" height="124" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <g class="icon" transform="translate(659 349)" stroke="#9333EA"><path d="M28 7 L51 28 L28 49 L5 28 Z" fill="#fff"/><path d="M18 24 H38 M18 33 H38" fill="none"/></g>
  <text class="cardTitle" x="864" y="365" text-anchor="middle">ParallelPolicy</text>
  <text class="detail" x="840" y="403" text-anchor="middle">ALL waits for all</text>
  <text class="detail" x="840" y="422" text-anchor="middle">ANY races for first Success</text></g>
<g id="all"><rect class="card" x="260" y="535" width="410" height="132" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <g class="icon" transform="translate(284 559)" stroke="#16A34A"><circle cx="12" cy="28" r="7" fill="#fff"/><circle cx="50" cy="16" r="7" fill="#fff"/><circle cx="50" cy="40" r="7" fill="#fff"/><path d="M19 28 H31 C38 28 38 16 43 16 M31 28 C38 28 38 40 43 40" fill="none"/></g>
  <text class="cardTitle" x="489" y="575" text-anchor="middle">ALL policy</text>
  <text class="detail" x="465" y="613" text-anchor="middle">StructuredTaskScope fail-fast</text>
  <text class="detail" x="465" y="632" text-anchor="middle">failure cancels siblings</text></g>
<g id="any"><rect class="card" x="1010" y="535" width="410" height="132" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <g class="icon" transform="translate(1034 559)" stroke="#0D9488"><circle cx="12" cy="28" r="7" fill="#fff"/><circle cx="50" cy="16" r="7" fill="#fff"/><circle cx="50" cy="40" r="7" fill="#fff"/><path d="M19 28 H31 C38 28 38 16 43 16 M31 28 C38 28 38 40 43 40" fill="none"/></g>
  <text class="cardTitle" x="1239" y="575" text-anchor="middle">ANY policy</text>
  <text class="detail" x="1215" y="613" text-anchor="middle">first Success wins</text>
  <text class="detail" x="1215" y="632" text-anchor="middle">non-success keeps racing</text></g>
<g id="timeout"><rect class="card" x="70" y="315" width="330" height="118" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <g class="icon" transform="translate(94 339)" stroke="#EA580C"><circle cx="28" cy="28" r="22" fill="#fff"/><path d="M28 13 V28 L41 36" fill="none"/></g>
  <text class="cardTitle" x="259" y="355" text-anchor="middle">Timeout boundary</text>
  <text class="detail" x="235" y="393" text-anchor="middle">deadline exceeded</text>
  <text class="detail" x="235" y="412" text-anchor="middle">returns Cancelled</text></g>
<g id="report"><rect class="card" x="605" y="735" width="470" height="118" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <g class="icon" transform="translate(629 759)" stroke="#DB2777"><rect x="8" y="10" width="48" height="36" rx="7" fill="#fff"/><path d="M18 24 H44 M18 34 H38" fill="none"/><circle cx="46" cy="35" r="4" fill="#DB2777" stroke="none"/></g>
  <text class="cardTitle" x="864" y="775" text-anchor="middle">WorkReport priority</text>
  <text class="detail" x="840" y="813" text-anchor="middle">Aborted &gt; Cancelled &gt; Failure</text>
  <text class="detail" x="840" y="832" text-anchor="middle">otherwise Success</text></g>
</svg>