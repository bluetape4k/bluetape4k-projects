    <text class="label" x="86" y="385">Lettuce / FastFory / heap encode</text>
    <rect x="470" y="366" width="769.997" height="16" rx="5" class="runA"/><text class="value" x="1228" y="378" text-anchor="end">99.9995%</text>
    <rect x="470" y="390" width="769.997" height="16" rx="5" class="runB"/><text class="value" x="1228" y="402" text-anchor="end">99.9995%</text>
  </g>
  <line class="divider" x1="86" y1="422" x2="1314" y2="422"/>
