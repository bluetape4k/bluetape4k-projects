    <text class="label" x="86" y="460">Lettuce / FastFory / direct encode</text>
    <rect x="470" y="441" width="769.996" height="16" rx="5" class="runA"/><text class="value" x="1228" y="453" text-anchor="end">99.9995%</text>
    <rect x="470" y="465" width="769.996" height="16" rx="5" class="runB"/><text class="value" x="1228" y="477" text-anchor="end">99.9995%</text>
  </g>
  <line class="divider" x1="86" y1="497" x2="1314" y2="497"/>
  <g data-cell-id="redisson-fory-direct-decode" data-run-a="28.57138135573626" data-run-b="28.5713759656381">
    <text class="label" x="86" y="535">Redisson / Fory / direct decode</text>
    <rect x="470" y="516" width="220" height="16" rx="5" class="runA"/><text class="value" x="700" y="528">28.57%</text>
    <rect x="470" y="540" width="220" height="16" rx="5" class="runB"/><text class="value" x="700" y="552">28.57%</text>
  </g>
  <line class="divider" x1="86" y1="572" x2="1314" y2="572"/>
  <g data-cell-id="redisson-fastFory-direct-decode" data-run-a="26.98408168326722" data-run-b="26.98408493235537">
    <text class="label" x="86" y="610">Redisson / FastFory / direct decode</text>
    <rect x="470" y="591" width="207.778" height="16" rx="5" class="runA"/><text class="value" x="687.778" y="603">26.98%</text>
    <rect x="470" y="615" width="207.778" height="16" rx="5" class="runB"/><text class="value" x="687.778" y="627">26.98%</text>
  </g>

  <g>
    <rect class="note" x="54" y="750" width="1292" height="120" rx="14"/>
    <text class="panelTitle" x="86" y="790">Promotion boundary</text>
    <text class="small" x="86" y="824">Only cells accepted in both canonical runs are plotted. Redisson heap decode and encode are rejected.</text>
    <text class="small" x="86" y="850">Composite decode is a non-promotable fallback. Labels are rounded to four decimals; this is not a zero-allocation or zero-copy claim.</text>
  </g>
</svg>
