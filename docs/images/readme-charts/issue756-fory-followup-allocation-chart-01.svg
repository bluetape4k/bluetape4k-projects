<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc" data-manifest-sha="68f81d30c406ab24770127b92c4bef2a11ebfc66169a7ccf648d02d7efd50aae" data-source-file="issue756-fory-followup-allocation-chart-01-source.json">
  <title id="title">Issue 756 Fory allocation reduction in accepted canonical cells</title>
  <desc id="desc">Grouped horizontal bars compare allocation reduction in canonical runs A and B for the six accepted Fory and FastFory codec cells. Higher is better. Rejected encode and heap decode cells and composite fallback cells are intentionally not plotted.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.08"/></filter>
    <style>
      .canvas{fill:#F6F9FD}.frame{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:2}.panel{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:1.8;filter:url(#shadow)}.note{fill:#F7FBFF;stroke:#4F83FF;stroke-width:1.5}
      .title{font-family:"Architects Daughter";font-size:34px;fill:#22304A;font-weight:700}.panelTitle{font-family:"Architects Daughter";font-size:23px;fill:#22304A;font-weight:700}
      .subtitle,.label,.axis,.value,.small,.tiny,.legend{font-family:"Comic Mono";fill:#22304A}.subtitle{font-size:14px;fill:#5B6B83}.label{font-size:14px;font-weight:700}.axis{font-size:11px;fill:#5B6B83}.value{font-size:12px;font-weight:700}.small{font-size:12px}.tiny{font-size:10px;fill:#5B6B83}.legend{font-size:12px}
      .grid{stroke:#E1E9F3;stroke-width:1}.axisLine{stroke:#B7C8DC;stroke-width:1.4}.runA{fill:#8BB8FF;stroke:#4F83FF;stroke-width:1.4}.runB{fill:#75D9C7;stroke:#18A98F;stroke-width:1.4}.divider{stroke:#E1E9F3;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1400" height="920"/>
  <rect class="frame" x="0.5" y="0.5" width="1399" height="919" rx="14"/>
  <text class="title" x="700" y="54" text-anchor="middle">Fory codec handoff: accepted allocation reductions</text>
  <text class="subtitle" x="700" y="80" text-anchor="middle">Issue #756 canonical A/B / exact measured cells only / higher is better</text>
  <g>
    <rect x="1030" y="105" width="18" height="12" rx="4" class="runA"/><text class="legend" x="1056" y="115" dominant-baseline="middle">Canonical A (%)</text>
    <rect x="1190" y="105" width="18" height="12" rx="4" class="runB"/><text class="legend" x="1216" y="115" dominant-baseline="middle">Canonical B (%)</text>
  </g>
  <rect class="panel" x="54" y="138" width="1292" height="584" rx="14"/>
  <text class="panelTitle" x="86" y="180">Allocation reduction versus copied baseline</text>
  <text class="axis" x="865" y="180" text-anchor="middle">Allocation reduction (%)</text>
  <line class="grid" x1="470" y1="202" x2="470" y2="660"/><text class="axis" x="470" y="686" text-anchor="middle">0</text>
  <line class="grid" x1="662.5" y1="202" x2="662.5" y2="660"/><text class="axis" x="662.5" y="686" text-anchor="middle">25</text>
  <line class="grid" x1="855" y1="202" x2="855" y2="660"/><text class="axis" x="855" y="686" text-anchor="middle">50</text>
  <line class="grid" x1="1047.5" y1="202" x2="1047.5" y2="660"/><text class="axis" x="1047.5" y="686" text-anchor="middle">75</text>
  <line class="grid" x1="1240" y1="202" x2="1240" y2="660"/><text class="axis" x="1240" y="686" text-anchor="middle">100</text>
  <line class="axisLine" x1="470" y1="660" x2="1240" y2="660"/>

