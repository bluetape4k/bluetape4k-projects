    <text class="label" x="86" y="235">Lettuce / Fory / heap encode</text>
    <rect x="470" y="216" width="769.996" height="16" rx="5" class="runA"/><text class="value" x="1228" y="228" text-anchor="end">99.9995%</text>
    <rect x="470" y="240" width="769.996" height="16" rx="5" class="runB"/><text class="value" x="1228" y="252" text-anchor="end">99.9995%</text>
  </g>
