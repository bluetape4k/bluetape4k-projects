<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="720" viewBox="0 0 1720 720" role="img" aria-labelledby="title desc">
<title id="title">Redisson Batch Throughput</title>
<desc id="desc">Optimization ladder · ops/s · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1720" height="720"/>
<rect class="frame" x="34" y="34" width="1652" height="652" rx="26"/>
<text class="title" x="70" y="82" >Redisson Batch Throughput</text>
<text class="subtitle" x="72" y="116" >Optimization ladder · ops/s · higher is better</text>
<g>
  <rect class="panel" x="70" y="142" width="1580" height="362" rx="22"/>
  <text class="panelTitle" x="96" y="184" >Measured ranking</text>
  <text class="small" x="1530" y="184" text-anchor="end">0 to 100,000 ops/s</text>
  <line class="grid" x1="560" y1="170" x2="560" y2="420"/>
<text class="tiny" x="560" y="445" text-anchor="middle">0</text>
<line class="grid" x1="767.5" y1="170" x2="767.5" y2="420"/>
<text class="tiny" x="767.5" y="445" text-anchor="middle">25,000</text>
<line class="grid" x1="975" y1="170" x2="975" y2="420"/>
<text class="tiny" x="975" y="445" text-anchor="middle">50,000</text>
<line class="grid" x1="1182.5" y1="170" x2="1182.5" y2="420"/>
<text class="tiny" x="1182.5" y="445" text-anchor="middle">75,000</text>
<line class="grid" x1="1390" y1="170" x2="1390" y2="420"/>
<text class="tiny" x="1390" y="445" text-anchor="middle">100,000</text>
<line class="axis" x1="560" y1="420" x2="1390" y2="420"/>
  <g>
  <text class="label" x="96" y="194" dominant-baseline="middle">baseline</text>

  <g>
  <rect x="560" y="180" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="180" width="97.4171" height="18" rx="6" fill="#F5F7FA" stroke="#8FA1B3" stroke-width="1.5"/>
  <text class="value" x="669.4171" y="190"  dominant-baseline="middle">11,737 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="242" dominant-baseline="middle">warmup</text>

  <g>
  <rect x="560" y="228" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="228" width="133.0075" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="705.0074999999999" y="238"  dominant-baseline="middle">16,025 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="290" dominant-baseline="middle">RBatch pipelining</text>

  <g>
  <rect x="560" y="276" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="276" width="237.13930000000002" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="809.1393" y="286"  dominant-baseline="middle">28,571 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="338" dominant-baseline="middle">megabatch</text>

  <g>
  <rect x="560" y="324" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="324" width="648.4375" height="18" rx="6" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.5"/>
  <text class="value" x="1220.4375" y="334"  dominant-baseline="middle">78,125 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="386" dominant-baseline="middle">StringCodec + KEY_POOL</text>

  <g>
  <rect x="560" y="372" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="372" width="768.5136" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="1340.5136" y="382"  dominant-baseline="middle">92,592 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="528" width="1532" height="58" rx="16"/>
  <text class="small" x="860" y="551" text-anchor="middle" dominant-baseline="middle">Batch size, StringCodec, and pooled keys are the main throughput levers.</text>
  <text class="tiny" x="860" y="570" text-anchor="middle" dominant-baseline="middle">Higher is better. Keep units, benchmark mode, and source table visible with the chart.</text>
</g>
<g>
  <rect class="note" x="94" y="602" width="1532" height="50" rx="16"/>
  <text class="small" x="860" y="620" text-anchor="middle" dominant-baseline="middle">Source: infra/redisson/README.ko.md batch benchmark table</text>
  <text class="tiny" x="860" y="638" text-anchor="middle" dominant-baseline="middle">Chart rule: do not merge unlike units; split axes when order-of-magnitude differences hide the message.</text>
</g>
</svg>
