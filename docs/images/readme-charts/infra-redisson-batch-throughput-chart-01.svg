<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Redisson Batch Optimization Throughput Chart"><style>
.title{font-family:'Architects Daughter';font-size:34px;font-weight:400;fill:#273043}.subtitle,.axis,.legend,.note{font-family:'Comic Mono';fill:#6b7280;font-weight:400}.label{font-family:'Comic Mono';fill:#273043;font-weight:400}.value{font-family:'Comic Mono';fill:#273043;font-weight:400;font-size:15px}.axis{font-size:14px}.legend{font-size:16px}.note{font-size:15px}.label{font-size:15px}
</style><rect width="1280" height="470" fill="#f6f8fb"/><rect x="24" y="24" width="1232" height="422" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/><text class="title" x="56" y="72">Redisson Batch Optimization Throughput</text><text class="subtitle" x="58" y="104" font-size="18">50 coroutines × 100 operations per coroutine; higher is better.</text><text class="label" x="56" y="164">Individual op</text><rect x="330" y="145" width="96.3" height="24" rx="8" fill="#a7c7e7"/><text class="value" x="438.3379125626404" y="163">11,737 ops/sec</text><text class="label" x="56" y="219">Warmup stabilization</text><rect x="330" y="200" width="131.5" height="24" rx="8" fill="#8ecae6"/><text class="value" x="473.53404181786766" y="218">16,025 ops/sec</text><text class="label" x="56" y="274">RBatch pipelining</text><rect x="330" y="255" width="234.5" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="576.5122688785209" y="273">28,571 ops/sec</text><text class="label" x="56" y="329">Mega-batch</text><rect x="330" y="310" width="641.3" height="24" rx="8" fill="#ffd6a5"/><text class="value" x="983.2541040262657" y="328">78,125 ops/sec</text><text class="label" x="56" y="384">StringCodec + KEY_POOL</text><rect x="330" y="365" width="760.0" height="24" rx="8" fill="#9ed6c5"/><text class="value" x="1102" y="383">92,592 ops/sec</text><text class="note" x="56" y="430">One RBatch per coroutine collapses thousands of round trips into one Redis batch per worker.</text></svg>