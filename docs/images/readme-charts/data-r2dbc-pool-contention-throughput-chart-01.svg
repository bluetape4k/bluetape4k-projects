</style><rect width="1280" height="450" fill="#f6f8fb"/><rect x="24" y="24" width="1232" height="402" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/><text class="title" x="56" y="72">R2DBC Pool Contention Throughput</text><text class="subtitle" x="58" y="104" font-size="18">64 contending threads with pool size below concurrency; higher is better.</text><rect x="58" y="118" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="84" y="133">10 ms hold</text><rect x="202" y="118" width="18" height="18" rx="5" fill="#cdb4db"/><text class="legend" x="228" y="133">50 ms hold</text><text class="label" x="56" y="174">maxSize=4</text><rect x="280" y="150" width="188.7" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="480.7074829931973" y="168">365 ops/s</text><rect x="280" y="182" width="40.3" height="24" rx="8" fill="#cdb4db"/><text class="value" x="332.3265306122449" y="200">78 ops/s</text><text class="label" x="56" y="250">maxSize=8</text><rect x="280" y="226" width="379.0" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="670.9659863945578" y="244">733 ops/s</text><rect x="280" y="258" width="80.7" height="24" rx="8" fill="#cdb4db"/><text class="value" x="372.65306122448976" y="276">156 ops/s</text><text class="label" x="56" y="326">maxSize=16</text><rect x="280" y="302" width="760.0" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="1052" y="320">1,470 ops/s</text><rect x="280" y="334" width="160.8" height="24" rx="8" fill="#cdb4db"/><text class="value" x="452.7891156462585" y="352">311 ops/s</text><text class="note" x="56" y="410">Throughput scales with available connection slots until the database or query latency becomes the bottleneck.</text></svg>