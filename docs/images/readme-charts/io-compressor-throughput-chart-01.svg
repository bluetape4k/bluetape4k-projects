<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="720" viewBox="0 0 1720 720" role="img" aria-labelledby="title desc">
<title id="title">Compressor Throughput</title>
<desc id="desc">Same-condition compressor benchmark · ops/s · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1720" height="720"/>
<rect class="frame" x="34" y="34" width="1652" height="652" rx="26"/>
<text class="title" x="70" y="82" >Compressor Throughput</text>
<text class="subtitle" x="72" y="116" >Same-condition compressor benchmark · ops/s · higher is better</text>
<g>
  <rect class="panel" x="70" y="142" width="1580" height="362" rx="22"/>
  <text class="panelTitle" x="96" y="184" >Measured ranking</text>
  <text class="small" x="1530" y="184" text-anchor="end">0 to 8,500 ops/s</text>
  <line class="grid" x1="560" y1="170" x2="560" y2="420"/>
<text class="tiny" x="560" y="445" text-anchor="middle">0</text>
<line class="grid" x1="755.2941176470588" y1="170" x2="755.2941176470588" y2="420"/>
<text class="tiny" x="755.2941176470588" y="445" text-anchor="middle">2,000</text>
<line class="grid" x1="950.5882352941176" y1="170" x2="950.5882352941176" y2="420"/>
<text class="tiny" x="950.5882352941176" y="445" text-anchor="middle">4,000</text>
<line class="grid" x1="1145.8823529411766" y1="170" x2="1145.8823529411766" y2="420"/>
<text class="tiny" x="1145.8823529411766" y="445" text-anchor="middle">6,000</text>
<line class="grid" x1="1341.1764705882351" y1="170" x2="1341.1764705882351" y2="420"/>
<text class="tiny" x="1341.1764705882351" y="445" text-anchor="middle">8,000</text>
<line class="axis" x1="560" y1="420" x2="1390" y2="420"/>
  <g>
  <text class="label" x="96" y="194" dominant-baseline="middle">Snappy</text>

  <g>
  <rect x="560" y="180" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="180" width="788.304705882353" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="1360.3047058823531" y="190"  dominant-baseline="middle">8,073 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="242" dominant-baseline="middle">LZ4</text>

  <g>
  <rect x="560" y="228" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="228" width="660.9729411764706" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="1232.9729411764706" y="238"  dominant-baseline="middle">6,769 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="290" dominant-baseline="middle">Zstd</text>

  <g>
  <rect x="560" y="276" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="276" width="498.29294117647055" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="1070.2929411764705" y="286"  dominant-baseline="middle">5,103 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="338" dominant-baseline="middle">GZip</text>

  <g>
  <rect x="560" y="324" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="324" width="116.68823529411765" height="18" rx="6" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.5"/>
  <text class="value" x="688.6882352941177" y="334"  dominant-baseline="middle">1,195 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="386" dominant-baseline="middle">Deflate</text>

  <g>
  <rect x="560" y="372" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="372" width="105.84941176470589" height="18" rx="6" fill="#FFE7EC" stroke="#D85D74" stroke-width="1.5"/>
  <text class="value" x="677.8494117647059" y="382"  dominant-baseline="middle">1,084 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="528" width="1532" height="58" rx="16"/>
  <text class="small" x="860" y="551" text-anchor="middle" dominant-baseline="middle">Snappy and LZ4 are the throughput-oriented choices; Zstd/GZip/Deflate are shown as slower compression tradeoffs.</text>
  <text class="tiny" x="860" y="570" text-anchor="middle" dominant-baseline="middle">Higher is better. Keep units, benchmark mode, and source table visible with the chart.</text>
</g>
<g>
  <rect class="note" x="94" y="602" width="1532" height="50" rx="16"/>
  <text class="small" x="860" y="620" text-anchor="middle" dominant-baseline="middle">Source: io/io/README.ko.md compressor benchmark summary</text>
  <text class="tiny" x="860" y="638" text-anchor="middle" dominant-baseline="middle">Unit/direction: higher is better; source table and interpretation caveat stay visible.</text>
</g>
</svg>
