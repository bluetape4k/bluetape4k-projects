<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820" role="img" aria-labelledby="title desc">
<title id="title">FastFory Uplift Over Fory</title>
<desc id="desc">Small payload codec benchmark · ops/ms · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.08"/></filter>
  <style>
    .canvas{fill:#F6F9FD}
    .frame{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:1.8;filter:url(#shadow)}
    .result{fill:#F2FFFB;stroke:#18BFA7;stroke-width:1.8}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#22304A;font-weight:700}
    .panelTitle{font-family:"Architects Daughter";font-size:23px;fill:#22304A;font-weight:700}
    .subtitle,.label,.axis,.value,.small,.tiny{font-family:"Comic Mono";fill:#22304A}
    .subtitle{font-size:14px;fill:#5B6B83}
    .label{font-size:12px}
    .axis{font-size:11px;fill:#5B6B83}
    .value{font-size:11px;font-weight:700}
    .small{font-size:12px}
    .tiny{font-size:10px;fill:#5B6B83}
    .grid{stroke:#E1E9F3;stroke-width:1}
    .axisLine{stroke:#B7C8DC;stroke-width:1.4}
    .scopePill{fill:#F6FAFF;stroke:#4F83FF;stroke-width:1.5}
    .legendText{font-family:"Comic Mono";font-size:12px;fill:#22304A}
  </style>
</defs>
<rect class="canvas" width="1360" height="820"/>
<rect class="frame" x="0.5" y="0.5" width="1359" height="819" rx="14"/>
<text class="title" x="680" y="54" text-anchor="middle">FastFory Uplift Over Fory</text>
<text class="subtitle" x="680" y="76" text-anchor="middle">Small payload codec benchmark · ops/ms · higher is better</text>
<g>
  <rect x="300" y="88" width="760" height="30" rx="15" fill="#F7FBFF" stroke="#4F83FF" stroke-width="1.4"/>
  <text class="tiny" x="680" y="104" text-anchor="middle" dominant-baseline="middle">Scope: Redisson and Lettuce encode/decode throughput, measured table summarized for README use</text>
</g>
<g><rect x="1040" y="123" width="18" height="12" rx="4" fill="#B8E0D2" stroke="#35A878" stroke-width="1.4"/>
<text class="legendText" x="1066" y="133" dominant-baseline="middle">Fory</text>
<rect x="1132" y="123" width="18" height="12" rx="4" fill="#FFB3C7" stroke="#E15B7B" stroke-width="1.4"/>
<text class="legendText" x="1158" y="133" dominant-baseline="middle">FastFory</text></g>
<g>
  <rect class="panel" x="56" y="150" width="1248" height="430" rx="14"/>
  <text class="panelTitle" x="88" y="193" >Codec uplift by Redis client</text>
  <text class="axis" x="1184" y="187" text-anchor="middle">0 to 3,600 ops/ms</text>
  <line class="grid" x1="346" y1="226" x2="346" y2="520"/>
<text class="axis" x="346" y="548" text-anchor="middle">0</text>
<line class="grid" x1="559.8888888888889" y1="226" x2="559.8888888888889" y2="520"/>
<text class="axis" x="559.8888888888889" y="548" text-anchor="middle">1000</text>
<line class="grid" x1="773.7777777777778" y1="226" x2="773.7777777777778" y2="520"/>
<text class="axis" x="773.7777777777778" y="548" text-anchor="middle">2000</text>
<line class="grid" x1="987.6666666666667" y1="226" x2="987.6666666666667" y2="520"/>
<text class="axis" x="987.6666666666667" y="548" text-anchor="middle">3000</text>
<line class="axisLine" x1="346" y1="520" x2="1116" y2="520"/>
  <g>
  <text class="label" x="88" y="256" >Redisson Fory</text>
  <rect x="346" y="244" width="543.0638888888889" height="16" rx="5" fill="#BBD8FF" stroke="#6EA6FF" stroke-width="1.4"/>
  <text class="value" x="899.0638888888889" y="257" >2,539 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="327" >Redisson FastFory</text>
  <rect x="346" y="315" width="686.1555555555556" height="16" rx="5" fill="#FFB3C7" stroke="#E15B7B" stroke-width="1.4"/>
  <text class="value" x="1042.1555555555556" y="328" >3,208 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="398" >Lettuce Fory</text>
  <rect x="346" y="386" width="555.2555555555556" height="16" rx="5" fill="#B8E0D2" stroke="#35A878" stroke-width="1.4"/>
  <text class="value" x="911.2555555555556" y="399" >2,596 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="469" >Lettuce FastFory</text>
  <rect x="346" y="457" width="705.8333333333333" height="16" rx="5" fill="#FFD166" stroke="#D6A441" stroke-width="1.4"/>
  <text class="value" x="1061.8333333333333" y="470" >3,300 ops/ms</text>
</g>
  <text class="axis" x="1158" y="548" >ops/ms</text>
</g>
<g>
  <rect class="result" x="56" y="612" width="1248" height="122" rx="14"/>
  <text class="panelTitle" x="84" y="650" >Interpretation boundary</text>
  <g>
  <rect x="360" y="628" width="210" height="32" rx="16" fill="#FFFFFF" stroke="#E15B7B" stroke-width="1.4"/>
  <text class="tiny" x="465" y="645" text-anchor="middle" dominant-baseline="middle">Redisson +26.35%</text>
</g>
  <g>
  <rect x="594" y="628" width="196" height="32" rx="16" fill="#FFFFFF" stroke="#E15B7B" stroke-width="1.4"/>
  <text class="tiny" x="692" y="645" text-anchor="middle" dominant-baseline="middle">Lettuce +27.08%</text>
</g>
  <text class="small" x="84" y="686" >Higher is better. Keep benchmark raw data, JVM flags, payload shape, and issue provenance visible near this chart.</text>
</g>
</svg>