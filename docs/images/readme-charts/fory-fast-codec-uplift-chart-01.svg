<text class="title" x="56" y="72">FastFory Uplift Over Fory</text><text class="subtitle" x="58" y="104" font-size="18">Small payload codec benchmark summary</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#b8e0d2"/><text class="legend" x="82" y="131">Fory</text><rect x="146" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="172" y="131">FastFory</text><text class="label" x="56" y="173">Redisson</text><rect x="285" y="142" width="546.1197461898499" height="18" rx="7" fill="#b8e0d2"/><text class="value" x="841.1197461898499" y="157" font-size="16">2,539 ops/ms</text><rect x="285" y="166" width="690.1214221537185" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="985.1214221537185" y="181" font-size="16">3,208 ops/ms</text><text class="label" x="56" y="247">Lettuce</text><rect x="285" y="216" width="558.4357186255148" height="18" rx="7" fill="#b8e0d2"/><text class="value" x="853.4357186255148" y="231" font-size="16">2,596 ops/ms</text><rect x="285" y="240" width="709.8214285714286" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="1004.8214285714286" y="255" font-size="16">3,300 ops/ms</text><text class="note" x="56" y="400">Higher is better. FastFory improves throughput by about 26-27% in this run.</text></svg>
