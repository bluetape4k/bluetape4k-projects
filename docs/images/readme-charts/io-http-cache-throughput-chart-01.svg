<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="840" viewBox="0 0 1800 840" role="img" aria-labelledby="title desc">
<title id="title">HTTP Client Cache Throughput</title>
<desc id="desc">Cached paths and no-cache baselines use separate scales · ops/s · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1800" height="840"/>
<rect class="frame" x="34" y="34" width="1732" height="772" rx="26"/>
<text class="title" x="70" y="82" >HTTP Client Cache Throughput</text>
<text class="subtitle" x="72" y="116" >Cached paths and no-cache baselines use separate scales · ops/s · higher is better</text>
<g>
  <rect class="panel" x="70" y="150" width="810" height="470" rx="22"/>
  <text class="panelTitle" x="98" y="192" >Cached paths</text>
  <text class="small" x="852" y="192" text-anchor="end">0 to 850,000 ops/s</text>
  <line class="grid" x1="370" y1="242" x2="370" y2="460"/>
<text class="tiny" x="370" y="485" text-anchor="middle">0</text>
<line class="grid" x1="499.4117647058823" y1="242" x2="499.4117647058823" y2="460"/>
<text class="tiny" x="499.4117647058823" y="485" text-anchor="middle">250,000</text>
<line class="grid" x1="628.8235294117646" y1="242" x2="628.8235294117646" y2="460"/>
<text class="tiny" x="628.8235294117646" y="485" text-anchor="middle">500,000</text>
<line class="grid" x1="758.2352941176471" y1="242" x2="758.2352941176471" y2="460"/>
<text class="tiny" x="758.2352941176471" y="485" text-anchor="middle">750,000</text>
<line class="axis" x1="370" y1="460" x2="810" y2="460"/>
  <g>
  <text class="label" x="100" y="267" dominant-baseline="middle">HC5 + InMemoryCache</text>
  <text class="small" x="102" y="290" >x1233</text>
  <g>
  <rect x="370" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="255" width="421.31604705882353" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="803.3160470588235" y="265"  dominant-baseline="middle">813,906 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="100" y="372" dominant-baseline="middle">OkHttp + DiskLruCache</text>
  <text class="small" x="102" y="395" >x53</text>
  <g>
  <rect x="370" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="360" width="18.303482352941177" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="400.30348235294116" y="370"  dominant-baseline="middle">35,359 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="panel" x="920" y="150" width="810" height="470" rx="22"/>
  <text class="panelTitle" x="948" y="192" >No-cache baselines</text>
  <text class="small" x="1702" y="192" text-anchor="end">0 to 720 ops/s</text>
  <line class="grid" x1="1220" y1="242" x2="1220" y2="565"/>
<text class="tiny" x="1220" y="590" text-anchor="middle">0</text>
<line class="grid" x1="1366.6666666666667" y1="242" x2="1366.6666666666667" y2="565"/>
<text class="tiny" x="1366.6666666666667" y="590" text-anchor="middle">240</text>
<line class="grid" x1="1513.3333333333333" y1="242" x2="1513.3333333333333" y2="565"/>
<text class="tiny" x="1513.3333333333333" y="590" text-anchor="middle">480</text>
<line class="grid" x1="1660" y1="242" x2="1660" y2="565"/>
<text class="tiny" x="1660" y="590" text-anchor="middle">720</text>
<line class="axis" x1="1220" y1="565" x2="1660" y2="565"/>
  <g>
  <text class="label" x="950" y="267" dominant-baseline="middle">HC5 Classic</text>
  <text class="small" x="952" y="290" >x1</text>
  <g>
  <rect x="1220" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="255" width="416.77777777777777" height="18" rx="6" fill="#F5F7FA" stroke="#8FA1B3" stroke-width="1.5"/>
  <text class="value" x="1648.7777777777778" y="265"  dominant-baseline="middle">682 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="950" y="372" dominant-baseline="middle">HC5 VirtualThread</text>

  <g>
  <rect x="1220" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="360" width="408.22222222222223" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="1640.2222222222222" y="370"  dominant-baseline="middle">668 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="950" y="477" dominant-baseline="middle">OkHttp3</text>

  <g>
  <rect x="1220" y="465" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="465" width="403.9444444444444" height="18" rx="6" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.5"/>
  <text class="value" x="1635.9444444444443" y="475"  dominant-baseline="middle">661 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="648" width="1612" height="58" rx="16"/>
  <text class="small" x="900" y="671" text-anchor="middle" dominant-baseline="middle">In-memory cache throughput is orders of magnitude above uncached HTTP clients, so no-cache baselines need their own panel.</text>
  <text class="tiny" x="900" y="690" text-anchor="middle" dominant-baseline="middle">Split panels are intentional: one chart would compress slower paths into unreadable slivers.</text>
</g>
<g>
  <rect class="note" x="94" y="722" width="1612" height="50" rx="16"/>
  <text class="small" x="900" y="740" text-anchor="middle" dominant-baseline="middle">Source: io/http/README.ko.md HTTP client cache benchmark table</text>
  <text class="tiny" x="900" y="758" text-anchor="middle" dominant-baseline="middle">Chart rule: split scales when hot paths and remote paths differ by orders of magnitude.</text>
</g>
</svg>
