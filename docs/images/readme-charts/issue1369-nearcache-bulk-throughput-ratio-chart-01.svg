<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc" data-manifest-sha="5885fc483326647602f637ecc45de0d3a28e712bdbb6e7505039a5717854dbb4" data-source-file="issue1369-nearcache-bulk-chart-source.json" data-semantic-ledger="issue1369-nearcache-bulk-chart.semantic.json">
  <title id="title">Issue #1369 NearJCache bounded bulk throughput ratio</title>
  <desc id="desc">The conservative path minimum and contention ratio range remain above the 0.95 candidate throughput gate. Higher ratio is better.</desc>
  <defs>
    <style>
      .canvas{fill:#F6F9FD}.frame{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:2}.panel{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:1.8}.note{fill:#F7FBFF;stroke:#4F83FF;stroke-width:1.5}
      .title{font-family:"goorm Sans","Apple SD Gothic Neo",sans-serif;font-size:36px;fill:#22304A;font-weight:700}.subtitle{font-family:"goorm Sans","Apple SD Gothic Neo",sans-serif;font-size:16px;fill:#5B6B83}.panelTitle{font-family:"goorm Sans","Apple SD Gothic Neo",sans-serif;font-size:24px;fill:#22304A;font-weight:700}
      .label,.axis,.value,.small,.tiny,.legend{font-family:"goorm Sans Code","Apple SD Gothic Neo",monospace;fill:#22304A}.label{font-size:15px;font-weight:700}.axis{font-size:12px;fill:#5B6B83}.value{font-size:13px;font-weight:700}.small{font-size:14px}.tiny{font-size:12px;fill:#5B6B83}.legend{font-size:13px}
      .grid{stroke:#E1E9F3;stroke-width:1}.axisLine{stroke:#B7C8DC;stroke-width:1.5}.pathBar{fill:#8BB8FF;stroke:#4F83FF;stroke-width:1.4}.range{stroke:#18A98F;stroke-width:12;stroke-linecap:round}.rangePoint{fill:#FFFFFF;stroke:#18A98F;stroke-width:3}.median{fill:#18A98F;stroke:#FFFFFF;stroke-width:3}.gate{stroke:#D95C5C;stroke-width:2;stroke-dasharray:7 6}.divider{stroke:#E1E9F3;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1600" height="1080"/>
  <rect class="frame" x="1" y="1" width="1598" height="1078" rx="16"/>
  <text class="title" x="800" y="58" text-anchor="middle">#1369 NearJCache bounded bulk 처리량 비율</text>
  <text class="subtitle" x="800" y="88" text-anchor="middle">candidate / baseline · path는 batchSize 1·4·128 중 최솟값 · contention은 thread 1·2·4·8·16 범위</text>

  <g transform="translate(1080 112)">
    <rect x="0" y="0" width="20" height="14" rx="4" class="pathBar"/><text class="legend" x="30" y="12">path 최솟값</text>
    <line x1="150" y1="7" x2="190" y2="7" class="range"/><circle cx="170" cy="7" r="6" class="median"/><text class="legend" x="204" y="12">contention 범위 / 중앙값</text>
    <line x1="430" y1="0" x2="430" y2="14" class="gate"/><text class="legend" x="442" y="12">0.95 gate</text>
  </g>

  <rect class="panel" x="64" y="142" width="1472" height="720" rx="14"/>
  <text class="panelTitle" x="98" y="184">Throughput ratio (higher is better)</text>
  <text class="axis" x="950" y="184" text-anchor="middle">candidate / baseline (ratio)</text>

