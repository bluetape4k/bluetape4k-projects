  </g>

  <line class="divider" x1="98" y1="620" x2="1502" y2="620"/>
  <text class="tiny" x="98" y="650">CONTENTION / 정책별 thread 1·2·4·8·16 범위</text>
  <g data-series="contention" data-policy="BYPASS_FRONT" data-min="1.2915508577020685" data-max="1.774692209490313" data-median="1.4308418180803206">
    <text class="label" x="98" y="698">BYPASS_FRONT</text><line class="range" x1="854" y1="688" x2="1410" y2="688"/><circle class="rangePoint" cx="854" cy="688" r="8"/><circle class="rangePoint" cx="1410" cy="688" r="8"/><circle class="median" cx="1014" cy="688" r="9"/><text class="value" x="1490" y="670" text-anchor="end">1.292–1.775 (중앙 1.431)</text>
  </g>
  <g data-series="contention" data-policy="POPULATE_IF_AT_MOST" data-min="1.035547971320155" data-max="1.1035495312284316" data-median="1.0606325118587252">
    <text class="label" x="98" y="753">POPULATE_IF_AT_MOST</text><line class="range" x1="559" y1="743" x2="637" y2="743"/><circle class="rangePoint" cx="559" cy="743" r="8"/><circle class="rangePoint" cx="637" cy="743" r="8"/><circle class="median" cx="587" cy="743" r="9"/><text class="value" x="655" y="748">1.036–1.104 (중앙 1.061)</text>
  </g>

  <rect class="note" x="64" y="894" width="1472" height="124" rx="14"/>
  <text class="panelTitle" x="98" y="934">읽는 법</text>
  <text class="small" x="98" y="966">모든 path 행과 contention 정책이 0.95 throughput gate를 통과했다. 차트는 비교 scan용이며 정확한 수치는 report 표와 raw comparison JSON을 기준으로 한다.</text>
  <text class="small" x="98" y="994">Path 막대는 세 batchSize 중 최솟값이고, contention 선은 thread별 최솟값–최댓값과 중앙값을 나타낸다. 단일 로컬 Apple M4 Pro 측정이다.</text>
