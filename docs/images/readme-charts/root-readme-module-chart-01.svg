  <text class="axis" x="100" y="719" dominant-baseline="middle">Virtual threads</text>
  <rect class="track" x="430" y="703" width="870" height="32" rx="10"/>
  <rect class="bar" x="430" y="703" width="163" height="32" rx="10" fill="#E8F3FF" stroke="#75A9E8"/>
  <text class="label" x="613" y="720" dominant-baseline="middle">3</text>
