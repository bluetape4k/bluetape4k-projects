<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" role="img" aria-labelledby="title desc">
<title id="title">Bluetape4k Module Composition Chart</title>
<desc id="desc">Source-backed module composition chart generated from current Gradle module directories.</desc>
<style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .title { fill: #0f172a; font-size: 32px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #475569; font-size: 17px; font-weight: 500; }
    .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    .layerTitle { fill: #334155; font-size: 14px; font-weight: 800; letter-spacing: .2px; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
    .card { stroke-width: 1.7; filter: url(#cardShadow); }
    .cardTitle { fill: #0f172a; font-size: 16px; font-weight: 800; }
    .cardDetail { fill: #475569; font-size: 12px; font-weight: 600; }
    .iconBadge { stroke-width: 1.5; }
    .iconStroke { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .iconFill { fill: #ffffff; }
    .route { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .routeLabel { fill: #1e293b; font-size: 11px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#cardShadow); }
    .legendText { fill: #334155; font-size: 12px; font-weight: 700; }
    .footer, .chartFoot { fill: #64748b; font-size: 13px; font-weight: 600; }
    .chartTitle { fill: #352617; font-size: 34px; font-weight: 700; }
    .chartSub { fill: #6f5b3c; font-size: 18px; }
    .chartLabel { fill: #3d3528; font-size: 16px; font-weight: 700; }
    .chartValue { fill: #3d3528; font-size: 15px; font-weight: 700; }
    .chartTick { fill: #7a6a52; font-size: 12px; }
  </style>
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="4" orient="auto" viewBox="0 0 12 8" markerUnits="userSpaceOnUse" data-role="primary" data-tip-direction="positive-x">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569" stroke-dasharray="none"/>
    </marker>
  </defs>
<rect width="1500" height="940" fill="#fffaf0"/>
<rect x="52" y="50" width="1396" height="840" rx="18" fill="#fffdf8" stroke="#d9b97c" stroke-width="2"/>
<text class="chartTitle" x="88" y="100">Module Composition Chart</text>
<text class="chartSub" x="88" y="132">88 Gradle modules grouped by repository responsibility</text>
<line x1="400" y1="160" x2="400" y2="830" stroke="#dcc6a0" stroke-width="1"/>
<line x1="400" y1="830" x2="1330" y2="830" stroke="#dcc6a0" stroke-width="1"/>
<line x1="400" y1="826" x2="400" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="400" y="858" text-anchor="middle">0</text>
<line x1="528.5714285714286" y1="826" x2="528.5714285714286" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="528.5714285714286" y="858" text-anchor="middle">5</text>
<line x1="657.1428571428571" y1="826" x2="657.1428571428571" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="657.1428571428571" y="858" text-anchor="middle">10</text>
<line x1="785.7142857142857" y1="826" x2="785.7142857142857" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="785.7142857142857" y="858" text-anchor="middle">15</text>
<line x1="914.2857142857142" y1="826" x2="914.2857142857142" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="914.2857142857142" y="858" text-anchor="middle">20</text>
<line x1="1042.857142857143" y1="826" x2="1042.857142857143" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="1042.857142857143" y="858" text-anchor="middle">25</text>
<line x1="1171.4285714285713" y1="826" x2="1171.4285714285713" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="1171.4285714285713" y="858" text-anchor="middle">30</text>
<line x1="1300" y1="826" x2="1300" y2="836" stroke="#9f8b68"/>
<text class="chartTick" x="1300" y="858" text-anchor="middle">35</text>
<text class="chartLabel" x="370" y="190" text-anchor="end">Foundation</text>
<rect x="400" y="170" width="128.6" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="544.5714285714286" y="193">5</text>
<text class="chartLabel" x="370" y="250" text-anchor="end">I/O and Codecs</text>
<rect x="400" y="230" width="411.4" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="827.4285714285713" y="253">16</text>
<text class="chartLabel" x="370" y="310" text-anchor="end">Data Access</text>
<rect x="400" y="290" width="154.3" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="570.2857142857142" y="313">6</text>
<text class="chartLabel" x="370" y="370" text-anchor="end">Infrastructure</text>
<rect x="400" y="350" width="334.3" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="750.2857142857142" y="373">13</text>
<text class="chartLabel" x="370" y="430" text-anchor="end">Caching</text>
<rect x="400" y="410" width="128.6" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="544.5714285714286" y="433">5</text>
<text class="chartLabel" x="370" y="490" text-anchor="end">Ktor Stack</text>
<rect x="400" y="470" width="128.6" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="544.5714285714286" y="493">5</text>
<text class="chartLabel" x="370" y="550" text-anchor="end">Spring Boot 4</text>
<rect x="400" y="530" width="205.7" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="621.7142857142857" y="553">8</text>
<text class="chartLabel" x="370" y="610" text-anchor="end">Testing</text>
<rect x="400" y="590" width="128.6" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="544.5714285714286" y="613">5</text>
<text class="chartLabel" x="370" y="670" text-anchor="end">Utilities</text>
<rect x="400" y="650" width="334.3" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="750.2857142857142" y="673">13</text>
<text class="chartLabel" x="370" y="730" text-anchor="end">Virtual Threads</text>
<rect x="400" y="710" width="77.1" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="493.1428571428571" y="733">3</text>
<text class="chartLabel" x="370" y="790" text-anchor="end">Examples</text>
<rect x="400" y="770" width="231.4" height="34" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text class="chartValue" x="647.4285714285714" y="793">9</text>
<text class="chartFoot" x="88" y="875">Chart style preserved: warm canvas, horizontal bars, explicit counts, SVG+PNG pair.</text>
</svg>