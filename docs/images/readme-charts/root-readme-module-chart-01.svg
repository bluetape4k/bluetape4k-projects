  <text class="label" x="1320" y="200" dominant-baseline="middle">16</text>
  <text class="axis" x="100" y="251" dominant-baseline="middle">Infrastructure</text>
  <rect class="track" x="430" y="235" width="870" height="32" rx="10"/>
  <rect class="bar" x="430" y="235" width="707" height="32" rx="10" fill="#FCE7F3" stroke="#DB7890"/>
  <text class="label" x="1157" y="252" dominant-baseline="middle">13</text>
