<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
<title id="title">Lettuce Near Cache Throughput</title>
<desc id="desc">L1 hit path is separated from Redis/write paths · ops/ms · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1800" height="1050"/>
<rect class="frame" x="34" y="34" width="1732" height="982" rx="26"/>
<text class="title" x="70" y="82" >Lettuce Near Cache Throughput</text>
<text class="subtitle" x="72" y="116" >L1 hit path is separated from Redis/write paths · ops/ms · higher is better</text>
<g>
  <rect class="panel" x="70" y="150" width="810" height="680" rx="22"/>
  <text class="panelTitle" x="98" y="192" >L1 hit by payload</text>
  <text class="small" x="852" y="192" text-anchor="end">0 to 70,000 ops/ms</text>
  <line class="grid" x1="370" y1="242" x2="370" y2="565"/>
<text class="tiny" x="370" y="590" text-anchor="middle">0</text>
<line class="grid" x1="590" y1="242" x2="590" y2="565"/>
<text class="tiny" x="590" y="590" text-anchor="middle">35,000</text>
<line class="grid" x1="810" y1="242" x2="810" y2="565"/>
<text class="tiny" x="810" y="590" text-anchor="middle">70,000</text>
<line class="axis" x1="370" y1="565" x2="810" y2="565"/>
  <g>
  <text class="label" x="100" y="267" dominant-baseline="middle">512 B</text>

  <g>
  <rect x="370" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="255" width="412.0914285714286" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="794.0914285714287" y="265"  dominant-baseline="middle">65,560 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="100" y="372" dominant-baseline="middle">4 KiB</text>

  <g>
  <rect x="370" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="360" width="398.8788571428571" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="780.8788571428571" y="370"  dominant-baseline="middle">63,458 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="100" y="477" dominant-baseline="middle">16 KiB</text>

  <g>
  <rect x="370" y="465" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="465" width="405.93142857142857" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="787.9314285714286" y="475"  dominant-baseline="middle">64,580 ops/ms</text>
</g>
</g>
</g>
<g>
  <rect class="panel" x="920" y="150" width="810" height="680" rx="22"/>
  <text class="panelTitle" x="948" y="192" >Remote/write paths</text>
  <text class="small" x="1702" y="192" text-anchor="end">0 to 5 ops/ms</text>
  <line class="grid" x1="1220" y1="242" x2="1220" y2="775"/>
<text class="tiny" x="1220" y="800" text-anchor="middle">0</text>
<line class="grid" x1="1440" y1="242" x2="1440" y2="775"/>
<text class="tiny" x="1440" y="800" text-anchor="middle">3</text>
<line class="grid" x1="1660" y1="242" x2="1660" y2="775"/>
<text class="tiny" x="1660" y="800" text-anchor="middle">5</text>
<line class="axis" x1="1220" y1="775" x2="1660" y2="775"/>
  <g>
  <text class="label" x="950" y="267" dominant-baseline="middle">L2 hit</text>
  <text class="small" x="952" y="290" >512 B / 4 KiB / 16 KiB</text>
  <g>
  <rect x="1220" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="255" width="358.16" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="1590.16" y="265"  dominant-baseline="middle">4.07 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="950" y="372" dominant-baseline="middle">L2 miss</text>
  <text class="small" x="952" y="395" >best payload value</text>
  <g>
  <rect x="1220" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="360" width="370.47999999999996" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="1602.48" y="370"  dominant-baseline="middle">4.21 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="950" y="477" dominant-baseline="middle">Remove</text>
  <text class="small" x="952" y="500" >single key</text>
  <g>
  <rect x="1220" y="465" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="465" width="373.12000000000006" height="18" rx="6" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.5"/>
  <text class="value" x="1605.1200000000001" y="475"  dominant-baseline="middle">4.24 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="950" y="582" dominant-baseline="middle">Put</text>
  <text class="small" x="952" y="605" >single key</text>
  <g>
  <rect x="1220" y="570" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="570" width="186.56000000000003" height="18" rx="6" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.5"/>
  <text class="value" x="1418.56" y="580"  dominant-baseline="middle">2.12 ops/ms</text>
</g>
</g>
<g>
  <text class="label" x="950" y="687" dominant-baseline="middle">PutAll x100</text>
  <text class="small" x="952" y="710" >batch write</text>
  <g>
  <rect x="1220" y="675" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="675" width="91.52000000000001" height="18" rx="6" fill="#FFE7EC" stroke="#D85D74" stroke-width="1.5"/>
  <text class="value" x="1323.52" y="685"  dominant-baseline="middle">1.04 ops/ms</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="858" width="1612" height="58" rx="16"/>
  <text class="small" x="900" y="881" text-anchor="middle" dominant-baseline="middle">L1 hit throughput is roughly four orders of magnitude above Redis-backed paths, so the chart uses split scales.</text>
  <text class="tiny" x="900" y="900" text-anchor="middle" dominant-baseline="middle">Split panels are intentional: one chart would compress slower paths into unreadable slivers.</text>
</g>
<g>
  <rect class="note" x="94" y="932" width="1612" height="50" rx="16"/>
  <text class="small" x="900" y="950" text-anchor="middle" dominant-baseline="middle">Source: cache/cache-lettuce/README.ko.md near-cache throughput table</text>
  <text class="tiny" x="900" y="968" text-anchor="middle" dominant-baseline="middle">Split scales are intentional; compare values inside each panel, not across panel axes.</text>
</g>
</svg>
