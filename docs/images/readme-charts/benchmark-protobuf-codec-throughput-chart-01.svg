<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="686" viewBox="0 0 1720 686" role="img" aria-labelledby="title desc">
<title id="title">Protobuf Codec Throughput</title>
<desc id="desc">JMH throughput / ops/s / higher is better / GraalVM JDK 21</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:20px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1720" height="686"/>
<rect class="frame" x="34" y="34" width="1652" height="618" rx="26"/>
<text class="title" x="70" y="82">Protobuf Codec Throughput</text>
<text class="subtitle" x="72" y="116">JMH throughput / ops/s / higher is better / GraalVM JDK 21</text>
<g><rect class="panel" x="70" y="142" width="1580" height="386" rx="22"/>
<text class="panelTitle" x="96" y="184">Measured ranking</text>
<text class="small" x="1530" y="184" text-anchor="end">0 to 4,300,000 ops/s</text>
<line class="grid" x1="610.0" y1="170" x2="610.0" y2="490"/>
<text class="tiny" x="610.0" y="515" text-anchor="middle">0</text>
<line class="grid" x1="810.0" y1="170" x2="810.0" y2="490"/>
<text class="tiny" x="810.0" y="515" text-anchor="middle">1,075,000</text>
<line class="grid" x1="1010.0" y1="170" x2="1010.0" y2="490"/>
<text class="tiny" x="1010.0" y="515" text-anchor="middle">2,150,000</text>
<line class="grid" x1="1210.0" y1="170" x2="1210.0" y2="490"/>
<text class="tiny" x="1210.0" y="515" text-anchor="middle">3,225,000</text>
<line class="grid" x1="1410.0" y1="170" x2="1410.0" y2="490"/>
<text class="tiny" x="1410.0" y="515" text-anchor="middle">4,300,000</text>
<line class="axis" x1="610" y1="490" x2="1410" y2="490"/>
<g><text class="label" x="96" y="222" dominant-baseline="middle">ByteArray wrapper baseline</text>
<rect x="610" y="209" width="800" height="20" rx="7" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
<rect x="610" y="209" width="749.7" height="20" rx="7" fill="#EAF7ED" stroke="#58A978" stroke-width="1.6"/>
<text class="value" x="1373.7" y="219" dominant-baseline="middle">4,029,806 ops/s</text></g>
<g><text class="label" x="96" y="280" dominant-baseline="middle">Redisson encode</text>
<rect x="610" y="267" width="800" height="20" rx="7" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
<rect x="610" y="267" width="723.6" height="20" rx="7" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.6"/>
<text class="value" x="1347.6" y="277" dominant-baseline="middle">3,889,386 ops/s</text></g>
<g><text class="label" x="96" y="338" dominant-baseline="middle">ProtobufSerializer encode</text>
<rect x="610" y="325" width="800" height="20" rx="7" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
<rect x="610" y="325" width="691.1" height="20" rx="7" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.6"/>
<text class="value" x="1315.1" y="335" dominant-baseline="middle">3,714,491 ops/s</text></g>
<g><text class="label" x="96" y="396" dominant-baseline="middle">Redisson decode</text>
<rect x="610" y="383" width="800" height="20" rx="7" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
<rect x="610" y="383" width="630.2" height="20" rx="7" fill="#FCE7F3" stroke="#DB7890" stroke-width="1.6"/>
<text class="value" x="1254.2" y="393" dominant-baseline="middle">3,387,060 ops/s</text></g>
<g><text class="label" x="96" y="454" dominant-baseline="middle">Serializable fallback encode</text>
<rect x="610" y="441" width="800" height="20" rx="7" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
<rect x="610" y="441" width="268.1" height="20" rx="7" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.6"/>
<text class="value" x="892.1" y="451" dominant-baseline="middle">1,440,791 ops/s</text></g>
</g>
<g><rect class="note" x="94" y="590" width="1532" height="62" rx="16"/>
<text class="small" x="860" y="614" text-anchor="middle" dominant-baseline="middle">Direct protobuf codec paths cluster around 3.4M-4.0M ops/s; fallback serialization is lower.</text>
<text class="tiny" x="860" y="634" text-anchor="middle" dominant-baseline="middle">Source: :protobuf-codec-benchmark:benchmarkBenchmark / 2026-06-19 local JMH run</text></g>
</svg>
