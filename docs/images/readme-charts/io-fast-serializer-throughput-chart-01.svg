<g>
  <rect class="note" x="94" y="541" width="1532" height="58" rx="16"/>
  <text class="small" x="860" y="564" text-anchor="middle" dominant-baseline="middle">Dedicated fast serializer instances expose the fast path more clearly than factory defaults.</text>
  <text class="tiny" x="860" y="583" text-anchor="middle" dominant-baseline="middle">Higher is better. Keep units, benchmark mode, and source table visible with the chart.</text>
</g>
<g>
  <rect class="note" x="94" y="615" width="1532" height="50" rx="16"/>
  <text class="small" x="860" y="633" text-anchor="middle" dominant-baseline="middle">Source: io/io/README.ko.md fast serializer benchmark summary</text>
  <text class="tiny" x="860" y="651" text-anchor="middle" dominant-baseline="middle">Chart rule: do not merge unlike units; split axes when order-of-magnitude differences hide the message.</text>
