<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Serializer Fast Mode Throughput Chart">
<style>
.title{font-family:'Architects Daughter','Comic Sans MS','Comic Neue',cursive;font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#6b7280;font-weight:400}
.label{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400}
.value{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400;font-size:17px}
.axis{font-size:15px}.legend{font-size:17px}.note{font-size:16px}.label{font-size:17px}
</style>
<rect width="1280" height="560" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="512" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Serializer Fast Mode Throughput</text>
<text class="subtitle" x="58" y="104" font-size="18">SimpleData round-trip with 4 KB byte array payload. JMH throughput, higher is better.</text>
<rect x="56" y="118" width="18" height="18" rx="5" fill="#9ed6c5"/>
<text class="legend" x="82" y="133">fast() mode</text>
<rect x="206" y="118" width="18" height="18" rx="5" fill="#a7c7e7"/>
<text class="legend" x="232" y="133">standard binary serializer</text>
<rect x="462" y="118" width="18" height="18" rx="5" fill="#ffd6a5"/>
<text class="legend" x="488" y="133">fallback serializers</text>
<text class="axis" x="308" y="158">3K</text>
<text class="axis" x="520" y="158">10K</text>
<text class="axis" x="748" y="158">30K</text>
<text class="axis" x="975" y="158">100K ops/s</text>
<line x1="285" y1="170" x2="1075" y2="170" stroke="#d8e0ea" stroke-width="2"/>
<line x1="285" y1="166" x2="285" y2="462" stroke="#d8e0ea" stroke-width="1.5"/>
<line x1="520" y1="166" x2="520" y2="462" stroke="#e8eef6" stroke-width="1.5"/>
<line x1="748" y1="166" x2="748" y2="462" stroke="#e8eef6" stroke-width="1.5"/>
<line x1="975" y1="166" x2="975" y2="462" stroke="#e8eef6" stroke-width="1.5"/>
<text class="label" x="56" y="209">Fory fast()</text>
<rect x="285" y="184" width="782.7" height="24" rx="8" fill="#9ed6c5"/>
<text class="value" x="1080" y="203">116,000 ops/s</text>
<text class="label" x="56" y="263">Fory standard</text>
<rect x="285" y="238" width="668.4" height="24" rx="8" fill="#a7c7e7"/>
<text class="value" x="966" y="257">68,000 ops/s</text>
<text class="label" x="56" y="317">Kryo fast()</text>
<rect x="285" y="292" width="668.4" height="24" rx="8" fill="#9ed6c5"/>
<text class="value" x="966" y="311">68,000 ops/s</text>
<text class="label" x="56" y="371">Kryo standard</text>
<rect x="285" y="346" width="519.9" height="24" rx="8" fill="#a7c7e7"/>
<text class="value" x="818" y="365">34,000 ops/s</text>
<text class="label" x="56" y="425">JDK</text>
<rect x="285" y="400" width="221.3" height="24" rx="8" fill="#ffd6a5"/>
<text class="value" x="520" y="419">8,431 ops/s</text>
<text class="label" x="56" y="479">Jackson</text>
<rect x="285" y="454" width="78.2" height="24" rx="8" fill="#ffd6a5"/>
<text class="value" x="377" y="473">4,323 ops/s</text>
<text class="axis" x="285" y="510">log scale</text>
<text class="note" x="56" y="528">Use fast() for volatile fixed-schema payloads; use standard serializers when schema evolution and nullable field compatibility matter.</text>
</svg>
