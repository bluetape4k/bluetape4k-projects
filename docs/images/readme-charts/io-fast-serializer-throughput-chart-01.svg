<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="733" viewBox="0 0 1720 733" role="img" aria-labelledby="title desc">
<title id="title">Fast Serializer Throughput</title>
<desc id="desc">Fast path serializers vs factory defaults · ops/s · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
