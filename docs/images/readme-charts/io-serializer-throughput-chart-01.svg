<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="945" viewBox="0 0 1800 945" role="img" aria-labelledby="title desc">
<title id="title">Binary Serializer Throughput</title>
<desc id="desc">Serializer throughput split by payload shape · ops/s · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#F7F9FC}
    .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2;filter:url(#shadow)}
    .note{fill:#F7F9FC;stroke:#D7E2EC;stroke-width:1.6}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#21334A;font-weight:700}
    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1800" height="945"/>
<rect class="frame" x="34" y="34" width="1732" height="877" rx="26"/>
<text class="title" x="70" y="82" >Binary Serializer Throughput</text>
<text class="subtitle" x="72" y="116" >Serializer throughput split by payload shape · ops/s · higher is better</text>
<g>
  <rect class="panel" x="70" y="150" width="810" height="575" rx="22"/>
  <text class="panelTitle" x="98" y="192" >No ByteArray payload</text>
  <text class="small" x="852" y="192" text-anchor="end">0 to 320,000 ops/s</text>
  <line class="grid" x1="370" y1="242" x2="370" y2="670"/>
<text class="tiny" x="370" y="695" text-anchor="middle">0</text>
<line class="grid" x1="507.5" y1="242" x2="507.5" y2="670"/>
<text class="tiny" x="507.5" y="695" text-anchor="middle">100,000</text>
<line class="grid" x1="645" y1="242" x2="645" y2="670"/>
<text class="tiny" x="645" y="695" text-anchor="middle">200,000</text>
<line class="grid" x1="782.5" y1="242" x2="782.5" y2="670"/>
<text class="tiny" x="782.5" y="695" text-anchor="middle">300,000</text>
<line class="axis" x1="370" y1="670" x2="810" y2="670"/>
  <g>
  <text class="label" x="100" y="267" dominant-baseline="middle">Fory</text>

  <g>
  <rect x="370" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="255" width="420.503875" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="802.503875" y="265"  dominant-baseline="middle">305,821 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="100" y="372" dominant-baseline="middle">Kryo</text>

  <g>
  <rect x="370" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="360" width="112.506625" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="494.506625" y="370"  dominant-baseline="middle">81,823 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="100" y="477" dominant-baseline="middle">Jackson</text>

  <g>
  <rect x="370" y="465" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="465" width="54.32625" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="436.32625" y="475"  dominant-baseline="middle">39,510 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="100" y="582" dominant-baseline="middle">JDK</text>

  <g>
  <rect x="370" y="570" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="370" y="570" width="30.592374999999997" height="18" rx="6" fill="#F5F7FA" stroke="#8FA1B3" stroke-width="1.5"/>
  <text class="value" x="412.592375" y="580"  dominant-baseline="middle">22,249 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="panel" x="920" y="150" width="810" height="575" rx="22"/>
  <text class="panelTitle" x="948" y="192" >ByteArray 4096</text>
  <text class="small" x="1702" y="192" text-anchor="end">0 to 65,000 ops/s</text>
  <line class="grid" x1="1220" y1="242" x2="1220" y2="670"/>
<text class="tiny" x="1220" y="695" text-anchor="middle">0</text>
<line class="grid" x1="1355.3846153846155" y1="242" x2="1355.3846153846155" y2="670"/>
<text class="tiny" x="1355.3846153846155" y="695" text-anchor="middle">20,000</text>
<line class="grid" x1="1490.7692307692307" y1="242" x2="1490.7692307692307" y2="670"/>
<text class="tiny" x="1490.7692307692307" y="695" text-anchor="middle">40,000</text>
<line class="grid" x1="1626.1538461538462" y1="242" x2="1626.1538461538462" y2="670"/>
<text class="tiny" x="1626.1538461538462" y="695" text-anchor="middle">60,000</text>
<line class="axis" x1="1220" y1="670" x2="1660" y2="670"/>
  <g>
  <text class="label" x="950" y="267" dominant-baseline="middle">Fory</text>

  <g>
  <rect x="1220" y="255" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="255" width="400.6843076923077" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="1632.6843076923078" y="265"  dominant-baseline="middle">59,192 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="950" y="372" dominant-baseline="middle">Kryo</text>

  <g>
  <rect x="1220" y="360" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="360" width="198.53476923076923" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="1430.5347692307691" y="370"  dominant-baseline="middle">29,329 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="950" y="477" dominant-baseline="middle">JDK</text>

  <g>
  <rect x="1220" y="465" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="465" width="57.071384615384616" height="18" rx="6" fill="#F5F7FA" stroke="#8FA1B3" stroke-width="1.5"/>
  <text class="value" x="1289.0713846153847" y="475"  dominant-baseline="middle">8,431 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="950" y="582" dominant-baseline="middle">Jackson</text>

  <g>
  <rect x="1220" y="570" width="440" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="1220" y="570" width="29.263384615384616" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="1261.2633846153847" y="580"  dominant-baseline="middle">4,323 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="753" width="1612" height="58" rx="16"/>
  <text class="small" x="900" y="776" text-anchor="middle" dominant-baseline="middle">Fory leads both payload shapes, but ByteArray payloads lower every serializer score enough to warrant a separate panel.</text>
  <text class="tiny" x="900" y="795" text-anchor="middle" dominant-baseline="middle">Split panels are intentional: one chart would compress slower paths into unreadable slivers.</text>
</g>
<g>
  <rect class="note" x="94" y="827" width="1612" height="50" rx="16"/>
  <text class="small" x="900" y="845" text-anchor="middle" dominant-baseline="middle">Source: io/io/src/test/kotlin/io/bluetape4k/io/benchmark/README.md serializer benchmark tables</text>
  <text class="tiny" x="900" y="863" text-anchor="middle" dominant-baseline="middle">Split scales are intentional; compare values inside each panel, not across panel axes.</text>
</g>
</svg>
