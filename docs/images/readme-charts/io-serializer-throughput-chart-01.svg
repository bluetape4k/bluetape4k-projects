<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<style>
.title{font-family:'Architects Daughter','Comic Sans MS','Comic Neue',cursive;font-size:34px;font-weight:400;fill:#273043}
.subtitle,.axis,.legend,.note{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#6b7280;font-weight:400}
.label{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400}
.value{font-family:'Comic Sans MS','Comic Neue','Chalkboard SE',cursive;fill:#273043;font-weight:400;font-size:18px}
.axis{font-size:16px}.legend{font-size:18px}.note{font-size:17px}.label{font-size:18px}
</style>
<rect width="1280" height="520" rx="0" fill="#f6f8fb"/>
<rect x="24" y="24" width="1232" height="472" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/>
<text class="title" x="56" y="72">Binary Serializer Throughput</text><text class="subtitle" x="58" y="104" font-size="18">SimpleData round-trip with and without 4 KB byte array</text><rect x="56" y="116" width="18" height="18" rx="5" fill="#8ecae6"/><text class="legend" x="82" y="131">No byte array</text><rect x="236" y="116" width="18" height="18" rx="5" fill="#ffb3c7"/><text class="legend" x="262" y="131">4 KB byte array</text><text class="label" x="56" y="173">Fory</text><rect x="285" y="142" width="778.4469633510334" height="18" rx="7" fill="#8ecae6"/><text class="value" x="1073.4469633510334" y="157" font-size="16">305,821 ops/s</text><rect x="285" y="166" width="493.23481290988684" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="788.2348129098868" y="181" font-size="16">59,192 ops/s</text><text class="label" x="56" y="247">Kryo</text><rect x="285" y="216" width="549.4660514072491" height="18" rx="7" fill="#8ecae6"/><text class="value" x="844.4660514072491" y="231" font-size="16">81,823 ops/s</text><rect x="285" y="240" width="371.2782555575923" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="666.2782555575923" y="255" font-size="16">29,329 ops/s</text><text class="label" x="56" y="321">Jackson</text><rect x="285" y="290" width="423.0295426682094" height="18" rx="7" fill="#8ecae6"/><text class="value" x="718.0295426682094" y="305" font-size="16">39,510 ops/s</text><rect x="285" y="314" width="38.75455266654535" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="333.75455266654535" y="329" font-size="16">4,323 ops/s</text><text class="label" x="56" y="395">JDK</text><rect x="285" y="364" width="323.2952551737719" height="18" rx="7" fill="#8ecae6"/><text class="value" x="618.2952551737719" y="379" font-size="16">22,249 ops/s</text><rect x="285" y="388" width="154.76379861673036" height="18" rx="7" fill="#ffb3c7"/><text class="value" x="449.76379861673036" y="403" font-size="16">8,431 ops/s</text><text class="axis" x="285" y="456">log scale</text><text class="note" x="56" y="480">Higher is better. Log scale shows both payload modes without hiding the slowest serializer.</text></svg>
