<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Lettuce Connection Optimization Throughput Chart"><style>
.title{font-family:'Architects Daughter';font-size:34px;font-weight:400;fill:#273043}.subtitle,.axis,.legend,.note{font-family:'Comic Mono';fill:#6b7280;font-weight:400}.label{font-family:'Comic Mono';fill:#273043;font-weight:400}.value{font-family:'Comic Mono';fill:#273043;font-weight:400;font-size:15px}.axis{font-size:14px}.legend{font-size:16px}.note{font-size:15px}.label{font-size:15px}
</style><rect width="1280" height="470" fill="#f6f8fb"/><rect x="24" y="24" width="1232" height="422" rx="18" fill="#ffffff" stroke="#d7e3ee" stroke-width="2"/><text class="title" x="56" y="72">Lettuce Connection Optimization Throughput</text><text class="subtitle" x="58" y="104" font-size="18">10,000 async SET+GET operations through Testcontainers Redis; higher is better.</text><text class="label" x="56" y="164">Default</text><rect x="330" y="145" width="295.3" height="24" rx="8" fill="#a7c7e7"/><text class="value" x="637.2861517439945" y="163">31,847 ops/sec</text><text class="label" x="56" y="219">Shared resources</text><rect x="330" y="200" width="298.1" height="24" rx="8" fill="#8ecae6"/><text class="value" x="640.1326631449242" y="218">32,154 ops/sec</text><text class="label" x="56" y="274">Pipeline SET+GET</text><rect x="330" y="255" width="378.4" height="24" rx="8" fill="#ffb3c7"/><text class="value" x="720.4469359620334" y="273">40,816 ops/sec</text><text class="label" x="56" y="329">Socket tuning</text><rect x="330" y="310" width="433.3" height="24" rx="8" fill="#ffd6a5"/><text class="value" x="775.2631424841704" y="328">46,728 ops/sec</text><text class="label" x="56" y="384">Merged pipeline + awaitAll</text><rect x="330" y="365" width="760.0" height="24" rx="8" fill="#9ed6c5"/><text class="value" x="1102" y="383">81,967 ops/sec</text><text class="note" x="56" y="430">The final stage combines a single pipeline flush with bulk await, removing the largest per-command overhead.</text></svg>