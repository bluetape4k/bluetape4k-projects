    .label{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .body{font-family:"Comic Mono";font-size:14px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .tiny{font-family:"Comic Mono";font-size:11px;fill:#657386}
    .value{font-family:"Comic Mono";font-size:13px;fill:#26384F;font-weight:700}
    .grid{stroke:#D7E2EC;stroke-width:1;stroke-dasharray:4 7}
    .axis{stroke:#AEBFD1;stroke-width:1.6}
  </style>
</defs>
<rect class="canvas" width="1720" height="720"/>
<rect class="frame" x="34" y="34" width="1652" height="652" rx="26"/>
<text class="title" x="70" y="82" >Lettuce Connection Throughput</text>
<text class="subtitle" x="72" y="116" >Incremental connection and pipeline tuning · ops/s · higher is better</text>
<g>
  <rect class="panel" x="70" y="142" width="1580" height="362" rx="22"/>
  <text class="panelTitle" x="96" y="184" >Measured ranking</text>
  <text class="small" x="1530" y="184" text-anchor="end">0 to 85,000 ops/s</text>
  <line class="grid" x1="560" y1="170" x2="560" y2="420"/>
<text class="tiny" x="560" y="445" text-anchor="middle">0</text>
<line class="grid" x1="804.1176470588235" y1="170" x2="804.1176470588235" y2="420"/>
<text class="tiny" x="804.1176470588235" y="445" text-anchor="middle">25,000</text>
<line class="grid" x1="1048.235294117647" y1="170" x2="1048.235294117647" y2="420"/>
<text class="tiny" x="1048.235294117647" y="445" text-anchor="middle">50,000</text>
<line class="grid" x1="1292.3529411764707" y1="170" x2="1292.3529411764707" y2="420"/>
<text class="tiny" x="1292.3529411764707" y="445" text-anchor="middle">75,000</text>
<line class="axis" x1="560" y1="420" x2="1390" y2="420"/>
  <g>
  <text class="label" x="96" y="194" dominant-baseline="middle">baseline</text>

  <g>
  <rect x="560" y="180" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="180" width="310.9765882352941" height="18" rx="6" fill="#F5F7FA" stroke="#8FA1B3" stroke-width="1.5"/>
  <text class="value" x="882.9765882352941" y="190"  dominant-baseline="middle">31,847 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="242" dominant-baseline="middle">shared resources</text>

  <g>
  <rect x="560" y="228" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="228" width="313.97435294117645" height="18" rx="6" fill="#E7F1FF" stroke="#5A85D6" stroke-width="1.5"/>
  <text class="value" x="885.9743529411764" y="238"  dominant-baseline="middle">32,154 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="290" dominant-baseline="middle">pipeline SET+GET</text>

  <g>
  <rect x="560" y="276" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="276" width="398.55623529411764" height="18" rx="6" fill="#E6F7F5" stroke="#38A69E" stroke-width="1.5"/>
  <text class="value" x="970.5562352941176" y="286"  dominant-baseline="middle">40,816 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="338" dominant-baseline="middle">SocketOptions</text>

  <g>
  <rect x="560" y="324" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="324" width="456.2851764705883" height="18" rx="6" fill="#FFF3D8" stroke="#D6A441" stroke-width="1.5"/>
  <text class="value" x="1028.2851764705883" y="334"  dominant-baseline="middle">46,728 ops/s</text>
</g>
</g>
<g>
  <text class="label" x="96" y="386" dominant-baseline="middle">pipeline + awaitAll</text>

  <g>
  <rect x="560" y="372" width="830" height="18" rx="6" fill="#EEF4F9" stroke="#D7E2EC" stroke-width="1.4"/>
  <rect x="560" y="372" width="800.3836470588235" height="18" rx="6" fill="#EAF7ED" stroke="#58A978" stroke-width="1.5"/>
  <text class="value" x="1372.3836470588235" y="382"  dominant-baseline="middle">81,967 ops/s</text>
</g>
</g>
</g>
<g>
  <rect class="note" x="94" y="528" width="1532" height="58" rx="16"/>
  <text class="small" x="860" y="551" text-anchor="middle" dominant-baseline="middle">Integrated pipeline + awaitAll is the only step that materially changes throughput beyond socket/client-resource tuning.</text>
  <text class="tiny" x="860" y="570" text-anchor="middle" dominant-baseline="middle">Higher is better. Keep units, benchmark mode, and source table visible with the chart.</text>
</g>
<g>
  <rect class="note" x="94" y="602" width="1532" height="50" rx="16"/>
  <text class="small" x="860" y="620" text-anchor="middle" dominant-baseline="middle">Source: infra/lettuce/README.ko.md connection tuning benchmark table</text>
  <text class="tiny" x="860" y="638" text-anchor="middle" dominant-baseline="middle">Chart rule: do not merge unlike units; split axes when order-of-magnitude differences hide the message.</text>
</g>
</svg>
