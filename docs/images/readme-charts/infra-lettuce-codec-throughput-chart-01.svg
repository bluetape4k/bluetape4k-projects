<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1120" viewBox="0 0 1360 1120" role="img" aria-labelledby="title desc">
<title id="title">Lettuce Codec Throughput</title>
<desc id="desc">Encode + decode round trip throughput · ops/ms · higher is better</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.08"/></filter>
  <style>
    .canvas{fill:#F6F9FD}
    .frame{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#C9D8E8;stroke-width:1.8;filter:url(#shadow)}
    .result{fill:#F2FFFB;stroke:#18BFA7;stroke-width:1.8}
    .title{font-family:"Architects Daughter";font-size:34px;fill:#22304A;font-weight:700}
    .panelTitle{font-family:"Architects Daughter";font-size:23px;fill:#22304A;font-weight:700}
    .subtitle,.label,.axis,.value,.small,.tiny{font-family:"Comic Mono";fill:#22304A}
    .subtitle{font-size:14px;fill:#5B6B83}
    .label{font-size:12px}
    .axis{font-size:11px;fill:#5B6B83}
    .value{font-size:11px;font-weight:700}
    .small{font-size:12px}
    .tiny{font-size:10px;fill:#5B6B83}
    .grid{stroke:#E1E9F3;stroke-width:1}
    .axisLine{stroke:#B7C8DC;stroke-width:1.4}
    .scopePill{fill:#F6FAFF;stroke:#4F83FF;stroke-width:1.5}
    .legendText{font-family:"Comic Mono";font-size:12px;fill:#22304A}
  </style>
</defs>
<rect class="canvas" width="1360" height="1120"/>
<rect class="frame" x="0.5" y="0.5" width="1359" height="1119" rx="14"/>
<text class="title" x="680" y="54" text-anchor="middle">Lettuce Codec Throughput</text>
<text class="subtitle" x="680" y="76" text-anchor="middle">Encode + decode round trip throughput · ops/ms · higher is better</text>
<g>
  <rect x="300" y="88" width="760" height="30" rx="15" fill="#F7FBFF" stroke="#4F83FF" stroke-width="1.4"/>
  <text class="tiny" x="680" y="104" text-anchor="middle" dominant-baseline="middle">Scope: Lettuce codec ranking, normalized by ops/ms with benchmark caveats retained</text>
</g>
<g>
  <rect class="panel" x="56" y="150" width="1248" height="760" rx="14"/>
  <text class="panelTitle" x="88" y="193" >Codec ranking</text>
  <text class="axis" x="1184" y="187" text-anchor="middle">0 to 7,000 ops/ms</text>
  <line class="grid" x1="346" y1="226" x2="346" y2="847"/>
<text class="axis" x="346" y="875" text-anchor="middle">0</text>
<line class="grid" x1="566" y1="226" x2="566" y2="847"/>
<text class="axis" x="566" y="875" text-anchor="middle">2000</text>
<line class="grid" x1="786" y1="226" x2="786" y2="847"/>
<text class="axis" x="786" y="875" text-anchor="middle">4000</text>
<line class="grid" x1="1006" y1="226" x2="1006" y2="847"/>
<text class="axis" x="1006" y="875" text-anchor="middle">6000</text>
<line class="axisLine" x1="346" y1="847" x2="1116" y2="847"/>
  <g>
  <text class="label" x="88" y="256" >fastjson2</text>
  <rect x="346" y="244" width="701.6899999999999" height="16" rx="5" fill="#BBD8FF" stroke="#6EA6FF" stroke-width="1.4"/>
  <text class="value" x="1057.69" y="257" >6,379 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="303" >fastFory</text>
  <rect x="346" y="291" width="361.46" height="16" rx="5" fill="#FFB3C7" stroke="#E15B7B" stroke-width="1.4"/>
  <text class="value" x="717.46" y="304" >3,286 ops/ms</text>
</g>
