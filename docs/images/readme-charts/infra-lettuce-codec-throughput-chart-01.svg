  <text class="value" x="370.96" y="727" >136 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="773" >jdk</text>
  <rect x="346" y="761" width="14.52" height="16" rx="5" fill="#B8E0D2" stroke="#35A878" stroke-width="1.4"/>
  <text class="value" x="370.52" y="774" >132 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="820" >gzipFastFory</text>
  <rect x="346" y="808" width="12.100000000000001" height="16" rx="5" fill="#FFD166" stroke="#D6A441" stroke-width="1.4"/>
  <text class="value" x="368.1" y="821" >110 ops/ms</text>
</g>
  <text class="axis" x="1158" y="875" >ops/ms</text>
</g>
<g>
  <rect class="panel" x="56" y="944" width="1248" height="106" rx="14" fill="#F8FBFF"/>
  <text class="panelTitle" x="84" y="982" >Interpretation boundary</text>
  <g>
  <rect x="390" y="960" width="236" height="32" rx="16" fill="#FFFFFF" stroke="#6EA6FF" stroke-width="1.4"/>
  <text class="tiny" x="508" y="977" text-anchor="middle" dominant-baseline="middle">fastjson2 leads ranking</text>
</g>
  <g>
  <rect x="650" y="960" width="254" height="32" rx="16" fill="#FFFFFF" stroke="#FF9F43" stroke-width="1.4"/>
  <text class="tiny" x="777" y="977" text-anchor="middle" dominant-baseline="middle">compression codecs trade CPU</text>
</g>
  <text class="small" x="84" y="1018" >Use the paired benchmark note for payload size, Redis/Lettuce version, JVM settings, and raw kotlinx-benchmark output.</text>
