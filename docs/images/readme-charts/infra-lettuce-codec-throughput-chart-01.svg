  <rect x="346" y="526" width="91.74000000000001" height="16" rx="5" fill="#A8DADC" stroke="#2E8F89" stroke-width="1.4"/>
  <text class="value" x="447.74" y="539" >834 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="585" >lz4Kryo</text>
  <rect x="346" y="573" width="58.85" height="16" rx="5" fill="#F7A072" stroke="#C94D68" stroke-width="1.4"/>
  <text class="value" x="414.85" y="586" >535 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="632" >zstdFastFory</text>
  <rect x="346" y="620" width="22.66" height="16" rx="5" fill="#90BE6D" stroke="#718A35" stroke-width="1.4"/>
  <text class="value" x="378.66" y="633" >206 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="679" >zstdFory</text>
  <rect x="346" y="667" width="22.330000000000002" height="16" rx="5" fill="#BBD8FF" stroke="#6EA6FF" stroke-width="1.4"/>
  <text class="value" x="378.33" y="680" >203 ops/ms</text>
</g>
<g>
  <text class="label" x="88" y="726" >zstdKryo</text>
