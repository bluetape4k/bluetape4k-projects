<g id="seq-app"><rect class="card" x="2223" y="170" width="230" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="2338" y="215" text-anchor="middle">App</text><line class="lifeline" x1="2338" y1="248" x2="2338" y2="886"/></g>
