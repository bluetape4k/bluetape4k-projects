<rect x="663.6" y="322" width="16" height="478" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1080.2" y="412" width="16" height="298" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
