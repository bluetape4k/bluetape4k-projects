<rect x="1913.4" y="592" width="16" height="52" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<rect x="2330" y="772" width="16" height="52" rx="5" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="296.9" y="271" width="332.9" height="42" rx="7"/><circle cx="315.9" cy="292" r="12" fill="#4F83BF"/><text class="detail" x="315.9" y="293" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="481.3" y="284" text-anchor="middle" dominant-baseline="middle">withObservationContext(operation,</text><text class="detail" x="481.3" y="299" text-anchor="middle" dominant-baseline="middle">registry)</text><path class="seq" d="M255 330 L671.6 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="764.6" y="377" width="230.7" height="26" rx="7"/><circle cx="783.6" cy="390" r="12" fill="#3E9868"/><text class="detail" x="783.6" y="391" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="897.9" y="391" text-anchor="middle" dominant-baseline="middle">Observation.start()</text><path class="seq" d="M671.6 420 L1088.2 420" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="958.3" y="467" width="259.9" height="26" rx="7"/><circle cx="977.3" cy="480" r="12" fill="#2E8F89"/><text class="detail" x="977.3" y="481" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1106.2" y="481" text-anchor="middle" dominant-baseline="middle">Execute coroutine block</text><path class="seq" d="M671.6 510 L1504.8 510" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="1608.1" y="557" width="210" height="26" rx="7"/><circle cx="1627.1" cy="570" r="12" fill="#2E8F89"/><text class="detail" x="1627.1" y="571" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1731.1" y="571" text-anchor="middle" dominant-baseline="middle">Return result</text><path class="seqReturn" d="M1504.8 600 L1921.4 600" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m5"><rect class="labelPill" x="768.2" y="647" width="223.4" height="26" rx="7"/><circle cx="787.2" cy="660" r="12" fill="#C94D68"/><text class="detail" x="787.2" y="661" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="897.9" y="661" text-anchor="middle" dominant-baseline="middle">Observation.stop()</text><path class="seq" d="M671.6 690 L1088.2 690" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="1399.8" y="737" width="210" height="26" rx="7"/><circle cx="1418.8" cy="750" r="12" fill="#2E8F89"/><text class="detail" x="1418.8" y="751" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1522.8" y="751" text-anchor="middle" dominant-baseline="middle">Return result</text><path class="seqReturn" d="M671.6 780 L2338 780" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g><rect x="140" y="910" width="2313" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1296.5" y="936" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
