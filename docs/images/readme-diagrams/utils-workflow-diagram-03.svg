<svg data-intent="Explain workflow retry flow by showing failure detection, backoff, retry decision, repeated execution, and terminal failed/completed branches." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-label="Workflow Execution Model" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="940"/>
<rect class="frame" x="34" y="30" width="1432" height="880" rx="32"/>
<text class="title" x="72" y="84">Workflow Execution Model</text>
<text class="subtitle" x="76" y="116">The same DSL selects sync or suspend execution while flow families and runtime primitives converge on the shared WorkReport contract.</text>
<g id="caller">
  <rect class="card" x="120" y="210" width="320" height="80" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="280" y="243" text-anchor="middle" dominant-baseline="middle">Caller DSL</text>
  <text class="detail" x="280" y="273" text-anchor="middle" dominant-baseline="middle">builds workflow definition</text>
</g>
<g id="model">
  <polygon class="card card-shape" points="745,185 920,250 745,315 570,250" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="745" y="242" text-anchor="middle" dominant-baseline="middle">Use sync model?</text>
  <text class="detail" x="745" y="271" text-anchor="middle" dominant-baseline="middle">no branch uses suspend</text>
</g>
<g id="sync">
  <rect class="card" x="1050" y="160" width="330" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1215" y="194" text-anchor="middle" dominant-baseline="middle">Sync WorkFlow</text>
  <text class="detail" x="1215" y="224" text-anchor="middle" dominant-baseline="middle">virtual-thread friendly work</text>
</g>
<g id="suspend">
  <rect class="card" x="1050" y="295" width="330" height="82" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="1215" y="329" text-anchor="middle" dominant-baseline="middle">SuspendWorkFlow</text>
  <text class="detail" x="1215" y="359" text-anchor="middle" dominant-baseline="middle">coroutine cancellation aware</text>
</g>
<g id="families">
  <rect class="card" x="250" y="500" width="410" height="116" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="455" y="542" text-anchor="middle" dominant-baseline="middle">Flow families</text>
  <text class="detail" x="455" y="572" text-anchor="middle" dominant-baseline="middle">sequential, parallel, conditional</text>
  <text class="detail" x="455" y="590" text-anchor="middle" dominant-baseline="middle">repeat, retry</text>
</g>
<g id="runtime">
  <rect class="card" x="860" y="480" width="420" height="126" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1070" y="527" text-anchor="middle" dominant-baseline="middle">Runtime primitives</text>
  <text class="detail" x="1070" y="557" text-anchor="middle" dominant-baseline="middle">StructuredTaskScope for sync parallel</text>
  <text class="detail" x="1070" y="575" text-anchor="middle" dominant-baseline="middle">coroutineScope + delay for suspend</text>
</g>
<g id="report">
  <rect class="card" x="565" y="745" width="360" height="88" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="745" y="782" text-anchor="middle" dominant-baseline="middle">WorkReport</text>
  <text class="detail" x="745" y="812" text-anchor="middle" dominant-baseline="middle">unifies success, failure, stop states</text>
</g>
<path class="route" data-from="caller" data-to="model" d="M440 250 L570 250" stroke="#4F83BF"/>
<path class="route" data-from="model" data-to="sync" d="M920 238 L1050 201" stroke="#3E9868"/>
<g><rect class="labelPill" x="942" y="183" width="86" height="26" rx="8"/><text class="detail" x="985" y="197" text-anchor="middle" dominant-baseline="middle" style="fill:#3E9868">yes sync</text></g>
<path class="route" data-from="model" data-to="suspend" d="M920 250 L1050 336" stroke="#2E8F89"/>
<g><rect class="labelPill" x="943" y="291" width="104" height="26" rx="8"/><text class="detail" x="995" y="305" text-anchor="middle" dominant-baseline="middle" style="fill:#2E8F89">no suspend</text></g>
<path class="route" data-from="model" data-to="families" d="M745 315 L745 438 L455 438 L455 500" stroke="#B9851B"/>
<path class="route" data-from="sync" data-to="runtime" d="M1380 201 L1430 201 L1430 543 L1280 543" stroke="#C94D68"/>
<path class="route" data-from="suspend" data-to="runtime" d="M1215 377 L1215 480" stroke="#2E8F89"/>
<path class="route" data-from="families" data-to="report" d="M455 616 L455 700 L650 700 L650 745" stroke="#B9851B"/>
<path class="route" data-from="runtime" data-to="report" d="M1070 606 L1070 700 L840 700 L840 745" stroke="#C94D68"/>
</svg>
