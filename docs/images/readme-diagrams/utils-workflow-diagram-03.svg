<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="Workflow Execution Model">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="smallArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6" fill="none" stroke="#758297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .edgeLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .thinLine{stroke:#758297;stroke-width:1.8;fill:none;marker-end:url(#smallArrow)}
    .dashed{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
  </style>
</defs>
<rect class="canvas" width="1500" height="900"/>
<rect class="frame" x="32" y="28" width="1436" height="844" rx="28"/>
<text class="title" x="66" y="82">Workflow Execution Model</text>
<text class="subtitle" x="70" y="118">The DSL chooses a runtime model, composes a flow strategy, then every path returns a WorkReport.</text><g>
  <rect class="card" x="95" y="372" width="260" height="120" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="225" y="408" text-anchor="middle">Workflow DSL</text>
  <text class="small" x="225" y="438" text-anchor="middle">workflow {}</text>
<text class="small" x="225" y="456" text-anchor="middle">sequentialFlow {}</text>
<text class="small" x="225" y="474" text-anchor="middle">suspendWorkflow {}</text>
</g>
<g>
  <rect class="card" x="500" y="185" width="320" height="135" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="660" y="221" text-anchor="middle">Sync WorkFlow</text>
  <text class="small" x="660" y="251" text-anchor="middle">Work</text>
<text class="small" x="660" y="269" text-anchor="middle">Virtual Thread friendly</text>
<text class="small" x="660" y="287" text-anchor="middle">blocking APIs allowed</text>
</g>
<g>
  <rect class="card" x="500" y="555" width="320" height="135" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="660" y="591" text-anchor="middle">SuspendWorkFlow</text>
  <text class="small" x="660" y="621" text-anchor="middle">SuspendWork</text>
<text class="small" x="660" y="639" text-anchor="middle">coroutineScope</text>
<text class="small" x="660" y="657" text-anchor="middle">cancellation-aware</text>
</g>
<g>
  <rect class="card" x="960" y="178" width="320" height="138" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="1120" y="214" text-anchor="middle">Flow Strategy</text>
  <text class="small" x="1120" y="244" text-anchor="middle">Sequential</text>
<text class="small" x="1120" y="262" text-anchor="middle">Parallel ALL / ANY</text>
<text class="small" x="1120" y="280" text-anchor="middle">Conditional</text>
</g>
<g>
  <rect class="card" x="960" y="546" width="320" height="138" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="1120" y="582" text-anchor="middle">Control Strategy</text>
  <text class="small" x="1120" y="612" text-anchor="middle">Repeat</text>
<text class="small" x="1120" y="630" text-anchor="middle">Retry + backoff</text>
<text class="small" x="1120" y="648" text-anchor="middle">STOP / CONTINUE</text>
</g>
<g>
  <rect class="card" x="1165" y="360" width="250" height="128" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="1290" y="396" text-anchor="middle">WorkReport</text>
  <text class="small" x="1290" y="426" text-anchor="middle">Success / Failure</text>
<text class="small" x="1290" y="444" text-anchor="middle">PartialSuccess</text>
<text class="small" x="1290" y="462" text-anchor="middle">Aborted / Cancelled</text>
</g>
<g>
  <rect class="card" x="520" y="370" width="270" height="115" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="655" y="406" text-anchor="middle">Adapters</text>
  <text class="small" x="655" y="436" text-anchor="middle">Work.asSuspend()</text>
<text class="small" x="655" y="454" text-anchor="middle">SuspendWork.asBlocking()</text>
<text class="small" x="655" y="472" text-anchor="middle">hybrid composition</text>
</g>
<path class="line" d="M355 420 C420 335 440 258 500 252"/>
<text class="edgeLabel" x="426" y="326" text-anchor="middle">sync path</text>
<path class="line" d="M355 444 C420 527 440 610 500 622"/>
<text class="edgeLabel" x="429" y="543" text-anchor="middle">suspend path</text>
<path class="line" d="M820 252 H960"/>
<text class="edgeLabel" x="890" y="242" text-anchor="middle">compose</text>
<path class="line" d="M820 622 H960"/>
<text class="edgeLabel" x="890" y="612" text-anchor="middle">compose</text>
<path class="dashed" d="M790 428 H1165"/>
<text class="edgeLabel" x="972" y="418" text-anchor="middle">adapts</text>
<path class="line" d="M1280 316 C1320 334 1340 352 1340 360"/>
<text class="edgeLabel" x="1358" y="337" text-anchor="middle">returns</text>
<path class="line" d="M1280 546 C1320 520 1340 500 1340 488"/>
<text class="edgeLabel" x="1365" y="518" text-anchor="middle">returns</text>
<g>
  <rect class="soft" x="100" y="630" width="345" height="78" rx="12" fill="#EAF7EF" stroke="#58A978" opacity="0.92"/>
  <text class="small" x="118" y="655" text-anchor="start">Choose sync for simple blocking work.</text>
<text class="small" x="118" y="673" text-anchor="start">Choose suspend when structured cancellation matters.</text>
</g>
<g>
  <rect class="soft" x="910" y="720" width="470" height="78" rx="12" fill="#FFF3D9" stroke="#D6A441" opacity="0.92"/>
  <text class="small" x="928" y="745" text-anchor="start">All strategies use the same WorkReport contract.</text>
<text class="small" x="928" y="763" text-anchor="start">The report controls the next transition.</text>
</g></svg>
