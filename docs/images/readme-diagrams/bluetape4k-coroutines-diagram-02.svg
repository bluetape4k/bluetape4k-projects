  <text class="label" x="155" y="49" text-anchor="middle">CoroutineScope</text>

</g>
<g transform="translate(1378,180)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#DC6B82"/>
  <text class="small" x="155" y="26" text-anchor="middle">«extensionFunction»</text>
  <text class="label" x="155" y="61" text-anchor="middle">AsyncFlow</text>
  <text class="mono" x="18" y="108">+Flow.async(dispatcher, transform)</text>
<text class="mono" x="18" y="129">Flow~R~</text>
</g>
<g transform="translate(1800,180)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#45A7A1"/>
  <text class="small" x="155" y="26" text-anchor="middle">«factoryFunction»</text>
  <text class="label" x="155" y="61" text-anchor="middle">deferredValueOf</text>
  <text class="mono" x="18" y="108">+deferredValueOf(block)</text>
<text class="mono" x="18" y="129">DeferredValue~T~</text>
</g>
<g transform="translate(745,586)">
  <rect class="card" x="0" y="0" width="310" height="280" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#8A72D6"/>
  <text class="small" x="155" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="155" y="61" text-anchor="middle">FlowExtensions</text>
  <text class="mono" x="18" y="108">+chunked(n) Flow~List~T~~</text>
<text class="mono" x="18" y="129">+windowed(size, step) Flow~List~T~~</text>
<text class="mono" x="18" y="150">+sliding(n) Flow~List~T~~</text>
<text class="mono" x="18" y="171">+mapParallel(parallelism, transform)</text>
<text class="mono" x="18" y="192">Flow~R~</text>
<text class="mono" x="18" y="213">+concatMapEager(transform) Flow~R~</text>
<text class="mono" x="18" y="234">+bufferingDebounce(timeout)</text>
<text class="mono" x="18" y="255">Flow~List~T~~</text>
</g>
<g transform="translate(1167,586)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#B88A44"/>
  <text class="small" x="155" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="155" y="61" text-anchor="middle">ReactorContextHelpers</text>
  <text class="mono" x="18" y="108">+currentReactiveContext() Context?</text>
<text class="mono" x="18" y="129">+Context.getOrNull(key) V?</text>
</g>
<g transform="translate(323,1090)">
  <rect class="card" x="0" y="0" width="310" height="191" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="94" x2="310" y2="94" stroke="#8BA84D"/>
  <text class="small" x="155" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="155" y="56.5" text-anchor="middle">Thread Pool Coroutine</text>
<text class="label" x="155" y="81.5" text-anchor="middle">Scope</text>
  <text class="mono" x="18" y="124">+poolSize: Int</text>
<text class="mono" x="18" y="145">+name: String</text>
<text class="mono" x="18" y="166">+close()</text>
</g>
<g transform="translate(745,1090)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="155" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="155" y="61" text-anchor="middle">DefaultCoroutineScope</text>
  <text class="mono" x="18" y="108">+coroutineContext: Dispatchers.Default</text>
<text class="mono" x="18" y="129">+ SupervisorJob</text>
</g>
<g transform="translate(1167,1090)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#58A978"/>
  <text class="small" x="155" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="155" y="61" text-anchor="middle">IoCoroutineScope</text>
  <text class="mono" x="18" y="108">+coroutineContext: Dispatchers.IO +</text>
<text class="mono" x="18" y="129">SupervisorJob</text>
</g>
<g transform="translate(1589,1090)">
  <rect class="card" x="0" y="0" width="310" height="170" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="310" y2="94" stroke="#D6A441"/>
  <text class="small" x="155" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="155" y="56.5" text-anchor="middle">Virtual Thread</text>
<text class="label" x="155" y="81.5" text-anchor="middle">Coroutine Scope</text>
  <text class="mono" x="18" y="124">+coroutineContext: VirtualThread</text>
<text class="mono" x="18" y="145">dispatcher + SupervisorJob</text>
</g>
