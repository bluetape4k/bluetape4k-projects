<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunction»</text>
  <text class="label" x="170" y="61" text-anchor="middle">AsyncFlow</text>
  <text class="mono" x="18" y="108">+Flow.async(dispatcher, transform) Flow~R~</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CoroutineScope</text>

</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="170" y="61" text-anchor="middle">DeferredSupport</text>
  <text class="mono" x="18" y="108">+zip(a, b, transform) Deferred~R~</text>
<text class="mono" x="18" y="129">+awaitAny(vararg deferred) T</text>
<text class="mono" x="18" y="150">+awaitAnyAndCancelOthers() T</text>
<text class="mono" x="18" y="171">+map(transform) Deferred~R~</text>
<text class="mono" x="18" y="192">+mapAll(transform) Deferred~List~R~~</text>
<text class="mono" x="18" y="213">+concatMap(transform) Deferred~R~</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="170" y="61" text-anchor="middle">DeferredValue</text>
  <text class="mono" x="18" y="108">+await() T</text>
<text class="mono" x="18" y="129">+value: T (blocking)</text>
<text class="mono" x="18" y="150">+map(transform) DeferredValue~R~</text>
<text class="mono" x="18" y="171">+flatMap(transform) DeferredValue~R~</text>
</g>
<g transform="translate(297,544)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«factoryFunction»</text>
  <text class="label" x="170" y="61" text-anchor="middle">deferredValueOf</text>
  <text class="mono" x="18" y="108">+deferredValueOf(block) DeferredValue~T~</text>
</g>
<g transform="translate(707,544)">
  <rect class="card" x="0" y="0" width="340" height="259" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="170" y="61" text-anchor="middle">FlowExtensions</text>
  <text class="mono" x="18" y="108">+chunked(n) Flow~List~T~~</text>
<text class="mono" x="18" y="129">+windowed(size, step) Flow~List~T~~</text>
<text class="mono" x="18" y="150">+sliding(n) Flow~List~T~~</text>
<text class="mono" x="18" y="171">+mapParallel(parallelism, transform)</text>
<text class="mono" x="18" y="192">Flow~R~</text>
<text class="mono" x="18" y="213">+concatMapEager(transform) Flow~R~</text>
<text class="mono" x="18" y="234">+bufferingDebounce(timeout) Flow~List~T~~</text>
</g>
<g transform="translate(1117,544)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ReactorContextHelpers</text>
  <text class="mono" x="18" y="108">+currentReactiveContext() Context?</text>
<text class="mono" x="18" y="129">+Context.getOrNull(key) V?</text>
</g>
<g transform="translate(92,953)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="170" y="61" text-anchor="middle">DefaultCoroutineScope</text>
  <text class="mono" x="18" y="108">+coroutineContext: Dispatchers.Default +</text>
<text class="mono" x="18" y="129">SupervisorJob</text>
</g>
<g transform="translate(502,953)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="170" y="61" text-anchor="middle">IoCoroutineScope</text>
  <text class="mono" x="18" y="108">+coroutineContext: Dispatchers.IO +</text>
<text class="mono" x="18" y="129">SupervisorJob</text>
</g>
<g transform="translate(912,953)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ThreadPoolCoroutineScope</text>
  <text class="mono" x="18" y="108">+poolSize: Int</text>
<text class="mono" x="18" y="129">+name: String</text>
<text class="mono" x="18" y="150">+close()</text>
</g>
<g transform="translate(1322,953)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«class»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Virtual Thread Coroutine</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Scope</text>
  <text class="mono" x="18" y="124">+coroutineContext: VirtualThread</text>
<text class="mono" x="18" y="145">dispatcher + SupervisorJob</text>
</g>
