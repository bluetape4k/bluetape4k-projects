<svg xmlns="http://www.w3.org/2000/svg" width="1806" height="1510" viewBox="0 0 1806 1510" role="img" aria-label="Coroutine Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1806" height="1510"/>
<rect class="frame" x="32" y="28" width="1742" height="1454" rx="30"/>
<text class="title" x="68" y="84">Coroutine Class Structure 2</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="FlowExtensions" data-to="AsyncFlow" data-route-color="teal" d="M754 742 L754 829" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="inherit" data-from="VirtualThreadCoroutineScope" data-to="CoroutineScope" data-route-color="blue" d="M1336 398 L1336 271 L1063 271" stroke="#4F83BF"/>
<path class="inherit" data-from="ThreadPoolCoroutineScope" data-to="CoroutineScope" data-route-color="teal" d="M430 398 L430 271 L703 271" stroke="#2E8F89"/>
<path class="inherit" data-from="IoCoroutineScope" data-to="CoroutineScope" data-route-color="amber" d="M981 398 L981 303" stroke="#B9851B"/>
<path class="inherit" data-from="DefaultCoroutineScope" data-to="CoroutineScope" data-route-color="pink" d="M786 398 L786 303" stroke="#C94D68"/>
<path class="dependency" data-from="DeferredSupport" data-to="DeferredValue" data-route-color="indigo" d="M118 669 L90 669 L90 1051 L118 1051" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DeferredValue" data-to="deferredValueOf" data-route-color="coral" d="M298 1124 L298 1202" stroke="#C8644B" stroke-dasharray="8 7"/>
<g id="DeferredSupport">
  <rect class="classCard" x="118" y="596" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="298" y="615" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="643" text-anchor="middle">DeferredSupport</text>
  <line x1="118" y1="652" x2="478" y2="652" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="684">+zip(a, b, transform) Deferred~R~</text>
<text class="member" x="152" y="701">+awaitAny(vararg deferred) T</text>
<text class="member" x="152" y="718">+awaitAnyAndCancelOthers() T</text>
</g>
<g id="DeferredValue">
  <rect class="classCard" x="118" y="978" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="298" y="997" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="1025" text-anchor="middle">DeferredValue</text>
  <line x1="118" y1="1034" x2="478" y2="1034" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="152" y="1066">+await() T</text>
<text class="member" x="152" y="1083">+value: T (blocking)</text>
<text class="member" x="152" y="1100">+map(transform) DeferredValue~R~</text>
</g>
<g id="CoroutineScope">
  <rect class="classCard" x="703" y="165" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="883" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="883" y="212" text-anchor="middle">CoroutineScope</text>
  <line x1="703" y1="221" x2="1063" y2="221" stroke="#45A7A1" stroke-width="1.4"/>

</g>
<g id="AsyncFlow">
  <rect class="classCard" x="574" y="829" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="754" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="754" y="876" text-anchor="middle">AsyncFlow</text>
  <line x1="574" y1="885" x2="934" y2="885" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="608" y="922">+Flow.async(dispatcher, transform)</text>
<text class="member" x="608" y="939">Flow~R~</text>
</g>
<g id="deferredValueOf">
  <rect class="classCard" x="118" y="1202" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="298" y="1221" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="1249" text-anchor="middle">deferredValueOf</text>
  <line x1="118" y1="1258" x2="478" y2="1258" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="152" y="1295">+deferredValueOf(block)</text>
<text class="member" x="152" y="1312">DeferredValue~T~</text>
</g>
<g id="FlowExtensions">
  <rect class="classCard" x="574" y="596" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="754" y="615" text-anchor="middle">class</text>
  <text class="classTitle" x="754" y="643" text-anchor="middle">FlowExtensions</text>
  <line x1="574" y1="652" x2="934" y2="652" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="608" y="684">+chunked(n) Flow~List~T~~</text>
<text class="member" x="608" y="701">+windowed(size, step)</text>
<text class="member" x="608" y="718">Flow~List~T~~</text>
</g>
<g id="ReactorContextHelpers">
  <rect class="classCard" x="118" y="762" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="298" y="781" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="809" text-anchor="middle">ReactorContextHelpers</text>
  <line x1="118" y1="818" x2="478" y2="818" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="152" y="855">+currentReactiveContext() Context?</text>
<text class="member" x="152" y="872">+Context.getOrNull(key) V?</text>
</g>
<g id="ThreadPoolCoroutineScope">
  <rect class="classCard" x="118" y="398" width="360" height="146" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="298" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="436" text-anchor="middle">ThreadPoolCoroutine</text>
<text class="classTitle" x="298" y="458" text-anchor="middle">Scope</text>
  <line x1="118" y1="462" x2="478" y2="462" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="152" y="490">+poolSize: Int</text>
<text class="member" x="152" y="507">+name: String</text>
<text class="member" x="152" y="524">+close()</text>
</g>
<g id="DefaultCoroutineScope">
  <rect class="classCard" x="508" y="398" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">DefaultCoroutineScope</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="542" y="486">+coroutineContext:</text>
<text class="member" x="542" y="503">Dispatchers.Default</text>
<text class="member" x="542" y="520">+ SupervisorJob</text>
</g>
<g id="IoCoroutineScope">
  <rect class="classCard" x="898" y="398" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1078" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="445" text-anchor="middle">IoCoroutineScope</text>
  <line x1="898" y1="454" x2="1258" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="932" y="486">+coroutineContext: Dispatchers.IO</text>
<text class="member" x="932" y="503">+</text>
<text class="member" x="932" y="520">SupervisorJob</text>
</g>
<g id="VirtualThreadCoroutineScope">
  <rect class="classCard" x="1288" y="398" width="400" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1488" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1488" y="436" text-anchor="middle">VirtualThreadCoroutine</text>
<text class="classTitle" x="1488" y="458" text-anchor="middle">Scope</text>
  <line x1="1288" y1="462" x2="1688" y2="462" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1322" y="495">+coroutineContext: VirtualThread</text>
<text class="member" x="1322" y="512">dispatcher + SupervisorJob</text>
</g>
<g>
  <rect x="1391" y="1402" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1409 1420 L1467 1420" stroke="#3E9868"/>
  <text class="detail" x="1481" y="1425">inheritance / implementation</text>
  <path class="dependency" d="M1409 1441 L1467 1441" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1481" y="1446">dependency / usage</text>
</g>
<g><rect x="180" y="1420" width="1166" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="763" y="1446" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
