<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" role="img" aria-label="Domain Model">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1040" height="780"/>
<rect class="frame" x="32" y="28" width="976" height="724" rx="30"/>
<text class="title" x="68" y="84">Domain Model</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="Member" data-to="Team" data-route-color="green" d="M520 398 L520 303" stroke="#3E9868"/>
<g id="Member">
  <rect class="classCard" x="340" y="398" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="520" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="520" y="445" text-anchor="middle">Member</text>
  <line x1="340" y1="454" x2="700" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="374" y="486">Long id</text>
<text class="member" x="374" y="503">String name</text>
<text class="member" x="374" y="520">Int age</text>
</g>
<g id="Team">
  <rect class="classCard" x="340" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="520" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="520" y="212" text-anchor="middle">Team</text>
  <line x1="340" y1="221" x2="700" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="374" y="258">Long id</text>
<text class="member" x="374" y="275">String name</text>
</g>
<g>
  <rect x="625" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M643 690 L701 690" stroke="#3E9868"/>
  <text class="detail" x="715" y="695">inheritance / implementation</text>
  <path class="dependency" d="M643 711 L701 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="715" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="400" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="380" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
