ass="body" x="1897" y="301">Hibernate Reactive</text></g><g><rect class="card" x="270" y="545" width="445" height="185" rx="8" fill="#F0FDFA" stroke="#0D9488"/><rect class="icon" x="294" y="573" width="48" height="48" rx="8" fill="#fff" stroke="#0D9488"/><text class="iconText" x="318" y="605" text-anchor="middle" fill="#0D9488">U</text><text class="cardTitle" x="362" y="590">Mutiny Session Extensions</text><text class="body" x="362" y="623">findAs / getReferenceAs</text><text class="body" x="362" y="647">create*QueryAs</text><text class="body" x="362" y="671">EntityGraph / ResultSetMapping</text></g><g><rect class="card" x="855" y="545" width="445" height="185" rx="8" fill="#EFF6FF" stroke="#2563EB"/><rect class="icon" x="879" y="573" width="48" height="48" rx="8" fill="#fff" stroke="#2563EB"/><text class="iconText" x="903" y="605" text-anchor="middle" fill="#2563EB">C</text><text class="cardTitle" x="947" y="590">Stage Session Extensions</text><text class="body" x="947" y="623">same reified API shape</text><text class="body" x="947" y="647">CompletionStage return values</text><text class="body" x="947" y="671">native query overloads</text></g><g><rect class="card" x="1440" y="545" width="445" height="185" rx="8" fill="#FFF7ED" stroke="#EA580C"/><rect class="icon" x="1464" y="573" width="48" height="48" rx="8" fill="#fff" stroke="#EA580C"/><text class="iconText" x="1488" y="605" text-anchor="middle" fill="#EA580C">B</text><text class="cardTitle" x="1532" y="590">Stateless Extensions</text><text class="body" x="1532" y="623">getAs + typed queries</text><text class="body" x="1532" y="647">no first-level cache</text><text class="body" x="1532" y="671">Mutiny and Stage variants</text></g><g><rect class="card" x="600" y="875" width="500" height="180" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><rect class="icon" x="624" y="903" width="48" height="48" rx="8" fill="#fff" stroke="#7C3AED"/><text class="iconText" x="648" y="935" text-anchor="middle" fill="#7C3AED">K</text><text class="cardTitle" x="692" y="920">Coroutine Boundary</text><text class="body" x="692" y="953">withSessionSuspending</text><text class="body" x="692" y="977">withTransactionSuspending</text><text class="body" x="692" y="1001">CancellationException rethrow</text></g><g><rect class="card" x="1250" y="875" width="500" height="180" rx="8" fill="#ECFDF5" stroke="#16A34A"/><rect class="icon" x="1274" y="903" width="48" height="48" rx="8" fill="#fff" stroke="#16A34A"/><text class="iconText" x="1298" y="935" text-anchor="middle" fill="#16A34A">T</text><text class="cardTitle" x="1342" y="920">Tenant + Transaction Scope</text><text class="body" x="1342" y="953">tenant overloads</text><text class="body" x="1342" y="977">session + transaction callbacks</text><text class="body" x="1342" y="1001">stateless transaction helpers</text></g></svg>