A34A)"/></g><g><g transform="translate(499 220)"><rect width="122" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="61" y="18" text-anchor="middle">unwrap Mutiny</text></g><g transform="translate(788 365)"><rect width="114" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="57" y="18" text-anchor="middle">unwrap Stage</text></g><g transform="translate(1088 220)"><rect width="114" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="57" y="18" text-anchor="middle">parallel API</text></g><g transform="translate(1678 220)"><rect width="114" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="57" y="18" text-anchor="middle">reactive I/O</text></g><g transform="translate(605 415)"><rect width="130" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="65" y="18" text-anchor="middle">Mutiny session</text></g><g transform="translate(1199 415)"><rect width="122" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="61" y="18" text-anchor="middle">Stage session</text></g><g transform="translate(1505 460)"><rect width="90" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="45" y="18" text-anchor="middle">stateless</text></g><g transform="translate(625 760)"><rect width="90" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="45" y="18" text-anchor="middle">await Uni</text></g><g transform="translate(917 760)"><rect width="106" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="53" y="18" text-anchor="middle">await Stage</text></g><g transform="translate(1547 780)"><rect width="76" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="label" x="38" y="18" text-anchor="middle">scope</text></g></g><g><rect class="card" x="85" y="175" width="410" height="17