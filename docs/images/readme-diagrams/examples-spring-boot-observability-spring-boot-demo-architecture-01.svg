<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="820" viewBox="0 0 1420 820" role="img" aria-labelledby="examples-spring-boot-observability-spring-boot-demo-architecture-01-title examples-spring-boot-observability-spring-boot-demo-architecture-01-desc">
  <title id="examples-spring-boot-observability-spring-boot-demo-architecture-01-title">Spring Boot Observability Demo Architecture</title>
  <desc id="examples-spring-boot-observability-spring-boot-demo-architecture-01-desc">Actuator owns Prometheus export while bluetape4k wraps HTTP and event work.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="arrowNeutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
    </marker>
    <marker id="arrowRequest" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowService" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#45A7A1"/>
    </marker>
    <marker id="arrowEvent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#58A978"/>
    </marker>
    <marker id="arrowMetrics" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/>
    </marker>
    <marker id="arrowTrace" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8A72D6"/>
    </marker>
    <marker id="arrowResponse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#DC6B82"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .sequenceEdge{stroke-width:2.3;fill:none}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1420" height="820"/>
  <rect class="frame" x="32" y="28" width="1356" height="744" rx="26"/>
  <text class="title" x="66" y="82">Spring Boot Observability Demo Architecture</text>
  <text class="subtitle" x="70" y="116">Actuator owns Prometheus export while bluetape4k wraps HTTP and event work.</text>

  <g id="client-controller">
    <path class="edge" d="M300 425 L360 425" stroke="#5B8DEF" marker-end="url(#arrowRequest)"/>

  </g>

  <g id="controller-service">
    <path class="edge" d="M620 425 L690 425" stroke="#45A7A1" marker-end="url(#arrowService)"/>

  </g>

  <g id="service-observe-spring">
    <path class="edge" d="M830 360 L830 300" stroke="#45A7A1" marker-end="url(#arrowService)"/>

  </g>

  <g id="service-event-telemetry">
    <path class="edge" d="M830 490 L830 550" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="springObs-registry">
    <path class="edge" d="M970 235 L1000 235 L1000 410 L1040 410" stroke="#45A7A1" marker-end="url(#arrowService)"/>

  </g>

  <g id="eventObs-registry">
    <path class="edge" d="M970 615 L1000 615 L1000 440 L1040 440" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="registry-actuator">
    <path class="edge" d="M1190 360 L1190 300" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="registry-otlp">
    <path class="edge" d="M1190 490 L1190 550" stroke="#8A72D6" marker-end="url(#arrowTrace)" stroke-dasharray="8 7"/>

  </g>

  <g id="client">
    <rect class="card" x="70" y="360" width="230" height="130" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="cardTitle" x="185" y="396" text-anchor="middle" dominant-baseline="middle">HTTP Client</text>
    <text class="body" x="185" y="437" text-anchor="middle" dominant-baseline="middle">POST order event</text>
<text class="body" x="185" y="457" text-anchor="middle" dominant-baseline="middle">GET scrape output</text>
  </g>

  <g id="controller">
    <rect class="card" x="360" y="360" width="260" height="130" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="490" y="383" text-anchor="middle" dominant-baseline="middle">Spring MVC</text>
<text class="cardTitle" x="490" y="409" text-anchor="middle" dominant-baseline="middle">Controller</text>
    <text class="body" x="490" y="450" text-anchor="middle" dominant-baseline="middle">/orders/{orderId}/events</text>
<text class="body" x="490" y="470" text-anchor="middle" dominant-baseline="middle">X-Request-Id header</text>
  </g>

  <g id="service">
    <rect class="card" x="690" y="360" width="280" height="130" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="830" y="396" text-anchor="middle" dominant-baseline="middle">OrderEventService</text>
    <text class="body" x="830" y="437" text-anchor="middle" dominant-baseline="middle">local publish + consume</text>
<text class="body" x="830" y="457" text-anchor="middle" dominant-baseline="middle">returns accepted JSON</text>
  </g>

  <g id="springObs">
    <rect class="card" x="690" y="170" width="280" height="130" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="830" y="206" text-anchor="middle" dominant-baseline="middle">observeSpring</text>
    <text class="body" x="830" y="247" text-anchor="middle" dominant-baseline="middle">orders.http.publish</text>
<text class="body" x="830" y="267" text-anchor="middle" dominant-baseline="middle">HTTP/service boundary</text>
  </g>

  <g id="eventObs">
    <rect class="card" x="690" y="550" width="280" height="130" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="830" y="573" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="cardTitle" x="830" y="599" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <text class="body" x="830" y="640" text-anchor="middle" dominant-baseline="middle">event.publish</text>
<text class="body" x="830" y="660" text-anchor="middle" dominant-baseline="middle">event.consume</text>
  </g>

  <g id="registry">
    <rect class="card" x="1040" y="360" width="300" height="130" rx="16" fill="#FFFFFF" stroke="#758297"/>
    <text class="cardTitle" x="1190" y="396" text-anchor="middle" dominant-baseline="middle">ObservationRegistry</text>
    <text class="body" x="1190" y="437" text-anchor="middle" dominant-baseline="middle">Micrometer handlers</text>
<text class="body" x="1190" y="457" text-anchor="middle" dominant-baseline="middle">metrics + optional spans</text>
  </g>

  <g id="actuator">
    <rect class="card" x="1040" y="170" width="300" height="130" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="1190" y="193" text-anchor="middle" dominant-baseline="middle">Actuator</text>
<text class="cardTitle" x="1190" y="219" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
    <text class="body" x="1190" y="260" text-anchor="middle" dominant-baseline="middle">/actuator/prometheus</text>
<text class="body" x="1190" y="280" text-anchor="middle" dominant-baseline="middle">Spring owns endpoint</text>
  </g>

  <g id="otlp">
    <rect class="card" x="1040" y="550" width="300" height="130" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="1190" y="573" text-anchor="middle" dominant-baseline="middle">OTLP Collector</text>
<text class="cardTitle" x="1190" y="599" text-anchor="middle" dominant-baseline="middle">optional</text>
    <text class="body" x="1190" y="640" text-anchor="middle" dominant-baseline="middle">enabled by Spring config</text>
<text class="body" x="1190" y="660" text-anchor="middle" dominant-baseline="middle">not required for tests</text>
  </g>
  <text class="note" x="710" y="790" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
