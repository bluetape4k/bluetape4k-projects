<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">TinkEncryptor Class Hierarchy</title>
  <desc id="desc">UML class view of TinkEncryptor implementations, AEAD and deterministic AEAD wrappers, factories, and versioned keyset support.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .detail, .method, .legend, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 17px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .classBox { fill: #ffffff; stroke: #546e7a; stroke-width: 2.2; }
      .interfaceBox { fill: #eef7f0; stroke: #5d8b66; stroke-width: 2.4; }
      .implBox { fill: #eef5fa; stroke: #3f7d9c; stroke-width: 2.2; }
      .wrapperBox { fill: #fff7e8; stroke: #a97b3d; stroke-width: 2.2; }
      .factoryBox { fill: #f2eef9; stroke: #7b67a8; stroke-width: 2.2; }
      .versionBox { fill: #f9eef0; stroke: #b86868; stroke-width: 2.2; }
      .storeBox { fill: #f4f7f1; stroke: #6e8f4f; stroke-width: 2.2; }
      .className { font-family: "Architects Daughter"; font-size: 22px; fill: #1f3138; }
      .stereo { font-family: "Comic Mono"; font-size: 13px; fill: #566b73; }
      .detail { font-size: 13px; }
      .method { font-size: 12px; }
      .divider { stroke: #cfd9dd; stroke-width: 1.5; }
      .realize { fill: none; stroke: #3f7d9c; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#hollowTriangle); }
      .uses { fill: none; stroke: #7f6038; stroke-width: 2.5; marker-end: url(#openArrow); }
      .factory { fill: none; stroke: #7b67a8; stroke-width: 2.5; stroke-dasharray: 8 6; marker-end: url(#openFactory); }
      .keyset { fill: none; stroke: #55783f; stroke-width: 2.5; marker-end: url(#openStore); }
      .legend { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
    </style>
    <marker id="hollowTriangle" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6 L 1 11 Z" fill="#fbfcf8" stroke="#3f7d9c" stroke-width="2" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#7f6038" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openFactory" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#7b67a8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openStore" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#55783f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">TinkEncryptor Class Hierarchy</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">AEAD and deterministic AEAD share the public encryptor contract; versioned wrappers add key rotation without changing ciphertext readers.</text>

  <g id="tink-encryptor">
    <rect x="630" y="145" width="340" height="185" rx="10" class="interfaceBox"/>
    <text x="800" y="174" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
    <text x="800" y="203" text-anchor="middle" class="className">TinkEncryptor</text>
    <line x1="630" y1="224" x2="970" y2="224" class="divider"/>
    <text x="652" y="251" class="method">+ encrypt(ByteArray): ByteArray</text>
    <text x="652" y="273" class="method">+ decrypt(ByteArray): ByteArray</text>
    <text x="652" y="295" class="method">+ encrypt(String): String</text>
    <text x="652" y="317" class="method">+ decrypt(String): String</text>
  </g>

  <g id="tink-encryptors">
    <rect x="72" y="360" width="240" height="150" rx="10" class="factoryBox"/>
    <text x="192" y="392" text-anchor="middle" class="className">TinkEncryptors</text>
    <line x1="72" y1="412" x2="312" y2="412" class="divider"/>
    <text x="94" y="438" class="method">+ AES256_GCM</text>
    <text x="94" y="460" class="method">+ CHACHA20_POLY1305</text>
    <text x="94" y="482" class="method">+ DETERMINISTIC_AES256_SIV</text>
  </g>

  <g id="aead-impl">
    <rect x="358" y="390" width="340" height="150" rx="10" class="implBox"/>
    <text x="528" y="424" text-anchor="middle" class="className">TinkAeadEncryptor</text>
    <line x1="358" y1="445" x2="698" y2="445" class="divider"/>
    <text x="380" y="472" class="method">- aead: TinkAead</text>
    <line x1="358" y1="488" x2="698" y2="488" class="divider"/>
    <text x="380" y="514" class="method">+ randomized AEAD String/bytes API</text>
  </g>

  <g id="daead-impl">
    <rect x="902" y="390" width="340" height="150" rx="10" class="implBox"/>
    <text x="1072" y="424" text-anchor="middle" class="className">TinkDaeadEncryptor</text>
    <line x1="902" y1="445" x2="1242" y2="445" class="divider"/>
    <text x="924" y="472" class="method">- daead: TinkDeterministicAead</text>
    <line x1="902" y1="488" x2="1242" y2="488" class="divider"/>
    <text x="924" y="514" class="method">+ deterministic searchable fields</text>
  </g>

  <g id="tink-aeads">
    <rect x="72" y="630" width="240" height="140" rx="10" class="factoryBox"/>
    <text x="192" y="662" text-anchor="middle" class="className">TinkAeads</text>
    <line x1="72" y1="682" x2="312" y2="682" class="divider"/>
    <text x="94" y="708" class="method">+ AES256_GCM</text>
    <text x="94" y="730" class="method">+ AES128_GCM</text>
    <text x="94" y="752" class="method">+ versioned(store)</text>
  </g>

  <g id="tink-aead">
    <rect x="358" y="640" width="340" height="150" rx="10" class="wrapperBox"/>
    <text x="528" y="674" text-anchor="middle" class="className">TinkAead</text>
    <line x1="358" y1="695" x2="698" y2="695" class="divider"/>
    <text x="380" y="722" class="method">- aead: Aead by lazy KeysetHandle</text>
    <line x1="358" y1="738" x2="698" y2="738" class="divider"/>
    <text x="380" y="764" class="method">+ encrypt/decrypt(bytes, associatedData)</text>
  </g>

  <g id="tink-daead">
    <rect x="902" y="640" width="340" height="150" rx="10" class="wrapperBox"/>
    <text x="1072" y="674" text-anchor="middle" class="className">TinkDeterministicAead</text>
    <line x1="902" y1="695" x2="1242" y2="695" class="divider"/>
    <text x="924" y="722" class="method">- daead: DeterministicAead by lazy</text>
    <line x1="902" y1="738" x2="1242" y2="738" class="divider"/>
    <text x="924" y="764" class="method">+ encryptDeterministically(...)</text>
  </g>

  <g id="tink-daeads">
    <rect x="1288" y="630" width="240" height="140" rx="10" class="factoryBox"/>
    <text x="1408" y="662" text-anchor="middle" class="className">TinkDaeads</text>
    <line x1="1288" y1="682" x2="1528" y2="682" class="divider"/>
    <text x="1310" y="708" class="method">+ AES256_SIV</text>
    <text x="1310" y="730" class="method">+ versioned(store)</text>
    <text x="1310" y="752" class="method">+ registerTink()</text>
  </g>

  <g id="versioned-aead">
    <rect x="232" y="868" width="330" height="130" rx="10" class="versionBox"/>
    <text x="397" y="900" text-anchor="middle" class="className">VersionedTinkAead</text>
    <line x1="232" y1="920" x2="562" y2="920" class="divider"/>
    <text x="254" y="946" class="method">+ current/rotate/rotateIfDue()</text>
    <text x="254" y="968" class="method">+ pack version + ciphertext</text>
  </g>

  <g id="keyset-store">
    <rect x="620" y="850" width="360" height="160" rx="10" class="storeBox"/>
    <text x="800" y="881" text-anchor="middle" class="stereo">&lt;&lt;interface&gt;&gt;</text>
    <text x="800" y="910" text-anchor="middle" class="className">VersionedKeysetStore</text>
    <line x1="620" y1="932" x2="980" y2="932" class="divider"/>
    <text x="642" y="958" class="method">+ current(): VersionedKeysetHandle</text>
    <text x="642" y="980" class="method">+ find(version): VersionedKeysetHandle?</text>
    <text x="642" y="1002" class="method">+ rotateIfDue(Duration)</text>
  </g>

  <g id="versioned-daead">
    <rect x="1038" y="868" width="330" height="130" rx="10" class="versionBox"/>
    <text x="1203" y="900" text-anchor="middle" class="className">VersionedTinkDaead</text>
    <line x1="1038" y1="920" x2="1368" y2="920" class="divider"/>
    <text x="1060" y="946" class="method">+ same version => same ciphertext</text>
    <text x="1060" y="968" class="method">+ old versions still decrypt</text>
  </g>

  <path class="realize" d="M 528 390 L 528 364 Q 528 350 542 350 L 731 350 Q 735 350 735 346 L 735 330" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polygon points="741,342 735,330 729,342" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="realize" d="M 1072 390 L 1072 364 Q 1072 350 1058 350 L 869 350 Q 865 350 865 346 L 865 330" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polygon points="871,342 865,330 859,342" fill="#3f7d9c" stroke="#3f7d9c" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="factory" d="M 312 435 L 358 435" style="marker-end:none"/>
<polyline points="346,441 358,435 346,429" fill="none" stroke="#7b67a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="factory" d="M 312 700 L 358 700" style="marker-end:none"/>
<polyline points="346,706 358,700 346,694" fill="none" stroke="#7b67a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="factory" d="M 1288 700 L 1242 700" style="marker-end:none"/>
<polyline points="1254,694 1242,700 1254,706" fill="none" stroke="#7b67a8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="uses" d="M 528 540 L 528 640"/>
  <path class="uses" d="M 1072 540 L 1072 640"/>
  <path class="uses" d="M 397 868 L 397 839 Q 397 825 411 825 L 515 825 Q 528 825 528 812 L 528 790" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="uses" d="M 1203 868 L 1203 839 Q 1203 825 1189 825 L 1085 825 Q 1072 825 1072 812 L 1072 790" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="keyset" d="M 562 933 L 620 933"/>
  <path class="keyset" d="M 1038 933 L 980 933"/>

  <g>
    <rect x="92" y="1030" width="1416" height="34" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="1.6"/>
    <text x="116" y="1052" class="legend">Dashed hollow triangle = implements. Open arrows = wrapper/use or factory creation. Versioned wrappers prepend an 8-byte keyset version before ciphertext.</text>
  </g>
  <text x="800" y="1088" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/tink README</text>
</svg>
