<svg data-intent="Show Ktor observability installation as components around CallId, CallLogging, Micrometer, Prometheus routes, and optional OpenTelemetry tracing." data-evidence="ktor/observability/README.md; ktor/observability/src/main/kotlin/io/bluetape4k/ktor/observability" data-source-read="ktor/observability/README.md; ktor/observability/src/main/kotlin/io/bluetape4k/ktor/observability" xmlns="http://www.w3.org/2000/svg" width="1440" height="905" viewBox="0 0 1440 905" role="img" aria-label="Ktor Observability Components">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="905"/>
<rect class="frame" x="34" y="30" width="1372" height="845" rx="8"/>
<text class="title" x="72" y="84">Ktor Observability Components</text>
<text class="subtitle" x="76" y="116">Observability stays explicit: application-owned registries feed Ktor plugins and export through Prometheus or OpenTelemetry backends.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="145" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Application-owned telemetry inputs</text></g>
<g><rect class="panel" x="82" y="375" width="1276" height="230" rx="8"/><text class="panelTitle" x="110" y="411" dominant-baseline="middle">Ktor observability module</text></g>
<g><rect class="panel" x="82" y="680" width="1276" height="145" rx="8"/><text class="panelTitle" x="110" y="716" dominant-baseline="middle">Backends</text></g>
<g id="app">
  <rect class="card" x="115" y="215" width="340" height="70" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="285" y="243" text-anchor="middle" dominant-baseline="middle">Application config</text>
  <text class="detail" x="285" y="273" text-anchor="middle" dominant-baseline="middle">service name, registry, OTel toggle</text>
</g>
<g id="registry">
  <rect class="card" x="570" y="215" width="300" height="70" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="720" y="243" text-anchor="middle" dominant-baseline="middle">MeterRegistry / tracer</text>
  <text class="detail" x="720" y="273" text-anchor="middle" dominant-baseline="middle">owned by application</text>
</g>
<g id="installer">
  <rect class="card" x="1000" y="215" width="270" height="70" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1135" y="243" text-anchor="middle" dominant-baseline="middle">installObservability</text>
  <text class="detail" x="1135" y="273" text-anchor="middle" dominant-baseline="middle">applies selected plugins</text>
</g>
<g id="callId">
  <rect class="card" x="90" y="445" width="330" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="255" y="482" text-anchor="middle" dominant-baseline="middle">CallId</text>
  <text class="detail" x="255" y="512" text-anchor="middle" dominant-baseline="middle">correlation id extraction/generation</text>
</g>
<g id="logging">
  <rect class="card" x="430" y="445" width="260" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="560" y="482" text-anchor="middle" dominant-baseline="middle">CallLogging + MDC</text>
  <text class="detail" x="560" y="512" text-anchor="middle" dominant-baseline="middle">structured request logging</text>
</g>
<g id="metrics">
  <rect class="card" x="735" y="445" width="260" height="88" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="865" y="482" text-anchor="middle" dominant-baseline="middle">MicrometerMetrics</text>
  <text class="detail" x="865" y="512" text-anchor="middle" dominant-baseline="middle">HTTP server metrics</text>
</g>
<g id="tracing">
  <rect class="card" x="1020" y="445" width="300" height="88" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1170" y="482" text-anchor="middle" dominant-baseline="middle">KtorServerTelemetry</text>
  <text class="detail" x="1170" y="512" text-anchor="middle" dominant-baseline="middle">optional OpenTelemetry traces</text>
</g>
<g id="prom">
  <rect class="card" x="265" y="720" width="300" height="66" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="415" y="746" text-anchor="middle" dominant-baseline="middle">Prometheus scrape route</text>
  <text class="detail" x="415" y="776" text-anchor="middle" dominant-baseline="middle">/metrics</text>
</g>
<g id="otel">
  <rect class="card" x="875" y="720" width="300" height="66" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1025" y="746" text-anchor="middle" dominant-baseline="middle">OpenTelemetry exporter</text>
  <text class="detail" x="1025" y="776" text-anchor="middle" dominant-baseline="middle">configured outside module</text>
</g>
<path class="route" data-from="app" data-to="installer" d="M285 215 L285 190 L1135 190 L1135 215" stroke="#1D4ED8"/>
<path class="route" data-from="registry" data-to="metrics" d="M720 285 L865 445" stroke="#BE185D"/>
<path class="route" data-from="installer" data-to="callId" d="M1025 285 L255 445" stroke="#0F766E"/>
<path class="route" data-from="installer" data-to="logging" d="M1095 285 L560 445" stroke="#C2410C"/>
<path class="route" data-from="installer" data-to="metrics" d="M1165 285 L865 445" stroke="#BE185D"/>
<path class="route" data-from="installer" data-to="tracing" d="M1235 285 L1170 445" stroke="#7E22CE"/>
<path class="route" data-from="metrics" data-to="prom" d="M865 533 L865 630 L415 630 L415 720" stroke="#15803D"/>
<path class="route" data-from="tracing" data-to="otel" d="M1170 533 L1170 635 L1025 635 L1025 720" stroke="#7E22CE"/>
</svg>
