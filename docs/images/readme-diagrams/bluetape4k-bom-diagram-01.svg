<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-label="bluetape4k-bom Gradle platform constraint map">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L20 9 L2 16 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-teal" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L20 9 L2 16 Z" fill="#0d9488"/>
    </marker>
    <marker id="arrow-green" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L20 9 L2 16 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" markerWidth="22" markerHeight="18" refX="20" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L20 9 L2 16 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray-open" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 L14 7 L2 12" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #475569; }
      .band { fill: #ffffff; stroke: #dbe3ef; stroke-width: 1.5; }
      .bandLabel { font-family: "Comic Mono"; font-size: 13px; fill: #64748b; font-weight: 700; letter-spacing: .04em; }
      .card { stroke-width: 2; filter: url(#softShadow); }
      .cardTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #0f172a; }
      .smallTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .detail { font-family: "Comic Mono"; font-size: 14px; fill: #475569; }
      .tiny { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .code { font-family: "Comic Mono"; font-size: 14px; fill: #334155; }
      .routeBlue { fill: none; stroke: #2563eb; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .routeTeal { fill: none; stroke: #0d9488; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-teal); }
      .routeGreen { fill: none; stroke: #16a34a; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .routeAmber { fill: none; stroke: #ea580c; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-amber); }
      .routeGray { fill: none; stroke: #64748b; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#arrow-gray-open); }

    .syntax-keyword{fill:#7E22CE}.syntax-type{fill:#0F766E}.syntax-function{fill:#1D4ED8}.syntax-string{fill:#B45309}.syntax-number{fill:#C2410C}.syntax-comment{fill:#64748B}.syntax-operator{fill:#BE123C}</style>
  </defs>

  <rect class="canvas" width="1680" height="1120"/>
  <rect class="frame" x="38" y="32" width="1604" height="1056" rx="10"/>
  <text class="title" x="78" y="92">bluetape4k-bom Platform Constraints</text>
  <text class="subtitle" x="82" y="124">A java-platform BOM publishes dependencyManagement constraints only; it does not contain runtime classes.</text>

  <rect class="band" x="76" y="166" width="1528" height="206" rx="8"/>
  <text class="bandLabel" x="102" y="198">CONSUMER IMPORT PATHS</text>
  <rect class="band" x="76" y="446" width="1528" height="292" rx="8"/>
  <text class="bandLabel" x="102" y="478">GRADLE PLATFORM CONTRACT</text>
  <rect class="band" x="76" y="810" width="1528" height="202" rx="8"/>
  <text class="bandLabel" x="102" y="842">MODULE FAMILIES MANAGED BY CONSTRAINTS</text>

  <g>
    <rect class="card" x="126" y="224" width="360" height="104" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="306" y="263" text-anchor="middle">Application build</text>
    <text class="detail" x="306" y="292" text-anchor="middle">imports a Maven BOM</text>
    <text class="tiny" x="306" y="309" text-anchor="middle">Gradle platform() or</text>
    <text class="tiny" x="306" y="325" text-anchor="middle">Maven dependencyManagement</text>
  </g>

  <g>
    <rect class="card" x="660" y="214" width="360" height="126" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="840" y="254" text-anchor="middle">bluetape4k-dependencies</text>
    <text class="detail" x="840" y="284" text-anchor="middle">aggregator BOM</text>
    <text class="tiny" x="840" y="307" text-anchor="middle">imports foundation + split-repo BOMs</text>
  </g>

  <g>
    <rect class="card" x="1194" y="224" width="360" height="104" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="1374" y="263" text-anchor="middle">Direct import</text>
    <text class="detail" x="1374" y="292" text-anchor="middle">io.github.bluetape4k:bluetape4k-bom</text>
    <text class="tiny" x="1374" y="315" text-anchor="middle">use when only projects modules are needed</text>
  </g>

  <path class="routeTeal" data-connector="consumer-to-aggregator" d="M486 276 L660 276"/>

  <g>
    <rect class="card" x="500" y="512" width="680" height="160" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="840" y="552" text-anchor="middle">bluetape4k-bom</text>
    <text class="detail" x="840" y="582" text-anchor="middle">Gradle java-platform publication</text>
    <text class="code" data-code-snippet="gradle-kotlin" x="548" y="620">constraints { rootProject.subprojects ... <tspan class="syntax-function">api</tspan>(<tspan class="syntax-keyword">this</tspan>) }</text>
    <text class="tiny" x="548" y="648">Published output: POM dependencyManagement entries, not jars or runtime beans.</text>
  </g>

  <g>
    <rect class="card" x="124" y="528" width="284" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text class="smallTitle" x="266" y="567" text-anchor="middle">Excluded projects</text>
    <text class="detail" x="266" y="598" text-anchor="middle">self: bluetape4k-bom</text>
    <text class="detail" x="266" y="624" text-anchor="middle">*-demo, examples/*</text>
    <text class="detail" x="266" y="650" text-anchor="middle">workshop/*</text>
  </g>

  <g>
    <rect class="card" x="1272" y="528" width="284" height="128" rx="8" fill="#fdf2f8" stroke="#db2777"/>
    <text class="smallTitle" x="1414" y="567" text-anchor="middle">Consumer result</text>
    <text class="detail" x="1414" y="598" text-anchor="middle">versionless dependencies</text>
    <text class="detail" x="1414" y="624" text-anchor="middle">resolved from BOM constraints</text>
    <text class="detail" x="1414" y="650" text-anchor="middle">no runtime classpath entry</text>
  </g>

  <path class="routeTeal" data-connector="aggregator-to-platform" d="M840 340 L840 512"/>
  <path class="routeAmber" data-connector="direct-import-to-platform" d="M 1374 328 L 1374 406 Q 1374 420 1360 420 L 962 420 Q 948 420 948 434 L 948 512"/>
  <path class="routeGray" data-connector="platform-to-exclusions" d="M500 592 L408 592" style="marker-end:none"/>
<polyline points="420,586 408,592 420,598" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="routeGreen" data-connector="platform-to-consumer" d="M1180 592 L1272 592"/>

  <g>
    <rect class="card" x="126" y="874" width="202" height="82" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="smallTitle" x="227" y="906" text-anchor="middle">bluetape4k/*</text>
    <text class="detail" x="227" y="928" text-anchor="middle">core, coroutines</text>
    <text class="detail" x="227" y="946" text-anchor="middle">logging</text>
  </g>
  <g>
    <rect class="card" x="364" y="874" width="202" height="82" rx="8" fill="#fdf2f8" stroke="#db2777"/>
    <text class="smallTitle" x="465" y="906" text-anchor="middle">data/* + cache/*</text>
    <text class="detail" x="465" y="928" text-anchor="middle">JDBC, R2DBC</text>
    <text class="detail" x="465" y="946" text-anchor="middle">JCache</text>
  </g>
  <g>
    <rect class="card" x="602" y="874" width="202" height="82" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="smallTitle" x="703" y="906" text-anchor="middle">infra/*</text>
    <text class="detail" x="703" y="934" text-anchor="middle">Redis, Kafka, OTel</text>
  </g>
  <g>
    <rect class="card" x="840" y="874" width="202" height="82" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="smallTitle" x="941" y="906" text-anchor="middle">io/*</text>
    <text class="detail" x="941" y="934" text-anchor="middle">HTTP, gRPC, JSON</text>
  </g>
  <g>
    <rect class="card" x="1078" y="874" width="202" height="82" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="smallTitle" x="1179" y="906" text-anchor="middle">spring-boot/*</text>
    <text class="detail" x="1179" y="928" text-anchor="middle">auto-config</text>
    <text class="detail" x="1179" y="946" text-anchor="middle">modules</text>
  </g>
  <g>
    <rect class="card" x="1316" y="874" width="202" height="82" rx="8" fill="#f7fee7" stroke="#65a30d"/>
    <text class="smallTitle" x="1417" y="906" text-anchor="middle">testing/utils/vt</text>
    <text class="detail" x="1417" y="928" text-anchor="middle">test, utilities</text>
    <text class="detail" x="1417" y="946" text-anchor="middle">JDKs</text>
  </g>

  <path class="routeGreen" data-connector="platform-to-foundation" d="M 560 672 Q 560 780 227 874"/>
  <path class="routeGreen" data-connector="platform-to-data-cache" d="M 680 672 Q 680 780 465 874"/>
  <path class="routeGreen" data-connector="platform-to-infra" d="M 800 672 Q 800 780 703 874"/>
  <path class="routeGreen" data-connector="platform-to-io" d="M 880 672 Q 880 780 941 874"/>
  <path class="routeGreen" data-connector="platform-to-spring" d="M 1000 672 Q 1000 780 1179 874"/>
  <path class="routeGreen" data-connector="platform-to-support" d="M 1120 672 Q 1120 780 1417 874"/>
</svg>
