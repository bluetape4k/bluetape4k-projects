<path class="dependency" data-from="MultithreadingTester" data-to="SuspendedJobTester" d="M891 372 L891 465 L881 465 L881 558" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="TempFolderExtension" data-to="TempFolder" d="M1552 372 L1552 558" stroke="#755BC6" stroke-dasharray="8 7"/>
