<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1060" viewBox="0 0 1754 1060" role="img" aria-label="Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1060"/>
<rect class="frame" x="32" y="28" width="1690" height="1004" rx="28"/>
<text class="title" x="66" y="82">Class Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M672 438 C672 542 1082 542 1082 646"/>
<path class="line" d="M1082 380 C1082 409 1082 409 1082 438"/>
<path class="line" d="M877 728 C877 699 1492 699 1492 670"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Fakers</text>
  <text class="mono" x="18" y="108">+randomString(min, max) String</text>
<text class="mono" x="18" y="132">+fixedString(length) String</text>
<text class="mono" x="18" y="156">+numberString(pattern) String</text>
<text class="mono" x="18" y="180">+randomUuid() String</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">FakeValueExtension</text>
  <text class="mono" x="18" y="108">+beforeEach(context)</text>
<text class="mono" x="18" y="132">+resolveParameter(context) Any</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">MultithreadingTester</text>
  <text class="mono" x="18" y="108">+workers(n) MultithreadingTester</text>
<text class="mono" x="18" y="132">+rounds(n) MultithreadingTester</text>
<text class="mono" x="18" y="156">+add(block) MultithreadingTester</text>
<text class="mono" x="18" y="180">+run()</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">OutputCapturer</text>
  <text class="mono" x="18" y="108">+capture() String</text>
<text class="mono" x="18" y="132">+expect(block)</text>
</g>
<g transform="translate(92,446)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">StopwatchExtension</text>
  <text class="mono" x="18" y="108">+beforeEach(context)</text>
<text class="mono" x="18" y="132">+afterEach(context)</text>
</g>
<g transform="translate(502,446)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopeTester</text>
  <text class="mono" x="18" y="108">+rounds(n) StructuredTaskScopeTester</text>
<text class="mono" x="18" y="132">+add(block) StructuredTaskScopeTester</text>
<text class="mono" x="18" y="156">+withTimeout(duration) StructuredTaskScopeTester</text>
<text class="mono" x="18" y="180">+run()</text>
</g>
<g transform="translate(912,446)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedJobTester</text>
  <text class="mono" x="18" y="108">+workers(n) SuspendedJobTester</text>
<text class="mono" x="18" y="132">+rounds(n) SuspendedJobTester</text>
<text class="mono" x="18" y="156">+add(block) SuspendedJobTester</text>
<text class="mono" x="18" y="180">+run()</text>
</g>
<g transform="translate(1322,446)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">TempFolder</text>
  <text class="mono" x="18" y="108">+root: File</text>
<text class="mono" x="18" y="132">+rootPath: String</text>
<text class="mono" x="18" y="156">+createFile(name) File</text>
<text class="mono" x="18" y="180">+createDirectory(name) File</text>
<text class="mono" x="18" y="204">+close()</text>
</g>
<g transform="translate(707,736)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">TempFolderExtension</text>
  <text class="mono" x="18" y="108">+beforeEach(context)</text>
<text class="mono" x="18" y="132">+afterEach(context)</text>
<text class="mono" x="18" y="156">+resolveParameter(context) TempFolder</text>
</g>
<rect x="1126.5" y="684" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1184.5" y="702" text-anchor="middle">provides</text>
<rect x="1024" y="394" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="1082" y="412" text-anchor="middle">similar API</text>
<rect x="819" y="527" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="877" y="545" text-anchor="middle">similar API</text>
</svg>
