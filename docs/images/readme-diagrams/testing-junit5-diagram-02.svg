<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1386" viewBox="0 0 1500 1386" role="img" aria-label="Junit5 Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1386"/>
<rect class="frame" x="32" y="28" width="1436" height="1330" rx="30"/>
<text class="title" x="68" y="84">Junit5 Class Structure 2</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="StructuredTaskScopeTester" data-to="SuspendedJobTester" data-route-color="teal" d="M430 303 L430 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MultithreadingTester" data-to="SuspendedJobTester" data-route-color="amber" d="M620 311 L620 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="TempFolderExtension" data-to="TempFolder" data-route-color="pink" d="M1173 311 L1173 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<g id="StructuredTaskScopeTester">
  <rect class="classCard" x="147" y="165" width="380" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="337" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="337" y="212" text-anchor="middle">StructuredTaskScopeTester</text>
  <line x1="147" y1="221" x2="527" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="181" y="258">+rounds(n)</text>
<text class="member" x="181" y="275">+add(block)</text>
</g>
<g id="SuspendedJobTester">
  <rect class="classCard" x="342" y="398" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="522" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="522" y="445" text-anchor="middle">SuspendedJobTester</text>
  <line x1="342" y1="454" x2="702" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="376" y="486">+workers(n) SuspendedJobTester</text>
<text class="member" x="376" y="503">+rounds(n) SuspendedJobTester</text>
<text class="member" x="376" y="520">+add(block) SuspendedJobTester</text>
</g>
<g id="MultithreadingTester">
  <rect class="classCard" x="537" y="165" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="717" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="212" text-anchor="middle">MultithreadingTester</text>
  <line x1="537" y1="221" x2="897" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="571" y="253">+workers(n) MultithreadingTester</text>
<text class="member" x="571" y="270">+rounds(n) MultithreadingTester</text>
<text class="member" x="571" y="287">+add(block) MultithreadingTester</text>
</g>
<g id="TempFolder">
  <rect class="classCard" x="993" y="398" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1173" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="445" text-anchor="middle">TempFolder</text>
  <line x1="993" y1="454" x2="1353" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1027" y="486">+root: File</text>
<text class="member" x="1027" y="503">+rootPath: String</text>
<text class="member" x="1027" y="520">+createFile(name) File</text>
</g>
<g id="FakeValueExtension">
  <rect class="classCard" x="993" y="572" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1173" y="591" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="619" text-anchor="middle">FakeValueExtension</text>
  <line x1="993" y1="628" x2="1353" y2="628" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1027" y="665">+beforeEach(context)</text>
<text class="member" x="1027" y="682">+resolveParameter(context) Any</text>
</g>
<g id="TempFolderExtension">
  <rect class="classCard" x="993" y="165" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1173" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="212" text-anchor="middle">TempFolderExtension</text>
  <line x1="993" y1="221" x2="1353" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1027" y="253">+beforeEach(context)</text>
<text class="member" x="1027" y="270">+afterEach(context)</text>
<text class="member" x="1027" y="287">+resolveParameter(context)</text>
</g>
<g id="Fakers">
  <rect class="classCard" x="993" y="738" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1173" y="757" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="785" text-anchor="middle">Fakers</text>
  <line x1="993" y1="794" x2="1353" y2="794" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1027" y="826">+randomString(min, max) String</text>
<text class="member" x="1027" y="843">+fixedString(length) String</text>
<text class="member" x="1027" y="860">+numberString(pattern) String</text>
</g>
<g id="OutputCapturer">
  <rect class="classCard" x="993" y="912" width="360" height="138" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1173" y="931" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="959" text-anchor="middle">OutputCapturer</text>
  <line x1="993" y1="968" x2="1353" y2="968" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1027" y="1005">+capture() String</text>
<text class="member" x="1027" y="1022">+expect(block)</text>
</g>
<g id="StopwatchExtension">
  <rect class="classCard" x="993" y="1078" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1173" y="1097" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="1125" text-anchor="middle">StopwatchExtension</text>
  <line x1="993" y1="1134" x2="1353" y2="1134" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="1027" y="1171">+beforeEach(context)</text>
<text class="member" x="1027" y="1188">+afterEach(context)</text>
</g>
<g>
  <rect x="1085" y="1278" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1296 L1161 1296" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1301">inheritance / implementation</text>
  <path class="dependency" d="M1103 1317 L1161 1317" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1322">dependency / usage</text>
</g>
<g><rect x="180" y="1296" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1322" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
