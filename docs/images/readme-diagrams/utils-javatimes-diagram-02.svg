  <line x1="1483" y1="454" x2="1843" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1517" y="486">+start: ZonedDateTime</text>
<text class="member" x="1517" y="503">+duration: Duration</text>
