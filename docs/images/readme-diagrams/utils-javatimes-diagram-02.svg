<g id="iPeriod">
  <rect class="card" x="900" y="150" width="400" height="150" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="stereo" x="1100" y="180" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="1100" y="208" text-anchor="middle">ITimePeriod</text>
  <line class="divider" x1="918" y1="222" x2="1282" y2="222" />
  <text class="member" x="926" y="238">+ start / end</text>
  <text class="member" x="926" y="258">+ duration</text>
  <text class="member" x="926" y="278">+ move(offset)</text>
  <text class="member" x="926" y="298">+ relation helpers</text>
</g>
<g id="timePeriod">
  <rect class="card" x="900" y="390" width="400" height="155" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereo" x="1100" y="420" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="cardTitle" x="1100" y="448" text-anchor="middle">TimePeriod</text>
  <line class="divider" x1="918" y1="462" x2="1282" y2="462" />
  <text class="member" x="926" y="478">- _start / _end</text>
  <text class="member" x="926" y="498">+ setup(start, end)</text>
  <text class="member" x="926" y="518">+ copy(offset)</text>
  <text class="member" x="926" y="538">+ reset()</text>
</g>
<g id="iBlock">
