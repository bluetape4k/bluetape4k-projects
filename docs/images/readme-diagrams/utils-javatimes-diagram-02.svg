  <rect class="card" x="210" y="670" width="400" height="155" rx="8" fill="#ECFDF5" stroke="#16A34A" />
  <text class="stereo" x="410" y="700" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="cardTitle" x="410" y="728" text-anchor="middle">TimeBlock</text>
  <line class="divider" x1="228" y1="742" x2="592" y2="742" />
  <text class="member" x="236" y="758">start + duration model</text>
  <text class="member" x="236" y="778">updates end from duration</text>
  <text class="member" x="236" y="798">readonly AnyTime support</text>
</g>
<g id="timeRange">
  <rect class="card" x="1590" y="670" width="400" height="155" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="stereo" x="1790" y="700" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="cardTitle" x="1790" y="728" text-anchor="middle">TimeRange</text>
  <line class="divider" x1="1608" y1="742" x2="1972" y2="742" />
  <text class="member" x="1616" y="758">start + end model</text>
  <text class="member" x="1616" y="778">expand / shrink boundaries</text>
  <text class="member" x="1616" y="798">copy with offset</text>
</g>
<g id="iContainer">
  <rect class="card" x="900" y="670" width="400" height="155" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereo" x="1100" y="700" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="1100" y="728" text-anchor="middle">ITimePeriodContainer</text>
  <line class="divider" x1="918" y1="742" x2="1282" y2="742" />
  <text class="member" x="926" y="758">extends ITimePeriod</text>
  <text class="member" x="926" y="778">MutableList&lt;ITimePeriod&gt;</text>
  <text class="member" x="926" y="798">+ sortByStart/End</text>
  <text class="member" x="926" y="818">+ containsPeriod()</text>
</g>
<g id="container">
  <rect class="card" x="900" y="910" width="400" height="155" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereo" x="1100" y="940" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="cardTitle" x="1100" y="968" text-anchor="middle">TimePeriodContainer</text>
  <line class="divider" x1="918" y1="982" x2="1282" y2="982" />
  <text class="member" x="926" y="998">extends TimePeriod</text>
  <text class="member" x="926" y="1018">delegates MutableList</text>
  <text class="member" x="926" y="1038">start=min / end=max</text>
  <text class="member" x="926" y="1058">move() shifts all periods</text>
</g>
<g id="iCollection">
