  <text class="stereo" x="600" y="1115" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="600" y="1143" text-anchor="middle">ITimePeriodCollection</text>
  <line class="divider" x1="438" y1="1157" x2="762" y2="1157" />
  <text class="member" x="446" y="1173">inside / overlap</text>
  <text class="member" x="446" y="1193">intersection / relation</text>
</g>
<g id="iChain">
  <rect class="card" x="1420" y="1085" width="360" height="135" rx="8" fill="#FAF5FF" stroke="#9333EA" />
  <text class="stereo" x="1600" y="1115" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="1600" y="1143" text-anchor="middle">ITimePeriodChain</text>
  <line class="divider" x1="1438" y1="1157" x2="1762" y2="1157" />
  <text class="member" x="1446" y="1173">head / last</text>
  <text class="member" x="1446" y="1193">assertSpaceBefore/After</text>
</g>
