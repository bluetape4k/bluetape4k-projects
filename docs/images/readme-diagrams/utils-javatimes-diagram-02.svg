  <text class="stereo" x="410" y="420" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="410" y="448" text-anchor="middle">ITimeBlock</text>
  <line class="divider" x1="228" y1="462" x2="592" y2="462" />
  <text class="member" x="236" y="478">+ duration</text>
  <text class="member" x="236" y="498">+ durationFromStart()</text>
  <text class="member" x="236" y="518">+ durationFromEnd()</text>
</g>
<g id="iRange">
  <rect class="card" x="1590" y="390" width="400" height="155" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="stereo" x="1790" y="420" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
  <text class="cardTitle" x="1790" y="448" text-anchor="middle">ITimeRange</text>
  <line class="divider" x1="1608" y1="462" x2="1972" y2="462" />
  <text class="member" x="1616" y="478">+ expandStartTo()</text>
  <text class="member" x="1616" y="498">+ expandEndTo()</text>
  <text class="member" x="1616" y="518">+ shrinkStartTo()</text>
  <text class="member" x="1616" y="538">+ shrinkEndTo()</text>
</g>
