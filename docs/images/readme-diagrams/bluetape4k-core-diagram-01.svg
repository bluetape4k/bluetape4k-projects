<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="32"/>
<text class="title" x="72" y="84">Bluetape4k Core architecture</text>
<text class="subtitle" x="76" y="116">Core provides shared contracts and value/runtime helpers used by higher-level modules.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Caller contracts</text></g>
