  <text class="detail" x="1214" y="321" text-anchor="middle" dominant-baseline="middle">Base58, Base62, Hex</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Domain value model</text></g>
