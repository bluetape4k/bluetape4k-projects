<svg data-intent="Explain bluetape4k-core as the shared foundation: caller contracts and type helpers feed value models, collections, time, codec, functional, and concurrency utilities used by other modules." data-evidence="bluetape4k/core/README.md; bluetape4k/core/src/main/kotlin/io/bluetape4k" data-source-read="bluetape4k/core/README.md; bluetape4k/core/src/main/kotlin/io/bluetape4k" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Bluetape4k Core architecture">
