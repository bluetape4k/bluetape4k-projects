  <text class="detail" x="286" y="639" text-anchor="middle" dominant-baseline="middle">open/closed ranges</text>
</g>
<g id="collections">
  <rect class="card" x="610" y="574" width="280" height="84" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Collection helpers</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">ring buffer, bounded stack</text>
</g>
