<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-label="Conditional Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="smallArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6" fill="none" stroke="#758297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .edgeLabel{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .thinLine{stroke:#758297;stroke-width:1.8;fill:none;marker-end:url(#smallArrow)}
    .dashed{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1450" height="850"/>
<rect class="frame" x="32" y="28" width="1386" height="794" rx="28"/>
<text class="title" x="66" y="82">Conditional Flow</text>
<text class="subtitle" x="70" y="118">The predicate selects exactly one branch; the selected branch's WorkReport becomes the flow result.</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="148" width="1368" height="182" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="176">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="288" width="1368" height="202" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="316">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="478" width="1368" height="182" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="506">Adapter layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<g>
  <rect class="card" x="90" y="350" width="220" height="108" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="200" y="386" text-anchor="middle">Start</text>
  <text class="small" x="200" y="416" text-anchor="middle">evaluate context</text>
</g>
<g>
  <rect class="card" x="470" y="320" width="250" height="138" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="595" y="356" text-anchor="middle">Predicate</text>
  <text class="small" x="595" y="386" text-anchor="middle">condition(ctx)</text>
<text class="small" x="595" y="404" text-anchor="middle">true or false</text>
</g>
<g>
  <rect class="card" x="895" y="180" width="250" height="118" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="1020" y="216" text-anchor="middle">Then Work</text>
  <text class="small" x="1020" y="246" text-anchor="middle">predicate = true</text>
</g>
<g>
  <rect class="card" x="895" y="510" width="250" height="118" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="1020" y="546" text-anchor="middle">Otherwise Work</text>
  <text class="small" x="1020" y="576" text-anchor="middle">predicate = false</text>
<text class="small" x="1020" y="594" text-anchor="middle">optional</text>
</g>
<g>
  <rect class="card" x="1190" y="340" width="200" height="118" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="1290" y="376" text-anchor="middle">Done</text>
  <text class="small" x="1290" y="406" text-anchor="middle">branch report</text>
<text class="small" x="1290" y="424" text-anchor="middle">or Success</text>
</g>
<path class="line" d="M310 404 H470"/>
<text class="edgeLabel" x="390" y="394" text-anchor="middle">test</text>
<path class="line" d="M720 358 C795 270 825 240 895 239"/>
<text class="edgeLabel" x="804" y="287" text-anchor="middle">true</text>
<path class="line" d="M720 420 C795 515 825 568 895 569"/>
<text class="edgeLabel" x="804" y="516" text-anchor="middle">false</text>
<path class="line" d="M1145 239 C1215 255 1245 305 1248 340"/>
<text class="edgeLabel" x="1227" y="284" text-anchor="middle">result</text>
<path class="line" d="M1145 569 C1215 550 1245 498 1248 458"/>
<text class="edgeLabel" x="1228" y="526" text-anchor="middle">result</text>
<g>
  <rect class="soft" x="474" y="565" width="345" height="78" rx="12" fill="#EEF6D9" stroke="#8BA84D" opacity="0.92"/>
  <text class="small" x="492" y="590" text-anchor="start">If otherwise is missing, false returns Success(context).</text>
<text class="small" x="492" y="608" text-anchor="start">It is a no-op branch, not a failure.</text>
</g></svg>
