<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-label="RestClient coroutine DSL structure">
  <style>
    text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }
  </style>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect width="1440" height="860" fill="#ffffff"/>
  <text x="76" y="62" font-size="30" font-weight="700" fill="#111827">RestClient Coroutine DSL Structure</text>
  <text x="76" y="92" font-size="15" fill="#64748b">The module keeps Spring RestClient blocking semantics explicit while offering coroutine-friendly suspend wrappers.</text>


  <g class="lane" data-lane="CALLER">
    <rect x="54" y="132" width="320" height="604" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="72" y="158" font-size="14" font-weight="700" fill="#2563eb">CALLER</text>
    <text x="72" y="179" font-size="12.5" fill="#6b7280">Starts DSL; receives the result.</text>
  </g>

  <g class="lane" data-lane="DSL WRAPPER">
    <rect x="388" y="132" width="320" height="604" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="406" y="158" font-size="14" font-weight="700" fill="#7c3aed">DSL WRAPPER</text>
    <text x="406" y="179" font-size="12.5" fill="#6b7280">Builds clients and exposes suspend verbs.</text>
  </g>

  <g class="lane" data-lane="BLOCKING EXCHANGE">
    <rect x="722" y="132" width="320" height="604" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="740" y="158" font-size="14" font-weight="700" fill="#64748b">BLOCKING EXCHANGE</text>
    <text x="740" y="179" font-size="12.5" fill="#6b7280">Runs RestClient in Dispatchers.IO.</text>
  </g>

  <g class="lane" data-lane="RESULT">
    <rect x="1056" y="132" width="320" height="604" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="1074" y="158" font-size="14" font-weight="700" fill="#16a34a">RESULT</text>
    <text x="1074" y="179" font-size="12.5" fill="#6b7280">Decodes body for the caller.</text>
  </g>

  <path class="edge" d="M344 278 L420 278" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M668 278 L744 278" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 220 326 L 220 508 Q 220 522 234 522 L 420 522" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M668 522 L744 522" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M868 470 L868 378 L868 326" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M992 522 L1068 522" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M1198 574 L1198 620" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>


  <g class="card" data-card="Application Code">
    <rect x="96" y="230" width="248" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="220" y="261" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Application Code</text>
    <text x="220" y="288" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">restClientOf(baseUrl)</text>
<text x="220" y="305" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">or existing RestClient</text>
  </g>

  <g class="card" data-card="Builder DSL">
    <rect x="420" y="230" width="248" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="544" y="261" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Builder DSL</text>
    <text x="544" y="288" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">baseUrl + builder block</text>
<text x="544" y="305" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">builds RestClient</text>
  </g>

  <g class="card" data-card="Spring RestClient">
    <rect x="744" y="230" width="248" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="868" y="261" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Spring RestClient</text>
    <text x="868" y="288" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">blocking client facade</text>
<text x="868" y="305" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">get/post/put/patch/delete</text>
  </g>

  <g class="card" data-card="Suspend Verb">
    <rect x="420" y="470" width="248" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="544" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Suspend Verb</text>
    <text x="544" y="528" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">suspendGet/Post/Put/Patch</text>
<text x="544" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">suspendDelete</text>
  </g>

  <g class="card" data-card="Interruptible Block">
    <rect x="744" y="470" width="248" height="104" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
    <text x="868" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Interruptible Block</text>
    <text x="868" y="528" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">runInterruptible</text>
<text x="868" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Dispatchers.IO</text>
  </g>

  <g class="card" data-card="Response Decode">
    <rect x="1068" y="470" width="260" height="104" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <text x="1198" y="501" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Response Decode</text>
    <text x="1198" y="528" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">retrieve().body(T::class.java)</text>
<text x="1198" y="545" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">or toBodilessEntity()</text>
  </g>

  <g class="card" data-card="Coroutine Caller">
    <rect x="1068" y="620" width="260" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="1198" y="651" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Coroutine Caller</text>
    <text x="1198" y="678" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">gets typed value</text>
<text x="1198" y="695" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">or nullable value</text>
  </g>

  <g class="note" data-note="cancellation">
    <rect x="744" y="616" width="248" height="96" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="868" y="646" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">Cancellation boundary</text>
    <text x="868" y="672" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Thread interruption works only</text>
<text x="868" y="688" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">when the request factory</text>
<text x="868" y="704" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">honors interruption.</text>
  </g>
  <path class="edge" d="M1068 668 L992 668" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="1004,662 992,668 1004,674" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g class="legend" transform="translate(76 814)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
    <text x="52" y="5" font-size="13" fill="#475569">Construction path</text>
    <line x1="238" y1="0" x2="276" y2="0" stroke="#7c3aed" stroke-width="3.2" marker-end="url(#arrow-purple)"/>
    <text x="290" y="5" font-size="13" fill="#475569">Suspend wrapper path</text>
    <line x1="520" y1="0" x2="558" y2="0" stroke="#16a34a" stroke-width="3.0" marker-end="url(#arrow-green)"/>
    <text x="572" y="5" font-size="13" fill="#475569">Decoded result</text>
    <line x1="720" y1="0" x2="758" y2="0" stroke="#64748b" stroke-width="2.7" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
    <text x="772" y="5" font-size="13" fill="#475569">Blocking boundary note</text>
  </g>
</svg>