<svg data-intent="Explain how application code enters suspend RestClient helpers and how those helpers map to Spring RestClient plus HTTP exchange." data-evidence="spring-boot/core/README.md; RestClientCoroutinesExtensions.kt" data-source-read="spring-boot/core/README.md; RestClientCoroutinesExtensions.kt" xmlns="http://www.w3.org/2000/svg" width="1244" height="710" viewBox="0 0 1244 710" role="img" aria-label="RestClient Coroutine DSL Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1244" height="710"/>
<rect class="frame" x="34" y="30" width="1176" height="650" rx="8"/>
<text class="title" x="72" y="84">RestClient Coroutine DSL Flow</text>
<text class="subtitle" x="76" y="116">Suspend helpers stay explicit between application code, Spring RestClient, and the actual HTTP exchange.</text>
<g><rect class="panel" x="82" y="160" width="1080" height="180" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Coroutine-facing API</text></g>
<g><rect class="panel" x="82" y="430" width="1080" height="170" rx="8"/><text class="panelTitle" x="110" y="466" dominant-baseline="middle">HTTP exchange</text></g>
<g id="app">
  <rect class="card" x="120" y="232" width="280" height="82" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="260" y="266" text-anchor="middle" dominant-baseline="middle">Application code</text>
  <text class="detail" x="260" y="296" text-anchor="middle" dominant-baseline="middle">calls suspend helper</text>
</g>
<g id="dsl">
  <rect class="card" x="485" y="218" width="330" height="112" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="650" y="258" text-anchor="middle" dominant-baseline="middle">RestClient coroutine DSL</text>
  <text class="detail" x="650" y="288" text-anchor="middle" dominant-baseline="middle">awaitBody / awaitEntity</text>
  <text class="detail" x="650" y="306" text-anchor="middle" dominant-baseline="middle">typed request helpers</text>
</g>
<g id="spring">
  <rect class="card" x="900" y="232" width="220" height="82" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1010" y="266" text-anchor="middle" dominant-baseline="middle">Spring RestClient</text>
  <text class="detail" x="1010" y="296" text-anchor="middle" dominant-baseline="middle">blocking client facade</text>
</g>
<g id="request">
  <rect class="card" x="205" y="485" width="300" height="88" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="355" y="522" text-anchor="middle" dominant-baseline="middle">HTTP request</text>
  <text class="detail" x="355" y="552" text-anchor="middle" dominant-baseline="middle">method, URI, headers, body</text>
</g>
<g id="api">
  <rect class="card" x="705" y="485" width="300" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="855" y="522" text-anchor="middle" dominant-baseline="middle">External REST API</text>
  <text class="detail" x="855" y="552" text-anchor="middle" dominant-baseline="middle">status, headers, response body</text>
</g>
<path class="route" data-from="app" data-to="dsl" d="M400 273 L485 273" stroke="#1D4ED8"/>
<path class="route" data-from="dsl" data-to="spring" d="M815 274 L900 274" stroke="#15803D"/>
<path class="route" data-from="dsl" data-to="request" d="M650 330 L650 384 L355 384 L355 485" stroke="#7E22CE"/>
<path class="route" data-from="request" data-to="api" d="M505 529 L705 529" stroke="#BE185D"/>
<path class="route" data-from="api" data-to="spring" d="M855 485 L855 384 L1010 384 L1010 314" stroke="#0F766E"/>
</svg>
