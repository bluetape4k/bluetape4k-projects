<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1220" viewBox="0 0 1500 1220" role="img" aria-label="Math Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1220"/>
<rect class="frame" x="32" y="28" width="1436" height="1164" rx="30"/>
<text class="title" x="68" y="84">Math Class Structure 2</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="SplineInterpolator" data-to="Interpolator" data-route-color="green" d="M620 398 L620 303" stroke="#3E9868"/>
<path class="inherit" data-from="LinearInterpolator" data-to="Interpolator" data-route-color="blue" d="M425 398 L425 303" stroke="#4F83BF"/>
<path class="inherit" data-from="DoubleStatistics" data-to="Descriptives" data-route-color="teal" d="M1173 572 L1173 485" stroke="#2E8F89"/>
<g id="Histogram">
  <rect class="classCard" x="993" y="165" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1173" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="212" text-anchor="middle">Histogram</text>
  <line x1="993" y1="221" x2="1353" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="1027" y="253">+add(value)</text>
<text class="member" x="1027" y="270">+binCount: Int</text>
<text class="member" x="1027" y="287">+bins: List~Bin~</text>
</g>
<g id="Interpolator">
  <rect class="classCard" x="342" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="522" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="522" y="212" text-anchor="middle">Interpolator</text>
  <line x1="342" y1="221" x2="702" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="376" y="266">+interpolate(x) Double</text>
</g>
<g id="Descriptives">
  <rect class="classCard" x="993" y="339" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1173" y="358" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="386" text-anchor="middle">Descriptives</text>
  <line x1="993" y1="395" x2="1353" y2="395" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1027" y="427">+mean: Double</text>
<text class="member" x="1027" y="444">+variance: Double</text>
<text class="member" x="1027" y="461">+standardDeviation: Double</text>
</g>
<g id="Integrator">
  <rect class="classCard" x="993" y="746" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1173" y="765" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="793" text-anchor="middle">Integrator</text>
  <line x1="993" y1="802" x2="1353" y2="802" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1027" y="847">+integrate(f, a, b) Double</text>
</g>
<g id="WeightedDice">
  <rect class="classCard" x="993" y="912" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1173" y="931" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="959" text-anchor="middle">WeightedDice</text>
  <line x1="993" y1="968" x2="1353" y2="968" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1027" y="1013">+roll() T</text>
</g>
<g id="LinearInterpolator">
  <rect class="classCard" x="147" y="398" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="327" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="327" y="445" text-anchor="middle">LinearInterpolator</text>
  <line x1="147" y1="454" x2="507" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="181" y="499">+interpolate(x) Double</text>
</g>
<g id="DoubleStatistics">
  <rect class="classCard" x="993" y="572" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1173" y="591" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="619" text-anchor="middle">DoubleStatistics</text>
  <line x1="993" y1="628" x2="1353" y2="628" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1027" y="660">+descriptives() Descriptives</text>
<text class="member" x="1027" y="677">+aggregateBy(keySelector,</text>
<text class="member" x="1027" y="694">valueTransform,</text>
</g>
<g id="SplineInterpolator">
  <rect class="classCard" x="537" y="398" width="360" height="138" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="717" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="445" text-anchor="middle">SplineInterpolator</text>
  <line x1="537" y1="454" x2="897" y2="454" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="571" y="499">+interpolate(x) Double</text>
</g>
<g>
  <rect x="1085" y="1112" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1130 L1161 1130" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1135">inheritance / implementation</text>
  <path class="dependency" d="M1103 1151 L1161 1151" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1156">dependency / usage</text>
</g>
<g><rect x="180" y="1130" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1156" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
