<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180" role="img" aria-label="Math Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1180"/>
<rect class="frame" x="32" y="28" width="1436" height="1124" rx="30"/>
<text class="title" x="68" y="84">Math Class Structure 2</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="SplineInterpolator" data-to="Interpolator" data-route-color="green" d="M550 398 L550 297" stroke="#3E9868"/>
<path class="inherit" data-from="LinearInterpolator" data-to="Interpolator" data-route-color="blue" d="M416 398 L416 297" stroke="#4F83BF"/>
<path class="inherit" data-from="DoubleStatistics" data-to="Descriptives" data-route-color="teal" d="M1114 558 L1114 457" stroke="#2E8F89"/>
<g id="Histogram">
  <rect class="classCard" x="944" y="165" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1114" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1114" y="212" text-anchor="middle">Histogram</text>
  <line x1="944" y1="221" x2="1284" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="962" y="246">+add(value)</text>
<text class="member" x="962" y="263">+binCount: Int</text>
<text class="member" x="962" y="280">+bins: List~Bin~</text>
</g>
<g id="Interpolator">
  <rect class="classCard" x="313" y="165" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="483" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="483" y="212" text-anchor="middle">Interpolator</text>
  <line x1="313" y1="221" x2="653" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="331" y="263">+interpolate(x) Double</text>
</g>
<g id="Descriptives">
  <rect class="classCard" x="944" y="325" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1114" y="344" text-anchor="middle">class</text>
  <text class="classTitle" x="1114" y="372" text-anchor="middle">Descriptives</text>
  <line x1="944" y1="381" x2="1284" y2="381" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="962" y="406">+mean: Double</text>
<text class="member" x="962" y="423">+variance: Double</text>
<text class="member" x="962" y="440">+standardDeviation: Double</text>
</g>
<g id="Integrator">
  <rect class="classCard" x="944" y="718" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1114" y="737" text-anchor="middle">class</text>
  <text class="classTitle" x="1114" y="765" text-anchor="middle">Integrator</text>
  <line x1="944" y1="774" x2="1284" y2="774" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="962" y="816">+integrate(f, a, b) Double</text>
</g>
<g id="WeightedDice">
  <rect class="classCard" x="944" y="878" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1114" y="897" text-anchor="middle">class</text>
  <text class="classTitle" x="1114" y="925" text-anchor="middle">WeightedDice</text>
  <line x1="944" y1="934" x2="1284" y2="934" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="962" y="976">+roll() T</text>
</g>
<g id="LinearInterpolator">
  <rect class="classCard" x="118" y="398" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="288" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="445" text-anchor="middle">LinearInterpolator</text>
  <line x1="118" y1="454" x2="458" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="136" y="496">+interpolate(x) Double</text>
</g>
<g id="DoubleStatistics">
  <rect class="classCard" x="944" y="558" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1114" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="1114" y="605" text-anchor="middle">DoubleStatistics</text>
  <line x1="944" y1="614" x2="1284" y2="614" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="962" y="639">+descriptives() Descriptives</text>
<text class="member" x="962" y="656">+aggregateBy(keySelector,</text>
<text class="member" x="962" y="673">valueTransform,</text>
</g>
<g id="SplineInterpolator">
  <rect class="classCard" x="508" y="398" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="678" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="445" text-anchor="middle">SplineInterpolator</text>
  <line x1="508" y1="454" x2="848" y2="454" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="526" y="496">+interpolate(x) Double</text>
</g>
<g>
  <rect x="1085" y="1072" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1090 L1161 1090" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1095">inheritance / implementation</text>
  <path class="dependency" d="M1103 1111 L1161 1111" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1116">dependency / usage</text>
</g>
<g><rect x="180" y="1090" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1116" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
