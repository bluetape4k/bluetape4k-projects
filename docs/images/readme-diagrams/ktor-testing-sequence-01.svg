<svg data-intent="Show the test helper sequence from testApplication through core installation, JSON client creation, request execution, and assertion/mock helpers." data-evidence="ktor/testing/README.md; ktor/testing/src/main/kotlin/io/bluetape4k/ktor/testing" data-source-read="ktor/testing/README.md; ktor/testing/src/main/kotlin/io/bluetape4k/ktor/testing" xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-label="Ktor Testing Helper Sequence" data-layout="sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="880"/>
<rect class="frame" x="34" y="30" width="1432" height="820" rx="32"/>
<text class="title" x="72" y="84">Ktor Testing Helper Sequence</text>
<text class="subtitle" x="76" y="116">The sequence shows the real test path: install core defaults, create a JSON client, execute, then assert or use MockEngine helpers.</text>
<g id="test"><rect class="card" x="100" y="170" width="200" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="200" y="210" text-anchor="middle" dominant-baseline="middle">Test</text><line class="lifeline dashed" x1="200" y1="246" x2="200" y2="790" stroke="#5B8DEF"/></g>
<g id="builder"><rect class="card" x="330" y="170" width="280" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="470" y="210" text-anchor="middle" dominant-baseline="middle">ApplicationTestBuilder</text><line class="lifeline dashed" x1="470" y1="246" x2="470" y2="790" stroke="#58A978"/></g>
<g id="app"><rect class="card" x="660" y="170" width="210" height="76" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="765" y="210" text-anchor="middle" dominant-baseline="middle">Ktor app</text><line class="lifeline dashed" x1="765" y1="246" x2="765" y2="790" stroke="#8A72D6"/></g>
<g id="client"><rect class="card" x="935" y="170" width="210" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1040" y="210" text-anchor="middle" dominant-baseline="middle">JSON client</text><line class="lifeline dashed" x1="1040" y1="246" x2="1040" y2="790" stroke="#D6A441"/></g>
<g id="assertions"><rect class="card" x="1145" y="170" width="300" height="76" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1295" y="210" text-anchor="middle" dominant-baseline="middle">Assertions / MockEngine</text><line class="lifeline dashed" x1="1295" y1="246" x2="1295" y2="790" stroke="#DC6B82"/></g>
<g id="m1"><rect class="labelPill" x="250" y="296" width="170" height="28" rx="8"/><circle cx="268" cy="310" r="11" fill="#4F83BF"/><text class="detail" x="268" y="311" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="347" y="311" text-anchor="middle" dominant-baseline="middle">testApplication</text><path class="seq" d="M200 338 L470 338" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="523" y="381" width="189" height="28" rx="8"/><circle cx="541" cy="395" r="11" fill="#3E9868"/><text class="detail" x="541" y="396" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="629.5" y="396" text-anchor="middle" dominant-baseline="middle">install core module</text><path class="seq" d="M470 423 L765 423" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="664" y="466" width="182" height="28" rx="8"/><circle cx="682" cy="480" r="11" fill="#B9851B"/><text class="detail" x="682" y="481" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="767" y="481" text-anchor="middle" dominant-baseline="middle">create JSON client</text><path class="seq" d="M470 508 L1040 508" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m4"><rect class="labelPill" x="817.5" y="551" width="170" height="28" rx="8"/><circle cx="835.5" cy="565" r="11" fill="#755BC6"/><text class="detail" x="835.5" y="566" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="914.5" y="566" text-anchor="middle" dominant-baseline="middle">execute request</text><path class="seq" d="M1040 593 L765 593" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m5"><rect class="labelPill" x="907.5" y="636" width="245" height="28" rx="8"/><circle cx="925.5" cy="650" r="11" fill="#C94D68"/><text class="detail" x="925.5" y="651" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="1042" y="651" text-anchor="middle" dominant-baseline="middle">decode body / assert status</text><path class="seq" d="M765 678 L1295 678" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="635.5" y="721" width="224" height="28" rx="8"/><circle cx="653.5" cy="735" r="11" fill="#3E9868"/><text class="detail" x="653.5" y="736" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="759.5" y="736" text-anchor="middle" dominant-baseline="middle">return verified response</text><path class="seqReturn" d="M1295 763 L200 763" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
</svg>
