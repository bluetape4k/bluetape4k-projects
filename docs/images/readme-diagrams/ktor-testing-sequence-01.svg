<g id="m3"><rect class="labelPill" x="664" y="466" width="182" height="28" rx="8" stroke="#B9851B"/><circle cx="682" cy="480" r="11" fill="#B9851B" stroke="#B9851B"/><text class="detail" x="682" y="481" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px" fill="#FFFFFF">3</text><text class="detail" x="767" y="481" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">create JSON client</text><path class="seq" d="M470 508 L1040 508" stroke="#B9851B" marker-end="url(#seqArrow-amber-B9851B)"/></g>
<g id="m4"><rect class="labelPill" x="817.5" y="551" width="170" height="28" rx="8" stroke="#755BC6"/><circle cx="835.5" cy="565" r="11" fill="#755BC6" stroke="#755BC6"/><text class="detail" x="835.5" y="566" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px" fill="#FFFFFF">4</text><text class="detail" x="914.5" y="566" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">execute request</text><path class="seq" d="M1040 593 L765 593" stroke="#755BC6" marker-end="url(#seqArrow-purple-755BC6)"/></g>
<g id="m5"><rect class="labelPill" x="907.5" y="636" width="245" height="28" rx="8" stroke="#C94D68"/><circle cx="925.5" cy="650" r="11" fill="#C94D68" stroke="#C94D68"/><text class="detail" x="925.5" y="651" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px" fill="#FFFFFF">5</text><text class="detail" x="1042" y="651" text-anchor="middle" dominant-baseline="middle" fill="#C94D68">decode body / assert status</text><path class="seq" d="M765 678 L1295 678" stroke="#C94D68" marker-end="url(#seqArrow-pink-C94D68)"/></g>
<g id="m6"><rect class="labelPill" x="635.5" y="721" width="224" height="28" rx="8" stroke="#3E9868"/><circle cx="653.5" cy="735" r="11" fill="#3E9868" stroke="#3E9868"/><text class="detail" x="653.5" y="736" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px" fill="#FFFFFF">6</text><text class="detail" x="759.5" y="736" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">return verified response</text><path class="seqReturn" d="M1295 763 L200 763" stroke="#3E9868" marker-end="url(#seqArrow-green-3E9868)"/></g>
