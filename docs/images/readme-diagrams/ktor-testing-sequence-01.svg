<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="ktor-testing-sequence-01-title ktor-testing-sequence-01-desc">
  <title id="ktor-testing-sequence-01-title">Ktor Testing Sequence</title>
  <desc id="ktor-testing-sequence-01-desc">testApplication lifecycle stays visible while bluetape4k helpers reduce JSON and assertion noise</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#22344A;font-weight:400}
      .body{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;fill:#34465B;font-weight:400}
      .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .edgeLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476;font-weight:400;dominant-baseline:middle}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.92}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#627184;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1400" height="760"/>
  <rect class="frame" x="32" y="28" width="1336" height="704" rx="26"/>
  <text class="title" x="66" y="82">Ktor Testing Sequence</text>
  <text class="subtitle" x="70" y="116">testApplication lifecycle stays visible while bluetape4k helpers reduce JSON and assertion noise</text>
  <path class="edge" d="M340 235 L365 235 L365 235 L390 235"/>
<path class="edge" d="M700 235 L725 235 L725 235 L750 235"/>
<path class="edge" d="M1030 235 L1055 235 L1055 235 L1080 235"/>
<path class="edge" d="M1080 235 L1055 235 L1055 535 L1030 535"/>
<path class="edge" d="M750 535 L725 535 L725 535 L700 535"/>
<path class="edge" d="M205 300 L205 385 L205 385 L205 470"/>
<path class="edge" d="M340 535 L365 535 L365 535 L390 535"/>
  <g>
  <rect class="card" x="70" y="170" width="270" height="130" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="205" y="212" text-anchor="middle">JUnit test</text>
  <text class="body" x="205" y="247" text-anchor="middle">testApplication { ... }</text>
<text class="body" x="205" y="270" text-anchor="middle">caller owns lifecycle</text>
</g>
<g>
  <rect class="card" x="390" y="170" width="310" height="130" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="545" y="212" text-anchor="middle">Core test setup</text>
  <text class="body" x="545" y="247" text-anchor="middle">installBluetape4kKtorCoreForTest</text>
<text class="body" x="545" y="270" text-anchor="middle">register test routes</text>
</g>
<g>
  <rect class="card" x="750" y="170" width="280" height="130" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="890" y="212" text-anchor="middle">JSON client</text>
  <text class="body" x="890" y="247" text-anchor="middle">bluetape4kJsonClient()</text>
<text class="body" x="890" y="270" text-anchor="middle">ContentNegotiation JSON</text>
</g>
<g>
  <rect class="card" x="1080" y="170" width="250" height="130" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1205" y="212" text-anchor="middle">Ktor route</text>
  <text class="body" x="1205" y="247" text-anchor="middle">call.respond(...)</text>
<text class="body" x="1205" y="270" text-anchor="middle">StatusPages active</text>
</g>
<g>
  <rect class="card" x="750" y="470" width="280" height="130" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="890" y="512" text-anchor="middle">HttpResponse</text>
  <text class="body" x="890" y="547" text-anchor="middle">status</text>
<text class="body" x="890" y="570" text-anchor="middle">JSON body</text>
<text class="body" x="890" y="593" text-anchor="middle">ApiErrorResponse</text>
</g>
<g>
  <rect class="card" x="390" y="470" width="310" height="130" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="545" y="512" text-anchor="middle">Assertions</text>
  <text class="body" x="545" y="547" text-anchor="middle">shouldHaveStatus</text>
<text class="body" x="545" y="570" text-anchor="middle">shouldHaveJsonBody</text>
<text class="body" x="545" y="593" text-anchor="middle">shouldHaveApiError</text>
</g>
<g>
  <rect class="card" x="70" y="470" width="270" height="130" rx="16" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="cardTitle" x="205" y="512" text-anchor="middle">MockEngine</text>
  <text class="body" x="205" y="547" text-anchor="middle">bluetape4kJsonMockEngine</text>
<text class="body" x="205" y="570" text-anchor="middle">single JSON response</text>
</g>
  <text class="note" x="700" y="722" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
