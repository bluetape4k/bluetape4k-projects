<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1230" viewBox="0 0 1900 1230" role="img" aria-label="Distributed Primitive Class Hierarchy">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="open-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="extends" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 15 7 L 1 13 Z" fill="#ffffff" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .canvas { fill: #f8fafc; }
    .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; filter: url(#softShadow); }
    .title { font-family: "Architects Daughter"; font-size: 50px; fill: #0f172a; }
    .subtitle { font-family: "Comic Mono"; font-size: 18px; fill: #475569; }
    .section { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.7; }
    .sectionLabel { font-family: "Architects Daughter"; font-size: 27px; fill: #0f172a; }
    .labelChip { fill: #ffffff; stroke: none; }
    .card { filter: url(#softShadow); stroke-width: 2.1; }
    .name { font-family: "Architects Daughter"; font-size: 25px; fill: #0f172a; }
    .smallName { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
    .meta { font-family: "Comic Mono"; font-size: 14px; fill: #475569; }
    .tiny { font-family: "Comic Mono"; font-size: 13px; fill: #64748b; }
    .sync { fill: #eff6ff; stroke: #2563eb; }
    .suspend { fill: #faf5ff; stroke: #9333ea; }
    .redis { fill: #f0fdfa; stroke: #0d9488; }
    .script { fill: #fff7ed; stroke: #ea580c; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .extendsLine { fill: none; stroke: #111827; stroke-width: 2.2; marker-end: url(#extends); }
    .useBlue { fill: none; stroke: #2563eb; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; opacity: 0.82; marker-end: url(#open-blue); }
    .usePurple { fill: none; stroke: #9333ea; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 8; opacity: 0.82; marker-end: url(#open-purple); }
    .divider { stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 8 8; }
  </style>

  <rect class="canvas" width="1900" height="1230"/>
  <rect class="frame" x="38" y="32" width="1824" height="1166" rx="8"/>

  <text class="title" x="82" y="94">Distributed Primitive Class Hierarchy</text>
  <text class="subtitle" x="86" y="128">Lettuce exposes sync/CompletableFuture classes and suspend-only counterparts over the same Redis primitives.</text>

  <rect class="section" x="82" y="176" width="1736" height="330" rx="8"/>
  <rect class="section" x="82" y="536" width="1736" height="330" rx="8"/>
  <rect class="section" x="82" y="896" width="1736" height="210" rx="8"/>

  <line class="divider" x1="383" y1="178" x2="383" y2="1104"/>
  <line class="divider" x1="704" y1="178" x2="704" y2="1104"/>
  <line class="divider" x1="1025" y1="178" x2="1025" y2="1104"/>
  <line class="divider" x1="1346" y1="178" x2="1346" y2="1104"/>

  <rect class="labelChip" x="100" y="188" width="386" height="42" rx="6"/>
  <rect class="labelChip" x="100" y="548" width="168" height="42" rx="6"/>
  <rect class="labelChip" x="100" y="908" width="640" height="42" rx="6"/>
  <text class="sectionLabel" x="112" y="216">Sync + CompletableFuture API</text>
  <text class="sectionLabel" x="112" y="576">Suspend API</text>
  <text class="sectionLabel" x="112" y="936">Redis structures used by the primitive classes</text>

  <text class="tiny" x="232" y="244" text-anchor="middle">Hash maps</text>
  <text class="tiny" x="553" y="244" text-anchor="middle">Counters</text>
  <text class="tiny" x="874" y="244" text-anchor="middle">Coordination</text>
  <text class="tiny" x="1195" y="244" text-anchor="middle">Cardinality</text>
  <text class="tiny" x="1538" y="244" text-anchor="middle">Probabilistic filters</text>

  <g id="map-base">
    <rect class="card sync" x="122" y="270" width="220" height="88" rx="8"/>
    <text class="name" x="232" y="302" text-anchor="middle">LettuceMap&lt;V&gt;</text>
    <text class="meta" x="232" y="329" text-anchor="middle">open class</text>
    <text class="meta" x="232" y="350" text-anchor="middle">sync + async hash API</text>
  </g>
  <g id="string-map">
    <rect class="card sync" x="122" y="398" width="220" height="70" rx="8"/>
    <text class="smallName" x="232" y="429" text-anchor="middle">LettuceStringMap</text>
    <text class="meta" x="232" y="454" text-anchor="middle">extends Map&lt;String&gt;</text>
  </g>
  <path class="extendsLine" d="M 232 398 V 366"/>

  <g id="atomic">
    <rect class="card sync" x="430" y="302" width="246" height="116" rx="8"/>
    <text class="name" x="553" y="336" text-anchor="middle">LettuceAtomicLong</text>
    <text class="meta" x="553" y="365" text-anchor="middle">String-backed long value</text>
    <text class="meta" x="553" y="388" text-anchor="middle">INCR/DECR + CAS Lua</text>
  </g>

  <g id="lock">
    <rect class="card sync" x="752" y="286" width="246" height="96" rx="8"/>
    <text class="name" x="875" y="320" text-anchor="middle">LettuceLock</text>
    <text class="meta" x="875" y="349" text-anchor="middle">SET NX PX token</text>
    <text class="meta" x="875" y="372" text-anchor="middle">Lua guarded unlock</text>
  </g>
  <g id="semaphore">
    <rect class="card sync" x="752" y="410" width="246" height="74" rx="8"/>
    <text class="smallName" x="875" y="441" text-anchor="middle">LettuceSemaphore</text>
    <text class="meta" x="875" y="466" text-anchor="middle">permit counter + Lua</text>
  </g>

  <g id="hll">
    <rect class="card sync" x="1080" y="310" width="230" height="104" rx="8"/>
    <text class="smallName" x="1195" y="336" text-anchor="middle">Lettuce</text>
    <text class="smallName" x="1195" y="363" text-anchor="middle">HyperLogLog&lt;V&gt;</text>
    <text class="meta" x="1195" y="390" text-anchor="middle">PFADD / PFCOUNT</text>
    <text class="meta" x="1195" y="408" text-anchor="middle">AutoCloseable</text>
  </g>

  <g id="bloom">
    <rect class="card sync" x="1406" y="286" width="264" height="90" rx="8"/>
    <text class="smallName" x="1538" y="318" text-anchor="middle">LettuceBloomFilter</text>
    <text class="meta" x="1538" y="347" text-anchor="middle">BitSet + Murmur3 positions</text>
    <text class="meta" x="1538" y="370" text-anchor="middle">false positives only</text>
  </g>
  <g id="cuckoo">
    <rect class="card sync" x="1406" y="406" width="264" height="78" rx="8"/>
    <text class="smallName" x="1538" y="438" text-anchor="middle">LettuceCuckooFilter</text>
    <text class="meta" x="1538" y="463" text-anchor="middle">delete + undo-log scripts</text>
  </g>

  <g id="suspend-map-base">
    <rect class="card suspend" x="122" y="630" width="220" height="88" rx="8"/>
    <text class="smallName" x="232" y="656" text-anchor="middle">LettuceSuspend</text>
    <text class="smallName" x="232" y="683" text-anchor="middle">Map&lt;V&gt;</text>
    <text class="meta" x="232" y="707" text-anchor="middle">RedisFuture.await()</text>
  </g>
  <g id="suspend-string-map">
    <rect class="card suspend" x="122" y="758" width="220" height="70" rx="8"/>
    <text class="smallName" x="232" y="789" text-anchor="middle">SuspendStringMap</text>
    <text class="meta" x="232" y="814" text-anchor="middle">extends SuspendMap&lt;String&gt;</text>
  </g>
  <path class="extendsLine" d="M 232 758 V 726"/>

  <g id="suspend-atomic">
    <rect class="card suspend" x="430" y="662" width="246" height="116" rx="8"/>
    <text class="smallName" x="553" y="690" text-anchor="middle">LettuceSuspend</text>
    <text class="smallName" x="553" y="717" text-anchor="middle">AtomicLong</text>
    <text class="meta" x="553" y="746" text-anchor="middle">same atomic operations</text>
    <text class="meta" x="553" y="769" text-anchor="middle">suspend script runner</text>
  </g>

  <g id="suspend-lock">
    <rect class="card suspend" x="752" y="646" width="246" height="96" rx="8"/>
    <text class="smallName" x="875" y="680" text-anchor="middle">LettuceSuspendLock</text>
    <text class="meta" x="875" y="709" text-anchor="middle">SET NX PX + delay</text>
    <text class="meta" x="875" y="732" text-anchor="middle">suspend unlock script</text>
  </g>
  <g id="suspend-semaphore">
    <rect class="card suspend" x="752" y="770" width="246" height="74" rx="8"/>
    <text class="smallName" x="875" y="801" text-anchor="middle">SuspendSemaphore</text>
    <text class="meta" x="875" y="826" text-anchor="middle">suspend permit counter</text>
  </g>

  <g id="suspend-hll">
    <rect class="card suspend" x="1080" y="670" width="230" height="104" rx="8"/>
    <text class="smallName" x="1195" y="696" text-anchor="middle">Suspend</text>
    <text class="smallName" x="1195" y="723" text-anchor="middle">HyperLogLog&lt;V&gt;</text>
    <text class="meta" x="1195" y="750" text-anchor="middle">PFADD / PFCOUNT</text>
    <text class="meta" x="1195" y="768" text-anchor="middle">awaitSuspending()</text>
  </g>

  <g id="suspend-bloom">
    <rect class="card suspend" x="1406" y="646" width="264" height="90" rx="8"/>
    <text class="smallName" x="1538" y="678" text-anchor="middle">SuspendBloomFilter</text>
    <text class="meta" x="1538" y="707" text-anchor="middle">same BitSet contract</text>
    <text class="meta" x="1538" y="730" text-anchor="middle">suspend script runner</text>
  </g>
  <g id="suspend-cuckoo">
    <rect class="card suspend" x="1406" y="766" width="264" height="78" rx="8"/>
    <text class="smallName" x="1538" y="798" text-anchor="middle">SuspendCuckooFilter</text>
    <text class="meta" x="1538" y="823" text-anchor="middle">same delete contract</text>
  </g>

  <g id="redis-hash">
    <rect class="card redis" x="112" y="982" width="240" height="82" rx="8"/>
    <text class="name" x="232" y="1015" text-anchor="middle">Redis Hash</text>
    <text class="meta" x="232" y="1044" text-anchor="middle">HSET / HGET / HDEL</text>
  </g>
  <g id="redis-string">
    <rect class="card redis" x="433" y="982" width="240" height="82" rx="8"/>
    <text class="name" x="553" y="1015" text-anchor="middle">Redis String</text>
    <text class="meta" x="553" y="1044" text-anchor="middle">INCRBY + value scripts</text>
  </g>
  <g id="redis-coordination">
    <rect class="card script" x="744" y="982" width="262" height="82" rx="8"/>
    <text class="name" x="875" y="1015" text-anchor="middle">Lua coordination</text>
    <text class="meta" x="875" y="1044" text-anchor="middle">lock token, permit bounds</text>
  </g>
  <g id="redis-hll">
    <rect class="card redis" x="1075" y="982" width="240" height="82" rx="8"/>
    <text class="name" x="1195" y="1015" text-anchor="middle">Redis HLL</text>
    <text class="meta" x="1195" y="1044" text-anchor="middle">PFADD / PFCOUNT / PFMERGE</text>
  </g>
  <g id="redis-filter">
    <rect class="card script" x="1406" y="982" width="264" height="82" rx="8"/>
    <text class="name" x="1538" y="1015" text-anchor="middle">BitSet + buckets</text>
    <text class="meta" x="1538" y="1044" text-anchor="middle">Lua scripts keep state atomic</text>
  </g>

  <path class="useBlue" d="M 232 468 V 520 H 104 V 1023 H 112"/>
  <path class="usePurple" d="M 260 828 V 874 H 376 V 1023 H 352"/>
  <path class="useBlue" d="M 553 418 V 524 H 704 V 1023 H 673"/>
  <path class="usePurple" d="M 595 778 V 874 H 704 V 1042 H 673"/>
  <path class="useBlue" d="M 875 484 V 524 H 1026 V 1023 H 1006"/>
  <path class="usePurple" d="M 930 844 V 874 H 1026 V 1042 H 1006"/>
  <path class="useBlue" d="M 1195 414 V 524 H 1346 V 1023 H 1315"/>
  <path class="usePurple" d="M 1263 774 V 874 H 1346 V 1042 H 1315"/>
  <path class="useBlue" d="M 1538 484 V 524 H 1715 V 1023 H 1670"/>
  <path class="usePurple" d="M 1618 844 V 874 H 1715 V 1042 H 1670"/>

  <g id="legend" transform="translate(112,1138)">
    <path class="extendsLine" d="M 0 14 H 52"/>
    <text class="tiny" x="68" y="19">extends</text>
    <path class="useBlue" d="M 170 14 H 222"/>
    <text class="tiny" x="238" y="19">sync/async uses Redis command surface</text>
    <path class="usePurple" d="M 510 14 H 562"/>
    <text class="tiny" x="578" y="19">suspend uses RedisFuture/await bridge</text>
  </g>
</svg>
