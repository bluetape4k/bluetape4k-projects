<svg data-intent="Explain workflow decision routing by showing branch condition checks, selected transition, retry/failure alternatives, and final workflow outcome." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1460" height="940" viewBox="0 0 1460 940" role="img" aria-label="Repeat Flow State Loop" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1460" height="940"/>
<rect class="frame" x="34" y="30" width="1392" height="880" rx="32"/>
<text class="title" x="72" y="84">Repeat Flow State Loop</text>
<text class="subtitle" x="76" y="116">Each iteration feeds the latest WorkReport into the repeat predicate; terminal reports and maxIterations stop the loop.</text>
<g id="start">
  <rect class="card" x="130" y="245" width="290" height="76" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="275" y="276" text-anchor="middle" dominant-baseline="middle">Repeat flow starts</text>
  <text class="detail" x="275" y="306" text-anchor="middle" dominant-baseline="middle">iteration = 0</text>
</g>
<g id="work">
  <rect class="card" x="560" y="230" width="330" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="725" y="271" text-anchor="middle" dominant-baseline="middle">Execute work</text>
  <text class="detail" x="725" y="301" text-anchor="middle" dominant-baseline="middle">one iteration produces report</text>
</g>
<g id="terminal">
  <polygon class="card card-shape" points="1190,215 1350,278 1190,341 1030,278" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1190" y="270" text-anchor="middle" dominant-baseline="middle">Abort/cancel?</text>
  <text class="detail" x="1190" y="299" text-anchor="middle" dominant-baseline="middle">terminal states bypass loop</text>
</g>
<g id="predicate">
  <polygon class="card card-shape" points="725,490 885,553 725,616 565,553" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="725" y="545" text-anchor="middle" dominant-baseline="middle">Repeat predicate?</text>
  <text class="detail" x="725" y="574" text-anchor="middle" dominant-baseline="middle">uses latest WorkReport</text>
</g>
<g id="limit">
  <polygon class="card card-shape" points="325,490 475,553 325,616 175,553" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="325" y="545" text-anchor="middle" dominant-baseline="middle">Max iterations?</text>
  <text class="detail" x="325" y="574" text-anchor="middle" dominant-baseline="middle">safety guard</text>
</g>
<g id="delay">
  <rect class="card" x="565" y="715" width="320" height="78" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="725" y="747" text-anchor="middle" dominant-baseline="middle">Repeat delay</text>
  <text class="detail" x="725" y="777" text-anchor="middle" dominant-baseline="middle">suspend flow may wait</text>
</g>
<g id="done">
  <rect class="card" x="1030" y="520" width="320" height="82" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1190" y="554" text-anchor="middle" dominant-baseline="middle">Return last report</text>
  <text class="detail" x="1190" y="584" text-anchor="middle" dominant-baseline="middle">predicate false or limit reached</text>
</g>
<path class="route" data-from="start" data-to="work" d="M420 283 L560 278" stroke="#4F83BF"/>
<path class="route" data-from="work" data-to="terminal" d="M890 278 L1030 278" stroke="#3E9868"/>
<path class="route" data-from="terminal" data-to="done" d="M1190 341 L1190 520" stroke="#C94D68"/>
<g><rect class="labelPill" x="1220" y="417" width="52" height="26" rx="8"/><text class="detail" x="1246" y="431" text-anchor="middle" dominant-baseline="middle" style="fill:#C94D68">yes</text></g>
<path class="route" data-from="terminal" data-to="predicate" d="M1085 341 L1085 430 L725 430 L725 490" stroke="#3E9868"/>
<g><rect class="labelPill" x="1020" y="373" width="48" height="26" rx="8"/><text class="detail" x="1044" y="387" text-anchor="middle" dominant-baseline="middle" style="fill:#3E9868">no</text></g>
<path class="route" data-from="predicate" data-to="done" d="M885 553 L1030 561" stroke="#718A35"/>
<g><rect class="labelPill" x="926" y="507" width="64" height="26" rx="8"/><text class="detail" x="958" y="521" text-anchor="middle" dominant-baseline="middle" style="fill:#718A35">false</text></g>
<path class="route" data-from="predicate" data-to="limit" d="M565 553 L475 553" stroke="#B9851B"/>
<g><rect class="labelPill" x="491" y="507" width="58" height="26" rx="8"/><text class="detail" x="520" y="521" text-anchor="middle" dominant-baseline="middle" style="fill:#B9851B">true</text></g>
<path class="route dashed" data-from="limit" data-to="done" d="M400 616 L400 665 L1190 665 L1190 602" stroke="#B9851B"/>
<g><rect class="labelPill" x="699" y="627" width="122" height="26" rx="8"/><text class="detail" x="760" y="641" text-anchor="middle" dominant-baseline="middle" style="fill:#B9851B">limit reached</text></g>
<path class="route" data-from="limit" data-to="delay" d="M250 616 L250 754 L565 754" stroke="#2E8F89"/>
<g><rect class="labelPill" x="395" y="715" width="100" height="26" rx="8"/><text class="detail" x="445" y="729" text-anchor="middle" dominant-baseline="middle" style="fill:#2E8F89">room left</text></g>
<path class="route dashed" data-from="delay" data-to="work" d="M885 754 L1390 754 L1390 190 L725 190 L725 230" stroke="#2E8F89"/>
</svg>
