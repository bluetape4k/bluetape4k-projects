<g id="m3"><rect class="labelPill" x="1045" y="439" width="274.5" height="26" rx="7"/><circle cx="1064" cy="452" r="12" fill="#2E8F89"/><text class="detail" x="1064" y="453" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1200.3" y="453" text-anchor="middle" dominant-baseline="middle">await().atMost(5.seconds)</text><path class="seq" d="M935 482 L1025 482 L1025 520 L953 520" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
