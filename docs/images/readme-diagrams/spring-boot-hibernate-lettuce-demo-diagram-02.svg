<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600" role="img" aria-label="Hibernate Lettuce demo runtime flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>

  <marker id="arrow-blue" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#1D4ED8"/></marker>
  <marker id="arrow-green" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#15803D"/></marker>
  <marker id="arrow-teal" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#0F766E"/></marker>
  <marker id="arrow-amber" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#C2410C"/></marker>
  <marker id="arrow-pink" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#BE185D"/></marker>
  <marker id="arrow-purple" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#7E22CE"/></marker>
  <marker id="arrow-slate" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 19 11 L 2 20 Z" fill="#475569"/></marker>

  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:48px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .band{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}.bandTitle{font-family:"Comic Mono";font-size:15px;fill:#64748B}
    .card{filter:url(#shadow);stroke-width:1.8}.cardTitle{font-family:"Architects Daughter";font-size:29px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:14px;fill:#334155}
    .edge{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:10 8}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="2200" height="1600"/>
<rect class="frame" x="34" y="30" width="2132" height="1540" rx="8"/>
<text class="title" x="72" y="86">Hibernate Lettuce Demo Runtime Flow</text>
<text class="subtitle" x="76" y="120">Product CRUD uses Hibernate 2LC and Lettuce Near Cache; management endpoints read stats or clear only the local L1 cache.</text>

<rect class="band" x="76" y="170" width="2048" height="170" rx="8"/>
<text class="bandTitle" x="104" y="204">request entrypoints</text>
<rect class="band" x="76" y="385" width="2048" height="450" rx="8"/>
<text class="bandTitle" x="104" y="419">Spring Data JPA and Hibernate cache lookup</text>
<rect class="band" x="76" y="870" width="2048" height="380" rx="8"/>
<text class="bandTitle" x="104" y="904">near-cache region service</text>
<rect class="band" x="76" y="1280" width="2048" height="180" rx="8"/>
<text class="bandTitle" x="104" y="1314">backing storage and observations</text>

<g id="HttpClient">
  <rect class="card" x="800" y="220" width="600" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="1100" y="258" text-anchor="middle">HTTP client</text>
  <text class="detail" x="1100" y="288" text-anchor="middle">/api/products and /api/cache requests</text>
</g>

<g id="ProductController">
  <rect class="card" x="150" y="450" width="560" height="160" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="430" y="496" text-anchor="middle">ProductController</text>
  <text class="detail" x="430" y="530" text-anchor="middle">GET, POST, PUT, DELETE /api/products</text>
  <text class="detail" x="430" y="556" text-anchor="middle">delegates CRUD to ProductRepository</text>
</g>

<g id="CacheController">
  <rect class="card" x="1490" y="450" width="560" height="160" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1770" y="496" text-anchor="middle">CacheController</text>
  <text class="detail" x="1770" y="530" text-anchor="middle">GET /api/cache/stats</text>
  <text class="detail" x="1770" y="556" text-anchor="middle">DELETE /api/cache/evict, /evict/{region}</text>
</g>

<g id="ProductRepository">
  <rect class="card" x="150" y="660" width="560" height="150" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="430" y="704" text-anchor="middle">ProductRepository</text>
  <text class="detail" x="430" y="738" text-anchor="middle">JpaRepository&lt;Product, Long&gt;</text>
  <text class="detail" x="430" y="764" text-anchor="middle">findByName() uses cache.retrieveMode = USE</text>
</g>

<g id="HibernateSessionFactory">
  <rect class="card" x="810" y="660" width="580" height="150" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1100" y="704" text-anchor="middle">Hibernate SessionFactory</text>
  <text class="detail" x="1100" y="738" text-anchor="middle">2nd-level cache lookup for Product region</text>
  <text class="detail" x="1100" y="764" text-anchor="middle">uses RegionFactory service</text>
</g>

<g id="EntityManagerFactory">
  <rect class="card" x="1490" y="660" width="560" height="150" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1770" y="704" text-anchor="middle">EntityManagerFactory</text>
  <text class="detail" x="1770" y="738" text-anchor="middle">unwraps SessionFactoryImplementor</text>
  <text class="detail" x="1770" y="764" text-anchor="middle">gets active LettuceNearCacheRegionFactory</text>
</g>

<g id="RegionFactory">
  <rect class="card" x="810" y="890" width="580" height="160" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="cardTitle" x="1100" y="936" text-anchor="middle">LettuceNearCacheRegionFactory</text>
  <text class="detail" x="1100" y="970" text-anchor="middle">owns per-region LettuceNearCache instances</text>
  <text class="detail" x="1100" y="996" text-anchor="middle">getCaches(), localStats(), clearLocal()</text>
</g>

<g id="NearCache">
  <rect class="card" x="810" y="1100" width="580" height="130" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1100" y="1142" text-anchor="middle">Lettuce Near Cache</text>
  <text class="detail" x="1100" y="1176" text-anchor="middle">L1 Caffeine for local hits</text>
  <text class="detail" x="1100" y="1202" text-anchor="middle">L2 Redis with RESP3 client tracking</text>
</g>

<g id="H2Database">
  <rect class="card" x="150" y="1330" width="560" height="100" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="430" y="1370" text-anchor="middle">H2 database</text>
  <text class="detail" x="430" y="1404" text-anchor="middle">source of truth when cache misses</text>
</g>

<g id="RedisL2">
  <rect class="card" x="810" y="1330" width="580" height="100" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1100" y="1370" text-anchor="middle">Redis L2</text>
  <text class="detail" x="1100" y="1404" text-anchor="middle">shared cached values and invalidation signals</text>
</g>

<g id="Stats">
  <rect class="card" x="1490" y="1330" width="560" height="100" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1770" y="1370" text-anchor="middle">Metrics and actuator stats</text>
  <text class="detail" x="1770" y="1404" text-anchor="middle">region size, hit counts, miss counts, hit rate</text>
</g>

<g data-from="HttpClient" data-to="ProductController">
  <path class="edge" d="M965 310 L965 360 L430 360 L430 450" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="514" y="338">product CRUD</text>
</g>
<g data-from="HttpClient" data-to="CacheController">
  <path class="edge dashed" d="M1235 310 L1235 360 L1770 360 L1770 450" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1590" y="338">cache management</text>
</g>
<g data-from="ProductController" data-to="ProductRepository">
  <path class="edge" d="M430 610 L430 660" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <text class="edgeLabel" x="456" y="642">repository calls</text>
</g>
<g data-from="ProductRepository" data-to="HibernateSessionFactory">
  <path class="edge" d="M710 735 L810 735" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <text class="edgeLabel" x="724" y="714">JPA access</text>
</g>
<g data-from="HibernateSessionFactory" data-to="RegionFactory">
  <path class="edge" d="M1100 810 L1100 890" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <text class="edgeLabel" x="1126" y="856">RegionFactory service</text>
</g>
<g data-from="CacheController" data-to="EntityManagerFactory">
  <path class="edge dashed" d="M1770 610 L1770 660" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1796" y="642">unwraps</text>
</g>
<g data-from="EntityManagerFactory" data-to="RegionFactory">
  <path class="edge dashed" d="M1490 735 L1440 735 L1440 940 L1390 940" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1410" y="834">getCaches()</text>
</g>
<g data-from="RegionFactory" data-to="NearCache">
  <path class="edge" d="M1100 1050 L1100 1100" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <text class="edgeLabel" x="1126" y="1082">per-region cache</text>
</g>
<g data-from="HibernateSessionFactory" data-to="H2Database">
  <path class="edge dashed" d="M930 810 L930 850 L430 850 L430 1330" stroke="#65A30D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="468" y="1310">cache miss loads entity</text>
</g>
<g data-from="NearCache" data-to="RedisL2">
  <path class="edge" d="M1100 1230 L1100 1330" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <text class="edgeLabel" x="1126" y="1286">L2 operations</text>
</g>
<g data-from="RegionFactory" data-to="Stats">
  <path class="edge dashed" d="M1390 1015 L1770 1015 L1770 1330" stroke="#7E22CE" marker-end="url(#arrow-purple)"/>
  <text class="edgeLabel" x="1788" y="1168">stats and L1 eviction</text>
</g>
</svg>
