<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="Hibernate Lettuce demo runtime flow">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" />
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" />
    </marker>
    <marker id="open-gray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="16" refY="9" orient="auto" overflow="visible">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" />
    </marker>
  </defs>
  <rect width="1500" height="980" fill="#ffffff" />
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">Hibernate Lettuce Demo Runtime Flow</text>
  <text x="72" y="92" font-size="15" fill="#64748b">Product CRUD uses Hibernate 2LC; cache management and Actuator observe or clear only the local near-cache where intended.</text>

  <g class="group" data-group="HTTP AND OPERATIONS">
    <rect x="42" y="132" width="390" height="684" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="60" y="158" font-size="14" font-weight="700" fill="#2563eb">HTTP AND OPERATIONS</text>
    <text x="60" y="179" font-size="12.5" fill="#6b7280">User-facing endpoints drive product and cache scenarios.</text>
  </g>

  <g class="group" data-group="JPA AND DATABASE">
    <rect x="472" y="132" width="416" height="684" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="490" y="158" font-size="14" font-weight="700" fill="#16a34a">JPA AND DATABASE</text>
    <text x="490" y="179" font-size="12.5" fill="#6b7280">Repository calls reach the database on cache miss.</text>
  </g>

  <g class="group" data-group="NEAR CACHE TIERS">
    <rect x="922" y="132" width="448" height="684" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="940" y="158" font-size="14" font-weight="700" fill="#64748b">NEAR CACHE TIERS</text>
    <text x="940" y="179" font-size="12.5" fill="#6b7280">L1 Caffeine and L2 Redis are configured by application.yml.</text>
  </g>
  <path class="edge" d="M400 265 L510 265" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <path class="edge" d="M848 265 L960 265" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M1145 324 L1145 420" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" />
  <path class="edge" d="M1145 542 L1145 646" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M960 720 L848 720" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" />

  <polyline points="866,712 848,720 866,728" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge" d="M400 707 L450 707 L450 590 L900 590 L900 520 L960 520" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M400 481 L960 481" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" />

  <g class="card" data-card="Product Request">
    <rect x="70" y="206" width="330" height="118" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <rect x="70" y="206" width="10" height="118" rx="5" fill="#2563eb" opacity="0.9" />
    <text x="96" y="240" font-size="18" font-weight="700" fill="#111827">Product Request</text>
    <text x="96" y="268" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">GET /api/products/{id}</text>
<text x="96" y="287" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">POST, PUT, DELETE mutate data</text>
<text x="96" y="306" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">list endpoint bypasses 2LC focus</text>
  </g>

  <g class="card" data-card="Spring Data JPA">
    <rect x="510" y="206" width="338" height="118" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <rect x="510" y="206" width="10" height="118" rx="5" fill="#16a34a" opacity="0.9" />
    <text x="536" y="240" font-size="18" font-weight="700" fill="#111827">Spring Data JPA</text>
    <text x="536" y="268" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">ProductRepository delegates to Hibernate</text>
<text x="536" y="287" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">Product has @Cacheable and product region</text>
<text x="536" y="306" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">findByName uses retrieveMode=USE</text>
  </g>

  <g class="card" data-card="Hibernate 2LC">
    <rect x="960" y="206" width="370" height="118" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8" />
    <rect x="960" y="206" width="10" height="118" rx="5" fill="#0f766e" opacity="0.9" />
    <text x="986" y="240" font-size="18" font-weight="700" fill="#111827">Hibernate 2LC</text>
    <text x="986" y="268" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">RegionFactory owns the cache regions</text>
<text x="986" y="287" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">product region TTL is 300s</text>
<text x="986" y="306" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">default Redis TTL is 120s</text>
  </g>

  <g class="card" data-card="L1 Local Cache">
    <rect x="960" y="420" width="370" height="122" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="960" y="420" width="10" height="122" rx="5" fill="#7c3aed" opacity="0.9" />
    <text x="986" y="454" font-size="18" font-weight="700" fill="#111827">L1 Local Cache</text>
    <text x="986" y="482" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">Caffeine near-cache</text>
<text x="986" y="501" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">max-size: 5000</text>
<text x="986" y="520" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">expire-after-write: 15m</text>
  </g>

  <g class="card" data-card="L2 Redis Cache">
    <rect x="960" y="646" width="370" height="122" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <rect x="960" y="646" width="10" height="122" rx="5" fill="#ea580c" opacity="0.9" />
    <text x="986" y="680" font-size="18" font-weight="700" fill="#111827">L2 Redis Cache</text>
    <text x="986" y="708" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">Redis URI: redis://localhost:6379</text>
<text x="986" y="727" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">codec: lz4fory</text>
<text x="986" y="746" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">RESP3 tracking enabled</text>
  </g>

  <g class="card" data-card="H2 Database">
    <rect x="510" y="646" width="338" height="122" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" />
    <rect x="510" y="646" width="10" height="122" rx="5" fill="#64748b" opacity="0.9" />
    <text x="536" y="680" font-size="18" font-weight="700" fill="#111827">H2 Database</text>
    <text x="536" y="708" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">jdbc:h2:mem:demo</text>
<text x="536" y="727" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">ddl-auto: create-drop</text>
<text x="536" y="746" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">source of truth on cache miss</text>
  </g>

  <g class="card" data-card="Cache Management">
    <rect x="70" y="646" width="330" height="122" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <rect x="70" y="646" width="10" height="122" rx="5" fill="#ea580c" opacity="0.9" />
    <text x="96" y="680" font-size="18" font-weight="700" fill="#111827">Cache Management</text>
    <text x="96" y="708" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">GET /api/cache/stats reads localStats()</text>
<text x="96" y="727" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">DELETE /api/cache/evict clears L1 only</text>
<text x="96" y="746" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">Redis L2 is intentionally untouched</text>
  </g>

  <g class="card" data-card="Actuator Metrics">
    <rect x="70" y="420" width="330" height="122" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <rect x="70" y="420" width="10" height="122" rx="5" fill="#7c3aed" opacity="0.9" />
    <text x="96" y="454" font-size="18" font-weight="700" fill="#111827">Actuator Metrics</text>
    <text x="96" y="482" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">/actuator/nearcache</text>
<text x="96" y="501" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">/actuator/metrics</text>
<text x="96" y="520" text-anchor="start" font-size="13.3" font-weight="400" fill="#475569">exposes health, info, metrics, nearcache</text>
  </g>
  <g class="legend" transform="translate(72 894)">
    <line x1="0" y1="0" x2="42" y2="0" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow-green)" /><text x="58" y="5" font-size="13" fill="#475569">cacheable data path</text>
    <line x1="260" y1="0" x2="302" y2="0" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)" /><text x="318" y="5" font-size="13" fill="#475569">cache management path</text>
    <line x1="570" y1="0" x2="612" y2="0" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrow-purple)" /><text x="628" y="5" font-size="13" fill="#475569">observability path</text>
    <line x1="830" y1="0" x2="872" y2="0" stroke="#64748b" stroke-width="2.4" stroke-dasharray="6 5" />

    <polyline points="854,8 872,0 854,-8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/><text x="888" y="5" font-size="13" fill="#475569">cache miss fallback</text>
  </g>
</svg>
