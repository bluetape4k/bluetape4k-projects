<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1062" viewBox="0 0 1720 1062" role="img" aria-label="Rule Execution Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1720" height="1062"/>
<rect class="frame" x="32" y="28" width="1656" height="1006" rx="28"/>
<text class="title" x="66" y="82">Rule Execution Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="195" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="195" y1="252" x2="195" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="412.5" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="527.5" y="209" text-anchor="middle">RuleEngine</text>
<line class="lifeline" x1="527.5" y1="252" x2="527.5" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="745" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="860" y="209" text-anchor="middle">RuleListener</text>
<line class="lifeline" x1="860" y1="252" x2="860" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1077.5" y="166" width="230" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1192.5" y="209" text-anchor="middle">Rule</text>
<line class="lifeline" x1="1192.5" y1="252" x2="1192.5" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1410" y="166" width="230" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1525" y="209" text-anchor="middle">Facts</text>
<line class="lifeline" x1="1525" y1="252" x2="1525" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="250.3" y="286" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="268.3" y="313" text-anchor="start">1. fire(ruleSet, facts)</text>
<path class="line" d="M195 332 L527.5 332"/>
<rect x="125" y="396" width="1470" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="423" text-anchor="start">LOOP: each Rule (priority order)</text>
<rect x="554.8" y="362" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="572.8" y="389" text-anchor="start">3. beforeEvaluate(rule, facts)</text>
<path class="line" d="M527.5 408 L860 408"/>
<rect x="755" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="465" text-anchor="start">4. evaluate(facts)</text>
<path class="line" d="M527.5 484 L1192.5 484"/>
<rect x="755" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="541" text-anchor="start">5. true / false</text>
<path class="dashed" d="M1192.5 560 L527.5 560"/>
<rect x="125" y="794" width="1470" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="821" text-anchor="start">ALT: condition = true</text>
<rect x="755" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="617" text-anchor="start">7. execute(facts)</text>
<path class="line" d="M527.5 636 L1192.5 636"/>
<rect x="1253.8" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1271.8" y="693" text-anchor="start">8. modify values</text>
<path class="line" d="M1192.5 712 L1525 712"/>
<rect x="574.8" y="742" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="592.8" y="769" text-anchor="start">9. onSuccess(rule, facts)</text>
<path class="line" d="M527.5 788 L860 788"/>
<rect x="125" y="1192" width="1470" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="1219" text-anchor="start">ELSE: condition = false</text>
<rect x="570.8" y="818" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="588.8" y="845" text-anchor="start">11. onFailure(rule, facts)</text>
<path class="line" d="M527.5 864 L860 864"/>
<rect x="256.3" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="274.3" y="921" text-anchor="start">12. done</text>
<path class="dashed" d="M527.5 940 L195 940"/>
</svg>
