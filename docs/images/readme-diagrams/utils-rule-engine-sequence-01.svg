<svg xmlns="http://www.w3.org/2000/svg" width="1870" height="1396" viewBox="0 0 1870 1396" role="img" aria-label="Rule Execution Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1870" height="1396"/>
<rect class="frame" x="32" y="28" width="1806" height="1340" rx="30"/>
<text class="title" x="68" y="84">Rule Execution Sequence</text>
<text class="subtitle" x="72" y="116">Source-checked interaction flow redrawn with compact labels, numbered calls, and readable branch semantics.</text>
<g id="seq-caller"><rect class="card" x="140" y="170" width="230" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="255" y="215" text-anchor="middle">Caller</text><line class="lifeline" x1="255" y1="248" x2="255" y2="1312"/></g>
<g id="seq-ruleengine"><rect class="card" x="480" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="595" y="215" text-anchor="middle">RuleEngine</text><line class="lifeline" x1="595" y1="248" x2="595" y2="1312"/></g>
<g id="seq-rulelistener"><rect class="card" x="820" y="170" width="230" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="935" y="215" text-anchor="middle">RuleListener</text><line class="lifeline" x1="935" y1="248" x2="935" y2="1312"/></g>
<g id="seq-rule"><rect class="card" x="1160" y="170" width="230" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1275" y="215" text-anchor="middle">Rule</text><line class="lifeline" x1="1275" y1="248" x2="1275" y2="1312"/></g>
<g id="seq-facts"><rect class="card" x="1500" y="170" width="230" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1615" y="215" text-anchor="middle">Facts</text><line class="lifeline" x1="1615" y1="248" x2="1615" y2="1312"/></g>
<g><rect class="altBox" x="112" y="308" width="1646" height="46" rx="16"/><rect class="labelPill branchPill" x="292.4" y="294" width="265.2" height="26" rx="7"/><text class="detail" x="425" y="307" text-anchor="middle" dominant-baseline="middle">loop each Rule (priority order)</text></g>
<g><rect class="altBox" x="112" y="366" width="1646" height="46" rx="16"/><rect class="labelPill branchPill" x="332" y="352" width="186" height="26" rx="7"/><text class="detail" x="425" y="365" text-anchor="middle" dominant-baseline="middle">alt condition = true</text></g>
<g><rect class="altBox" x="112" y="424" width="1646" height="46" rx="16"/><rect class="labelPill branchPill" x="324.8" y="410" width="200.4" height="26" rx="7"/><text class="detail" x="425" y="423" text-anchor="middle" dominant-baseline="middle">else condition = false</text></g>
<rect x="247" y="496" width="16" height="732" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="587" y="496" width="16" height="732" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="927" y="584" width="16" height="556" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1267" y="672" width="16" height="292" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1607" y="936" width="16" height="52" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="306" y="461" width="238" height="26" rx="7"/><circle cx="325" cy="474" r="12" fill="#4F83BF"/><text class="detail" x="325" y="475" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="443" y="475" text-anchor="middle" dominant-baseline="middle">fire(ruleSet, facts)</text><path class="seq" d="M255 504 L595 504" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="620.5" y="549" width="289.1" height="26" rx="7"/><circle cx="639.5" cy="562" r="12" fill="#3E9868"/><text class="detail" x="639.5" y="563" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="783" y="563" text-anchor="middle" dominant-baseline="middle">beforeEvaluate(rule, facts)</text><path class="seq" d="M595 592 L935 592" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="830" y="637" width="210" height="26" rx="7"/><circle cx="849" cy="650" r="12" fill="#2E8F89"/><text class="detail" x="849" y="651" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="953" y="651" text-anchor="middle" dominant-baseline="middle">evaluate(facts)</text><path class="seq" d="M595 680 L1275 680" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="830" y="725" width="210" height="26" rx="7"/><circle cx="849" cy="738" r="12" fill="#2E8F89"/><text class="detail" x="849" y="739" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="953" y="739" text-anchor="middle" dominant-baseline="middle">true / false</text><path class="seqReturn" d="M1275 768 L595 768" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m5"><rect class="labelPill" x="830" y="813" width="210" height="26" rx="7"/><circle cx="849" cy="826" r="12" fill="#C94D68"/><text class="detail" x="849" y="827" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="953" y="827" text-anchor="middle" dominant-baseline="middle">execute(facts)</text><path class="seq" d="M595 856 L1275 856" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="1340" y="901" width="210" height="26" rx="7"/><circle cx="1359" cy="914" r="12" fill="#2E8F89"/><text class="detail" x="1359" y="915" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1463" y="915" text-anchor="middle" dominant-baseline="middle">modify values</text><path class="seqReturn" d="M1275 944 L1615 944" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m7"><rect class="labelPill" x="638.7" y="989" width="252.6" height="26" rx="7"/><circle cx="657.7" cy="1002" r="12" fill="#2E8F89"/><text class="detail" x="657.7" y="1003" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="783" y="1003" text-anchor="middle" dominant-baseline="middle">onSuccess(rule, facts)</text><path class="seqReturn" d="M595 1032 L935 1032" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m8"><rect class="labelPill" x="638.7" y="1077" width="252.6" height="26" rx="7"/><circle cx="657.7" cy="1090" r="12" fill="#2E8F89"/><text class="detail" x="657.7" y="1091" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="783" y="1091" text-anchor="middle" dominant-baseline="middle">onFailure(rule, facts)</text><path class="seqReturn" d="M595 1120 L935 1120" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m9"><rect class="labelPill" x="320" y="1165" width="210" height="26" rx="7"/><circle cx="339" cy="1178" r="12" fill="#2E8F89"/><text class="detail" x="339" y="1179" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text><text class="detail" x="443" y="1179" text-anchor="middle" dominant-baseline="middle">done</text><path class="seqReturn" d="M595 1208 L255 1208" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
</svg>
