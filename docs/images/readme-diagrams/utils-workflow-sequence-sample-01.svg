<svg xmlns="http://www.w3.org/2000/svg" width="1860" height="1055" viewBox="0 0 1860 1055" role="img" aria-label="Workflow Execution Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.12;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1860" height="1055"/>
<rect class="frame" x="32" y="28" width="1796" height="999" rx="30"/>
<text class="title" x="68" y="84">Workflow Execution Sequence</text>
<text class="subtitle" x="72" y="116">Participants, lifelines, returns, and retry branch semantics without label or line overlap.</text>
<g id="seq-caller"><rect class="card" x="150" y="170" width="200" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="250" y="215" text-anchor="middle">Caller</text><line class="lifeline" x1="250" y1="248" x2="250" y2="900"/></g>
<g id="seq-runner"><rect class="card" x="500" y="170" width="220" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="610" y="215" text-anchor="middle">WorkflowRunner</text><line class="lifeline" x1="610" y1="248" x2="610" y2="900"/></g>
<g id="seq-definition"><rect class="card" x="855" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="970" y="215" text-anchor="middle">WorkflowDefinition</text><line class="lifeline" x1="970" y1="248" x2="970" y2="900"/></g>
<g id="seq-work"><rect class="card" x="1175" y="170" width="310" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1330" y="215" text-anchor="middle">Work / SuspendWork</text><line class="lifeline" x1="1330" y1="248" x2="1330" y2="900"/></g>
<g id="seq-report"><rect class="card" x="1510" y="170" width="200" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1610" y="215" text-anchor="middle">WorkReport</text><line class="lifeline" x1="1610" y1="248" x2="1610" y2="900"/></g>
<rect x="602" y="320" width="16" height="575" rx="5" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.4"/>
<rect x="962" y="382" width="16" height="90" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1322" y="535" width="16" height="125" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1602" y="725" width="16" height="95" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="317" y="277" width="226" height="26" rx="7"/><circle cx="336" cy="290" r="12" fill="#4F83BF"/><text class="detail" x="336" y="291" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="446" y="291" text-anchor="middle" dominant-baseline="middle">run(ctx, definition)</text><path class="seq" d="M250 320 L610 320" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="687.8" y="347" width="204.4" height="26" rx="7"/><circle cx="706.8" cy="360" r="12" fill="#755BC6"/><text class="detail" x="706.8" y="361" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="806" y="361" text-anchor="middle" dominant-baseline="middle">resolve next step</text><path class="seq" d="M610 390 L970 390" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m3"><rect class="labelPill" x="680.6" y="417" width="218.8" height="26" rx="7"/><circle cx="699.6" cy="430" r="12" fill="#3E9868"/><text class="detail" x="699.6" y="431" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="806" y="431" text-anchor="middle" dominant-baseline="middle">selected work order</text><path class="seqReturn" d="M970 460 L610 460" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g><rect class="altBox" x="760" y="500" width="700" height="178" rx="18"/><rect class="labelPill" x="785" y="486" width="240" height="26" rx="7"/><text class="detail" x="905" y="500" text-anchor="middle" dominant-baseline="middle">alt retry policy allows execution</text></g>
<g id="m4"><rect class="labelPill" x="875" y="527" width="190" height="26" rx="7"/><circle cx="894" cy="540" r="12" fill="#B9851B"/><text class="detail" x="894" y="541" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="986" y="541" text-anchor="middle" dominant-baseline="middle">execute(ctx)</text><path class="seq" d="M610 570 L1330 570" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="831.8" y="607" width="276.4" height="26" rx="7"/><circle cx="850.8" cy="620" r="12" fill="#B9851B"/><text class="detail" x="850.8" y="621" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="986" y="621" text-anchor="middle" dominant-baseline="middle">work result or retry signal</text><path class="seqReturn" d="M1330 650 L610 650" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m6"><rect class="labelPill" x="1011.4" y="692" width="197.2" height="26" rx="7"/><circle cx="1030.4" cy="705" r="12" fill="#2E8F89"/><text class="detail" x="1030.4" y="706" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1126" y="706" text-anchor="middle" dominant-baseline="middle">build WorkReport</text><path class="seq" d="M610 735 L1610 735" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m7"><rect class="labelPill" x="971.8" y="762" width="276.4" height="26" rx="7"/><circle cx="990.8" cy="775" r="12" fill="#2E8F89"/><text class="detail" x="990.8" y="776" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="1126" y="776" text-anchor="middle" dominant-baseline="middle">success / partial / failure</text><path class="seqReturn" d="M1610 805 L610 805" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m8"><rect class="labelPill" x="331.4" y="842" width="197.2" height="26" rx="7"/><circle cx="350.4" cy="855" r="12" fill="#4F83BF"/><text class="detail" x="350.4" y="856" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="446" y="856" text-anchor="middle" dominant-baseline="middle">completed report</text><path class="seqReturn" d="M610 885 L250 885" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g><rect x="260" y="910" width="1320" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="920" y="936" text-anchor="middle">Sequence sample keeps labels above arrows, lifelines as dashed stems, and alt semantics outside message paths.</text></g>
</svg>
