<svg xmlns="http://www.w3.org/2000/svg" width="2190" height="1250" viewBox="0 0 2190 1250" role="img" aria-label="Workflow Execution Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="2190" height="1250"/>
<rect class="frame" x="32" y="28" width="2126" height="1194" rx="30"/>
<text class="title" x="68" y="84">Workflow Execution Sequence</text>
<text class="subtitle" x="72" y="116">Source-checked interaction flow redrawn with compact labels, numbered calls, and readable branch semantics.</text>
<g id="seq-caller"><rect class="card" x="140" y="170" width="230" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="255" y="215" text-anchor="middle">Caller</text><line class="lifeline" x1="255" y1="248" x2="255" y2="1108"/></g>
<g id="seq-workflowrunner"><rect class="card" x="560" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="675" y="215" text-anchor="middle">WorkflowRunner</text><line class="lifeline" x1="675" y1="248" x2="675" y2="1108"/></g>
<g id="seq-workflowdefinition"><rect class="card" x="980" y="170" width="230" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1095" y="215" text-anchor="middle">WorkflowDefinition</text><line class="lifeline" x1="1095" y1="248" x2="1095" y2="1108"/></g>
<g id="seq-work-suspendwork"><rect class="card" x="1400" y="170" width="230" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1515" y="215" text-anchor="middle">Work / SuspendWork</text><line class="lifeline" x1="1515" y1="248" x2="1515" y2="1108"/></g>
<g id="seq-workreport"><rect class="card" x="1820" y="170" width="230" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1935" y="215" text-anchor="middle">WorkReport</text><line class="lifeline" x1="1935" y1="248" x2="1935" y2="1108"/></g>
<g><rect class="altBox" x="112" y="572" width="1966" height="46" rx="16"/><rect class="labelPill branchPill" x="325.2" y="558" width="279.6" height="26" rx="7"/><text class="detail" x="465" y="571" text-anchor="middle" dominant-baseline="middle">alt retry policy allows execution</text></g>
<rect x="247" y="322" width="16" height="702" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="667" y="322" width="16" height="702" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1087" y="410" width="16" height="116" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1507" y="644" width="16" height="116" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1927" y="820" width="16" height="116" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="338" y="287" width="254" height="26" rx="7"/><circle cx="357" cy="300" r="12" fill="#4F83BF"/><text class="detail" x="357" y="301" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="483" y="301" text-anchor="middle" dominant-baseline="middle">run(ctx, definition)</text><path class="seq" d="M255 330 L675 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="769" y="375" width="232.1" height="26" rx="7"/><circle cx="788" cy="388" r="12" fill="#3E9868"/><text class="detail" x="788" y="389" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="903" y="389" text-anchor="middle" dominant-baseline="middle">resolve next step</text><path class="seq" d="M675 418 L1095 418" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="761.7" y="463" width="246.7" height="26" rx="7"/><circle cx="780.7" cy="476" r="12" fill="#2E8F89"/><text class="detail" x="780.7" y="477" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="903" y="477" text-anchor="middle" dominant-baseline="middle">selected work order</text><path class="seqReturn" d="M1095 506 L675 506" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="980" y="609" width="230" height="26" rx="7"/><circle cx="999" cy="622" r="12" fill="#B9851B"/><text class="detail" x="999" y="623" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1113" y="623" text-anchor="middle" dominant-baseline="middle">execute(ctx)</text><path class="seq" d="M675 652 L1515 652" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="942.5" y="697" width="305.1" height="26" rx="7"/><circle cx="961.5" cy="710" r="12" fill="#2E8F89"/><text class="detail" x="961.5" y="711" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="1113" y="711" text-anchor="middle" dominant-baseline="middle">work result or retry signal</text><path class="seqReturn" d="M1515 740 L675 740" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m6"><rect class="labelPill" x="1190" y="785" width="230" height="26" rx="7"/><circle cx="1209" cy="798" r="12" fill="#755BC6"/><text class="detail" x="1209" y="799" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1323" y="799" text-anchor="middle" dominant-baseline="middle">build WorkReport</text><path class="seq" d="M675 828 L1935 828" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m7"><rect class="labelPill" x="1152.5" y="873" width="305.1" height="26" rx="7"/><circle cx="1171.5" cy="886" r="12" fill="#2E8F89"/><text class="detail" x="1171.5" y="887" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="1323" y="887" text-anchor="middle" dominant-baseline="middle">success / partial / failure</text><path class="seqReturn" d="M1935 916 L675 916" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m8"><rect class="labelPill" x="350" y="961" width="230" height="26" rx="7"/><circle cx="369" cy="974" r="12" fill="#2E8F89"/><text class="detail" x="369" y="975" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="483" y="975" text-anchor="middle" dominant-baseline="middle">completed report</text><path class="seqReturn" d="M675 1004 L255 1004" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g><rect x="140" y="1132" width="1910" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1095" y="1158" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
</svg>
