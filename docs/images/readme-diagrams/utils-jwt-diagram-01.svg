<svg data-intent="Explain JWT create and verify flow by showing claims/header input, algorithm/key selection, signing, token output, parser verification, and decoded claims/error outcomes." data-evidence="utils/jwt/README.md; utils/jwt/src/main/kotlin/io/bluetape4k/jwt" data-source-read="utils/jwt/README.md; utils/jwt/src/main/kotlin/io/bluetape4k/jwt" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="JWT Create and Verify Flow" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="8"/>
<text class="title" x="72" y="84">JWT Create and Verify Flow</text>
<text class="subtitle" x="76" y="116">The JWT helpers keep claim/header input, key/algorithm choice, signing, parser verification, and decoded outcome explicit.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Creation</text></g>
<g id="claims">
  <rect class="card" x="146" y="256" width="280" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="286" y="291" text-anchor="middle" dominant-baseline="middle">Claims + headers</text>
  <text class="detail" x="286" y="321" text-anchor="middle" dominant-baseline="middle">subject, issuer, expiration</text>
</g>
<g id="sign">
  <rect class="card" x="610" y="256" width="280" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="750" y="291" text-anchor="middle" dominant-baseline="middle">JWT signer</text>
  <text class="detail" x="750" y="321" text-anchor="middle" dominant-baseline="middle">build compact token</text>
</g>
<g id="alg">
  <rect class="card" x="1074" y="256" width="280" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1214" y="291" text-anchor="middle" dominant-baseline="middle">Algorithm / key</text>
  <text class="detail" x="1214" y="321" text-anchor="middle" dominant-baseline="middle">HMAC or RSA/ECDSA key</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Transport</text></g>
<g id="token">
  <rect class="card" x="570" y="574" width="360" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Compact JWT token</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">header.payload.signature</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Verification</text></g>
<g id="decoded">
  <rect class="card" x="146" y="892" width="280" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="286" y="927" text-anchor="middle" dominant-baseline="middle">Decoded claims</text>
  <text class="detail" x="286" y="957" text-anchor="middle" dominant-baseline="middle">trusted application input</text>
</g>
<g id="parser">
  <rect class="card" x="610" y="892" width="280" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="750" y="927" text-anchor="middle" dominant-baseline="middle">JWT parser</text>
  <text class="detail" x="750" y="957" text-anchor="middle" dominant-baseline="middle">verify signature and claims</text>
</g>
<g id="error">
  <rect class="card" x="1074" y="892" width="280" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1214" y="927" text-anchor="middle" dominant-baseline="middle">Validation error</text>
  <text class="detail" x="1214" y="957" text-anchor="middle" dominant-baseline="middle">expired / invalid token</text>
</g>
<path class="route" data-from="claims" data-to="sign" d="M426 298 L610 298" stroke="#1D4ED8"/>
<path class="route" data-from="alg" data-to="sign" d="M1074 298 L890 298" stroke="#7E22CE"/>
<path class="route" data-from="sign" data-to="token" d="M750 340 L750 574" stroke="#15803D"/>
<path class="route" data-from="token" data-to="parser" d="M750 658 L750 892" stroke="#C2410C"/>
<path class="route" data-from="parser" data-to="decoded" d="M610 934 L426 934" stroke="#0F766E"/>
<path class="route dashed" data-from="parser" data-to="error" d="M890 934 L1074 934" stroke="#BE185D"/>
</svg>
