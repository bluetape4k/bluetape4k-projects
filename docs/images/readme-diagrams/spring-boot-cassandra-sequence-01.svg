<rect x="24" y="24" width="1492" height="992" rx="20" class="frame"/>
<text x="770" y="76" text-anchor="middle" class="title">Coroutine Conversion Sequence</text>
<text x="770" y="106" text-anchor="middle" class="subtitle">Extensions keep Spring Data Cassandra reactive/async APIs source-compatible while returning suspend values or Flow streams.</text>
<rect x="62" y="146" width="176" height="70" rx="10" class="header"/>
<text x="150" y="176" text-anchor="middle" class="participant">Caller</text>
<text x="150" y="198" text-anchor="middle" class="role">suspend code</text>
<line x1="150" y1="216" x2="150" y2="900" class="lifeline"/>
<rect x="342" y="146" width="176" height="70" rx="10" class="header"/>
<text x="430" y="176" text-anchor="middle" class="participant">Extension</text>
<text x="430" y="198" text-anchor="middle" class="role">await/asFlow bridge</text>
<line x1="430" y1="216" x2="430" y2="900" class="lifeline"/>
<rect x="632" y="146" width="176" height="70" rx="10" class="header"/>
<text x="720" y="176" text-anchor="middle" class="participant">Spring Data</text>
<text x="720" y="198" text-anchor="middle" class="role">Reactive/Async ops</text>
<line x1="720" y1="216" x2="720" y2="900" class="lifeline"/>
<rect x="922" y="146" width="176" height="70" rx="10" class="header"/>
<text x="1010" y="176" text-anchor="middle" class="participant">Driver</text>
<text x="1010" y="198" text-anchor="middle" class="role">session / result set</text>
<line x1="1010" y1="216" x2="1010" y2="900" class="lifeline"/>
<rect x="1202" y="146" width="176" height="70" rx="10" class="header"/>
<text x="1290" y="176" text-anchor="middle" class="participant">Cassandra</text>
<text x="1290" y="198" text-anchor="middle" class="role">cluster</text>
<line x1="1290" y1="216" x2="1290" y2="900" class="lifeline"/>
<rect x="423" y="282" width="14" height="526" rx="6" class="activation"/>
<rect x="713" y="340" width="14" height="390" rx="6" class="activation"/>
<rect x="1003" y="408" width="14" height="252" rx="6" class="activation"/>
<rect x="1283" y="462" width="14" height="120" rx="6" class="activation"/>
<rect x="75" y="258" width="430" height="34" rx="17" class="label callLabel"/>
<circle cx="99" cy="275" r="13" class="badge callBadge"/><text fill="#FFFFFF" x="99" y="280" text-anchor="middle" class="badgeText callText">1</text>
<text x="123" y="280" class="msg callText">executeSuspending / selectAsFlow / insertSuspending</text>
<path d="M 150 300 L 430 300" class="call"/>
<rect x="380" y="318" width="390" height="34" rx="17" class="label callLabel"/>
<circle cx="404" cy="335" r="13" class="badge callBadge"/><text fill="#FFFFFF" x="404" y="340" text-anchor="middle" class="badgeText callText">2</text>
<text x="428" y="340" class="msg callText">build Statement, Query, or entity operation</text>
<path d="M 430 360 L 720 360" class="call"/>
<rect x="425" y="378" width="520" height="34" rx="17" class="label workLabel"/>
<circle cx="449" cy="395" r="13" class="badge workBadge"/><text fill="#FFFFFF" x="449" y="400" text-anchor="middle" class="badgeText workText">3</text>
<text x="473" y="400" class="msg workText">delegate to Spring Data Cassandra ops</text>
<path d="M 430 420 L 720 420" class="work"/>
<rect x="670" y="438" width="390" height="34" rx="17" class="label asyncLabel"/>
<circle cx="694" cy="455" r="13" class="badge asyncBadge"/><text fill="#FFFFFF" x="694" y="460" text-anchor="middle" class="badgeText asyncText">4</text>
<text x="718" y="460" class="msg asyncText">execute CQL through session</text>
<path d="M 720 480 L 1010 480" class="async"/>
<rect x="955" y="498" width="390" height="34" rx="17" class="label workLabel"/>
<circle cx="979" cy="515" r="13" class="badge workBadge"/><text fill="#FFFFFF" x="979" y="520" text-anchor="middle" class="badgeText workText">5</text>
<text x="1003" y="520" class="msg workText">send query and read result metadata</text>
<path d="M 1010 540 L 1290 540" class="work"/>
<rect x="715" y="578" width="520" height="34" rx="17" class="label returnLabel"/>
<circle cx="739" cy="595" r="13" class="badge returnBadge"/><text fill="#FFFFFF" x="739" y="600" text-anchor="middle" class="badgeText returnText">6</text>
<text x="763" y="600" class="msg returnText">ReactiveResultSet / Mono&lt;T&gt; / Flux&lt;T&gt; / CompletableFuture&lt;T&gt;</text>
<path d="M 1290 620 L 720 620" class="return"/>
<rect x="82" y="680" width="1376" height="176" rx="14" class="alt"/>
<text x="112" y="710" class="note">alt result shape</text>
<line x1="82" y1="768" x2="1458" y2="768" class="branchDivider"/>
<rect x="345" y="700" width="450" height="34" rx="17" class="label returnLabel"/>
<circle cx="369" cy="717" r="13" class="badge returnBadge"/><text x="369" y="722" text-anchor="middle" class="badgeText returnText">7a</text>
<text x="393" y="722" class="msg returnText">awaitSingle / awaitSingleOrNull returns suspend value</text>
<path d="M 720 742 L 430 742" class="return"/>
<rect x="370" y="786" width="430" height="34" rx="17" class="label returnLabel"/>
<circle cx="394" cy="803" r="13" class="badge returnBadge"/><text x="394" y="808" text-anchor="middle" class="badgeText returnText">7b</text>
<text x="418" y="808" class="msg returnText">asFlow streams rows without blocking caller thread</text>
<path d="M 720 828 L 430 828" class="return"/>
<rect x="80" y="858" width="420" height="34" rx="17" class="label returnLabel"/>
<circle cx="104" cy="875" r="13" class="badge returnBadge"/><text fill="#FFFFFF" x="104" y="880" text-anchor="middle" class="badgeText returnText">8</text>
<text x="128" y="880" class="msg returnText">caller receives T, T?, Boolean, Slice&lt;T&gt;, or Flow&lt;T&gt;</text>
<path d="M 430 900 L 150 900" class="return"/>
<rect x="98" y="940" width="1344" height="40" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="2"/>
<text x="770" y="966" text-anchor="middle" class="footer">Cancellation and driver exceptions are not hidden; Reactor/CompletableFuture errors surface through coroutine collection or await.</text>
</svg>
