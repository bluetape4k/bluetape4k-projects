  <text class="label" x="170" y="61" text-anchor="middle">RateLimitResult</text>
  <text class="mono" x="18" y="108">+status: RateLimitStatus</text>
<text class="mono" x="18" y="129">+consumedTokens: Long</text>
<text class="mono" x="18" y="150">+availableTokens: Long</text>
<text class="mono" x="18" y="171">+errorMessage: String?</text>
<text class="mono" x="18" y="192">+diagnostics: RateLimitDiagnostics</text>
<text class="mono" x="18" y="213">+retryAfter: Duration?</text>
</g>
<g transform="translate(502,903)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«enumeration»</text>
  <text class="label" x="170" y="61" text-anchor="middle">RateLimitStatus</text>
  <text class="mono" x="18" y="108">CONSUMED</text>
<text class="mono" x="18" y="129">REJECTED</text>
<text class="mono" x="18" y="150">ERROR</text>
</g>
<g transform="translate(912,903)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">SuspendLocalBucket</text>
  <text class="mono" x="18" y="108">+tryConsume(tokensToConsume, maxWaitTime)</text>
<text class="mono" x="18" y="129">Boolean</text>
<text class="mono" x="18" y="150">+consume(tokensToConsume)</text>
</g>
<g transform="translate(1322,903)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">SuspendRateLimiter</text>

</g>
