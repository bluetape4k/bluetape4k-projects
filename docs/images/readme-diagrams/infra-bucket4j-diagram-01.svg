<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="128" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Abstract Local Bucket</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Provider</text>

</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="233" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Abstract Local Bucket</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Provider T</text>
  <text class="mono" x="18" y="124">#bucketConfiguration: BucketConfiguration</text>
<text class="mono" x="18" y="145">#keyPrefix: String</text>
<text class="mono" x="18" y="166">#cache: LoadingCache</text>
<text class="mono" x="18" y="187">+resolveBucket(key: String) T</text>
<text class="mono" x="18" y="208">#createBucket() T</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">AsyncBucketProxyProvider</text>
  <text class="mono" x="18" y="108">#asyncProxyManager: AsyncProxyManager</text>
<text class="mono" x="18" y="129">#bucketConfiguration: BucketConfiguration</text>
<text class="mono" x="18" y="150">+resolveBucket(key: String)</text>
<text class="mono" x="18" y="171">AsyncBucketProxy</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">BucketProxyProvider</text>
  <text class="mono" x="18" y="108">#proxyManager: ProxyManager</text>
<text class="mono" x="18" y="129">#bucketConfiguration: BucketConfiguration</text>
<text class="mono" x="18" y="150">+resolveBucket(key: String) BucketProxy</text>
</g>
<g transform="translate(92,539)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
