  <text class="label" x="170" y="61" text-anchor="middle">DistributedRateLimiter</text>
  <text class="mono" x="18" y="108">-bucketProxyProvider: BucketProxyProvider</text>
<text class="mono" x="18" y="129">+consume(key, numToken) RateLimitResult</text>
</g>
<g transform="translate(502,1571)">
  <rect class="card" x="0" y="0" width="340" height="254" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#B88A44"/>
