  <text class="label" x="170" y="61" text-anchor="middle">RateLimitRejectionReason</text>
  <text class="mono" x="18" y="108">INSUFFICIENT_TOKENS</text>
</g>
<g transform="translate(92,903)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
