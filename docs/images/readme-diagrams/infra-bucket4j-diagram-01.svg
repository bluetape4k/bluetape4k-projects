<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="Bucket4j integration class diagram">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="triangleBlue" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7 L 1 13 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="triangleGreen" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7 L 1 13 Z" fill="#ffffff" stroke="#16a34a" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="triangleOrange" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7 L 1 13 Z" fill="#ffffff" stroke="#ea580c" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="openPurple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .section { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .sectionText { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .box { fill: #ffffff; stroke-width: 1.8; filter: url(#softShadow); }
      .sync { stroke: #2563eb; }
      .async { stroke: #16a34a; }
      .provider { stroke: #ea580c; }
      .result { stroke: #9333ea; }
      .helper { stroke: #64748b; }
      .boxTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .mono { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .implementsSync { fill: none; stroke: #2563eb; stroke-width: 2.35; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#triangleBlue); }
      .implementsAsync { fill: none; stroke: #16a34a; stroke-width: 2.35; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#triangleGreen); }
      .extendsProvider { fill: none; stroke: #ea580c; stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#triangleOrange); }
      .uses { fill: none; stroke: #9333ea; stroke-width: 2.35; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openPurple); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="980"/>
  <rect class="frame" x="36" y="32" width="1428" height="916" rx="8"/>
  <text class="title" x="74" y="86">Bucket4j Integration Class Diagram</text>
  <text class="subtitle" x="78" y="116">Sync and coroutine limiters implement immediate consumption, resolve key-based buckets, and return one stable result type.</text>

  <rect class="section" x="74" y="154" width="232" height="38" rx="8"/>
  <text class="sectionText" x="92" y="179">Rate limiter contracts</text>
  <rect class="section" x="74" y="500" width="124" height="38" rx="8"/>
  <text class="sectionText" x="92" y="525">Providers</text>

  <g id="rateLimiter">
    <rect class="box sync" x="112" y="222" width="326" height="78" rx="8" fill="#eff6ff"/>
    <text class="stereo" x="275" y="245" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="boxTitle" x="275" y="271" text-anchor="middle">RateLimiter&lt;K&gt;</text>
    <text class="mono" x="275" y="293" text-anchor="middle">consume(key, numToken): RateLimitResult</text>
  </g>

  <g id="resultContract">
    <rect class="box result" x="582" y="222" width="336" height="94" rx="8" fill="#faf5ff"/>
    <text class="boxTitle" x="750" y="253" text-anchor="middle">RateLimitResult</text>
    <text class="mono" x="750" y="278" text-anchor="middle">CONSUMED / REJECTED / ERROR</text>
    <text class="small" x="750" y="298" text-anchor="middle">tokens, diagnostics, sanitized error</text>
  </g>

  <g id="suspendLimiter">
    <rect class="box async" x="1062" y="222" width="326" height="78" rx="8" fill="#f0fdf4"/>
    <text class="stereo" x="1225" y="245" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="boxTitle" x="1225" y="271" text-anchor="middle">SuspendRateLimiter&lt;K&gt;</text>
    <text class="mono" x="1225" y="293" text-anchor="middle">suspend consume(...): RateLimitResult</text>
  </g>

  <path class="uses" d="M 438 261 H 582"/>
  <path class="uses" d="M 1062 261 H 918"/>

  <g id="localRateLimiter">
    <rect class="box sync" x="96" y="388" width="258" height="86" rx="8" fill="#ffffff"/>
    <text class="boxTitle" x="225" y="420" text-anchor="middle">LocalRateLimiter</text>
    <text class="mono" x="225" y="445" text-anchor="middle">LocalBucketProvider</text>
    <text class="small" x="225" y="465" text-anchor="middle">one probe builds result</text>
  </g>

  <g id="distRateLimiter">
    <rect class="box sync" x="406" y="388" width="284" height="86" rx="8" fill="#ffffff"/>
    <text class="boxTitle" x="548" y="420" text-anchor="middle">DistributedRateLimiter</text>
    <text class="mono" x="548" y="445" text-anchor="middle">BucketProxyProvider</text>
    <text class="small" x="548" y="465" text-anchor="middle">Redis proxy, no extra token read</text>
  </g>

  <g id="localSuspendLimiter">
    <rect class="box async" x="810" y="388" width="286" height="86" rx="8" fill="#ffffff"/>
    <text class="boxTitle" x="953" y="420" text-anchor="middle">LocalSuspendRateLimiter</text>
    <text class="mono" x="953" y="445" text-anchor="middle">LocalSuspendBucketProvider</text>
    <text class="small" x="953" y="465" text-anchor="middle">cancellation propagates</text>
  </g>

  <g id="distSuspendLimiter">
    <rect class="box async" x="1148" y="388" width="286" height="86" rx="8" fill="#ffffff"/>
    <text class="boxTitle" x="1291" y="420" text-anchor="middle">DistributedSuspend</text>
    <text class="boxTitle" x="1291" y="443" text-anchor="middle">RateLimiter</text>
    <text class="small" x="1291" y="465" text-anchor="middle">AsyncBucketProxyProvider + timeout</text>
  </g>

  <path class="implementsSync" d="M 225 388 V 342 H 275 V 300"/>
  <path class="implementsSync" d="M 548 388 V 342 H 275 V 300"/>
  <path class="implementsAsync" d="M 953 388 V 342 H 1225 V 300"/>
  <path class="implementsAsync" d="M 1291 388 V 342 H 1225 V 300"/>

  <g id="localProvider">
    <rect class="box provider" x="96" y="574" width="270" height="86" rx="8" fill="#fff7ed"/>
    <text class="boxTitle" x="231" y="606" text-anchor="middle">LocalBucketProvider</text>
    <text class="mono" x="231" y="631" text-anchor="middle">key -> LocalBucket</text>
    <text class="small" x="231" y="651" text-anchor="middle">lock-free, same key state</text>
  </g>

  <g id="abstractLocalProvider">
    <rect class="box provider" x="486" y="754" width="350" height="86" rx="8" fill="#fff7ed"/>
    <text class="stereo" x="661" y="777" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="boxTitle" x="661" y="803" text-anchor="middle">AbstractLocalBucketProvider&lt;T&gt;</text>
    <text class="small" x="661" y="827" text-anchor="middle">Caffeine cache, key validation, expiration</text>
  </g>

  <g id="localSuspendProvider">
    <rect class="box provider" x="820" y="574" width="300" height="86" rx="8" fill="#fff7ed"/>
    <text class="boxTitle" x="970" y="606" text-anchor="middle">LocalSuspend</text>
    <text class="boxTitle" x="970" y="629" text-anchor="middle">BucketProvider</text>
    <text class="small" x="970" y="651" text-anchor="middle">key -> SuspendLocalBucket</text>
  </g>

  <g id="proxyProvider">
    <rect class="box provider" x="456" y="574" width="300" height="86" rx="8" fill="#fff7ed"/>
    <text class="boxTitle" x="606" y="606" text-anchor="middle">BucketProxyProvider</text>
    <text class="mono" x="606" y="631" text-anchor="middle">prefix + key -> BucketProxy</text>
    <text class="small" x="606" y="651" text-anchor="middle">ProxyManager&lt;ByteArray&gt;</text>
  </g>

  <g id="asyncProxyProvider">
    <rect class="box provider" x="1156" y="574" width="286" height="86" rx="8" fill="#fff7ed"/>
    <text class="boxTitle" x="1299" y="606" text-anchor="middle">AsyncBucket</text>
    <text class="boxTitle" x="1299" y="629" text-anchor="middle">ProxyProvider</text>
    <text class="small" x="1299" y="651" text-anchor="middle">async proxy + CompletableFuture</text>
  </g>

  <g id="redisHelpers">
    <rect class="box helper" x="930" y="754" width="344" height="86" rx="8" fill="#f8fafc"/>
    <text class="boxTitle" x="1102" y="788" text-anchor="middle">Lettuce / Redisson helpers</text>
    <text class="small" x="1102" y="814" text-anchor="middle">create sync and async ProxyManager instances</text>
  </g>

  <path class="uses" d="M 225 474 V 574"/>
  <path class="uses" d="M 548 474 V 534 H 606 V 574"/>
  <path class="uses" d="M 953 474 V 574"/>
  <path class="uses" d="M 1291 474 V 574"/>

  <path class="extendsProvider" d="M 231 660 V 706 H 621 V 754"/>
  <path class="extendsProvider" d="M 970 660 V 706 H 701 V 754"/>

  <text class="small" x="750" y="902" text-anchor="middle">Dashed hollow triangles mean implements. Dashed open arrows mean uses or returns.</text>
</svg>
