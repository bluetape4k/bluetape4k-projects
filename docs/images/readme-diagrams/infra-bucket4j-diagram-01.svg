<text class="mono" x="18" y="145">AsyncBucketProxyProvider</text>
<text class="mono" x="18" y="166">-defaultTimeout: Duration?</text>
<text class="mono" x="18" y="187">+consume(key, numToken) RateLimitResult</text>
<text class="mono" x="18" y="208">+consume(key, numToken, timeout)</text>
