  <text class="label" x="170" y="61" text-anchor="middle">RateLimitDiagnostics</text>
  <text class="mono" x="18" y="108">+nanosToWaitForRefill: Long</text>
<text class="mono" x="18" y="129">+nanosToWaitForReset: Long</text>
<text class="mono" x="18" y="150">+rejectionReason:</text>
<text class="mono" x="18" y="171">RateLimitRejectionReason?</text>
<text class="mono" x="18" y="192">+rejected(nanosToWaitForRefill,</text>
<text class="mono" x="18" y="213">nanosToWaitForReset, rejectionReason)</text>
</g>
<g transform="translate(502,539)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
