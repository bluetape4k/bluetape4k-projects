  <text class="label" x="170" y="61" text-anchor="middle">SuspendRateLimiterK</text>
  <text class="mono" x="18" y="108">+consume(key: K, numToken: Long)</text>
<text class="mono" x="18" y="129">RateLimitResult</text>
</g>
<g transform="translate(92,1571)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
