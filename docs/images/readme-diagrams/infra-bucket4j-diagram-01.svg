<text class="mono" x="18" y="132">+nanosToWaitForReset: Long</text>
<text class="mono" x="18" y="156">+rejectionReason: RateLimitRejectionReason?</text>
<text class="mono" x="18" y="180">+rejected(nanosToWaitForRefill, nanosToWaitForRese.</text>
</g>
