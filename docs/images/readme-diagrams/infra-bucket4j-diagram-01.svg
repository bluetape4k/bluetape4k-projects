<text class="mono" x="18" y="132">#keyPrefix: String</text>
<text class="mono" x="18" y="156">#cache: LoadingCache</text>
<text class="mono" x="18" y="180">+resolveBucket(key: String) T</text>
<text class="mono" x="18" y="204">#createBucket() T</text>
</g>
<g transform="translate(912,180)">
