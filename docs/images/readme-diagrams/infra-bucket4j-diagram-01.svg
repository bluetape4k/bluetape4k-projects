<text class="mono" x="18" y="132">+consumedTokens: Long</text>
<text class="mono" x="18" y="156">+availableTokens: Long</text>
<text class="mono" x="18" y="180">+errorMessage: String?</text>
<text class="mono" x="18" y="204">+diagnostics: RateLimitDiagnostics</text>
<text class="mono" x="18" y="228">+retryAfter: Duration?</text>
</g>
