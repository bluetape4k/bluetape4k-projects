<text class="mono" x="18" y="171">RateLimitRejectionReason?</text>
<text class="mono" x="18" y="192">+rejected(nanosToWaitForRefill,</text>
<text class="mono" x="18" y="213">nanosToWaitForReset, rejectionReason)</text>
</g>
<g transform="translate(956,180)">
