<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="Elasticsearch client API structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowPurple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowOrange" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .chip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .box { fill: #ffffff; stroke-width: 1.8; filter: url(#softShadow); }
      .config { stroke: #ea580c; fill: #fff7ed; }
      .client { stroke: #2563eb; fill: #eff6ff; }
      .elastic { stroke: #0d9488; fill: #f0fdfa; }
      .coroutine { stroke: #9333ea; fill: #faf5ff; }
      .event { stroke: #16a34a; fill: #f0fdf4; }
      .boxTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .mono { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .configFlow { fill: none; stroke: #ea580c; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOrange); }
      .extensionFlow { fill: none; stroke: #9333ea; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .eventFlow { fill: none; stroke: #16a34a; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="980"/>
  <rect class="frame" x="36" y="32" width="1428" height="916" rx="8"/>
  <text class="title" x="74" y="86">Elasticsearch Client API Structure</text>
  <text class="subtitle" x="78" y="116">DSL and factory functions create official Elastic clients; async clients receive suspend, Flow, PIT, bulk, and listener helpers.</text>

  <rect class="panel" x="76" y="154" width="710" height="328" rx="8"/>
  <rect class="chip" x="102" y="178" width="232" height="38" rx="8"/>
  <text class="panelTitle" x="118" y="203">Client construction</text>

  <rect class="panel" x="810" y="154" width="614" height="328" rx="8"/>
  <rect class="chip" x="818" y="178" width="214" height="38" rx="8"/>
  <text class="panelTitle" x="834" y="203">Official clients</text>

  <rect class="panel" x="76" y="548" width="760" height="314" rx="8"/>
  <rect class="chip" x="102" y="572" width="258" height="38" rx="8"/>
  <text class="panelTitle" x="118" y="597">Coroutine extensions</text>

  <rect class="panel" x="900" y="548" width="524" height="314" rx="8"/>
  <rect class="chip" x="926" y="572" width="214" height="38" rx="8"/>
  <text class="panelTitle" x="942" y="597">Bulk listener flow</text>

  <g id="config">
    <rect class="box config" x="116" y="250" width="242" height="116" rx="8"/>
    <text class="boxTitle" x="237" y="281" text-anchor="middle">Client Config</text>
    <text class="mono" x="237" y="307" text-anchor="middle">host, port, scheme</text>
    <text class="mono" x="237" y="331" text-anchor="middle">username, password</text>
    <text class="mono" x="237" y="355" text-anchor="middle">sslContext, mapper</text>
  </g>

  <g id="dsl">
    <rect class="box client" x="424" y="238" width="242" height="108" rx="8"/>
    <text class="stereo" x="545" y="262" text-anchor="middle">&lt;&lt;top-level functions&gt;&gt;</text>
    <text class="boxTitle" x="545" y="288" text-anchor="middle">Client DSL</text>
    <text class="mono" x="545" y="315" text-anchor="middle">elasticsearchAsyncClient {}</text>
    <text class="mono" x="545" y="337" text-anchor="middle">elasticsearchClient {}</text>
  </g>

  <g id="factory">
    <rect class="box client" x="310" y="386" width="300" height="72" rx="8"/>
    <text class="stereo" x="460" y="408" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text class="boxTitle" x="460" y="435" text-anchor="middle">ElasticsearchClients</text>
  </g>

  <g id="defaults">
    <rect class="box config" x="116" y="386" width="146" height="72" rx="8"/>
    <text class="boxTitle" x="189" y="417" text-anchor="middle">Defaults</text>
    <text class="small" x="189" y="441" text-anchor="middle">host, port, batch</text>
  </g>

  <g id="mappers">
    <rect class="box config" x="636" y="386" width="146" height="72" rx="8"/>
    <text class="boxTitle" x="709" y="417" text-anchor="middle">Mappers</text>
    <text class="small" x="709" y="441" text-anchor="middle">Jackson 2 / 3</text>
  </g>

  <path class="configFlow" d="M 358 308 H 424"/>
  <path class="flow" d="M 545 346 V 386"/>
  <path class="configFlow" d="M 262 422 H 310"/>
  <path class="configFlow" d="M 636 422 H 610"/>

  <g id="transport">
    <rect class="box elastic" x="910" y="238" width="396" height="80" rx="8"/>
    <text class="stereo" x="1108" y="262" text-anchor="middle">&lt;&lt;Elastic transport&gt;&gt;</text>
    <text class="boxTitle" x="1108" y="289" text-anchor="middle">Rest5ClientTransport</text>
    <text class="small" x="1108" y="311" text-anchor="middle">ElasticsearchTransportConfig.buildTransport()</text>
  </g>

  <g id="asyncClient">
    <rect class="box elastic" x="860" y="370" width="262" height="74" rx="8"/>
    <text class="stereo" x="991" y="393" text-anchor="middle">&lt;&lt;official client&gt;&gt;</text>
    <text class="boxTitle" x="991" y="419" text-anchor="middle">ElasticsearchAsyncClient</text>
    <text class="small" x="991" y="440" text-anchor="middle">CompletableFuture APIs</text>
  </g>

  <g id="syncClient">
    <rect class="box elastic" x="1190" y="370" width="198" height="74" rx="8"/>
    <text class="stereo" x="1289" y="393" text-anchor="middle">&lt;&lt;official client&gt;&gt;</text>
    <text class="boxTitle" x="1289" y="419" text-anchor="middle">ElasticsearchClient</text>
    <text class="small" x="1289" y="440" text-anchor="middle">blocking APIs</text>
  </g>

  <path class="flow" d="M 610 386 V 360 H 798 V 278 H 910"/>
  <path class="flow" d="M 1108 318 V 344 H 991 V 370"/>
  <path class="flow" d="M 1108 318 V 344 H 1289 V 370"/>

  <g id="receiver">
    <rect class="box coroutine" x="238" y="636" width="438" height="42" rx="8"/>
    <text class="mono" x="457" y="663" text-anchor="middle">receiver: ElasticsearchAsyncClient</text>
  </g>

  <g id="docApis">
    <rect class="box coroutine" x="116" y="724" width="230" height="92" rx="8"/>
    <text class="boxTitle" x="231" y="757" text-anchor="middle">Document APIs</text>
    <text class="small" x="231" y="783" text-anchor="middle">index/get/update/delete</text>
    <text class="small" x="231" y="804" text-anchor="middle">count/create/delete/exists</text>
  </g>

  <g id="searchFlow">
    <rect class="box coroutine" x="388" y="724" width="212" height="92" rx="8"/>
    <text class="boxTitle" x="494" y="757" text-anchor="middle">PIT Search Flow</text>
    <text class="small" x="494" y="783" text-anchor="middle">open/close PIT</text>
    <text class="small" x="494" y="804" text-anchor="middle">searchAsFlow(search_after)</text>
  </g>

  <g id="bulkFlow">
    <rect class="box coroutine" x="642" y="724" width="162" height="92" rx="8"/>
    <text class="boxTitle" x="723" y="757" text-anchor="middle">Bulk APIs</text>
    <text class="small" x="723" y="783" text-anchor="middle">bulkAsFlow</text>
    <text class="small" x="723" y="804" text-anchor="middle">suspendBulk</text>
  </g>

  <g id="ingesterBridge">
    <rect class="box coroutine" x="620" y="636" width="184" height="42" rx="8"/>
    <text class="mono" x="712" y="663" text-anchor="middle">BulkIngester bridge</text>
  </g>

  <path class="extensionFlow" d="M 991 444 V 510 H 457 V 636"/>
  <path class="extensionFlow" d="M 457 678 V 702 H 231 V 724"/>
  <path class="extensionFlow" d="M 457 678 V 724"/>
  <path class="extensionFlow" d="M 457 702 H 723 V 724"/>

  <g id="bulkEvent">
    <rect class="box event" x="1004" y="636" width="316" height="70" rx="8"/>
    <text class="stereo" x="1162" y="659" text-anchor="middle">&lt;&lt;sealed interface&gt;&gt;</text>
    <text class="boxTitle" x="1162" y="686" text-anchor="middle">BulkProgressEvent&lt;Context&gt;</text>
  </g>

  <g id="beforeEvent">
    <rect class="box event" x="936" y="750" width="130" height="64" rx="8"/>
    <text class="boxTitle" x="1001" y="780" text-anchor="middle">Before</text>
    <text class="small" x="1001" y="802" text-anchor="middle">beforeBulk</text>
  </g>

  <g id="afterEvent">
    <rect class="box event" x="1098" y="750" width="130" height="64" rx="8"/>
    <text class="boxTitle" x="1163" y="780" text-anchor="middle">After</text>
    <text class="small" x="1163" y="802" text-anchor="middle">BulkResponse</text>
  </g>

  <g id="errorEvent">
    <rect class="box event" x="1260" y="750" width="130" height="64" rx="8"/>
    <text class="boxTitle" x="1325" y="780" text-anchor="middle">Error</text>
    <text class="small" x="1325" y="802" text-anchor="middle">Throwable</text>
  </g>

  <g id="listenerHandle">
    <rect class="box config" x="958" y="836" width="408" height="54" rx="8"/>
    <text class="boxTitle" x="1162" y="858" text-anchor="middle">BulkListenerHandle</text>
    <text class="small" x="1162" y="879" text-anchor="middle">BulkListener + Flow&lt;BulkProgressEvent&gt; + close()</text>
  </g>

  <path class="eventFlow" d="M 1162 706 V 730 H 1001 V 750"/>
  <path class="eventFlow" d="M 1162 706 V 750"/>
  <path class="eventFlow" d="M 1162 730 H 1325 V 750"/>
  <path class="eventFlow" d="M 1162 814 V 836"/>
  <path class="extensionFlow" d="M 804 657 H 890 V 863 H 958"/>
</svg>
