<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="947" viewBox="0 0 1500 947" role="img" aria-label="Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="947"/>
<rect class="frame" x="32" y="28" width="1436" height="891" rx="30"/>
<text class="title" x="68" y="84">Class Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="ElasticsearchAsyncClient" data-to="BulkApiCoroutines" data-route-color="teal" d="M556 544 L556 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ElasticsearchAsyncClient" data-to="SearchApiCoroutines" data-route-color="amber" d="M751 544 L751 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ElasticsearchClientConfig" data-to="ElasticsearchAsyncClient" data-route-color="pink" d="M658 311 L658 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ElasticsearchClients" data-to="ElasticsearchClient" data-route-color="purple" d="M1043 311 L1043 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ElasticsearchClients" data-to="ElasticsearchAsyncClient" data-route-color="olive" d="M905 311 L905 355 L791 355 L791 398" stroke="#718A35" stroke-dasharray="8 7"/>
<g id="BulkApiCoroutines">
  <rect class="classCard" x="278" y="631" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="458" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="458" y="678" text-anchor="middle">BulkApiCoroutines</text>
  <line x1="278" y1="687" x2="638" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="312" y="724">+suspendBulk() BulkResponse</text>
<text class="member" x="312" y="741">+bulkAsFlow() Flow</text>
</g>
<g id="ElasticsearchAsyncClient">
  <rect class="classCard" x="473" y="398" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="653" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="653" y="436" text-anchor="middle">ElasticsearchAsync</text>
<text class="classTitle" x="653" y="458" text-anchor="middle">Client</text>
  <line x1="473" y1="462" x2="833" y2="462" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="507" y="490">+bulk(request) CompletableFuture</text>
<text class="member" x="507" y="507">+search(request) CompletableFuture</text>
<text class="member" x="507" y="524">+openPointInTime(request)</text>
</g>
<g id="ElasticsearchClients">
  <rect class="classCard" x="863" y="165" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1043" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1043" y="212" text-anchor="middle">ElasticsearchClients</text>
  <line x1="863" y1="221" x2="1223" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="897" y="253">+asyncClientOf(host, port, scheme)</text>
<text class="member" x="897" y="270">ElasticsearchAsyncClient</text>
<text class="member" x="897" y="287">+asyncClientOf(rest5Client)</text>
</g>
<g id="ElasticsearchClient">
  <rect class="classCard" x="863" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1043" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1043" y="445" text-anchor="middle">ElasticsearchClient</text>
  <line x1="863" y1="454" x2="1223" y2="454" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="ElasticsearchClientConfig">
  <rect class="classCard" x="473" y="165" width="380" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="663" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="663" y="212" text-anchor="middle">ElasticsearchClientConfig</text>
  <line x1="473" y1="221" x2="853" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="507" y="253">+host: String</text>
<text class="member" x="507" y="270">+port: Int</text>
<text class="member" x="507" y="287">+scheme: String</text>
</g>
<g id="SearchApiCoroutines">
  <rect class="classCard" x="668" y="631" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="848" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="848" y="678" text-anchor="middle">SearchApiCoroutines</text>
  <line x1="668" y1="687" x2="1028" y2="687" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="702" y="719">+openPointInTimeSuspending()</text>
<text class="member" x="702" y="736">String</text>
<text class="member" x="702" y="753">+closePointInTimeSuspending(pitId)</text>
</g>
<g>
  <rect x="1085" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 857 L1161 857" stroke="#3E9868"/>
  <text class="detail" x="1175" y="862">inheritance / implementation</text>
  <path class="dependency" d="M1103 878 L1161 878" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="883">dependency / usage</text>
</g>
<g><rect x="180" y="857" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="883" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
