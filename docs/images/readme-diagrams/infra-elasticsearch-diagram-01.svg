  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">ElasticsearchClients</text>
  <text class="mono" x="18" y="108">+asyncClientOf(host, port, scheme)</text>
<text class="mono" x="18" y="129">ElasticsearchAsyncClient</text>
