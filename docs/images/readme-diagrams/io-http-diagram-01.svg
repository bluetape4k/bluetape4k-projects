<svg data-intent="Explain multi-backend HTTP architecture by grouping the common facade/cross-cutting support and parallel HC5, OkHttp3, Vert.x, Ktor, and JDK client stacks." data-evidence="io/http/README.md; io/http/src/main/kotlin/io/bluetape4k/http" data-source-read="io/http/README.md; io/http/src/main/kotlin/io/bluetape4k/http" xmlns="http://www.w3.org/2000/svg" width="1600" height="1095" viewBox="0 0 1600 1095" role="img" aria-label="Multi-Backend HTTP Client Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1600" height="1095"/>
<rect class="frame" x="34" y="30" width="1532" height="1035" rx="8"/>
<text class="title" x="72" y="84">Multi-Backend HTTP Client Architecture</text>
<text class="subtitle" x="76" y="116">Common request helpers fan out to HC5, OkHttp3, Vert.x, Ktor, and JDK-backed stacks while every backend converges on the same HTTP wire boundary.</text>
<g><rect class="panel" x="82" y="160" width="1436" height="185" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Caller-facing API</text></g>
<g><rect class="panel" x="82" y="420" width="1436" height="250" rx="8"/><text class="panelTitle" x="110" y="456" dominant-baseline="middle">Backend client stacks</text></g>
<g><rect class="panel" x="82" y="745" width="1436" height="270" rx="8"/><text class="panelTitle" x="110" y="781" dominant-baseline="middle">Runtime boundary</text></g>
<g id="caller">
  <rect class="card" x="145" y="235" width="310" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="300" y="267" text-anchor="middle" dominant-baseline="middle">Application code</text>
  <text class="detail" x="300" y="297" text-anchor="middle" dominant-baseline="middle">HTTP call intent</text>
</g>
<g id="support">
  <rect class="card" x="610" y="228" width="360" height="92" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="790" y="258" text-anchor="middle" dominant-baseline="middle">HTTP support facade</text>
  <text class="detail" x="790" y="288" text-anchor="middle" dominant-baseline="middle">request/entity/protocol DSL</text>
  <text class="detail" x="790" y="306" text-anchor="middle" dominant-baseline="middle">timeouts, retry, coroutine hooks</text>
</g>
<g id="cross">
  <rect class="card" x="1095" y="235" width="340" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1265" y="267" text-anchor="middle" dominant-baseline="middle">Cross-cutting helpers</text>
  <text class="detail" x="1265" y="297" text-anchor="middle" dominant-baseline="middle">auth, SSL, cache, routing</text>
</g>
<g id="hc5">
  <rect class="card" x="130" y="520" width="270" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="265" y="547" text-anchor="middle" dominant-baseline="middle">Apache HC5</text>
  <text class="detail" x="265" y="577" text-anchor="middle" dominant-baseline="middle">classic, async, cache</text>
  <text class="detail" x="265" y="595" text-anchor="middle" dominant-baseline="middle">virtual-thread factories</text>
</g>
<g id="okhttp">
  <rect class="card" x="470" y="520" width="290" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="615" y="547" text-anchor="middle" dominant-baseline="middle">OkHttp3</text>
  <text class="detail" x="615" y="577" text-anchor="middle" dominant-baseline="middle">interceptors, cache</text>
  <text class="detail" x="615" y="595" text-anchor="middle" dominant-baseline="middle">coroutine Call adapter</text>
</g>
<g id="vertx">
  <rect class="card" x="830" y="520" width="300" height="86" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="980" y="547" text-anchor="middle" dominant-baseline="middle">Vert.x WebClient</text>
  <text class="detail" x="980" y="577" text-anchor="middle" dominant-baseline="middle">event-loop client</text>
  <text class="detail" x="980" y="595" text-anchor="middle" dominant-baseline="middle">coroutine bridge</text>
</g>
<g id="ktor">
  <rect class="card" x="1190" y="520" width="300" height="86" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1340" y="547" text-anchor="middle" dominant-baseline="middle">Ktor / JDK</text>
  <text class="detail" x="1340" y="577" text-anchor="middle" dominant-baseline="middle">Ktor CIO helpers</text>
  <text class="detail" x="1340" y="595" text-anchor="middle" dominant-baseline="middle">JDK HttpClient support</text>
</g>
<g id="wire">
  <rect class="card" x="160" y="815" width="1280" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="800" y="847" text-anchor="middle" dominant-baseline="middle">HTTP wire request / response</text>
  <text class="detail" x="800" y="877" text-anchor="middle" dominant-baseline="middle">method, URI, headers, body, status, response bytes</text>
</g>
<g id="remote">
  <rect class="card" x="610" y="930" width="380" height="66" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="800" y="956" text-anchor="middle" dominant-baseline="middle">Remote service</text>
  <text class="detail" x="800" y="986" text-anchor="middle" dominant-baseline="middle">REST endpoint or mock benchmark server</text>
</g>
<path class="route" data-from="caller" data-to="support" d="M455 274 L610 274" stroke="#1D4ED8"/>
<path class="route" data-from="support" data-to="cross" d="M970 274 L1095 274" stroke="#15803D"/>
<path class="route" data-from="support" data-to="hc5" d="M700 320 L265 520" stroke="#0F766E"/>
<path class="route" data-from="support" data-to="okhttp" d="M760 320 L615 520" stroke="#C2410C"/>
<path class="route" data-from="support" data-to="vertx" d="M820 320 L980 520" stroke="#BE185D"/>
<path class="route" data-from="support" data-to="ktor" d="M880 320 L1340 520" stroke="#4D7C0F"/>
<path class="route" data-from="hc5" data-to="wire" d="M265 606 L420 815" stroke="#0F766E"/>
<path class="route" data-from="okhttp" data-to="wire" d="M615 606 L615 815" stroke="#C2410C"/>
<path class="route" data-from="vertx" data-to="wire" d="M980 606 L980 815" stroke="#BE185D"/>
<path class="route" data-from="ktor" data-to="wire" d="M1340 606 L1340 815" stroke="#4D7C0F"/>
<path class="route" data-from="wire" data-to="remote" d="M800 893 L800 930" stroke="#1D4ED8"/>
</svg>
