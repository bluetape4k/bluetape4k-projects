<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="WorkReport State Transitions">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="smallArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6" fill="none" stroke="#758297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .edgeLabel{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .thinLine{stroke:#758297;stroke-width:1.8;fill:none;marker-end:url(#smallArrow)}
    .dashed{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1500" height="1000"/>
<rect class="frame" x="32" y="28" width="1436" height="944" rx="28"/>
<text class="title" x="66" y="82">WorkReport State Transitions</text>
<text class="subtitle" x="70" y="118">A WorkReport is both the task result and the control signal that decides whether a flow continues, stops, or exits immediately.</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="128" width="1423" height="190" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="156">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="273" width="1423" height="294" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="301">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="438" width="1423" height="182" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="466">Integration layer</text>
    </g>
    <g id="readme-layer-4">
      <rect class="readmeLayerBand" x="54" y="603" width="1423" height="182" rx="18" fill="#FFF3D9"/>
      <text class="readmeLayerLabel" x="72" y="631">Runtime layer</text>
    </g>
    <g id="readme-layer-5">
      <rect class="readmeLayerBand" x="54" y="703" width="1423" height="235" rx="18" fill="#F1ECFF"/>
      <text class="readmeLayerLabel" x="72" y="731">External layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<g>
  <rect class="card" x="90" y="410" width="250" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="215" y="446" text-anchor="middle">Start Context</text>
  <text class="small" x="215" y="476" text-anchor="middle">WorkContext</text>
<text class="small" x="215" y="494" text-anchor="middle">shared mutable state</text>
</g>
<g>
  <rect class="card" x="505" y="385" width="300" height="150" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="655" y="421" text-anchor="middle">Running Work</text>
  <text class="small" x="655" y="451" text-anchor="middle">Work.execute(ctx)</text>
<text class="small" x="655" y="469" text-anchor="middle">SuspendWork.execute(ctx)</text>
<text class="small" x="655" y="487" text-anchor="middle">exceptions become Failure</text>
</g>
<g>
  <rect class="card" x="1015" y="305" width="300" height="126" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="1165" y="341" text-anchor="middle">Success</text>
  <text class="small" x="1165" y="371" text-anchor="middle">normal return</text>
<text class="small" x="1165" y="389" text-anchor="middle">context is preserved</text>
</g>
<g>
  <rect class="card" x="1025" y="470" width="280" height="118" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="1165" y="506" text-anchor="middle">Next Work</text>
  <text class="small" x="1165" y="536" text-anchor="middle">sequential/repeat</text>
<text class="small" x="1165" y="554" text-anchor="middle">continues with same context</text>
</g>
<g>
  <rect class="card" x="1038" y="635" width="270" height="118" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="1173" y="671" text-anchor="middle">Completed</text>
  <text class="small" x="1173" y="701" text-anchor="middle">terminal when no more work</text>
<text class="small" x="1173" y="719" text-anchor="middle">status = COMPLETED</text>
</g>
<g>
  <rect class="card" x="560" y="735" width="270" height="126" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="695" y="771" text-anchor="middle">Failure</text>
  <text class="small" x="695" y="801" text-anchor="middle">error report</text>
<text class="small" x="695" y="819" text-anchor="middle">status = FAILED</text>
</g>
<g>
  <rect class="card" x="156" y="735" width="270" height="126" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="291" y="771" text-anchor="middle">Failed</text>
  <text class="small" x="291" y="801" text-anchor="middle">STOP strategy</text>
<text class="small" x="291" y="819" text-anchor="middle">return first failure</text>
</g>
<g>
  <rect class="card" x="908" y="780" width="290" height="126" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="1053" y="816" text-anchor="middle">Failure Accumulator</text>
  <text class="small" x="1053" y="846" text-anchor="middle">CONTINUE strategy</text>
<text class="small" x="1053" y="864" text-anchor="middle">store failedReports</text>
</g>
<g>
  <rect class="card" x="1260" y="755" width="185" height="126" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="1352.5" y="791" text-anchor="middle">PartialSuccess</text>
  <text class="small" x="1352.5" y="821" text-anchor="middle">terminal after final</text>
<text class="small" x="1352.5" y="839" text-anchor="middle">status = PARTIAL</text>
</g>
<g>
  <rect class="card" x="1015" y="160" width="300" height="118" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="1165" y="196" text-anchor="middle">Aborted</text>
  <text class="small" x="1165" y="226" text-anchor="middle">internal break</text>
<text class="small" x="1165" y="244" text-anchor="middle">strategy-independent</text>
</g>
<g>
  <rect class="card" x="370" y="168" width="300" height="118" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="520" y="204" text-anchor="middle">Cancelled</text>
  <text class="small" x="520" y="234" text-anchor="middle">timeout</text>
<text class="small" x="520" y="252" text-anchor="middle">coroutine cancellation</text>
</g>
<path class="line" d="M340 466 H505"/>
<text class="edgeLabel" x="422" y="456" text-anchor="middle">execute(ctx)</text>
<path class="line" d="M805 415 C890 360 943 366 1015 368"/>
<text class="edgeLabel" x="910" y="372" text-anchor="middle">task succeeded</text>
<path class="line" d="M1165 431 V470"/>
<text class="edgeLabel" x="1212" y="457" text-anchor="middle">more work</text>
<path class="line" d="M1025 529 H805"/>
<text class="edgeLabel" x="916" y="519" text-anchor="middle">continue</text>
<path class="line" d="M1168 588 V635"/>
<text class="edgeLabel" x="1220" y="618" text-anchor="middle">last work</text>
<path class="line" d="M655 535 V735"/>
<text class="edgeLabel" x="710" y="640" text-anchor="middle">failure report</text>
<path class="line" d="M560 799 H426"/>
<text class="edgeLabel" x="493" y="789" text-anchor="middle">STOP</text>
<path class="line" d="M830 799 H908"/>
<text class="edgeLabel" x="869" y="789" text-anchor="middle">CONTINUE</text>
<path class="line" d="M960 780 V530 H1025"/>
<text class="edgeLabel" x="980" y="650" text-anchor="middle">run next work</text>
<path class="line" d="M1198 843 H1260"/>
<text class="edgeLabel" x="1229" y="833" text-anchor="middle">after final work</text>
<path class="line" d="M805 405 C900 280 960 222 1015 219"/>
<text class="edgeLabel" x="934" y="295" text-anchor="middle">aborted()</text>
<path class="line" d="M608 385 C585 320 555 287 520 286"/>
<text class="edgeLabel" x="610" y="329" text-anchor="middle">cancelled()</text>
<g>
  <rect class="soft" x="96" y="585" width="430" height="78" rx="12" fill="#F7F1E7" stroke="#B88A44" opacity="0.92"/>
  <text class="small" x="114" y="610" text-anchor="start">Transient path: Failure under CONTINUE is not terminal.</text>
<text class="small" x="114" y="628" text-anchor="start">It loops through the accumulator until the flow is out of work.</text>
</g></svg>
