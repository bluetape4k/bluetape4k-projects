<svg data-intent="Explain workflow execution flow from start state through task execution, transition evaluation, retry policy, and completed or failed result." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1490" height="950" viewBox="0 0 1490 950" role="img" aria-label="WorkReport State Flow" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1490" height="950"/>
<rect class="frame" x="34" y="30" width="1422" height="890" rx="8"/>
<text class="title" x="72" y="84">WorkReport State Flow</text>
<text class="subtitle" x="76" y="116">Failure is the only state controlled by ErrorStrategy; Aborted and Cancelled bypass strategy and return immediately.</text>
<g id="execute">
  <rect class="card" x="590" y="170" width="340" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="760" y="202" text-anchor="middle" dominant-baseline="middle">Work executes</text>
  <text class="detail" x="760" y="232" text-anchor="middle" dominant-baseline="middle">returns one WorkReport</text>
</g>
<g id="aborted">
  <rect class="card" x="120" y="345" width="300" height="78" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="270" y="377" text-anchor="middle" dominant-baseline="middle">Aborted</text>
  <text class="detail" x="270" y="407" text-anchor="middle" dominant-baseline="middle">break flow immediately</text>
</g>
<g id="failure">
  <rect class="card" x="590" y="345" width="340" height="88" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="760" y="382" text-anchor="middle" dominant-baseline="middle">Failure</text>
  <text class="detail" x="760" y="412" text-anchor="middle" dominant-baseline="middle">strategy decides stop or continue</text>
</g>
<g id="success">
  <rect class="card" x="1080" y="345" width="310" height="78" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1235" y="377" text-anchor="middle" dominant-baseline="middle">Success</text>
  <text class="detail" x="1235" y="407" text-anchor="middle" dominant-baseline="middle">continue to next work</text>
</g>
<g id="strategy">
  <polygon class="card card-shape" points="760,560 935,626 760,692 585,626" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="760" y="618" text-anchor="middle" dominant-baseline="middle">ErrorStrategy?</text>
  <text class="detail" x="760" y="647" text-anchor="middle" dominant-baseline="middle">STOP vs CONTINUE</text>
</g>
<g id="cancelled">
  <rect class="card" x="120" y="655" width="300" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="270" y="687" text-anchor="middle" dominant-baseline="middle">Cancelled</text>
  <text class="detail" x="270" y="717" text-anchor="middle" dominant-baseline="middle">timeout or external cancellation</text>
</g>
<g id="terminal">
  <rect class="card" x="585" y="790" width="350" height="78" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="760" y="822" text-anchor="middle" dominant-baseline="middle">Return Failure</text>
  <text class="detail" x="760" y="852" text-anchor="middle" dominant-baseline="middle">STOP exits immediately</text>
</g>
<g id="partial">
  <rect class="card" x="1030" y="780" width="380" height="92" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1220" y="810" text-anchor="middle" dominant-baseline="middle">PartialSuccess</text>
  <text class="detail" x="1220" y="840" text-anchor="middle" dominant-baseline="middle">CONTINUE accumulates failures</text>
  <text class="detail" x="1220" y="858" text-anchor="middle" dominant-baseline="middle">then returns after final work</text>
</g>
<path class="route" data-from="execute" data-to="aborted" d="M590 209 L420 384" stroke="#C2410C"/>
<g><rect class="labelPill" x="465" y="273" width="66" height="26" rx="8"/><text class="detail" x="498" y="287" text-anchor="middle" dominant-baseline="middle" style="fill:#C2410C">abort</text></g>
<path class="route" data-from="execute" data-to="failure" d="M760 248 L760 345" stroke="#BE185D"/>
<g><rect class="labelPill" x="777" y="285" width="78" height="26" rx="8"/><text class="detail" x="816" y="299" text-anchor="middle" dominant-baseline="middle" style="fill:#BE185D">failure</text></g>
<path class="route" data-from="execute" data-to="success" d="M930 209 L1080 384" stroke="#15803D"/>
<g><rect class="labelPill" x="964" y="273" width="82" height="26" rx="8"/><text class="detail" x="1005" y="287" text-anchor="middle" dominant-baseline="middle" style="fill:#15803D">success</text></g>
<path class="route dashed" data-from="execute" data-to="cancelled" d="M590 209 L80 209 L80 694 L120 694" stroke="#7E22CE"/>
<g><rect class="labelPill" x="122" y="165" width="76" height="26" rx="8"/><text class="detail" x="160" y="179" text-anchor="middle" dominant-baseline="middle" style="fill:#7E22CE">cancel</text></g>
<path class="route" data-from="failure" data-to="strategy" d="M760 433 L760 560" stroke="#0F766E"/>
<path class="route" data-from="strategy" data-to="terminal" d="M760 692 L760 790" stroke="#BE185D"/>
<g><rect class="labelPill" x="772" y="729" width="88" height="26" rx="8"/><text class="detail" x="816" y="743" text-anchor="middle" dominant-baseline="middle" style="fill:#BE185D">yes STOP</text></g>
<path class="route" data-from="strategy" data-to="partial" d="M935 626 L1030 826" stroke="#4D7C0F"/>
<g><rect class="labelPill" x="1057" y="691" width="126" height="26" rx="8"/><text class="detail" x="1120" y="705" text-anchor="middle" dominant-baseline="middle" style="fill:#4D7C0F">no CONTINUE</text></g>
</svg>
