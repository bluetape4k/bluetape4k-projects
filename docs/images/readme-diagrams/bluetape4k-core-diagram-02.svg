<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1266" viewBox="0 0 1754 1266" role="img" aria-label="Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1266"/>
<rect class="frame" x="32" y="28" width="1690" height="1210" rx="28"/>
<text class="title" x="66" y="82">Class Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="implLine" d="M467 958 C467 802 672 802 672 646"/>
<path class="implLine" d="M672 716 C672 681 672 681 672 646"/>
<path class="implLine" d="M1287 958 C1287 693 1082 693 1082 428"/>
<path class="implLine" d="M877 958 C877 693 1082 693 1082 428"/>
<path class="implLine" d="M1492 716 C1492 572 1082 572 1082 428"/>
<path class="implLine" d="M1082 716 C1082 572 1082 572 1082 428"/>
<path class="implLine" d="M262 716 C262 669 1082 669 1082 622"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Base58</text>
  <text class="mono" x="18" y="108">+encode(data: ByteArray) String</text>
<text class="mono" x="18" y="132">+decode(encoded: String) ByteArray</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Base62</text>
  <text class="mono" x="18" y="108">+encode(number: Long) String</text>
<text class="mono" x="18" y="132">+decode(encoded: String) Long</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Range</text>
  <text class="mono" x="18" y="108">+first: T</text>
<text class="mono" x="18" y="132">+last: T</text>
<text class="mono" x="18" y="156">+isStartInclusive: Boolean</text>
<text class="mono" x="18" y="180">+isEndInclusive: Boolean</text>
<text class="mono" x="18" y="204">+contains(value: T) Boolean</text>
<text class="mono" x="18" y="228">+isEmpty() Boolean</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">RequireSupport</text>
  <text class="mono" x="18" y="108">+requireNotNull(name)</text>
<text class="mono" x="18" y="132">+requireNotEmpty(name)</text>
<text class="mono" x="18" y="156">+requireNotBlank(name)</text>
<text class="mono" x="18" y="180">+requireGt(value, name)</text>
<text class="mono" x="18" y="204">+requireGe(value, name)</text>
<text class="mono" x="18" y="228">+requireLt(value, name)</text>
</g>
<g transform="translate(502,494)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StringEncoder</text>
  <text class="mono" x="18" y="108">+encode(bytes: ByteArray) String</text>
<text class="mono" x="18" y="132">+decode(encoded: String) ByteArray</text>
</g>
<g transform="translate(912,494)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">ValueObject</text>
  <text class="mono" x="18" y="108">+Serializable</text>
</g>
<g transform="translate(92,724)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«abstract»</text>
  <text class="label" x="170" y="57" text-anchor="middle">AbstractValueObject</text>
  <text class="mono" x="18" y="108">+equals(other) Boolean</text>
<text class="mono" x="18" y="132">+hashCode() Int</text>
<text class="mono" x="18" y="156">+equalProperties(other)* Boolean</text>
</g>
<g transform="translate(502,724)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Base64StringEncoder</text>
  <text class="mono" x="18" y="108">+encode(bytes) String</text>
<text class="mono" x="18" y="132">+decode(encoded) ByteArray</text>
</g>
<g transform="translate(912,724)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">ClosedClosedRange</text>
  <text class="mono" x="18" y="108">+isStartInclusive = true</text>
<text class="mono" x="18" y="132">+isEndInclusive = true</text>
</g>
<g transform="translate(1322,724)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">ClosedOpenRange</text>
  <text class="mono" x="18" y="108">+isStartInclusive = true</text>
<text class="mono" x="18" y="132">+isEndInclusive = false</text>
</g>
<g transform="translate(297,966)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">HexStringEncoder</text>
  <text class="mono" x="18" y="108">+encode(bytes) String</text>
<text class="mono" x="18" y="132">+decode(encoded) ByteArray</text>
</g>
<g transform="translate(707,966)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">OpenClosedRange</text>
  <text class="mono" x="18" y="108">+isStartInclusive = false</text>
<text class="mono" x="18" y="132">+isEndInclusive = true</text>
</g>
<g transform="translate(1117,966)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">OpenOpenRange</text>
  <text class="mono" x="18" y="108">+isStartInclusive = false</text>
<text class="mono" x="18" y="132">+isEndInclusive = false</text>
</g>
</svg>
