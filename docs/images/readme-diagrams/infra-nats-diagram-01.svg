<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1167" viewBox="0 0 1500 1167" role="img" aria-label="Nats Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1167"/>
<rect class="frame" x="32" y="28" width="1436" height="1111" rx="30"/>
<text class="title" x="68" y="84">Nats Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="JetStreamExtensions" data-to="DSLBuilders" data-route-color="teal" d="M288 763 L288 865" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ConnectionExtensions" data-to="NatsServiceExtensions" data-route-color="amber" d="M848 500 L873 500 L873 661 L898 661" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ConnectionExtensions" data-to="JetStreamManagementExtensions" data-route-color="pink" d="M678 530 L678 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ConnectionExtensions" data-to="JetStreamExtensions" data-route-color="purple" d="M508 500 L483 500 L483 661 L458 661" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="AbstractNatsTest" data-to="ConnectionExtensions" data-route-color="olive" d="M678 297 L678 398" stroke="#718A35" stroke-dasharray="8 7"/>
<g id="AbstractNatsTest">
  <rect class="classCard" x="508" y="165" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="678" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="212" text-anchor="middle">AbstractNatsTest</text>
  <line x1="508" y1="221" x2="848" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="526" y="255">+connection: Connection</text>
<text class="member" x="526" y="272">+NatsServer Testcontainer</text>
</g>
<g id="ConnectionExtensions">
  <rect class="classCard" x="508" y="398" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="678" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="445" text-anchor="middle">ConnectionExtensions</text>
  <line x1="508" y1="454" x2="848" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="526" y="479">+publish(subject, body)</text>
<text class="member" x="526" y="496">+request(subject, body, timeout)</text>
<text class="member" x="526" y="513">+requestAsync(subject, body)</text>
</g>
<g id="JetStreamExtensions">
  <rect class="classCard" x="118" y="631" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="288" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="678" text-anchor="middle">JetStreamExtensions</text>
  <line x1="118" y1="687" x2="458" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="136" y="712">+publish(subject, body)</text>
<text class="member" x="136" y="729">+publishAsync(subject, body)</text>
<text class="member" x="136" y="746">+publishSuspending(subject, body)</text>
</g>
<g id="DSLBuilders">
  <rect class="classCard" x="118" y="865" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="288" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="912" text-anchor="middle">DSLBuilders</text>
  <line x1="118" y1="921" x2="458" y2="921" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="136" y="946">+streamConfiguration(block)</text>
<text class="member" x="136" y="963">+consumerConfiguration(block)</text>
<text class="member" x="136" y="980">+keyValueConfiguration(name,</text>
</g>
<g id="JetStreamManagementExtensions">
  <rect class="classCard" x="508" y="631" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="678" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="669" text-anchor="middle">JetStreamManagement</text>
<text class="classTitle" x="678" y="691" text-anchor="middle">Extensions</text>
  <line x1="508" y1="695" x2="848" y2="695" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="526" y="716">+createStream(name, subjects)</text>
<text class="member" x="526" y="733">+createOrReplaceStream(name,</text>
<text class="member" x="526" y="750">subjects)</text>
</g>
<g id="NatsServiceExtensions">
  <rect class="classCard" x="898" y="631" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1068" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="678" text-anchor="middle">NatsServiceExtensions</text>
  <line x1="898" y1="687" x2="1238" y2="687" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="916" y="712">+natsServiceOf(nc, name, version,</text>
<text class="member" x="916" y="729">endpoints)</text>
<text class="member" x="916" y="746">+natsService(block)</text>
</g>
<g>
  <rect x="1085" y="1059" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1077 L1161 1077" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1082">inheritance / implementation</text>
  <path class="dependency" d="M1103 1098 L1161 1098" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1103">dependency / usage</text>
</g>
<g><rect x="180" y="1077" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1103" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
