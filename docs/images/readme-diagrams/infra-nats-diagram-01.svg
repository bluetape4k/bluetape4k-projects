<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1018" viewBox="0 0 1754 1018" role="img" aria-label="nats Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1018"/>
<rect class="frame" x="32" y="28" width="1690" height="962" rx="28"/>
<text class="title" x="66" y="82">nats Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 355 L1082 102 L1492 102 L1492 180"/>
<path class="line" d="M672 418 L672 489 L1082 489 L1082 544"/>
<path class="line" d="M672 418 L672 544"/>
<path class="line" d="M672 180 L672 132 L1082 132 L1082 355"/>
<path class="line" d="M262 334 L262 465 L672 465 L672 180"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">AbstractNatsTest</text>
  <text class="mono" x="18" y="108">+connection: Connection</text>
<text class="mono" x="18" y="129">+NatsServer Testcontainer</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
    <text class="label" x="170" y="49" text-anchor="middle">ConnectionExtensions</text>
  <text class="mono" x="18" y="108">+publish(subject, body)</text>
<text class="mono" x="18" y="129">+request(subject, body, timeout)</text>
<text class="mono" x="18" y="150">+requestAsync(subject, body)</text>
<text class="mono" x="18" y="171">+requestSuspending(subject, body)</text>
<text class="mono" x="18" y="192">+drainSuspending(timeout)</text>
<text class="mono" x="18" y="213">+createStream(name, subjects)</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
    <text class="label" x="170" y="49" text-anchor="middle">JetStreamExtensions</text>
  <text class="mono" x="18" y="108">+publish(subject, body)</text>
<text class="mono" x="18" y="129">+publishAsync(subject, body)</text>
<text class="mono" x="18" y="150">+publishSuspending(subject, body)</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
    <text class="label" x="170" y="49" text-anchor="middle">DSLBuilders</text>
  <text class="mono" x="18" y="108">+streamConfiguration(block)</text>
<text class="mono" x="18" y="129">+consumerConfiguration(block)</text>
<text class="mono" x="18" y="150">+keyValueConfiguration(name, block)</text>
<text class="mono" x="18" y="171">+objectStoreConfiguration(block)</text>
</g>
<g transform="translate(502,544)">
  <rect class="card" x="0" y="0" width="340" height="254" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#45A7A1"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Jet Stream Management</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Extensions</text>
  <text class="mono" x="18" y="124">+createStream(name, subjects)</text>
<text class="mono" x="18" y="145">+createOrReplaceStream(name, subjects)</text>
<text class="mono" x="18" y="166">+streamExists(name)</text>
<text class="mono" x="18" y="187">+forcedDeleteStream(name)</text>
<text class="mono" x="18" y="208">+forcedPurgeStream(name)</text>
<text class="mono" x="18" y="229">+consumerExists(stream, consumer)</text>
</g>
<g transform="translate(912,544)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
    <text class="label" x="170" y="49" text-anchor="middle">NatsServiceExtensions</text>
  <text class="mono" x="18" y="108">+natsServiceOf(nc, name, version,</text>
<text class="mono" x="18" y="129">endpoints)</text>
<text class="mono" x="18" y="150">+natsService(block)</text>
<text class="mono" x="18" y="171">+serviceEndpointOf(name, subject, handler)</text>
</g>
</svg>
