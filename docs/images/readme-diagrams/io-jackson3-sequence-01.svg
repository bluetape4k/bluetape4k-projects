<svg xmlns="http://www.w3.org/2000/svg" width="1532" height="1676" viewBox="0 0 1532 1676" role="img" aria-label="Jackson 3.x Module Registration Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1532" height="1676"/>
<rect class="frame" x="32" y="28" width="1468" height="1620" rx="28"/>
<text class="title" x="66" y="82">Jackson 3.x Module Registration Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="418.83333333333326" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="557.3333333333333" y="209" text-anchor="middle">Jackson</text>
<line class="lifeline" x1="557.3333333333333" y1="252" x2="557.3333333333333" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="836.1666666666666" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="974.6666666666666" y="209" text-anchor="middle">JsonMapper.Builder</text>
<line class="lifeline" x1="974.6666666666666" y1="252" x2="974.6666666666666" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1253.5" y="166" width="277" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1392" y="209" text-anchor="middle">JacksonModules</text>
<line class="lifeline" x1="1392" y1="252" x2="1392" y2="1616" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="185.16666666666663" y="286" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="203.16666666666663" y="313" text-anchor="start">1. Jackson.createDefaultJsonMapper()</text>
<path class="line" d="M140 344 L557.3333333333333 344"/>
<rect x="598.5" y="396" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="616.5" y="423" text-anchor="start">2. jsonMapper { findAndAddModules() }</text>
<path class="line" d="M557.3333333333333 454 L974.6666666666666 454"/>
<rect x="1032.3333333333333" y="506" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1050.3333333333333" y="533" text-anchor="start">3. Register JsonTinkEncryptModule</text>
<path class="line" d="M974.6666666666666 564 L1392 564"/>
<rect x="1052.3333333333333" y="616" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1070.3333333333333" y="643" text-anchor="start">4. Register JsonMaskerModule</text>
<path class="line" d="M974.6666666666666 674 L1392 674"/>
<rect x="1060.3333333333333" y="726" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1078.3333333333333" y="753" text-anchor="start">5. Register JsonUuidModule</text>
<path class="line" d="M974.6666666666666 784 L1392 784"/>
<rect x="971.8333333333333" y="836" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="989.8333333333333" y="863" text-anchor="start">6. Wire Introspector / Serializer / Deserializer</text>
<path class="dashed" d="M1392 894 L974.6666666666666 894"/>
<rect x="661" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="679" y="973" text-anchor="start">7. Build JsonMapper</text>
<path class="dashed" d="M974.6666666666666 1004 L557.3333333333333 1004"/>
<rect x="225.66666666666663" y="1056" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="243.66666666666663" y="1083" text-anchor="start">8. Configured ObjectMapper</text>
<path class="dashed" d="M557.3333333333333 1114 L140 1114"/>
<rect x="197.66666666666663" y="1166" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="215.66666666666663" y="1193" text-anchor="start">9. mapper.writeValueAsString(obj)</text>
<path class="line" d="M140 1224 L557.3333333333333 1224"/>
<rect x="819.1666666666666" y="1276" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="837.1666666666666" y="1303" text-anchor="start">10. Detect @JsonTinkEncrypt fields</text>
<path class="line" d="M557.3333333333333 1334 L1392 1334"/>
<rect x="869.6666666666666" y="1386" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="887.6666666666666" y="1413" text-anchor="start">11. Encrypted value</text>
<path class="dashed" d="M1392 1444 L557.3333333333333 1444"/>
<rect x="243.66666666666663" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="261.66666666666663" y="1523" text-anchor="start">12. JSON string</text>
<path class="dashed" d="M557.3333333333333 1554 L140 1554"/>
</svg>
