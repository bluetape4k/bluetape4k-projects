<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1181" viewBox="0 0 1500 1181" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1181"/>
<rect class="frame" x="32" y="28" width="1436" height="1125" rx="30"/>
<text class="title" x="68" y="84">Core Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="WebTestClientExt" data-to="UserController" data-route-color="teal" d="M555 303 L555 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Retrofit2Config" data-to="UserService" data-route-color="amber" d="M807 544 L807 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="UserService" data-to="RestClientDsl" data-route-color="pink" d="M750 777 L750 865" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="UserController" data-to="UserService" data-route-color="purple" d="M693 544 L693 631" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="RestClientDsl">
  <rect class="classCard" x="570" y="865" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="750" y="884" text-anchor="middle">extension</text>
  <text class="classTitle" x="750" y="912" text-anchor="middle">RestClientDsl</text>
  <line x1="570" y1="921" x2="930" y2="921" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="604" y="953">+suspendGet(uri): T</text>
<text class="member" x="604" y="970">+suspendPost(uri, body): T</text>
<text class="member" x="604" y="987">+suspendPut(uri, body): T</text>
</g>
<g id="UserService">
  <rect class="classCard" x="570" y="631" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="750" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="678" text-anchor="middle">UserService</text>
  <line x1="570" y1="687" x2="930" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="604" y="719">-restClient: RestClient</text>
<text class="member" x="604" y="736">+findAllAsFlow(): Flow~User~</text>
<text class="member" x="604" y="753">+findById(id): User</text>
</g>
<g id="UserController">
  <rect class="classCard" x="375" y="398" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="555" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="555" y="445" text-anchor="middle">UserController</text>
  <line x1="375" y1="454" x2="735" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="409" y="486">-service: UserService</text>
<text class="member" x="409" y="503">+getUsers(): Flow~User~</text>
<text class="member" x="409" y="520">+getUser(id): User</text>
</g>
<g id="Retrofit2Config">
  <rect class="classCard" x="765" y="398" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="945" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="945" y="445" text-anchor="middle">Retrofit2Config</text>
  <line x1="765" y1="454" x2="1125" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="799" y="486">+retrofit(): Retrofit</text>
<text class="member" x="799" y="503">+okHttpClient(): OkHttpClient</text>
<text class="member" x="799" y="520">+jacksonConverterFactory():</text>
</g>
<g id="WebTestClientExt">
  <rect class="classCard" x="375" y="165" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="555" y="184" text-anchor="middle">extension</text>
  <text class="classTitle" x="555" y="212" text-anchor="middle">WebTestClientExt</text>
  <line x1="375" y1="221" x2="735" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="409" y="258">+httpGet(uri): ResponseSpec</text>
<text class="member" x="409" y="275">+httpPost(uri, body): ResponseSpec</text>
</g>
<g>
  <rect x="1085" y="1073" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1091 L1161 1091" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1096">inheritance / implementation</text>
  <path class="dependency" d="M1103 1112 L1161 1112" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1117">dependency / usage</text>
</g>
<g><rect x="180" y="1091" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1117" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
