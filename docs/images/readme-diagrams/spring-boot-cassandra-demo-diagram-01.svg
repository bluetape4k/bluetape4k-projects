<svg data-intent="Show the Cassandra demo request path from web entrypoint to coroutine service, repository DSL, CqlSession, and Cassandra cluster." data-evidence="examples/spring-boot/cassandra-demo/README.md; examples/spring-boot/cassandra-demo/src/main" data-source-read="examples/spring-boot/cassandra-demo/README.md; examples/spring-boot/cassandra-demo/src/main" xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 1360 840" role="img" aria-label="Cassandra Demo Request Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1360" height="840"/>
<rect class="frame" x="34" y="30" width="1292" height="780" rx="8"/>
<text class="title" x="72" y="84">Cassandra Demo Request Flow</text>
<text class="subtitle" x="76" y="116">The demo diagram follows request handling into coroutine data access and the Cassandra driver runtime.</text>
<g><rect class="panel" x="82" y="160" width="1196" height="160" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Web and service boundary</text></g>
<g><rect class="panel" x="82" y="405" width="1196" height="170" rx="8"/><text class="panelTitle" x="110" y="441" dominant-baseline="middle">Coroutine data access</text></g>
<g><rect class="panel" x="82" y="650" width="1196" height="110" rx="8"/><text class="panelTitle" x="110" y="686" dominant-baseline="middle">Cassandra runtime</text></g>
<g id="controller">
  <rect class="card" x="130" y="210" width="290" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="275" y="245" text-anchor="middle" dominant-baseline="middle">REST Controller</text>
  <text class="detail" x="275" y="275" text-anchor="middle" dominant-baseline="middle">HTTP request / response</text>
</g>
<g id="service">
  <rect class="card" x="540" y="210" width="300" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="690" y="245" text-anchor="middle" dominant-baseline="middle">Coroutine service</text>
  <text class="detail" x="690" y="275" text-anchor="middle" dominant-baseline="middle">suspend orchestration</text>
</g>
<g id="repository">
  <rect class="card" x="960" y="210" width="260" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1090" y="245" text-anchor="middle" dominant-baseline="middle">Cassandra repository</text>
  <text class="detail" x="1090" y="275" text-anchor="middle" dominant-baseline="middle">query boundary</text>
</g>
<g id="dsl">
  <rect class="card" x="250" y="460" width="330" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="415" y="488" text-anchor="middle" dominant-baseline="middle">CqlSession DSL</text>
  <text class="detail" x="415" y="518" text-anchor="middle" dominant-baseline="middle">typed query helpers</text>
  <text class="detail" x="415" y="536" text-anchor="middle" dominant-baseline="middle">row mapping extensions</text>
</g>
<g id="session">
  <rect class="card" x="765" y="460" width="330" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="930" y="488" text-anchor="middle" dominant-baseline="middle">CqlSession / AsyncCqlSession</text>
  <text class="detail" x="930" y="518" text-anchor="middle" dominant-baseline="middle">driver execution</text>
  <text class="detail" x="930" y="536" text-anchor="middle" dominant-baseline="middle">prepared statements</text>
</g>
<g id="cluster">
  <rect class="card" x="505" y="685" width="350" height="68" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="680" y="712" text-anchor="middle" dominant-baseline="middle">Cassandra cluster</text>
  <text class="detail" x="680" y="742" text-anchor="middle" dominant-baseline="middle">tables, partitions, consistency</text>
</g>
<path class="route" data-from="controller" data-to="service" d="M420 252 L540 252" stroke="#1D4ED8"/>
<path class="route" data-from="service" data-to="repository" d="M840 252 L960 252" stroke="#15803D"/>
<path class="route" data-from="repository" data-to="dsl" d="M1040 294 L415 460" stroke="#7E22CE"/>
<path class="route" data-from="repository" data-to="session" d="M1140 294 L930 460" stroke="#C2410C"/>
<path class="route" data-from="dsl" data-to="cluster" d="M415 548 L415 615 L590 615 L590 685" stroke="#0F766E"/>
<path class="route" data-from="session" data-to="cluster" d="M930 548 L930 625 L770 625 L770 685" stroke="#C2410C"/>
</svg>
