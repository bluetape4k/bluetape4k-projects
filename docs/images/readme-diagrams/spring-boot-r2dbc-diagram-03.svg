<svg xmlns="http://www.w3.org/2000/svg" width="1965" height="780" viewBox="0 0 1965 780" role="img" aria-label="CRUD Operation Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1965" height="780"/>
<rect class="frame" x="32" y="28" width="1901" height="724" rx="30"/>
<text class="title" x="68" y="84">CRUD Operation Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="Service_Repository" data-to="select_All_Suspending_select_Suspending_query" data-route-color="green" d="M288 398 L288 297" stroke="#3E9868"/>
<path class="dependency" data-from="select_All_Suspending_select_Suspending_query" data-to="insert_Suspending_entity_insert_Or_Null" data-route-color="amber" d="M458 267 L527 267 L527 428 L596 428" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="insert_Suspending_entity_insert_Or_Null" data-to="update_Suspending_query_update" data-route-color="teal" d="M766 398 L766 297" stroke="#2E8F89"/>
<path class="dependency" data-from="update_Suspending_query_update" data-to="delete_Suspending_query_delete_All" data-route-color="purple" d="M936 267 L997 267 L997 428 L1057 428" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="inherit" data-from="delete_Suspending_query_delete_All" data-to="countAllSuspending_count_Suspending_query" data-route-color="pink" d="M1227 398 L1227 297" stroke="#C94D68"/>
<path class="dependency" data-from="countAllSuspending_count_Suspending_query" data-to="R2dbcEntityOperations" data-route-color="indigo" d="M1397 267 L1452 267 L1452 428 L1507 428" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="inherit" data-from="R2dbcEntityOperations" data-to="Database" data-route-color="olive" d="M1677 398 L1677 297" stroke="#718A35"/>
<g id="Service_Repository">
  <rect class="classCard" x="118" y="398" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="288" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="445" text-anchor="middle">Service / Repository</text>
  <line x1="118" y1="454" x2="458" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="select_All_Suspending_select_Suspending_query">
  <rect class="classCard" x="118" y="165" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="288" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="203" text-anchor="middle">select All Suspending()</text>
<text class="classTitle" x="288" y="225" text-anchor="middle">select Suspending(query)</text>
  <line x1="118" y1="229" x2="458" y2="229" stroke="#58A978" stroke-width="1.4"/>

</g>
<g id="insert_Suspending_entity_insert_Or_Null">
  <rect class="classCard" x="596" y="398" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="766" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="766" y="436" text-anchor="middle">insert</text>
<text class="classTitle" x="766" y="458" text-anchor="middle">Suspending(entity)</text>
  <line x1="596" y1="462" x2="936" y2="462" stroke="#45A7A1" stroke-width="1.4"/>

</g>
<g id="update_Suspending_query_update">
  <rect class="classCard" x="596" y="165" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="766" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="766" y="203" text-anchor="middle">update Suspending(query,</text>
<text class="classTitle" x="766" y="225" text-anchor="middle">update)</text>
  <line x1="596" y1="229" x2="936" y2="229" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="delete_Suspending_query_delete_All">
  <rect class="classCard" x="1057" y="398" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1227" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1227" y="436" text-anchor="middle">delete Suspending(query)</text>
<text class="classTitle" x="1227" y="458" text-anchor="middle">delete All</text>
  <line x1="1057" y1="462" x2="1397" y2="462" stroke="#DC6B82" stroke-width="1.4"/>

</g>
<g id="countAllSuspending_count_Suspending_query">
  <rect class="classCard" x="1057" y="165" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1227" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1227" y="203" text-anchor="middle">countAllSuspending()</text>
<text class="classTitle" x="1227" y="225" text-anchor="middle">count Suspending(query)</text>
  <line x1="1057" y1="229" x2="1397" y2="229" stroke="#8A72D6" stroke-width="1.4"/>

</g>
<g id="R2dbcEntityOperations">
  <rect class="classCard" x="1507" y="398" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1677" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1677" y="445" text-anchor="middle">R2dbcEntityOperations</text>
  <line x1="1507" y1="454" x2="1847" y2="454" stroke="#8BA84D" stroke-width="1.4"/>

</g>
<g id="Database">
  <rect class="classCard" x="1507" y="165" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1677" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1677" y="212" text-anchor="middle">Database</text>
  <line x1="1507" y1="221" x2="1847" y2="221" stroke="#9AA8B8" stroke-width="1.4"/>

</g>
<g>
  <rect x="1550" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1568 690 L1626 690" stroke="#3E9868"/>
  <text class="detail" x="1640" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1568 711 L1626 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1640" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="1325" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="842.5" y="716" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
