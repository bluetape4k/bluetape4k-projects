  <text class="stereo" x="1248" y="259" text-anchor="middle">class</text>
  <text class="classTitle" x="1248" y="278" text-anchor="middle">update Suspending(query,</text>
<text class="classTitle" x="1248" y="300" text-anchor="middle">update)</text>
  <line x1="1078" y1="304" x2="1418" y2="304" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="delete_Suspending_query_delete_All">
  <rect class="classCard" x="1707" y="558" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1877" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="1877" y="596" text-anchor="middle">delete Suspending(query)</text>
<text class="classTitle" x="1877" y="618" text-anchor="middle">delete All</text>
  <line x1="1707" y1="622" x2="2047" y2="622" stroke="#DC6B82" stroke-width="1.4"/>

</g>
<g id="countAllSuspending_count_Suspending_query">
  <rect class="classCard" x="1707" y="240" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1877" y="259" text-anchor="middle">class</text>
  <text class="classTitle" x="1877" y="278" text-anchor="middle">countAllSuspending()</text>
<text class="classTitle" x="1877" y="300" text-anchor="middle">count Suspending(query)</text>
  <line x1="1707" y1="304" x2="2047" y2="304" stroke="#8A72D6" stroke-width="1.4"/>

</g>
<g id="R2dbcEntityOperations">
  <rect class="classCard" x="2322" y="558" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="2492" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="2492" y="605" text-anchor="middle">R2dbcEntityOperations</text>
  <line x1="2322" y1="614" x2="2662" y2="614" stroke="#8BA84D" stroke-width="1.4"/>

</g>
<g id="Database">
  <rect class="classCard" x="2322" y="240" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="2492" y="259" text-anchor="middle">class</text>
  <text class="classTitle" x="2492" y="287" text-anchor="middle">Database</text>
  <line x1="2322" y1="296" x2="2662" y2="296" stroke="#9AA8B8" stroke-width="1.4"/>

</g>
<g>
  <rect x="2564" y="802" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M2582 820 L2640 820" stroke="#3E9868"/>
  <text class="detail" x="2654" y="825">inheritance / implementation</text>
  <path class="dependency" d="M2582 841 L2640 841" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="2654" y="846">dependency / usage</text>
</g>
<g><rect x="180" y="820" width="2339" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1349.5" y="846" text-anchor="middle">Graphviz evidence: .dot, .plain, and -graphviz.svg define relationship order and route intent.</text></g>
</svg>
