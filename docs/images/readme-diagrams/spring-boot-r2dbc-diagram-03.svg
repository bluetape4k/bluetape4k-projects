<svg xmlns="http://www.w3.org/2000/svg" width="2979" height="910" viewBox="0 0 2979 910" role="img" aria-label="CRUD Operation Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="11" markerHeight="10" refX="10.2" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1.2 1 L 10.2 5 L 1.2 9 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2979" height="910"/>
<rect class="frame" x="32" y="28" width="2915" height="854" rx="30"/>
<text class="title" x="68" y="84">CRUD Operation Hierarchy</text>
<text class="subtitle" x="72" y="116">Graphviz-ranked class model: source relationships redrawn with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="Service_Repository" data-to="select_All_Suspending_select_Suspending_query" d="M595 558 L595 372" stroke="#4F83BF"/>
<path class="dependency" data-from="select_All_Suspending_select_Suspending_query" data-to="insert_Suspending_entity_insert_Or_Null" d="M765 342 L922 342 L922 588 L1078 588" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="inherit" data-from="insert_Suspending_entity_insert_Or_Null" data-to="update_Suspending_query_update" d="M1248 558 L1248 372" stroke="#2E8F89"/>
<path class="dependency" data-from="update_Suspending_query_update" data-to="delete_Suspending_query_delete_All" d="M1418 342 L1563 342 L1563 588 L1707 588" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="delete_Suspending_query_delete_All" data-to="countAllSuspending_count_Suspending_query" d="M1877 558 L1877 372" stroke="#C94D68"/>
<path class="dependency" data-from="countAllSuspending_count_Suspending_query" data-to="R2dbcEntityOperations" d="M2047 342 L2185 342 L2185 588 L2322 588" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="inherit" data-from="R2dbcEntityOperations" data-to="Database" d="M2492 558 L2492 372" stroke="#718A35"/>
<g id="Service_Repository">
  <rect class="classCard" x="425" y="558" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="595" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="595" y="605" text-anchor="middle">Service / Repository</text>
  <line x1="425" y1="614" x2="765" y2="614" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="select_All_Suspending_select_Suspending_query">
  <rect class="classCard" x="425" y="240" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="595" y="259" text-anchor="middle">class</text>
  <text class="classTitle" x="595" y="278" text-anchor="middle">select All Suspending()</text>
<text class="classTitle" x="595" y="300" text-anchor="middle">select Suspending(query)</text>
  <line x1="425" y1="304" x2="765" y2="304" stroke="#58A978" stroke-width="1.4"/>

</g>
