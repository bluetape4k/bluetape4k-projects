  <text class="stereo" x="1248" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="1248" y="596" text-anchor="middle">insert</text>
<text class="classTitle" x="1248" y="618" text-anchor="middle">Suspending(entity)</text>
  <line x1="1078" y1="622" x2="1418" y2="622" stroke="#45A7A1" stroke-width="1.4"/>

</g>
