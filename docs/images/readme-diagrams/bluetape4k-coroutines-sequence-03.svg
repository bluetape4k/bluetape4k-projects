<g id="m7"><rect class="labelPill" x="660" y="743" width="210" height="26" rx="7"/><circle cx="679" cy="756" r="12" fill="#4F83BF"/><text class="detail" x="679" y="757" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="783" y="757" text-anchor="middle" dominant-baseline="middle">emit([3, 4, 5])</text><path class="seq" d="M595 786 L935 786" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g><rect x="140" y="902" width="960" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="620" y="928" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
</svg>
