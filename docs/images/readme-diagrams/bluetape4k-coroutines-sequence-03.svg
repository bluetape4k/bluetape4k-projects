<g id="m3"><rect class="labelPill" x="320" y="439" width="210" height="26" rx="7"/><circle cx="339" cy="452" r="12" fill="#2E8F89"/><text class="detail" x="339" y="453" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="443" y="453" text-anchor="middle" dominant-baseline="middle">emit(3)</text><path class="seq" d="M255 482 L595 482" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
