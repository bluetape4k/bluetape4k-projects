<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="947" viewBox="0 0 1500 947" role="img" aria-label="Mutiny Type Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="947"/>
<rect class="frame" x="32" y="28" width="1436" height="891" rx="30"/>
<text class="title" x="68" y="84">Mutiny Type Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="UniT" data-to="MultiT" data-route-color="teal" d="M791 544 L791 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="CoroutineSupport" data-to="UniT" data-route-color="amber" d="M596 303 L596 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MultiSupport" data-to="MultiT" data-route-color="pink" d="M905 544 L905 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="UniSupport" data-to="UniT" data-route-color="purple" d="M710 311 L710 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="CoroutineSupport">
  <rect class="classCard" x="278" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="458" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="458" y="212" text-anchor="middle">CoroutineSupport</text>
  <line x1="278" y1="221" x2="638" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="312" y="258">+CoroutineScope.asUni(block) Uni~T~</text>
<text class="member" x="312" y="275">+CompletableFuture.asUni() Uni~T~</text>
</g>
<g id="UniT">
  <rect class="classCard" x="473" y="398" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="653" y="417" text-anchor="middle">UniT</text>
  <text class="classTitle" x="653" y="445" text-anchor="middle">UniT</text>
  <line x1="473" y1="454" x2="833" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="507" y="486">+onItem() UniOnItem</text>
<text class="member" x="507" y="503">+onFailure() UniOnFailure</text>
<text class="member" x="507" y="520">+await() UniAwait</text>
</g>
<g id="MultiT">
  <rect class="classCard" x="668" y="631" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="848" y="650" text-anchor="middle">MultiT</text>
  <text class="classTitle" x="848" y="678" text-anchor="middle">MultiT</text>
  <line x1="668" y1="687" x2="1028" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="702" y="719">+onItem() MultiOnItem</text>
<text class="member" x="702" y="736">+onFailure() MultiOnFailure</text>
<text class="member" x="702" y="753">+filter(predicate) Multi~T~</text>
</g>
<g id="MultiSupport">
  <rect class="classCard" x="863" y="398" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1043" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1043" y="445" text-anchor="middle">MultiSupport</text>
  <line x1="863" y1="454" x2="1223" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="897" y="486">+multiOf(vararg items) Multi~T~</text>
<text class="member" x="897" y="503">+multiRangeOf(start, end) Multi~Int~</text>
<text class="member" x="897" y="520">+List.asMulti() Multi~T~</text>
</g>
<g id="UniSupport">
  <rect class="classCard" x="668" y="165" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="848" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="848" y="212" text-anchor="middle">UniSupport</text>
  <line x1="668" y1="221" x2="1028" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="702" y="253">+uniOf(value) Uni~T~</text>
<text class="member" x="702" y="270">+nullUni() Uni~T~</text>
<text class="member" x="702" y="287">+voidUni() Uni~Void~</text>
</g>
<g>
  <rect x="1085" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 857 L1161 857" stroke="#3E9868"/>
  <text class="detail" x="1175" y="862">inheritance / implementation</text>
  <path class="dependency" d="M1103 878 L1161 878" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="883">dependency / usage</text>
</g>
<g><rect x="180" y="857" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="883" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
