<svg data-intent="Replace the unsupported channel-pipeline inventory with the actual module processing story: ByteBuf read/write families transform bytes through endian/offset/smart/string helpers." data-evidence="io/netty/README.md; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufExtensions.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufUtilSupport.kt" data-source-read="io/netty/README.md; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufExtensions.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufUtilSupport.kt" xmlns="http://www.w3.org/2000/svg" width="1440" height="985" viewBox="0 0 1440 985" role="img" aria-label="ByteBuf Processing Flow">
