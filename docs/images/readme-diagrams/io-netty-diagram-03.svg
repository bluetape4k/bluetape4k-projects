  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">ChannelHandler 2 ByteBuf</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">extension processing</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">readVarInt /</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">ChannelHandler 3</text>
