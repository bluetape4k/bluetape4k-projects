<g id="seq-otlp-optional"><rect class="card" x="2263" y="170" width="230" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="2378" y="215" text-anchor="middle">OTLP optional</text><line class="lifeline" x1="2378" y1="248" x2="2378" y2="962"/></g>
