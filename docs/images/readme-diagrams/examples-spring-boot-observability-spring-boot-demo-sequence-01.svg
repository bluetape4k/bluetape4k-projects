<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="820" viewBox="0 0 1620 820" role="img" aria-labelledby="examples-spring-boot-observability-spring-boot-demo-sequence-01-title examples-spring-boot-observability-spring-boot-demo-sequence-01-desc">
  <title id="examples-spring-boot-observability-spring-boot-demo-sequence-01-title">Spring Boot Observability Demo Sequence</title>
  <desc id="examples-spring-boot-observability-spring-boot-demo-sequence-01-desc">HTTP work, event observations, Prometheus scrape output, and optional trace export.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="arrowNeutral" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/>
    </marker>
    <marker id="arrowRequest" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowService" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#45A7A1"/>
    </marker>
    <marker id="arrowEvent" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#58A978"/>
    </marker>
    <marker id="arrowMetrics" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D6A441"/>
    </marker>
    <marker id="arrowTrace" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#8A72D6"/>
    </marker>
    <marker id="arrowResponse" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC6B82"/>
    </marker>
    <marker id="seqArrow-blue" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#58A978"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D6A441"/>
    </marker>
    <marker id="seqArrow-purple" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#8A72D6"/>
    </marker>
    <marker id="seqArrow-pink" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path stroke-dasharray="none" d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC6B82" style="stroke-dasharray:none"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .sequenceEdge{stroke-width:2.3;fill:none}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1620" height="820"/>
  <rect class="frame" x="32" y="28" width="1556" height="744" rx="26"/>
  <text class="title" x="66" y="82">Spring Boot Observability Demo Sequence</text>
  <text class="subtitle" x="70" y="116">HTTP work, event observations, Prometheus scrape output, and optional trace export.</text>

  <g id="client">
    <rect class="participant" x="90" y="165" width="165" height="74" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="participantTitle" x="172.5" y="202" text-anchor="middle" dominant-baseline="middle">Client</text>
    <line class="lifeline" x1="172.5" y1="239" x2="172.5" y2="720" />
  </g>

  <g id="controller">
    <rect class="participant" x="340" y="165" width="165" height="74" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="participantTitle" x="422.5" y="190" text-anchor="middle" dominant-baseline="middle">Spring MVC</text>
<text class="participantTitle" x="422.5" y="214" text-anchor="middle" dominant-baseline="middle">Controller</text>
    <line class="lifeline" x1="422.5" y1="239" x2="422.5" y2="720" />
  </g>

  <g id="springObs">
    <rect class="participant" x="610" y="165" width="165" height="74" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="participantTitle" x="692.5" y="202" text-anchor="middle" dominant-baseline="middle">observeSpring</text>
    <line class="lifeline" x1="692.5" y1="239" x2="692.5" y2="720" />
  </g>

  <g id="eventObs">
    <rect class="participant" x="880" y="165" width="165" height="74" rx="10" fill="#EAF7EF" stroke="#58A978"/>
    <text class="participantTitle" x="962.5" y="190" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="participantTitle" x="962.5" y="214" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <line class="lifeline" x1="962.5" y1="239" x2="962.5" y2="720" />
  </g>

  <g id="actuator">
    <rect class="participant" x="1145" y="165" width="175" height="74" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="participantTitle" x="1232.5" y="190" text-anchor="middle" dominant-baseline="middle">Actuator</text>
<text class="participantTitle" x="1232.5" y="214" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
    <line class="lifeline" x1="1232.5" y1="239" x2="1232.5" y2="720" />
  </g>

  <g id="otlp">
    <rect class="participant" x="1365" y="165" width="155" height="74" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="participantTitle" x="1442.5" y="190" text-anchor="middle" dominant-baseline="middle">OTLP</text>
<text class="participantTitle" x="1442.5" y="214" text-anchor="middle" dominant-baseline="middle">optional</text>
    <line class="lifeline" x1="1442.5" y1="239" x2="1442.5" y2="720" />
  </g>

  <g id="post-order">
    <path class="seq" d="M172.5 295 L422.5 295" stroke="#5B8DEF" marker-end="url(#seqArrow-blue)"/>

    <rect class="labelPill" x="178.65" y="262" width="237.7" height="26" rx="7"/>
    <circle cx="192.65" cy="275" r="10" fill="#5B8DEF" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="192.65" y="276" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">1</text>
    <text class="edgeLabel" x="309.5" y="276" text-anchor="middle" dominant-baseline="middle">POST /orders/{orderId}/events</text>
  </g>

  <g id="observe-work">
    <path class="seq" d="M422.5 355 L692.5 355" stroke="#45A7A1" marker-end="url(#seqArrow-blue)"/>

    <rect class="labelPill" x="453.25" y="322" width="208.5" height="26" rx="7"/>
    <circle cx="467.25" cy="335" r="10" fill="#45A7A1" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="467.25" y="336" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">2</text>
    <text class="edgeLabel" x="569.5" y="336" text-anchor="middle" dominant-baseline="middle">observe HTTP service work</text>
  </g>

  <g id="publish">
    <path class="seq" d="M692.5 415 L962.5 415" stroke="#58A978" marker-end="url(#seqArrow-green)"/>

    <rect class="labelPill" x="752.5" y="382" width="150" height="26" rx="7"/>
    <circle cx="766.5" cy="395" r="10" fill="#58A978" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="766.5" y="396" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">3</text>
    <text class="edgeLabel" x="839.5" y="396" text-anchor="middle" dominant-baseline="middle">event.publish</text>
  </g>

  <g id="consume">
    <path class="seq" d="M692.5 475 L962.5 475" stroke="#58A978" marker-end="url(#seqArrow-green)"/>

    <rect class="labelPill" x="752.5" y="442" width="150" height="26" rx="7"/>
    <circle cx="766.5" cy="455" r="10" fill="#58A978" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="766.5" y="456" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">4</text>
    <text class="edgeLabel" x="839.5" y="456" text-anchor="middle" dominant-baseline="middle">event.consume</text>
  </g>

  <g id="service-response">
    <path class="seqReturn" d="M692.5 535 L422.5 535" stroke="#DC6B82" marker-end="url(#seqArrow-pink)" stroke-dasharray="8 7"/>

    <rect class="labelPill" x="478.8" y="502" width="157.4" height="26" rx="7"/>
    <circle cx="492.8" cy="515" r="10" fill="#DC6B82" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="492.8" y="516" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">5</text>
    <text class="edgeLabel" x="569.5" y="516" text-anchor="middle" dominant-baseline="middle">OrderEventResponse</text>
  </g>

  <g id="json-response">
    <path class="seqReturn" d="M422.5 595 L172.5 595" stroke="#DC6B82" marker-end="url(#seqArrow-pink)" stroke-dasharray="8 7"/>

    <rect class="labelPill" x="222.5" y="562" width="150" height="26" rx="7"/>
    <circle cx="236.5" cy="575" r="10" fill="#DC6B82" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="236.5" y="576" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">6</text>
    <text class="edgeLabel" x="309.5" y="576" text-anchor="middle" dominant-baseline="middle">200 JSON</text>
  </g>

  <g id="scrape">
    <path class="seq" d="M172.5 650 L1232.5 650" stroke="#D6A441" marker-end="url(#seqArrow-amber)"/>

    <rect class="labelPill" x="601.9" y="617" width="201.2" height="26" rx="7"/>
    <circle cx="615.9" cy="630" r="10" fill="#D6A441" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="615.9" y="631" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">7</text>
    <text class="edgeLabel" x="714.5" y="631" text-anchor="middle" dominant-baseline="middle">GET /actuator/prometheus</text>
  </g>

  <g id="traces">
    <path class="seqReturn" d="M692.5 325 L1442.5 325" stroke="#8A72D6" marker-end="url(#seqArrow-pink)" stroke-dasharray="8 7"/>

    <rect class="labelPill" x="974.2" y="292" width="186.6" height="26" rx="7"/>
    <circle cx="988.2" cy="305" r="10" fill="#8A72D6" stroke="#FFFFFF" stroke-width="2"/>
    <text class="edgeLabel" x="988.2" y="306" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF">8</text>
    <text class="edgeLabel" x="1079.5" y="306" text-anchor="middle" dominant-baseline="middle">traces when configured</text>
  </g>
  <text class="note" x="810" y="790" text-anchor="middle">bluetape4k-projects observability examples - github.com/bluetape4k/bluetape4k-projects</text>
</svg>
