<rect x="671.6" y="322" width="16" height="380" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1096.2" y="322" width="16" height="556" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1520.8" y="410" width="16" height="116" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1945.4" y="762" width="16" height="52" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<rect x="2370" y="850" width="16" height="52" rx="5" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="732.1" y="287" width="319.7" height="26" rx="7"/><circle cx="751.1" cy="300" r="12" fill="#4F83BF"/><text class="detail" x="751.1" y="301" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="909.9" y="301" text-anchor="middle" dominant-baseline="middle">POST /orders/{orderId}/events</text><path class="seq" d="M679.6 330 L1104.2 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="1171.3" y="375" width="290.5" height="26" rx="7"/><circle cx="1190.3" cy="388" r="12" fill="#3E9868"/><text class="detail" x="1190.3" y="389" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="1334.5" y="389" text-anchor="middle" dominant-baseline="middle">observe HTTP service work</text><path class="seq" d="M1104.2 418 L1528.8 418" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="1201.5" y="463" width="230" height="26" rx="7"/><circle cx="1220.5" cy="476" r="12" fill="#2E8F89"/><text class="detail" x="1220.5" y="477" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1334.5" y="477" text-anchor="middle" dominant-baseline="middle">event.publish</text><path class="seq" d="M1104.2 506 L1528.8 506" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="776.9" y="551" width="230" height="26" rx="7"/><circle cx="795.9" cy="564" r="12" fill="#2E8F89"/><text class="detail" x="795.9" y="565" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="909.9" y="565" text-anchor="middle" dominant-baseline="middle">event.consume</text><path class="seqReturn" d="M1104.2 594 L679.6 594" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m5"><rect class="labelPill" x="347.6" y="639" width="239.4" height="26" rx="7"/><circle cx="366.6" cy="652" r="12" fill="#2E8F89"/><text class="detail" x="366.6" y="653" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="485.3" y="653" text-anchor="middle" dominant-baseline="middle">OrderEventResponse</text><path class="seqReturn" d="M679.6 682 L255 682" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m6"><rect class="labelPill" x="989.2" y="727" width="230" height="26" rx="7"/><circle cx="1008.2" cy="740" r="12" fill="#755BC6"/><text class="detail" x="1008.2" y="741" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1122.2" y="741" text-anchor="middle" dominant-baseline="middle">200 JSON</text><path class="seq" d="M255 770 L1953.4 770" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m7"><rect class="labelPill" x="1599.5" y="815" width="283.2" height="26" rx="7"/><circle cx="1618.5" cy="828" r="12" fill="#4F83BF"/><text class="detail" x="1618.5" y="829" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="1759.1" y="829" text-anchor="middle" dominant-baseline="middle">GET /actuator/prometheus</text><path class="seq" d="M1104.2 858 L2378 858" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g><rect x="140" y="986" width="2353" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1316.5" y="1012" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
</svg>
