<svg xmlns="http://www.w3.org/2000/svg" width="3104" height="945" viewBox="0 0 3104 945" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="11" markerHeight="10" refX="10.2" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1.2 1 L 10.2 5 L 1.2 9 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="3104" height="945"/>
<rect class="frame" x="32" y="28" width="3040" height="889" rx="30"/>
<text class="title" x="68" y="84">Core Class Structure</text>
<text class="subtitle" x="72" y="116">Graphviz-ranked class model: source relationships redrawn with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="SdkMeterProvider" data-to="Meter" d="M1019 593 L1019 407" stroke="#755BC6"/>
<path class="inherit" data-from="SdkTracerProvider" data-to="Tracer" d="M1552 593 L1552 407" stroke="#718A35"/>
<path class="dependency" data-from="SpanBuilder" data-to="Span" d="M2254 341 L2447 341" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Tracer" data-to="SpanBuilder" d="M1722 341 L1914 341" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="dependency" data-from="OpenTelemetry" data-to="Meter" d="M657 341 L849 341" stroke="#4F83BF" stroke-dasharray="8 7"/>
<path class="dependency" data-from="OpenTelemetry" data-to="Tracer" d="M657 341 L1382 341" stroke="#4F83BF" stroke-dasharray="8 7"/>
<g id="OpenTelemetry">
  <rect class="classCard" x="317" y="275" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="487" y="294" text-anchor="middle">interface</text>
  <text class="classTitle" x="487" y="322" text-anchor="middle">OpenTelemetry</text>
  <line x1="317" y1="331" x2="657" y2="331" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="335" y="356">+getTracer(name) Tracer</text>
<text class="member" x="335" y="373">+getMeter(name) Meter</text>
<text class="member" x="335" y="390">+getPropagators()</text>
</g>
<g id="Tracer">
  <rect class="classCard" x="1382" y="275" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1552" y="294" text-anchor="middle">interface</text>
  <text class="classTitle" x="1552" y="322" text-anchor="middle">Tracer</text>
  <line x1="1382" y1="331" x2="1722" y2="331" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="1400" y="373">+spanBuilder(spanName) SpanBuilder</text>
</g>
<g id="Meter">
  <rect class="classCard" x="849" y="275" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1019" y="294" text-anchor="middle">interface</text>
  <text class="classTitle" x="1019" y="322" text-anchor="middle">Meter</text>
  <line x1="849" y1="331" x2="1189" y2="331" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="867" y="356">+counterBuilder(name)</text>
<text class="member" x="867" y="373">LongCounterBuilder</text>
<text class="member" x="867" y="390">+timerBuilder(name)</text>
</g>
<g id="SpanBuilder">
  <rect class="classCard" x="1914" y="275" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="2084" y="294" text-anchor="middle">interface</text>
  <text class="classTitle" x="2084" y="322" text-anchor="middle">SpanBuilder</text>
  <line x1="1914" y1="331" x2="2254" y2="331" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1932" y="356">+setSpanKind(kind) SpanBuilder</text>
<text class="member" x="1932" y="373">+setAttribute(key, value)</text>
<text class="member" x="1932" y="390">SpanBuilder</text>
</g>
<g id="Span">
  <rect class="classCard" x="2447" y="275" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="2617" y="294" text-anchor="middle">interface</text>
  <text class="classTitle" x="2617" y="322" text-anchor="middle">Span</text>
  <line x1="2447" y1="331" x2="2787" y2="331" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="2465" y="356">+addEvent(name) Span</text>
<text class="member" x="2465" y="373">+setAttribute(key, value) Span</text>
<text class="member" x="2465" y="390">+recordException(t) Span</text>
</g>
<g id="SdkMeterProvider">
  <rect class="classCard" x="849" y="593" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1019" y="612" text-anchor="middle">class</text>
  <text class="classTitle" x="1019" y="640" text-anchor="middle">SdkMeterProvider</text>
  <line x1="849" y1="649" x2="1189" y2="649" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="867" y="683">+registerMetricReader(mr)</text>
<text class="member" x="867" y="700">SdkMeterProviderBuilder</text>
</g>
<g id="SdkTracerProvider">
  <rect class="classCard" x="1382" y="593" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1552" y="612" text-anchor="middle">class</text>
  <text class="classTitle" x="1552" y="640" text-anchor="middle">SdkTracerProvider</text>
  <line x1="1382" y1="649" x2="1722" y2="649" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1400" y="674">+addSpanProcessor(sp)</text>
<text class="member" x="1400" y="691">SdkTracerProviderBuilder</text>
<text class="member" x="1400" y="708">+setResource(resource)</text>
</g>
<g>
  <rect x="2689" y="837" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M2707 855 L2765 855" stroke="#3E9868"/>
  <text class="detail" x="2779" y="860">inheritance / implementation</text>
  <path class="dependency" d="M2707 876 L2765 876" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="2779" y="881">dependency / usage</text>
</g>
<g><rect x="180" y="855" width="2464" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1412" y="881" text-anchor="middle">Graphviz evidence: .dot, .plain, and -graphviz.svg define relationship order and route intent.</text></g>
</svg>
