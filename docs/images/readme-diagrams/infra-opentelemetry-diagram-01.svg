<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-label="OpenTelemetry Core Class Structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="openBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:50px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#475569;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6}
      .panelTitle{font-family:"Architects Daughter";font-size:30px;fill:#0F172A}
      .card{filter:url(#softShadow);stroke-width:2.2}
      .external{fill:#F8FAFC;stroke:#64748B;stroke-dasharray:8 8}
      .sdk{fill:#EFF6FF;stroke:#2563EB}
      .trace{fill:#FAF5FF;stroke:#9333EA}
      .flow{fill:#F0FDFA;stroke:#0D9488}
      .data{fill:#F0FDF4;stroke:#16A34A}
      .web{fill:#FFF7ED;stroke:#EA580C}
      .note{fill:#FDF2F8;stroke:#DB2777}
      .name{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
      .smallName{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .meta{font-family:"Comic Mono";font-size:14px;fill:#475569;font-weight:700}
      .tiny{font-family:"Comic Mono";font-size:12px;fill:#475569;font-weight:700}
      .line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .blue{stroke:#2563EB;marker-end:url(#openBlue)}
      .purple{stroke:#9333EA;marker-end:url(#openPurple)}
      .teal{stroke:#0D9488;marker-end:url(#openTeal)}
      .green{stroke:#16A34A;marker-end:url(#openGreen)}
      .orange{stroke:#EA580C;marker-end:url(#openOrange)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120"/>
  <rect class="frame" x="36" y="34" width="1728" height="1052" rx="8"/>

  <text class="title" x="82" y="100">OpenTelemetry Core Class Structure</text>
  <text class="subtitle" x="86" y="134">Kotlin helpers wrap the OpenTelemetry Java SDK without hiding span lifecycle, context propagation, or exporter setup.</text>

  <g id="api-panel">
    <rect class="panel" x="82" y="188" width="1636" height="190" rx="8"/>
    <text class="panelTitle" x="114" y="234">OpenTelemetry Java and Spring surfaces</text>
  </g>
  <g id="helper-panel">
    <rect class="panel" x="82" y="446" width="1636" height="296" rx="8"/>
    <text class="panelTitle" x="114" y="492">Helpers</text>
  </g>
  <g id="result-panel">
    <rect class="panel" x="82" y="810" width="1636" height="174" rx="8"/>
    <text class="panelTitle" x="114" y="856">Outputs</text>
  </g>

  <g id="api-sdk">
    <rect class="card external" x="118" y="264" width="276" height="82" rx="8"/>
    <text class="smallName" x="256" y="297" text-anchor="middle">OpenTelemetry SDK</text>
    <text class="meta" x="256" y="322" text-anchor="middle">OpenTelemetrySdkBuilder</text>
  </g>
  <g id="api-trace">
    <rect class="card external" x="432" y="264" width="276" height="82" rx="8"/>
    <text class="smallName" x="570" y="297" text-anchor="middle">Trace API</text>
    <text class="meta" x="570" y="322" text-anchor="middle">Tracer + SpanBuilder + Span</text>
  </g>
  <g id="api-context">
    <rect class="card external" x="746" y="264" width="276" height="82" rx="8"/>
    <text class="smallName" x="884" y="297" text-anchor="middle">Context bridge</text>
    <text class="meta" x="884" y="322" text-anchor="middle">Context + asContextElement</text>
  </g>
  <g id="api-metrics">
    <rect class="card external" x="1060" y="264" width="276" height="82" rx="8"/>
    <text class="smallName" x="1198" y="297" text-anchor="middle">Metrics + Attributes</text>
    <text class="meta" x="1198" y="322" text-anchor="middle">MeterProvider + Attributes</text>
  </g>
  <g id="api-web">
    <rect class="card external" x="1374" y="264" width="276" height="82" rx="8"/>
    <text class="smallName" x="1512" y="297" text-anchor="middle">Spring WebFlux 5.3</text>
    <text class="meta" x="1512" y="322" text-anchor="middle">Server telemetry + WebFilter</text>
  </g>

  <g id="helper-sdk">
    <rect class="card sdk" x="110" y="526" width="292" height="142" rx="8"/>
    <text class="name" x="256" y="562" text-anchor="middle">SDK factories</text>
    <text class="meta" x="256" y="592" text-anchor="middle">NoopOpenTelemetry</text>
    <text class="meta" x="256" y="615" text-anchor="middle">globalOpenTelemetry</text>
    <text class="meta" x="256" y="638" text-anchor="middle">openTelemetrySdk*</text>
  </g>
  <g id="helper-trace">
    <rect class="card trace" x="424" y="506" width="292" height="182" rx="8"/>
    <text class="name" x="570" y="542" text-anchor="middle">Trace lifecycle</text>
    <text class="meta" x="570" y="572" text-anchor="middle">sdkTracerProvider</text>
    <text class="meta" x="570" y="595" text-anchor="middle">Tracer.startSpan</text>
    <text class="meta" x="570" y="618" text-anchor="middle">Span.use / useSpan</text>
    <text class="meta" x="570" y="641" text-anchor="middle">Tracer.withSpan</text>
  </g>
  <g id="helper-flow">
    <rect class="card flow" x="738" y="506" width="292" height="182" rx="8"/>
    <text class="name" x="884" y="542" text-anchor="middle">Coroutine tracing</text>
    <text class="meta" x="884" y="572" text-anchor="middle">useSuspending</text>
    <text class="meta" x="884" y="595" text-anchor="middle">withSpanContext</text>
    <text class="meta" x="884" y="618" text-anchor="middle">Flow.traced</text>
    <text class="meta" x="884" y="641" text-anchor="middle">tracedCollect / await</text>
  </g>
  <g id="helper-metrics">
    <rect class="card data" x="1052" y="506" width="292" height="182" rx="8"/>
    <text class="name" x="1198" y="542" text-anchor="middle">Attributes + metrics</text>
    <text class="meta" x="1198" y="572" text-anchor="middle">attributeKey helpers</text>
    <text class="meta" x="1198" y="595" text-anchor="middle">attributes / attributesOf</text>
    <text class="meta" x="1198" y="618" text-anchor="middle">Map.toAttributes</text>
    <text class="meta" x="1198" y="641" text-anchor="middle">metric readers/exporters</text>
  </g>
  <g id="helper-web">
    <rect class="card web" x="1366" y="526" width="292" height="142" rx="8"/>
    <text class="name" x="1512" y="562" text-anchor="middle">Legacy WebFlux</text>
    <text class="meta" x="1512" y="592" text-anchor="middle">webfluxServerTelemetry</text>
    <text class="meta" x="1512" y="615" text-anchor="middle">createTracingWebFilter</text>
    <text class="meta" x="1512" y="638" text-anchor="middle">registers Reactor hook</text>
  </g>

  <path class="line blue" d="M 256 346 V 516"/>
  <path class="line purple" d="M 570 346 V 496"/>
  <path class="line teal" d="M 884 346 V 496"/>
  <path class="line green" d="M 1198 346 V 496"/>
  <path class="line orange" d="M 1512 346 V 516"/>

  <g id="result-sdk">
    <rect class="card sdk" x="118" y="884" width="276" height="74" rx="8"/>
    <text class="smallName" x="256" y="915" text-anchor="middle">SDK instance</text>
    <text class="meta" x="256" y="940" text-anchor="middle">local or GlobalOpenTelemetry</text>
  </g>
  <g id="result-trace">
    <rect class="card trace" x="432" y="884" width="276" height="74" rx="8"/>
    <text class="smallName" x="570" y="915" text-anchor="middle">Scoped spans</text>
    <text class="meta" x="570" y="940" text-anchor="middle">OK / ERROR / cancellation-safe</text>
  </g>
  <g id="result-flow">
    <rect class="card flow" x="746" y="884" width="276" height="74" rx="8"/>
    <text class="smallName" x="884" y="915" text-anchor="middle">Context propagation</text>
    <text class="meta" x="884" y="940" text-anchor="middle">1 collect = 1 span</text>
  </g>
  <g id="result-metrics">
    <rect class="card data" x="1060" y="884" width="276" height="74" rx="8"/>
    <text class="smallName" x="1198" y="915" text-anchor="middle">Telemetry data</text>
    <text class="meta" x="1198" y="940" text-anchor="middle">Attributes, meters, exporters</text>
  </g>
  <g id="result-web">
    <rect class="card web" x="1374" y="884" width="276" height="74" rx="8"/>
    <text class="smallName" x="1512" y="915" text-anchor="middle">WebFilter boundary</text>
    <text class="meta" x="1512" y="940" text-anchor="middle">Boot 3 migration helper</text>
  </g>

  <path class="line blue" d="M 256 668 V 876"/>
  <path class="line purple" d="M 570 688 V 876"/>
  <path class="line teal" d="M 884 688 V 876"/>
  <path class="line green" d="M 1198 688 V 876"/>
  <path class="line orange" d="M 1512 668 V 876"/>

  <g id="security-note">
    <rect class="card note" x="438" y="1012" width="924" height="44" rx="8"/>
    <text class="meta" x="900" y="1039" text-anchor="middle">Span configure lambdas must not attach PII, Authorization tokens, or sensitive headers as attributes.</text>
  </g>
</svg>
