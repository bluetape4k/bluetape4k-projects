<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1348" viewBox="0 0 1754 1348" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1348"/>
<rect class="frame" x="32" y="28" width="1690" height="1292" rx="28"/>
<text class="title" x="66" y="82">Core Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="implLine" d="M672 911 L672 444 L1082 444 L1082 376"/>
<path class="implLine" d="M1082 911 L1082 476 L672 476 L672 313"/>
<path class="line" d="M1492 397 L1492 468 L877 468 L877 523"/>
<path class="line" d="M672 313 L672 122 L1492 122 L1492 180"/>
<path class="line" d="M262 355 L262 132 L1082 132 L1082 180"/>
<path class="line" d="M262 180 L262 444 L672 444 L672 313"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">OpenTelemetry</text>
  <text class="mono" x="18" y="108">+getTracer(name) Tracer</text>
<text class="mono" x="18" y="129">+getMeter(name) Meter</text>
<text class="mono" x="18" y="150">+getPropagators() ContextPropagators</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Tracer</text>
  <text class="mono" x="18" y="108">+spanBuilder(spanName) SpanBuilder</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Meter</text>
  <text class="mono" x="18" y="108">+counterBuilder(name) LongCounterBuilder</text>
<text class="mono" x="18" y="129">+timerBuilder(name) DoubleHistogramBuilder</text>
<text class="mono" x="18" y="150">+gaugeBuilder(name)</text>
<text class="mono" x="18" y="171">ObservableDoubleGaugeBuilder</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">SpanBuilder</text>
  <text class="mono" x="18" y="108">+setSpanKind(kind) SpanBuilder</text>
<text class="mono" x="18" y="129">+setAttribute(key, value) SpanBuilder</text>
<text class="mono" x="18" y="150">+startSpan() Span</text>
<text class="mono" x="18" y="171">+useSpan(block) T</text>
<text class="mono" x="18" y="192">+useSpanSuspending(block) T</text>
</g>
<g transform="translate(707,523)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Span</text>
  <text class="mono" x="18" y="108">+addEvent(name) Span</text>
<text class="mono" x="18" y="129">+setAttribute(key, value) Span</text>
<text class="mono" x="18" y="150">+recordException(t) Span</text>
<text class="mono" x="18" y="171">+end()</text>
<text class="mono" x="18" y="192">+use(block) T</text>
<text class="mono" x="18" y="213">+useSuspending(block) T</text>
</g>
<g transform="translate(502,911)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">SdkMeterProvider</text>
  <text class="mono" x="18" y="108">+registerMetricReader(mr)</text>
<text class="mono" x="18" y="129">SdkMeterProviderBuilder</text>
</g>
<g transform="translate(912,911)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">SdkTracerProvider</text>
  <text class="mono" x="18" y="108">+addSpanProcessor(sp)</text>
<text class="mono" x="18" y="129">SdkTracerProviderBuilder</text>
<text class="mono" x="18" y="150">+setResource(resource)</text>
<text class="mono" x="18" y="171">SdkTracerProviderBuilder</text>
<text class="mono" x="18" y="192">+get(instrumentationName) Tracer</text>
</g>
</svg>
