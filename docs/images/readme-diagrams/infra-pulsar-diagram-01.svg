<g id="ProducerExtensions">
  <rect class="classCard" x="118" y="631" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="298" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="678" text-anchor="middle">ProducerExtensions</text>
  <line x1="118" y1="687" x2="478" y2="687" stroke="#8BA84D" stroke-width="1.4"/>
