<text class="member" x="152" y="736">+Producer.sendSuspend(setup)</text>
<text class="member" x="152" y="753">+Producer.sendAsFlow(messages)</text>
</g>
<g id="Jackson3Schema">
  <rect class="classCard" x="1354" y="165" width="360" height="138" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1534" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="212" text-anchor="middle">Jackson3Schema</text>
  <line x1="1354" y1="221" x2="1714" y2="221" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1388" y="258">+jackson3Schema~T~(type, mapper)</text>
