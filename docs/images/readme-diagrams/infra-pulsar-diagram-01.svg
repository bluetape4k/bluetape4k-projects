  <text class="mono" x="18" y="108">+PulsarClient.producer(schema, setup)</text>
<text class="mono" x="18" y="129">+PulsarClient.withProducer(schema, setup,</text>
<text class="mono" x="18" y="150">block)</text>
</g>
