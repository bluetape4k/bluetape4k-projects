<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-label="Pulsar Class Structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:50px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#475569;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6}
      .panelTitle{font-family:"Architects Daughter";font-size:30px;fill:#0F172A}
      .card{filter:url(#softShadow);stroke-width:2.2}
      .external{fill:#F8FAFC;stroke:#64748B;stroke-dasharray:8 8}
      .client{fill:#EFF6FF;stroke:#2563EB}
      .producer{fill:#FAF5FF;stroke:#9333EA}
      .consumer{fill:#F0FDFA;stroke:#0D9488}
      .reader{fill:#F0FDF4;stroke:#16A34A}
      .schema{fill:#FFF7ED;stroke:#EA580C}
      .note{fill:#FDF2F8;stroke:#DB2777}
      .name{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
      .smallName{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .meta{font-family:"Comic Mono";font-size:14px;fill:#475569;font-weight:700}
      .tiny{font-family:"Comic Mono";font-size:12px;fill:#475569;font-weight:700}
      .line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .blue{stroke:#2563EB;marker-end:url(#arrowBlue)}
      .purple{stroke:#9333EA;marker-end:url(#arrowPurple)}
      .teal{stroke:#0D9488;marker-end:url(#arrowTeal)}
      .green{stroke:#16A34A;marker-end:url(#arrowGreen)}
      .orange{stroke:#EA580C;marker-end:url(#arrowOrange)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1120"/>
  <rect class="frame" x="36" y="34" width="1728" height="1052" rx="8"/>

  <text class="title" x="82" y="100">Pulsar Class Structure</text>
  <text class="subtitle" x="86" y="134">PulsarClient owns producer, consumer, and reader builders; bluetape4k adds scoped lifecycle, suspend APIs, Flow bridges, and JSON schemas.</text>

  <g id="pulsar-api-panel">
    <rect class="panel" x="82" y="186" width="1636" height="188" rx="8"/>
    <text class="panelTitle" x="114" y="232">Pulsar client surface</text>
  </g>
  <g id="helper-panel">
    <rect class="panel" x="82" y="438" width="1636" height="286" rx="8"/>
    <text class="panelTitle" x="114" y="484">Helpers</text>
  </g>
  <g id="operation-panel">
    <rect class="panel" x="82" y="790" width="1636" height="174" rx="8"/>
    <text class="panelTitle" x="114" y="836">Coroutine and Flow contracts</text>
  </g>

  <g id="pulsar-client">
    <rect class="card external" x="160" y="266" width="292" height="76" rx="8"/>
    <image data-bluetape4k-icon="testcontainers/mq/apache-pulsar.svg" x="178" y="277" width="34" height="34" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="smallName" x="306" y="298" text-anchor="middle">PulsarClient</text>
    <text class="meta" x="306" y="323" text-anchor="middle">ClientBuilder + serviceUrl</text>
  </g>
  <g id="pulsar-producer">
    <rect class="card external" x="540" y="266" width="238" height="76" rx="8"/>
    <text class="smallName" x="659" y="298" text-anchor="middle">Producer&lt;T&gt;</text>
    <text class="meta" x="659" y="323" text-anchor="middle">sendAsync / newMessage</text>
  </g>
  <g id="pulsar-consumer">
    <rect class="card external" x="850" y="266" width="238" height="76" rx="8"/>
    <text class="smallName" x="969" y="298" text-anchor="middle">Consumer&lt;T&gt;</text>
    <text class="meta" x="969" y="323" text-anchor="middle">receiveAsync + ack</text>
  </g>
  <g id="pulsar-reader">
    <rect class="card external" x="1160" y="266" width="238" height="76" rx="8"/>
    <text class="smallName" x="1279" y="298" text-anchor="middle">Reader&lt;T&gt;</text>
    <text class="meta" x="1279" y="323" text-anchor="middle">readNextAsync</text>
  </g>
  <g id="pulsar-schema">
    <rect class="card external" x="1470" y="266" width="180" height="76" rx="8"/>
    <text class="smallName" x="1560" y="298" text-anchor="middle">Schema&lt;T&gt;</text>
    <text class="meta" x="1560" y="323" text-anchor="middle">encode / decode</text>
  </g>

  <g id="client-helper">
    <rect class="card client" x="160" y="524" width="292" height="110" rx="8"/>
    <text class="name" x="306" y="560" text-anchor="middle">Client lifecycle</text>
    <text class="meta" x="306" y="590" text-anchor="middle">pulsarClient</text>
    <text class="meta" x="306" y="613" text-anchor="middle">withPulsarClient closes async</text>
  </g>
  <g id="producer-helper">
    <rect class="card producer" x="520" y="508" width="278" height="142" rx="8"/>
    <text class="name" x="659" y="544" text-anchor="middle">Producer helpers</text>
    <text class="meta" x="659" y="574" text-anchor="middle">producer / withProducer</text>
    <text class="meta" x="659" y="597" text-anchor="middle">sendSuspend</text>
    <text class="meta" x="659" y="620" text-anchor="middle">sendAsFlow</text>
  </g>
  <g id="consumer-helper">
    <rect class="card consumer" x="830" y="508" width="278" height="142" rx="8"/>
    <text class="name" x="969" y="544" text-anchor="middle">Consumer helpers</text>
    <text class="meta" x="969" y="574" text-anchor="middle">consumer / withConsumer</text>
    <text class="meta" x="969" y="597" text-anchor="middle">receiveAsFlow</text>
    <text class="meta" x="969" y="620" text-anchor="middle">acknowledge*Suspend</text>
  </g>
  <g id="reader-helper">
    <rect class="card reader" x="1140" y="508" width="278" height="142" rx="8"/>
    <text class="name" x="1279" y="544" text-anchor="middle">Reader helpers</text>
    <text class="meta" x="1279" y="574" text-anchor="middle">reader / withReader</text>
    <text class="meta" x="1279" y="597" text-anchor="middle">readNextSuspend</text>
    <text class="meta" x="1279" y="620" text-anchor="middle">readAsFlow terminates</text>
  </g>
  <g id="schema-helper">
    <rect class="card schema" x="1470" y="524" width="180" height="110" rx="8"/>
    <text class="smallName" x="1560" y="558" text-anchor="middle">JSON schemas</text>
    <text class="meta" x="1560" y="584" text-anchor="middle">jacksonSchema</text>
    <text class="meta" x="1560" y="607" text-anchor="middle">jackson3Schema</text>
  </g>

  <path class="line blue" d="M 306 342 V 516" style="marker-end:none"/>
<polyline points="300,504 306,516 312,504" fill="none" stroke="#2563EB" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line purple" d="M 659 342 V 500" style="marker-end:none"/>
<polyline points="653,488 659,500 665,488" fill="none" stroke="#9333EA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line teal" d="M 969 342 V 500" style="marker-end:none"/>
<polyline points="963,488 969,500 975,488" fill="none" stroke="#0D9488" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line green" d="M 1279 342 V 500" style="marker-end:none"/>
<polyline points="1273,488 1279,500 1285,488" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line orange" d="M 1560 342 V 516" style="marker-end:none"/>
<polyline points="1554,504 1560,516 1566,504" fill="none" stroke="#EA580C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="producer-flow">
    <rect class="card producer" x="520" y="862" width="278" height="70" rx="8"/>
    <text class="smallName" x="659" y="894" text-anchor="middle">Sequential send Flow</text>
    <text class="meta" x="659" y="918" text-anchor="middle">cancels pending future</text>
  </g>
  <g id="consumer-flow">
    <rect class="card consumer" x="830" y="862" width="278" height="70" rx="8"/>
    <text class="smallName" x="969" y="894" text-anchor="middle">Infinite receive Flow</text>
    <text class="meta" x="969" y="918" text-anchor="middle">caller owns ack and close</text>
  </g>
  <g id="reader-flow">
    <rect class="card reader" x="1140" y="862" width="278" height="70" rx="8"/>
    <text class="smallName" x="1279" y="894" text-anchor="middle">Reader Flow</text>
    <text class="meta" x="1279" y="918" text-anchor="middle">stops when no message exists</text>
  </g>
  <g id="schema-flow">
    <rect class="card schema" x="1470" y="862" width="180" height="70" rx="8"/>
    <text class="smallName" x="1560" y="894" text-anchor="middle">SchemaInfo</text>
    <text class="meta" x="1560" y="918" text-anchor="middle">JSON type name</text>
  </g>

  <path class="line purple" d="M 659 650 V 854" style="marker-end:none"/>
<polyline points="653,842 659,854 665,842" fill="none" stroke="#9333EA" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line teal" d="M 969 650 V 854" style="marker-end:none"/>
<polyline points="963,842 969,854 975,842" fill="none" stroke="#0D9488" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line green" d="M 1279 650 V 854" style="marker-end:none"/>
<polyline points="1273,842 1279,854 1285,842" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="line orange" d="M 1560 634 V 854" style="marker-end:none"/>
<polyline points="1554,842 1560,854 1566,842" fill="none" stroke="#EA580C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g id="subscription-note">
    <rect class="card note" x="294" y="988" width="1212" height="66" rx="8"/>
    <text class="meta" x="900" y="1016" text-anchor="middle">Reader has no subscription or ack; cumulative ack is valid only for Exclusive or Failover subscriptions.</text>
    <text class="meta" x="900" y="1039" text-anchor="middle">Jackson2 and Jackson3 schemas require explicit runtime implementation dependencies.</text>
  </g>
</svg>
