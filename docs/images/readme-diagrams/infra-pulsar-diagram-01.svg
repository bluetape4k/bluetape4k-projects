  <text class="stereo" x="1078" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="678" text-anchor="middle">ReaderExtensions</text>
  <line x1="898" y1="687" x2="1258" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
