<text class="member" x="1388" y="441">+jacksonSchema~T~(mapper)</text>
</g>
<g>
  <rect x="1417" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1435 857 L1493 857" stroke="#3E9868"/>
  <text class="detail" x="1507" y="862">inheritance / implementation</text>
  <path class="dependency" d="M1435 878 L1493 878" stroke="#758297" stroke-dasharray="8 7"/>
