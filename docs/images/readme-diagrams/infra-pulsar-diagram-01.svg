  <text class="classTitle" x="298" y="445" text-anchor="middle">ProducerSupport</text>
  <line x1="118" y1="454" x2="478" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="486">+PulsarClient.producer(schema,</text>
<text class="member" x="152" y="503">setup)</text>
<text class="member" x="152" y="520">+PulsarClient.withProducer(schema,</text>
</g>
