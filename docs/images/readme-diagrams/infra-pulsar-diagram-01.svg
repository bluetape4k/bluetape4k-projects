  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
    <text class="label" x="170" y="49" text-anchor="middle">PulsarClient</text>
  <text class="mono" x="18" y="108">+pulsarClient(serviceUrl, setup)</text>
<text class="mono" x="18" y="129">+withPulsarClient(serviceUrl, setup,</text>
<text class="mono" x="18" y="150">block)</text>
</g>
<g transform="translate(912,180)">
