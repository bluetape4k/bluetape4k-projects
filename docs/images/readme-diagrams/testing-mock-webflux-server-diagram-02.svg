<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">AdminController</text>
  <text class="mono" x="18" y="108">+reset() ResponseEntity</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="191" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Httpbin Advanced</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Controller</text>
  <text class="mono" x="18" y="124">+delay(seconds) HttpbinResponse</text>
<text class="mono" x="18" y="145">+image(format) ResponseEntity</text>
<text class="mono" x="18" y="166">+gzip() HttpbinResponse</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">HttpbinController</text>
  <text class="mono" x="18" y="108">+get(request) HttpbinResponse</text>
<text class="mono" x="18" y="129">+post(request, body) HttpbinResponse</text>
<text class="mono" x="18" y="150">+headers(request) Map</text>
<text class="mono" x="18" y="171">+ip(request) Map</text>
<text class="mono" x="18" y="192">+status(code) ResponseEntity</text>
<text class="mono" x="18" y="213">+bytes(n) ResponseEntity</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">HttpbinStreamController</text>
  <text class="mono" x="18" y="108">+stream(n) Flow~String~</text>
<text class="mono" x="18" y="129">+sse(n) Flow~ServerSentEvent~</text>
</g>
<g transform="translate(92,544)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">InMemoryRepository</text>

</g>
<g transform="translate(502,544)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«generic»</text>
  <text class="label" x="170" y="61" text-anchor="middle">InMemoryRepositoryT</text>
  <text class="mono" x="18" y="108">+findAll() List~T~</text>
<text class="mono" x="18" y="129">+findById(id) T?</text>
<text class="mono" x="18" y="150">+save(entity) T</text>
<text class="mono" x="18" y="171">+deleteById(id)</text>
</g>
<g transform="translate(912,544)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">JsonplaceholderService</text>
  <text class="mono" x="18" y="108">+reloadFromFixtures()</text>
</g>
<g transform="translate(1322,544)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">MockWebfluxApplication</text>
  <text class="mono" x="18" y="108">+main(args)</text>
</g>
<g transform="translate(297,866)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">PostsController</text>
  <text class="mono" x="18" y="108">+list() List~PostRecord~</text>
<text class="mono" x="18" y="129">+get(id) PostRecord</text>
<text class="mono" x="18" y="150">+create(post) PostRecord</text>
<text class="mono" x="18" y="171">+update(id, post) PostRecord</text>
<text class="mono" x="18" y="192">+delete(id) ResponseEntity</text>
</g>
<g transform="translate(707,866)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">WebContentController</text>
  <text class="mono" x="18" y="108">+getContent(name) ResponseEntity</text>
</g>
<g transform="translate(1117,866)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">WebContentLoader</text>
  <text class="mono" x="18" y="108">+load(name) String</text>
