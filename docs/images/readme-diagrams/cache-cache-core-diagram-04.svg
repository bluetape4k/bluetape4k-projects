  <text class="noteTitle" x="1318" y="1318">Reading rule</text>
  <text class="noteLine" x="1320" y="1362">Hollow triangle = implements</text>
<text class="noteLine" x="1320" y="1394">Dashed arrow = dependency/return type</text>
<text class="noteLine" x="1320" y="1426">04 explains SuspendJCache only; NearJCache details follow</text>
</g>
