<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020" role="img" aria-label="JSON vs JSONB Serialization Flow">
  <defs>
    <filter id="soft-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-orange" viewBox="0 0 10 10" markerWidth="15" markerHeight="15" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" markerWidth="15" markerHeight="15" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg {
        font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif;
      }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#soft-shadow); }
      .title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 44px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono", "Architects Daughter", monospace; font-size: 16px; fill: #475569; }
      .lane { stroke-width: 1.7; }
      .lane-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 27px; fill: #0f172a; }
      .lane-note { font-family: "Comic Mono", monospace; font-size: 14px; fill: #475569; }
      .card { stroke-width: 1.8; filter: url(#soft-shadow); }
      .card-title { font-family: "Architects Daughter", "Comic Mono", sans-serif; font-size: 22px; fill: #0f172a; }
      .card-sub { font-family: "Comic Mono", monospace; font-size: 13.5px; fill: #475569; }
      .tag { font-family: "Comic Mono", monospace; font-size: 12px; font-weight: 700; letter-spacing: 0; }
      .flow-orange { fill: none; stroke: #ea580c; stroke-width: 4.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-orange); }
      .flow-green { fill: none; stroke: #16a34a; stroke-width: 4.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-green); }
      .flow-blue { fill: none; stroke: #2563eb; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-blue); }
      .legend { font-family: "Comic Mono", monospace; font-size: 13px; fill: #475569; }
      .label { font-family: "Comic Mono", monospace; font-size: 12px; fill: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1700" height="1020"/>
  <rect class="frame" x="36" y="30" width="1628" height="960" rx="8"/>

  <text class="title" x="78" y="86">JSON vs JSONB Serialization Flow</text>
  <text class="subtitle" x="82" y="118">FastjsonSerializer chooses JSONB for byte arrays and JSON text for strings; extension APIs expose both paths directly.</text>

  <g id="jsonb-lane">
    <rect class="lane" x="82" y="160" width="1536" height="270" rx="8" fill="#FFEDD5" stroke="#fed7aa" fill-opacity="1"/>
    <text class="lane-title" x="118" y="202">JSONB binary lane</text>
    <text class="lane-note" x="118" y="229">Internal serialization, cache payloads, and RPC-style payloads where speed and compact bytes matter.</text>

    <g transform="translate(120 270)">
      <rect class="card" width="235" height="102" rx="8" fill="#ffffff" stroke="#fb923c"/>
      <text class="card-title" x="117.5" y="36" text-anchor="middle">Kotlin object</text>
      <text class="card-sub" x="117.5" y="64" text-anchor="middle">Any? graph</text>
      <text class="card-sub" x="117.5" y="84" text-anchor="middle">domain value</text>
    </g>
    <g transform="translate(430 270)">
      <rect class="card" width="260" height="102" rx="8" fill="#ffedd5" stroke="#ea580c"/>
      <text class="card-title" x="130" y="34" text-anchor="middle">Serializer entry</text>
      <text class="card-sub" x="130" y="61" text-anchor="middle">serialize()</text>
      <text class="card-sub" x="130" y="82" text-anchor="middle">toJsonBytes()</text>
    </g>
    <g transform="translate(765 270)">
      <rect class="card" width="260" height="102" rx="8" fill="#ffffff" stroke="#fb923c"/>
      <text class="card-title" x="130" y="34" text-anchor="middle">Fastjson2 JSONB</text>
      <text class="card-sub" x="130" y="61" text-anchor="middle">JSONB.toBytes()</text>
      <text class="card-sub" x="130" y="82" text-anchor="middle">JSONB.parseObject()</text>
    </g>
    <g transform="translate(1100 270)">
      <rect class="card" width="230" height="102" rx="8" fill="#ffffff" stroke="#fb923c"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">ByteArray</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">binary JSONB</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">not human readable</text>
    </g>
    <g transform="translate(1400 270)">
      <rect class="card" width="180" height="102" rx="8" fill="#ffffff" stroke="#fb923c"/>
      <text class="card-title" x="90" y="36" text-anchor="middle">Typed T</text>
      <text class="card-sub" x="90" y="64" text-anchor="middle">deserialize()</text>
      <text class="card-sub" x="90" y="84" text-anchor="middle">readBytesOrNull()</text>
    </g>

    <path class="flow-orange" d="M 355 321 L 420 321"/>
    <text class="label" x="387" y="304" text-anchor="middle">object</text>
    <path class="flow-orange" d="M 690 321 L 755 321"/>
    <text class="label" x="722" y="304" text-anchor="middle">encode</text>
    <path class="flow-orange" d="M 1025 321 L 1090 321"/>
    <text class="label" x="1057" y="304" text-anchor="middle">bytes</text>
    <path class="flow-orange" d="M 1330 321 L 1390 321"/>
    <text class="label" x="1360" y="304" text-anchor="middle">decode</text>

    <g transform="translate(1140 188)">
      <rect x="0" y="0" width="410" height="54" rx="8" fill="#fed7aa" stroke="#fb923c" stroke-width="1.5"/>
      <text class="tag" x="18" y="23" fill="#9a3412">InputStream JSONB extension</text>
      <text class="lane-note" x="18" y="43">reads the whole stream before parsing</text>
    </g>
  </g>

  <g id="json-lane">
    <rect class="lane" x="82" y="470" width="1536" height="270" rx="8" fill="#DCFCE7" stroke="#bbf7d0" fill-opacity="1"/>
    <text class="lane-title" x="118" y="512">JSON text lane</text>
    <text class="lane-note" x="118" y="539">API responses, logging, debugging, and readable text payloads.</text>

    <g transform="translate(120 580)">
      <rect class="card" width="235" height="102" rx="8" fill="#ffffff" stroke="#4ade80"/>
      <text class="card-title" x="117.5" y="36" text-anchor="middle">Kotlin object</text>
      <text class="card-sub" x="117.5" y="64" text-anchor="middle">Any? graph</text>
      <text class="card-sub" x="117.5" y="84" text-anchor="middle">domain value</text>
    </g>
    <g transform="translate(430 580)">
      <rect class="card" width="260" height="102" rx="8" fill="#dcfce7" stroke="#16a34a"/>
      <text class="card-title" x="130" y="34" text-anchor="middle">Text entry</text>
      <text class="card-sub" x="130" y="61" text-anchor="middle">serializeAsString()</text>
      <text class="card-sub" x="130" y="82" text-anchor="middle">toJsonString()</text>
    </g>
    <g transform="translate(765 580)">
      <rect class="card" width="260" height="102" rx="8" fill="#ffffff" stroke="#4ade80"/>
      <text class="card-title" x="130" y="34" text-anchor="middle">Fastjson2 JSON</text>
      <text class="card-sub" x="130" y="61" text-anchor="middle">JSON.toJSONString()</text>
      <text class="card-sub" x="130" y="82" text-anchor="middle">JSON.parseObject()</text>
    </g>
    <g transform="translate(1100 580)">
      <rect class="card" width="230" height="102" rx="8" fill="#ffffff" stroke="#4ade80"/>
      <text class="card-title" x="115" y="36" text-anchor="middle">String or stream</text>
      <text class="card-sub" x="115" y="64" text-anchor="middle">readValueOrNull()</text>
      <text class="card-sub" x="115" y="84" text-anchor="middle">readAsJSONObject()</text>
    </g>
    <g transform="translate(1400 580)">
      <rect class="card" width="180" height="102" rx="8" fill="#ffffff" stroke="#4ade80"/>
      <text class="card-title" x="90" y="36" text-anchor="middle">Typed data</text>
      <text class="card-sub" x="90" y="64" text-anchor="middle">T / List&lt;T&gt;</text>
      <text class="card-sub" x="90" y="84" text-anchor="middle">JSONObject / JSONArray</text>
    </g>

    <path class="flow-green" d="M 355 631 L 420 631"/>
    <text class="label" x="387" y="614" text-anchor="middle">object</text>
    <path class="flow-green" d="M 690 631 L 755 631"/>
    <text class="label" x="722" y="614" text-anchor="middle">encode</text>
    <path class="flow-green" d="M 1025 631 L 1090 631"/>
    <text class="label" x="1057" y="614" text-anchor="middle">text</text>
    <path class="flow-green" d="M 1330 631 L 1390 631"/>
    <text class="label" x="1360" y="614" text-anchor="middle">parse</text>

    <path class="flow-blue" d="M 1215 580 L 1215 562 Q 1215 550 1227 550 L 1454 550 Q 1464 550 1464 560 L 1464 570"/>
    <text class="label" x="1340" y="536" text-anchor="middle">array/object helpers</text>
  </g>

  <g id="contracts">
    <rect class="lane" x="82" y="790" width="1536" height="150" rx="8" fill="#E5E7EB" stroke="#cbd5e1" fill-opacity="1"/>
    <text class="lane-title" x="118" y="833">Reader contract</text>

    <g transform="translate(118 858)">
      <rect class="card" width="410" height="58" rx="8" fill="#fff7ed" stroke="#fb923c"/>
      <text class="card-title" x="20" y="25">Use JSONB</text>
      <text class="card-sub" x="20" y="45">internal cache/RPC payloads; fast + small</text>
    </g>
    <g transform="translate(552 858)">
      <rect class="card" width="415" height="58" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
      <text class="card-title" x="20" y="25">Use JSON</text>
      <text class="card-sub" x="20" y="45">readable strings for APIs, logs, debugging</text>
    </g>
    <g transform="translate(1006 858)">
      <rect class="card" width="570" height="58" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
      <text class="card-title" x="20" y="25">FastjsonSerializer wraps failures</text>
      <text class="card-sub" x="20" y="45">null maps to empty/null; invalid payload throws JsonSerializationException</text>
    </g>
  </g>

  <g transform="translate(112 956)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#ea580c" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <text class="legend" x="48" y="5">JSONB bytes</text>
    <line x1="180" y1="0" x2="214" y2="0" stroke="#16a34a" stroke-width="4.8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
    <text class="legend" x="228" y="5">JSON text</text>
    <line x1="354" y1="0" x2="388" y2="0" stroke="#2563eb" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text class="legend" x="402" y="5">helper branch</text>
  </g>
</svg>
