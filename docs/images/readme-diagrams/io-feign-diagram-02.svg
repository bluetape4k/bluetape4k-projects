<path class="line" d="M672 172 C672 228 1492 228 1492 284"/>
<path class="line" d="M672 428 C672 457 877 457 877 486"/>
<path class="line" d="M672 172 C672 228 262 228 262 284"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">AsyncClient</text>

</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">CoroutineBuilder</text>
  <text class="mono" x="18" y="108">+client(asyncClient) CoroutineBuilder</text>
<text class="mono" x="18" y="132">+encoder(encoder) CoroutineBuilder</text>
<text class="mono" x="18" y="156">+decoder(decoder) CoroutineBuilder</text>
<text class="mono" x="18" y="180">+options(options) CoroutineBuilder</text>
<text class="mono" x="18" y="204">+logLevel(level) CoroutineBuilder</text>
<text class="mono" x="18" y="228">+target(type, url) T</text>
</g>
