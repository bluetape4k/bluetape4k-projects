<text class="mono" x="18" y="129">+decode(response, type) Any?</text>
</g>
<g transform="translate(1322,806)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
