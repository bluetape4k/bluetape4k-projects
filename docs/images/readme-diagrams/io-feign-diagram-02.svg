<path class="line" d="M672 172 C672 236 1492 236 1492 300"/>
<path class="line" d="M672 426 C672 481 877 481 877 536"/>
<path class="line" d="M672 172 C672 236 262 236 262 300"/>
<g transform="translate(92,180)">
