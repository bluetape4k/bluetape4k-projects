<text class="mono" x="18" y="129">+encoder(encoder) CoroutineBuilder</text>
<text class="mono" x="18" y="150">+decoder(decoder) CoroutineBuilder</text>
<text class="mono" x="18" y="171">+options(options) CoroutineBuilder</text>
<text class="mono" x="18" y="192">+logLevel(level) CoroutineBuilder</text>
<text class="mono" x="18" y="213">+target(type, url) T</text>
</g>
