</g>
<g>
  <rect x="1331" y="1009" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1349 1027 L1407 1027" stroke="#3E9868"/>
