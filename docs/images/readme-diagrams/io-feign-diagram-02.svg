  <text class="stereo" x="1458" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1458" y="445" text-anchor="middle">AsyncClient</text>
  <line x1="1288" y1="454" x2="1628" y2="454" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="CoroutineFeign">
