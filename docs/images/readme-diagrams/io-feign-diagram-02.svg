  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">FeignFastjsonDecoder</text>
  <text class="mono" x="18" y="108">+decode(response, type) Any?</text>
