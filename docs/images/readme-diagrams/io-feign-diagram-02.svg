<svg xmlns="http://www.w3.org/2000/svg" width="1766" height="1137" viewBox="0 0 1766 1137" role="img" aria-label="Class Hierarchy: Feign + Coroutines">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1766" height="1137"/>
<rect class="frame" x="32" y="28" width="1702" height="1081" rx="30"/>
<text class="title" x="68" y="84">Class Hierarchy: Feign + Coroutines</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="FeignFastjsonDecoder" data-to="Decoder" data-route-color="green" d="M1330 631 L1330 584 L1216 584 L1216 536" stroke="#3E9868"/>
<path class="inherit" data-from="FeignFastjsonEncoder" data-to="Encoder" data-route-color="blue" d="M430 631 L430 504 L508 504" stroke="#4F83BF"/>
<path class="inherit" data-from="JacksonDecoder2" data-to="Decoder" data-route-color="teal" d="M1078 631 L1078 536" stroke="#2E8F89"/>
<path class="inherit" data-from="JacksonEncoder2" data-to="Encoder" data-route-color="amber" d="M688 631 L688 536" stroke="#B9851B"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="Decoder" data-route-color="olive" d="M1078 303 L1078 398" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="Encoder" data-route-color="indigo" d="M898 271 L820 271 L820 398" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="AsyncClient" data-route-color="coral" d="M1258 271 L1336 271 L1336 398" stroke="#C8644B" stroke-dasharray="8 7"/>
<g id="Encoder">
  <rect class="classCard" x="508" y="398" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">Encoder</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="CoroutineBuilder">
  <rect class="classCard" x="898" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1078" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="212" text-anchor="middle">CoroutineBuilder</text>
  <line x1="898" y1="221" x2="1258" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="932" y="258">+client(asyncClient)</text>
<text class="member" x="932" y="275">+encoder(encoder) CoroutineBuilder</text>
</g>
<g id="Decoder">
  <rect class="classCard" x="898" y="398" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1078" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="445" text-anchor="middle">Decoder</text>
  <line x1="898" y1="454" x2="1258" y2="454" stroke="#45A7A1" stroke-width="1.4"/>

</g>
<g id="AsyncClient">
  <rect class="classCard" x="1288" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1468" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1468" y="445" text-anchor="middle">AsyncClient</text>
  <line x1="1288" y1="454" x2="1648" y2="454" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="CoroutineFeign">
  <rect class="classCard" x="118" y="829" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="298" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="876" text-anchor="middle">CoroutineFeign</text>
  <line x1="118" y1="885" x2="478" y2="885" stroke="#DC6B82" stroke-width="1.4"/>

</g>
<g id="JacksonDecoder2">
  <rect class="classCard" x="898" y="631" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1078" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="678" text-anchor="middle">JacksonDecoder2</text>
  <line x1="898" y1="687" x2="1258" y2="687" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="932" y="724">-mapper: JsonMapper</text>
<text class="member" x="932" y="741">+decode(response, type) Any?</text>
</g>
<g id="FeignFastjsonDecoder">
  <rect class="classCard" x="1288" y="631" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1468" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1468" y="678" text-anchor="middle">FeignFastjsonDecoder</text>
  <line x1="1288" y1="687" x2="1648" y2="687" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1322" y="732">+decode(response, type) Any?</text>
</g>
<g id="FeignFastjsonEncoder">
  <rect class="classCard" x="118" y="631" width="360" height="138" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="298" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="678" text-anchor="middle">FeignFastjsonEncoder</text>
  <line x1="118" y1="687" x2="478" y2="687" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="152" y="724">+encode(object, bodyType,</text>
<text class="member" x="152" y="741">template)</text>
</g>
<g id="JacksonEncoder2">
  <rect class="classCard" x="508" y="631" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="688" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="678" text-anchor="middle">JacksonEncoder2</text>
  <line x1="508" y1="687" x2="868" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="542" y="719">-mapper: JsonMapper</text>
<text class="member" x="542" y="736">+encode(object, bodyType,</text>
<text class="member" x="542" y="753">template)</text>
</g>
<g>
  <rect x="1351" y="1029" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1369 1047 L1427 1047" stroke="#3E9868"/>
  <text class="detail" x="1441" y="1052">inheritance / implementation</text>
  <path class="dependency" d="M1369 1068 L1427 1068" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1441" y="1073">dependency / usage</text>
</g>
<g><rect x="180" y="1047" width="1126" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="743" y="1073" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
