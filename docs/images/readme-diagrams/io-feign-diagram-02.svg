  <text class="classTitle" x="678" y="445" text-anchor="middle">Encoder</text>
  <line x1="508" y1="454" x2="848" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="CoroutineBuilder">
  <rect class="classCard" x="898" y="165" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1068" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="212" text-anchor="middle">CoroutineBuilder</text>
  <line x1="898" y1="221" x2="1238" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="916" y="255">+client(asyncClient)</text>
<text class="member" x="916" y="272">+encoder(encoder) CoroutineBuilder</text>
</g>
