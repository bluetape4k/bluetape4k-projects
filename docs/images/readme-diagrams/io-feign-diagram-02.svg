<svg xmlns="http://www.w3.org/2000/svg" width="1746" height="1117" viewBox="0 0 1746 1117" role="img" aria-label="Class Hierarchy: Feign + Coroutines">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1746" height="1117"/>
<rect class="frame" x="32" y="28" width="1682" height="1061" rx="30"/>
<text class="title" x="68" y="84">Class Hierarchy: Feign + Coroutines</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="FeignFastjsonDecoder" data-to="Decoder" data-route-color="green" d="M1288 661 L1263 661 L1263 500 L1238 500" stroke="#3E9868"/>
<path class="inherit" data-from="FeignFastjsonEncoder" data-to="Encoder" data-route-color="blue" d="M458 661 L483 661 L483 500 L508 500" stroke="#4F83BF"/>
<path class="inherit" data-from="JacksonDecoder2" data-to="Decoder" data-route-color="teal" d="M1068 631 L1068 530" stroke="#2E8F89"/>
<path class="inherit" data-from="JacksonEncoder2" data-to="Encoder" data-route-color="amber" d="M678 631 L678 530" stroke="#B9851B"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="Decoder" data-route-color="olive" d="M1068 297 L1068 398" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="Encoder" data-route-color="indigo" d="M898 267 L873 267 L873 428 L848 428" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="CoroutineBuilder" data-to="AsyncClient" data-route-color="coral" d="M1238 267 L1263 267 L1263 428 L1288 428" stroke="#C8644B" stroke-dasharray="8 7"/>
<g id="Encoder">
  <rect class="classCard" x="508" y="398" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
