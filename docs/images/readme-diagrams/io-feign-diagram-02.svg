  <text class="stereo" x="288" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="678" text-anchor="middle">FeignFastjsonEncoder</text>
  <line x1="118" y1="687" x2="458" y2="687" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="136" y="721">+encode(object, bodyType,</text>
<text class="member" x="136" y="738">template)</text>
