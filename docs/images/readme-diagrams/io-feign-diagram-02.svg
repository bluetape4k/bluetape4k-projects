  <line x1="898" y1="687" x2="1238" y2="687" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="916" y="721">-mapper: JsonMapper</text>
<text class="member" x="916" y="738">+decode(response, type) Any?</text>
