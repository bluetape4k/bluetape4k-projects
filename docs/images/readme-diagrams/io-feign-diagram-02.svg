  <text class="label" x="170" y="57" text-anchor="middle">Decoder</text>

</g>
<g transform="translate(707,494)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">Encoder</text>

</g>
