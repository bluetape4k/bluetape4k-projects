<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="680" viewBox="0 0 1366 680" role="img" aria-label="Core API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1366" height="680"/>
<rect class="frame" x="32" y="28" width="1302" height="624" rx="28"/>
<text class="title" x="66" y="82">Core API Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="146" width="416" height="348" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="174">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="146" width="836" height="348" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="174">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="146" width="1256" height="348" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="174">Adapter layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M683 460 L683 132 L1103 132 L1103 180"/>
<path class="line" d="M263 460 L263 142 L683 142 L683 180"/>
<g transform="translate(88,180)">
  <rect class="card" x="0" y="0" width="350" height="280" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="175" y="49" text-anchor="middle">DataSourceExtensions</text>
  <text class="mono" x="18" y="108">+DataSource.withConnect(block): T</text>
<text class="mono" x="18" y="129">+DataSource.withStatement(block): T</text>
<text class="mono" x="18" y="150">+DataSource.withTransaction(block): T</text>
<text class="mono" x="18" y="171">+DataSource.withReadOnlyTransaction(block):</text>
<text class="mono" x="18" y="192">T</text>
<text class="mono" x="18" y="213">+DataSource.runQuery(sql, block): T</text>
<text class="mono" x="18" y="234">+DataSource.executeBatch(sql, params):</text>
<text class="mono" x="18" y="255">IntArray</text>
</g>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="280" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
    <text class="label" x="175" y="49" text-anchor="middle">ConnectionExtensions</text>
  <text class="mono" x="18" y="108">+Connection.withStatement(block): T</text>
<text class="mono" x="18" y="129">+Connection.withTransaction(block): T</text>
<text class="mono" x="18" y="150">+Connection.withAutoCommit(flag, block): T</text>
<text class="mono" x="18" y="171">+Connection.withReadOnly(block): T</text>
<text class="mono" x="18" y="192">+Connection.withIsolationLevel(level,</text>
<text class="mono" x="18" y="213">block): T</text>
<text class="mono" x="18" y="234">+Connection.executeQuery(sql, params,</text>
<text class="mono" x="18" y="255">block): T</text>
</g>
<g transform="translate(928,180)">
  <rect class="card" x="0" y="0" width="350" height="280" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
    <text class="label" x="175" y="49" text-anchor="middle">ResultSetExtensions</text>
  <text class="mono" x="18" y="108">+ResultSet.toList(mapper): List~T~</text>
<text class="mono" x="18" y="129">+ResultSet.toSet(mapper): Set~T~</text>
<text class="mono" x="18" y="150">+ResultSet.toMap(keyMapper, valueMapper):</text>
<text class="mono" x="18" y="171">Map~K,V~</text>
<text class="mono" x="18" y="192">+ResultSet.groupBy(keyMapper, valueMapper):</text>
<text class="mono" x="18" y="213">Map~K,List~V~~</text>
<text class="mono" x="18" y="234">+ResultSet.mapFirst(mapper): T?</text>
<text class="mono" x="18" y="255">+ResultSet.mapSingle(mapper): T</text>
</g>
</svg>
