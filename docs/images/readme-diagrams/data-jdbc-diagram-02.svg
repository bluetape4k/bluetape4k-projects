<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="bluetape4k JDBC core API structure">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 7 L 1 13 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .node { filter: url(#softShadow); stroke-width: 1.8; }
      .nodeTitle { font-family: "Architects Daughter"; font-size: 25px; fill: #0f172a; }
      .nodeSub { font-family: "Comic Mono"; font-size: 12.5px; fill: #64748b; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .detail { font-family: "Comic Mono"; font-size: 12.5px; fill: #334155; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .support { fill: none; stroke: #16a34a; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1000"/>
  <rect class="frame" x="34" y="30" width="1432" height="940" rx="10"/>
  <text class="title" x="72" y="86">bluetape4k-jdbc Core API Structure</text>
  <text class="subtitle" x="76" y="118">Kotlin extensions are grouped by JDBC receiver: DataSource, Connection, PreparedStatement, and ResultSet</text>

  <rect class="lane" x="82" y="160" width="1336" height="220" rx="10"/>
  <text class="laneTitle" x="112" y="200">JDBC object path wrapped by the extension APIs</text>

  <g id="ds">
    <rect class="node" x="108" y="236" width="292" height="92" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="nodeTitle" x="254" y="274" text-anchor="middle">DataSource</text>
    <text class="nodeSub" x="254" y="304" text-anchor="middle">connection provider</text>
  </g>
  <g id="conn">
    <rect class="node" x="434" y="236" width="292" height="92" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="nodeTitle" x="580" y="274" text-anchor="middle">Connection</text>
    <text class="nodeSub" x="580" y="304" text-anchor="middle">statement + transaction scope</text>
  </g>
  <g id="stmt">
    <rect class="node" x="760" y="236" width="292" height="92" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="nodeTitle" x="906" y="270" text-anchor="middle">PreparedStatement</text>
    <text class="nodeSub" x="906" y="302" text-anchor="middle">parameter binding + batch</text>
  </g>
  <g id="rs">
    <rect class="node" x="1086" y="236" width="292" height="92" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="nodeTitle" x="1232" y="274" text-anchor="middle">ResultSet</text>
    <text class="nodeSub" x="1232" y="304" text-anchor="middle">typed reads + row mapping</text>
  </g>

  <path class="flow" d="M 400 282 L 434 282"/>
  <path class="flow" d="M 726 282 L 760 282"/>
  <path class="flow" d="M 1052 282 L 1086 282"/>

  <rect class="lane" x="82" y="414" width="1336" height="392" rx="10"/>
  <text class="laneTitle" x="112" y="454">Extension groups by receiver</text>

  <g id="dsApi">
    <rect class="node" x="108" y="492" width="292" height="228" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="254" y="528" text-anchor="middle">DataSource extensions</text>
    <line x1="108" y1="548" x2="400" y2="548" stroke="#bfdbfe" stroke-width="1.2"/>
    <text class="detail" x="132" y="580">withConnect { Connection }</text>
    <text class="detail" x="132" y="608">withStatement { Statement }</text>
    <text class="detail" x="132" y="636">runQuery(sql) { ResultSet }</text>
    <text class="detail" x="132" y="664">executeUpdate / executeInsert</text>
    <text class="detail" x="132" y="692">executeBatch(sql...)</text>
  </g>

  <g id="connApi">
    <rect class="node" x="434" y="492" width="292" height="228" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="580" y="528" text-anchor="middle">Connection extensions</text>
    <line x1="434" y1="548" x2="726" y2="548" stroke="#bbf7d0" stroke-width="1.2"/>
    <text class="detail" x="458" y="580">withStatement { Statement }</text>
    <text class="detail" x="458" y="608">runQuery(sql) { ResultSet }</text>
    <text class="detail" x="458" y="636">executeUpdate / generated keys</text>
    <text class="detail" x="458" y="664">preparedStatement(...) DSL</text>
    <text class="detail" x="458" y="692">batch and large batch helpers</text>
  </g>

  <g id="psApi">
    <rect class="node" x="760" y="492" width="292" height="228" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="906" y="528" text-anchor="middle">Prepared APIs</text>
    <line x1="760" y1="548" x2="1052" y2="548" stroke="#fed7aa" stroke-width="1.2"/>
    <text class="detail" x="784" y="580">executeQuery(sql, params)</text>
    <text class="detail" x="784" y="608">executeUpdate(sql, params)</text>
    <text class="detail" x="784" y="636">executeUpdateWithGeneratedKeys</text>
    <text class="detail" x="784" y="664">arguments { string[1] = ... }</text>
    <text class="detail" x="784" y="692">ArgumentSetter wrappers</text>
  </g>

  <g id="rsApi">
    <rect class="node" x="1086" y="492" width="292" height="228" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="cardTitle" x="1232" y="528" text-anchor="middle">ResultSet APIs</text>
    <line x1="1086" y1="548" x2="1378" y2="548" stroke="#e9d5ff" stroke-width="1.2"/>
    <text class="detail" x="1110" y="580">getXxxOrNull(label/index)</text>
    <text class="detail" x="1110" y="608">mapFirst / mapSingle</text>
    <text class="detail" x="1110" y="636">toList / toSet / toMap</text>
    <text class="detail" x="1110" y="664">sequence / forEach / filterMap</text>
    <text class="detail" x="1110" y="692">singleInt / metadata helpers</text>
  </g>

  <rect class="lane" x="82" y="836" width="1336" height="86" rx="10"/>
  <g id="contracts">
    <text class="laneTitle" x="112" y="880">Behavior contracts</text>
    <text class="small" x="342" y="858">Resource scope: Connection, Statement, PreparedStatement, and ResultSet are closed with use {}</text>
    <text class="small" x="342" y="886">Transaction scope: commit on success, rollback on failure, then restore autoCommit/isolation/readOnly</text>
    <text class="small" x="342" y="914">Type-safe DSLs: setter/getter tokens wrap JDBC label/index overloads without hiding driver exceptions</text>
  </g>

  <path class="support" d="M 254 492 L 254 328"/>
  <path class="support" d="M 580 492 L 580 328"/>
  <path class="support" d="M 906 492 L 906 328"/>
  <path class="support" d="M 1232 492 L 1232 328"/>
</svg>
