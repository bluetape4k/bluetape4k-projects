<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="947" viewBox="0 0 1220 947" role="img" aria-label="Core API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1220" height="947"/>
<rect class="frame" x="32" y="28" width="1156" height="891" rx="30"/>
<text class="title" x="68" y="84">Core API Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="ConnectionExtensions" data-to="ResultSetExtensions" data-route-color="teal" d="M575 544 L575 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DataSourceExtensions" data-to="ConnectionExtensions" data-route-color="amber" d="M575 311 L575 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<g id="DataSourceExtensions">
  <rect class="classCard" x="375" y="165" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="555" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="555" y="212" text-anchor="middle">DataSourceExtensions</text>
  <line x1="375" y1="221" x2="735" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="409" y="253">+DataSource.withConnect(block): T</text>
<text class="member" x="409" y="270">+DataSource.withStatement(block): T</text>
<text class="member" x="409" y="287">+DataSource.withTransaction(block): T</text>
</g>
<g id="ConnectionExtensions">
  <rect class="classCard" x="375" y="398" width="400" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="575" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="575" y="445" text-anchor="middle">ConnectionExtensions</text>
  <line x1="375" y1="454" x2="775" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="409" y="486">+Connection.withStatement(block): T</text>
<text class="member" x="409" y="503">+Connection.withTransaction(block): T</text>
<text class="member" x="409" y="520">+Connection.withAutoCommit(flag, block): T</text>
</g>
<g id="ResultSetExtensions">
  <rect class="classCard" x="375" y="631" width="400" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="575" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="610" y="678" text-anchor="middle">ResultSetExtensions</text>
  <line x1="410" y1="687" x2="810" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="444" y="719">+ResultSet.toList(mapper): List~T~</text>
<text class="member" x="444" y="736">+ResultSet.toSet(mapper): Set~T~</text>
<text class="member" x="444" y="753">+ResultSet.toMap(keyMapper, valueMapper):</text>
</g>
<g>
  <rect x="805" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M823 857 L881 857" stroke="#3E9868"/>
  <text class="detail" x="895" y="862">inheritance / implementation</text>
  <path class="dependency" d="M823 878 L881 878" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="895" y="883">dependency / usage</text>
</g>
<g><rect x="180" y="857" width="580" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="470" y="883" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
