<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-okio Sink and Source adapter hierarchy</title>
  <desc id="desc">Source-backed class structure showing Okio primitives, stream adapters, and ForwardingSource or ForwardingSink decorators in bluetape4k-okio.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small, .label { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; fill: #566b73; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .core-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .source-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .sink-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .contract-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .core { fill: #ffffff; stroke: #4f6c77; stroke-width: 2; }
      .source-card { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-card { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .codec-card { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .security-card { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .base-card { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .flowSlate { fill: none; stroke: #455a64; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowRed { fill: none; stroke: #b65f68; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
      .flowPurple { fill: none; stroke: #8870a8; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .flowBlue { fill: none; stroke: #4b74a5; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .source-icon { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-icon { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .icon-line-green { fill: none; stroke: #5d7b63; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-line-gold { fill: none; stroke: #a2743d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowSlate" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#8870a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1032" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-okio Sink / Source Adapter Hierarchy</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">The module keeps Okio as the runtime model and adds small adapters or decorators around Source and Sink.</text>

  <rect x="72" y="150" width="1656" height="194" rx="16" class="core-panel"/>
  <text x="102" y="190" class="panel-title">Okio runtime surface</text>
  <text x="102" y="218" class="small">Buffer and ByteString are value/work buffers; Source and Sink are the contracts that decorators preserve.</text>

  <rect x="160" y="244" width="330" height="72" rx="7" class="core" filter="url(#softShadow)"/>
  <text x="325" y="274" text-anchor="middle" class="class-title">BufferedSource</text>
  <text x="325" y="302" text-anchor="middle" class="member">Source.buffered()</text>

  <rect x="560" y="244" width="330" height="72" rx="7" class="core" filter="url(#softShadow)"/>
  <text x="725" y="274" text-anchor="middle" class="class-title">Buffer / ByteString</text>
  <text x="725" y="302" text-anchor="middle" class="member">factories and immutable boundary</text>

  <rect x="960" y="244" width="330" height="72" rx="7" class="core" filter="url(#softShadow)"/>
  <text x="1125" y="274" text-anchor="middle" class="class-title">BufferedSink</text>
  <text x="1125" y="302" text-anchor="middle" class="member">Sink.buffered()</text>

  <rect x="1360" y="244" width="300" height="72" rx="7" class="core" filter="url(#softShadow)"/>
  <text x="1510" y="274" text-anchor="middle" class="class-title">Timeout</text>
  <text x="1510" y="302" text-anchor="middle" class="member">propagated by adapters</text>

  <rect x="72" y="386" width="806" height="486" rx="16" class="source-panel"/>
  <g transform="translate(828 404)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="source-icon"/>
    <path d="M -9 -5 H 4 M 4 -5 L -1 -10 M 4 -5 L -1 0" class="icon-line-green"/>
    <path d="M -10 8 H 10" class="icon-line-green"/>
  </g>
  <text x="102" y="426" class="panel-title">Source side: read and decode</text>
  <text x="102" y="454" class="small">Sources pull bytes from delegates, decode lazily, and return plain bytes to caller buffers.</text>

  <rect x="120" y="498" width="330" height="116" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="285" y="530" text-anchor="middle" class="class-title">InputStreamSource</text>
  <line x1="120" y1="550" x2="450" y2="550" class="sep"/>
  <text x="148" y="576" class="member">implements Okio Source</text>
  <text x="148" y="598" class="member">reads into Buffer.UnsafeCursor</text>

  <rect x="500" y="498" width="330" height="116" rx="7" class="base-card" filter="url(#softShadow)"/>
  <text x="665" y="530" text-anchor="middle" class="class-title">ForwardingSource</text>
  <line x1="500" y1="550" x2="830" y2="550" class="sep"/>
  <text x="528" y="576" class="member">decorator base</text>
  <text x="528" y="598" class="member">delegate Source stays visible</text>

  <rect x="120" y="674" width="330" height="128" rx="7" class="codec-card" filter="url(#softShadow)"/>
  <text x="285" y="706" text-anchor="middle" class="class-title">Compression sources</text>
  <line x1="120" y1="726" x2="450" y2="726" class="sep"/>
  <text x="148" y="752" class="member">DecompressableSource</text>
  <text x="148" y="774" class="member">StreamingDecompressSource</text>

  <rect x="500" y="674" width="330" height="128" rx="7" class="security-card" filter="url(#softShadow)"/>
  <text x="665" y="706" text-anchor="middle" class="class-title">Decode and decrypt sources</text>
  <line x1="500" y1="726" x2="830" y2="726" class="sep"/>
  <text x="528" y="752" class="member">AbstractBase64Source variants</text>
  <text x="528" y="774" class="member">Tink and DAEAD chunk decrypt</text>

  <rect x="922" y="386" width="806" height="486" rx="16" class="sink-panel"/>
  <g transform="translate(1678 404)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="sink-icon"/>
    <path d="M -4 5 H 9 M 9 5 L 4 0 M 9 5 L 4 10" class="icon-line-gold"/>
    <path d="M -10 -8 H 10" class="icon-line-gold"/>
  </g>
  <text x="952" y="426" class="panel-title">Sink side: write and encode</text>
  <text x="952" y="454" class="small">Sinks consume caller buffers, transform bytes, then write to a delegate sink or output stream.</text>

  <rect x="970" y="498" width="330" height="116" rx="7" class="sink-card" filter="url(#softShadow)"/>
  <text x="1135" y="530" text-anchor="middle" class="class-title">OutputStreamSink</text>
  <line x1="970" y1="550" x2="1300" y2="550" class="sep"/>
  <text x="998" y="576" class="member">implements Okio Sink</text>
  <text x="998" y="598" class="member">writes from Buffer.UnsafeCursor</text>

  <rect x="1350" y="498" width="330" height="116" rx="7" class="base-card" filter="url(#softShadow)"/>
  <text x="1515" y="530" text-anchor="middle" class="class-title">ForwardingSink</text>
  <line x1="1350" y1="550" x2="1680" y2="550" class="sep"/>
  <text x="1378" y="576" class="member">decorator base</text>
  <text x="1378" y="598" class="member">delegate Sink stays visible</text>

  <rect x="970" y="674" width="330" height="128" rx="7" class="codec-card" filter="url(#softShadow)"/>
  <text x="1135" y="706" text-anchor="middle" class="class-title">Compression sinks</text>
  <line x1="970" y1="726" x2="1300" y2="726" class="sep"/>
  <text x="998" y="752" class="member">CompressableSink buffers until close</text>
  <text x="998" y="774" class="member">StreamingCompressSink writes chunks</text>

  <rect x="1350" y="674" width="330" height="128" rx="7" class="security-card" filter="url(#softShadow)"/>
  <text x="1515" y="706" text-anchor="middle" class="class-title">Encode and encrypt sinks</text>
  <line x1="1350" y1="726" x2="1680" y2="726" class="sep"/>
  <text x="1378" y="752" class="member">AbstractBase64Sink variants</text>
  <text x="1378" y="774" class="member">Tink and DAEAD chunk encrypt</text>

  <rect x="98" y="910" width="1604" height="92" rx="14" class="contract-panel"/>
  <text x="128" y="944" class="panel-title">Adapter contract</text>
  <text x="128" y="974" class="small">Use Buffer for local work, ByteString for immutable bytes, close transforming sinks to finalize frames, and prefer streaming or DAEAD chunk adapters for large multi-write payloads.</text>

  <path d="M 325 316 V 386" class="flowGreen"/>
  <path d="M 1125 316 V 386" class="flowGold"/>
  <path d="M 285 614 V 644 H 665 V 674" class="bus"/>
  <path d="M 665 614 V 674" class="flowBlue"/>
  <path d="M 285 644 V 674" class="flowRed"/>
  <path d="M 1135 614 V 644 H 1515 V 674" class="bus"/>
  <path d="M 1515 614 V 674" class="flowBlue"/>
  <path d="M 1135 644 V 674" class="flowRed"/>
  <path d="M 725 316 L 725 342 Q 725 356 739 356 L 886 356 Q 900 356 900 370 L 900 888" class="flowSlate"/>
  <path d="M 900 888 V 910" class="flowSlate"/>
</svg>
