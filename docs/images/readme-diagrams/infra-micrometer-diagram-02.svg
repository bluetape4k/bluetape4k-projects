<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="Metric Collection Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inheritArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A;paint-order:stroke;stroke:#F7FBFF;stroke-width:5px;stroke-linejoin:round}
    .card,.classCard{filter:url(#shadow);stroke-width:2}.cardTitle,.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:13px;fill:#102033}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .note{stroke-width:1.6}.flow{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="1080"/>
<rect class="frame" x="32" y="28" width="1536" height="1024" rx="30"/>
<text class="title" x="68" y="84">Metric Collection Flow</text>
<text class="subtitle" x="72" y="116">Application operations enter helper families, then record into Micrometer registry or Observation context.</text>
<g id="appLayer"><rect class="panel" x="72" y="165" width="300" height="740" rx="20"/><text class="panelTitle" x="100" y="201">Application operation</text></g>
<g id="helperLayer"><rect class="panel" x="430" y="165" width="390" height="740" rx="20"/><text class="panelTitle" x="458" y="201">bluetape4k helper</text></g>
<g id="registryLayer"><rect class="panel" x="880" y="165" width="300" height="740" rx="20"/><text class="panelTitle" x="908" y="201">Micrometer API</text></g>
<g id="backendLayer"><rect class="panel" x="1235" y="165" width="290" height="740" rx="20"/><text class="panelTitle" x="1263" y="201">Recorded signal</text></g>
<path class="flow" data-from="suspendFlow" data-to="timerHelper" d="M340 313 L470 313" stroke="#4F83BF"/>
<path class="flow" data-from="clientWork" data-to="binderHelper" d="M340 503 L470 503" stroke="#B9851B"/>
<path class="flow" data-from="eventWork" data-to="observationHelper" d="M340 693 L470 693" stroke="#3E9868"/>
<path class="flow" data-from="timerHelper" data-to="meterRegistry" d="M780 346 L915 346" stroke="#4F83BF"/>
<path class="flow" data-from="binderHelper" data-to="meterRegistry" d="M780 488 L850 488 L850 374 L915 374" stroke="#B9851B"/>
<path class="flow" data-from="observationHelper" data-to="observationRegistry" d="M780 693 L915 693" stroke="#3E9868"/>
<path class="flow" data-from="meterRegistry" data-to="timerSignal" d="M1145 346 L1270 346" stroke="#4F83BF"/>
<path class="flow" data-from="observationRegistry" data-to="eventSignal" d="M1145 693 L1270 693" stroke="#3E9868"/>
<g id="suspendFlow">
  <rect class="card" x="105" y="265" width="235" height="96" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="222.5" y="301" text-anchor="middle" dominant-baseline="middle">Suspend or Flow work</text>
  <text class="detail" x="222.5" y="330" text-anchor="middle" dominant-baseline="middle">business block</text>
<text class="detail" x="222.5" y="348" text-anchor="middle" dominant-baseline="middle">Flow collection</text>
</g>
<g id="clientWork">
  <rect class="card" x="105" y="455" width="235" height="96" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="222.5" y="491" text-anchor="middle" dominant-baseline="middle">HTTP or cache work</text>
  <text class="detail" x="222.5" y="520" text-anchor="middle" dominant-baseline="middle">Retrofit Call</text>
<text class="detail" x="222.5" y="538" text-anchor="middle" dominant-baseline="middle">Cache2k operation</text>
</g>
<g id="eventWork">
  <rect class="card" x="105" y="645" width="235" height="96" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="222.5" y="681" text-anchor="middle" dominant-baseline="middle">Event publish/consume</text>
  <text class="detail" x="222.5" y="710" text-anchor="middle" dominant-baseline="middle">operation + destination</text>
<text class="detail" x="222.5" y="728" text-anchor="middle" dominant-baseline="middle">correlation metadata</text>
</g>
<g id="timerHelper">
  <rect class="card" x="470" y="250" width="310" height="116" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="625" y="296" text-anchor="middle" dominant-baseline="middle">Timer extensions</text>
  <text class="detail" x="625" y="325" text-anchor="middle" dominant-baseline="middle">recordSuspend</text>
<text class="detail" x="625" y="343" text-anchor="middle" dominant-baseline="middle">Flow.withTimer</text>
</g>
<g id="binderHelper">
  <rect class="card" x="470" y="430" width="310" height="116" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="625" y="476" text-anchor="middle" dominant-baseline="middle">Instrumentation binders</text>
  <text class="detail" x="625" y="505" text-anchor="middle" dominant-baseline="middle">MeasuredCallAdapter</text>
<text class="detail" x="625" y="523" text-anchor="middle" dominant-baseline="middle">Cache2kCacheMetrics</text>
</g>
<g id="observationHelper">
  <rect class="card" x="470" y="625" width="310" height="136" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="625" y="672" text-anchor="middle" dominant-baseline="middle">Observation helpers</text>
  <text class="detail" x="625" y="701" text-anchor="middle" dominant-baseline="middle">withObservationContext</text>
<text class="detail" x="625" y="719" text-anchor="middle" dominant-baseline="middle">observeEventPublish</text>
<text class="detail" x="625" y="737" text-anchor="middle" dominant-baseline="middle">observeEventConsume</text>
</g>
<g id="meterRegistry">
  <rect class="card" x="915" y="290" width="230" height="112" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="1030" y="334" text-anchor="middle" dominant-baseline="middle">MeterRegistry</text>
  <text class="detail" x="1030" y="363" text-anchor="middle" dominant-baseline="middle">Timer.record</text>
<text class="detail" x="1030" y="381" text-anchor="middle" dominant-baseline="middle">cache meters</text>
</g>
<g id="observationRegistry">
  <rect class="card" x="915" y="627" width="230" height="132" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1030" y="681" text-anchor="middle" dominant-baseline="middle">ObservationRegistry</text>
  <text class="detail" x="1030" y="710" text-anchor="middle" dominant-baseline="middle">start/openScope/stop</text>
<text class="detail" x="1030" y="728" text-anchor="middle" dominant-baseline="middle">low/high cardinality keys</text>
</g>
<g id="timerSignal">
  <rect class="card" x="1270" y="290" width="220" height="112" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="1380" y="334" text-anchor="middle" dominant-baseline="middle">Timer metrics</text>
  <text class="detail" x="1380" y="363" text-anchor="middle" dominant-baseline="middle">duration</text>
<text class="detail" x="1380" y="381" text-anchor="middle" dominant-baseline="middle">count</text>
</g>
<g id="eventSignal">
  <rect class="card" x="1270" y="627" width="220" height="132" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1380" y="681" text-anchor="middle" dominant-baseline="middle">Observation signal</text>
  <text class="detail" x="1380" y="710" text-anchor="middle" dominant-baseline="middle">outcome tags</text>
<text class="detail" x="1380" y="728" text-anchor="middle" dominant-baseline="middle">trace/span bridge</text>
</g>
<g><rect class="note" x="120" y="992" width="1360" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF"/><text class="detail" x="800" y="1018" text-anchor="middle">bluetape4k-projects / infra:micrometer - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
