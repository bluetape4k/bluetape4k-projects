<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1200" viewBox="0 0 1880 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lettuce JCache NearCache Composition</title>
  <desc id="desc">Explain the Lettuce JCache near-cache composition and how JCache listener events synchronize the front cache.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1880" height="1200"/>
  <rect class="decor" x="44" y="36" width="1792" height="1128" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1716" height="914" rx="24"/>
  <text class="title" x="72" y="88">Lettuce JCache NearCache Composition</text>
  <text class="subtitle" x="76" y="121">JCache-compatible factories compose a Caffeine front with Lettuce-backed JCache wrappers and listener propagation.</text>
  <g id="panel-caller">
    <rect class="group" x="100" y="165" width="1680" height="195" rx="20"/>
    <text class="groupTitle" x="130" y="193" dominant-baseline="middle">JCache caller boundary</text>
  </g>
  <g id="panel-factory">
    <rect class="group" x="100" y="390" width="1680" height="220" rx="20"/>
    <text class="groupTitle" x="130" y="418" dominant-baseline="middle">Lettuce factory and adapters</text>
  </g>
  <g id="panel-tiers">
    <rect class="group" x="100" y="640" width="1680" height="220" rx="20"/>
    <text class="groupTitle" x="130" y="668" dominant-baseline="middle">JCache tiers</text>
  </g>
  <g id="panel-events">
    <rect class="group" x="100" y="890" width="1680" height="165" rx="20"/>
    <text class="groupTitle" x="130" y="918" dominant-baseline="middle">JCache listener propagation</text>
  </g>
  <path class="connector" data-edge="caller-&gt;factory" data-label="factory call" d="M 282 326 L 282 375 L 662 375 L 662 455" stroke="#4F83BF"/>
  <g transform="translate(417.6,338)">
    <rect class="labelPill" x="0" y="0" width="108.8" height="26" rx="8"/>
    <text class="small" x="54.4" y="13" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">factory call</text>
  </g>
  <path class="connector" data-edge="factory-&gt;near" data-label="creates" d="M 825 501 L 910 501" stroke="#4F83BF"/>

  <path class="connector" data-edge="config-&gt;near" data-label="configures" d="M 1390 501 L 1305 501" stroke="#8A72D6"/>

  <path class="connector" data-edge="near-&gt;front" data-label="read first" d="M 1030 547 L 1030 625 L 560 625 L 560 705" stroke="#45A7A1"/>
  <g transform="translate(748,588)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">read first</text>
  </g>
  <path class="connector" data-edge="front-&gt;back" data-label="miss lookup / write" d="M 600 753 L 1210 753" stroke="#D9AA4D"/>
  <g transform="translate(824.7,716)">
    <rect class="labelPill" x="0" y="0" width="160.6" height="26" rx="8"/>
    <text class="small" x="80.3" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">miss lookup / write</text>
  </g>
  <path class="connector" data-edge="near-&gt;back" data-label="back delegate" d="M 1180 547 L 1180 625 L 1412 625 L 1412 705" stroke="#58A978"/>
  <g transform="translate(1237.9,588)">
    <rect class="labelPill" x="0" y="0" width="116.2" height="26" rx="8"/>
    <text class="small" x="58.1" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">back delegate</text>
  </g>
  <path class="connector" data-edge="back-&gt;listener" data-label="entry events" d="M 1412 801 L 1412 875 L 730 875 L 730 994 L 670 994" stroke="#DB7890"/>

  <path class="connector" data-edge="listener-&gt;front" data-label="updates front" d="M 500 950 L 500 801" stroke="#DB7890"/>

  <path class="connector" data-edge="back-&gt;map" data-label="stores hash" d="M 1510 801 L 1510 955" stroke="#6B7D90"/>
  <g transform="translate(1532,865)">
    <rect class="labelPill" x="0" y="0" width="101.4" height="26" rx="8"/>
    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#6B7D90">stores hash</text>
  </g>
  <g id="node-caller" transform="translate(140,250)">
    <rect class="card" x="0" y="0" width="285" height="76" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="142.5" y="19" text-anchor="middle" dominant-baseline="middle">Application / JCache API</text>
    <text class="detail" x="142.5" y="38" text-anchor="middle" dominant-baseline="middle">Cache&lt;K,V&gt;</text>
    <text class="detail" x="142.5" y="57" text-anchor="middle" dominant-baseline="middle">SuspendJCache&lt;String,V&gt;</text>
  </g>
  <g id="node-factory" transform="translate(500,455)">
    <rect class="card" x="0" y="0" width="325" height="92" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="162.5" y="17.5" text-anchor="middle" dominant-baseline="middle">LettuceCaches</text>
    <text class="detail" x="162.5" y="36.5" text-anchor="middle" dominant-baseline="middle">nearJCache()</text>
    <text class="detail" x="162.5" y="55.5" text-anchor="middle" dominant-baseline="middle">suspendNearJCache()</text>
    <text class="detail" x="162.5" y="74.5" text-anchor="middle" dominant-baseline="middle">codec and config DSL</text>
  </g>
  <g id="node-near" transform="translate(910,455)">
    <rect class="card" x="0" y="0" width="395" height="92" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="197.5" y="17.5" text-anchor="middle" dominant-baseline="middle">NearJCache / SuspendNearJCache</text>
    <text class="detail" x="197.5" y="36.5" text-anchor="middle" dominant-baseline="middle">front-first read</text>
    <text class="detail" x="197.5" y="55.5" text-anchor="middle" dominant-baseline="middle">back fill</text>
    <text class="detail" x="197.5" y="74.5" text-anchor="middle" dominant-baseline="middle">write-through</text>
  </g>
  <g id="node-config" transform="translate(1390,462)">
    <rect class="card" x="0" y="0" width="315" height="78" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="157.5" y="10.5" text-anchor="middle" dominant-baseline="middle">NearJCacheConfig</text>
    <text class="detail" x="157.5" y="29.5" text-anchor="middle" dominant-baseline="middle">cacheName</text>
    <text class="detail" x="157.5" y="48.5" text-anchor="middle" dominant-baseline="middle">isSynchronous</text>
    <text class="detail" x="157.5" y="67.5" text-anchor="middle" dominant-baseline="middle">remote sync timeout</text>
  </g>
  <g id="node-front" transform="translate(230,705)">
    <rect class="card" x="0" y="0" width="370" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="185" y="19.5" text-anchor="middle" dominant-baseline="middle">Caffeine front JCache</text>
    <text class="detail" x="185" y="38.5" text-anchor="middle" dominant-baseline="middle">local fast path</text>
    <text class="detail" x="185" y="57.5" text-anchor="middle" dominant-baseline="middle">listener target</text>
    <text class="detail" x="185" y="76.5" text-anchor="middle" dominant-baseline="middle">no Redis roundtrip</text>
  </g>
  <g id="node-back" transform="translate(1210,705)">
    <rect class="card" x="0" y="0" width="405" height="96" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="202.5" y="19.5" text-anchor="middle" dominant-baseline="middle">LettuceJCache / LettuceSuspendJCache</text>
    <text class="detail" x="202.5" y="38.5" text-anchor="middle" dominant-baseline="middle">Redis hash storage</text>
    <text class="detail" x="202.5" y="57.5" text-anchor="middle" dominant-baseline="middle">TTL contract</text>
    <text class="detail" x="202.5" y="76.5" text-anchor="middle" dominant-baseline="middle">close keeps data</text>
  </g>
  <g id="node-listener" transform="translate(230,950)">
    <rect class="card" x="0" y="0" width="440" height="88" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="220" y="15.5" text-anchor="middle" dominant-baseline="middle">CacheEntryListener</text>
    <text class="detail" x="220" y="34.5" text-anchor="middle" dominant-baseline="middle">CREATED/UPDATED -&gt; put</text>
    <text class="detail" x="220" y="53.5" text-anchor="middle" dominant-baseline="middle">REMOVED/EXPIRED -&gt; remove</text>
    <text class="detail" x="220" y="72.5" text-anchor="middle" dominant-baseline="middle">peer front propagation</text>
  </g>
  <g id="node-map" transform="translate(1265,955)">
    <rect class="card" x="0" y="0" width="315" height="76" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="cardTitle" x="157.5" y="9.5" text-anchor="middle" dominant-baseline="middle">LettuceMap</text>
    <text class="detail" x="157.5" y="28.5" text-anchor="middle" dominant-baseline="middle">HMGET batch check</text>
    <text class="detail" x="157.5" y="47.5" text-anchor="middle" dominant-baseline="middle">HSET/HSETEX fallback</text>
    <text class="detail" x="157.5" y="66.5" text-anchor="middle" dominant-baseline="middle">codec serialization</text>
  </g>
  <g transform="translate(76,1096)">
    <rect class="labelPill" x="0" y="0" width="1728" height="48" rx="10"/>
    <text class="small" x="864" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-projects / cache modules - github.com/bluetape4k/bluetape4k-projects</text>
  </g>
</svg>
