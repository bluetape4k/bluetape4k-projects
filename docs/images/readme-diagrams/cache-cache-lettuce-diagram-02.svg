<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1080" viewBox="0 0 2300 1080" role="img" aria-label="Lettuce JCache near cache structure"><defs><filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity=".10" /></filter><marker id="open-blue" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#1D4ED8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><marker id="open-teal" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#0F766E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><marker id="open-green" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#15803D" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><marker id="open-orange" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#C2410C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><marker id="open-pink" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#BE185D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><marker id="open-slate" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}.title,.cardTitle{font-family:"Architects Daughter";fill:#0F172A}.title{font-size:46px}.cardTitle{font-size:28px}.subtitle,.sub,.line,.edgeLabel{font-family:"Comic Mono";fill:#475569}.subtitle{font-size:15.5px}.sub,.edgeLabel{font-size:13.5px}.line{font-size:14px}.card{stroke-width:2;filter:url(#shadow)}.edge{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}</style></defs><rect class="canvas" width="2300" height="1080" /><rect class="frame" x="34" y="30" width="2232" height="1016" rx="8" /><text class="title" x="76" y="90">Lettuce JCache NearCache Structure</text><text class="subtitle" x="80" y="124">How cache-lettuce wires cache-core JCache near-cache abstractions to Redis-backed LettuceJCache and a local Caffeine front cache.</text><g><rect class="card" x="95" y="215" width="620" height="245" rx="8" fill="#F0FDF4" stroke="#16A34A" /><text class="cardTitle" x="123" y="263">LettuceCaches factory</text><text class="sub" x="125" y="293">module entrypoint</text><path d="M95 313H715" stroke="#16A34A" opacity=".5" /><text class="line" x="125" y="349">nearJCache(): LettuceJCache back cache</text><text class="line" x="125" y="379">suspendNearJCache(): Caffeine front + LettuceSuspendJCache back</text><text class="line" x="125" y="409">codec defaults to LettuceBinaryCodecs.default()</text></g>
<g><rect class="card" x="850" y="200" width="620" height="270" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="cardTitle" x="878" y="248">NearJCache&lt;K,V&gt;</text><text class="sub" x="880" y="278">cache-core blocking two-tier type</text><path d="M850 298H1470" stroke="#2563EB" opacity=".5" /><text class="line" x="880" y="334">implements JCache&lt;K,V&gt; by backCache</text><text class="line" x="880" y="364">get() reads local front only</text><text class="line" x="880" y="394">getDeeply() reads back and fills front</text><text class="line" x="880" y="424">put/remove/replace update front then back</text></g>
<g><rect class="card" x="1600" y="200" width="600" height="270" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="cardTitle" x="1628" y="248">SuspendNearJCache&lt;K,V&gt;</text><text class="sub" x="1630" y="278">cache-core coroutine two-tier type</text><path d="M1600 298H2200" stroke="#0D9488" opacity=".5" /><text class="line" x="1630" y="334">implements SuspendJCache&lt;K,V&gt; by backCache</text><text class="line" x="1630" y="364">get() delegates to getDeeply()</text><text class="line" x="1630" y="394">Flow reads expose local front entries</text><text class="line" x="1630" y="424">withoutListener() handles listener-free backends</text></g>
<g><rect class="card" x="185" y="710" width="580" height="255" rx="8" fill="#FFF7ED" stroke="#EA580C" /><text class="cardTitle" x="213" y="758">NearJCacheConfig DSL</text><text class="sub" x="215" y="788">configuration boundary</text><path d="M185 808H765" stroke="#EA580C" opacity=".5" /><text class="line" x="215" y="844">cacheName identifies Redis hash/front cache</text><text class="line" x="215" y="874">frontCacheConfiguration defaults to Caffeine</text><text class="line" x="215" y="904">isSynchronous + syncRemoteTimeout tune event delivery</text></g>
<g><rect class="card" x="915" y="710" width="560" height="255" rx="8" fill="#F8FAFC" stroke="#64748B" /><text class="cardTitle" x="943" y="758">LettuceJCache back</text><text class="sub" x="945" y="788">Redis hash storage</text><path d="M915 808H1475" stroke="#64748B" opacity=".5" /><text class="line" x="945" y="844">hset/hget/hdel through LettuceMap</text><text class="line" x="945" y="874">dispatches CREATED/UPDATED/REMOVED events</text><text class="line" x="945" y="904">close() releases resources without deleting data</text></g>
<g><rect class="card" x="1620" y="710" width="520" height="255" rx="8" fill="#FDF2F8" stroke="#DB2777" /><text class="cardTitle" x="1648" y="758">Local front cache</text><text class="sub" x="1650" y="788">Caffeine-backed local tier</text><path d="M1620 808H2140" stroke="#DB2777" opacity=".5" /><text class="line" x="1650" y="844">fast local reads</text><text class="line" x="1650" y="874">back-cache listener propagates peer changes</text><text class="line" x="1650" y="904">clearLocal() keeps Redis data intact</text></g>
<g><path class="edge dashed" d="M715 335 L850 335" stroke="#1D4ED8" marker-end="url(#open-blue)" /><text class="edgeLabel" x="743" y="310">creates blocking</text></g>
<g><path class="edge dashed" d="M405 215 L405 160 L1900 160 L1900 200" stroke="#0F766E" marker-end="url(#open-teal)" /><text class="edgeLabel" x="1138" y="139">creates coroutine</text></g>
<g><path class="edge dashed" d="M1160 470 L1160 710" stroke="#475569" marker-end="url(#open-slate)" /><text class="edgeLabel" x="1168" y="702">delegates to back</text></g>
<g><path class="edge dashed" d="M1900 470 L1900 710" stroke="#BE185D" marker-end="url(#open-pink)" /><text class="edgeLabel" x="1908" y="702">uses front</text></g>
<g><path class="edge dashed" d="M475 460 L475 710" stroke="#C2410C" marker-end="url(#open-orange)" /><text class="edgeLabel" x="483" y="702">DSL config</text></g>
<g><path class="edge dashed" d="M1475 835 L1620 835" stroke="#BE185D" marker-end="url(#open-pink)" /><text class="edgeLabel" x="1628" y="827">events fill/evict</text></g></svg>
