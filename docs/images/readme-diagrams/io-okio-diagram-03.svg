<g><rect x="180" y="1091" width="1457" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="908.5" y="1117" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
