<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1278" viewBox="0 0 1754 1278" role="img" aria-label="Coroutines Async I/O Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1278"/>
<rect class="frame" x="32" y="28" width="1690" height="1222" rx="28"/>
<text class="title" x="66" y="82">Coroutines Async I/O Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M467 332 C467 391 672 391 672 450"/>
<path class="line" d="M467 332 C467 391 262 391 262 450"/>
<path class="implLine" d="M1082 764 C1082 572 1287 572 1287 380"/>
<path class="implLine" d="M1492 450 C1492 415 1287 415 1287 380"/>
<path class="implLine" d="M672 764 C672 572 877 572 877 380"/>
<path class="implLine" d="M1082 450 C1082 415 877 415 877 380"/>
<path class="implLine" d="M1082 970 C1082 838 672 838 672 706"/>
<path class="inheritLine" d="M672 450 C672 415 1287 415 1287 380"/>
<path class="implLine" d="M672 970 C672 838 262 838 262 706"/>
<path class="inheritLine" d="M262 450 C262 415 877 415 877 380"/>
<g transform="translate(297,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedPipe</text>
  <text class="mono" x="18" y="108">+sink: BufferedSuspendedSink</text>
<text class="mono" x="18" y="132">+source: BufferedSuspendedSource</text>
</g>
<g transform="translate(707,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedSink</text>
  <text class="mono" x="18" y="108">+write(source: Buffer, byteCount: Long)*</text>
<text class="mono" x="18" y="132">+flush()*</text>
<text class="mono" x="18" y="156">+close()*</text>
<text class="mono" x="18" y="180">+timeout() Timeout</text>
</g>
<g transform="translate(1117,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedSource</text>
  <text class="mono" x="18" y="108">+read(sink: Buffer, byteCount: Long)* Long</text>
<text class="mono" x="18" y="132">+close()*</text>
<text class="mono" x="18" y="156">+timeout() Timeout</text>
<text class="mono" x="18" y="180">+readAll(sink: Buffer)* Long</text>
</g>
<g transform="translate(92,458)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">BufferedSuspendedSink</text>
  <text class="mono" x="18" y="108">+buffer: Buffer</text>
<text class="mono" x="18" y="132">+write(byteString: ByteString)*</text>
<text class="mono" x="18" y="156">+writeUtf8(string: String)*</text>
<text class="mono" x="18" y="180">+writeByte(b: Int)*</text>
<text class="mono" x="18" y="204">+writeInt(i: Int)*</text>
<text class="mono" x="18" y="228">+writeLong(v: Long)*</text>
</g>
<g transform="translate(502,458)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">BufferedSuspendedSource</text>
  <text class="mono" x="18" y="108">+buffer: Buffer</text>
<text class="mono" x="18" y="132">+exhausted()* Boolean</text>
<text class="mono" x="18" y="156">+require(byteCount: Long)*</text>
<text class="mono" x="18" y="180">+readByte()* Byte</text>
<text class="mono" x="18" y="204">+readInt()* Int</text>
<text class="mono" x="18" y="228">+readLong()* Long</text>
</g>
<g transform="translate(912,458)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedFileChannelSink</text>
  <text class="mono" x="18" y="108">-channel: AsynchronousFileChannel</text>
<text class="mono" x="18" y="132">-position: Long</text>
<text class="mono" x="18" y="156">-writeBuffer: ByteBuffer</text>
</g>
<g transform="translate(1322,458)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedFileChannelSource</text>
  <text class="mono" x="18" y="108">-channel: AsynchronousFileChannel</text>
<text class="mono" x="18" y="132">-position: Long</text>
<text class="mono" x="18" y="156">-readBuffer: ByteBuffer</text>
</g>
<g transform="translate(502,772)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedSocketChannelSink</text>
  <text class="mono" x="18" y="108">-channel: AsynchronousSocketChannel</text>
</g>
<g transform="translate(912,772)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">SuspendedSocketChannelSource</text>
  <text class="mono" x="18" y="108">-channel: AsynchronousSocketChannel</text>
</g>
<g transform="translate(502,978)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">RealBufferedSuspendedSink</text>
  <text class="mono" x="18" y="108">-sink: SuspendedSink</text>
<text class="mono" x="18" y="132">-closed: AtomicBoolean</text>
</g>
<g transform="translate(912,978)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">RealBufferedSuspendedSource</text>
  <text class="mono" x="18" y="108">-source: SuspendedSource</text>
<text class="mono" x="18" y="132">-closed: AtomicBoolean</text>
</g>
</svg>
