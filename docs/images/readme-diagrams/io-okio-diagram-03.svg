  <text class="stereo" x="320" y="204" text-anchor="middle">interface</text>
  <text class="classTitle" x="320" y="232" text-anchor="middle">SuspendedSink</text>
  <line x1="150" y1="241" x2="490" y2="241" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="168" y="266">write(Buffer, Long)</text>
<text class="member" x="168" y="283">flush()</text>
<text class="member" x="168" y="300">close()</text>
</g>
