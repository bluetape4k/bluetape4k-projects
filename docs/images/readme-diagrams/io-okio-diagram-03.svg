  <text class="stereo" x="589" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="589" y="678" text-anchor="middle">SuspendedSink</text>
  <line x1="409" y1="687" x2="769" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="443" y="719">write(Buffer, Long)</text>
<text class="member" x="443" y="736">flush()</text>
<text class="member" x="443" y="753">close()</text>
</g>
