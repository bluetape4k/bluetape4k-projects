<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1579" viewBox="0 0 1754 1579" role="img" aria-label="Coroutines Async I/O Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1754" height="1579"/>
<rect class="frame" x="32" y="28" width="1690" height="1523" rx="28"/>
<text class="title" x="66" y="82">Coroutines Async I/O Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="148" width="1640" height="260" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="176">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="494" width="1640" height="302" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="522">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="858" width="1640" height="213" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="886">Integration layer</text>
    </g>
    <g id="readme-layer-4">
      <rect class="readmeLayerBand" x="54" y="1157" width="1640" height="234" rx="18" fill="#FFF3D9"/>
      <text class="readmeLayerLabel" x="72" y="1185">Runtime layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M467 342 C467 430 672 430 672 518"/>
<path class="line" d="M467 342 C467 430 262 430 262 518"/>
<path class="implLine" d="M1082 882 C1082 633 1287 633 1287 384"/>
<path class="implLine" d="M1492 518 C1492 451 1287 451 1287 384"/>
<path class="implLine" d="M672 882 C672 633 877 633 877 384"/>
<path class="implLine" d="M1082 518 C1082 451 877 451 877 384"/>
<path class="implLine" d="M1082 1181 C1082 976.5 672 976.5 672 772"/>
<path class="inheritLine" d="M672 518 C672 451 1287 451 1287 384"/>
<path class="implLine" d="M672 1181 C672 976.5 262 976.5 262 772"/>
<path class="inheritLine" d="M262 518 C262 451 877 451 877 384"/>
<g transform="translate(297,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">SuspendedPipe</text>
  <text class="mono" x="18" y="108">+sink: BufferedSuspendedSink</text>
<text class="mono" x="18" y="129">+source: BufferedSuspendedSource</text>
</g>
<g transform="translate(707,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">SuspendedSink</text>
  <text class="mono" x="18" y="108">+write(source: Buffer, byteCount: Long)*</text>
<text class="mono" x="18" y="129">+flush()*</text>
<text class="mono" x="18" y="150">+close()*</text>
<text class="mono" x="18" y="171">+timeout() Timeout</text>
</g>
<g transform="translate(1117,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">SuspendedSource</text>
  <text class="mono" x="18" y="108">+read(sink: Buffer, byteCount: Long)* Long</text>
<text class="mono" x="18" y="129">+close()*</text>
<text class="mono" x="18" y="150">+timeout() Timeout</text>
<text class="mono" x="18" y="171">+readAll(sink: Buffer)* Long</text>
</g>
<g transform="translate(92,526)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">BufferedSuspendedSink</text>
  <text class="mono" x="18" y="108">+buffer: Buffer</text>
<text class="mono" x="18" y="129">+write(byteString: ByteString)*</text>
<text class="mono" x="18" y="150">+writeUtf8(string: String)*</text>
<text class="mono" x="18" y="171">+writeByte(b: Int)*</text>
<text class="mono" x="18" y="192">+writeInt(i: Int)*</text>
<text class="mono" x="18" y="213">+writeLong(v: Long)*</text>
</g>
<g transform="translate(502,526)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">BufferedSuspendedSource</text>
  <text class="mono" x="18" y="108">+buffer: Buffer</text>
<text class="mono" x="18" y="129">+exhausted()* Boolean</text>
<text class="mono" x="18" y="150">+require(byteCount: Long)*</text>
<text class="mono" x="18" y="171">+readByte()* Byte</text>
<text class="mono" x="18" y="192">+readInt()* Int</text>
<text class="mono" x="18" y="213">+readLong()* Long</text>
</g>
<g transform="translate(912,526)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
    <text class="label" x="170" y="49" text-anchor="middle">SuspendedFileChannelSink</text>
  <text class="mono" x="18" y="108">-channel: AsynchronousFileChannel</text>
<text class="mono" x="18" y="129">-position: Long</text>
<text class="mono" x="18" y="150">-writeBuffer: ByteBuffer</text>
</g>
<g transform="translate(1322,526)">
  <rect class="card" x="0" y="0" width="340" height="191" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#B88A44"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Suspended File Channel</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="124">-channel: AsynchronousFileChannel</text>
<text class="mono" x="18" y="145">-position: Long</text>
<text class="mono" x="18" y="166">-readBuffer: ByteBuffer</text>
</g>
<g transform="translate(502,890)">
  <rect class="card" x="0" y="0" width="340" height="149" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8BA84D"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Suspended Socket Channel</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Sink</text>
  <text class="mono" x="18" y="124">-channel: AsynchronousSocketChannel</text>
</g>
<g transform="translate(912,890)">
  <rect class="card" x="0" y="0" width="340" height="149" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#5B8DEF"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Suspended Socket Channel</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="124">-channel: AsynchronousSocketChannel</text>
</g>
<g transform="translate(502,1189)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#58A978"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Real Buffered Suspended</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Sink</text>
  <text class="mono" x="18" y="124">-sink: SuspendedSink</text>
<text class="mono" x="18" y="145">-closed: AtomicBoolean</text>
</g>
<g transform="translate(912,1189)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#D6A441"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Real Buffered Suspended</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Source</text>
  <text class="mono" x="18" y="124">-source: SuspendedSource</text>
<text class="mono" x="18" y="145">-closed: AtomicBoolean</text>
</g>
</svg>
