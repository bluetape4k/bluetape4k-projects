  <line x1="1579" y1="454" x2="1939" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1613" y="486">buffer: Buffer</text>
<text class="member" x="1613" y="503">exhausted()</text>
