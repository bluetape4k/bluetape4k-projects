  <text class="stereo" x="698" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="698" y="903" text-anchor="middle">SuspendedSocketChannel</text>
<text class="classTitle" x="698" y="925" text-anchor="middle">Sink</text>
  <line x1="508" y1="929" x2="888" y2="929" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="542" y="962">AsynchronousSocketChannel</text>
<text class="member" x="542" y="979">network write adapter</text>
