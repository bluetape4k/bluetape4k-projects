<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1060" viewBox="0 0 1880 1060" role="img" aria-label="Coroutines Async I/O Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1880" height="1060"/>
<rect class="frame" x="32" y="28" width="1816" height="1004" rx="30"/>
<text class="title" x="68" y="84">Coroutines Async I/O Hierarchy</text>
<text class="subtitle" x="72" y="116">Sink and Source contracts stay at the top; concrete file, socket, buffering, and pipe adapters attach through short colored routes.</text>
<path class="inherit" data-from="fileSink" data-to="sink" d="M390 455 L390 365 L320 365 L320 317" stroke="#755BC6"/>
<path class="inherit" data-from="socketSink" data-to="sink" d="M760 455 L760 345 L320 345 L320 317" stroke="#758297"/>
<path class="inherit" data-from="realSink" data-to="bufferedSink" d="M1130 455 L1130 365 L690 365 L690 317" stroke="#3E9868"/>
<path class="inherit" data-from="fileSource" data-to="source" d="M390 735 L390 655 L80 655 L80 145 L1060 145 L1060 185" stroke="#718A35"/>
<path class="inherit" data-from="socketSource" data-to="source" d="M760 735 L760 635 L120 635 L120 160 L1060 160 L1060 185" stroke="#4F83BF"/>
<path class="inherit" data-from="realSource" data-to="bufferedSource" d="M1130 735 L1130 655 L1740 655 L1740 145 L1430 145 L1430 185" stroke="#2E8F89"/>
<path class="dependency" data-from="bufferedSink" data-to="sink" d="M520 251 L490 251" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="bufferedSource" data-to="source" d="M1260 251 L1230 251" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="pipe" data-to="bufferedSink" d="M1500 455 L1500 340 L690 340 L690 317" stroke="#4F83BF" stroke-dasharray="8 7"/>
<path class="dependency" data-from="pipe" data-to="bufferedSource" d="M1500 455 L1500 317" stroke="#2E8F89" stroke-dasharray="8 7"/>
