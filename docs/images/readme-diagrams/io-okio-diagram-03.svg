<svg xmlns="http://www.w3.org/2000/svg" width="2097" height="1181" viewBox="0 0 2097 1181" role="img" aria-label="Coroutines Async I/O Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2097" height="1181"/>
<rect class="frame" x="32" y="28" width="2033" height="1125" rx="30"/>
<text class="title" x="68" y="84">Coroutines Async I/O Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="fileSink" data-to="sink" data-route-color="green" d="M457 865 L457 777" stroke="#3E9868"/>
<path class="inherit" data-from="socketSink" data-to="sink" data-route-color="blue" d="M698 865 L698 777" stroke="#4F83BF"/>
<path class="inherit" data-from="realSink" data-to="bufferedSink" data-route-color="teal" d="M984 631 L984 544" stroke="#2E8F89"/>
<path class="inherit" data-from="fileSource" data-to="source" data-route-color="amber" d="M1326 865 L1326 769" stroke="#B9851B"/>
<path class="inherit" data-from="socketSource" data-to="source" data-route-color="pink" d="M1501 865 L1501 769" stroke="#C94D68"/>
<path class="inherit" data-from="realSource" data-to="bufferedSource" data-route-color="purple" d="M1769 631 L1769 544" stroke="#755BC6"/>
<path class="dependency" data-from="bufferedSink" data-to="sink" data-route-color="coral" d="M799 512 L721 512 L721 631" stroke="#C8644B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="bufferedSource" data-to="source" data-route-color="brown" d="M1579 512 L1501 512 L1501 631" stroke="#8E6D43" stroke-dasharray="8 7"/>
<path class="dependency" data-from="pipe" data-to="bufferedSink" data-route-color="cyan" d="M1189 271 L1111 271 L1111 398" stroke="#2E83B8" stroke-dasharray="8 7"/>
<path class="dependency" data-from="pipe" data-to="bufferedSource" data-route-color="magenta" d="M1549 271 L1627 271 L1627 398" stroke="#A84B98" stroke-dasharray="8 7"/>
