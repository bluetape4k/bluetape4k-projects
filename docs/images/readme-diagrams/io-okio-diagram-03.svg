<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-okio coroutine async IO hierarchy</title>
  <desc id="desc">Coroutine Source and Sink hierarchy showing buffered suspended facades, blocking Okio interop, async file channels, socket adapters, and SuspendedPipe.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .contract-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .source-panel { fill: #f3f8ef; stroke: #aec99d; stroke-width: 2; }
      .sink-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .bridge-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .source-card { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-card { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .buffer-card { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .pipe-card { fill: #f7f3ff; stroke: #8870a8; stroke-width: 2; }
      .safety-card { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .bus { fill: none; stroke: #455a64; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; }
      .flowSlate { fill: none; stroke: #455a64; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSlate); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .flowGold { fill: none; stroke: #a2743d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGold); }
      .flowBlue { fill: none; stroke: #4b74a5; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .flowPurple { fill: none; stroke: #8870a8; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .flowRed { fill: none; stroke: #b65f68; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowRed); }
      .source-icon { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .sink-icon { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .icon-line-green { fill: none; stroke: #5d7b63; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon-line-gold { fill: none; stroke: #a2743d; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arrowSlate" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#455a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#8870a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1032" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-okio Coroutines Async I/O Hierarchy</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">SuspendedSource and SuspendedSink mirror Okio contracts while preserving cancellation, buffering, and resource boundaries.</text>

  <rect x="72" y="150" width="1656" height="178" rx="16" class="contract-panel"/>
  <text x="102" y="190" class="panel-title">Suspended contracts</text>
  <text x="102" y="218" class="small">The coroutine APIs keep read/write as suspend calls; buffering and interop are explicit wrapper choices.</text>

  <rect x="170" y="248" width="350" height="64" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="345" y="276" text-anchor="middle" class="class-title">SuspendedSource</text>
  <text x="345" y="300" text-anchor="middle" class="member">read, readAll, close, timeout</text>

  <rect x="560" y="248" width="350" height="64" rx="7" class="buffer-card" filter="url(#softShadow)"/>
  <text x="735" y="276" text-anchor="middle" class="class-title">Buffered facades</text>
  <text x="735" y="300" text-anchor="middle" class="member">request / require / emit segments</text>

  <rect x="950" y="248" width="350" height="64" rx="7" class="sink-card" filter="url(#softShadow)"/>
  <text x="1125" y="276" text-anchor="middle" class="class-title">SuspendedSink</text>
  <text x="1125" y="300" text-anchor="middle" class="member">write, flush, close, timeout</text>

  <rect x="1340" y="248" width="300" height="64" rx="7" class="safety-card" filter="url(#softShadow)"/>
  <text x="1490" y="276" text-anchor="middle" class="class-title">No-progress guard</text>
  <text x="1490" y="300" text-anchor="middle" class="member">fails after repeated 0L reads</text>

  <rect x="72" y="374" width="806" height="402" rx="16" class="source-panel"/>
  <g transform="translate(828 392)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="source-icon"/>
    <path d="M -9 -5 H 4 M 4 -5 L -1 -10 M 4 -5 L -1 0" class="icon-line-green"/>
    <path d="M -10 8 H 10" class="icon-line-green"/>
  </g>
  <text x="102" y="414" class="panel-title">Async read paths</text>
  <text x="102" y="442" class="small">Sources suspend until bytes arrive, EOF is known, or a timeout/cancellation boundary is reached.</text>

  <rect x="136" y="504" width="330" height="116" rx="7" class="buffer-card" filter="url(#softShadow)"/>
  <text x="301" y="536" text-anchor="middle" class="class-title">RealBufferedSuspendedSource</text>
  <line x1="136" y1="556" x2="466" y2="556" class="sep"/>
  <text x="164" y="582" class="member">keeps internal Buffer</text>
  <text x="164" y="604" class="member">request, require, select, readUtf8</text>

  <rect x="518" y="504" width="320" height="116" rx="7" class="source-card" filter="url(#softShadow)"/>
  <text x="678" y="536" text-anchor="middle" class="class-title">Async source adapters</text>
  <line x1="518" y1="556" x2="838" y2="556" class="sep"/>
  <text x="546" y="582" class="member">SuspendedFileChannelSource</text>
  <text x="546" y="604" class="member">socket and blocking Source bridges</text>

  <rect x="262" y="668" width="450" height="68" rx="7" class="pipe-card" filter="url(#softShadow)"/>
  <text x="487" y="696" text-anchor="middle" class="class-title">SuspendedPipe source</text>
  <text x="487" y="722" text-anchor="middle" class="member">waits for producer bytes, EOF, or cancellation</text>

  <rect x="922" y="374" width="806" height="402" rx="16" class="sink-panel"/>
  <g transform="translate(1678 392)" aria-hidden="true">
    <circle cx="0" cy="0" r="20" class="sink-icon"/>
    <path d="M -4 5 H 9 M 9 5 L 4 0 M 9 5 L 4 10" class="icon-line-gold"/>
    <path d="M -10 -8 H 10" class="icon-line-gold"/>
  </g>
  <text x="952" y="414" class="panel-title">Async write paths</text>
  <text x="952" y="442" class="small">Sinks suspend while writes, flush, close, or backpressure boundaries complete.</text>

  <rect x="986" y="504" width="330" height="116" rx="7" class="buffer-card" filter="url(#softShadow)"/>
  <text x="1151" y="536" text-anchor="middle" class="class-title">RealBufferedSuspendedSink</text>
  <line x1="986" y1="556" x2="1316" y2="556" class="sep"/>
  <text x="1014" y="582" class="member">keeps internal Buffer</text>
  <text x="1014" y="604" class="member">emit and emitCompleteSegments</text>

  <rect x="1368" y="504" width="320" height="116" rx="7" class="sink-card" filter="url(#softShadow)"/>
  <text x="1528" y="536" text-anchor="middle" class="class-title">Async sink adapters</text>
  <line x1="1368" y1="556" x2="1688" y2="556" class="sep"/>
  <text x="1396" y="582" class="member">SuspendedFileChannelSink</text>
  <text x="1396" y="604" class="member">socket and blocking Sink bridges</text>

  <rect x="1112" y="668" width="450" height="68" rx="7" class="pipe-card" filter="url(#softShadow)"/>
  <text x="1337" y="696" text-anchor="middle" class="class-title">SuspendedPipe sink</text>
  <text x="1337" y="722" text-anchor="middle" class="member">waits for buffer space or folded delegate</text>

  <rect x="98" y="824" width="1604" height="108" rx="14" class="bridge-panel"/>
  <text x="128" y="858" class="panel-title">Bridge and safety contract</text>
  <text x="128" y="888" class="small">Blocking Okio bridges run through ForwardSuspended/ForwardBlocking wrappers; file force and close use runInterruptible(Dispatchers.IO).</text>
  <text x="128" y="912" class="small">Use buffered suspended wrappers for protocol reads/writes; use SuspendedPipe when ownership crosses producer and consumer coroutines.</text>

  <path d="M 345 312 V 374" class="flowGreen"/>
  <path d="M 1125 312 V 374" class="flowGold"/>

  <path d="M 678 620 L 678 634.4 Q 678 644 668.4 644 L 497 644 Q 487 644 487 654 L 487 668" class="flowGreen"/>
  <path d="M 301 620 L 301 634.4 Q 301 644 310.6 644 L 477 644 Q 487 644 487 654 L 487 668" class="flowBlue"/>
  <path d="M 1528 620 L 1528 634.4 Q 1528 644 1518.4 644 L 1347 644 Q 1337 644 1337 654 L 1337 668" class="flowGold"/>
  <path d="M 1151 620 L 1151 634.4 Q 1151 644 1160.6 644 L 1327 644 Q 1337 644 1337 654 L 1337 668" class="flowBlue"/>

  <path d="M 487 736 L 487 786 Q 487 800 501 800 L 890 800 Q 900 800 900 810 L 900 824" class="flowPurple"/>
  <path d="M 1337 736 L 1337 786 Q 1337 800 1323 800 L 910 800 Q 900 800 900 810 L 900 824" class="flowPurple"/>
</svg>
