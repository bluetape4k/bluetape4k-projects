    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">implements</text>
  </g>
  <path class="connector inherit" data-edge="caffeine-&gt;local" data-label="implements" d="M 685 818 L 600 818" stroke="#D9AA4D"/>

  <path class="connector" data-edge="redis-&gt;tracking" data-label="push invalidation" d="M 1420 815 L 1420 766" stroke="#DB7890"/>
