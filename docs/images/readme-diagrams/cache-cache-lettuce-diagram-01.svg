    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">invalidates</text>
  </g>
  <path class="connector dashed" data-edge="config-&gt;factory" data-label="feeds DSL" d="M 1015 1071 L 865 1071" stroke="#8A72D6"/>
  <g transform="translate(896.7,1034)">
    <rect class="labelPill" x="0" y="0" width="86.6" height="26" rx="8"/>
    <text class="small" x="43.3" y="13" text-anchor="middle" dominant-baseline="middle" fill="#8A72D6">feeds DSL</text>
  </g>
  <g id="node-ops" transform="translate(175,230)">
