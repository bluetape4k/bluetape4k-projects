<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="960" viewBox="0 0 1740 960" role="img" aria-label="JCache NearCache Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0.7 0.7 L 5.4 3 L 0.7 5.3 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1740" height="960"/>
<rect class="frame" x="34" y="30" width="1672" height="900" rx="30"/>
<text class="title" x="72" y="86">JCache NearCache Structure</text>
<text class="subtitle" x="76" y="118">Lettuce NearCache is shown as a contract-to-adapter-to-tier stack with short direct relationships.</text>
<g><rect class="panel" x="80" y="155" width="1580" height="165" rx="22"/><text class="panelTitle" x="104" y="189">Public cache contracts</text></g>
<g><rect class="panel" x="80" y="370" width="1580" height="215" rx="22"/><text class="panelTitle" x="104" y="404">JCache NearCache adapters</text></g>
<g><rect class="panel" x="80" y="640" width="1580" height="180" rx="22"/><text class="panelTitle" x="104" y="674">Local and Redis tiers</text></g>
<g id="nearOps"><rect class="card" x="160" y="210" width="330" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="325" y="243" text-anchor="middle">NearCacheOperations</text><text class="detail" x="325" y="278" text-anchor="middle">blocking contract</text></g>
<g id="suspendOps"><rect class="card" x="555" y="210" width="360" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="735" y="243" text-anchor="middle">SuspendNearCacheOperations</text><text class="detail" x="735" y="278" text-anchor="middle">coroutine contract</text></g>
<g id="jcache"><rect class="card" x="980" y="210" width="280" height="82" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1120" y="243" text-anchor="middle">JCache</text><text class="detail" x="1120" y="278" text-anchor="middle">standard cache API</text></g>
<g id="suspendJCache"><rect class="card" x="1325" y="210" width="260" height="82" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1455" y="243" text-anchor="middle">SuspendJCache</text><text class="detail" x="1455" y="278" text-anchor="middle">suspend API</text></g>
<g id="near"><rect class="card" x="210" y="425" width="330" height="112" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="210" y1="493" x2="540" y2="493" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="375" y="445" text-anchor="middle">class</text><text class="classTitle" x="375" y="473" text-anchor="middle">NearJCache</text><text class="member" x="228" y="511">front: LettuceLocalCache</text><text class="member" x="228" y="528">back: LettuceJCache</text></g>
<g id="snear"><rect class="card" x="640" y="425" width="360" height="112" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="640" y1="493" x2="1000" y2="493" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="820" y="445" text-anchor="middle">class</text><text class="classTitle" x="820" y="473" text-anchor="middle">SuspendNearJCache</text><text class="member" x="658" y="511">front: LettuceLocalCache</text><text class="member" x="658" y="528">back: LettuceSuspendJCache</text></g>
<g id="factory"><rect class="card" x="1100" y="425" width="330" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1265" y="464" text-anchor="middle">LettuceCaches</text><text class="detail" x="1265" y="499" text-anchor="middle">nearJCache()</text><text class="detail" x="1265" y="517" text-anchor="middle">suspendNearJCache()</text></g>
<g id="front"><rect class="card" x="250" y="690" width="330" height="82" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="415" y="714" text-anchor="middle">LettuceCaffeineLocalCache</text><text class="detail" x="415" y="749" text-anchor="middle">L1 Caffeine</text><text class="detail" x="415" y="767" text-anchor="middle">listener invalidation</text></g>
<g id="redis"><rect class="card" x="705" y="690" width="330" height="82" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="870" y="714" text-anchor="middle">Lettuce JCache backend</text><text class="detail" x="870" y="749" text-anchor="middle">L2 Redis</text><text class="detail" x="870" y="767" text-anchor="middle">TTL + codec</text></g>
<g id="tracking"><rect class="card" x="1160" y="690" width="330" height="82" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1325" y="714" text-anchor="middle">TrackingInvalidationListener</text><text class="detail" x="1325" y="749" text-anchor="middle">peer invalidation</text><text class="detail" x="1325" y="767" text-anchor="middle">front-cache clear</text></g>
<path class="inherit" d="M375 425 L375 292" stroke="#4F83BF"/>
<path class="inherit" d="M820 425 L820 352 L735 352 L735 292" stroke="#3E9868"/>
<path class="flow" d="M875 425 L875 336 L1120 336 L1120 292" stroke="#755BC6"/>
<path class="flow" d="M900 425 L900 346 L1455 346 L1455 292" stroke="#2E8F89"/>
<path class="flow" d="M375 537 L375 690" stroke="#2E8F89"/>
<path class="flow" d="M820 537 L820 690" stroke="#755BC6"/>
<path class="flow" d="M1000 480 L1100 480" stroke="#B9851B"/>
<path class="flow" d="M1035 731 L1160 731" stroke="#C94D68"/>
<path class="flow" d="M580 731 L705 731" stroke="#755BC6"/>
<g><rect x="170" y="862" width="1400" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><text class="small" x="870" y="887" text-anchor="middle">Stack form keeps contract, adapter, and storage tiers separate; adjacent cards use direct connectors instead of snake routing.</text></g>
</svg>
