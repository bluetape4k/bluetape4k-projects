    <line x1="0" y1="50" x2="430" y2="50" stroke="#75A9E8" stroke-width="1.6"/>
    <text class="stereo" x="215" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="215" y="36" text-anchor="middle" dominant-baseline="middle">NearCacheOperations&lt;V&gt;</text>
    <text class="member" x="215" y="70" text-anchor="middle" dominant-baseline="middle">blocking near-cache API</text>
    <text class="member" x="215" y="88" text-anchor="middle" dominant-baseline="middle">front/back statistics</text>
    <text class="member" x="215" y="106" text-anchor="middle" dominant-baseline="middle">resource lifecycle</text>
  </g>
  <g id="node-suspendOps" transform="translate(745,230)">
    <rect class="card" x="0" y="0" width="450" height="126" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#45A7A1" stroke-width="1.6"/>
    <text class="stereo" x="225" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="225" y="36" text-anchor="middle" dominant-baseline="middle">SuspendNearCacheOperations&lt;V&gt;</text>
    <text class="member" x="225" y="70" text-anchor="middle" dominant-baseline="middle">suspend read/write API</text>
    <text class="member" x="225" y="88" text-anchor="middle" dominant-baseline="middle">coroutine cleanup</text>
    <text class="member" x="225" y="106" text-anchor="middle" dominant-baseline="middle">same statistics contract</text>
  </g>
  <g id="node-near" transform="translate(175,455)">
    <rect class="card" x="0" y="0" width="430" height="126" rx="10" fill="#EAF7EF" stroke="#69B888"/>
    <line x1="0" y1="50" x2="430" y2="50" stroke="#69B888" stroke-width="1.6"/>
    <text class="stereo" x="215" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="215" y="36" text-anchor="middle" dominant-baseline="middle">LettuceNearCache&lt;V&gt;</text>
    <text class="member" x="215" y="70" text-anchor="middle" dominant-baseline="middle">RedisCommands + asyncCommands</text>
    <text class="member" x="215" y="88" text-anchor="middle" dominant-baseline="middle">EVALSHA CAS path</text>
    <text class="member" x="215" y="106" text-anchor="middle" dominant-baseline="middle">CLIENT TRACKING optional</text>
  </g>
  <g id="node-suspendNear" transform="translate(745,455)">
    <rect class="card" x="0" y="0" width="450" height="126" rx="10" fill="#EAF7EF" stroke="#69B888"/>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#69B888" stroke-width="1.6"/>
    <text class="stereo" x="225" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="225" y="36" text-anchor="middle" dominant-baseline="middle">LettuceSuspendNearCache&lt;V&gt;</text>
    <text class="member" x="225" y="70" text-anchor="middle" dominant-baseline="middle">RedisCoroutinesCommands</text>
    <text class="member" x="225" y="88" text-anchor="middle" dominant-baseline="middle">async mget for misses</text>
    <text class="member" x="225" y="106" text-anchor="middle" dominant-baseline="middle">CancellationException propagates</text>
  </g>
  <g id="node-local" transform="translate(210,760)">
    <rect class="card" x="0" y="0" width="390" height="124" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <line x1="0" y1="50" x2="390" y2="50" stroke="#45A7A1" stroke-width="1.6"/>
    <text class="stereo" x="195" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="195" y="36" text-anchor="middle" dominant-baseline="middle">LettuceLocalCache&lt;K,V&gt;</text>
    <text class="member" x="195" y="69" text-anchor="middle" dominant-baseline="middle">get / put / invalidate</text>
    <text class="member" x="195" y="87" text-anchor="middle" dominant-baseline="middle">invalidateAll / clear</text>
    <text class="member" x="195" y="105" text-anchor="middle" dominant-baseline="middle">Caffeine stats</text>
  </g>
  <g id="node-caffeine" transform="translate(685,760)">
    <rect class="card" x="0" y="0" width="410" height="124" rx="10" fill="#FFF3D9" stroke="#D9AA4D"/>
    <line x1="0" y1="50" x2="410" y2="50" stroke="#D9AA4D" stroke-width="1.6"/>
    <text class="stereo" x="205" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="205" y="36" text-anchor="middle" dominant-baseline="middle">LettuceCaffeineLocalCache&lt;V&gt;</text>
    <text class="member" x="205" y="69" text-anchor="middle" dominant-baseline="middle">Caffeine-backed L1</text>
    <text class="member" x="205" y="87" text-anchor="middle" dominant-baseline="middle">max size and expiration</text>
    <text class="member" x="205" y="105" text-anchor="middle" dominant-baseline="middle">local invalidation target</text>
  </g>
  <g id="node-redis" transform="translate(1225,815)">
    <rect class="card" x="0" y="0" width="390" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="195" y="19.5" text-anchor="middle" dominant-baseline="middle">Redis via Lettuce</text>
    <text class="detail" x="195" y="38.5" text-anchor="middle" dominant-baseline="middle">namespaced keys</text>
    <text class="detail" x="195" y="57.5" text-anchor="middle" dominant-baseline="middle">GET/SET/UNLINK/SCAN</text>
    <text class="detail" x="195" y="76.5" text-anchor="middle" dominant-baseline="middle">RESP3 push channel</text>
  </g>
  <g id="node-tracking" transform="translate(1185,690)">
    <rect class="card" x="0" y="0" width="405" height="76" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="202.5" y="9.5" text-anchor="middle" dominant-baseline="middle">TrackingInvalidationListener</text>
    <text class="detail" x="202.5" y="28.5" text-anchor="middle" dominant-baseline="middle">CLIENT TRACKING ON NOLOOP</text>
    <text class="detail" x="202.5" y="47.5" text-anchor="middle" dominant-baseline="middle">prefix-aware key decode</text>
    <text class="detail" x="202.5" y="66.5" text-anchor="middle" dominant-baseline="middle">full flush clears local</text>
  </g>
  <g id="node-factory" transform="translate(475,1030)">
    <rect class="card" x="0" y="0" width="390" height="82" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="195" y="12.5" text-anchor="middle" dominant-baseline="middle">LettuceCaches</text>
    <text class="detail" x="195" y="31.5" text-anchor="middle" dominant-baseline="middle">nearCache / suspendNearCache</text>
    <text class="detail" x="195" y="50.5" text-anchor="middle" dominant-baseline="middle">nearJCache / suspendNearJCache</text>
    <text class="detail" x="195" y="69.5" text-anchor="middle" dominant-baseline="middle">resilient variants</text>
  </g>
  <g id="node-config" transform="translate(1015,1030)">
    <rect class="card" x="0" y="0" width="405" height="92" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="202.5" y="17.5" text-anchor="middle" dominant-baseline="middle">LettuceNearCacheConfig</text>
    <text class="detail" x="202.5" y="36.5" text-anchor="middle" dominant-baseline="middle">cacheName and keyPrefix</text>
    <text class="detail" x="202.5" y="55.5" text-anchor="middle" dominant-baseline="middle">redisTtl and RESP3 flag</text>
    <text class="detail" x="202.5" y="74.5" text-anchor="middle" dominant-baseline="middle">batch/retry size validation</text>
  </g>
  <g transform="translate(76,1196)">
