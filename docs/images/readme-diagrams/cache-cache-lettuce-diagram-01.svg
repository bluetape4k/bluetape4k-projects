<svg xmlns="http://www.w3.org/2000/svg" width="2440" height="1540" viewBox="0 0 2440 1540" role="img" aria-label="LettuceNearCache class hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity=".10" /></filter>

    <marker id="open-blue" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#1D4ED8" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-blue" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-teal" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#0F766E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-teal" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-green" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#15803D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-green" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#15803D" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-orange" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#C2410C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-orange" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-pink" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#BE185D" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-pink" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-purple" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#6D28D9" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-purple" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
    <marker id="open-slate" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path stroke-dasharray="none" d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:none" /></marker>
    <marker id="triangle-slate" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2.4" style="stroke-dasharray:none" /></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15.5px;fill:#475569}
    .card,.note{stroke-width:1.8;filter:url(#shadow)}.stereo{font-family:"Comic Mono";font-size:13px;fill:#475569}.cardTitle,.noteTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
    .member,.noteLine{font-family:"Comic Mono";font-size:13.8px;fill:#334155}.divider{stroke-width:1.1;opacity:.45}
    .edge{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="2440" height="1540" />
<rect class="frame" x="34" y="30" width="2372" height="1476" rx="8" />
<text class="title" x="72" y="88">LettuceNearCache Class Hierarchy</text>
<text class="subtitle" x="76" y="121">Native Lettuce two-tier caches, shared config, Redis tracking invalidation, and the JCache bridge boundary.</text>
<g id="NearCacheOperations">
    <rect class="card" x="110" y="240" width="520" height="210" rx="8" fill="#EFF6FF" stroke="#2563EB" />
    <text class="stereo" x="370" y="268" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="cardTitle" x="370" y="298" text-anchor="middle">NearCacheOperations&lt;V&gt;</text>
    <path class="divider" d="M110 318H630" stroke="#1D4ED8" />
    <text class="member" x="134" y="346">blocking near-cache contract</text>
    <path class="divider" d="M110 380H630" stroke="#1D4ED8" />
    <text class="member" x="134" y="408">get/put/remove/replace</text><text class="member" x="134" y="432">clearLocal/clearAll/stats</text>
  </g>
<g id="SuspendNearCacheOperations">
    <rect class="card" x="1810" y="240" width="520" height="210" rx="8" fill="#F0FDFA" stroke="#0D9488" />
    <text class="stereo" x="2070" y="268" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="cardTitle" x="2070" y="298" text-anchor="middle">SuspendNearCacheOperations&lt;V&gt;</text>
    <path class="divider" d="M1810 318H2330" stroke="#0F766E" />
    <text class="member" x="1834" y="346">coroutine near-cache contract</text>
    <path class="divider" d="M1810 380H2330" stroke="#0F766E" />
    <text class="member" x="1834" y="408">suspend get/put/remove</text><text class="member" x="1834" y="432">clearLocal/clearAll/stats</text>
  </g>
<g id="LettuceNearCache">
    <rect class="card" x="110" y="610" width="670" height="330" rx="8" fill="#EFF6FF" stroke="#2563EB" />
    <text class="stereo" x="445" y="638" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="cardTitle" x="445" y="668" text-anchor="middle">LettuceNearCache&lt;V&gt;</text>
    <path class="divider" d="M110 688H780" stroke="#1D4ED8" />
    <text class="member" x="134" y="716">frontCache: LettuceLocalCache&lt;String,V&gt;</text><text class="member" x="134" y="740">commands: RedisCommands&lt;String,V&gt;</text><text class="member" x="134" y="764">trackingListener: TrackingInvalidationListener&lt;V&gt;</text>
    <path class="divider" d="M110 788H780" stroke="#1D4ED8" />
    <text class="member" x="134" y="816">front hit -&gt; return; miss -&gt; Redis GET + fill</text><text class="member" x="134" y="840">write-through SET/MSET + front update</text><text class="member" x="134" y="864">replace(old,new): EVALSHA then EVAL fallback</text><text class="member" x="134" y="888">remove/clearBack use UNLINK/SCAN</text>
  </g>
<g id="LettuceSuspendNearCache">
    <rect class="card" x="1660" y="610" width="670" height="330" rx="8" fill="#F0FDFA" stroke="#0D9488" />
    <text class="stereo" x="1995" y="638" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="cardTitle" x="1995" y="668" text-anchor="middle">LettuceSuspendNearCache&lt;V&gt;</text>
    <path class="divider" d="M1660 688H2330" stroke="#0F766E" />
    <text class="member" x="1684" y="716">frontCache: LettuceLocalCache&lt;String,V&gt;</text><text class="member" x="1684" y="740">commands: RedisCoroutinesCommands&lt;String,V&gt;</text><text class="member" x="1684" y="764">asyncCommands reused for hot paths</text>
    <path class="divider" d="M1660 788H2330" stroke="#0F766E" />
    <text class="member" x="1684" y="816">suspend read/write mirrors native behavior</text><text class="member" x="1684" y="840">CancellationException is not hidden</text><text class="member" x="1684" y="864">replace(old,new): EVALSHA then EVAL fallback</text><text class="member" x="1684" y="888">close() shuts listener, connection, front cache</text>
  </g>
<g id="LettuceLocalCache">
    <rect class="card" x="130" y="1135" width="520" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A" />
    <text class="stereo" x="390" y="1163" text-anchor="middle">&lt;&lt;interface + impl&gt;&gt;</text>
    <text class="cardTitle" x="390" y="1193" text-anchor="middle">LettuceLocalCache / Caffeine</text>
    <path class="divider" d="M130 1213H650" stroke="#15803D" />
    <text class="member" x="154" y="1241">local L1 cache</text><text class="member" x="154" y="1265">optional stats</text>
    <path class="divider" d="M130 1289H650" stroke="#15803D" />
    <text class="member" x="154" y="1317">get/put/remove/clear</text><text class="member" x="154" y="1341">invalidateAll from Redis tracking</text>
  </g>
<g id="Redis">
    <rect class="card" x="960" y="1135" width="520" height="250" rx="8" fill="#F8FAFC" stroke="#64748B" />
    <text class="stereo" x="1220" y="1163" text-anchor="middle">&lt;&lt;Redis via Lettuce&gt;&gt;</text>
    <text class="cardTitle" x="1220" y="1193" text-anchor="middle">Remote Back Cache</text>
    <path class="divider" d="M960 1213H1480" stroke="#475569" />
    <text class="member" x="984" y="1241">prefixed key: cacheName:key</text><text class="member" x="984" y="1265">RESP3 CLIENT TRACKING</text>
    <path class="divider" d="M960 1289H1480" stroke="#475569" />
    <text class="member" x="984" y="1317">GET/MGET, SET/MSET</text><text class="member" x="984" y="1341">UNLINK for delete</text><text class="member" x="984" y="1365">SCAN cacheName:* for clearBack</text>
  </g>
<g id="TrackingInvalidationListener">
    <rect class="card" x="1770" y="1135" width="520" height="250" rx="8" fill="#FDF2F8" stroke="#DB2777" />
    <text class="stereo" x="2030" y="1163" text-anchor="middle">&lt;&lt;listener&gt;&gt;</text>
    <text class="cardTitle" x="2030" y="1193" text-anchor="middle">TrackingInvalidationListener</text>
    <path class="divider" d="M1770 1213H2290" stroke="#BE185D" />
    <text class="member" x="1794" y="1241">PushListener on invalidate</text><text class="member" x="1794" y="1265">cacheName prefix filter</text>
    <path class="divider" d="M1770 1289H2290" stroke="#BE185D" />
    <text class="member" x="1794" y="1317">null payload -&gt; front clear</text><text class="member" x="1794" y="1341">matching keys -&gt; invalidateAll</text><text class="member" x="1794" y="1365">CLIENT TRACKING ON NOLOOP</text>
  </g>
<g id="Config">
    <rect class="card" x="915" y="610" width="610" height="240" rx="8" fill="#FFF7ED" stroke="#EA580C" />
    <text class="stereo" x="1220" y="638" text-anchor="middle">&lt;&lt;data class + builder&gt;&gt;</text>
    <text class="cardTitle" x="1220" y="668" text-anchor="middle">LettuceNearCacheConfig&lt;K,V&gt;</text>
    <path class="divider" d="M915 688H1525" stroke="#C2410C" />
    <text class="member" x="939" y="716">cacheName, maxLocalSize</text><text class="member" x="939" y="740">frontExpireAfterWrite / redisTtl</text><text class="member" x="939" y="764">useRespProtocol3, recordStats</text>
    <path class="divider" d="M915 788H1525" stroke="#C2410C" />
    <text class="member" x="939" y="816">redisKey(key) =&gt; cacheName:key</text><text class="member" x="939" y="840">validates positive sizes and TTL</text>
  </g>
<g><rect class="note" x="845" y="260" width="745" height="160" rx="8" fill="#FAF5FF" stroke="#7C3AED" />
    <text class="noteTitle" x="871" y="305">LettuceCaches factory surface</text>
    <text class="noteLine" x="873" y="342">native: nearCache(), suspendNearCache()</text><text class="noteLine" x="873" y="370">JCache bridge: jcache(), suspendJCache(), nearJCache(), suspendNearJCache()</text><text class="noteLine" x="873" y="398">returns provider-neutral contracts where possible</text>
  </g>
<g><rect class="note" x="840" y="920" width="760" height="145" rx="8" fill="#F0FDF4" stroke="#16A34A" />
    <text class="noteTitle" x="866" y="965">JCache bridge remains separate</text>
    <text class="noteLine" x="868" y="1002">LettuceJCache stores entries in Redis hash fields</text><text class="noteLine" x="868" y="1030">NearJCache/SuspendNearJCache wrap the shared cache-core two-tier JCache types</text>
  </g>
<g><path class="edge dashed" d="M445 610 L445 450" stroke="#1D4ED8" marker-end="url(#triangle-blue)" />
    <text class="edgeLabel" x="470" y="532">implements</text></g>
<g><path class="edge dashed" d="M1995 610 L1995 450" stroke="#0F766E" marker-end="url(#triangle-teal)" />
    <text class="edgeLabel" x="2020" y="532">implements</text></g>
<g><path class="edge dashed" d="M780 735 L915 735" stroke="#C2410C" marker-end="url(#open-orange)" />
    <text class="edgeLabel" x="818" y="714">uses config</text></g>
<g><path class="edge dashed" d="M1660 735 L1525 735" stroke="#C2410C" marker-end="url(#open-orange)" />
    <text class="edgeLabel" x="1568" y="714">uses config</text></g>
<g><path class="edge dashed" d="M455 940 L455 1135" stroke="#15803D" marker-end="url(#open-green)" />
    <text class="edgeLabel" x="480" y="1040">L1 front</text></g>
<g><path class="edge dashed" d="M1220 850 L1640 850 L1640 1110 L1220 1110 L1220 1135" stroke="#475569" marker-end="url(#open-slate)" />
    <text class="edgeLabel" x="1666" y="982">L2 Redis</text></g>
<g><path class="edge dashed" d="M1995 940 L1995 1135" stroke="#BE185D" marker-end="url(#open-pink)" />
    <text class="edgeLabel" x="2020" y="1040">tracking</text></g>
<g><path class="edge dashed" d="M650 1260 L960 1260" stroke="#475569" marker-end="url(#open-slate)" />
    <text class="edgeLabel" x="758" y="1239">miss/write</text></g>
<g><path class="edge dashed" d="M1480 1260 L1770 1260" stroke="#BE185D" marker-end="url(#open-pink)" />
    <text class="edgeLabel" x="1596" y="1239">invalidate push</text></g>
<g><path class="edge dashed" d="M1770 1320 L1700 1320 L1700 1425 L650 1425 L650 1320" stroke="#15803D" marker-end="url(#open-green)" />
    <text class="edgeLabel" x="1143" y="1404">local invalidation</text></g>
</svg>
