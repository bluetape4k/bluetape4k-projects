    <text class="small" x="72.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">push invalidation</text>
  </g>
  <path class="connector" data-edge="tracking-&gt;caffeine" data-label="invalidates" d="M 1185 728 L 1135 728 L 1135 745 L 890 745 L 890 760" stroke="#DB7890"/>
  <g transform="translate(961.8,708)">
