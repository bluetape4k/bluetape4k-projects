<svg data-intent="Show the suspend Retrofit Result request flow backed by ResultCallAdapterFactory and ResultCall." data-evidence="io/retrofit2/README.md; ResultCallAdapterFactory.kt; ResultCall.kt; RetrofitCallSupport.kt; SuspendRetrofitCallSupport.kt" xmlns="http://www.w3.org/2000/svg" width="1680" height="1280" viewBox="0 0 1680 1280" role="img" aria-label="Suspend Result HTTP Request Flow">
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .actor{stroke-width:2}.actorTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.actorNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .lifeline{stroke:#A7B4C3;stroke-width:1.7;stroke-dasharray:8 8}.activation{stroke-width:1.5}
    .seq{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .alt{fill:#FFFFFF;fill-opacity:.12;stroke-width:2;stroke-dasharray:9 8}.altTitle{font-family:"Architects Daughter";font-size:20px;fill:#22344A}.altNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
  </style>
</defs>
<rect class="canvas" width="1680" height="1280"/>
<rect class="frame" x="30" y="28" width="1620" height="1224" rx="30"/>
<text class="title" x="70" y="86">Suspend Result HTTP Request Flow</text>
<text class="subtitle" x="74" y="118">Retrofit invokes the Result adapter once, then ResultCall maps every delegate outcome into a Kotlin Result.</text>

<g id="caller"><rect class="actor" x="116" y="166" width="210" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="actorTitle" x="221" y="204" text-anchor="middle">Coroutine caller</text><text class="actorNote" x="221" y="226" text-anchor="middle">business code</text><line class="lifeline" x1="221" y1="242" x2="221" y2="1192"/></g>
<g id="proxy"><rect class="actor" x="436" y="166" width="210" height="76" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="actorTitle" x="541" y="204" text-anchor="middle">Retrofit proxy</text><text class="actorNote" x="541" y="226" text-anchor="middle">suspend service</text><line class="lifeline" x1="541" y1="242" x2="541" y2="1192"/></g>
<g id="adapter"><rect class="actor" x="756" y="166" width="210" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="861" y="204" text-anchor="middle">Result adapter</text><text class="actorNote" x="861" y="226" text-anchor="middle">Call&lt;Result&lt;T&gt;&gt;</text><line class="lifeline" x1="861" y1="242" x2="861" y2="1192"/></g>
<g id="resultCall"><rect class="actor" x="1076" y="166" width="210" height="76" rx="10" fill="#F2EBFF" stroke="#755BC6"/><text class="actorTitle" x="1181" y="204" text-anchor="middle">ResultCall</text><text class="actorNote" x="1181" y="226" text-anchor="middle">maps responses</text><line class="lifeline" x1="1181" y1="242" x2="1181" y2="1192"/></g>
<g id="transport"><rect class="actor" x="1396" y="166" width="210" height="76" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="actorTitle" x="1501" y="204" text-anchor="middle">Transport Call</text><text class="actorNote" x="1501" y="226" text-anchor="middle">OkHttp / HC5 / Vert.x</text><line class="lifeline" x1="1501" y1="242" x2="1501" y2="1192"/></g>

<rect class="activation" x="213" y="302" width="16" height="812" rx="5" fill="#E8F3FF" stroke="#4F83BF"/>
<rect class="activation" x="533" y="348" width="16" height="704" rx="5" fill="#E9F7F6" stroke="#2E8F89"/>
<rect class="activation" x="853" y="406" width="16" height="136" rx="5" fill="#EAF7EF" stroke="#3E9868"/>
<rect class="activation" x="1173" y="462" width="16" height="492" rx="5" fill="#F2EBFF" stroke="#755BC6"/>
<rect class="activation" x="1493" y="552" width="16" height="228" rx="5" fill="#FFF5E6" stroke="#B9851B"/>

<g id="m1"><rect class="pill" x="272" y="286" width="218" height="28" rx="7"/><text class="label" x="381" y="304" text-anchor="middle">api.getUser(): Result&lt;User&gt;</text><path class="seq" d="M229 326 H541" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="pill" x="590" y="346" width="234" height="28" rx="7"/><text class="label" x="707" y="364" text-anchor="middle">select ResultCallAdapterFactory</text><path class="seq" d="M549 386 H861" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
<g id="m3"><rect class="pill" x="908" y="406" width="226" height="28" rx="7"/><text class="label" x="1021" y="424" text-anchor="middle">adapt(delegate Call&lt;T&gt;)</text><path class="seq" d="M869 446 H1181" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m4"><rect class="pill" x="1224" y="496" width="210" height="28" rx="7"/><text class="label" x="1329" y="514" text-anchor="middle">delegate.enqueue()</text><path class="seq" d="M1189 536 H1501" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>

<g id="success-branch">
  <rect class="alt" x="88" y="588" width="1504" height="154" rx="16" stroke="#3E9868"/>
  <rect class="pill" x="318" y="574" width="160" height="28" rx="7"/><text class="altTitle" x="398" y="594" text-anchor="middle">2xx success</text>
  <text class="altNote" x="514" y="616">ResultCall requires a non-null body for Result.success.</text>
  <rect class="pill" x="1228" y="628" width="198" height="28" rx="7"/><text class="label" x="1327" y="646" text-anchor="middle">onResponse(body)</text><path class="ret" d="M1501 674 H1181" stroke="#3E9868" marker-end="url(#arrow-green)"/>
  <rect class="pill" x="902" y="690" width="232" height="28" rx="7"/><text class="label" x="1018" y="708" text-anchor="middle">Result.success(body)</text><path class="ret" d="M1181 728 H541" stroke="#3E9868" marker-end="url(#arrow-green)"/>
</g>

<g id="http-branch">
  <rect class="alt" x="88" y="778" width="1504" height="154" rx="16" stroke="#C94D68"/>
  <rect class="pill" x="318" y="764" width="170" height="28" rx="7"/><text class="altTitle" x="403" y="784" text-anchor="middle">HTTP failure</text>
  <text class="altNote" x="526" y="806">Non-2xx responses become HttpException inside Result.failure.</text>
  <rect class="pill" x="1196" y="818" width="262" height="28" rx="7"/><text class="label" x="1327" y="836" text-anchor="middle">onResponse(isSuccessful=false)</text><path class="ret" d="M1501 864 H1181" stroke="#C94D68" marker-end="url(#arrow-pink)"/>
  <rect class="pill" x="874" y="880" width="288" height="28" rx="7"/><text class="label" x="1018" y="898" text-anchor="middle">Result.failure(HttpException)</text><path class="ret" d="M1181 918 H541" stroke="#C94D68" marker-end="url(#arrow-pink)"/>
</g>

<g id="network-branch">
  <rect class="alt" x="88" y="968" width="1504" height="154" rx="16" stroke="#B9851B"/>
  <rect class="pill" x="318" y="954" width="190" height="28" rx="7"/><text class="altTitle" x="413" y="974" text-anchor="middle">Network failure</text>
  <text class="altNote" x="546" y="996">Transport failures and null bodies are reported as failure Results.</text>
  <rect class="pill" x="1212" y="1008" width="230" height="28" rx="7"/><text class="label" x="1327" y="1026" text-anchor="middle">onFailure(throwable)</text><path class="ret" d="M1501 1054 H1181" stroke="#B9851B" marker-end="url(#arrow-amber)"/>
  <rect class="pill" x="858" y="1070" width="320" height="28" rx="7"/><text class="label" x="1018" y="1088" text-anchor="middle">Result.failure(IOException / null body)</text><path class="ret" d="M1181 1108 H541" stroke="#B9851B" marker-end="url(#arrow-amber)"/>
</g>

<g id="m-final"><rect class="pill" x="284" y="1138" width="194" height="28" rx="7"/><text class="label" x="381" y="1156" text-anchor="middle">return Result&lt;User&gt;</text><path class="ret" d="M541 1180 H221" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
</svg>
