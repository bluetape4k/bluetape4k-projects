<g id="adapter"><rect class="actor" x="756" y="166" width="210" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="861" y="204" text-anchor="middle">Result adapter</text><text class="actorNote" x="861" y="226" text-anchor="middle">Call&lt;Result&lt;T&gt;&gt;</text><line class="lifeline" x1="861" y1="242" x2="861" y2="1192"/></g>
