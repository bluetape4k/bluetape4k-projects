<svg data-intent="Explain geo utilities by separating public geocode/geohash/geoip APIs from provider adapters, spatial models, MaxMind readers, and external datasets." data-evidence="utils/geo/README.md; utils/geo/src/main/kotlin/io/bluetape4k/geocode; utils/geo/src/main/kotlin/io/bluetape4k/geohash; utils/geo/src/main/kotlin/io/bluetape4k/geoip" data-source-read="utils/geo/README.md; utils/geo/src/main/kotlin/io/bluetape4k/geocode; utils/geo/src/main/kotlin/io/bluetape4k/geohash; utils/geo/src/main/kotlin/io/bluetape4k/geoip" xmlns="http://www.w3.org/2000/svg" width="1500" height="892" viewBox="0 0 1500 892" role="img" aria-labelledby="title desc">
  <title id="title">Geo utilities architecture</title>
  <desc id="desc">Layered module overview for utils/geo showing geocode finders, Google and Bing adapters, GeoHash spatial indexing, GeoIP finders, MaxMind data, and provider APIs.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="892"/>
  <rect class="frame" x="34" y="30" width="1432" height="832" rx="28"/>
  <text class="title" x="72" y="88">Geo utilities architecture</text>
  <text class="subtitle" x="76" y="121">Geocode, GeoHash, and GeoIP APIs separated from provider adapters, local math, and external datasets.</text>

  <!-- README_LAYER_BANDS:START -->
  <g id="layer-public-api">
    <rect class="layer" x="128" y="166" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="160" y="209" dominant-baseline="middle">Public API</text>
    <g id="node-geocode" transform="translate(346,190)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Geocode API</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">Geocode, Address</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">sync and suspend finder</text>
    </g>
    <g id="node-geohash-api" transform="translate(722,190)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">GeoHash API</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">GeoHash, WGS84Point</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">BoundingBox queries</text>
    </g>
    <g id="node-geoip" transform="translate(1098,190)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">GeoIP API</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">GeoipFinder</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">city/country lookup</text>
    </g>
  </g>
  <g id="layer-adapter-layer">
    <rect class="layer" x="110" y="328" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="142" y="371" dominant-baseline="middle">Adapter layer</text>
    <g id="node-google" transform="translate(346,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Google Maps adapter</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">GoogleAddressFinder</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">GeoApiContext</text>
    </g>
    <g id="node-bing" transform="translate(722,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Bing Maps adapter</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">Feign client</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">coroutine Feign client</text>
    </g>
    <g id="node-maxmind-reader" transform="translate(1098,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">MaxMind reader</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">DatabaseReader extensions</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">Result wrappers</text>
    </g>
  </g>
  <g id="layer-spatial-model">
    <rect class="layer" x="110" y="490" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="142" y="533" dominant-baseline="middle">Spatial model</text>
    <g id="node-geohash-core" transform="translate(346,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">GeoHash core</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">base32 encoding</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">adjacent cells</text>
    </g>
    <g id="node-geo-queries" transform="translate(722,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EEF6D9" stroke="#8BA84D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Spatial queries</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">circle and bbox search</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">cells within radius</text>
    </g>
    <g id="node-geo-result" transform="translate(1098,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">GeoIP result model</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">Address</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">GeoLocation</text>
    </g>
  </g>
  <g id="layer-external-systems">
    <rect class="layer" x="72" y="652" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="104" y="695" dominant-baseline="middle">External systems</text>
    <g id="node-provider-http" transform="translate(346,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Provider HTTP APIs</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">Google Geocoding</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">Bing Locations</text>
    </g>
    <g id="node-geo-db" transform="translate(1098,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">GeoLite2 databases</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">City, Country, ASN</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">bundled mmdb files</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->

  <g id="route-geocode-google">
    <path class="connector" d="M484 276 L484 304 L484 304 L484 352" stroke="#D9AA4D"/>
  </g>
  <g id="route-geohash-api-geohash-core">
    <path class="connector" d="M756 276 L756 292 L694 292 L694 494 L612 494 L612 514" stroke="#58A978"/>
  </g>
  <g id="route-geohash-core-geo-queries">
    <path class="connector" d="M646 557 L722 557" stroke="#8BA84D"/>
  </g>
  <g id="route-geoip-maxmind-reader">
    <path class="connector" d="M1236 276 L1236 304 L1236 304 L1236 352" stroke="#45A7A1"/>
  </g>
  <g id="route-google-provider-http">
    <path class="connector" d="M496 438 L496 454 L318 454 L318 656 L496 656 L496 676" stroke="#D9AA4D"/>
  </g>
  <g id="route-maxmind-reader-geo-db">
    <path class="connector" d="M1260 438 L1260 464 L1426 464 L1426 656 L1260 656 L1260 676" stroke="#45A7A1"/>
  </g>
  <g data-footer-note="source-note"><rect x="140" y="816" width="1220" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="750" y="842" text-anchor="middle">Source: utils/geo README and geohash/GeoJSON helpers; shows providers, spatial queries, and dataset boundaries.</text></g>
</svg>
