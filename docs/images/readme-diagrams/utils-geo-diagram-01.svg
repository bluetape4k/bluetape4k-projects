<svg xmlns="http://www.w3.org/2000/svg" width="1770" height="1145" viewBox="0 0 1770 1145" role="img" aria-label="Geo Utilities Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1770" height="1145"/>
<rect class="frame" x="32" y="28" width="1706" height="1089" rx="30"/>
<text class="title" x="68" y="84">Geo Utilities Architecture</text>
<text class="subtitle" x="72" y="116">Geocode, GeoHash, and GeoIP APIs are separated from provider adapters, spatial models, and datasets.</text>
<g><rect class="panel" x="76" y="160" width="1620" height="170" rx="22"/><text class="panelTitle" x="100" y="194">Public API</text></g>
<g><rect class="panel" x="76" y="390" width="1620" height="170" rx="22"/><text class="panelTitle" x="100" y="424">Adapter layer</text></g>
<g><rect class="panel" x="76" y="620" width="1620" height="170" rx="22"/><text class="panelTitle" x="100" y="654">Spatial model</text></g>
<g><rect class="panel" x="76" y="850" width="1620" height="170" rx="22"/><text class="panelTitle" x="100" y="884">External systems</text></g>
<g id="geocode"><rect class="card" x="215" y="215" width="330" height="84" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="380" y="248" text-anchor="middle">Geocode API</text><text class="detail" x="380" y="284" text-anchor="middle">address and location lookup</text></g>
<g id="geohash"><rect class="card" x="725" y="215" width="330" height="84" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="890" y="248" text-anchor="middle">GeoHash API</text><text class="detail" x="890" y="284" text-anchor="middle">hash, bbox, neighbors</text></g>
<g id="geoip"><rect class="card" x="1235" y="215" width="330" height="84" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1400" y="248" text-anchor="middle">GeoIP API</text><text class="detail" x="1400" y="284" text-anchor="middle">city/country lookup</text></g>
<g id="maps"><rect class="card" x="300" y="445" width="460" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="530" y="470" text-anchor="middle">Map provider adapters</text><text class="detail" x="530" y="506" text-anchor="middle">GoogleAddressFinder / Bing</text>
<text class="detail" x="530" y="524" text-anchor="middle">client</text></g>
<g id="hashcore"><rect class="card" x="725" y="675" width="330" height="84" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="890" y="708" text-anchor="middle">GeoHash core</text><text class="detail" x="890" y="744" text-anchor="middle">base32 encoding and decoding</text></g>
<g id="queries"><rect class="card" x="1120" y="675" width="330" height="84" rx="14" fill="#EEF6D9" stroke="#8BA84D"/><text class="cardTitle" x="1285" y="708" text-anchor="middle">Spatial queries</text><text class="detail" x="1285" y="744" text-anchor="middle">circle and bbox search</text></g>
<g id="max"><rect class="card" x="1235" y="445" width="330" height="84" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1400" y="478" text-anchor="middle">MaxMind reader</text><text class="detail" x="1400" y="514" text-anchor="middle">DatabaseReader extensions</text></g>
<g id="providers"><rect class="card" x="300" y="905" width="460" height="84" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="530" y="938" text-anchor="middle">Provider HTTP APIs</text><text class="detail" x="530" y="974" text-anchor="middle">Google / Bing location data</text></g>
<g id="datasets"><rect class="card" x="1235" y="905" width="330" height="84" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1400" y="938" text-anchor="middle">GeoLite2 databases</text><text class="detail" x="1400" y="974" text-anchor="middle">bundled mmdb files</text></g>
<path class="flow" d="M380 299 L380 445" stroke="#4F83BF"/>
<path class="flow" d="M890 299 L890 675" stroke="#3E9868"/>
<path class="flow" d="M1400 299 L1400 445" stroke="#755BC6"/>
<path class="flow" d="M530 531 L530 905" stroke="#B9851B"/>
<path class="flow" d="M1400 529 L1400 560 L1605 560 L1605 947 L1565 947" stroke="#2E8F89"/>
<path class="flow" d="M1055 717 L1120 717" stroke="#3E9868"/>
<g><rect x="205" y="1062" width="1360" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="885" y="1088" text-anchor="middle">Architecture follows the JaVers-style layer stack: public APIs, adapters, spatial models, and external datasets.</text></g>
</svg>
