<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="957" viewBox="0 0 1500 957" role="img" aria-label="JDK25 Virtual Thread UML">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="957"/>
<rect class="frame" x="32" y="28" width="1436" height="901" rx="30"/>
<text class="title" x="68" y="84">JDK25 Virtual Thread UML</text>
<text class="subtitle" x="72" y="116">ServiceLoader binds Java 25 runtime and structured-task-scope providers to shared API contracts.</text>
<path class="dependency" data-from="ServiceLoader" data-to="Jdk25StructuredTaskScopeProvider" data-route-color="teal" d="M560 510 L323 510 L323 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ServiceLoader" data-to="Jdk25VirtualThreadRuntime" data-route-color="amber" d="M920 510 L1175 510 L1175 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="Jdk25StructuredTaskScopeProvider" data-to="StructuredTaskScopeProvider" data-route-color="teal" d="M455 631 L455 311" stroke="#2E8F89"/>
<path class="inherit" data-from="Jdk25VirtualThreadRuntime" data-to="VirtualThreadRuntime" data-route-color="amber" d="M1040 631 L1040 311" stroke="#B9851B"/>
<g id="StructuredTaskScopeProvider">
  <rect class="classCard" x="265" y="165" width="400" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="465" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="465" y="203" text-anchor="middle">StructuredTaskScope</text>
<text class="classTitle" x="465" y="225" text-anchor="middle">Provider</text>
  <line x1="265" y1="229" x2="665" y2="229" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="299" y="257">+providerName: String</text>
<text class="member" x="299" y="274">+priority: Int</text>
<text class="member" x="299" y="291">+isSupported() Boolean</text>
</g>
<g id="ServiceLoader">
  <rect class="classCard" x="560" y="398" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="740" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="740" y="445" text-anchor="middle">ServiceLoader</text>
  <line x1="560" y1="454" x2="920" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="594" y="491">+load(type) ServiceLoader</text>
<text class="member" x="594" y="508">+findFirst() Optional</text>
</g>
<g id="VirtualThreadRuntime">
  <rect class="classCard" x="855" y="165" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1035" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="1035" y="212" text-anchor="middle">VirtualThreadRuntime</text>
  <line x1="855" y1="221" x2="1215" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="889" y="253">+runtimeName: String</text>
<text class="member" x="889" y="270">+priority: Int</text>
<text class="member" x="889" y="287">+isSupported() Boolean</text>
</g>
<g id="Jdk25StructuredTaskScopeProvider">
  <rect class="classCard" x="265" y="631" width="360" height="156" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="445" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="445" y="669" text-anchor="middle">Jdk25StructuredTask</text>
<text class="classTitle" x="445" y="691" text-anchor="middle">ScopeProvider</text>
  <line x1="265" y1="695" x2="625" y2="695" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="299" y="728">+providerName = jdk25</text>
<text class="member" x="299" y="745">+priority = 25</text>
<text class="member" x="299" y="762">+withAll(name, factory, block) T</text>
</g>
<g id="Jdk25VirtualThreadRuntime">
  <rect class="classCard" x="855" y="631" width="380" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1045" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1045" y="678" text-anchor="middle">Jdk25VirtualThreadRuntime</text>
  <line x1="855" y1="687" x2="1235" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="889" y="719">+runtimeName = jdk25</text>
<text class="member" x="889" y="736">+priority = 25</text>
<text class="member" x="889" y="753">+isSupported() Boolean</text>
</g>
<g>
  <rect x="1085" y="849" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 867 L1161 867" stroke="#3E9868"/>
  <text class="detail" x="1175" y="872">inheritance / implementation</text>
  <path class="dependency" d="M1103 888 L1161 888" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="893">dependency / usage</text>
</g>
<g><rect x="180" y="867" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="893" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
