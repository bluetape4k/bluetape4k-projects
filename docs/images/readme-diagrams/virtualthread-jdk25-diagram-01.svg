<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="1000" viewBox="0 0 1366 1000" role="img" aria-label="UML">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1366" height="1000"/>
<rect class="frame" x="32" y="28" width="1302" height="944" rx="28"/>
<text class="title" x="66" y="82">UML</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="148" width="1256" height="297" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="176">Contract layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="531" width="1256" height="281" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="559">Abstraction layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M683 334 L683 496 L473 496 L473 563"/>
<path class="line" d="M683 334 L683 488 L893 488 L893 563"/>
<path class="implLine" d="M473 563 L473 480 L263 480 L263 413"/>
<path class="implLine" d="M893 563 L893 472 L1103 472 L1103 397"/>
<g transform="translate(88,180)">
  <rect class="card" x="0" y="0" width="350" height="233" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="56.5" text-anchor="middle">Structured Task Scope</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Provider</text>
  <text class="mono" x="18" y="124">+providerName: String</text>
<text class="mono" x="18" y="145">+priority: Int</text>
<text class="mono" x="18" y="166">+isSupported() Boolean</text>
<text class="mono" x="18" y="187">+withAll(name, factory, block) T</text>
<text class="mono" x="18" y="208">+withAny(name, factory, block) T</text>
</g>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
    <text class="label" x="175" y="49" text-anchor="middle">ServiceLoader</text>
  <text class="mono" x="18" y="108">+load(type) ServiceLoader</text>
<text class="mono" x="18" y="129">+findFirst() Optional</text>
</g>
<g transform="translate(928,180)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="61" text-anchor="middle">VirtualThreadRuntime</text>
  <text class="mono" x="18" y="108">+runtimeName: String</text>
<text class="mono" x="18" y="129">+priority: Int</text>
<text class="mono" x="18" y="150">+isSupported() Boolean</text>
<text class="mono" x="18" y="171">+threadFactory(prefix) ThreadFactory</text>
<text class="mono" x="18" y="192">+executorService() ExecutorService</text>
</g>
<g transform="translate(298,563)">
  <rect class="card" x="0" y="0" width="350" height="212" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#DC6B82"/>
    <text class="label" x="175" y="44.5" text-anchor="middle">Jdk25 Structured Task</text>
<text class="label" x="175" y="69.5" text-anchor="middle">Scope Provider</text>
  <text class="mono" x="18" y="124">+providerName = jdk25</text>
<text class="mono" x="18" y="145">+priority = 25</text>
<text class="mono" x="18" y="166">+withAll(name, factory, block) T</text>
<text class="mono" x="18" y="187">+withAny(name, factory, block) T</text>
</g>
<g transform="translate(718,563)">
  <rect class="card" x="0" y="0" width="350" height="217" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#45A7A1"/>
    <text class="label" x="175" y="49" text-anchor="middle">Jdk25VirtualThreadRuntime</text>
  <text class="mono" x="18" y="108">+runtimeName = jdk25</text>
<text class="mono" x="18" y="129">+priority = 25</text>
<text class="mono" x="18" y="150">+isSupported() Boolean</text>
<text class="mono" x="18" y="171">+threadFactory(prefix) ThreadFactory</text>
<text class="mono" x="18" y="192">+executorService() ExecutorService</text>
</g>
</svg>
