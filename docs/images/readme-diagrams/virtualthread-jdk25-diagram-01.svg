<rect class="frame" x="34" y="30" width="1632" height="840" rx="8" />
<text class="title" x="72" y="84">bluetape4k-virtualthread-jdk25</text>
<text class="subtitle" x="76" y="116">JDK 25 module wins runtime selection with priority 25 and adapts StructuredTaskScope.open Joiners.</text>

<text class="section" x="100" y="178">Runtime service entry</text>
<text class="section" x="860" y="178">Structured scope service entry</text>
<g id="serviceRuntime"><rect class="card" x="145" y="210" width="470" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="className" x="380" y="245" text-anchor="middle" dominant-baseline="middle">VirtualThreadRuntime service</text><text class="member" x="380" y="272" text-anchor="middle" dominant-baseline="middle">loads Jdk25VirtualThreadRuntime</text></g>
<g id="serviceProvider"><rect class="card" x="840" y="210" width="650" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="className" x="1165" y="245" text-anchor="middle" dominant-baseline="middle">StructuredTaskScopeProvider service</text><text class="member" x="1165" y="272" text-anchor="middle" dominant-baseline="middle">loads Jdk25StructuredTaskScopeProvider</text></g>

<g id="runtime"><rect class="card" x="160" y="400" width="440" height="132" rx="8" fill="#ECFDF5" stroke="#16A34A" /><text class="stereo" x="380" y="428" text-anchor="middle">final class</text><text class="className" x="380" y="458" text-anchor="middle">Jdk25VirtualThreadRuntime</text><line class="divider" x1="180" y1="476" x2="580" y2="476" /><text class="member" x="180" y="502">runtimeName = jdk25, priority = 25</text><text class="member" x="180" y="524">isSupported when Java feature &gt;= 25</text></g>
<g id="executor"><rect class="card" x="160" y="660" width="440" height="132" rx="8" fill="#FFF7ED" stroke="#D97706" /><text class="stereo" x="380" y="688" text-anchor="middle">JDK 25 virtual thread API</text><text class="className" x="380" y="718" text-anchor="middle">Virtual thread executor</text><line class="divider" x1="180" y1="736" x2="580" y2="736" /><text class="member" x="180" y="762">Thread.ofVirtual().name(prefix, 0)</text><text class="member" x="180" y="784">executor prefix vt25-</text></g>

<g id="provider"><rect class="card" x="890" y="390" width="580" height="160" rx="8" fill="#F0FDFA" stroke="#0D9488" /><text class="stereo" x="1180" y="418" text-anchor="middle">class</text><text class="className" x="1180" y="448" text-anchor="middle">Jdk25StructuredTaskScopeProvider</text><line class="divider" x1="910" y1="466" x2="1450" y2="466" /><text class="member" x="910" y="492">StructuredTaskScope.open(joiner, configure(name, factory))</text><text class="member" x="910" y="514">joinUntil uses interruptJoinUntil timeout bridge</text><text class="member" x="910" y="536">priority = 25, providerName = jdk25-structured-task-scope</text></g>

<g id="all"><rect class="card" x="700" y="670" width="310" height="150" rx="8" fill="#FFF7ED" stroke="#D97706" /><text class="className" x="855" y="706" text-anchor="middle">withAll</text><line class="divider" x1="720" y1="724" x2="990" y2="724" /><text class="member" x="720" y="750">Joiner.awaitAllSuccessfulOrThrow()</text><text class="member" x="720" y="772">wraps Jdk25AllScope</text><text class="member" x="720" y="794">stores join failure for throwIfFailed</text></g>
<g id="any"><rect class="card" x="1060" y="670" width="310" height="150" rx="8" fill="#EFF6FF" stroke="#2563EB" /><text class="className" x="1215" y="706" text-anchor="middle">withAny</text><line class="divider" x1="1080" y1="724" x2="1350" y2="724" /><text class="member" x="1080" y="750">Joiner.anySuccessfulResultOrThrow()</text><text class="member" x="1080" y="772">wraps Jdk25AnyScope</text><text class="member" x="1080" y="794">result maps join failure</text></g>
<g id="supervised"><rect class="card" x="1420" y="670" width="220" height="150" rx="8" fill="#FDF2F8" stroke="#DB2777" /><text class="className" x="1530" y="706" text-anchor="middle">withSupervised</text><line class="divider" x1="1440" y1="724" x2="1620" y2="724" /><text class="member" x="1440" y="750">Joiner.awaitAll()</text><text class="member" x="1440" y="772">keeps failures</text><text class="member" x="1440" y="794">returns Result list</text></g>

