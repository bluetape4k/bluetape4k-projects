<svg data-intent="Explain currency operation flow by showing MonetaryAmount inputs, currency/exchange-rate support, arithmetic/conversion helpers, rounding, and formatted output." data-evidence="utils/money/README.md; utils/money/src/main/kotlin/io/bluetape4k/money" data-source-read="utils/money/README.md; utils/money/src/main/kotlin/io/bluetape4k/money" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Currency Operation Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="8"/>
<text class="title" x="72" y="84">Currency Operation Flow</text>
<text class="subtitle" x="76" y="116">Money utilities convert caller amounts through currency/exchange/rounding support before returning monetary values or formatted text.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Inputs</text></g>
<g id="amount">
  <rect class="card" x="146" y="256" width="280" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="286" y="291" text-anchor="middle" dominant-baseline="middle">MonetaryAmount</text>
  <text class="detail" x="286" y="321" text-anchor="middle" dominant-baseline="middle">number + currency</text>
</g>
<g id="currency">
  <rect class="card" x="1074" y="256" width="280" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1214" y="291" text-anchor="middle" dominant-baseline="middle">CurrencyUnit</text>
  <text class="detail" x="1214" y="321" text-anchor="middle" dominant-baseline="middle">ISO code and scale</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Operations</text></g>
<g id="math">
  <rect class="card" x="146" y="574" width="280" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="286" y="609" text-anchor="middle" dominant-baseline="middle">Arithmetic helpers</text>
  <text class="detail" x="286" y="639" text-anchor="middle" dominant-baseline="middle">plus/minus/times/divide</text>
</g>
<g id="convert">
  <rect class="card" x="610" y="574" width="280" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Exchange conversion</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">rate provider boundary</text>
</g>
<g id="round">
  <rect class="card" x="1074" y="574" width="280" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1214" y="609" text-anchor="middle" dominant-baseline="middle">Rounding helpers</text>
  <text class="detail" x="1214" y="639" text-anchor="middle" dominant-baseline="middle">scale and monetary rounding</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Outputs</text></g>
<g id="money">
  <rect class="card" x="146" y="892" width="280" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="286" y="927" text-anchor="middle" dominant-baseline="middle">Monetary result</text>
  <text class="detail" x="286" y="957" text-anchor="middle" dominant-baseline="middle">converted or rounded amount</text>
</g>
<g id="format">
  <rect class="card" x="1074" y="892" width="280" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1214" y="927" text-anchor="middle" dominant-baseline="middle">Formatted text</text>
  <text class="detail" x="1214" y="957" text-anchor="middle" dominant-baseline="middle">localized display</text>
</g>
<path class="route" data-from="amount" data-to="math" d="M358 340 L358 574" stroke="#1D4ED8"/>
<path class="route" data-from="currency" data-to="convert" d="M1214 340 L1214 446 L750 446 L750 574" stroke="#15803D"/>
<path class="route" data-from="math" data-to="money" d="M286 658 L286 892" stroke="#0F766E"/>
<path class="route" data-from="convert" data-to="money" d="M750 658 L750 786 L336 786 L336 892" stroke="#C2410C"/>
<path class="route" data-from="round" data-to="money" d="M1214 658 L1214 798 L386 798 L386 892" stroke="#7E22CE"/>
<path class="route" data-from="money" data-to="format" d="M426 934 L1074 934" stroke="#BE185D"/>
</svg>
