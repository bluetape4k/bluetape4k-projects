      <text class="readmeLayerLabel" x="72" y="800">External layer</text>
    </g>
    <g id="readme-layer-6">
      <rect class="readmeLayerBand" x="54" y="914" width="1183" height="176" rx="18" fill="#FDECEF"/>
      <text class="readmeLayerLabel" x="72" y="942">External layer</text>
    </g>
    <g id="readme-layer-7">
