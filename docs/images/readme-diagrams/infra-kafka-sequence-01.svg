<svg xmlns="http://www.w3.org/2000/svg" width="2968" height="1366" viewBox="0 0 2968 1366" role="img" aria-label="Producer/Consumer Message Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2968" height="1366"/>
<rect class="frame" x="32" y="28" width="2904" height="1310" rx="28"/>
<text class="title" x="66" y="82">Producer/Consumer Message Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="374" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="524" y="198.5" text-anchor="middle">Suspend Kafka</text>
<text class="smallLabel" x="524" y="219.5" text-anchor="middle">Producer Template</text>
<line class="lifeline" x1="524" y1="252" x2="524" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="758" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="908" y="198.5" text-anchor="middle">Suspend Kafka</text>
<text class="smallLabel" x="908" y="219.5" text-anchor="middle">Consumer Template</text>
<line class="lifeline" x1="908" y1="252" x2="908" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1142" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1292" y="209" text-anchor="middle">Kafka Broker</text>
<line class="lifeline" x1="1292" y1="252" x2="1292" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1526" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1676" y="209" text-anchor="middle">Message Handler</text>
<line class="lifeline" x1="1676" y1="252" x2="1676" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1910" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2060" y="209" text-anchor="middle">-PT</text>
<line class="lifeline" x1="2060" y1="252" x2="2060" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2294" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2444" y="209" text-anchor="middle">-App</text>
<line class="lifeline" x1="2444" y1="252" x2="2444" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2678" y="166" width="300" height="72" rx="20" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="2828" y="209" text-anchor="middle">-CT</text>
<line class="lifeline" x1="2828" y1="252" x2="2828" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="209" y="286" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="227" y="313" text-anchor="start">1. send(topic, key, value)</text>
<path class="line" d="M140 344 L524 344"/>
<rect x="789" y="396" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="807" y="423" text-anchor="start">2. Publish ProducerRecord</text>
<path class="line" d="M524 454 L1292 454"/>
<rect x="1516.5" y="506" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1534.5" y="533" text-anchor="start">3. SenderResult (partition, offset)</text>
<path class="dashed" d="M1292 564 L2060 564"/>
<rect x="1377" y="616" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1395" y="643" text-anchor="start">4. Return SenderResult</text>
<path class="dashed" d="M524 674 L2444 674"/>
<rect x="985" y="726" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1003" y="753" text-anchor="start">5. ReceiverRecord stream</text>
<path class="line" d="M1292 784 L908 784"/>
<rect x="1169" y="836" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1187" y="863" text-anchor="start">6. Flow.collect { record }</text>
<path class="line" d="M908 894 L1676 894"/>
<rect x="1605" y="946" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1623" y="973" text-anchor="start">7. Process business logic</text>
<path class="line" d="M1676 1004 C1740 1004 1740 1038 1676 1038"/>
<rect x="1361" y="1076" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1379" y="1103" text-anchor="start">8. receiverOffset.commit()</text>
<path class="line" d="M1676 1134 L1292 1134"/>
<rect x="2145" y="1186" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="2163" y="1213" text-anchor="start">9. Processing complete</text>
<path class="dashed" d="M1676 1244 L2828 1244"/>
</svg>
