<g transform="translate(297,180)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">AwsEmulatorServer</text>
  <text class="mono" x="18" y="108">+awsEndpoint: URI</text>
<text class="mono" x="18" y="132">+awsAccessKey: String</text>
<text class="mono" x="18" y="156">+awsSecretKey: String</text>
<text class="mono" x="18" y="180">+regionName: String</text>
<text class="mono" x="18" y="204">+withServices(vararg services) AwsEmulatorServer</text>
</g>
