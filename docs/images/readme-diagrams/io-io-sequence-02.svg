<svg data-intent="Show the source-backed BinarySerializer serialize/deserialize flow and failure contract." data-evidence="io/io/README.md; BinarySerializer.kt; AbstractBinarySerializer.kt" xmlns="http://www.w3.org/2000/svg" width="1420" height="1060" viewBox="0 0 1420 1060" role="img" aria-label="serialize deserialize Flow">
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#C94D68"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .actor{stroke-width:2}.actorTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.actorNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .lifeline{stroke:#A7B4C3;stroke-width:1.7;stroke-dasharray:8 8}.activation{stroke-width:1.5}
    .seq{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .alt{fill:#FFFFFF;fill-opacity:.12;stroke-width:2;stroke-dasharray:9 8}.altTitle{font-family:"Architects Daughter";font-size:20px;fill:#22344A}.altNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
  </style>
</defs>
<rect class="canvas" width="1420" height="1060"/>
<rect class="frame" x="30" y="28" width="1360" height="1004" rx="30"/>
<text class="title" x="70" y="86">serialize/deserialize Flow</text>
<text class="subtitle" x="74" y="118">AbstractBinarySerializer owns null checks and wraps implementation failures in BinarySerializationException.</text>

<g id="caller"><rect class="actor" x="126" y="166" width="220" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="actorTitle" x="236" y="204" text-anchor="middle">Caller</text><text class="actorNote" x="236" y="226" text-anchor="middle">object / bytes</text><line class="lifeline" x1="236" y1="242" x2="236" y2="964"/></g>
<g id="abstract"><rect class="actor" x="600" y="166" width="220" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="710" y="204" text-anchor="middle">AbstractBinarySerializer</text><text class="actorNote" x="710" y="226" text-anchor="middle">contract guard</text><line class="lifeline" x1="710" y1="242" x2="710" y2="964"/></g>
<g id="implementation"><rect class="actor" x="1074" y="166" width="220" height="76" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="actorTitle" x="1184" y="204" text-anchor="middle">Concrete serializer</text><text class="actorNote" x="1184" y="226" text-anchor="middle">JDK / Kryo / Fory</text><line class="lifeline" x1="1184" y1="242" x2="1184" y2="964"/></g>

<rect class="activation" x="228" y="322" width="16" height="590" rx="5" fill="#E8F3FF" stroke="#4F83BF"/>
<rect class="activation" x="702" y="362" width="16" height="514" rx="5" fill="#EAF7EF" stroke="#3E9868"/>
<rect class="activation" x="1176" y="496" width="16" height="322" rx="5" fill="#E9F7F6" stroke="#2E8F89"/>

<g id="serialize">
  <rect class="alt" x="92" y="292" width="1236" height="284" rx="16" stroke="#3E9868"/>
  <rect class="pill" x="310" y="278" width="162" height="28" rx="7"/><text class="altTitle" x="391" y="298" text-anchor="middle">serialize</text>
  <text class="altNote" x="512" y="320">serialize(null) returns emptyByteArray; non-null graphs delegate to doSerialize().</text>
</g>
<g id="m1"><rect class="pill" x="328" y="344" width="248" height="28" rx="7"/><text class="label" x="452" y="362" text-anchor="middle">serialize(graph: Any?)</text><path class="seq" d="M244 386 H710" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="pill" x="802" y="404" width="218" height="28" rx="7"/><text class="label" x="911" y="422" text-anchor="middle">graph == null?</text><path class="seq" d="M718 452 H1010 V478 H728" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m3"><rect class="pill" x="322" y="474" width="208" height="28" rx="7"/><text class="label" x="426" y="492" text-anchor="middle">emptyByteArray</text><path class="ret" d="M710 514 H236" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
<g id="m4"><rect class="pill" x="856" y="514" width="202" height="28" rx="7"/><text class="label" x="957" y="532" text-anchor="middle">doSerialize(graph)</text><path class="seq" d="M718 556 H1184" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>

<g id="deserialize">
  <rect class="alt" x="92" y="628" width="1236" height="332" rx="16" stroke="#2E8F89"/>
  <rect class="pill" x="310" y="614" width="178" height="28" rx="7"/><text class="altTitle" x="399" y="634" text-anchor="middle">deserialize</text>
  <text class="altNote" x="530" y="656">deserialize(null/empty) returns null; other failures throw BinarySerializationException.</text>
</g>
<g id="m5"><rect class="pill" x="312" y="682" width="280" height="28" rx="7"/><text class="label" x="452" y="700" text-anchor="middle">deserialize(bytes: ByteArray?)</text><path class="seq" d="M244 724 H710" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m6"><rect class="pill" x="812" y="740" width="198" height="28" rx="7"/><text class="label" x="911" y="758" text-anchor="middle">null/empty => null</text><path class="ret" d="M710 792 H236" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
<g id="m7"><rect class="pill" x="848" y="804" width="218" height="28" rx="7"/><text class="label" x="957" y="822" text-anchor="middle">doDeserialize(bytes)</text><path class="seq" d="M718 848 H1184" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m8"><rect class="pill" x="842" y="868" width="230" height="28" rx="7"/><text class="label" x="957" y="886" text-anchor="middle">T? or wrapped exception</text><path class="ret" d="M1184 912 H710" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m9"><rect class="pill" x="330" y="880" width="244" height="28" rx="7"/><text class="label" x="452" y="898" text-anchor="middle">return T? / throw</text><path class="ret" d="M710 936 H236" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
</svg>
