<svg xmlns="http://www.w3.org/2000/svg" width="1468" height="1138" viewBox="0 0 1468 1138" role="img" aria-label="serialize/deserialize Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1468" height="1138"/>
<rect class="frame" x="32" y="28" width="1404" height="1082" rx="28"/>
<text class="title" x="66" y="82">serialize/deserialize Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="584" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="734" y="198.5" text-anchor="middle">Abstract Binary</text>
<text class="smallLabel" x="734" y="219.5" text-anchor="middle">Serializer</text>
<line class="lifeline" x1="734" y1="252" x2="734" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1088" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1238" y="198.5" text-anchor="middle">Implementation</text>
<text class="smallLabel" x="1238" y="219.5" text-anchor="middle">(e.g. Kryo Binary</text>
<line class="lifeline" x1="1238" y1="252" x2="1238" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="363" y="286" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="381" y="313" text-anchor="start">1. serialize(graph: Any?)</text>
<path class="line" d="M230 332 L734 332"/>
<rect x="160" y="396" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="423" text-anchor="start">ALT: graph == null</text>
<rect x="377" y="362" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="389" text-anchor="start">3. emptyByteArray</text>
<path class="dashed" d="M734 408 L230 408"/>
<rect x="160" y="574" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="601" text-anchor="start">ELSE: valid object</text>
<rect x="881" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="899" y="465" text-anchor="start">5. doSerialize(graph)</text>
<path class="line" d="M734 484 L1238 484"/>
<rect x="881" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="899" y="541" text-anchor="start">6. bytes: ByteArray</text>
<path class="dashed" d="M1238 560 L734 560"/>
<rect x="377" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="617" text-anchor="start">7. bytes</text>
<path class="dashed" d="M734 636 L230 636"/>
<rect x="331" y="666" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="349" y="693" text-anchor="start">8. deserialize(bytes: ByteArray?)</text>
<path class="line" d="M230 712 L734 712"/>
<rect x="160" y="1082" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1109" text-anchor="start">ALT: null or empty</text>
<rect x="377" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="769" text-anchor="start">10. null</text>
<path class="dashed" d="M734 788 L230 788"/>
<rect x="160" y="1260" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1287" text-anchor="start">ELSE: valid data</text>
<rect x="871" y="818" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="889" y="845" text-anchor="start">12. doDeserialize(bytes)</text>
<path class="line" d="M734 864 L1238 864"/>
<rect x="881" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="899" y="921" text-anchor="start">13. obj: T?</text>
<path class="dashed" d="M1238 940 L734 940"/>
<rect x="377" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="997" text-anchor="start">14. obj</text>
<path class="dashed" d="M734 1016 L230 1016"/>
</svg>
