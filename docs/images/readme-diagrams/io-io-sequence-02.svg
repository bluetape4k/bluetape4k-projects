<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1728" viewBox="0 0 1288 1728" role="img" aria-label="serialize/deserialize Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1288" height="1728"/>
<rect class="frame" x="32" y="28" width="1224" height="1672" rx="28"/>
<text class="title" x="66" y="82">serialize/deserialize Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1668" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="494" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="644" y="198.5" text-anchor="middle">Abstract Binary</text>
<text class="smallLabel" x="644" y="219.5" text-anchor="middle">Serializer</text>
<line class="lifeline" x1="644" y1="252" x2="644" y2="1668" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="998" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1148" y="198.5" text-anchor="middle">Implementation</text>
<text class="smallLabel" x="1148" y="219.5" text-anchor="middle">(e.g. Kryo Binary</text>
<line class="lifeline" x1="1148" y1="252" x2="1148" y2="1668" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="273" y="286" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="291" y="313" text-anchor="start">1. serialize(graph: Any?)</text>
<path class="line" d="M140 344 L644 344"/>
<rect x="70" y="396" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="423" text-anchor="start">ALT: graph == null</text>
<rect x="287" y="464" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="491" text-anchor="start">3. emptyByteArray</text>
<path class="dashed" d="M644 522 L140 522"/>
<rect x="70" y="574" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="601" text-anchor="start">ELSE: valid object</text>
<rect x="791" y="642" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="669" text-anchor="start">5. doSerialize(graph)</text>
<path class="line" d="M644 700 L1148 700"/>
<rect x="791" y="752" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="779" text-anchor="start">6. bytes: ByteArray</text>
<path class="dashed" d="M1148 810 L644 810"/>
<rect x="287" y="862" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="889" text-anchor="start">7. bytes</text>
<path class="dashed" d="M644 920 L140 920"/>
<rect x="241" y="972" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="259" y="999" text-anchor="start">8. deserialize(bytes: ByteArray?)</text>
<path class="line" d="M140 1030 L644 1030"/>
<rect x="70" y="1082" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1109" text-anchor="start">ALT: null or empty</text>
<rect x="287" y="1150" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="1177" text-anchor="start">10. null</text>
<path class="dashed" d="M644 1208 L140 1208"/>
<rect x="70" y="1260" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1287" text-anchor="start">ELSE: valid data</text>
<rect x="781" y="1328" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="799" y="1355" text-anchor="start">12. doDeserialize(bytes)</text>
<path class="line" d="M644 1386 L1148 1386"/>
<rect x="791" y="1438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="1465" text-anchor="start">13. obj: T?</text>
<path class="dashed" d="M1148 1496 L644 1496"/>
<rect x="287" y="1548" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="1575" text-anchor="start">14. obj</text>
<path class="dashed" d="M644 1606 L140 1606"/>
</svg>
