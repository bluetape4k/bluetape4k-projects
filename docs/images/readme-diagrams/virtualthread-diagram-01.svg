<svg data-intent="Explain virtual-thread implementation selection by showing the caller request, availability checks, JDK runtime branch, and selected scheduler/executor behavior." data-evidence="virtualthread/README.md; virtualthread/src/main/kotlin" data-source-read="virtualthread/README.md; virtualthread/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1560" height="1299" viewBox="0 0 1560 1299" role="img" aria-label="Virtual Thread Runtime Selection Flow">
