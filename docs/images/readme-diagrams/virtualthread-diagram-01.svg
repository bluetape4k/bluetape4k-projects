<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980" role="img" aria-labelledby="title desc">
  <title id="title">Virtual Thread Runtime Selection Flow</title>
  <desc id="desc">Decision flow for virtualthread runtime selection showing API entry, ServiceLoader provider discovery, Java 25 and Java 21 provider checks, and platform-thread fallback.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card-shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1520" height="980"/>
  <rect class="frame" x="34" y="30" width="1452" height="920" rx="28"/>
  <text class="title" x="72" y="88">Virtual Thread Runtime Selection Flow</text>
  <text class="subtitle" x="76" y="121">Application code calls the shared API; ServiceLoader chooses the highest compatible runtime and falls back safely.</text>

  <g id="group-selection">
    <rect class="group" x="76" y="154" width="1368" height="680" rx="18"/>
    <text class="groupTitle" x="106" y="172" dominant-baseline="middle">Runtime selection flow</text>
  </g>

  <path id="route-api-loader" class="connector" d="M760 287 L760 325" stroke="#4F83BF"/>
  <path id="route-loader-jdk25-check" class="connector" d="M760 407 L760 470" stroke="#58A978"/>
  <path id="route-jdk25-check-jdk25" class="connector" d="M945 535 L1100 535" stroke="#8A72D6"/>
  <g id="label-jdk25-check-jdk25" transform="translate(993,500)">
    <rect class="pill" x="0" y="0" width="46" height="24" rx="8"/>
    <text class="small" x="23" y="12" text-anchor="middle" dominant-baseline="middle">yes</text>
  </g>
  <path id="route-jdk25-check-jdk21-check" class="connector" d="M760 600 L760 650" stroke="#6B7D90"/>
  <g id="label-jdk25-check-jdk21-check" transform="translate(769,613)">
    <rect class="pill" x="0" y="0" width="42" height="24" rx="8"/>
    <text class="small" x="21" y="12" text-anchor="middle" dominant-baseline="middle">no</text>
  </g>
  <path id="route-jdk21-check-jdk21" class="connector" d="M945 715 L1100 715" stroke="#45A7A1"/>
  <g id="label-jdk21-check-jdk21" transform="translate(993,680)">
    <rect class="pill" x="0" y="0" width="46" height="24" rx="8"/>
    <text class="small" x="23" y="12" text-anchor="middle" dominant-baseline="middle">yes</text>
  </g>
  <path id="route-jdk21-check-fallback" class="connector" d="M575 715 L450 715" stroke="#D9AA4D"/>
  <g id="label-jdk21-check-fallback" transform="translate(489,680)">
    <rect class="pill" x="0" y="0" width="42" height="24" rx="8"/>
    <text class="small" x="21" y="12" text-anchor="middle" dominant-baseline="middle">no</text>
  </g>

  <g id="node-api" transform="translate(560,205)">
    <rect class="card-shape" x="0" y="0" width="400" height="82" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="200" y="22" text-anchor="middle" dominant-baseline="middle">Application calls VirtualThreads</text>
    <text class="detail" x="200" y="41" text-anchor="middle" dominant-baseline="middle">depends only on api module</text>
    <text class="detail" x="200" y="60" text-anchor="middle" dominant-baseline="middle">no implementation imports</text>
  </g>
  <g id="node-loader" transform="translate(560,325)">
    <rect class="card-shape" x="0" y="0" width="400" height="82" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="200" y="22" text-anchor="middle" dominant-baseline="middle">Load VirtualThreadRuntime providers</text>
    <text class="detail" x="200" y="41" text-anchor="middle" dominant-baseline="middle">ServiceLoader discovery</text>
    <text class="detail" x="200" y="60" text-anchor="middle" dominant-baseline="middle">priority-ordered candidates</text>
  </g>
  <g id="node-jdk25-check" transform="translate(575,470)">
    <polygon class="card-shape" points="185,0 370,65 185,130 0,65" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="185" y="55.5" text-anchor="middle" dominant-baseline="middle">JDK 25 provider usable?</text>
    <text class="detail" x="185" y="74.5" text-anchor="middle" dominant-baseline="middle">highest-priority runtime</text>
  </g>
  <g id="node-jdk25" transform="translate(1100,493)">
    <rect class="card-shape" x="0" y="0" width="270" height="84" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="135" y="23" text-anchor="middle" dominant-baseline="middle">JDK 25 runtime</text>
    <text class="detail" x="135" y="42" text-anchor="middle" dominant-baseline="middle">virtual threads + extras</text>
    <text class="detail" x="135" y="61" text-anchor="middle" dominant-baseline="middle">joinUntil deadline support</text>
  </g>
  <g id="node-jdk21-check" transform="translate(575,650)">
    <polygon class="card-shape" points="185,0 370,65 185,130 0,65" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="185" y="55.5" text-anchor="middle" dominant-baseline="middle">JDK 21 provider usable?</text>
    <text class="detail" x="185" y="74.5" text-anchor="middle" dominant-baseline="middle">standard virtual thread runtime</text>
  </g>
  <g id="node-jdk21" transform="translate(1100,673)">
    <rect class="card-shape" x="0" y="0" width="270" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="135" y="23" text-anchor="middle" dominant-baseline="middle">JDK 21 runtime</text>
    <text class="detail" x="135" y="42" text-anchor="middle" dominant-baseline="middle">Thread.ofVirtual</text>
    <text class="detail" x="135" y="61" text-anchor="middle" dominant-baseline="middle">StructuredTaskScope bridge</text>
  </g>
  <g id="node-fallback" transform="translate(150,673)">
    <rect class="card-shape" x="0" y="0" width="300" height="84" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="150" y="23" text-anchor="middle" dominant-baseline="middle">Platform thread fallback</text>
    <text class="detail" x="150" y="42" text-anchor="middle" dominant-baseline="middle">safe degradation</text>
    <text class="detail" x="150" y="61" text-anchor="middle" dominant-baseline="middle">works without virtual threads</text>
  </g>


</svg>
