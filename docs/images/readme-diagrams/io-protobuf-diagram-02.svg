  <text class="cardTitle" x="565" y="244" text-anchor="middle" dominant-baseline="middle">Date/time types</text>
  <text class="detail" x="565" y="274" text-anchor="middle" dominant-baseline="middle">LocalDate / LocalTime / LocalDateTime</text>
</g>
<g id="money">
