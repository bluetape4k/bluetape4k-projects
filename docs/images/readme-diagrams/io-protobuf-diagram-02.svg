  <text class="cardTitle" x="875" y="244" text-anchor="middle" dominant-baseline="middle">JavaMoney</text>
  <text class="detail" x="875" y="274" text-anchor="middle" dominant-baseline="middle">currency + units/nanos</text>
</g>
<g id="message">
  <rect class="card" x="1035" y="215" width="280" height="72" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1175" y="244" text-anchor="middle" dominant-baseline="middle">Message</text>
  <text class="detail" x="1175" y="274" text-anchor="middle" dominant-baseline="middle">generated protobuf message</text>
</g>
<g id="protoDuration">
  <rect class="card" x="130" y="500" width="250" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="255" y="532" text-anchor="middle" dominant-baseline="middle">Proto Duration</text>
  <text class="detail" x="255" y="562" text-anchor="middle" dominant-baseline="middle">seconds + nanos</text>
</g>
<g id="protoDate">
  <rect class="card" x="430" y="500" width="270" height="78" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="565" y="532" text-anchor="middle" dominant-baseline="middle">Proto Date/Time</text>
  <text class="detail" x="565" y="562" text-anchor="middle" dominant-baseline="middle">date, time, datetime</text>
</g>
<g id="protoMoney">
  <rect class="card" x="750" y="500" width="250" height="78" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="875" y="532" text-anchor="middle" dominant-baseline="middle">Proto Money</text>
  <text class="detail" x="875" y="562" text-anchor="middle" dominant-baseline="middle">currencyCode + units</text>
</g>
<g id="any">
  <rect class="card" x="1035" y="500" width="280" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1175" y="532" text-anchor="middle" dominant-baseline="middle">Proto Any</text>
  <text class="detail" x="1175" y="562" text-anchor="middle" dominant-baseline="middle">pack / unpack typed messages</text>
</g>
<g id="bytes">
  <rect class="card" x="560" y="775" width="310" height="72" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="715" y="804" text-anchor="middle" dominant-baseline="middle">ByteArray payload</text>
  <text class="detail" x="715" y="834" text-anchor="middle" dominant-baseline="middle">toByteArray / parseFrom</text>
</g>
<path class="route" data-from="duration" data-to="protoDuration" d="M255 287 L255 360 L330 360 L330 500" stroke="#1D4ED8"/>
<g><rect class="labelPill" x="355" y="363" width="130" height="26" rx="8"/><text class="detail" x="420" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#1D4ED8">toProto / toJava</text></g>
<path class="route" data-from="dateTime" data-to="protoDate" d="M565 287 L565 500" stroke="#15803D"/>
<g><rect class="labelPill" x="581" y="363" width="130" height="26" rx="8"/><text class="detail" x="646" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#15803D">toProto / toJava</text></g>
<path class="route" data-from="money" data-to="protoMoney" d="M875 287 L875 500" stroke="#C2410C"/>
<g><rect class="labelPill" x="891" y="363" width="130" height="26" rx="8"/><text class="detail" x="956" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#C2410C">toProto / toJava</text></g>
<path class="route" data-from="message" data-to="any" d="M1175 287 L1175 500" stroke="#7E22CE"/>
<g><rect class="labelPill" x="1203" y="363" width="70" height="26" rx="8"/><text class="detail" x="1238" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#7E22CE">pack</text></g>
<path class="route" data-from="any" data-to="bytes" d="M1175 578 L1175 675 L715 675 L715 775" stroke="#7E22CE"/>
<g><rect class="labelPill" x="900" y="637" width="100" height="26" rx="8"/><text class="detail" x="950" y="651" text-anchor="middle" dominant-baseline="middle" style="fill:#7E22CE">serialize</text></g>
<path class="route dashed" data-from="bytes" data-to="any" d="M870 810 L1260 810 L1260 578" stroke="#BE185D"/>
<g><rect class="labelPill" x="1009" y="772" width="122" height="26" rx="8"/><text class="detail" x="1070" y="786" text-anchor="middle" dominant-baseline="middle" style="fill:#BE185D">parse + unpack</text></g>
</svg>
