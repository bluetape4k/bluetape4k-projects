<svg data-intent="Show how the source-backed io/protobuf extensions convert JVM domain values into well-known Protobuf values and route generated messages through Any, ByteArray, and the serializer trust boundary." data-evidence="io/protobuf/README.md; io/protobuf/src/main/kotlin/io/bluetape4k/protobuf; io/protobuf/src/main/kotlin/io/bluetape4k/protobuf/serializers/ProtobufSerializer.kt" data-source-read="io/protobuf/README.md; io/protobuf/src/main/kotlin/io/bluetape4k/protobuf; io/protobuf/src/main/kotlin/io/bluetape4k/protobuf/serializers/ProtobufSerializer.kt" xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-label="Protobuf Type Conversion Flow">
<defs>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#FFFFFF;stroke:#D2DFEA;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A}.panelNote{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .card{stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .route{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.label{font-family:"Comic Mono";font-size:12px;font-weight:700}
    .labelBlue{fill:#4F83BF}.labelGreen{fill:#3E9868}.labelTeal{fill:#2E8F89}.labelAmber{fill:#B9851B}.labelPurple{fill:#755BC6}.labelPink{fill:#C94D68}
  </style>
</defs>
<rect class="canvas" width="1680" height="1080"/>
<rect class="frame" x="30" y="28" width="1620" height="1024" rx="30"/>
<text class="title" x="70" y="86">Protobuf Type Conversion Flow</text>
<text class="subtitle" x="74" y="118">JVM domain values convert to protobuf well-known types; messages cross binary boundaries through Any and ByteArray.</text>

<g id="domain"><rect class="panel" x="96" y="166" width="1488" height="170" rx="14"/><text class="panelTitle" x="126" y="207">JVM and generated-message inputs</text><text class="panelNote" x="126" y="234">Callers keep domain types until they need a protobuf value or binary storage payload.</text></g>
<g id="protobuf"><rect class="panel" x="96" y="430" width="1488" height="224" rx="14"/><text class="panelTitle" x="126" y="471">Protobuf value layer</text><text class="panelNote" x="126" y="498">Conversion support preserves protobuf field semantics instead of hiding them behind reflection.</text></g>
<g id="payload"><rect class="panel" x="96" y="748" width="1488" height="170" rx="14"/><text class="panelTitle" x="126" y="789">Binary payload boundary</text><text class="panelNote" x="126" y="816">Any.toByteArray is the raw Protobuf path; ProtobufSerializer adds allowlist validation and fallback handling.</text></g>

<g id="instant"><rect class="card" x="132" y="241" width="248" height="58" rx="9" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="256" y="276" text-anchor="middle">Instant / Date</text></g>
<g id="duration"><rect class="card" x="422" y="241" width="248" height="58" rx="9" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="546" y="276" text-anchor="middle">Java Duration</text></g>
<g id="datetime"><rect class="card" x="712" y="241" width="248" height="58" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="836" y="276" text-anchor="middle">Local date/time</text></g>
<g id="money"><rect class="card" x="1002" y="241" width="248" height="58" rx="9" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1126" y="276" text-anchor="middle">JavaMoney</text></g>
<g id="message"><rect class="card" x="1292" y="241" width="248" height="58" rx="9" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="1416" y="276" text-anchor="middle">ProtoMessage</text></g>

<g id="ptimestamp"><rect class="card" x="132" y="521" width="248" height="80" rx="9" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="256" y="555" text-anchor="middle">Proto Timestamp</text><text class="detail" x="256" y="581" text-anchor="middle">seconds + nanos</text></g>
<g id="pduration"><rect class="card" x="422" y="521" width="248" height="80" rx="9" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="546" y="555" text-anchor="middle">Proto Duration</text><text class="detail" x="546" y="581" text-anchor="middle">compare + arithmetic</text></g>
<g id="pdatetime"><rect class="card" x="712" y="521" width="248" height="80" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="836" y="555" text-anchor="middle">Proto Date/Time</text><text class="detail" x="836" y="581" text-anchor="middle">Date / Time / DateTime</text></g>
<g id="pmoney"><rect class="card" x="1002" y="521" width="248" height="80" rx="9" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1126" y="555" text-anchor="middle">Proto Money</text><text class="detail" x="1126" y="581" text-anchor="middle">currency + units/nanos</text></g>
<g id="any"><rect class="card" x="1292" y="521" width="248" height="80" rx="9" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="1416" y="555" text-anchor="middle">Proto Any</text><text class="detail" x="1416" y="581" text-anchor="middle">pack / unpack typeUrl</text></g>

<g id="bytes"><rect class="card" x="454" y="828" width="300" height="62" rx="9" fill="#FFF0F4" stroke="#C94D68"/><text class="cardTitle" x="604" y="865" text-anchor="middle">ByteArray payload</text></g>
<g id="serializer"><rect class="card" x="842" y="814" width="382" height="90" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="1033" y="850" text-anchor="middle">ProtobufSerializer boundary</text><text class="detail" x="1033" y="878" text-anchor="middle">Any + allowlist, else Kryo fallback</text></g>

