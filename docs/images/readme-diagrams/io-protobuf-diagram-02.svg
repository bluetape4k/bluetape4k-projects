  <text class="cardTitle" x="875" y="244" text-anchor="middle" dominant-baseline="middle">JavaMoney</text>
  <text class="detail" x="875" y="274" text-anchor="middle" dominant-baseline="middle">currency + units/nanos</text>
</g>
<g id="message">
  <rect class="card" x="1035" y="215" width="280" height="72" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1175" y="244" text-anchor="middle" dominant-baseline="middle">Message</text>
  <text class="detail" x="1175" y="274" text-anchor="middle" dominant-baseline="middle">generated protobuf message</text>
</g>
<g id="protoDuration">
  <rect class="card" x="130" y="500" width="250" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="255" y="532" text-anchor="middle" dominant-baseline="middle">Proto Duration</text>
  <text class="detail" x="255" y="562" text-anchor="middle" dominant-baseline="middle">seconds + nanos</text>
</g>
<g id="protoDate">
  <rect class="card" x="430" y="500" width="270" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="565" y="532" text-anchor="middle" dominant-baseline="middle">Proto Date/Time</text>
  <text class="detail" x="565" y="562" text-anchor="middle" dominant-baseline="middle">date, time, datetime</text>
</g>
<g id="protoMoney">
  <rect class="card" x="750" y="500" width="250" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="875" y="532" text-anchor="middle" dominant-baseline="middle">Proto Money</text>
  <text class="detail" x="875" y="562" text-anchor="middle" dominant-baseline="middle">currencyCode + units</text>
</g>
<g id="any">
  <rect class="card" x="1035" y="500" width="280" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1175" y="532" text-anchor="middle" dominant-baseline="middle">Proto Any</text>
  <text class="detail" x="1175" y="562" text-anchor="middle" dominant-baseline="middle">pack / unpack typed messages</text>
</g>
<g id="bytes">
  <rect class="card" x="560" y="775" width="310" height="72" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="715" y="804" text-anchor="middle" dominant-baseline="middle">ByteArray payload</text>
  <text class="detail" x="715" y="834" text-anchor="middle" dominant-baseline="middle">toByteArray / parseFrom</text>
</g>
