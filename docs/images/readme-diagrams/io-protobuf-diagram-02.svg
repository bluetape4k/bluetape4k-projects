<g><rect class="labelPill" x="581" y="363" width="130" height="26" rx="8"/><text class="detail" x="646" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#3E9868">toProto / toJava</text></g>
<path class="route" data-from="money" data-to="protoMoney" d="M875 287 L875 500" stroke="#B9851B"/>
<g><rect class="labelPill" x="891" y="363" width="130" height="26" rx="8"/><text class="detail" x="956" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#B9851B">toProto / toJava</text></g>
<path class="route" data-from="message" data-to="any" d="M1175 287 L1175 500" stroke="#755BC6"/>
<g><rect class="labelPill" x="1203" y="363" width="70" height="26" rx="8"/><text class="detail" x="1238" y="377" text-anchor="middle" dominant-baseline="middle" style="fill:#755BC6">pack</text></g>
<path class="route" data-from="any" data-to="bytes" d="M1175 578 L1175 675 L715 675 L715 775" stroke="#755BC6"/>
<g><rect class="labelPill" x="900" y="637" width="100" height="26" rx="8"/><text class="detail" x="950" y="651" text-anchor="middle" dominant-baseline="middle" style="fill:#755BC6">serialize</text></g>
<path class="route dashed" data-from="bytes" data-to="any" d="M870 810 L1260 810 L1260 578" stroke="#C94D68"/>
<g><rect class="labelPill" x="1009" y="772" width="122" height="26" rx="8"/><text class="detail" x="1070" y="786" text-anchor="middle" dominant-baseline="middle" style="fill:#C94D68">parse + unpack</text></g>
