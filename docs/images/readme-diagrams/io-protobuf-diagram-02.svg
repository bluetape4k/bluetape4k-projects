<svg data-intent="Show current Protobuf conversion and serialization flow from io/protobuf source." data-evidence="TimestampSupport.kt; DurationSupport.kt; DateTimeSupport.kt; MoneySupport.kt; MessageSupport.kt; ProtobufSerializer.kt" xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-label="Protobuf Type Conversion Flow">
<defs>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#FFFFFF;stroke:#D2DFEA;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A}.panelNote{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .card{stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .route{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}
  </style>
</defs>
<rect class="canvas" width="1680" height="1080"/>
<rect class="frame" x="30" y="28" width="1620" height="1024" rx="30"/>
<text class="title" x="70" y="86">Protobuf Type Conversion Flow</text>
<text class="subtitle" x="74" y="118">JVM domain values convert to protobuf well-known types; messages cross binary boundaries through Any and ByteArray.</text>

<g id="domain"><rect class="panel" x="96" y="166" width="1488" height="170" rx="14"/><text class="panelTitle" x="126" y="207">JVM and generated-message inputs</text><text class="panelNote" x="126" y="234">Callers keep domain types until they need a protobuf value or binary storage payload.</text></g>
<g id="protobuf"><rect class="panel" x="96" y="430" width="1488" height="224" rx="14"/><text class="panelTitle" x="126" y="471">Protobuf value layer</text><text class="panelNote" x="126" y="498">Conversion support preserves protobuf field semantics instead of hiding them behind reflection.</text></g>
<g id="payload"><rect class="panel" x="96" y="748" width="1488" height="170" rx="14"/><text class="panelTitle" x="126" y="789">Binary payload boundary</text><text class="panelNote" x="126" y="816">Any.toByteArray is the raw Protobuf path; ProtobufSerializer adds allowlist validation and fallback handling.</text></g>

<g id="instant"><rect class="card" x="132" y="256" width="248" height="58" rx="9" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="256" y="291" text-anchor="middle">Instant / Date</text></g>
<g id="duration"><rect class="card" x="422" y="256" width="248" height="58" rx="9" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="546" y="291" text-anchor="middle">Java Duration</text></g>
<g id="datetime"><rect class="card" x="712" y="256" width="248" height="58" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="836" y="291" text-anchor="middle">Local date/time</text></g>
<g id="money"><rect class="card" x="1002" y="256" width="248" height="58" rx="9" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1126" y="291" text-anchor="middle">JavaMoney</text></g>
<g id="message"><rect class="card" x="1292" y="256" width="248" height="58" rx="9" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="1416" y="291" text-anchor="middle">ProtoMessage</text></g>

<g id="ptimestamp"><rect class="card" x="132" y="536" width="248" height="80" rx="9" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="256" y="570" text-anchor="middle">Proto Timestamp</text><text class="detail" x="256" y="596" text-anchor="middle">seconds + nanos</text></g>
<g id="pduration"><rect class="card" x="422" y="536" width="248" height="80" rx="9" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="546" y="570" text-anchor="middle">Proto Duration</text><text class="detail" x="546" y="596" text-anchor="middle">compare + arithmetic</text></g>
<g id="pdatetime"><rect class="card" x="712" y="536" width="248" height="80" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="836" y="570" text-anchor="middle">Proto Date/Time</text><text class="detail" x="836" y="596" text-anchor="middle">Date / TimeOfDay / DateTime</text></g>
<g id="pmoney"><rect class="card" x="1002" y="536" width="248" height="80" rx="9" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1126" y="570" text-anchor="middle">Proto Money</text><text class="detail" x="1126" y="596" text-anchor="middle">currency + units/nanos</text></g>
<g id="any"><rect class="card" x="1292" y="536" width="248" height="80" rx="9" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="1416" y="570" text-anchor="middle">Proto Any</text><text class="detail" x="1416" y="596" text-anchor="middle">pack / unpack typeUrl</text></g>

<g id="bytes"><rect class="card" x="650" y="828" width="300" height="62" rx="9" fill="#FFF0F4" stroke="#C94D68"/><text class="cardTitle" x="800" y="865" text-anchor="middle">ByteArray payload</text></g>
<g id="serializer"><rect class="card" x="1038" y="814" width="382" height="90" rx="9" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="1229" y="850" text-anchor="middle">ProtobufSerializer boundary</text><text class="detail" x="1229" y="878" text-anchor="middle">Any + allowlist, else Kryo fallback</text></g>

<path class="route" d="M256 314 V536" stroke="#4F83BF"/><path d="M256 536 l-7 -12 h14 z" fill="#4F83BF"/>
<path class="route" d="M546 314 V536" stroke="#3E9868"/><path d="M546 536 l-7 -12 h14 z" fill="#3E9868"/>
<path class="route" d="M836 314 V536" stroke="#2E8F89"/><path d="M836 536 l-7 -12 h14 z" fill="#2E8F89"/>
<path class="route" d="M1126 314 V536" stroke="#B9851B"/><path d="M1126 536 l-7 -12 h14 z" fill="#B9851B"/>
<path class="route" d="M1416 314 V536" stroke="#755BC6"/><path d="M1416 536 l-7 -12 h14 z" fill="#755BC6"/>

<rect class="pill" x="212" y="390" width="88" height="30" rx="8"/><text class="label" x="256" y="410" text-anchor="middle">to/from</text>
<rect class="pill" x="502" y="390" width="88" height="30" rx="8"/><text class="label" x="546" y="410" text-anchor="middle">to/from</text>
<rect class="pill" x="792" y="390" width="88" height="30" rx="8"/><text class="label" x="836" y="410" text-anchor="middle">to/from</text>
<rect class="pill" x="1082" y="390" width="88" height="30" rx="8"/><text class="label" x="1126" y="410" text-anchor="middle">to/from</text>
<rect class="pill" x="1368" y="390" width="96" height="30" rx="8"/><text class="label" x="1416" y="410" text-anchor="middle">pack/unpack</text>

<path class="route" d="M1416 616 V720 H800 V828" stroke="#755BC6"/><path d="M800 828 l-7 -12 h14 z" fill="#755BC6"/>
<path class="route dash" d="M950 859 H1000 V946 H1510 V616 H1416" stroke="#C94D68"/><path d="M1416 616 l12 -7 v14 z" fill="#C94D68"/>
<path class="route" d="M1416 616 V740 H1229 V814" stroke="#2E8F89"/><path d="M1229 814 l-7 -12 h14 z" fill="#2E8F89"/>
<path class="route" d="M1229 904 V960 H800 V890" stroke="#2E8F89"/><path d="M800 890 l-7 12 h14 z" fill="#2E8F89"/>
<rect class="pill" x="942" y="690" width="110" height="30" rx="8"/><text class="label" x="997" y="710" text-anchor="middle">serialize</text>
<rect class="pill" x="1370" y="908" width="112" height="30" rx="8"/><text class="label" x="1426" y="928" text-anchor="middle">parse + unpack</text>
<rect class="pill" x="1264" y="690" width="148" height="30" rx="8"/><text class="label" x="1338" y="710" text-anchor="middle">allowlist check</text>
</svg>
