<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1223" viewBox="0 0 2500 1223" role="img" aria-label="Jackson2 Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F3F7FB;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .ioPillText{font-family:"Comic Mono";font-size:13px;fill:#22344A}
    .inherit{fill:none;stroke-width:2.45;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .labelPill{fill:#fff;stroke-width:1.2}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2500" height="1223"/>
<rect class="frame" x="32" y="28" width="2436" height="1167" rx="30"/>
<text class="title" x="68" y="84">Jackson2 Class Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model: contracts first, core mapper support second, format adapters at the edge.</text>
<path class="inherit" data-from="jacksonSerializer" data-to="jsonSerializer" data-route-color="green" d="M991 556 L991 368" stroke="#3E9868"/>
<path class="dependency" data-from="jacksonSerializer" data-to="objectMapper" data-route-color="amber" d="M1156 622 L1343 622" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="textSerializers" data-to="jacksonSerializer" data-route-color="teal" d="M475 875 L475 764 L899 764 L899 688" stroke="#2E8F89"/>
<path class="inherit" data-from="binarySerializers" data-to="jacksonSerializer" data-route-color="amber" d="M991 875 L991 688" stroke="#B9851B"/>
<path class="dependency" data-from="jackson" data-to="objectMapper" data-route-color="olive" d="M1508 368 L1508 556" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="mapperSupport" data-to="objectMapper" data-route-color="indigo" d="M1860 334 L1767 334 L1767 590 L1673 590" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="uuidCryptoMask" data-to="objectMapper" data-route-color="coral" d="M1508 875 L1508 688" stroke="#C8644B" stroke-dasharray="8 7"/>
<g id="jsonSerializer">
  <rect class="classCard" x="826" y="236" width="330" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="991" y="255" text-anchor="middle">interface</text>
  <text class="classTitle" x="991" y="283" text-anchor="middle">JsonSerializer</text>
  <line x1="826" y1="292" x2="1156" y2="292" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="844" y="326">+serialize(graph)</text>
<text class="member" x="844" y="343">+deserialize(bytes, clazz)</text>
</g>
<g id="jacksonSerializer">
  <rect class="classCard" x="826" y="556" width="330" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="991" y="575" text-anchor="middle">open class</text>
  <text class="classTitle" x="991" y="603" text-anchor="middle">JacksonSerializer</text>
  <line x1="826" y1="612" x2="1156" y2="612" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="844" y="646">implements JsonSerializer</text>
<text class="member" x="844" y="663">uses ObjectMapper</text>
</g>
<g id="jackson">
  <rect class="classCard" x="1343" y="236" width="330" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1508" y="255" text-anchor="middle">object</text>
  <text class="classTitle" x="1508" y="283" text-anchor="middle">Jackson</text>
  <line x1="1343" y1="292" x2="1673" y2="292" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1361" y="326">defaultJsonMapper</text>
<text class="member" x="1361" y="343">createTypedJsonMapper(...)</text>
</g>
<g id="mapperSupport">
  <rect class="classCard" x="1860" y="236" width="330" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="2025" y="255" text-anchor="middle">extension file</text>
  <text class="classTitle" x="2025" y="283" text-anchor="middle">JsonMapperSupport</text>
  <line x1="1860" y1="292" x2="2190" y2="292" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1878" y="326">jsonMapper { ... }</text>
<text class="member" x="1878" y="343">ObjectMapper read/write helpers</text>
</g>
<g id="objectMapper">
  <rect class="classCard" x="1343" y="556" width="330" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1508" y="575" text-anchor="middle">Jackson core type</text>
  <text class="classTitle" x="1508" y="594" text-anchor="middle">ObjectMapper /</text>
<text class="classTitle" x="1508" y="616" text-anchor="middle">JsonMapper</text>
  <line x1="1343" y1="620" x2="1673" y2="620" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1361" y="650">readValue/writeValue</text>
<text class="member" x="1361" y="667">module registration</text>
</g>
<g id="textSerializers">
  <rect class="classCard" x="310" y="875" width="330" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="475" y="894" text-anchor="middle">text adapters</text>
  <text class="classTitle" x="475" y="913" text-anchor="middle">CSV/YAML/TOML</text>
<text class="classTitle" x="475" y="935" text-anchor="middle">serializers</text>
  <line x1="310" y1="939" x2="640" y2="939" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="328" y="969">extend JacksonSerializer</text>
<text class="member" x="328" y="986">format-specific mappers</text>
</g>
<g id="binarySerializers">
  <rect class="classCard" x="826" y="875" width="330" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="991" y="894" text-anchor="middle">binary adapters</text>
  <text class="classTitle" x="991" y="913" text-anchor="middle">CBOR/Ion/Smile</text>
<text class="classTitle" x="991" y="935" text-anchor="middle">serializers</text>
  <line x1="826" y1="939" x2="1156" y2="939" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="844" y="969">extend JacksonSerializer</text>
<text class="member" x="844" y="986">binary dataformats</text>
</g>
<g id="uuidCryptoMask">
  <rect class="classCard" x="1343" y="875" width="330" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1508" y="894" text-anchor="middle">Jackson modules</text>
  <text class="classTitle" x="1508" y="913" text-anchor="middle">UUID/Crypto/Mask</text>
<text class="classTitle" x="1508" y="935" text-anchor="middle">modules</text>
  <line x1="1343" y1="939" x2="1673" y2="939" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1361" y="969">custom serializers</text>
<text class="member" x="1361" y="986">contextual handlers</text>
</g>
<g>
  <rect x="2085" y="1115" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M2103 1133 L2161 1133" stroke="#3E9868"/>
  <text class="detail" x="2175" y="1138">inheritance / implementation</text>
  <path class="dependency" d="M2103 1154 L2161 1154" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="2175" y="1159">dependency / usage</text>
</g>
<g><rect x="180" y="1133" width="1860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1110" y="1159" text-anchor="middle">bluetape4k-projects / io modules - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
