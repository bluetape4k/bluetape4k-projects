<g><rect class="panel" x="82" y="385" width="1276" height="220" rx="8"/><text class="panelTitle" x="110" y="421" dominant-baseline="middle">Coroutine controller contract</text></g>
<g><rect class="panel" x="82" y="680" width="1276" height="180" rx="8"/><text class="panelTitle" x="110" y="716" dominant-baseline="middle">Client and test helpers</text></g>
<g><rect class="panel" x="82" y="935" width="1276" height="120" rx="8"/><text class="panelTitle" x="110" y="971" dominant-baseline="middle">Runtime boundary</text></g>
