<rect class="canvas" width="1440" height="1135"/>
<rect class="frame" x="34" y="30" width="1372" height="1075" rx="8"/>
<text class="title" x="72" y="84">Spring WebFlux + Coroutines Request Model</text>
<text class="subtitle" x="76" y="116">The source-backed model separates WebFlux entry, coroutine controller scope choices, helper clients, and runtime exits.</text>
