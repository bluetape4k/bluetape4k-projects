<svg data-intent="Replace the generic WebFlux candy-chain with the actual coroutine WebFlux request model: HTTP enters WebFlux, controllers choose Default/IO/VT coroutine scopes, WebClient/WebTestClient helpers adapt request bodies, and Reactor/Flow bridges carry responses." data-evidence="spring-boot/core/README.md; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/webflux/controller; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/tests/WebClientExtensions.kt; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/tests/WebTestClientExtensions.kt" data-source-read="spring-boot/core/README.md; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/webflux/controller; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/tests/WebClientExtensions.kt; spring-boot/core/src/main/kotlin/io/bluetape4k/spring/tests/WebTestClientExtensions.kt" xmlns="http://www.w3.org/2000/svg" width="1440" height="1135" viewBox="0 0 1440 1135" role="img" aria-label="Spring WebFlux + Coroutines Request Model">
<defs>
