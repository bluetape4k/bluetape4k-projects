<rect class="canvas" width="3000" height="1960"/>
<rect class="frame" x="36" y="30" width="2928" height="1900" rx="8"/>
<text class="title" x="76" y="100">All Algorithms at a Glance</text>
<text class="subtitle" x="80" y="134">Pick by output type, ordering, distribution model, and representation constraints.</text>
<g>
  <rect class="band" x="90" y="300" width="2820" height="360" rx="8"/>
  <text class="sectionTitle" x="116" y="346">Long output: sorted numeric identifiers</text>
  <text class="bandSub" x="116" y="376">Use when storage wants compact numeric IDs and ordering.</text>
</g>
<g>
  <rect class="band" x="90" y="720" width="2820" height="360" rx="8"/>
  <text class="sectionTitle" x="116" y="766">UUID output: standard 128-bit identifiers</text>
  <text class="bandSub" x="116" y="796">Use when database and ecosystem tooling already expect UUID.</text>
</g>
<g>
  <rect class="band" x="90" y="1140" width="2820" height="360" rx="8"/>
  <text class="sectionTitle" x="116" y="1186">String output: lexicographic and URL-safe IDs</text>
  <text class="bandSub" x="116" y="1216">Use when IDs travel through URLs, logs, queues, or public APIs.</text>
</g>
<g>
  <rect class="band" x="90" y="1560" width="2820" height="300" rx="8"/>
  <text class="sectionTitle" x="116" y="1606">Encoding and obfuscation helpers</text>
  <text class="bandSub" x="116" y="1636">Use only when representation, not uniqueness generation, is the concern.</text>
</g>

<g id="Contract">
  <rect class="card" x="660" y="150" width="1680" height="140" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="badge" x="682" y="180">unified API</text>
  <text class="cardTitle" x="682" y="218">IdGenerator&lt;T&gt; is the common surface</text>
  <path class="divider" d="M660 240H2340" stroke="#475569"/>
  <text class="body" x="682" y="274">nextId(), nextIdAsString(), nextIds(size), nextIdsAsString(size)</text>

</g>
<g id="Snowflake">
  <rect class="card" x="170" y="405" width="760" height="220" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="badge" x="192" y="435">Long | sortable | 19 digits</text>
  <text class="cardTitle" x="192" y="473">Snowflakers.Default</text>
  <path class="divider" d="M170 495H930" stroke="#1D4ED8"/>
  <text class="body" x="192" y="529">distributed env per-machine IDs</text>
<text class="body" x="192" y="553">timestamp + machineId + sequence</text>
<text class="body" x="192" y="577">up to 4,096 IDs/ms/machine</text>

</g>
<g id="GlobalSnowflake">
  <rect class="card" x="1120" y="405" width="760" height="220" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="badge" x="1142" y="435">Long | sortable | 19 digits</text>
  <text class="cardTitle" x="1142" y="473">Snowflakers.Global</text>
  <path class="divider" d="M1120 495H1880" stroke="#0F766E"/>
  <text class="body" x="1142" y="529">centralized/global sequencer</text>
<text class="body" x="1142" y="553">1 ms capacity: 4096 * 1024</text>
<text class="body" x="1142" y="577">same LongIdGenerator-friendly output</text>

</g>
<g id="LongAdapter">
  <rect class="card" x="2070" y="405" width="760" height="220" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="badge" x="2092" y="435">contract</text>
  <text class="cardTitle" x="2092" y="473">LongIdGenerator</text>
  <path class="divider" d="M2070 495H2830" stroke="#15803D"/>
  <text class="body" x="2092" y="529">IdGenerator&lt;Long&gt;</text>
<text class="body" x="2092" y="553">base36 nextIdAsString()</text>
<text class="body" x="2092" y="577">bulk Long sequence helpers</text>

</g>
<g id="UuidSortable">
  <rect class="card" x="170" y="825" width="760" height="220" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="badge" x="192" y="855">UUID | sortable | 36 chars</text>
  <text class="cardTitle" x="192" y="893">Uuid.V7 / V6 / V1</text>
  <path class="divider" d="M170 915H930" stroke="#6D28D9"/>
  <text class="body" x="192" y="949">DB primary key sorting: prefer V7</text>
<text class="body" x="192" y="973">V6: reordered timestamp</text>
<text class="body" x="192" y="997">V1: MAC + Gregorian timestamp</text>

</g>
<g id="UuidRandom">
  <rect class="card" x="1120" y="825" width="760" height="220" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="badge" x="1142" y="855">UUID | non-sortable or deterministic</text>
  <text class="cardTitle" x="1142" y="893">Uuid.V4 / V5</text>
  <path class="divider" d="M1120 915H1880" stroke="#BE185D"/>
  <text class="body" x="1142" y="949">V4: SecureRandom-style fully random</text>
<text class="body" x="1142" y="973">V5/namebased: SHA-1 name-based</text>
<text class="body" x="1142" y="997">nextBase62() gives URL-safe form</text>

</g>
<g id="UuidFactory">
  <rect class="card" x="2070" y="825" width="760" height="220" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="badge" x="2092" y="855">factory</text>
  <text class="cardTitle" x="2092" y="893">Uuid.random / epochRandom</text>
  <path class="divider" d="M2070 915H2830" stroke="#C2410C"/>
  <text class="body" x="2092" y="949">custom Random injection</text>
<text class="body" x="2092" y="973">version-specific generator objects</text>
<text class="body" x="2092" y="997">bulk UUID sequences</text>

</g>
<g id="Ulid">
  <rect class="card" x="170" y="1245" width="760" height="220" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="badge" x="192" y="1275">String | 26 chars | sortable</text>
  <text class="cardTitle" x="192" y="1313">UlidGenerator</text>
  <path class="divider" d="M170 1335H930" stroke="#15803D"/>
  <text class="body" x="192" y="1369">Crockford Base32</text>
<text class="body" x="192" y="1393">StatefulMonotonic for same-ms ordering</text>
<text class="body" x="192" y="1417">nextULID() exposes value object</text>

</g>
<g id="Ksuid">
  <rect class="card" x="1120" y="1245" width="760" height="220" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="badge" x="1142" y="1275">String | 27 chars | URL-safe</text>
  <text class="cardTitle" x="1142" y="1313">Ksuid.Seconds / Millis</text>
  <path class="divider" d="M1120 1335H1880" stroke="#C2410C"/>
  <text class="body" x="1142" y="1369">Base62 encoded 20-byte payload</text>
<text class="body" x="1142" y="1393">Seconds: 4-byte timestamp + 16-byte random</text>
<text class="body" x="1142" y="1417">Millis: 8-byte timestamp + 12-byte random</text>

</g>
<g id="Flake">
  <rect class="card" x="2070" y="1245" width="760" height="220" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="badge" x="2092" y="1275">ByteArray | 128 bit | sortable</text>
  <text class="cardTitle" x="2092" y="1313">Flake</text>
  <path class="divider" d="M2070 1335H2830" stroke="#1D4ED8"/>
  <text class="body" x="2092" y="1369">16-byte Boundary-style ID</text>
<text class="body" x="2092" y="1393">timestamp + nodeId + sequence</text>
<text class="body" x="2092" y="1417">hex/component/Base62 helpers</text>

</g>
<g id="Hashids">
  <rect class="card" x="170" y="1648" width="1160" height="160" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="badge" x="192" y="1678">String | variable length | not unique by itself</text>
  <text class="cardTitle" x="192" y="1716">Hashids</text>
  <path class="divider" d="M170 1738H1330" stroke="#BE185D"/>
  <text class="body" x="192" y="1772">encode/decode Long arrays for short URLs; obfuscation only, not security</text>

</g>
<g id="Encoding">
  <rect class="card" x="1510" y="1648" width="1160" height="160" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="badge" x="1532" y="1678">representation helpers</text>
  <text class="cardTitle" x="1532" y="1716">Base62, Base32, Base36, Hex</text>
  <path class="divider" d="M1510 1738H2670" stroke="#475569"/>
  <text class="body" x="1532" y="1772">Url62 for UUID/Flake, Crockford Base32 for ULID, Base62 for KSUID</text>

</g>
</svg>