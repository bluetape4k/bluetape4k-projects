<svg xmlns="http://www.w3.org/2000/svg" width="1378" height="692" viewBox="0 0 1378 692" role="img" aria-label="All Algorithms at a Glance">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1378" height="692"/>
<rect class="frame" x="32" y="28" width="1314" height="636" rx="28"/>
<text class="title" x="66" y="82">All Algorithms at a Glance</text>
<text class="subtitle" x="70" y="118">Architecture nodes and edges from the original Mermaid source</text>
<path class="line" d="M1006 220 C1006 303 1040 303 1040 386"/>
<path class="line" d="M672 220 C672 303 706 303 706 386"/>
<path class="line" d="M522 280 C522 303 522 303 522 326"/>
<path class="line" d="M188 280 C188 303 188 303 188 326"/>
<path class="line" d="M338 220 C338 220 1040 220 1040 220"/>
<path class="line" d="M338 220 C338 220 706 220 706 220"/>
<path class="line" d="M338 220 C338 220 372 220 372 220"/>
<g transform="translate(48,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">IdGenerator&amp;lt;T&amp;gt;</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">nextId(): T</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">nextIds(n):</text>
</g>
<g transform="translate(382,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">SnowflakeGenerator →</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">Long (distributed,</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">sortable)</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="33" text-anchor="middle">UuidGenerator → UUID</text>
<text class="smallLabel" x="140" y="59" text-anchor="middle">(v1/v4/v6/v7)</text>
</g>
<g transform="translate(1050,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">UlidGenerator →</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">String 26 chars</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">(time-based,</text>
</g>
<g transform="translate(48,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">KsuidGenerator →</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">String 27 chars</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">(Base62, URL-safe)</text>
</g>
<g transform="translate(382,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Snowflakers.Default</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">(per-machine,</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">machineId)</text>
</g>
<g transform="translate(716,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Snowflakers.Global</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">(centralized,</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">AtomicLong)</text>
</g>
<g transform="translate(1050,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Uuid.V7 V6 V4 V1 V5</text>
</g>
<g transform="translate(382,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Hashids (encode</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">Long/UUID → short</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">string) not</text>
</g>
<g transform="translate(716,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Flake → ByteArray</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">128-bit (MAC-based</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">node ID)</text>
</g>
</svg>
