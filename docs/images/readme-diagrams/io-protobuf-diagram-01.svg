  <text class="stereo" x="978" y="872" text-anchor="middle">class</text>
  <text class="classTitle" x="978" y="900" text-anchor="middle">TimestampSupport</text>
  <line x1="798" y1="909" x2="1158" y2="909" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="832" y="941">+Instant.toTimestamp() Timestamp</text>
<text class="member" x="832" y="958">+Timestamp.toInstant() Instant</text>
<text class="member" x="832" y="975">+String.toTimestamp() Timestamp</text>
</g>
<g id="ProtobufSerializer">
  <rect class="classCard" x="342" y="398" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="522" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="522" y="445" text-anchor="middle">ProtobufSerializer</text>
  <line x1="342" y1="454" x2="702" y2="454" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="376" y="486">+serialize(message: ProtoMessage?)</text>
<text class="member" x="376" y="503">ByteArray</text>
<text class="member" x="376" y="520">+deserialize(bytes: ByteArray?,</text>
</g>
<g>
  <rect x="1085" y="1061" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1079 L1161 1079" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1084">inheritance / implementation</text>
  <path class="dependency" d="M1103 1100 L1161 1100" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1105">dependency / usage</text>
</g>
<g><rect x="180" y="1079" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1105" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
