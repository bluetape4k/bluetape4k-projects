  <text class="classTitle" x="978" y="560" text-anchor="middle">MessageSupport</text>
  <line x1="798" y1="569" x2="1158" y2="569" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="832" y="606">+packMessage(message) ByteArray</text>
<text class="member" x="832" y="623">+unpackMessage(bytes) T?</text>
</g>
<g id="MoneySupport">
  <rect class="classCard" x="798" y="679" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="978" y="698" text-anchor="middle">class</text>
  <text class="classTitle" x="978" y="726" text-anchor="middle">MoneySupport</text>
  <line x1="798" y1="735" x2="1158" y2="735" stroke="#DC6B82" stroke-width="1.4"/>
