  <text class="stereo" x="978" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="978" y="212" text-anchor="middle">DurationSupport</text>
  <line x1="798" y1="221" x2="1158" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="832" y="253">+Duration.toProtoDuration()</text>
<text class="member" x="832" y="270">ProtoDuration</text>
<text class="member" x="832" y="287">+ProtoDuration.toJavaDuration()</text>
</g>
<g id="BinarySerializer">
  <rect class="classCard" x="342" y="165" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="522" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="522" y="212" text-anchor="middle">BinarySerializer</text>
  <line x1="342" y1="221" x2="702" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="376" y="253">+serialize(obj: Any?) ByteArray</text>
<text class="member" x="376" y="270">+deserialize(bytes: ByteArray?,</text>
<text class="member" x="376" y="287">clazz:</text>
</g>
<g id="DateTimeSupport">
  <rect class="classCard" x="798" y="339" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="978" y="358" text-anchor="middle">class</text>
  <text class="classTitle" x="978" y="386" text-anchor="middle">DateTimeSupport</text>
  <line x1="798" y1="395" x2="1158" y2="395" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="832" y="427">+LocalDate.toProtoDate() Date</text>
<text class="member" x="832" y="444">+LocalTime.toProtoTimeOfDay()</text>
<text class="member" x="832" y="461">TimeOfDay</text>
</g>
