<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1120" viewBox="0 0 1760 1120" role="img" aria-label="Profiling mode comparison">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .card{stroke-width:2;filter:url(#softShadow)}
      .header{font-family:"Architects Daughter";font-size:30px;fill:#0F172A}
      .label{font-family:"Architects Daughter";font-size:20px;fill:#0F172A}
      .text{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .code{font-family:"Comic Mono";font-size:13px;fill:#0F172A}
      .rowLine{stroke:#CBD5E1;stroke-width:1.4}
      .noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1120"/>
  <rect class="frame" x="36" y="30" width="1688" height="1060" rx="8"/>
  <text class="title" x="76" y="86">Profiling Mode Comparison</text>
  <text class="subtitle" x="80" y="120">Choose one benchmarkProfile value for the HTTP benchmark task; every mode writes its artifact under build/benchmark-profiling.</text>

  <g id="gc-card">
    <rect class="card" x="116" y="178" width="500" height="720" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="header" x="366" y="236" text-anchor="middle" dominant-baseline="middle">gc</text>
    <text class="text" x="366" y="276" text-anchor="middle">JVM GC logging</text>
    <line class="rowLine" x1="156" y1="318" x2="576" y2="318"/>

    <text class="label" x="180" y="365" dominant-baseline="middle">Activate</text>
    <text class="code" x="366" y="365" text-anchor="middle">-PbenchmarkProfile=gc</text>
    <line class="rowLine" x1="156" y1="414" x2="576" y2="414"/>

    <text class="label" x="180" y="461" dominant-baseline="middle">Mechanism</text>
    <text class="code" x="366" y="452" text-anchor="middle">-Xlog:gc*,safepoint</text>
    <text class="text" x="366" y="480" text-anchor="middle">JVM log stream to file</text>
    <line class="rowLine" x1="156" y1="530" x2="576" y2="530"/>

    <text class="label" x="180" y="577" dominant-baseline="middle">Output</text>
    <text class="code" x="366" y="577" text-anchor="middle">gc.log</text>
    <line class="rowLine" x1="156" y1="626" x2="576" y2="626"/>

    <text class="label" x="180" y="673" dominant-baseline="middle">Measures</text>
    <text class="text" x="366" y="664" text-anchor="middle">GC pauses, allocation events,</text>
    <text class="text" x="366" y="692" text-anchor="middle">and safepoints</text>
    <line class="rowLine" x1="156" y1="742" x2="576" y2="742"/>

    <text class="label" x="180" y="789" dominant-baseline="middle">Use when</text>
    <text class="text" x="366" y="780" text-anchor="middle">you need GC pressure and</text>
    <text class="text" x="366" y="808" text-anchor="middle">pause-time evidence</text>
  </g>

  <g id="jfr-card">
    <rect class="card" x="630" y="178" width="500" height="720" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="header" x="880" y="236" text-anchor="middle" dominant-baseline="middle">jfr</text>
    <text class="text" x="880" y="276" text-anchor="middle">Java Flight Recorder</text>
    <line class="rowLine" x1="670" y1="318" x2="1090" y2="318"/>

    <text class="label" x="694" y="365" dominant-baseline="middle">Activate</text>
    <text class="code" x="880" y="365" text-anchor="middle">-PbenchmarkProfile=jfr</text>
    <line class="rowLine" x1="670" y1="414" x2="1090" y2="414"/>

    <text class="label" x="694" y="461" dominant-baseline="middle">Mechanism</text>
    <text class="code" x="880" y="452" text-anchor="middle">-XX:StartFlightRecording</text>
    <text class="text" x="880" y="480" text-anchor="middle">profile settings, dump on exit</text>
    <line class="rowLine" x1="670" y1="530" x2="1090" y2="530"/>

    <text class="label" x="694" y="577" dominant-baseline="middle">Output</text>
    <text class="code" x="880" y="577" text-anchor="middle">benchmark.jfr</text>
    <line class="rowLine" x1="670" y1="626" x2="1090" y2="626"/>

    <text class="label" x="694" y="673" dominant-baseline="middle">Measures</text>
    <text class="text" x="880" y="664" text-anchor="middle">CPU, GC events, lock contention,</text>
    <text class="text" x="880" y="692" text-anchor="middle">and allocations</text>
    <line class="rowLine" x1="670" y1="742" x2="1090" y2="742"/>

    <text class="label" x="694" y="789" dominant-baseline="middle">Open with</text>
    <text class="text" x="880" y="780" text-anchor="middle">JDK Mission Control or</text>
    <text class="text" x="880" y="808" text-anchor="middle">IntelliJ IDEA JFR viewer</text>
  </g>

  <g id="async-card">
    <rect class="card" x="1144" y="178" width="500" height="720" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="header" x="1394" y="236" text-anchor="middle" dominant-baseline="middle">async</text>
    <text class="text" x="1394" y="276" text-anchor="middle">async-profiler CPU sampling</text>
    <line class="rowLine" x1="1184" y1="318" x2="1604" y2="318"/>

    <text class="label" x="1208" y="365" dominant-baseline="middle">Activate</text>
    <text class="code" x="1394" y="365" text-anchor="middle">-PbenchmarkProfile=async</text>
    <line class="rowLine" x1="1184" y1="414" x2="1604" y2="414"/>

    <text class="label" x="1208" y="461" dominant-baseline="middle">Mechanism</text>
    <text class="code" x="1394" y="452" text-anchor="middle">-agentpath:libasyncProfiler</text>
    <text class="text" x="1394" y="480" text-anchor="middle">event=cpu, flamegraph, 1ms</text>
    <line class="rowLine" x1="1184" y1="530" x2="1604" y2="530"/>

    <text class="label" x="1208" y="577" dominant-baseline="middle">Output</text>
    <text class="code" x="1394" y="577" text-anchor="middle">async-cpu.html</text>
    <line class="rowLine" x1="1184" y1="626" x2="1604" y2="626"/>

    <text class="label" x="1208" y="673" dominant-baseline="middle">Measures</text>
    <text class="text" x="1394" y="664" text-anchor="middle">CPU flame graph with</text>
    <text class="text" x="1394" y="692" text-anchor="middle">low-overhead sampling</text>
    <line class="rowLine" x1="1184" y1="742" x2="1604" y2="742"/>

    <text class="label" x="1208" y="789" dominant-baseline="middle">Requires</text>
    <text class="code" x="1394" y="780" text-anchor="middle">-PasyncProfilerLib=...</text>
    <text class="text" x="1394" y="808" text-anchor="middle">native async-profiler library</text>
  </g>

  <g id="footer">
    <rect class="card" x="170" y="958" width="1420" height="72" rx="8" fill="#F8FAFC" stroke="#64748B"/>
    <text class="noteTitle" x="370" y="995" text-anchor="middle" dominant-baseline="middle">Runtime rule</text>
    <text class="text" x="930" y="995" text-anchor="middle" dominant-baseline="middle">All modes run on the JDK 21 toolchain and require no extra Gradle dependency; async only needs the native profiler path.</text>
  </g>
</svg>
