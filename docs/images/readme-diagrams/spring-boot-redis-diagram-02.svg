<svg data-intent="Redesign ReactiveRedisTemplate serialization flow around RedisSerializationContext, key/value/hash serializers, BinarySerializer/Compressor choices, and Redis wire bytes." data-evidence="spring-boot/redis/README.md; spring-boot/redis/src/main/kotlin/io/bluetape4k/spring/redis/serializer" data-source-read="spring-boot/redis/README.md; spring-boot/redis/src/main/kotlin/io/bluetape4k/spring/redis/serializer" xmlns="http://www.w3.org/2000/svg" width="1440" height="905" viewBox="0 0 1440 905" role="img" aria-label="ReactiveRedisTemplate Serialization Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="905"/>
<rect class="frame" x="34" y="30" width="1372" height="845" rx="32"/>
<text class="title" x="72" y="84">ReactiveRedisTemplate Serialization Flow</text>
<text class="subtitle" x="76" y="116">The flow shows how a RedisSerializationContext selects binary/compression serializers before bytes are sent to Redis.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="145" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Template configuration</text></g>
<g><rect class="panel" x="82" y="375" width="1276" height="230" rx="22"/><text class="panelTitle" x="110" y="411" dominant-baseline="middle">Serialization choices</text></g>
<g><rect class="panel" x="82" y="680" width="1276" height="145" rx="22"/><text class="panelTitle" x="110" y="716" dominant-baseline="middle">Redis wire</text></g>
<g id="config">
  <rect class="card" x="130" y="215" width="300" height="70" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="280" y="243" text-anchor="middle" dominant-baseline="middle">Spring configuration</text>
  <text class="detail" x="280" y="273" text-anchor="middle" dominant-baseline="middle">ReactiveRedisTemplate bean</text>
</g>
<g id="context">
  <rect class="card" x="515" y="210" width="410" height="80" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="720" y="243" text-anchor="middle" dominant-baseline="middle">RedisSerializationContext DSL</text>
  <text class="detail" x="720" y="273" text-anchor="middle" dominant-baseline="middle">key, value, hashKey, hashValue serializers</text>
</g>
<g id="template">
  <rect class="card" x="990" y="215" width="310" height="70" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1145" y="243" text-anchor="middle" dominant-baseline="middle">ReactiveRedisTemplate</text>
  <text class="detail" x="1145" y="273" text-anchor="middle" dominant-baseline="middle">uses context for every command</text>
</g>
<g id="binary">
  <rect class="card" x="125" y="445" width="300" height="88" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="275" y="473" text-anchor="middle" dominant-baseline="middle">RedisBinarySerializer</text>
  <text class="detail" x="275" y="503" text-anchor="middle" dominant-baseline="middle">BinarySerializer -&gt; ByteArray</text>
  <text class="detail" x="275" y="521" text-anchor="middle" dominant-baseline="middle">JDK/Kryo/Fory variants</text>
</g>
<g id="compress">
  <rect class="card" x="525" y="445" width="300" height="88" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="675" y="473" text-anchor="middle" dominant-baseline="middle">RedisCompressSerializer</text>
  <text class="detail" x="675" y="503" text-anchor="middle" dominant-baseline="middle">ByteArray compression only</text>
  <text class="detail" x="675" y="521" text-anchor="middle" dominant-baseline="middle">LZ4/Zstd/Snappy/GZip</text>
</g>
<g id="factory">
  <rect class="card" x="925" y="445" width="330" height="88" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1090" y="473" text-anchor="middle" dominant-baseline="middle">RedisBinarySerializers</text>
  <text class="detail" x="1090" y="503" text-anchor="middle" dominant-baseline="middle">prebuilt serializer combinations</text>
  <text class="detail" x="1090" y="521" text-anchor="middle" dominant-baseline="middle">LZ4Fory, ZstdFory, LZ4Kryo</text>
</g>
<g id="bytes">
  <rect class="card" x="315" y="720" width="300" height="66" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="465" y="746" text-anchor="middle" dominant-baseline="middle">Redis bytes</text>
  <text class="detail" x="465" y="776" text-anchor="middle" dominant-baseline="middle">keys and values serialized</text>
</g>
<g id="redis">
  <rect class="card" x="820" y="720" width="300" height="66" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="970" y="746" text-anchor="middle" dominant-baseline="middle">Redis server</text>
  <text class="detail" x="970" y="776" text-anchor="middle" dominant-baseline="middle">stores wire byte payloads</text>
</g>
<path class="route" data-from="config" data-to="context" d="M430 250 L515 250" stroke="#4F83BF"/>
<path class="route" data-from="context" data-to="template" d="M925 250 L990 250" stroke="#3E9868"/>
<path class="route" data-from="context" data-to="binary" d="M620 290 L275 445" stroke="#2E8F89"/>
<path class="route" data-from="context" data-to="compress" d="M720 290 L675 445" stroke="#B9851B"/>
<path class="route" data-from="context" data-to="factory" d="M820 290 L1090 445" stroke="#C94D68"/>
<path class="route" data-from="binary" data-to="bytes" d="M275 533 L385 720" stroke="#2E8F89"/>
<path class="route" data-from="compress" data-to="bytes" d="M675 533 L465 720" stroke="#B9851B"/>
<path class="route" data-from="factory" data-to="bytes" d="M1090 533 L545 720" stroke="#C94D68"/>
<path class="route" data-from="bytes" data-to="redis" d="M615 753 L820 753" stroke="#4F83BF"/>
<path class="route" data-from="template" data-to="redis" d="M1300 250 L1335 250 L1335 755 L1120 755" stroke="#755BC6"/>
</svg>
