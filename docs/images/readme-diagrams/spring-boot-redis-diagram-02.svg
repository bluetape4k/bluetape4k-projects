<rect class="canvas" width="2780" height="1640"/>
<rect class="frame" x="34" y="30" width="2712" height="1580" rx="8"/>
<text class="title" x="72" y="86">ReactiveRedisTemplate Serialization Flow</text>
<text class="subtitle" x="76" y="120">How bluetape4k RedisSerializationContext helpers bind serializer slots, then encode writes and decode reads for Spring Data Redis.</text>
<text class="laneLabel" x="96" y="190" fill="#0F766E">configuration path</text>
<g id="ConfigCode">
  <rect class="card" x="110" y="220" width="430" height="230" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="134" y="251">Application @Bean</text>
  <text class="cardTitle" x="134" y="285">ReactiveRedisTemplate config</text>
  <path class="divider" d="M110 306H540" stroke="#0F766E"/>
  <text class="body" x="134" y="339">redisSerializationContextOf(...)</text>
<text class="body" x="134" y="363">valueSerializer = LZ4Kryo</text>
<text class="body" x="134" y="387">or builder { value(...); hashValue(...) }</text>
  <path class="divider" d="M110 402H540" stroke="#0F766E"/><text class="foot" x="134" y="432">supplies the context before template construction</text>
</g>
<g id="ContextBuilder">
  <rect class="card" x="700" y="200" width="520" height="270" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="724" y="231">RedisSerializationContextSupport</text>
  <text class="cardTitle" x="724" y="265">RedisSerializationContext&lt;K,V&gt;</text>
  <path class="divider" d="M700 286H1220" stroke="#15803D"/>
  <text class="body" x="724" y="319">key -&gt; StringRedisSerializer.UTF_8</text>
<text class="body" x="724" y="343">value -&gt; RedisSerializer&lt;V&gt;</text>
<text class="body" x="724" y="367">hashKey -&gt; StringRedisSerializer.UTF_8</text>
<text class="body" x="724" y="391">hashValue -&gt; RedisSerializer&lt;V&gt;</text>
  <path class="divider" d="M700 422H1220" stroke="#15803D"/><text class="foot" x="724" y="452">default serializer is optional</text>
</g>
<g id="ReactiveTemplate">
  <rect class="card" x="1380" y="220" width="470" height="230" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="1404" y="251">Spring Data Redis</text>
  <text class="cardTitle" x="1404" y="285">ReactiveRedisTemplate</text>
  <path class="divider" d="M1380 306H1850" stroke="#1D4ED8"/>
  <text class="body" x="1404" y="339">created with connection factory</text>
<text class="body" x="1404" y="363">uses context slots per operation</text>
<text class="body" x="1404" y="387">returns reactive publisher results</text>
  <path class="divider" d="M1380 402H1850" stroke="#1D4ED8"/><text class="foot" x="1404" y="432">template does not choose binary format by itself</text>
</g>
<g id="RedisConnection">
  <rect class="card" x="2040" y="220" width="410" height="230" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2064" y="251">Redis connection</text>
  <text class="cardTitle" x="2064" y="285">Redis wire protocol</text>
  <path class="divider" d="M2040 306H2450" stroke="#475569"/>
  <text class="body" x="2064" y="339">stores ByteArray payloads</text>
<text class="body" x="2064" y="363">keys are String UTF-8 in helper overload</text>
<text class="body" x="2064" y="387">values come from selected serializer</text>
  <path class="divider" d="M2040 402H2450" stroke="#475569"/><text class="foot" x="2064" y="432">Redis sees bytes, not object graphs</text>
</g>
<text class="laneLabel" x="96" y="640" fill="#C2410C">write path</text>
<g id="DomainValue">
  <rect class="card" x="110" y="680" width="380" height="210" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="kicker" x="134" y="711">caller value</text>
  <text class="cardTitle" x="134" y="745">Domain object</text>
  <path class="divider" d="M110 766H490" stroke="#C2410C"/>
  <text class="body" x="134" y="799">Any value passed to opsForValue()</text>
<text class="body" x="134" y="823">or hash value operation</text>
<text class="body" x="134" y="847">null serializes to emptyByteArray</text>
  <path class="divider" d="M110 842H490" stroke="#C2410C"/><text class="foot" x="134" y="872">example: TestBean</text>
</g>
<g id="WriteSlot">
  <rect class="card" x="610" y="680" width="420" height="210" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="634" y="711">context slot</text>
  <text class="cardTitle" x="634" y="745">value / hashValue serializer</text>
  <path class="divider" d="M610 766H1030" stroke="#15803D"/>
  <text class="body" x="634" y="799">selected from RedisBinarySerializers</text>
<text class="body" x="634" y="823">same slot used by reactive operations</text>
<text class="body" x="634" y="847">key serializer stays separate</text>
  <path class="divider" d="M610 842H1030" stroke="#15803D"/><text class="foot" x="634" y="872">source of the write codec</text>
</g>
<g id="LZ4Kryo">
  <rect class="card" x="1150" y="680" width="420" height="210" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="1174" y="711">lazy singleton</text>
  <text class="cardTitle" x="1174" y="745">RedisBinarySerializers.LZ4Kryo</text>
  <path class="divider" d="M1150 766H1570" stroke="#6D28D9"/>
  <text class="body" x="1174" y="799">wraps BinarySerializers.LZ4Kryo</text>
<text class="body" x="1174" y="823">created as RedisBinarySerializer</text>
<text class="body" x="1174" y="847">combines Kryo encoding and LZ4</text>
  <path class="divider" d="M1150 842H1570" stroke="#6D28D9"/><text class="foot" x="1174" y="872">one of many factory constants</text>
</g>
<g id="WriteCodec">
  <rect class="card" x="1690" y="680" width="420" height="210" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="kicker" x="1714" y="711">RedisBinarySerializer</text>
  <text class="cardTitle" x="1714" y="745">serialize(t)</text>
  <path class="divider" d="M1690 766H2110" stroke="#BE185D"/>
  <text class="body" x="1714" y="799">serializer.serialize(t)</text>
<text class="body" x="1714" y="823">binary serializer owns object encoding</text>
<text class="body" x="1714" y="847">compression is inside combined serializer</text>
  <path class="divider" d="M1690 842H2110" stroke="#BE185D"/><text class="foot" x="1714" y="872">returns ByteArray</text>
</g>
<g id="StoredBytes">
  <rect class="card" x="2230" y="680" width="260" height="210" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2254" y="711">Redis payload</text>
  <text class="cardTitle" x="2254" y="745">ByteArray</text>
  <path class="divider" d="M2230 766H2490" stroke="#475569"/>
  <text class="body" x="2254" y="799">written through connection</text>
<text class="body" x="2254" y="823">opaque to Redis</text>
<text class="body" x="2254" y="847">decoded only by matching serializer</text>
  <path class="divider" d="M2230 842H2490" stroke="#475569"/><text class="foot" x="2254" y="872">stored value</text>
</g>
<text class="laneLabel" x="96" y="1075" fill="#1D4ED8">read path</text>
<g id="StoredBytesRead">
  <rect class="card" x="2230" y="1110" width="260" height="210" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2254" y="1141">Redis payload</text>
  <text class="cardTitle" x="2254" y="1175">ByteArray</text>
  <path class="divider" d="M2230 1196H2490" stroke="#475569"/>
  <text class="body" x="2254" y="1229">loaded by reactive command</text>
<text class="body" x="2254" y="1253">same bytes written earlier</text>
<text class="body" x="2254" y="1277">may be emptyByteArray</text>
  <path class="divider" d="M2230 1272H2490" stroke="#475569"/><text class="foot" x="2254" y="1302">wire value</text>
</g>
<g id="ReadCodec">
  <rect class="card" x="1690" y="1110" width="420" height="210" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="kicker" x="1714" y="1141">RedisBinarySerializer</text>
  <text class="cardTitle" x="1714" y="1175">deserialize(bytes)</text>
  <path class="divider" d="M1690 1196H2110" stroke="#BE185D"/>
  <text class="body" x="1714" y="1229">serializer.deserialize(bytes)</text>
<text class="body" x="1714" y="1253">decompresses when combined codec needs it</text>
<text class="body" x="1714" y="1277">rebuilds the object graph</text>
  <path class="divider" d="M1690 1272H2110" stroke="#BE185D"/><text class="foot" x="1714" y="1302">returns Any?</text>
</g>
<g id="ReactiveResult">
  <rect class="card" x="1110" y="1110" width="460" height="210" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="1134" y="1141">reactive result</text>
  <text class="cardTitle" x="1134" y="1175">Mono / Flux value</text>
  <path class="divider" d="M1110 1196H1570" stroke="#1D4ED8"/>
  <text class="body" x="1134" y="1229">template maps ByteArray to V</text>
<text class="body" x="1134" y="1253">caller observes typed result</text>
<text class="body" x="1134" y="1277">serializer mismatch fails at decode time</text>
  <path class="divider" d="M1110 1272H1570" stroke="#1D4ED8"/><text class="foot" x="1134" y="1302">same context closes the loop</text>
</g>
<g id="CompressOnly">
  <rect class="card" x="110" y="1110" width="760" height="210" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="kicker" x="134" y="1141">ByteArray alternative</text>
  <text class="cardTitle" x="134" y="1175">RedisCompressSerializer path</text>
  <path class="divider" d="M110 1196H870" stroke="#C2410C"/>
  <text class="body" x="134" y="1229">RedisBinarySerializers.LZ4 / Gzip / Snappy / Zstd create compression-only serializers</text>
<text class="body" x="134" y="1253">use when application value type is already ByteArray</text>
<text class="body" x="134" y="1277">serialize -&gt; compressor.compress, deserialize -&gt; compressor.decompress</text>
  <path class="divider" d="M110 1272H870" stroke="#C2410C"/><text class="foot" x="134" y="1302">not the object serializer path used by LZ4Kryo</text>
</g>
<g data-from="ConfigCode" data-to="ContextBuilder">
  <path class="edge " d="M540 335 L700 335" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <rect class="edgeLabelBg" x="582" y="297" width="110" height="24" rx="4"/><text class="edgeLabel" x="590" y="314">builds</text>
</g>
<g data-from="ContextBuilder" data-to="ReactiveTemplate">
  <path class="edge " d="M1220 335 L1380 335" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <rect class="edgeLabelBg" x="1247" y="297" width="184" height="24" rx="4"/><text class="edgeLabel" x="1255" y="314">constructor argument</text>
</g>
<g data-from="ReactiveTemplate" data-to="RedisConnection">
  <path class="edge " d="M1850 335 L2040 335" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <rect class="edgeLabelBg" x="1902" y="297" width="110" height="24" rx="4"/><text class="edgeLabel" x="1910" y="314">uses</text>
</g>
<g data-from="DomainValue" data-to="WriteSlot">
  <path class="edge " d="M490 785 L610 785" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="504" y="747" width="144" height="24" rx="4"/><text class="edgeLabel" x="512" y="764">operation value</text>
</g>
<g data-from="WriteSlot" data-to="LZ4Kryo">
  <path class="edge " d="M1030 785 L1150 785" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="1044" y="747" width="136" height="24" rx="4"/><text class="edgeLabel" x="1052" y="764">selected codec</text>
</g>
<g data-from="LZ4Kryo" data-to="WriteCodec">
  <path class="edge " d="M1570 785 L1690 785" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="1586" y="747" width="110" height="24" rx="4"/><text class="edgeLabel" x="1594" y="764">delegates</text>
</g>
<g data-from="WriteCodec" data-to="StoredBytes">
  <path class="edge " d="M2110 785 L2230 785" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="2134" y="747" width="110" height="24" rx="4"/><text class="edgeLabel" x="2142" y="764">ByteArray</text>
</g>
<g data-from="StoredBytes" data-to="RedisConnection">
  <path class="edge dashed" d="M2360 680 L2360 450" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="2370" y="558" width="144" height="24" rx="4"/><text class="edgeLabel" x="2378" y="575">stored in Redis</text>
</g>
<g data-from="RedisConnection" data-to="StoredBytesRead">
  <path class="edge dashed" d="M2450 335 L2630 335 L2630 1215 L2490 1215" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <rect class="edgeLabelBg" x="2530" y="993" width="120" height="24" rx="4"/><text class="edgeLabel" x="2538" y="1010">loaded bytes</text>
</g>
<g data-from="StoredBytesRead" data-to="ReadCodec">
  <path class="edge " d="M2230 1215 L2110 1215" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <rect class="edgeLabelBg" x="2134" y="1177" width="110" height="24" rx="4"/><text class="edgeLabel" x="2142" y="1194">ByteArray</text>
</g>
<g data-from="ReadCodec" data-to="ReactiveResult">
  <path class="edge " d="M1690 1215 L1570 1215" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <rect class="edgeLabelBg" x="1580" y="1177" width="136" height="24" rx="4"/><text class="edgeLabel" x="1588" y="1194">decoded object</text>
</g>
<g data-from="ReactiveResult" data-to="WriteSlot">
  <path class="edge dashed" d="M1340 1110 L1340 1015 L820 1015 L820 890" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <rect class="edgeLabelBg" x="882" y="979" width="184" height="24" rx="4"/><text class="edgeLabel" x="890" y="996">same serializer slot</text>
</g>
<g data-from="CompressOnly" data-to="WriteSlot">
  <path class="edge dashed" d="M490 1110 L490 1000 L820 1000 L820 890" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="512" y="963" width="192" height="24" rx="4"/><text class="edgeLabel" x="520" y="980">ByteArray-only option</text>
</g>
</svg>