<svg xmlns="http://www.w3.org/2000/svg" width="1524" height="780" viewBox="0 0 1524 780" role="img" aria-label="Money Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1524" height="780"/>
<rect class="frame" x="32" y="28" width="1460" height="724" rx="30"/>
<text class="title" x="68" y="84">Money Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="CurrencyConvertor" data-to="MonetaryAmount" data-route-color="teal" d="M518 430 L556 430 L556 311" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MonetaryAmount" data-to="CurrencyUnit" data-route-color="amber" d="M868 238 L898 238" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="FastMoney" data-to="MonetaryAmount" data-route-color="teal" d="M735 398 L735 311" stroke="#2E8F89"/>
<path class="inherit" data-from="Money" data-to="MonetaryAmount" data-route-color="amber" d="M1088 398 L1088 355 L826 355 L826 311" stroke="#B9851B"/>
<g id="CurrencyConvertor">
  <rect class="classCard" x="118" y="398" width="400" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="318" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="318" y="445" text-anchor="middle">CurrencyConvertor</text>
  <line x1="118" y1="454" x2="518" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="482">+getConversion(currency)</text>
<text class="member" x="152" y="499">CurrencyConversion</text>
<text class="member" x="152" y="516">+USDConversion: CurrencyConversion</text>
</g>
<g id="MonetaryAmount">
  <rect class="classCard" x="508" y="165" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="688" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="688" y="212" text-anchor="middle">MonetaryAmount</text>
  <line x1="508" y1="221" x2="868" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="542" y="253">+currency: CurrencyUnit</text>
<text class="member" x="542" y="270">+number: NumberValue</text>
<text class="member" x="542" y="287">+add(other) MonetaryAmount</text>
</g>
<g id="CurrencyUnit">
  <rect class="classCard" x="898" y="165" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1078" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="1078" y="212" text-anchor="middle">CurrencyUnit</text>
  <line x1="898" y1="221" x2="1258" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="932" y="253">+currencyCode: String</text>
<text class="member" x="932" y="270">+numericCode: Int</text>
<text class="member" x="932" y="287">+defaultFractionDigits: Int</text>
</g>
<g id="FastMoney">
  <rect class="classCard" x="602" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="782" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="782" y="445" text-anchor="middle">FastMoney</text>
  <line x1="602" y1="454" x2="962" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="636" y="491">-amount: Long</text>
<text class="member" x="636" y="508">+of(amount, currency) FastMoney</text>
</g>
<g id="Money">
  <rect class="classCard" x="1046" y="398" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1226" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1226" y="445" text-anchor="middle">Money</text>
  <line x1="1046" y1="454" x2="1406" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1080" y="486">-amount: BigDecimal</text>
<text class="member" x="1080" y="503">+of(amount, currency) Money</text>
<text class="member" x="1080" y="520">+round() Money</text>
</g>
<g>
  <rect x="1109" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1127 690 L1185 690" stroke="#3E9868"/>
  <text class="detail" x="1199" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1127 711 L1185 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1199" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="884" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="622" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
