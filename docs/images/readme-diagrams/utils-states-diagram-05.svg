<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="820" viewBox="0 0 1680 820" role="img" aria-label="Order One-Way FSM">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.25"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1680" height="820"/>
<rect class="frame" x="34" y="30" width="1612" height="760" rx="30"/>
<text class="title" x="72" y="86">Order One-Way FSM</text>
<text class="subtitle" x="76" y="118">Linear business progress is horizontal; the cancellation branch is isolated below the main path.</text>
<g><rect class="panel" x="80" y="160" width="1520" height="290" rx="22"/><text class="panelTitle" x="104" y="194">Happy path</text></g>
<g><rect class="panel" x="80" y="500" width="1520" height="150" rx="22"/><text class="panelTitle" x="104" y="534">Terminal shortcut</text></g>
<g id="created"><rect class="card" x="130" y="265" width="220" height="100" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="240" y="307" text-anchor="middle">Created</text><text class="detail" x="240" y="342" text-anchor="middle">initial</text></g>
<g id="paid"><rect class="card" x="500" y="265" width="220" height="100" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="610" y="307" text-anchor="middle">Paid</text><text class="detail" x="610" y="342" text-anchor="middle">payment accepted</text></g>
<g id="shipped"><rect class="card" x="870" y="265" width="220" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="980" y="307" text-anchor="middle">Shipped</text><text class="detail" x="980" y="342" text-anchor="middle">carrier handoff</text></g>
<g id="delivered"><rect class="card" x="1240" y="265" width="220" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1350" y="307" text-anchor="middle">Delivered</text><text class="detail" x="1350" y="342" text-anchor="middle">final success</text></g>
<g id="cancelled"><rect class="card" x="500" y="535" width="290" height="88" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="645" y="571" text-anchor="middle">Cancelled</text><text class="detail" x="645" y="606" text-anchor="middle">final stop from Created</text></g>
<path class="flow" d="M350 315 L500 315" stroke="#3E9868"/>
<path class="flow" d="M720 315 L870 315" stroke="#B9851B"/>
<path class="flow" d="M1090 315 L1240 315" stroke="#2E8F89"/>
<path class="flow" d="M240 365 L240 470 L430 470 L430 579 L500 579" stroke="#C94D68"/>
<g><rect x="365" y="281" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#58A978" stroke-width="1.2"/><text class="detail" x="425" y="297" text-anchor="middle" dominant-baseline="middle">Pay</text></g>
<g><rect x="735" y="281" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#D6A441" stroke-width="1.2"/><text class="detail" x="795" y="297" text-anchor="middle" dominant-baseline="middle">Ship</text></g>
<g><rect x="1100" y="281" width="130" height="30" rx="8" fill="#FFFFFF" stroke="#45A7A1" stroke-width="1.2"/><text class="detail" x="1165" y="297" text-anchor="middle" dominant-baseline="middle">Deliver</text></g>
<g><rect x="370" y="545" width="120" height="30" rx="8" fill="#FFFFFF" stroke="#DC6B82" stroke-width="1.2"/><text class="detail" x="430" y="561" text-anchor="middle" dominant-baseline="middle">Cancel</text></g>
<g><rect x="180" y="720" width="1320" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><text class="small" x="840" y="745" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
