<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc" data-layout="state-machine" data-intent="Explain the order finite state machine from Created through Paid, Shipped, and Delivered final state, with Cancel as a terminal branch from Created." data-evidence="utils/states/README.md, README quick-start order example" data-source-read="utils/states/README.md">
<title id="title">Order One-Way FSM</title>
<desc id="desc">Linear fulfillment with cancellation only from Created.</desc>
<style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .title { fill: #0f172a; font-size: 34px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #475569; font-size: 18px; font-weight: 500; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panelTitle { fill: #334155; font-size: 14px; font-weight: 800; letter-spacing: .2px; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
    .card { stroke-width: 1.7; filter: url(#cardShadow); }
    .stateTitle { fill: #0f172a; font-size: 17px; font-weight: 800; }
    .stateDetail { fill: #475569; font-size: 12px; font-weight: 600; }
    .iconBadge { stroke-width: 1.5; }
    .iconStroke { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .iconFill { fill: #ffffff; }
    .arrow { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrowLabelBg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .arrowLabel { fill: #1e293b; font-size: 13px; font-weight: 800; text-anchor: middle; }
    .footer { fill: #64748b; font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
<rect width="1600" height="760" fill="#f8fafc"/>
<rect x="30" y="30" width="1540" height="700" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="title" x="70" y="92">Order One-Way FSM</text>
<text class="subtitle" x="70" y="124">Linear fulfillment with cancellation only from Created.</text>
<rect class="panel" x="55" y="145" width="1490" height="525" rx="18"/><text class="panelTitle" x="79" y="179">State transitions</text>
<circle cx="86" cy="320" r="10" fill="#172033"/>
<g><path class="route arrow" d="M70,320 L130,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="63" y="286" width="74" height="22" rx="11"/><text class="arrowLabel" x="100" y="302">initial</text></g>
<g><path class="route arrow" d="M360,320 L500,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="403" y="286" width="54" height="22" rx="11"/><text class="arrowLabel" x="430" y="302">Pay</text></g>
<g><path class="route arrow" d="M730,320 L870,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="773" y="286" width="54" height="22" rx="11"/><text class="arrowLabel" x="800" y="302">Ship</text></g>
<g><path class="route arrow" d="M1100,320 L1240,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="1133" y="286" width="74" height="22" rx="11"/><text class="arrowLabel" x="1170" y="302">Deliver</text></g>
<g><path class="route arrow" d="M245,370 L245,563 L500,563" stroke="#db2777"/><rect class="arrowLabelBg" x="339.5" y="529" width="66" height="22" rx="11"/><text class="arrowLabel" x="372.5" y="545">Cancel</text></g>
<g id="created"><rect class="card" x="130" y="270" width="230" height="100" rx="8" fill="#eff6ff" stroke="#2563eb"/><g transform="translate(150,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#2563eb" stroke="#2563eb"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="210" y="312">Created</text><text class="stateDetail" x="210" y="338">initial</text></g>
<g id="paid"><rect class="card" x="500" y="270" width="230" height="100" rx="8" fill="#f0fdf4" stroke="#16a34a"/><g transform="translate(520,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#16a34a" stroke="#16a34a"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="580" y="312">Paid</text><text class="stateDetail" x="580" y="338">payment accepted</text></g>
<g id="shipped"><rect class="card" x="870" y="270" width="230" height="100" rx="8" fill="#fff7ed" stroke="#ea580c"/><g transform="translate(890,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#ea580c" stroke="#ea580c"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="950" y="312">Shipped</text><text class="stateDetail" x="950" y="338">carrier handoff</text></g>
<g id="delivered"><rect class="card" x="1240" y="270" width="230" height="100" rx="8" fill="#f0fdfa" stroke="#0d9488"/><g transform="translate(1260,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#0d9488" stroke="#0d9488"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="1320" y="312">Delivered</text><text class="stateDetail" x="1320" y="338">final success</text></g>
<g id="cancelled"><rect class="card" x="500" y="515" width="280" height="96" rx="8" fill="#fdf2f8" stroke="#db2777"/><g transform="translate(520,541)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#db2777" stroke="#db2777"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="580" y="555">Cancelled</text><text class="stateDetail" x="580" y="581">final stop</text></g>
<circle cx="1512" cy="642" r="13" fill="none" stroke="#172033" stroke-width="3"/><circle cx="1512" cy="642" r="8" fill="#172033"/>
<text class="footer" x="70" y="716">Generated as direct SVG. Sequence diagrams are intentionally preserved.</text>
</svg>