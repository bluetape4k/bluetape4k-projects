<svg xmlns="http://www.w3.org/2000/svg" width="1804" height="834" viewBox="0 0 1804 834" role="img" aria-label="Async HTTP Request Flow (HC5 Async + Coroutines)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1804" height="834"/>
<rect class="frame" x="32" y="28" width="1740" height="778" rx="28"/>
<text class="title" x="66" y="82">Async HTTP Request Flow (HC5 Async + Coroutines)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="774" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="528" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="678" y="209" text-anchor="middle">executeSuspending()</text>
<line class="lifeline" x1="678" y1="252" x2="678" y2="774" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="976" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1126" y="198.5" text-anchor="middle">Closeable Http</text>
<text class="smallLabel" x="1126" y="219.5" text-anchor="middle">Async Client</text>
<line class="lifeline" x1="1126" y1="252" x2="1126" y2="774" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1424" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1574" y="209" text-anchor="middle">HTTP Server</text>
<line class="lifeline" x1="1574" y1="252" x2="1574" y2="774" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="270.5" y="286" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="288.5" y="313" text-anchor="start">1. suspend fun executeSuspending(request)</text>
<path class="line" d="M230 332 L678 332"/>
<rect x="742.5" y="362" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="760.5" y="389" text-anchor="start">2. execute(request, FutureCallback)</text>
<path class="line" d="M678 408 L1126 408"/>
<rect x="1239" y="438" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1257" y="465" text-anchor="start">3. HTTP request (async)</text>
<path class="line" d="M1126 484 L1574 484"/>
<rect x="1245" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1263" y="541" text-anchor="start">4. HTTP response</text>
<path class="dashed" d="M1574 560 L1126 560"/>
<rect x="734.5" y="590" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="752.5" y="617" text-anchor="start">5. FutureCallback.completed(response)</text>
<path class="dashed" d="M1126 636 L678 636"/>
<rect x="349" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="367" y="693" text-anchor="start">6. SimpleHttpResponse</text>
<path class="dashed" d="M678 712 L230 712"/>
</svg>
