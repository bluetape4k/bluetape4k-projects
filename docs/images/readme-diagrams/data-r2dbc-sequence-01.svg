<rect x="1664.2" y="502" width="16" height="118" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="321.1" y="271" width="340.2" height="42" rx="7"/><circle cx="340.1" cy="292" r="12" fill="#4F83BF"/><text class="detail" x="340.1" y="293" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="509.2" y="284" text-anchor="middle" dominant-baseline="middle">sql(SELECT</text><text class="detail" x="509.2" y="299" text-anchor="middle" dominant-baseline="middle">...).bind(...).fetch().flow { row,</text><path class="seq" d="M255 330 L727.4 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
