<rect x="716" y="380" width="16" height="732" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1185" y="820" width="16" height="52" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
