<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="1062" viewBox="0 0 1188 1062" role="img" aria-label="Validation Chaining Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1188" height="1062"/>
<rect class="frame" x="32" y="28" width="1124" height="1006" rx="28"/>
<text class="title" x="66" y="82">Validation Chaining Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="195" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="195" y1="252" x2="195" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="479" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="594" y="209" text-anchor="middle">RequireSupport</text>
<line class="lifeline" x1="594" y1="252" x2="594" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="878" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="993" y="209" text-anchor="middle">Valid Value</text>
<line class="lifeline" x1="993" y1="252" x2="993" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="227" y="286" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="245" y="313" text-anchor="start">1. username.requireNotBlank(username)</text>
<path class="line" d="M195 332 L594 332"/>
<rect x="125" y="396" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="423" text-anchor="start">ALT: blank or null</text>
<rect x="267.5" y="362" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="285.5" y="389" text-anchor="start">3. IllegalArgumentException</text>
<path class="dashed" d="M594 408 L195 408"/>
<rect x="125" y="574" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="601" text-anchor="start">ELSE: valid</text>
<rect x="287.5" y="438" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305.5" y="465" text-anchor="start">5. username (non-null)</text>
<path class="line" d="M594 484 L195 484"/>
<rect x="223" y="514" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="241" y="541" text-anchor="start">6. .requireStartsWith(user_, username)</text>
<path class="line" d="M195 560 L594 560"/>
<rect x="125" y="862" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="889" text-anchor="start">ALT: prefix mismatch</text>
<rect x="267.5" y="590" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="285.5" y="617" text-anchor="start">8. IllegalArgumentException</text>
<path class="dashed" d="M594 636 L195 636"/>
<rect x="125" y="1040" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="1067" text-anchor="start">ELSE: valid</text>
<rect x="678.5" y="666" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="696.5" y="693" text-anchor="start">10. username (validated)</text>
<path class="line" d="M594 712 L993 712"/>
<rect x="271.5" y="742" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="289.5" y="769" text-anchor="start">11. age.requireGe(18, age)</text>
<path class="line" d="M195 788 L594 788"/>
<rect x="125" y="1328" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="1355" text-anchor="start">ALT: less than 18</text>
<rect x="263.5" y="818" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="281.5" y="845" text-anchor="start">13. IllegalArgumentException</text>
<path class="dashed" d="M594 864 L195 864"/>
<rect x="125" y="1506" width="938" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="147" y="1533" text-anchor="start">ELSE: valid</text>
<rect x="279.5" y="894" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="297.5" y="921" text-anchor="start">15. age (chained return)</text>
<path class="line" d="M594 940 L195 940"/>
</svg>
