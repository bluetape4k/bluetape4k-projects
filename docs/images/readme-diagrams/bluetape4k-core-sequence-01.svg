<g id="m3"><rect class="labelPill" x="366.2" y="521" width="246.7" height="26" rx="7"/><circle cx="385.2" cy="534" r="12" fill="#2E8F89"/><text class="detail" x="385.2" y="535" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="507.5" y="535" text-anchor="middle" dominant-baseline="middle">username (non-null)</text><path class="seqReturn" d="M724 564 L255 564" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
