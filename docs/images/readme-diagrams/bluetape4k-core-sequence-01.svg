<g id="m5"><rect class="labelPill" x="347.9" y="697" width="283.2" height="26" rx="7"/><circle cx="366.9" cy="710" r="12" fill="#2E8F89"/><text class="detail" x="366.9" y="711" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="507.5" y="711" text-anchor="middle" dominant-baseline="middle">IllegalArgumentException</text><path class="seqReturn" d="M724 740 L255 740" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m6"><rect class="labelPill" x="831.5" y="785" width="254" height="26" rx="7"/><circle cx="850.5" cy="798" r="12" fill="#2E8F89"/><text class="detail" x="850.5" y="799" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="976.5" y="799" text-anchor="middle" dominant-baseline="middle">username (validated)</text><path class="seqReturn" d="M724 828 L1193 828" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m7"><rect class="labelPill" x="355.2" y="873" width="268.6" height="26" rx="7"/><circle cx="374.2" cy="886" r="12" fill="#4F83BF"/><text class="detail" x="374.2" y="887" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="507.5" y="887" text-anchor="middle" dominant-baseline="middle">age.requireGe(18, age)</text><path class="seq" d="M255 916 L724 916" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m8"><rect class="labelPill" x="347.9" y="961" width="283.2" height="26" rx="7"/><circle cx="366.9" cy="974" r="12" fill="#2E8F89"/><text class="detail" x="366.9" y="975" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="507.5" y="975" text-anchor="middle" dominant-baseline="middle">IllegalArgumentException</text><path class="seqReturn" d="M724 1004 L255 1004" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m9"><rect class="labelPill" x="362.5" y="1049" width="254" height="26" rx="7"/><circle cx="381.5" cy="1062" r="12" fill="#2E8F89"/><text class="detail" x="381.5" y="1063" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text><text class="detail" x="507.5" y="1063" text-anchor="middle" dominant-baseline="middle">age (chained return)</text><path class="seqReturn" d="M724 1092 L255 1092" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g><rect x="140" y="1220" width="1168" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="724" y="1246" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
