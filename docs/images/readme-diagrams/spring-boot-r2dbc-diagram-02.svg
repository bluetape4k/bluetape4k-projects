<svg data-intent="Redesign R2DBC coroutine data flow around R2dbcEntityOperations and reactive CRUD operation specs converging on Flow/suspend APIs." data-evidence="spring-boot/r2dbc/README.md; spring-boot/r2dbc/src/main/kotlin/io/bluetape4k/spring/r2dbc/coroutines" data-source-read="spring-boot/r2dbc/README.md; spring-boot/r2dbc/src/main/kotlin/io/bluetape4k/spring/r2dbc/coroutines" xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-label="R2DBC + Coroutines Data Flow">
<defs>
