<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1173" viewBox="0 0 1500 1173" role="img" aria-label="Cassandra Core API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1173"/>
<rect class="frame" x="32" y="28" width="1436" height="1117" rx="30"/>
<text class="title" x="68" y="84">Cassandra Core API Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="cql" data-to="async" data-route-color="teal" d="M717 303 L717 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="builder" data-to="qb" data-route-color="amber" d="M327 536 L327 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="async" data-to="row" data-route-color="pink" d="M717 536 L717 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="qb" data-to="statement" data-route-color="purple" d="M327 777 L327 865" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="async" data-to="qb" data-route-color="olive" d="M537 506 L522 506 L522 661 L507 661" stroke="#718A35" stroke-dasharray="8 7"/>
<g id="cql">
  <rect class="classCard" x="537" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="717" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="212" text-anchor="middle">CqlSession</text>
  <line x1="537" y1="221" x2="897" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="571" y="258">+execute(statement)</text>
<text class="member" x="571" y="275">+prepare(query)</text>
</g>
<g id="builder">
  <rect class="classCard" x="147" y="398" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="327" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="327" y="445" text-anchor="middle">StatementBuilders</text>
  <line x1="147" y1="454" x2="507" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="181" y="491">+selectFrom(...)</text>
<text class="member" x="181" y="508">+insertInto(...)</text>
</g>
<g id="async">
  <rect class="classCard" x="537" y="398" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="717" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="445" text-anchor="middle">AsyncCqlSession</text>
  <line x1="537" y1="454" x2="897" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="571" y="491">+executeSuspending(...)</text>
<text class="member" x="571" y="508">+executeFlow(...)</text>
</g>
<g id="qb">
  <rect class="classCard" x="147" y="631" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="327" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="327" y="678" text-anchor="middle">QueryBuilderExtensions</text>
  <line x1="147" y1="687" x2="507" y2="687" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="181" y="719">+whereEq(...)</text>
<text class="member" x="181" y="736">+orderBy(...)</text>
<text class="member" x="181" y="753">+bind(...)</text>
</g>
<g id="row">
  <rect class="classCard" x="537" y="631" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="717" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="678" text-anchor="middle">Rows and mapped values</text>
  <line x1="537" y1="687" x2="897" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="571" y="732">typed extraction helpers</text>
</g>
<g id="flow">
  <rect class="classCard" x="993" y="165" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1173" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="212" text-anchor="middle">FlowRow</text>
  <line x1="993" y1="221" x2="1353" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1027" y="266">streamed query results</text>
</g>
<g id="statement">
  <rect class="classCard" x="147" y="865" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="327" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="327" y="912" text-anchor="middle">Bound statements</text>
  <line x1="147" y1="921" x2="507" y2="921" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="181" y="966">driver-ready CQL</text>
</g>
<g>
  <rect x="1085" y="1065" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1083 L1161 1083" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1088">inheritance / implementation</text>
  <path class="dependency" d="M1103 1104 L1161 1104" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1109">dependency / usage</text>
</g>
<g><rect x="180" y="1083" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1109" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
