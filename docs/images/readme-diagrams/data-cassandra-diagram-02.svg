<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1306" viewBox="0 0 1754 1306" role="img" aria-label="Core API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1306"/>
<rect class="frame" x="32" y="28" width="1690" height="1250" rx="28"/>
<text class="title" x="66" y="82">Core API Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1492 363 C1492 428.5 877 428.5 877 494"/>
<path class="line" d="M877 494 C877 439 672 439 672 384"/>
<path class="line" d="M262 172 C262 278 672 278 672 384"/>
<path class="line" d="M1082 172 C1082 278 672 278 672 384"/>
<path class="inheritLine" d="M877 903 C877 643.5 672 643.5 672 384"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CassandraAdmin</text>
  <text class="mono" x="18" y="108">+createKeyspace(session, keyspace, rf):</text>
<text class="mono" x="18" y="129">Boolean</text>
<text class="mono" x="18" y="150">+dropKeyspace(session, keyspace): Boolean</text>
<text class="mono" x="18" y="171">+getReleaseVersion(session): String</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CqlSession</text>
  <text class="mono" x="18" y="108">+execute(statement): ResultSet</text>
<text class="mono" x="18" y="129">+executeAsync(statement):</text>
<text class="mono" x="18" y="150">CompletableFuture</text>
<text class="mono" x="18" y="171">+prepare(query): PreparedStatement</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">CqlSessionExtensions</text>
  <text class="mono" x="18" y="108">+executeSuspending(query): AsyncResultSet</text>
<text class="mono" x="18" y="129">+prepareSuspending(query):</text>
<text class="mono" x="18" y="150">PreparedStatement</text>
<text class="mono" x="18" y="171">+rowsFlow(): Flow~Row~</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">QueryBuilderExtensions</text>
  <text class="mono" x="18" y="108">+String.bindMarker(): BindMarker</text>
<text class="mono" x="18" y="129">+String.raw(): Raw</text>
<text class="mono" x="18" y="150">+String.udt(): UserDefinedType</text>
</g>
<g transform="translate(707,502)">
  <rect class="card" x="0" y="0" width="340" height="259" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">StatementBuilders</text>
  <text class="mono" x="18" y="108">+statementOf(query): SimpleStatement</text>
<text class="mono" x="18" y="129">+simpleStatementOf(query, block):</text>
<text class="mono" x="18" y="150">SimpleStatement</text>
<text class="mono" x="18" y="171">+boundStatementOf(bound, block):</text>
<text class="mono" x="18" y="192">BoundStatement</text>
<text class="mono" x="18" y="213">+batchStatementOf(type, block):</text>
<text class="mono" x="18" y="234">BatchStatement</text>
</g>
<g transform="translate(707,911)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">AsyncCqlSession</text>
  <text class="mono" x="18" y="108">+executeAsync(statement):</text>
<text class="mono" x="18" y="129">CompletableFuture</text>
<text class="mono" x="18" y="150">+prepareAsync(query): CompletableFuture</text>
</g>
</svg>
