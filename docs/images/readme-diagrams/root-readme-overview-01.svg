<svg data-intent="Explain the repository-wide bluetape4k ecosystem by grouping modules into foundation, data/cache, integration/runtime, and applications/testing boundaries so README readers understand where to start." data-evidence="README.md; settings.gradle.kts; AGENTS.md module groups" data-source-read="README.md; settings.gradle.kts" xmlns="http://www.w3.org/2000/svg" width="1758" height="1476" viewBox="0 0 1758 1476" role="img" aria-label="Bluetape4k Projects Overview">
