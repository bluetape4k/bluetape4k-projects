<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="780" viewBox="0 0 1540 780" role="img" aria-label="Turnstile Simple FSM">
<defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow-startLocked" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#64748B"/></marker>
<marker id="arrow-coinUnlock" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#2563EB"/></marker>
<marker id="arrow-pushLock" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#16A34A"/></marker>
<marker id="arrow-coinStay" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#EA580C"/></marker>
<style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}.card,.note{filter:url(#softShadow);stroke-width:2}.stateTitle{font-family:"Architects Daughter";font-size:36px;fill:#0F172A}.detail,.noteText{font-family:"Comic Mono";font-size:15px;fill:#475569}.start{fill:#0F172A}.edge{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.5px;fill:#475569}</style></defs>
<rect class="canvas" width="1540" height="780"/><rect class="frame" x="38" y="30" width="1464" height="714" rx="8"/>
<text class="title" x="78" y="86">Turnstile Simple FSM</text>
<text class="subtitle" x="82" y="118">A two-state machine: a coin unlocks the gate, a push locks it again, and extra coins keep it unlocked.</text>
<g id="edges"><path class="edge" d="M174 432 L285 432" stroke="#64748B" marker-end="url(#arrow-startLocked)"/>
<path class="edge" d="M655 380 L930 380" stroke="#2563EB" marker-end="url(#arrow-coinUnlock)"/>
<path class="edge" d="M930 470 L655 470" stroke="#16A34A" marker-end="url(#arrow-pushLock)"/>
<path class="edge" d="M 1115 330 L 1115 229 Q 1115 215 1129 215 L 1341 215 Q 1355 215 1355 229 L 1355 411 Q 1355 425 1341 425 L 1300 425" stroke="#EA580C" marker-end="url(#arrow-coinStay)" stroke-linecap="round" stroke-linejoin="round"/></g>
<g id="labels"><g class="edgeLabel" transform="translate(194 392)"><rect width="72" height="30" rx="8"/><text x="36" y="20" text-anchor="middle">initial</text></g>
<g class="edgeLabel" transform="translate(763 338)"><rect width="58" height="30" rx="8"/><text x="29" y="20" text-anchor="middle">Coin</text></g>
<g class="edgeLabel" transform="translate(763 488)"><rect width="58" height="30" rx="8"/><text x="29" y="20" text-anchor="middle">Push</text></g>
<g class="edgeLabel" transform="translate(1186 174)"><rect width="98" height="30" rx="8"/><text x="49" y="20" text-anchor="middle">Coin again</text></g></g>
<circle id="start" class="start" cx="162" cy="432" r="12"/>
<g id="locked"><rect class="card" x="285" y="330" width="370" height="190" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stateTitle" x="470" y="400" text-anchor="middle">LOCKED</text>
  <text class="detail" x="470" y="442" text-anchor="middle">initial state</text>
  <text class="detail" x="470" y="466" text-anchor="middle">waits for Coin</text></g>
<g id="unlocked"><rect class="card" x="930" y="330" width="370" height="190" rx="8" fill="#ECFDF5" stroke="#16A34A"/>
  <text class="stateTitle" x="1115" y="400" text-anchor="middle">UNLOCKED</text>
  <text class="detail" x="1115" y="442" text-anchor="middle">allows Push</text>
  <text class="detail" x="1115" y="466" text-anchor="middle">extra Coin is ignored</text></g>
<g id="note"><rect class="note" x="550" y="610" width="440" height="76" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="noteText" x="770" y="656" text-anchor="middle">No final states: transitions can continue forever</text></g>
</svg>