<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc" data-layout="state-machine" data-intent="Explain the simple turnstile finite state machine with two states, two events, an initial locked state, and a cyclic transition path." data-evidence="utils/states/README.md, Quick Start FSM examples" data-source-read="utils/states/README.md;utils/states/src/test/kotlin/**/*.kt">
<title id="title">Turnstile FSM</title>
<desc id="desc">Coin unlocks the turnstile; push locks it again.</desc>
<style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .title { fill: #0f172a; font-size: 34px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #475569; font-size: 18px; font-weight: 500; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panelTitle { fill: #334155; font-size: 14px; font-weight: 800; letter-spacing: .2px; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
    .card { stroke-width: 1.7; filter: url(#cardShadow); }
    .stateTitle { fill: #0f172a; font-size: 17px; font-weight: 800; }
    .stateDetail { fill: #475569; font-size: 12px; font-weight: 600; }
    .iconBadge { stroke-width: 1.5; }
    .iconStroke { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .iconFill { fill: #ffffff; }
    .arrow { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrowLabelBg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .arrowLabel { fill: #1e293b; font-size: 13px; font-weight: 800; text-anchor: middle; }
    .footer { fill: #64748b; font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
<rect width="1200" height="640" fill="#f8fafc"/>
<rect x="30" y="30" width="1140" height="580" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="title" x="70" y="92">Turnstile FSM</text>
<text class="subtitle" x="70" y="124">Coin unlocks the turnstile; push locks it again.</text>
<rect class="panel" x="55" y="145" width="1090" height="405" rx="18"/><text class="panelTitle" x="79" y="179">State transitions</text>
<circle cx="86" cy="320" r="10" fill="#172033"/>
<g><path class="route arrow" d="M120,320 L210,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="128" y="286" width="74" height="22" rx="11"/><text class="arrowLabel" x="165" y="302">initial</text></g>
<g><path class="route arrow" d="M470,320 L730,320" stroke="#2563eb"/><rect class="arrowLabelBg" x="573" y="286" width="54" height="22" rx="11"/><text class="arrowLabel" x="600" y="302">Coin</text></g>
<g><path class="route arrow" d="M730,360 L600,455 L340,455 L340,375" stroke="#16a34a"/><rect class="arrowLabelBg" x="443" y="421" width="54" height="22" rx="11"/><text class="arrowLabel" x="470" y="437">Push</text></g>
<g id="locked"><rect class="card" x="210" y="265" width="260" height="110" rx="8" fill="#eff6ff" stroke="#2563eb"/><g transform="translate(230,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#2563eb" stroke="#2563eb"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="290" y="312">Locked</text><text class="stateDetail" x="290" y="338">initial</text><text class="stateDetail" x="290" y="356">push rejected</text></g>
<g id="unlocked"><rect class="card" x="730" y="265" width="260" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a"/><g transform="translate(750,298)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#16a34a" stroke="#16a34a"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="810" y="312">Unlocked</text><text class="stateDetail" x="810" y="338">coin accepted</text><text class="stateDetail" x="810" y="356">push opens</text></g>
<circle cx="1112" cy="522" r="13" fill="none" stroke="#172033" stroke-width="3"/><circle cx="1112" cy="522" r="8" fill="#172033"/>
<text class="footer" x="70" y="596">Generated as direct SVG. Sequence diagrams are intentionally preserved.</text>
</svg>