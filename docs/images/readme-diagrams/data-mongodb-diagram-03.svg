<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="MongoDB aggregation pipeline data flow">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="flowArrow" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
    <marker id="stageArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6.5 L 1 12 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .band { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .bandTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #0f172a; }
      .card { filter: url(#softShadow); stroke-width: 1.7; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .detail { font-family: "Comic Mono"; font-size: 12.5px; fill: #334155; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#flowArrow); }
      .stage { fill: none; stroke: #16a34a; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#stageArrow); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1000"/>
  <rect class="frame" x="34" y="30" width="1432" height="940" rx="10"/>
  <text class="title" x="72" y="86">MongoDB Aggregation Pipeline Data Flow</text>
  <text class="subtitle" x="76" y="118">bluetape4k builds the stage list; the MongoDB coroutine driver executes aggregate(...) as Flow</text>

  <rect class="band" x="74" y="154" width="1352" height="300" rx="10"/>
  <text class="bandTitle" x="104" y="194">Pipeline composition and execution boundary</text>

  <g id="dsl">
    <rect class="card" x="116" y="252" width="260" height="112" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="246" y="288" text-anchor="middle">pipeline { ... }</text>
    <text class="detail" x="246" y="320" text-anchor="middle">MutableList&lt;Bson&gt;.() builder</text>
    <text class="detail" x="246" y="346" text-anchor="middle">adds stage helpers in order</text>
  </g>

  <g id="stages">
    <rect class="card" x="462" y="252" width="260" height="112" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="592" y="288" text-anchor="middle">List&lt;Bson&gt; stages</text>
    <text class="detail" x="592" y="320" text-anchor="middle">match, group, sort, limit</text>
    <text class="detail" x="592" y="346" text-anchor="middle">skip, project, unwind</text>
  </g>

  <g id="aggregate">
    <rect class="card" x="808" y="252" width="260" height="112" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="cardTitle" x="938" y="288" text-anchor="middle">collection.aggregate</text>
    <text class="detail" x="938" y="320" text-anchor="middle">native driver API</text>
    <text class="detail" x="938" y="346" text-anchor="middle">no aggregateAsFlow wrapper</text>
  </g>

  <g id="flow">
    <rect class="card" x="1154" y="252" width="260" height="112" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="1284" y="288" text-anchor="middle">AggregateFlow&lt;T&gt;</text>
    <text class="detail" x="1284" y="320" text-anchor="middle">already implements Flow&lt;T&gt;</text>
    <text class="detail" x="1284" y="346" text-anchor="middle">collect / toList downstream</text>
  </g>

  <path class="flow" d="M 376 308 L 462 308"/>
  <path class="flow" d="M 722 308 L 808 308"/>
  <path class="flow" d="M 1068 308 L 1154 308"/>

  <rect class="band" x="74" y="500" width="1352" height="292" rx="10"/>
  <text class="bandTitle" x="104" y="540">Stage helper functions</text>

  <g id="match">
    <rect class="card" x="126" y="594" width="188" height="84" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="220" y="626" text-anchor="middle">matchStage</text>
    <text class="detail" x="220" y="654" text-anchor="middle">Aggregates.match(filter)</text>
  </g>
  <g id="group">
    <rect class="card" x="346" y="594" width="188" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="440" y="626" text-anchor="middle">groupStage</text>
    <text class="detail" x="440" y="654" text-anchor="middle">group("$id", fields)</text>
  </g>
  <g id="sort">
    <rect class="card" x="566" y="594" width="188" height="84" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="cardTitle" x="660" y="626" text-anchor="middle">sortStage</text>
    <text class="detail" x="660" y="654" text-anchor="middle">Aggregates.sort(sort)</text>
  </g>
  <g id="page">
    <rect class="card" x="786" y="594" width="188" height="84" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="cardTitle" x="880" y="626" text-anchor="middle">limit/skip</text>
    <text class="detail" x="880" y="654" text-anchor="middle">page the stream source</text>
  </g>
  <g id="project">
    <rect class="card" x="1006" y="594" width="188" height="84" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="cardTitle" x="1100" y="626" text-anchor="middle">projectStage</text>
    <text class="detail" x="1100" y="654" text-anchor="middle">projection Bson</text>
  </g>
  <g id="unwind">
    <rect class="card" x="1226" y="594" width="152" height="84" rx="8" fill="#fdf2f8" stroke="#db2777"/>
    <text class="cardTitle" x="1302" y="626" text-anchor="middle">unwind</text>
    <text class="detail" x="1302" y="654" text-anchor="middle">"$field"</text>
  </g>

  <rect x="112" y="568" width="1290" height="144" rx="10" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-dasharray="8 6"/>
  <text class="small" x="757" y="704" text-anchor="middle">stage helpers return Bson values that the builder appends in caller-defined order</text>
  <path class="stage" d="M 757 568 L 757 462 L 592 462 L 592 364"/>

  <rect class="band" x="74" y="834" width="1352" height="112" rx="10"/>
  <text class="bandTitle" x="104" y="884">Reader contract</text>
  <text class="small" x="324" y="862">The DSL only composes ordered Bson stages.</text>
  <text class="small" x="324" y="886">It does not own execution, cursor lifecycle, or collection typing.</text>
  <text class="small" x="324" y="910">Execute with native aggregate(stages), then use Flow operators</text>
  <text class="small" x="324" y="932">such as collect(), toList(), map(), or filter().</text>
</svg>
