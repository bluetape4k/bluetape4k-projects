<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1600" viewBox="0 0 2200 1600" role="img" aria-label="Hibernate Lettuce demo UML structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>

  <marker id="arrow-teal" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="arrow-pink" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#BE185D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="arrow-slate" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>

  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:48px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}.laneTitle{font-family:"Comic Mono";font-size:15px;fill:#64748B}
    .classBox{stroke-width:1.8;filter:url(#shadow)}.stereotype{font-family:"Comic Mono";font-size:14px;fill:#475569}.classTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
    .member{font-family:"Comic Mono";font-size:14px;fill:#334155}.divider{stroke-width:1.1;opacity:.45}
    .edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="2200" height="1600"/>
<rect class="frame" x="34" y="30" width="2132" height="1540" rx="8"/>
<text class="title" x="72" y="86">Hibernate Lettuce Demo UML Structure</text>
<text class="subtitle" x="76" y="120">Controllers, repository, cache management endpoint, and the auto-configured LettuceNearCacheRegionFactory used by the demo.</text>

<rect class="lane" x="76" y="170" width="660" height="1310" rx="8"/>
<rect class="lane" x="770" y="170" width="660" height="1310" rx="8"/>
<rect class="lane" x="1464" y="170" width="660" height="1310" rx="8"/>
<text class="laneTitle" x="96" y="202">Product CRUD API</text>
<text class="laneTitle" x="790" y="202">Auto-configured cache layer</text>
<text class="laneTitle" x="1484" y="202">Cache management API</text>

<g id="ApplicationConfig">
  <rect class="classBox" x="790" y="220" width="620" height="210" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="stereotype" x="1100" y="250" text-anchor="middle">&lt;&lt;application.yml&gt;&gt;</text>
  <text class="classTitle" x="1100" y="282" text-anchor="middle">Lettuce near-cache settings</text>
  <path class="divider" d="M790 302H1410" stroke="#0F766E"/>
  <text class="member" x="820" y="330">redis-uri: redis://localhost:6379</text>
  <text class="member" x="820" y="354">codec: lz4fory, use-resp3: true</text>
  <text class="member" x="820" y="378">local.max-size: 5000, expire-after-write: 15m</text>
  <text class="member" x="820" y="402">redis-ttl.default: 120s, product: 300s</text>
</g>

<g id="AutoConfig">
  <rect class="classBox" x="790" y="520" width="620" height="230" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="stereotype" x="1100" y="550" text-anchor="middle">&lt;&lt;Spring Boot auto-configuration&gt;&gt;</text>
  <text class="classTitle" x="1100" y="582" text-anchor="middle">Hibernate 2LC customization</text>
  <path class="divider" d="M790 602H1410" stroke="#15803D"/>
  <text class="member" x="820" y="630">adds HibernatePropertiesCustomizer</text>
  <text class="member" x="820" y="654">sets region.factory_class</text>
  <text class="member" x="820" y="678">enables Hibernate second-level cache</text>
  <text class="member" x="820" y="702">binds codec, Redis, local cache, TTL, metrics</text>
</g>

<g id="RegionFactory">
  <rect class="classBox" x="790" y="850" width="620" height="245" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="stereotype" x="1100" y="880" text-anchor="middle">&lt;&lt;Hibernate RegionFactory&gt;&gt;</text>
  <text class="classTitle" x="1100" y="912" text-anchor="middle">LettuceNearCacheRegionFactory</text>
  <path class="divider" d="M790 932H1410" stroke="#475569"/>
  <text class="member" x="820" y="960">getCaches(): Map&lt;String, LettuceNearCache&lt;Any&gt;&gt;</text>
  <text class="member" x="820" y="984">creates per-region storage access</text>
  <text class="member" x="820" y="1008">L1 Caffeine + L2 Redis near-cache</text>
  <path class="divider" d="M790 1030H1410" stroke="#475569"/>
  <text class="member" x="820" y="1058">localStats(), localCacheSize(), clearLocal()</text>
</g>

<g id="ProductEntity">
  <rect class="classBox" x="790" y="1210" width="620" height="230" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="stereotype" x="1100" y="1240" text-anchor="middle">&lt;&lt;JPA entity&gt;&gt;</text>
  <text class="classTitle" x="1100" y="1272" text-anchor="middle">Product</text>
  <path class="divider" d="M790 1292H1410" stroke="#C2410C"/>
  <text class="member" x="820" y="1320">@Cacheable</text>
  <text class="member" x="820" y="1344">@Cache(NONSTRICT_READ_WRITE, region = product)</text>
  <text class="member" x="820" y="1368">id, name, description, price</text>
  <path class="divider" d="M790 1390H1410" stroke="#C2410C"/>
  <text class="member" x="820" y="1418">region name drives Redis key prefix and TTL override</text>
</g>

<g id="ProductController">
  <rect class="classBox" x="100" y="520" width="560" height="250" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stereotype" x="380" y="550" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="classTitle" x="380" y="582" text-anchor="middle">ProductController</text>
  <path class="divider" d="M100 602H660" stroke="#1D4ED8"/>
  <text class="member" x="130" y="630">base path: /api/products</text>
  <text class="member" x="130" y="654">constructor: ProductRepository</text>
  <path class="divider" d="M100 676H660" stroke="#1D4ED8"/>
  <text class="member" x="130" y="704">GET list, GET by id</text>
  <text class="member" x="130" y="728">POST create, PUT update, DELETE by id</text>
</g>

<g id="ProductRepository">
  <rect class="classBox" x="100" y="930" width="560" height="225" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stereotype" x="380" y="960" text-anchor="middle">&lt;&lt;Repository&gt;&gt;</text>
  <text class="classTitle" x="380" y="992" text-anchor="middle">ProductRepository</text>
  <path class="divider" d="M100 1012H660" stroke="#1D4ED8"/>
  <text class="member" x="130" y="1040">extends JpaRepository&lt;Product, Long&gt;</text>
  <text class="member" x="130" y="1064">findByName(name): List&lt;Product&gt;</text>
  <path class="divider" d="M100 1086H660" stroke="#1D4ED8"/>
  <text class="member" x="130" y="1114">QueryHint: cache.retrieveMode = USE</text>
</g>

<g id="CacheController">
  <rect class="classBox" x="1540" y="520" width="560" height="285" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="stereotype" x="1820" y="550" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="classTitle" x="1820" y="582" text-anchor="middle">CacheController</text>
  <path class="divider" d="M1540 602H2100" stroke="#BE185D"/>
  <text class="member" x="1570" y="630">base path: /api/cache</text>
  <text class="member" x="1570" y="654">constructor: EntityManagerFactory</text>
  <path class="divider" d="M1540 676H2100" stroke="#BE185D"/>
  <text class="member" x="1570" y="704">GET /stats</text>
  <text class="member" x="1570" y="728">DELETE /evict</text>
  <text class="member" x="1570" y="752">DELETE /evict/{region}</text>
  <text class="member" x="1570" y="776">clearLocal(): L1 only, Redis L2 untouched</text>
</g>

<g id="EntityManagerFactory">
  <rect class="classBox" x="1540" y="930" width="560" height="225" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="stereotype" x="1820" y="960" text-anchor="middle">&lt;&lt;JPA infrastructure&gt;&gt;</text>
  <text class="classTitle" x="1820" y="992" text-anchor="middle">EntityManagerFactory</text>
  <path class="divider" d="M1540 1012H2100" stroke="#BE185D"/>
  <text class="member" x="1570" y="1040">unwrap(SessionFactoryImplementor::class.java)</text>
  <text class="member" x="1570" y="1064">serviceRegistry.getService(RegionFactory::class.java)</text>
  <path class="divider" d="M1540 1086H2100" stroke="#BE185D"/>
  <text class="member" x="1570" y="1114">returns LettuceNearCacheRegionFactory when active</text>
</g>

<g data-from="ApplicationConfig" data-to="AutoConfig">
  <path class="edge dashed" d="M1100 430 L1100 520" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <text class="edgeLabel" x="1126" y="480">binds properties</text>
</g>
<g data-from="AutoConfig" data-to="RegionFactory">
  <path class="edge dashed" d="M1100 750 L1100 850" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="1126" y="806">factory class</text>
</g>
<g data-from="RegionFactory" data-to="ProductEntity">
  <path class="edge" d="M1100 1095 L1100 1210" stroke="#475569" marker-end="url(#arrow-slate)"/>
  <text class="edgeLabel" x="1126" y="1160">region = product</text>
</g>
<g data-from="ProductController" data-to="ProductRepository">
  <path class="edge dashed" d="M380 770 L380 930" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="406" y="856">uses repository</text>
</g>
<g data-from="ProductRepository" data-to="ProductEntity">
  <path class="edge dashed" d="M660 1042 L725 1042 L725 1325 L790 1325" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="672" y="1178">JpaRepository&lt;Product, Long&gt;</text>
</g>
<g data-from="CacheController" data-to="EntityManagerFactory">
  <path class="edge dashed" d="M1820 805 L1820 930" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1846" y="874">unwraps</text>
</g>
<g data-from="EntityManagerFactory" data-to="RegionFactory">
  <path class="edge dashed" d="M1540 1042 L1410 1042" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1434" y="1020">gets RegionFactory</text>
</g>
</svg>
