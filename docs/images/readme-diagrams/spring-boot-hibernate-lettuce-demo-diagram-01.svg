<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="957" viewBox="0 0 1500 957" role="img" aria-label="UML Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="957"/>
<rect class="frame" x="32" y="28" width="1436" height="901" rx="30"/>
<text class="title" x="68" y="84">UML Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="ProductRepository" data-to="HibernateSessionFactory" data-route-color="teal" d="M560 234 L500 234 L500 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="HibernateSessionFactory" data-to="LettuceNearCacheRegionFactory" data-route-color="amber" d="M350 536 L350 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ProductRepository" data-to="Product" data-route-color="pink" d="M750 303 L750 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ProductController" data-to="ProductRepository" data-route-color="purple" d="M998 398 L998 271 L960 271" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="LettuceNearCacheRegionFactory">
  <rect class="classCard" x="170" y="631" width="360" height="156" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="350" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="350" y="669" text-anchor="middle">LettuceNearCacheRegion</text>
<text class="classTitle" x="350" y="691" text-anchor="middle">Factory</text>
  <line x1="170" y1="695" x2="530" y2="695" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="204" y="728">+buildCache(regionName, config):</text>
<text class="member" x="204" y="745">RegionAccessStrategy</text>
<text class="member" x="204" y="762">+getL1Cache(region): CaffeineCache</text>
</g>
<g id="ProductRepository">
  <rect class="classCard" x="560" y="165" width="400" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="760" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="760" y="212" text-anchor="middle">ProductRepository</text>
  <line x1="560" y1="221" x2="960" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="594" y="258">+findByName(name): List~Product~</text>
<text class="member" x="594" y="275">+findByPriceLessThan(price): List~Product~</text>
</g>
<g id="HibernateSessionFactory">
  <rect class="classCard" x="170" y="398" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="350" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="350" y="445" text-anchor="middle">HibernateSessionFactory</text>
  <line x1="170" y1="454" x2="530" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="204" y="491">+openSession(): Session</text>
<text class="member" x="204" y="508">+getCurrentSession(): Session</text>
</g>
<g id="Product">
  <rect class="classCard" x="560" y="398" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="740" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="740" y="445" text-anchor="middle">Product</text>
  <line x1="560" y1="454" x2="920" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="594" y="486">+id: Long?</text>
<text class="member" x="594" y="503">+name: String</text>
<text class="member" x="594" y="520">+description: String?</text>
</g>
<g id="ProductController">
  <rect class="classCard" x="950" y="398" width="380" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1140" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1140" y="445" text-anchor="middle">ProductController</text>
  <line x1="950" y1="454" x2="1330" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="984" y="486">-productRepository: ProductRepository</text>
<text class="member" x="984" y="503">+findAll(): List~Product~</text>
<text class="member" x="984" y="520">+findById(id): ResponseEntity~Product~</text>
</g>
<g>
  <rect x="1085" y="849" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 867 L1161 867" stroke="#3E9868"/>
  <text class="detail" x="1175" y="872">inheritance / implementation</text>
  <path class="dependency" d="M1103 888 L1161 888" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="893">dependency / usage</text>
</g>
<g><rect x="180" y="867" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="893" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
