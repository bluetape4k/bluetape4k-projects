<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="900" viewBox="0 0 1754 900" role="img" aria-label="Vert.x Core Component Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1754" height="900"/>
<rect class="frame" x="32" y="28" width="1690" height="844" rx="28"/>
<text class="title" x="66" y="82">Vert.x Core Component Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="148" width="1640" height="260" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="176">Contract layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="494" width="1640" height="218" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="522">Abstraction layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M672 180 L672 112 L1082 112 L1082 334"/>
<path class="inheritLine" d="M877 526 L877 451 L1492 451 L1492 355"/>
<path class="line" d="M672 376 L672 443 L877 443 L877 526"/>
<path class="line" d="M672 180 L672 435 L262 435 L262 355"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">EventBus</text>
  <text class="mono" x="18" y="108">+send(address, message)</text>
<text class="mono" x="18" y="129">+publish(address, message)</text>
<text class="mono" x="18" y="150">+consumer(address) MessageConsumer</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«VertxKotlin»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CoroutineVerticle</text>
  <text class="mono" x="18" y="108">+vertx: Vertx</text>
<text class="mono" x="18" y="129">+context: Context</text>
<text class="mono" x="18" y="150">+start()</text>
<text class="mono" x="18" y="171">+stop()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«Resilience4j»</text>
  <text class="label" x="170" y="61" text-anchor="middle">CircuitBreaker</text>
  <text class="mono" x="18" y="108">+executeSuspend(block) T</text>
<text class="mono" x="18" y="129">+getState() State</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">SqlClient</text>
  <text class="mono" x="18" y="108">+preparedQuery(sql) PreparedQuery</text>
<text class="mono" x="18" y="129">+query(sql) Query</text>
<text class="mono" x="18" y="150">+close() Future</text>
</g>
<g transform="translate(707,526)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
    <text class="label" x="170" y="49" text-anchor="middle">Pool</text>
  <text class="mono" x="18" y="108">+withConnection(handler) Future</text>
<text class="mono" x="18" y="129">+withTransaction(handler) Future</text>
</g>
</svg>
