<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Vert.x Core Component Class Structure</title>
  <desc id="desc">UML-style component class view of Vert.x support files, SQL helpers, web coroutine route extensions, and Resilience4j decorators.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .method, .legend, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 17px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .classBox { fill: #ffffff; stroke: #546e7a; stroke-width: 2.2; }
      .coreBox { fill: #eef5fa; stroke: #3f7d9c; stroke-width: 2.2; }
      .sqlBox { fill: #fff7e8; stroke: #a97b3d; stroke-width: 2.2; }
      .webBox { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 2.2; }
      .resBox { fill: #f9eef0; stroke: #b86868; stroke-width: 2.2; }
      .runtimeBox { fill: #f2eef9; stroke: #7b67a8; stroke-width: 2.2; }
      .className { font-family: "Architects Daughter"; font-size: 22px; fill: #1f3138; }
      .stereo { font-family: "Comic Mono"; font-size: 13px; fill: #566b73; }
      .method { font-size: 12px; }
      .divider { stroke: #cfd9dd; stroke-width: 1.5; }
      .uses { fill: none; stroke: #7b67a8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openArrow); }
      .async { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openCore); }
      .res { fill: none; stroke: #b86868; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openRes); }
      .sql { fill: none; stroke: #a97b3d; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openSql); }
      .legend { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
    </style>
    <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#7b67a8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openCore" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#3f7d9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openRes" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#b86868" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="openSql" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#a97b3d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1072" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Vert.x Core Component Class Structure</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">The module is mostly extension-function surfaces around Vert.x, SQL Client, Web Router, and Resilience4j Future decorators.</text>

  <g id="vertx-runtime">
    <rect x="625" y="145" width="350" height="130" rx="10" class="runtimeBox"/>
    <text x="800" y="176" text-anchor="middle" class="stereo">&lt;&lt;external runtime&gt;&gt;</text>
    <text x="800" y="205" text-anchor="middle" class="className">Vert.x core types</text>
    <line x1="625" y1="226" x2="975" y2="226" class="divider"/>
    <text x="650" y="252" class="method">Vertx, Context, Future, Promise, Route</text>
  </g>

  <g id="vertx-support">
    <rect x="120" y="360" width="350" height="150" rx="10" class="coreBox"/>
    <text x="295" y="393" text-anchor="middle" class="className">VertxSupport.kt</text>
    <line x1="120" y1="414" x2="470" y2="414" class="divider"/>
    <text x="145" y="442" class="method">+ currentVertx(): Vertx</text>
    <text x="145" y="464" class="method">+ Vertx.withVertxDispatcher { ... }</text>
    <text x="145" y="486" class="method">uses Vertx.dispatcher()</text>
  </g>

  <g id="coroutine-support">
    <rect x="625" y="360" width="350" height="150" rx="10" class="coreBox"/>
    <text x="800" y="393" text-anchor="middle" class="className">CoroutineSupport.kt</text>
    <line x1="625" y1="414" x2="975" y2="414" class="divider"/>
    <text x="650" y="442" class="method">+ currentVertxDispatcher()</text>
    <text x="650" y="464" class="method">+ Vertx.asCoroutineScope()</text>
    <text x="650" y="486" class="method">+ currentVertxCoroutineScope()</text>
  </g>

  <g id="future-support">
    <rect x="1130" y="360" width="350" height="150" rx="10" class="coreBox"/>
    <text x="1305" y="393" text-anchor="middle" class="className">FutureExtensions.kt</text>
    <line x1="1130" y1="414" x2="1480" y2="414" class="divider"/>
    <text x="1155" y="442" class="method">+ Future&lt;T&gt;.asCompletableFuture()</text>
    <text x="1155" y="464" class="method">delegates to CompletionStage</text>
  </g>

  <g id="web-routes">
    <rect x="120" y="640" width="350" height="150" rx="10" class="webBox"/>
    <text x="295" y="673" text-anchor="middle" class="className">VertxRouteExtensions.kt</text>
    <line x1="120" y1="694" x2="470" y2="694" class="divider"/>
    <text x="145" y="722" class="method">+ Route.suspendHandler { ctx }</text>
    <text x="145" y="744" class="method">+ Route.suspendFailureHandler { ctx }</text>
    <text x="145" y="766" class="method">launch on current Vert.x scope</text>
  </g>

  <g id="sql-support">
    <rect x="625" y="640" width="350" height="165" rx="10" class="sqlBox"/>
    <text x="800" y="673" text-anchor="middle" class="className">SQL Client Helpers</text>
    <line x1="625" y1="694" x2="975" y2="694" class="divider"/>
    <text x="650" y="722" class="method">SqlClient.suspendQuery(...)</text>
    <text x="650" y="744" class="method">Pool.withSuspendTransaction { conn }</text>
    <text x="650" y="766" class="method">RowMapper and Tuple mapper helpers</text>
    <text x="650" y="788" class="method">MyBatis rendering strategy</text>
  </g>

  <g id="resilience">
    <rect x="1130" y="632" width="350" height="180" rx="10" class="resBox"/>
    <text x="1305" y="665" text-anchor="middle" class="className">VertxDecorators</text>
    <line x1="1130" y1="686" x2="1480" y2="686" class="divider"/>
    <text x="1155" y="714" class="method">+ ofSupplier { Future&lt;T&gt; }</text>
    <text x="1155" y="736" class="method">+ withCircuitBreaker / Retry / Bulkhead</text>
    <text x="1155" y="758" class="method">+ withRateLimiter / TimeLimiter</text>
    <text x="1155" y="780" class="method">+ withFallback(...)</text>
  </g>

  <g id="supplier">
    <rect x="1110" y="900" width="370" height="90" rx="10" class="resBox"/>
    <text x="1295" y="933" text-anchor="middle" class="className">SuspendVertxDecorateSupplier&lt;T&gt;</text>
    <line x1="1110" y1="952" x2="1480" y2="952" class="divider"/>
    <text x="1135" y="976" class="method">wraps and returns () -&gt; Future&lt;T&gt;</text>
  </g>

  <path class="async" d="M 295 360 L 295 314 Q 295 300 309 300 L 680 300 Q 690 300 690 290 L 690 275"/>
  <path class="async" d="M 800 360 L 800 275"/>
  <path class="async" d="M 1305 360 L 1305 314 Q 1305 300 1291 300 L 920 300 Q 910 300 910 290 L 910 275"/>
  <path class="uses" d="M 295 640 L 295 574 Q 295 560 309 560 L 746 560 Q 760 560 760 546 L 760 510" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="res" d="M 1305 632 L 1305 510"/>
  <path class="res" d="M 1305 812 L 1305 900"/>

  <rect x="96" y="1030" width="1408" height="34" rx="12" fill="#ffffff" stroke="#ccd7da" stroke-width="1.6"/>
  <text x="120" y="1052" class="legend">Open arrows show extension/helper dependencies. Vert.x runtime types stay external; bluetape4k adds coroutine, SQL, web, and resilience wrapper surfaces.</text>
  <text x="800" y="1088" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/vertx README</text>
</svg>
