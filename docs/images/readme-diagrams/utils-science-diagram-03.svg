<svg data-intent="Explain PostGIS and NetCDF database schema from current source tables." data-evidence="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/SpatialTables.kt; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/PoiTable.kt; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/NetCdfTables.kt" data-source-read="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/SpatialTables.kt; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/PoiTable.kt; utils/science/src/main/kotlin/io/bluetape4k/science/exposed/schema/NetCdfTables.kt" xmlns="http://www.w3.org/2000/svg" width="3100" height="1740" viewBox="0 0 3100 1740" role="img" aria-label="PostGIS + NetCDF Database Schema">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>

  <marker id="arrow-slate" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#475569" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-blue" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#1D4ED8" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-teal" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#0F766E" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-green" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#15803D" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-amber" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#C2410C" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-pink" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#BE185D" style="stroke-dasharray:none"/></marker>

  <marker id="arrow-violet" markerWidth="22" markerHeight="22" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path stroke-dasharray="none" d="M 3 3 L 19 11 L 3 19 Z" fill="#6D28D9" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:48px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .band{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2;opacity:.72}.bandTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
    .table,.note{stroke-width:1.8;filter:url(#shadow)}.kicker{font-family:"Comic Mono";font-size:13px;fill:#475569}.tableTitle,.noteTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
    .col,.noteLine{font-family:"Comic Mono";font-size:13.5px;fill:#334155}.divider{stroke-width:1.1;opacity:.42}
    .edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#334155;paint-order:stroke;stroke:#FFFFFF;stroke-width:3px;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="3100" height="1740"/>
<rect class="frame" x="34" y="30" width="3032" height="1680" rx="8"/>
<text class="title" x="72" y="88">PostGIS + NetCDF Database Schema</text>
<text class="subtitle" x="76" y="122">Spatial tables store layers/features/POIs in PostGIS geometry columns; NetCDF tables store file metadata, grid values, and resumable import lease state.</text>
<g>
  <rect class="band" x="90" y="180" width="1120" height="1340" rx="8"/>
  <text class="bandTitle" x="110" y="214">Spatial / PostGIS schema</text>
</g>
<g>
  <rect class="band" x="1320" y="180" width="1690" height="1340" rx="8"/>
  <text class="bandTitle" x="1340" y="214">NetCDF catalog and import schema</text>
</g>
<g data-from="SpatialLayer" data-to="SpatialFeature">
  <path class="edge " d="M650 560 L650 660" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <text class="edgeLabel" x="675" y="615">1 layer -&gt; many features</text>
</g>
<g data-from="NetCdfFile" data-to="NetCdfGrid">
  <path class="edge " d="M 2005 560 L 2005 611 Q 2005 625 1991 625 L 1764 625 Q 1750 625 1750 639 L 1750 700" stroke="#BE185D" marker-end="url(#arrow-pink)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="edgeLabel" x="1810" y="604">grid values</text>
</g>
<g data-from="NetCdfFile" data-to="NetCdfProgress">
  <path class="edge " d="M 2005 560 L 2005 611 Q 2005 625 2019 625 L 2546 625 Q 2560 625 2560 639 L 2560 700" stroke="#6D28D9" marker-end="url(#arrow-violet)" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="edgeLabel" x="2470" y="604">import lease</text>
</g>
<g data-from="NetCdfGrid" data-to="IndexNote">
  <path class="edge dashed" d="M1750 976 L1750 1190" stroke="#BE185D"/>
<polygon points="1744,1178 1750,1190 1756,1178" fill="#BE185D" stroke="#BE185D" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <text class="edgeLabel" x="1774" y="1084">partial unique indexes</text>
</g>
<g data-from="NetCdfProgress" data-to="LeaseNote">
  <path class="edge dashed" d="M2560 1036 L2560 1270" stroke="#6D28D9"/>
<polygon points="2554,1258 2560,1270 2566,1258" fill="#6D28D9" stroke="#6D28D9" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <text class="edgeLabel" x="2584" y="1160">status lifecycle</text>
</g>
<g id="SpatialLayer">
  <rect class="table" x="160" y="280" width="900" height="276" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="182" y="310">LongIdTable spatial_layers</text>
  <text class="tableTitle" x="182" y="346">SpatialLayerTable</text>
  <path class="divider" d="M160 366H1060" stroke="#0F766E"/>
  <text class="col" x="184" y="396">PK id</text>
<text class="col" x="184" y="426">name varchar(255) unique</text>
<text class="col" x="184" y="456">description text nullable, source_file varchar(1024) nullable</text>
<text class="col" x="184" y="486">srid int default 4326, geometry_type varchar(50) nullable</text>
<text class="col" x="184" y="516">bbox_min_x/y, bbox_max_x/y double nullable</text>
<text class="col" x="184" y="546">record_count int default 0, created_at, updated_at</text>
</g>
<g id="SpatialFeature">
  <rect class="table" x="160" y="660" width="900" height="276" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="182" y="690">LongIdTable spatial_features</text>
  <text class="tableTitle" x="182" y="726">SpatialFeatureTable</text>
  <path class="divider" d="M160 746H1060" stroke="#0F766E"/>
  <text class="col" x="184" y="776">PK id</text>
<text class="col" x="184" y="806">FK layer_id -&gt; spatial_layers.id</text>
<text class="col" x="184" y="836">feature_type varchar(50)</text>
<text class="col" x="184" y="866">geom PostGIS GEOMETRY</text>
<text class="col" x="184" y="896">properties JSONB Map&lt;String, Any?&gt;</text>
<text class="col" x="184" y="926">name varchar(255) nullable, created_at, updated_at</text>
</g>
<g id="Poi">
  <rect class="table" x="160" y="1040" width="900" height="246" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="182" y="1070">LongIdTable poi</text>
  <text class="tableTitle" x="182" y="1106">PoiTable</text>
  <path class="divider" d="M160 1126H1060" stroke="#1D4ED8"/>
  <text class="col" x="184" y="1156">PK id</text>
<text class="col" x="184" y="1186">name varchar(255), category varchar(100) nullable</text>
<text class="col" x="184" y="1216">location PostGIS POINT</text>
<text class="col" x="184" y="1246">properties JSONB Map&lt;String, Any?&gt;</text>
<text class="col" x="184" y="1276">created_at, updated_at</text>
</g>
<g id="NetCdfFile">
  <rect class="table" x="1430" y="280" width="1150" height="276" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="kicker" x="1452" y="310">LongIdTable netcdf_files</text>
  <text class="tableTitle" x="1452" y="346">NetCdfFileTable</text>
  <path class="divider" d="M1430 366H2580" stroke="#BE185D"/>
  <text class="col" x="1454" y="396">PK id</text>
<text class="col" x="1454" y="426">filename varchar(255), file_path varchar(1024), file_size long</text>
<text class="col" x="1454" y="456">variables JSONB List&lt;NetCdfVariableInfo&gt;</text>
<text class="col" x="1454" y="486">dimensions JSONB Map&lt;String, Int&gt;, global_attrs JSONB</text>
<text class="col" x="1454" y="516">bbox PostGIS POLYGON nullable</text>
<text class="col" x="1454" y="546">time_start, time_end timestamp nullable, created_at, updated_at</text>
</g>
<g id="NetCdfGrid">
  <rect class="table" x="1380" y="700" width="740" height="276" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="kicker" x="1402" y="730">LongIdTable netcdf_grid_values</text>
  <text class="tableTitle" x="1402" y="766">NetCdfGridValueTable</text>
  <path class="divider" d="M1380 786H2120" stroke="#BE185D"/>
  <text class="col" x="1404" y="816">PK id</text>
<text class="col" x="1404" y="846">FK file_id -&gt; netcdf_files.id</text>
<text class="col" x="1404" y="876">variable_name varchar(255)</text>
<text class="col" x="1404" y="906">location PostGIS POINT nullable</text>
<text class="col" x="1404" y="936">time_idx int default 0, level_idx int default 0</text>
<text class="col" x="1404" y="966">value double, attrs JSONB nullable</text>
</g>
<g id="NetCdfProgress">
  <rect class="table" x="2240" y="700" width="640" height="336" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="2262" y="730">LongIdTable netcdf_import_progress</text>
  <text class="tableTitle" x="2262" y="766">NetCdfImportProgressTable</text>
  <path class="divider" d="M2240 786H2880" stroke="#6D28D9"/>
  <text class="col" x="2264" y="816">PK id</text>
<text class="col" x="2264" y="846">FK file_id -&gt; netcdf_files.id</text>
<text class="col" x="2264" y="876">variable_name varchar(255)</text>
<text class="col" x="2264" y="906">status enum PENDING/IN_PROGRESS/COMPLETED/FAILED</text>
<text class="col" x="2264" y="936">last_slice_idx long nullable</text>
<text class="col" x="2264" y="966">lease_expires_at timestamp nullable</text>
<text class="col" x="2264" y="996">error_message text nullable</text>
<text class="col" x="2264" y="1026">unique(file_id, variable_name)</text>
</g>
<g id="IndexNote">
  <rect class="note" x="1400" y="1190" width="700" height="150" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="noteTitle" x="1422" y="1228">Grid uniqueness</text>
  <text class="noteLine" x="1422" y="1262">location present: file + var + time + level</text>
<text class="noteLine" x="1422" y="1286">+ MD5(ST_AsBinary(location))</text>
<text class="noteLine" x="1422" y="1310">location null: file + var + time + level</text>
<text class="noteLine" x="1422" y="1334">both indexes are partial unique indexes</text>
</g>
<g id="LeaseNote">
  <rect class="note" x="2240" y="1270" width="640" height="110" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="noteTitle" x="2262" y="1308">Import control</text>
  <text class="noteLine" x="2262" y="1342">heartbeat lease prevents duplicate active import</text>
<text class="noteLine" x="2262" y="1366">lastSliceIdx resumes rank 3/4 imports</text>
</g>
</svg>