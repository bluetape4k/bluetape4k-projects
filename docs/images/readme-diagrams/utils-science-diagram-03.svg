<svg xmlns="http://www.w3.org/2000/svg" width="2222" height="1482" viewBox="0 0 2222 1482" role="img" aria-label="PostGIS + NetCDF Database Schema">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2222" height="1482"/>
<rect class="frame" x="32" y="28" width="2158" height="1426" rx="28"/>
<text class="title" x="66" y="82">PostGIS + NetCDF Database Schema</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1533 586 L1533 376"/>
<path class="line" d="M1955 334 L1955 502 L689 502 L689 586"/>
<path class="line" d="M1111 418 L1111 494 L267 494 L267 586"/>
<path class="line" d="M689 292 L689 486 L1111 486 L1111 180"/>
<path class="line" d="M689 292 L689 102 L1533 102 L1533 180"/>
<path class="line" d="M267 308 L267 510 L1955 510 L1955 586"/>
<path class="line" d="M267 308 L267 122 L1955 122 L1955 180"/>
<path class="line" d="M1111 698 L1111 971"/>
<path class="line" d="M1111 698 L1111 486 L689 486 L689 586"/>
<g transform="translate(112,180)">
  <rect class="card" x="0" y="0" width="310" height="128" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="310" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="56.5" text-anchor="middle">Spatial Feature</text>
<text class="label" x="155" y="81.5" text-anchor="middle">Repository</text>

</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="310" height="112" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#58A978"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">NetCdfFileRepository</text>

</g>
<g transform="translate(956,180)">
  <rect class="card" x="0" y="0" width="310" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#D6A441"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">NetCdfFileRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+filename: String</text>
<text class="mono" x="18" y="150">+filePath: String</text>
<text class="mono" x="18" y="171">+fileSize: Long</text>
<text class="mono" x="18" y="192">+variables: List~NetCdfVariableInfo~</text>
<text class="mono" x="18" y="213">+dimensions: Map~String,Int~</text>
</g>
<g transform="translate(1378,180)">
  <rect class="card" x="0" y="0" width="310" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#DC6B82"/>
  <text class="small" x="155" y="26" text-anchor="middle">«AuditableLongIdTable»</text>
  <text class="label" x="155" y="61" text-anchor="middle">NetCdfFileTable</text>
  <text class="mono" x="18" y="108">filename, filePath, fileSize</text>
<text class="mono" x="18" y="129">variables(JSONB), dimensions(JSONB)</text>
<text class="mono" x="18" y="150">globalAttrs(JSONB), bbox(PostGIS?)</text>
<text class="mono" x="18" y="171">timeStart, timeEnd</text>
</g>
<g transform="translate(1800,180)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#45A7A1"/>
  <text class="small" x="155" y="26" text-anchor="middle">«AuditableLongIdTable»</text>
  <text class="label" x="155" y="61" text-anchor="middle">SpatialFeatureTable</text>
  <text class="mono" x="18" y="108">layerId, geom(PGGeometry),</text>
<text class="mono" x="18" y="129">properties(JSONB)</text>
</g>
<g transform="translate(112,586)">
  <rect class="card" x="0" y="0" width="310" height="196" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#8A72D6"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">NetCdfVariableInfo</text>
  <text class="mono" x="18" y="108">+name: String</text>
<text class="mono" x="18" y="129">+dataType: String</text>
<text class="mono" x="18" y="150">+shape: List~Int~</text>
<text class="mono" x="18" y="171">+attributes: Map~String,String~</text>
</g>
<g transform="translate(534,586)">
  <rect class="card" x="0" y="0" width="310" height="133" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#B88A44"/>
  <text class="small" x="155" y="26" text-anchor="middle">«AuditableLongIdTable»</text>
  <text class="label" x="155" y="61" text-anchor="middle">SpatialLayerTable</text>
  <text class="mono" x="18" y="108">name, srid, geometryType</text>
</g>
<g transform="translate(956,586)">
  <rect class="card" x="0" y="0" width="310" height="112" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#8BA84D"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">SpatialLayerRepository</text>

</g>
<g transform="translate(1378,586)">
  <rect class="card" x="0" y="0" width="310" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="155" y="26" text-anchor="middle">«LongIdTable»</text>
  <text class="label" x="155" y="61" text-anchor="middle">NetCdfGridValueTable</text>
  <text class="mono" x="18" y="108">fileId, variableName</text>
<text class="mono" x="18" y="129">location(PostGIS POINT)</text>
<text class="mono" x="18" y="150">timeIdx, levelIdx, value</text>
<text class="mono" x="18" y="171">attrs(JSONB?)</text>
</g>
<g transform="translate(1800,586)">
  <rect class="card" x="0" y="0" width="310" height="217" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#58A978"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">SpatialFeatureRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+layerId: Long</text>
<text class="mono" x="18" y="150">+featureType: String</text>
<text class="mono" x="18" y="171">+geom: Geometry</text>
<text class="mono" x="18" y="192">+properties: Map~String,Any?~</text>
</g>
<g transform="translate(956,971)">
  <rect class="card" x="0" y="0" width="310" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#D6A441"/>
  <text class="small" x="155" y="26" text-anchor="middle"></text>
  <text class="label" x="155" y="61" text-anchor="middle">SpatialLayerRecord</text>
  <text class="mono" x="18" y="108">+id: Long</text>
<text class="mono" x="18" y="129">+name: String</text>
<text class="mono" x="18" y="150">+srid: Int</text>
<text class="mono" x="18" y="171">+geometryType: String?</text>
<text class="mono" x="18" y="192">+recordCount: Int</text>
</g>
</svg>
