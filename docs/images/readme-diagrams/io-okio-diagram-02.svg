<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-label="NIO Channel Adapter Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="32" y="28" width="1436" height="724" rx="30"/>
<text class="title" x="68" y="84">NIO Channel Adapter Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="Sink" data-to="Source" data-route-color="green" d="M360 398 L360 303" stroke="#3E9868"/>
<path class="dependency" data-from="Source" data-to="ByteChannelSink" data-route-color="amber" d="M498 303 L498 351 L612 351 L612 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="ByteChannelSink" data-to="ByteChannelSource" data-route-color="teal" d="M750 398 L750 311" stroke="#2E8F89"/>
<path class="dependency" data-from="ByteChannelSource" data-to="FileChannelSink" data-route-color="purple" d="M888 311 L888 355 L1002 355 L1002 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="inherit" data-from="FileChannelSink" data-to="FileChannelSource" data-route-color="pink" d="M1140 398 L1140 311" stroke="#C94D68"/>
<g id="Sink">
  <rect class="classCard" x="180" y="398" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="360" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="360" y="445" text-anchor="middle">Sink</text>
  <line x1="180" y1="454" x2="540" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="Source">
  <rect class="classCard" x="180" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="360" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="360" y="212" text-anchor="middle">Source</text>
  <line x1="180" y1="221" x2="540" y2="221" stroke="#58A978" stroke-width="1.4"/>

</g>
<g id="ByteChannelSink">
  <rect class="classCard" x="570" y="398" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="750" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="445" text-anchor="middle">ByteChannelSink</text>
  <line x1="570" y1="454" x2="930" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="604" y="486">-channel: ByteChannel</text>
<text class="member" x="604" y="503">+write(source: Buffer, byteCount:</text>
<text class="member" x="604" y="520">Long)</text>
</g>
<g id="ByteChannelSource">
  <rect class="classCard" x="570" y="165" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="750" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="212" text-anchor="middle">ByteChannelSource</text>
  <line x1="570" y1="221" x2="930" y2="221" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="604" y="253">-channel: ByteChannel</text>
<text class="member" x="604" y="270">+read(sink: Buffer, byteCount:</text>
<text class="member" x="604" y="287">Long) Long</text>
</g>
<g id="FileChannelSink">
  <rect class="classCard" x="960" y="398" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1140" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1140" y="445" text-anchor="middle">FileChannelSink</text>
  <line x1="960" y1="454" x2="1320" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="994" y="486">-channel: FileChannel</text>
<text class="member" x="994" y="503">+write(source: Buffer, byteCount:</text>
<text class="member" x="994" y="520">Long)</text>
</g>
<g id="FileChannelSource">
  <rect class="classCard" x="960" y="165" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1140" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1140" y="212" text-anchor="middle">FileChannelSource</text>
  <line x1="960" y1="221" x2="1320" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="994" y="253">-channel: FileChannel</text>
<text class="member" x="994" y="270">+read(sink: Buffer, byteCount:</text>
<text class="member" x="994" y="287">Long) Long</text>
</g>
<g>
  <rect x="1085" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 690 L1161 690" stroke="#3E9868"/>
  <text class="detail" x="1175" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1103 711 L1161 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
