  <text class="stereo" x="1552" y="259" text-anchor="middle">class</text>
  <text class="classTitle" x="1552" y="287" text-anchor="middle">FileChannelSource</text>
  <line x1="1382" y1="296" x2="1722" y2="296" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1400" y="321">-channel: FileChannel</text>
<text class="member" x="1400" y="338">+read(sink: Buffer, byteCount:</text>
