<path class="implLine" d="M683 568 L683 493 L473 493 L473 418" style="stroke:#4F83BF;stroke:#4F83BF" data-route-color="#4F83BF"/>
<path class="implLine" d="M1103 568 L1103 485 L473 485 L473 418" style="stroke:#2E8F89;stroke:#2E8F89" data-route-color="#2E8F89"/>
<path class="implLine" d="M263 568 L263 477 L473 477 L473 418" style="stroke:#B9851B;stroke:#B9851B" data-route-color="#B9851B"/>
<g transform="translate(298,180)">
  <rect class="card" x="0" y="0" width="350" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="61" text-anchor="middle">JsonSerializer</text>
  <text class="mono" x="18" y="108">+serialize(graph: Any?) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(bytes: ByteArray?, clazz:</text>
<text class="mono" x="18" y="150">Class~T~) T?</text>
<text class="mono" x="18" y="171">+serializeAsString(graph: Any?) String</text>
<text class="mono" x="18" y="192">+deserializeFromString(text: String?,</text>
<text class="mono" x="18" y="213">clazz: Class~T~) T?</text>
</g>
<g transform="translate(718,180)">
  <rect class="card" x="0" y="0" width="350" height="170" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#58A978"/>
    <text class="label" x="175" y="44.5" text-anchor="middle">Json Serialization</text>
<text class="label" x="175" y="69.5" text-anchor="middle">Exception</text>
  <text class="mono" x="18" y="124">+message: String</text>
<text class="mono" x="18" y="145">+cause: Throwable?</text>
</g>
