    <text class="label" x="175" y="49" text-anchor="middle">JacksonSerializer_2</text>
  <text class="mono" x="18" y="108">Jackson 2.x based</text>
<text class="mono" x="18" y="129">bluetape4k-jackson2</text>
</g>
<g transform="translate(508,568)">
  <rect class="card" x="0" y="0" width="350" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#DC6B82"/>
