<svg xmlns="http://www.w3.org/2000/svg" width="1676" height="918" viewBox="0 0 1676 918" role="img" aria-label="JsonSerializer Interface and Implementations">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1676" height="918"/>
<rect class="frame" x="32" y="28" width="1612" height="862" rx="30"/>
<text class="title" x="68" y="84">JsonSerializer Interface and Implementations</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="JsonSerializer" data-to="JsonSerializationException" data-route-color="teal" d="M1018 238 L1160 238 L1160 610" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="inherit" data-from="FastjsonSerializer" data-to="JsonSerializer" data-route-color="blue" d="M838 430 L838 311" stroke="#4F83BF"/>
<path class="inherit" data-from="JacksonSerializer_3" data-to="JsonSerializer" data-route-color="teal" d="M1246 430 L1246 279 L1018 279" stroke="#2E8F89"/>
<path class="inherit" data-from="JacksonSerializer_2" data-to="JsonSerializer" data-route-color="amber" d="M298 430 L298 285 L658 285" stroke="#B9851B"/>
<g id="JsonSerializer">
  <rect class="classCard" x="658" y="165" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="838" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="838" y="212" text-anchor="middle">JsonSerializer</text>
  <line x1="658" y1="221" x2="1018" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="692" y="253">+serialize(graph: Any?) ByteArray</text>
<text class="member" x="692" y="270">+deserialize(bytes: ByteArray?,</text>
<text class="member" x="692" y="287">clazz:</text>
</g>
<g id="JsonSerializationException">
  <rect class="classCard" x="1096" y="610" width="380" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1286" y="629" text-anchor="middle">class</text>
  <text class="classTitle" x="1286" y="648" text-anchor="middle">JsonSerialization</text>
<text class="classTitle" x="1286" y="670" text-anchor="middle">Exception</text>
  <line x1="1096" y1="674" x2="1476" y2="674" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="1130" y="707">+message: String</text>
<text class="member" x="1130" y="724">+cause: Throwable?</text>
</g>
<g id="JacksonSerializer_2">
  <rect class="classCard" x="118" y="430" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="298" y="449" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="477" text-anchor="middle">JacksonSerializer2</text>
  <line x1="118" y1="486" x2="478" y2="486" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="152" y="523">Jackson 2.x based</text>
<text class="member" x="152" y="540">bluetape4k-jackson2</text>
</g>
<g id="FastjsonSerializer">
  <rect class="classCard" x="658" y="430" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="838" y="449" text-anchor="middle">class</text>
  <text class="classTitle" x="838" y="477" text-anchor="middle">FastjsonSerializer</text>
  <line x1="658" y1="486" x2="1018" y2="486" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="692" y="523">Fastjson2 JSONB based</text>
<text class="member" x="692" y="540">bluetape4k-fastjson2</text>
</g>
<g id="JacksonSerializer_3">
  <rect class="classCard" x="1198" y="430" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1378" y="449" text-anchor="middle">class</text>
  <text class="classTitle" x="1378" y="477" text-anchor="middle">JacksonSerializer3</text>
  <line x1="1198" y1="486" x2="1558" y2="486" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1232" y="523">Jackson 3.x based</text>
<text class="member" x="1232" y="540">bluetape4k-jackson3</text>
</g>
<g>
  <rect x="1261" y="810" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1279 828 L1337 828" stroke="#3E9868"/>
  <text class="detail" x="1351" y="833">inheritance / implementation</text>
  <path class="dependency" d="M1279 849 L1337 849" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1351" y="854">dependency / usage</text>
</g>
<g><rect x="180" y="828" width="1036" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="698" y="854" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
