<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="920" viewBox="0 0 1520 920" role="img" aria-label="Micrometer Module Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="smallArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6" fill="none" stroke="#758297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .edgeLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .thinLine{stroke:#758297;stroke-width:1.8;fill:none;marker-end:url(#smallArrow)}
    .dashed{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
  </style>
</defs>
<rect class="canvas" width="1520" height="920"/>
<rect class="frame" x="32" y="28" width="1456" height="864" rx="28"/>
<text class="title" x="66" y="82">Micrometer Module Architecture</text>
<text class="subtitle" x="70" y="118">Small Kotlin extensions feed Micrometer registries while preserving coroutine context, HTTP tags, and cache statistics.</text><g>
  <rect class="card" x="590" y="360" width="340" height="136" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="760" y="396" text-anchor="middle">Micrometer Core</text>
  <text class="small" x="760" y="426" text-anchor="middle">MeterRegistry</text>
<text class="small" x="760" y="444" text-anchor="middle">Timer</text>
<text class="small" x="760" y="462" text-anchor="middle">ObservationRegistry</text>
</g>
<g>
  <rect class="card" x="95" y="188" width="320" height="138" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="255" y="224" text-anchor="middle">Timer Extensions</text>
  <text class="small" x="255" y="254" text-anchor="middle">recordSuspend()</text>
<text class="small" x="255" y="272" text-anchor="middle">Flow.withTimer()</text>
<text class="small" x="255" y="290" text-anchor="middle">one timer sample per collection</text>
</g>
<g>
  <rect class="card" x="555" y="170" width="390" height="150" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="750" y="206" text-anchor="middle">Coroutine Observation</text>
  <text class="small" x="750" y="236" text-anchor="middle">withObservationContextSuspending</text>
<text class="small" x="750" y="254" text-anchor="middle">Observation in Reactor context</text>
<text class="small" x="750" y="272" text-anchor="middle">scope closes and stop() runs</text>
</g>
<g>
  <rect class="card" x="1095" y="188" width="320" height="138" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="1255" y="224" text-anchor="middle">Retrofit2 Metrics</text>
  <text class="small" x="1255" y="254" text-anchor="middle">CallAdapterFactory wrapper</text>
<text class="small" x="1255" y="272" text-anchor="middle">method / URI / status tags</text>
<text class="small" x="1255" y="290" text-anchor="middle">retry clone remains measured</text>
</g>
<g>
  <rect class="card" x="145" y="590" width="340" height="140" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="315" y="626" text-anchor="middle">Cache2k Metrics</text>
  <text class="small" x="315" y="656" text-anchor="middle">size, hit/miss, puts</text>
<text class="small" x="315" y="674" text-anchor="middle">load duration</text>
<text class="small" x="315" y="692" text-anchor="middle">evictions and expired count</text>
</g>
<g>
  <rect class="card" x="590" y="620" width="340" height="126" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="760" y="656" text-anchor="middle">KeyValue Utilities</text>
  <text class="small" x="760" y="686" text-anchor="middle">keyValueOf()</text>
<text class="small" x="760" y="704" text-anchor="middle">keyValuesOf()</text>
<text class="small" x="760" y="722" text-anchor="middle">validation helpers</text>
</g>
<g>
  <rect class="card" x="1065" y="590" width="350" height="140" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="1240" y="626" text-anchor="middle">Metric Output</text>
  <text class="small" x="1240" y="656" text-anchor="middle">timers</text>
<text class="small" x="1240" y="674" text-anchor="middle">function counters</text>
<text class="small" x="1240" y="692" text-anchor="middle">gauges / time gauges</text>
</g>
<path class="line" d="M415 257 C500 277 545 325 590 398"/>
<text class="edgeLabel" x="514" y="303" text-anchor="middle">records duration</text>
<path class="line" d="M750 320 V360"/>
<text class="edgeLabel" x="812" y="343" text-anchor="middle">binds observation</text>
<path class="line" d="M1095 257 C1010 282 960 327 930 398"/>
<text class="edgeLabel" x="1026" y="303" text-anchor="middle">records HTTP calls</text>
<path class="line" d="M485 660 C555 618 585 550 650 496"/>
<text class="edgeLabel" x="552" y="591" text-anchor="middle">binds cache meters</text>
<path class="line" d="M760 620 V496"/>
<text class="edgeLabel" x="820" y="570" text-anchor="middle">builds tags</text>
<path class="line" d="M930 428 C1015 460 1078 520 1168 590"/>
<text class="edgeLabel" x="1082" y="513" text-anchor="middle">exports meters</text>
<path class="line" d="M930 692 H1065"/>
<text class="edgeLabel" x="997" y="682" text-anchor="middle">registry reads</text>
<g>
  <rect class="soft" x="105" y="765" width="510" height="78" rx="12" fill="#EAF7EF" stroke="#58A978" opacity="0.92"/>
  <text class="small" x="123" y="790" text-anchor="start">The module does not replace Micrometer.</text>
<text class="small" x="123" y="808" text-anchor="start">It adds Kotlin-friendly wrappers around existing registries.</text>
</g>
<g>
  <rect class="soft" x="830" y="765" width="575" height="78" rx="12" fill="#F1ECFF" stroke="#8A72D6" opacity="0.92"/>
  <text class="small" x="848" y="790" text-anchor="start">CancellationException is rethrown in coroutine observation helpers.</text>
<text class="small" x="848" y="808" text-anchor="start">Non-cancellation failures are recorded on the Observation.</text>
</g></svg>
