<text x="655" y="588" text-anchor="middle" class="sub">publish/consume contract</text>
<rect x="486" y="662" width="338" height="102" rx="12" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.4"/>
<text x="655" y="700" text-anchor="middle" class="cardTitle">Retrofit + Cache2k</text>
<text x="655" y="728" text-anchor="middle" class="sub">HTTP calls and cache stats</text>
