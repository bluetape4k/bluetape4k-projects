<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="980" viewBox="0 0 1720 980" role="img" aria-labelledby="title desc">
<title id="title">micrometer instrumentation component map</title>
<desc id="desc">Application work enters timer, observation, event, Retrofit, or Cache2k helpers; helpers build bounded tags or observation context and hand them to MeterRegistry or ObservationRegistry before export.</desc>
<defs><style>
  .title{font-family:"Architects Daughter";font-size:46px;fill:#1F2937}
  .subtitle,.sub,.legend{font-family:"Comic Mono";fill:#52616B}
  .subtitle{font-size:18px}.groupTitle{font-family:"Architects Daughter";font-size:27px;fill:#1F2937}
  .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#1F2937}
  .sub{font-size:14px}.legend{font-size:13px}
</style>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" stroke="#2563EB" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#8B5CF6" stroke="#8B5CF6" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C" stroke="#EA580C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0D9488" stroke="#0D9488" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16A34A" stroke="#16A34A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
<marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#DB2777" stroke="#DB2777" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
