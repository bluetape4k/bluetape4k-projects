<svg data-intent="Show the observability demo request sequence with numbered publish/observe/response steps and a separate metrics scrape path." data-evidence="examples/ktor/observability-ktor-demo/README.md; examples/ktor/observability-ktor-demo/src/main/kotlin" data-source-read="examples/ktor/observability-ktor-demo/README.md; examples/ktor/observability-ktor-demo/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1560" height="885" viewBox="0 0 1560 885" role="img" aria-label="Ktor Observability Demo Sequence" data-layout="sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1560" height="885"/>
<rect class="frame" x="34" y="30" width="1492" height="825" rx="32"/>
<text class="title" x="72" y="84">Ktor Observability Demo Sequence</text>
<text class="subtitle" x="76" y="116">The sequence keeps request handling and the metrics scrape path explicit with numbered arrows.</text>
<g id="client"><rect class="card" x="90" y="165" width="200" height="76" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="190" y="205" text-anchor="middle" dominant-baseline="middle">Client</text><line class="plain dashed" x1="190" y1="241" x2="190" y2="790" stroke="#5B8DEF"/></g>
<g id="route"><rect class="card" x="345" y="165" width="230" height="76" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="460" y="205" text-anchor="middle" dominant-baseline="middle">Ktor route</text><line class="plain dashed" x1="460" y1="241" x2="460" y2="790" stroke="#58A978"/></g>
<g id="service"><rect class="card" x="630" y="165" width="260" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="760" y="205" text-anchor="middle" dominant-baseline="middle">Telemetry service</text><line class="plain dashed" x1="760" y1="241" x2="760" y2="790" stroke="#D6A441"/></g>
<g id="eventTelemetry"><rect class="card" x="955" y="165" width="250" height="76" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1080" y="205" text-anchor="middle" dominant-baseline="middle">EventTelemetry</text><line class="plain dashed" x1="1080" y1="241" x2="1080" y2="790" stroke="#DC6B82"/></g>
<g id="backend"><rect class="card" x="1260" y="165" width="210" height="76" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1365" y="205" text-anchor="middle" dominant-baseline="middle">Metrics / Traces</text><line class="plain dashed" x1="1365" y1="241" x2="1365" y2="790" stroke="#8A72D6"/></g>
<g id="kobs1"><rect class="labelPill" x="240" y="291" width="170" height="28" rx="8"/><circle cx="258" cy="305" r="11" fill="#4F83BF"/><text class="detail" x="258" y="306" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="337" y="306" text-anchor="middle" dominant-baseline="middle">POST order event</text><path class="seq" d="M190 333 L460 333" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="kobs2"><rect class="labelPill" x="512" y="376" width="196" height="28" rx="8"/><circle cx="530" cy="390" r="11" fill="#3E9868"/><text class="detail" x="530" y="391" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="622" y="391" text-anchor="middle" dominant-baseline="middle">extract id + payload</text><path class="seq" d="M460 418 L760 418" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="kobs3"><rect class="labelPill" x="825.5" y="461" width="189" height="28" rx="8"/><circle cx="843.5" cy="475" r="11" fill="#B9851B"/><text class="detail" x="843.5" y="476" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="932" y="476" text-anchor="middle" dominant-baseline="middle">publish observation</text><path class="seq" d="M760 503 L1080 503" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="kobs4"><rect class="labelPill" x="1124.5" y="546" width="196" height="28" rx="8"/><circle cx="1142.5" cy="560" r="11" fill="#755BC6"/><text class="detail" x="1142.5" y="561" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1234.5" y="561" text-anchor="middle" dominant-baseline="middle">record metric / span</text><path class="seq" d="M1080 588 L1365 588" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="kobs5"><rect class="labelPill" x="525" y="631" width="170" height="28" rx="8"/><circle cx="543" cy="645" r="11" fill="#3E9868"/><text class="detail" x="543" y="646" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="622" y="646" text-anchor="middle" dominant-baseline="middle">domain response</text><path class="seqReturn" d="M760 673 L460 673" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="kobs6"><rect class="labelPill" x="683" y="716" width="189" height="28" rx="8"/><circle cx="701" cy="730" r="11" fill="#C94D68"/><text class="detail" x="701" y="731" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="789.5" y="731" text-anchor="middle" dominant-baseline="middle">GET /metrics scrape</text><path class="seqReturn" d="M190 758 L1365 758" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
</svg>
