<rect class="canvas" width="1560" height="885"/>
<rect class="frame" x="34" y="30" width="1492" height="825" rx="32"/>
<text class="title" x="72" y="84">Ktor Observability Demo Sequence</text>
<text class="subtitle" x="76" y="116">The sequence keeps request handling and the metrics scrape path explicit with numbered arrows.</text>
<g id="client"><rect class="card" x="90" y="165" width="200" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="190" y="205" text-anchor="middle" dominant-baseline="middle">Client</text><line class="lifeline dashed" x1="190" y1="241" x2="190" y2="790" stroke="#4F83BF"/></g>
<g id="route"><rect class="card" x="345" y="165" width="230" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="460" y="205" text-anchor="middle" dominant-baseline="middle">Ktor route</text><line class="lifeline dashed" x1="460" y1="241" x2="460" y2="790" stroke="#3E9868"/></g>
<g id="service"><rect class="card" x="630" y="165" width="260" height="76" rx="10" fill="#FFF3D9" stroke="#B9851B"/><text class="cardTitle" x="760" y="205" text-anchor="middle" dominant-baseline="middle">Telemetry service</text><line class="lifeline dashed" x1="760" y1="241" x2="760" y2="790" stroke="#B9851B"/></g>
<g id="eventTelemetry"><rect class="card" x="955" y="165" width="250" height="76" rx="10" fill="#FDECEF" stroke="#C94D68"/><text class="cardTitle" x="1080" y="205" text-anchor="middle" dominant-baseline="middle">EventTelemetry</text><line class="lifeline dashed" x1="1080" y1="241" x2="1080" y2="790" stroke="#C94D68"/></g>
<g id="backend"><rect class="card" x="1260" y="165" width="210" height="76" rx="10" fill="#F3ECFF" stroke="#755BC6"/><text class="cardTitle" x="1365" y="205" text-anchor="middle" dominant-baseline="middle">Metrics / Traces</text><line class="lifeline dashed" x1="1365" y1="241" x2="1365" y2="790" stroke="#755BC6"/></g>
<g id="kobs1"><rect class="labelPill" x="240" y="288.0" width="170" height="34" rx="17" stroke="#4F83BF"/><circle cx="258" cy="305" r="11" fill="#EAF4F8" stroke="#4F83BF"/><text class="detail" x="258" y="306" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">1</text><text class="detail" x="337" y="306" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">POST order event</text><path class="seq" d="M190 333 L460 333" stroke="#4F83BF" marker-end="url(#seqArrow-blue-4F83BF)"/></g>
