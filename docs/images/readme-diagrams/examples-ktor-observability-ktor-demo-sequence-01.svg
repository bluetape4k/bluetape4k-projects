<g id="kobs3"><rect class="labelPill" x="825.5" y="458.0" width="189" height="34" rx="17" stroke="#B9851B"/><circle cx="843.5" cy="475" r="11" fill="#FFF7E8" stroke="#B9851B"/><text class="detail" x="843.5" y="476" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">3</text><text class="detail" x="932" y="476" text-anchor="middle" dominant-baseline="middle" fill="#B9851B">publish observation</text><path class="seq" d="M760 503 L1080 503" stroke="#B9851B" marker-end="url(#seqArrow-amber-B9851B)"/></g>
<g id="kobs4"><rect class="labelPill" x="1124.5" y="543.0" width="196" height="34" rx="17" stroke="#755BC6"/><circle cx="1142.5" cy="560" r="11" fill="#F3ECFF" stroke="#755BC6"/><text class="detail" x="1142.5" y="561" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">4</text><text class="detail" x="1234.5" y="561" text-anchor="middle" dominant-baseline="middle" fill="#755BC6">record metric / span</text><path class="seq" d="M1080 588 L1365 588" stroke="#755BC6" marker-end="url(#seqArrow-purple-755BC6)"/></g>
<g id="kobs5"><rect class="labelPill" x="525" y="628.0" width="170" height="34" rx="17" stroke="#3E9868"/><circle cx="543" cy="645" r="11" fill="#EEF7F0" stroke="#3E9868"/><text class="detail" x="543" y="646" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">5</text><text class="detail" x="622" y="646" text-anchor="middle" dominant-baseline="middle" fill="#3E9868">domain response</text><path class="seqReturn" d="M760 673 L460 673" stroke="#3E9868"/>
<polygon points="472,667 460,673 472,679" fill="#3E9868" stroke="#3E9868" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/></g>
<g id="kobs6"><rect class="labelPill" x="683" y="713.0" width="189" height="34" rx="17" stroke="#C94D68"/><circle cx="701" cy="730" r="11" fill="#FFF0F0" stroke="#C94D68"/><text class="detail" x="701" y="731" text-anchor="middle" dominant-baseline="middle" fill="#C94D68">6</text><text class="detail" x="789.5" y="731" text-anchor="middle" dominant-baseline="middle" fill="#C94D68">GET /metrics scrape</text><path class="seqReturn" d="M190 758 L1365 758" stroke="#C94D68"/>
<polygon points="1353,764 1365,758 1353,752" fill="#C94D68" stroke="#C94D68" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/></g>
