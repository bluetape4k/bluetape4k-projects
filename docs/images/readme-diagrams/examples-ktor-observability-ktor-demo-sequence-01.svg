<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="760" viewBox="0 0 1420 760" role="img" aria-labelledby="examples-ktor-observability-ktor-demo-sequence-01-title examples-ktor-observability-ktor-demo-sequence-01-desc">
  <title id="examples-ktor-observability-ktor-demo-sequence-01-title">Ktor Observability Demo Sequence</title>
  <desc id="examples-ktor-observability-ktor-demo-sequence-01-desc">Application-owned metrics routing, event observations, and optional OpenTelemetry spans.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="arrowNeutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
    </marker>
    <marker id="arrowRequest" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowService" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#45A7A1"/>
    </marker>
    <marker id="arrowEvent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#58A978"/>
    </marker>
    <marker id="arrowMetrics" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/>
    </marker>
    <marker id="arrowTrace" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8A72D6"/>
    </marker>
    <marker id="arrowResponse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#DC6B82"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .sequenceEdge{stroke-width:2.3;fill:none}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1420" height="760"/>
  <rect class="frame" x="32" y="28" width="1356" height="684" rx="26"/>
  <text class="title" x="66" y="82">Ktor Observability Demo Sequence</text>
  <text class="subtitle" x="70" y="116">Application-owned metrics routing, event observations, and optional OpenTelemetry spans.</text>

  <g id="client">
    <rect class="participant" x="80" y="165" width="165" height="74" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="participantTitle" x="162.5" y="202" text-anchor="middle" dominant-baseline="middle">Client</text>
    <line class="lifeline" x1="162.5" y1="239" x2="162.5" y2="680" />
  </g>

  <g id="ktor">
    <rect class="participant" x="300" y="165" width="165" height="74" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="participantTitle" x="382.5" y="190" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="participantTitle" x="382.5" y="214" text-anchor="middle" dominant-baseline="middle">Routes</text>
    <line class="lifeline" x1="382.5" y1="239" x2="382.5" y2="680" />
  </g>

  <g id="observability">
    <rect class="participant" x="525" y="165" width="180" height="74" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="participantTitle" x="615" y="190" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="participantTitle" x="615" y="214" text-anchor="middle" dominant-baseline="middle">Observability</text>
    <line class="lifeline" x1="615" y1="239" x2="615" y2="680" />
  </g>

  <g id="eventObs">
    <rect class="participant" x="765" y="165" width="165" height="74" rx="10" fill="#EAF7EF" stroke="#58A978"/>
    <text class="participantTitle" x="847.5" y="190" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="participantTitle" x="847.5" y="214" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <line class="lifeline" x1="847.5" y1="239" x2="847.5" y2="680" />
  </g>

  <g id="prom">
    <rect class="participant" x="965" y="165" width="170" height="74" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="participantTitle" x="1050" y="190" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
<text class="participantTitle" x="1050" y="214" text-anchor="middle" dominant-baseline="middle">Registry</text>
    <line class="lifeline" x1="1050" y1="239" x2="1050" y2="680" />
  </g>

  <g id="otel">
    <rect class="participant" x="1190" y="165" width="170" height="74" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="participantTitle" x="1275" y="190" text-anchor="middle" dominant-baseline="middle">OpenTelemetry</text>
<text class="participantTitle" x="1275" y="214" text-anchor="middle" dominant-baseline="middle">optional</text>
    <line class="lifeline" x1="1275" y1="239" x2="1275" y2="680" />
  </g>

  <g id="post-order">
    <path class="sequenceEdge" d="M162.5 295 L382.5 295" stroke="#5B8DEF" marker-end="url(#arrowRequest)"/>

    <rect class="labelPill" x="153.65" y="262" width="237.7" height="26" rx="7"/>
    <text class="edgeLabel" x="272.5" y="276" text-anchor="middle" dominant-baseline="middle">POST /orders/{orderId}/events</text>
  </g>

  <g id="plugins">
    <path class="sequenceEdge" d="M382.5 355 L615 355" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

    <rect class="labelPill" x="372.6" y="322" width="252.29999999999998" height="26" rx="7"/>
    <text class="edgeLabel" x="498.75" y="336" text-anchor="middle" dominant-baseline="middle">correlation + logging + metrics</text>
  </g>

  <g id="publish">
    <path class="sequenceEdge" d="M382.5 415 L847.5 415" stroke="#58A978" marker-end="url(#arrowEvent)"/>

    <rect class="labelPill" x="525.35" y="382" width="179.29999999999998" height="26" rx="7"/>
    <text class="edgeLabel" x="615" y="396" text-anchor="middle" dominant-baseline="middle">observe event.publish</text>
  </g>

  <g id="consume">
    <path class="sequenceEdge" d="M382.5 475 L847.5 475" stroke="#58A978" marker-end="url(#arrowEvent)"/>

    <rect class="labelPill" x="525.35" y="442" width="179.29999999999998" height="26" rx="7"/>
    <text class="edgeLabel" x="615" y="456" text-anchor="middle" dominant-baseline="middle">observe event.consume</text>
  </g>

  <g id="timers">
    <path class="sequenceEdge" d="M847.5 535 L1050 535" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

    <rect class="labelPill" x="873.7" y="502" width="150.1" height="26" rx="7"/>
    <text class="edgeLabel" x="948.75" y="516" text-anchor="middle" dominant-baseline="middle">Micrometer timers</text>
  </g>

  <g id="spans">
    <path class="sequenceEdge" d="M615 325 L1275 325" stroke="#8A72D6" marker-end="url(#arrowTrace)" stroke-dasharray="8 7"/>

    <rect class="labelPill" x="829.8" y="292" width="230.4" height="26" rx="7"/>
    <text class="edgeLabel" x="945" y="306" text-anchor="middle" dominant-baseline="middle">server spans when configured</text>
  </g>

  <g id="json-response">
    <path class="sequenceEdge" d="M382.5 595 L162.5 595" stroke="#DC6B82" marker-end="url(#arrowResponse)" stroke-dasharray="8 7"/>

    <rect class="labelPill" x="197.5" y="562" width="150" height="26" rx="7"/>
    <text class="edgeLabel" x="272.5" y="576" text-anchor="middle" dominant-baseline="middle">200 JSON</text>
  </g>

  <g id="scrape-request">
    <path class="sequenceEdge" d="M162.5 650 L382.5 650" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

    <rect class="labelPill" x="197.5" y="617" width="150" height="26" rx="7"/>
    <text class="edgeLabel" x="272.5" y="631" text-anchor="middle" dominant-baseline="middle">GET /metrics</text>
  </g>

  <g id="scrape-registry">
    <path class="sequenceEdge" d="M382.5 625 L1050 625" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

    <rect class="labelPill" x="641.25" y="592" width="150" height="26" rx="7"/>
    <text class="edgeLabel" x="716.25" y="606" text-anchor="middle" dominant-baseline="middle">scrape()</text>
  </g>
  <text class="note" x="710" y="730" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
