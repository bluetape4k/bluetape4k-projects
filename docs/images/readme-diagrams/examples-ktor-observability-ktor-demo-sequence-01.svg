<svg xmlns="http://www.w3.org/2000/svg" width="2707" height="1192" viewBox="0 0 2707 1192" role="img" aria-label="Ktor Observability Demo Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="2707" height="1192"/>
<rect class="frame" x="32" y="28" width="2643" height="1136" rx="30"/>
<text class="title" x="68" y="84">Ktor Observability Demo Sequence</text>
<text class="subtitle" x="72" y="116">Source-checked interaction flow redrawn with compact labels, numbered calls, and readable branch semantics.</text>
<g id="seq-client"><rect class="card" x="140" y="170" width="230" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="255" y="215" text-anchor="middle">Client</text><line class="lifeline" x1="255" y1="248" x2="255" y2="1050"/></g>
<g id="seq-ktor-routes"><rect class="card" x="579.4" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="694.4" y="215" text-anchor="middle">Ktor Routes</text><line class="lifeline" x1="694.4" y1="248" x2="694.4" y2="1050"/></g>
<g id="seq-ktor-observability"><rect class="card" x="1018.8" y="170" width="230" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1133.8" y="215" text-anchor="middle">Ktor Observability</text><line class="lifeline" x1="1133.8" y1="248" x2="1133.8" y2="1050"/></g>
<g id="seq-event-telemetry"><rect class="card" x="1458.2" y="170" width="230" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1573.2" y="215" text-anchor="middle">Event Telemetry</text><line class="lifeline" x1="1573.2" y1="248" x2="1573.2" y2="1050"/></g>
<g id="seq-prometheus-registry"><rect class="card" x="1897.6" y="170" width="230" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="2012.6" y="200" text-anchor="middle">Prometheus</text><text class="cardTitle" x="2012.6" y="224" text-anchor="middle">Registry</text><line class="lifeline" x1="2012.6" y1="248" x2="2012.6" y2="1050"/></g>
<g id="seq-opentelemetry-optional"><rect class="card" x="2337" y="170" width="230" height="78" rx="10" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="2452" y="200" text-anchor="middle">OpenTelemetry</text><text class="cardTitle" x="2452" y="224" text-anchor="middle">optional</text><line class="lifeline" x1="2452" y1="248" x2="2452" y2="1050"/></g>
<rect x="247" y="762" width="16" height="116" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="686.4" y="322" width="16" height="644" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1125.8" y="322" width="16" height="380" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1565.2" y="410" width="16" height="204" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="2004.6" y="586" width="16" height="380" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<rect x="2444" y="674" width="16" height="52" rx="5" fill="#F1ECFF" stroke="#8A72D6" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="754.2" y="287" width="319.7" height="26" rx="7"/><circle cx="773.2" cy="300" r="12" fill="#4F83BF"/><text class="detail" x="773.2" y="301" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="932.1" y="301" text-anchor="middle" dominant-baseline="middle">POST /orders/{orderId}/events</text><path class="seq" d="M694.4 330 L1133.8 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="966.7" y="375" width="334.3" height="26" rx="7"/><circle cx="985.7" cy="388" r="12" fill="#3E9868"/><text class="detail" x="985.7" y="389" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="1151.8" y="389" text-anchor="middle" dominant-baseline="middle">correlation + logging + metrics</text><path class="seq" d="M694.4 418 L1573.2 418" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="1003.2" y="463" width="261.3" height="26" rx="7"/><circle cx="1022.2" cy="476" r="12" fill="#2E8F89"/><text class="detail" x="1022.2" y="477" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1151.8" y="477" text-anchor="middle" dominant-baseline="middle">observe event.publish</text><path class="seq" d="M694.4 506 L1573.2 506" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="1662.3" y="551" width="261.3" height="26" rx="7"/><circle cx="1681.3" cy="564" r="12" fill="#B9851B"/><text class="detail" x="1681.3" y="565" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1810.9" y="565" text-anchor="middle" dominant-baseline="middle">observe event.consume</text><path class="seq" d="M1573.2 594 L2012.6 594" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="1676.9" y="639" width="232.1" height="26" rx="7"/><circle cx="1695.9" cy="652" r="12" fill="#C94D68"/><text class="detail" x="1695.9" y="653" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="1810.9" y="653" text-anchor="middle" dominant-baseline="middle">Micrometer timers</text><path class="seq" d="M1133.8 682 L2452 682" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="318.5" y="727" width="312.4" height="26" rx="7"/><circle cx="337.5" cy="740" r="12" fill="#2E8F89"/><text class="detail" x="337.5" y="741" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="492.7" y="741" text-anchor="middle" dominant-baseline="middle">server spans when configured</text><path class="seqReturn" d="M694.4 770 L255 770" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m7"><rect class="labelPill" x="359.7" y="815" width="230" height="26" rx="7"/><circle cx="378.7" cy="828" r="12" fill="#4F83BF"/><text class="detail" x="378.7" y="829" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="492.7" y="829" text-anchor="middle" dominant-baseline="middle">200 JSON</text><path class="seq" d="M255 858 L694.4 858" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m8"><rect class="labelPill" x="1238.5" y="903" width="230" height="26" rx="7"/><circle cx="1257.5" cy="916" r="12" fill="#3E9868"/><text class="detail" x="1257.5" y="917" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="1371.5" y="917" text-anchor="middle" dominant-baseline="middle">GET /metrics</text><path class="seq" d="M694.4 946 L2012.6 946" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g><rect x="140" y="1074" width="2427" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1353.5" y="1100" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
</svg>
