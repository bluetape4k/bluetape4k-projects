<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="820" viewBox="0 0 1620 820" role="img" aria-labelledby="examples-ktor-observability-ktor-demo-sequence-01-title examples-ktor-observability-ktor-demo-sequence-01-desc">
  <title id="examples-ktor-observability-ktor-demo-sequence-01-title">Ktor Observability Demo Sequence</title>
  <desc id="examples-ktor-observability-ktor-demo-sequence-01-desc">Application-owned metrics routing, event observations, and optional OpenTelemetry spans.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
    <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
    <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
    <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
    <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
    <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
    <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .seq{stroke-width:2.3;fill:none}.seqReturn{stroke-width:2.3;fill:none;stroke-dasharray:8 7}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1620" height="820"/>
  <rect class="frame" x="32" y="28" width="1556" height="744" rx="26"/>
  <text class="title" x="66" y="82">Ktor Observability Demo Sequence</text>
  <text class="subtitle" x="70" y="116">Application-owned metrics routing, event observations, and optional OpenTelemetry spans.</text>

  <g id="client">
    <rect class="participant" x="90" y="165" width="165" height="74" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="participantTitle" x="172.5" y="202" text-anchor="middle" dominant-baseline="middle">Client</text>
    <line class="lifeline" x1="172.5" y1="239" x2="172.5" y2="720" />
  </g>

  <g id="ktor">
    <rect class="participant" x="350" y="165" width="165" height="74" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="participantTitle" x="432.5" y="190" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="participantTitle" x="432.5" y="214" text-anchor="middle" dominant-baseline="middle">Routes</text>
    <line class="lifeline" x1="432.5" y1="239" x2="432.5" y2="720" />
  </g>

  <g id="observability">
    <rect class="participant" x="625" y="165" width="180" height="74" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="participantTitle" x="715" y="190" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="participantTitle" x="715" y="214" text-anchor="middle" dominant-baseline="middle">Observability</text>
    <line class="lifeline" x1="715" y1="239" x2="715" y2="720" />
  </g>

  <g id="eventObs">
    <rect class="participant" x="900" y="165" width="165" height="74" rx="10" fill="#EAF7EF" stroke="#58A978"/>
    <text class="participantTitle" x="982.5" y="190" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="participantTitle" x="982.5" y="214" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <line class="lifeline" x1="982.5" y1="239" x2="982.5" y2="720" />
  </g>

  <g id="prom">
    <rect class="participant" x="1140" y="165" width="170" height="74" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="participantTitle" x="1225" y="190" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
<text class="participantTitle" x="1225" y="214" text-anchor="middle" dominant-baseline="middle">Registry</text>
    <line class="lifeline" x1="1225" y1="239" x2="1225" y2="720" />
  </g>

  <g id="otel">
    <rect class="participant" x="1360" y="165" width="170" height="74" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="participantTitle" x="1445" y="190" text-anchor="middle" dominant-baseline="middle">OpenTelemetry</text>
<text class="participantTitle" x="1445" y="214" text-anchor="middle" dominant-baseline="middle">optional</text>
    <line class="lifeline" x1="1445" y1="239" x2="1445" y2="720" />
  </g>

  <g id="post-order">
    <rect class="labelPill" x="183.65" y="254" width="271.7" height="26" rx="7"/>
    <circle cx="202.65" cy="267" r="12" fill="#4F83BF"/>
    <text class="edgeLabel" x="202.65" y="268" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text>
    <text class="edgeLabel" x="319.5" y="268" text-anchor="middle" dominant-baseline="middle">POST /orders/{orderId}/events</text>
    <path class="seq" d="M172.5 295 L432.5 295" stroke="#5B8DEF" marker-end="url(#seqArrow-blue)"/>
  </g>

  <g id="plugins">
    <rect class="labelPill" x="447.6" y="314" width="286.3" height="26" rx="7"/>
    <circle cx="466.6" cy="327" r="12" fill="#B9851B"/>
    <text class="edgeLabel" x="466.6" y="328" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text>
    <text class="edgeLabel" x="590.75" y="328" text-anchor="middle" dominant-baseline="middle">correlation + logging + metrics</text>
    <path class="seq" d="M432.5 355 L715 355" stroke="#D6A441" marker-end="url(#seqArrow-amber)"/>
  </g>

  <g id="publish">
    <rect class="labelPill" x="617.85" y="374" width="213.3" height="26" rx="7"/>
    <circle cx="636.85" cy="387" r="12" fill="#3E9868"/>
    <text class="edgeLabel" x="636.85" y="388" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text>
    <text class="edgeLabel" x="724.5" y="388" text-anchor="middle" dominant-baseline="middle">observe event.publish</text>
    <path class="seq" d="M432.5 415 L982.5 415" stroke="#58A978" marker-end="url(#seqArrow-green)"/>
  </g>

  <g id="consume">
    <rect class="labelPill" x="617.85" y="434" width="213.3" height="26" rx="7"/>
    <circle cx="636.85" cy="447" r="12" fill="#3E9868"/>
    <text class="edgeLabel" x="636.85" y="448" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text>
    <text class="edgeLabel" x="724.5" y="448" text-anchor="middle" dominant-baseline="middle">observe event.consume</text>
    <path class="seq" d="M432.5 475 L982.5 475" stroke="#58A978" marker-end="url(#seqArrow-green)"/>
  </g>

  <g id="timers">
    <rect class="labelPill" x="1028.7" y="494" width="184.1" height="26" rx="7"/>
    <circle cx="1047.7" cy="507" r="12" fill="#B9851B"/>
    <text class="edgeLabel" x="1047.7" y="508" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text>
    <text class="edgeLabel" x="1120.75" y="508" text-anchor="middle" dominant-baseline="middle">Micrometer timers</text>
    <path class="seq" d="M982.5 535 L1225 535" stroke="#D6A441" marker-end="url(#seqArrow-amber)"/>
  </g>

  <g id="spans">
    <rect class="labelPill" x="964.8" y="258" width="264.4" height="26" rx="7"/>
    <circle cx="983.8" cy="271" r="12" fill="#755BC6"/>
    <text class="edgeLabel" x="983.8" y="272" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text>
    <text class="edgeLabel" x="1097" y="272" text-anchor="middle" dominant-baseline="middle">server spans when configured</text>
    <path class="seqReturn" d="M715 300 L1445 300" stroke="#8A72D6" marker-end="url(#seqArrow-purple)"/>
  </g>

  <g id="json-response">
    <rect class="labelPill" x="227.5" y="554" width="184" height="26" rx="7"/>
    <circle cx="246.5" cy="567" r="12" fill="#C94D68"/>
    <text class="edgeLabel" x="246.5" y="568" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text>
    <text class="edgeLabel" x="319.5" y="568" text-anchor="middle" dominant-baseline="middle">200 JSON</text>
    <path class="seqReturn" d="M432.5 595 L172.5 595" stroke="#DC6B82" marker-end="url(#seqArrow-pink)"/>
  </g>

  <g id="scrape-request">
    <rect class="labelPill" x="227.5" y="609" width="184" height="26" rx="7"/>
    <circle cx="246.5" cy="622" r="12" fill="#B9851B"/>
    <text class="edgeLabel" x="246.5" y="623" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text>
    <text class="edgeLabel" x="319.5" y="623" text-anchor="middle" dominant-baseline="middle">GET /metrics</text>
    <path class="seq" d="M172.5 650 L432.5 650" stroke="#D6A441" marker-end="url(#seqArrow-amber)"/>
  </g>

  <g id="scrape-registry">
    <rect class="labelPill" x="753.75" y="584" width="184" height="26" rx="7"/>
    <circle cx="772.75" cy="597" r="12" fill="#B9851B"/>
    <text class="edgeLabel" x="772.75" y="598" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text>
    <text class="edgeLabel" x="845.75" y="598" text-anchor="middle" dominant-baseline="middle">scrape()</text>
    <path class="seq" d="M432.5 625 L1225 625" stroke="#D6A441" marker-end="url(#seqArrow-amber)"/>
  </g>
  <text class="note" x="810" y="790" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
