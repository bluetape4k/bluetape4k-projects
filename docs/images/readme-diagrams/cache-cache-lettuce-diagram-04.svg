<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1200" viewBox="0 0 1900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Lettuce RESP3 NearCache Runtime</title>
  <desc id="desc">Explain the Lettuce native runtime flow, key isolation, CLIENT TRACKING listener, and resilient write-behind option.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1900" height="1200"/>
  <rect class="decor" x="44" y="36" width="1812" height="1128" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1736" height="914" rx="24"/>
  <text class="title" x="72" y="88">Lettuce RESP3 NearCache Runtime</text>
  <text class="subtitle" x="76" y="121">The native runtime keeps L1 hits local and uses RESP3 tracking pushes to invalidate only matching cache-name keys.</text>
  <g id="panel-caller">
    <rect class="group" x="100" y="165" width="1700" height="195" rx="20"/>
    <text class="groupTitle" x="130" y="193" dominant-baseline="middle">Application boundary</text>
  </g>
  <g id="panel-facade">
    <rect class="group" x="100" y="390" width="1700" height="220" rx="20"/>
    <text class="groupTitle" x="130" y="418" dominant-baseline="middle">Native Lettuce NearCache</text>
  </g>
  <g id="panel-tiers">
    <rect class="group" x="100" y="640" width="1700" height="220" rx="20"/>
    <text class="groupTitle" x="130" y="668" dominant-baseline="middle">Cache tiers</text>
  </g>
  <g id="panel-events">
    <rect class="group" x="100" y="890" width="1700" height="165" rx="20"/>
    <text class="groupTitle" x="130" y="918" dominant-baseline="middle">RESP3 tracking and resilience</text>
  </g>
  <path class="connector" data-edge="caller-&gt;facade" data-label="cache API" d="M 282 326 L 282 375 L 770 375 L 770 455" stroke="#4F83BF"/>
  <g transform="translate(482.7,338)">
    <rect class="labelPill" x="0" y="0" width="86.6" height="26" rx="8"/>
    <text class="small" x="43.3" y="13" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">cache API</text>
  </g>
  <path class="connector" data-edge="keys-&gt;facade" data-label="configures" d="M 1080 509 L 980 509" stroke="#8A72D6"/>

  <path class="connector" data-edge="facade-&gt;front" data-label="read first" d="M 680 563 L 680 625 L 415 625 L 415 705" stroke="#45A7A1"/>
  <g transform="translate(500.5,588)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">read first</text>
  </g>
  <path class="connector" data-edge="front-&gt;redis" data-label="miss lookup" d="M 415 801 L 415 875 L 1425 875 L 1425 801" stroke="#D9AA4D"/>
  <g transform="translate(869.3,838)">
    <rect class="labelPill" x="0" y="0" width="101.4" height="26" rx="8"/>
    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">miss lookup</text>
  </g>
  <path class="connector" data-edge="facade-&gt;redis" data-label="write-through" d="M 860 563 L 860 625 L 1425 625 L 1425 705" stroke="#58A978"/>
  <g transform="translate(1084.4,588)">
    <rect class="labelPill" x="0" y="0" width="116.2" height="26" rx="8"/>
    <text class="small" x="58.1" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">write-through</text>
  </g>
  <path class="connector" data-edge="redis-&gt;tracking" data-label="push event" d="M 1235 753 L 1115 753" stroke="#DB7890"/>
  <g transform="translate(1128,716)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">push event</text>
  </g>
  <path class="connector" data-edge="tracking-&gt;front" data-label="invalidate" d="M 710 753 L 600 753" stroke="#DB7890"/>
  <g transform="translate(608,716)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">invalidate</text>
  </g>
  <path class="connector dashed" data-edge="redis-&gt;push" data-label="invalidates" d="M 1530 801 L 1530 955" stroke="#C85D55"/>
  <g transform="translate(1552,865)">
    <rect class="labelPill" x="0" y="0" width="101.4" height="26" rx="8"/>
    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#C85D55">invalidates</text>
  </g>
  <g id="node-caller" transform="translate(140,250)">
    <rect class="card" x="0" y="0" width="285" height="76" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="142.5" y="19" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="142.5" y="38" text-anchor="middle" dominant-baseline="middle">blocking or suspend API</text>
    <text class="detail" x="142.5" y="57" text-anchor="middle" dominant-baseline="middle">typed values via codec</text>
  </g>
  <g id="node-facade" transform="translate(560,455)">
    <rect class="card" x="0" y="0" width="420" height="108" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="210" y="25.5" text-anchor="middle" dominant-baseline="middle">LettuceNearCache variants</text>
    <text class="detail" x="210" y="44.5" text-anchor="middle" dominant-baseline="middle">front hit is local</text>
    <text class="detail" x="210" y="63.5" text-anchor="middle" dominant-baseline="middle">miss loads Redis</text>
    <text class="detail" x="210" y="82.5" text-anchor="middle" dominant-baseline="middle">writes register tracking</text>
  </g>
  <g id="node-keys" transform="translate(1080,466)">
    <rect class="card" x="0" y="0" width="400" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="200" y="14.5" text-anchor="middle" dominant-baseline="middle">Key isolation</text>
    <text class="detail" x="200" y="33.5" text-anchor="middle" dominant-baseline="middle">{cacheName}:{key}</text>
    <text class="detail" x="200" y="52.5" text-anchor="middle" dominant-baseline="middle">SCAN only own prefix</text>
    <text class="detail" x="200" y="71.5" text-anchor="middle" dominant-baseline="middle">no database-wide flush</text>
  </g>
  <g id="node-front" transform="translate(230,705)">
    <rect class="card" x="0" y="0" width="370" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="185" y="19.5" text-anchor="middle" dominant-baseline="middle">LettuceCaffeineLocalCache</text>
    <text class="detail" x="185" y="38.5" text-anchor="middle" dominant-baseline="middle">L1 Caffeine storage</text>
    <text class="detail" x="185" y="57.5" text-anchor="middle" dominant-baseline="middle">stats and max size</text>
    <text class="detail" x="185" y="76.5" text-anchor="middle" dominant-baseline="middle">invalidate target</text>
  </g>
  <g id="node-redis" transform="translate(1235,705)">
    <rect class="card" x="0" y="0" width="380" height="96" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="190" y="19.5" text-anchor="middle" dominant-baseline="middle">Redis backend</text>
    <text class="detail" x="190" y="38.5" text-anchor="middle" dominant-baseline="middle">GET/SET with TTL</text>
    <text class="detail" x="190" y="57.5" text-anchor="middle" dominant-baseline="middle">UNLINK delete</text>
    <text class="detail" x="190" y="76.5" text-anchor="middle" dominant-baseline="middle">EVALSHA CAS</text>
  </g>
  <g id="node-tracking" transform="translate(710,705)">
    <rect class="card" x="0" y="0" width="405" height="96" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="202.5" y="19.5" text-anchor="middle" dominant-baseline="middle">TrackingInvalidationListener</text>
    <text class="detail" x="202.5" y="38.5" text-anchor="middle" dominant-baseline="middle">CLIENT TRACKING ON NOLOOP</text>
    <text class="detail" x="202.5" y="57.5" text-anchor="middle" dominant-baseline="middle">decode ByteBuffer keys</text>
    <text class="detail" x="202.5" y="76.5" text-anchor="middle" dominant-baseline="middle">ignore other prefixes</text>
  </g>
  <g id="node-queue" transform="translate(520,955)">
    <rect class="card" x="0" y="0" width="365" height="76" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="182.5" y="9.5" text-anchor="middle" dominant-baseline="middle">Resilient write lane</text>
    <text class="detail" x="182.5" y="28.5" text-anchor="middle" dominant-baseline="middle">front update first</text>
    <text class="detail" x="182.5" y="47.5" text-anchor="middle" dominant-baseline="middle">async remote retry</text>
    <text class="detail" x="182.5" y="66.5" text-anchor="middle" dominant-baseline="middle">failure strategy</text>
  </g>
  <g id="node-push" transform="translate(1350,955)">
    <rect class="card" x="0" y="0" width="360" height="76" rx="12" fill="#FDECEC" stroke="#DB7F75"/>
    <text class="cardTitle" x="180" y="9.5" text-anchor="middle" dominant-baseline="middle">Redis push message</text>
    <text class="detail" x="180" y="28.5" text-anchor="middle" dominant-baseline="middle">invalidate key list</text>
    <text class="detail" x="180" y="47.5" text-anchor="middle" dominant-baseline="middle">null means full flush</text>
    <text class="detail" x="180" y="66.5" text-anchor="middle" dominant-baseline="middle">prefix filter before clear</text>
  </g>
  <g transform="translate(76,1096)">
    <rect class="labelPill" x="0" y="0" width="1748" height="48" rx="10"/>
    <text class="small" x="874" y="24" text-anchor="middle" dominant-baseline="middle">Source: cache README files and public cache contract implementations.</text>
  </g>
</svg>
