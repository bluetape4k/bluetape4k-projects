<svg xmlns="http://www.w3.org/2000/svg" width="998" height="1246" viewBox="0 0 998 1246" role="img" aria-label="Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="998" height="1246"/>
<rect class="frame" x="32" y="28" width="934" height="1190" rx="28"/>
<text class="title" x="66" y="82">Class Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="52" y="148" width="894" height="239" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="70" y="176">Contract layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="52" y="473" width="894" height="260" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="70" y="501">Abstraction layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="52" y="819" width="894" height="239" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="70" y="847">Implementation layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="inheritLine" d="M724 505 L724 430 L274 430 L274 355"/>
<path class="inheritLine" d="M499 851 L499 768 L274 768 L274 701"/>
<path class="implLine" d="M274 505 L274 414 L724 414 L724 355"/>
<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="190" y="49" text-anchor="middle">AbstractGrpcClient</text>
  <text class="mono" x="18" y="108">#channel: ManagedChannel?</text>
<text class="mono" x="18" y="129">+connect()</text>
<text class="mono" x="18" y="150">+close()</text>
</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="61" text-anchor="middle">GrpcServer</text>
  <text class="mono" x="18" y="108">+start()</text>
<text class="mono" x="18" y="129">+stop()</text>
<text class="mono" x="18" y="150">+blockUntilShutdown()</text>
</g>
<g transform="translate(84,505)">
  <rect class="card" x="0" y="0" width="380" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
    <text class="label" x="190" y="49" text-anchor="middle">AbstractGrpcServer</text>
  <text class="mono" x="18" y="108">#server: Server?</text>
<text class="mono" x="18" y="129">+start()</text>
<text class="mono" x="18" y="150">+stop()</text>
<text class="mono" x="18" y="171">+blockUntilShutdown()</text>
</g>
<g transform="translate(534,505)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
    <text class="label" x="190" y="49" text-anchor="middle">AbstractGrpcInprocessClient</text>
  <text class="mono" x="18" y="108">#serverName: String</text>
<text class="mono" x="18" y="129">+connect()</text>
<text class="mono" x="18" y="150">+close()</text>
</g>
<g transform="translate(309,851)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#45A7A1"/>
    <text class="label" x="190" y="49" text-anchor="middle">AbstractGrpcInprocessServer</text>
  <text class="mono" x="18" y="108">#serverName: String</text>
<text class="mono" x="18" y="129">+start()</text>
<text class="mono" x="18" y="150">+stop()</text>
</g>
</svg>
