<svg xmlns="http://www.w3.org/2000/svg" width="2052.4" height="1118" viewBox="0 0 2052.4 1118" role="img" aria-label="Event Telemetry Observation Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#4F83BF" stroke="#4F83BF" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3E9868" stroke="#3E9868" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2E8F89" stroke="#2E8F89" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B9851B" stroke="#B9851B" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#C94D68" stroke="#C94D68" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#755BC6" stroke="#755BC6" stroke-dasharray="none"/></marker>
  <marker id="seqArrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#758297" stroke="#758297" stroke-dasharray="none"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.12;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="2052.4" height="1060"/>
<rect class="frame" x="32" y="28" width="1988.4" height="1004" rx="30"/>
<text class="title" x="68" y="84">Event Telemetry Observation Sequence</text>
<text class="subtitle" x="72" y="116">Event telemetry creates bounded publish/consume observations, attaches safe tags, runs the block, and records outcome.</text>
<g id="seq-application"><rect class="card" x="140" y="170" width="230" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="255" y="215" text-anchor="middle">Application</text><line class="lifeline" x1="255" y1="248" x2="255" y2="976"/></g>
<g id="seq-eventtelemetry-helper"><rect class="card" x="525.6" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="640.6" y="200" text-anchor="middle">EventTelemetry</text><text class="cardTitle" x="640.6" y="224" text-anchor="middle">Helper</text><line class="lifeline" x1="640.6" y1="248" x2="640.6" y2="976"/></g>
<g id="seq-observation-registry"><rect class="card" x="911.2" y="170" width="230" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1026.2" y="200" text-anchor="middle">Observation</text><text class="cardTitle" x="1026.2" y="224" text-anchor="middle">Registry</text><line class="lifeline" x1="1026.2" y1="248" x2="1026.2" y2="976"/></g>
<g id="seq-observation"><rect class="card" x="1296.8" y="170" width="230" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1411.8" y="215" text-anchor="middle">Observation</text><line class="lifeline" x1="1411.8" y1="248" x2="1411.8" y2="976"/></g>
<g id="seq-publish-consume-block"><rect class="card" x="1682.4" y="170" width="230" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1797.4" y="200" text-anchor="middle">Publish / Consume</text><text class="cardTitle" x="1797.4" y="224" text-anchor="middle">Block</text><line class="lifeline" x1="1797.4" y1="248" x2="1797.4" y2="976"/></g>
<rect x="247" y="322" width="16" height="52" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="632.6" y="322" width="16" height="568" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1018.2" y="412" width="16" height="118" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1403.8" y="502" width="16" height="298" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1789.4" y="862" width="16" height="52" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="310.6" y="287" width="274.5" height="26" rx="7"/><circle cx="329.6" cy="300" r="12" fill="#4F83BF"/><text class="detail" x="329.6" y="301" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="465.8" y="301" text-anchor="middle" dominant-baseline="middle">select publish or consume</text><path class="seq" d="M255 330 L640.6 330" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="699.8" y="377" width="267.2" height="26" rx="7"/><circle cx="718.8" cy="390" r="12" fill="#3E9868"/><text class="detail" x="718.8" y="391" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="851.4" y="391" text-anchor="middle" dominant-baseline="middle">create event observation</text><path class="seq" d="M640.6 420 L1026.2 420" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="1089.1" y="467" width="259.9" height="26" rx="7"/><circle cx="1108.1" cy="480" r="12" fill="#2E8F89"/><text class="detail" x="1108.1" y="481" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1237" y="481" text-anchor="middle" dominant-baseline="middle">new Observation.Context</text><path class="seqReturn" d="M1026.2 510 L1411.8 510" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="859.8" y="541" width="332.9" height="42" rx="7"/><circle cx="878.8" cy="562" r="12" fill="#B9851B"/><text class="detail" x="878.8" y="563" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1044.2" y="554" text-anchor="middle" dominant-baseline="middle">attach safe low-cardinality event</text><text class="detail" x="1044.2" y="569" text-anchor="middle" dominant-baseline="middle">tags</text><path class="seq" d="M640.6 600 L1411.8 600" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="856.1" y="647" width="340.2" height="26" rx="7"/><circle cx="875.1" cy="660" r="12" fill="#C94D68"/><text class="detail" x="875.1" y="661" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="1044.2" y="661" text-anchor="middle" dominant-baseline="middle">add explicit sanitized identifiers</text><path class="seq" d="M640.6 690 L1411.8 690" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="907.2" y="737" width="238" height="26" rx="7"/><circle cx="926.2" cy="750" r="12" fill="#755BC6"/><text class="detail" x="926.2" y="751" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1044.2" y="751" text-anchor="middle" dominant-baseline="middle">start and open scope</text><path class="seq" d="M640.6 780 L1411.8 780" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m7"><rect class="labelPill" x="1056.2" y="827" width="325.6" height="26" rx="7"/><circle cx="1075.2" cy="840" r="12" fill="#4F83BF"/><text class="detail" x="1075.2" y="841" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="1237" y="841" text-anchor="middle" dominant-baseline="middle">execute publish or consume block</text><path class="seq" d="M640.6 870 L1797.4 870" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
</svg>
