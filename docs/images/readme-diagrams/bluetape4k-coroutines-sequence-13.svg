<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="1062" viewBox="0 0 1188 1062" role="img" aria-label="13. AsyncFlow — Order-Preserving Async Transformation">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
