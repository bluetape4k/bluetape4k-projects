<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1040" viewBox="0 0 1660 1040" role="img" aria-label="Serializer Class Hierarchy">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="open-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563EB" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-green" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16A34A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#EA580C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="tri-blue" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6 L 1 11 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="tri-green" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6 L 1 11 Z" fill="#FFFFFF" stroke="#16A34A" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="tri-teal" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 12 6 L 1 11 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.4" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #F8FAFC; }
      .frame { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0F172A; }
      .subtitle { font-family: "Comic Mono"; font-size: 16px; fill: #475569; }
      .panel { fill: #FFFFFF; stroke: #CBD5E1; stroke-width: 1.5; }
      .panelTitle { font-family: "Comic Mono"; font-size: 18px; fill: #334155; }
      .card { stroke-width: 1.8; filter: url(#softShadow); }
      .className { font-family: "Architects Daughter"; font-size: 24px; fill: #0F172A; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .member { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748B; }
      .divider { stroke: #CBD5E1; stroke-width: 1; }
      .implBlue { fill: none; stroke: #2563EB; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#tri-blue); }
      .implGreen { fill: none; stroke: #16A34A; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#tri-green); }
      .implTeal { fill: none; stroke: #0D9488; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 9 7; marker-end: url(#tri-teal); }
      .useBlue { fill: none; stroke: #2563EB; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#open-blue); }
      .useGreen { fill: none; stroke: #16A34A; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 7; marker-end: url(#open-green); }
      .refOrange { fill: none; stroke: #EA580C; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-orange); }
    </style>
  </defs>

  <rect class="canvas" width="1660" height="1040"/>
  <rect class="frame" x="34" y="30" width="1592" height="978" rx="8"/>

  <text class="title" x="72" y="82">Serializer Class Hierarchy</text>
  <text class="subtitle" x="76" y="114">Apache Avro serializers in bluetape4k-avro: dynamic records, generated records, and reflection.</text>

  <g>
    <rect class="panel" x="70" y="150" width="1520" height="245" rx="8"/>
    <text class="panelTitle" x="96" y="182">Public serializer interfaces</text>
  </g>
  <g>
    <rect class="panel" x="70" y="470" width="1520" height="255" rx="8"/>
    <text class="panelTitle" x="96" y="502">Default DataFile implementations</text>
  </g>
  <g>
    <rect class="panel" x="70" y="790" width="1520" height="160" rx="8"/>
    <text class="panelTitle" x="96" y="822">Shared support and reader contract</text>
  </g>

  <g id="generic-interface">
    <rect class="card" x="105" y="215" width="430" height="140" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="stereo" x="320" y="244" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="className" x="320" y="272" text-anchor="middle">AvroGenericRecordSerializer</text>
    <line class="divider" x1="125" y1="288" x2="515" y2="288"/>
    <text class="member" x="135" y="312">+ serialize(schema, GenericRecord?)</text>
    <text class="member" x="135" y="333">+ deserialize(schema, bytes?)</text>
  </g>
  <g id="specific-interface">
    <rect class="card" x="615" y="215" width="430" height="140" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
    <text class="stereo" x="830" y="244" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="className" x="830" y="272" text-anchor="middle">AvroSpecificRecordSerializer</text>
    <line class="divider" x1="635" y1="288" x2="1025" y2="288"/>
    <text class="member" x="645" y="312">+ serialize(SpecificRecord?)</text>
    <text class="member" x="645" y="333">+ serializeList(List&lt;T&gt;?)</text>
  </g>
  <g id="reflect-interface">
    <rect class="card" x="1125" y="215" width="430" height="140" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <text class="stereo" x="1340" y="244" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="className" x="1340" y="272" text-anchor="middle">AvroReflectSerializer</text>
    <line class="divider" x1="1145" y1="288" x2="1535" y2="288"/>
    <text class="member" x="1155" y="312">+ serialize(graph: T?)</text>
    <text class="member" x="1155" y="333">+ deserialize(bytes?, Class&lt;T&gt;)</text>
  </g>

  <g id="generic-impl">
    <rect class="card" x="105" y="545" width="430" height="140" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="className" x="320" y="579" text-anchor="middle">DefaultAvroGeneric...</text>
    <text class="stereo" x="320" y="602" text-anchor="middle">GenericDatumWriter / Reader</text>
    <line class="divider" x1="125" y1="616" x2="515" y2="616"/>
    <text class="member" x="135" y="640">schema required at call site</text>
    <text class="member" x="135" y="661">failure =&gt; null, logged</text>
  </g>
  <g id="specific-impl">
    <rect class="card" x="615" y="545" width="430" height="140" rx="8" fill="#FFFFFF" stroke="#16A34A"/>
    <text class="className" x="830" y="579" text-anchor="middle">DefaultAvroSpecific...</text>
    <text class="stereo" x="830" y="602" text-anchor="middle">SpecificDatumWriter / Reader</text>
    <line class="divider" x1="635" y1="616" x2="1025" y2="616"/>
    <text class="member" x="645" y="640">single record + list APIs</text>
    <text class="member" x="645" y="661">compatible schema evolution</text>
  </g>
  <g id="reflect-impl">
    <rect class="card" x="1125" y="545" width="430" height="140" rx="8" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="className" x="1340" y="579" text-anchor="middle">DefaultAvroReflect...</text>
    <text class="stereo" x="1340" y="602" text-anchor="middle">ReflectDatumWriter / Reader</text>
    <line class="divider" x1="1145" y1="616" x2="1535" y2="616"/>
    <text class="member" x="1155" y="640">per-class schema cache</text>
    <text class="member" x="1155" y="661">failure =&gt; null, logged</text>
  </g>

  <path class="implBlue" d="M 320 545 L 320 355"/>
  <path class="implGreen" d="M 830 545 L 830 355"/>
  <path class="implTeal" d="M 1340 545 L 1340 355"/>

  <g id="codec-support">
    <rect class="card" x="105" y="850" width="330" height="70" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="className" x="270" y="878" text-anchor="middle">CodecFactorySupport</text>
    <text class="member" x="270" y="903" text-anchor="middle">default, zstd, snappy, bzip2, xz</text>
  </g>
  <g id="datafile">
    <rect class="card" x="510" y="850" width="300" height="70" rx="8" fill="#F8FAFC" stroke="#64748B"/>
    <text class="className" x="660" y="878" text-anchor="middle">Avro DataFile</text>
    <text class="member" x="660" y="903" text-anchor="middle">DataFileWriter / Reader</text>
  </g>
  <g id="base64">
    <rect class="card" x="885" y="850" width="300" height="70" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
    <text class="className" x="1035" y="878" text-anchor="middle">Base64 wrappers</text>
    <text class="member" x="1035" y="903" text-anchor="middle">serializeAsString / fromString</text>
  </g>
  <g id="reader-contract">
    <rect class="card" x="1260" y="850" width="295" height="70" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
    <text class="className" x="1408" y="878" text-anchor="middle">Reader contract</text>
    <text class="member" x="1408" y="903" text-anchor="middle">Specific for traffic, Reflect for flex</text>
  </g>

  <path class="useBlue" d="M 320 685 L 320 780 L 660 780 L 660 850"/>
  <path class="useGreen" d="M 830 685 L 830 780 L 1035 780 L 1035 850"/>
  <path class="useGreen" d="M 1340 685 L 1340 780 L 1408 780 L 1408 850"/>

  <g transform="translate(105, 970)">
    <path class="implBlue" d="M 0 8 L 34 8"/>
    <text class="small" x="48" y="13">implements</text>
    <path class="useBlue" d="M 190 8 L 224 8"/>
    <text class="small" x="238" y="13">uses helper</text>
  </g>
</svg>
