  <text class="classTitle" x="518" y="596" text-anchor="middle">DefaultAvroSpecific</text>
<text class="classTitle" x="518" y="618" text-anchor="middle">RecordSerializer</text>
  <line x1="348" y1="622" x2="688" y2="622" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="366" y="660">-codecFactory: CodecFactory</text>
</g>
<g>
  <rect x="2267" y="802" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M2285 820 L2343 820" stroke="#3E9868"/>
  <text class="detail" x="2357" y="825">inheritance / implementation</text>
  <path class="dependency" d="M2285 841 L2343 841" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="2357" y="846">dependency / usage</text>
</g>
<g><rect x="180" y="820" width="2042" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1201" y="846" text-anchor="middle">Graphviz evidence: .dot, .plain, and -graphviz.svg define relationship order and route intent.</text></g>
