<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1253" viewBox="0 0 1500 1253" role="img" aria-label="Serializer Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1253"/>
<rect class="frame" x="32" y="28" width="1436" height="1197" rx="30"/>
<text class="title" x="68" y="84">Serializer Class Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="DefaultAvroReflectSerializer" data-to="AvroReflectSerializer" data-route-color="green" d="M724 791 L724 690" stroke="#3E9868"/>
<path class="inherit" data-from="DefaultAvroSpecificRecordSerializer" data-to="AvroSpecificRecordSerializer" data-route-color="blue" d="M288 398 L288 297" stroke="#4F83BF"/>
<path class="inherit" data-from="DefaultAvroGenericRecordSerializer" data-to="AvroGenericRecordSerializer" data-route-color="teal" d="M724 398 L724 297" stroke="#2E8F89"/>
<g id="AvroSpecificRecordSerializer">
  <rect class="classCard" x="118" y="165" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="288" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="203" text-anchor="middle">AvroSpecificRecord</text>
<text class="classTitle" x="288" y="225" text-anchor="middle">Serializer</text>
  <line x1="118" y1="229" x2="458" y2="229" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="136" y="250">+serialize(record) ByteArray</text>
<text class="member" x="136" y="267">+deserialize(bytes) T</text>
<text class="member" x="136" y="284">+serializeList(records) ByteArray</text>
</g>
<g id="AvroGenericRecordSerializer">
  <rect class="classCard" x="554" y="165" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="724" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="724" y="203" text-anchor="middle">AvroGenericRecord</text>
<text class="classTitle" x="724" y="225" text-anchor="middle">Serializer</text>
  <line x1="554" y1="229" x2="894" y2="229" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="572" y="250">+serialize(schema, record)</text>
<text class="member" x="572" y="267">ByteArray</text>
<text class="member" x="572" y="284">+deserialize(schema, bytes)</text>
</g>
<g id="AvroReflectSerializer">
  <rect class="classCard" x="554" y="558" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="724" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="724" y="605" text-anchor="middle">AvroReflectSerializer</text>
  <line x1="554" y1="614" x2="894" y2="614" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="572" y="648">+serialize(obj) ByteArray</text>
<text class="member" x="572" y="665">+deserialize(bytes) T</text>
</g>
<g id="AvroSerializer">
  <rect class="classCard" x="554" y="951" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="724" y="970" text-anchor="middle">class</text>
  <text class="classTitle" x="724" y="998" text-anchor="middle">AvroSerializer</text>
  <line x1="554" y1="1007" x2="894" y2="1007" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="572" y="1032">+serialize(schema, record)</text>
<text class="member" x="572" y="1049">ByteArray</text>
<text class="member" x="572" y="1066">+deserialize(schema, bytes)</text>
</g>
<g id="DefaultAvroReflectSerializer">
  <rect class="classCard" x="554" y="791" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="724" y="810" text-anchor="middle">class</text>
  <text class="classTitle" x="724" y="829" text-anchor="middle">DefaultAvroReflect</text>
<text class="classTitle" x="724" y="851" text-anchor="middle">Serializer</text>
  <line x1="554" y1="855" x2="894" y2="855" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="572" y="885">-codecFactory: CodecFactory</text>
<text class="member" x="572" y="902">-schemaCache: Map~Class, Schema~</text>
</g>
<g id="DefaultAvroGenericRecordSerializer">
  <rect class="classCard" x="554" y="398" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="724" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="724" y="436" text-anchor="middle">DefaultAvroGenericRecord</text>
<text class="classTitle" x="724" y="458" text-anchor="middle">Serializer</text>
  <line x1="554" y1="462" x2="894" y2="462" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="572" y="500">-codecFactory: CodecFactory</text>
</g>
<g id="DefaultAvroSpecificRecordSerializer">
  <rect class="classCard" x="118" y="398" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="288" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="436" text-anchor="middle">DefaultAvroSpecific</text>
<text class="classTitle" x="288" y="458" text-anchor="middle">RecordSerializer</text>
  <line x1="118" y1="462" x2="458" y2="462" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="136" y="500">-codecFactory: CodecFactory</text>
</g>
<g>
  <rect x="1085" y="1145" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1163 L1161 1163" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1168">inheritance / implementation</text>
  <path class="dependency" d="M1103 1184 L1161 1184" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1189">dependency / usage</text>
</g>
<g><rect x="180" y="1163" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1189" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
