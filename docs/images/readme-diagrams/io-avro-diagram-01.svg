<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="937" viewBox="0 0 1754 937" role="img" aria-label="Serializer Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="937"/>
<rect class="frame" x="32" y="28" width="1690" height="881" rx="28"/>
<text class="title" x="66" y="82">Serializer Class Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="implLine" d="M877 539 C877 440.5 672 440.5 672 342"/>
<path class="implLine" d="M1287 539 C1287 469.5 1492 469.5 1492 400"/>
<path class="implLine" d="M467 539 C467 448.5 262 448.5 262 358"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Avro Generic Record</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Serializer</text>
  <text class="mono" x="18" y="124">+serialize(schema, record) ByteArray</text>
<text class="mono" x="18" y="145">+deserialize(schema, bytes) GenericRecord</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">AvroReflectSerializer</text>
  <text class="mono" x="18" y="108">+serialize(obj) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(bytes) T</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">AvroSerializer</text>
  <text class="mono" x="18" y="108">+serialize(schema, record) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(schema, bytes) GenericRecord</text>
<text class="mono" x="18" y="150">+serializeAsString(schema, record) String</text>
<text class="mono" x="18" y="171">+deserializeFromString(schema, text)</text>
<text class="mono" x="18" y="192">GenericRecord</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="212" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Avro Specific Record</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Serializer</text>
  <text class="mono" x="18" y="124">+serialize(record) ByteArray</text>
<text class="mono" x="18" y="145">+deserialize(bytes) T</text>
<text class="mono" x="18" y="166">+serializeList(records) ByteArray</text>
<text class="mono" x="18" y="187">+deserializeList(bytes) List~T~</text>
</g>
<g transform="translate(297,547)">
  <rect class="card" x="0" y="0" width="340" height="149" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Default Avro Generic</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Record Serializer</text>
  <text class="mono" x="18" y="124">-codecFactory: CodecFactory</text>
</g>
<g transform="translate(707,547)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Default Avro Reflect</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Serializer</text>
  <text class="mono" x="18" y="124">-codecFactory: CodecFactory</text>
<text class="mono" x="18" y="145">-schemaCache: Map~Class, Schema~</text>
</g>
<g transform="translate(1117,547)">
  <rect class="card" x="0" y="0" width="340" height="149" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Default Avro Specific</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Record Serializer</text>
  <text class="mono" x="18" y="124">-codecFactory: CodecFactory</text>
</g>
</svg>
