<rect class="canvas" width="2320" height="1420" />
<rect class="frame" x="38" y="34" width="2244" height="1352" rx="22" />
<text class="title" x="86" y="100">Avro Serializer Class Structure</text>
<text class="subtitle" x="88" y="134">Three public serializer contracts map to DataFile-based implementations with shared codec, Base64, and failure behavior.</text>
<text class="sectionLabel" x="106" y="204">Public serializer interfaces</text>
<g id="generic-iface" class="classBox blue">
<rect x="110" y="240" width="620" height="190" rx="12" />
<text class="stereo" x="420" y="274" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="classTitle" x="420" y="310" text-anchor="middle">AvroGenericRecordSerializer</text>
<line class="divider" x1="110" y1="332" x2="730" y2="332" />
<text class="member" x="140" y="365" text-anchor="start">+ serialize(schema, GenericRecord?)</text>
<text class="member" x="140" y="393" text-anchor="start">+ deserialize(schema, ByteArray?)</text>
<text class="member" x="140" y="421" text-anchor="start">+ serializeAsString(...) / deserializeFromString(...)</text>
</g>
<g id="specific-iface" class="classBox green">
<rect x="850" y="240" width="620" height="190" rx="12" />
<text class="stereo" x="1160" y="274" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="classTitle" x="1160" y="310" text-anchor="middle">AvroSpecificRecordSerializer</text>
<line class="divider" x1="850" y1="332" x2="1470" y2="332" />
<text class="member" x="880" y="365" text-anchor="start">+ serialize(SpecificRecord?)</text>
<text class="member" x="880" y="393" text-anchor="start">+ deserialize(bytes, Class&lt;T&gt;)</text>
<text class="member" x="880" y="421" text-anchor="start">+ serializeList(...) / deserializeList(...)</text>
</g>
<g id="reflect-iface" class="classBox teal">
<rect x="1590" y="240" width="620" height="190" rx="12" />
<text class="stereo" x="1900" y="274" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
<text class="classTitle" x="1900" y="310" text-anchor="middle">AvroReflectSerializer</text>
<line class="divider" x1="1590" y1="332" x2="2210" y2="332" />
<text class="member" x="1620" y="365" text-anchor="start">+ serialize(graph: T?)</text>
<text class="member" x="1620" y="393" text-anchor="start">+ deserialize(bytes, Class&lt;T&gt;)</text>
<text class="member" x="1620" y="421" text-anchor="start">+ reified deserialize helpers</text>
</g>
<text class="sectionLabel" x="106" y="556">Default implementations</text>
<g id="generic-impl" class="classBox blue">
<rect x="110" y="592" width="620" height="226" rx="12" />
<text class="stereo" x="420" y="626" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
<text class="classTitle" x="420" y="662" text-anchor="middle">DefaultAvroGenericRecordSerializer</text>
<line class="divider" x1="110" y1="684" x2="730" y2="684" />
<text class="member" x="140" y="717" text-anchor="start">- codecFactory: CodecFactory</text>
<text class="member" x="140" y="745" text-anchor="start">+ GenericDatumWriter / GenericDatumReader</text>
<text class="member" x="140" y="773" text-anchor="start">+ schema is required at call site</text>
<text class="member" x="140" y="801" text-anchor="start">+ failure =&gt; null, logged</text>
</g>
<g id="specific-impl" class="classBox green">
<rect x="850" y="592" width="620" height="226" rx="12" />
<text class="stereo" x="1160" y="626" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
<text class="classTitle" x="1160" y="662" text-anchor="middle">DefaultAvroSpecificRecordSerializer</text>
<line class="divider" x1="850" y1="684" x2="1470" y2="684" />
<text class="member" x="880" y="717" text-anchor="start">- codecFactory: CodecFactory</text>
<text class="member" x="880" y="745" text-anchor="start">+ SpecificDatumWriter / SpecificDatumReader</text>
<text class="member" x="880" y="773" text-anchor="start">+ single record and list APIs</text>
<text class="member" x="880" y="801" text-anchor="start">+ failure =&gt; null or emptyList(), logged</text>
</g>
<g id="reflect-impl" class="classBox teal">
<rect x="1590" y="592" width="620" height="226" rx="12" />
<text class="stereo" x="1900" y="626" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
<text class="classTitle" x="1900" y="662" text-anchor="middle">DefaultAvroReflectSerializer</text>
<line class="divider" x1="1590" y1="684" x2="2210" y2="684" />
<text class="member" x="1620" y="717" text-anchor="start">- codecFactory: CodecFactory</text>
<text class="member" x="1620" y="745" text-anchor="start">+ ReflectDatumWriter / ReflectDatumReader</text>
<text class="member" x="1620" y="773" text-anchor="start">+ per-class schema cache</text>
<text class="member" x="1620" y="801" text-anchor="start">+ failure =&gt; null, logged</text>
</g>
<text class="sectionLabel" x="106" y="970">Shared support contracts</text>
<g id="failure" class="supportBox pink">
<rect x="110" y="1010" width="560" height="188" rx="12" />
<text class="supportTitle" x="390" y="1058" text-anchor="middle">Failure and string contract</text>
<line class="divider" x1="110" y1="1080" x2="670" y2="1080" />
<text class="member" x="140" y="1113" text-anchor="start">Base64 wrappers live on interfaces</text>
<text class="member" x="140" y="1141" text-anchor="start">invalid Base64 returns null</text>
<text class="member" x="140" y="1169" text-anchor="start">deserialization failures do not escape</text>
</g>
<g id="datafile" class="supportBox gray">
<rect x="780" y="1010" width="760" height="188" rx="12" />
<text class="supportTitle" x="1160" y="1058" text-anchor="middle">Avro DataFile container</text>
<line class="divider" x1="780" y1="1080" x2="1540" y2="1080" />
<text class="member" x="810" y="1113" text-anchor="start">DataFileWriter + DataFileReader</text>
<text class="member" x="810" y="1141" text-anchor="start">SeekableByteArrayInput for reads</text>
<text class="member" x="810" y="1169" text-anchor="start">serializer constructors accept CodecFactory</text>
</g>
<g id="reflect-cache" class="supportBox amber">
<rect x="1650" y="1010" width="560" height="188" rx="12" />
<text class="supportTitle" x="1930" y="1058" text-anchor="middle">Reflect schema cache</text>
<line class="divider" x1="1650" y1="1080" x2="2210" y2="1080" />
<text class="member" x="1680" y="1113" text-anchor="start">ConcurrentHashMap&lt;Class&lt;*&gt;, Schema&gt;</text>
<text class="member" x="1680" y="1141" text-anchor="start">ReflectData.get().getSchema(clazz)</text>
<text class="member" x="1680" y="1169" text-anchor="start">used only by reflection serializer</text>
</g>
