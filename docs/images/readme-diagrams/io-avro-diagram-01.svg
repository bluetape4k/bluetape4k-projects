  <text class="stereo" x="1662" y="577" text-anchor="middle">class</text>
  <text class="classTitle" x="1662" y="596" text-anchor="middle">DefaultAvroReflect</text>
<text class="classTitle" x="1662" y="618" text-anchor="middle">Serializer</text>
