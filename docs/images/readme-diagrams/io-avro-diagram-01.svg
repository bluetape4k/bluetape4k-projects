<polygon points="1909,451 1900,430 1891,451" fill="#FFFFFF" stroke="#64748B" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
<rect class="labelBg" x="1908" y="492" width="204" height="30" rx="9" />
<text class="edgeLabel" x="2010" y="512" text-anchor="middle">implements</text>
