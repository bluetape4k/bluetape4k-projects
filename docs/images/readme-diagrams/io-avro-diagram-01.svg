<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1279" viewBox="0 0 1500 1279" role="img" aria-label="Serializer Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1279"/>
<rect class="frame" x="32" y="28" width="1436" height="1223" rx="30"/>
<text class="title" x="68" y="84">Serializer Class Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="DefaultAvroReflectSerializer" data-to="AvroReflectSerializer" data-route-color="green" d="M968 797 L968 702" stroke="#3E9868"/>
<path class="inherit" data-from="DefaultAvroSpecificRecordSerializer" data-to="AvroSpecificRecordSerializer" data-route-color="blue" d="M497 398 L497 321" stroke="#4F83BF"/>
<path class="inherit" data-from="DefaultAvroGenericRecordSerializer" data-to="AvroGenericRecordSerializer" data-route-color="teal" d="M978 398 L978 311" stroke="#2E8F89"/>
<g id="AvroSpecificRecordSerializer">
  <rect class="classCard" x="312" y="165" width="360" height="156" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="492" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="492" y="203" text-anchor="middle">AvroSpecificRecord</text>
<text class="classTitle" x="492" y="225" text-anchor="middle">Serializer</text>
  <line x1="312" y1="229" x2="672" y2="229" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="346" y="262">+serialize(record) ByteArray</text>
<text class="member" x="346" y="279">+deserialize(bytes) T</text>
<text class="member" x="346" y="296">+serializeList(records) ByteArray</text>
</g>
<g id="AvroGenericRecordSerializer">
  <rect class="classCard" x="788" y="165" width="400" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="988" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="988" y="203" text-anchor="middle">AvroGenericRecord</text>
<text class="classTitle" x="988" y="225" text-anchor="middle">Serializer</text>
  <line x1="788" y1="229" x2="1188" y2="229" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="822" y="257">+serialize(schema, record)</text>
<text class="member" x="822" y="274">ByteArray</text>
<text class="member" x="822" y="291">+deserialize(schema, bytes)</text>
</g>
<g id="AvroReflectSerializer">
  <rect class="classCard" x="788" y="564" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="968" y="583" text-anchor="middle">class</text>
  <text class="classTitle" x="968" y="611" text-anchor="middle">AvroReflectSerializer</text>
  <line x1="788" y1="620" x2="1148" y2="620" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="822" y="657">+serialize(obj) ByteArray</text>
<text class="member" x="822" y="674">+deserialize(bytes) T</text>
</g>
<g id="AvroSerializer">
  <rect class="classCard" x="788" y="963" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="968" y="982" text-anchor="middle">class</text>
  <text class="classTitle" x="968" y="1010" text-anchor="middle">AvroSerializer</text>
  <line x1="788" y1="1019" x2="1148" y2="1019" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="822" y="1051">+serialize(schema, record)</text>
<text class="member" x="822" y="1068">ByteArray</text>
<text class="member" x="822" y="1085">+deserialize(schema, bytes)</text>
</g>
<g id="DefaultAvroReflectSerializer">
  <rect class="classCard" x="788" y="797" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="968" y="816" text-anchor="middle">class</text>
  <text class="classTitle" x="968" y="835" text-anchor="middle">DefaultAvroReflect</text>
<text class="classTitle" x="968" y="857" text-anchor="middle">Serializer</text>
  <line x1="788" y1="861" x2="1148" y2="861" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="822" y="894">-codecFactory: CodecFactory</text>
<text class="member" x="822" y="911">-schemaCache: Map~Class, Schema~</text>
</g>
<g id="DefaultAvroGenericRecordSerializer">
  <rect class="classCard" x="788" y="398" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="968" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="968" y="436" text-anchor="middle">DefaultAvroGeneric</text>
<text class="classTitle" x="968" y="458" text-anchor="middle">RecordSerializer</text>
  <line x1="788" y1="462" x2="1148" y2="462" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="822" y="503">-codecFactory: CodecFactory</text>
</g>
<g id="DefaultAvroSpecificRecordSerializer">
  <rect class="classCard" x="312" y="398" width="380" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="502" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="502" y="436" text-anchor="middle">DefaultAvroSpecificRecord</text>
<text class="classTitle" x="502" y="458" text-anchor="middle">Serializer</text>
  <line x1="312" y1="462" x2="692" y2="462" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="346" y="503">-codecFactory: CodecFactory</text>
</g>
<g>
  <rect x="1085" y="1171" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1189 L1161 1189" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1194">inheritance / implementation</text>
  <path class="dependency" d="M1103 1210 L1161 1210" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1215">dependency / usage</text>
</g>
<g><rect x="180" y="1189" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1215" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
