<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1065" viewBox="0 0 1540 1065" role="img" aria-label="IdGenerator Ktor Demo Architecture">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1540" height="1065"/>
<rect class="frame" x="32" y="28" width="1476" height="1009" rx="30"/>
<text class="title" x="68" y="84">IdGenerator Ktor Demo Architecture</text>
<text class="subtitle" x="72" y="116">Ktor routes delegate to a registry-backed generator service and return typed JSON responses.</text>
<g><rect class="panel" x="86" y="165" width="1370" height="160" rx="22"/><text class="panelTitle" x="110" y="199">HTTP API layer</text></g>
<g id="routes"><rect class="card" x="160" y="220" width="320" height="74" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="320" y="248" text-anchor="middle">Ktor routes</text><text class="detail" x="320" y="284" text-anchor="middle">explicit and generic endpoints</text></g>
<g id="serialization"><rect class="card" x="600" y="220" width="320" height="74" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="760" y="248" text-anchor="middle">JSON response model</text><text class="detail" x="760" y="284" text-anchor="middle">typed id payloads</text></g>
<g id="errors"><rect class="card" x="1040" y="220" width="300" height="74" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1190" y="248" text-anchor="middle">Status handling</text><text class="detail" x="1190" y="284" text-anchor="middle">validation and failures</text></g>
<path class="flow" d="M480 257 L600 257" stroke="#4F83BF"/>
<path class="flow" d="M920 257 L1040 257" stroke="#3E9868"/>
<g><rect class="panel" x="86" y="430" width="1370" height="190" rx="22"/><text class="panelTitle" x="110" y="464">Application service layer</text></g>
<g id="service"><rect class="card" x="250" y="500" width="360" height="86" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="430" y="534" text-anchor="middle">IdGenerator service</text><text class="detail" x="430" y="570" text-anchor="middle">selects generator by route</text></g>
<g id="registry"><rect class="card" x="850" y="500" width="360" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1030" y="534" text-anchor="middle">Generator registry</text><text class="detail" x="1030" y="570" text-anchor="middle">Snowflake, UUID, ULID families</text></g>
<path class="flow" d="M320 294 L320 380 L430 380 L430 500" stroke="#4F83BF"/>
<path class="flow" d="M610 543 L850 543" stroke="#755BC6"/>
<g><rect class="panel" x="86" y="735" width="1370" height="190" rx="22"/><text class="panelTitle" x="110" y="769">Generator runtime layer</text></g>
<g id="clock"><rect class="card" x="180" y="805" width="300" height="82" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="330" y="837" text-anchor="middle">Clock and node id</text><text class="detail" x="330" y="873" text-anchor="middle">timestamp + worker identity</text></g>
<g id="algorithm"><rect class="card" x="610" y="795" width="340" height="102" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="780" y="837" text-anchor="middle">ID algorithms</text><text class="detail" x="780" y="873" text-anchor="middle">monotonic, sortable, random</text></g>
<g id="metrics"><rect class="card" x="1080" y="805" width="280" height="82" rx="14" fill="#F2F5F9" stroke="#9AA8B8"/><text class="cardTitle" x="1220" y="837" text-anchor="middle">Observability</text><text class="detail" x="1220" y="873" text-anchor="middle">latency and throughput probes</text></g>
<path class="flow" d="M1030 586 L1030 805" stroke="#B9851B"/>
<path class="flow" d="M480 846 L610 846" stroke="#2E8F89"/>
<path class="flow" d="M950 846 L1080 846" stroke="#3E9868"/>
<g><rect x="205" y="975" width="1130" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="770" y="1001" text-anchor="middle">bluetape4k-projects examples - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
