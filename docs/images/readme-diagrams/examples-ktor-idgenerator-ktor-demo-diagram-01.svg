<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="790" viewBox="0 0 1420 790" role="img" aria-labelledby="examples-ktor-idgenerator-ktor-demo-diagram-01-title examples-ktor-idgenerator-ktor-demo-diagram-01-desc">
  <title id="examples-ktor-idgenerator-ktor-demo-diagram-01-title">idgenerator Ktor Demo Architecture</title>
  <desc id="examples-ktor-idgenerator-ktor-demo-diagram-01-desc">Explicit and generic routes share one registry and the common bluetape4k Ktor baseline</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#22344A;font-weight:400}
      .body{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;fill:#34465B;font-weight:400}
      .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .edgeLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476;font-weight:400;dominant-baseline:middle}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.92}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#627184;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1420" height="790"/>
  <rect class="frame" x="32" y="28" width="1356" height="734" rx="26"/>
  <text class="title" x="66" y="82">idgenerator Ktor Demo Architecture</text>
  <text class="subtitle" x="70" y="116">Explicit and generic routes share one registry and the common bluetape4k Ktor baseline</text>
  <path class="edge" d="M340 370 L365 370 L365 240 L390 240"/>
<path class="edge" d="M540 325 L540 412.5 L540 412.5 L540 500"/>
<path class="edge" d="M690 585 L725 585 L725 380 L760 380"/>
<path class="edge" d="M1075 380 L1102.5 380 L1102.5 380 L1130 380"/>
<path class="edge" d="M760 380 L550 380 L550 370 L340 370"/>
<path class="edge" d="M390 240 L365 240 L365 370 L340 370"/>
  <g>
  <rect class="card" x="70" y="295" width="270" height="150" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="205" y="337" text-anchor="middle">HTTP client</text>
  <text class="body" x="205" y="372" text-anchor="middle">/ids/{type}</text>
<text class="body" x="205" y="395" text-anchor="middle">/idgen/{type}</text>
<text class="body" x="205" y="418" text-anchor="middle">/generators</text>
</g>
<g>
  <rect class="card" x="390" y="155" width="300" height="170" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="540" y="197" text-anchor="middle">Ktor application</text>
  <text class="body" x="540" y="232" text-anchor="middle">CIO server</text>
<text class="body" x="540" y="255" text-anchor="middle">install core</text>
<text class="body" x="540" y="278" text-anchor="middle">install observability</text>
</g>
<g>
  <rect class="card" x="390" y="500" width="300" height="170" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="540" y="542" text-anchor="middle">Routes</text>
  <text class="body" x="540" y="577" text-anchor="middle">explicit /ids/*</text>
<text class="body" x="540" y="600" text-anchor="middle">generic /idgen/{type}</text>
<text class="body" x="540" y="623" text-anchor="middle">batch size 1..100</text>
</g>
<g>
  <rect class="card" x="760" y="295" width="315" height="170" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="917.5" y="337" text-anchor="middle">IdGeneratorRegistry</text>
  <text class="body" x="917.5" y="372" text-anchor="middle">type lookup</text>
<text class="body" x="917.5" y="395" text-anchor="middle">single/batch response</text>
<text class="body" x="917.5" y="418" text-anchor="middle">unknown type -&gt; 400</text>
</g>
<g>
  <rect class="card" x="1130" y="295" width="240" height="170" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1250" y="337" text-anchor="middle">ID generators</text>
  <text class="body" x="1250" y="372" text-anchor="middle">UUID v4/v7</text>
<text class="body" x="1250" y="395" text-anchor="middle">ULID, KSUID</text>
<text class="body" x="1250" y="418" text-anchor="middle">Snowflake, Flake</text>
</g>
  <text class="note" x="710" y="752" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
