<svg data-intent="Show the demo architecture from HTTP routes through validation and IdGeneratorRegistry to concrete UUID/ULID/KSUID/Snowflake/Flake generators." data-evidence="examples/ktor/idgenerator-ktor-demo/README.md; examples/ktor/idgenerator-ktor-demo/src/main" data-source-read="examples/ktor/idgenerator-ktor-demo/README.md; examples/ktor/idgenerator-ktor-demo/src/main" xmlns="http://www.w3.org/2000/svg" width="1500" height="1140" viewBox="0 0 1500 1140" role="img" aria-label="Ktor IdGenerator Demo Request Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563" stroke="#4B5563" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8" stroke="#1D4ED8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D" stroke="#15803D" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E" stroke="#0F766E" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C" stroke="#C2410C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D" stroke="#BE185D" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE" stroke="#7E22CE" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563" stroke="#4B5563" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1140"/>
<rect class="frame" x="34" y="30" width="1432" height="1080" rx="8"/>
<text class="title" x="72" y="84">Ktor IdGenerator Demo Request Flow</text>
<text class="subtitle" x="76" y="116">Routes validate input, resolve the requested generator, then return generated IDs or structured API errors; Ktor support is installed beside the request path.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="190" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">HTTP entry</text></g>
<g><rect class="panel" x="82" y="430" width="1336" height="220" rx="8"/><text class="panelTitle" x="110" y="466" dominant-baseline="middle">Request policy</text></g>
<g><rect class="panel" x="82" y="730" width="1336" height="330" rx="8"/><text class="panelTitle" x="110" y="766" dominant-baseline="middle">Generation outcomes</text></g>
<g id="client">
  <rect class="card" x="165" y="235" width="320" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="325" y="267" text-anchor="middle" dominant-baseline="middle">HTTP client</text>
  <text class="detail" x="325" y="297" text-anchor="middle" dominant-baseline="middle">/ids, /idgen, /generators</text>
</g>
<g id="routes">
  <rect class="card" x="590" y="230" width="340" height="88" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="760" y="267" text-anchor="middle" dominant-baseline="middle">idGeneratorRoutes</text>
  <text class="detail" x="760" y="297" text-anchor="middle" dominant-baseline="middle">single-id and batch endpoints</text>
</g>
<g id="support">
  <rect class="card" x="1035" y="235" width="300" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1185" y="267" text-anchor="middle" dominant-baseline="middle">Ktor support</text>
  <text class="detail" x="1185" y="297" text-anchor="middle" dominant-baseline="middle">JSON, StatusPages, telemetry</text>
</g>
<g id="validation">
  <rect class="card" x="330" y="520" width="360" height="88" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="510" y="548" text-anchor="middle" dominant-baseline="middle">Request validation</text>
  <text class="detail" x="510" y="578" text-anchor="middle" dominant-baseline="middle">generator type exists</text>
  <text class="detail" x="510" y="596" text-anchor="middle" dominant-baseline="middle">batch size is 1..100</text>
</g>
<g id="registry">
  <rect class="card" x="810" y="520" width="360" height="88" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="990" y="548" text-anchor="middle" dominant-baseline="middle">IdGeneratorRegistry</text>
  <text class="detail" x="990" y="578" text-anchor="middle" dominant-baseline="middle">maps request type</text>
  <text class="detail" x="990" y="596" text-anchor="middle" dominant-baseline="middle">selects generator implementation</text>
</g>
<g id="errors">
  <rect class="card" x="175" y="815" width="390" height="90" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="370" y="844" text-anchor="middle" dominant-baseline="middle">API errors</text>
  <text class="detail" x="370" y="874" text-anchor="middle" dominant-baseline="middle">unknown generator type</text>
  <text class="detail" x="370" y="892" text-anchor="middle" dominant-baseline="middle">invalid batch size</text>
</g>
<g id="generators">
  <rect class="card" x="835" y="815" width="390" height="90" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1030" y="844" text-anchor="middle" dominant-baseline="middle">Generator families</text>
  <text class="detail" x="1030" y="874" text-anchor="middle" dominant-baseline="middle">UUID, ULID, KSUID</text>
  <text class="detail" x="1030" y="892" text-anchor="middle" dominant-baseline="middle">Snowflake and Flake</text>
</g>
<g id="response">
  <rect class="card" x="505" y="940" width="390" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="700" y="972" text-anchor="middle" dominant-baseline="middle">HTTP response payload</text>
  <text class="detail" x="700" y="1002" text-anchor="middle" dominant-baseline="middle">generated ids or structured error</text>
</g>
<path class="route" data-from="client" data-to="routes" d="M485 274 L590 274" stroke="#1D4ED8" marker-end="url(#seqArrow-blue)"/>
<path class="route dashed" data-from="routes" data-to="support" d="M930 274 L1035 274" stroke="#7E22CE"/>
<polygon points="1023,280 1035,274 1023,268" fill="#7E22CE" stroke="#7E22CE" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" data-from="routes" data-to="validation" d="M 760 318 L 760 371 Q 760 385 746 385 L 524 385 Q 510 385 510 399 L 510 520" stroke="#C2410C" marker-end="url(#seqArrow-amber)" stroke-linecap="round" stroke-linejoin="round"/>
<path class="route" data-from="validation" data-to="registry" d="M690 564 L810 564" stroke="#0F766E" marker-end="url(#seqArrow-teal)"/>
<path class="route dashed" data-from="validation" data-to="errors" d="M 510 608 L 510 696 Q 510 710 496 710 L 384 710 Q 370 710 370 724 L 370 815" stroke="#BE185D" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="364,803 370,815 376,803" fill="#BE185D" stroke="#BE185D" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" data-from="registry" data-to="generators" d="M990 608 L990 815" stroke="#15803D" marker-end="url(#seqArrow-green)"/>
<path class="route dashed" data-from="errors" data-to="response" d="M 370 905 L 370 965 Q 370 979 384 979 L 505 979" stroke="#BE185D" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="493,985 505,979 493,973" fill="#BE185D" stroke="#BE185D" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" data-from="generators" data-to="response" d="M 1030 905 L 1030 965 Q 1030 979 1016 979 L 895 979" stroke="#15803D" marker-end="url(#seqArrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
