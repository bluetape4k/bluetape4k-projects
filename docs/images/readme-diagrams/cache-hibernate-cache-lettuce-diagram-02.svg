<svg xmlns="http://www.w3.org/2000/svg" width="1530" height="970" viewBox="0 0 1530 970" role="img" aria-label="Hibernate Cache Layer Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1530" height="970"/>
<rect class="frame" x="32" y="28" width="1466" height="914" rx="30"/>
<text class="title" x="68" y="84">Hibernate Cache Layer Structure</text>
<text class="subtitle" x="72" y="116">A responsibility stack for Hibernate SPI, bluetape4k adapters, and concrete Caffeine/Redis storage.</text>
<g><rect class="panel" x="86" y="165" width="1360" height="150" rx="22"/><text class="panelTitle" x="110" y="199">Hibernate contract layer</text></g>
<g id="spi"><rect class="card" x="190" y="210" width="320" height="74" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="350" y="229" text-anchor="middle">Hibernate cache SPI</text><text class="detail" x="350" y="265" text-anchor="middle">RegionFactory + access</text>
<text class="detail" x="350" y="283" text-anchor="middle">strategies</text></g>
<g id="regions"><rect class="card" x="770" y="210" width="320" height="74" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="930" y="229" text-anchor="middle">Region types</text><text class="detail" x="930" y="265" text-anchor="middle">entity, collection,</text>
<text class="detail" x="930" y="283" text-anchor="middle">natural-id, query</text></g>
<path class="flow" d="M510 247 L770 247" stroke="#755BC6"/>
<g><rect class="panel" x="86" y="395" width="1360" height="175" rx="22"/><text class="panelTitle" x="110" y="429">bluetape4k cache layer</text></g>
<g id="factory"><rect class="card" x="180" y="445" width="340" height="108" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="350" y="469" text-anchor="middle">LettuceCacheRegion</text><text class="cardTitle" x="350" y="493" text-anchor="middle">Factory</text><text class="detail" x="350" y="529" text-anchor="middle">builds configured cache</text>
<text class="detail" x="350" y="547" text-anchor="middle">regions</text></g>
<g id="access"><rect class="card" x="610" y="432" width="380" height="132" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="800" y="480" text-anchor="middle">Access strategy adapters</text><text class="detail" x="800" y="516" text-anchor="middle">read/write, non-strict,</text>
<text class="detail" x="800" y="534" text-anchor="middle">transactional contracts</text></g>
<g id="codec"><rect class="card" x="1090" y="445" width="290" height="108" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1235" y="490" text-anchor="middle">Serializer / codec</text><text class="detail" x="1235" y="526" text-anchor="middle">binary cache payload</text></g>
<path class="flow" d="M520 499 L610 499" stroke="#3E9868"/>
<path class="flow" d="M990 499 L1090 499" stroke="#B9851B"/>
<path class="flow" d="M350 284 L350 360 L560 360 L560 470 L610 470" stroke="#755BC6"/>
<path class="flow" d="M930 284 L930 432" stroke="#4F83BF"/>
<g><rect class="panel" x="86" y="665" width="1360" height="170" rx="22"/><text class="panelTitle" x="110" y="699">Storage layer</text></g>
<g id="front"><rect class="card" x="185" y="720" width="320" height="80" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="345" y="751" text-anchor="middle">Caffeine local cache</text><text class="detail" x="345" y="787" text-anchor="middle">near hot-set</text></g>
<g id="redis"><rect class="card" x="610" y="710" width="350" height="100" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="785" y="751" text-anchor="middle">Redis via Lettuce</text><text class="detail" x="785" y="787" text-anchor="middle">shared region data</text></g>
<g id="metrics"><rect class="card" x="1080" y="720" width="280" height="80" rx="14" fill="#F2F5F9" stroke="#9AA8B8"/><text class="cardTitle" x="1220" y="751" text-anchor="middle">Metricslogging</text><text class="detail" x="1220" y="787" text-anchor="middle">operational visibility</text></g>
<path class="flow" d="M800 564 L800 710" stroke="#B9851B"/>
<path class="flow" d="M505 760 L610 760" stroke="#B9851B"/>
<path class="flow" d="M960 760 L1080 760" stroke="#2E8F89"/>
<g><rect x="205" y="880" width="1120" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="765" y="906" text-anchor="middle">Layer boundaries explain why Hibernate contracts stay above bluetape4k adapters and storage implementations.</text></g>
</svg>
