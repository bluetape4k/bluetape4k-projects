<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="1150" viewBox="0 0 1570 1150" role="img" aria-label="Hibernate Lettuce Near Cache">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1570" height="1150"/>
<rect class="frame" x="32" y="28" width="1506" height="1094" rx="30"/>
<text class="title" x="68" y="84">Hibernate Lettuce Near Cache</text>
<text class="subtitle" x="72" y="116">Hibernate cache regions use a local Caffeine tier and a shared Lettuce Redis tier through one access strategy.</text>
<g><rect class="panel" x="86" y="165" width="1400" height="170" rx="22"/><text class="panelTitle" x="110" y="199">Hibernate integration</text></g>
<g id="entity"><rect class="card" x="155" y="220" width="300" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="305" y="252" text-anchor="middle">EntityManager / Session</text><text class="detail" x="305" y="288" text-anchor="middle">loads entities and collections</text></g>
<g id="region"><rect class="card" x="590" y="210" width="360" height="102" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="770" y="243" text-anchor="middle">Hibernate Cache Region</text><text class="detail" x="770" y="279" text-anchor="middle">entity, collection, query,</text>
<text class="detail" x="770" y="297" text-anchor="middle">timestamps</text></g>
<g id="factory"><rect class="card" x="1090" y="220" width="300" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="1240" y="252" text-anchor="middle">RegionFactory</text><text class="detail" x="1240" y="288" text-anchor="middle">creates access strategies</text></g>
<path class="flow" d="M455 261 L590 261" stroke="#4F83BF"/>
<path class="flow" d="M950 261 L1090 261" stroke="#755BC6"/>
<g><rect class="panel" x="86" y="450" width="1400" height="245" rx="22"/><text class="panelTitle" x="110" y="484">2-tier Near Cache</text></g>
<g id="front"><rect class="card" x="170" y="535" width="320" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="330" y="572" text-anchor="middle">Caffeine front tier</text><text class="detail" x="330" y="608" text-anchor="middle">hot keys in-process</text></g>
<g id="near"><rect class="card" x="625" y="522" width="340" height="118" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="795" y="551" text-anchor="middle">NearCache access</text><text class="cardTitle" x="795" y="575" text-anchor="middle">strategy</text><text class="detail" x="795" y="611" text-anchor="middle">coordinates hits, misses, and</text>
<text class="detail" x="795" y="629" text-anchor="middle">writes</text></g>
<g id="redis"><rect class="card" x="1100" y="535" width="320" height="92" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1260" y="572" text-anchor="middle">Lettuce Redis back tier</text><text class="detail" x="1260" y="608" text-anchor="middle">shared distributed cache</text></g>
<path class="flow" d="M490 581 L625 581" stroke="#B9851B"/>
<path class="flow" d="M965 581 L1100 581" stroke="#2E8F89"/>
<path class="flow" d="M770 312 L770 522" stroke="#755BC6"/>
<g><rect class="panel" x="86" y="815" width="1400" height="195" rx="22"/><text class="panelTitle" x="110" y="849">Consistency contract</text></g>
<g id="put"><rect class="card" x="155" y="875" width="300" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="305" y="907" text-anchor="middle">putupdate</text><text class="detail" x="305" y="943" text-anchor="middle">write-through to Redis</text></g>
<g id="evict"><rect class="card" x="590" y="875" width="300" height="82" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="740" y="898" text-anchor="middle">evictclear</text><text class="detail" x="740" y="934" text-anchor="middle">remove local and remote</text>
<text class="detail" x="740" y="952" text-anchor="middle">entries</text></g>
<g id="ttl"><rect class="card" x="1025" y="875" width="300" height="82" rx="14" fill="#F2F5F9" stroke="#9AA8B8"/><text class="cardTitle" x="1175" y="907" text-anchor="middle">TTL / invalidation</text><text class="detail" x="1175" y="943" text-anchor="middle">Redis state governs sharing</text></g>
<path class="flow" d="M455 916 L590 916" stroke="#4F83BF"/>
<path class="flow" d="M890 916 L1025 916" stroke="#C94D68"/>
<g><rect x="205" y="1058" width="1165" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="787.5" y="1084" text-anchor="middle">The diagram is layered by responsibility instead of a grid: Hibernate API, near-cache storage, then consistency semantics.</text></g>
</svg>
