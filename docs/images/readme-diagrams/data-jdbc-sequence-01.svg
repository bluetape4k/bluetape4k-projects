<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="986" viewBox="0 0 2140 986" role="img" aria-label="JDBC Query Execution Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2140" height="986"/>
<rect class="frame" x="32" y="28" width="2076" height="930" rx="28"/>
<text class="title" x="66" y="82">JDBC Query Execution Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="926" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="500" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="650" y="198.5" text-anchor="middle">DataSource</text>
<text class="smallLabel" x="650" y="219.5" text-anchor="middle">Extension</text>
<line class="lifeline" x1="650" y1="252" x2="650" y2="926" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="920" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1070" y="198.5" text-anchor="middle">Connection</text>
<text class="smallLabel" x="1070" y="219.5" text-anchor="middle">Extension</text>
<line class="lifeline" x1="1070" y1="252" x2="1070" y2="926" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1340" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1490" y="209" text-anchor="middle">PreparedStatement</text>
<line class="lifeline" x1="1490" y1="252" x2="1490" y2="926" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1760" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1910" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1910" y1="252" x2="1910" y2="926" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="301" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="319" y="313" text-anchor="start">1. withConnect { conn -&gt; ... }</text>
<path class="line" d="M230 332 L650 332"/>
<rect x="672.5" y="362" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="690.5" y="389" text-anchor="start">2. executeQuery(sql, params) { rs -&gt; ... }</text>
<path class="line" d="M650 408 L1070 408"/>
<rect x="1165" y="438" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1183" y="465" text-anchor="start">3. prepareStatement(sql)</text>
<path class="line" d="M1070 484 L1490 484"/>
<rect x="1165" y="514" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1183" y="541" text-anchor="start">4. setParameters(params)</text>
<path class="line" d="M1070 560 L1490 560"/>
<rect x="1595" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1613" y="617" text-anchor="start">5. executeQuery()</text>
<path class="line" d="M1490 636 L1910 636"/>
<rect x="1595" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1613" y="693" text-anchor="start">6. ResultSet</text>
<path class="dashed" d="M1910 712 L1490 712"/>
<rect x="1175" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1193" y="769" text-anchor="start">7. ResultSet</text>
<path class="dashed" d="M1490 788 L1070 788"/>
<rect x="545" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="563" y="845" text-anchor="start">8. Processed result</text>
<path class="dashed" d="M1070 864 L230 864"/>
</svg>
