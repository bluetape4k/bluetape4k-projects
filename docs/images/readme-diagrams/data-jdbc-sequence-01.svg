<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1236" viewBox="0 0 1960 1236" role="img" aria-label="JDBC Query Execution Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1236"/>
<rect class="frame" x="32" y="28" width="1896" height="1180" rx="28"/>
<text class="title" x="66" y="82">JDBC Query Execution Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="198.5" text-anchor="middle">DataSource</text>
<text class="smallLabel" x="560" y="219.5" text-anchor="middle">Extension</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="198.5" text-anchor="middle">Connection</text>
<text class="smallLabel" x="980" y="219.5" text-anchor="middle">Extension</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="209" text-anchor="middle">PreparedStatement</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">Database</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="211" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="229" y="313" text-anchor="start">1. withConnect { conn -&gt; ... }</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="582.5" y="396" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="600.5" y="423" text-anchor="start">2. executeQuery(sql, params) { rs -&gt; ... }</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="1075" y="506" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1093" y="533" text-anchor="start">3. prepareStatement(sql)</text>
<path class="line" d="M980 564 L1400 564"/>
<rect x="1075" y="616" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1093" y="643" text-anchor="start">4. setParameters(params)</text>
<path class="line" d="M980 674 L1400 674"/>
<rect x="1505" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="753" text-anchor="start">5. executeQuery()</text>
<path class="line" d="M1400 784 L1820 784"/>
<rect x="1505" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="863" text-anchor="start">6. ResultSet</text>
<path class="dashed" d="M1820 894 L1400 894"/>
<rect x="1085" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="973" text-anchor="start">7. ResultSet</text>
<path class="dashed" d="M1400 1004 L980 1004"/>
<rect x="455" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="473" y="1083" text-anchor="start">8. Processed result</text>
<path class="dashed" d="M980 1114 L140 1114"/>
</svg>
