<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1100" viewBox="0 0 1780 1100" role="img" aria-labelledby="title desc">
  <title id="title">SuspendNearCacheOperations Coroutine Contract</title>
  <desc id="desc">Explain the coroutine contract and its cancellation-safe resilience wrapper.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1780" height="1100"/>
  <rect class="decor" x="44" y="36" width="1692" height="1028" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1616" height="814" rx="24"/>
  <text class="title" x="72" y="88">SuspendNearCacheOperations Coroutine Contract</text>
  <text class="subtitle" x="76" y="121">Suspend APIs keep remote work cancellable while local statistics and front-cache checks stay synchronous.</text>
  <g id="panel-contract">
    <rect class="group" x="585" y="188" width="550" height="235" rx="20"/>
    <text class="groupTitle" x="615" y="216" dominant-baseline="middle">Coroutine NearCache contract</text>
  </g>
  <g id="panel-families">
    <rect class="group" x="92" y="500" width="1570" height="205" rx="20"/>
    <text class="groupTitle" x="122" y="528" dominant-baseline="middle">Operation families</text>
  </g>
  <g id="panel-support">
    <rect class="group" x="260" y="750" width="1325" height="170" rx="20"/>
    <text class="groupTitle" x="290" y="778" dominant-baseline="middle">Coroutine-specific guarantees</text>
  </g>
  <path class="connector" data-edge="ops-&gt;read" data-label="exposes" d="M 640 310 L 390 310 L 390 565" stroke="#45A7A1"/>
  <g transform="translate(479.1,273)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;write" data-label="exposes" d="M 720 376 L 720 565" stroke="#58A978"/>
  <g transform="translate(742,457.5)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;delete" data-label="exposes" d="M 1080 336 L 1090 336 L 1090 565" stroke="#DB7890"/>
  <g transform="translate(1112,437.5)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;local" data-label="exposes" d="M 1080 310 L 1480 310 L 1480 565" stroke="#D9AA4D"/>
  <g transform="translate(1244.1,273)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">exposes</text>
  </g>
  <path class="connector dashed" data-edge="decorator-&gt;ops" data-label="decorates" d="M 895 815 L 895 445 L 980 445 L 980 376" stroke="#58A978"/>

  <path class="connector dashed" data-edge="decorator-&gt;cancel" data-label="preserves" d="M 770 856 L 680 856" stroke="#C85D55"/>

  <g id="node-ops" transform="translate(640,250)">
    <rect class="card" x="0" y="0" width="440" height="126" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <line x1="0" y1="50" x2="440" y2="50" stroke="#45A7A1" stroke-width="1.6"/>
    <text class="stereo" x="220" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="220" y="36" text-anchor="middle" dominant-baseline="middle">SuspendNearCacheOperations&lt;V&gt;</text>
    <text class="member" x="220" y="70" text-anchor="middle" dominant-baseline="middle">suspend get / put / remove</text>
    <text class="member" x="220" y="88" text-anchor="middle" dominant-baseline="middle">suspend clearAll / close</text>
    <text class="member" x="220" y="106" text-anchor="middle" dominant-baseline="middle">clearLocal and stats stay local</text>
  </g>
  <g id="node-read" transform="translate(145,565)">
    <rect class="card" x="0" y="0" width="330" height="88" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="165" y="15.5" text-anchor="middle" dominant-baseline="middle">Suspend read path</text>
    <text class="detail" x="165" y="34.5" text-anchor="middle" dominant-baseline="middle">suspend get(key)</text>
    <text class="detail" x="165" y="53.5" text-anchor="middle" dominant-baseline="middle">suspend getAll(keys)</text>
    <text class="detail" x="165" y="72.5" text-anchor="middle" dominant-baseline="middle">suspend containsKey(key)</text>
  </g>
  <g id="node-write" transform="translate(535,565)">
    <rect class="card" x="0" y="0" width="330" height="88" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="165" y="15.5" text-anchor="middle" dominant-baseline="middle">Suspend write path</text>
    <text class="detail" x="165" y="34.5" text-anchor="middle" dominant-baseline="middle">suspend put / putAll</text>
    <text class="detail" x="165" y="53.5" text-anchor="middle" dominant-baseline="middle">suspend putIfAbsent</text>
    <text class="detail" x="165" y="72.5" text-anchor="middle" dominant-baseline="middle">suspend replace</text>
  </g>
  <g id="node-delete" transform="translate(925,565)">
    <rect class="card" x="0" y="0" width="330" height="88" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="165" y="25" text-anchor="middle" dominant-baseline="middle">Suspend delete path</text>
    <text class="detail" x="165" y="44" text-anchor="middle" dominant-baseline="middle">suspend remove / removeAll</text>
    <text class="detail" x="165" y="63" text-anchor="middle" dominant-baseline="middle">suspend getAndRemove</text>
  </g>
  <g id="node-local" transform="translate(1315,565)">
    <rect class="card" x="0" y="0" width="330" height="88" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="165" y="15.5" text-anchor="middle" dominant-baseline="middle">Local-only controls</text>
    <text class="detail" x="165" y="34.5" text-anchor="middle" dominant-baseline="middle">clearLocal()</text>
    <text class="detail" x="165" y="53.5" text-anchor="middle" dominant-baseline="middle">localCacheSize()</text>
    <text class="detail" x="165" y="72.5" text-anchor="middle" dominant-baseline="middle">stats() snapshot</text>
  </g>
  <g id="node-cancel" transform="translate(330,815)">
    <rect class="card" x="0" y="0" width="350" height="82" rx="12" fill="#FDECEC" stroke="#DB7F75"/>
    <text class="cardTitle" x="175" y="22" text-anchor="middle" dominant-baseline="middle">Cancellation semantics</text>
    <text class="detail" x="175" y="41" text-anchor="middle" dominant-baseline="middle">CancellationException is rethrown</text>
    <text class="detail" x="175" y="60" text-anchor="middle" dominant-baseline="middle">no retry for coroutine cancel</text>
  </g>
  <g id="node-decorator" transform="translate(770,815)">
    <rect class="card" x="0" y="0" width="430" height="82" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="215" y="22" text-anchor="middle" dominant-baseline="middle">ResilientSuspendNearCacheDecorator</text>
    <text class="detail" x="215" y="41" text-anchor="middle" dominant-baseline="middle">executeSuspendFunction</text>
    <text class="detail" x="215" y="60" text-anchor="middle" dominant-baseline="middle">Retry only for normal failures</text>
  </g>
  <g id="node-stats" transform="translate(1265,815)">
    <rect class="card" x="0" y="0" width="300" height="82" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="150" y="22" text-anchor="middle" dominant-baseline="middle">NearCacheStatistics</text>
    <text class="detail" x="150" y="41" text-anchor="middle" dominant-baseline="middle">front/back counters</text>
    <text class="detail" x="150" y="60" text-anchor="middle" dominant-baseline="middle">immutable snapshot</text>
  </g>
  <g transform="translate(76,996)">
    <rect class="labelPill" x="0" y="0" width="1628" height="48" rx="10"/>
    <text class="small" x="814" y="24" text-anchor="middle" dominant-baseline="middle">Source: cache README files and public cache contract implementations.</text>
  </g>
</svg>
