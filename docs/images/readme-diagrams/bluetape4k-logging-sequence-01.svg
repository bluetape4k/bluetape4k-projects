<svg xmlns="http://www.w3.org/2000/svg" width="2386" height="1104" viewBox="0 0 2386 1104" role="img" aria-label="KLoggingChannel Async Logging Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.12;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="2386" height="1104"/>
<rect class="frame" x="32" y="28" width="2322" height="1048" rx="30"/>
<text class="title" x="68" y="84">KLoggingChannel Async Logging Sequence</text>
<text class="subtitle" x="72" y="116">Shows the main calls, branches, and returned values for this flow.</text>
<g id="seq-application-coroutine"><rect class="card" x="140" y="170" width="230" height="78" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="255" y="200" text-anchor="middle">Application</text><text class="cardTitle" x="255" y="224" text-anchor="middle">Coroutine</text><line class="lifeline" x1="255" y1="248" x2="255" y2="1020"/></g>
<g id="seq-kloggingchannel"><rect class="card" x="609" y="170" width="230" height="78" rx="10" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="724" y="215" text-anchor="middle">KLoggingChannel</text><line class="lifeline" x1="724" y1="248" x2="724" y2="1020"/></g>
<g id="seq-mutablesharedflow-buffer-64"><rect class="card" x="1078" y="170" width="230" height="78" rx="10" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1193" y="200" text-anchor="middle">MutableSharedFlow</text><text class="cardTitle" x="1193" y="224" text-anchor="middle">(buffer 64)</text><line class="lifeline" x1="1193" y1="248" x2="1193" y2="1020"/></g>
<g id="seq-background-coroutine"><rect class="card" x="1547" y="170" width="230" height="78" rx="10" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1662" y="200" text-anchor="middle">Background</text><text class="cardTitle" x="1662" y="224" text-anchor="middle">Coroutine</text><line class="lifeline" x1="1662" y1="248" x2="1662" y2="1020"/></g>
<g id="seq-slf4j-logger"><rect class="card" x="2016" y="170" width="230" height="78" rx="10" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="2131" y="215" text-anchor="middle">SLF4J Logger</text><line class="lifeline" x1="2131" y1="248" x2="2131" y2="1020"/></g>
<g><rect class="altBox" x="112" y="308" width="2162" height="46" rx="16"/><rect class="labelPill branchPill" x="389.3" y="294" width="200.4" height="26" rx="7"/><text class="detail" x="489.5" y="307" text-anchor="middle" dominant-baseline="middle">else buffer full (&gt;64)</text></g>
<rect x="247" y="380" width="16" height="380" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="716" y="380" width="16" height="204" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1185" y="556" width="16" height="292" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1654" y="820" width="16" height="116" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="2123" y="908" width="16" height="52" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
<g id="m1"><rect class="labelPill" x="307.8" y="345" width="363.5" height="26" rx="7"/><circle cx="326.8" cy="358" r="12" fill="#4F83BF"/><text class="detail" x="326.8" y="359" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">1</text><text class="detail" x="507.5" y="359" text-anchor="middle" dominant-baseline="middle">log.debug { Processing event: $id }</text><path class="seq" d="M255 388 L724 388" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m2"><rect class="labelPill" x="834" y="433" width="238" height="26" rx="7"/><circle cx="853" cy="446" r="12" fill="#3E9868"/><text class="detail" x="853" y="447" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="971" y="447" text-anchor="middle" dominant-baseline="middle">check isDebugEnabled</text><path class="seq" d="M724 476 L814 476 L814 504 L742 504" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="809.6" y="521" width="297.8" height="26" rx="7"/><circle cx="828.6" cy="534" r="12" fill="#2E8F89"/><text class="detail" x="828.6" y="535" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="976.5" y="535" text-anchor="middle" dominant-baseline="middle">emit(LogEvent(DEBUG, msg))</text><path class="seq" d="M724 564 L1193 564" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="545.9" y="609" width="356.2" height="26" rx="7"/><circle cx="564.9" cy="622" r="12" fill="#2E8F89"/><text class="detail" x="564.9" y="623" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="742" y="623" text-anchor="middle" dominant-baseline="middle">resumes immediately (non-blocking)</text><path class="seqReturn" d="M1193 652 L255 652" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m5"><rect class="labelPill" x="589.7" y="697" width="268.6" height="26" rx="7"/><circle cx="608.7" cy="710" r="12" fill="#2E8F89"/><text class="detail" x="608.7" y="711" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="742" y="711" text-anchor="middle" dominant-baseline="middle">SUSPEND (backpressure)</text><path class="seqReturn" d="M1193 740 L255 740" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m6"><rect class="labelPill" x="1312.5" y="785" width="230" height="26" rx="7"/><circle cx="1331.5" cy="798" r="12" fill="#2E8F89"/><text class="detail" x="1331.5" y="799" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1445.5" y="799" text-anchor="middle" dominant-baseline="middle">collect LogEvent</text><path class="seqReturn" d="M1662 828 L1193 828" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m7"><rect class="labelPill" x="1765.9" y="873" width="261.3" height="26" rx="7"/><circle cx="1784.9" cy="886" r="12" fill="#2E8F89"/><text class="detail" x="1784.9" y="887" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="1914.5" y="887" text-anchor="middle" dominant-baseline="middle">log.debug(msg, error)</text><path class="seqReturn" d="M1662 916 L2131 916" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
</svg>
