<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1528" viewBox="0 0 1960 1528" role="img" aria-label="KLoggingChannel Async Logging Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1528"/>
<rect class="frame" x="32" y="28" width="1896" height="1472" rx="28"/>
<text class="title" x="66" y="82">KLoggingChannel Async Logging Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="198.5" text-anchor="middle">Application</text>
<text class="smallLabel" x="140" y="219.5" text-anchor="middle">Coroutine</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1468" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="209" text-anchor="middle">KLoggingChannel</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1468" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="198.5" text-anchor="middle">MutableSharedFlow</text>
<text class="smallLabel" x="980" y="219.5" text-anchor="middle">(buffer 64)</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1468" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="198.5" text-anchor="middle">Background</text>
<text class="smallLabel" x="1400" y="219.5" text-anchor="middle">Coroutine</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1468" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">SLF4J Logger</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1468" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="178.5" y="286" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="196.5" y="313" text-anchor="start">1. log.debug { Processing event: $id }</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="497" y="396" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="515" y="423" text-anchor="start">2. check isDebugEnabled</text>
<path class="line" d="M560 454 C624 454 624 488 560 488"/>
<rect x="70" y="526" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="553" text-anchor="start">ALT: DEBUG disabled</text>
<rect x="150.5" y="594" width="399" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="168.5" y="621" text-anchor="start">4. (Lambda not executed, returns immediately)</text>
<path class="dashed" d="M560 652 L140 652"/>
<rect x="70" y="704" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="731" text-anchor="start">ELSE: DEBUG enabled</text>
<rect x="635" y="772" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="653" y="799" text-anchor="start">6. emit(LogEvent(DEBUG, msg))</text>
<path class="line" d="M560 830 L980 830"/>
<rect x="70" y="882" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="909" text-anchor="start">ALT: buffer has space</text>
<rect x="392.5" y="950" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="410.5" y="977" text-anchor="start">8. resumes immediately (non-blocking)</text>
<path class="dashed" d="M980 1008 L140 1008"/>
<rect x="70" y="1060" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1087" text-anchor="start">ELSE: buffer full (&gt;64)</text>
<rect x="437" y="1128" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="455" y="1155" text-anchor="start">10. SUSPEND (backpressure)</text>
<path class="dashed" d="M980 1186 L140 1186"/>
<rect x="1085" y="1238" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1265" text-anchor="start">11. collect LogEvent</text>
<path class="line" d="M1400 1296 L980 1296"/>
<rect x="1491" y="1348" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1509" y="1375" text-anchor="start">12. log.debug(msg, error)</text>
<path class="line" d="M1400 1406 L1820 1406"/>
</svg>
