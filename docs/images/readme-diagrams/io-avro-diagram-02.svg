<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1020" viewBox="0 0 1320 1020" role="img" aria-labelledby="title desc">
  <title id="title">Avro codec selection guide</title>
  <desc id="desc">Flowchart-style selection guide for Avro codec factories showing default, Snappy, archive, null codec, and custom codec choices before ByteArray output.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .group-title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
      .card-title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;fill:#627184;font-weight:400}
      .card-shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1320" height="1020"/>
  <rect class="frame" x="34" y="30" width="1252" height="960" rx="28"/>
  <text class="title" x="72" y="88">Avro codec selection guide</text>
  <text class="subtitle" x="76" y="121">Pick the compression profile from workload intent, then route every branch into the same ByteArray output path.</text>

  <g id="group-decision">
    <rect class="group" x="76" y="154" width="1168" height="600" rx="18"/>
    <text class="group-title" x="106" y="172">Selection flow</text>
  </g>

  <path id="route-start-compression" class="connector" d="M660 261 L660 310" stroke="#4F83BF"/>
  <path id="route-compression-throughput" class="connector" d="M510 375 L290 375 L290 510" stroke="#45A7A1"/>
  <path id="route-compression-deflate" class="connector" d="M660 440 L660 560" stroke="#58A978"/>
  <path id="route-compression-archive" class="connector" d="M810 375 L1010 375 L1010 510" stroke="#D9AA4D"/>
  <path id="route-throughput-snappy" class="connector" d="M290 636 L290 660" stroke="#45A7A1"/>
  <path id="route-archive-zstd" class="connector" d="M1010 636 L1010 660" stroke="#D9AA4D"/>
  <path id="route-deflate-output" class="connector" d="M660 632 L660 860" stroke="#58A978"/>
  <path id="route-snappy-output" class="connector" d="M290 732 L290 775 L560 775 L560 860" stroke="#45A7A1"/>
  <path id="route-zstd-output" class="connector" d="M1010 732 L1010 775 L760 775 L760 860" stroke="#D9AA4D"/>
  <path id="route-null-output" class="connector" d="M430 836 L452 836 L452 896 L465 896" stroke="#6B7D90"/>

  <g id="node-start" transform="translate(465,185)">
    <rect class="card-shape" x="0" y="0" width="390" height="76" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="195" y="33" text-anchor="middle">Start with payload workload</text>
    <text class="detail" x="195" y="56" text-anchor="middle">schema + record stream</text>
  </g>
  <g id="node-compression" transform="translate(510,310)">
    <polygon class="card-shape" points="150,0 300,65 150,130 0,65" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="150" y="53" text-anchor="middle">Need compression?</text>
    <text class="detail" x="150" y="78" text-anchor="middle">storage or network pressure</text>
  </g>
  <g id="node-throughput" transform="translate(150,510)">
    <polygon class="card-shape" points="140,0 280,63 140,126 0,63" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="140" y="51" text-anchor="middle">Fast local transfer?</text>
    <text class="detail" x="140" y="76" text-anchor="middle">low CPU overhead</text>
  </g>
  <g id="node-snappy" transform="translate(120,660)">
    <rect class="card-shape" x="0" y="0" width="340" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="170" y="23" text-anchor="middle">SNAPPY_CODEC_FACTORY</text>
    <text class="detail" x="170" y="48" text-anchor="middle">fast transfer</text>
    <text class="detail" x="170" y="66" text-anchor="middle">balanced size</text>
  </g>
  <g id="node-deflate" transform="translate(490,560)">
    <rect class="card-shape" x="0" y="0" width="340" height="72" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="170" y="23" text-anchor="middle">DEFAULT_CODEC_FACTORY</text>
    <text class="detail" x="170" y="48" text-anchor="middle">Deflate default</text>
    <text class="detail" x="170" y="66" text-anchor="middle">general purpose</text>
  </g>
  <g id="node-archive" transform="translate(870,510)">
    <polygon class="card-shape" points="140,0 280,63 140,126 0,63" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="140" y="51" text-anchor="middle">Small archive?</text>
    <text class="detail" x="140" y="76" text-anchor="middle">long-lived files</text>
  </g>
  <g id="node-zstd" transform="translate(840,660)">
    <rect class="card-shape" x="0" y="0" width="340" height="72" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="170" y="23" text-anchor="middle">ARCHIVE_CODEC_FACTORY</text>
    <text class="detail" x="170" y="48" text-anchor="middle">Zstandard level 9</text>
    <text class="detail" x="170" y="66" text-anchor="middle">smallest archive</text>
  </g>
  <g id="node-null" transform="translate(150,800)">
    <rect class="card-shape" x="0" y="0" width="280" height="72" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="card-title" x="140" y="23" text-anchor="middle">NULL_CODEC_FACTORY</text>
    <text class="detail" x="140" y="48" text-anchor="middle">external codec</text>
    <text class="detail" x="140" y="66" text-anchor="middle">raw Avro block</text>
  </g>
  <g id="node-output" transform="translate(465,860)">
    <rect class="card-shape" x="0" y="0" width="390" height="72" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="card-title" x="195" y="23" text-anchor="middle">ByteArray output</text>
    <text class="detail" x="195" y="48" text-anchor="middle">encoder emits bytes</text>
    <text class="detail" x="195" y="66" text-anchor="middle">shared read path</text>
  </g>

  <g transform="translate(76,946)">
    <rect class="pill" x="0" y="0" width="1168" height="44" rx="10"/>
    <text class="small" x="584" y="17" text-anchor="middle">Graphviz evidence: io-avro-diagram-02.dot, .plain, -sketch.svg, and -sketch.png.</text>
    <text class="small" x="584" y="34" text-anchor="middle">Geometry gate: nodes=9, routes=10, segments=18, badEndpointAngle=0, badBends=0, interiorCrossings=0, marginImbalance=0, titleGap=64.</text>
  </g>
</svg>
