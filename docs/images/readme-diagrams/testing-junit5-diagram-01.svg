<svg data-intent="Redesign the Extension Component Overview as a capability map around JUnit lifecycle extension points instead of a fake sequential layered flow." data-evidence="testing/junit5/README.md; testing/junit5/src/main/kotlin/io/bluetape4k/junit5" data-source-read="testing/junit5/README.md; testing/junit5/src/main/kotlin/io/bluetape4k/junit5" xmlns="http://www.w3.org/2000/svg" width="1440" height="925" viewBox="0 0 1440 925" role="img" aria-label="JUnit5 Extension Component Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="925"/>
<rect class="frame" x="34" y="30" width="1372" height="865" rx="32"/>
<text class="title" x="72" y="84">JUnit5 Extension Component Overview</text>
<text class="subtitle" x="76" y="116">This is a capability map around real JUnit extension points, not a sequential call chain.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="145" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">JUnit 5 extension points</text></g>
<g><rect class="panel" x="82" y="375" width="1276" height="250" rx="22"/><text class="panelTitle" x="110" y="411" dominant-baseline="middle">bluetape4k testing capabilities</text></g>
<g><rect class="panel" x="82" y="700" width="1276" height="145" rx="22"/><text class="panelTitle" x="110" y="736" dominant-baseline="middle">Execution and reporting</text></g>
<g id="junit">
  <rect class="card" x="145" y="215" width="300" height="70" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="295" y="243" text-anchor="middle" dominant-baseline="middle">JUnit Jupiter engine</text>
  <text class="detail" x="295" y="273" text-anchor="middle" dominant-baseline="middle">discovers tests and extensions</text>
</g>
<g id="context">
  <rect class="card" x="570" y="215" width="300" height="70" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="720" y="243" text-anchor="middle" dominant-baseline="middle">ExtensionContext</text>
  <text class="detail" x="720" y="273" text-anchor="middle" dominant-baseline="middle">store, parameters, lifecycle</text>
</g>
<g id="annotations">
  <rect class="card" x="975" y="215" width="320" height="70" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1135" y="243" text-anchor="middle" dominant-baseline="middle">Meta-annotations</text>
  <text class="detail" x="1135" y="273" text-anchor="middle" dominant-baseline="middle">@StopwatchTest, @TempFolderTest</text>
</g>
<g id="lifecycle">
  <rect class="card" x="115" y="445" width="280" height="96" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="255" y="468" text-anchor="middle" dominant-baseline="middle">Lifecycle extensions</text>
  <text class="detail" x="255" y="498" text-anchor="middle" dominant-baseline="middle">Stopwatch</text>
  <text class="detail" x="255" y="516" text-anchor="middle" dominant-baseline="middle">SystemProperty restore</text>
  <text class="detail" x="255" y="534" text-anchor="middle" dominant-baseline="middle">TempFolder cleanup</text>
</g>
<g id="injection">
  <rect class="card" x="420" y="445" width="330" height="96" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="585" y="468" text-anchor="middle" dominant-baseline="middle">Parameter / field injection</text>
  <text class="detail" x="585" y="498" text-anchor="middle" dominant-baseline="middle">TempFolder</text>
  <text class="detail" x="585" y="516" text-anchor="middle" dominant-baseline="middle">FakeValue</text>
  <text class="detail" x="585" y="534" text-anchor="middle" dominant-baseline="middle">RandomValue</text>
</g>
<g id="capture">
  <rect class="card" x="775" y="445" width="280" height="96" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="915" y="477" text-anchor="middle" dominant-baseline="middle">Output capture</text>
  <text class="detail" x="915" y="507" text-anchor="middle" dominant-baseline="middle">stdout/stderr</text>
  <text class="detail" x="915" y="525" text-anchor="middle" dominant-baseline="middle">Logback appender</text>
</g>
<g id="stress">
  <rect class="card" x="1035" y="445" width="360" height="96" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1215" y="486" text-anchor="middle" dominant-baseline="middle">Stress testers</text>
  <text class="detail" x="1215" y="516" text-anchor="middle" dominant-baseline="middle">threads, coroutines, virtual threads</text>
</g>
<g id="listener">
  <rect class="card" x="205" y="740" width="370" height="66" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="390" y="766" text-anchor="middle" dominant-baseline="middle">Recording and Mermaid listeners</text>
  <text class="detail" x="390" y="796" text-anchor="middle" dominant-baseline="middle">execution events and Gantt report</text>
</g>
<g id="assertions">
  <rect class="card" x="825" y="740" width="320" height="66" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="985" y="766" text-anchor="middle" dominant-baseline="middle">Test assertions</text>
  <text class="detail" x="985" y="796" text-anchor="middle" dominant-baseline="middle">awaitility, cancellation contracts</text>
</g>
<path class="route" data-from="junit" data-to="context" d="M445 250 L570 250" stroke="#4F83BF"/>
<path class="route" data-from="context" data-to="annotations" d="M870 250 L975 250" stroke="#755BC6"/>
<path class="route" data-from="context" data-to="lifecycle" d="M650 285 L255 445" stroke="#2E8F89"/>
<path class="route" data-from="context" data-to="injection" d="M720 285 L585 445" stroke="#B9851B"/>
<path class="route" data-from="context" data-to="capture" d="M790 285 L915 445" stroke="#C94D68"/>
<path class="route" data-from="annotations" data-to="stress" d="M1135 285 L1135 445" stroke="#718A35"/>
<path class="route" data-from="lifecycle" data-to="listener" d="M255 541 L255 740" stroke="#755BC6"/>
<path class="route" data-from="capture" data-to="listener" d="M915 541 L915 650 L390 650 L390 740" stroke="#C94D68"/>
<path class="route" data-from="stress" data-to="assertions" d="M1215 541 L1215 650 L1035 650 L1035 740" stroke="#718A35"/>
<path class="route" data-from="injection" data-to="assertions" d="M585 541 L585 635 L935 635 L935 740" stroke="#B9851B"/>
</svg>
