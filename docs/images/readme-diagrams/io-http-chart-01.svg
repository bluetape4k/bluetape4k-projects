<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-label="HTTP Cache Benchmark Throughput Chart">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:22px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:20px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:14px;font-weight:400;fill:#102033}
    .axis{stroke:#8a96a8;stroke-width:1.5}.grid{stroke:#d8e0ea;stroke-width:1;stroke-dasharray:5 6}.bar{filter:url(#shadow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="900"/>
<rect class="frame" x="32" y="28" width="1436" height="844" rx="28"/>
<text class="title" x="66" y="82">HTTP Cache Benchmark Throughput</text>
<text class="subtitle" x="70" y="118">JMH throughput for gzip 1 KB responses with 10 ms WireMock delay; log scale keeps cache and no-cache results readable together.</text>
<g transform="translate(70 150)">
  <rect x="0" y="0" width="390" height="104" rx="14" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.8"/>
  <text class="smallLabel" x="22" y="34">Benchmark setup</text>
  <text class="small" x="22" y="61">8 threads, warmup 2 x 3s, measurement 3 x 5s</text>
  <text class="small" x="22" y="82">Cache-Control: public, max-age=3600; gzip 1 KB</text>
</g>
<g transform="translate(500 150)">
  <rect x="0" y="0" width="410" height="104" rx="14" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.8"/>
  <text class="smallLabel" x="22" y="34">Reading rule</text>
  <text class="small" x="22" y="61">Bars use log scale. Distance means multiplicative gain.</text>
  <text class="small" x="22" y="82">Network RTT removal dominates; storage overhead explains spread.</text>
</g>
<g transform="translate(950 150)">
  <rect x="0" y="0" width="420" height="104" rx="14" fill="#EAF7EF" stroke="#58A978" stroke-width="1.8"/>
  <text class="smallLabel" x="22" y="34">Main result</text>
  <text class="small" x="22" y="61">HC5 memory cache is 23x faster than OkHttp disk cache.</text>
  <text class="small" x="22" y="82">No-cache clients stay near the 800 ops/s theoretical ceiling.</text>
</g>
<line class="grid" x1="533.4" y1="285" x2="533.4" y2="675"/>
<text class="small" x="533.4" y="713" text-anchor="middle">1,000</text>
<line class="grid" x1="794.0" y1="285" x2="794.0" y2="675"/>
<text class="small" x="794.0" y="713" text-anchor="middle">10,000</text>
<line class="grid" x1="1054.5" y1="285" x2="1054.5" y2="675"/>
<text class="small" x="1054.5" y="713" text-anchor="middle">100,000</text>
<line class="grid" x1="1315.0" y1="285" x2="1315.0" y2="675"/>
<text class="small" x="1315.0" y="713" text-anchor="middle">1M</text>
<line class="axis" x1="455" y1="675" x2="1315" y2="675"/>
<text class="small" x="885" y="743" text-anchor="middle">Throughput (ops/s, log scale)</text>
<line x1="508.2" y1="278" x2="508.2" y2="675" stroke="#DC6B82" stroke-width="2" stroke-dasharray="8 7"/>
<text class="small" x="520.1783065633083" y="300">800 ops/s theoretical no-cache ceiling</text>
<text class="strong" x="80" y="328">HC5 Classic + InMemoryCache</text>
<text class="small" x="80" y="350">Heap ConcurrentHashMap</text>
<rect class="bar" x="455" y="305" width="836.7" height="48" rx="12" fill="#EAF7EF" stroke="#58A978" stroke-width="2"/>
<text class="strong" x="1309.7" y="326">813,906 ops/s</text>
<text class="small" x="1309.7" y="346">x1,233 vs baseline</text>
<text class="strong" x="80" y="402">OkHttp3 + DiskLruCache</text>
<text class="small" x="80" y="424">DiskLruCache + OS page cache</text>
<rect class="bar" x="455" y="379" width="481.8" height="48" rx="12" fill="#FFF3D9" stroke="#D6A441" stroke-width="2"/>
<text class="strong" x="954.8" y="400">35,359 ops/s</text>
<text class="small" x="954.8" y="420">x53 vs baseline</text>
<text class="strong" x="80" y="476">HC5 Classic</text>
<text class="small" x="80" y="498">No cache</text>
<rect class="bar" x="455" y="453" width="35.1" height="48" rx="12" fill="#FDECEF" stroke="#DC6B82" stroke-width="2"/>
<text class="strong" x="508.1" y="474">682 ops/s</text>
<text class="small" x="508.1" y="494">x1 vs baseline</text>
<text class="strong" x="80" y="550">HC5 Classic VirtualThread</text>
<text class="small" x="80" y="572">No cache</text>
<rect class="bar" x="455" y="527" width="32.8" height="48" rx="12" fill="#F1ECFF" stroke="#8A72D6" stroke-width="2"/>
<text class="strong" x="505.8" y="548">668 ops/s</text>
<text class="small" x="505.8" y="568">x1 vs baseline</text>
<text class="strong" x="80" y="624">OkHttp3</text>
<text class="small" x="80" y="646">No cache</text>
<rect class="bar" x="455" y="601" width="31.6" height="48" rx="12" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="2"/>
<text class="strong" x="504.6" y="622">661 ops/s</text>
<text class="small" x="504.6" y="642">x1 vs baseline</text>
<g transform="translate(80 735)">
  <rect x="0" y="0" width="610" height="78" rx="14" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.8"/>
  <text class="smallLabel" x="22" y="31">Interpretation</text>
  <text class="small" x="22" y="55">Caching removes the 10 ms round trip; memory cache avoids filesystem and gzip reprocessing overhead.</text>
</g>
<g transform="translate(735 735)">
  <rect x="0" y="0" width="610" height="78" rx="14" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.8"/>
  <text class="smallLabel" x="22" y="31">Caution</text>
  <text class="small" x="22" y="55">The benchmark measures cache-hit throughput, not persistence, memory pressure, or cold-cache latency.</text>
</g>
</svg>
