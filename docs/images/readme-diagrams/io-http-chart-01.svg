<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="740" viewBox="0 0 1040 740" role="img" aria-labelledby="title desc">
  <title id="title">HTTP client base throughput</title>
  <desc id="desc">WebFlux fixture (GET /ping), @Threads(8), warmup 1×1s, measurement 1×1s. JDK Sync leads at 7,276.492 ops/s, Ktor CIO Coroutines records 2,052.281 ops/s.</desc>
  <rect width="1040" height="740" fill="#ffffff"/>
  <text x="40" y="42" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">HTTP client base throughput</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#526070">WebFlux fixture (GET /ping), @Threads(8), warmup 1×1s, measurement 1×1s, ops/s higher is better</text>

  <!-- X axis line -->
  <line x1="280" y1="665" x2="990" y2="665" stroke="#d6dbe4" stroke-width="1"/>
  <!-- Left grid line -->
  <line x1="280" y1="105" x2="280" y2="665" stroke="#d6dbe4" stroke-width="1"/>

  <!-- X axis tick labels -->
  <text x="280" y="695" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">0</text>
  <text x="458" y="695" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">2,000</text>
  <text x="635" y="695" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">4,000</text>
  <text x="813" y="695" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">6,000</text>
  <text x="988" y="695" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">8,000</text>

  <!-- Row 1: JDK Sync — 7,276.492 ops/s → 646 px -->
  <text x="40" y="120" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK Sync</text>
  <rect x="280" y="104" width="646" height="20" rx="3" fill="#2563eb"/>
  <text x="934" y="120" font-family="Arial, sans-serif" font-size="12" fill="#172033">7,276.492</text>

  <!-- Row 2: HC5 Classic VirtualThread — 7,246.690 ops/s → 643 px -->
  <text x="40" y="156" font-family="Arial, sans-serif" font-size="13" fill="#172033">HC5 Classic VirtualThread</text>
  <rect x="280" y="140" width="643" height="20" rx="3" fill="#2563eb"/>
  <text x="931" y="156" font-family="Arial, sans-serif" font-size="12" fill="#172033">7,246.690</text>

  <!-- Row 3: OkHttp3 VirtualThread — 6,955.796 ops/s → 617 px -->
  <text x="40" y="192" font-family="Arial, sans-serif" font-size="13" fill="#172033">OkHttp3 VirtualThread</text>
  <rect x="280" y="176" width="617" height="20" rx="3" fill="#2563eb"/>
  <text x="905" y="192" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,955.796</text>

  <!-- Row 4: JDK VirtualThread — 6,562.497 ops/s → 582 px -->
  <text x="40" y="228" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK VirtualThread</text>
  <rect x="280" y="212" width="582" height="20" rx="3" fill="#2563eb"/>
  <text x="870" y="228" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,562.497</text>

  <!-- Row 5: HC5 Classic — 6,490.422 ops/s → 576 px -->
  <text x="40" y="264" font-family="Arial, sans-serif" font-size="13" fill="#172033">HC5 Classic</text>
  <rect x="280" y="248" width="576" height="20" rx="3" fill="#2563eb"/>
  <text x="864" y="264" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,490.422</text>

  <!-- Row 6: JDK H2 VirtualThread — 6,275.262 ops/s → 557 px -->
  <text x="40" y="300" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK H2 VirtualThread</text>
  <rect x="280" y="284" width="557" height="20" rx="3" fill="#2563eb"/>
  <text x="845" y="300" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,275.262</text>

  <!-- Row 7: HC5 Classic Coroutines — 6,230.735 ops/s → 553 px -->
  <text x="40" y="336" font-family="Arial, sans-serif" font-size="13" fill="#172033">HC5 Classic Coroutines</text>
  <rect x="280" y="320" width="553" height="20" rx="3" fill="#059669"/>
  <text x="841" y="336" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,230.735</text>

  <!-- Row 8: Vert.x WebClient Coroutines — 6,043.906 ops/s → 536 px -->
  <text x="40" y="372" font-family="Arial, sans-serif" font-size="13" fill="#172033">Vert.x WebClient Coroutines</text>
  <rect x="280" y="356" width="536" height="20" rx="3" fill="#059669"/>
  <text x="824" y="372" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,043.906</text>

  <!-- Row 9: JDK H2 Sync — 6,027.618 ops/s → 535 px -->
  <text x="40" y="408" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK H2 Sync</text>
  <rect x="280" y="392" width="535" height="20" rx="3" fill="#059669"/>
  <text x="823" y="408" font-family="Arial, sans-serif" font-size="12" fill="#172033">6,027.618</text>

  <!-- Row 10: OkHttp3 Sync — 5,771.310 ops/s → 512 px -->
  <text x="40" y="444" font-family="Arial, sans-serif" font-size="13" fill="#172033">OkHttp3 Sync</text>
  <rect x="280" y="428" width="512" height="20" rx="3" fill="#059669"/>
  <text x="800" y="444" font-family="Arial, sans-serif" font-size="12" fill="#172033">5,771.310</text>

  <!-- Row 11: OkHttp3 Coroutines — 5,752.350 ops/s → 510 px -->
  <text x="40" y="480" font-family="Arial, sans-serif" font-size="13" fill="#172033">OkHttp3 Coroutines</text>
  <rect x="280" y="464" width="510" height="20" rx="3" fill="#059669"/>
  <text x="798" y="480" font-family="Arial, sans-serif" font-size="12" fill="#172033">5,752.350</text>

  <!-- Row 12: HC5 Async Coroutines — 5,520.183 ops/s → 490 px -->
  <text x="40" y="516" font-family="Arial, sans-serif" font-size="13" fill="#172033">HC5 Async Coroutines</text>
  <rect x="280" y="500" width="490" height="20" rx="3" fill="#059669"/>
  <text x="778" y="516" font-family="Arial, sans-serif" font-size="12" fill="#172033">5,520.183</text>

  <!-- Row 13: JDK H2 Coroutines — 5,481.592 ops/s → 486 px -->
  <text x="40" y="552" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK H2 Coroutines</text>
  <rect x="280" y="536" width="486" height="20" rx="3" fill="#059669"/>
  <text x="774" y="552" font-family="Arial, sans-serif" font-size="12" fill="#172033">5,481.592</text>

  <!-- Row 14: JDK Coroutines — 4,739.894 ops/s → 420 px -->
  <text x="40" y="588" font-family="Arial, sans-serif" font-size="13" fill="#172033">JDK Coroutines</text>
  <rect x="280" y="572" width="420" height="20" rx="3" fill="#f59e0b"/>
  <text x="708" y="588" font-family="Arial, sans-serif" font-size="12" fill="#172033">4,739.894</text>

  <!-- Row 15: Ktor CIO Coroutines — 2,052.281 ops/s → 182 px -->
  <text x="40" y="624" font-family="Arial, sans-serif" font-size="13" fill="#172033">Ktor CIO Coroutines</text>
  <rect x="280" y="608" width="182" height="20" rx="3" fill="#dc2626"/>
  <text x="470" y="624" font-family="Arial, sans-serif" font-size="12" fill="#172033">2,052.281</text>
</svg>
