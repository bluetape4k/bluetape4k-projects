<svg xmlns="http://www.w3.org/2000/svg" width="1624" height="1702" viewBox="0 0 1624 1702" role="img" aria-label="getFromCache / putIntoCache Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1624" height="1702"/>
<rect class="frame" x="32" y="28" width="1560" height="1646" rx="28"/>
<text class="title" x="66" y="82">getFromCache / putIntoCache Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Hibernate</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1642" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="438" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588" y="198.5" text-anchor="middle">Lettuce Near Cache</text>
<text class="smallLabel" x="588" y="219.5" text-anchor="middle">Storage Access</text>
<line class="lifeline" x1="588" y1="252" x2="588" y2="1642" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036" y="209" text-anchor="middle">Caffeine (L1)</text>
<line class="lifeline" x1="1036" y1="252" x2="1036" y2="1642" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1334" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1484" y="209" text-anchor="middle">Redis (L2)</text>
<line class="lifeline" x1="1484" y1="252" x2="1484" y2="1642" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="259" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="313" text-anchor="start">1. getFromCache(key)</text>
<path class="line" d="M140 344 L588 344"/>
<rect x="707" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="423" text-anchor="start">2. get(key)</text>
<path class="line" d="M588 454 L1036 454"/>
<rect x="70" y="506" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="533" text-anchor="start">ALT: L1 Hit</text>
<rect x="707" y="574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="601" text-anchor="start">4. value</text>
<path class="dashed" d="M1036 632 L588 632"/>
<rect x="70" y="684" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="711" text-anchor="start">ELSE: L1 Miss</text>
<rect x="707" y="752" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="779" text-anchor="start">6. null</text>
<path class="dashed" d="M1036 810 L588 810"/>
<rect x="929" y="862" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="947" y="889" text-anchor="start">7. GET regionName::key</text>
<path class="line" d="M588 920 L1484 920"/>
<rect x="931" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949" y="999" text-anchor="start">8. value</text>
<path class="dashed" d="M1484 1030 L588 1030"/>
<rect x="707" y="1082" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="1109" text-anchor="start">9. put(key, value)</text>
<path class="line" d="M588 1140 L1036 1140"/>
<rect x="259" y="1192" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="277" y="1219" text-anchor="start">10. value</text>
<path class="dashed" d="M588 1250 L140 1250"/>
<rect x="233" y="1302" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="251" y="1329" text-anchor="start">11. putIntoCache(key, value)</text>
<path class="line" d="M140 1360 L588 1360"/>
<rect x="707" y="1412" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="725" y="1439" text-anchor="start">12. put(key, value)</text>
<path class="line" d="M588 1470 L1036 1470"/>
<rect x="901" y="1522" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="919" y="1549" text-anchor="start">13. SET regionName::key value</text>
<path class="line" d="M588 1580 L1484 1580"/>
</svg>
