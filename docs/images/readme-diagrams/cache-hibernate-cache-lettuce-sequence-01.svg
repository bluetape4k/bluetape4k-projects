<svg xmlns="http://www.w3.org/2000/svg" width="1804" height="1214" viewBox="0 0 1804 1214" role="img" aria-label="getFromCache / putIntoCache Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1804" height="1214"/>
<rect class="frame" x="32" y="28" width="1740" height="1158" rx="28"/>
<text class="title" x="66" y="82">getFromCache / putIntoCache Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Hibernate</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="528" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="678" y="198.5" text-anchor="middle">Lettuce Near Cache</text>
<text class="smallLabel" x="678" y="219.5" text-anchor="middle">Storage Access</text>
<line class="lifeline" x1="678" y1="252" x2="678" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="976" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1126" y="209" text-anchor="middle">Caffeine (L1)</text>
<line class="lifeline" x1="1126" y1="252" x2="1126" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1424" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1574" y="209" text-anchor="middle">Redis (L2)</text>
<line class="lifeline" x1="1574" y1="252" x2="1574" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="349" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="367" y="313" text-anchor="start">1. getFromCache(key)</text>
<path class="line" d="M230 332 L678 332"/>
<rect x="797" y="362" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="389" text-anchor="start">2. get(key)</text>
<path class="line" d="M678 408 L1126 408"/>
<rect x="160" y="506" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="533" text-anchor="start">ALT: L1 Hit</text>
<rect x="797" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="465" text-anchor="start">4. value</text>
<path class="dashed" d="M1126 484 L678 484"/>
<rect x="160" y="684" width="1484" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="711" text-anchor="start">ELSE: L1 Miss</text>
<rect x="797" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="541" text-anchor="start">6. null</text>
<path class="dashed" d="M1126 560 L678 560"/>
<rect x="1019" y="590" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1037" y="617" text-anchor="start">7. GET regionName::key</text>
<path class="line" d="M678 636 L1574 636"/>
<rect x="1021" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1039" y="693" text-anchor="start">8. value</text>
<path class="dashed" d="M1574 712 L678 712"/>
<rect x="797" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="769" text-anchor="start">9. put(key, value)</text>
<path class="line" d="M678 788 L1126 788"/>
<rect x="349" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="367" y="845" text-anchor="start">10. value</text>
<path class="dashed" d="M678 864 L230 864"/>
<rect x="323" y="894" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="341" y="921" text-anchor="start">11. putIntoCache(key, value)</text>
<path class="line" d="M230 940 L678 940"/>
<rect x="797" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="997" text-anchor="start">12. put(key, value)</text>
<path class="line" d="M678 1016 L1126 1016"/>
<rect x="991" y="1046" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1009" y="1073" text-anchor="start">13. SET regionName::key value</text>
<path class="line" d="M678 1092 L1574 1092"/>
</svg>
