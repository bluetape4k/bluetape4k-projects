<svg xmlns="http://www.w3.org/2000/svg" width="1454" height="1138" viewBox="0 0 1454 1138" role="img" aria-label="Avro Serialization/Deserialization Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1454" height="1138"/>
<rect class="frame" x="32" y="28" width="1390" height="1082" rx="28"/>
<text class="title" x="66" y="82">Avro Serialization/Deserialization Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="195" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="195" y1="252" x2="195" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="434.7" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="549.7" y="209" text-anchor="middle">AvroSerializer</text>
<line class="lifeline" x1="549.7" y1="252" x2="549.7" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="789.3" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="904.3" y="209" text-anchor="middle">CodecFactory</text>
<line class="lifeline" x1="904.3" y1="252" x2="904.3" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1144" y="166" width="230" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1259" y="209" text-anchor="middle">Avro Runtime</text>
<line class="lifeline" x1="1259" y1="252" x2="1259" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="267.3" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="285.3" y="313" text-anchor="start">1. serialize(record)</text>
<path class="line" d="M195 332 L549.7 332"/>
<rect x="511.5" y="362" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="529.5" y="389" text-anchor="start">2. Select compression codec (Zstd/Snappy/Deflate)</text>
<path class="line" d="M549.7 408 L904.3 408"/>
<rect x="781.3" y="438" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="799.3" y="465" text-anchor="start">3. Encode with DatumWriter</text>
<path class="line" d="M549.7 484 L1259 484"/>
<rect x="793.3" y="514" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="811.3" y="541" text-anchor="start">4. Compressed ByteArray</text>
<path class="dashed" d="M1259 560 L549.7 560"/>
<rect x="267.3" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="285.3" y="617" text-anchor="start">5. ByteArray</text>
<path class="dashed" d="M549.7 636 L195 636"/>
<rect x="267.3" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="285.3" y="693" text-anchor="start">6. deserialize(bytes)</text>
<path class="line" d="M195 712 L549.7 712"/>
<rect x="724.8" y="742" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="742.8" y="769" text-anchor="start">7. Compare Writer Schema + Reader Schema</text>
<path class="line" d="M549.7 788 L1259 788"/>
<rect x="1053" y="818" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1071" y="845" text-anchor="start">8. Validate field compatibility</text>
<path class="line" d="M1259 864 C1323 864 1323 898 1259 898"/>
<rect x="797.3" y="894" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815.3" y="921" text-anchor="start">9. Deserialized object</text>
<path class="dashed" d="M1259 940 L549.7 940"/>
<rect x="229.3" y="970" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="247.3" y="997" text-anchor="start">10. T (returns null on failure)</text>
<path class="dashed" d="M549.7 1016 L195 1016"/>
</svg>
