<svg data-intent="Show the source-backed Avro serialization/deserialization flow for SpecificRecord and Reflect serializers." data-evidence="io/avro/README.md; DefaultAvroSpecificRecordSerializer.kt; DefaultAvroReflectSerializer.kt; AvroSpecificRecordSerializer.kt; CodecFactorySupport.kt" xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-label="Avro Serialization Deserialization Flow">
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#C94D68"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .actor{stroke-width:2}.actorTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.actorNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .lifeline{stroke:#A7B4C3;stroke-width:1.7;stroke-dasharray:8 8}.activation{stroke-width:1.5}
    .seq{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .alt{fill:#FFFFFF;fill-opacity:.12;stroke-width:2;stroke-dasharray:9 8}.altTitle{font-family:"Architects Daughter";font-size:20px;fill:#22344A}.altNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
  </style>
</defs>
<rect class="canvas" width="1680" height="1180"/>
<rect class="frame" x="30" y="28" width="1620" height="1124" rx="30"/>
<text class="title" x="70" y="86">Avro Serialization/Deserialization Flow</text>
<text class="subtitle" x="74" y="118">Serializers choose schema and codec, write Avro DataFile bytes, then read back first records or lists with safe failure returns.</text>

<g id="caller"><rect class="actor" x="116" y="166" width="214" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="actorTitle" x="223" y="204" text-anchor="middle">Application</text><text class="actorNote" x="223" y="226" text-anchor="middle">record / bytes</text><line class="lifeline" x1="223" y1="242" x2="223" y2="1088"/></g>
<g id="serializer"><rect class="actor" x="456" y="166" width="214" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="563" y="204" text-anchor="middle">Avro serializer</text><text class="actorNote" x="563" y="226" text-anchor="middle">Specific / Reflect</text><line class="lifeline" x1="563" y1="242" x2="563" y2="1088"/></g>
<g id="schema"><rect class="actor" x="796" y="166" width="214" height="76" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="actorTitle" x="903" y="204" text-anchor="middle">Schema source</text><text class="actorNote" x="903" y="226" text-anchor="middle">record schema / cache</text><line class="lifeline" x1="903" y1="242" x2="903" y2="1088"/></g>
<g id="codec"><rect class="actor" x="1136" y="166" width="214" height="76" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="actorTitle" x="1243" y="204" text-anchor="middle">CodecFactory</text><text class="actorNote" x="1243" y="226" text-anchor="middle">deflate / zstd / snappy</text><line class="lifeline" x1="1243" y1="242" x2="1243" y2="1088"/></g>
<g id="runtime"><rect class="actor" x="1476" y="166" width="154" height="76" rx="10" fill="#FFF0F4" stroke="#C94D68"/><text class="actorTitle" x="1553" y="204" text-anchor="middle">Avro runtime</text><text class="actorNote" x="1553" y="226" text-anchor="middle">DataFile</text><line class="lifeline" x1="1553" y1="242" x2="1553" y2="1088"/></g>

<rect class="activation" x="215" y="306" width="16" height="708" rx="5" fill="#E8F3FF" stroke="#4F83BF"/>
<rect class="activation" x="555" y="350" width="16" height="612" rx="5" fill="#EAF7EF" stroke="#3E9868"/>
<rect class="activation" x="895" y="406" width="16" height="80" rx="5" fill="#E9F7F6" stroke="#2E8F89"/>
<rect class="activation" x="1235" y="474" width="16" height="56" rx="5" fill="#FFF5E6" stroke="#B9851B"/>
<rect class="activation" x="1545" y="558" width="16" height="270" rx="5" fill="#FFF0F4" stroke="#C94D68"/>

<g id="serialize-box">
  <rect class="alt" x="84" y="290" width="1512" height="374" rx="16" stroke="#3E9868"/>
  <rect class="pill" x="318" y="276" width="172" height="28" rx="7"/><text class="altTitle" x="404" y="296" text-anchor="middle">serialize path</text>
  <text class="altNote" x="522" y="318">Null graph returns null before writer allocation; lists use the first element schema.</text>
</g>
<g id="m1"><rect class="pill" x="292" y="326" width="202" height="28" rx="7"/><text class="label" x="393" y="344" text-anchor="middle">serialize(record/list)</text><path class="seq" d="M231 366 H563" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="pill" x="628" y="386" width="222" height="28" rx="7"/><text class="label" x="739" y="404" text-anchor="middle">resolve writer schema</text><path class="seq" d="M571 426 H903" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m3"><rect class="pill" x="982" y="454" width="182" height="28" rx="7"/><text class="label" x="1073" y="472" text-anchor="middle">set codec</text><path class="seq" d="M571 514 H1243" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m4"><rect class="pill" x="1314" y="538" width="196" height="28" rx="7"/><text class="label" x="1412" y="556" text-anchor="middle">create + append + flush</text><path class="seq" d="M571 586 H1553" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m5"><rect class="pill" x="694" y="610" width="232" height="28" rx="7"/><text class="label" x="810" y="628" text-anchor="middle">ByteArray / Base64 string</text><path class="ret" d="M1553 642 H223" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>

<g id="deserialize-box">
  <rect class="alt" x="84" y="704" width="1512" height="270" rx="16" stroke="#2E8F89"/>
  <rect class="pill" x="318" y="690" width="196" height="28" rx="7"/><text class="altTitle" x="416" y="710" text-anchor="middle">deserialize path</text>
  <text class="altNote" x="546" y="732">SpecificDatumReader or ReflectDatumReader reads the Avro DataFile with the requested target type.</text>
</g>
<g id="m6"><rect class="pill" x="278" y="746" width="232" height="28" rx="7"/><text class="label" x="394" y="764" text-anchor="middle">deserialize(bytes/text)</text><path class="seq" d="M231 786 H563" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m7"><rect class="pill" x="640" y="806" width="198" height="28" rx="7"/><text class="label" x="739" y="824" text-anchor="middle">target schema / class</text><path class="seq" d="M571 846 H903" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m8"><rect class="pill" x="1280" y="858" width="264" height="28" rx="7"/><text class="label" x="1412" y="876" text-anchor="middle">DataFileReader.hasNext()/next()</text><path class="seq" d="M571 906 H1553" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m9"><rect class="pill" x="676" y="926" width="268" height="28" rx="7"/><text class="label" x="810" y="944" text-anchor="middle">T? or List&lt;T&gt;</text><path class="ret" d="M1553 958 H223" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>

<g id="failure-box">
  <rect class="alt" x="84" y="1004" width="1512" height="72" rx="16" stroke="#C94D68"/>
  <rect class="pill" x="318" y="990" width="180" height="28" rx="7"/><text class="altTitle" x="408" y="1010" text-anchor="middle">failure policy</text>
  <text class="altNote" x="536" y="1032">Serializer failures log and return null; list deserialization returns emptyList; invalid Base64 returns null.</text>
  <path class="ret" d="M563 1058 H223" stroke="#C94D68" marker-end="url(#arrow-pink)"/>
</g>
</svg>
