<svg xmlns="http://www.w3.org/2000/svg" width="1344" height="1476" viewBox="0 0 1344 1476" role="img" aria-label="Avro Serialization/Deserialization Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1344" height="1476"/>
<rect class="frame" x="32" y="28" width="1280" height="1420" rx="28"/>
<text class="title" x="66" y="82">Avro Serialization/Deserialization Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="25" y="166" width="230" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="379.6666666666667" y="166" width="230" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="494.6666666666667" y="209" text-anchor="middle">AvroSerializer</text>
<line class="lifeline" x1="494.6666666666667" y1="252" x2="494.6666666666667" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="734.3333333333334" y="166" width="230" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="849.3333333333334" y="209" text-anchor="middle">CodecFactory</text>
<line class="lifeline" x1="849.3333333333334" y1="252" x2="849.3333333333334" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1089" y="166" width="230" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1204" y="209" text-anchor="middle">Avro Runtime</text>
<line class="lifeline" x1="1204" y1="252" x2="1204" y2="1416" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="212.33333333333337" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="313" text-anchor="start">1. serialize(record)</text>
<path class="line" d="M140 344 L494.6666666666667 344"/>
<rect x="456.5" y="396" width="431" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="474.5" y="423" text-anchor="start">2. Select compression codec (Zstd/Snappy/Deflate)</text>
<path class="line" d="M494.6666666666667 454 L849.3333333333334 454"/>
<rect x="726.3333333333334" y="506" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="744.3333333333334" y="533" text-anchor="start">3. Encode with DatumWriter</text>
<path class="line" d="M494.6666666666667 564 L1204 564"/>
<rect x="738.3333333333334" y="616" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="756.3333333333334" y="643" text-anchor="start">4. Compressed ByteArray</text>
<path class="dashed" d="M1204 674 L494.6666666666667 674"/>
<rect x="212.33333333333337" y="726" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="753" text-anchor="start">5. ByteArray</text>
<path class="dashed" d="M494.6666666666667 784 L140 784"/>
<rect x="212.33333333333337" y="836" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="230.33333333333337" y="863" text-anchor="start">6. deserialize(bytes)</text>
<path class="line" d="M140 894 L494.6666666666667 894"/>
<rect x="669.8333333333334" y="946" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="687.8333333333334" y="973" text-anchor="start">7. Compare Writer Schema + Reader Schema</text>
<path class="line" d="M494.6666666666667 1004 L1204 1004"/>
<rect x="998" y="1056" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1016" y="1083" text-anchor="start">8. Validate field compatibility</text>
<path class="line" d="M1204 1114 C1268 1114 1268 1148 1204 1148"/>
<rect x="742.3333333333334" y="1186" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="760.3333333333334" y="1213" text-anchor="start">9. Deserialized object</text>
<path class="dashed" d="M1204 1244 L494.6666666666667 1244"/>
<rect x="174.33333333333337" y="1296" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="192.33333333333337" y="1323" text-anchor="start">10. T (returns null on failure)</text>
<path class="dashed" d="M494.6666666666667 1354 L140 1354"/>
</svg>
