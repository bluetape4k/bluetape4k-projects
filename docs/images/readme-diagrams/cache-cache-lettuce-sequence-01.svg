<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="2058" viewBox="0 0 1960 2058" role="img" aria-label="RESP3 CLIENT TRACKING Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="2058"/>
<rect class="frame" x="32" y="28" width="1896" height="2002" rx="28"/>
<text class="title" x="66" y="82">RESP3 CLIENT TRACKING Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1998" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="209" text-anchor="middle">LettuceNearCache</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1998" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="209" text-anchor="middle">Caffeine (L1)</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1998" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="198.5" text-anchor="middle">Tracking</text>
<text class="smallLabel" x="1400" y="219.5" text-anchor="middle">Invalidation</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1998" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="209" text-anchor="middle">Redis Server</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1998" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="245" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="313" text-anchor="start">1. get(key)</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="665" y="396" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="423" text-anchor="start">2. get(key)</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="70" y="506" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="533" text-anchor="start">ALT: L1 hit</text>
<rect x="665" y="574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="601" text-anchor="start">4. value</text>
<path class="dashed" d="M980 632 L560 632"/>
<rect x="245" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="711" text-anchor="start">5. value</text>
<path class="dashed" d="M560 742 L140 742"/>
<rect x="70" y="794" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="821" text-anchor="start">ELSE: L1 miss</text>
<rect x="665" y="862" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="889" text-anchor="start">7. null</text>
<path class="dashed" d="M980 920 L560 920"/>
<rect x="1085" y="972" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="999" text-anchor="start">8. GET key</text>
<path class="line" d="M560 1030 L1820 1030"/>
<rect x="70" y="1082" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1109" text-anchor="start">ALT: hit</text>
<rect x="1085" y="1150" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1177" text-anchor="start">10. value</text>
<path class="dashed" d="M1820 1208 L560 1208"/>
<rect x="665" y="1260" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="1287" text-anchor="start">11. put(key, value)</text>
<path class="line" d="M560 1318 L980 1318"/>
<rect x="245" y="1370" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="1397" text-anchor="start">12. value</text>
<path class="dashed" d="M560 1428 L140 1428"/>
<rect x="70" y="1480" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1507" text-anchor="start">ELSE: miss</text>
<rect x="1085" y="1548" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1575" text-anchor="start">14. null</text>
<path class="dashed" d="M1820 1606 L560 1606"/>
<rect x="245" y="1658" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="1685" text-anchor="start">15. null</text>
<path class="dashed" d="M560 1716 L140 1716"/>
<rect x="1505" y="1768" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="1795" text-anchor="start">16. INVALIDATE [key]</text>
<path class="line" d="M1820 1826 L1400 1826"/>
<rect x="1085" y="1878" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1905" text-anchor="start">17. invalidate(key)</text>
<path class="line" d="M1400 1936 L980 1936"/>
</svg>
