<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1366" viewBox="0 0 2140 1366" role="img" aria-label="RESP3 CLIENT TRACKING Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2140" height="1366"/>
<rect class="frame" x="32" y="28" width="2076" height="1310" rx="28"/>
<text class="title" x="66" y="82">RESP3 CLIENT TRACKING Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="500" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="650" y="209" text-anchor="middle">LettuceNearCache</text>
<line class="lifeline" x1="650" y1="252" x2="650" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="920" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1070" y="209" text-anchor="middle">Caffeine (L1)</text>
<line class="lifeline" x1="1070" y1="252" x2="1070" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1340" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1490" y="198.5" text-anchor="middle">Tracking</text>
<text class="smallLabel" x="1490" y="219.5" text-anchor="middle">Invalidation</text>
<line class="lifeline" x1="1490" y1="252" x2="1490" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1760" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1910" y="209" text-anchor="middle">Redis Server</text>
<line class="lifeline" x1="1910" y1="252" x2="1910" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="335" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="313" text-anchor="start">1. get(key)</text>
<path class="line" d="M230 332 L650 332"/>
<rect x="755" y="362" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="389" text-anchor="start">2. get(key)</text>
<path class="line" d="M650 408 L1070 408"/>
<rect x="160" y="506" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="533" text-anchor="start">ALT: L1 hit</text>
<rect x="755" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="465" text-anchor="start">4. value</text>
<path class="dashed" d="M1070 484 L650 484"/>
<rect x="335" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="541" text-anchor="start">5. value</text>
<path class="dashed" d="M650 560 L230 560"/>
<rect x="160" y="794" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="821" text-anchor="start">ELSE: L1 miss</text>
<rect x="755" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="617" text-anchor="start">7. null</text>
<path class="dashed" d="M1070 636 L650 636"/>
<rect x="1175" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1193" y="693" text-anchor="start">8. GET key</text>
<path class="line" d="M650 712 L1910 712"/>
<rect x="160" y="1082" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1109" text-anchor="start">ALT: hit</text>
<rect x="1175" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1193" y="769" text-anchor="start">10. value</text>
<path class="dashed" d="M1910 788 L650 788"/>
<rect x="755" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="845" text-anchor="start">11. put(key, value)</text>
<path class="line" d="M650 864 L1070 864"/>
<rect x="335" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="921" text-anchor="start">12. value</text>
<path class="dashed" d="M650 940 L230 940"/>
<rect x="160" y="1480" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1507" text-anchor="start">ELSE: miss</text>
<rect x="1175" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1193" y="997" text-anchor="start">14. null</text>
<path class="dashed" d="M1910 1016 L650 1016"/>
<rect x="335" y="1046" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="1073" text-anchor="start">15. null</text>
<path class="dashed" d="M650 1092 L230 1092"/>
<rect x="1595" y="1122" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1613" y="1149" text-anchor="start">16. INVALIDATE [key]</text>
<path class="line" d="M1910 1168 L1490 1168"/>
<rect x="1175" y="1198" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1193" y="1225" text-anchor="start">17. invalidate(key)</text>
<path class="line" d="M1490 1244 L1070 1244"/>
</svg>
