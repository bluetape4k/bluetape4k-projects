  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">HazelcastNearCacheConfig</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="132">+maxLocalSize: Int</text>
<text class="mono" x="18" y="156">+frontExpireAfterWrite: Duration</text>
<text class="mono" x="18" y="180">+frontExpireAfterAccess: Duration?</text>
<text class="mono" x="18" y="204">+recordStats: Boolean</text>
</g>
