  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">HazelcastEntryEventListener</text>
  <text class="mono" x="18" y="108">-frontCache: HazelcastLocalCache</text>
<text class="mono" x="18" y="132">+entryAdded(event)</text>
<text class="mono" x="18" y="156">+entryUpdated(event)</text>
<text class="mono" x="18" y="180">+entryRemoved(event)</text>
<text class="mono" x="18" y="204">+entryExpired(event)</text>
<text class="mono" x="18" y="228">+entryEvicted(event)</text>
</g>
