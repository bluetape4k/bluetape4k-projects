  <text class="label" x="170" y="57" text-anchor="middle">NearCacheOperations</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="132">+isClosed: Boolean</text>
<text class="mono" x="18" y="156">+get(key: String) V?</text>
<text class="mono" x="18" y="180">+getAll(keys: Set~String~) Map</text>
<text class="mono" x="18" y="204">+put(key: String, value: V)</text>
<text class="mono" x="18" y="228">+putIfAbsent(key: String, value: V) V?</text>
</g>
