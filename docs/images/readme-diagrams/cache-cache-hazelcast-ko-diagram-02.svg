  <text class="label" x="170" y="57" text-anchor="middle">CaffeineHazelcastLocalCache</text>
  <text class="mono" x="18" y="108">-cache: Cache</text>
<text class="mono" x="18" y="132">+invalidate(key: String)</text>
</g>
