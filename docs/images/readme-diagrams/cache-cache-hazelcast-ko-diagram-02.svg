  <text class="label" x="170" y="57" text-anchor="middle">SuspendNearCacheOperations</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="132">+isClosed: Boolean</text>
<text class="mono" x="18" y="156">+get(key: String) V?</text>
<text class="mono" x="18" y="180">+put(key: String, value: V)</text>
<text class="mono" x="18" y="204">+remove(key: String)</text>
<text class="mono" x="18" y="228">+clearLocal()</text>
</g>
<g transform="translate(297,820)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
