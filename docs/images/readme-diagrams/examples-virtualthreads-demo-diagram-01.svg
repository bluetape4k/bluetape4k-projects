<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="890" viewBox="0 0 1520 890" role="img" aria-labelledby="title desc">
<title id="title">Virtual Threads Demo Decision Map</title>
<desc id="desc">Java 21 virtual thread examples organized by workload, throttling, pinning, and coroutine bridge</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="blueArrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563EB" stroke="#2563EB" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="greenArrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16A34A" stroke="#16A34A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="orangeArrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#EA580C" stroke="#EA580C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="purpleArrow" viewBox="0 0 10 10" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7C3AED" stroke="#7C3AED" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    .canvas{fill:#F7F9FC} .frame{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
    .panel{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:1.8;filter:url(#shadow)}
    .group{fill:#F8FBFF;stroke:#C9D8E8;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:40px;fill:#21334A;font-weight:700}
    .subtitle{font-family:"Comic Mono";font-size:15px;fill:#536476}
    .heading{font-family:"Architects Daughter";font-size:24px;fill:#21334A;font-weight:700}
    .cardTitle{font-family:"Architects Daughter";font-size:21px;fill:#21334A;font-weight:700}
    .text{font-family:"Comic Mono";font-size:13px;fill:#34465B}
    .small{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .edgeBlue{fill:none;stroke:#2563EB;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#blueArrow)}
    .edgeGreen{fill:none;stroke:#16A34A;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#greenArrow)}
    .edgeOrange{fill:none;stroke:#EA580C;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#orangeArrow)}
    .edgePurple{fill:none;stroke:#7C3AED;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#purpleArrow)}
    .dash{stroke-dasharray:8 7}
  </style>
</defs>
<rect class="canvas" width="1520" height="890"/>
<rect class="frame" x="34" y="34" width="1452" height="822" rx="24"/>
<text class="title" x="70" y="84">Virtual Threads Demo Decision Map</text>
<text class="subtitle" x="72" y="116">Java 21 virtual thread examples organized by workload, throttling, pinning, and coroutine bridge</text>
<rect class="group" x="74" y="150" width="1372" height="700" rx="16"/>
<text class="heading" x="104" y="192">Choosing the right concurrency primitive</text>
<g><rect class="panel" x="104" y="260" width="260" height="132" rx="14" fill="#EFF6FF" stroke="#2563EB"/>
<text class="cardTitle" x="126" y="296">Workload question</text>
<text class="text" x="126" y="326">Is the work blocking IO?</text>
<text class="text" x="126" y="348">Is it CPU-bound?</text>
<text class="text" x="126" y="370">Does it need throttling?</text>
</g>
<g><rect class="panel" x="430" y="204" width="290" height="132" rx="14" fill="#F0FDF4" stroke="#16A34A"/>
<text class="cardTitle" x="452" y="240">IO-bound blocking</text>
<text class="text" x="452" y="270">newVirtualThreadPerTaskExecutor</text>
<text class="text" x="452" y="292">one task per virtual thread</text>
<text class="text" x="452" y="314">avoid pooling virtual threads</text>
</g>
<g><rect class="panel" x="430" y="392" width="290" height="132" rx="14" fill="#FFF7ED" stroke="#EA580C"/>
<text class="cardTitle" x="452" y="428">CPU-bound work</text>
<text class="text" x="452" y="458">use platform executor</text>
<text class="text" x="452" y="480">CompletableFuture.supplyAsync</text>
<text class="text" x="452" y="502">do not expect VT speedup</text>
</g>
<g><rect class="panel" x="800" y="204" width="290" height="132" rx="14" fill="#FAF5FF" stroke="#7C3AED"/>
<text class="cardTitle" x="822" y="240">Concurrency limit</text>
<text class="text" x="822" y="270">Semaphore guards capacity</text>
<text class="text" x="822" y="292">keeps virtual threads cheap</text>
<text class="text" x="822" y="314">models downstream pressure</text>
</g>
<g><rect class="panel" x="800" y="392" width="290" height="132" rx="14" fill="#F8FBFF" stroke="#64748B"/>
<text class="cardTitle" x="822" y="428">ThreadLocal and sync</text>
<text class="text" x="822" y="458">ThreadLocal multiplies memory</text>
<text class="text" x="822" y="480">synchronized may pin carriers</text>
<text class="text" x="822" y="502">prefer explicit primitives</text>
</g>
<g><rect class="panel" x="1160" y="300" width="240" height="132" rx="14" fill="#E6F7F5" stroke="#38A69E"/>
<text class="cardTitle" x="1182" y="336">Coroutine bridge</text>
<text class="text" x="1182" y="366">Dispatchers.VT</text>
<text class="text" x="1182" y="388">async over blocking IO</text>
<text class="text" x="1182" y="410">structured test examples</text>
</g>
<path class="edgeGreen" d="M364 304 H398 Q414 304 414 270 H430"/>
<path class="edgeOrange" d="M364 326 H398 Q414 326 414 458 H430"/>
<path class="edgePurple" d="M720 270 H800"/>
<path class="edgePurple dash" d="M720 458 H762 Q778 458 778 270 H800" style="marker-end:none"/>
<polygon points="788,276 800,270 788,264" fill="#7C3AED" stroke="#7C3AED" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="edgeBlue" d="M1090 270 H1124 Q1140 270 1140 344 H1160"/>
<path class="edgeBlue dash" d="M1090 458 H1124 Q1140 458 1140 388 H1160" style="marker-end:none"/>
<polygon points="1148,394 1160,388 1148,382" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<rect class="group" x="114" y="700" width="1296" height="88" rx="14" fill="#F8FBFF"/>
<text class="text" x="150" y="735">Reader contract: virtual threads simplify blocking IO fan-out, but they do not remove CPU, pinning, or downstream capacity limits.</text>
<text class="small" x="150" y="762">Part 1 creates virtual threads, Part 2 sets the rules, and Part 3 bridges them into coroutines and structured concurrency.</text>
</svg>