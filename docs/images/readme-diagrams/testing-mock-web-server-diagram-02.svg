<polyline points="264,708 270,720 276,708" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="use" d="M1040 588 L1040 660 Q1040 680 1020 680 L840 680 Q820 680 820 720" style="marker-end:none" />
<polyline points="814,708 820,720 826,708" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="has" d="M1120 588 L1120 720" />
<path class="has" d="M1220 838 L1220 930" />
<path class="use" d="M840 838 L840 910" style="marker-end:none" />
<polyline points="834,898 840,910 846,898" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="use" d="M1630 572 L1630 720" style="marker-end:none" />
<polyline points="1624,708 1630,720 1636,708" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

<g id="legend">
  <path class="use" d="M90 1050 L150 1050" style="marker-end:none" />
<polyline points="138,1056 150,1050 138,1044" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <text class="legend" x="164" y="1055">uses / calls: dashed open arrow</text>
  <path class="has" d="M390 1050 L450 1050" />
  <text class="legend" x="464" y="1055">owns / holds: solid open arrow</text>
</g>
</svg>
