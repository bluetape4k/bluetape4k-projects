<polyline points="394,418 400,430 406,418" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="use" d="M930 312 L930 354 Q930 368 944 368 L991 368 Q1005 368 1005 382 L1005 410" style="marker-end:none" />
<polyline points="999,398 1005,410 1011,398" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
