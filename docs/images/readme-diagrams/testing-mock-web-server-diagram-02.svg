<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1120" viewBox="0 0 1900 1120" role="img" aria-label="Mock web server source-backed class structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10" /></filter>
  <marker id="useArrow" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto" markerUnits="userSpaceOnUse" overflow="visible" viewBox="0 0 18 18"><path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
  <marker id="hasArrow" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 12 6 L 2 10" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:42px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .classBox{filter:url(#shadow);stroke-width:1.9;rx:6}.controller{fill:#EFF6FF;stroke:#2563EB}.service{fill:#F0FDF4;stroke:#16A34A}.helper{fill:#FFF7ED;stroke:#D97706}.model{fill:#F8FAFC;stroke:#64748B}.web{fill:#FDF2F8;stroke:#DB2777}
    .stereo{font-family:"Comic Mono";font-size:12px;fill:#64748B}.name{font-family:"Architects Daughter";font-size:20px;fill:#0F172A}.smallName{font-family:"Architects Daughter";font-size:18px;fill:#0F172A}.member{font-family:"Comic Mono";font-size:12px;fill:#475569}.divider{stroke:#CBD5E1;stroke-width:1.2}
    .use{fill:none;stroke:#2563EB;stroke-width:2.2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#useArrow)}
    .has{fill:none;stroke:#16A34A;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#hasArrow)}
    .legend{font-family:"Comic Mono";font-size:12px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="1900" height="1120" />
<rect class="frame" x="34" y="30" width="1832" height="1052" rx="6" />
<text class="title" x="74" y="84">Mock Web Server Class Structure</text>
<text class="subtitle" x="78" y="118">Controllers stay thin; request helpers, loaders, repositories, and caches own the fixture behavior used by integration tests.</text>

<g id="httpbinController">
  <rect class="classBox controller" x="90" y="170" width="300" height="142" />
  <text class="stereo" x="240" y="198" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="smallName" x="240" y="224" text-anchor="middle">HttpbinController</text>
  <line class="divider" x1="90" y1="242" x2="390" y2="242" />
  <text class="member" x="110" y="268">+ get(), post(), status()</text>
  <text class="member" x="110" y="288">+ headers(), ip(), bytes()</text>
</g>
<g id="streamController">
  <rect class="classBox controller" x="430" y="170" width="300" height="158" />
  <text class="stereo" x="580" y="198" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="smallName" x="580" y="224" text-anchor="middle">HttpbinStreamController</text>
  <line class="divider" x1="430" y1="242" x2="730" y2="242" />
  <text class="member" x="450" y="268">+ gzip(), deflate()</text>
  <text class="member" x="450" y="288">+ stream(), image()</text>
  <text class="member" x="450" y="308">+ JsonMapper support</text>
</g>
<g id="jsonControllers">
  <rect class="classBox controller" x="770" y="170" width="320" height="142" />
  <text class="stereo" x="930" y="198" text-anchor="middle">&lt;&lt;RestControllers&gt;&gt;</text>
  <text class="smallName" x="930" y="224" text-anchor="middle">Jsonplaceholder controllers</text>
  <line class="divider" x1="770" y1="242" x2="1090" y2="242" />
  <text class="member" x="790" y="268">Posts, comments, albums</text>
  <text class="member" x="790" y="288">photos, todos, users CRUD</text>
</g>
<g id="adminController">
  <rect class="classBox controller" x="1130" y="170" width="300" height="142" />
  <text class="stereo" x="1280" y="198" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="smallName" x="1280" y="224" text-anchor="middle">AdminController</text>
  <line class="divider" x1="1130" y1="242" x2="1430" y2="242" />
  <text class="member" x="1150" y="268">+ reset(X-Admin-Token)</text>
  <text class="member" x="1150" y="288">@CacheEvict fixture-data</text>
</g>
<g id="webController">
  <rect class="classBox controller" x="1470" y="170" width="300" height="142" />
  <text class="stereo" x="1620" y="198" text-anchor="middle">&lt;&lt;RestController&gt;&gt;</text>
  <text class="smallName" x="1620" y="224" text-anchor="middle">WebContentController</text>
  <line class="divider" x1="1470" y1="242" x2="1770" y2="242" />
  <text class="member" x="1490" y="268">+ random()</text>
  <text class="member" x="1490" y="288">+ byName(name)</text>
</g>

<g id="support">
  <rect class="classBox helper" x="120" y="430" width="300" height="142" />
  <text class="stereo" x="270" y="458" text-anchor="middle">&lt;&lt;extension helpers&gt;&gt;</text>
  <text class="smallName" x="270" y="484" text-anchor="middle">HttpbinSupport</text>
  <line class="divider" x1="120" y1="502" x2="420" y2="502" />
  <text class="member" x="140" y="528">+ toHeaderMap()</text>
  <text class="member" x="140" y="548">+ toHttpbinResponse()</text>
</g>
<g id="imageLoader">
  <rect class="classBox helper" x="470" y="430" width="280" height="142" />
  <text class="stereo" x="610" y="458" text-anchor="middle">&lt;&lt;Service&gt;&gt;</text>
  <text class="smallName" x="610" y="484" text-anchor="middle">ImageLoaderService</text>
  <line class="divider" x1="470" y1="502" x2="750" y2="502" />
  <text class="member" x="490" y="528">+ loadImage(fmt)</text>
  <text class="member" x="490" y="548">cache: httpbin-image</text>
</g>
<g id="jsonService">
  <rect class="classBox service" x="860" y="410" width="360" height="178" />
  <text class="stereo" x="1040" y="438" text-anchor="middle">&lt;&lt;Service&gt;&gt;</text>
  <text class="name" x="1040" y="466" text-anchor="middle">JsonplaceholderService</text>
  <line class="divider" x1="860" y1="486" x2="1220" y2="486" />
  <text class="member" x="880" y="512">- reloadLock: ReentrantLock</text>
  <text class="member" x="880" y="532">- six typed repositories</text>
  <line class="divider" x1="860" y1="548" x2="1220" y2="548" />
  <text class="member" x="880" y="574">+ reloadFromFixtures()</text>
</g>
<g id="webLoader">
  <rect class="classBox web" x="1480" y="430" width="300" height="142" />
  <text class="stereo" x="1630" y="458" text-anchor="middle">&lt;&lt;Service&gt;&gt;</text>
  <text class="smallName" x="1630" y="484" text-anchor="middle">WebContentLoader</text>
  <line class="divider" x1="1480" y1="502" x2="1780" y2="502" />
  <text class="member" x="1500" y="528">@Cacheable html-content</text>
  <text class="member" x="1500" y="548">allowlisted HTML names</text>
</g>

<g id="response">
  <rect class="classBox model" x="120" y="720" width="300" height="118" />
  <text class="stereo" x="270" y="748" text-anchor="middle">&lt;&lt;data class&gt;&gt;</text>
  <text class="smallName" x="270" y="774" text-anchor="middle">HttpbinResponse</text>
  <line class="divider" x1="120" y1="792" x2="420" y2="792" />
  <text class="member" x="140" y="818">args, headers, data, form, json</text>
</g>
<g id="fixtureLoader">
  <rect class="classBox helper" x="690" y="720" width="300" height="118" />
  <text class="stereo" x="840" y="748" text-anchor="middle">&lt;&lt;Component&gt;&gt;</text>
  <text class="smallName" x="840" y="774" text-anchor="middle">FixtureLoader</text>
  <line class="divider" x1="690" y1="792" x2="990" y2="792" />
  <text class="member" x="710" y="818">+ load(path, elementType)</text>
</g>
<g id="repository">
  <rect class="classBox service" x="1050" y="720" width="340" height="118" />
  <text class="stereo" x="1220" y="748" text-anchor="middle">&lt;&lt;generic class&gt;&gt;</text>
  <text class="smallName" x="1220" y="774" text-anchor="middle">InMemoryRepository&lt;T&gt;</text>
  <line class="divider" x1="1050" y1="792" x2="1390" y2="792" />
  <text class="member" x="1070" y="818">ConcurrentHashMap + AtomicLong</text>
</g>
<g id="resources">
  <rect class="classBox model" x="690" y="910" width="300" height="94" />
  <text class="stereo" x="840" y="938" text-anchor="middle">&lt;&lt;classpath JSON&gt;&gt;</text>
  <text class="smallName" x="840" y="964" text-anchor="middle">jsonplaceholder/*.json</text>
</g>
<g id="htmlResources">
  <rect class="classBox model" x="1480" y="720" width="300" height="118" />
  <text class="stereo" x="1630" y="748" text-anchor="middle">&lt;&lt;classpath HTML&gt;&gt;</text>
  <text class="smallName" x="1630" y="774" text-anchor="middle">web/html/*.html</text>
  <line class="divider" x1="1480" y1="792" x2="1780" y2="792" />
  <text class="member" x="1500" y="806">home, naver, google</text>
  <text class="member" x="1500" y="824">login, article</text>
</g>
<g id="records">
  <rect class="classBox model" x="1050" y="930" width="340" height="94" />
  <text class="stereo" x="1220" y="958" text-anchor="middle">&lt;&lt;records&gt;&gt;</text>
  <text class="smallName" x="1220" y="984" text-anchor="middle">Post / Comment / User...</text>
</g>

