<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="659" viewBox="0 0 1754 659" role="img" aria-label="Session Type Comparison">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1754" height="659"/>
<rect class="frame" x="32" y="28" width="1690" height="603" rx="28"/>
<text class="title" x="66" y="82">Session Type Comparison</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="146" width="410" height="327" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="174">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="146" width="820" height="327" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="174">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="146" width="1230" height="327" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="174">Integration layer</text>
    </g>
    <g id="readme-layer-4">
      <rect class="readmeLayerBand" x="54" y="146" width="1640" height="327" rx="18" fill="#FFF3D9"/>
      <text class="readmeLayerLabel" x="72" y="174">Runtime layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M1492 180 L1492 132 L262 132 L262 355"/>
<path class="line" d="M1082 180 L1082 477 L672 477 L672 355"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">StageSession</text>
  <text class="mono" x="18" y="108">+find(cls, id): CompletionStage~T~</text>
<text class="mono" x="18" y="129">+findAs(id): CompletionStage~T~ ← reified</text>
<text class="mono" x="18" y="150">extension</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
    <text class="label" x="170" y="49" text-anchor="middle">MutinySession</text>
  <text class="mono" x="18" y="108">+find(cls, id): Uni~T~</text>
<text class="mono" x="18" y="129">+findAs(id): Uni~T~ ← reified extension</text>
<text class="mono" x="18" y="150">+persist(entity): Uni~Void~</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="259" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
    <text class="label" x="170" y="49" text-anchor="middle">MutinySessionFactory</text>
  <text class="mono" x="18" y="108">+withSession(block): Uni~T~</text>
<text class="mono" x="18" y="129">+withTransaction(block): Uni~T~</text>
<text class="mono" x="18" y="150">+withStatelessSession(block): Uni~T~</text>
<text class="mono" x="18" y="171">+withSessionSuspending(block): T ←</text>
<text class="mono" x="18" y="192">extension</text>
<text class="mono" x="18" y="213">+withTransactionSuspending(block): T ←</text>
<text class="mono" x="18" y="234">extension</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
    <text class="label" x="170" y="49" text-anchor="middle">StageSessionFactory</text>
  <text class="mono" x="18" y="108">+withSession(block): CompletionStage~T~</text>
<text class="mono" x="18" y="129">+withTransaction(block):</text>
<text class="mono" x="18" y="150">CompletionStage~T~</text>
<text class="mono" x="18" y="171">+withSessionSuspending(block): T ←</text>
<text class="mono" x="18" y="192">extension</text>
</g>
</svg>
