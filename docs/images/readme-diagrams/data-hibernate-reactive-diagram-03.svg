<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="890" viewBox="0 0 1580 890" role="img" aria-label="Reactive session type comparison"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:42px;fill:#0F172A}.subtitle,.sectionTitle{font-family:"Comic Mono";font-size:15px;fill:#475569}.table{filter:url(#softShadow)}.head{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.cell{font-family:"Comic Mono";font-size:16px;fill:#475569}.rowLabel{font-family:"Comic Mono";font-size:16px;fill:#0F172A}</style></defs><rect class="canvas" width="1580" height="890"/><rect class="frame" x="34" y="30" width="1512" height="824" rx="8"/><text class="title" x="76" y="86">Reactive Session API Comparison</text><text class="subtitle" x="78" y="118">Mutiny and Stage expose the same Kotlin naming surface, but keep their native async types and await mechanisms.</text><g class="table" transform="translate(80 165)"><rect x="0" y="0" width="1420" height="660" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.6"/><rect x="0" y="0" width="1420" height="68" rx="8" fill="#F3F8FF" stroke="#CBD5E1"/><text class="head" x="230" y="43" text-anchor="middle">Capability</text><text class="head" x="730" y="43" text-anchor="middle" fill="#0D9488">Mutiny</text><text class="head" x="1190" y="43" text-anchor="middle" fill="#2563EB">Stage</text><line x1="470" y1="0" x2="470" y2="660" stroke="#CBD5E1"/><line x1="960" y1="0" x2="960" y2="660" stroke="#CBD5E1"/><rect x="0" y="68" width="1420" height="74" fill="#F8FAFC"/><line x1="0" y1="68" x2="1420" y2="68" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="114">Factory unwrap</text><text class="cell" x="500" y="114">asMutinySessionFactory()</text><text class="cell" x="990" y="114">asStageSessionFactory()</text><rect x="0" y="142" width="1420" height="74" fill="#FFFFFF"/><line x1="0" y1="142" x2="1420" y2="142" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="188">Async type</text><text class="cell" x="500" y="188">Uni&lt;T&gt;</text><text class="cell" x="990" y="188">CompletionStage&lt;T&gt;</text><rect x="0" y="216" width="1420" height="74" fill="#F8FAFC"/><line x1="0" y1="216" x2="1420" y2="216" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="262">Coroutine await</text><text class="cell" x="500" y="262">awaitSuspending()</text><text class="cell" x="990" y="262">await()</text><rect x="0" y="290" width="1420" height="74" fill="#FFFFFF"/><line x1="0" y1="290" x2="1420" y2="290" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="336">Callback bridge</text><text class="cell" x="500" y="336">async(...).asUni()</text><text class="cell" x="990" y="336">async(...).asCompletableFuture()</text><rect x="0" y="364" width="1420" height="74" fill="#F8FAFC"/><line x1="0" y1="364" x2="1420" y2="364" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="410">Session scope</text><text class="cell" x="500" y="410">withSessionSuspending</text><text class="cell" x="990" y="410">withSessionSuspending</text><rect x="0" y="438" width="1420" height="74" fill="#FFFFFF"/><line x1="0" y1="438" x2="1420" y2="438" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="484">Transaction scope</text><text class="cell" x="500" y="484">withTransactionSuspending</text><text class="cell" x="990" y="484">withTransactionSuspending</text><rect x="0" y="512" width="1420" height="74" fill="#F8FAFC"/><line x1="0" y1="512" x2="1420" y2="512" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="558">Stateless scope</text><text class="cell" x="500" y="558">withStateless*Suspending</text><text class="cell" x="990" y="558">withStateless*Suspending</text><rect x="0" y="586" width="1420" height="74" fill="#FFFFFF"/><line x1="0" y1="586" x2="1420" y2="586" stroke="#CBD5E1"/><text class="rowLabel" x="30" y="632">Cancellation rule</text><text class="cell" x="500" y="632">rethrow CancellationException</text><text class="cell" x="990" y="632">rethrow CancellationException</text></g></svg>