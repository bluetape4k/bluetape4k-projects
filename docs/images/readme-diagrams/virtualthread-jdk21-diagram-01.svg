<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="920" viewBox="0 0 2220 920" role="img" aria-label="JDK21 Virtual Thread UML">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0.7 0.7 L 5.4 3 L 0.7 5.3 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2220" height="920"/>
<rect class="frame" x="34" y="30" width="2152" height="860" rx="30"/>
<text class="title" x="72" y="86">JDK21 Virtual Thread UML</text>
<text class="subtitle" x="76" y="118">Interfaces stay above Java 21 implementations; each UML arrow terminates on the real parent boundary.</text>
<g><rect class="panel" x="80" y="158" width="2060" height="190" rx="22"/><text class="panelTitle" x="104" y="192">API contracts from virtualthread-api</text></g>
<g><rect class="panel" x="80" y="395" width="2060" height="380" rx="22"/><text class="panelTitle" x="104" y="429">JDK 21 implementation module</text></g>
<g id="vtr"><rect class="card" x="145" y="215" width="300" height="112" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="145" y1="283" x2="445" y2="283" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="295" y="235" text-anchor="middle">interface</text><text class="classTitle" x="295" y="263" text-anchor="middle">VirtualThreadRuntime</text><text class="member" x="163" y="292">+runtimeName: String</text><text class="member" x="163" y="309">+threadFactory(prefix)</text><text class="member" x="163" y="326">+executorService()</text></g>
<g id="provider"><rect class="card" x="500" y="205" width="430" height="132" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="500" y1="273" x2="930" y2="273" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="715" y="225" text-anchor="middle">interface</text><text class="classTitle" x="715" y="253" text-anchor="middle">StructuredTaskScopeProvider</text><text class="member" x="518" y="292">+withAll(...)</text><text class="member" x="518" y="309">+withAny(...)</text><text class="member" x="518" y="326">+withSupervised(...)</text></g>
<g id="all"><rect class="card" x="990" y="215" width="330" height="112" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="990" y1="283" x2="1320" y2="283" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1155" y="235" text-anchor="middle">interface</text><text class="classTitle" x="1155" y="263" text-anchor="middle">StructuredTaskScopeAll</text><text class="member" x="1008" y="292">+fork(task)</text><text class="member" x="1008" y="309">+join()</text><text class="member" x="1008" y="326">+throwIfFailed()</text></g>
<g id="any"><rect class="card" x="1380" y="215" width="330" height="112" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="1380" y1="283" x2="1710" y2="283" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="1545" y="235" text-anchor="middle">interface</text><text class="classTitle" x="1545" y="263" text-anchor="middle">StructuredTaskScopeAny</text><text class="member" x="1398" y="292">+fork(task)</text><text class="member" x="1398" y="309">+join()</text><text class="member" x="1398" y="326">+result()</text></g>
<g id="sup"><rect class="card" x="1770" y="215" width="280" height="112" rx="7" fill="#F1ECFF" stroke="#8A72D6"/><line x1="1770" y1="283" x2="2050" y2="283" stroke="#8A72D6" stroke-width="1.5"/><text class="stereo" x="1910" y="235" text-anchor="middle">interface</text><text class="classTitle" x="1910" y="263" text-anchor="middle">Supervised</text><text class="member" x="1788" y="301">+results</text><text class="member" x="1788" y="318">+join()</text></g>
<g id="jruntime"><rect class="card" x="150" y="455" width="300" height="128" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="150" y1="523" x2="450" y2="523" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="300" y="475" text-anchor="middle">final class</text><text class="classTitle" x="300" y="503" text-anchor="middle">Jdk21VirtualThreadRuntime</text><text class="member" x="168" y="540">+runtimeName = jdk21</text><text class="member" x="168" y="557">+priority = 21</text><text class="member" x="168" y="574">+isSupported()</text></g>
<g id="jprovider"><rect class="card" x="520" y="445" width="430" height="148" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="520" y1="513" x2="950" y2="513" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="735" y="465" text-anchor="middle">class</text><text class="classTitle" x="735" y="493" text-anchor="middle">Jdk21StructuredTaskScopeProvider</text><text class="member" x="538" y="540">+withAll()</text><text class="member" x="538" y="557">+withAny()</text><text class="member" x="538" y="574">+withSupervised()</text></g>
<g id="jall"><rect class="card" x="1000" y="455" width="330" height="128" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1000" y1="523" x2="1330" y2="523" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1165" y="475" text-anchor="middle">private class</text><text class="classTitle" x="1165" y="503" text-anchor="middle">Jdk21AllScope</text><text class="member" x="1018" y="549">wraps ShutdownOnFailure</text><text class="member" x="1018" y="566">implements fail-fast API</text></g>
<g id="jany"><rect class="card" x="1390" y="455" width="330" height="128" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="1390" y1="523" x2="1720" y2="523" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="1555" y="475" text-anchor="middle">private class</text><text class="classTitle" x="1555" y="503" text-anchor="middle">Jdk21AnyScope</text><text class="member" x="1408" y="549">wraps ShutdownOnSuccess</text><text class="member" x="1408" y="566">first successful result</text></g>
<g id="jsup"><rect class="card" x="1780" y="455" width="280" height="128" rx="7" fill="#F1ECFF" stroke="#8A72D6"/><line x1="1780" y1="523" x2="2060" y2="523" stroke="#8A72D6" stroke-width="1.5"/><text class="stereo" x="1920" y="475" text-anchor="middle">private class</text><text class="classTitle" x="1920" y="503" text-anchor="middle">Jdk21SupervisedScope</text><text class="member" x="1798" y="549">wraps custom scope</text><text class="member" x="1798" y="566">separates results</text></g>
<g id="subtask"><rect class="card" x="1040" y="650" width="250" height="92" rx="7" fill="#F2F5F9" stroke="#9AA8B8"/><line x1="1040" y1="718" x2="1290" y2="718" stroke="#9AA8B8" stroke-width="1.5"/><text class="stereo" x="1165" y="670" text-anchor="middle">private class</text><text class="classTitle" x="1165" y="698" text-anchor="middle">Jdk21Subtask</text><text class="member" x="1058" y="734">wraps Subtask&lt;T&gt;</text></g>
<g id="scope"><rect class="card" x="1580" y="650" width="360" height="92" rx="7" fill="#FDECEF" stroke="#DC6B82"/><line x1="1580" y1="718" x2="1940" y2="718" stroke="#DC6B82" stroke-width="1.5"/><text class="stereo" x="1760" y="670" text-anchor="middle">private class</text><text class="classTitle" x="1760" y="698" text-anchor="middle">Jdk21SupervisedTaskScope</text><text class="member" x="1598" y="734">extends StructuredTaskScope&lt;T&gt;</text></g>
