<svg xmlns="http://www.w3.org/2000/svg" width="2220" height="1040" viewBox="0 0 2220 1040" role="img" aria-label="JDK21 Virtual Thread UML">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.25"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2220" height="1040"/>
<rect class="frame" x="34" y="30" width="2152" height="980" rx="30"/>
<text class="title" x="72" y="86">JDK21 Virtual Thread UML</text>
<text class="subtitle" x="76" y="118">Interfaces stay above Java 21 implementations; each UML arrow terminates on the real parent boundary.</text>
<g><rect x="80" y="198" width="2060" height="220" rx="22" fill="#F7FBFF" stroke="#D6E3EF" stroke-width="2"/><text class="panelTitle" x="104" y="232">API contracts from virtualthread-api</text></g>
<g><rect x="80" y="448" width="2060" height="480" rx="22" fill="#F7FBFF" stroke="#D6E3EF" stroke-width="2"/><text class="panelTitle" x="104" y="482">JDK 21 implementation module</text></g>
<g id="vtr"><rect class="card" x="140" y="275" width="340" height="112" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="140" y1="343" x2="480" y2="343" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="310" y="295" text-anchor="middle">interface</text><text class="classTitle" x="310" y="323" text-anchor="middle">VirtualThreadRuntime</text><text class="member" x="174" y="352">+runtimeName: String</text><text class="member" x="174" y="369">+threadFactory(prefix)</text><text class="member" x="174" y="386">+executorService()</text></g>
<g id="provider"><rect class="card" x="525" y="275" width="450" height="132" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="525" y1="343" x2="975" y2="343" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="750" y="295" text-anchor="middle">interface</text><text class="classTitle" x="750" y="323" text-anchor="middle">StructuredTaskScopeProvider</text><text class="member" x="559" y="362">+withAll(...)</text><text class="member" x="559" y="379">+withAny(...)</text><text class="member" x="559" y="396">+withSupervised(...)</text></g>
<g id="all"><rect class="card" x="1025" y="275" width="350" height="112" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1025" y1="343" x2="1375" y2="343" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1200" y="295" text-anchor="middle">interface</text><text class="classTitle" x="1200" y="323" text-anchor="middle">StructuredTaskScopeAll</text><text class="member" x="1059" y="352">+fork(task)</text><text class="member" x="1059" y="369">+join()</text><text class="member" x="1059" y="386">+throwIfFailed()</text></g>
<g id="any"><rect class="card" x="1420" y="275" width="350" height="112" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="1420" y1="343" x2="1770" y2="343" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="1595" y="295" text-anchor="middle">interface</text><text class="classTitle" x="1595" y="323" text-anchor="middle">StructuredTaskScopeAny</text><text class="member" x="1454" y="352">+fork(task)</text><text class="member" x="1454" y="369">+join()</text><text class="member" x="1454" y="386">+result()</text></g>
<g id="sup"><rect class="card" x="1815" y="275" width="320" height="112" rx="7" fill="#F1ECFF" stroke="#8A72D6"/><line x1="1815" y1="343" x2="2135" y2="343" stroke="#8A72D6" stroke-width="1.5"/><text class="stereo" x="1975" y="295" text-anchor="middle">interface</text><text class="classTitle" x="1975" y="323" text-anchor="middle">Supervised</text><text class="member" x="1849" y="361">+results</text><text class="member" x="1849" y="378">+join()</text></g>
<g id="jruntime"><rect class="card" x="140" y="545" width="340" height="128" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="140" y1="613" x2="480" y2="613" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="310" y="565" text-anchor="middle">final class</text><text class="classTitle" x="310" y="593" text-anchor="middle">Jdk21VirtualThreadRuntime</text><text class="member" x="174" y="630">+runtimeName = jdk21</text><text class="member" x="174" y="647">+priority = 21</text><text class="member" x="174" y="664">+isSupported()</text></g>
<g id="jprovider"><rect class="card" x="525" y="535" width="450" height="148" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="525" y1="603" x2="975" y2="603" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="750" y="555" text-anchor="middle">class</text><text class="classTitle" x="750" y="583" text-anchor="middle">Jdk21StructuredTaskScopeProvider</text><text class="member" x="559" y="630">+withAll()</text><text class="member" x="559" y="647">+withAny()</text><text class="member" x="559" y="664">+withSupervised()</text></g>
<g id="jall"><rect class="card" x="1025" y="545" width="350" height="128" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1025" y1="613" x2="1375" y2="613" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1200" y="565" text-anchor="middle">private class</text><text class="classTitle" x="1200" y="593" text-anchor="middle">Jdk21AllScope</text><text class="member" x="1059" y="639">wraps ShutdownOnFailure</text><text class="member" x="1059" y="656">implements fail-fast API</text></g>
<g id="jany"><rect class="card" x="1420" y="545" width="350" height="128" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="1420" y1="613" x2="1770" y2="613" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="1595" y="565" text-anchor="middle">private class</text><text class="classTitle" x="1595" y="593" text-anchor="middle">Jdk21AnyScope</text><text class="member" x="1454" y="639">wraps ShutdownOnSuccess</text><text class="member" x="1454" y="656">first successful result</text></g>
<g id="jsup"><rect class="card" x="1815" y="545" width="320" height="128" rx="7" fill="#F1ECFF" stroke="#8A72D6"/><line x1="1815" y1="613" x2="2135" y2="613" stroke="#8A72D6" stroke-width="1.5"/><text class="stereo" x="1975" y="565" text-anchor="middle">private class</text><text class="classTitle" x="1975" y="593" text-anchor="middle">Jdk21SupervisedScope</text><text class="member" x="1849" y="639">wraps custom scope</text><text class="member" x="1849" y="656">separates results</text></g>
<g id="subtask"><rect class="card" x="1040" y="740" width="250" height="92" rx="7" fill="#F2F5F9" stroke="#9AA8B8"/><line x1="1040" y1="808" x2="1290" y2="808" stroke="#9AA8B8" stroke-width="1.5"/><text class="stereo" x="1165" y="760" text-anchor="middle">private class</text><text class="classTitle" x="1165" y="788" text-anchor="middle">Jdk21Subtask</text><text class="member" x="1074" y="824">wraps Subtask&lt;T&gt;</text></g>
<g id="scope"><rect class="card" x="1580" y="740" width="360" height="92" rx="7" fill="#FDECEF" stroke="#DC6B82"/><line x1="1580" y1="808" x2="1940" y2="808" stroke="#DC6B82" stroke-width="1.5"/><text class="stereo" x="1760" y="760" text-anchor="middle">private class</text><text class="classTitle" x="1760" y="788" text-anchor="middle">Jdk21SupervisedTaskScope</text><text class="member" x="1614" y="824">extends StructuredTaskScope&lt;T&gt;</text></g>
