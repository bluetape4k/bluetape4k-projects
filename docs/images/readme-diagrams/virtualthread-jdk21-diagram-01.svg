<path class="inherit" d="M750 535 L750 407" stroke="#3E9868"/>
<path class="inherit" d="M1200 545 L1200 387" stroke="#2E8F89"/>
<path class="inherit" d="M1595 545 L1595 387" stroke="#B9851B"/>
