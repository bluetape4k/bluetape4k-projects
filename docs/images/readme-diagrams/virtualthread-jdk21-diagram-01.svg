<path class="inherit" d="M735 445 L735 390 L715 390 L715 337" stroke="#3E9868"/>
<path class="inherit" d="M1165 455 L1165 390 L1155 390 L1155 327" stroke="#2E8F89"/>
<path class="inherit" d="M1555 455 L1555 390 L1545 390 L1545 327" stroke="#B9851B"/>
<path class="inherit" d="M1920 455 L1920 390 L1910 390 L1910 327" stroke="#755BC6"/>
<path class="flow" d="M1165 650 L1165 583" stroke="#758297"/>
<path class="flow" d="M1760 650 L1760 616 L1920 616 L1920 583" stroke="#C94D68"/>
<g><rect x="220" y="818" width="1760" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><text class="small" x="1100" y="843" text-anchor="middle">Source truth: JDK21 provider wraps Java 21 StructuredTaskScope variants and exposes the API contracts through ServiceLoader.</text></g>
</svg>
