<rect class="card" x="1720" y="166" width="251" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="1845.5" y="209" text-anchor="middle">-Context</text>
<line class="lifeline" x1="1845.5" y1="252" x2="1845.5" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2048" y="166" width="251" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2173.5" y="209" text-anchor="middle">-Span</text>
<line class="lifeline" x1="2173.5" y1="252" x2="2173.5" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2376" y="166" width="251" height="72" rx="20" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="2501.5" y="209" text-anchor="middle">-Builder</text>
<line class="lifeline" x1="2501.5" y1="252" x2="2501.5" y2="1002" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="222.5" y="286" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="240.5" y="313" text-anchor="start">1. tracer.spanBuilder(operation)</text>
<path class="line" d="M205.5 332 L533.5 332"/>
<rect x="238.5" y="362" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="256.5" y="389" text-anchor="start">2. useSpanSuspending { ... }</text>
<path class="line" d="M205.5 408 L533.5 408"/>
<rect x="592.5" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="610.5" y="465" text-anchor="start">3. startSpan()</text>
<path class="line" d="M533.5 484 L861.5 484"/>
<rect x="886.5" y="514" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
