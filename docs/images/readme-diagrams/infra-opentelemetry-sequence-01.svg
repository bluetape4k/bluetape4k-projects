<path class="line" d="M1189.5 636 L1517.5 636"/>
<rect x="1576.5" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1594.5" y="693" text-anchor="start">6. Return result</text>
<path class="dashed" d="M1517.5 712 L1845.5 712"/>
<rect x="1576.5" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1594.5" y="769" text-anchor="start">7. Block exits</text>
<path class="dashed" d="M1189.5 788 L2173.5 788"/>
<rect x="804.5" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="822.5" y="845" text-anchor="start">8. end()</text>
<path class="line" d="M861.5 864 C925.5 864 925.5 898 861.5 898"/>
<rect x="1576.5" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1594.5" y="921" text-anchor="start">9. Span finished</text>
<path class="dashed" d="M861.5 940 L2501.5 940"/>
</svg>
