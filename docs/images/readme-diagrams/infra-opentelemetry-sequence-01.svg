<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1380" viewBox="0 0 1680 1380" role="img" aria-labelledby="title desc">
<title id="title">span lifecycle in coroutine context</title>
<desc id="desc">Tracer.withSpan creates a SpanBuilder, starts one Span, installs it into the coroutine OpenTelemetry context, runs work, records completion or failure, and always ends the Span.</desc>
<defs><style>
  .title{font-family:"Architects Daughter";font-size:42px;fill:#1F2937}
  .subtitle,.msg,.role,.note,.footer{font-family:"Comic Mono";fill:#52616B}
  .subtitle{font-size:18px}.participant{font-family:"Architects Daughter";font-size:22px;fill:#1F2937}
  .role{font-size:13px}.msg{font-size:14px}.note{font-size:13px}.footer{font-size:14px;fill:#60727d}
  .frame{fill:#FEFEFC;stroke:#546E7A;stroke-width:2.5}.inner{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
  .lifeline{stroke:#A8B8C8;stroke-width:2;stroke-dasharray:8 8}
  .activation{rx:6;stroke-width:1.6}.pill{fill:#FFFFFF;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#FFFFFF}
  .alt{fill:#FFFFFF;fill-opacity:.12;stroke:#78909C;stroke-width:2.6;stroke-dasharray:12 8}
</style></defs>
<rect x="24" y="24" width="1632" height="1332" rx="22" class="frame"/>
<text x="840" y="78" text-anchor="middle" class="title">Span Lifecycle in a Coroutine Context</text>
<text x="840" y="110" text-anchor="middle" class="subtitle">One Span is installed into coroutine OTel context, then ended after normal, cancelled, or failed work.</text>
