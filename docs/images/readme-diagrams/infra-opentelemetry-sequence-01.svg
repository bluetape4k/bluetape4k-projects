<rect x="360" y="160" width="190" height="76" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="2.4"/>
<text x="455" y="190" text-anchor="middle" class="participant">Tracer</text>
<text x="455" y="214" text-anchor="middle" class="role">withSpan DSL</text>
