<text x="725" y="190" text-anchor="middle" class="participant">SpanBuilder</text>
<text x="725" y="214" text-anchor="middle" class="role">configured span</text>
<line x1="725" y1="236" x2="725" y2="1260" class="lifeline"/>
<rect x="900" y="160" width="190" height="76" rx="12" fill="#CCFBF1" stroke="#14B8A6" stroke-width="2.4"/>
<text x="995" y="190" text-anchor="middle" class="participant">Span</text>
<text x="995" y="214" text-anchor="middle" class="role">status + end</text>
<line x1="995" y1="236" x2="995" y2="1260" class="lifeline"/>
<rect x="1160" y="160" width="210" height="76" rx="12" fill="#F3E8FF" stroke="#9333EA" stroke-width="2.4"/>
<text x="1265" y="190" text-anchor="middle" class="participant">OTel Context</text>
<text x="1265" y="214" text-anchor="middle" class="role">coroutine element</text>
