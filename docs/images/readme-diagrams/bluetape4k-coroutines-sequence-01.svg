<svg data-intent="Show DeferredValue eager async creation and the two result access paths." data-evidence="bluetape4k/coroutines/README.md; DeferredValue.kt" xmlns="http://www.w3.org/2000/svg" width="1480" height="1080" viewBox="0 0 1480 1080" role="img" aria-labelledby="title desc">
<title id="title">DeferredValue usage flow</title>
<desc id="desc">DeferredValue starts its internal Deferred eagerly, map and flatMap create new wrappers, await suspends, and value blocks the caller until the same result is available.</desc>
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#C94D68"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .actor{filter:url(#shadow);stroke-width:2}.actorTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.actorNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .lifeline{stroke:#A7B4C3;stroke-width:1.7;stroke-dasharray:8 8}.activation{stroke-width:1.5}
    .seq{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .alt{fill:#FFFFFF;fill-opacity:.12;stroke-width:2;stroke-dasharray:9 8}.altTitle{font-family:"Architects Daughter";font-size:20px;fill:#22344A}.altNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .noteBox{fill:#FBFCF8;stroke:#D6E3EF;stroke-width:1.6}.note{font-family:"Comic Mono";font-size:13px;fill:#536476}
  </style>
</defs>
<rect class="canvas" width="1480" height="1080"/>
<rect class="frame" x="30" y="28" width="1420" height="1024" rx="30"/>
<text class="title" x="70" y="86">DeferredValue Usage Flow</text>
<text class="subtitle" x="74" y="118">Creation starts async work immediately; await() suspends, while value blocks through runBlocking when needed.</text>

<g id="caller"><rect class="actor" x="96" y="166" width="220" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="actorTitle" x="206" y="204" text-anchor="middle">Caller</text><text class="actorNote" x="206" y="226" text-anchor="middle">Kotlin code</text><line class="lifeline" x1="206" y1="242" x2="206" y2="954"/></g>
<g id="wrapper"><rect class="actor" x="444" y="166" width="240" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="564" y="204" text-anchor="middle">DeferredValue</text><text class="actorNote" x="564" y="226" text-anchor="middle">ValueObject wrapper</text><line class="lifeline" x1="564" y1="242" x2="564" y2="954"/></g>
<g id="deferred"><rect class="actor" x="800" y="166" width="220" height="76" rx="10" fill="#FFF7E6" stroke="#B9851B"/><text class="actorTitle" x="910" y="204" text-anchor="middle">Deferred&lt;T&gt;</text><text class="actorNote" x="910" y="226" text-anchor="middle">internal _value</text><line class="lifeline" x1="910" y1="242" x2="910" y2="954"/></g>
<g id="coroutine"><rect class="actor" x="1164" y="166" width="220" height="76" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="actorTitle" x="1274" y="204" text-anchor="middle">Coroutine</text><text class="actorNote" x="1274" y="226" text-anchor="middle">valueSupplier()</text><line class="lifeline" x1="1274" y1="242" x2="1274" y2="954"/></g>

<rect class="activation" x="198" y="318" width="16" height="560" rx="5" fill="#E8F3FF" stroke="#4F83BF"/>
<rect class="activation" x="556" y="346" width="16" height="492" rx="5" fill="#EAF7EF" stroke="#3E9868"/>
<rect class="activation" x="902" y="386" width="16" height="404" rx="5" fill="#FFF7E6" stroke="#B9851B"/>
<rect class="activation" x="1266" y="430" width="16" height="126" rx="5" fill="#E9F7F6" stroke="#2E8F89"/>

<g id="creation">
  <rect class="alt" x="72" y="286" width="1336" height="298" rx="16" stroke="#3E9868"/>
  <rect class="pill" x="114" y="272" width="214" height="28" rx="7"/><text class="altTitle" x="221" y="292" text-anchor="middle">eager creation</text>
  <text class="altNote" x="350" y="316">DeferredValue owns a DefaultCoroutineScope and starts async { valueSupplier() } during construction.</text>
</g>
<g id="m1"><rect class="pill" x="262" y="340" width="246" height="28" rx="7"/><text class="label" x="385" y="358" text-anchor="middle">deferredValueOf { ... }</text><path class="seq" d="M214 384 H564" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="pill" x="612" y="398" width="248" height="28" rx="7"/><text class="label" x="736" y="416" text-anchor="middle">async { valueSupplier() }</text><path class="seq" d="M572 444 H910" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m3"><rect class="pill" x="982" y="458" width="250" height="28" rx="7"/><text class="label" x="1107" y="476" text-anchor="middle">start supplier immediately</text><path class="seq" d="M918 504 H1274" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m4"><rect class="pill" x="974" y="530" width="264" height="28" rx="7"/><text class="label" x="1106" y="548" text-anchor="middle">complete T or remember failure</text><path class="ret" d="M1274 572 H910" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>

<g id="composition">
  <rect class="alt" x="72" y="620" width="620" height="144" rx="16" stroke="#4F83BF"/>
  <rect class="pill" x="114" y="606" width="198" height="28" rx="7"/><text class="altTitle" x="213" y="626" text-anchor="middle">composition</text>
  <text class="altNote" x="336" y="650">map/flatMap create another DeferredValue.</text>
  <text class="altNote" x="336" y="668">The new supplier awaits the previous result first.</text>
</g>
<g id="m5"><rect class="pill" x="242" y="664" width="266" height="28" rx="7"/><text class="label" x="375" y="682" text-anchor="middle">map(transform) / flatMap(...)</text><path class="seq" d="M214 714 H564" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m6"><rect class="pill" x="278" y="724" width="226" height="28" rx="7"/><text class="label" x="391" y="742" text-anchor="middle">new DeferredValue&lt;S&gt;</text><path class="ret" d="M564 776 H206" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>

<g id="access">
  <rect class="alt" x="728" y="620" width="680" height="312" rx="16" stroke="#C94D68"/>
  <rect class="pill" x="770" y="606" width="178" height="28" rx="7"/><text class="altTitle" x="859" y="626" text-anchor="middle">result access</text>
  <text class="altNote" x="974" y="650">await() waits without blocking a thread.</text>
  <text class="altNote" x="974" y="668">value blocks via runBlocking when the Deferred is not done.</text>
</g>
<g id="m7"><rect class="pill" x="620" y="676" width="172" height="28" rx="7"/><text class="label" x="706" y="694" text-anchor="middle">await()</text><path class="seq" d="M572 724 H910" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m8"><rect class="pill" x="964" y="734" width="242" height="28" rx="7"/><text class="label" x="1085" y="752" text-anchor="middle">suspend until completed</text><path class="ret" d="M910 780 H564" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m9"><rect class="pill" x="260" y="812" width="218" height="28" rx="7"/><text class="label" x="369" y="830" text-anchor="middle">return T / throw</text><path class="ret" d="M564 860 H206" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
<g id="m10"><rect class="pill" x="768" y="818" width="290" height="28" rx="7"/><text class="label" x="913" y="836" text-anchor="middle">value: getCompleted or runBlocking</text><path class="seq" d="M206 900 H556 V892 H910" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m11"><rect class="pill" x="1110" y="876" width="224" height="28" rx="7"/><text class="label" x="1222" y="894" text-anchor="middle">same Deferred result</text><path class="ret" d="M910 928 H206" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>

<rect class="noteBox" x="96" y="976" width="1288" height="44" rx="12"/>
<text class="note" x="122" y="1004">Lifecycle note: DeferredValue owns its scope, so callers that abandon the wrapper should close it or manage async work in their own CoroutineScope.</text>
</svg>
