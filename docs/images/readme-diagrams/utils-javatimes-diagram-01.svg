<svg data-intent="Explain Java time utilities by grouping date/time DSL receivers, interval and period abstractions, calendar range operations, date arithmetic, and coroutine range flows." data-evidence="utils/javatimes/README.md; utils/javatimes/src/main/kotlin/io/bluetape4k/javatimes" data-source-read="utils/javatimes/README.md; utils/javatimes/src/main/kotlin/io/bluetape4k/javatimes" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Java Time Feature Overview">
