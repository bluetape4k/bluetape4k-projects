<svg data-intent="Explain measured unit composition flow from the current README and Kotlin operator sources." data-evidence="utils/measured/README.md; utils/measured/src/main/kotlin/io/bluetape4k/measured/Units.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/TypeAliases.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Motion.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Area.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Volume.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/EnergyPower.kt" data-source-read="utils/measured/README.md; utils/measured/src/main/kotlin/io/bluetape4k/measured/Units.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/TypeAliases.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Motion.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Area.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/Volume.kt; utils/measured/src/main/kotlin/io/bluetape4k/measured/EnergyPower.kt" xmlns="http://www.w3.org/2000/svg" width="2700" height="1680" viewBox="0 0 2700 1680" role="img" aria-label="Unit Composition Flow">
