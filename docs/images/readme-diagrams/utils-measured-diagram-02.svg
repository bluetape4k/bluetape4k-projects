<svg xmlns="http://www.w3.org/2000/svg" width="2840" height="1760" viewBox="0 0 2840 1760" role="img" aria-label="measured unit composition flow">
<defs>
  <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-unit" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#15803D" stroke="#15803D" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-measure" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#1D4ED8" stroke="#1D4ED8" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-ratio" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#0F766E" stroke="#0F766E" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-domain" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#6D28D9" stroke="#6D28D9" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-energy" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#C2410C" stroke="#C2410C" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-output" markerWidth="24" markerHeight="18" refX="22" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L22 9 L2 16 Z" fill="#475569" stroke="#475569" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
    .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15.5px;fill:#475569}
    .laneBox{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;stroke-dasharray:12 8}.laneTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
    .card{stroke-width:1.9;filter:url(#softShadow)}.kicker{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.body{font-family:"Comic Mono";font-size:13.2px;fill:#334155}
    .foot{font-family:"Comic Mono";font-size:12.5px;fill:#475569}.divider{stroke-width:1.15;opacity:.45}
    .edge{fill:none;stroke-width:3.55;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:10 8}
    .edgeLabelBg{fill:#FFFFFF;stroke:#E2E8F0;stroke-width:1;opacity:.95}.edgeLabel{font-family:"Comic Mono";font-size:12.7px;fill:#334155}
  </style>
</defs>
<rect class="canvas" width="2840" height="1760"/>
<rect class="frame" x="34" y="30" width="2772" height="1696" rx="8"/>
<text class="title" x="74" y="88">Unit Composition Flow</text>
<text class="subtitle" x="78" y="121">Unit operators compose typed unit descriptors; value operators compose Measure types, while domain overloads return readable Area, Volume, Energy, and Power results.</text>
<rect class="laneBox" x="86" y="212" width="1970" height="345" rx="8" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/><text class="laneTitle" x="110" y="246">1. compose unit descriptors before values exist</text>
<rect class="laneBox" x="86" y="553" width="2570" height="439" rx="8" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/><text class="laneTitle" x="110" y="626">2. compose measured values with generic operators</text>
<rect class="laneBox" x="86" y="1220" width="2570" height="460" rx="8" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/><text class="laneTitle" x="110" y="1254">3. use domain overloads when raw compound types would be noisy</text>
<g id="edges"><g id="unit-to-ops">
  <path class="edge " d="M650 370 L790 370" stroke="#15803D" marker-end="url(#arrow-unit)"/>
  <rect class="edgeLabelBg" x="660" y="325" width="134.6" height="26" rx="6"/>
  <text class="edgeLabel" x="670" y="343">compose units</text>
</g>
<g id="ops-to-aliases">
  <path class="edge " d="M1290 370 L1430 370" stroke="#0F766E" marker-end="url(#arrow-ratio)"/>
  <rect class="edgeLabelBg" x="1305" y="325" width="134.6" height="26" rx="6"/>
  <text class="edgeLabel" x="1315" y="343">ratio aliases</text>
</g>
<g id="number-to-measure">
  <path class="edge " d="M650 750 L790 750" stroke="#1D4ED8" marker-end="url(#arrow-measure)"/>
  <rect class="edgeLabelBg" x="655" y="705" width="126.39999999999999" height="26" rx="6"/>
  <text class="edgeLabel" x="665" y="723">Number.times</text>
</g>
<g id="measure-to-ops">
  <path class="edge " d="M1290 750 L1430 750" stroke="#1D4ED8" marker-end="url(#arrow-measure)"/>
  <rect class="edgeLabelBg" x="1302" y="705" width="134.6" height="26" rx="6"/>
  <text class="edgeLabel" x="1312" y="723">divide values</text>
</g>
<g id="ops-to-speed">
  <path class="edge " d="M1930 750 L2070 750" stroke="#0F766E" marker-end="url(#arrow-ratio)"/>
  <rect class="edgeLabelBg" x="1948" y="705" width="120" height="26" rx="6"/>
  <text class="edgeLabel" x="1958" y="723">typed ratio</text>
</g>
<g id="speed-to-presentation">
  <path class="edge dashed" d="M2330 900 L2330 965" stroke="#0F766E"/>
<polygon points="2324,953 2330,965 2336,953" fill="#0F766E" stroke="#0F766E" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect class="edgeLabelBg" x="2340" y="922" width="120" height="26" rx="6"/>
  <text class="edgeLabel" x="2350" y="940">convert</text>
</g>
<g id="shape-to-shape-ops">
  <path class="edge " d="M650 1410 L790 1410" stroke="#6D28D9" marker-end="url(#arrow-domain)"/>
  <rect class="edgeLabelBg" x="648" y="1365" width="151" height="26" rx="6"/>
  <text class="edgeLabel" x="658" y="1383">specialized * /</text>
</g>
<g id="shape-ops-to-results">
  <path class="edge " d="M 1290 1410 L 1346 1410 Q 1360 1410 1360 1424 L 1360 1571 Q 1360 1585 1374 1585 L 2070 1585" stroke="#6D28D9" marker-end="url(#arrow-domain)"/>
  <rect class="edgeLabelBg" x="1415" y="1540" width="134.6" height="26" rx="6"/>
  <text class="edgeLabel" x="1425" y="1558">Area / Volume</text>
</g>
<g id="energy-to-results">
  <path class="edge " d="M 1930 1410 L 1976 1410 Q 1990 1410 1990 1424 L 1990 1476 Q 1990 1490 2004 1490 L 2070 1490" stroke="#C2410C" marker-end="url(#arrow-energy)"/>
  <rect class="edgeLabelBg" x="1958" y="1444" width="142.79999999999998" height="26" rx="6"/>
  <text class="edgeLabel" x="1968" y="1462">Energy / Power</text>
</g>
<g id="presentation-to-results">
  <path class="edge dashed" d="M2330 1185 L2330 1450" stroke="#475569"/>
<polygon points="2324,1438 2330,1450 2336,1438" fill="#475569" stroke="#475569" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect class="edgeLabelBg" x="2340" y="1307" width="120" height="26" rx="6"/>
  <text class="edgeLabel" x="2350" y="1325">format too</text>
</g></g>
<g id="cards"><g id="baseUnits">
  <rect class="card" x="140" y="265" width="510" height="235" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="164" y="297">base unit constants</text>
  <text class="cardTitle" x="164" y="332">Length.meters + Time.seconds</text>
  <path class="divider" d="M140 353H650" stroke="#15803D"/>
  <text class="body" x="164" y="387">each Units value owns suffix and ratio</text>
  <text class="body" x="164" y="412">meters ratio = 1.0</text>
  <text class="body" x="164" y="437">seconds ratio = 1000.0</text>
  <path class="divider" d="M140 454H650" stroke="#15803D"/><text class="foot" x="164" y="483">immutable unit values</text>
</g>
<g id="unitOps">
  <rect class="card" x="790" y="265" width="500" height="235" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="814" y="297">Units.kt</text>
  <text class="cardTitle" x="814" y="332">A / B and A * B</text>
  <path class="divider" d="M790 353H1290" stroke="#15803D"/>
  <text class="body" x="814" y="387">A.div(B) -&gt; UnitsRatio&lt;A,B&gt;</text>
  <text class="body" x="814" y="412">A.times(B) -&gt; UnitsProduct&lt;A,B&gt;</text>
  <text class="body" x="814" y="437">compound unit keeps typed operands</text>
  <path class="divider" d="M790 454H1290" stroke="#15803D"/><text class="foot" x="814" y="483">unit-only composition</text>
</g>
<g id="aliases">
  <rect class="card" x="1430" y="265" width="560" height="235" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1454" y="297">TypeAliases.kt + Motion.kt</text>
  <text class="cardTitle" x="1454" y="332">Velocity and Acceleration</text>
  <path class="divider" d="M1430 353H1990" stroke="#0F766E"/>
  <text class="body" x="1454" y="387">Velocity = UnitsRatio&lt;Length, Time&gt;</text>
  <text class="body" x="1454" y="412">Acceleration = UnitsRatio&lt;Length, Square&lt;Time&gt;&gt;</text>
  <text class="body" x="1454" y="437">m/s, km/hr, m/s^2 are concrete ratios</text>
  <path class="divider" d="M1430 454H1990" stroke="#0F766E"/><text class="foot" x="1454" y="483">motion names wrap generic ratios</text>
</g>
<g id="numberInputs">
  <rect class="card" x="140" y="645" width="510" height="235" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="164" y="677">Number extensions</text>
  <text class="cardTitle" x="164" y="712">10 * meters, 2 * seconds</text>
  <path class="divider" d="M140 733H650" stroke="#1D4ED8"/>
  <text class="body" x="164" y="767">Number.times(unit)</text>
  <text class="body" x="164" y="792">Number.meters()</text>
  <text class="body" x="164" y="817">Number.seconds()</text>
  <path class="divider" d="M140 834H650" stroke="#1D4ED8"/><text class="foot" x="164" y="863">creates Measure&lt;T&gt;</text>
</g>
<g id="measures">
  <rect class="card" x="790" y="645" width="500" height="235" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="814" y="677">typed values</text>
  <text class="cardTitle" x="814" y="712">Measure&lt;Length&gt; + Measure&lt;Time&gt;</text>
  <path class="divider" d="M790 733H1290" stroke="#1D4ED8"/>
  <text class="body" x="814" y="767">amount is Double</text>
  <text class="body" x="814" y="792">units keeps exact generic type</text>
  <text class="body" x="814" y="817">conversion uses unit ratios</text>
  <path class="divider" d="M790 834H1290" stroke="#1D4ED8"/><text class="foot" x="814" y="863">value and unit move together</text>
</g>
<g id="measureOps">
  <rect class="card" x="1430" y="645" width="500" height="235" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="1454" y="677">generic operators</text>
  <text class="cardTitle" x="1454" y="712">Measure&lt;A&gt; / Measure&lt;B&gt;</text>
  <path class="divider" d="M1430 733H1930" stroke="#1D4ED8"/>
  <text class="body" x="1454" y="767">amount / other.amount</text>
  <text class="body" x="1454" y="792">units / other.units</text>
  <text class="body" x="1454" y="817">returns Measure&lt;UnitsRatio&lt;A,B&gt;&gt;</text>
  <path class="divider" d="M1430 834H1930" stroke="#1D4ED8"/><text class="foot" x="1454" y="863">same pattern for product units</text>
</g>
<g id="speed">
  <rect class="card" x="2070" y="645" width="520" height="255" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="2094" y="677">typed result</text>
  <text class="cardTitle" x="2094" y="712">Measure&lt;Velocity&gt;</text>
  <path class="divider" d="M2070 733H2590" stroke="#0F766E"/>
  <text class="body" x="2094" y="767">10.meters() / 2.seconds()</text>
  <text class="body" x="2094" y="792">speed in m/s = 5.0</text>
  <text class="body" x="2094" y="817">speed * 5.seconds() restores Length</text>
  <path class="divider" d="M2070 854H2590" stroke="#0F766E"/><text class="foot" x="2094" y="883">(A/B) * B -&gt; A</text>
</g>
<g id="presentation">
  <rect class="card" x="2070" y="965" width="520" height="220" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2094" y="997">presentation</text>
  <text class="cardTitle" x="2094" y="1032">convert, `in`, `as`, toHuman()</text>
  <path class="divider" d="M2070 1053H2590" stroke="#475569"/>
  <text class="body" x="2094" y="1087">convert values into target units</text>
  <text class="body" x="2094" y="1112">format concise human-readable output</text>
  <path class="divider" d="M2070 1139H2590" stroke="#475569"/><text class="foot" x="2094" y="1168">examples display typed results</text>
</g>
<g id="shapeInputs">
  <rect class="card" x="140" y="1280" width="510" height="260" rx="8" fill="#FAF5FF" stroke="#7C3AED"/>
  <text class="kicker" x="164" y="1312">Area.kt + Volume.kt</text>
  <text class="cardTitle" x="164" y="1347">Length, Area, Volume</text>
  <path class="divider" d="M140 1368H650" stroke="#6D28D9"/>
  <text class="body" x="164" y="1402">Length * Length</text>
  <text class="body" x="164" y="1427">Area * Length</text>
  <text class="body" x="164" y="1452">Volume / Area</text>
  <text class="body" x="164" y="1477">Volume / Length</text>
  <path class="divider" d="M140 1494H650" stroke="#6D28D9"/><text class="foot" x="164" y="1523">specialized overloads return domain units</text>
</g>
<g id="shapeOps">
  <rect class="card" x="790" y="1280" width="500" height="260" rx="8" fill="#FAF5FF" stroke="#7C3AED"/>
  <text class="kicker" x="814" y="1312">canonical conversion</text>
  <text class="cardTitle" x="814" y="1347">meters, meters2, cubicMeters</text>
  <path class="divider" d="M790 1368H1290" stroke="#6D28D9"/>
  <text class="body" x="814" y="1402">convert operands to canonical bases</text>
  <text class="body" x="814" y="1427">perform arithmetic on canonical values</text>
  <text class="body" x="814" y="1452">return Area, Volume, Length, or Area</text>
  <path class="divider" d="M790 1494H1290" stroke="#6D28D9"/><text class="foot" x="814" y="1523">domain result is clearer than raw product</text>
</g>
<g id="energyInputs">
  <rect class="card" x="1430" y="1280" width="500" height="260" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="kicker" x="1454" y="1312">EnergyPower.kt</text>
  <text class="cardTitle" x="1454" y="1347">Power + Time</text>
  <path class="divider" d="M1430 1368H1930" stroke="#C2410C"/>
  <text class="body" x="1454" y="1402">Power * Time</text>
  <text class="body" x="1454" y="1427">Time * Power</text>
  <text class="body" x="1454" y="1452">Energy / Time</text>
  <path class="divider" d="M1430 1494H1930" stroke="#C2410C"/><text class="foot" x="1454" y="1523">W*s &lt;-&gt; J, J/s &lt;-&gt; W</text>
</g>
<g id="domainResults">
  <rect class="card" x="2070" y="1450" width="520" height="170" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2094" y="1482">domain results</text>
  <text class="cardTitle" x="2094" y="1517">Area, Volume, Energy, Power</text>
  <path class="divider" d="M2070 1538H2590" stroke="#475569"/>
  <text class="body" x="2094" y="1572">specialized APIs hide compound internals</text>
  <text class="body" x="2094" y="1597">callers receive reader-friendly measure types</text>

</g></g>
</svg>
