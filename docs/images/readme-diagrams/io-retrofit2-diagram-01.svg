<svg data-intent="Show the source-backed retrofit2 module architecture: DSL, converters, call adapters, transports, coroutine/result execution." data-evidence="io/retrofit2/README.md; RetrofitSupport.kt; RetrofitCallSupport.kt; SuspendRetrofitCallSupport.kt; ResultCallAdapterFactory.kt; ResultCall.kt; Hc5CallFactory.kt; VertxCallFactory.kt" xmlns="http://www.w3.org/2000/svg" width="1740" height="1010" viewBox="0 0 1740 1010" role="img" aria-label="Retrofit2 Module Architecture">
<defs>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#FFFFFF;stroke:#D2DFEA;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A}.panelNote{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .card{stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .route{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}
  </style>
</defs>
<rect class="canvas" width="1740" height="1010"/>
<rect class="frame" x="30" y="28" width="1680" height="954" rx="30"/>
<text class="title" x="70" y="86">bluetape4k-retrofit2 Module Architecture</text>
<text class="subtitle" x="74" y="118">A small Retrofit builder surface wires converters, Result adapters, optional reactive adapters, and alternate Call.Factory transports.</text>

<g id="configure"><rect class="panel" x="88" y="166" width="1564" height="184" rx="14"/><text class="panelTitle" x="118" y="207">Configuration and service creation</text><text class="panelNote" x="118" y="235">retrofitOf installs defaults; explicit builder blocks can still add project-specific factories.</text></g>
<g id="runtime"><rect class="panel" x="88" y="404" width="1564" height="266" rx="14"/><text class="panelTitle" x="118" y="445">Retrofit runtime pieces</text><text class="panelNote" x="118" y="473">Converters shape payloads, CallAdapters shape return types, and Call.Factory owns transport behavior.</text></g>
<g id="execute"><rect class="panel" x="88" y="726" width="1564" height="210" rx="14"/><text class="panelTitle" x="118" y="767">Execution helpers and result contracts</text><text class="panelNote" x="118" y="795">Use suspend APIs for coroutine callers; use Result&lt;T&gt; when business code should branch on success or failure values.</text></g>

<g id="api"><rect class="card" x="132" y="262" width="260" height="66" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="262" y="300" text-anchor="middle">Service interface</text><text class="detail" x="262" y="322" text-anchor="middle">suspend / Call / Result</text></g>
<g id="support"><rect class="card" x="458" y="246" width="312" height="96" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="614" y="282" text-anchor="middle">RetrofitSupport</text><text class="detail" x="614" y="310" text-anchor="middle">retrofitBuilderOf / retrofitOf</text><text class="detail" x="614" y="330" text-anchor="middle">service&lt;T&gt;()</text></g>
<g id="builder"><rect class="card" x="838" y="262" width="260" height="66" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="968" y="300" text-anchor="middle">Retrofit.Builder</text><text class="detail" x="968" y="322" text-anchor="middle">baseUrl + factories</text></g>
<g id="retrofit"><rect class="card" x="1166" y="262" width="260" height="66" rx="10" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="1296" y="300" text-anchor="middle">Retrofit service</text><text class="detail" x="1296" y="322" text-anchor="middle">create interface proxy</text></g>

<g id="converters"><rect class="card" x="132" y="522" width="300" height="92" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="282" y="558" text-anchor="middle">Converter factories</text><text class="detail" x="282" y="586" text-anchor="middle">Scalars + Jackson default</text></g>
<g id="resultAdapter"><rect class="card" x="492" y="522" width="300" height="92" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="642" y="558" text-anchor="middle">ResultCallAdapter</text><text class="detail" x="642" y="586" text-anchor="middle">Call&lt;Result&lt;T&gt;&gt; only</text></g>
<g id="reactive"><rect class="card" x="852" y="522" width="300" height="92" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1002" y="558" text-anchor="middle">Reactive adapters</text><text class="detail" x="1002" y="586" text-anchor="middle">RxJava2 / RxJava3 / Reactor</text></g>
<g id="transport"><rect class="card" x="1212" y="506" width="360" height="124" rx="10" fill="#FFF0F4" stroke="#C94D68"/><text class="cardTitle" x="1392" y="542" text-anchor="middle">Call.Factory transport</text><text class="detail" x="1392" y="570" text-anchor="middle">OkHttp default</text><text class="detail" x="1392" y="590" text-anchor="middle">Hc5CallFactory / VertxCallFactory</text><text class="detail" x="1392" y="610" text-anchor="middle">cancel, timeout, tag contract</text></g>

<g id="suspend"><rect class="card" x="224" y="832" width="310" height="72" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="379" y="864" text-anchor="middle">suspendExecute()</text><text class="detail" x="379" y="888" text-anchor="middle">cancellation calls Call.cancel()</text></g>
<g id="async"><rect class="card" x="610" y="832" width="310" height="72" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="765" y="864" text-anchor="middle">executeAsync()</text><text class="detail" x="765" y="888" text-anchor="middle">CompletableFuture + retry clone()</text></g>
<g id="result"><rect class="card" x="996" y="832" width="310" height="72" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="1151" y="864" text-anchor="middle">ResultCall</text><text class="detail" x="1151" y="888" text-anchor="middle">HTTP/network errors as failure</text></g>
<g id="transportContract"><rect class="card" x="1382" y="832" width="226" height="72" rx="10" fill="#FFF0F4" stroke="#C94D68"/><text class="cardTitle" x="1495" y="864" text-anchor="middle">Transport</text><text class="detail" x="1495" y="888" text-anchor="middle">caller-closeable body</text></g>

