<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="1700" viewBox="0 0 1288 1700" role="img" aria-label="Circuit Breaker + Resilience4j Integration Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1288" height="1700"/>
<rect class="frame" x="32" y="28" width="1224" height="1644" rx="28"/>
<text class="title" x="66" y="82">Circuit Breaker + Resilience4j Integration F.</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="198.5" text-anchor="middle">Verticle</text>
<text class="smallLabel" x="140" y="219.5" text-anchor="middle">(Coroutines)</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="494" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="644" y="209" text-anchor="middle">CircuitBreaker</text>
<line class="lifeline" x1="644" y1="252" x2="644" y2="1640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="998" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1148" y="209" text-anchor="middle">Remote Service</text>
<line class="lifeline" x1="1148" y1="252" x2="1148" y2="1640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="224.5" y="286" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="242.5" y="313" text-anchor="start">1. cb.executeSuspend { remoteCall() }</text>
<path class="line" d="M140 344 L644 344"/>
<rect x="520.5" y="396" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="538.5" y="423" text-anchor="start">2. Check state (CLOSED/OPEN/HALF_OPEN)</text>
<path class="line" d="M644 454 C708 454 708 488 644 488"/>
<rect x="70" y="526" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="553" text-anchor="start">ALT: CLOSED (normal)</text>
<rect x="791" y="594" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="621" text-anchor="start">4. Remote call</text>
<path class="line" d="M644 652 L1148 652"/>
<rect x="791" y="704" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="731" text-anchor="start">5. Response</text>
<path class="dashed" d="M1148 762 L644 762"/>
<rect x="287" y="814" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="841" text-anchor="start">6. Successful result</text>
<path class="dashed" d="M644 872 L140 872"/>
<rect x="70" y="924" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="951" text-anchor="start">ELSE: OPEN (blocked)</text>
<rect x="261" y="992" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="279" y="1019" text-anchor="start">8. CallNotPermittedException</text>
<path class="dashed" d="M644 1050 L140 1050"/>
<rect x="70" y="1102" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1129" text-anchor="start">ELSE: HALF_OPEN (probing)</text>
<rect x="791" y="1170" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="1197" text-anchor="start">10. Test call</text>
<path class="line" d="M644 1228 L1148 1228"/>
<rect x="791" y="1280" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="1307" text-anchor="start">11. Success / failure</text>
<path class="dashed" d="M1148 1338 L644 1338"/>
<rect x="536.5" y="1390" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554.5" y="1417" text-anchor="start">12. Transition state (CLOSED/OPEN)</text>
<path class="line" d="M644 1448 C708 1448 708 1482 644 1482"/>
<rect x="287" y="1520" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="1547" text-anchor="start">13. Return result</text>
<path class="dashed" d="M644 1578 L140 1578"/>
</svg>
