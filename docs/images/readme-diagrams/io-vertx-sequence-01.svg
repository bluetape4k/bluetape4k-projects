<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
  <title id="title">Circuit Breaker + Resilience4j Integration Flow</title>
  <desc id="desc">Sequence showing CircuitBreaker.decorateVertxFuture acquiring permission, invoking a Vert.x Future supplier, recording success or failure, and returning blocked calls as failed futures.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .msg, .note, .role, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 17px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .header { fill: #ffffff; stroke: #546e7a; stroke-width: 2; }
      .participant { font-family: "Architects Daughter"; font-size: 20px; fill: #1f3138; }
      .role { font-size: 13px; fill: #546a73; }
      .lifeline { stroke: #9aaab1; stroke-width: 2; stroke-dasharray: 7 8; }
      .activation { fill: #e6f2ec; stroke: #5b7e67; stroke-width: 1.5; }
      .call { fill: none; stroke: #3f7d9c; stroke-width: 3.2; marker-end: url(#arrowCall); }
      .work { fill: none; stroke: #6e8f4f; stroke-width: 3.2; marker-end: url(#arrowWork); }
      .return { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-dasharray: 8 6; marker-end: url(#arrowReturn); }
      .fail { fill: none; stroke: #b86868; stroke-width: 3.2; marker-end: url(#arrowFail); }
      .alt { fill: #ffffff; fill-opacity: .12; stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 7; }
      .divider { stroke: #78909c; stroke-width: 3; stroke-dasharray: 12 8; }
      .label { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.5; }
      .callLabel { stroke: #9cc2d1; }
      .workLabel { stroke: #b6c9a4; }
      .returnLabel { stroke: #c8b38f; }
      .failLabel { stroke: #d9abab; }
      .branchOk { fill: #eef7f0; stroke: #6e8f4f; stroke-width: 1.8; }
      .branchFail { fill: #fff5f5; stroke: #b86868; stroke-width: 1.8; }
      .badge { stroke-width: 1.8; }
      .callBadge { fill: #eaf4f8; stroke: #3f7d9c; }
      .workBadge { fill: #eef7f0; stroke: #6e8f4f; }
      .returnBadge { fill: #fff7e8; stroke: #9b7d54; }
      .failBadge { fill: #fff0f0; stroke: #b86868; }
      .badgeText { font-family: "Comic Mono"; font-size: 12px; font-weight: 700; }
      .msg { font-size: 14px; }
      .note { font-size: 13px; }
      .callText, .badgeText.callText { fill: #2f6f8e; }
      .workText, .badgeText.workText { fill: #55783f; }
      .returnText, .badgeText.returnText { fill: #7f6038; }
      .failText, .badgeText.failText { fill: #9d4f4f; }
      .footer { font-size: 14px; fill: #60727d; }

    /* sequence-style: spring-boot-cassandra-sequence-01 */
    .title{font-family:"Architects Daughter";fill:#263238}.subtitle,.msg,.note,.footer,.detail,.role{font-family:"Comic Mono";fill:#36464f}.subtitle{font-size:16px}text.participant,.cardTitle{font-family:"Architects Daughter";fill:#1f3138}.role{fill:#546a73}.frame{fill:#fbfcf8;stroke:#41545d;stroke-width:3}.inner,.panel{fill:#ffffff;stroke:#d7e0e4;stroke-width:2}.header,.card{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}.actor{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}rect.participant{fill:#ffffff!important;stroke:#546e7a!important;stroke-width:2;filter:url(#shadow)}.lifeline{stroke:#9aaab1;stroke-width:2;stroke-dasharray:7 8}.activation{fill:#e6f2ec!important;stroke:#5b7e67!important;stroke-width:1.5}.seq,.call{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.work,.crypto{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.async{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.seqReturn,.return{fill:none;stroke-width:2.5;stroke-dasharray:8 6;stroke-linecap:round;stroke-linejoin:round}.fail,.skip{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.alt,.altBox{fill:#eef7f0;fill-opacity:.12;stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 7}.divider,.branchDivider{stroke:#78909c;stroke-width:2.4;stroke-dasharray:12 8}rect.label,.labelPill,.pill{fill:#ffffff;stroke:#d7e0e4;stroke-width:1.3}.callLabel{stroke:#9cc2d1}.workLabel,.cryptoLabel{stroke:#b6c9a4}.returnLabel{stroke:#c8b38f}.asyncLabel{stroke:#b8a9d5}.failLabel{stroke:#d9abab}.callBadge{fill:#eaf4f8;stroke:#3f7d9c}.workBadge,.cryptoBadge{fill:#eef7f0;stroke:#6e8f4f}.returnBadge{fill:#fff7e8;stroke:#9b7d54}.asyncBadge{fill:#f3ecff;stroke:#7c5aa6}.failBadge{fill:#fff0f0;stroke:#b86868}text.label{font-family:"Comic Mono";font-size:14px;font-weight:700;stroke:none}.badgeText{font-family:"Comic Mono";font-size:12px;font-weight:700}.callText{fill:#2f6f8e}.workText,.cryptoText{fill:#55783f}.returnText{fill:#7f6038}.asyncText{fill:#674b91}.failText{fill:#9d4f4f}.footer{fill:#60727d}
  </style>
    <marker id="arrowCall" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#3f7d9c" stroke="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowWork" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6e8f4f" stroke="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowReturn" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#9b7d54" stroke="#9b7d54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowFail" markerWidth="13" markerHeight="13" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#b86868" stroke="#b86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>

  <rect x="24" y="24" width="1552" height="1112" rx="20" class="frame"/>
  <text x="800" y="78" text-anchor="middle" class="title">Circuit Breaker + Resilience4j Integration Flow</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">`decorateVertxFuture` gates the supplier with CircuitBreaker permission and records the async Future result when it completes.</text>

  <g>
    <rect x="72" y="150" width="178" height="68" rx="10" class="header"/>
    <text x="161" y="179" text-anchor="middle" class="participant">Caller</text>
    <text x="161" y="201" text-anchor="middle" class="role">Verticle/service</text>
    <rect x="362" y="150" width="244" height="68" rx="10" class="header"/>
    <text x="484" y="179" text-anchor="middle" class="participant">CircuitBreaker</text>
    <text x="484" y="201" text-anchor="middle" class="role">Resilience4j state</text>
    <rect x="718" y="150" width="244" height="68" rx="10" class="header"/>
    <text x="840" y="179" text-anchor="middle" class="participant">Decorator</text>
    <text x="840" y="201" text-anchor="middle" class="role">decorateVertxFuture</text>
    <rect x="1074" y="150" width="210" height="68" rx="10" class="header"/>
    <text x="1179" y="179" text-anchor="middle" class="participant">Supplier</text>
    <text x="1179" y="201" text-anchor="middle" class="role">() -&gt; Future&lt;T&gt;</text>
    <rect x="1372" y="150" width="150" height="68" rx="10" class="header"/>
    <text x="1447" y="179" text-anchor="middle" class="participant">Future</text>
    <text x="1447" y="201" text-anchor="middle" class="role">async result</text>
  </g>

  <line x1="161" y1="218" x2="161" y2="1018" class="lifeline"/>
  <line x1="484" y1="218" x2="484" y2="1018" class="lifeline"/>
  <line x1="840" y1="218" x2="840" y2="1018" class="lifeline"/>
  <line x1="1179" y1="218" x2="1179" y2="1018" class="lifeline"/>
  <line x1="1447" y1="218" x2="1447" y2="1018" class="lifeline"/>
  <rect x="833" y="300" width="14" height="610" rx="6" class="activation"/>
  <rect x="477" y="382" width="14" height="208" rx="6" class="activation"/>
  <rect x="1172" y="566" width="14" height="96" rx="6" class="activation"/>
  <rect x="1440" y="640" width="14" height="190" rx="6" class="activation"/>

  <rect x="96" y="262" width="382" height="34" rx="17" class="label callLabel"/>
  <circle cx="120" cy="279" r="13" class="badge callBadge"/><text fill="#2f6f8e" x="120" y="284" text-anchor="middle" class="badgeText callText">1</text>
  <text x="144" y="284" class="msg callText">executeVertxFuture { service Future }</text>
  <path d="M 161 318 L 840 318" class="call"/>

  <rect x="516" y="344" width="286" height="34" rx="17" class="label callLabel"/>
  <circle cx="540" cy="361" r="13" class="badge callBadge"/><text fill="#2f6f8e" x="540" y="366" text-anchor="middle" class="badgeText callText">2</text>
  <text x="564" y="366" class="msg callText">tryAcquirePermission()</text>
  <path d="M 840 400 L 484 400" class="call"/>

  <rect x="78" y="438" width="1414" height="468" rx="14" class="alt"/>
  <rect x="102" y="456" width="230" height="30" rx="15" class="branchOk"/>
  <text x="122" y="476" class="note">alt permission acquired</text>
  <line x1="78" y1="768" x2="1492" y2="768" class="divider"/>
  <rect x="102" y="786" width="254" height="30" rx="15" class="branchFail"/>
  <text x="122" y="806" class="note">else circuit open or limited</text>

  <rect x="814" y="504" width="300" height="34" rx="17" class="label workLabel"/>
  <circle cx="838" cy="521" r="13" class="badge workBadge"/><text fill="#55783f" x="838" y="526" text-anchor="middle" class="badgeText workText">3</text>
  <text x="862" y="526" class="msg workText">invoke supplier and capture start time</text>
  <path d="M 840 558 L 1179 558" class="work"/>

  <rect x="1148" y="612" width="244" height="34" rx="17" class="label workLabel"/>
  <circle cx="1172" cy="629" r="13" class="badge workBadge"/><text fill="#55783f" x="1172" y="634" text-anchor="middle" class="badgeText workText">4</text>
  <text x="1196" y="634" class="msg workText">Future&lt;T&gt; returned</text>
  <path d="M 1179 676 L 1447 676" class="work"/>

  <rect x="872" y="688" width="448" height="34" rx="17" class="label returnLabel"/>
  <circle cx="896" cy="705" r="13" class="badge returnBadge"/><text fill="#7f6038" x="896" y="710" text-anchor="middle" class="badgeText returnText">5</text>
  <text x="920" y="710" class="msg returnText">onComplete records duration after async completion</text>
  <path d="M 1447 746 L 840 746" class="return"/>

  <rect x="700" y="810" width="448" height="34" rx="17" class="label failLabel"/>
  <circle cx="724" cy="827" r="13" class="badge failBadge"/><text fill="#9d4f4f" x="724" y="832" text-anchor="middle" class="badgeText failText">3</text>
  <text x="748" y="832" class="msg failText">Future.failedFuture(CallNotPermittedException)</text>
  <path d="M 840 864 L 161 864" class="fail"/>

  <rect x="560" y="922" width="450" height="34" rx="17" class="label returnLabel"/>
  <circle cx="534" cy="939" r="13" class="badge returnBadge"/><text fill="#7f6038" x="534" y="944" text-anchor="middle" class="badgeText returnText">6</text>
  <text x="584" y="944" class="msg returnText">return Future; completion updates CircuitBreaker</text>
  <path d="M 840 982 L 161 982" class="return"/>

  <rect x="98" y="1042" width="1404" height="44" rx="12" fill="#ffffff" stroke="#D6E3EF" stroke-width="2"/>
  <text x="118" y="1070" class="note">If supplier.invoke() throws synchronously, the decorator records onError, releases the permission, and returns a failed Future.</text>
  <text x="800" y="1126" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/vertx README</text>
</svg>
