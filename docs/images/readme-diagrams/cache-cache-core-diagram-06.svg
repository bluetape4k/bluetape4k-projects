  <marker id="triangle-green" markerWidth="18" markerHeight="16" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 26 22" data-role="uml-hollow" data-tip-direction="positive-x"><path d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#15803D" stroke-width="2.2" stroke-dasharray="none" /></marker>

  <marker id="arrow-amber" markerWidth="18" markerHeight="16" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 22 22" data-role="uml-hollow" data-tip-direction="positive-x"><path d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#C2410C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /></marker>
  <marker id="triangle-amber" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.2" /></marker>

  <marker id="arrow-pink" markerWidth="18" markerHeight="16" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 22 22" data-role="uml-hollow" data-tip-direction="positive-x"><path d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#BE185D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /></marker>
  <marker id="triangle-pink" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#BE185D" stroke-width="2.2" /></marker>

  <marker id="arrow-purple" markerWidth="18" markerHeight="16" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 22 22" data-role="uml-hollow" data-tip-direction="positive-x"><path d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#6D28D9" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /></marker>
  <marker id="triangle-purple" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2.2" /></marker>

  <marker id="arrow-slate" markerWidth="18" markerHeight="16" refX="19" refY="11" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 22 22" data-role="uml-hollow" data-tip-direction="positive-x"><path d="M 2 2 L 19 11 L 2 20" fill="none" stroke="#475569" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" /></marker>
  <marker id="triangle-slate" markerWidth="26" markerHeight="22" refX="23" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 23 11 L 2 20 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2.2" /></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .chip{stroke-width:1.6}.chipText{font-family:"Comic Mono";font-size:14px;fill:#334155}
    .card{stroke-width:1.8;filter:url(#shadow)}.cardTitle{font-family:"Architects Daughter";font-size:28px;fill:#0F172A}.cardSub{font-family:"Comic Mono";font-size:14px;fill:#475569}
    .line{font-family:"Comic Mono";font-size:14px;fill:#334155}.divider{stroke-width:1.1;opacity:.45}
    .edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#475569}
