<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1180" viewBox="0 0 1820 1180" role="img" aria-labelledby="title desc">
  <title id="title">SuspendNearJCache Coroutine Two-Tier Cache</title>
  <desc id="desc">Explain SuspendNearJCache runtime flow, Flow entries, coroutine listener synchronization, and listener-free construction option.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1820" height="1180"/>
  <rect class="decor" x="44" y="36" width="1732" height="1108" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1656" height="894" rx="24"/>
  <text class="title" x="72" y="88">SuspendNearJCache Coroutine Two-Tier Cache</text>
  <text class="subtitle" x="76" y="121">Coroutine callers use SuspendJCache while listener work is launched off the JCache callback thread.</text>
  <g id="panel-caller">
    <rect class="group" x="105" y="185" width="370" height="175" rx="20"/>
    <text class="groupTitle" x="135" y="213" dominant-baseline="middle">Coroutine caller</text>
  </g>
  <g id="panel-facade">
    <rect class="group" x="555" y="165" width="1075" height="315" rx="20"/>
    <text class="groupTitle" x="585" y="193" dominant-baseline="middle">SuspendNearJCache facade and listener setup</text>
  </g>
  <g id="panel-tiers">
    <rect class="group" x="155" y="565" width="1500" height="210" rx="20"/>
    <text class="groupTitle" x="185" y="593" dominant-baseline="middle">Suspend cache tiers</text>
  </g>
  <g id="panel-events">
    <rect class="group" x="235" y="840" width="1350" height="165" rx="20"/>
    <text class="groupTitle" x="265" y="868" dominant-baseline="middle">Listener and compatibility boundary</text>
  </g>
  <path class="connector" data-edge="caller-&gt;near" data-label="suspend API" d="M 440 291 L 675 291" stroke="#4F83BF"/>
  <g transform="translate(506.8,254)">
    <rect class="labelPill" x="0" y="0" width="101.4" height="26" rx="8"/>
    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">suspend API</text>
  </g>
  <path class="connector" data-edge="near-&gt;entries" data-label="Flow entries" d="M 890 338 L 890 370" stroke="#45A7A1"/>

  <path class="connector" data-edge="near-&gt;front" data-label="front fast path" d="M 680 338 L 680 500 L 430 500 L 430 625" stroke="#45A7A1"/>
  <g transform="translate(489.5,463)">
    <rect class="labelPill" x="0" y="0" width="131" height="26" rx="8"/>
    <text class="small" x="65.5" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">front fast path</text>
  </g>
  <path class="connector" data-edge="front-&gt;back" data-label="miss lookup / fill" d="M 615 673 L 1160 673" stroke="#D9AA4D"/>
  <g transform="translate(810.9,636)">
    <rect class="labelPill" x="0" y="0" width="153.2" height="26" rx="8"/>
    <text class="small" x="76.6" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">miss lookup / fill</text>
  </g>
  <path class="connector" data-edge="near-&gt;back" data-label="write-through" d="M 1105 286 L 1125 286 L 1125 520 L 1355 520 L 1355 625" stroke="#58A978"/>
  <g transform="translate(1181.9,483)">
    <rect class="labelPill" x="0" y="0" width="116.2" height="26" rx="8"/>
    <text class="small" x="58.1" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">write-through</text>
  </g>
  <path class="connector" data-edge="factory-&gt;back" data-label="registers listener" d="M 1432 448 L 1432 625" stroke="#6B7D90"/>
  <g transform="translate(1454,523.5)">
    <rect class="labelPill" x="0" y="0" width="153.2" height="26" rx="8"/>
    <text class="small" x="76.6" y="13" text-anchor="middle" dominant-baseline="middle" fill="#6B7D90">registers listener</text>
  </g>
  <path class="connector" data-edge="back-&gt;listener" data-label="entry events" d="M 1355 721 L 1355 805 L 900 805 L 900 900" stroke="#DB7890"/>
  <g transform="translate(1073.1,768)">
    <rect class="labelPill" x="0" y="0" width="108.8" height="26" rx="8"/>
    <text class="small" x="54.4" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">entry events</text>
  </g>
  <path class="connector" data-edge="listener-&gt;front" data-label="updates front" d="M 520 936 L 200 936 L 200 673 L 245 673" stroke="#DB7890"/>

  <path class="connector dashed" data-edge="without-&gt;back" data-label="listener-free option" d="M 1420 900 L 1420 721" stroke="#8A72D6"/>
  <g transform="translate(1442,797.5)">
    <rect class="labelPill" x="0" y="0" width="168" height="26" rx="8"/>
    <text class="small" x="84" y="13" text-anchor="middle" dominant-baseline="middle" fill="#8A72D6">listener-free option</text>
  </g>
  <g id="node-caller" transform="translate(145,250)">
    <rect class="card" x="0" y="0" width="295" height="82" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="147.5" y="22" text-anchor="middle" dominant-baseline="middle">Coroutine service code</text>
    <text class="detail" x="147.5" y="41" text-anchor="middle" dominant-baseline="middle">suspend calls</text>
    <text class="detail" x="147.5" y="60" text-anchor="middle" dominant-baseline="middle">Flow collection</text>
  </g>
  <g id="node-near" transform="translate(675,230)">
    <rect class="card" x="0" y="0" width="430" height="108" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="215" y="25.5" text-anchor="middle" dominant-baseline="middle">SuspendNearJCache&lt;K,V&gt;</text>
    <text class="detail" x="215" y="44.5" text-anchor="middle" dominant-baseline="middle">SuspendJCache&lt;K,V&gt; by backCache</text>
    <text class="detail" x="215" y="63.5" text-anchor="middle" dominant-baseline="middle">getDeeply fills front</text>
    <text class="detail" x="215" y="82.5" text-anchor="middle" dominant-baseline="middle">put/remove update both tiers</text>
  </g>
  <g id="node-entries" transform="translate(700,370)">
    <rect class="card" x="0" y="0" width="380" height="78" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="190" y="20" text-anchor="middle" dominant-baseline="middle">entries() / getAll()</text>
    <text class="detail" x="190" y="39" text-anchor="middle" dominant-baseline="middle">front Flow</text>
    <text class="detail" x="190" y="58" text-anchor="middle" dominant-baseline="middle">SuspendJCacheEntry&lt;K,V&gt;</text>
  </g>
  <g id="node-front" transform="translate(245,625)">
    <rect class="card" x="0" y="0" width="370" height="96" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="185" y="19.5" text-anchor="middle" dominant-baseline="middle">Front SuspendJCache</text>
    <text class="detail" x="185" y="38.5" text-anchor="middle" dominant-baseline="middle">CaffeineSuspendJCache</text>
    <text class="detail" x="185" y="57.5" text-anchor="middle" dominant-baseline="middle">local fast path</text>
    <text class="detail" x="185" y="76.5" text-anchor="middle" dominant-baseline="middle">clear() is local</text>
  </g>
  <g id="node-back" transform="translate(1160,625)">
    <rect class="card" x="0" y="0" width="390" height="96" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="195" y="19.5" text-anchor="middle" dominant-baseline="middle">Back SuspendJCache</text>
    <text class="detail" x="195" y="38.5" text-anchor="middle" dominant-baseline="middle">Lettuce / Redisson / Hazelcast</text>
    <text class="detail" x="195" y="57.5" text-anchor="middle" dominant-baseline="middle">distributed storage</text>
    <text class="detail" x="195" y="76.5" text-anchor="middle" dominant-baseline="middle">listener source when supported</text>
  </g>
  <g id="node-listener" transform="translate(520,900)">
    <rect class="card" x="0" y="0" width="430" height="72" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="215" y="17" text-anchor="middle" dominant-baseline="middle">SuspendJCacheEntryEventListener</text>
    <text class="detail" x="215" y="36" text-anchor="middle" dominant-baseline="middle">SupervisorJob + Dispatchers.IO</text>
    <text class="detail" x="215" y="55" text-anchor="middle" dominant-baseline="middle">callback thread is not blocked</text>
  </g>
  <g id="node-without" transform="translate(1065,900)">
    <rect class="card" x="0" y="0" width="390" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="195" y="17" text-anchor="middle" dominant-baseline="middle">withoutListener(...)</text>
    <text class="detail" x="195" y="36" text-anchor="middle" dominant-baseline="middle">Hazelcast client JCache</text>
    <text class="detail" x="195" y="55" text-anchor="middle" dominant-baseline="middle">non-serializable listener fallback</text>
  </g>
  <g id="node-factory" transform="translate(1265,370)">
    <rect class="card" x="0" y="0" width="335" height="78" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="cardTitle" x="167.5" y="20" text-anchor="middle" dominant-baseline="middle">Factory registration</text>
    <text class="detail" x="167.5" y="39" text-anchor="middle" dominant-baseline="middle">registerCacheEntryListener</text>
    <text class="detail" x="167.5" y="58" text-anchor="middle" dominant-baseline="middle">front cache target</text>
  </g>
  <g transform="translate(76,1076)">
    <rect class="labelPill" x="0" y="0" width="1668" height="48" rx="10"/>
    <text class="small" x="834" y="24" text-anchor="middle" dominant-baseline="middle">Source: cache README files and public cache contract implementations.</text>
  </g>
</svg>
