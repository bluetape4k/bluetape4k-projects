<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1535" viewBox="0 0 2600 1535" role="img" aria-label="SuspendNearJCache Coroutine Operation Diagram" data-layout="operation-map" data-allow-grid="true">
