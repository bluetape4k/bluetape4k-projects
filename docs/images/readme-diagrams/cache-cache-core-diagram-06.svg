<rect class="canvas" width="2600" height="1535" />
<rect class="frame" x="34" y="30" width="2532" height="1475" rx="8" />
<text class="title" x="72" y="86">SuspendNearJCache Coroutine Operation Map</text>
<text class="subtitle" x="76" y="120">Read, write, Flow, and listener-driven synchronization paths for cache-core's coroutine two-tier near cache.</text>
<g>
  <rect class="chip" x="1470" y="78" width="210" height="54" rx="18" fill="#F0FDFA" stroke="#0D9488" />
  <text class="chipText" x="1575" y="112" text-anchor="middle">contract</text>
</g>
<g>
  <rect class="chip" x="1705" y="78" width="210" height="54" rx="18" fill="#F0FDF4" stroke="#16A34A" />
  <text class="chipText" x="1810" y="112" text-anchor="middle">near-cache</text>
</g>
<g>
  <rect class="chip" x="1940" y="78" width="190" height="54" rx="18" fill="#EFF6FF" stroke="#2563EB" />
  <text class="chipText" x="2035" y="112" text-anchor="middle">front</text>
</g>
<g>
  <rect class="chip" x="2155" y="78" width="190" height="54" rx="18" fill="#F8FAFC" stroke="#64748B" />
  <text class="chipText" x="2250" y="112" text-anchor="middle">back</text>
</g>
<g>
  <rect class="chip" x="2370" y="78" width="160" height="54" rx="18" fill="#FDF2F8" stroke="#DB2777" />
  <text class="chipText" x="2450" y="112" text-anchor="middle">events</text>
</g>
<g id="SuspendJCache">
  <rect class="card" x="120" y="230" width="610" height="270" rx="8" fill="#F0FDFA" stroke="#0D9488" />
  <text class="cardTitle" x="146" y="276">SuspendJCache&lt;K,V&gt;</text>
  <text class="cardSub" x="148" y="304">Coroutine JCache-like contract</text>
  <path class="divider" d="M120 322H730" stroke="#0F766E" />
  <text class="line" x="148" y="356">suspend reads and writes</text>
<text class="line" x="148" y="385">Flow entries and putAllFlow()</text>
<text class="line" x="148" y="414">listener registration contract</text>
<text class="line" x="148" y="443">unwrap() keeps provider escape hatch</text>
</g>
<g id="SuspendNearJCache">
  <rect class="card" x="900" y="220" width="790" height="330" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="cardTitle" x="926" y="266">SuspendNearJCache&lt;K,V&gt;</text>
  <text class="cardSub" x="928" y="294">2-tier cache that implements SuspendJCache by backCache</text>
  <path class="divider" d="M900 312H1690" stroke="#15803D" />
  <text class="line" x="928" y="346">frontCache: SuspendJCache&lt;K,V&gt;</text>
<text class="line" x="928" y="375">backCache: SuspendJCache&lt;K,V&gt;</text>
<text class="line" x="928" y="404">invoke() registers a back-cache listener</text>
<text class="line" x="928" y="433">withoutListener() supports providers that cannot serialize listeners</text>
<text class="line" x="928" y="462">clear() closes front scope; clearAll() clears both tiers</text>
</g>
<g id="Listener">
  <rect class="card" x="1880" y="250" width="600" height="280" rx="8" fill="#FDF2F8" stroke="#DB2777" />
  <text class="cardTitle" x="1906" y="296">SuspendJCacheEntryEventListener</text>
  <text class="cardSub" x="1908" y="324">Back-cache events update the local front cache</text>
  <path class="divider" d="M1880 342H2480" stroke="#BE185D" />
  <text class="line" x="1908" y="376">CoroutineScope(SupervisorJob + Dispatchers.IO)</text>
<text class="line" x="1908" y="405">created/updated -&gt; targetCache.putAll(...)</text>
<text class="line" x="1908" y="434">removed/expired -&gt; targetCache.removeAll(...)</text>
<text class="line" x="1908" y="463">launch() avoids blocking JCache event threads</text>
</g>
<g id="ReadPath">
  <rect class="card" x="190" y="720" width="620" height="280" rx="8" fill="#F5F3FF" stroke="#7C3AED" />
  <text class="cardTitle" x="216" y="766">Read path</text>
  <text class="cardSub" x="218" y="794">get() delegates to getDeeply()</text>
  <path class="divider" d="M190 812H810" stroke="#6D28D9" />
  <text class="line" x="218" y="846">1. frontCache.get(key)</text>
<text class="line" x="218" y="875">2. on miss, backCache.get(key)</text>
<text class="line" x="218" y="904">3. back hit fills frontCache.put(key, value)</text>
<text class="line" x="218" y="933">getAll() and entries() read front cache</text>
</g>
<g id="WritePath">
  <rect class="card" x="990" y="735" width="620" height="260" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="cardTitle" x="1016" y="781">Write and mutation path</text>
  <text class="cardSub" x="1018" y="809">front first, then back for propagation</text>
  <path class="divider" d="M990 827H1610" stroke="#C2410C" />
  <text class="line" x="1018" y="861">put(), putAll(), putIfAbsent()</text>
<text class="line" x="1018" y="890">remove(), removeAll(), replace()</text>
<text class="line" x="1018" y="919">putAllFlow() collects Flow pairs</text>
<text class="line" x="1018" y="948">Redisson bulk-event gaps are handled explicitly</text>
</g>
<g id="FlowPath">
  <rect class="card" x="1820" y="740" width="600" height="245" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="cardTitle" x="1846" y="786">Flow surface</text>
  <text class="cardSub" x="1848" y="814">Streaming view over the local tier</text>
  <path class="divider" d="M1820 832H2420" stroke="#475569" />
  <text class="line" x="1848" y="866">entries(): Flow&lt;SuspendJCacheEntry&lt;K,V&gt;&gt;</text>
<text class="line" x="1848" y="895">getAll(keys): Flow&lt;SuspendJCacheEntry&lt;K,V&gt;&gt;</text>
<text class="line" x="1848" y="924">Caffeine front awaits AsyncCache futures</text>
</g>
<g id="FrontCache">
  <rect class="card" x="300" y="1220" width="680" height="235" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="cardTitle" x="326" y="1266">Local front SuspendJCache</text>
  <text class="cardSub" x="328" y="1294">Usually CaffeineSuspendJCache in cache-core</text>
  <path class="divider" d="M300 1312H980" stroke="#1D4ED8" />
  <text class="line" x="328" y="1346">AsyncCache&lt;K,V&gt; + CompletableFuture.await()</text>
<text class="line" x="328" y="1375">fast front hit path</text>
<text class="line" x="328" y="1404">listener target for remote changes</text>
<text class="line" x="328" y="1433">local listener registration is intentionally a no-op</text>
</g>
<g id="BackCache">
  <rect class="card" x="1510" y="1220" width="760" height="235" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="cardTitle" x="1536" y="1266">Remote/back SuspendJCache</text>
  <text class="cardSub" x="1538" y="1294">Provided by Lettuce, Hazelcast, Redisson, or another adapter</text>
  <path class="divider" d="M1510 1312H2270" stroke="#475569" />
  <text class="line" x="1538" y="1346">delegated methods keep provider semantics</text>
<text class="line" x="1538" y="1375">registered listener emits created/updated/removed/expired events</text>
<text class="line" x="1538" y="1404">writes and removals propagate through this tier</text>
<text class="line" x="1538" y="1433">bulk remove/replace paths account for provider event gaps</text>
</g>
