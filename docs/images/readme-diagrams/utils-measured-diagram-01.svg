<svg xmlns="http://www.w3.org/2000/svg" width="1766" height="1303" viewBox="0 0 1766 1303" role="img" aria-label="Measured Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1766" height="1303"/>
<rect class="frame" x="32" y="28" width="1702" height="1247" rx="30"/>
<text class="title" x="68" y="84">Measured Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="Acceleration" data-to="UnitsRatio" data-route-color="teal" d="M688 303 L688 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Velocity" data-to="UnitsRatio" data-route-color="amber" d="M430 303 L430 430 L508 430" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="UnitsProduct" data-to="Measure" data-route-color="teal" d="M1336 398 L1336 271 L1258 271" stroke="#2E8F89"/>
<path class="inherit" data-from="UnitsRatio" data-to="Measure" data-route-color="amber" d="M826 398 L826 351 L940 351 L940 303" stroke="#B9851B"/>
<path class="dependency" data-from="Measure" data-to="Units" data-route-color="olive" d="M1078 303 L1078 398" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="inherit" data-from="Mass" data-to="Units" data-route-color="purple" d="M1330 631 L1330 584 L1216 584 L1216 536" stroke="#755BC6"/>
<path class="inherit" data-from="Time" data-to="Units" data-route-color="olive" d="M826 631 L826 584 L940 584 L940 536" stroke="#718A35"/>
<path class="inherit" data-from="Length" data-to="Units" data-route-color="indigo" d="M1078 631 L1078 536" stroke="#4F63C7"/>
<g id="Velocity">
  <rect class="classCard" x="118" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="298" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="212" text-anchor="middle">Velocity</text>
  <line x1="118" y1="221" x2="478" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>

</g>
<g id="Measure">
  <rect class="classCard" x="898" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1078" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="212" text-anchor="middle">Measure</text>
  <line x1="898" y1="221" x2="1258" y2="221" stroke="#58A978" stroke-width="1.4"/>

</g>
<g id="Units">
  <rect class="classCard" x="898" y="398" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1078" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="445" text-anchor="middle">Units</text>
  <line x1="898" y1="454" x2="1258" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="932" y="491">+suffix: String</text>
<text class="member" x="932" y="508">+ratio: Double</text>
</g>
<g id="Acceleration">
  <rect class="classCard" x="508" y="165" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="688" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="212" text-anchor="middle">Acceleration</text>
  <line x1="508" y1="221" x2="868" y2="221" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g id="MeasureT">
  <rect class="classCard" x="118" y="829" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="298" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="876" text-anchor="middle">MeasureT</text>
  <line x1="118" y1="885" x2="478" y2="885" stroke="#DC6B82" stroke-width="1.4"/>

</g>
<g id="Units_Product_A_Units_B_Units">
  <rect class="classCard" x="574" y="829" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="754" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="754" y="867" text-anchor="middle">Units Product</text>
<text class="classTitle" x="754" y="889" text-anchor="middle">A_Units_B_Units</text>
  <line x1="574" y1="893" x2="934" y2="893" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="608" y="926">+left: Measure~A~</text>
<text class="member" x="608" y="943">+right: Measure~B~</text>
</g>
<g id="Units_Ratio_N_Units_D_Units">
  <rect class="classCard" x="118" y="995" width="380" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="308" y="1014" text-anchor="middle">class</text>
  <text class="classTitle" x="308" y="1033" text-anchor="middle">Units Ratio</text>
<text class="classTitle" x="308" y="1055" text-anchor="middle">N_Units_D_Units</text>
  <line x1="118" y1="1059" x2="498" y2="1059" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="152" y="1092">+numerator: Measure~N~</text>
<text class="member" x="152" y="1109">+denominator: Measure~D~</text>
</g>
<g id="Time">
  <rect class="classCard" x="508" y="631" width="360" height="146" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="688" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="678" text-anchor="middle">Time</text>
  <line x1="508" y1="687" x2="868" y2="687" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="542" y="719">+seconds</text>
<text class="member" x="542" y="736">+minutes</text>
<text class="member" x="542" y="753">+hours</text>
</g>
<g id="Length">
  <rect class="classCard" x="898" y="631" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1078" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="678" text-anchor="middle">Length</text>
  <line x1="898" y1="687" x2="1258" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="932" y="719">+meters</text>
<text class="member" x="932" y="736">+kilometers</text>
<text class="member" x="932" y="753">+centimeters</text>
</g>
<g id="UnitsRatio">
  <rect class="classCard" x="508" y="398" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">UnitsRatio</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#58A978" stroke-width="1.4"/>

</g>
<g id="Mass">
  <rect class="classCard" x="1288" y="631" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1468" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1468" y="678" text-anchor="middle">Mass</text>
  <line x1="1288" y1="687" x2="1648" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1322" y="719">+kilograms</text>
<text class="member" x="1322" y="736">+grams</text>
<text class="member" x="1322" y="753">+pounds</text>
</g>
<g id="UnitsProduct">
  <rect class="classCard" x="1288" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1468" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1468" y="445" text-anchor="middle">UnitsProduct</text>
  <line x1="1288" y1="454" x2="1648" y2="454" stroke="#D6A441" stroke-width="1.4"/>

</g>
<g>
  <rect x="1351" y="1195" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1369 1213 L1427 1213" stroke="#3E9868"/>
  <text class="detail" x="1441" y="1218">inheritance / implementation</text>
  <path class="dependency" d="M1369 1234 L1427 1234" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1441" y="1239">dependency / usage</text>
</g>
<g><rect x="180" y="1213" width="1126" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="743" y="1239" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
