    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="470" width="2088" height="234" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="498">Abstraction layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="864" width="2088" height="239" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="892">Implementation layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
