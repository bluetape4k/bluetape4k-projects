<g id="Units">
  <rect class="classBox" x="480" y="175" width="620" height="270" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stereo" x="790" y="201" text-anchor="middle">abstract class</text>
  <text class="classTitle" x="790" y="223" text-anchor="middle">Units</text>
  <path class="compartment" d="M480 247H1100"/>
  <text class="member" x="504" y="281">+ suffix: String</text>
<text class="member" x="504" y="305">+ ratio: Double</text>
<text class="member" x="504" y="329"># spaceBetweenMagnitude: Boolean</text>
  <path class="compartment" d="M480 362H1100"/>
  <text class="member" x="504" y="388">+ toString(): String</text>
<text class="member" x="504" y="412">+ equals(other): Boolean</text>
<text class="member" x="504" y="436">+ hashCode(): Int</text>
</g>
<g id="Measure">
  <rect class="classBox" x="1510" y="155" width="660" height="315" rx="8" fill="#F0FDFA" stroke="#0D9488"/>

  <text class="classTitle" x="1840" y="197" text-anchor="middle">Measure&lt;T: Units&gt;</text>
  <path class="compartment" d="M1510 227H2170"/>
  <text class="member" x="1534" y="261">+ amount: Double</text>
<text class="member" x="1534" y="285">+ units: T</text>
  <path class="compartment" d="M1510 318H2170"/>
  <text class="member" x="1534" y="344">+ as(other): Measure&lt;T&gt;</text>
<text class="member" x="1534" y="368">+ in(other): Double</text>
<text class="member" x="1534" y="392">+ plus/minus(other): Measure&lt;T&gt;</text>
<text class="member" x="1534" y="416">+ toHuman(): String</text>
<text class="member" x="1534" y="440">+ compareTo(other): Int</text>
</g>
<g id="UnitsProduct">
  <rect class="classBox" x="140" y="595" width="500" height="250" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>

  <text class="classTitle" x="390" y="637" text-anchor="middle">UnitsProduct&lt;A, B&gt;</text>
  <path class="compartment" d="M140 667H640"/>
  <text class="member" x="164" y="701">+ first: A</text>
<text class="member" x="164" y="725">+ second: B</text>
<text class="member" x="164" y="749">+ suffix: A*B</text>
<text class="member" x="164" y="773">+ ratio: A.ratio * B.ratio</text>
  <path class="compartment" d="M140 806H640"/>
  <text class="member" x="164" y="832">created by A.times(B)</text>
</g>
<g id="UnitsRatio">
  <rect class="classBox" x="720" y="595" width="500" height="250" rx="8" fill="#F0FDF4" stroke="#16A34A"/>

  <text class="classTitle" x="970" y="637" text-anchor="middle">UnitsRatio&lt;A, B&gt;</text>
  <path class="compartment" d="M720 667H1220"/>
  <text class="member" x="744" y="701">+ numerator: A</text>
<text class="member" x="744" y="725">+ denominator: B</text>
<text class="member" x="744" y="749">+ reciprocal: UnitsRatio&lt;B,A&gt;</text>
<text class="member" x="744" y="773">+ ratio: A.ratio / B.ratio</text>
  <path class="compartment" d="M720 806H1220"/>
  <text class="member" x="744" y="832">created by A.div(B)</text>
</g>
<g id="InverseUnits">
  <rect class="classBox" x="1300" y="595" width="500" height="250" rx="8" fill="#FFF7ED" stroke="#EA580C"/>

  <text class="classTitle" x="1550" y="637" text-anchor="middle">InverseUnits&lt;T&gt;</text>
  <path class="compartment" d="M1300 667H1800"/>
  <text class="member" x="1324" y="701">+ unit: T</text>
<text class="member" x="1324" y="725">+ suffix: 1/unit</text>
<text class="member" x="1324" y="749">+ ratio: 1.0 / unit.ratio</text>
  <path class="compartment" d="M1300 782H1800"/>
  <text class="member" x="1324" y="808">represents reciprocal unit</text>
</g>
<g id="ConcreteUnits">
  <rect class="classBox" x="140" y="1020" width="980" height="330" rx="8" fill="#EFF6FF" stroke="#2563EB"/>

  <text class="classTitle" x="630" y="1062" text-anchor="middle">Open Units subclasses</text>
  <path class="compartment" d="M140 1092H1120"/>
  <text class="member" x="164" y="1126">Length, Time, Mass</text>
<text class="member" x="164" y="1150">Area, Volume, GraphicsLength</text>
<text class="member" x="164" y="1174">Storage, BinarySize, Frequency</text>
<text class="member" x="164" y="1198">Energy, Power, Pressure</text>
  <path class="compartment" d="M140 1231H1120"/>
  <text class="member" x="164" y="1257">companion constants keep suffix and ratio</text>
<text class="member" x="164" y="1281">Number extension functions create Measure&lt;T&gt;</text>
<text class="member" x="164" y="1305">toHuman() picks practical display units</text>
</g>
<g id="TemperatureModel">
  <rect class="classBox" x="1960" y="1020" width="500" height="300" rx="8" fill="#FFF7ED" stroke="#EA580C"/>

  <text class="classTitle" x="2210" y="1062" text-anchor="middle">Temperature model</text>
  <path class="compartment" d="M1960 1092H2460"/>
  <text class="member" x="1984" y="1126">TemperatureUnit enum</text>
<text class="member" x="1984" y="1150">TemperatureDelta value class</text>
<text class="member" x="1984" y="1174">Kelvin / Celsius / Fahrenheit</text>
  <path class="compartment" d="M1960 1207H2460"/>
  <text class="member" x="1984" y="1233">inKelvin()</text>
<text class="member" x="1984" y="1257">inCelsius()</text>
<text class="member" x="1984" y="1281">toHuman(unit)</text>
</g>
<g id="MotionAliases">
  <rect class="note" x="1230" y="1035" width="620" height="145" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="noteTitle" x="1252" y="1073">Motion aliases</text>
  <text class="noteLine" x="1252" y="1107">Velocity = UnitsRatio&lt;Length, Time&gt;</text>
<text class="noteLine" x="1252" y="1131">Acceleration = UnitsRatio&lt;Length, Square&lt;Time&gt;&gt;</text>
<text class="noteLine" x="1252" y="1155">MotionUnits builds m/s, km/hr, and m/s^2 from unit operators</text>
</g>
<g id="OperatorSurface">
  <rect class="note" x="1900" y="595" width="520" height="250" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="noteTitle" x="1922" y="633">Operator surface</text>
  <text class="noteLine" x="1922" y="667">Number * Units -&gt; Measure&lt;T&gt;</text>
<text class="noteLine" x="1922" y="691">A * B -&gt; UnitsProduct&lt;A,B&gt;</text>
<text class="noteLine" x="1922" y="715">A / B -&gt; UnitsRatio&lt;A,B&gt;</text>
<text class="noteLine" x="1922" y="739">Measure operators preserve generic unit type</text>
</g>
