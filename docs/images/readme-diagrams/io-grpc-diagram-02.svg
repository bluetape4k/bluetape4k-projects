<svg data-intent="Explain gRPC component overview by separating server/client abstractions, managed channel support, in-process testing variants, interceptors, and concrete transport runtime." data-evidence="io/grpc/README.md; io/grpc/src/main/kotlin/io/bluetape4k/grpc" data-source-read="io/grpc/README.md; io/grpc/src/main/kotlin/io/bluetape4k/grpc" xmlns="http://www.w3.org/2000/svg" width="1808" height="1158" viewBox="0 0 1808 1158" role="img" aria-label="gRPC Component Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1808" height="1158"/>
<rect class="frame" x="34" y="30" width="1740" height="1098" rx="8"/>
<text class="title" x="72" y="84">gRPC Component Overview</text>
<text class="subtitle" x="76" y="116">Core server/client abstractions stay separate from managed channels, interceptors, and in-process test variants.</text>
<g><rect class="panel" x="82" y="160" width="1644" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Application boundary</text></g>
<g id="serverApp">
  <rect class="card" x="146" y="256" width="330" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="311" y="291" text-anchor="middle" dominant-baseline="middle">Service implementation</text>
  <text class="detail" x="311" y="321" text-anchor="middle" dominant-baseline="middle">binds generated gRPC service</text>
</g>
<g id="clientApp">
  <rect class="card" x="1372" y="256" width="290" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1517" y="291" text-anchor="middle" dominant-baseline="middle">Client caller</text>
  <text class="detail" x="1517" y="321" text-anchor="middle" dominant-baseline="middle">uses typed stub/client</text>
</g>
<g><rect class="panel" x="82" y="478" width="1644" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">bluetape4k gRPC support</text></g>
<g id="server">
  <rect class="card" x="146" y="574" width="390" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="341" y="609" text-anchor="middle" dominant-baseline="middle">GrpcServer / AbstractGrpcServer</text>
  <text class="detail" x="341" y="639" text-anchor="middle" dominant-baseline="middle">lifecycle and port management</text>
</g>
<g id="interceptor">
  <rect class="card" x="578" y="574" width="320" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="738" y="609" text-anchor="middle" dominant-baseline="middle">Interceptor support</text>
  <text class="detail" x="738" y="639" text-anchor="middle" dominant-baseline="middle">metadata and call hooks</text>
</g>
<g id="client">
  <rect class="card" x="940" y="574" width="320" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1100" y="609" text-anchor="middle" dominant-baseline="middle">AbstractGrpcClient</text>
  <text class="detail" x="1100" y="639" text-anchor="middle" dominant-baseline="middle">stub/channel owner</text>
</g>
<g id="channel">
  <rect class="card" x="1302" y="574" width="360" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1482" y="609" text-anchor="middle" dominant-baseline="middle">ManagedChannelSupport</text>
  <text class="detail" x="1482" y="639" text-anchor="middle" dominant-baseline="middle">channel creation/shutdown</text>
</g>
<g><rect class="panel" x="82" y="796" width="1644" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Runtime and tests</text></g>
<g id="runtime">
  <rect class="card" x="146" y="892" width="360" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="326" y="927" text-anchor="middle" dominant-baseline="middle">gRPC transport runtime</text>
  <text class="detail" x="326" y="957" text-anchor="middle" dominant-baseline="middle">server channel + client calls</text>
</g>
<g id="inprocess">
  <rect class="card" x="1332" y="892" width="330" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1497" y="927" text-anchor="middle" dominant-baseline="middle">In-process variants</text>
  <text class="detail" x="1497" y="957" text-anchor="middle" dominant-baseline="middle">fast server/client tests</text>
</g>
<path class="route" data-from="serverApp" data-to="server" d="M383 340 L383 435 L413 435 L413 574" stroke="#1D4ED8"/>
<path class="route" data-from="clientApp" data-to="client" d="M1517 340 L1517 446 L1100 446 L1100 574" stroke="#15803D"/>
<path class="route" data-from="client" data-to="channel" d="M1260 616 L1302 616" stroke="#C2410C"/>
<path class="route" data-from="server" data-to="runtime" d="M214 658 L214 892" stroke="#0F766E"/>
<path class="route" data-from="channel" data-to="runtime" d="M1482 658 L1482 797 L441 797 L441 892" stroke="#7E22CE"/>
<path class="route dashed" data-from="interceptor" data-to="server" d="M578 616 L536 616" stroke="#BE185D"/>
<path class="route dashed" data-from="interceptor" data-to="client" d="M898 616 L940 616" stroke="#BE185D"/>
<path class="route" data-from="server" data-to="inprocess" d="M466 658 L1391 892" stroke="#4D7C0F"/>
<path class="route" data-from="client" data-to="inprocess" d="M1100 658 L1603 892" stroke="#4D7C0F"/>
</svg>
