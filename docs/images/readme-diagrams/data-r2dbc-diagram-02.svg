<g><text class="label" x="545" y="225" text-anchor="middle">databaseClient</text><text class="label" x="1270" y="183" text-anchor="middle">entityTemplate</text><text class="label" x="1268" y="339" text-anchor="middle">mappingConverter</text><text class="label" x="495" y="556" text-anchor="middle">filters</text><text class="label" x="302" y="718" text-anchor="middle">builds</text><text class="label" x="1415" y="830" text-anchor="middle">fetch()</text></g>
