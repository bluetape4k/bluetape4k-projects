<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="900" viewBox="0 0 1580 900" role="img" aria-label="R2DBC Core API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inheritArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A;paint-order:stroke;stroke:#F7FBFF;stroke-width:5px;stroke-linejoin:round}
    .card,.classCard{filter:url(#shadow);stroke-width:2}.cardTitle,.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:13px;fill:#102033}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .note{stroke-width:1.6}.flow{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1580" height="900"/>
<rect class="frame" x="32" y="28" width="1516" height="844" rx="30"/>
<text class="title" x="68" y="84">R2DBC Core API Structure</text>
<text class="subtitle" x="72" y="116">Entry points, query builders, binding helpers, and coroutine fetch extensions are placed by call proximity.</text>
<path class="inherit" data-from="R2dbcClient" data-to="ExecuteDsl" d="M270 342 L270 410" stroke="#3E9868"/>
<path class="dependency" data-from="QueryBuilder" data-to="Query" d="M735 342 L735 410" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ExecuteDsl" data-to="Query" d="M430 476 L575 476" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Query" data-to="BindSpecExtensions" d="M895 476 L1015 476" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="BindSpecExtensions" data-to="DatabaseClientExtensions" d="M1220 430 L1220 368" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="R2dbcClient">
  <rect class="classCard" x="110" y="210" width="320" height="132" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <path d="M110 280 L430 280" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="stereo" x="270" y="232" text-anchor="middle">class</text>
  <text class="classTitle" x="270" y="260" text-anchor="middle">R2dbcClient</text>
  <text class="member" x="144" y="303">wraps DatabaseClient</text>
<text class="member" x="144" y="323">execute(sql) / execute(query)</text>
</g>
<g id="ExecuteDsl">
  <rect class="classCard" x="110" y="410" width="320" height="132" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <path d="M110 480 L430 480" stroke="#58A978" stroke-width="1.4"/>
  <text class="stereo" x="270" y="432" text-anchor="middle">extension functions</text>
  <text class="classTitle" x="270" y="460" text-anchor="middle">Execute DSL</text>
  <text class="member" x="144" y="503">execute(sqlString)</text>
<text class="member" x="144" y="523">execute(query: Query)</text>
</g>
<g id="QueryBuilder">
  <rect class="classCard" x="575" y="210" width="320" height="132" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <path d="M575 280 L895 280" stroke="#D6A441" stroke-width="1.4"/>
  <text class="stereo" x="735" y="232" text-anchor="middle">builder class</text>
  <text class="classTitle" x="735" y="260" text-anchor="middle">QueryBuilder</text>
  <text class="member" x="609" y="303">select / where / orderBy</text>
<text class="member" x="609" y="323">build(): Query</text>
</g>
<g id="Query">
  <rect class="classCard" x="575" y="410" width="320" height="132" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <path d="M575 480 L895 480" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="stereo" x="735" y="432" text-anchor="middle">data class</text>
  <text class="classTitle" x="735" y="460" text-anchor="middle">Query</text>
  <text class="member" x="609" y="503">sql: String</text>
<text class="member" x="609" y="523">parameters: Map&lt;String, Any?&gt;</text>
</g>
<g id="DatabaseClientExtensions">
  <rect class="classCard" x="1015" y="210" width="410" height="158" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <path d="M1015 280 L1425 280" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="stereo" x="1220" y="232" text-anchor="middle">coroutine fetch API</text>
  <text class="classTitle" x="1220" y="260" text-anchor="middle">DatabaseClientExtensions</text>
  <text class="member" x="1049" y="306">flow(mapper)</text>
<text class="member" x="1049" y="326">awaitSingle / awaitList</text>
<text class="member" x="1049" y="346">awaitExists / awaitCount</text>
</g>
<g id="BindSpecExtensions">
  <rect class="classCard" x="1015" y="430" width="410" height="132" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <path d="M1015 500 L1425 500" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="stereo" x="1220" y="452" text-anchor="middle">binding helpers</text>
  <text class="classTitle" x="1220" y="480" text-anchor="middle">BindSpecExtensions</text>
  <text class="member" x="1049" y="523">bindMap(params)</text>
<text class="member" x="1049" y="543">bindIndexedMap(params)</text>
</g>
<g id="r2dbcIntent">
  <rect class="note" x="340" y="650" width="900" height="70" rx="12" fill="#FFFFFF" stroke="#9AA8B8"/>
  <text class="detail" x="790" y="686" text-anchor="middle" dominant-baseline="middle">Flow: QueryBuilder builds Query; Execute DSL uses Query; BindSpec feeds DatabaseClient fetch extensions.</text>
</g>
<g><rect class="note" x="120" y="812" width="1340" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF"/><text class="detail" x="790" y="838" text-anchor="middle">bluetape4k-projects / data:r2dbc - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
