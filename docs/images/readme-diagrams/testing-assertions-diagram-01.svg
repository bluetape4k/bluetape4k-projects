<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="32"/>
<text class="title" x="72" y="84">Assertions Capability Architecture</text>
<text class="subtitle" x="76" y="116">Public assertion DSLs stay reader-facing while coroutine assertions and the internal failure engine explain how errors are produced.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Test code</text></g>
