<svg data-intent="Explain testing assertions as public assertion DSL families backed by coroutine assertions and a shared internal failure/message engine that raises AssertionError." data-evidence="testing/assertions/README.md; testing/assertions/src/main/kotlin/io/bluetape4k/assertions" data-source-read="testing/assertions/README.md; testing/assertions/src/main/kotlin/io/bluetape4k/assertions" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Assertions Capability Architecture">
