<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="2136" viewBox="0 0 1960 2136" role="img" aria-label="Coroutines Async File I/O Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="2136"/>
<rect class="frame" x="32" y="28" width="1896" height="2080" rx="28"/>
<text class="title" x="66" y="82">Coroutines Async File I/O Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Coroutine</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2076" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="198.5" text-anchor="middle">Buffered Suspended</text>
<text class="smallLabel" x="560" y="219.5" text-anchor="middle">Sink</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="2076" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="198.5" text-anchor="middle">Real Buffered</text>
<text class="smallLabel" x="980" y="219.5" text-anchor="middle">Suspended Sink</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="2076" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="198.5" text-anchor="middle">Suspended File</text>
<text class="smallLabel" x="1400" y="219.5" text-anchor="middle">Channel Sink</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="2076" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="198.5" text-anchor="middle">Asynchronous File</text>
<text class="smallLabel" x="1820" y="219.5" text-anchor="middle">Channel</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="2076" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="227" y="286" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="245" y="313" text-anchor="start">1. write(buffer) [suspend]</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="647" y="396" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="665" y="423" text-anchor="start">2. write(buffer) [suspend]</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="917" y="506" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="935" y="533" text-anchor="start">3. Accumulate in buffer</text>
<path class="line" d="M980 564 C1044 564 1044 598 980 598"/>
<rect x="245" y="636" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="663" text-anchor="start">4. emit() [suspend]</text>
<path class="line" d="M140 694 L560 694"/>
<rect x="665" y="746" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="773" text-anchor="start">5. emit() [suspend]</text>
<path class="line" d="M560 804 L980 804"/>
<rect x="1022.5" y="856" width="335" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1040.5" y="883" text-anchor="start">6. write(buffer, byteCount) [suspend]</text>
<path class="line" d="M980 914 L1400 914"/>
<rect x="1471" y="966" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1489" y="993" text-anchor="start">7. write(ByteBuffer, position)</text>
<path class="line" d="M1400 1024 L1820 1024"/>
<rect x="1505" y="1076" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="1103" text-anchor="start">8. bytesWritten</text>
<path class="dashed" d="M1820 1134 L1400 1134"/>
<rect x="1085" y="1186" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1213" text-anchor="start">9. Complete</text>
<path class="dashed" d="M1400 1244 L980 1244"/>
<rect x="455" y="1296" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="473" y="1323" text-anchor="start">10. Complete</text>
<path class="dashed" d="M980 1354 L140 1354"/>
<rect x="245" y="1406" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="1433" text-anchor="start">11. close() [suspend]</text>
<path class="line" d="M140 1464 L560 1464"/>
<rect x="665" y="1516" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="1543" text-anchor="start">12. close() [suspend]</text>
<path class="line" d="M560 1574 L980 1574"/>
<rect x="1085" y="1626" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1653" text-anchor="start">13. flush() [suspend]</text>
<path class="line" d="M980 1684 L1400 1684"/>
<rect x="1505" y="1736" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="1763" text-anchor="start">14. force(false)</text>
<path class="line" d="M1400 1794 L1820 1794"/>
<rect x="1085" y="1846" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="1873" text-anchor="start">15. close() [suspend]</text>
<path class="line" d="M980 1904 L1400 1904"/>
<rect x="1505" y="1956" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1523" y="1983" text-anchor="start">16. close()</text>
<path class="line" d="M1400 2014 L1820 2014"/>
</svg>
