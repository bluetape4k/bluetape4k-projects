<svg xmlns="http://www.w3.org/2000/svg" width="1468" height="1594" viewBox="0 0 1468 1594" role="img" aria-label="compress/decompress Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1468" height="1594"/>
<rect class="frame" x="32" y="28" width="1404" height="1538" rx="28"/>
<text class="title" x="66" y="82">compress/decompress Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1534" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="584" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="734" y="209" text-anchor="middle">AbstractCompressor</text>
<line class="lifeline" x1="734" y1="252" x2="734" y2="1534" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1088" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1238" y="198.5" text-anchor="middle">Implementation</text>
<text class="smallLabel" x="1238" y="219.5" text-anchor="middle">(e.g.</text>
<line class="lifeline" x1="1238" y1="252" x2="1238" y2="1534" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="343" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="361" y="313" text-anchor="start">1. compress(plain: ByteArray?)</text>
<path class="line" d="M230 332 L734 332"/>
<rect x="643" y="362" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="661" y="389" text-anchor="start">2. check plain.isNullOrEmpty()</text>
<path class="line" d="M734 408 C798 408 798 442 734 442"/>
<rect x="160" y="526" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="553" text-anchor="start">ALT: null or empty</text>
<rect x="377" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="465" text-anchor="start">4. emptyByteArray</text>
<path class="dashed" d="M734 484 L230 484"/>
<rect x="160" y="704" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="731" text-anchor="start">ELSE: valid data</text>
<rect x="881" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="899" y="541" text-anchor="start">6. doCompress(plain)</text>
<path class="line" d="M734 560 L1238 560"/>
<rect x="160" y="882" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="909" text-anchor="start">ALT: success</text>
<rect x="871" y="590" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="889" y="617" text-anchor="start">8. compressed: ByteArray</text>
<path class="dashed" d="M1238 636 L734 636"/>
<rect x="377" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="693" text-anchor="start">9. compressed</text>
<path class="dashed" d="M734 712 L230 712"/>
<rect x="160" y="1170" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1197" text-anchor="start">ELSE: failure</text>
<rect x="718" y="742" width="536" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="736" y="769" text-anchor="start">11. IOException / IllegalArgumentException / library exception</text>
<path class="dashed" d="M1238 788 L734 788"/>
<rect x="363" y="818" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="381" y="845" text-anchor="start">12. throws same exception</text>
<path class="dashed" d="M734 864 L230 864"/>
<rect x="310.5" y="894" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="328.5" y="921" text-anchor="start">13. decompress(compressed: ByteArray?)</text>
<path class="line" d="M230 940 L734 940"/>
<rect x="618.5" y="970" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="636.5" y="997" text-anchor="start">14. check compressed.isNullOrEmpty()</text>
<path class="line" d="M734 1016 C798 1016 798 1050 734 1050"/>
<rect x="160" y="1698" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1725" text-anchor="start">ALT: null or empty</text>
<rect x="377" y="1046" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="1073" text-anchor="start">16. emptyByteArray</text>
<path class="dashed" d="M734 1092 L230 1092"/>
<rect x="160" y="1876" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1903" text-anchor="start">ELSE: valid data</text>
<rect x="855" y="1122" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="873" y="1149" text-anchor="start">18. doDecompress(compressed)</text>
<path class="line" d="M734 1168 L1238 1168"/>
<rect x="160" y="2054" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="2081" text-anchor="start">ALT: success</text>
<rect x="881" y="1198" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="899" y="1225" text-anchor="start">20. plain: ByteArray</text>
<path class="dashed" d="M1238 1244 L734 1244"/>
<rect x="377" y="1274" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="395" y="1301" text-anchor="start">21. plain</text>
<path class="dashed" d="M734 1320 L230 1320"/>
<rect x="160" y="2342" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="2369" text-anchor="start">ELSE: failure</text>
<rect x="718" y="1350" width="536" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="736" y="1377" text-anchor="start">23. IOException / IllegalArgumentException / library exception</text>
<path class="dashed" d="M1238 1396 L734 1396"/>
<rect x="363" y="1426" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="381" y="1453" text-anchor="start">24. throws same exception</text>
<path class="dashed" d="M734 1472 L230 1472"/>
</svg>
