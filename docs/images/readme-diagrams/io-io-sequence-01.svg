<svg xmlns="http://www.w3.org/2000/svg" width="1288" height="2700" viewBox="0 0 1288 2700" role="img" aria-label="compress/decompress Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1288" height="2700"/>
<rect class="frame" x="32" y="28" width="1224" height="2644" rx="28"/>
<text class="title" x="66" y="82">compress/decompress Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="494" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="644" y="209" text-anchor="middle">AbstractCompressor</text>
<line class="lifeline" x1="644" y1="252" x2="644" y2="2640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="998" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1148" y="198.5" text-anchor="middle">Implementation</text>
<text class="smallLabel" x="1148" y="219.5" text-anchor="middle">(e.g.</text>
<line class="lifeline" x1="1148" y1="252" x2="1148" y2="2640" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="253" y="286" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="271" y="313" text-anchor="start">1. compress(plain: ByteArray?)</text>
<path class="line" d="M140 344 L644 344"/>
<rect x="553" y="396" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="571" y="423" text-anchor="start">2. check plain.isNullOrEmpty()</text>
<path class="line" d="M644 454 C708 454 708 488 644 488"/>
<rect x="70" y="526" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="553" text-anchor="start">ALT: null or empty</text>
<rect x="287" y="594" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="621" text-anchor="start">4. emptyByteArray</text>
<path class="dashed" d="M644 652 L140 652"/>
<rect x="70" y="704" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="731" text-anchor="start">ELSE: valid data</text>
<rect x="791" y="772" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="799" text-anchor="start">6. doCompress(plain)</text>
<path class="line" d="M644 830 L1148 830"/>
<rect x="70" y="882" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="909" text-anchor="start">ALT: success</text>
<rect x="781" y="950" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="799" y="977" text-anchor="start">8. compressed: ByteArray</text>
<path class="dashed" d="M1148 1008 L644 1008"/>
<rect x="287" y="1060" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="1087" text-anchor="start">9. compressed</text>
<path class="dashed" d="M644 1118 L140 1118"/>
<rect x="70" y="1170" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1197" text-anchor="start">ELSE: failure</text>
<rect x="628" y="1238" width="536" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="646" y="1265" text-anchor="start">11. IOException / IllegalArgumentException / library exception</text>
<path class="dashed" d="M1148 1296 L644 1296"/>
<rect x="273" y="1348" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="291" y="1375" text-anchor="start">12. throws same exception</text>
<path class="dashed" d="M644 1406 L140 1406"/>
<rect x="220.5" y="1458" width="343" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="238.5" y="1485" text-anchor="start">13. decompress(compressed: ByteArray?)</text>
<path class="line" d="M140 1516 L644 1516"/>
<rect x="528.5" y="1568" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="546.5" y="1595" text-anchor="start">14. check compressed.isNullOrEmpty()</text>
<path class="line" d="M644 1626 C708 1626 708 1660 644 1660"/>
<rect x="70" y="1698" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1725" text-anchor="start">ALT: null or empty</text>
<rect x="287" y="1766" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="1793" text-anchor="start">16. emptyByteArray</text>
<path class="dashed" d="M644 1824 L140 1824"/>
<rect x="70" y="1876" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1903" text-anchor="start">ELSE: valid data</text>
<rect x="765" y="1944" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="783" y="1971" text-anchor="start">18. doDecompress(compressed)</text>
<path class="line" d="M644 2002 L1148 2002"/>
<rect x="70" y="2054" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="2081" text-anchor="start">ALT: success</text>
<rect x="791" y="2122" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="809" y="2149" text-anchor="start">20. plain: ByteArray</text>
<path class="dashed" d="M1148 2180 L644 2180"/>
<rect x="287" y="2232" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="305" y="2259" text-anchor="start">21. plain</text>
<path class="dashed" d="M644 2290 L140 2290"/>
<rect x="70" y="2342" width="1148" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="2369" text-anchor="start">ELSE: failure</text>
<rect x="628" y="2410" width="536" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="646" y="2437" text-anchor="start">23. IOException / IllegalArgumentException / library exception</text>
<path class="dashed" d="M1148 2468 L644 2468"/>
<rect x="273" y="2520" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="291" y="2547" text-anchor="start">24. throws same exception</text>
<path class="dashed" d="M644 2578 L140 2578"/>
</svg>
