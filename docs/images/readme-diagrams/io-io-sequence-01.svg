<svg data-intent="Show the source-backed compressor API flow for throwing and nullable compression calls." data-evidence="io/io/README.md; AbstractCompressor.kt; Compressor.kt" xmlns="http://www.w3.org/2000/svg" width="1420" height="1060" viewBox="0 0 1420 1060" role="img" aria-label="compress decompress Flow">
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#4F83BF" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#3E9868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#2E8F89" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#B9851B" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2 L12 7 L2 12 Z" fill="#C94D68" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .actor{stroke-width:2}.actorTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.actorNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .lifeline{stroke:#A7B4C3;stroke-width:1.7;stroke-dasharray:8 8}.activation{stroke-width:1.5}
    .seq{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.ret{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 7}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .alt{fill:#FFFFFF;fill-opacity:.12;stroke-width:2;stroke-dasharray:9 8}.altTitle{font-family:"Architects Daughter";font-size:20px;fill:#22344A}.altNote{font-family:"Comic Mono";font-size:12px;fill:#536476}
  </style>
</defs>
<rect class="canvas" width="1420" height="1060"/>
<rect class="frame" x="30" y="28" width="1360" height="1004" rx="30"/>
<text class="title" x="70" y="86">compress/decompress Flow</text>
<text class="subtitle" x="74" y="118">Throwing APIs return empty bytes for empty input; nullable APIs return null for empty input or codec failure.</text>

<g id="caller"><rect class="actor" x="126" y="166" width="220" height="76" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="actorTitle" x="236" y="204" text-anchor="middle">Caller</text><text class="actorNote" x="236" y="226" text-anchor="middle">ByteArray/String wrappers</text><line class="lifeline" x1="236" y1="242" x2="236" y2="962"/></g>
<g id="abstract"><rect class="actor" x="600" y="166" width="220" height="76" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="actorTitle" x="710" y="204" text-anchor="middle">AbstractCompressor</text><text class="actorNote" x="710" y="226" text-anchor="middle">owns input checks</text><line class="lifeline" x1="710" y1="242" x2="710" y2="962"/></g>
<g id="codec"><rect class="actor" x="1074" y="166" width="220" height="76" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="actorTitle" x="1184" y="204" text-anchor="middle">Codec implementation</text><text class="actorNote" x="1184" y="226" text-anchor="middle">LZ4 / Snappy / Zstd / Zip</text><line class="lifeline" x1="1184" y1="242" x2="1184" y2="962"/></g>

<rect class="activation" x="228" y="322" width="16" height="542" rx="5" fill="#E8F3FF" stroke="#4F83BF"/>
<rect class="activation" x="702" y="362" width="16" height="462" rx="5" fill="#EAF7EF" stroke="#3E9868"/>
<rect class="activation" x="1176" y="516" width="16" height="136" rx="5" fill="#FFF5E6" stroke="#B9851B"/>

<g id="throwing">
  <rect class="alt" x="92" y="292" width="1236" height="392" rx="16" stroke="#3E9868"/>
  <rect class="pill" x="310" y="278" width="178" height="28" rx="7"/><text class="altTitle" x="399" y="298" text-anchor="middle">throwing API</text>
  <text class="altNote" x="532" y="320">compress() and decompress() propagate implementation failures to the caller.</text>
</g>
<g id="m1"><rect class="pill" x="322" y="344" width="260" height="28" rx="7"/><text class="label" x="452" y="362" text-anchor="middle">compress/decompress(bytes?)</text><path class="seq" d="M244 386 H710" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m2"><rect class="pill" x="792" y="404" width="238" height="28" rx="7"/><text class="label" x="911" y="422" text-anchor="middle">null or empty?</text><path class="seq" d="M718 452 H1010 V478 H728" stroke="#3E9868" marker-end="url(#arrow-green)"/></g>
<g id="m3"><rect class="pill" x="322" y="474" width="208" height="28" rx="7"/><text class="label" x="426" y="492" text-anchor="middle">emptyByteArray</text><path class="ret" d="M710 514 H236" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
<g id="m4"><rect class="pill" x="840" y="534" width="234" height="28" rx="7"/><text class="label" x="957" y="552" text-anchor="middle">doCompress/doDecompress</text><path class="seq" d="M718 576 H1184" stroke="#B9851B" marker-end="url(#arrow-amber)"/></g>
<g id="m5"><rect class="pill" x="840" y="608" width="234" height="28" rx="7"/><text class="label" x="957" y="626" text-anchor="middle">ByteArray or exception</text><path class="ret" d="M1184 660 H710" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>
<g id="m6"><rect class="pill" x="322" y="638" width="226" height="28" rx="7"/><text class="label" x="435" y="656" text-anchor="middle">return bytes / throw</text><path class="ret" d="M710 676 H236" stroke="#C94D68" marker-end="url(#arrow-pink)"/></g>

<g id="nullable">
  <rect class="alt" x="92" y="728" width="1236" height="180" rx="16" stroke="#2E8F89"/>
  <rect class="pill" x="310" y="714" width="176" height="28" rx="7"/><text class="altTitle" x="398" y="734" text-anchor="middle">nullable API</text>
  <text class="altNote" x="532" y="756">compressOrNull() and decompressOrNull() rethrow cancellation but turn ordinary failures into null.</text>
</g>
<g id="m7"><rect class="pill" x="306" y="780" width="292" height="28" rx="7"/><text class="label" x="452" y="798" text-anchor="middle">compressOrNull/decompressOrNull</text><path class="seq" d="M244 824 H710" stroke="#4F83BF" marker-end="url(#arrow-blue)"/></g>
<g id="m8"><rect class="pill" x="802" y="842" width="218" height="28" rx="7"/><text class="label" x="911" y="860" text-anchor="middle">empty or failure => null</text><path class="ret" d="M710 886 H236" stroke="#2E8F89" marker-end="url(#arrow-teal)"/></g>
</svg>
