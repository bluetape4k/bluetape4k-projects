<path class="dashed" d="M900 638 L520 638"/>
<rect x="158" y="680" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="707" text-anchor="start">6. compressed</text>
<path class="dashed" d="M520 720 L140 720"/>
<rect x="538" y="762" width="344" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554" y="789" text-anchor="start">7. IOException / IllegalArgumentException / library</text>
<text class="strong" x="554" y="812" text-anchor="start">exception</text>
<path class="dashed" d="M900 802 L520 802"/>
<rect x="158" y="844" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="871" text-anchor="start">8. throws same exception</text>
<path class="dashed" d="M520 884 L140 884"/>
<rect x="158" y="926" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="953" text-anchor="start">9. decompress(compressed: ByteArray?)</text>
<path class="line" d="M140 966 L520 966"/>
<rect x="538" y="1008" width="190" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554" y="1035" text-anchor="start">10. check</text>
<text class="strong" x="554" y="1058" text-anchor="start">compressed.is Null Or</text>
<path class="line" d="M520 1048 L520 1048"/>
<rect x="158" y="1090" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1117" text-anchor="start">11. emptyByteArray</text>
<path class="dashed" d="M520 1130 L140 1130"/>
<rect x="538" y="1172" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554" y="1199" text-anchor="start">12. doDecompress(compressed)</text>
<path class="line" d="M520 1212 L900 1212"/>
<rect x="538" y="1254" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554" y="1281" text-anchor="start">13. plain: ByteArray</text>
<path class="dashed" d="M900 1294 L520 1294"/>
<rect x="158" y="1336" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1363" text-anchor="start">14. plain</text>
<path class="dashed" d="M520 1376 L140 1376"/>
<rect x="538" y="1418" width="344" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="554" y="1445" text-anchor="start">15. IOException / IllegalArgumentException / library</text>
<text class="strong" x="554" y="1468" text-anchor="start">exception</text>
<path class="dashed" d="M900 1458 L520 1458"/>
<rect x="158" y="1500" width="344" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1527" text-anchor="start">16. throws same exception</text>
<path class="dashed" d="M520 1540 L140 1540"/>
</svg>
