<g id="nullable">
  <rect class="alt" x="92" y="728" width="1236" height="180" rx="16" stroke="#2E8F89"/>
  <rect class="pill" x="310" y="714" width="176" height="28" rx="7"/><text class="altTitle" x="398" y="734" text-anchor="middle">nullable API</text>
  <text class="altNote" x="532" y="756">compressOrNull() and decompressOrNull() rethrow cancellation but turn ordinary failures into null.</text>
</g>
