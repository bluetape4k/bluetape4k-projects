<svg data-intent="Explain Flow extension taxonomy by showing how collection-style batching, concurrency, replay/subject helpers, and test collectors sit around the Flow receiver." data-evidence="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines/flow" data-source-read="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines/flow" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Flow extension taxonomy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="32"/>
<text class="title" x="72" y="84">Flow extension taxonomy</text>
<text class="subtitle" x="76" y="116">Flow helpers are grouped by the reader's operation intent instead of listed as an unconnected catalog.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Receiver</text></g>
<g id="flow">
  <rect class="card" x="590" y="256" width="320" height="84" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="750" y="291" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt;</text>
  <text class="detail" x="750" y="321" text-anchor="middle" dominant-baseline="middle">cold stream receiver</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Operation families</text></g>
<g id="batch">
  <rect class="card" x="146" y="574" width="300" height="84" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="296" y="609" text-anchor="middle" dominant-baseline="middle">Batch and window</text>
  <text class="detail" x="296" y="639" text-anchor="middle" dominant-baseline="middle">chunked, windowed, sliding</text>
</g>
<g id="parallel">
  <rect class="card" x="600" y="574" width="300" height="84" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Parallel transform</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">mapParallel, flatMap</text>
</g>
<g id="replay">
  <rect class="card" x="1054" y="574" width="300" height="84" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1204" y="609" text-anchor="middle" dominant-baseline="middle">Replay / subject</text>
  <text class="detail" x="1204" y="639" text-anchor="middle" dominant-baseline="middle">publish, replay, share</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Terminal uses</text></g>
<g id="collect">
  <rect class="card" x="146" y="892" width="300" height="84" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="296" y="927" text-anchor="middle" dominant-baseline="middle">Collectors</text>
  <text class="detail" x="296" y="957" text-anchor="middle" dominant-baseline="middle">toList, assertions</text>
</g>
<g id="testing">
  <rect class="card" x="1024" y="892" width="330" height="84" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1189" y="927" text-anchor="middle" dominant-baseline="middle">Testing helpers</text>
  <text class="detail" x="1189" y="957" text-anchor="middle" dominant-baseline="middle">runTest and Flow assertions</text>
</g>
<path class="route" data-from="flow" data-to="parallel" d="M750 340 L750 574" stroke="#B9851B"/>
<path class="route" data-from="batch" data-to="collect" d="M368 658 L368 892" stroke="#2E8F89"/>
<path class="route" data-from="replay" data-to="testing" d="M1197 658 L1197 892" stroke="#755BC6"/>
</svg>
