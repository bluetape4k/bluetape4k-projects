<svg data-intent="Explain Flow extension taxonomy by showing how collection-style batching, concurrency, replay/subject helpers, and test collectors sit around the Flow receiver." data-evidence="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines/flow" data-source-read="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines/flow" xmlns="http://www.w3.org/2000/svg" width="1500" height="1114" viewBox="0 0 1500 1114" role="img" aria-label="Flow extension taxonomy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#1D4ED8"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#15803D"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#0F766E" stroke-dasharray="none"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#C2410C" stroke-dasharray="none"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#BE185D"/></marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#7E22CE" stroke-dasharray="none"/></marker>
  <marker id="arrow-olive" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#4D7C0F"/></marker>
  <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 13 7 L 1 13 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1114"/>
<rect class="frame" x="34" y="30" width="1432" height="1054" rx="8"/>
<text class="title" x="72" y="84">Flow extension taxonomy</text>
<text class="subtitle" x="76" y="116">Flow helpers are grouped by the reader's operation intent instead of listed as an unconnected catalog.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Receiver</text></g>
<g id="flow">
  <rect class="card" x="590" y="256" width="320" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="750" y="291" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt;</text>
  <text class="detail" x="750" y="321" text-anchor="middle" dominant-baseline="middle">cold stream receiver</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Operation families</text></g>
<g id="batch">
  <rect class="card" x="146" y="574" width="300" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="296" y="609" text-anchor="middle" dominant-baseline="middle">Batch and window</text>
  <text class="detail" x="296" y="639" text-anchor="middle" dominant-baseline="middle">chunked, windowed, sliding</text>
</g>
<g id="parallel">
  <rect class="card" x="600" y="574" width="300" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Parallel transform</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">mapParallel, flatMap</text>
</g>
<g id="replay">
  <rect class="card" x="1054" y="574" width="300" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1204" y="609" text-anchor="middle" dominant-baseline="middle">Replay / subject</text>
  <text class="detail" x="1204" y="639" text-anchor="middle" dominant-baseline="middle">publish, replay, share</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Terminal uses</text></g>
<g id="collect">
  <rect class="card" x="146" y="892" width="300" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="296" y="927" text-anchor="middle" dominant-baseline="middle">Collectors</text>
  <text class="detail" x="296" y="957" text-anchor="middle" dominant-baseline="middle">toList, assertions</text>
</g>
<g id="testing">
  <rect class="card" x="1024" y="892" width="330" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1189" y="927" text-anchor="middle" dominant-baseline="middle">Testing helpers</text>
  <text class="detail" x="1189" y="957" text-anchor="middle" dominant-baseline="middle">runTest and Flow assertions</text>
</g>
<path class="route" data-from="flow" data-to="parallel" d="M750 340 L750 574" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
<path class="route" data-from="batch" data-to="collect" d="M368 658 L368 892" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
<path class="route" data-from="replay" data-to="testing" d="M1197 658 L1197 892" stroke="#7E22CE" marker-end="url(#arrow-purple)"/>
</svg>
