<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1145" viewBox="0 0 1500 1145" role="img" aria-label="Module API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1145"/>
<rect class="frame" x="32" y="28" width="1436" height="1089" rx="30"/>
<text class="title" x="68" y="84">Module API Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="DocumentExtensions" data-to="MongoCollectionExtensions" data-route-color="teal" d="M472 311 L472 430 L550 430" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="AggregationSupport" data-to="MongoCollectionExtensions" data-route-color="amber" d="M735 311 L735 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MongoDatabaseExtensions" data-to="MongoCollectionExtensions" data-route-color="pink" d="M988 311 L988 430 L930 430" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MongoClientSupport" data-to="MongoClientProvider" data-route-color="purple" d="M340 742 L340 829" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="DocumentExtensions">
  <rect class="classCard" x="160" y="165" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="340" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="340" y="212" text-anchor="middle">DocumentExtensions</text>
  <line x1="160" y1="221" x2="520" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="194" y="253">+documentOf(vararg pairs):</text>
<text class="member" x="194" y="270">Document</text>
<text class="member" x="194" y="287">+documentOf(block): Document</text>
</g>
<g id="MongoCollectionExtensions">
  <rect class="classCard" x="550" y="398" width="380" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="740" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="740" y="445" text-anchor="middle">MongoCollectionExtensions</text>
  <line x1="550" y1="454" x2="930" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="584" y="486">+findFirst(filter): T?</text>
<text class="member" x="584" y="503">+findFirstOrNull(filter): T?</text>
<text class="member" x="584" y="520">+exists(filter): Boolean</text>
</g>
<g id="AggregationSupport">
  <rect class="classCard" x="550" y="165" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="730" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="730" y="212" text-anchor="middle">AggregationSupport</text>
  <line x1="550" y1="221" x2="910" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="584" y="253">+pipeline(block): List~Bson~</text>
<text class="member" x="584" y="270">+matchStage(filter): Bson</text>
<text class="member" x="584" y="287">+groupStage(id, accumulators):</text>
</g>
<g id="MongoClientProvider">
  <rect class="classCard" x="160" y="829" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="340" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="340" y="876" text-anchor="middle">MongoClientProvider</text>
  <line x1="160" y1="885" x2="520" y2="885" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="194" y="917">-cache: Map~String, MongoClient~</text>
<text class="member" x="194" y="934">+getOrCreate(connectionString):</text>
<text class="member" x="194" y="951">MongoClient</text>
</g>
<g id="MongoClientSupport">
  <rect class="classCard" x="160" y="596" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="340" y="615" text-anchor="middle">class</text>
  <text class="classTitle" x="340" y="643" text-anchor="middle">MongoClientSupport</text>
  <line x1="160" y1="652" x2="520" y2="652" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="194" y="684">+mongoClient(block): MongoClient</text>
<text class="member" x="194" y="701">+mongoClientOf(connectionString):</text>
<text class="member" x="194" y="718">MongoClient</text>
</g>
<g id="MongoDatabaseExtensions">
  <rect class="classCard" x="940" y="165" width="400" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1140" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1140" y="212" text-anchor="middle">MongoDatabaseExtensions</text>
  <line x1="940" y1="221" x2="1340" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="974" y="253">+MongoDatabase.getCollectionOf~T~(name):</text>
<text class="member" x="974" y="270">MongoCollection~T~</text>
<text class="member" x="974" y="287">+MongoDatabase.listCollectionNamesList():</text>
</g>
<g>
  <rect x="1085" y="1037" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1055 L1161 1055" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1060">inheritance / implementation</text>
  <path class="dependency" d="M1103 1076 L1161 1076" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1081">dependency / usage</text>
</g>
<g><rect x="180" y="1055" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1081" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
