e" x="1529.65" y="684" fill="#0F172A">to</text><text class="code" x="1542.75" y="684" fill="#0F172A"> </text><text class="code" x="1546.65" y="684" fill="#0F172A">value</text><text class="code" x="1579.4" y="684" fill="#64748B">)</text></g><g><text class="code" x="1443.2" y="711" fill="#0F172A">documentOf</text><text class="code" x="1508.7" y="711" fill="#0F172A"> </text><text class="code" x="1512.6000000000001" y="711" fill="#64748B">{</text><text class="code" x="1517.8500000000001" y="711" fill="#0F172A"> </text><text class="code" x="1521.7500000000002" y="711" fill="#2563EB">put</text><text class="code" x="1541.4000000000003" y="711" fill="#64748B">(...)</text><text class="code" x="1567.6500000000003" y="711" fill="#0F172A"> </text><text class="code" x="1571.5500000000004" y="711" fill="#64748B">}</text></g><g><text class="code" x="1441.2" y="738" fill="#7C3AED">Document</text><text class="code" x="1493.6000000000001" y="738" fill="#64748B">.</text><text class="code" x="1498.8500000000001" y="738" fill="#0F172A">getAs</text><text class="code" x="1531.6000000000001" y="738" fill="#64748B">&lt;</text><text class="code" x="1536.8500000000001" y="738" fill="#7C3AED">T</text><text class="code" x="1543.4" y="738" fill="#64748B">&gt;(</text><text class="code" x="1553.9" y="738" fill="#0F172A">key</text><text class="code" x="1573.5500000000002" y="738" fill="#64748B">)</text></g><g><text class="code" x="1441.25" y="765" fill="#0F172A">pipeline</text><text class="code" x="1493.65" y="765" fill="#0F172A"> </text><text class="code" x="1497.5500000000002" y="765" fill="#64748B">{</text><text class="code" x="1502.8000000000002" y="765" fill="#0F172A"> </text><text class="code" x="1506.7000000000003" y="765" fill="#2563EB">add</text><text class="code" x="1526.3500000000004" y="765" fill="#64748B">(</text><text class="code" x="1531.6000000000004" y="765" fill="#0F172A">stage</text><text class="code" x="1564.3500000000004" y="765" fill="#64748B">)</text><text class="code" x="1569.6000000000004" y="765" fill="#0F172A"> </text><text class="code" x="1573.5000000000005" y="765" fill="#64748B">}</text></g><g><text class="code" x="1424.175" y="792" fill="#0F172A">match</text><text class="code" x="1456.925" y="792" fill="#64748B">/</text><text class="code" x="1462.175" y="792" fill="#0F172A">group</text><text class="code" x="1494.925" y="792" fill="#64748B">/</text><text class="code" x="1500.175" y="792" fill="#0F172A">sort</text><text class="code" x="1526.375" y="792" fill="#64748B">/</text><text class="code" x="1531.625" y="792" fill="#0F172A">limit</text><text class="code" x="1564.375" y="792" fill="#64748B">/</text><text class="code" x="1569.625" y="792" fill="#0F172A">skip</text></g></g>
