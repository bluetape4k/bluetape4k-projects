<path class="dependency" data-from="AggregationSupport" data-to="MongoCollectionExtensions" data-route-color="amber" d="M678 297 L678 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MongoDatabaseExtensions" data-to="MongoCollectionExtensions" data-route-color="pink" d="M898 267 L873 267 L873 428 L848 428" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MongoClientSupport" data-to="MongoClientProvider" data-route-color="purple" d="M288 714 L288 815" stroke="#755BC6" stroke-dasharray="8 7"/>
