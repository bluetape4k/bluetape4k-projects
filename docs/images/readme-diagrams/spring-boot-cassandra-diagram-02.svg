<svg data-intent="Replace the vertical candy-chain with a compact layered data-access map: repositories call coroutine extension families, those adapt Spring Data Cassandra APIs, and driver/session utilities reach the Cassandra cluster." data-evidence="spring-boot/cassandra/README.md; spring-boot/cassandra/src/main/kotlin/io/bluetape4k/spring/cassandra" data-source-read="spring-boot/cassandra/README.md; spring-boot/cassandra/src/main/kotlin/io/bluetape4k/spring/cassandra" xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-label="Cassandra Data Access Layer">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="1280"/>
<rect class="frame" x="34" y="30" width="1372" height="1220" rx="32"/>
<text class="title" x="72" y="84">Cassandra Data Access Layer</text>
<text class="subtitle" x="76" y="116">The module is a layered adapter map, not a serial chain: repository code chooses operation/session helpers that converge on the driver and cluster.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="175" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Application boundary</text></g>
<g><rect class="panel" x="82" y="410" width="1276" height="230" rx="22"/><text class="panelTitle" x="110" y="446" dominant-baseline="middle">Coroutine extension families</text></g>
<g><rect class="panel" x="82" y="745" width="1276" height="190" rx="22"/><text class="panelTitle" x="110" y="781" dominant-baseline="middle">Spring Data Cassandra APIs</text></g>
<g><rect class="panel" x="82" y="1025" width="1276" height="155" rx="22"/><text class="panelTitle" x="110" y="1061" dominant-baseline="middle">Driver and cluster</text></g>
<g id="repository">
  <rect class="card" x="135" y="235" width="320" height="74" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="295" y="265" text-anchor="middle" dominant-baseline="middle">Repository code</text>
  <text class="detail" x="295" y="295" text-anchor="middle" dominant-baseline="middle">suspend functions and Flow&lt;T&gt;</text>
</g>
<g id="admin">
  <rect class="card" x="560" y="235" width="310" height="74" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="715" y="265" text-anchor="middle" dominant-baseline="middle">Admin tasks</text>
  <text class="detail" x="715" y="295" text-anchor="middle" dominant-baseline="middle">schema create / truncate</text>
</g>
<g id="domain">
  <rect class="card" x="985" y="235" width="290" height="74" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1130" y="265" text-anchor="middle" dominant-baseline="middle">Domain mapper</text>
  <text class="detail" x="1130" y="295" text-anchor="middle" dominant-baseline="middle">Row/Gettable -&gt; model</text>
</g>
<g id="reactiveOps">
  <rect class="card" x="130" y="485" width="350" height="98" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="305" y="518" text-anchor="middle" dominant-baseline="middle">ReactiveCassandraOperations</text>
  <text class="detail" x="305" y="548" text-anchor="middle" dominant-baseline="middle">selectAsFlow</text>
  <text class="detail" x="305" y="566" text-anchor="middle" dominant-baseline="middle">insert/update/delete suspending</text>
</g>
<g id="asyncOps">
  <rect class="card" x="550" y="485" width="340" height="98" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="720" y="518" text-anchor="middle" dominant-baseline="middle">AsyncCassandraOperations</text>
  <text class="detail" x="720" y="548" text-anchor="middle" dominant-baseline="middle">await async query results</text>
  <text class="detail" x="720" y="566" text-anchor="middle" dominant-baseline="middle">count/exists/delete helpers</text>
</g>
<g id="sessionDsl">
  <rect class="card" x="970" y="485" width="320" height="98" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1130" y="518" text-anchor="middle" dominant-baseline="middle">CqlSession DSL</text>
  <text class="detail" x="1130" y="548" text-anchor="middle" dominant-baseline="middle">options builder</text>
  <text class="detail" x="1130" y="566" text-anchor="middle" dominant-baseline="middle">statement and row helpers</text>
</g>
<g id="springOps">
  <rect class="card" x="135" y="820" width="330" height="82" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="300" y="854" text-anchor="middle" dominant-baseline="middle">Spring Data operations</text>
  <text class="detail" x="300" y="884" text-anchor="middle" dominant-baseline="middle">Reactive/Async operations</text>
</g>
<g id="schema">
  <rect class="card" x="550" y="820" width="320" height="82" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="710" y="845" text-anchor="middle" dominant-baseline="middle">Schema utilities</text>
  <text class="detail" x="710" y="875" text-anchor="middle" dominant-baseline="middle">SchemaGenerator</text>
  <text class="detail" x="710" y="893" text-anchor="middle" dominant-baseline="middle">truncate/create support</text>
</g>
<g id="session">
  <rect class="card" x="970" y="815" width="330" height="92" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="1135" y="854" text-anchor="middle" dominant-baseline="middle">ReactiveSession / CqlSession</text>
  <text class="detail" x="1135" y="884" text-anchor="middle" dominant-baseline="middle">prepare and execute statements</text>
</g>
<g id="driver">
  <rect class="card" x="345" y="1085" width="320" height="66" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="505" y="1111" text-anchor="middle" dominant-baseline="middle">Cassandra Java driver</text>
  <text class="detail" x="505" y="1141" text-anchor="middle" dominant-baseline="middle">CqlSession and async result sets</text>
</g>
<g id="cluster">
  <rect class="card" x="805" y="1085" width="320" height="66" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="965" y="1111" text-anchor="middle" dominant-baseline="middle">Cassandra cluster</text>
  <text class="detail" x="965" y="1141" text-anchor="middle" dominant-baseline="middle">keyspace, tables, consistency</text>
</g>
<path class="route" data-from="repository" data-to="reactiveOps" d="M295 309 L295 380 L505 380 L505 534 L480 534" stroke="#2E8F89"/>
<path class="route" data-from="repository" data-to="asyncOps" d="M455 272 L500 272 L500 360 L720 360 L720 485" stroke="#B9851B"/>
<path class="route" data-from="admin" data-to="schema" d="M715 309 L715 335 L930 335 L930 790 L800 790 L800 820" stroke="#755BC6"/>
<path class="route" data-from="domain" data-to="sessionDsl" d="M1130 309 L1130 485" stroke="#C94D68"/>
<path class="route" data-from="reactiveOps" data-to="springOps" d="M305 583 L305 705 L500 705 L500 861 L465 861" stroke="#2E8F89"/>
<path class="route" data-from="asyncOps" data-to="schema" d="M720 583 L720 820" stroke="#B9851B"/>
<g><rect class="labelPill" x="779" y="682" width="112" height="26" rx="8"/><text class="detail" x="835" y="696" text-anchor="middle" dominant-baseline="middle" style="fill:#B9851B">await bridge</text></g>
<path class="route" data-from="sessionDsl" data-to="session" d="M1130 583 L1130 815" stroke="#C94D68"/>
<path class="route" data-from="schema" data-to="session" d="M870 861 L970 861" stroke="#755BC6"/>
<path class="route" data-from="springOps" data-to="driver" d="M300 902 L300 985 L505 985 L505 1085" stroke="#3E9868"/>
<path class="route" data-from="session" data-to="driver" d="M1135 907 L1135 985 L650 985 L650 1085" stroke="#4F83BF"/>
<path class="route" data-from="driver" data-to="cluster" d="M665 1118 L805 1118" stroke="#B9851B"/>
</svg>
