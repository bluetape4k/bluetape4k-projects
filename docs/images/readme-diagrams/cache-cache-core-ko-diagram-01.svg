<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">NearCacheOperations</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="132">+isClosed: Boolean</text>
<text class="mono" x="18" y="156">+get(key: String) V?</text>
<text class="mono" x="18" y="180">+getAll(keys: Set~String~) Map</text>
<text class="mono" x="18" y="204">+put(key: String, value: V)</text>
<text class="mono" x="18" y="228">+putIfAbsent(key: String, value: V) V?</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">NearCacheStatistics</text>
  <text class="mono" x="18" y="108">+localHits: Long</text>
<text class="mono" x="18" y="132">+localMisses: Long</text>
<text class="mono" x="18" y="156">+localSize: Long</text>
<text class="mono" x="18" y="180">+localEvictions: Long</text>
<text class="mono" x="18" y="204">+backHits: Long</text>
<text class="mono" x="18" y="228">+backMisses: Long</text>
</g>
<g transform="translate(92,506)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">HazelcastNearCache</text>
  <text class="mono" x="18" y="108">-imap: IMap</text>
<text class="mono" x="18" y="132">-entryListener: EntryListener</text>
</g>
<g transform="translate(502,506)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">LettuceNearCache</text>
  <text class="mono" x="18" y="108">-redisClient: RedisClient</text>
<text class="mono" x="18" y="132">-trackingListener: TrackingInvalidationListener</text>
</g>
<g transform="translate(912,506)">
  <rect class="card" x="0" y="0" width="340" height="120" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">RedissonNearCache</text>
  <text class="mono" x="18" y="108">-localCachedMap: RLocalCachedMap</text>
</g>
<g transform="translate(1322,506)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">ResilientNearCacheDecorator</text>
  <text class="mono" x="18" y="108">-delegate: NearCacheOperations~V~</text>
<text class="mono" x="18" y="132">-retry: Retry</text>
<text class="mono" x="18" y="156">-config: NearCacheResilienceConfig</text>
</g>
<rect x="819" y="285" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="877" y="303" text-anchor="middle">stats()</text>
