<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="979" viewBox="0 0 1754 979" role="img" aria-label="NearCacheOperations (Blocking)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="979"/>
<rect class="frame" x="32" y="28" width="1690" height="923" rx="28"/>
<text class="title" x="66" y="82">NearCacheOperations (Blocking)</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="dashed" d="M672 418 L672 102 L1082 102 L1082 180"/>
<path class="implLine" d="M1492 568 L1492 501 L672 501 L672 418"/>
<path class="implLine" d="M262 568 L262 493 L672 493 L672 418"/>
<path class="implLine" d="M672 568 L672 418"/>
<path class="implLine" d="M1082 568 L1082 477 L672 477 L672 418"/>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">NearCacheOperations</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="129">+isClosed: Boolean</text>
<text class="mono" x="18" y="150">+get(key: String) V?</text>
<text class="mono" x="18" y="171">+getAll(keys: Set~String~) Map</text>
<text class="mono" x="18" y="192">+put(key: String, value: V)</text>
<text class="mono" x="18" y="213">+putIfAbsent(key: String, value: V) V?</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">NearCacheStatistics</text>
  <text class="mono" x="18" y="108">+localHits: Long</text>
<text class="mono" x="18" y="129">+localMisses: Long</text>
<text class="mono" x="18" y="150">+localSize: Long</text>
<text class="mono" x="18" y="171">+localEvictions: Long</text>
<text class="mono" x="18" y="192">+backHits: Long</text>
<text class="mono" x="18" y="213">+backMisses: Long</text>
</g>
<g transform="translate(92,568)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">RedissonNearCache</text>
  <text class="mono" x="18" y="108">-localCachedMap: RLocalCachedMap</text>
</g>
<g transform="translate(502,568)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">HazelcastNearCache</text>
  <text class="mono" x="18" y="108">-imap: IMap</text>
<text class="mono" x="18" y="129">-entryListener: EntryListener</text>
</g>
<g transform="translate(912,568)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">LettuceNearCache</text>
  <text class="mono" x="18" y="108">-redisClient: RedisClient</text>
<text class="mono" x="18" y="129">-trackingListener:</text>
<text class="mono" x="18" y="150">TrackingInvalidationListener</text>
</g>
<g transform="translate(1322,568)">
  <rect class="card" x="0" y="0" width="340" height="191" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">Resilient Near Cache</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Decorator</text>
  <text class="mono" x="18" y="124">-delegate: NearCacheOperations~V~</text>
<text class="mono" x="18" y="145">-retry: Retry</text>
<text class="mono" x="18" y="166">-config: NearCacheResilienceConfig</text>
</g>
