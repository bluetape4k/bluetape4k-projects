<svg xmlns="http://www.w3.org/2000/svg" width="1804" height="1290" viewBox="0 0 1804 1290" role="img" aria-label="Coroutine Conversion Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1804" height="1290"/>
<rect class="frame" x="32" y="28" width="1740" height="1234" rx="28"/>
<text class="title" x="66" y="82">Coroutine Conversion Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="528" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="678" y="209" text-anchor="middle">Coroutine Extension</text>
<line class="lifeline" x1="678" y1="252" x2="678" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="976" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1126" y="198.5" text-anchor="middle">Reactive Mongo</text>
<text class="smallLabel" x="1126" y="219.5" text-anchor="middle">Operations</text>
<line class="lifeline" x1="1126" y1="252" x2="1126" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1424" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1574" y="209" text-anchor="middle">MongoDB</text>
<line class="lifeline" x1="1574" y1="252" x2="1574" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="339" y="286" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="357" y="313" text-anchor="start">1. findAllAsFlow&lt;User&gt;()</text>
<path class="line" d="M230 332 L678 332"/>
<rect x="738.5" y="362" width="327" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="756.5" y="389" text-anchor="start">2. findAll(User::class) → Flux&lt;User&gt;</text>
<path class="line" d="M678 408 L1126 408"/>
<rect x="1245" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1263" y="465" text-anchor="start">3. find({}) query</text>
<path class="line" d="M1126 484 L1574 484"/>
<rect x="1245" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1263" y="541" text-anchor="start">4. Document stream</text>
<path class="dashed" d="M1574 560 L1126 560"/>
<rect x="797" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="617" text-anchor="start">5. Flux&lt;User&gt;</text>
<path class="dashed" d="M1126 636 L678 636"/>
<rect x="307" y="666" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="325" y="693" text-anchor="start">6. Flow&lt;User&gt; (coroutine stream)</text>
<path class="dashed" d="M678 712 L230 712"/>
<rect x="335" y="742" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="769" text-anchor="start">7. insertSuspending(user)</text>
<path class="line" d="M230 788 L678 788"/>
<rect x="771" y="818" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="789" y="845" text-anchor="start">8. insert(user) → Mono&lt;User&gt;</text>
<path class="line" d="M678 864 L1126 864"/>
<rect x="1245" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1263" y="921" text-anchor="start">9. insertOne request</text>
<path class="line" d="M1126 940 L1574 940"/>
<rect x="1245" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1263" y="997" text-anchor="start">10. Inserted document</text>
<path class="dashed" d="M1574 1016 L1126 1016"/>
<rect x="797" y="1046" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="815" y="1073" text-anchor="start">11. Mono&lt;User&gt;</text>
<path class="dashed" d="M1126 1092 L678 1092"/>
<rect x="335" y="1122" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="1149" text-anchor="start">12. User (suspend result)</text>
<path class="dashed" d="M678 1168 L230 1168"/>
</svg>
