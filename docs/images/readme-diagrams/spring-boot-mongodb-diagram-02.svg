<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-label="ReactiveMongoOperations Coroutine Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#CBD5E1;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .band{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.bandTitle{font-family:"Architects Daughter";font-size:23px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:14px;fill:#475569}
    .mono{font-family:"Comic Mono";font-size:13px;fill:#475569}.edge{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    .edgeDashed{stroke-dasharray:9 8}.note{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.8}
  </style>
</defs>
<rect class="canvas" width="1700" height="1120"/>
<rect class="frame" x="40" y="34" width="1620" height="1046" rx="30"/>
<text class="title" x="82" y="92">ReactiveMongoOperations Coroutine Flow</text>
<text class="subtitle" x="86" y="126">Reactive Mongo publishers are converted into Flow streams, suspend values, or write metadata.</text>
<g><rect class="band" x="90" y="168" width="1520" height="175" rx="16"/><text class="bandTitle" x="116" y="204" dominant-baseline="middle">Caller builds an operation</text><text class="mono" x="450" y="204" dominant-baseline="middle">Application code chooses a query, aggregation, entity write, or collection command.</text></g>
<g><rect class="band" x="90" y="425" width="1520" height="265" rx="16"/><text class="bandTitle" x="116" y="461" dominant-baseline="middle">Reactive publisher boundary</text><text class="mono" x="450" y="461" dominant-baseline="middle">ReactiveMongoOperations returns Flux or Mono publishers; extensions convert them at this boundary.</text></g>
<g><rect class="band" x="90" y="765" width="1520" height="230" rx="16"/><text class="bandTitle" x="116" y="801" dominant-baseline="middle">Coroutine-facing result</text><text class="mono" x="450" y="801" dominant-baseline="middle">Callers receive Flow streams, suspend values, or write metadata without handling publishers directly.</text></g>
<g id="caller"><rect class="card" x="150" y="226" width="360" height="86" rx="12" fill="#EFF6FF" stroke="#2563EB"/>
<text class="cardTitle" x="330" y="260" text-anchor="middle" dominant-baseline="middle">Repository/service code</text>
<text class="detail" x="330" y="292" text-anchor="middle" dominant-baseline="middle">chooses read, write, or collection operation</text></g>
<g id="query"><rect class="card" x="670" y="226" width="360" height="86" rx="12" fill="#FAF5FF" stroke="#9333EA"/>
<text class="cardTitle" x="850" y="260" text-anchor="middle" dominant-baseline="middle">Query / Aggregation</text>
<text class="detail" x="850" y="292" text-anchor="middle" dominant-baseline="middle">Spring Data MongoDB query objects</text></g>
<g id="operations"><rect class="card" x="1190" y="226" width="360" height="86" rx="12" fill="#F0FDF4" stroke="#16A34A"/>
<image data-bluetape4k-icon="testcontainers/storage/mongodb.svg" x="1188" y="244" width="32" height="32" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="cardTitle" x="1370" y="260" text-anchor="middle" dominant-baseline="middle">ReactiveMongoOperations</text>
<text class="detail" x="1370" y="292" text-anchor="middle" dominant-baseline="middle">returns Flux&lt;T&gt;, Mono&lt;T&gt;, or Mono&lt;Result&gt;</text></g>
<g id="many"><rect class="card" x="170" y="502" width="360" height="116" rx="12" fill="#F0FDFA" stroke="#0D9488"/>
<text class="cardTitle" x="350" y="536" text-anchor="middle" dominant-baseline="middle">Many-result extensions</text>
<text class="detail" x="350" y="568" text-anchor="middle" dominant-baseline="middle">findAsFlow, findAllAsFlow</text>
<text class="detail" x="350" y="588" text-anchor="middle" dominant-baseline="middle">aggregateAsFlow, tailAsFlow</text>
<text class="detail" x="350" y="608" text-anchor="middle" dominant-baseline="middle">publisher.asFlow()</text></g>
<g id="single"><rect class="card" x="670" y="502" width="360" height="116" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
<text class="cardTitle" x="850" y="536" text-anchor="middle" dominant-baseline="middle">Single-result extensions</text>
<text class="detail" x="850" y="568" text-anchor="middle" dominant-baseline="middle">findOneSuspending</text>
<text class="detail" x="850" y="588" text-anchor="middle" dominant-baseline="middle">findByIdOrNullSuspending</text>
<text class="detail" x="850" y="608" text-anchor="middle" dominant-baseline="middle">awaitSingle / awaitSingleOrNull</text></g>
<g id="write"><rect class="card" x="1170" y="502" width="360" height="116" rx="12" fill="#FDF2F8" stroke="#DB2777"/>
<text class="cardTitle" x="1350" y="536" text-anchor="middle" dominant-baseline="middle">Write extensions</text>
<text class="detail" x="1350" y="568" text-anchor="middle" dominant-baseline="middle">insert/save/update/remove</text>
<text class="detail" x="1350" y="588" text-anchor="middle" dominant-baseline="middle">await UpdateResult/DeleteResult</text></g>
<g id="flow"><rect class="card" x="170" y="832" width="360" height="92" rx="12" fill="#F0FDFA" stroke="#0D9488"/>
<text class="cardTitle" x="350" y="866" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt;</text>
<text class="detail" x="350" y="898" text-anchor="middle" dominant-baseline="middle">streamed documents</text></g>
<g id="suspend"><rect class="card" x="670" y="832" width="360" height="92" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
<text class="cardTitle" x="850" y="866" text-anchor="middle" dominant-baseline="middle">suspend result</text>
<text class="detail" x="850" y="898" text-anchor="middle" dominant-baseline="middle">T, T?, Long, Boolean, Unit</text></g>
<g id="metadata"><rect class="card" x="1170" y="832" width="360" height="92" rx="12" fill="#FDF2F8" stroke="#DB2777"/>
<text class="cardTitle" x="1350" y="866" text-anchor="middle" dominant-baseline="middle">Write metadata</text>
<text class="detail" x="1350" y="898" text-anchor="middle" dominant-baseline="middle">UpdateResult / DeleteResult</text></g>
<path class="edge" d="M510 269 L670 269" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M1030 269 L1190 269" stroke="#9333EA" marker-end="url(#arrow-purple)"/>
<path class="edge" d="M 1370 312 L 1370 366 Q 1370 380 1356 380 L 364 380 Q 350 380 350 394 L 350 502" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
<path class="edge" d="M 1370 312 L 1370 386 Q 1370 400 1356 400 L 864 400 Q 850 400 850 414 L 850 502" stroke="#EA580C" marker-end="url(#arrow-amber)"/>
<path class="edge" d="M1370 312 L1370 502" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="edge" d="M350 618 L350 832" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
<path class="edge" d="M850 618 L850 832" stroke="#EA580C" marker-end="url(#arrow-amber)"/>
<path class="edge" d="M1350 618 L1350 832" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<g><rect x="368" y="394" width="84" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="382" y="411" fill="#0D9488">Flux&lt;T&gt;</text></g>
<g><rect x="866" y="414" width="84" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="880" y="431" fill="#EA580C">Mono&lt;T&gt;</text></g>
<g><rect x="1378" y="402" width="124" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="1392" y="419" fill="#DB2777">Mono&lt;Result&gt;</text></g>
</svg>