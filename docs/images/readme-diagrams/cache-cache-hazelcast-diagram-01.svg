<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1240" viewBox="0 0 1880 1240" role="img" aria-labelledby="title desc">
  <title id="title">Hazelcast NearCache Class Structure</title>
  <desc id="desc">Explain the Hazelcast native NearCache class structure, factory boundary, front cache, IMap backend, and listener invalidation.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1880" height="1240"/>
  <rect class="decor" x="44" y="36" width="1792" height="1168" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1716" height="954" rx="24"/>
  <text class="title" x="72" y="88">Hazelcast NearCache Class Structure</text>
  <text class="subtitle" x="76" y="121">Native NearCache implementations share the core contracts while IMap listener invalidation stays in the Hazelcast module.</text>
  <g id="panel-contracts">
    <rect class="group" x="92" y="170" width="1180" height="210" rx="20"/>
    <text class="groupTitle" x="122" y="198" dominant-baseline="middle">Core contracts</text>
  </g>
  <g id="panel-impl">
    <rect class="group" x="92" y="455" width="1180" height="215" rx="20"/>
    <text class="groupTitle" x="122" y="483" dominant-baseline="middle">Hazelcast native implementations</text>
  </g>
  <g id="panel-factory">
    <rect class="group" x="1335" y="210" width="410" height="405" rx="20"/>
    <text class="groupTitle" x="1365" y="238" dominant-baseline="middle">Factory and JCache boundary</text>
  </g>
  <g id="panel-runtime">
    <rect class="group" x="100" y="730" width="1680" height="320" rx="20"/>
    <text class="groupTitle" x="130" y="758" dominant-baseline="middle">Runtime collaborators</text>
  </g>
  <path class="connector inherit" data-edge="near-&gt;ops" data-label="implements" d="M 540 520 L 540 356" stroke="#58A978"/>
  <g transform="translate(562,425)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">implements</text>
  </g>
  <path class="connector inherit" data-edge="suspendNear-&gt;suspendOps" data-label="implements" d="M 970 520 L 970 356" stroke="#58A978"/>
  <g transform="translate(992,425)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">implements</text>
  </g>
  <path class="connector inherit" data-edge="caffeine-&gt;local" data-label="implements" d="M 720 933 L 575 933" stroke="#D9AA4D"/>
  <g transform="translate(600.5,896)">
    <rect class="labelPill" x="0" y="0" width="94" height="26" rx="8"/>
    <text class="small" x="47" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">implements</text>
  </g>
  <path class="connector" data-edge="imap-&gt;listener" data-label="entry events" d="M 1428 910 L 1428 866" stroke="#DB7890"/>
  <g transform="translate(1450,875)">
    <rect class="labelPill" x="0" y="0" width="108.8" height="26" rx="8"/>
    <text class="small" x="54.4" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">entry events</text>
  </g>
  <path class="connector" data-edge="listener-&gt;caffeine" data-label="invalidates" d="M 1190 828 L 1145 828 L 1145 850 L 925 850 L 925 875" stroke="#DB7890"/>
  <g transform="translate(984.3,813)">
    <rect class="labelPill" x="0" y="0" width="101.4" height="26" rx="8"/>
    <text class="small" x="50.7" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">invalidates</text>
  </g>
  <path class="connector dashed" data-edge="factory-&gt;jcache" data-label="documents" d="M 1540 381 L 1540 440" stroke="#6B7D90"/>
  <g transform="translate(1562,397.5)">
    <rect class="labelPill" x="0" y="0" width="86.6" height="26" rx="8"/>
    <text class="small" x="43.3" y="13" text-anchor="middle" dominant-baseline="middle" fill="#6B7D90">documents</text>
  </g>
  <g id="node-ops" transform="translate(175,230)">
    <rect class="card" x="0" y="0" width="430" height="126" rx="10" fill="#E8F3FF" stroke="#75A9E8"/>
    <line x1="0" y1="50" x2="430" y2="50" stroke="#75A9E8" stroke-width="1.6"/>
    <text class="stereo" x="215" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="215" y="36" text-anchor="middle" dominant-baseline="middle">NearCacheOperations&lt;V&gt;</text>
    <text class="member" x="215" y="70" text-anchor="middle" dominant-baseline="middle">blocking front-first contract</text>
    <text class="member" x="215" y="88" text-anchor="middle" dominant-baseline="middle">stats and lifecycle</text>
    <text class="member" x="215" y="106" text-anchor="middle" dominant-baseline="middle">write-through operations</text>
  </g>
  <g id="node-suspendOps" transform="translate(745,230)">
    <rect class="card" x="0" y="0" width="450" height="126" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#45A7A1" stroke-width="1.6"/>
    <text class="stereo" x="225" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="225" y="36" text-anchor="middle" dominant-baseline="middle">SuspendNearCacheOperations&lt;V&gt;</text>
    <text class="member" x="225" y="70" text-anchor="middle" dominant-baseline="middle">suspend remote calls</text>
    <text class="member" x="225" y="88" text-anchor="middle" dominant-baseline="middle">same operation families</text>
    <text class="member" x="225" y="106" text-anchor="middle" dominant-baseline="middle">coroutine lifecycle</text>
  </g>
  <g id="node-near" transform="translate(175,520)">
    <rect class="card" x="0" y="0" width="430" height="126" rx="10" fill="#EAF7EF" stroke="#69B888"/>
    <line x1="0" y1="50" x2="430" y2="50" stroke="#69B888" stroke-width="1.6"/>
    <text class="stereo" x="215" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="215" y="36" text-anchor="middle" dominant-baseline="middle">HazelcastNearCache&lt;V&gt;</text>
    <text class="member" x="215" y="70" text-anchor="middle" dominant-baseline="middle">front: CaffeineHazelcastLocalCache</text>
    <text class="member" x="215" y="88" text-anchor="middle" dominant-baseline="middle">back: IMap&lt;String,V&gt;</text>
    <text class="member" x="215" y="106" text-anchor="middle" dominant-baseline="middle">listenerId from addEntryListener</text>
  </g>
  <g id="node-suspendNear" transform="translate(745,520)">
    <rect class="card" x="0" y="0" width="450" height="126" rx="10" fill="#EAF7EF" stroke="#69B888"/>
    <line x1="0" y1="50" x2="450" y2="50" stroke="#69B888" stroke-width="1.6"/>
    <text class="stereo" x="225" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="225" y="36" text-anchor="middle" dominant-baseline="middle">HazelcastSuspendNearCache&lt;V&gt;</text>
    <text class="member" x="225" y="70" text-anchor="middle" dominant-baseline="middle">getAsync / setAsync / deleteAsync</text>
    <text class="member" x="225" y="88" text-anchor="middle" dominant-baseline="middle">bulk getAll via IMap</text>
    <text class="member" x="225" y="106" text-anchor="middle" dominant-baseline="middle">same front cache contract</text>
  </g>
  <g id="node-local" transform="translate(185,875)">
    <rect class="card" x="0" y="0" width="390" height="124" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
    <line x1="0" y1="50" x2="390" y2="50" stroke="#45A7A1" stroke-width="1.6"/>
    <text class="stereo" x="195" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="195" y="36" text-anchor="middle" dominant-baseline="middle">HazelcastLocalCache&lt;K,V&gt;</text>
    <text class="member" x="195" y="69" text-anchor="middle" dominant-baseline="middle">get / put / invalidate</text>
    <text class="member" x="195" y="87" text-anchor="middle" dominant-baseline="middle">invalidateAll / clear</text>
    <text class="member" x="195" y="105" text-anchor="middle" dominant-baseline="middle">size and stats</text>
  </g>
  <g id="node-caffeine" transform="translate(720,875)">
    <rect class="card" x="0" y="0" width="410" height="124" rx="10" fill="#FFF3D9" stroke="#D9AA4D"/>
    <line x1="0" y1="50" x2="410" y2="50" stroke="#D9AA4D" stroke-width="1.6"/>
    <text class="stereo" x="205" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;class&gt;&gt;</text>
    <text class="classTitle" x="205" y="36" text-anchor="middle" dominant-baseline="middle">CaffeineHazelcastLocalCache&lt;V&gt;</text>
    <text class="member" x="205" y="69" text-anchor="middle" dominant-baseline="middle">Caffeine-backed front tier</text>
    <text class="member" x="205" y="87" text-anchor="middle" dominant-baseline="middle">expiration and max size</text>
    <text class="member" x="205" y="105" text-anchor="middle" dominant-baseline="middle">local invalidation target</text>
  </g>
  <g id="node-imap" transform="translate(1240,910)">
    <rect class="card" x="0" y="0" width="375" height="96" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="187.5" y="19.5" text-anchor="middle" dominant-baseline="middle">Hazelcast IMap</text>
    <text class="detail" x="187.5" y="38.5" text-anchor="middle" dominant-baseline="middle">distributed back cache</text>
    <text class="detail" x="187.5" y="57.5" text-anchor="middle" dominant-baseline="middle">getAll / putAll bulk path</text>
    <text class="detail" x="187.5" y="76.5" text-anchor="middle" dominant-baseline="middle">EntryListener event source</text>
  </g>
  <g id="node-listener" transform="translate(1190,790)">
    <rect class="card" x="0" y="0" width="405" height="76" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="202.5" y="9.5" text-anchor="middle" dominant-baseline="middle">HazelcastEntryEventListener</text>
    <text class="detail" x="202.5" y="28.5" text-anchor="middle" dominant-baseline="middle">entryAdded/Updated -&gt; invalidate</text>
    <text class="detail" x="202.5" y="47.5" text-anchor="middle" dominant-baseline="middle">removed/evicted -&gt; invalidate</text>
    <text class="detail" x="202.5" y="66.5" text-anchor="middle" dominant-baseline="middle">runs in client JVM</text>
  </g>
  <g id="node-factory" transform="translate(1365,285)">
    <rect class="card" x="0" y="0" width="350" height="96" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="175" y="19.5" text-anchor="middle" dominant-baseline="middle">HazelcastCaches</text>
    <text class="detail" x="175" y="38.5" text-anchor="middle" dominant-baseline="middle">nearCache / suspendNearCache</text>
    <text class="detail" x="175" y="57.5" text-anchor="middle" dominant-baseline="middle">nearJCache / suspendNearJCache</text>
    <text class="detail" x="175" y="76.5" text-anchor="middle" dominant-baseline="middle">stable artifact/package names</text>
  </g>
  <g id="node-jcache" transform="translate(1365,440)">
    <rect class="card" x="0" y="0" width="350" height="108" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="cardTitle" x="175" y="25.5" text-anchor="middle" dominant-baseline="middle">JCache factory note</text>
    <text class="detail" x="175" y="44.5" text-anchor="middle" dominant-baseline="middle">listener-free public factory path</text>
    <text class="detail" x="175" y="63.5" text-anchor="middle" dominant-baseline="middle">read-through/write-through only</text>
    <text class="detail" x="175" y="82.5" text-anchor="middle" dominant-baseline="middle">direct listener-backed path unsupported</text>
  </g>
  <g transform="translate(76,1136)">
    <rect class="labelPill" x="0" y="0" width="1728" height="48" rx="10"/>
    <text class="small" x="864" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-projects / cache modules - github.com/bluetape4k/bluetape4k-projects</text>
  </g>
</svg>
