<rect width="1700" height="1180" fill="#F7FAFC"/>
<rect x="30" y="28" width="1640" height="1124" rx="24" fill="#FFFFFF" stroke="#D5E1EC" stroke-width="2.4"/>
<text x="850" y="82" text-anchor="middle" class="title">Redis Exported API Surface</text>
<text x="850" y="116" text-anchor="middle" class="subtitle">bluetape4k-redis has no Kotlin sources; it preserves imports by exporting concrete Redis client modules.</text>
<rect x="560" y="154" width="580" height="96" rx="14" fill="#FFFFFF" stroke="#356FEA" stroke-width="2.2"/>
<text x="584" y="191" class="noteTitle">bluetape4k-redis umbrella</text>
<text x="584" y="222" class="note">build.gradle.kts exports only Lettuce and Redisson</text>
<text x="584" y="244" class="note">no classes are inherited from this module</text>
<rect x="80" y="300" width="720" height="498" rx="18" fill="#FFFFFF" stroke="#16A064" stroke-width="2.2"/>
<text x="104" y="336" class="groupTitle">Exported by umbrella: Lettuce</text>
<text x="104" y="362" class="groupSub">Low-level Redis command access, codecs, data structures, and coroutine adapters.</text>
<rect x="900" y="300" width="720" height="498" rx="18" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.2"/>
<text x="924" y="336" class="groupTitle">Exported by umbrella: Redisson</text>
<text x="924" y="362" class="groupSub">Redisson client creation, codecs, coroutine adapters, cache helpers, and NearCache.</text>
<rect x="282" y="840" width="1136" height="222" rx="18" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="10 8"/>
<text x="306" y="876" class="groupTitle">Separate Spring Boot Redis serializer module</text>
<text x="306" y="902" class="groupSub">Use this module explicitly when configuring RedisTemplate or ReactiveRedisTemplate.</text>
<rect x="120" y="392" width="300" height="170" rx="13" fill="#ECFDF5" stroke="#16A064" stroke-width="2.2"/>
<text x="270" y="424" text-anchor="middle" class="stereo">&lt;&lt;object&gt;&gt;</text>
<text x="270" y="452" text-anchor="middle" class="cardTitle">LettuceClients</text>
<text x="138" y="483" class="member">clientOf(), connect()</text>
<text x="138" y="504" class="member">commands(), asyncCommands()</text>
<text x="138" y="525" class="member">coroutinesCommands()</text>
<text x="138" y="546" class="member">cached connections</text>
<rect x="460" y="392" width="300" height="170" rx="13" fill="#F0FDF4" stroke="#16A064" stroke-width="2.2"/>
<text x="610" y="424" text-anchor="middle" class="stereo">&lt;&lt;objects&gt;&gt;</text>
<text x="610" y="452" text-anchor="middle" class="cardTitle">Lettuce Codecs</text>
<text x="478" y="483" class="member">LettuceBinaryCodecs</text>
<text x="478" y="504" class="member">LettuceJsonCodecs</text>
<text x="478" y="525" class="member">Int / Long codecs</text>
<text x="478" y="546" class="member">compression variants</text>
<rect x="120" y="596" width="300" height="162" rx="13" fill="#F0FDFA" stroke="#0F9B8E" stroke-width="2.2"/>
<text x="270" y="628" text-anchor="middle" class="stereo">&lt;&lt;extensions&gt;&gt;</text>
<text x="270" y="656" text-anchor="middle" class="cardTitle">Coroutine adapters</text>
<text x="138" y="687" class="member">RedisFuture.awaitSuspending()</text>
<text x="138" y="708" class="member">Collection&lt;RedisFuture&gt;.awaitAll()</text>
<text x="138" y="729" class="member">Iterable&lt;RedisFuture&gt;.sequence()</text>
<rect x="460" y="596" width="300" height="162" rx="13" fill="#F0FDFA" stroke="#0F9B8E" stroke-width="2.2"/>
<text x="610" y="628" text-anchor="middle" class="stereo">&lt;&lt;classes&gt;&gt;</text>
<text x="610" y="656" text-anchor="middle" class="cardTitle">Lettuce structures</text>
<text x="478" y="687" class="member">LettuceMap / SuspendMap</text>
