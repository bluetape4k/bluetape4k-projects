<text x="478" y="729" class="member">Bloom / Cuckoo filters</text>
<text x="478" y="750" class="member">HyperLogLog</text>
<rect x="940" y="392" width="300" height="170" rx="13" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="2.2"/>
<text x="1090" y="424" text-anchor="middle" class="stereo">&lt;&lt;functions&gt;&gt;</text>
<text x="1090" y="452" text-anchor="middle" class="cardTitle">Redisson client DSL</text>
<text x="958" y="483" class="member">redissonClient {}</text>
<text x="958" y="504" class="member">redissonClientOf(config)</text>
<text x="958" y="525" class="member">YAML Config helpers</text>
<text x="958" y="546" class="member">high-concurrency defaults</text>
<rect x="1280" y="392" width="300" height="170" rx="13" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2.2"/>
