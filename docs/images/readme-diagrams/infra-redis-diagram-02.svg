<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-labelledby="title desc">
<title id="title">Redis exported API surface</title>
<desc id="desc">The redis umbrella has no source classes; it exports Lettuce and Redisson APIs, while Spring Boot Redis serializers stay separate.</desc>
<defs><style>
  .title{font-family:"Architects Daughter";font-size:48px;fill:#1F2937}
  .subtitle,.groupSub,.member,.note,.stereo{font-family:"Comic Mono";fill:#52616B}
  .subtitle{font-size:18px}.groupTitle{font-family:"Architects Daughter";font-size:25px;fill:#1F2937}
  .groupSub{font-size:14px}.cardTitle{font-family:"Architects Daughter";font-size:22px;fill:#1F2937}
  .stereo{font-size:12px}.member{font-size:14px}.noteTitle{font-family:"Architects Daughter";font-size:22px;fill:#1F2937}.note{font-size:14px}
</style></defs>
