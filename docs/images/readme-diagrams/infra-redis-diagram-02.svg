<g>
  <rect x="2689" y="802" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M2707 820 L2765 820" stroke="#3E9868"/>
