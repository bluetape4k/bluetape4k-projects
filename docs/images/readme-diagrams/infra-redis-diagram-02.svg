<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1145" viewBox="0 0 1500 1145" role="img" aria-label="Core Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="1145"/>
<rect class="frame" x="32" y="28" width="1436" height="1089" rx="30"/>
<text class="title" x="68" y="84">Core Class Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="RedissonClientSupport" data-to="RedissonNearCache" data-route-color="teal" d="M930 279 L1008 279 L1008 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonClientSupport" data-to="RedissonLeaderElection" data-route-color="amber" d="M570 279 L492 279 L492 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonClientSupport" data-to="RedissonCodecs" data-route-color="pink" d="M750 311 L750 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="LettuceClients" data-to="LettuceLoadedMap" data-route-color="purple" d="M653 742 L653 829" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="LettuceClients" data-to="LettuceBinaryCodecs" data-route-color="olive" d="M458 742 L458 829" stroke="#718A35" stroke-dasharray="8 7"/>
<g id="LettuceBinaryCodecs">
  <rect class="classCard" x="180" y="829" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="360" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="360" y="876" text-anchor="middle">LettuceBinaryCodecs</text>
  <line x1="180" y1="885" x2="540" y2="885" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="214" y="917">+default~V~() LettuceBinaryCodec</text>
<text class="member" x="214" y="934">+lz4Fory~V~() LettuceBinaryCodec</text>
<text class="member" x="214" y="951">+zstdFory~V~() LettuceBinaryCodec</text>
</g>
<g id="RedissonClientSupport">
  <rect class="classCard" x="570" y="165" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="750" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="212" text-anchor="middle">RedissonClientSupport</text>
  <line x1="570" y1="221" x2="930" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="604" y="253">+redissonClient(config)</text>
<text class="member" x="604" y="270">RedissonClient</text>
<text class="member" x="604" y="287">+redissonReactiveClient(config)</text>
</g>
<g id="LettuceClients">
  <rect class="classCard" x="375" y="596" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="555" y="615" text-anchor="middle">class</text>
  <text class="classTitle" x="555" y="643" text-anchor="middle">LettuceClients</text>
  <line x1="375" y1="652" x2="735" y2="652" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="409" y="684">+clientOf(uri: String) RedisClient</text>
<text class="member" x="409" y="701">+connect(client)</text>
<text class="member" x="409" y="718">StatefulRedisConnection</text>
</g>
<g id="LettuceLoadedMap">
  <rect class="classCard" x="570" y="829" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="750" y="848" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="876" text-anchor="middle">LettuceLoadedMap</text>
  <line x1="570" y1="885" x2="930" y2="885" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="604" y="917">+get(key: String) V?</text>
<text class="member" x="604" y="934">+set(key: String, value: V)</text>
<text class="member" x="604" y="951">+load(key: String) V?</text>
</g>
<g id="RedissonLeaderElection">
  <rect class="classCard" x="180" y="398" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="360" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="360" y="445" text-anchor="middle">RedissonLeaderElection</text>
  <line x1="180" y1="454" x2="540" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="214" y="486">+runIfLeader(lockName, action) T</text>
<text class="member" x="214" y="503">+runAsyncIfLeader(lockName,</text>
<text class="member" x="214" y="520">action)</text>
</g>
<g id="RedissonCodecs">
  <rect class="classCard" x="570" y="398" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="750" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="445" text-anchor="middle">RedissonCodecs</text>
  <line x1="570" y1="454" x2="930" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="604" y="486">+Default: Lz4Codec</text>
<text class="member" x="604" y="503">+Fory: ForyCodec</text>
<text class="member" x="604" y="520">+Kryo5: Kryo5Codec</text>
</g>
<g id="RedissonNearCache">
  <rect class="classCard" x="960" y="398" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1140" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1140" y="445" text-anchor="middle">RedissonNearCache</text>
  <line x1="960" y1="454" x2="1320" y2="454" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="994" y="486">+get(key) V?</text>
<text class="member" x="994" y="503">+put(key, value)</text>
<text class="member" x="994" y="520">+clearLocalCache()</text>
</g>
<g>
  <rect x="1085" y="1037" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 1055 L1161 1055" stroke="#3E9868"/>
  <text class="detail" x="1175" y="1060">inheritance / implementation</text>
  <path class="dependency" d="M1103 1076 L1161 1076" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="1081">dependency / usage</text>
</g>
<g><rect x="180" y="1055" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="1081" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
