<text x="1090" y="628" text-anchor="middle" class="stereo">&lt;&lt;extensions&gt;&gt;</text>
<text x="1090" y="656" text-anchor="middle" class="cardTitle">Coroutine adapters</text>
<text x="958" y="687" class="member">Collection&lt;RFuture&gt;.awaitAll()</text>
