<rect x="1280" y="596" width="300" height="162" rx="13" fill="#EEF2FF" stroke="#6366F1" stroke-width="2.2"/>
<text x="1430" y="628" text-anchor="middle" class="stereo">&lt;&lt;classes&gt;&gt;</text>
