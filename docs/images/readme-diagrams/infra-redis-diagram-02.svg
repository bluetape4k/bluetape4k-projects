<path class="dependency" data-from="RedissonClientSupport" data-to="RedissonLeaderElection" d="M1914 342 L1818 342 L1818 588 L1722 588" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonClientSupport" data-to="RedissonCodecs" d="M2084 372 L2084 558" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="dependency" data-from="LettuceClients" data-to="LettuceLoadedMap" d="M881 372 L881 465 L891 465 L891 558" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="LettuceClients" data-to="LettuceBinaryCodecs" d="M625 372 L625 465 L615 465 L615 558" stroke="#2E8F89" stroke-dasharray="8 7"/>
