<rect class="canvas" width="1500" height="980"/>
<rect class="frame" x="34" y="30" width="1432" height="920" rx="8"/>
<text class="title" x="72" y="84">Redis Umbrella Module Structure</text>
<text class="subtitle" x="76" y="116">The umbrella dependency bundles Lettuce and Redisson for compatibility; direct client dependencies and Spring Data Redis serializers remain separate choices.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="170" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Compatibility dependency</text></g>
<g><rect class="panel" x="82" y="405" width="1336" height="260" rx="8"/><text class="panelTitle" x="110" y="441" dominant-baseline="middle">Client module choices</text></g>
<g><rect class="panel" x="82" y="740" width="1336" height="150" rx="8"/><text class="panelTitle" x="110" y="776" dominant-baseline="middle">Reader guidance</text></g>
<g id="umbrella">
  <rect class="card" x="240" y="230" width="1020" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="750" y="260" text-anchor="middle" dominant-baseline="middle">bluetape4k-redis umbrella</text>
  <text class="detail" x="750" y="290" text-anchor="middle" dominant-baseline="middle">keeps existing full-bundle dependency working</text>
</g>
<g id="lettuce">
  <rect class="card" x="135" y="495" width="330" height="94" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="300" y="526" text-anchor="middle" dominant-baseline="middle">bluetape4k-lettuce</text>
  <text class="detail" x="300" y="556" text-anchor="middle" dominant-baseline="middle">async/coroutine Redis client</text>
  <text class="detail" x="300" y="574" text-anchor="middle" dominant-baseline="middle">binary and Protobuf codecs</text>
</g>
<g id="redisson">
  <rect class="card" x="585" y="495" width="330" height="94" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="750" y="526" text-anchor="middle" dominant-baseline="middle">bluetape4k-redisson</text>
  <text class="detail" x="750" y="556" text-anchor="middle" dominant-baseline="middle">distributed objects</text>
  <text class="detail" x="750" y="574" text-anchor="middle" dominant-baseline="middle">NearCache and leader election</text>
</g>
<g id="springData">
  <rect class="card" x="1035" y="495" width="330" height="94" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1200" y="526" text-anchor="middle" dominant-baseline="middle">spring-data-redis</text>
  <text class="detail" x="1200" y="556" text-anchor="middle" dominant-baseline="middle">RedisTemplate serializers</text>
  <text class="detail" x="1200" y="574" text-anchor="middle" dominant-baseline="middle">ReactiveRedisTemplate context</text>
</g>
<g id="guidance">
  <rect class="card" x="230" y="800" width="1040" height="66" rx="8" fill="#F9FAFB" stroke="#6B7280"/>
  <text class="cardTitle" x="750" y="826" text-anchor="middle" dominant-baseline="middle">Choose by dependency boundary</text>
  <text class="detail" x="750" y="856" text-anchor="middle" dominant-baseline="middle">umbrella for compatibility; direct clients for smaller dependencies; Spring Data Redis only for template serialization</text>
</g>
<path class="route" data-from="umbrella" data-to="lettuce" d="M500 304 L500 542 L465 542" stroke="#15803D"/>
<path class="route" data-from="umbrella" data-to="redisson" d="M750 304 L750 495" stroke="#7E22CE"/>
</svg>
