  <line class="compartment" x1="80" y1="78" x2="390" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="235" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="235" y="61" text-anchor="middle">SuspendedSource</text>
  <text class="mono" x="98" y="108">+read(sink: Buffer, byteCount: Long)*</text>
<text class="mono" x="98" y="129">Long</text>
<text class="mono" x="98" y="150">+close()*</text>
<text class="mono" x="98" y="171">+timeout() Timeout</text>
<text class="mono" x="98" y="192">+readAll(sink: Buffer)* Long</text>
</g>
