<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1120" viewBox="0 0 1700 1120" role="img" aria-label="Criteria / Query / Update DSL Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#CBD5E1;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .band{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.bandTitle{font-family:"Architects Daughter";font-size:23px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:14px;fill:#475569}
    .mono{font-family:"Comic Mono";font-size:13px;fill:#475569}.edge{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    .edgeDashed{stroke-dasharray:9 8}.note{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.8}
  </style>
</defs>
<rect class="canvas" width="1700" height="1120"/>
<rect class="frame" x="40" y="34" width="1620" height="1046" rx="30"/>
<text class="title" x="82" y="92">Criteria / Query / Update DSL Flow</text>
<text class="subtitle" x="86" y="126">Field helpers build Criteria, Query, and Update objects before ReactiveMongoOperations executes them.</text>
<g><rect class="band" x="90" y="168" width="1520" height="190" rx="16"/><text class="bandTitle" x="116" y="204" dominant-baseline="middle">Field-level DSL input</text><text class="mono" x="450" y="204" dominant-baseline="middle">String field helpers start either predicate construction or update document construction.</text></g>
<g><rect class="band" x="90" y="445" width="1520" height="265" rx="16"/><text class="bandTitle" x="116" y="481" dominant-baseline="middle">Spring Data query objects</text><text class="mono" x="450" y="481" dominant-baseline="middle">Criteria becomes Query; Update stays separate until an update/remove operation consumes it.</text></g>
<g><rect class="band" x="90" y="785" width="1520" height="210" rx="16"/><text class="bandTitle" x="116" y="821" dominant-baseline="middle">Execution</text><text class="mono" x="450" y="821" dominant-baseline="middle">Consumes built Query and Update objects.</text></g>
<g id="fields"><rect class="card" x="150" y="238" width="360" height="96" rx="12" fill="#EFF6FF" stroke="#2563EB"/>
<text class="cardTitle" x="330" y="272" text-anchor="middle" dominant-baseline="middle">Field strings</text>
<text class="detail" x="330" y="304" text-anchor="middle" dominant-baseline="middle">&quot;age&quot;.criteria()</text>
<text class="detail" x="330" y="324" text-anchor="middle" dominant-baseline="middle">&quot;name&quot; setTo value</text></g>
<g id="criteriaDsl"><rect class="card" x="660" y="238" width="380" height="108" rx="12" fill="#F0FDF4" stroke="#16A34A"/>
<text class="cardTitle" x="850" y="272" text-anchor="middle" dominant-baseline="middle">Criteria infix DSL</text>
<text class="detail" x="850" y="304" text-anchor="middle" dominant-baseline="middle">eq, gt, inValues</text>
<text class="detail" x="850" y="324" text-anchor="middle" dominant-baseline="middle">andWith / orWith</text></g>
<g id="updateDsl"><rect class="card" x="1190" y="238" width="360" height="108" rx="12" fill="#FDF2F8" stroke="#DB2777"/>
<text class="cardTitle" x="1370" y="272" text-anchor="middle" dominant-baseline="middle">Update DSL</text>
<text class="detail" x="1370" y="304" text-anchor="middle" dominant-baseline="middle">setTo, incBy, pushValue</text>
<text class="detail" x="1370" y="324" text-anchor="middle" dominant-baseline="middle">andSet / andInc</text></g>
<g id="criteria"><rect class="card" x="170" y="522" width="360" height="96" rx="12" fill="#F0FDF4" stroke="#16A34A"/>
<text class="cardTitle" x="350" y="556" text-anchor="middle" dominant-baseline="middle">Criteria</text>
<text class="detail" x="350" y="588" text-anchor="middle" dominant-baseline="middle">predicate tree</text></g>
<g id="query"><rect class="card" x="670" y="522" width="360" height="96" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
<text class="cardTitle" x="850" y="556" text-anchor="middle" dominant-baseline="middle">Query</text>
<text class="detail" x="850" y="588" text-anchor="middle" dominant-baseline="middle">queryOf + sort + paginate</text></g>
<g id="update"><rect class="card" x="1170" y="522" width="360" height="96" rx="12" fill="#FDF2F8" stroke="#DB2777"/>
<text class="cardTitle" x="1350" y="556" text-anchor="middle" dominant-baseline="middle">Update</text>
<text class="detail" x="1350" y="588" text-anchor="middle" dominant-baseline="middle">Mongo update document</text></g>
<g id="operations"><rect class="card" x="610" y="850" width="500" height="96" rx="12" fill="#FAF5FF" stroke="#9333EA"/>
<image data-bluetape4k-icon="testcontainers/storage/mongodb.svg" x="705" y="868" width="32" height="32" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/><text class="cardTitle" x="860" y="884" text-anchor="middle" dominant-baseline="middle">ReactiveMongoOperations</text>
<text class="detail" x="860" y="916" text-anchor="middle" dominant-baseline="middle">find/update/remove executes Query and Update objects</text></g>
<path class="edge" d="M510 286 L660 286" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="edge edgeDashed" d="M1040 286 L1190 286" stroke="#DB2777"/>
<polygon points="1178,292 1190,286 1178,280" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="edge" d="M 850 346 L 850 406 Q 850 420 836 420 L 364 420 Q 350 420 350 434 L 350 522" stroke="#16A34A" marker-end="url(#arrow-green)"/>
<path class="edge" d="M530 570 L670 570" stroke="#EA580C" marker-end="url(#arrow-amber)"/>
<path class="edge" d="M1350 346 L1350 522" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="edge" d="M850 618 L850 850" stroke="#EA580C" marker-end="url(#arrow-amber)"/>
<path class="edge" d="M 1350 618 L 1350 728 Q 1350 742 1336 742 L 994 742 Q 980 742 980 756 L 980 850" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<g><rect x="541" y="248" width="108" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="555" y="265" fill="#2563EB">criteria()</text></g>
<g><rect x="1058" y="248" width="124" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="1072" y="265" fill="#DB2777">field update</text></g>
<g><rect x="878" y="676" width="124" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="892" y="693" fill="#EA580C">query object</text></g>
</svg>