<svg data-intent="Redesign the Criteria/Query/Update DSL as a query-building flow, not a layered call chain." data-evidence="spring-boot/mongodb/README.md; CriteriaExtensions.kt; QueryExtensions.kt; UpdateExtensions.kt" data-source-read="spring-boot/mongodb/README.md; CriteriaExtensions.kt; QueryExtensions.kt; UpdateExtensions.kt" xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-label="Criteria / Query / Update DSL Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="910"/>
<rect class="frame" x="34" y="30" width="1372" height="850" rx="8"/>
<text class="title" x="72" y="84">Criteria / Query / Update DSL Flow</text>
<text class="subtitle" x="76" y="116">The DSL flow shows how field-level helpers become Criteria, Query, and Update objects before execution.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="160" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">DSL inputs</text></g>
<g><rect class="panel" x="82" y="395" width="1276" height="220" rx="8"/><text class="panelTitle" x="110" y="431" dominant-baseline="middle">Spring Data query objects</text></g>
<g><rect class="panel" x="82" y="690" width="1276" height="140" rx="8"/><text class="panelTitle" x="110" y="726" dominant-baseline="middle">Mongo operation</text></g>
<g id="fields">
  <rect class="card" x="145" y="215" width="280" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="285" y="236" text-anchor="middle" dominant-baseline="middle">Field strings</text>
  <text class="detail" x="285" y="266" text-anchor="middle" dominant-baseline="middle">&quot;age&quot;.criteria()</text>
  <text class="detail" x="285" y="284" text-anchor="middle" dominant-baseline="middle">&quot;name&quot; setTo value</text>
</g>
<g id="criteriaDsl">
  <rect class="card" x="535" y="210" width="320" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="695" y="236" text-anchor="middle" dominant-baseline="middle">Criteria infix DSL</text>
  <text class="detail" x="695" y="266" text-anchor="middle" dominant-baseline="middle">eq, gt, inValues</text>
  <text class="detail" x="695" y="284" text-anchor="middle" dominant-baseline="middle">andWith / orWith</text>
</g>
<g id="updateDsl">
  <rect class="card" x="975" y="210" width="280" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1115" y="236" text-anchor="middle" dominant-baseline="middle">Update DSL</text>
  <text class="detail" x="1115" y="266" text-anchor="middle" dominant-baseline="middle">setTo, incBy, pushValue</text>
  <text class="detail" x="1115" y="284" text-anchor="middle" dominant-baseline="middle">andSet / andInc</text>
</g>
<g id="criteria">
  <rect class="card" x="170" y="455" width="290" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="315" y="490" text-anchor="middle" dominant-baseline="middle">Criteria</text>
  <text class="detail" x="315" y="520" text-anchor="middle" dominant-baseline="middle">predicate tree</text>
</g>
<g id="query">
  <rect class="card" x="575" y="455" width="290" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="720" y="490" text-anchor="middle" dominant-baseline="middle">Query</text>
  <text class="detail" x="720" y="520" text-anchor="middle" dominant-baseline="middle">queryOf + sort + paginate</text>
</g>
<g id="update">
  <rect class="card" x="980" y="455" width="290" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1125" y="490" text-anchor="middle" dominant-baseline="middle">Update</text>
  <text class="detail" x="1125" y="520" text-anchor="middle" dominant-baseline="middle">Mongo update document</text>
</g>
<g id="mongoOps">
  <rect class="card" x="535" y="735" width="370" height="62" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="720" y="759" text-anchor="middle" dominant-baseline="middle">ReactiveMongoOperations</text>
  <text class="detail" x="720" y="789" text-anchor="middle" dominant-baseline="middle">find/update/remove executes objects</text>
</g>
<path class="route" data-from="fields" data-to="criteriaDsl" d="M425 252 L535 252" stroke="#1D4ED8"/>
<path class="route dashed" data-from="fields" data-to="updateDsl" d="M425 289 L975 252" stroke="#BE185D"/>
<path class="route" data-from="criteriaDsl" data-to="criteria" d="M695 294 L695 355 L315 355 L315 455" stroke="#15803D"/>
<path class="route" data-from="criteria" data-to="query" d="M460 497 L575 497" stroke="#C2410C"/>
<path class="route" data-from="updateDsl" data-to="update" d="M1115 294 L1115 455" stroke="#BE185D"/>
<path class="route" data-from="query" data-to="mongoOps" d="M720 539 L720 735" stroke="#C2410C"/>
<path class="route" data-from="update" data-to="mongoOps" d="M1125 539 L1125 635 L760 635 L760 735" stroke="#BE185D"/>
</svg>
