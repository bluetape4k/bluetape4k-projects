<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title desc">
  <title id="title">NearCacheOperations Blocking Contract</title>
  <desc id="desc">Explain the method families exposed by NearCacheOperations without implying a specific provider.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1680" height="1080"/>
  <rect class="decor" x="44" y="36" width="1592" height="1008" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1516" height="794" rx="24"/>
  <text class="title" x="72" y="88">NearCacheOperations Blocking Contract</text>
  <text class="subtitle" x="76" y="121">Blocking callers use one contract for front-first reads, write-through updates, lifecycle, and statistics.</text>
  <g id="panel-contract">
    <rect class="group" x="610" y="190" width="460" height="220" rx="20"/>
    <text class="groupTitle" x="640" y="218" dominant-baseline="middle">Central blocking contract</text>
  </g>
  <g id="panel-readwrite">
    <rect class="group" x="92" y="475" width="1495" height="205" rx="20"/>
    <text class="groupTitle" x="122" y="503" dominant-baseline="middle">Data operations</text>
  </g>
  <g id="panel-lifecycle">
    <rect class="group" x="250" y="720" width="1300" height="170" rx="20"/>
    <text class="groupTitle" x="280" y="748" dominant-baseline="middle">Lifecycle and observability</text>
  </g>
  <path class="connector" data-edge="ops-&gt;read" data-label="exposes" d="M 650 310 L 390 310 L 390 540" stroke="#45A7A1"/>
  <g transform="translate(484.1,273)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;write" data-label="exposes" d="M 740 378 L 740 540" stroke="#58A978"/>
  <g transform="translate(762,446)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;delete" data-label="exposes" d="M 940 378 L 940 540" stroke="#DB7890"/>
  <g transform="translate(962,446)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">exposes</text>
  </g>
  <path class="connector" data-edge="ops-&gt;manage" data-label="exposes" d="M 1030 310 L 1420 310 L 1420 540" stroke="#D9AA4D"/>
  <g transform="translate(1189.1,273)">
    <rect class="labelPill" x="0" y="0" width="71.8" height="26" rx="8"/>
    <text class="small" x="35.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#D9AA4D">exposes</text>
  </g>
  <g id="node-ops" transform="translate(650,250)">
    <rect class="card" x="0" y="0" width="380" height="128" rx="10" fill="#E8F3FF" stroke="#75A9E8"/>
    <line x1="0" y1="50" x2="380" y2="50" stroke="#75A9E8" stroke-width="1.6"/>
    <text class="stereo" x="190" y="17" text-anchor="middle" dominant-baseline="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="classTitle" x="190" y="36" text-anchor="middle" dominant-baseline="middle">NearCacheOperations&lt;V&gt;</text>
    <text class="member" x="190" y="71" text-anchor="middle" dominant-baseline="middle">AutoCloseable</text>
    <text class="member" x="190" y="89" text-anchor="middle" dominant-baseline="middle">cacheName / isClosed</text>
    <text class="member" x="190" y="107" text-anchor="middle" dominant-baseline="middle">front cache first, back cache fallback</text>
  </g>
  <g id="node-read" transform="translate(145,540)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="150" y="15.5" text-anchor="middle" dominant-baseline="middle">Read path</text>
    <text class="detail" x="150" y="34.5" text-anchor="middle" dominant-baseline="middle">get(key)</text>
    <text class="detail" x="150" y="53.5" text-anchor="middle" dominant-baseline="middle">getAll(keys)</text>
    <text class="detail" x="150" y="72.5" text-anchor="middle" dominant-baseline="middle">containsKey(key)</text>
  </g>
  <g id="node-write" transform="translate(520,540)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="150" y="15.5" text-anchor="middle" dominant-baseline="middle">Write path</text>
    <text class="detail" x="150" y="34.5" text-anchor="middle" dominant-baseline="middle">put / putAll</text>
    <text class="detail" x="150" y="53.5" text-anchor="middle" dominant-baseline="middle">putIfAbsent</text>
    <text class="detail" x="150" y="72.5" text-anchor="middle" dominant-baseline="middle">replace</text>
  </g>
  <g id="node-delete" transform="translate(895,540)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="150" y="15.5" text-anchor="middle" dominant-baseline="middle">Delete path</text>
    <text class="detail" x="150" y="34.5" text-anchor="middle" dominant-baseline="middle">remove / removeAll</text>
    <text class="detail" x="150" y="53.5" text-anchor="middle" dominant-baseline="middle">getAndRemove</text>
    <text class="detail" x="150" y="72.5" text-anchor="middle" dominant-baseline="middle">getAndReplace</text>
  </g>
  <g id="node-manage" transform="translate(1270,540)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="150" y="15.5" text-anchor="middle" dominant-baseline="middle">Cache management</text>
    <text class="detail" x="150" y="34.5" text-anchor="middle" dominant-baseline="middle">clearLocal()</text>
    <text class="detail" x="150" y="53.5" text-anchor="middle" dominant-baseline="middle">clearAll()</text>
    <text class="detail" x="150" y="72.5" text-anchor="middle" dominant-baseline="middle">local/back size</text>
  </g>
  <g id="node-stats" transform="translate(355,785)">
    <rect class="card" x="0" y="0" width="315" height="82" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="157.5" y="22" text-anchor="middle" dominant-baseline="middle">NearCacheStatistics</text>
    <text class="detail" x="157.5" y="41" text-anchor="middle" dominant-baseline="middle">local/back hit-miss</text>
    <text class="detail" x="157.5" y="60" text-anchor="middle" dominant-baseline="middle">evictions and hitRate</text>
  </g>
  <g id="node-close" transform="translate(815,785)">
    <rect class="card" x="0" y="0" width="260" height="82" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="cardTitle" x="130" y="22" text-anchor="middle" dominant-baseline="middle">Resource lifecycle</text>
    <text class="detail" x="130" y="41" text-anchor="middle" dominant-baseline="middle">close()</text>
    <text class="detail" x="130" y="60" text-anchor="middle" dominant-baseline="middle">isClosed guard</text>
  </g>
  <g id="node-resilience" transform="translate(1215,785)">
    <rect class="card" x="0" y="0" width="300" height="82" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="150" y="22" text-anchor="middle" dominant-baseline="middle">Optional resilience</text>
    <text class="detail" x="150" y="41" text-anchor="middle" dominant-baseline="middle">withResilience { ... }</text>
    <text class="detail" x="150" y="60" text-anchor="middle" dominant-baseline="middle">Retry + get failure strategy</text>
  </g>
  <g transform="translate(76,976)">
    <rect class="labelPill" x="0" y="0" width="1528" height="48" rx="10"/>
    <text class="small" x="764" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-projects / cache modules - github.com/bluetape4k/bluetape4k-projects</text>
  </g>
</svg>
