<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-label="LettuceBinaryCodec Hierarchy">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="implements" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 15 7 L 1 13 Z" fill="#ffffff" stroke="#111827" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#9333ea" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="open-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
  </defs>

  <style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .canvas { fill: #f8fafc; }
    .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; filter: url(#softShadow); }
    .title { font-family: "Architects Daughter"; font-size: 50px; fill: #0f172a; }
    .subtitle { font-family: "Comic Mono"; font-size: 18px; fill: #475569; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.7; }
    .panelLabel { font-family: "Architects Daughter"; font-size: 27px; fill: #0f172a; }
    .card { filter: url(#softShadow); stroke-width: 2.1; }
    .iface { fill: #f8fafc; stroke: #64748b; stroke-dasharray: 8 7; }
    .binary { fill: #eff6ff; stroke: #2563eb; }
    .factory { fill: #f0fdf4; stroke: #16a34a; }
    .serializer { fill: #fff7ed; stroke: #ea580c; }
    .json { fill: #faf5ff; stroke: #9333ea; }
    .primitive { fill: #f0fdfa; stroke: #0d9488; }
    .external { fill: #fdf2f8; stroke: #db2777; }
    .name { font-family: "Architects Daughter"; font-size: 26px; fill: #0f172a; }
    .smallName { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
    .meta { font-family: "Comic Mono"; font-size: 14px; fill: #475569; }
    .tiny { font-family: "Comic Mono"; font-size: 13px; fill: #64748b; }
    .impl { fill: none; stroke: #111827; stroke-width: 2.2; stroke-dasharray: 8 7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#implements); }
    .useBlue { fill: none; stroke: #2563eb; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-blue); }
    .usePurple { fill: none; stroke: #9333ea; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-purple); }
    .useGreen { fill: none; stroke: #16a34a; stroke-width: 3; stroke-dasharray: 9 8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-green); }
    .flow { fill: none; stroke: #2563eb; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#open-blue); }
  </style>

  <rect class="canvas" width="1800" height="1080"/>
  <rect class="frame" x="38" y="32" width="1724" height="1016" rx="8"/>

  <text class="title" x="82" y="94">LettuceBinaryCodec Hierarchy</text>
  <text class="subtitle" x="86" y="128">The binary codec is one concrete RedisCodec; factories choose BinarySerializer combinations, while JSON and primitive codecs stay separate.</text>

  <rect class="panel" x="82" y="172" width="1636" height="168" rx="8"/>
  <rect class="panel" x="82" y="380" width="1636" height="302" rx="8"/>
  <rect class="panel" x="82" y="724" width="1636" height="210" rx="8"/>

  <text class="panelLabel" x="112" y="214">Lettuce codec contracts</text>
  <text class="panelLabel" x="112" y="422">Binary codec construction path</text>
  <text class="panelLabel" x="112" y="766">Related codec families in the same package</text>

  <g id="redis-codec">
    <rect class="card iface" x="288" y="230" width="310" height="80" rx="8"/>
    <text class="smallName" x="443" y="263" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="443" y="293" text-anchor="middle">RedisCodec&lt;String,V&gt;</text>
  </g>
  <g id="bytebuf">
    <rect class="card iface" x="716" y="230" width="360" height="80" rx="8"/>
    <text class="smallName" x="896" y="256" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="896" y="283" text-anchor="middle">ToByteBufEncoder</text>
    <text class="meta" x="896" y="305" text-anchor="middle">&lt;String,V&gt;</text>
  </g>
  <g id="empty-buffer">
    <rect class="card primitive" x="1204" y="230" width="286" height="80" rx="8"/>
    <text class="smallName" x="1347" y="263" text-anchor="middle">EMPTY_BYTEBUFFER</text>
    <text class="meta" x="1347" y="291" text-anchor="middle">null key -> empty ByteBuffer</text>
  </g>

  <g id="factory">
    <rect class="card factory" x="132" y="470" width="322" height="142" rx="8"/>
    <text class="name" x="293" y="505" text-anchor="middle">LettuceBinaryCodecs</text>
    <text class="meta" x="293" y="535" text-anchor="middle">object factory</text>
    <text class="meta" x="293" y="558" text-anchor="middle">default() -> lz4Fory()</text>
    <text class="meta" x="293" y="581" text-anchor="middle">codec(BinarySerializer)</text>
  </g>

  <g id="binary-codec">
    <rect class="card binary" x="594" y="450" width="420" height="184" rx="8"/>
    <text class="name" x="804" y="488" text-anchor="middle">LettuceBinaryCodec&lt;V&gt;</text>
    <text class="meta" x="804" y="520" text-anchor="middle">class with BinarySerializer</text>
    <text class="meta" x="804" y="545" text-anchor="middle">encodeKey: String -> UTF-8 bytes</text>
    <text class="meta" x="804" y="570" text-anchor="middle">encodeValue: serializer.serialize(value)</text>
    <text class="meta" x="804" y="595" text-anchor="middle">estimate value size: -1 to avoid double serialization</text>
  </g>

  <g id="serializer">
    <rect class="card serializer" x="1132" y="446" width="302" height="144" rx="8"/>
    <text class="name" x="1283" y="482" text-anchor="middle">BinarySerializer</text>
    <text class="meta" x="1283" y="513" text-anchor="middle">serialize(value)</text>
    <text class="meta" x="1283" y="536" text-anchor="middle">deserialize(bytes)</text>
    <text class="meta" x="1283" y="559" text-anchor="middle">chosen by factory methods</text>
  </g>

  <g id="matrix">
    <rect class="card serializer" x="1490" y="414" width="190" height="234" rx="8"/>
    <text class="smallName" x="1585" y="449" text-anchor="middle">Serializer sets</text>
    <text class="meta" x="1585" y="481" text-anchor="middle">JDK / Kryo / Fory</text>
    <text class="meta" x="1585" y="506" text-anchor="middle">FastFory cache-only</text>
    <text class="meta" x="1585" y="541" text-anchor="middle">Compression</text>
    <text class="meta" x="1585" y="566" text-anchor="middle">GZip / Deflate</text>
    <text class="meta" x="1585" y="591" text-anchor="middle">LZ4 / Snappy / Zstd</text>
    <text class="tiny" x="1585" y="623" text-anchor="middle">Protobuf lives in</text>
    <text class="tiny" x="1585" y="643" text-anchor="middle">bluetape4k-protobuf</text>
  </g>

  <path class="impl" d="M 758 450 V 350 H 443 V 318"/>
  <path class="impl" d="M 860 450 V 350 H 896 V 318"/>
  <path class="useGreen" d="M 454 541 H 586"/>
  <path class="useBlue" d="M 1014 520 H 1124"/>
  <path class="useBlue" d="M 1434 518 H 1482"/>
  <path class="flow" d="M 1347 310 V 358 H 872 V 442"/>

  <g id="json-codec">
    <rect class="card json" x="178" y="806" width="380" height="104" rx="8"/>
    <text class="name" x="368" y="842" text-anchor="middle">LettuceJsonCodec&lt;V&gt;</text>
    <text class="meta" x="368" y="873" text-anchor="middle">JsonSerializer + explicit valueType</text>
    <text class="meta" x="368" y="896" text-anchor="middle">factories: jackson3(), fastjson2()</text>
  </g>
  <g id="primitive-codecs">
    <rect class="card primitive" x="710" y="806" width="322" height="104" rx="8"/>
    <text class="name" x="871" y="842" text-anchor="middle">Primitive codecs</text>
    <text class="meta" x="871" y="873" text-anchor="middle">LettuceIntCodec: 4-byte big-endian</text>
    <text class="meta" x="871" y="896" text-anchor="middle">LettuceLongCodec: 8-byte big-endian</text>
  </g>
  <g id="protobuf-note">
    <rect class="card external" x="1184" y="806" width="388" height="104" rx="8"/>
    <text class="name" x="1378" y="842" text-anchor="middle">External protobuf codecs</text>
    <text class="meta" x="1378" y="873" text-anchor="middle">provided by bluetape4k-protobuf</text>
    <text class="meta" x="1378" y="896" text-anchor="middle">not implemented in infra/lettuce</text>
  </g>

  <g id="legend" transform="translate(112,980)">
    <path class="impl" d="M 0 14 H 52"/>
    <text class="tiny" x="68" y="19">implements</text>
    <path class="useGreen" d="M 170 14 H 222"/>
    <text class="tiny" x="238" y="19">factory creates</text>
    <path class="useBlue" d="M 390 14 H 442"/>
    <text class="tiny" x="458" y="19">uses / references</text>
  </g>
</svg>
