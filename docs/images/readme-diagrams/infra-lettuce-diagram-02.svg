<path class="inherit" data-from="LettuceLongCodec" data-to="RedisCodec" data-route-color="blue" d="M1336 398 L1336 279 L1258 279" stroke="#4F83BF"/>
<path class="inherit" data-from="LettuceIntCodec" data-to="RedisCodec" data-route-color="teal" d="M1078 398 L1078 311" stroke="#2E8F89"/>
<path class="inherit" data-from="LettuceBinaryCodec" data-to="ToByteBufEncoder" data-route-color="amber" d="M688 398 L688 311" stroke="#B9851B"/>
<path class="inherit" data-from="LettuceBinaryCodec" data-to="RedisCodec" data-route-color="pink" d="M826 398 L826 355 L940 355 L940 311" stroke="#C94D68"/>
