<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-label="JPA Entity Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1800" height="1320"/>
<rect class="frame" x="32" y="28" width="1736" height="1264" rx="30"/>
<text class="title" x="68" y="84">JPA Entity Class Hierarchy</text>
<text class="subtitle" x="72" y="116">Class hierarchy is arranged top-down with colored solid and dashed relationships to avoid ambiguous overlaps.</text>
<g><rect class="panel" x="80" y="160" width="1640" height="240" rx="22"/><text class="panelTitle" x="104" y="194">JPA base contracts</text></g>
<g id="persistable"><rect class="card" x="180" y="230" width="310" height="122" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="180" y1="296" x2="490" y2="296" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="335" y="250" text-anchor="middle">interface</text><text class="classTitle" x="335" y="278" text-anchor="middle">Persistable</text><text class="member" x="198" y="320">+getId()</text>
<text class="member" x="198" y="337">+isNew()</text></g>
<g id="auditable"><rect class="card" x="690" y="220" width="340" height="142" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="690" y1="286" x2="1030" y2="286" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="860" y="240" text-anchor="middle">interface</text><text class="classTitle" x="860" y="268" text-anchor="middle">Auditable</text><text class="member" x="708" y="320">+createdAt / updatedAt</text>
<text class="member" x="708" y="337">+createdBy / updatedBy</text></g>
<g id="versioned"><rect class="card" x="1230" y="230" width="310" height="122" rx="7" fill="#F1ECFF" stroke="#8A72D6"/><line x1="1230" y1="296" x2="1540" y2="296" stroke="#8A72D6" stroke-width="1.5"/><text class="stereo" x="1385" y="250" text-anchor="middle">interface</text><text class="classTitle" x="1385" y="278" text-anchor="middle">Versioned</text><text class="member" x="1248" y="328">+version</text></g>
<g><rect class="panel" x="80" y="505" width="1640" height="310" rx="22"/><text class="panelTitle" x="104" y="539">Entity hierarchy</text></g>
<g id="mapped"><rect class="card" x="160" y="610" width="330" height="132" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="160" y1="676" x2="490" y2="676" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="325" y="630" text-anchor="middle">mapped superclass</text><text class="classTitle" x="325" y="658" text-anchor="middle">AbstractJpaEntity</text><text class="member" x="178" y="705">@MappedSuperclass</text>
<text class="member" x="178" y="722">id and equality contract</text></g>
<g id="auditEntity"><rect class="card" x="610" y="590" width="370" height="170" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="610" y1="672" x2="980" y2="672" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="795" y="610" text-anchor="middle">mapped superclass</text><text class="classTitle" x="795" y="632" text-anchor="middle">AbstractAuditableJpa</text><text class="classTitle" x="795" y="654" text-anchor="middle">Entity</text><text class="member" x="628" y="712">auditing fields</text>
<text class="member" x="628" y="729">Spring Data auditing hooks</text></g>
<g id="tenantEntity"><rect class="card" x="1100" y="610" width="360" height="132" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1100" y1="676" x2="1460" y2="676" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1280" y="630" text-anchor="middle">optional superclass</text><text class="classTitle" x="1280" y="658" text-anchor="middle">TenantAwareJpaEntity</text><text class="member" x="1118" y="705">tenant id</text>
<text class="member" x="1118" y="722">multi-tenant boundary</text></g>
<path class="inherit" d="M315 610 L315 430 L335 430 L335 352" style="stroke:#4F83BF;"/>
<path class="inherit" d="M795 590 L795 430 L860 430 L860 362" style="stroke:#3E9868;stroke-dasharray:8 7;"/>
<path class="inherit" d="M1280 610 L1280 430 L1385 430 L1385 352" style="stroke:#755BC6;stroke-dasharray:8 7;"/>
<g><rect class="panel" x="80" y="915" width="1640" height="260" rx="22"/><text class="panelTitle" x="104" y="949">Concrete domain models</text></g>
<g id="aggregate"><rect class="card" x="210" y="1000" width="320" height="126" rx="7" fill="#FDECEF" stroke="#DC6B82"/><line x1="210" y1="1066" x2="530" y2="1066" stroke="#DC6B82" stroke-width="1.5"/><text class="stereo" x="370" y="1020" text-anchor="middle">entity</text><text class="classTitle" x="370" y="1048" text-anchor="middle">Domain aggregate</text><text class="member" x="228" y="1092">business identity</text>
<text class="member" x="228" y="1109">relationships</text></g>
<g id="lookup"><rect class="card" x="700" y="1000" width="320" height="126" rx="7" fill="#E8F3FF" stroke="#5B8DEF"/><line x1="700" y1="1066" x2="1020" y2="1066" stroke="#5B8DEF" stroke-width="1.5"/><text class="stereo" x="860" y="1020" text-anchor="middle">entity</text><text class="classTitle" x="860" y="1048" text-anchor="middle">Lookup entity</text><text class="member" x="718" y="1092">stable id</text>
<text class="member" x="718" y="1109">read-mostly table</text></g>
<g id="join"><rect class="card" x="1190" y="1000" width="320" height="126" rx="7" fill="#F2F5F9" stroke="#9AA8B8"/><line x1="1190" y1="1066" x2="1510" y2="1066" stroke="#9AA8B8" stroke-width="1.5"/><text class="stereo" x="1350" y="1020" text-anchor="middle">entity</text><text class="classTitle" x="1350" y="1048" text-anchor="middle">Join / link entity</text><text class="member" x="1208" y="1092">association table</text>
<text class="member" x="1208" y="1109">compact lifecycle</text></g>
<path class="inherit" d="M370 1000 L370 878 L325 878 L325 742" style="stroke:#C94D68;"/>
<path class="inherit" d="M860 1000 L860 850 L795 850 L795 760" style="stroke:#4F83BF;stroke-dasharray:8 7;"/>
<path class="inherit" d="M1350 1000 L1350 850 L1280 850 L1280 742" style="stroke:#758297;stroke-dasharray:8 7;"/>
<g><rect x="260" y="1225" width="1280" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="900" y="1251" text-anchor="middle">Solid colored lines mark direct inheritance. Dashed colored lines mark optional interface or mapped-superclass relationships.</text></g>
</svg>
