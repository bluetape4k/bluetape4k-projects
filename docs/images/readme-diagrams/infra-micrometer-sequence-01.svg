<svg xmlns="http://www.w3.org/2000/svg" width="3148" height="910" viewBox="0 0 3148 910" role="img" aria-label="Retrofit2 Metric Collection Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="3148" height="910"/>
<rect class="frame" x="32" y="28" width="3084" height="854" rx="28"/>
<text class="title" x="66" y="82">Retrofit2 Metric Collection Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Client</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="464" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="614" y="209" text-anchor="middle">Retrofit2</text>
<line class="lifeline" x1="614" y1="252" x2="614" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="848" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="998" y="198.5" text-anchor="middle">Micrometer Retrofit</text>
<text class="smallLabel" x="998" y="219.5" text-anchor="middle">Metrics Factory</text>
<line class="lifeline" x1="998" y1="252" x2="998" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1232" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1382" y="209" text-anchor="middle">External API</text>
<line class="lifeline" x1="1382" y1="252" x2="1382" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1616" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1766" y="209" text-anchor="middle">MeterRegistry</text>
<line class="lifeline" x1="1766" y1="252" x2="1766" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2000" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2150" y="209" text-anchor="middle">-Metrics</text>
<line class="lifeline" x1="2150" y1="252" x2="2150" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2384" y="166" width="300" height="72" rx="20" fill="#F7F1E7" stroke="#B88A44"/>
<text class="smallLabel" x="2534" y="209" text-anchor="middle">-Retrofit</text>
<line class="lifeline" x1="2534" y1="252" x2="2534" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2768" y="166" width="300" height="72" rx="20" fill="#EEF6D9" stroke="#8BA84D"/>
<text class="smallLabel" x="2918" y="209" text-anchor="middle">-Client</text>
<line class="lifeline" x1="2918" y1="252" x2="2918" y2="850" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="317" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="335" y="313" text-anchor="start">1. API call</text>
<path class="line" d="M230 332 L614 332"/>
<rect x="646.5" y="362" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="664.5" y="389" text-anchor="start">2. Create instrumented Call wrapper</text>
<path class="line" d="M614 408 L998 408"/>
<rect x="1085" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="465" text-anchor="start">3. HTTP request</text>
<path class="line" d="M998 484 L1382 484"/>
<rect x="1661" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1679" y="541" text-anchor="start">4. HTTP response</text>
<path class="dashed" d="M1382 560 L2150 560"/>
<rect x="1158" y="590" width="448" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1176" y="617" text-anchor="start">5. Record timer (method, uri, status_code, outcome)</text>
<path class="line" d="M998 636 L1766 636"/>
<rect x="1661" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1679" y="693" text-anchor="start">6. Return response</text>
<path class="dashed" d="M998 712 L2534 712"/>
<rect x="1661" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1679" y="769" text-anchor="start">7. Return result</text>
<path class="dashed" d="M614 788 L2918 788"/>
</svg>
