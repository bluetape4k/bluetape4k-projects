<svg xmlns="http://www.w3.org/2000/svg" width="1494" height="1214" viewBox="0 0 1494 1214" role="img" aria-label="In-process Test Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1494" height="1214"/>
<rect class="frame" x="32" y="28" width="1430" height="1158" rx="28"/>
<text class="title" x="66" y="82">In-process Test Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="199" y="209" text-anchor="middle">Test code</text>
<line class="lifeline" x1="199" y1="252" x2="199" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="445.3" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="564.3" y="209" text-anchor="middle">InprocessServer</text>
<line class="lifeline" x1="564.3" y1="252" x2="564.3" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="810.7" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="929.7" y="209" text-anchor="middle">ServiceImpl</text>
<line class="lifeline" x1="929.7" y1="252" x2="929.7" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1176" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1295" y="209" text-anchor="middle">InprocessClient</text>
<line class="lifeline" x1="1295" y1="252" x2="1295" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="178.2" y="286" width="407" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="196.2" y="313" text-anchor="start">1. InProcessServerBuilder.forName(test-server)</text>
<path class="line" d="M199 332 L564.3 332"/>
<rect x="612" y="362" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="630" y="389" text-anchor="start">2. Register and start service</text>
<path class="line" d="M564.3 408 L929.7 408"/>
<rect x="539.5" y="438" width="415" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="557.5" y="465" text-anchor="start">3. InProcessChannelBuilder.forName(test-server)</text>
<path class="line" d="M199 484 L1295 484"/>
<rect x="782.7" y="514" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="800.7" y="541" text-anchor="start">4. Connect via in-memory channel</text>
<path class="line" d="M1295 560 L564.3 560"/>
<rect x="642" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="660" y="617" text-anchor="start">5. stub.call(request)</text>
<path class="line" d="M199 636 L1295 636"/>
<rect x="770.2" y="666" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="788.2" y="693" text-anchor="start">6. In-memory transport (no network)</text>
<path class="line" d="M1295 712 L564.3 712"/>
<rect x="642" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="660" y="769" text-anchor="start">7. Invoke method</text>
<path class="line" d="M564.3 788 L929.7 788"/>
<rect x="1007.3" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1025.3" y="845" text-anchor="start">8. Response</text>
<path class="dashed" d="M929.7 864 L1295 864"/>
<rect x="642" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="660" y="921" text-anchor="start">9. Return Response</text>
<path class="dashed" d="M1295 940 L199 940"/>
<rect x="276.7" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="294.7" y="997" text-anchor="start">10. server.shutdown()</text>
<path class="line" d="M199 1016 L564.3 1016"/>
<rect x="640" y="1046" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="658" y="1073" text-anchor="start">11. channel.shutdown()</text>
<path class="line" d="M199 1092 L1295 1092"/>
</svg>
