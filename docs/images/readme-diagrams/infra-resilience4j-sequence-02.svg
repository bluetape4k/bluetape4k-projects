<svg xmlns="http://www.w3.org/2000/svg" width="1559" height="1746" viewBox="0 0 1559 1746" role="img" aria-label="SuspendCache Operation Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1559" height="1746"/>
<rect class="frame" x="32" y="28" width="1495" height="1690" rx="28"/>
<text class="title" x="66" y="82">SuspendCache Operation Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="251" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="205.5" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="205.5" y1="252" x2="205.5" y2="1686" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="462.7" y="166" width="251" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="588.2" y="209" text-anchor="middle">SuspendCacheImpl</text>
<line class="lifeline" x1="588.2" y1="252" x2="588.2" y2="1686" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="845.3" y="166" width="251" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="970.8" y="209" text-anchor="middle">JCache</text>
<line class="lifeline" x1="970.8" y1="252" x2="970.8" y2="1686" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1228" y="166" width="251" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1353.5" y="209" text-anchor="middle">Loader</text>
<line class="lifeline" x1="1353.5" y1="252" x2="1353.5" y2="1686" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="213.3" y="286" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="231.3" y="313" text-anchor="start">1. computeIfAbsent(user:1) { loadUser() }</text>
<path class="line" d="M205.5 332 L588.2 332"/>
<rect x="672.5" y="362" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="690.5" y="389" text-anchor="start">2. containsKey(user:1)</text>
<path class="line" d="M588.2 408 L970.8 408"/>
<rect x="135.5" y="506" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="157.5" y="533" text-anchor="start">ALT: Cache Hit</text>
<rect x="674.5" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="692.5" y="465" text-anchor="start">4. true</text>
<path class="dashed" d="M970.8 484 L588.2 484"/>
<rect x="674.5" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="692.5" y="541" text-anchor="start">5. get(user:1)</text>
<path class="line" d="M588.2 560 L970.8 560"/>
<rect x="674.5" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="692.5" y="617" text-anchor="start">6. cachedValue</text>
<path class="dashed" d="M970.8 636 L588.2 636"/>
<rect x="501.2" y="666" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="519.2" y="693" text-anchor="start">7. publish onCacheHit() event</text>
<path class="line" d="M588.2 712 C652.2 712 652.2 746 588.2 746"/>
<rect x="291.8" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="309.8" y="769" text-anchor="start">8. cachedValue</text>
<path class="dashed" d="M588.2 788 L205.5 788"/>
<rect x="135.5" y="1144" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="157.5" y="1171" text-anchor="start">ELSE: Cache Miss</text>
<rect x="674.5" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="692.5" y="845" text-anchor="start">10. false</text>
<path class="dashed" d="M970.8 864 L588.2 864"/>
<rect x="493.2" y="894" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="511.2" y="921" text-anchor="start">11. publish onCacheMiss() event</text>
<path class="line" d="M588.2 940 C652.2 940 652.2 974 588.2 974"/>
<rect x="827.8" y="970" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="845.8" y="997" text-anchor="start">12. execute loader() as suspend</text>
<path class="line" d="M588.2 1016 L1353.5 1016"/>
<rect x="865.8" y="1046" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="883.8" y="1073" text-anchor="start">13. loadedValue</text>
<path class="dashed" d="M1353.5 1092 L588.2 1092"/>
<rect x="648.5" y="1122" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="666.5" y="1149" text-anchor="start">14. put(user:1, loadedValue)</text>
<path class="line" d="M588.2 1168 L970.8 1168"/>
<rect x="291.8" y="1198" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="309.8" y="1225" text-anchor="start">15. loadedValue</text>
<path class="dashed" d="M588.2 1244 L205.5 1244"/>
<rect x="135.5" y="1892" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="157.5" y="1919" text-anchor="start">ELSE: Cache Error</text>
<rect x="674.5" y="1274" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="692.5" y="1301" text-anchor="start">17. Exception</text>
<path class="dashed" d="M970.8 1320 L588.2 1320"/>
<rect x="509.2" y="1350" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="527.2" y="1377" text-anchor="start">18. publish onError() event</text>
<path class="line" d="M588.2 1396 C652.2 1396 652.2 1430 588.2 1430"/>
<rect x="823.8" y="1426" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="841.8" y="1453" text-anchor="start">19. execute loader() as fallback</text>
<path class="line" d="M588.2 1472 L1353.5 1472"/>
<rect x="865.8" y="1502" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="883.8" y="1529" text-anchor="start">20. loadedValue</text>
<path class="dashed" d="M1353.5 1548 L588.2 1548"/>
<rect x="291.8" y="1578" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="309.8" y="1605" text-anchor="start">21. loadedValue</text>
<path class="dashed" d="M588.2 1624 L205.5 1624"/>
</svg>
