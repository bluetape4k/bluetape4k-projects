<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1836" viewBox="0 0 1200 1836" role="img" aria-label="SuspendCache Operation Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1200" height="1836"/>
<rect class="frame" x="32" y="28" width="1136" height="1780" rx="28"/>
<text class="title" x="66" y="82">SuspendCache Operation Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="35" y="166" width="210" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line x1="140" y1="252" x2="140" y2="1776" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="341.6666666666667" y="166" width="210" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="446.6666666666667" y="209" text-anchor="middle">SuspendCacheImpl</text>
<line x1="446.6666666666667" y1="252" x2="446.6666666666667" y2="1776" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="648.3333333333334" y="166" width="210" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="753.3333333333334" y="209" text-anchor="middle">JCache</text>
<line x1="753.3333333333334" y1="252" x2="753.3333333333334" y2="1776" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="955" y="166" width="210" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1060" y="209" text-anchor="middle">Loader</text>
<line x1="1060" y1="252" x2="1060" y2="1776" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="158" y="270" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="297" text-anchor="start">1. computeIfAbsent(user:1) { loadUser() }</text>
<path class="line" d="M140 310 L446.6666666666667 310"/>
<rect x="464.6666666666667" y="352" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="379" text-anchor="start">2. containsKey(user:1)</text>
<path class="line" d="M446.6666666666667 392 L753.3333333333334 392"/>
<rect x="464.6666666666667" y="434" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="461" text-anchor="start">3. true</text>
<path class="dashed" d="M753.3333333333334 474 L446.6666666666667 474"/>
<rect x="464.6666666666667" y="516" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="543" text-anchor="start">4. get(user:1)</text>
<path class="line" d="M446.6666666666667 556 L753.3333333333334 556"/>
<rect x="464.6666666666667" y="598" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="625" text-anchor="start">5. cachedValue</text>
<path class="dashed" d="M753.3333333333334 638 L446.6666666666667 638"/>
<rect x="464.6666666666667" y="680" width="190" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="707" text-anchor="start">6. publish</text>
<text class="strong" x="480.6666666666667" y="730" text-anchor="start">onCacheHit() event</text>
<path class="line" d="M446.6666666666667 720 C502.6666666666667 720 502.6666666666667 750 446.6666666666667 750"/>
<rect x="158" y="762" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="789" text-anchor="start">7. cachedValue</text>
<path class="dashed" d="M446.6666666666667 802 L140 802"/>
<rect x="464.6666666666667" y="844" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="871" text-anchor="start">8. false</text>
<path class="dashed" d="M753.3333333333334 884 L446.6666666666667 884"/>
<rect x="464.6666666666667" y="926" width="190" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="953" text-anchor="start">9. publish</text>
<text class="strong" x="480.6666666666667" y="976" text-anchor="start">onCacheMiss() event</text>
<path class="line" d="M446.6666666666667 966 C502.6666666666667 966 502.6666666666667 996 446.6666666666667 996"/>
<rect x="464.6666666666667" y="1008" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1035" text-anchor="start">10. execute loader() as suspend</text>
<path class="line" d="M446.6666666666667 1048 L1060 1048"/>
<rect x="464.6666666666667" y="1090" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1117" text-anchor="start">11. loadedValue</text>
<path class="dashed" d="M1060 1130 L446.6666666666667 1130"/>
<rect x="464.6666666666667" y="1172" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1199" text-anchor="start">12. put(user:1, loadedValue)</text>
<path class="line" d="M446.6666666666667 1212 L753.3333333333334 1212"/>
<rect x="158" y="1254" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1281" text-anchor="start">13. loadedValue</text>
<path class="dashed" d="M446.6666666666667 1294 L140 1294"/>
<rect x="464.6666666666667" y="1336" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1363" text-anchor="start">14. Exception</text>
<path class="dashed" d="M753.3333333333334 1376 L446.6666666666667 1376"/>
<rect x="464.6666666666667" y="1418" width="190" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1445" text-anchor="start">15. publish onError()</text>
<text class="strong" x="480.6666666666667" y="1468" text-anchor="start">event</text>
<path class="line" d="M446.6666666666667 1458 C502.6666666666667 1458 502.6666666666667 1488 446.6666666666667 1488"/>
<rect x="464.6666666666667" y="1500" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1527" text-anchor="start">16. execute loader() as fallback</text>
<path class="line" d="M446.6666666666667 1540 L1060 1540"/>
<rect x="464.6666666666667" y="1582" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1609" text-anchor="start">17. loadedValue</text>
<path class="dashed" d="M1060 1622 L446.6666666666667 1622"/>
<rect x="158" y="1664" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1691" text-anchor="start">18. loadedValue</text>
<path class="dashed" d="M446.6666666666667 1704 L140 1704"/>
</svg>
