<svg xmlns="http://www.w3.org/2000/svg" width="1428" height="2600" viewBox="0 0 1428 2600" role="img" aria-label="SuspendCache Operation Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1428" height="2600"/>
<rect class="frame" x="32" y="28" width="1364" height="2544" rx="28"/>
<text class="title" x="66" y="82">SuspendCache Operation Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="14.5" y="166" width="251" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2540" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="397.16666666666674" y="166" width="251" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="522.6666666666667" y="209" text-anchor="middle">SuspendCacheImpl</text>
<line class="lifeline" x1="522.6666666666667" y1="252" x2="522.6666666666667" y2="2540" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="779.8333333333334" y="166" width="251" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="905.3333333333334" y="209" text-anchor="middle">JCache</text>
<line class="lifeline" x1="905.3333333333334" y1="252" x2="905.3333333333334" y2="2540" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1162.5" y="166" width="251" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1288" y="209" text-anchor="middle">Loader</text>
<line class="lifeline" x1="1288" y1="252" x2="1288" y2="2540" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="147.83333333333337" y="286" width="367" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="165.83333333333337" y="313" text-anchor="start">1. computeIfAbsent(user:1) { loadUser() }</text>
<path class="line" d="M140 344 L522.6666666666667 344"/>
<rect x="607" y="396" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="625" y="423" text-anchor="start">2. containsKey(user:1)</text>
<path class="line" d="M522.6666666666667 454 L905.3333333333334 454"/>
<rect x="70" y="506" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="533" text-anchor="start">ALT: Cache Hit</text>
<rect x="609" y="574" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="627" y="601" text-anchor="start">4. true</text>
<path class="dashed" d="M905.3333333333334 632 L522.6666666666667 632"/>
<rect x="609" y="684" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="627" y="711" text-anchor="start">5. get(user:1)</text>
<path class="line" d="M522.6666666666667 742 L905.3333333333334 742"/>
<rect x="609" y="794" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="627" y="821" text-anchor="start">6. cachedValue</text>
<path class="dashed" d="M905.3333333333334 852 L522.6666666666667 852"/>
<rect x="435.66666666666674" y="904" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="453.66666666666674" y="931" text-anchor="start">7. publish onCacheHit() event</text>
<path class="line" d="M522.6666666666667 962 C586.6666666666667 962 586.6666666666667 996 522.6666666666667 996"/>
<rect x="226.33333333333337" y="1034" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="244.33333333333337" y="1061" text-anchor="start">8. cachedValue</text>
<path class="dashed" d="M522.6666666666667 1092 L140 1092"/>
<rect x="70" y="1144" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1171" text-anchor="start">ELSE: Cache Miss</text>
<rect x="609" y="1212" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="627" y="1239" text-anchor="start">10. false</text>
<path class="dashed" d="M905.3333333333334 1270 L522.6666666666667 1270"/>
<rect x="427.66666666666674" y="1322" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="445.66666666666674" y="1349" text-anchor="start">11. publish onCacheMiss() event</text>
<path class="line" d="M522.6666666666667 1380 C586.6666666666667 1380 586.6666666666667 1414 522.6666666666667 1414"/>
<rect x="762.3333333333334" y="1452" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="780.3333333333334" y="1479" text-anchor="start">12. execute loader() as suspend</text>
<path class="line" d="M522.6666666666667 1510 L1288 1510"/>
<rect x="800.3333333333334" y="1562" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="818.3333333333334" y="1589" text-anchor="start">13. loadedValue</text>
<path class="dashed" d="M1288 1620 L522.6666666666667 1620"/>
<rect x="583" y="1672" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="601" y="1699" text-anchor="start">14. put(user:1, loadedValue)</text>
<path class="line" d="M522.6666666666667 1730 L905.3333333333334 1730"/>
<rect x="226.33333333333337" y="1782" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="244.33333333333337" y="1809" text-anchor="start">15. loadedValue</text>
<path class="dashed" d="M522.6666666666667 1840 L140 1840"/>
<rect x="70" y="1892" width="1288" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1919" text-anchor="start">ELSE: Cache Error</text>
<rect x="609" y="1960" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="627" y="1987" text-anchor="start">17. Exception</text>
<path class="dashed" d="M905.3333333333334 2018 L522.6666666666667 2018"/>
<rect x="443.66666666666674" y="2070" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="461.66666666666674" y="2097" text-anchor="start">18. publish onError() event</text>
<path class="line" d="M522.6666666666667 2128 C586.6666666666667 2128 586.6666666666667 2162 522.6666666666667 2162"/>
<rect x="758.3333333333334" y="2200" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="776.3333333333334" y="2227" text-anchor="start">19. execute loader() as fallback</text>
<path class="line" d="M522.6666666666667 2258 L1288 2258"/>
<rect x="800.3333333333334" y="2310" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="818.3333333333334" y="2337" text-anchor="start">20. loadedValue</text>
<path class="dashed" d="M1288 2368 L522.6666666666667 2368"/>
<rect x="226.33333333333337" y="2420" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="244.33333333333337" y="2447" text-anchor="start">21. loadedValue</text>
<path class="dashed" d="M522.6666666666667 2478 L140 2478"/>
</svg>
