<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-label="Kafka Logback class structure">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="hollowBlue" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7 L 1 13 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="openPurple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .chip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #0f172a; }
      .classBox { stroke-width: 1.8; filter: url(#softShadow); }
      .external { fill: #f0fdfa; stroke: #0d9488; }
      .appender { fill: #eff6ff; stroke: #2563eb; }
      .strategy { fill: #faf5ff; stroke: #9333ea; }
      .key { fill: #f0fdf4; stroke: #16a34a; }
      .export { fill: #fff7ed; stroke: #ea580c; }
      .name { font-family: "Architects Daughter"; font-size: 20px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .member { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 11px; fill: #64748b; }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
      .extends { fill: none; stroke: #2563eb; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowBlue); }
      .implements { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowBlue); }
      .uses { fill: none; stroke: #9333ea; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openPurple); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1040"/>
  <rect class="frame" x="36" y="32" width="1428" height="976" rx="8"/>
  <text class="title" x="74" y="86">Kafka Logback Class Structure</text>
  <text class="subtitle" x="78" y="116">KafkaAppender extends Logback appender behavior, then composes encoder, key-provider, exporter, producer, and fallback appenders.</text>

  <rect class="panel" x="78" y="154" width="686" height="512" rx="8"/>
  <rect class="chip" x="104" y="176" width="240" height="38" rx="8"/>
  <text class="panelTitle" x="116" y="200">Appender hierarchy</text>

  <rect class="panel" x="802" y="154" width="620" height="512" rx="8"/>
  <rect class="chip" x="828" y="176" width="248" height="38" rx="8"/>
  <text class="panelTitle" x="840" y="200">Export strategies</text>

  <rect class="panel" x="78" y="718" width="1344" height="232" rx="8"/>
  <rect class="chip" x="104" y="740" width="250" height="38" rx="8"/>
  <text class="panelTitle" x="116" y="764">Key provider strategies</text>

  <g id="logbackBase">
    <rect class="classBox external" x="126" y="238" width="266" height="86" rx="8"/>
    <text class="stereo" x="259" y="263" text-anchor="middle">&lt;&lt;Logback&gt;&gt;</text>
    <text class="name" x="259" y="289" text-anchor="middle">Unsynchronized</text>
    <text class="name" x="259" y="313" text-anchor="middle">AppenderBase&lt;E&gt;</text>
  </g>

  <g id="attachable">
    <rect class="classBox external" x="454" y="238" width="242" height="86" rx="8"/>
    <text class="stereo" x="575" y="263" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="575" y="289" text-anchor="middle">AppenderAttachable&lt;E&gt;</text>
    <text class="small" x="575" y="313" text-anchor="middle">fallback appenders</text>
  </g>

  <g id="abstractAppender">
    <rect class="classBox appender" x="214" y="400" width="380" height="126" rx="8"/>
    <text class="stereo" x="404" y="425" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="name" x="404" y="450" text-anchor="middle">AbstractKafkaAppender&lt;E&gt;</text>
    <line class="divider" x1="214" y1="464" x2="594" y2="464"/>
    <text class="member" x="234" y="488">+ topic, partition, bootstrapServers</text>
    <text class="member" x="234" y="510">+ encoder, keyProvider, exporter</text>
  </g>

  <g id="kafkaAppender">
    <rect class="classBox appender" x="214" y="568" width="380" height="78" rx="8"/>
    <text class="name" x="404" y="599" text-anchor="middle">KafkaAppender&lt;E&gt;</text>
    <text class="small" x="404" y="624" text-anchor="middle">defer Kafka-client logs, encode event, export record</text>
  </g>

  <path class="extends" d="M 404 400 V 356 H 259 V 324"/>
  <path class="implements" d="M 404 400 V 356 H 575 V 324"/>
  <path class="extends" d="M 404 568 V 526"/>

  <g id="producerRecord">
    <rect class="classBox external" x="842" y="238" width="228" height="94" rx="8"/>
    <text class="stereo" x="956" y="262" text-anchor="middle">&lt;&lt;Apache Kafka&gt;&gt;</text>
    <text class="name" x="956" y="288" text-anchor="middle">ProducerRecord</text>
    <text class="small" x="956" y="312" text-anchor="middle">topic, partition, key, value</text>
  </g>

  <g id="producer">
    <rect class="classBox external" x="1142" y="238" width="224" height="94" rx="8"/>
    <text class="stereo" x="1254" y="262" text-anchor="middle">&lt;&lt;Apache Kafka&gt;&gt;</text>
    <text class="name" x="1254" y="288" text-anchor="middle">Producer</text>
    <text class="small" x="1254" y="312" text-anchor="middle">send(record, callback)</text>
  </g>

  <g id="exporterIface">
    <rect class="classBox export" x="842" y="398" width="290" height="96" rx="8"/>
    <text class="stereo" x="987" y="423" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="987" y="448" text-anchor="middle">KafkaExporter</text>
    <text class="member" x="987" y="472" text-anchor="middle">export(producer, record, handler)</text>
  </g>

  <g id="defaultExporter">
    <rect class="classBox export" x="1180" y="398" width="186" height="96" rx="8"/>
    <text class="name" x="1273" y="424" text-anchor="middle">Default Kafka</text>
    <text class="name" x="1273" y="448" text-anchor="middle">Exporter</text>
    <line class="divider" x1="1180" y1="462" x2="1366" y2="462"/>
    <text class="small" x="1273" y="486" text-anchor="middle">async Producer.send</text>
  </g>

  <g id="handler">
    <rect class="classBox strategy" x="842" y="548" width="290" height="86" rx="8"/>
    <text class="stereo" x="987" y="572" text-anchor="middle">&lt;&lt;fun interface&gt;&gt;</text>
    <text class="name" x="987" y="598" text-anchor="middle">ExportExceptionHandler</text>
    <text class="small" x="987" y="620" text-anchor="middle">fallback or ignore policy</text>
  </g>

  <g id="fallback">
    <rect class="classBox strategy" x="1180" y="548" width="186" height="86" rx="8"/>
    <text class="name" x="1273" y="576" text-anchor="middle">Appender</text>
    <text class="name" x="1273" y="600" text-anchor="middle">AttachableImpl</text>
    <text class="small" x="1273" y="622" text-anchor="middle">fallback append</text>
  </g>

  <path class="implements" d="M 1180 446 H 1132"/>
  <path class="uses" d="M 594 607 H 758 V 446 H 842"/>
  <path class="uses" d="M 594 607 H 758 V 285 H 842"/>
  <path class="uses" d="M 594 607 H 758 V 591 H 842"/>
  <path class="uses" d="M 1132 591 H 1180"/>
  <path class="uses" d="M 1070 285 H 1142"/>

  <g id="keyProvider">
    <rect class="classBox key" x="420" y="794" width="260" height="78" rx="8"/>
    <text class="stereo" x="550" y="818" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="550" y="844" text-anchor="middle">KafkaKeyProvider&lt;E&gt;</text>
  </g>

  <g id="abstractKey">
    <rect class="classBox key" x="724" y="794" width="258" height="78" rx="8"/>
    <text class="stereo" x="853" y="818" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="name" x="853" y="844" text-anchor="middle">AbstractKafkaKeyProvider</text>
  </g>

  <g id="keyVariants">
    <rect class="classBox key" x="110" y="894" width="174" height="42" rx="8"/>
    <text class="name" x="197" y="922" text-anchor="middle">Hostname</text>
    <rect class="classBox key" x="316" y="894" width="174" height="42" rx="8"/>
    <text class="name" x="403" y="922" text-anchor="middle">LoggerName</text>
    <rect class="classBox key" x="522" y="894" width="174" height="42" rx="8"/>
    <text class="name" x="609" y="922" text-anchor="middle">ThreadName</text>
    <rect class="classBox key" x="728" y="894" width="174" height="42" rx="8"/>
    <text class="name" x="815" y="922" text-anchor="middle">ContextName</text>
    <rect class="classBox key" x="1040" y="894" width="174" height="42" rx="8"/>
    <text class="name" x="1127" y="922" text-anchor="middle">NullKeyProvider</text>
  </g>

  <path class="implements" d="M 853 794 V 784 H 550 V 794"/>
  <path class="implements" d="M 197 894 V 884 H 853 V 872"/>
  <path class="implements" d="M 403 894 V 884 H 853 V 872"/>
  <path class="implements" d="M 609 894 V 884 H 853 V 872"/>
  <path class="implements" d="M 815 894 V 872"/>
  <path class="implements" d="M 1127 894 V 884 H 550 V 872"/>
  <path class="uses" d="M 404 646 V 704 H 390 V 833 H 420"/>
</svg>
