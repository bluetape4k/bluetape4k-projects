<g transform="translate(297,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">AbstractKafkaAppender</text>
  <text class="mono" x="18" y="108">+bootstrapServers: String</text>
<text class="mono" x="18" y="129">+topic: String</text>
<text class="mono" x="18" y="150">+partition: Int?</text>
<text class="mono" x="18" y="171">+keyProvider: KafkaKeyProvider</text>
<text class="mono" x="18" y="192">+exporter: KafkaExporter</text>
<text class="mono" x="18" y="213">+encoder: Encoder</text>
</g>
<g transform="translate(707,180)">
