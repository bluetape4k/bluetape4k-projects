<rect class="canvas" width="1880" height="1080" />
<rect class="frame" x="34" y="30" width="1812" height="1014" rx="10" />
<text class="title" x="72" y="84">Kafka Logback Class Structure</text>
<text class="subtitle" x="76" y="116">KafkaAppender owns Logback integration while key selection, export, and fallback behavior stay pluggable.</text>
<g>
  <path class="extends" d="M 545 225 H 440" stroke="#64748B" marker-end="url(#hollowSlate)" />
  <path class="extends" d="M 760 425 V 335" stroke="#2563EB" marker-end="url(#hollowBlue)" />
  <path class="assoc" d="M 545 286 H 500 V 475 H 440" stroke="#EA580C" marker-end="url(#openOrange)" />
  <path class="assoc" d="M 975 260 H 1090" stroke="#9333EA" marker-end="url(#openPurple)" />
  <path class="realize" d="M 260 610 V 560" stroke="#EA580C" marker-end="url(#hollowOrange)" />
  <path class="extends" d="M 260 830 V 780" stroke="#EA580C" marker-end="url(#hollowOrange)" />
  <path class="realize" d="M 1270 425 V 305" stroke="#9333EA" marker-end="url(#hollowPurple)" />
  <path class="assoc" d="M 975 522 H 1090" stroke="#9333EA" marker-end="url(#openPurple)" />
  <path class="assoc" d="M 760 635 V 795" stroke="#16A34A" marker-end="url(#openGreen)" />
  <path class="uses" d="M 1450 508 H 1485" stroke="#0D9488" marker-end="url(#openTeal)" />
  <path class="realize" d="M 1615 605 V 537" stroke="#0D9488" marker-end="url(#hollowTeal)" />
  <path class="assoc" d="M 1615 749 V 830" stroke="#0D9488" marker-end="url(#openTeal)" />
  <path class="uses" d="M 1090 575 H 1015 V 855 H 975" stroke="#16A34A" marker-end="url(#openGreen)" />
</g>
<g><g class="edgeLabel"><rect x="443.4" y="435" width="97.2" height="22" rx="6" /><text class="label" x="492" y="450" text-anchor="middle">keyProvider</text></g><g class="edgeLabel"><rect x="994.2" y="233" width="75.6" height="22" rx="6" /><text class="label" x="1032" y="248" text-anchor="middle">exporter</text></g><g class="edgeLabel"><rect x="997.8" y="495" width="68.4" height="22" rx="6" /><text class="label" x="1032" y="510" text-anchor="middle">exports</text></g><g class="edgeLabel"><rect x="764.2" y="703" width="111.60000000000001" height="22" rx="6" /><text class="label" x="820" y="718" text-anchor="middle">owns producer</text></g><g class="edgeLabel"><rect x="1622.2" y="780" width="75.6" height="22" rx="6" /><text class="label" x="1660" y="795" text-anchor="middle">fallback</text></g><g class="edgeLabel"><rect x="1005.4" y="610" width="61.2" height="22" rx="6" /><text class="label" x="1036" y="625" text-anchor="middle">send()</text></g></g>
<g id="logbackBase">
  <rect class="card" x="80" y="155" width="360" height="160" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="stereo" x="260" y="183" text-anchor="middle">Logback APIs</text>
  <text class="cardTitle" x="260" y="213" text-anchor="middle">Appender Infrastructure</text>
  <line class="divider" x1="104" y1="231" x2="416" y2="231" />
  <text class="member" x="108" y="258">UnsynchronizedAppenderBase</text><text class="member" x="108" y="280">AppenderAttachable&lt;E&gt;</text><text class="member" x="108" y="302">Encoder&lt;E&gt;</text>
</g><g id="abstractAppender">
  <rect class="card" x="545" y="135" width="430" height="200" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereo" x="760" y="163" text-anchor="middle">abstract class</text>
  <text class="cardTitle" x="760" y="193" text-anchor="middle">AbstractKafkaAppender&lt;E&gt;</text>
  <line class="divider" x1="569" y1="211" x2="951" y2="211" />
  <text class="member" x="573" y="238">bootstrapServers, topic, acks</text><text class="member" x="573" y="260">keyProvider: KafkaKeyProvider</text><text class="member" x="573" y="282">exporter: KafkaExporter</text><text class="member" x="573" y="304">encoder: Encoder&lt;E&gt;</text>
</g><g id="kafkaAppender">
  <rect class="card" x="545" y="425" width="430" height="210" rx="8" fill="#EFF6FF" stroke="#2563EB" />
  <text class="stereo" x="760" y="453" text-anchor="middle">class</text>
  <text class="cardTitle" x="760" y="483" text-anchor="middle">KafkaAppender&lt;E&gt;</text>
  <line class="divider" x1="569" y1="501" x2="951" y2="501" />
  <text class="member" x="573" y="528">defer Kafka client logs</text><text class="member" x="573" y="550">encode event -&gt; ProducerRecord</text><text class="member" x="573" y="572">export(..., exceptionHandler)</text><text class="member" x="573" y="594">flush/close producer on stop</text>
</g><g id="producer">
  <rect class="card" x="545" y="795" width="430" height="160" rx="8" fill="#F0FDF4" stroke="#16A34A" />
  <text class="stereo" x="760" y="823" text-anchor="middle">Kafka client</text>
  <text class="cardTitle" x="760" y="853" text-anchor="middle">KafkaProducer</text>
  <line class="divider" x1="569" y1="871" x2="951" y2="871" />
  <text class="member" x="573" y="898">Producer&lt;ByteArray, ByteArray&gt;</text><text class="member" x="573" y="920">send(record, callback)</text><text class="member" x="573" y="942">flush() / close()</text>
</g><g id="keyApi">
  <rect class="card" x="80" y="410" width="360" height="150" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereo" x="260" y="438" text-anchor="middle">interface</text>
  <text class="cardTitle" x="260" y="468" text-anchor="middle">KafkaKeyProvider&lt;E&gt;</text>
  <line class="divider" x1="104" y1="486" x2="416" y2="486" />
  <text class="member" x="108" y="513">+ get(event): ByteArray?</text><text class="member" x="108" y="535">null means unkeyed record</text>
</g><g id="keyBase">
  <rect class="card" x="80" y="610" width="360" height="170" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereo" x="260" y="638" text-anchor="middle">abstract class</text>
  <text class="cardTitle" x="260" y="668" text-anchor="middle">AbstractKafkaKeyProvider</text>
  <line class="divider" x1="104" y1="686" x2="416" y2="686" />
  <text class="member" x="108" y="713">ContextAwareBase + LifeCycle</text><text class="member" x="108" y="735">resets errorWasShown</text><text class="member" x="108" y="757">base for context-aware keys</text>
</g><g id="keyImpls">
  <rect class="card" x="80" y="830" width="360" height="170" rx="8" fill="#FFF7ED" stroke="#EA580C" />
  <text class="stereo" x="260" y="858" text-anchor="middle">classes</text>
  <text class="cardTitle" x="260" y="888" text-anchor="middle">Key Provider Implementations</text>
  <line class="divider" x1="104" y1="906" x2="416" y2="906" />
  <text class="member" x="108" y="933">Hostname / Logger / Thread</text><text class="member" x="108" y="955">ContextName extend base</text><text class="member" x="108" y="977">Null implements interface</text>
</g><g id="exporterApi">
  <rect class="card" x="1090" y="155" width="360" height="150" rx="8" fill="#FAF5FF" stroke="#9333EA" />
  <text class="stereo" x="1270" y="183" text-anchor="middle">interface</text>
  <text class="cardTitle" x="1270" y="213" text-anchor="middle">KafkaExporter</text>
  <line class="divider" x1="1114" y1="231" x2="1426" y2="231" />
  <text class="member" x="1118" y="258">+ export(producer, record, event)</text><text class="member" x="1118" y="280">returns immediate success flag</text>
</g><g id="defaultExporter">
  <rect class="card" x="1090" y="425" width="360" height="166" rx="8" fill="#FAF5FF" stroke="#9333EA" />
  <text class="stereo" x="1270" y="453" text-anchor="middle">class</text>
  <text class="cardTitle" x="1270" y="483" text-anchor="middle">DefaultKafkaExporter</text>
  <line class="divider" x1="1114" y1="501" x2="1426" y2="501" />
  <text class="member" x="1118" y="528">producer.send(record)</text><text class="member" x="1118" y="550">callback delegates failures</text><text class="member" x="1118" y="572">buffer/timeout -&gt; false</text>
</g><g id="handlerApi">
  <rect class="card" x="1485" y="395" width="260" height="142" rx="8" fill="#ECFDF5" stroke="#0D9488" />
  <text class="stereo" x="1615" y="423" text-anchor="middle">fun interface</text>
  <text class="cardTitle" x="1615" y="453" text-anchor="middle">ExportExceptionHandler</text>
  <line class="divider" x1="1509" y1="471" x2="1721" y2="471" />
  <text class="member" x="1513" y="498">+ handle(event, error)</text><text class="member" x="1513" y="520">custom fallback contract</text>
</g><g id="appenderHandler">
  <rect class="card" x="1485" y="605" width="260" height="144" rx="8" fill="#ECFDF5" stroke="#0D9488" />
  <text class="stereo" x="1615" y="633" text-anchor="middle">KafkaAppender owned</text>
  <text class="cardTitle" x="1615" y="663" text-anchor="middle">Fallback Handler</text>
  <line class="divider" x1="1509" y1="681" x2="1721" y2="681" />
  <text class="member" x="1513" y="708">warn on exception</text><text class="member" x="1513" y="730">append to fallback appenders</text>
</g><g id="fallback">
  <rect class="card" x="1485" y="830" width="260" height="150" rx="8" fill="#F8FAFC" stroke="#64748B" />
  <text class="stereo" x="1615" y="858" text-anchor="middle">Logback</text>
  <text class="cardTitle" x="1615" y="888" text-anchor="middle">Attached Appenders</text>
  <line class="divider" x1="1509" y1="906" x2="1721" y2="906" />
  <text class="member" x="1513" y="933">appendLoopOnAppenders</text><text class="member" x="1513" y="955">fallback on export error</text>
</g>
<g transform="translate(80 1028)">
  <path class="extends" d="M 0 0 H 58" stroke="#2563EB" marker-end="url(#hollowBlue)" /><text class="legend" x="72" y="5">extends</text>
  <path class="realize" d="M 170 0 H 228" stroke="#9333EA" marker-end="url(#hollowPurple)" /><text class="legend" x="242" y="5">implements</text>
  <path class="assoc" d="M 385 0 H 443" stroke="#16A34A" marker-end="url(#openGreen)" /><text class="legend" x="457" y="5">has / uses</text>
</g>
</svg>
