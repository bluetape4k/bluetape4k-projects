<path class="inheritLine" d="M1492 498 C1492 463 467 463 467 428"/>
<g transform="translate(297,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">AbstractKafkaAppender</text>
  <text class="mono" x="18" y="108">+bootstrapServers: String</text>
<text class="mono" x="18" y="132">+topic: String</text>
<text class="mono" x="18" y="156">+partition: Int?</text>
<text class="mono" x="18" y="180">+keyProvider: KafkaKeyProvider</text>
<text class="mono" x="18" y="204">+exporter: KafkaExporter</text>
<text class="mono" x="18" y="228">+encoder: Encoder</text>
</g>
<g transform="translate(707,180)">
