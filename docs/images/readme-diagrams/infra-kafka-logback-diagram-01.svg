<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-label="Kafka Logback Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inheritArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A;paint-order:stroke;stroke:#F7FBFF;stroke-width:5px;stroke-linejoin:round}
    .card,.classCard{filter:url(#shadow);stroke-width:2}.cardTitle,.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:13px;fill:#102033}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .note{stroke-width:1.6}.flow{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1500" height="980"/>
<rect class="frame" x="32" y="28" width="1436" height="924" rx="30"/>
<text class="title" x="68" y="84">Kafka Logback Class Structure</text>
<text class="subtitle" x="72" y="116">Appender, exporter, key provider, and fallback error handling are separated so dependencies stay short.</text>
<path class="inherit" data-from="KafkaAppender" data-to="AbstractKafkaAppender" d="M730 360 L730 306" stroke="#2E8F89"/>
<path class="inherit" data-from="DefaultKafkaExporter" data-to="KafkaExporter" d="M295 740 L295 676" stroke="#4F83BF"/>
<path class="inherit" data-from="KeyProviderFamilies" data-to="KafkaKeyProvider" d="M1165 740 L1165 676" stroke="#B9851B"/>
<path class="dependency" data-from="KafkaAppender" data-to="KafkaExporter" d="M550 438 L500 438 L500 618 L470 618" stroke="#4F83BF" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KafkaAppender" data-to="KafkaKeyProvider" d="M910 438 L960 438 L960 618 L990 618" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KafkaAppender" data-to="ExportExceptionHandler" d="M730 508 L730 740" stroke="#C94D68" stroke-dasharray="8 7"/>
<g id="AbstractKafkaAppender">
  <rect class="classCard" x="550" y="170" width="360" height="136" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <path d="M550 240 L910 240" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="stereo" x="730" y="192" text-anchor="middle">abstract class</text>
  <text class="classTitle" x="730" y="220" text-anchor="middle">AbstractKafkaAppender</text>
  <text class="member" x="568" y="262">producer config</text>
<text class="member" x="568" y="282">topic, encoder, keyProvider</text>
<text class="member" x="568" y="302">option validation</text>
</g>
<g id="KafkaAppender">
  <rect class="classCard" x="550" y="360" width="360" height="148" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <path d="M550 430 L910 430" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="stereo" x="730" y="382" text-anchor="middle">class</text>
  <text class="classTitle" x="730" y="410" text-anchor="middle">KafkaAppender</text>
  <text class="member" x="568" y="452">drains Kafka-client log queue</text>
<text class="member" x="568" y="472">encodes event to ProducerRecord</text>
<text class="member" x="568" y="492">delegates send to exporter</text>
</g>
<g id="KafkaExporter">
  <rect class="classCard" x="120" y="560" width="350" height="116" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <path d="M120 630 L470 630" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="stereo" x="295" y="582" text-anchor="middle">interface</text>
  <text class="classTitle" x="295" y="610" text-anchor="middle">KafkaExporter</text>
  <text class="member" x="138" y="652">export producer record</text>
<text class="member" x="138" y="672">exception handler callback</text>
</g>
<g id="DefaultKafkaExporter">
  <rect class="classCard" x="120" y="740" width="350" height="116" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <path d="M120 810 L470 810" stroke="#58A978" stroke-width="1.4"/>
  <text class="stereo" x="295" y="762" text-anchor="middle">class</text>
  <text class="classTitle" x="295" y="790" text-anchor="middle">DefaultKafkaExporter</text>
  <text class="member" x="138" y="832">KafkaProducer.send</text>
<text class="member" x="138" y="852">fire-and-forget callback</text>
</g>
<g id="KafkaKeyProvider">
  <rect class="classCard" x="990" y="560" width="350" height="116" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <path d="M990 630 L1340 630" stroke="#D6A441" stroke-width="1.4"/>
  <text class="stereo" x="1165" y="582" text-anchor="middle">interface</text>
  <text class="classTitle" x="1165" y="610" text-anchor="middle">KafkaKeyProvider</text>
  <text class="member" x="1008" y="655">event -&gt; ByteArray key</text>
</g>
<g id="KeyProviderFamilies">
  <rect class="classCard" x="990" y="740" width="350" height="116" rx="10" fill="#EEF6D9" stroke="#8BA84D"/>
  <path d="M990 810 L1340 810" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="stereo" x="1165" y="762" text-anchor="middle">implementations</text>
  <text class="classTitle" x="1165" y="790" text-anchor="middle">Key providers</text>
  <text class="member" x="1008" y="832">hostname, logger, thread</text>
<text class="member" x="1008" y="852">context, null</text>
</g>
<g id="ExportExceptionHandler">
  <rect class="classCard" x="550" y="740" width="360" height="116" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <path d="M550 810 L910 810" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="stereo" x="730" y="762" text-anchor="middle">fun interface</text>
  <text class="classTitle" x="730" y="790" text-anchor="middle">ExportExceptionHandler</text>
  <text class="member" x="568" y="832">warn and fallback appender</text>
<text class="member" x="568" y="852">receives failed event</text>
</g>
<g><rect class="note" x="120" y="892" width="1260" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF"/><text class="detail" x="750" y="918" text-anchor="middle">bluetape4k-projects / infra:kafka-logback - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
