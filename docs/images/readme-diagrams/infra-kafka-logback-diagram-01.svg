  <text class="label" x="170" y="57" text-anchor="middle">KafkaAppender</text>
  <text class="mono" x="18" y="108">-producer: KafkaProducer</text>
<text class="mono" x="18" y="132">+start()</text>
<text class="mono" x="18" y="156">+stop()</text>
<text class="mono" x="18" y="180">#append(event)</text>
</g>
