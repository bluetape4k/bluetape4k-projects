  <text class="label" x="170" y="57" text-anchor="middle">LoggerNameKafkaKeyProvider</text>

</g>
<g transform="translate(707,772)">
  <rect class="card" x="0" y="0" width="340" height="96" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
