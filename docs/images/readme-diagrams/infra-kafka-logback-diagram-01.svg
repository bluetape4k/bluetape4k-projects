  <marker id="openGreen" markerWidth="18" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse" overflow="visible"><path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#16A34A" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none" /></marker>
  <marker id="hollowBlue" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 16 8 L 1 15 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" stroke-dasharray="none" /></marker>
  <marker id="hollowOrange" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 16 8 L 1 15 Z" fill="#FFFFFF" stroke="#EA580C" stroke-width="2" stroke-dasharray="none" /></marker>
  <marker id="hollowPurple" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 16 8 L 1 15 Z" fill="#FFFFFF" stroke="#9333EA" stroke-width="2" stroke-dasharray="none" /></marker>
  <marker id="hollowTeal" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 16 8 L 1 15 Z" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" stroke-dasharray="none" /></marker>
  <marker id="hollowSlate" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse"><path d="M 1 1 L 16 8 L 1 15 Z" fill="#FFFFFF" stroke="#64748B" stroke-width="2" stroke-dasharray="none" /></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:15px;fill:#475569}
    .card{filter:url(#shadow);stroke-width:1.9}.cardTitle{font-family:"Architects Daughter";font-size:21px;fill:#0F172A}
    .stereo{font-family:"Comic Mono";font-size:12px;fill:#64748B}.member{font-family:"Comic Mono";font-size:12.3px;fill:#334155}
    .divider{stroke:rgba(15,23,42,.17);stroke-width:1.2}.assoc{fill:none;stroke-width:3.0;stroke-linecap:round;stroke-linejoin:round}
    .uses,.realize{fill:none;stroke-width:2.5;stroke-dasharray:8 7;stroke-linecap:round;stroke-linejoin:round}
    .extends{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
    .edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1;opacity:.96}
    .label{font-family:"Comic Mono";font-size:11.6px;fill:#0F172A;stroke:none}
    .legend{font-family:"Comic Mono";font-size:12px;fill:#475569}
  </style>
