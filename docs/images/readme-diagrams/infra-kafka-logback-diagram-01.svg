<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="310" height="154" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="310" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="155" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="155" y="61" text-anchor="middle">KafkaExporter</text>
  <text class="mono" x="18" y="108">+export(producer, topic, partition,</text>
<text class="mono" x="18" y="129">key, body)</text>
</g>
<g transform="translate(956,180)">
