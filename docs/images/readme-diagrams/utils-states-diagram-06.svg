<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 1000" role="img" aria-labelledby="title desc" data-layout="state-machine" data-intent="Explain the clinic appointment finite state machine with pending request, confirmation, arrival, treatment, completion, no-show, and cancellation terminal branches." data-evidence="utils/states/README.md, clinic-appointment migration guide" data-source-read="utils/states/README.md;clinic-appointment source references in README">
<title id="title">Appointment Complex FSM</title>
<desc id="desc">Clinic flow with guarded lifecycle branches and terminal outcomes.</desc>
<style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .title { fill: #0f172a; font-size: 34px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #475569; font-size: 18px; font-weight: 500; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .panelTitle { fill: #334155; font-size: 14px; font-weight: 800; letter-spacing: .2px; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
    .card { stroke-width: 1.7; filter: url(#cardShadow); }
    .stateTitle { fill: #0f172a; font-size: 17px; font-weight: 800; }
    .stateDetail { fill: #475569; font-size: 12px; font-weight: 600; }
    .iconBadge { stroke-width: 1.5; }
    .iconStroke { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .iconFill { fill: #ffffff; }
    .arrow { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .arrowLabelBg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
    .arrowLabel { fill: #1e293b; font-size: 13px; font-weight: 800; text-anchor: middle; }
    .footer { fill: #64748b; font-size: 13px; font-weight: 600; }
  </style>
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
<rect width="1720" height="1000" fill="#f8fafc"/>
<rect x="30" y="30" width="1660" height="940" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text class="title" x="70" y="92">Appointment Complex FSM</text>
<text class="subtitle" x="70" y="124">Clinic flow with guarded lifecycle branches and terminal outcomes.</text>
<rect class="panel" x="55" y="145" width="1610" height="765" rx="18"/><text class="panelTitle" x="79" y="179">State transitions</text>
<circle cx="86" cy="475" r="10" fill="#172033"/>
<g><path class="route arrow" d="M65,475 L125,475" stroke="#2563eb"/><rect class="arrowLabelBg" x="58" y="441" width="74" height="22" rx="11"/><text class="arrowLabel" x="95" y="457">initial</text></g>
<g><path class="route arrow" d="M345,475 L450,475" stroke="#2563eb"/><rect class="arrowLabelBg" x="360.5" y="441" width="74" height="22" rx="11"/><text class="arrowLabel" x="397.5" y="457">Request</text></g>
<g><path class="route arrow" d="M670,475 L775,475" stroke="#2563eb"/><rect class="arrowLabelBg" x="685.5" y="441" width="74" height="22" rx="11"/><text class="arrowLabel" x="722.5" y="457">Confirm</text></g>
<g><path class="route arrow" d="M885,430 L885,300" stroke="#0d9488"/><rect class="arrowLabelBg" x="844" y="331" width="82" height="22" rx="11"/><text class="arrowLabel" x="885" y="347">Check in</text></g>
<g><path class="route arrow" d="M995,255 L1140,255" stroke="#2563eb"/><rect class="arrowLabelBg" x="1038.5" y="221" width="58" height="22" rx="11"/><text class="arrowLabel" x="1067.5" y="237">Start</text></g>
<g><path class="route arrow" d="M1262,300 L1262,710" stroke="#16a34a"/><rect class="arrowLabelBg" x="1221" y="471" width="82" height="22" rx="11"/><text class="arrowLabel" x="1262" y="487">Complete</text></g>
<g><path class="route arrow" d="M885,520 L885,710" stroke="#65a30d"/><rect class="arrowLabelBg" x="848" y="581" width="74" height="22" rx="11"/><text class="arrowLabel" x="885" y="597">No show</text></g>
<g><path class="route arrow" d="M235,520 L235,710" stroke="#db2777"/><rect class="arrowLabelBg" x="202" y="581" width="66" height="22" rx="11"/><text class="arrowLabel" x="235" y="597">Cancel</text></g>
<g><path class="route arrow" d="M560,520 L560,855 L235,855 L235,800" stroke="#db2777"/><rect class="arrowLabelBg" x="527" y="653.5" width="66" height="22" rx="11"/><text class="arrowLabel" x="560" y="669.5">Cancel</text></g>
<g><path class="route arrow" d="M885,520 L885,855 L235,855 L235,800" stroke="#db2777"/><rect class="arrowLabelBg" x="527" y="821" width="66" height="22" rx="11"/><text class="arrowLabel" x="560" y="837">Cancel</text></g>
<g id="pending"><rect class="card" x="125" y="430" width="220" height="90" rx="8" fill="#eff6ff" stroke="#2563eb"/><g transform="translate(145,453)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#2563eb" stroke="#2563eb"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="205" y="467">PENDING</text><text class="stateDetail" x="205" y="493">initial</text></g>
<g id="requested"><rect class="card" x="450" y="430" width="220" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a"/><g transform="translate(470,453)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#16a34a" stroke="#16a34a"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="530" y="467">REQUESTED</text><text class="stateDetail" x="530" y="493">requested</text></g>
<g id="confirmed"><rect class="card" x="775" y="430" width="220" height="90" rx="8" fill="#faf5ff" stroke="#9333ea"/><g transform="translate(795,453)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#9333ea" stroke="#9333ea"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="855" y="467">CONFIRMED</text><text class="stateDetail" x="855" y="493">accepted</text></g>
<g id="checked"><rect class="card" x="775" y="210" width="220" height="90" rx="8" fill="#f0fdfa" stroke="#0d9488"/><g transform="translate(795,233)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#0d9488" stroke="#0d9488"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="855" y="247">CHECKED_IN</text><text class="stateDetail" x="855" y="273">arrived</text></g>
<g id="progress"><rect class="card" x="1140" y="210" width="245" height="90" rx="8" fill="#fff7ed" stroke="#ea580c"/><g transform="translate(1160,233)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#ea580c" stroke="#ea580c"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="1220" y="247">IN_PROGRESS</text><text class="stateDetail" x="1220" y="273">treating</text></g>
<g id="completed"><rect class="card" x="1140" y="710" width="245" height="90" rx="8" fill="#f0fdf4" stroke="#16a34a"/><g transform="translate(1160,733)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#16a34a" stroke="#16a34a"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="1220" y="747">COMPLETED</text><text class="stateDetail" x="1220" y="773">final success</text></g>
<g id="cancelled"><rect class="card" x="125" y="710" width="245" height="90" rx="8" fill="#fdf2f8" stroke="#db2777"/><g transform="translate(145,733)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#db2777" stroke="#db2777"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="205" y="747">CANCELLED</text><text class="stateDetail" x="205" y="773">final stop</text></g>
<g id="noshow"><rect class="card" x="775" y="710" width="220" height="90" rx="8" fill="#f7fee7" stroke="#65a30d"/><g transform="translate(795,733)"><rect class="iconBadge" x="0" y="0" width="44" height="44" rx="10" fill="#65a30d" stroke="#65a30d"/><circle class="iconStroke" cx="22" cy="22" r="12"/><path class="iconStroke" d="M22 15v7l5 4"/></g><text class="stateTitle" x="855" y="747">NO_SHOW</text><text class="stateDetail" x="855" y="773">final</text></g>
<circle cx="1632" cy="882" r="13" fill="none" stroke="#172033" stroke-width="3"/><circle cx="1632" cy="882" r="8" fill="#172033"/>
<text class="footer" x="70" y="956">Generated as direct SVG. Sequence diagrams are intentionally preserved.</text>
</svg>