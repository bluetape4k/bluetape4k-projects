<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="1040" viewBox="0 0 2160 1040" role="img" aria-label="Appointment Complex FSM">
<defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="arrow-startPending" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#64748B"/></marker>
<marker id="arrow-request" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#2563EB"/></marker>
<marker id="arrow-confirm" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#16A34A"/></marker>
<marker id="arrow-checkIn" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#0D9488"/></marker>
<marker id="arrow-startTreatment" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#EA580C"/></marker>
<marker id="arrow-complete" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#DB2777"/></marker>
<marker id="arrow-cancelPending" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#9333EA"/></marker>
<marker id="arrow-cancelRequested" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#9333EA"/></marker>
<marker id="arrow-cancelConfirmed" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#9333EA"/></marker>
<marker id="arrow-cancelChecked" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#9333EA"/></marker>
<marker id="arrow-cancelFinal" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#9333EA"/></marker>
<marker id="arrow-markNoShow" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#D97706"/></marker>
<marker id="arrow-rejectCancel" markerWidth="18" markerHeight="14" refX="16" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 18 14"><path d="M2 2 L16 7 L2 12 Z" fill="#64748B"/></marker>
<style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}.card,.band{filter:url(#softShadow);stroke-width:2}.band{fill-opacity:.72}.stateTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}.bandTitle{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13.2px;fill:#475569}.badge{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.2}.badgeText{font-family:"Comic Mono";font-size:11.5px;fill:#475569}.start{fill:#0F172A}.edge{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}.edgeLabel rect{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.25;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:12.2px;fill:#475569}</style></defs>
<rect class="canvas" width="2160" height="1040"/><rect class="frame" x="38" y="30" width="2084" height="974" rx="8"/>
<text class="title" x="78" y="86">Appointment Complex FSM</text>
<text class="subtitle" x="82" y="118">A coroutine FSM for appointment intake, confirmation, check-in, treatment, terminal outcomes, and cancellation boundaries.</text>
<g id="edges"><path class="edge" d="M179 427 L225 427" stroke="#64748B" marker-end="url(#arrow-startPending)"/>
<path class="edge" d="M455 418 L535 418" stroke="#2563EB" marker-end="url(#arrow-request)"/>
<path class="edge" d="M765 418 L845 418" stroke="#16A34A" marker-end="url(#arrow-confirm)"/>
<path class="edge" d="M1075 418 L1155 418" stroke="#0D9488" marker-end="url(#arrow-checkIn)"/>
<path class="edge" d="M1385 418 L1465 418" stroke="#EA580C" marker-end="url(#arrow-startTreatment)"/>
<path class="edge" d="M1695 418 L1775 418" stroke="#DB2777" marker-end="url(#arrow-complete)"/>
<path class="edge" d="M340 485 L340 585" stroke="#9333EA" marker-end="url(#arrow-cancelPending)"/>
<path class="edge" d="M650 485 L650 585" stroke="#9333EA" marker-end="url(#arrow-cancelRequested)"/>
<path class="edge" d="M960 485 L960 585" stroke="#9333EA" marker-end="url(#arrow-cancelConfirmed)"/>
<path class="edge" d="M1270 485 L1270 585" stroke="#9333EA" marker-end="url(#arrow-cancelChecked)"/>
<path class="edge" d="M600 663 L600 775" stroke="#9333EA" marker-end="url(#arrow-cancelFinal)"/>
<path class="edge" d="M960 350 L960 285" stroke="#D97706" marker-end="url(#arrow-markNoShow)"/>
<path class="edge" d="M1580 485 L1580 775" stroke="#64748B" marker-end="url(#arrow-rejectCancel)"/></g>
<g id="labels"><g class="edgeLabel" transform="translate(166 387)"><rect width="72" height="30" rx="8"/><text x="36" y="20" text-anchor="middle">initial</text></g>
<g class="edgeLabel" transform="translate(453 377)"><rect width="84" height="30" rx="8"/><text x="42" y="20" text-anchor="middle">Request</text></g>
<g class="edgeLabel" transform="translate(763 377)"><rect width="84" height="30" rx="8"/><text x="42" y="20" text-anchor="middle">Confirm</text></g>
<g class="edgeLabel" transform="translate(1072 377)"><rect width="86" height="30" rx="8"/><text x="43" y="20" text-anchor="middle">CheckIn</text></g>
<g class="edgeLabel" transform="translate(1394 377)"><rect width="62" height="30" rx="8"/><text x="31" y="20" text-anchor="middle">Start</text></g>
<g class="edgeLabel" transform="translate(1690 377)"><rect width="90" height="30" rx="8"/><text x="45" y="20" text-anchor="middle">Complete</text></g>
<g class="edgeLabel" transform="translate(638 709)"><rect width="124" height="30" rx="8"/><text x="62" y="20" text-anchor="middle">Cancel -&gt; final</text></g>
<g class="edgeLabel" transform="translate(781 300)"><rect width="118" height="30" rx="8"/><text x="59" y="20" text-anchor="middle">MarkNoShow</text></g>
<g class="edgeLabel" transform="translate(1646 665)"><rect width="78" height="30" rx="8"/><text x="39" y="20" text-anchor="middle">Cancel?</text></g></g>
<circle id="start" class="start" cx="167" cy="427" r="12"/>
<g id="pending"><rect class="card" x="225" y="350" width="230" height="135" rx="8" fill="#EFF6FF" stroke="#2563EB"/>

  <text class="stateTitle" x="340" y="408" text-anchor="middle">PENDING</text>
  <text class="detail" x="340" y="440" text-anchor="middle">initial request slot</text>
  <text class="detail" x="340" y="461" text-anchor="middle">Cancel allowed</text></g>
<g id="requested"><rect class="card" x="535" y="350" width="230" height="135" rx="8" fill="#ECFDF5" stroke="#16A34A"/>

  <text class="stateTitle" x="650" y="408" text-anchor="middle">REQUESTED</text>
  <text class="detail" x="650" y="440" text-anchor="middle">waiting confirmation</text>
  <text class="detail" x="650" y="461" text-anchor="middle">Cancel allowed</text></g>
<g id="confirmed"><rect class="card" x="845" y="350" width="230" height="135" rx="8" fill="#F0FDFA" stroke="#0D9488"/>

  <text class="stateTitle" x="960" y="408" text-anchor="middle">CONFIRMED</text>
  <text class="detail" x="960" y="440" text-anchor="middle">can check in</text>
  <text class="detail" x="960" y="461" text-anchor="middle">No-show or cancel</text></g>
<g id="checkedIn"><rect class="card" x="1155" y="350" width="230" height="135" rx="8" fill="#FFF7ED" stroke="#EA580C"/>

  <text class="stateTitle" x="1270" y="408" text-anchor="middle">CHECKED_IN</text>
  <text class="detail" x="1270" y="440" text-anchor="middle">patient arrived</text>
  <text class="detail" x="1270" y="461" text-anchor="middle">Cancel still allowed</text></g>
<g id="inProgress"><rect class="card" x="1465" y="350" width="230" height="135" rx="8" fill="#FAF5FF" stroke="#9333EA"/>

  <text class="stateTitle" x="1580" y="408" text-anchor="middle">IN_PROGRESS</text>
  <text class="detail" x="1580" y="440" text-anchor="middle">treatment started</text>
  <text class="detail" x="1580" y="461" text-anchor="middle">Cancel rejected</text></g>
<g id="completed"><rect class="card" x="1775" y="350" width="230" height="135" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <rect class="badge" x="1919" y="364" width="64" height="26" rx="8"/><text class="badgeText" x="1951" y="382" text-anchor="middle">final</text>
  <text class="stateTitle" x="1890" y="408" text-anchor="middle">COMPLETED</text>
  <text class="detail" x="1890" y="440" text-anchor="middle">normal terminal outcome</text></g>
<g id="cancelWindow"><rect class="band" x="265" y="585" width="1080" height="78" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="bandTitle" x="805" y="619" text-anchor="middle">Cancellation window</text>
  <text class="detail" x="805" y="643" text-anchor="middle">Cancel is accepted from PENDING, REQUESTED, CONFIRMED, and CHECKED_IN</text></g>
<g id="cancelled"><rect class="card" x="450" y="775" width="300" height="135" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <rect class="badge" x="664" y="789" width="64" height="26" rx="8"/><text class="badgeText" x="696" y="807" text-anchor="middle">final</text>
  <text class="stateTitle" x="600" y="833" text-anchor="middle">CANCELLED</text>
  <text class="detail" x="600" y="865" text-anchor="middle">terminal cancellation</text>
  <text class="detail" x="600" y="886" text-anchor="middle">from early states</text></g>
<g id="noShow"><rect class="card" x="830" y="160" width="260" height="125" rx="8" fill="#FFF7ED" stroke="#D97706"/>
  <rect class="badge" x="1004" y="174" width="64" height="26" rx="8"/><text class="badgeText" x="1036" y="192" text-anchor="middle">final</text>
  <text class="stateTitle" x="960" y="218" text-anchor="middle">NO_SHOW</text>
  <text class="detail" x="960" y="250" text-anchor="middle">via MarkNoShow</text>
  <text class="detail" x="960" y="271" text-anchor="middle">from CONFIRMED</text></g>
<g id="reject"><rect class="card" x="1420" y="775" width="390" height="135" rx="8" fill="#F8FAFC" stroke="#64748B"/>

  <text class="stateTitle" x="1615" y="833" text-anchor="middle">IN_PROGRESS rejects Cancel</text>
  <text class="detail" x="1615" y="865" text-anchor="middle">assertRejects(Cancel)</text>
  <text class="detail" x="1615" y="886" text-anchor="middle">after treatment starts</text></g>
</svg>