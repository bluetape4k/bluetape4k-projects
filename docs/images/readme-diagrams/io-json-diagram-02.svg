<svg data-intent="Help README readers choose a JsonSerializer implementation by Jackson stack and binary JSONB needs, then converge on the common JsonSerializer API." data-evidence="io/json/README.md; io/json/src/main/kotlin/io/bluetape4k/json/JsonSerializer.kt; io/fastjson2; io/jackson2; io/jackson3" data-source-read="io/json/README.md; io/json/src/main/kotlin/io/bluetape4k/json/JsonSerializer.kt" data-layout="decision-flow" xmlns="http://www.w3.org/2000/svg" width="1520" height="1210" viewBox="0 0 1520 1210" role="img" aria-label="JsonSerializer Implementation Selection Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#1D4ED8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#15803D" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#0F766E" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowAmber" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#C2410C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse" viewBox="0 0 14 14" data-role="primary" data-tip-direction="positive-x"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#7E22CE" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1520" height="1210"/>
<rect class="frame" x="34" y="30" width="1452" height="1150" rx="8"/>
<text class="title" x="72" y="84">JsonSerializer Implementation Selection Flow</text>
<text class="subtitle" x="76" y="116">Choose Fastjson2 when JSONB byte payloads are required; otherwise select the Jackson 3 or Jackson 2 module and keep callers on the common JsonSerializer API.</text>
<g><rect class="panel" x="82" y="160" width="1356" height="170" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Common contract</text></g>
<g><rect class="panel" x="82" y="405" width="1356" height="430" rx="8"/><text class="panelTitle" x="110" y="441" dominant-baseline="middle">Implementation choice</text></g>
<g><rect class="panel" x="82" y="910" width="1356" height="220" rx="8"/><text class="panelTitle" x="110" y="946" dominant-baseline="middle">Shared API surface</text></g>
<g id="caller">
  <rect class="card" x="150" y="225" width="300" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="300" y="256" text-anchor="middle" dominant-baseline="middle">Caller code</text>
  <text class="detail" x="300" y="286" text-anchor="middle" dominant-baseline="middle">chooses one serializer</text>
</g>
<g id="contract">
  <rect class="card" x="600" y="220" width="360" height="86" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="780" y="256" text-anchor="middle" dominant-baseline="middle">JsonSerializer</text>
  <text class="detail" x="780" y="286" text-anchor="middle" dominant-baseline="middle">common byte and string contract</text>
</g>
<g id="reified">
  <rect class="card" x="1080" y="225" width="280" height="76" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1220" y="256" text-anchor="middle" dominant-baseline="middle">Kotlin reified helpers</text>
  <text class="detail" x="1220" y="286" text-anchor="middle" dominant-baseline="middle">deserialize&lt;T&gt;() shortcuts</text>
</g>
<g id="needsJsonb">
  <polygon class="card card-shape" points="315,535 430,600 315,665 200,600" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="315" y="592" text-anchor="middle" dominant-baseline="middle">Need JSONB?</text>
  <text class="detail" x="315" y="621" text-anchor="middle" dominant-baseline="middle">Fastjson2 byte format</text>
</g>
<g id="fastjson">
  <rect class="card" x="610" y="485" width="350" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="785" y="512" text-anchor="middle" dominant-baseline="middle">FastjsonSerializer</text>
  <text class="detail" x="785" y="542" text-anchor="middle" dominant-baseline="middle">Fastjson2 JSONB bytes</text>
  <text class="detail" x="785" y="560" text-anchor="middle" dominant-baseline="middle">standard JSON string</text>
</g>
<g id="jacksonMajor">
  <polygon class="card card-shape" points="720,660 840,725 720,790 600,725" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="720" y="717" text-anchor="middle" dominant-baseline="middle">Jackson major?</text>
  <text class="detail" x="720" y="746" text-anchor="middle" dominant-baseline="middle">module dependency decides</text>
</g>
<g id="jackson3">
  <rect class="card" x="970" y="590" width="350" height="86" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1145" y="617" text-anchor="middle" dominant-baseline="middle">JacksonSerializer</text>
  <text class="detail" x="1145" y="647" text-anchor="middle" dominant-baseline="middle">bluetape4k-jackson3</text>
  <text class="detail" x="1145" y="665" text-anchor="middle" dominant-baseline="middle">Jackson 3.x ObjectMapper</text>
</g>
<g id="jackson2">
  <rect class="card" x="970" y="725" width="350" height="86" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="1145" y="752" text-anchor="middle" dominant-baseline="middle">JacksonSerializer</text>
  <text class="detail" x="1145" y="782" text-anchor="middle" dominant-baseline="middle">bluetape4k-jackson2</text>
  <text class="detail" x="1145" y="800" text-anchor="middle" dominant-baseline="middle">Jackson 2.x ObjectMapper</text>
</g>
<g id="byteApi">
  <rect class="card" x="210" y="990" width="320" height="76" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="370" y="1021" text-anchor="middle" dominant-baseline="middle">ByteArray API</text>
  <text class="detail" x="370" y="1051" text-anchor="middle" dominant-baseline="middle">serialize / deserialize</text>
</g>
<g id="stringApi">
  <rect class="card" x="600" y="990" width="320" height="76" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="760" y="1012" text-anchor="middle" dominant-baseline="middle">JSON String API</text>
  <text class="detail" x="760" y="1042" text-anchor="middle" dominant-baseline="middle">serializeAsString</text>
  <text class="detail" x="760" y="1060" text-anchor="middle" dominant-baseline="middle">deserializeFromString</text>
</g>
<g id="failure">
  <rect class="card" x="950" y="980" width="420" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1160" y="1011" text-anchor="middle" dominant-baseline="middle">Failure policy</text>
  <text class="detail" x="1160" y="1041" text-anchor="middle" dominant-baseline="middle">null -&gt; empty/null</text>
  <text class="detail" x="1160" y="1059" text-anchor="middle" dominant-baseline="middle">errors throw</text>
  <text class="detail" x="1160" y="1077" text-anchor="middle" dominant-baseline="middle">JsonSerializationException</text>
</g>
<text class="detail" x="455" y="520" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="370" y="720" text-anchor="middle" dominant-baseline="middle">no</text>
<text class="detail" x="855" y="590" text-anchor="middle" dominant-baseline="middle">default 3.x</text>
<text class="detail" x="855" y="760" text-anchor="middle" dominant-baseline="middle">fallback 2.x</text>
<path class="route" data-from="caller" data-to="contract" d="M450 263 H600" stroke="#1D4ED8" marker-end="url(#arrowBlue)"/>
<path class="route" data-from="contract" data-to="reified" d="M960 263 H1080" stroke="#15803D" marker-end="url(#arrowGreen)"/>
<path class="route" data-from="contract" data-to="needsJsonb" d="M780 306 V380 Q780 390 770 390 H460 Q450 390 450 400 V480 Q450 500 430 500 H335 Q315 500 315 520 V535" stroke="#C2410C" marker-end="url(#arrowAmber)"/>
<path class="route" data-from="needsJsonb" data-to="fastjson" d="M430 600 H500 Q520 600 520 580 V570 Q520 550 540 550 H610" stroke="#0F766E" marker-end="url(#arrowTeal)"/>
<path class="route" data-from="needsJsonb" data-to="jacksonMajor" d="M315 665 V705 Q315 725 335 725 H600" stroke="#7E22CE" marker-end="url(#arrowPurple)"/>
<path class="route" data-from="jacksonMajor" data-to="jackson3" d="M840 725 H885 Q905 725 905 705 V653 Q905 633 925 633 H970" stroke="#15803D" marker-end="url(#arrowGreen)"/>
<path class="route" data-from="jacksonMajor" data-to="jackson2" d="M720 790 V800 Q720 820 740 820 H900 Q920 820 920 800 V788 Q920 768 940 768 H970" stroke="#1D4ED8" marker-end="url(#arrowBlue)"/>
</svg>
