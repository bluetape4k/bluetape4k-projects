<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="740" viewBox="0 0 1380 740" role="img" aria-labelledby="ktor-core-architecture-01-title ktor-core-architecture-01-desc">
  <title id="ktor-core-architecture-01-title">Ktor Core Architecture</title>
  <desc id="ktor-core-architecture-01-desc">Explicit installation of JSON, standard errors, health routes, and request helpers</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M1,1 L8,4.5 L1,8 Z" fill="#758297"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:16px;fill:#536476;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .cardTitle{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:24px;fill:#22344A;font-weight:400}
      .body{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;fill:#34465B;font-weight:400}
      .edge{stroke:#758297;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .edgeLabel{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;fill:#536476;font-weight:400;dominant-baseline:middle}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.92}
      .note{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;fill:#627184;font-weight:400}
    </style>
  </defs>
  <rect class="canvas" width="1380" height="740"/>
  <rect class="frame" x="32" y="28" width="1316" height="684" rx="26"/>
  <text class="title" x="66" y="82">Ktor Core Architecture</text>
  <text class="subtitle" x="70" y="116">Explicit installation of JSON, standard errors, health routes, and request helpers</text>
  <path class="edge" d="M335 320 L362.5 320 L362.5 230 L390 230"/>
<path class="edge" d="M690 230 L725 230 L725 215 L760 215"/>
<path class="edge" d="M690 230 L725 230 L725 412.5 L760 412.5"/>
<path class="edge" d="M540 305 L540 425 L900 425 L900 545"/>
<path class="edge" d="M335 320 L717.5 320 L717.5 437.5 L1100 437.5"/>
<path class="edge" d="M1070 412.5 L1085 412.5 L1085 437.5 L1100 437.5"/>
  <g>
  <rect class="card" x="70" y="255" width="265" height="130" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="202.5" y="297" text-anchor="middle">Application</text>
  <text class="body" x="202.5" y="332" text-anchor="middle">installBluetape4kKtorCore</text>
<text class="body" x="202.5" y="355" text-anchor="middle">config owned by app</text>
</g>
<g>
  <rect class="card" x="390" y="155" width="300" height="150" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="540" y="197" text-anchor="middle">Core config</text>
  <text class="body" x="540" y="232" text-anchor="middle">enable JSON</text>
<text class="body" x="540" y="255" text-anchor="middle">enable StatusPages</text>
<text class="body" x="540" y="278" text-anchor="middle">health/readiness paths</text>
</g>
<g>
  <rect class="card" x="760" y="150" width="280" height="130" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="900" y="192" text-anchor="middle">ContentNegotiation</text>
  <text class="body" x="900" y="227" text-anchor="middle">Bluetape4kKtorJson</text>
<text class="body" x="900" y="250" text-anchor="middle">kotlinx serialization</text>
</g>
<g>
  <rect class="card" x="760" y="335" width="310" height="155" rx="16" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="915" y="377" text-anchor="middle">StatusPages</text>
  <text class="body" x="915" y="412" text-anchor="middle">IllegalArgumentException -&gt; 400</text>
<text class="body" x="915" y="435" text-anchor="middle">Throwable -&gt; 500</text>
<text class="body" x="915" y="458" text-anchor="middle">rethrow cancellation</text>
</g>
<g>
  <rect class="card" x="760" y="545" width="280" height="130" rx="16" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="900" y="587" text-anchor="middle">Health routes</text>
  <text class="body" x="900" y="622" text-anchor="middle">/healthz</text>
<text class="body" x="900" y="645" text-anchor="middle">/readyz</text>
<text class="body" x="900" y="668" text-anchor="middle">HealthResponse.up()</text>
</g>
<g>
  <rect class="card" x="1100" y="360" width="235" height="155" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1217.5" y="402" text-anchor="middle">Application routes</text>
  <text class="body" x="1217.5" y="437" text-anchor="middle">requiredPathParameter</text>
<text class="body" x="1217.5" y="460" text-anchor="middle">intQueryParameter</text>
<text class="body" x="1217.5" y="483" text-anchor="middle">call.respond(...)</text>
</g>
  <text class="note" x="690" y="702" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
