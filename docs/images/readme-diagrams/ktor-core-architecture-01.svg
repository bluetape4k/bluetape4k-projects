<rect class="canvas" width="1440" height="900"/>
<rect class="frame" x="34" y="30" width="1372" height="840" rx="8"/>
<text class="title" x="72" y="84">Ktor Core Layered Architecture</text>
<text class="subtitle" x="76" y="116">The core module installs a small baseline: JSON, standard errors, health routes, and request helpers around normal Ktor routing.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="150" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Application install</text></g>
<g><rect class="panel" x="82" y="385" width="1276" height="215" rx="8"/><text class="panelTitle" x="110" y="421" dominant-baseline="middle">bluetape4k Ktor core</text></g>
<g><rect class="panel" x="82" y="675" width="1276" height="145" rx="8"/><text class="panelTitle" x="110" y="711" dominant-baseline="middle">Ktor runtime</text></g>
<g id="app">
  <rect class="card" x="130" y="215" width="300" height="74" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="280" y="245" text-anchor="middle" dominant-baseline="middle">Application.module</text>
  <text class="detail" x="280" y="275" text-anchor="middle" dominant-baseline="middle">installBluetape4kKtorCore</text>
</g>
<g id="config">
  <rect class="card" x="560" y="215" width="300" height="74" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="710" y="245" text-anchor="middle" dominant-baseline="middle">Core config</text>
  <text class="detail" x="710" y="275" text-anchor="middle" dominant-baseline="middle">JSON, errors, health readiness</text>
</g>
<g id="routes">
  <rect class="card" x="980" y="215" width="300" height="74" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1130" y="245" text-anchor="middle" dominant-baseline="middle">Application routes</text>
  <text class="detail" x="1130" y="275" text-anchor="middle" dominant-baseline="middle">use request parameter helpers</text>
</g>
<g id="json">
  <rect class="card" x="135" y="455" width="280" height="86" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="275" y="491" text-anchor="middle" dominant-baseline="middle">Content negotiation</text>
  <text class="detail" x="275" y="521" text-anchor="middle" dominant-baseline="middle">Jackson JSON defaults</text>
</g>
<g id="errors">
  <rect class="card" x="465" y="455" width="280" height="86" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="605" y="491" text-anchor="middle" dominant-baseline="middle">StatusPages</text>
  <text class="detail" x="605" y="521" text-anchor="middle" dominant-baseline="middle">standard API error response</text>
</g>
<g id="health">
  <rect class="card" x="795" y="455" width="280" height="86" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="935" y="491" text-anchor="middle" dominant-baseline="middle">Health routes</text>
  <text class="detail" x="935" y="521" text-anchor="middle" dominant-baseline="middle">/health, /ready</text>
</g>
<g id="params">
  <rect class="card" x="1095" y="455" width="230" height="86" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1210" y="491" text-anchor="middle" dominant-baseline="middle">Request helpers</text>
  <text class="detail" x="1210" y="521" text-anchor="middle" dominant-baseline="middle">typed path/query</text>
</g>
<g id="ktor">
  <rect class="card" x="250" y="720" width="310" height="62" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="405" y="744" text-anchor="middle" dominant-baseline="middle">Ktor plugin pipeline</text>
  <text class="detail" x="405" y="774" text-anchor="middle" dominant-baseline="middle">plugins execute around routes</text>
</g>
<g id="response">
  <rect class="card" x="850" y="720" width="310" height="62" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1005" y="744" text-anchor="middle" dominant-baseline="middle">HTTP response</text>
  <text class="detail" x="1005" y="774" text-anchor="middle" dominant-baseline="middle">JSON body or API error</text>
</g>
