<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000" role="img" aria-label="Distributed Trace Propagation">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.25"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1640" height="1000"/>
<rect class="frame" x="34" y="30" width="1572" height="940" rx="30"/>
<text class="title" x="72" y="86">Distributed Trace Propagation</text>
<text class="subtitle" x="76" y="118">Trace context moves through explicit propagators and carriers before the downstream service creates a child span.</text>
<g><rect class="panel" x="80" y="184" width="420" height="430" rx="22"/><text class="panelTitle" x="104" y="218">Service A</text></g>
<g><rect class="panel" x="570" y="249" width="500" height="300" rx="22"/><text class="panelTitle" x="594" y="283">Carrier boundary</text></g>
<g><rect class="panel" x="1140" y="184" width="420" height="500" rx="22"/><text class="panelTitle" x="1164" y="218">Service B</text></g>
<g><rect class="panel" x="570" y="710" width="500" height="155" rx="22"/><text class="panelTitle" x="594" y="744">Telemetry backend</text></g>
<g id="spanA"><rect class="card" x="145" y="259" width="290" height="88" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="290" y="286" text-anchor="middle">withSpan / useSpan</text><text class="detail" x="290" y="321" text-anchor="middle">creates parent Span</text><text class="detail" x="290" y="339" text-anchor="middle">Context.current()</text></g>
<g id="coroutine"><rect class="card" x="145" y="411" width="290" height="88" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="290" y="438" text-anchor="middle">Coroutine Context</text><text class="detail" x="290" y="473" text-anchor="middle">asContextElement()</text><text class="detail" x="290" y="491" text-anchor="middle">withSpanContext()</text></g>
<g id="inject"><rect class="card" x="650" y="309" width="340" height="88" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="820" y="336" text-anchor="middle">ContextPropagators</text><text class="detail" x="820" y="371" text-anchor="middle">inject trace context</text><text class="detail" x="820" y="389" text-anchor="middle">W3C traceparent</text></g>
<g id="carrier"><rect class="card" x="670" y="449" width="300" height="70" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="820" y="476" text-anchor="middle">HTTP / Kafka carrier</text><text class="detail" x="820" y="511" text-anchor="middle">headers carry trace IDs</text></g>
<g id="extract"><rect class="card" x="1205" y="439" width="290" height="88" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="1350" y="466" text-anchor="middle">Extracted Context</text><text class="detail" x="1350" y="501" text-anchor="middle">remote parent</text><text class="detail" x="1350" y="519" text-anchor="middle">trace continuity</text></g>
<g id="spanB"><rect class="card" x="1205" y="579" width="290" height="88" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="1350" y="606" text-anchor="middle">Child Span</text><text class="detail" x="1350" y="641" text-anchor="middle">server/consumer work</text><text class="detail" x="1350" y="659" text-anchor="middle">same trace</text></g>
<g id="export"><rect class="card" x="645" y="780" width="350" height="64" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="820" y="804" text-anchor="middle">SpanExporter / Collector</text><text class="detail" x="820" y="839" text-anchor="middle">joined trace view</text></g>
<path class="flow" d="M290 347 L290 411" stroke="#3E9868"/>
<path class="flow" d="M435 455 L535 455 L535 353 L650 353" stroke="#755BC6"/>
<path class="flow" d="M820 397 L820 449" stroke="#B9851B"/>
<path class="flow" d="M970 484 L1205 484" stroke="#2E8F89"/>
<path class="flow" d="M1350 527 L1350 579" stroke="#3E9868"/>
<path class="flow" d="M1350 638 L1350 680 L900 680 L900 780" stroke="#C94D68"/>
<path class="flow" d="M290 499 L290 709 L820 709 L820 809" stroke="#C94D68"/>
<g><rect x="415" y="421" width="110" height="30" rx="8" fill="#FFFFFF" stroke="#8A72D6" stroke-width="1.2"/><text class="detail" x="470" y="437" text-anchor="middle" dominant-baseline="middle">inject</text></g>
<g><rect x="1025" y="450" width="110" height="30" rx="8" fill="#FFFFFF" stroke="#45A7A1" stroke-width="1.2"/><text class="detail" x="1080" y="466" text-anchor="middle" dominant-baseline="middle">extract</text></g>
<g><rect x="145" y="910" width="1350" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><text class="small" x="820" y="935" text-anchor="middle">Source: infra/opentelemetry context propagation helpers and README trace flow.</text></g>
</svg>
