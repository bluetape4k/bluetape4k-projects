  <text class="smallLabel" x="140" y="45" text-anchor="middle">Service B Child Span</text>
</g>
<g transform="translate(716,170)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="140" y="45" text-anchor="middle">Service C Child Span</text>
</g>
<g transform="translate(1050,170)">
