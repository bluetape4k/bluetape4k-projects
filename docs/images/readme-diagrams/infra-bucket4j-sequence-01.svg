<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="1790" viewBox="0 0 1584 1790" role="img" aria-label="Local Rate Limiter — Token Consumption Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1584" height="1790"/>
<rect class="frame" x="32" y="28" width="1520" height="1734" rx="28"/>
<text class="title" x="66" y="82">Local Rate Limiter — Token Consumption Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-5" y="166" width="290" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1730" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="429.66666666666674" y="166" width="290" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="574.6666666666667" y="209" text-anchor="middle">LocalRateLimiter</text>
<line class="lifeline" x1="574.6666666666667" y1="252" x2="574.6666666666667" y2="1730" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="864.3333333333334" y="166" width="290" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1009.3333333333334" y="209" text-anchor="middle">LocalBucketProvider</text>
<line class="lifeline" x1="1009.3333333333334" y1="252" x2="1009.3333333333334" y2="1730" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1299" y="166" width="290" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1444" y="209" text-anchor="middle">LocalBucket</text>
<line class="lifeline" x1="1444" y1="252" x2="1444" y2="1730" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="252.33333333333337" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="270.33333333333337" y="313" text-anchor="start">1. consume(user:1, 1)</text>
<path class="line" d="M140 344 L574.6666666666667 344"/>
<rect x="435.16666666666674" y="396" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="453.16666666666674" y="423" text-anchor="start">2. validateRateLimitRequest(key, numToken)</text>
<path class="line" d="M574.6666666666667 454 C638.6666666666667 454 638.6666666666667 488 574.6666666666667 488"/>
<rect x="677" y="526" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="695" y="553" text-anchor="start">3. resolveBucket(user:1)</text>
<path class="line" d="M574.6666666666667 584 L1009.3333333333334 584"/>
<rect x="665" y="636" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="683" y="663" text-anchor="start">4. LocalBucket (from cache)</text>
<path class="dashed" d="M1009.3333333333334 694 L574.6666666666667 694"/>
<rect x="853.8333333333334" y="746" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="871.8333333333334" y="773" text-anchor="start">5. tryConsumeAndReturnRemaining(1)</text>
<path class="line" d="M574.6666666666667 804 L1444 804"/>
<rect x="70" y="856" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="883" text-anchor="start">ALT: Sufficient tokens (CONSUMED)</text>
<rect x="761.3333333333334" y="924" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="779.3333333333334" y="951" text-anchor="start">7. probe { isConsumed=true, remaining=9, resetNanos=... }</text>
<path class="dashed" d="M1444 982 L574.6666666666667 982"/>
<rect x="73.33333333333337" y="1034" width="568" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="91.33333333333337" y="1061" text-anchor="start">8. RateLimitResult(CONSUMED, consumed=1, available=9, diagnostics)</text>
<path class="dashed" d="M574.6666666666667 1092 L140 1092"/>
<rect x="70" y="1144" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1171" text-anchor="start">ELSE: Insufficient tokens (REJECTED)</text>
<rect x="749.3333333333334" y="1212" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="767.3333333333334" y="1239" text-anchor="start">10. probe { isConsumed=false, remaining=0, refillNanos=... }</text>
<path class="dashed" d="M1444 1270 L574.6666666666667 1270"/>
<rect x="73.33333333333337" y="1322" width="568" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="91.33333333333337" y="1349" text-anchor="start">11. RateLimitResult(REJECTED, consumed=0, available=0, retryAfter)</text>
<path class="dashed" d="M574.6666666666667 1380 L140 1380"/>
<rect x="70" y="1432" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1459" text-anchor="start">ELSE: Error (ERROR)</text>
<rect x="904.3333333333334" y="1500" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="922.3333333333334" y="1527" text-anchor="start">13. Exception</text>
<path class="dashed" d="M1444 1558 L574.6666666666667 1558"/>
<rect x="161.83333333333337" y="1610" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="179.83333333333337" y="1637" text-anchor="start">14. RateLimitResult(ERROR, errorMessage=...)</text>
<path class="dashed" d="M574.6666666666667 1668 L140 1668"/>
</svg>
