<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1262" viewBox="0 0 1200 1262" role="img" aria-label="Local Rate Limiter — Token Consumption Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1200" height="1262"/>
<rect class="frame" x="32" y="28" width="1136" height="1206" rx="28"/>
<text class="title" x="66" y="82">Local Rate Limiter — Token Consumption Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="35" y="166" width="210" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line x1="140" y1="252" x2="140" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="341.6666666666667" y="166" width="210" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="446.6666666666667" y="209" text-anchor="middle">LocalRateLimiter</text>
<line x1="446.6666666666667" y1="252" x2="446.6666666666667" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="648.3333333333334" y="166" width="210" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="753.3333333333334" y="209" text-anchor="middle">LocalBucketProvider</text>
<line x1="753.3333333333334" y1="252" x2="753.3333333333334" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="955" y="166" width="210" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1060" y="209" text-anchor="middle">LocalBucket</text>
<line x1="1060" y1="252" x2="1060" y2="1202" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="158" y="270" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="297" text-anchor="start">1. consume(user:1, 1)</text>
<path class="line" d="M140 310 L446.6666666666667 310"/>
<rect x="464.6666666666667" y="352" width="190" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="379" text-anchor="start">2. validate Rate Limit</text>
<text class="strong" x="480.6666666666667" y="402" text-anchor="start">Request(key, numToken)</text>
<path class="line" d="M446.6666666666667 392 C502.6666666666667 392 502.6666666666667 422 446.6666666666667 422"/>
<rect x="464.6666666666667" y="434" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="461" text-anchor="start">3. resolveBucket(user:1)</text>
<path class="line" d="M446.6666666666667 474 L753.3333333333334 474"/>
<rect x="464.6666666666667" y="516" width="270.6666666666667" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="543" text-anchor="start">4. LocalBucket (from cache)</text>
<path class="dashed" d="M753.3333333333334 556 L446.6666666666667 556"/>
<rect x="464.6666666666667" y="598" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="625" text-anchor="start">5. tryConsumeAndReturnRemaining(1)</text>
<path class="line" d="M446.6666666666667 638 L1060 638"/>
<rect x="464.6666666666667" y="680" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="707" text-anchor="start">6. probe { isConsumed=true, remaining=9, resetNanos=... }</text>
<path class="dashed" d="M1060 720 L446.6666666666667 720"/>
<rect x="158" y="762" width="270.6666666666667" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="789" text-anchor="start">7. RateLimitResult(CONSUMED, consumed=1,</text>
<text class="strong" x="174" y="812" text-anchor="start">available=9, diagnostics)</text>
<path class="dashed" d="M446.6666666666667 802 L140 802"/>
<rect x="464.6666666666667" y="844" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="871" text-anchor="start">8. probe { isConsumed=false, remaining=0, refillNanos=... }</text>
<path class="dashed" d="M1060 884 L446.6666666666667 884"/>
<rect x="158" y="926" width="270.6666666666667" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="953" text-anchor="start">9. RateLimitResult(REJECTED, consumed=0,</text>
<text class="strong" x="174" y="976" text-anchor="start">available=0, retryAfter)</text>
<path class="dashed" d="M446.6666666666667 966 L140 966"/>
<rect x="464.6666666666667" y="1008" width="577.3333333333333" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="480.6666666666667" y="1035" text-anchor="start">10. Exception</text>
<path class="dashed" d="M1060 1048 L446.6666666666667 1048"/>
<rect x="158" y="1090" width="270.6666666666667" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1117" text-anchor="start">11. RateLimitResult(ERROR,</text>
<text class="strong" x="174" y="1140" text-anchor="start">errorMessage=...)</text>
<path class="dashed" d="M446.6666666666667 1130 L140 1130"/>
</svg>
