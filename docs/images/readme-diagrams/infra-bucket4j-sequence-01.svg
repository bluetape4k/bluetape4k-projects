<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1214" viewBox="0 0 1754 1214" role="img" aria-label="Local Rate Limiter — Token Consumption Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1214"/>
<rect class="frame" x="32" y="28" width="1690" height="1158" rx="28"/>
<text class="title" x="66" y="82">Local Rate Limiter — Token Consumption Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="290" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="225" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="225" y1="252" x2="225" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="514.7" y="166" width="290" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="659.7" y="209" text-anchor="middle">LocalRateLimiter</text>
<line class="lifeline" x1="659.7" y1="252" x2="659.7" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="949.3" y="166" width="290" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1094.3" y="209" text-anchor="middle">LocalBucketProvider</text>
<line class="lifeline" x1="1094.3" y1="252" x2="1094.3" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1384" y="166" width="290" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1529" y="209" text-anchor="middle">LocalBucket</text>
<line class="lifeline" x1="1529" y1="252" x2="1529" y2="1154" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="337.3" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="355.3" y="313" text-anchor="start">1. consume(user:1, 1)</text>
<path class="line" d="M225 332 L659.7 332"/>
<rect x="520.2" y="362" width="375" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="538.2" y="389" text-anchor="start">2. validateRateLimitRequest(key, numToken)</text>
<path class="line" d="M659.7 408 C723.7 408 723.7 442 659.7 442"/>
<rect x="762" y="438" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="780" y="465" text-anchor="start">3. resolveBucket(user:1)</text>
<path class="line" d="M659.7 484 L1094.3 484"/>
<rect x="750" y="514" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="768" y="541" text-anchor="start">4. LocalBucket (from cache)</text>
<path class="dashed" d="M1094.3 560 L659.7 560"/>
<rect x="938.8" y="590" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="956.8" y="617" text-anchor="start">5. tryConsumeAndReturnRemaining(1)</text>
<path class="line" d="M659.7 636 L1529 636"/>
<rect x="155" y="856" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="177" y="883" text-anchor="start">ALT: Sufficient tokens (CONSUMED)</text>
<rect x="846.3" y="666" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="864.3" y="693" text-anchor="start">7. probe { isConsumed=true, remaining=9, resetNanos=... }</text>
<path class="dashed" d="M1529 712 L659.7 712"/>
<rect x="158.3" y="742" width="568" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="176.3" y="769" text-anchor="start">8. RateLimitResult(CONSUMED, consumed=1, available=9, diagnostics)</text>
<path class="dashed" d="M659.7 788 L225 788"/>
<rect x="155" y="1144" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="177" y="1171" text-anchor="start">ELSE: Insufficient tokens (REJECTED)</text>
<rect x="834.3" y="818" width="520" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="852.3" y="845" text-anchor="start">10. probe { isConsumed=false, remaining=0, refillNanos=... }</text>
<path class="dashed" d="M1529 864 L659.7 864"/>
<rect x="158.3" y="894" width="568" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="176.3" y="921" text-anchor="start">11. RateLimitResult(REJECTED, consumed=0, available=0, retryAfter)</text>
<path class="dashed" d="M659.7 940 L225 940"/>
<rect x="155" y="1432" width="1444" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="177" y="1459" text-anchor="start">ELSE: Error (ERROR)</text>
<rect x="989.3" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1007.3" y="997" text-anchor="start">13. Exception</text>
<path class="dashed" d="M1529 1016 L659.7 1016"/>
<rect x="246.8" y="1046" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="264.8" y="1073" text-anchor="start">14. RateLimitResult(ERROR, errorMessage=...)</text>
<path class="dashed" d="M659.7 1092 L225 1092"/>
</svg>
