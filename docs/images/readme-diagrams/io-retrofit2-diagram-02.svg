<svg data-intent="Explain the source-backed Retrofit2 Result pattern integration around ResultCallAdapterFactory and ResultCall." data-evidence="io/retrofit2/README.md; ResultCallAdapterFactory.kt; ResultCall.kt; RetrofitSupport.kt" xmlns="http://www.w3.org/2000/svg" width="1540" height="930" viewBox="0 0 1540 930" role="img" aria-label="Retrofit2 Result Pattern Integration">
<defs>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .section{fill:#fff;stroke:#D2DFEA;stroke-width:2}.sectionTitle{font-family:"Architects Daughter";font-size:25px;fill:#22344A}.sectionNote{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .card{stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#536476}
    .route{fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}.dash{stroke-dasharray:10 8}.label{font-family:"Comic Mono";font-size:12px;fill:#536476}
    .pill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}
  </style>
</defs>
<rect class="canvas" width="1540" height="930"/>
<rect class="frame" x="30" y="28" width="1480" height="874" rx="30"/>
<text class="title" x="70" y="86">Retrofit2 Result Pattern Integration</text>
<text class="subtitle" x="74" y="118">Only Call&lt;Result&lt;T&gt;&gt; is adapted; ResultCall converts HTTP and network outcomes into Kotlin Result values.</text>

<g id="selection"><rect class="section" x="84" y="164" width="1372" height="214" rx="14"/><text class="sectionTitle" x="116" y="205">Adapter selection</text><text class="sectionNote" x="116" y="234">retrofitOf registers ResultCallAdapterFactory by default.</text></g>
<g id="wrapping"><rect class="section" x="84" y="438" width="1372" height="176" rx="14"/><text class="sectionTitle" x="116" y="479">Call wrapping</text><text class="sectionNote" x="116" y="507">The adapter wraps Retrofit's delegate Call&lt;T&gt;.</text></g>
<g id="mapping"><rect class="section" x="84" y="650" width="1372" height="210" rx="14"/><text class="sectionTitle" x="116" y="690">Outcome mapping</text><text class="sectionNote" x="116" y="718">Business code receives Result values instead of thrown transport exceptions.</text></g>

<g id="method"><rect class="card" x="132" y="270" width="300" height="78" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="282" y="304" text-anchor="middle">Service method</text><text class="detail" x="282" y="328" text-anchor="middle">suspend fun ...: Result&lt;T&gt;</text></g>
<g id="returnType"><rect class="card" x="506" y="254" width="320" height="110" rx="10" fill="#E9F7F6" stroke="#2E8F89"/><text class="cardTitle" x="666" y="291" text-anchor="middle">Return type inspection</text><text class="detail" x="666" y="319" text-anchor="middle">raw type must be Call</text><text class="detail" x="666" y="339" text-anchor="middle">inner type must be Result&lt;T&gt;</text></g>
<g id="adapter"><rect class="card" x="900" y="254" width="320" height="110" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="1060" y="291" text-anchor="middle">ResultCallAdapter</text><text class="detail" x="1060" y="319" text-anchor="middle">responseType is T</text><text class="detail" x="1060" y="339" text-anchor="middle">adapt(call) returns ResultCall</text></g>

<g id="otherAdapters"><rect class="card" x="1032" y="182" width="300" height="54" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1182" y="215" text-anchor="middle">other adapters continue</text></g>

<g id="delegate"><rect class="card" x="196" y="520" width="320" height="70" rx="10" fill="#F2EBFF" stroke="#755BC6"/><text class="cardTitle" x="356" y="552" text-anchor="middle">Delegate Call&lt;T&gt;</text><text class="detail" x="356" y="575" text-anchor="middle">Retrofit transport call</text></g>
<g id="resultCall"><rect class="card" x="610" y="504" width="320" height="102" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="770" y="540" text-anchor="middle">ResultCall&lt;T&gt;</text><text class="detail" x="770" y="568" text-anchor="middle">execute() and enqueue()</text><text class="detail" x="770" y="588" text-anchor="middle">Response&lt;Result&lt;T&gt;&gt;</text></g>
<g id="callback"><rect class="card" x="1024" y="520" width="320" height="70" rx="10" fill="#E8F3FF" stroke="#4F83BF"/><text class="cardTitle" x="1184" y="552" text-anchor="middle">Caller callback</text><text class="detail" x="1184" y="575" text-anchor="middle">always receives Response.success(result)</text></g>

<g id="success"><rect class="card" x="176" y="794" width="290" height="52" rx="10" fill="#EAF7EF" stroke="#3E9868"/><text class="cardTitle" x="321" y="827" text-anchor="middle">Result.success(body)</text></g>
<g id="httpError"><rect class="card" x="560" y="794" width="290" height="52" rx="10" fill="#FFF0F4" stroke="#C94D68"/><text class="cardTitle" x="705" y="827" text-anchor="middle">failure(HttpException)</text></g>
<g id="networkError"><rect class="card" x="944" y="794" width="352" height="52" rx="10" fill="#FFF5E6" stroke="#B9851B"/><text class="cardTitle" x="1120" y="827" text-anchor="middle">failure(IOException / null body)</text></g>

