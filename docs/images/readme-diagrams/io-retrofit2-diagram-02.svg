<path class="route" d="M 770 606 L 770 746 Q 770 760 756 760 L 718.6 760 Q 705 760 705 773.6 L 705 794" stroke="#C94D68"/><path d="M705 794 l-7 -12 h14 z" fill="#C94D68"/>
