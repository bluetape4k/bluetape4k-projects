<rect class="pill" x="560" y="392" width="196" height="30" rx="8"/><text class="label" x="658" y="412" text-anchor="middle">non-Result returns null</text>
<rect class="pill" x="681" y="744" width="178" height="30" rx="8"/><text class="label" x="770" y="764" text-anchor="middle">map one delegate result</text>
</svg>
