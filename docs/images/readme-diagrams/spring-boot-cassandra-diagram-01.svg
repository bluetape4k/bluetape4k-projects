<text x="576" y="1091" text-anchor="start" font-size="12.5" font-weight="400" fill="#374151">potentiallyCreateTableFor&lt;T&gt;()</text>
<text x="576" y="1109" text-anchor="start" font-size="12.5" font-weight="400" fill="#374151">truncate&lt;T&gt;() if table exists</text>
  </g>

