<svg xmlns="http://www.w3.org/2000/svg" width="2350" height="1640" viewBox="0 0 2350 1640" role="img" aria-label="Spring Boot Cassandra Core Class Structure Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/></filter>

  <marker id="arrow-teal" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#0F766E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-teal" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#0F766E" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-blue" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#1D4ED8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-blue" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-green" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-green" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#15803D" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-amber" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#C2410C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-amber" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#C2410C" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-pink" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#BE185D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-pink" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#BE185D" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-purple" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-purple" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#6D28D9" stroke-width="2" stroke-dasharray="none"/></marker>

  <marker id="arrow-slate" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 15 9 L 2 16" fill="none" stroke="#475569" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/></marker>
  <marker id="triangle-slate" markerWidth="24" markerHeight="22" refX="21" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M 2 2 L 21 11 L 2 20 Z" fill="#FFFFFF" stroke="#475569" stroke-width="2" stroke-dasharray="none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .classBox,.noteBox{stroke-width:1.8;filter:url(#shadow)}.stereotype{font-family:"Comic Mono";font-size:14px;fill:#475569}.classTitle{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
    .member,.noteLine{font-family:"Comic Mono";font-size:14px;fill:#334155}.divider{stroke-width:1.1;opacity:.45}.noteTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
    .edge{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:9 7}.edgeLabel{font-family:"Comic Mono";font-size:13px;fill:#475569}
  </style>
</defs>
<rect class="canvas" width="2350" height="1640"/>
<rect class="frame" x="34" y="30" width="2282" height="1580" rx="8"/>
<text class="title" x="72" y="86">Spring Boot Cassandra Core Structure</text>
<text class="subtitle" x="76" y="120">Coroutine extension sets, CQL/query DSL helpers, Cassandra entity base classes, and schema utilities in the Spring Boot 4 Cassandra module.</text>
<g id="ExternalApis">
  <rect class="noteBox" x="760" y="220" width="1080" height="170" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="noteTitle" x="788" y="268">Wrapped Spring Data and DataStax APIs</text>
  <text class="noteLine" x="790" y="308">ReactiveSession, ReactiveCassandraOperations, AsyncCassandraOperations, ReactiveCassandraBatchOperations</text>
<text class="noteLine" x="790" y="336">QueryOptions, WriteOptions, Criteria, CassandraOperations, mapping metadata</text>
</g>
<g id="ReactiveSessionExtensions">
  <rect class="classBox" x="90" y="500" width="570" height="280" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="stereotype" x="375" y="528" text-anchor="middle">&lt;&lt;extension set&gt;&gt;</text>
  <text class="classTitle" x="375" y="558" text-anchor="middle">ReactiveSessionCoroutines</text>
  <path class="divider" d="M90 576H660" stroke="#0F766E"/>
  <text class="member" x="114" y="602">receiver: ReactiveSession</text>
<text class="member" x="114" y="624">bridge: Reactor Mono -&gt; suspend</text>
  <path class="divider" d="M90 654H660" stroke="#0F766E"/>
  <text class="member" x="114" y="680">executeSuspending(String / args / Statement)</text>
<text class="member" x="114" y="702">prepareSuspending(String / SimpleStatement)</text>
<text class="member" x="114" y="724">returns ReactiveResultSet or PreparedStatement</text>
</g>
<g id="ReactiveOpsExtensions">
  <rect class="classBox" x="760" y="480" width="720" height="345" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="stereotype" x="1120" y="508" text-anchor="middle">&lt;&lt;extension set&gt;&gt;</text>
  <text class="classTitle" x="1120" y="538" text-anchor="middle">ReactiveCassandraOperationsCoroutines</text>
  <path class="divider" d="M760 556H1480" stroke="#15803D"/>
  <text class="member" x="784" y="582">receiver: ReactiveCassandraOperations</text>
<text class="member" x="784" y="604">bridges Flux to Flow and Mono to suspend</text>
  <path class="divider" d="M760 634H1480" stroke="#15803D"/>
  <text class="member" x="784" y="660">selectAsFlow(statement / cql / query)</text>
<text class="member" x="784" y="682">selectOne*, slice*, count*, exists*</text>
<text class="member" x="784" y="704">insert/update/delete/truncate suspending</text>
<text class="member" x="784" y="726">deleteByIdSuspending and executeSuspending</text>
</g>
<g id="AsyncOpsExtensions">
  <rect class="classBox" x="1590" y="500" width="570" height="280" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stereotype" x="1875" y="528" text-anchor="middle">&lt;&lt;extension set&gt;&gt;</text>
  <text class="classTitle" x="1875" y="558" text-anchor="middle">AsyncCassandraOperationsCoroutines</text>
  <path class="divider" d="M1590 576H2160" stroke="#1D4ED8"/>
  <text class="member" x="1614" y="602">receiver: AsyncCassandraOperations</text>
<text class="member" x="1614" y="624">bridge: CompletableFuture -&gt; suspend</text>
  <path class="divider" d="M1590 654H2160" stroke="#1D4ED8"/>
  <text class="member" x="1614" y="680">executeSuspending(statement)</text>
<text class="member" x="1614" y="702">selectSuspending(statement / cql / query)</text>
<text class="member" x="1614" y="724">selectOneOrNullSuspending</text>
<text class="member" x="1614" y="746">sliceSuspending with empty Slice fallback</text>
</g>
<g id="BatchSelectExtensions">
  <rect class="classBox" x="90" y="930" width="570" height="285" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="stereotype" x="375" y="958" text-anchor="middle">&lt;&lt;extension set&gt;&gt;</text>
  <text class="classTitle" x="375" y="988" text-anchor="middle">Batch and Select support</text>
  <path class="divider" d="M90 1006H660" stroke="#6D28D9"/>
  <text class="member" x="114" y="1032">ReactiveCassandraBatchOperations</text>
<text class="member" x="114" y="1054">ReactiveSelectOperation.TerminatingSelect</text>
  <path class="divider" d="M90 1084H660" stroke="#6D28D9"/>
  <text class="member" x="114" y="1110">insertFlow / updateFlow / deleteFlow</text>
<text class="member" x="114" y="1132">Flow is collected into Reactor mono</text>
<text class="member" x="114" y="1154">cast(), count/exists/first/one/all suspending</text>
</g>
<g id="OptionsDsl">
  <rect class="classBox" x="760" y="945" width="720" height="295" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="stereotype" x="1120" y="973" text-anchor="middle">&lt;&lt;DSL helpers&gt;&gt;</text>
  <text class="classTitle" x="1120" y="1003" text-anchor="middle">CQL Options and Criteria DSL</text>
  <path class="divider" d="M760 1021H1480" stroke="#C2410C"/>
  <text class="member" x="784" y="1047">QueryOptions / InsertOptions / UpdateOptions</text>
<text class="member" x="784" y="1069">WriteOptions / DeleteOptions</text>
<text class="member" x="784" y="1091">Criteria</text>
  <path class="divider" d="M760 1121H1480" stroke="#C2410C"/>
  <text class="member" x="784" y="1147">queryOptions / insertOptions / updateOptions</text>
<text class="member" x="784" y="1169">writeOptions / deleteOptions</text>
<text class="member" x="784" y="1191">Insert/Update/Delete.addWriteOptions()</text>
<text class="member" x="784" y="1213">Criteria.where(&quot;field&quot;) eq value</text>
</g>
<g id="SchemaGenerator">
  <rect class="classBox" x="1590" y="930" width="570" height="300" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="stereotype" x="1875" y="958" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
  <text class="classTitle" x="1875" y="988" text-anchor="middle">SchemaGenerator</text>
  <path class="divider" d="M1590 1006H2160" stroke="#BE185D"/>
  <text class="member" x="1614" y="1032">receiver dependency: CassandraOperations</text>
<text class="member" x="1614" y="1054">uses SchemaFactory and mappingContext</text>
  <path class="divider" d="M1590 1084H2160" stroke="#BE185D"/>
  <text class="member" x="1614" y="1110">createTableAndTypes&lt;T&gt;()</text>
<text class="member" x="1614" y="1132">potentiallyCreateTableFor&lt;T&gt;()</text>
<text class="member" x="1614" y="1154">potentiallyCreateUdtFor nested properties</text>
<text class="member" x="1614" y="1176">truncate&lt;T&gt;() only when table exists</text>
</g>
<g id="Persistable">
  <rect class="classBox" x="760" y="1290" width="570" height="255" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="stereotype" x="1045" y="1318" text-anchor="middle">&lt;&lt;abstract class&gt;&gt;</text>
  <text class="classTitle" x="1045" y="1348" text-anchor="middle">AbstractCassandraPersistable&lt;PK&gt;</text>
  <path class="divider" d="M760 1366H1330" stroke="#475569"/>
  <text class="member" x="784" y="1392">implements Persistable&lt;PK&gt;</text>
<text class="member" x="784" y="1414">implements Serializable</text>
  <path class="divider" d="M760 1444H1330" stroke="#475569"/>
  <text class="member" x="784" y="1470">setId(id): abstract</text>
<text class="member" x="784" y="1492">isNew(): id == null</text>
<text class="member" x="784" y="1514">equals/hashCode use non-null id</text>
</g>
<g id="Auditable">
  <rect class="classBox" x="1530" y="1275" width="620" height="285" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="stereotype" x="1840" y="1303" text-anchor="middle">&lt;&lt;abstract class&gt;&gt;</text>
  <text class="classTitle" x="1840" y="1333" text-anchor="middle">AbstractCassandraAuditable&lt;U,PK&gt;</text>
  <path class="divider" d="M1530 1351H2150" stroke="#475569"/>
  <text class="member" x="1554" y="1377">extends AbstractCassandraPersistable&lt;PK&gt;</text>
<text class="member" x="1554" y="1399">implements Auditable&lt;U, PK, Instant&gt;</text>
<text class="member" x="1554" y="1421">created/modified columns</text>
  <path class="divider" d="M1530 1451H2150" stroke="#475569"/>
  <text class="member" x="1554" y="1477">isNew(): createdAt == null</text>
<text class="member" x="1554" y="1499">get/setCreatedBy and CreatedDate</text>
<text class="member" x="1554" y="1521">get/setLastModifiedBy and LastModifiedDate</text>
</g>
<g data-from="ReactiveSessionExtensions" data-to="ExternalApis">
  <path class="edge dashed" d="M375 500 L375 420 L900 420 L900 390" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <text class="edgeLabel" x="573" y="399">wraps</text>
</g>
<g data-from="ReactiveOpsExtensions" data-to="ExternalApis">
  <path class="edge dashed" d="M1120 480 L1120 390" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="1146" y="437">wraps</text>
</g>
<g data-from="AsyncOpsExtensions" data-to="ExternalApis">
  <path class="edge dashed" d="M1875 500 L1875 420 L1700 420 L1700 390" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="1803" y="399">wraps</text>
</g>
<g data-from="BatchSelectExtensions" data-to="ReactiveOpsExtensions">
  <path class="edge dashed" d="M375 930 L375 870 L1120 870 L1120 825" stroke="#6D28D9" marker-end="url(#arrow-purple)"/>
  <text class="edgeLabel" x="628" y="849">same coroutine bridge family</text>
</g>
<g data-from="SchemaGenerator" data-to="ExternalApis">
  <path class="edge dashed" d="M1875 930 L1875 840 L2250 840 L2250 305 L1840 305" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
  <text class="edgeLabel" x="1938" y="820">mapping metadata</text>
</g>
<g data-from="Auditable" data-to="Persistable">
  <path class="edge " d="M1530 1418 L1330 1418" stroke="#475569" marker-end="url(#triangle-slate)"/>
  <text class="edgeLabel" x="1398" y="1397">extends</text>
</g>
<g data-from="OptionsDsl" data-to="ReactiveOpsExtensions">
  <path class="edge dashed" d="M1240 945 L1240 825" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <text class="edgeLabel" x="1266" y="892">options for writes</text>
</g>
</svg>