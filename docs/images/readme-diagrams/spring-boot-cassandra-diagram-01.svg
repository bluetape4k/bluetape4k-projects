<svg xmlns="http://www.w3.org/2000/svg" width="1832" height="939" viewBox="0 0 1832 939" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1832" height="939"/>
<rect class="frame" x="32" y="28" width="1768" height="883" rx="30"/>
<text class="title" x="68" y="84">Core Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="CoroutineUserRepository" data-to="ReactiveCassandraOperationsExt" data-route-color="teal" d="M698 303 L698 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ReactiveSessionExt" data-to="ReactiveCassandraOperationsExt" data-route-color="amber" d="M430 303 L430 430 L508 430" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="SchemaGenerator" data-to="ReactiveCassandraOperationsExt" data-route-color="pink" d="M946 303 L946 430 L908 430" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ReactiveCassandraOperationsExt" data-to="WriteOptionsDsl" data-route-color="purple" d="M698 554 L698 631" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="ReactiveSessionExt">
  <rect class="classCard" x="118" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="298" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="212" text-anchor="middle">ReactiveSessionExt</text>
  <line x1="118" y1="221" x2="478" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="258">+executeSuspending(cql, args):</text>
<text class="member" x="152" y="275">ReactiveResultSet</text>
</g>
<g id="ReactiveCassandraOperationsExt">
  <rect class="classCard" x="508" y="398" width="400" height="156" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="708" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="708" y="436" text-anchor="middle">ReactiveCassandra</text>
<text class="classTitle" x="708" y="458" text-anchor="middle">OperationsExt</text>
  <line x1="508" y1="462" x2="908" y2="462" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="542" y="495">+findOneOrNullSuspending(query):</text>
<text class="member" x="542" y="512">T?</text>
<text class="member" x="542" y="529">+findAllAsFlow(): Flow~T~</text>
</g>
<g id="CoroutineUserRepository">
  <rect class="classCard" x="508" y="165" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="688" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="212" text-anchor="middle">CoroutineUserRepository</text>
  <line x1="508" y1="221" x2="868" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="542" y="266">+findByEmail(email): User?</text>
</g>
<g id="SchemaGenerator">
  <rect class="classCard" x="898" y="165" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1078" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="212" text-anchor="middle">SchemaGenerator</text>
  <line x1="898" y1="221" x2="1258" y2="221" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="932" y="258">+createTables(operations, types)</text>
<text class="member" x="932" y="275">+truncateTables(operations, types)</text>
</g>
<g id="WriteOptionsDsl">
  <rect class="classCard" x="508" y="631" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="688" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="678" text-anchor="middle">WriteOptionsDsl</text>
  <line x1="508" y1="687" x2="868" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="542" y="724">+ttl(duration)</text>
<text class="member" x="542" y="741">+timestamp(millis)</text>
</g>
<g id="UserRepository">
  <rect class="classCard" x="1354" y="165" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1534" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="212" text-anchor="middle">UserRepository</text>
  <line x1="1354" y1="221" x2="1714" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1388" y="266">+findByEmail(email): User?</text>
</g>
<g>
  <rect x="1417" y="831" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1435 849 L1493 849" stroke="#3E9868"/>
  <text class="detail" x="1507" y="854">inheritance / implementation</text>
  <path class="dependency" d="M1435 870 L1493 870" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1507" y="875">dependency / usage</text>
</g>
<g><rect x="180" y="849" width="1192" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="776" y="875" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
