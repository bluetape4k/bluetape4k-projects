    <text x="740" y="963" text-anchor="middle" font-size="12.3" fill="#db2777">&lt;&lt;object&gt;&gt;</text>
    <text x="740" y="985" text-anchor="middle" font-size="16.5" font-weight="700" fill="#111827">SchemaGenerator</text>
