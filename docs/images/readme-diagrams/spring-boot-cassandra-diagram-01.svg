<polygon points="1227,851 1218,830 1209,851" fill="#FFFFFF" stroke="#64748b" stroke-width="2.8" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>

  <g class="card" data-card="ReactiveSession">
    <rect x="82" y="166" width="360" height="142" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="262" y="187" text-anchor="middle" font-size="12.3" fill="#2563eb">&lt;&lt;Spring Data receiver&gt;&gt;</text>
    <text x="262" y="209" text-anchor="middle" font-size="16.5" font-weight="700" fill="#111827">ReactiveSession</text>
    <line x1="82" y1="220" x2="442" y2="220" stroke="#2563eb" stroke-width="1.1" opacity="0.55" />
    <line x1="82" y1="274" x2="442" y2="274" stroke="#2563eb" stroke-width="1.1" opacity="0.45" />
    <text x="98" y="243" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">execute(statement): Mono&lt;ResultSet&gt;</text>
<text x="98" y="261" text-anchor="start" font-size="12.5" font-weight="400" fill="#475569">prepare(statement): Mono&lt;PreparedStatement&gt;</text>

  </g>

