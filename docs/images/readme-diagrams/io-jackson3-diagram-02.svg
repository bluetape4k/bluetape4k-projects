  <rect x="24" y="24" width="1792" height="1192" rx="20" class="frame"/>
  <text id="main-title" x="920" y="78" text-anchor="middle" class="title">bluetape4k-jackson3 Class Structure</text>
  <text x="920" y="108" text-anchor="middle" class="subtitle">Jackson3 replaces the package surface with tools.jackson.* while keeping mapper, serializer, streaming, and annotation extension roles explicit.</text>

  <rect x="72" y="150" width="520" height="858" rx="16" class="core-panel"/>
  <text x="102" y="190" class="panel-title">Core mapper and JSON adapter</text>
  <text x="102" y="218" class="small">JsonMapper DSL defaults plus the bluetape4k JsonSerializer bridge.</text>

  <rect x="138" y="272" width="368" height="132" rx="7" class="mapper"/>
  <text x="322" y="304" text-anchor="middle" class="class-title">Jackson</text>
  <line x1="138" y1="326" x2="506" y2="326" class="sep"/>
  <text x="162" y="352" class="member">defaultJsonMapper: JsonMapper</text>
  <text x="162" y="374" class="member">prettyJsonWriter: ObjectWriter</text>
  <text x="162" y="396" class="member">no typed default mapper wrapper</text>

  <rect x="138" y="482" width="368" height="128" rx="7" class="mapper"/>
  <text x="322" y="514" text-anchor="middle" class="class-title">JsonMapperSupport</text>
  <line x1="138" y1="536" x2="506" y2="536" class="sep"/>
  <text x="162" y="562" class="member">jsonMapper { builder block }</text>
  <text x="162" y="584" class="member">readValueOrNull / writeAsBytes</text>

  <rect x="138" y="690" width="368" height="126" rx="7" class="api"/>
  <text x="322" y="722" text-anchor="middle" class="class-title">JsonSerializer</text>
  <line x1="138" y1="744" x2="506" y2="744" class="sep"/>
  <text x="162" y="770" class="member">+ serialize(graph): ByteArray</text>
  <text x="162" y="792" class="member">+ deserialize(bytes, clazz)</text>

  <rect x="138" y="874" width="368" height="112" rx="7" class="serializer"/>
  <text x="322" y="906" text-anchor="middle" class="class-title">JacksonSerializer</text>
  <line x1="138" y1="928" x2="506" y2="928" class="sep"/>
  <text x="162" y="954" class="member">uses ObjectMapper.writeAsBytes</text>
  <text x="162" y="976" class="member">wraps failures as JsonSerializationException</text>

  <rect x="654" y="150" width="540" height="858" rx="16" class="format-panel"/>
  <text x="684" y="190" class="panel-title">Format serializer families</text>
  <text x="684" y="218" class="small">Compile-only format APIs become mapper/factory/serializer singletons.</text>

  <rect x="732" y="272" width="384" height="132" rx="7" class="mapper"/>
  <text x="924" y="304" text-anchor="middle" class="class-title">ObjectMapper extensions</text>
  <line x1="732" y1="326" x2="1116" y2="326" class="sep"/>
  <text x="756" y="352" class="member">tools.jackson.databind.ObjectMapper</text>
  <text x="756" y="374" class="member">registeredModuleNames / ids helpers</text>

  <rect x="678" y="494" width="228" height="144" rx="7" class="format"/>
  <text x="792" y="526" text-anchor="middle" class="class-title">JacksonBinary</text>
  <line x1="678" y1="548" x2="906" y2="548" class="sep"/>
  <text x="702" y="574" class="member">CBOR, ION, Smile</text>
  <text x="702" y="596" class="member">mapper + factory</text>
  <text x="702" y="618" class="member">format serializers</text>

  <rect x="942" y="494" width="228" height="144" rx="7" class="format"/>
  <text x="1056" y="526" text-anchor="middle" class="class-title">JacksonText</text>
  <line x1="942" y1="548" x2="1170" y2="548" class="sep"/>
  <text x="966" y="574" class="member">CSV, Props, TOML, YAML</text>
  <text x="966" y="596" class="member">mapper + factory</text>
  <text x="966" y="618" class="member">text serializers</text>

  <rect x="678" y="762" width="228" height="112" rx="7" class="serializer"/>
  <text x="792" y="794" text-anchor="middle" class="class-title">Binary serializers</text>
  <line x1="678" y1="816" x2="906" y2="816" class="sep"/>
  <text x="702" y="842" class="member">Cbor / Ion / Smile</text>
  <text x="702" y="864" class="member">extend JacksonSerializer</text>

  <rect x="942" y="762" width="228" height="112" rx="7" class="serializer"/>
  <text x="1056" y="794" text-anchor="middle" class="class-title">Text serializers</text>
  <line x1="942" y1="816" x2="1170" y2="816" class="sep"/>
  <text x="966" y="842" class="member">Csv / Props / Toml / Yaml</text>
  <text x="966" y="864" class="member">string oriented formats</text>

  <rect x="1260" y="150" width="508" height="858" rx="16" class="feature-panel"/>
  <text x="1290" y="190" class="panel-title">Streaming and annotation modules</text>
  <text x="1290" y="218" class="small">Root JsonNode streams; field rules use SimpleModule.</text>

  <rect x="1324" y="272" width="372" height="126" rx="7" class="async"/>
  <text x="1510" y="304" text-anchor="middle" class="class-title">AsyncJsonParser</text>
  <line x1="1324" y1="326" x2="1696" y2="326" class="sep"/>
  <text x="1348" y="352" class="member">callback ByteArray chunks</text>
  <text x="1348" y="374" class="member">endOfInput validates EOF</text>

  <rect x="1324" y="462" width="372" height="126" rx="7" class="async"/>
  <text x="1510" y="494" text-anchor="middle" class="class-title">SuspendJsonParser</text>
  <line x1="1324" y1="516" x2="1696" y2="516" class="sep"/>
  <text x="1348" y="542" class="member">Flow&lt;ByteArray&gt; input</text>
  <text x="1348" y="564" class="member">consumeComplete sends EOF</text>

  <rect x="1324" y="654" width="372" height="112" rx="7" class="module"/>
  <text x="1510" y="686" text-anchor="middle" class="class-title">JsonUuidModule</text>
  <line x1="1324" y1="708" x2="1696" y2="708" class="sep"/>
  <text x="1348" y="734" class="member">inserts UUID annotation introspector</text>
  <text x="1348" y="756" class="member">@JsonUuidEncoder Base62 or Plain</text>

  <rect x="1324" y="824" width="372" height="134" rx="7" class="module"/>
  <text x="1510" y="856" text-anchor="middle" class="class-title">Field modules</text>
  <line x1="1324" y1="878" x2="1696" y2="878" class="sep"/>
  <text x="1348" y="904" class="member">JsonTinkEncryptModule</text>
  <text x="1348" y="926" class="member">JsonMaskerModule</text>
  <text x="1348" y="948" class="member">serializer/deserializer selection</text>

  <rect x="92" y="1048" width="1656" height="82" rx="14" class="rule-panel"/>
  <text x="122" y="1080" class="panel-title">Reader contract</text>
  <text x="122" y="1108" class="small">Use Jackson.defaultJsonMapper for standard JSON, JacksonBinary/JacksonText for explicit formats, streaming parsers for chunked roots, and SimpleModule extensions for field annotations.</text>

