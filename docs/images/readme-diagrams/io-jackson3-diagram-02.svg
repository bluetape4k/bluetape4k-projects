<polygon points="328,828 322,816 316,828" fill="#455a64" stroke="#455a64" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect x="346" y="838" width="90" height="24" rx="12" fill="#ffffff" stroke="#d7e0e4"/>
