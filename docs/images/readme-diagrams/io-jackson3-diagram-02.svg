<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1240" viewBox="0 0 1840 1240" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-jackson3 class structure</title>
  <desc id="desc">Class map of Jackson3 mapper defaults, serializer families, non-blocking parsers, and SimpleModule-based UUID, encryption, and masking extensions.</desc>
  <defs>
    <style>
