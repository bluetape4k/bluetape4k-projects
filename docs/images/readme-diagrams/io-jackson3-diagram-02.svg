<polyline points="786,482 792,494 798,482" fill="none" stroke="#5d7b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 924 404 L 924 438 Q 924 452 938 452 L 1042 452 Q 1056 452 1056 466 L 1056 494" class="usesGreen" stroke-linecap="round" stroke-linejoin="round" style="marker-end:none"/>
<polyline points="1050,482 1056,494 1062,482" fill="none" stroke="#5d7b63" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 792 638 L 792 762" class="flowBlue"/>
  <path d="M 1056 638 L 1056 762" class="flowBlue"/>

  <path d="M 792 874 V 930" class="inheritBus"/>
  <path d="M 1056 874 V 930" class="inheritBus"/>
