<polyline points="1312,896 1324,890 1312,884" fill="none" stroke="#b65f68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

