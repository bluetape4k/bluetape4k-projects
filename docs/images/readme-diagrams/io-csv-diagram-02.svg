<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1200" viewBox="0 0 1760 1200" role="img" aria-label="CSV and TSV processing flow">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1.5"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .laneTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
      .card{stroke-width:2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .text{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .textSmall{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .flow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1200"/>
  <rect class="frame" x="36" y="30" width="1688" height="1140" rx="8"/>
  <text class="title" x="76" y="86">CSV/TSV Processing Flow</text>
  <text class="subtitle" x="80" y="120">The self-implemented lexer powers sync Sequence reads, coroutine Flow reads, and writer paths with CSV/TSV settings applied at the boundary.</text>

  <g id="settings">
    <rect class="card" x="160" y="170" width="1440" height="96" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
    <text class="cardTitle" x="880" y="204" text-anchor="middle" dominant-baseline="middle">CsvSettings / TsvSettings</text>
    <text class="text" x="880" y="238" text-anchor="middle">delimiter, quote, CRLF/LF, trimValues, emptyValueAsNull, maxCharsPerColumn</text>
  </g>

  <g id="sync-lane">
    <rect class="lane" x="94" y="330" width="500" height="650" rx="8"/>
    <text class="laneTitle" x="130" y="376" dominant-baseline="middle">V1 sync read</text>

    <rect class="card" x="144" y="430" width="400" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <text class="cardTitleSmall" x="344" y="462" text-anchor="middle" dominant-baseline="middle">File / InputStream</text>
    <text class="textSmall" x="344" y="494" text-anchor="middle">caller charset; UTF-8 can use Okio fast path</text>

    <rect class="card" x="144" y="596" width="400" height="106" rx="8" fill="#FFFFFF" stroke="#0D9488"/>
    <text class="cardTitleSmall" x="344" y="628" text-anchor="middle" dominant-baseline="middle">Csv/TsvRecordReader</text>
    <text class="textSmall" x="344" y="660" text-anchor="middle">lazy Sequence builder</text>
    <text class="textSmall" x="344" y="684" text-anchor="middle">skipHeaders stores HeaderIndex</text>

    <rect class="card" x="144" y="776" width="400" height="106" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <text class="cardTitleSmall" x="344" y="808" text-anchor="middle" dominant-baseline="middle">CsvLexer / TsvLexer</text>
    <text class="textSmall" x="344" y="840" text-anchor="middle">RFC 4180 state machine</text>
    <text class="textSmall" x="344" y="864" text-anchor="middle">ArrayRecord per parsed row</text>

    <path class="flow" d="M 344 522 L 344 596" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
    <path class="flow" d="M 344 702 L 344 776" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
  </g>

  <g id="flow-lane">
    <rect class="lane" x="630" y="330" width="500" height="650" rx="8"/>
    <text class="laneTitle" x="666" y="376" dominant-baseline="middle">Coroutine and V2 read</text>

    <rect class="card" x="680" y="430" width="400" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="cardTitleSmall" x="880" y="462" text-anchor="middle" dominant-baseline="middle">InputStream / Path</text>
    <text class="textSmall" x="880" y="494" text-anchor="middle">Suspend reader or FlowCsvReader</text>

    <rect class="card" x="680" y="596" width="400" height="106" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
    <text class="cardTitleSmall" x="880" y="628" text-anchor="middle" dominant-baseline="middle">channelFlow on Dispatchers.IO</text>
    <text class="textSmall" x="880" y="660" text-anchor="middle">ensureActive before each row</text>
    <text class="textSmall" x="880" y="684" text-anchor="middle">collector sees parser exceptions</text>

    <rect class="card" x="680" y="776" width="400" height="106" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
    <text class="cardTitleSmall" x="880" y="808" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt; / Flow&lt;CsvRow&gt;</text>
    <text class="textSmall" x="880" y="840" text-anchor="middle">records emitted in order</text>
    <text class="textSmall" x="880" y="864" text-anchor="middle">V2 converts Record to CsvRow</text>

    <path class="flow" d="M 880 522 L 880 596" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
    <path class="flow" d="M 880 702 L 880 776" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
  </g>

  <g id="write-lane">
    <rect class="lane" x="1166" y="330" width="500" height="650" rx="8"/>
    <text class="laneTitle" x="1202" y="376" dominant-baseline="middle">Writer output</text>

    <rect class="card" x="1216" y="430" width="400" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="cardTitleSmall" x="1416" y="462" text-anchor="middle" dominant-baseline="middle">Rows or Flow&lt;Iterable&lt;*&gt;&gt;</text>
    <text class="textSmall" x="1416" y="494" text-anchor="middle">headers plus transformed row values</text>

    <rect class="card" x="1216" y="596" width="400" height="106" rx="8" fill="#FFFFFF" stroke="#EA580C"/>
    <text class="cardTitleSmall" x="1416" y="628" text-anchor="middle" dominant-baseline="middle">RecordWriter family</text>
    <text class="textSmall" x="1416" y="660" text-anchor="middle">Csv/TsvRecordWriter</text>
    <text class="textSmall" x="1416" y="684" text-anchor="middle">Suspend writer and FlowCsvWriter</text>

    <rect class="card" x="1216" y="776" width="400" height="106" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
    <text class="cardTitleSmall" x="1416" y="808" text-anchor="middle" dominant-baseline="middle">DelimitedWriter engine</text>
    <text class="textSmall" x="1416" y="840" text-anchor="middle">quote, escape, line separator rules</text>
    <text class="textSmall" x="1416" y="864" text-anchor="middle">UTF-8 file path uses OkioDelimitedWriter</text>

    <path class="flow" d="M 1416 522 L 1416 596" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
    <path class="flow" d="M 1416 702 L 1416 776" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
  </g>

  <g id="footer">
    <rect class="card" x="170" y="1034" width="1420" height="74" rx="8" fill="#F8FAFC" stroke="#64748B"/>
    <text class="cardTitleSmall" x="388" y="1071" text-anchor="middle" dominant-baseline="middle">Value semantics</text>
    <text class="text" x="930" y="1071" text-anchor="middle">null writes as an unquoted empty field; empty string writes as a quoted field and reads back as an empty string.</text>
  </g>
</svg>
