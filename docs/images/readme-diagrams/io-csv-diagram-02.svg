<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1500" viewBox="0 0 2240 1500" role="img" aria-label="CSV TSV processing flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="flowArrowTeal" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#0F9B93" stroke="#0F9B93" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="flowArrowBlue" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="flowArrowOrange" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
</defs>
<style>
  svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
  .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D5E0EA;stroke-width:3;filter:url(#shadow)}
  .title{font-family:"Architects Daughter";font-size:54px;font-weight:700;fill:#172033}
  .subtitle{font-family:"Comic Mono";font-size:18px;font-weight:700;fill:#526174}
  .settings rect,.semantics rect{filter:url(#shadow);stroke-width:3}
  .settings rect{fill:#F5ECFF;stroke:#9B3FFF}.semantics rect{fill:#F8FAFC;stroke:#64748B}
  .settingsTitle,.semanticsTitle{font-family:"Architects Daughter";font-size:31px;font-weight:700;fill:#172033}
  .settingsBody,.semanticsBody{font-family:"Comic Mono";font-size:15.5px;font-weight:700;fill:#526174}
  .lane rect{fill:#FFFFFF;stroke:#D1DBE8;stroke-width:2.5;filter:url(#shadow)}
  .laneTitle{font-family:"Architects Daughter";font-size:34px;font-weight:700;fill:#172033}
  .card rect{filter:url(#shadow);stroke-width:3;fill:#FFFFFF}
  .teal rect{fill:#E8FAF8;stroke:#0F9B93}.blue rect{fill:#EAF3FF;stroke:#2563EB}
  .orange rect{fill:#FFF0E4;stroke:#F05A1A}.green rect{fill:#EAF9F0;stroke:#21A366}
  .gray rect{fill:#F4F6F8;stroke:#64748B}.purple rect{fill:#F3EAFF;stroke:#8B5CF6}
  .cardTitle{font-family:"Architects Daughter";font-size:29px;font-weight:700;fill:#172033}
  .body{font-family:"Comic Mono";font-size:15px;font-weight:700;fill:#526174}
  .divider{stroke:#CBD5E1;stroke-width:1.5}
  .arrow{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .tealLine{stroke:#0F9B93}.blueLine{stroke:#2563EB}.orangeLine{stroke:#EA580C}
  .labelBg{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4;opacity:.96}
  .edgeLabel{font-family:"Comic Mono";font-size:14px;font-weight:700;fill:#526174}
</style>
<rect class="canvas" width="2240" height="1500"/>
<rect class="frame" x="38" y="34" width="2164" height="1432" rx="22"/>
<text class="title" x="90" y="104">CSV/TSV Processing Flow</text>
<text class="subtitle" x="92" y="140">The self-implemented lexer powers V1 Sequence reads, coroutine Flow reads, V2 Flow DSL reads, and writer paths.</text>
<g class="settings">
<rect x="210" y="202" width="1820" height="126" rx="14"/>
<text class="settingsTitle" x="1120" y="255" text-anchor="middle">CsvSettings / TsvSettings</text>
<text class="settingsBody" x="1120" y="294" text-anchor="middle">delimiter, quote, CR/LF, trimValues, null policy, BOM detection, max column and field limits</text>
</g>
<g id="lane-v1" class="lane">
<rect x="120" y="408" width="620" height="820" rx="16"/>
<text class="laneTitle" x="162" y="476">V1 sync read</text>
</g>
<g id="lane-flow" class="lane">
<rect x="810" y="408" width="620" height="820" rx="16"/>
<text class="laneTitle" x="852" y="476">Flow read paths</text>
</g>
<g id="lane-writer" class="lane">
<rect x="1500" y="408" width="620" height="820" rx="16"/>
<text class="laneTitle" x="1542" y="476">Writer output</text>
</g>
<g id="v1-input" class="card teal">
<rect x="184" y="530" width="492" height="132" rx="14"/>
<text class="cardTitle" x="430" y="576" text-anchor="middle">File / InputStream</text>
<line class="divider" x1="218" y1="598" x2="642" y2="598"/>
<text class="body" x="430" y="626" text-anchor="middle">caller charset; UTF-8 can use Okio</text>
</g>
<g id="v1-reader" class="card teal">
<rect x="184" y="710" width="492" height="154" rx="14"/>
<text class="cardTitle" x="430" y="756" text-anchor="middle">Csv/TsvRecordReader</text>
<line class="divider" x1="218" y1="778" x2="642" y2="778"/>
<text class="body" x="430" y="806" text-anchor="middle">returns lazy Sequence&lt;T&gt;</text>
<text class="body" x="430" y="831" text-anchor="middle">skipHeaders stores HeaderIndex</text>
</g>
<g id="v1-lexer" class="card teal">
<rect x="184" y="920" width="492" height="172" rx="14"/>
<text class="cardTitle" x="430" y="966" text-anchor="middle">CsvLexer / TsvLexer</text>
<line class="divider" x1="218" y1="988" x2="642" y2="988"/>
<text class="body" x="430" y="1016" text-anchor="middle">RFC 4180 state machine</text>
<text class="body" x="430" y="1041" text-anchor="middle">ArrayRecord per parsed row</text>
<text class="body" x="430" y="1066" text-anchor="middle">field and column limits</text>
</g>
<g id="flow-input" class="card blue">
<rect x="874" y="530" width="492" height="132" rx="14"/>
<text class="cardTitle" x="1120" y="576" text-anchor="middle">InputStream / Path</text>
<line class="divider" x1="908" y1="598" x2="1332" y2="598"/>
<text class="body" x="1120" y="626" text-anchor="middle">Suspend reader or FlowCsvReader</text>
</g>
<g id="flow-channel" class="card blue">
<rect x="874" y="710" width="492" height="154" rx="14"/>
<text class="cardTitle" x="1120" y="756" text-anchor="middle">channelFlow on Dispatchers.IO</text>
<line class="divider" x1="908" y1="778" x2="1332" y2="778"/>
<text class="body" x="1120" y="806" text-anchor="middle">ensureActive before each row</text>
<text class="body" x="1120" y="831" text-anchor="middle">collector sees parser exceptions</text>
</g>
<g id="flow-output" class="card blue">
<rect x="874" y="920" width="492" height="172" rx="14"/>
<text class="cardTitle" x="1120" y="966" text-anchor="middle">Flow&lt;T&gt; / Flow&lt;CsvRow&gt;</text>
<line class="divider" x1="908" y1="988" x2="1332" y2="988"/>
<text class="body" x="1120" y="1016" text-anchor="middle">records emitted in order</text>
<text class="body" x="1120" y="1041" text-anchor="middle">V2 converts Record to CsvRow</text>
<text class="body" x="1120" y="1066" text-anchor="middle">cold stream starts on collect</text>
</g>
<g id="writer-input" class="card orange">
<rect x="1564" y="530" width="492" height="132" rx="14"/>
<text class="cardTitle" x="1810" y="576" text-anchor="middle">Rows or Flow&lt;Iterable&lt;*&gt;&gt;</text>
<line class="divider" x1="1598" y1="598" x2="2022" y2="598"/>
<text class="body" x="1810" y="626" text-anchor="middle">headers plus transformed row values</text>
</g>
<g id="writer-family" class="card orange">
<rect x="1564" y="710" width="492" height="154" rx="14"/>
<text class="cardTitle" x="1810" y="756" text-anchor="middle">RecordWriter family</text>
<line class="divider" x1="1598" y1="778" x2="2022" y2="778"/>
<text class="body" x="1810" y="806" text-anchor="middle">Csv/TsvRecordWriter</text>
<text class="body" x="1810" y="831" text-anchor="middle">Suspend writer and FlowCsvWriter</text>
</g>
<g id="writer-engine" class="card orange">
<rect x="1564" y="920" width="492" height="172" rx="14"/>
<text class="cardTitle" x="1810" y="966" text-anchor="middle">DelimitedWriter engine</text>
<line class="divider" x1="1598" y1="988" x2="2022" y2="988"/>
<text class="body" x="1810" y="1016" text-anchor="middle">quote, escape, line separator rules</text>
<text class="body" x="1810" y="1041" text-anchor="middle">null is an unquoted empty field</text>
<text class="body" x="1810" y="1066" text-anchor="middle">UTF-8 file path uses OkioDelimitedWriter</text>
</g>
<path id="v1-a" class="arrow tealLine" d="M 430 662 L 430 710" marker-end="url(#flowArrowTeal)"/>
<path id="v1-b" class="arrow tealLine" d="M 430 864 L 430 920" marker-end="url(#flowArrowTeal)"/>
<path id="flow-a" class="arrow blueLine" d="M 1120 662 L 1120 710" marker-end="url(#flowArrowBlue)"/>
<path id="flow-b" class="arrow blueLine" d="M 1120 864 L 1120 920" marker-end="url(#flowArrowBlue)"/>
<path id="writer-a" class="arrow orangeLine" d="M 1810 662 L 1810 710" marker-end="url(#flowArrowOrange)"/>
<path id="writer-b" class="arrow orangeLine" d="M 1810 864 L 1810 920" marker-end="url(#flowArrowOrange)"/>
<g class="semantics">
<rect x="220" y="1288" width="1800" height="88" rx="12"/>
<text class="semanticsTitle" x="400" y="1342" text-anchor="middle">Value semantics</text>
<text class="semanticsBody" x="1160" y="1343" text-anchor="middle">null writes as an unquoted empty field; empty string writes quoted and reads back as an empty string.</text>
</g>
</svg>
