<svg xmlns="http://www.w3.org/2000/svg" width="1647" height="933" viewBox="0 0 1647 933" role="img" aria-label="Jwt Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1647" height="933"/>
<rect class="frame" x="32" y="28" width="1583" height="877" rx="30"/>
<text class="title" x="68" y="84">Jwt Class Structure 2</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="RedisKeyChainRepository" data-to="KeyChainRepository" data-route-color="green" d="M1231 631 L1231 581 L1196 581 L1196 530" stroke="#3E9868"/>
<path class="inherit" data-from="InMemoryKeyChainRepository" data-to="KeyChainRepository" data-route-color="blue" d="M1068 631 L1068 530" stroke="#4F83BF"/>
<path class="dependency" data-from="JwtReader" data-to="KeyChain" data-route-color="pink" d="M550 530 L550 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="JwtComposer" data-to="KeyChain" data-route-color="purple" d="M416 530 L416 631" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="JwtProvider" data-to="KeyChainRepository" data-route-color="olive" d="M848 267 L873 267 L873 428 L898 428" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="JwtProvider" data-to="JwtReader" data-route-color="indigo" d="M678 297 L678 398" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="JwtProvider" data-to="JwtComposer" data-route-color="coral" d="M508 267 L483 267 L483 428 L458 428" stroke="#C8644B" stroke-dasharray="8 7"/>
<g id="JwtComposer">
  <rect class="classCard" x="118" y="398" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="288" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="445" text-anchor="middle">JwtComposer</text>
  <line x1="118" y1="454" x2="458" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="136" y="479">+header(name, value) JwtComposer</text>
<text class="member" x="136" y="496">+claim(name, value) JwtComposer</text>
<text class="member" x="136" y="513">+issuer(iss) JwtComposer</text>
</g>
<g id="JwtProvider">
  <rect class="classCard" x="508" y="165" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="678" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="212" text-anchor="middle">JwtProvider</text>
  <line x1="508" y1="221" x2="848" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="526" y="246">+composer() JwtComposer</text>
<text class="member" x="526" y="263">+parse(jwt) JwtReader</text>
<text class="member" x="526" y="280">+rotate()</text>
</g>
<g id="KeyChainRepository">
  <rect class="classCard" x="898" y="398" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1068" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="445" text-anchor="middle">KeyChainRepository</text>
  <line x1="898" y1="454" x2="1238" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="916" y="479">+current() KeyChain</text>
<text class="member" x="916" y="496">+findOrNull(kid) KeyChain?</text>
<text class="member" x="916" y="513">+rotate(newKeyChain) Boolean</text>
</g>
<g id="JwtReader">
  <rect class="classCard" x="508" y="398" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="678" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="445" text-anchor="middle">JwtReader</text>
  <line x1="508" y1="454" x2="848" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="526" y="479">+kid: String</text>
<text class="member" x="526" y="496">+issuer: String</text>
<text class="member" x="526" y="513">+subject: String</text>
</g>
<g id="KeyChain">
  <rect class="classCard" x="313" y="631" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="483" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="483" y="678" text-anchor="middle">KeyChain</text>
  <line x1="313" y1="687" x2="653" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="331" y="712">+id: String</text>
<text class="member" x="331" y="729">+algorithm: SignatureAlgorithm</text>
<text class="member" x="331" y="746">+keyPair: KeyPair</text>
</g>
<g id="InMemoryKeyChainRepository">
  <rect class="classCard" x="799" y="631" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="969" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="969" y="669" text-anchor="middle">InMemoryKeyChain</text>
<text class="classTitle" x="969" y="691" text-anchor="middle">Repository</text>
  <line x1="799" y1="695" x2="1139" y2="695" stroke="#8A72D6" stroke-width="1.4"/>

</g>
<g id="RedisKeyChainRepository">
  <rect class="classCard" x="1189" y="631" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1359" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1359" y="678" text-anchor="middle">RedisKeyChainRepository</text>
  <line x1="1189" y1="687" x2="1529" y2="687" stroke="#8BA84D" stroke-width="1.4"/>

</g>
<g>
  <rect x="1232" y="825" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1250 843 L1308 843" stroke="#3E9868"/>
  <text class="detail" x="1322" y="848">inheritance / implementation</text>
  <path class="dependency" d="M1250 864 L1308 864" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1322" y="869">dependency / usage</text>
</g>
<g><rect x="180" y="843" width="1007" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="683.5" y="869" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
