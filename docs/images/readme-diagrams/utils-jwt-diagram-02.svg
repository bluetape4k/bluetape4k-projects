  <text class="member" x="335" y="958">+header(name, value) JwtComposer</text>
<text class="member" x="335" y="975">+claim(name, value) JwtComposer</text>
<text class="member" x="335" y="992">+issuer(iss) JwtComposer</text>
</g>
