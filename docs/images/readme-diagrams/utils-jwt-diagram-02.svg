<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1280" viewBox="0 0 1754 1280" role="img" aria-label="jwt Class Structure 2">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1280"/>
<rect class="frame" x="32" y="28" width="1690" height="1224" rx="28"/>
<text class="title" x="66" y="82">jwt Class Structure 2</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="inheritLine" d="M1082 932 L1082 376"/>
<path class="inheritLine" d="M672 932 L672 465 L1082 465 L1082 376"/>
<path class="line" d="M1492 418 L1492 497 L877 497 L877 544"/>
<path class="line" d="M262 418 L262 489 L877 489 L877 544"/>
<path class="line" d="M672 376 L672 122 L1082 122 L1082 180"/>
<path class="line" d="M672 376 L672 132 L1492 132 L1492 180"/>
<path class="line" d="M672 376 L672 465 L262 465 L262 180"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">JwtComposer</text>
  <text class="mono" x="18" y="108">+header(name, value) JwtComposer</text>
<text class="mono" x="18" y="129">+claim(name, value) JwtComposer</text>
<text class="mono" x="18" y="150">+issuer(iss) JwtComposer</text>
<text class="mono" x="18" y="171">+subject(sub) JwtComposer</text>
<text class="mono" x="18" y="192">+expirationAfterMinutes(min) JwtComposer</text>
<text class="mono" x="18" y="213">+setCompressionAlgorithm(alg) JwtComposer</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">JwtProvider</text>
  <text class="mono" x="18" y="108">+composer() JwtComposer</text>
<text class="mono" x="18" y="129">+parse(jwt) JwtReader</text>
<text class="mono" x="18" y="150">+rotate()</text>
<text class="mono" x="18" y="171">+forcedRotate()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">KeyChainRepository</text>
  <text class="mono" x="18" y="108">+current() KeyChain</text>
<text class="mono" x="18" y="129">+findOrNull(kid) KeyChain?</text>
<text class="mono" x="18" y="150">+rotate(newKeyChain) Boolean</text>
<text class="mono" x="18" y="171">+forcedRotate(newKeyChain) Boolean</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">JwtReader</text>
  <text class="mono" x="18" y="108">+kid: String</text>
<text class="mono" x="18" y="129">+issuer: String</text>
<text class="mono" x="18" y="150">+subject: String</text>
<text class="mono" x="18" y="171">+expiration: Date</text>
<text class="mono" x="18" y="192">+isExpired: Boolean</text>
<text class="mono" x="18" y="213">+expiredTtl: Long</text>
</g>
<g transform="translate(707,544)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">KeyChain</text>
  <text class="mono" x="18" y="108">+id: String</text>
<text class="mono" x="18" y="129">+algorithm: SignatureAlgorithm</text>
<text class="mono" x="18" y="150">+keyPair: KeyPair</text>
<text class="mono" x="18" y="171">+createdAt: Long</text>
<text class="mono" x="18" y="192">+expiredTtl: Long</text>
<text class="mono" x="18" y="213">+isExpired: Boolean</text>
</g>
<g transform="translate(502,932)">
  <rect class="card" x="0" y="0" width="340" height="128" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="56.5" text-anchor="middle">In Memory Key Chain</text>
<text class="label" x="170" y="81.5" text-anchor="middle">Repository</text>

</g>
<g transform="translate(912,932)">
  <rect class="card" x="0" y="0" width="340" height="112" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="61" text-anchor="middle">RedisKeyChainRepository</text>

</g>
</svg>
