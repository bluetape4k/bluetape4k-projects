<svg data-intent="Replace the unclear dependency structure with Vert.x module capability architecture: coroutine dispatcher helpers, Future resilience decorators, routing helpers, and SQL/MyBatis support around Vert.x core types." data-evidence="io/vertx/README.md; io/vertx/src/main/kotlin/io/bluetape4k/vertx/CoroutineSupport.kt; io/vertx/src/main/kotlin/io/bluetape4k/vertx/VertxSupport.kt; io/vertx/src/main/kotlin/io/bluetape4k/vertx/resilience4j; io/vertx/src/main/kotlin/io/bluetape4k/vertx/sqlclient" data-source-read="io/vertx/README.md; io/vertx/src/main/kotlin/io/bluetape4k/vertx/CoroutineSupport.kt; io/vertx/src/main/kotlin/io/bluetape4k/vertx/VertxSupport.kt; io/vertx/src/main/kotlin/io/bluetape4k/vertx/resilience4j; io/vertx/src/main/kotlin/io/bluetape4k/vertx/sqlclient" xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-label="Vert.x Module Capability Architecture">
