<svg xmlns="http://www.w3.org/2000/svg" width="1783" height="947" viewBox="0 0 1783 947" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1783" height="947"/>
<rect class="frame" x="32" y="28" width="1719" height="891" rx="30"/>
<text class="title" x="68" y="84">Core Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="ObservationRegistry" data-to="MeterRegistry" data-route-color="teal" d="M788 544 L788 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Cache2kCacheMetrics" data-to="MeterRegistry" data-route-color="amber" d="M430 544 L430 663 L707 663" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="MicrometerRetrofitMetricsFactory" data-to="MeterRegistry" data-route-color="pink" d="M992 554 L992 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ObservationExtensions" data-to="ObservationRegistry" data-route-color="purple" d="M688 311 L688 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="TimerExtensions" data-to="MeterRegistry" data-route-color="olive" d="M1353 536 L1353 663 L1067 663" stroke="#718A35" stroke-dasharray="8 7"/>
<g id="Cache2kCacheMetrics">
  <rect class="classCard" x="118" y="398" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="298" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="445" text-anchor="middle">Cache2kCacheMetrics</text>
  <line x1="118" y1="454" x2="478" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="486">-cache: Cache</text>
<text class="member" x="152" y="503">-tags: Tags</text>
<text class="member" x="152" y="520">+monitor(registry, cache, tags)</text>
</g>
<g id="MeterRegistry">
  <rect class="classCard" x="707" y="631" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="887" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="887" y="678" text-anchor="middle">MeterRegistry</text>
  <line x1="707" y1="687" x2="1067" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="741" y="719">+timer(name, tags) Timer</text>
<text class="member" x="741" y="736">+counter(name, tags) Counter</text>
<text class="member" x="741" y="753">+gauge(name, tags, number) T</text>
</g>
<g id="ObservationRegistry">
  <rect class="classCard" x="508" y="398" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">ObservationRegistry</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="542" y="486">+observationConfig()</text>
<text class="member" x="542" y="503">ObservationConfig</text>
<text class="member" x="542" y="520">+getCurrentObservation()</text>
</g>
<g id="MicrometerRetrofitMetricsFactory">
  <rect class="classCard" x="906" y="398" width="380" height="156" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1096" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1096" y="436" text-anchor="middle">MicrometerRetrofitMetrics</text>
<text class="classTitle" x="1096" y="458" text-anchor="middle">Factory</text>
  <line x1="906" y1="462" x2="1286" y2="462" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="940" y="495">-registry: MeterRegistry</text>
<text class="member" x="940" y="512">+create(returnType, annotations,</text>
<text class="member" x="940" y="529">retrofit)</text>
</g>
<g id="ObservationExtensions">
  <rect class="classCard" x="508" y="165" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="688" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="212" text-anchor="middle">ObservationExtensions</text>
  <line x1="508" y1="221" x2="868" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="542" y="253">+withObservation(name, registry,</text>
<text class="member" x="542" y="270">block) T</text>
<text class="member" x="542" y="287">+withObservationContext(obs,</text>
</g>
<g id="TimerExtensions">
  <rect class="classCard" x="1305" y="398" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1485" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1485" y="445" text-anchor="middle">TimerExtensions</text>
  <line x1="1305" y1="454" x2="1665" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1339" y="491">+recordSuspend(block) T</text>
<text class="member" x="1339" y="508">+withTimer(timer) Flow~T~</text>
</g>
<g>
  <rect x="1368" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1386 857 L1444 857" stroke="#3E9868"/>
  <text class="detail" x="1458" y="862">inheritance / implementation</text>
  <path class="dependency" d="M1386 878 L1444 878" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1458" y="883">dependency / usage</text>
</g>
<g><rect x="180" y="857" width="1143" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="751.5" y="883" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
