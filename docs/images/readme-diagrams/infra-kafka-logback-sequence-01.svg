<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="2040" viewBox="0 0 1980 2040" role="img" aria-labelledby="title desc">
<title id="title">kafka logback append sequence</title>
<desc id="desc">KafkaAppender drains deferred Kafka client logs, encodes normal events, builds a Kafka record, sends asynchronously through KafkaExporter, and routes failures to fallback appenders.</desc>
