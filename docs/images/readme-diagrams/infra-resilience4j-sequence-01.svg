<svg xmlns="http://www.w3.org/2000/svg" width="1924" height="2098" viewBox="0 0 1924 2098" role="img" aria-label="CircuitBreaker + Retry Combination Sequence Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1924" height="2098"/>
<rect class="frame" x="32" y="28" width="1860" height="2042" rx="28"/>
<text class="title" x="66" y="82">CircuitBreaker + Retry Combination Sequence Diagram</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="264" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="212" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="212" y1="252" x2="212" y2="2038" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="455" y="166" width="264" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="587" y="209" text-anchor="middle">SuspendDecorators</text>
<line class="lifeline" x1="587" y1="252" x2="587" y2="2038" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="264" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="962" y="209" text-anchor="middle">Retry</text>
<line class="lifeline" x1="962" y1="252" x2="962" y2="2038" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1205" y="166" width="264" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1337" y="209" text-anchor="middle">CircuitBreaker</text>
<line class="lifeline" x1="1337" y1="252" x2="1337" y2="2038" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1580" y="166" width="264" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1712" y="209" text-anchor="middle">Service</text>
<line class="lifeline" x1="1712" y1="252" x2="1712" y2="2038" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="180" y="286" width="439" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="198" y="313" text-anchor="start">1. ofSupplier { service.call()</text>
<text class="strong" x="198" y="335" text-anchor="start">}.withCircuitBreaker(cb).withRetry(retry).invoke()</text>
<path class="line" d="M212 366 L587 366"/>
<rect x="142" y="418" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="445" text-anchor="start">LOOP: Retry (up to maxAttempts)</text>
<rect x="843" y="942" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="861" y="969" text-anchor="start">3. executeSuspendFunction</text>
<path class="line" d="M587 988 L1337 988"/>
<rect x="1419.5" y="1018" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1045" text-anchor="start">4. call()</text>
<path class="line" d="M1337 1064 L1712 1064"/>
<rect x="142" y="706" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="733" text-anchor="start">ALT: Success</text>
<rect x="1419.5" y="1094" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1121" text-anchor="start">6. result</text>
<path class="dashed" d="M1712 1140 L1337 1140"/>
<rect x="831" y="1170" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="849" y="1197" text-anchor="start">7. result (success recorded)</text>
<path class="dashed" d="M1337 1216 L587 1216"/>
<rect x="294.5" y="1246" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="312.5" y="1273" text-anchor="start">8. result</text>
<path class="dashed" d="M587 1292 L212 1292"/>
<rect x="142" y="1104" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="1131" text-anchor="start">ELSE: Failure (below failure rate threshold)</text>
<rect x="1419.5" y="1322" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1349" text-anchor="start">10. Exception</text>
<path class="dashed" d="M1712 1368 L1337 1368"/>
<rect x="1002.5" y="1398" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1020.5" y="1425" text-anchor="start">11. Exception (failure recorded)</text>
<path class="dashed" d="M1337 1444 L962 1444"/>
<rect x="867" y="1474" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="885" y="1501" text-anchor="start">12. Wait waitDuration and retry</text>
<path class="line" d="M962 1520 C1026 1520 1026 1554 962 1554"/>
<rect x="142" y="1522" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="1549" text-anchor="start">ELSE: Failure rate threshold exceeded</text>
<rect x="827" y="1550" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="845" y="1577" text-anchor="start">14. CallNotPermittedException</text>
<path class="dashed" d="M1337 1596 L587 1596"/>
<rect x="264.5" y="1626" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="282.5" y="1653" text-anchor="start">15. CallNotPermittedException</text>
<path class="dashed" d="M587 1672 L212 1672"/>
<rect x="669.5" y="1702" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="687.5" y="1729" text-anchor="start">16. Next call (probe)</text>
<path class="line" d="M212 1748 L1337 1748"/>
<rect x="1419.5" y="1778" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1805" text-anchor="start">17. call()</text>
<path class="line" d="M1337 1824 L1712 1824"/>
<rect x="142" y="2030" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="2057" text-anchor="start">ALT: Probe success</text>
<rect x="1419.5" y="1854" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1881" text-anchor="start">19. result</text>
<path class="dashed" d="M1712 1900 L1337 1900"/>
<rect x="142" y="2208" width="1640" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="164" y="2235" text-anchor="start">ELSE: Probe failure</text>
<rect x="1419.5" y="1930" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1437.5" y="1957" text-anchor="start">21. Exception</text>
<path class="dashed" d="M1712 1976 L1337 1976"/>
</svg>
