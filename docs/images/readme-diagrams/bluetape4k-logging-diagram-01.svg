<svg xmlns="http://www.w3.org/2000/svg" width="2311" height="1548" viewBox="0 0 2311 1548" role="img" aria-label="Class Hierarchy Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="11" markerHeight="10" refX="10.2" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1.2 1 L 10.2 5 L 1.2 9 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="2311" height="1548"/>
<rect class="frame" x="32" y="28" width="2247" height="1492" rx="30"/>
<text class="title" x="68" y="84">Class Hierarchy Diagram</text>
<text class="subtitle" x="72" y="116">Graphviz-ranked class model: source relationships redrawn with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="Logger" data-to="CoroutineMDC" d="M962 1009 L962 1103 L952 1103 L952 1196" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Logger" data-to="MDC" d="M1218 1009 L1218 1103 L1229 1103 L1229 1196" stroke="#3E9868" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLogging" data-to="KLoggerFactory" d="M1696 372 L1696 465 L615 465 L615 558" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggerFactory" data-to="Logger" d="M657 660 L789 660 L789 907 L920 907" stroke="#4F83BF" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KotlinLogging" data-to="Logger" d="M1163 690 L1163 877" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="Logger" d="M1696 690 L1696 784 L1218 784 L1218 877" stroke="#758297" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="LogEvent" d="M1824 690 L1824 877" stroke="#758297" stroke-dasharray="8 7"/>
<path class="inherit" data-from="KLoggingChannel" data-to="KLogging" d="M1824 558 L1824 372" stroke="#758297"/>
<path class="dependency" data-from="KLogging" data-to="Logger" d="M1654 342 L1510 342 L1510 907 L1260 907" stroke="#2E8F89" stroke-dasharray="8 7"/>
<g id="KLoggerFactory">
  <rect class="classCard" x="317" y="558" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="487" y="577" text-anchor="middle">internalObject</text>
  <text class="classTitle" x="487" y="605" text-anchor="middle">KLoggerFactory</text>
  <line x1="317" y1="614" x2="657" y2="614" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="335" y="648">+logger(clazz: Class~*~) Logger</text>
<text class="member" x="335" y="665">+logger(name: String) Logger</text>
</g>
<g id="Logger">
  <rect class="classCard" x="920" y="877" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1090" y="896" text-anchor="middle">interface_SLF4J</text>
  <text class="classTitle" x="1090" y="924" text-anchor="middle">Logger</text>
  <line x1="920" y1="933" x2="1260" y2="933" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="938" y="958">+isTraceEnabled: Boolean</text>
<text class="member" x="938" y="975">+isDebugEnabled: Boolean</text>
<text class="member" x="938" y="992">+trace(msg: () -&gt; Any?)</text>
</g>
<g id="KLogging">
  <rect class="classCard" x="1654" y="240" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1824" y="259" text-anchor="middle">openClass</text>
  <text class="classTitle" x="1824" y="287" text-anchor="middle">KLogging</text>
  <line x1="1654" y1="296" x2="1994" y2="296" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1672" y="338">+log: Logger (lazy)</text>
</g>
<g id="CoroutineMDC">
  <rect class="classCard" x="654" y="1196" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="824" y="1215" text-anchor="middle">utility</text>
  <text class="classTitle" x="824" y="1243" text-anchor="middle">CoroutineMDC</text>
  <line x1="654" y1="1252" x2="994" y2="1252" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="672" y="1277">+withCoroutineLoggingContext(vararg</text>
<text class="member" x="672" y="1294">pairs,</text>
<text class="member" x="672" y="1311">block)</text>
</g>
<g id="LogEvent">
  <rect class="classCard" x="1654" y="877" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1824" y="896" text-anchor="middle">dataClass_JvmRecord</text>
  <text class="classTitle" x="1824" y="924" text-anchor="middle">LogEvent</text>
  <line x1="1654" y1="933" x2="1994" y2="933" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1672" y="958">+level: Level</text>
<text class="member" x="1672" y="975">+msg: String?</text>
<text class="member" x="1672" y="992">+error: Throwable?</text>
</g>
<g id="KotlinLogging">
  <rect class="classCard" x="1121" y="558" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1291" y="577" text-anchor="middle">object</text>
  <text class="classTitle" x="1291" y="605" text-anchor="middle">KotlinLogging</text>
  <line x1="1121" y1="614" x2="1461" y2="614" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1139" y="648">+logger(block: () -&gt; Unit) Logger</text>
<text class="member" x="1139" y="665">+logger(name: String) Logger</text>
</g>
<g id="MDC">
  <rect class="classCard" x="1187" y="1196" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1357" y="1215" text-anchor="middle">utility</text>
  <text class="classTitle" x="1357" y="1243" text-anchor="middle">MDC</text>
  <line x1="1187" y1="1252" x2="1527" y2="1252" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1205" y="1286">+withLoggingContext(vararg pairs,</text>
<text class="member" x="1205" y="1303">block)</text>
</g>
<g id="KLoggingChannel">
  <rect class="classCard" x="1654" y="558" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1824" y="577" text-anchor="middle">openClass</text>
  <text class="classTitle" x="1824" y="605" text-anchor="middle">KLoggingChannel</text>
  <line x1="1654" y1="614" x2="1994" y2="614" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1672" y="639">-sharedFlow:</text>
<text class="member" x="1672" y="656">MutableSharedFlow~LogEvent~</text>
<text class="member" x="1672" y="673">-scope: CoroutineScope</text>
</g>
<g>
  <rect x="1896" y="1440" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1914 1458 L1972 1458" stroke="#3E9868"/>
  <text class="detail" x="1986" y="1463">inheritance / implementation</text>
  <path class="dependency" d="M1914 1479 L1972 1479" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1986" y="1484">dependency / usage</text>
</g>
<g><rect x="180" y="1458" width="1671" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1015.5" y="1484" text-anchor="middle">Graphviz evidence: .dot, .plain, and -graphviz.svg define relationship order and route intent.</text></g>
</svg>
