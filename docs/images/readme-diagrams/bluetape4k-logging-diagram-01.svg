<svg xmlns="http://www.w3.org/2000/svg" width="1555" height="1167" viewBox="0 0 1555 1167" role="img" aria-label="Class Hierarchy Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1555" height="1167"/>
<rect class="frame" x="32" y="28" width="1491" height="1111" rx="30"/>
<text class="title" x="68" y="84">Class Hierarchy Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="Logger" data-to="CoroutineMDC" data-route-color="teal" d="M602 763 L602 865" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Logger" data-to="MDC" data-route-color="amber" d="M858 763 L858 865" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLogging" data-to="KLoggerFactory" data-route-color="pink" d="M1139 297 L1139 348 L416 348 L416 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggerFactory" data-to="Logger" data-route-color="purple" d="M458 500 L509 500 L509 661 L560 661" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KotlinLogging" data-to="Logger" data-route-color="olive" d="M749 530 L749 631" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="Logger" data-route-color="indigo" d="M1139 530 L1139 581 L858 581 L858 631" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="LogEvent" data-route-color="coral" d="M1267 530 L1267 631" stroke="#C8644B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="KLoggingChannel" data-to="KLogging" data-route-color="indigo" d="M1267 398 L1267 297" stroke="#4F63C7"/>
<path class="dependency" data-from="KLogging" data-to="Logger" data-route-color="cyan" d="M1097 231 L520 231 L520 580 L730 580 L730 631" stroke="#2E83B8" stroke-dasharray="8 7"/>
<g id="KLoggerFactory">
  <rect class="classCard" x="118" y="398" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="288" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="445" text-anchor="middle">KLoggerFactory</text>
  <line x1="118" y1="454" x2="458" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="136" y="488">+logger(clazz: Class~*~) Logger</text>
<text class="member" x="136" y="505">+logger(name: String) Logger</text>
</g>
<g id="Logger">
  <rect class="classCard" x="560" y="631" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="730" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="730" y="678" text-anchor="middle">Logger</text>
  <line x1="560" y1="687" x2="900" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="578" y="712">+isTraceEnabled: Boolean</text>
<text class="member" x="578" y="729">+isDebugEnabled: Boolean</text>
<text class="member" x="578" y="746">+trace(msg: () -&gt; Any?)</text>
</g>
<g id="KLogging">
  <rect class="classCard" x="1097" y="165" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1267" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1267" y="212" text-anchor="middle">KLogging</text>
  <line x1="1097" y1="221" x2="1437" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1115" y="263">+log: Logger (lazy)</text>
</g>
<g id="CoroutineMDC">
  <rect class="classCard" x="365" y="865" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="535" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="535" y="912" text-anchor="middle">CoroutineMDC</text>
  <line x1="365" y1="921" x2="705" y2="921" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="383" y="946">+withCoroutineLoggingContext(vararg</text>
<text class="member" x="383" y="963">pairs,</text>
<text class="member" x="383" y="980">block)</text>
</g>
<g id="LogEvent">
  <rect class="classCard" x="1097" y="631" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1267" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1267" y="678" text-anchor="middle">LogEvent</text>
  <line x1="1097" y1="687" x2="1437" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1115" y="712">+level: Level</text>
<text class="member" x="1115" y="729">+msg: String?</text>
<text class="member" x="1115" y="746">+error: Throwable?</text>
</g>
<g id="KotlinLogging">
  <rect class="classCard" x="707" y="398" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="877" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="877" y="445" text-anchor="middle">KotlinLogging</text>
  <line x1="707" y1="454" x2="1047" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="725" y="488">+logger(block: () -&gt; Unit) Logger</text>
<text class="member" x="725" y="505">+logger(name: String) Logger</text>
</g>
<g id="MDC">
  <rect class="classCard" x="755" y="865" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="925" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="925" y="912" text-anchor="middle">MDC</text>
  <line x1="755" y1="921" x2="1095" y2="921" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="773" y="955">+withLoggingContext(vararg pairs,</text>
<text class="member" x="773" y="972">block)</text>
</g>
<g id="KLoggingChannel">
  <rect class="classCard" x="1097" y="398" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1267" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1267" y="445" text-anchor="middle">KLoggingChannel</text>
  <line x1="1097" y1="454" x2="1437" y2="454" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1115" y="479">-sharedFlow:</text>
<text class="member" x="1115" y="496">MutableSharedFlow~LogEvent~</text>
<text class="member" x="1115" y="513">-scope: CoroutineScope</text>
</g>
<g>
  <rect x="1140" y="1059" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1158 1077 L1216 1077" stroke="#3E9868"/>
  <text class="detail" x="1230" y="1082">inheritance / implementation</text>
  <path class="dependency" d="M1158 1098 L1216 1098" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1230" y="1103">dependency / usage</text>
</g>
<g><rect x="180" y="1077" width="915" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="637.5" y="1103" text-anchor="middle">bluetape4k-projects class diagrams - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
