<svg xmlns="http://www.w3.org/2000/svg" width="1575" height="1181" viewBox="0 0 1575 1181" role="img" aria-label="Logging Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1575" height="1181"/>
<rect class="frame" x="32" y="28" width="1511" height="1125" rx="30"/>
<text class="title" x="68" y="84">Logging Class Structure</text>
<text class="subtitle" x="72" y="116">Logger factories, coroutine channel events, MDC helpers, and KotlinLogging adapters.</text>
<path class="dependency" data-from="Logger" data-to="CoroutineMDC" data-route-color="teal" d="M643 777 L643 865" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="Logger" data-to="MDC" data-route-color="amber" d="M838 777 L838 865" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLogging" data-to="KLoggerFactory" data-route-color="pink" d="M1097 219 L202 219 L202 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggerFactory" data-to="Logger" data-route-color="purple" d="M430 536 L430 663 L560 663" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KotlinLogging" data-to="Logger" data-route-color="olive" d="M720 536 L720 631" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="Logger" data-route-color="indigo" d="M1097 471 L900 471 L900 631" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="KLoggingChannel" data-to="LogEvent" data-route-color="coral" d="M1277 544 L1277 631" stroke="#C8644B" stroke-dasharray="8 7"/>
<path class="inherit" data-from="KLoggingChannel" data-to="KLogging" data-route-color="indigo" d="M1277 398 L1277 303" stroke="#4F63C7"/>
<path class="dependency" data-from="KLogging" data-to="Logger" data-route-color="cyan" d="M1097 287 L892 287 L892 631" stroke="#2E83B8" stroke-dasharray="8 7"/>
<g id="KLoggerFactory">
  <rect class="classCard" x="118" y="398" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="298" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="445" text-anchor="middle">KLoggerFactory</text>
  <line x1="118" y1="454" x2="478" y2="454" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="491">+logger(clazz: Class~*~) Logger</text>
<text class="member" x="152" y="508">+logger(name: String) Logger</text>
</g>
<g id="Logger">
  <rect class="classCard" x="560" y="631" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="740" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="740" y="678" text-anchor="middle">Logger</text>
  <line x1="560" y1="687" x2="920" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="594" y="719">+isTraceEnabled: Boolean</text>
<text class="member" x="594" y="736">+isDebugEnabled: Boolean</text>
<text class="member" x="594" y="753">+trace(msg: () -&gt; Any?)</text>
</g>
<g id="KLogging">
  <rect class="classCard" x="1097" y="165" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1277" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1277" y="212" text-anchor="middle">KLogging</text>
  <line x1="1097" y1="221" x2="1457" y2="221" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1131" y="266">+log: Logger (lazy)</text>
</g>
<g id="CoroutineMDC">
  <rect class="classCard" x="365" y="865" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="545" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="545" y="912" text-anchor="middle">CoroutineMDC</text>
  <line x1="365" y1="921" x2="725" y2="921" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="399" y="953">+withCoroutineLoggingContext(vararg</text>
<text class="member" x="399" y="970">pairs,</text>
<text class="member" x="399" y="987">block)</text>
</g>
<g id="LogEvent">
  <rect class="classCard" x="1097" y="631" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1277" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1277" y="678" text-anchor="middle">LogEvent</text>
  <line x1="1097" y1="687" x2="1457" y2="687" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1131" y="719">+level: Level</text>
<text class="member" x="1131" y="736">+msg: String?</text>
<text class="member" x="1131" y="753">+error: Throwable?</text>
</g>
<g id="KotlinLogging">
  <rect class="classCard" x="520" y="398" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="700" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="700" y="445" text-anchor="middle">KotlinLogging</text>
  <line x1="520" y1="454" x2="880" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="554" y="491">+logger(block: () -&gt; Unit) Logger</text>
<text class="member" x="554" y="508">+logger(name: String) Logger</text>
</g>
<g id="MDC">
  <rect class="classCard" x="755" y="865" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="935" y="884" text-anchor="middle">class</text>
  <text class="classTitle" x="935" y="912" text-anchor="middle">MDC</text>
  <line x1="755" y1="921" x2="1115" y2="921" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="789" y="958">+withLoggingContext(vararg pairs,</text>
<text class="member" x="789" y="975">block)</text>
</g>
<g id="KLoggingChannel">
  <rect class="classCard" x="1097" y="398" width="360" height="146" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1277" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1277" y="445" text-anchor="middle">KLoggingChannel</text>
  <line x1="1097" y1="454" x2="1457" y2="454" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="1131" y="486">-sharedFlow:</text>
<text class="member" x="1131" y="503">MutableSharedFlow~LogEvent~</text>
<text class="member" x="1131" y="520">-scope: CoroutineScope</text>
</g>
<g>
  <rect x="1160" y="1073" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1178 1091 L1236 1091" stroke="#3E9868"/>
  <text class="detail" x="1250" y="1096">inheritance / implementation</text>
  <path class="dependency" d="M1178 1112 L1236 1112" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1250" y="1117">dependency / usage</text>
</g>
<g><rect x="180" y="1091" width="935" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="647.5" y="1117" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
