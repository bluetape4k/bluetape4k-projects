<rect class="canvas" width="3000" height="1500"/>
<rect class="frame" x="34" y="30" width="2932" height="1440" rx="8"/>
<text class="title" x="72" y="88">Coordinate Transformation Flow</text>
<text class="subtitle" x="76" y="122">The projection package wraps Proj4J with typed WGS84/UTM helpers, UTM zone detection, southern-hemisphere handling, and a shared CRS cache.</text>
<g data-from="WgsInput" data-to="ZoneDetect">
  <path class="edge route" d="M655 382 L795 382" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="680" y="358">utmZoneOf(location)</text>
</g>
<g data-from="ZoneDetect" data-to="UtmCrs">
  <path class="edge route" d="M1195 382 L1335 382" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="1220" y="358">proj4 params</text>
</g>
<g data-from="UtmCrs" data-to="TransformForward">
  <path class="edge route" d="M1735 382 L1875 382" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="1760" y="358">cached CRS</text>
</g>
<g data-from="TransformForward" data-to="UtmOutput">
  <path class="edge route" d="M2275 382 L2415 382" stroke="#15803D" marker-end="url(#arrow-green)"/>
  <text class="edgeLabel" x="2300" y="358">dst.x / dst.y</text>
</g>
<g data-from="UtmInput" data-to="ReverseCrs">
  <path class="edge route" d="M655 792 L795 792" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="685" y="768">zone + south</text>
</g>
<g data-from="ReverseCrs" data-to="TransformReverse">
  <path class="edge route" d="M1195 792 L1335 792" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="1220" y="768">UTM -&gt; WGS84</text>
</g>
<g data-from="TransformReverse" data-to="WgsOutput">
  <path class="edge route" d="M1735 792 L1875 792" stroke="#1D4ED8" marker-end="url(#arrow-blue)"/>
  <text class="edgeLabel" x="1760" y="768">dst.y / dst.x</text>
</g>
<g data-from="ArbitraryInput" data-to="RegistryPair">
  <path class="edge route" d="M560 1168 L700 1168" stroke="#6D28D9" marker-end="url(#arrow-violet)"/>
  <text class="edgeLabel" x="575" y="1144">source + target EPSG</text>
</g>
<g data-from="RegistryPair" data-to="TransformAny">
  <path class="edge route" d="M1100 1168 L1240 1168" stroke="#6D28D9" marker-end="url(#arrow-violet)"/>
  <text class="edgeLabel" x="1125" y="1144">two CRS objects</text>
</g>
<g data-from="TransformAny" data-to="PairOutput">
  <path class="edge route" d="M1640 1168 L1780 1168" stroke="#6D28D9" marker-end="url(#arrow-violet)"/>
  <text class="edgeLabel" x="1665" y="1144">Pair(x, y)</text>
</g>
<text class="lane" x="187" y="242">WGS84 to UTM</text>
<g id="WgsInput">
  <rect class="card" x="235" y="297" width="420" height="170" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="257" y="327">input</text>
  <text class="cardTitle" x="257" y="361">GeoLocation</text>
  <path class="divider" d="M235 381H655" stroke="#15803D"/>
  <text class="body" x="257" y="413">latitude: -90..90</text>
<text class="body" x="257" y="437">longitude: -180..180</text>
<text class="body" x="257" y="461">source CRS is EPSG:4326</text>

</g>
<g id="ZoneDetect">
  <rect class="card" x="795" y="297" width="400" height="170" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="817" y="327">coords</text>
  <text class="cardTitle" x="817" y="361">UTM zone detection</text>
  <path class="divider" d="M795 381H1195" stroke="#15803D"/>
  <text class="body" x="817" y="413">longitude zone 1..60</text>
<text class="body" x="817" y="437">latitude band C..X</text>
<text class="body" x="817" y="461">I and O are excluded</text>

</g>
<g id="UtmCrs">
  <rect class="card" x="1335" y="297" width="400" height="205" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="kicker" x="1357" y="327">Projections.kt</text>
  <text class="cardTitle" x="1357" y="361">build UTM CRS</text>
  <path class="divider" d="M1335 381H1735" stroke="#15803D"/>
  <text class="body" x="1357" y="413">+proj=utm +zone=n</text>
<text class="body" x="1357" y="437">+datum=WGS84 +units=m</text>
<text class="body" x="1357" y="461">+south when band &lt; N</text>
  <path class="divider" d="M1335 458H1735" stroke="#15803D"/><text class="foot" x="1357" y="486">CrsRegistry.getCrsFromProj4()</text>
</g>
<g id="TransformForward">
  <rect class="card" x="1875" y="297" width="400" height="170" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1897" y="327">Proj4J</text>
  <text class="cardTitle" x="1897" y="361">BasicCoordinateTransform</text>
  <path class="divider" d="M1875 381H2275" stroke="#0F766E"/>
  <text class="body" x="1897" y="413">src = (longitude, latitude)</text>
<text class="body" x="1897" y="437">dst = UTM coordinate</text>
<text class="body" x="1897" y="461">transform(src, dst)</text>

</g>
<g id="UtmOutput">
  <rect class="card" x="2415" y="297" width="350" height="170" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="2437" y="327">output</text>
  <text class="cardTitle" x="2437" y="361">Pair(easting, northing)</text>
  <path class="divider" d="M2415 381H2765" stroke="#0F766E"/>
  <text class="body" x="2437" y="413">meters in UTM zone</text>
<text class="body" x="2437" y="437">returned by wgs84ToUtm()</text>

</g>
<text class="lane" x="187" y="652">UTM to WGS84</text>
<g id="UtmInput">
  <rect class="card" x="235" y="707" width="420" height="170" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="257" y="737">input</text>
  <text class="cardTitle" x="257" y="771">UTM coordinate + zone</text>
  <path class="divider" d="M235 791H655" stroke="#1D4ED8"/>
  <text class="body" x="257" y="823">easting, northing</text>
<text class="body" x="257" y="847">UtmZone(longitudeZone, band)</text>
<text class="body" x="257" y="871">validates zone and latitude band</text>

</g>
<g id="ReverseCrs">
  <rect class="card" x="795" y="707" width="400" height="205" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="817" y="737">Projections.kt</text>
  <text class="cardTitle" x="817" y="771">resolve source and target CRS</text>
  <path class="divider" d="M795 791H1195" stroke="#1D4ED8"/>
  <text class="body" x="817" y="823">UTM proj4 params</text>
<text class="body" x="817" y="847">WGS84 from EPSG:4326</text>
<text class="body" x="817" y="871">same +south rule</text>
  <path class="divider" d="M795 868H1195" stroke="#1D4ED8"/><text class="foot" x="817" y="896">CrsRegistry caches both</text>
</g>
<g id="TransformReverse">
  <rect class="card" x="1335" y="707" width="400" height="170" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="kicker" x="1357" y="737">Proj4J</text>
  <text class="cardTitle" x="1357" y="771">BasicCoordinateTransform</text>
  <path class="divider" d="M1335 791H1735" stroke="#1D4ED8"/>
  <text class="body" x="1357" y="823">src = (easting, northing)</text>
<text class="body" x="1357" y="847">dst = WGS84 coordinate</text>
<text class="body" x="1357" y="871">transform(src, dst)</text>

</g>
<g id="WgsOutput">
  <rect class="card" x="1875" y="707" width="400" height="170" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="kicker" x="1897" y="737">output</text>
  <text class="cardTitle" x="1897" y="771">GeoLocation</text>
  <path class="divider" d="M1875 791H2275" stroke="#0F766E"/>
  <text class="body" x="1897" y="823">latitude = dst.y</text>
<text class="body" x="1897" y="847">longitude = dst.x</text>
<text class="body" x="1897" y="871">returned by utmToWgs84()</text>

</g>
<text class="lane" x="187" y="1060">Arbitrary EPSG transform</text>
<g id="ArbitraryInput">
  <rect class="card" x="140" y="1083" width="420" height="170" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="162" y="1113">input</text>
  <text class="cardTitle" x="162" y="1147">EPSG source and target</text>
  <path class="divider" d="M140 1167H560" stroke="#6D28D9"/>
  <text class="body" x="162" y="1199">sourceCrs string</text>
<text class="body" x="162" y="1223">targetCrs string</text>
<text class="body" x="162" y="1247">lon and lat input values</text>

</g>
<g id="RegistryPair">
  <rect class="card" x="700" y="1083" width="400" height="170" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="722" y="1113">CrsRegistry</text>
  <text class="cardTitle" x="722" y="1147">getCrs(source) + getCrs(target)</text>
  <path class="divider" d="M700 1167H1100" stroke="#6D28D9"/>
  <text class="body" x="722" y="1199">CRSFactory.createFromName()</text>
<text class="body" x="722" y="1223">ConcurrentHashMap cache</text>
<text class="body" x="722" y="1247">internal Proj4J CRS objects</text>

</g>
<g id="TransformAny">
  <rect class="card" x="1240" y="1083" width="400" height="170" rx="8" fill="#F5F3FF" stroke="#7C3AED"/>
  <text class="kicker" x="1262" y="1113">Projections.kt</text>
  <text class="cardTitle" x="1262" y="1147">transform(source, target, lon, lat)</text>
  <path class="divider" d="M1240 1167H1640" stroke="#6D28D9"/>
  <text class="body" x="1262" y="1199">src coordinate = (lon, lat)</text>
<text class="body" x="1262" y="1223">dst coordinate from Proj4J</text>
<text class="body" x="1262" y="1247">returns target CRS coordinate pair</text>

</g>
<g id="PairOutput">
  <rect class="card" x="1780" y="1083" width="350" height="170" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="kicker" x="1802" y="1113">output</text>
  <text class="cardTitle" x="1802" y="1147">Pair(x, y)</text>
  <path class="divider" d="M1780 1167H2130" stroke="#BE185D"/>
  <text class="body" x="1802" y="1199">target CRS coordinates</text>
<text class="body" x="1802" y="1223">no domain wrapper added</text>

</g>
<g id="CrsRegistry">
  <rect class="card" x="2345" y="1072" width="520" height="200" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="kicker" x="2272" y="1070">shared implementation detail</text>
  <text class="cardTitle" x="2272" y="1104">CrsRegistry cache</text>
  <path class="divider" d="M2250 1124H2770" stroke="#475569"/>
  <text class="body" x="2272" y="1156">CRSFactory creates CoordinateReferenceSystem</text>
<text class="body" x="2272" y="1180">keys are EPSG codes or proj4 params</text>
<text class="body" x="2272" y="1204">clearCache() is available for tests</text>
  <path class="divider" d="M2250 1196H2770" stroke="#475569"/><text class="foot" x="2272" y="1224">Proj4J types stay internal</text>
</g>
</svg>
