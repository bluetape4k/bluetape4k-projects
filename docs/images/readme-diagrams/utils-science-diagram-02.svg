<svg data-allow-grid="true" data-intent="Explain the source-backed module behavior, public API relationships, runtime boundaries, and user-facing decisions represented by this diagram for maintainers and users." data-evidence="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science/coords/GeoLocation.kt; utils/science/src/main/kotlin/io/bluetape4k/science/coords/UtmZone.kt; utils/science/src/main/kotlin/io/bluetape4k/science/coords/UtmZoneSupport.kt; utils/science/src/main/kotlin/io/bluetape4k/science/projection/CrsRegistry.kt; utils/science/src/main/kotlin/io/bluetape4k/science/projection/Projections.kt" data-source-read="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science/coords/GeoLocation.kt; utils/science/src/main/kotlin/io/bluetape4k/science/coords/UtmZone.kt; utils/science/src/main/kotlin/io/bluetape4k/science/coords/UtmZoneSupport.kt; utils/science/src/main/kotlin/io/bluetape4k/science/projection/CrsRegistry.kt; utils/science/src/main/kotlin/io/bluetape4k/science/projection/Projections.kt" xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500" role="img" aria-label="Coordinate Transformation Flow">
