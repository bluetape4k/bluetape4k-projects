<svg xmlns="http://www.w3.org/2000/svg" width="1366" height="995" viewBox="0 0 1366 995" role="img" aria-label="NearCache Interface Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="5.5" markerHeight="5" refX="4.75" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.25 0.5 L 4.75 2.5 L 0.25 4.5 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono";font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1366" height="995"/>
<rect class="frame" x="32" y="28" width="1302" height="939" rx="28"/>
<text class="title" x="66" y="82">NearCache Interface Hierarchy</text>
<text class="subtitle" x="70" y="104">Source-checked class relationships with readable compartments and routed inheritance.</text>
<path class="implLine" d="M893 584 L893 509 L1103 509 L1103 434"/>
<path class="dashed" d="M683 180 L683 132 L263 132 L263 376"/>
<path class="implLine" d="M473 584 L473 493 L683 493 L683 418"/>
<g transform="translate(88,180)">
  <rect class="card" x="0" y="0" width="350" height="196" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="61" text-anchor="middle">NearCacheStatistics</text>
  <text class="mono" x="18" y="108">+localHits: Long</text>
<text class="mono" x="18" y="129">+localMisses: Long</text>
<text class="mono" x="18" y="150">+localSize: Long</text>
<text class="mono" x="18" y="171">+hitRate: Double</text>
</g>
<g transform="translate(508,180)">
  <rect class="card" x="0" y="0" width="350" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="350" y2="78" stroke="#58A978"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="61" text-anchor="middle">NearCacheOperations</text>
  <text class="mono" x="18" y="108">+cacheName: String</text>
<text class="mono" x="18" y="129">+isClosed: Boolean</text>
<text class="mono" x="18" y="150">+get(key: String) V?</text>
<text class="mono" x="18" y="171">+put(key: String, value: V)</text>
<text class="mono" x="18" y="192">+remove(key: String)</text>
<text class="mono" x="18" y="213">+clearLocal()</text>
</g>
<g transform="translate(928,180)">
  <rect class="card" x="0" y="0" width="350" height="254" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#D6A441"/>
  <text class="small" x="175" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="175" y="56.5" text-anchor="middle">Suspend Near Cache</text>
<text class="label" x="175" y="81.5" text-anchor="middle">Operations</text>
  <text class="mono" x="18" y="124">+cacheName: String</text>
<text class="mono" x="18" y="145">+isClosed: Boolean</text>
<text class="mono" x="18" y="166">+get(key: String) V?</text>
<text class="mono" x="18" y="187">+put(key: String, value: V)</text>
<text class="mono" x="18" y="208">+remove(key: String)</text>
<text class="mono" x="18" y="229">+clearLocal()</text>
</g>
<g transform="translate(298,584)">
  <rect class="card" x="0" y="0" width="350" height="191" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#DC6B82"/>
    <text class="label" x="175" y="44.5" text-anchor="middle">Resilient Near Cache</text>
<text class="label" x="175" y="69.5" text-anchor="middle">Decorator</text>
  <text class="mono" x="18" y="124">-delegate: NearCacheOperations~V~</text>
<text class="mono" x="18" y="145">-retry: Retry</text>
<text class="mono" x="18" y="166">-config: NearCacheResilienceConfig</text>
</g>
<g transform="translate(718,584)">
  <rect class="card" x="0" y="0" width="350" height="170" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="94" x2="350" y2="94" stroke="#45A7A1"/>
    <text class="label" x="175" y="44.5" text-anchor="middle">Resilient Suspend Near</text>
<text class="label" x="175" y="69.5" text-anchor="middle">Cache Decorator</text>
  <text class="mono" x="18" y="124">-delegate: SuspendNearCacheOperations~V~</text>
<text class="mono" x="18" y="145">-retry: Retry</text>
</g>
</svg>
