      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">NetCdfRepository</text>
    </g>
    <g id="node-services" transform="translate(1168,838)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Import services</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">ShapefileImportService</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">NetCdfCatalogService</text>
    </g>
  </g>
