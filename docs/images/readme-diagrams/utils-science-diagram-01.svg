      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">POI records</text>
    </g>
  </g>
  <g id="layer-persistence">
    <rect class="layer" x="115" y="814" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="147" y="857" dominant-baseline="middle">Persistence</text>
    <g id="node-tables" transform="translate(382,838)">
