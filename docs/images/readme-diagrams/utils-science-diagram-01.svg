<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1054" viewBox="0 0 1620 1054" role="img" aria-labelledby="title desc">
  <title id="title">Science utilities architecture</title>
  <desc id="desc">Layered module overview for utils/science showing coordinate types, projection registry, geometry helpers, shapefile and NetCDF models, Exposed tables, repositories, and services.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1620" height="1054"/>
  <rect class="frame" x="34" y="30" width="1552" height="994" rx="28"/>
  <text class="title" x="72" y="88">Science utilities architecture</text>
  <text class="subtitle" x="76" y="121">Coordinate models feed projections and geometry, then file readers and Exposed persistence services.</text>

  <!-- README_LAYER_BANDS:START -->
  <g id="layer-module-entrypoint">
    <rect class="layer" x="72" y="166" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="104" y="209" dominant-baseline="middle">Module entrypoint</text>
    <g id="node-science" transform="translate(628,190)">
      <rect class="card" x="0" y="0" width="520" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
      <text class="card-title" x="260" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-science</text>
      <text class="detail" x="260" y="43" text-anchor="middle" dominant-baseline="middle">geospatial coordinate</text>
      <text class="detail" x="260" y="62" text-anchor="middle" dominant-baseline="middle">file and persistence utilities</text>
    </g>
  </g>
  <g id="layer-coordinate-model">
    <rect class="layer" x="72" y="328" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="104" y="371" dominant-baseline="middle">Coordinate model</text>
    <g id="node-coords" transform="translate(346,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Coordinate types</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">GeoLocation, BoundingBox</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">DM, DMS, Vector</text>
    </g>
    <g id="node-utm" transform="translate(1218,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">UTM helpers</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">UtmZone</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">cell bounding boxes</text>
    </g>
  </g>
  <g id="layer-projection">
    <rect class="layer" x="72" y="490" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="104" y="533" dominant-baseline="middle">Projection</text>
    <g id="node-projection" transform="translate(346,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Projection registry</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">CrsRegistry</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">Projections</text>
    </g>
    <g id="node-geometry" transform="translate(1218,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Geometry operations</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">distance, angle, intersection</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">polygon extensions</text>
    </g>
  </g>
  <g id="layer-file-and-data-model">
    <rect class="layer" x="72" y="652" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="104" y="695" dominant-baseline="middle">File and data model</text>
    <g id="node-shapefile" transform="translate(346,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Shapefile reader</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">loadShape/loadShapeAsync</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">ShapeHeader and records</text>
    </g>
    <g id="node-netcdf-model" transform="translate(782,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EEF6D9" stroke="#8BA84D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">NetCDF models</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">file, variable, grid value</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">import progress</text>
    </g>
    <g id="node-spatial-model" transform="translate(1218,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Spatial models</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">layer and feature records</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">POI records</text>
    </g>
  </g>
  <g id="layer-persistence">
    <rect class="layer" x="72" y="814" width="1476" height="134" rx="18"/>
    <text class="layer-title" x="104" y="857" dominant-baseline="middle">Persistence</text>
    <g id="node-tables" transform="translate(346,838)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Exposed tables</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">SpatialTables</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">NetCdfTables</text>
    </g>
    <g id="node-repos" transform="translate(782,838)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Repositories</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">SpatialFeatureRepository</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">NetCdfRepository</text>
    </g>
    <g id="node-services" transform="translate(1218,838)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Import services</text>
      <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">ShapefileImportService</text>
      <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">NetCdfCatalogService</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->

  <g id="route-science-coords">
    <path class="connector" d="M662 276 L662 304 L612 304 L612 352" stroke="#58A978"/>
  </g>
  <g id="route-science-utm">
    <path class="connector" d="M1114 276 L1114 314 L1252 314 L1252 352" stroke="#45A7A1"/>
  </g>
  <g id="route-coords-projection">
    <path class="connector" d="M508 438 L508 486 L508 486 L508 514" stroke="#8A72D6"/>
  </g>
  <g id="route-coords-geometry">
    <path class="connector" d="M612 438 L612 466 L1252 466 L1252 514" stroke="#DB7890"/>
  </g>
  <g id="route-projection-shapefile">
    <path class="connector" d="M496 600 L496 638 L496 638 L496 676" stroke="#D9AA4D"/>
  </g>
  <g id="route-geometry-spatial-model">
    <path class="connector" d="M1380 600 L1380 648 L1380 648 L1380 676" stroke="#58A978"/>
  </g>
  <g id="route-projection-netcdf-model">
    <path class="connector" d="M612 600 L612 628 L816 628 L816 676" stroke="#8BA84D"/>
  </g>
  <g id="route-shapefile-tables">
    <path class="connector" d="M496 762 L496 800 L496 800 L496 838" stroke="#45A7A1"/>
  </g>
  <g id="route-netcdf-model-tables">
    <path class="connector" d="M816 762 L816 810 L612 810 L612 838" stroke="#45A7A1"/>
  </g>
  <g id="route-spatial-model-repos">
    <path class="connector" d="M1252 762 L1252 790 L1048 790 L1048 838" stroke="#8A72D6"/>
  </g>
  <g id="route-tables-repos">
    <path class="connector" d="M646 881 L782 881" stroke="#8A72D6"/>
  </g>
  <g id="route-repos-services">
    <path class="connector" d="M1082 881 L1218 881" stroke="#D9AA4D"/>
  </g>

  <g transform="translate(76,978)">
    <rect class="pill" x="0" y="0" width="1468" height="42" rx="10"/>
    <text class="small" x="734" y="23" text-anchor="middle" dominant-baseline="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text>
  </g>
</svg>
