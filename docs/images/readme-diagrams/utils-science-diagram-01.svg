      <text class="card-title" x="260" y="24" text-anchor="middle" dominant-baseline="middle">bluetape4k-science</text>
      <text class="detail" x="260" y="43" text-anchor="middle" dominant-baseline="middle">geospatial coordinate</text>
      <text class="detail" x="260" y="62" text-anchor="middle" dominant-baseline="middle">file and persistence utilities</text>
    </g>
  </g>
  <g id="layer-coordinate-model">
