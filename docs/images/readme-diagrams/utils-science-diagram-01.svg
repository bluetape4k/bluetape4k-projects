<svg data-intent="Explain science utilities as coordinate/projection helpers feeding geometry operations, file readers, Exposed persistence tables, repositories, and import services." data-evidence="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science" data-source-read="utils/science/README.md; utils/science/src/main/kotlin/io/bluetape4k/science" xmlns="http://www.w3.org/2000/svg" width="1620" height="1054" viewBox="0 0 1620 1054" role="img" aria-labelledby="title desc">
  <title id="title">Science utilities architecture</title>
  <desc id="desc">Layered module overview for utils/science showing coordinate types, projection registry, geometry helpers, shapefile and NetCDF models, Exposed tables, repositories, and services.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .layer-title{font-family:"Architects Daughter";font-size:26px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1620" height="1054"/>
  <rect class="frame" x="34" y="30" width="1552" height="994" rx="28"/>
  <text class="title" x="72" y="88">Science utilities architecture</text>
  <text class="subtitle" x="76" y="121">Coordinate models feed projections and geometry, then file readers and Exposed persistence services.</text>

