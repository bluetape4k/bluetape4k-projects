<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="1110" viewBox="0 0 1590 1110" role="img" aria-label="AttributeConverter Type Mapping">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1590" height="1110"/>
<rect class="frame" x="32" y="28" width="1526" height="1054" rx="30"/>
<text class="title" x="68" y="84">AttributeConverter Type Mapping</text>
<text class="subtitle" x="72" y="116">Domain attributes pass through JPA converters before reaching stable database column shapes.</text>
<g><rect class="panel" x="86" y="165" width="1420" height="165" rx="22"/><text class="panelTitle" x="110" y="199">Domain attribute types</text></g>
<g id="domain"><rect class="card" x="150" y="210" width="320" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="310" y="249" text-anchor="middle">Domain value objects</text><text class="detail" x="310" y="285" text-anchor="middle">Money, Id, status, flags</text></g>
<g id="time"><rect class="card" x="600" y="210" width="300" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="750" y="249" text-anchor="middle">Time values</text><text class="detail" x="750" y="285" text-anchor="middle">Instant, LocalDate, Duration</text></g>
<g id="json"><rect class="card" x="1030" y="210" width="320" height="96" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1190" y="249" text-anchor="middle">Structured values</text><text class="detail" x="1190" y="285" text-anchor="middle">JSON, arrays, custom payloads</text></g>
<g><rect class="panel" x="86" y="430" width="1420" height="250" rx="22"/><text class="panelTitle" x="110" y="464">AttributeConverter layer</text></g>
<g id="conv"><rect class="card" x="185" y="512" width="320" height="132" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="185" y1="578" x2="505" y2="578" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="345" y="532" text-anchor="middle">JPA contract</text><text class="classTitle" x="345" y="560" text-anchor="middle">AttributeConverter</text><text class="member" x="203" y="607">+convertToDatabaseColumn</text>
<text class="member" x="203" y="624">+convertToEntityAttribute</text></g>
<g id="support"><rect class="card" x="610" y="495" width="350" height="162" rx="7" fill="#EAF7EF" stroke="#58A978"/><line x1="610" y1="561" x2="960" y2="561" stroke="#58A978" stroke-width="1.5"/><text class="stereo" x="785" y="515" text-anchor="middle">converter classes</text><text class="classTitle" x="785" y="543" text-anchor="middle">bluetape4k converters</text><text class="member" x="628" y="605">Enum/ValueObject converters</text>
<text class="member" x="628" y="622">JSON and temporal converters</text></g>
<g id="config"><rect class="card" x="1065" y="512" width="320" height="132" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1065" y1="578" x2="1385" y2="578" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1225" y="532" text-anchor="middle">module config</text><text class="classTitle" x="1225" y="560" text-anchor="middle">Hibernate type hints</text><text class="member" x="1083" y="607">dialect-aware mapping</text>
<text class="member" x="1083" y="624">column definition</text></g>
<path class="flow" d="M310 306 L310 370 L700 370 L700 495" stroke="#4F83BF"/>
<path class="flow" d="M750 306 L750 495" stroke="#3E9868"/>
<path class="flow" d="M1190 306 L1190 512" stroke="#755BC6"/>
<path class="inherit" d="M610 620 L555 620 L555 670 L345 670 L345 644" style="stroke:#B9851B;stroke-dasharray:8 7;"/>
<path class="flow" d="M960 580 L1065 580" stroke="#2E8F89"/>
<g><rect class="panel" x="86" y="795" width="1420" height="175" rx="22"/><text class="panelTitle" x="110" y="829">Database column shape</text></g>
<g id="scalar"><rect class="card" x="210" y="850" width="280" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="350" y="880" text-anchor="middle">Scalar columns</text><text class="detail" x="350" y="916" text-anchor="middle">varchar, bigint, timestamp</text></g>
<g id="jsonb"><rect class="card" x="610" y="850" width="280" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="750" y="880" text-anchor="middle">JSON columns</text><text class="detail" x="750" y="916" text-anchor="middle">json/jsonb document value</text></g>
<g id="enum"><rect class="card" x="1010" y="850" width="280" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="1150" y="880" text-anchor="middle">Enum/code columns</text><text class="detail" x="1150" y="916" text-anchor="middle">stable persisted code</text></g>
<path class="flow" d="M735 657 L735 742 L520 742 L520 889 L490 889" stroke="#4F83BF"/>
<path class="flow" d="M785 657 L785 850" stroke="#755BC6"/>
<path class="flow" d="M835 657 L835 742 L1150 742 L1150 850" stroke="#3E9868"/>
<g><rect x="210" y="982" width="1165" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="792.5" y="1008" text-anchor="middle">Converter cards are separated from layer labels; the horizontal regions now explain source type, converter, and column shape.</text></g>
</svg>
