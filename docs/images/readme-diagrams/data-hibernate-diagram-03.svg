<svg xmlns="http://www.w3.org/2000/svg" width="2240" height="1010" viewBox="0 0 2240 1010" role="img" aria-label="Hibernate AttributeConverter types"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><marker id="a2563EB" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="17" refY="7" orient="auto"><path d="M1 1 L17 7 L1 13 Z" fill="#2563EB" stroke="#2563EB" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><marker id="a16A34A" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="17" refY="7" orient="auto"><path d="M1 1 L17 7 L1 13 Z" fill="#16A34A" stroke="#16A34A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><marker id="aEA580C" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="17" refY="7" orient="auto"><path d="M1 1 L17 7 L1 13 Z" fill="#EA580C" stroke="#EA580C" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><marker id="aDC2626" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="17" refY="7" orient="auto"><path d="M1 1 L17 7 L1 13 Z" fill="#DC2626" stroke="#DC2626" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><marker id="a7C3AED" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="14" refX="17" refY="7" orient="auto"><path d="M1 1 L17 7 L1 13 Z" fill="#7C3AED" stroke="#7C3AED" stroke-dasharray="none" style="stroke-dasharray:none"/></marker><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:42px;fill:#0F172A}.subtitle,.sectionTitle{font-family:"Comic Mono";font-size:15px;fill:#475569}.section{fill:#F3F8FF;stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:12 8}.laneTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A}.card{stroke-width:2;filter:url(#softShadow)}.cardTitle{font-family:"Architects Daughter";font-size:21px;fill:#0F172A}.body{font-family:"Comic Mono";font-size:12.7px;fill:#475569}.flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.label rect{fill:#fff;stroke:#CBD5E1;opacity:.96}.label text{font-family:"Comic Mono";font-size:11.2px;fill:#475569}</style></defs><rect class="canvas" width="2240" height="1010"/><rect class="frame" x="34" y="30" width="2172" height="944" rx="8"/><text class="title" x="76" y="86">AttributeConverter Type Mapping</text><text class="subtitle" x="78" y="118">Each converter family maps a Kotlin/JPA attribute shape to one stable database column representation and back.</text><rect class="section" x="62" y="140" width="2116" height="760" rx="8"/><text class="sectionTitle" x="90" y="165">converter families from converters/*</text><text class="laneTitle" x="265" y="220" text-anchor="middle">Scalar Value</text><g><rect class="card" x="90" y="260" width="350" height="115" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="cardTitle" x="265" y="298" text-anchor="middle">Entity attribute</text><text class="body" x="116" y="336">Locale</text><text class="body" x="116" y="360">Duration</text></g><g><rect class="card" x="90" y="455" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#2563EB"/><text class="cardTitle" x="265" y="493" text-anchor="middle">Converter class</text><text class="body" x="116" y="531">LocaleAsStringConverter</text><text class="body" x="116" y="555">DurationAsTimestampConverter</text></g><g><rect class="card" x="90" y="695" width="350" height="125" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="cardTitle" x="265" y="733" text-anchor="middle">Database column</text><text class="body" x="116" y="771">BCP 47 String</text><text class="body" x="116" y="795">Timestamp millis</text></g><text class="laneTitle" x="700" y="220" text-anchor="middle">Compressed Text</text><g><rect class="card" x="525" y="260" width="350" height="115" rx="8" fill="#ECFDF5" stroke="#16A34A"/><text class="cardTitle" x="700" y="298" text-anchor="middle">Entity attribute</text><text class="body" x="551" y="336">String?</text></g><g><rect class="card" x="525" y="455" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#16A34A"/><text class="cardTitle" x="700" y="493" text-anchor="middle">Converter class</text><text class="body" x="551" y="531">BZip2 / Deflate / GZip</text><text class="body" x="551" y="555">LZ4 / Snappy / Zstd</text></g><g><rect class="card" x="525" y="695" width="350" height="125" rx="8" fill="#ECFDF5" stroke="#16A34A"/><text class="cardTitle" x="700" y="733" text-anchor="middle">Database column</text><text class="body" x="551" y="771">compressed String</text><text class="body" x="551" y="795">decompressed on read</text></g><text class="laneTitle" x="1135" y="220" text-anchor="middle">Serialized Object</text><g><rect class="card" x="960" y="260" width="350" height="115" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="cardTitle" x="1135" y="298" text-anchor="middle">Entity attribute</text><text class="body" x="986" y="336">Any?</text></g><g><rect class="card" x="960" y="455" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#EA580C"/><text class="cardTitle" x="1135" y="493" text-anchor="middle">Converter class</text><text class="body" x="986" y="531">JDK / Kryo / Fory</text><text class="body" x="986" y="555">+ optional LZ4/Snappy/Zstd</text></g><g><rect class="card" x="960" y="695" width="350" height="125" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="cardTitle" x="1135" y="733" text-anchor="middle">Database column</text><text class="body" x="986" y="771">Base64 ByteArray</text><text class="body" x="986" y="795">or Base64 String</text></g><text class="laneTitle" x="1570" y="220" text-anchor="middle">Encrypted String</text><g><rect class="card" x="1395" y="260" width="350" height="115" rx="8" fill="#FEF2F2" stroke="#DC2626"/><text class="cardTitle" x="1570" y="298" text-anchor="middle">Entity attribute</text><text class="body" x="1421" y="336">String?</text></g><g><rect class="card" x="1395" y="455" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#DC2626"/><text class="cardTitle" x="1570" y="493" text-anchor="middle">Converter class</text><text class="body" x="1421" y="531">AESStringConverter</text><text class="body" x="1421" y="555">DeterministicAESStringConverter</text></g><g><rect class="card" x="1395" y="695" width="350" height="125" rx="8" fill="#FEF2F2" stroke="#DC2626"/><text class="cardTitle" x="1570" y="733" text-anchor="middle">Database column</text><text class="body" x="1421" y="771">AES-GCM ciphertext</text><text class="body" x="1421" y="795">AES-SIV lookup-safe</text></g><text class="laneTitle" x="1940" y="220" text-anchor="middle">JSON Object</text><g><rect class="card" x="1765" y="260" width="350" height="115" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><text class="cardTitle" x="1940" y="298" text-anchor="middle">Entity attribute</text><text class="body" x="1791" y="336">T : Any</text></g><g><rect class="card" x="1765" y="455" width="350" height="145" rx="8" fill="#FFFFFF" stroke="#7C3AED"/><text class="cardTitle" x="1940" y="493" text-anchor="middle">Converter class</text><text class="body" x="1791" y="531">AbstractObjectAsJsonConverter&lt;T&gt;</text><text class="body" x="1791" y="555">Jackson3 JsonMapper</text></g><g><rect class="card" x="1765" y="695" width="350" height="125" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><text class="cardTitle" x="1940" y="733" text-anchor="middle">Database column</text><text class="body" x="1791" y="771">JSON String</text><text class="body" x="1791" y="795">null on parse/write error</text></g><g><path class="flow" d="M265 375 L265 455" stroke="#2563EB" marker-end="url(#a2563EB)"/><path class="flow" d="M305 695 L305 600" stroke="#2563EB" marker-end="url(#a2563EB)"/><path class="flow" d="M700 375 L700 455" stroke="#16A34A" marker-end="