<svg xmlns="http://www.w3.org/2000/svg" width="1590" height="1130" viewBox="0 0 1590 1130" role="img" aria-label="AttributeConverter Type Mapping">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <marker id="inherit" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke:#758297;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}.muted{stroke:#A7B4C3;stroke-dasharray:7 7}
    .lifeline{stroke:#A7B4C3;stroke-width:1.8;stroke-dasharray:8 8}.seq{fill:none;stroke-width:3;stroke-linecap:round}.seqReturn{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-dasharray:8 7}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.4}.altBox{fill:#FFFFFF;fill-opacity:.42;stroke:#D6A441;stroke-width:1.8;stroke-dasharray:8 8}
  </style>
</defs>
<rect class="canvas" width="1590" height="1130"/>
<rect class="frame" x="32" y="28" width="1526" height="1074" rx="30"/>
<text class="title" x="68" y="84">AttributeConverter Type Mapping</text>
<text class="subtitle" x="72" y="116">Each domain value family maps through its converter lane into the stable database column shape.</text>
<g><rect class="panel" x="86" y="165" width="440" height="770" rx="22"/><text class="panelTitle" x="110" y="199">Value-object lane</text></g>
<g><rect class="panel" x="575" y="165" width="440" height="770" rx="22"/><text class="panelTitle" x="599" y="199">Temporal lane</text></g>
<g><rect class="panel" x="1064" y="165" width="440" height="770" rx="22"/><text class="panelTitle" x="1088" y="199">Structured lane</text></g>
<g id="domain"><rect class="card" x="150" y="240" width="315" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="307.5" y="279" text-anchor="middle">Domain value objects</text><text class="detail" x="307.5" y="315" text-anchor="middle">Money, Id, status, flags</text></g>
<g id="valueConv"><rect class="card" x="150" y="455" width="315" height="118" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="307.5" y="505" text-anchor="middle">ValueObject converters</text><text class="detail" x="307.5" y="541" text-anchor="middle">domain value &lt;-&gt; scalar</text></g>
<g id="scalar"><rect class="card" x="150" y="750" width="315" height="84" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="307.5" y="783" text-anchor="middle">Scalar columns</text><text class="detail" x="307.5" y="819" text-anchor="middle">varchar, bigint, enum code</text></g>
<path class="flow" d="M307 336 L307 455" stroke="#4F83BF"/>
<path class="flow" d="M307 573 L307 750" stroke="#4F83BF"/>
<g id="time"><rect class="card" x="640" y="240" width="310" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="795" y="279" text-anchor="middle">Time values</text><text class="detail" x="795" y="315" text-anchor="middle">Instant, LocalDate, Duration</text></g>
<g id="timeConv"><rect class="card" x="640" y="455" width="310" height="118" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="795" y="505" text-anchor="middle">Temporal converters</text><text class="detail" x="795" y="541" text-anchor="middle">time value &lt;-&gt; timestamp</text></g>
<g id="timeColumn"><rect class="card" x="640" y="750" width="310" height="84" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="795" y="783" text-anchor="middle">Temporal columns</text><text class="detail" x="795" y="819" text-anchor="middle">timestamp, date, duration</text></g>
<path class="flow" d="M795 336 L795 455" stroke="#3E9868"/>
<path class="flow" d="M795 573 L795 750" stroke="#3E9868"/>
<g id="json"><rect class="card" x="1128" y="240" width="315" height="96" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1285.5" y="279" text-anchor="middle">Structured values</text><text class="detail" x="1285.5" y="315" text-anchor="middle">JSON, arrays, custom payloads</text></g>
<g id="jsonConv"><rect class="card" x="1128" y="455" width="315" height="118" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1285.5" y="505" text-anchor="middle">JSON converters</text><text class="detail" x="1285.5" y="541" text-anchor="middle">payload &lt;-&gt; json/jsonb</text></g>
<g id="config"><rect class="card" x="1120" y="620" width="330" height="120" rx="7" fill="#E9F7F6" stroke="#45A7A1"/><line x1="1120" y1="686" x2="1450" y2="686" stroke="#45A7A1" stroke-width="1.5"/><text class="stereo" x="1285" y="640" text-anchor="middle">module config</text><text class="classTitle" x="1285" y="668" text-anchor="middle">Hibernate type hints</text><text class="member" x="1154" y="709">dialect-aware mapping</text>
<text class="member" x="1154" y="726">column definition</text></g>
<g id="jsonb"><rect class="card" x="1128" y="790" width="315" height="84" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1285.5" y="823" text-anchor="middle">JSON columns</text><text class="detail" x="1285.5" y="859" text-anchor="middle">json/jsonb document value</text></g>
<path class="flow" d="M1285 336 L1285 455" stroke="#755BC6"/>
<path class="flow" d="M1285 573 L1285 620" stroke="#2E8F89"/>
<path class="flow" d="M1285 740 L1285 790" stroke="#755BC6"/>
<g id="conv"><rect class="card" x="492" y="965" width="600" height="122" rx="7" fill="#FFF3D9" stroke="#D6A441"/><line x1="492" y1="1047" x2="1092" y2="1047" stroke="#D6A441" stroke-width="1.5"/><text class="stereo" x="792" y="985" text-anchor="middle">shared contract</text><text class="classTitle" x="792" y="1007" text-anchor="middle">JPA AttributeConverter</text><text class="classTitle" x="792" y="1029" text-anchor="middle">contract</text><text class="member" x="526" y="1071">convertToDatabaseColumn / convertToEntityAttribute</text></g>
<path class="flow" d="M307 834 L307 1026 L492 1026" stroke="#B9851B" stroke-dasharray="9 8"/>
<path class="flow" d="M795 834 L795 965" stroke="#B9851B" stroke-dasharray="9 8"/>
<path class="flow" d="M1285 874 L1285 1026 L1092 1026" stroke="#B9851B" stroke-dasharray="9 8"/>
</svg>
