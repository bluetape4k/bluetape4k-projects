<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="1754" viewBox="0 0 1430 1754" role="img" aria-label="Toxiproxy (Chaos Testing)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1430" height="1754"/>
<rect class="frame" x="32" y="28" width="1366" height="1698" rx="28"/>
<text class="title" x="66" y="82">Toxiproxy (Chaos Testing)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="35" y="166" width="210" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Test Code</text>
<line x1="140" y1="252" x2="140" y2="1694" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="322.5" y="166" width="210" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="427.5" y="209" text-anchor="middle">RedisServer</text>
<line x1="427.5" y1="252" x2="427.5" y2="1694" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="610" y="166" width="210" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="715" y="209" text-anchor="middle">ToxiproxyServer</text>
<line x1="715" y1="252" x2="715" y2="1694" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="897.5" y="166" width="210" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1002.5" y="209" text-anchor="middle">ToxiproxyClient</text>
<line x1="1002.5" y1="252" x2="1002.5" y2="1694" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1185" y="166" width="210" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1290" y="209" text-anchor="middle">Lettuce Client</text>
<line x1="1290" y1="252" x2="1290" y2="1694" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="158" y="270" width="251.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="297" text-anchor="start">1. start() withNetwork(network)</text>
<path class="line" d="M140 310 L427.5 310"/>
<rect x="158" y="352" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="379" text-anchor="start">2. start() withNetwork(network)</text>
<path class="line" d="M140 392 L715 392"/>
<rect x="158" y="434" width="826.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="461" text-anchor="start">3. createProxy(redis-primary, 0.0.0.0:8666, redis:6379)</text>
<path class="line" d="M140 474 L1002.5 474"/>
<rect x="733" y="516" width="251.5" height="62" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="543" text-anchor="start">4. Proxy created with listen/upstream</text>
<text class="strong" x="749" y="566" text-anchor="start">config</text>
<path class="dashed" d="M1002.5 556 L715 556"/>
<rect x="158" y="598" width="1114" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="625" text-anchor="start">5. connect(toxiproxy.host, toxiproxy.getMappedPort(8666))</text>
<path class="line" d="M140 638 L1290 638"/>
<rect x="733" y="680" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="707" text-anchor="start">6. PING / SET / GET requests</text>
<path class="line" d="M1290 720 L715 720"/>
<rect x="445.5" y="762" width="251.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="461.5" y="789" text-anchor="start">7. Forward to redis:6379</text>
<path class="line" d="M715 802 L427.5 802"/>
<rect x="445.5" y="844" width="251.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="461.5" y="871" text-anchor="start">8. Return response</text>
<path class="dashed" d="M427.5 884 L715 884"/>
<rect x="733" y="926" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="953" text-anchor="start">9. Return proxy response</text>
<path class="dashed" d="M715 966 L1290 966"/>
<rect x="158" y="1008" width="826.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1035" text-anchor="start">10. proxy.toxics().latency(..., DOWNSTREAM, 250)</text>
<path class="line" d="M140 1048 L1002.5 1048"/>
<rect x="733" y="1090" width="251.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1117" text-anchor="start">11. Add downstream latency toxic</text>
<path class="dashed" d="M1002.5 1130 L715 1130"/>
<rect x="733" y="1172" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1199" text-anchor="start">12. GET request</text>
<path class="line" d="M1290 1212 L715 1212"/>
<rect x="733" y="1254" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1281" text-anchor="start">13. Delayed response</text>
<path class="dashed" d="M715 1294 L1290 1294"/>
<rect x="158" y="1336" width="826.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="174" y="1363" text-anchor="start">14. latency.remove()</text>
<path class="line" d="M140 1376 L1002.5 1376"/>
<rect x="733" y="1418" width="251.5" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1445" text-anchor="start">15. Remove toxic</text>
<path class="dashed" d="M1002.5 1458 L715 1458"/>
<rect x="733" y="1500" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1527" text-anchor="start">16. GET request</text>
<path class="line" d="M1290 1540 L715 1540"/>
<rect x="733" y="1582" width="539" height="39" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="749" y="1609" text-anchor="start">17. Normal speed response</text>
<path class="dashed" d="M715 1622 L1290 1622"/>
</svg>
