<svg xmlns="http://www.w3.org/2000/svg" width="1768" height="1670" viewBox="0 0 1768 1670" role="img" aria-label="Toxiproxy (Chaos Testing)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1768" height="1670"/>
<rect class="frame" x="32" y="28" width="1704" height="1614" rx="28"/>
<text class="title" x="66" y="82">Toxiproxy (Chaos Testing)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="199" y="209" text-anchor="middle">Test Code</text>
<line class="lifeline" x1="199" y1="252" x2="199" y2="1610" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="422.5" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="541.5" y="209" text-anchor="middle">RedisServer</text>
<line class="lifeline" x1="541.5" y1="252" x2="541.5" y2="1610" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="765" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="884" y="209" text-anchor="middle">ToxiproxyServer</text>
<line class="lifeline" x1="884" y1="252" x2="884" y2="1610" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1107.5" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1226.5" y="209" text-anchor="middle">ToxiproxyClient</text>
<line class="lifeline" x1="1226.5" y1="252" x2="1226.5" y2="1610" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1450" y="166" width="238" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1569" y="209" text-anchor="middle">Lettuce Client</text>
<line class="lifeline" x1="1569" y1="252" x2="1569" y2="1610" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="227.3" y="286" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="245.3" y="313" text-anchor="start">1. start() withNetwork(network)</text>
<path class="line" d="M199 332 L541.5 332"/>
<rect x="398.5" y="362" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="416.5" y="389" text-anchor="start">2. start() withNetwork(network)</text>
<path class="line" d="M199 408 L884 408"/>
<rect x="472.8" y="438" width="480" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="490.8" y="465" text-anchor="start">3. createProxy(redis-primary, 0.0.0.0:8666, redis:6379)</text>
<path class="line" d="M199 484 L1226.5 484"/>
<rect x="859.8" y="514" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="877.8" y="541" text-anchor="start">4. Proxy created with listen/upstream config</text>
<path class="dashed" d="M1226.5 560 L884 560"/>
<rect x="636" y="590" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="654" y="617" text-anchor="start">5. connect(toxiproxy.host, toxiproxy.getMappedPort(8666))</text>
<path class="line" d="M199 636 L1569 636"/>
<rect x="1095.5" y="666" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1113.5" y="693" text-anchor="start">6. PING / SET / GET requests</text>
<path class="line" d="M1569 712 L884 712"/>
<rect x="597.8" y="742" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="615.8" y="769" text-anchor="start">7. Forward to redis:6379</text>
<path class="line" d="M884 788 L541.5 788"/>
<rect x="607.8" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="625.8" y="845" text-anchor="start">8. Return response</text>
<path class="dashed" d="M541.5 864 L884 864"/>
<rect x="1111.5" y="894" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1129.5" y="921" text-anchor="start">9. Return proxy response</text>
<path class="dashed" d="M884 940 L1569 940"/>
<rect x="501.3" y="970" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="519.3" y="997" text-anchor="start">10. proxy.toxics().latency(..., DOWNSTREAM, 250)</text>
<path class="line" d="M199 1016 L1226.5 1016"/>
<rect x="908.3" y="1046" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="926.3" y="1073" text-anchor="start">11. Add downstream latency toxic</text>
<path class="dashed" d="M1226.5 1092 L884 1092"/>
<rect x="1121.5" y="1122" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.5" y="1149" text-anchor="start">12. GET request</text>
<path class="line" d="M1569 1168 L884 1168"/>
<rect x="1121.5" y="1198" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.5" y="1225" text-anchor="start">13. Delayed response</text>
<path class="dashed" d="M884 1244 L1569 1244"/>
<rect x="607.8" y="1274" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="625.8" y="1301" text-anchor="start">14. latency.remove()</text>
<path class="line" d="M199 1320 L1226.5 1320"/>
<rect x="950.3" y="1350" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="968.3" y="1377" text-anchor="start">15. Remove toxic</text>
<path class="dashed" d="M1226.5 1396 L884 1396"/>
<rect x="1121.5" y="1426" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1139.5" y="1453" text-anchor="start">16. GET request</text>
<path class="line" d="M1569 1472 L884 1472"/>
<rect x="1107.5" y="1502" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1125.5" y="1529" text-anchor="start">17. Normal speed response</text>
<path class="dashed" d="M884 1548 L1569 1548"/>
</svg>
