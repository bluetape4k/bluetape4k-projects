<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="2226" viewBox="0 0 1650 2226" role="img" aria-label="Toxiproxy (Chaos Testing)">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1650" height="2226"/>
<rect class="frame" x="32" y="28" width="1586" height="2170" rx="28"/>
<text class="title" x="66" y="82">Toxiproxy (Chaos Testing)</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="21" y="166" width="238" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Test Code</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="363.5" y="166" width="238" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="482.5" y="209" text-anchor="middle">RedisServer</text>
<line class="lifeline" x1="482.5" y1="252" x2="482.5" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="706" y="166" width="238" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="825" y="209" text-anchor="middle">ToxiproxyServer</text>
<line class="lifeline" x1="825" y1="252" x2="825" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1048.5" y="166" width="238" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1167.5" y="209" text-anchor="middle">ToxiproxyClient</text>
<line class="lifeline" x1="1167.5" y1="252" x2="1167.5" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1391" y="166" width="238" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1510" y="209" text-anchor="middle">Lettuce Client</text>
<line class="lifeline" x1="1510" y1="252" x2="1510" y2="2166" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="168.25" y="286" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="186.25" y="313" text-anchor="start">1. start() withNetwork(network)</text>
<path class="line" d="M140 344 L482.5 344"/>
<rect x="339.5" y="396" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="357.5" y="423" text-anchor="start">2. start() withNetwork(network)</text>
<path class="line" d="M140 454 L825 454"/>
<rect x="413.75" y="506" width="480" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="431.75" y="533" text-anchor="start">3. createProxy(redis-primary, 0.0.0.0:8666, redis:6379)</text>
<path class="line" d="M140 564 L1167.5 564"/>
<rect x="800.75" y="616" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="818.75" y="643" text-anchor="start">4. Proxy created with listen/upstream config</text>
<path class="dashed" d="M1167.5 674 L825 674"/>
<rect x="577" y="726" width="496" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="595" y="753" text-anchor="start">5. connect(toxiproxy.host, toxiproxy.getMappedPort(8666))</text>
<path class="line" d="M140 784 L1510 784"/>
<rect x="1036.5" y="836" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1054.5" y="863" text-anchor="start">6. PING / SET / GET requests</text>
<path class="line" d="M1510 894 L825 894"/>
<rect x="538.75" y="946" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="556.75" y="973" text-anchor="start">7. Forward to redis:6379</text>
<path class="line" d="M825 1004 L482.5 1004"/>
<rect x="548.75" y="1056" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="1083" text-anchor="start">8. Return response</text>
<path class="dashed" d="M482.5 1114 L825 1114"/>
<rect x="1052.5" y="1166" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1070.5" y="1193" text-anchor="start">9. Return proxy response</text>
<path class="dashed" d="M825 1224 L1510 1224"/>
<rect x="442.25" y="1276" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="460.25" y="1303" text-anchor="start">10. proxy.toxics().latency(..., DOWNSTREAM, 250)</text>
<path class="line" d="M140 1334 L1167.5 1334"/>
<rect x="849.25" y="1386" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="867.25" y="1413" text-anchor="start">11. Add downstream latency toxic</text>
<path class="dashed" d="M1167.5 1444 L825 1444"/>
<rect x="1062.5" y="1496" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1080.5" y="1523" text-anchor="start">12. GET request</text>
<path class="line" d="M1510 1554 L825 1554"/>
<rect x="1062.5" y="1606" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1080.5" y="1633" text-anchor="start">13. Delayed response</text>
<path class="dashed" d="M825 1664 L1510 1664"/>
<rect x="548.75" y="1716" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="566.75" y="1743" text-anchor="start">14. latency.remove()</text>
<path class="line" d="M140 1774 L1167.5 1774"/>
<rect x="891.25" y="1826" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="909.25" y="1853" text-anchor="start">15. Remove toxic</text>
<path class="dashed" d="M1167.5 1884 L825 1884"/>
<rect x="1062.5" y="1936" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1080.5" y="1963" text-anchor="start">16. GET request</text>
<path class="line" d="M1510 1994 L825 1994"/>
<rect x="1048.5" y="2046" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1066.5" y="2073" text-anchor="start">17. Normal speed response</text>
<path class="dashed" d="M825 2104 L1510 2104"/>
</svg>
