  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">loess Interpolator</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Of()</text>
</g>
<g transform="translate(525,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">akima Spline</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Interpolator Of()</text>
</g>
