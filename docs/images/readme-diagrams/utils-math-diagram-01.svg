<text class="smallLabel" x="130" y="63" text-anchor="middle">Descriptive stats</text>
<text class="smallLabel" x="130" y="84" text-anchor="middle">(mean/variance/stddev)</text>
</g>
<g transform="translate(105,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
