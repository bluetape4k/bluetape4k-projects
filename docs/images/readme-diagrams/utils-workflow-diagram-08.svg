<svg data-intent="Explain workflow completion flow by showing final task result aggregation, transition closure, completion event, and observable outcome." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900" role="img" aria-label="Retry Flow With Backoff" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1460" height="900"/>
<rect class="frame" x="34" y="30" width="1392" height="840" rx="8"/>
<text class="title" x="72" y="84">Retry Flow With Backoff</text>
<text class="subtitle" x="76" y="116">Only Failure enters the retry loop; Success, Aborted, and Cancelled return immediately, while maxAttempts bounds retry work.</text>
<g id="start">
  <rect class="card" x="120" y="235" width="300" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="270" y="267" text-anchor="middle" dominant-baseline="middle">Retry flow starts</text>
  <text class="detail" x="270" y="297" text-anchor="middle" dominant-baseline="middle">attempt = 1</text>
</g>
<g id="work">
  <rect class="card" x="560" y="220" width="330" height="96" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="725" y="261" text-anchor="middle" dominant-baseline="middle">Execute work</text>
  <text class="detail" x="725" y="291" text-anchor="middle" dominant-baseline="middle">exceptions become Failure</text>
</g>
<g id="result">
  <polygon class="card card-shape" points="1190,200 1350,268 1190,336 1030,268" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1190" y="260" text-anchor="middle" dominant-baseline="middle">Success or stop?</text>
  <text class="detail" x="1190" y="289" text-anchor="middle" dominant-baseline="middle">Success, Aborted, Cancelled</text>
</g>
<g id="success">
  <rect class="card" x="1030" y="445" width="320" height="82" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1190" y="479" text-anchor="middle" dominant-baseline="middle">Return terminal report</text>
  <text class="detail" x="1190" y="509" text-anchor="middle" dominant-baseline="middle">success/abort/cancel</text>
</g>
<g id="attempts">
  <polygon class="card card-shape" points="725,525 890,593 725,661 560,593" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="725" y="585" text-anchor="middle" dominant-baseline="middle">Attempts left?</text>
  <text class="detail" x="725" y="614" text-anchor="middle" dominant-baseline="middle">maxAttempts includes first try</text>
</g>
<g id="failure">
  <rect class="card" x="1010" y="635" width="340" height="82" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1180" y="669" text-anchor="middle" dominant-baseline="middle">Return Failure</text>
  <text class="detail" x="1180" y="699" text-anchor="middle" dominant-baseline="middle">last failed WorkReport</text>
</g>
<g id="backoff">
  <rect class="card" x="160" y="635" width="320" height="90" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="320" y="664" text-anchor="middle" dominant-baseline="middle">Backoff delay</text>
  <text class="detail" x="320" y="694" text-anchor="middle" dominant-baseline="middle">delay * multiplier</text>
  <text class="detail" x="320" y="712" text-anchor="middle" dominant-baseline="middle">bounded by maxDelay</text>
</g>
<path class="route" data-from="start" data-to="work" d="M420 274 L560 268" stroke="#1D4ED8"/>
<path class="route" data-from="work" data-to="result" d="M890 268 L1030 268" stroke="#15803D"/>
<path class="route" data-from="result" data-to="success" d="M1300 336 L1190 445" stroke="#4D7C0F"/>
<path class="route" data-from="result" data-to="attempts" d="M1190 336 L1190 410 L725 410 L725 525" stroke="#BE185D"/>
<text class="detail" x="1405" y="378" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="1000" y="386" text-anchor="middle" dominant-baseline="middle">failure</text>
<path class="route" data-from="attempts" data-to="failure" d="M890 593 L1010 676" stroke="#BE185D"/>
<g><rect class="labelPill" x="926" y="607" width="48" height="26" rx="8"/><text class="detail" x="950" y="621" text-anchor="middle" dominant-baseline="middle" style="fill:#BE185D">no</text></g>
<path class="route" data-from="attempts" data-to="backoff" d="M560 593 L480 680" stroke="#0F766E"/>
<g><rect class="labelPill" x="490" y="611" width="52" height="26" rx="8"/><text class="detail" x="516" y="625" text-anchor="middle" dominant-baseline="middle" style="fill:#0F766E">yes</text></g>
<path class="route dashed" data-from="backoff" data-to="work" d="M320 635 L320 400 L725 400 L725 316" stroke="#0F766E"/>
<g><rect class="labelPill" x="492" y="366" width="66" height="26" rx="8"/><text class="detail" x="525" y="380" text-anchor="middle" dominant-baseline="middle" style="fill:#0F766E">retry</text></g>
</svg>
