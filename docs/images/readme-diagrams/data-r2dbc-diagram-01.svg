<svg data-intent="Explain R2DBC extension APIs by showing ConnectionFactory/DatabaseClient receivers, bind/query helpers, transaction/coroutine bridges, and Flow/suspend result boundaries." data-evidence="data/r2dbc/README.md; data/r2dbc/src/main/kotlin/io/bluetape4k/r2dbc" data-source-read="data/r2dbc/README.md; data/r2dbc/src/main/kotlin/io/bluetape4k/r2dbc" xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-label="R2DBC Extension API Overview">
<defs>
