<rect class="canvas" width="1500" height="1040"/>
<rect class="frame" x="34" y="30" width="1432" height="980" rx="8"/>
<text class="title" x="72" y="84">R2DBC Extension API Overview</text>
<text class="subtitle" x="76" y="116">The module adapts reactive database receivers into coroutine-friendly query, transaction, and result boundaries.</text>
<g><rect class="panel" x="82" y="160" width="1350" height="180" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Caller boundary</text></g>
<g><rect class="panel" x="82" y="425" width="1350" height="230" rx="8"/><text class="panelTitle" x="110" y="461" dominant-baseline="middle">Extension families</text></g>
<g><rect class="panel" x="82" y="752" width="1350" height="220" rx="8"/><text class="panelTitle" x="110" y="788" dominant-baseline="middle">Reactive/coroutine result</text></g>
