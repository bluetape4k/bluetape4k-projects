  <text class="cardTitle" x="745" y="270" text-anchor="middle" dominant-baseline="middle">DatabaseClient</text>
  <text class="detail" x="745" y="300" text-anchor="middle" dominant-baseline="middle">Spring reactive SQL facade</text>
</g>
