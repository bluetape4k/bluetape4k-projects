  <text class="cardTitle" x="1195" y="270" text-anchor="middle" dominant-baseline="middle">ConnectionFactory</text>
  <text class="detail" x="1195" y="300" text-anchor="middle" dominant-baseline="middle">R2DBC connection source</text>
</g>
<g id="bind">
