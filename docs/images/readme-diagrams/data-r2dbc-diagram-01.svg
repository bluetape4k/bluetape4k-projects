<g><rect class="panel" x="82" y="425" width="1350" height="230" rx="22"/><text class="panelTitle" x="110" y="461" dominant-baseline="middle">Extension families</text></g>
<g><rect class="panel" x="82" y="752" width="1350" height="220" rx="22"/><text class="panelTitle" x="110" y="788" dominant-baseline="middle">Reactive/coroutine result</text></g>
