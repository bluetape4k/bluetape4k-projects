  <text class="cardTitle" x="1195" y="872" text-anchor="middle" dominant-baseline="middle">Coroutine results</text>
  <text class="detail" x="1195" y="902" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt;, suspend T?</text>
