<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="880" viewBox="0 0 1450 880" role="img" aria-label="Parallel Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="smallArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6" fill="none" stroke="#758297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .edgeLabel{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .card{stroke-width:2.1;filter:url(#shadow)}.soft{stroke-width:1.7}.line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .thinLine{stroke:#758297;stroke-width:1.8;fill:none;marker-end:url(#smallArrow)}
    .dashed{stroke:#758297;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1450" height="880"/>
<rect class="frame" x="32" y="28" width="1386" height="824" rx="28"/>
<text class="title" x="66" y="82">Parallel Flow</text>
<text class="subtitle" x="70" y="118">Virtual-thread tasks fork together; ALL waits/fails fast, ANY returns the first success, and timeout becomes Cancelled.</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="113" width="1378" height="286" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="141">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="313" width="1378" height="261" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="341">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="473" width="1378" height="273" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="501">Adapter layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<g>
  <rect class="card" x="90" y="365" width="220" height="108" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="200" y="401" text-anchor="middle">Start</text>
  <text class="small" x="200" y="431" text-anchor="middle">shared context</text>
</g>
<g>
  <rect class="card" x="450" y="145" width="235" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="567.5" y="181" text-anchor="middle">Work A</text>
  <text class="small" x="567.5" y="211" text-anchor="middle">forked task</text>
</g>
<g>
  <rect class="card" x="450" y="345" width="235" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="567.5" y="381" text-anchor="middle">Work B</text>
  <text class="small" x="567.5" y="411" text-anchor="middle">forked task</text>
</g>
<g>
  <rect class="card" x="450" y="545" width="235" height="110" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="567.5" y="581" text-anchor="middle">Work C</text>
  <text class="small" x="567.5" y="611" text-anchor="middle">forked task</text>
</g>
<g>
  <rect class="card" x="850" y="220" width="260" height="128" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="980" y="256" text-anchor="middle">Policy ALL</text>
  <text class="small" x="980" y="286" text-anchor="middle">wait for all</text>
<text class="small" x="980" y="304" text-anchor="middle">fail-fast on failure</text>
</g>
<g>
  <rect class="card" x="850" y="505" width="260" height="128" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="980" y="541" text-anchor="middle">Policy ANY</text>
  <text class="small" x="980" y="571" text-anchor="middle">first Success wins</text>
<text class="small" x="980" y="589" text-anchor="middle">cancel remaining tasks</text>
</g>
<g>
  <rect class="card" x="1180" y="255" width="220" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="1290" y="291" text-anchor="middle">Completed</text>
  <text class="small" x="1290" y="321" text-anchor="middle">all succeeded</text>
</g>
<g>
  <rect class="card" x="1180" y="430" width="220" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="1290" y="466" text-anchor="middle">Failure</text>
  <text class="small" x="1290" y="496" text-anchor="middle">first failed report</text>
</g>
<g>
  <rect class="card" x="1180" y="602" width="220" height="112" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="1290" y="638" text-anchor="middle">Cancelled</text>
  <text class="small" x="1290" y="668" text-anchor="middle">deadline exceeded</text>
</g>
<path class="line" d="M310 419 C360 250 395 205 450 200"/>
<text class="edgeLabel" x="385" y="260" text-anchor="middle">fork</text>
<path class="line" d="M310 419 H450"/>
<text class="edgeLabel" x="380" y="409" text-anchor="middle">fork</text>
<path class="line" d="M310 419 C360 585 395 600 450 600"/>
<text class="edgeLabel" x="385" y="555" text-anchor="middle">fork</text>
<path class="line" d="M685 200 C750 215 790 250 850 284"/>
<text class="edgeLabel" x="766" y="234" text-anchor="middle">reports</text>
<path class="line" d="M685 400 C760 385 805 345 850 302"/>
<text class="edgeLabel" x="774" y="374" text-anchor="middle">reports</text>
<path class="line" d="M685 600 C760 588 805 555 850 569"/>
<text class="edgeLabel" x="774" y="574" text-anchor="middle">reports</text>
<path class="line" d="M1110 284 H1180"/>
<text class="edgeLabel" x="1145" y="274" text-anchor="middle">success</text>
<path class="line" d="M1110 302 C1160 330 1166 400 1180 486"/>
<text class="edgeLabel" x="1150" y="384" text-anchor="middle">failure</text>
<path class="line" d="M1110 569 C1160 585 1168 630 1180 658"/>
<text class="edgeLabel" x="1152" y="611" text-anchor="middle">timeout</text>
<g>
  <rect class="soft" x="86" y="640" width="330" height="78" rx="12" fill="#EAF7EF" stroke="#58A978" opacity="0.92"/>
  <text class="small" x="104" y="665" text-anchor="start">Parallel shares one WorkContext.</text>
<text class="small" x="104" y="683" text-anchor="start">Use it for independent work units.</text>
</g></svg>
