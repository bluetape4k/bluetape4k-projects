<svg data-intent="Explain workflow task orchestration by showing task inputs, action execution, output mapping, transition guards, and next-task routing." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1490" height="900" viewBox="0 0 1490 900" role="img" aria-label="Parallel Flow Policy" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1490" height="900"/>
<rect class="frame" x="34" y="30" width="1422" height="840" rx="32"/>
<text class="title" x="72" y="84">Parallel Flow Policy</text>
<text class="subtitle" x="76" y="116">ALL waits under fail-fast structured concurrency; ANY returns the first success while timeout and non-success reports still map to WorkReport outcomes.</text>
<g id="start">
  <rect class="card" x="120" y="230" width="300" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="270" y="262" text-anchor="middle" dominant-baseline="middle">Parallel flow starts</text>
  <text class="detail" x="270" y="292" text-anchor="middle" dominant-baseline="middle">shared WorkContext</text>
</g>
<g id="policy">
  <polygon class="card card-shape" points="725,200 895,268 725,336 555,268" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="725" y="260" text-anchor="middle" dominant-baseline="middle">ParallelPolicy?</text>
  <text class="detail" x="725" y="289" text-anchor="middle" dominant-baseline="middle">ALL or ANY</text>
</g>
<g id="forkAll">
  <rect class="card" x="1040" y="155" width="330" height="88" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1205" y="183" text-anchor="middle" dominant-baseline="middle">ALL: fail-fast scope</text>
  <text class="detail" x="1205" y="213" text-anchor="middle" dominant-baseline="middle">wait for every fork</text>
  <text class="detail" x="1205" y="231" text-anchor="middle" dominant-baseline="middle">failure cancels siblings</text>
</g>
<g id="forkAny">
  <rect class="card" x="1040" y="325" width="330" height="88" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="1205" y="353" text-anchor="middle" dominant-baseline="middle">ANY: first-success scope</text>
  <text class="detail" x="1205" y="383" text-anchor="middle" dominant-baseline="middle">first Success wins</text>
  <text class="detail" x="1205" y="401" text-anchor="middle" dominant-baseline="middle">non-success keeps racing</text>
</g>
<g id="timeout">
  <rect class="card" x="120" y="520" width="300" height="80" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="270" y="553" text-anchor="middle" dominant-baseline="middle">Timeout boundary</text>
  <text class="detail" x="270" y="583" text-anchor="middle" dominant-baseline="middle">returns Cancelled</text>
</g>
<g id="result">
  <rect class="card" x="555" y="530" width="340" height="120" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="725" y="583" text-anchor="middle" dominant-baseline="middle">Collected WorkReports</text>
  <text class="detail" x="725" y="613" text-anchor="middle" dominant-baseline="middle">priority chooses outcome</text>
</g>
<g id="success">
  <rect class="card" x="1040" y="560" width="330" height="82" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1205" y="594" text-anchor="middle" dominant-baseline="middle">Success result</text>
  <text class="detail" x="1205" y="624" text-anchor="middle" dominant-baseline="middle">all passed or first success</text>
</g>
<g id="failure">
  <rect class="card" x="1040" y="705" width="330" height="82" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1205" y="739" text-anchor="middle" dominant-baseline="middle">Failure / Aborted</text>
  <text class="detail" x="1205" y="769" text-anchor="middle" dominant-baseline="middle">highest-priority stop state</text>
</g>
<path class="route" data-from="start" data-to="policy" d="M420 269 L555 268" stroke="#4F83BF"/>
<path class="route" data-from="policy" data-to="forkAll" d="M895 248 L1040 199" stroke="#3E9868"/>
<g><rect class="labelPill" x="944" y="185" width="52" height="26" rx="8"/><text class="detail" x="970" y="199" text-anchor="middle" dominant-baseline="middle" style="fill:#3E9868">ALL</text></g>
<path class="route" data-from="policy" data-to="forkAny" d="M895 268 L1040 369" stroke="#2E8F89"/>
<g><rect class="labelPill" x="944" y="325" width="52" height="26" rx="8"/><text class="detail" x="970" y="339" text-anchor="middle" dominant-baseline="middle" style="fill:#2E8F89">ANY</text></g>
<path class="route" data-from="forkAll" data-to="result" d="M1370 199 L1420 199 L1420 470 L690 470 L690 530" stroke="#3E9868"/>
<path class="route" data-from="forkAny" data-to="result" d="M1205 413 L1205 505 L780 505 L780 530" stroke="#2E8F89"/>
<path class="route dashed" data-from="start" data-to="timeout" d="M270 308 L270 520" stroke="#B9851B"/>
<path class="route dashed" data-from="timeout" data-to="result" d="M420 560 L555 596" stroke="#B9851B"/>
<g><rect class="labelPill" x="453" y="535" width="74" height="26" rx="8"/><text class="detail" x="490" y="549" text-anchor="middle" dominant-baseline="middle" style="fill:#B9851B">cancel</text></g>
<path class="route" data-from="result" data-to="success" d="M895 590 L1040 601" stroke="#718A35"/>
<g><rect class="labelPill" x="924" y="547" width="82" height="26" rx="8"/><text class="detail" x="965" y="561" text-anchor="middle" dominant-baseline="middle" style="fill:#718A35">success</text></g>
<path class="route" data-from="result" data-to="failure" d="M725 650 L725 746 L1040 746" stroke="#C94D68"/>
<g><rect class="labelPill" x="816" y="710" width="118" height="26" rx="8"/><text class="detail" x="875" y="724" text-anchor="middle" dominant-baseline="middle" style="fill:#C94D68">failure/abort</text></g>
</svg>
