    <path class="edge" d="M1052 466 L1140 466" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>

    <path class="edge" d="M332 576 L420 576" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
    <path class="edge" d="M692 576 L780 576" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
    <path class="edge" d="M1052 576 L1140 576" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>

    <path class="edge" d="M332 686 L420 686" fill="none" stroke="#db2777" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pink)"/>
    <path class="edge" d="M692 686 L780 686" fill="none" stroke="#db2777" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-pink)"/>
