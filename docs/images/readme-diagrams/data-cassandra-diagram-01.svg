    <text x="492" y="481" font-size="12.4" fill="#475569">executeSuspending(...)</text>
<text x="492" y="499" font-size="12.4" fill="#475569">prepareSuspending(...)</text>
  </g>

  <g class="card" data-card="Driver Future">
    <rect x="780" y="425" width="272" height="82" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="794" y="443" width="42" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="815" y="471" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">F</text>
    <text x="852" y="456" font-size="16.4" font-weight="700" fill="#111827">Driver Future</text>
    <text x="852" y="481" font-size="12.4" fill="#475569">executeAsync(...).await()</text>
<text x="852" y="499" font-size="12.4" fill="#475569">prepareAsync(...).await()</text>
  </g>

  <g class="card" data-card="AsyncResultSet">
