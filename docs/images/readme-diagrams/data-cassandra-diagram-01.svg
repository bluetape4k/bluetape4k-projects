    <rect x="1154" y="443" width="42" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="1175" y="471" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">R</text>
    <text x="1212" y="456" font-size="16.4" font-weight="700" fill="#111827">AsyncResultSet</text>
    <text x="1212" y="481" font-size="12.4" fill="#475569">awaited result</text>
  </g>

  <g class="card" data-card="Read rows">
