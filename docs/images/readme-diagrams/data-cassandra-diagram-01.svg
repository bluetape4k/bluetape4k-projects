    <rect x="74" y="663" width="42" height="42" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.4"/>
    <text x="95" y="691" text-anchor="middle" font-size="20" font-weight="700" fill="#db2777">A</text>
    <text x="132" y="676" font-size="16.4" font-weight="700" fill="#111827">Build schema</text>
