<g id="user"><rect class="card" x="80" y="155" width="340" height="172" rx="8" fill="#EFF6FF" stroke="#2563EB"/><rect class="icon" x="104" y="183" width="48" height="48" rx="8" fill="#fff" stroke="#2563EB"/><text class="iconText" x="128" y="215" text-anchor="middle" fill="#2563EB">{}</text><text class="cardTitle" x="172" y="200">Kotlin Caller</text><text class="body" x="172" y="233">uses extension functions</text><text class="body" x="172" y="258">keeps driver objects visible</text></g>
<g id="session"><rect class="card" x="535" y="155" width="385" height="172" rx="8" fill="#EFF6FF" stroke="#2563EB"/><rect class="icon" x="559" y="183" width="48" height="48" rx="8" fill="#fff" stroke="#2563EB"/><text class="iconText" x="583" y="215" text-anchor="middle" fill="#2563EB">S</text><text class="cardTitle" x="627" y="200">Session DSL</text><text class="body" x="627" y="233">cqlSession { ... }</text><text class="body" x="627" y="258">cqlSessionOf(...)</text></g>
<g id="statements"><rect class="card" x="1035" y="155" width="400" height="172" rx="8" fill="#FFF7ED" stroke="#EA580C"/><rect class="icon" x="1059" y="183" width="48" height="48" rx="8" fill="#fff" stroke="#EA580C"/><text class="iconText" x="1083" y="215" text-anchor="middle" fill="#EA580C">Q</text><text class="cardTitle" x="1127" y="200">Statement Builders</text><text class="body" x="1127" y="233">statementOf / simpleStatementOf</text><text class="body" x="1127" y="258">boundStatementOf / batchStatementOf</text></g>
<g id="driver"><rect class="card" x="1550" y="155" width="430" height="172" rx="8" fill="#F8FAFC" stroke="#64748B"/><rect class="icon" x="1574" y="183" width="48" height="48" rx="8" fill="#fff" stroke="#64748B"/><text class="iconText" x="1598" y="215" text-anchor="middle" fill="#64748B">D</text><text class="cardTitle" x="1642" y="200">DataStax Driver</text><text class="body" x="1642" y="233">CqlSession / AsyncCqlSession</text><text class="body" x="1642" y="258">Statement / Row / ResultSet</text></g>
<g id="coroutine"><rect class="card" x="230" y="485" width="420" height="180" rx="8" fill="#F0FDFA" stroke="#0D9488"/><rect class="icon" x="254" y="513" width="48" height="48" rx="8" fill="#fff" stroke="#0D9488"/><text class="iconText" x="278" y="545" text-anchor="middle" fill="#0D9488">↯</text><text class="cardTitle" x="322" y="530">Coroutine Bridge</text><text class="body" x="322" y="563">executeSuspending(...)</text><text class="body" x="322" y="588">prepareSuspending(...)</text><text class="body" x="322" y="613">awaits driver futures</text></g>
<g id="row"><rect class="card" x="795" y="485" width="430" height="180" rx="8" fill="#ECFDF5" stroke="#16A34A"/><rect class="icon" x="819" y="513" width="48" height="48" rx="8" fill="#fff" stroke="#16A34A"/><text class="iconText" x="843" y="545" text-anchor="middle" fill="#16A34A">R</text><text class="cardTitle" x="887" y="530">Row Mapping Helpers</text><text class="body" x="887" y="563">toMap / toNamedMap</text><text class="body" x="887" y="588">mapWithCqlIdentifier</text><text class="body" x="887" y="613">codec-aware decoding</text></g>
<g id="values"><rect class="card" x="1370" y="485" width="430" height="180" rx="8" fill="#ECFDF5" stroke="#16A34A"/><rect class="icon" x="1394" y="513" width="48" height="48" rx="8" fill="#fff" stroke="#16A34A"/><text class="iconText" x="1418" y="545" text-anchor="middle" fill="#16A34A">T</text><text class="cardTitle" x="1462" y="530">Typed Value Access</text><text class="body" x="1462" y="563">getValue / getList / getMap</text><text class="body" x="1462" y="588">setValue / setList / setMap</text><text class="body" x="1462" y="613">name, id, or index based</text></g>
<g id="querybuilder"><rect class="card" x="380" y="825" width="440" height="185" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><rect class="icon" x="404" y="853" width="48" height="48" rx="8" fill="#fff" stroke="#7C3AED"/><text class="iconText" x="428" y="885" text-anchor="middle" fill="#7C3AED">B</text><text class="cardTitle" x="472" y="870">QueryBuilder Extensions</text><text class="body" x="472" y="903">bindMarker / raw / udt</text><text class="body" x="472" y="928">relation and term helpers</text><text class="body" x="472" y="953">schema/query DSL stays driver-native</text></g>
<g id="admin"><rect class="card" x="1040" y="825" width="450" height="185" rx="8" fill="#FEF2F2" stroke="#DC2626"/><rect class="icon" x="1064" y="853" width="48" height="48" rx="8" fill="#fff" stroke="#DC2626"/><text class="iconText" x="1088" y="885" text-anchor="middle" fill="#DC2626">A</text><text class="cardTitle" x="1132" y="870">Admin Utilities</text><text class="body" x="1132" y="903">create/drop keyspace</text><text class="body" x="1132" y="928">read system.local release_version</text><text class="body" x="1132" y="953">validates keyspace names</text></g></g>
