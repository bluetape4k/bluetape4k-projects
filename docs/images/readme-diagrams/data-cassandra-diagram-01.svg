<svg data-intent="Explain Cassandra data access responsibilities by separating repository code, CqlSession DSL helpers, statement builders, row/gettable mapping, and Cassandra cluster access." data-evidence="data/cassandra/README.md; data/cassandra/src/main/kotlin" data-source-read="data/cassandra/README.md; data/cassandra/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1740" height="1120" viewBox="0 0 1740 1120" role="img" aria-label="Cassandra Data Access Layer">
<defs>
