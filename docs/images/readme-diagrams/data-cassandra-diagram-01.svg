    <rect x="1154" y="553" width="42" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="1175" y="581" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">V</text>
