<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1120" viewBox="0 0 1740 1120" role="img" aria-label="Cassandra Data Access Layer">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M 0.7 0.7 L 5.4 3 L 0.7 5.3 Z" fill="context-stroke"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9 Z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3.2;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:11px;fill:#102033}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .dashed{stroke-dasharray:9 8}.inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inherit)}
    .small{font-family:"Comic Mono";font-size:12px;fill:#627184}.bitLabel{font-family:"Architects Daughter";font-size:22px;fill:#22344A}.bitMeta{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1740" height="1120"/>
<rect class="frame" x="34" y="30" width="1672" height="1060" rx="30"/>
<text class="title" x="72" y="86">Cassandra Data Access Layer</text>
<text class="subtitle" x="76" y="118">Application code, bluetape4k extensions, driver types, and Cassandra runtime stay in clear responsibility bands.</text>
<g><rect class="panel" x="80" y="155" width="1580" height="145" rx="22"/><text class="panelTitle" x="104" y="189">Application intent</text></g>
<g><rect class="panel" x="80" y="350" width="1580" height="210" rx="22"/><text class="panelTitle" x="104" y="384">bluetape4k Cassandra extensions</text></g>
<g><rect class="panel" x="80" y="620" width="1580" height="190" rx="22"/><text class="panelTitle" x="104" y="654">DataStax driver model</text></g>
<g><rect class="panel" x="80" y="870" width="1580" height="125" rx="22"/><text class="panelTitle" x="104" y="904">Cassandra runtime</text></g>
<g id="repo"><rect class="card" x="170" y="205" width="310" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="325" y="236" text-anchor="middle">Repository code</text><text class="detail" x="325" y="271" text-anchor="middle">domain query intent</text></g>
<g id="admin"><rect class="card" x="670" y="205" width="300" height="78" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="820" y="236" text-anchor="middle">Admin tasks</text><text class="detail" x="820" y="271" text-anchor="middle">keyspace + version checks</text></g>
<g id="entity"><rect class="card" x="1220" y="205" width="310" height="78" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="1375" y="236" text-anchor="middle">Entity mapping</text><text class="detail" x="1375" y="271" text-anchor="middle">row to domain object</text></g>
<g id="session"><rect class="card" x="230" y="430" width="330" height="96" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="395" y="461" text-anchor="middle">CqlSession DSL</text><text class="detail" x="395" y="496" text-anchor="middle">cqlSession { }</text><text class="detail" x="395" y="514" text-anchor="middle">contact points</text></g>
<g id="async"><rect class="card" x="610" y="430" width="330" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/><text class="cardTitle" x="775" y="461" text-anchor="middle">Coroutine queries</text><text class="detail" x="775" y="496" text-anchor="middle">executeSuspending</text><text class="detail" x="775" y="514" text-anchor="middle">prepareSuspending</text></g>
<g id="qb"><rect class="card" x="965" y="430" width="310" height="96" rx="14" fill="#FDECEF" stroke="#DC6B82"/><text class="cardTitle" x="1120" y="461" text-anchor="middle">QueryBuilder helpers</text><text class="detail" x="1120" y="496" text-anchor="middle">terms, relations</text><text class="detail" x="1120" y="514" text-anchor="middle">statements</text></g>
<g id="row"><rect class="card" x="1305" y="430" width="310" height="96" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1460" y="461" text-anchor="middle">Row / Gettable</text><text class="detail" x="1460" y="496" text-anchor="middle">typed value access</text><text class="detail" x="1460" y="514" text-anchor="middle">toMap helpers</text></g>
<g id="cql"><rect class="card" x="250" y="685" width="330" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/><text class="cardTitle" x="415" y="712" text-anchor="middle">CqlSession /</text><text class="cardTitle" x="415" y="735" text-anchor="middle">AsyncCqlSession</text><text class="detail" x="415" y="770" text-anchor="middle">driver sessions</text><text class="detail" x="415" y="788" text-anchor="middle">sync + async execution</text></g>
<g id="stmt"><rect class="card" x="975" y="710" width="290" height="72" rx="14" fill="#FFF3D9" stroke="#D6A441"/><text class="cardTitle" x="1120" y="738" text-anchor="middle">Statement model</text><text class="detail" x="1120" y="773" text-anchor="middle">Simple / Bound / Batch</text></g>
<g id="result"><rect class="card" x="1315" y="710" width="290" height="72" rx="14" fill="#EAF7EF" stroke="#58A978"/><text class="cardTitle" x="1460" y="738" text-anchor="middle">Row / ResultSet</text><text class="detail" x="1460" y="773" text-anchor="middle">driver data shape</text></g>
<g id="cluster"><rect class="card" x="610" y="902" width="900" height="82" rx="14" fill="#F1ECFF" stroke="#8A72D6"/><text class="cardTitle" x="1060" y="935" text-anchor="middle">Cassandra cluster</text><text class="detail" x="1060" y="970" text-anchor="middle">keyspaces, tables, indexes</text></g>
<path class="flow" d="M325 283 L325 320 L500 320 L500 430" stroke="#2E8F89"/>
<path class="flow" d="M820 283 L820 340 L545 340 L545 430" stroke="#755BC6"/>
<path class="flow" d="M1375 283 L1375 430" stroke="#B9851B"/>
<path class="flow" d="M395 526 L395 685" stroke="#2E8F89"/>
<path class="flow" d="M775 526 L775 610 L465 610 L465 685" stroke="#4F83BF"/>
<path class="flow" d="M1120 526 L1120 710" stroke="#C94D68"/>
<path class="flow" d="M1460 526 L1460 710" stroke="#3E9868"/>
<path class="flow" d="M415 797 L415 842 L750 842 L750 902" stroke="#2E8F89"/>
<path class="flow" d="M1120 782 L1120 902" stroke="#B9851B"/>
<path class="flow" d="M1460 782 L1460 902" stroke="#3E9868"/>
<g><rect x="190" y="1030" width="1360" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.5"/><text class="small" x="870" y="1055" text-anchor="middle">Layered, not snake-shaped: each extension family drops to the driver/runtime layer through the nearest clear lane.</text></g>
</svg>
