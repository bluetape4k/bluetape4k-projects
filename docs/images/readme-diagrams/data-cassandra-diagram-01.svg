    <line x1="260" y1="0" x2="302" y2="0" stroke="#ea580c" stroke-width="2.8" marker-end="url(#arrow-orange)"/><text x="318" y="5" font-size="13" fill="#475569">statement building</text>
    <line x1="560" y1="0" x2="602" y2="0" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arrow-green)"/><text x="618" y="5" font-size="13" fill="#475569">coroutine bridge</text>
    <line x1="830" y1="0" x2="872" y2="0" stroke="#7c3aed" stroke-width="2.8" marker-end="url(#arrow-purple)"/><text x="888" y="5" font-size="13" fill="#475569">row/value mapping</text>
