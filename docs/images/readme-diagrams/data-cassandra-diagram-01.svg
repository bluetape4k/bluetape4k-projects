  <g class="cards">

  <g class="card" data-card="Create session">
    <rect x="60" y="205" width="272" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="74" y="223" width="42" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="95" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">S</text>
    <text x="132" y="236" font-size="16.4" font-weight="700" fill="#111827">Create session</text>
    <text x="132" y="261" font-size="12.4" fill="#475569">builder or factory call</text>
  </g>

  <g class="card" data-card="Session DSL">
    <rect x="420" y="205" width="272" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="434" y="223" width="42" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="455" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">K</text>
    <text x="492" y="236" font-size="16.4" font-weight="700" fill="#111827">Session DSL</text>
    <text x="492" y="261" font-size="12.4" fill="#475569">cqlSession { ... }</text>
<text x="492" y="279" font-size="12.4" fill="#475569">cqlSessionOf(...)</text>
  </g>

  <g class="card" data-card="CqlSessionBuilder">
    <rect x="780" y="205" width="272" height="82" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <rect x="794" y="223" width="42" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
    <text x="815" y="251" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">D</text>
    <text x="852" y="236" font-size="16.4" font-weight="700" fill="#111827">CqlSessionBuilder</text>
    <text x="852" y="261" font-size="12.4" fill="#475569">contact point / keyspace</text>
<text x="852" y="279" font-size="12.4" fill="#475569">datacenter / auth</text>
  </g>

  <g class="card" data-card="CqlSession">
    <rect x="1140" y="205" width="272" height="82" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
