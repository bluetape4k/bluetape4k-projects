    <text x="455" y="361" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">B</text>
    <text x="492" y="346" font-size="16.4" font-weight="700" fill="#111827">Statement DSL</text>
    <text x="492" y="371" font-size="12.4" fill="#475569">statementOf(...)</text>
<text x="492" y="389" font-size="12.4" fill="#475569">bound/batch builders</text>
  </g>

  <g class="card" data-card="Driver Statement">
    <rect x="780" y="315" width="272" height="82" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <rect x="794" y="333" width="42" height="42" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
