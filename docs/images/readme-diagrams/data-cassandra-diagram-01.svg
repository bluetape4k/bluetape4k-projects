    <rect x="794" y="553" width="42" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.4"/>
    <text x="815" y="581" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">T</text>
    <text x="852" y="566" font-size="16.4" font-weight="700" fill="#111827">Codec / Column API</text>
    <text x="852" y="591" font-size="12.4" fill="#475569">codec-aware decode</text>
<text x="852" y="609" font-size="12.4" fill="#475569">name / id / index</text>
  </g>

  <g class="card" data-card="Kotlin Values">
