<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="880" viewBox="0 0 1540 880" role="img" aria-label="Cassandra extension function API overview">
  <style>text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }</style>

  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-pink" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#db2777" stroke="#db2777" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrow-slate" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" viewBox="0 0 10 10" refX="9" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>
  <rect width="1540" height="880" fill="#ffffff"/>
  <text x="72" y="62" font-size="30" font-weight="700" fill="#111827">Cassandra Extension Function API Overview</text>
  <text x="72" y="92" font-size="15" fill="#64748b">Each row maps a public feature family to the DataStax driver primitive it creates, awaits, reads, or administers.</text>

  <g class="layer" data-layer="CALLER INTENT">
    <rect x="48" y="126" width="320" height="620" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="68" y="154" font-size="14" font-weight="700" fill="#2563eb">CALLER INTENT</text>
    <text x="68" y="176" font-size="12.2" fill="#64748b">What application code wants to do.</text>
  </g>

  <g class="layer" data-layer="BLUETAPE4K EXTENSIONS">
    <rect x="408" y="126" width="320" height="620" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="428" y="154" font-size="14" font-weight="700" fill="#16a34a">BLUETAPE4K EXTENSIONS</text>
    <text x="428" y="176" font-size="12.2" fill="#64748b">Kotlin-friendly extension entrypoints.</text>
  </g>

  <g class="layer" data-layer="DATASTAX DRIVER">
    <rect x="768" y="126" width="320" height="620" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="788" y="154" font-size="14" font-weight="700" fill="#ea580c">DATASTAX DRIVER</text>
    <text x="788" y="176" font-size="12.2" fill="#64748b">Native builder/session/data APIs.</text>
  </g>

  <g class="layer" data-layer="RUNTIME RESULT">
    <rect x="1128" y="126" width="320" height="620" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="1148" y="154" font-size="14" font-weight="700" fill="#64748b">RUNTIME RESULT</text>
    <text x="1148" y="176" font-size="12.2" fill="#64748b">Driver-visible object or effect.</text>
  </g>
  <g class="edges">

    <path class="edge" d="M332 246 L420 246" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <path class="edge" d="M692 246 L780 246" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <path class="edge" d="M1052 246 L1140 246" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>

