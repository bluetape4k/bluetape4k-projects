    <text x="852" y="371" font-size="12.4" fill="#475569">Simple / Bound / Batch</text>
<text x="852" y="389" font-size="12.4" fill="#475569">PrepareRequest</text>
  </g>

  <g class="card" data-card="Executable CQL">
    <rect x="1140" y="315" width="272" height="82" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <rect x="1154" y="333" width="42" height="42" rx="8" fill="#ffffff" stroke="#ea580c" stroke-width="1.4"/>
    <text x="1175" y="361" text-anchor="middle" font-size="20" font-weight="700" fill="#ea580c">E</text>
    <text x="1212" y="346" font-size="16.4" font-weight="700" fill="#111827">Executable CQL</text>
    <text x="1212" y="371" font-size="12.4" fill="#475569">sent through session</text>
  </g>

  <g class="card" data-card="Run async query">
    <rect x="60" y="425" width="272" height="82" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="74" y="443" width="42" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="95" y="471" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">A</text>
