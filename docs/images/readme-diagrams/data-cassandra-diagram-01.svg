  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle">«extensionFunctions»</text>
  <text class="label" x="190" y="61" text-anchor="middle">CassandraExtensions</text>
  <text class="mono" x="18" y="108">+CqlSession.executeAsFlow~T~(stmt): Flow~T~</text>
<text class="mono" x="18" y="129">+CqlSession.executeAsync~T~(stmt): Deferred~T~</text>
