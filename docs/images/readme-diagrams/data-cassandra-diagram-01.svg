    <path class="edge" d="M1052 356 L1140 356" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>

    <path class="edge" d="M332 466 L420 466" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
