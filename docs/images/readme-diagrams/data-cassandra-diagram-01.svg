    <text x="132" y="481" font-size="12.4" fill="#475569">suspend function call</text>
  </g>

  <g class="card" data-card="Coroutine Bridge">
    <rect x="420" y="425" width="272" height="82" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <rect x="434" y="443" width="42" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
    <text x="455" y="471" text-anchor="middle" font-size="20" font-weight="700" fill="#16a34a">C</text>
