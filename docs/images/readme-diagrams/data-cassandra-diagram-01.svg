    <rect x="1154" y="663" width="42" height="42" rx="8" fill="#ffffff" stroke="#db2777" stroke-width="1.4"/>
    <text x="1175" y="691" text-anchor="middle" font-size="20" font-weight="700" fill="#db2777">K</text>
