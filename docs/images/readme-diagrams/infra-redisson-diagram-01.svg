<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1180" viewBox="0 0 1900 1180" role="img" aria-label="Redisson Codec Hierarchy">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="hollowNavy" markerWidth="18" markerHeight="16" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 16 8 L 2 14 Z" fill="#FFFFFF" stroke="#334155" stroke-width="2.3" stroke-linejoin="round"/>
    </marker>
    <marker id="openPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="openOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:50px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#475569;font-weight:700}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6}
      .panelTitle{font-family:"Architects Daughter";font-size:30px;fill:#0F172A}
      .card{filter:url(#softShadow);stroke-width:2.2}
      .base{fill:#F8FAFC;stroke:#64748B;stroke-dasharray:8 8}
      .factory{fill:#EFF6FF;stroke:#2563EB}
      .serializer{fill:#FAF5FF;stroke:#9333EA}
      .compressor{fill:#F0FDFA;stroke:#0D9488}
      .composite{fill:#FFF7ED;stroke:#EA580C}
      .note{fill:#FDF2F8;stroke:#DB2777}
      .name{font-family:"Architects Daughter";font-size:26px;fill:#0F172A}
      .smallName{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .meta{font-family:"Comic Mono";font-size:14px;fill:#475569;font-weight:700}
      .tiny{font-family:"Comic Mono";font-size:12px;fill:#475569;font-weight:700}
      .extends{fill:none;stroke:#334155;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#hollowNavy)}
      .uses{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 8}
      .purple{stroke:#9333EA;marker-end:url(#openPurple)}
      .teal{stroke:#0D9488;marker-end:url(#openTeal)}
      .orange{stroke:#EA580C;marker-end:url(#openOrange)}
    </style>
  </defs>

  <rect class="canvas" width="1900" height="1180"/>
  <rect class="frame" x="36" y="34" width="1828" height="1112" rx="8"/>

  <text class="title" x="82" y="100">Redisson Codec Hierarchy</text>
  <text class="subtitle" x="86" y="134">Custom codecs extend Redisson BaseCodec; RedissonCodecs exposes serializer, compression, composite, and use-case factory selections.</text>

  <g id="base-panel">
    <rect class="panel" x="90" y="184" width="1720" height="176" rx="8"/>
    <text class="panelTitle" x="124" y="230">Base types and factory object</text>
  </g>
  <g id="serializer-panel">
    <rect class="panel" x="90" y="424" width="1720" height="296" rx="8"/>
    <text class="panelTitle" x="124" y="470">Codecs</text>
  </g>
  <g id="factory-panel">
    <rect class="panel" x="90" y="790" width="1720" height="250" rx="8"/>
    <text class="panelTitle" x="124" y="836">RedissonCodecs selections</text>
  </g>

  <g id="codec-interface">
    <rect class="card base" x="154" y="270" width="250" height="62" rx="8"/>
    <text class="smallName" x="279" y="308" text-anchor="middle">Codec</text>
  </g>
  <g id="base-codec">
    <rect class="card base" x="498" y="256" width="286" height="90" rx="8"/>
    <text class="smallName" x="641" y="292" text-anchor="middle">BaseCodec</text>
    <text class="meta" x="641" y="318" text-anchor="middle">valueEncoder / valueDecoder</text>
  </g>
  <g id="redisson-codecs">
    <rect class="card factory" x="1034" y="246" width="376" height="110" rx="8"/>
    <text class="name" x="1222" y="282" text-anchor="middle">RedissonCodecs</text>
    <text class="meta" x="1222" y="312" text-anchor="middle">lazy constants and factory methods</text>
    <text class="meta" x="1222" y="335" text-anchor="middle">forCache, forCacheMap, jackson3</text>
  </g>
  <g id="builtins">
    <rect class="card base" x="1512" y="256" width="246" height="90" rx="8"/>
    <text class="smallName" x="1635" y="292" text-anchor="middle">Redisson built-ins</text>
    <text class="meta" x="1635" y="318" text-anchor="middle">Kryo5, JDK, String, numeric</text>
  </g>

  <g id="fory">
    <rect class="card serializer" x="150" y="524" width="260" height="96" rx="8"/>
    <text class="smallName" x="280" y="558" text-anchor="middle">ForyCodec</text>
    <text class="meta" x="280" y="584" text-anchor="middle">Fory serializer</text>
    <text class="meta" x="280" y="607" text-anchor="middle">fallback: Kryo5</text>
  </g>
  <g id="fast-fory">
    <rect class="card serializer" x="444" y="524" width="260" height="96" rx="8"/>
    <text class="smallName" x="574" y="558" text-anchor="middle">FastForyCodec</text>
    <text class="meta" x="574" y="584" text-anchor="middle">SCHEMA_CONSISTENT</text>
    <text class="meta" x="574" y="607" text-anchor="middle">volatile cache only</text>
  </g>
  <g id="jackson3">
    <rect class="card serializer" x="738" y="524" width="260" height="96" rx="8"/>
    <text class="smallName" x="868" y="558" text-anchor="middle">Jackson3Codec</text>
    <text class="meta" x="868" y="584" text-anchor="middle">JSON envelope</text>
    <text class="meta" x="868" y="607" text-anchor="middle">allowedPackagePrefixes</text>
  </g>
  <g id="fastjson2">
    <rect class="card serializer" x="1032" y="524" width="260" height="96" rx="8"/>
    <text class="smallName" x="1162" y="558" text-anchor="middle">Fastjson2Codec</text>
    <text class="meta" x="1162" y="584" text-anchor="middle">className + JSONB</text>
    <text class="meta" x="1162" y="607" text-anchor="middle">pre-instantiation check</text>
  </g>
  <g id="compressors">
    <rect class="card compressor" x="1326" y="524" width="260" height="96" rx="8"/>
    <text class="smallName" x="1456" y="558" text-anchor="middle">Compression wrappers</text>
    <text class="meta" x="1456" y="584" text-anchor="middle">Lz4Codec, ZstdCodec</text>
    <text class="meta" x="1456" y="607" text-anchor="middle">GzipCodec + innerCodec</text>
  </g>
  <g id="composite">
    <rect class="card composite" x="150" y="654" width="1436" height="42" rx="8"/>
    <text class="meta" x="868" y="681" text-anchor="middle">CompositeCodec combines String key codec with the chosen value codec for maps, sets, and local cached maps.</text>
  </g>

  <path class="extends" d="M 280 524 V 424 H 641 V 354"/>
  <path class="extends" d="M 574 524 V 444 H 641 V 354"/>
  <path class="extends" d="M 868 524 V 444 H 641 V 354"/>
  <path class="extends" d="M 1162 524 V 444 H 641 V 354"/>
  <path class="extends" d="M 1456 524 V 424 H 641 V 354"/>

  <path class="uses purple" d="M 1410 302 H 1500"/>

  <g id="raw-codecs">
    <rect class="card serializer" x="150" y="876" width="306" height="96" rx="8"/>
    <text class="smallName" x="303" y="910" text-anchor="middle">Serializer constants</text>
    <text class="meta" x="303" y="936" text-anchor="middle">Fory, FastFory, Kryo5, Jdk</text>
    <text class="meta" x="303" y="959" text-anchor="middle">Jackson3, Fastjson2</text>
  </g>
  <g id="compressed-codecs">
    <rect class="card compressor" x="516" y="876" width="306" height="96" rx="8"/>
    <text class="smallName" x="669" y="910" text-anchor="middle">Compressed constants</text>
    <text class="meta" x="669" y="936" text-anchor="middle">LZ4*, Zstd*, Snappy*, Gzip*</text>
    <text class="meta" x="669" y="959" text-anchor="middle">wrapper around serializer codec</text>
  </g>
  <g id="composite-codecs">
    <rect class="card composite" x="882" y="876" width="306" height="96" rx="8"/>
    <text class="smallName" x="1035" y="910" text-anchor="middle">Composite constants</text>
    <text class="meta" x="1035" y="936" text-anchor="middle">String key + value codec</text>
    <text class="meta" x="1035" y="959" text-anchor="middle">for RMap / RLocalCachedMap</text>
  </g>
  <g id="usecase-codecs">
    <rect class="card factory" x="1248" y="876" width="346" height="96" rx="8"/>
    <text class="smallName" x="1421" y="910" text-anchor="middle">Use-case factories</text>
    <text class="meta" x="1421" y="936" text-anchor="middle">forCache, forSmallValue, forArchival</text>
    <text class="meta" x="1421" y="959" text-anchor="middle">forHighThroughput, forCompatibility</text>
  </g>

  <g id="warning-note">
    <rect class="card note" x="404" y="1068" width="1092" height="46" rx="8"/>
    <text class="meta" x="950" y="1096" text-anchor="middle">FastFory wire format is not readable by ForyCodec; JSON codecs need allowed prefixes outside trusted internal Redis boundaries.</text>
  </g>
</svg>
