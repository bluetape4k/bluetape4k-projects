<svg xmlns="http://www.w3.org/2000/svg" width="1766" height="939" viewBox="0 0 1766 939" role="img" aria-label="Redisson Codec Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1766" height="939"/>
<rect class="frame" x="32" y="28" width="1702" height="883" rx="30"/>
<text class="title" x="68" y="84">Redisson Codec Class Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="RedissonCodecs" data-to="ForyCodec" data-route-color="teal" d="M703 271 L430 271 L430 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonCodecs" data-to="FastForyCodec" data-route-color="amber" d="M786 303 L786 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonCodecs" data-to="JsonCodecs" data-route-color="pink" d="M981 303 L981 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="RedissonCodecs" data-to="BuiltinCodecs" data-route-color="purple" d="M1063 271 L1336 271 L1336 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ForyCodec" data-to="CompressionWrappers" data-route-color="olive" d="M396 536 L396 631" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="dependency" data-from="FastForyCodec" data-to="CompressionWrappers" data-route-color="indigo" d="M591 536 L591 631" stroke="#4F63C7" stroke-dasharray="8 7"/>
<path class="dependency" data-from="JsonCodecs" data-to="CompositeCodecs" data-route-color="coral" d="M1176 536 L1176 631" stroke="#C8644B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="BuiltinCodecs" data-to="CompositeCodecs" data-route-color="brown" d="M1371 536 L1371 631" stroke="#8E6D43" stroke-dasharray="8 7"/>
<g id="RedissonCodecs">
  <rect class="classCard" x="703" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="883" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="883" y="212" text-anchor="middle">RedissonCodecs</text>
  <line x1="703" y1="221" x2="1063" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="737" y="258">Default = Fory</text>
<text class="member" x="737" y="275">named serializer/compression choices</text>
</g>
<g id="ForyCodec">
  <rect class="classCard" x="118" y="398" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="298" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="298" y="445" text-anchor="middle">ForyCodec</text>
  <line x1="118" y1="454" x2="478" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="152" y="491">Fory bytes</text>
<text class="member" x="152" y="508">fallback to Kryo5</text>
</g>
<g id="FastForyCodec">
  <rect class="classCard" x="508" y="398" width="360" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">FastForyCodec</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="542" y="491">SCHEMA_CONSISTENT</text>
<text class="member" x="542" y="508">volatile caches only</text>
</g>
<g id="JsonCodecs">
  <rect class="classCard" x="898" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1078" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="445" text-anchor="middle">JSON codecs</text>
  <line x1="898" y1="454" x2="1258" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="932" y="491">Jackson3Codec</text>
<text class="member" x="932" y="508">Fastjson2Codec</text>
</g>
<g id="BuiltinCodecs">
  <rect class="classCard" x="1288" y="398" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1468" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1468" y="445" text-anchor="middle">Built-in codecs</text>
  <line x1="1288" y1="454" x2="1648" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1322" y="491">Kryo5, JDK</text>
<text class="member" x="1322" y="508">String, Int, Long, Double</text>
</g>
<g id="CompressionWrappers">
  <rect class="classCard" x="313" y="631" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="493" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="493" y="678" text-anchor="middle">Compression wrappers</text>
  <line x1="313" y1="687" x2="673" y2="687" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="347" y="724">Lz4Codec, ZstdCodec, GzipCodec</text>
<text class="member" x="347" y="741">SnappyCodecV2 wrappers</text>
</g>
<g id="CompositeCodecs">
  <rect class="classCard" x="1093" y="631" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1273" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1273" y="678" text-anchor="middle">Composite codecs</text>
  <line x1="1093" y1="687" x2="1453" y2="687" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1127" y="724">String key codec</text>
<text class="member" x="1127" y="741">value codec from selected family</text>
</g>
<g>
  <rect x="1351" y="831" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1369 849 L1427 849" stroke="#3E9868"/>
  <text class="detail" x="1441" y="854">inheritance / implementation</text>
  <path class="dependency" d="M1369 870 L1427 870" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1441" y="875">dependency / usage</text>
</g>
<g><rect x="180" y="849" width="1126" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="743" y="875" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
