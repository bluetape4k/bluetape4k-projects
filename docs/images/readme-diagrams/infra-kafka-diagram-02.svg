<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1299" viewBox="0 0 1560 1299" role="img" aria-label="Kafka Streams Processing Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inheritArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .flow{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .inherit{fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1560" height="1299"/>
<rect class="frame" x="32" y="28" width="1496" height="1243" rx="30"/>
<text class="title" x="68" y="84">Kafka Streams Processing Flow</text>
<text class="subtitle" x="72" y="116">Source-checked flow redrawn as layered phases with routed, non-grid transitions.</text>
<g><rect class="panel" x="78" y="165" width="1404" height="264" rx="22"/><text class="panelTitle" x="102" y="191" dominant-baseline="middle">Entry phase</text></g>
<g><rect class="panel" x="78" y="511" width="1404" height="264" rx="22"/><text class="panelTitle" x="102" y="537" dominant-baseline="middle">Decision phase</text></g>
<g><rect class="panel" x="78" y="857" width="1404" height="264" rx="22"/><text class="panelTitle" x="102" y="883" dominant-baseline="middle">Execution phase</text></g>
<path class="flow" d="M463 321 L571 321" stroke="#4F83BF"/>
<path class="flow" d="M881 321 L989 321" stroke="#3E9868"/>
<path class="flow" d="M1144 377 L1144 494 L54 494 L54 667 L153 667" stroke="#B9851B"/>
<path class="flow" d="M463 667 L780 667" stroke="#755BC6"/>
<path class="flow" d="M935 723 L935 840 L54 840 L54 1013 L153 1013" stroke="#2E8F89"/>
<path class="flow" d="M463 1013 L780 1013" stroke="#C94D68"/>
<g id="node-0-0">
    <rect class="card" x="153" y="265" width="310" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>

    <text class="cardTitle" x="308" y="327" text-anchor="middle">Input Topic</text>

  </g>
<g id="node-0-1">
    <rect class="card" x="571" y="265" width="310" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>

    <text class="cardTitle" x="726" y="327" text-anchor="middle">KStream</text>

  </g>
<g id="node-0-2">
    <rect class="card" x="989" y="265" width="310" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>

    <text class="cardTitle" x="1144" y="327" text-anchor="middle">Transformed KStream</text>

  </g>
<g id="node-1-0">
    <rect class="card" x="153" y="611" width="310" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>

    <text class="cardTitle" x="308" y="673" text-anchor="middle">KGroupedStream</text>

  </g>
<g id="node-1-1">
    <rect class="card" x="780" y="611" width="310" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>

    <text class="cardTitle" x="935" y="673" text-anchor="middle">KTable</text>

  </g>
<g id="node-2-0">
    <rect class="card" x="153" y="957" width="310" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>

    <text class="cardTitle" x="308" y="1019" text-anchor="middle">Output KStream</text>

  </g>
<g id="node-2-1">
    <rect class="card" x="780" y="957" width="310" height="112" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>

    <text class="cardTitle" x="935" y="1019" text-anchor="middle">Output Topic</text>

  </g>
<g><rect x="190" y="1207" width="1180" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="780" y="1233" text-anchor="middle">Graphviz evidence: phases are layered and connectors follow short orthogonal lanes.</text></g>
</svg>
