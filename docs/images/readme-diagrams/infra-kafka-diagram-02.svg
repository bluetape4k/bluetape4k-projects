<svg data-intent="Explain the Kafka Streams topology as the reader writes it: source topic, stream creation, key grouping, materialized count table, stream conversion, produced output." data-evidence="infra/kafka/README.md; docs/superpowers/specs/2026-05-03-kafka4-module-design.md" data-source-read="infra/kafka/README.md" xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" role="img" aria-label="Kafka Streams Topology Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="860"/>
<rect class="frame" x="34" y="30" width="1432" height="800" rx="32"/>
<text class="title" x="72" y="84">Kafka Streams Topology Flow</text>
<text class="subtitle" x="76" y="116">The diagram follows the DSL order and keeps Serde and materialized-store configuration tied to the topology step that consumes it.</text>
<g id="inputTopic">
  <rect class="card" x="130" y="260" width="300" height="82" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="280" y="294" text-anchor="middle" dominant-baseline="middle">Input topic</text>
  <text class="detail" x="280" y="324" text-anchor="middle" dominant-baseline="middle">keyed records</text>
</g>
<g id="topology">
  <rect class="card" x="560" y="220" width="390" height="142" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="755" y="266" text-anchor="middle" dominant-baseline="middle">Streams topology DSL</text>
  <text class="detail" x="755" y="296" text-anchor="middle" dominant-baseline="middle">stream -&gt; groupByKey</text>
  <text class="detail" x="755" y="314" text-anchor="middle" dominant-baseline="middle">count(materialized)</text>
  <text class="detail" x="755" y="332" text-anchor="middle" dominant-baseline="middle">toStream -&gt; to(output)</text>
</g>
<g id="serdeConfig">
  <rect class="card" x="1080" y="180" width="330" height="110" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1245" y="228" text-anchor="middle" dominant-baseline="middle">Serde configuration</text>
  <text class="detail" x="1245" y="258" text-anchor="middle" dominant-baseline="middle">Consumed, Grouped, Produced</text>
</g>
<g id="stateStore">
  <rect class="card" x="1080" y="410" width="330" height="104" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1245" y="455" text-anchor="middle" dominant-baseline="middle">Materialized state store</text>
  <text class="detail" x="1245" y="485" text-anchor="middle" dominant-baseline="middle">count KTable backing store</text>
</g>
<g id="outputTopic">
  <rect class="card" x="560" y="660" width="390" height="82" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="755" y="694" text-anchor="middle" dominant-baseline="middle">Output topic</text>
  <text class="detail" x="755" y="724" text-anchor="middle" dominant-baseline="middle">processed stream result</text>
</g>
<path class="route" data-from="inputTopic" data-to="topology" d="M430 301 L560 291" stroke="#4F83BF"/>
<path class="route" data-from="topology" data-to="serdeConfig" d="M950 291 L1080 235" stroke="#755BC6"/>
<path class="route" data-from="topology" data-to="stateStore" d="M950 310 L1080 462" stroke="#B9851B"/>
<path class="route" data-from="topology" data-to="outputTopic" d="M755 362 L755 660" stroke="#3E9868"/>
<path class="route dashed" data-from="stateStore" data-to="outputTopic" d="M1080 462 L960 462 L960 701 L950 701" stroke="#B9851B"/>
</svg>
