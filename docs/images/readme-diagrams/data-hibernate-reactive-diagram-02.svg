8" text-anchor="middle">stateless</text></g><g class="edgeLabel" transform="translate(1447.25 960)"><rect width="85.5" height="27" rx="8"/><text x="42.75" y="18" text-anchor="middle">stateless</text></g><g class="edgeLabel" transform="translate(1021 761)"><rect width="138" height="27" rx="8"/><text x="69" y="18" text-anchor="middle">coroutine bridge</text></g></g><g><rect class="umlBox" x="120" y="205" width="500" height="185" rx="8" fill="#F0FDFA" stroke="#0D9488"/><line x1="120" y1="267" x2="620" y2="267" stroke="#0D9488"/><line x1="120" y1="321" x2="620" y2="321" stroke="#0D9488"/><text class="stereo" x="370" y="228" text-anchor="middle">&lt;&lt;Mutiny extension file&gt;&gt;</text><text class="classTitle" x="370" y="254" text-anchor="middle">SessionFactorySupport</text><text class="member" x="142" y="291">withSessionSuspending</text><text class="member" x="142" y="311">withTransactionSuspending</text><text class="member" x="142" y="347">async(currentVertxDispatcher()).asUni()</text><text class="member" x="142" y="367">awaitSuspending()</text></g><g><rect class="umlBox" x="1560" y="205" width="500" height="185" rx="8" fill="#EFF6FF" stroke="#2563EB"/><line x1="1560" y1="267" x2="2060" y2="267" stroke="#2563EB"/><line x1="1560" y1="321" x2="2060" y2="321" stroke="#2563EB"/><text class="stereo" x="1810" y="228" text-anchor="middle">&lt;&lt;Stage extension file&gt;&gt;</text><text class="classTitle" x="1810" y="254" text-anchor="middle">SessionFactorySupport</text><text class="member" x="1582" y="291">withSessionSuspending</text><text class="member" x="1582" y="311">withTransactionSuspending</text><text class="member" x="1582" y="347">async(currentVertxDispatcher()).asCompletableFuture()</text><text class="member" x="1582" y="367">await()</text></g><g><rect class="umlBox" x="120" y="530" width="500" height="205" rx="8" fill="#F0FDFA" stroke="#0D9488"/><line x1="120" y1="592" x2="620" y2="592" stroke="#0D9488"/><line x1="120" y1="646" x2="620" y2="646" stroke="#0D9488"/><text class="stereo" x="370" y="553" text-anchor="middle">&lt;&lt;Mutiny extension file&gt;&gt;</text><text class="classTitle" x="370" y="579" text-anchor="middle">SessionSupport</text><text class="member" x="142" y="616">findAs / getReferenceAs</text><text class="member" x="142" y="636">createQueryAs / createNativeQueryAs</text><text class="member" x="142" y="672">EntityGraph helpers</text><text class="member" x="142" y="692">ResultSetMapping helpers</text></g><g><rect class="umlBox" x="1560" y="530" width="500" height="205" rx="8" fill="#EFF6FF" stroke="#2563EB"/><line x1="1560" y1="592" x2="2060" y2="592" stroke="#2563EB"/><line x1="1560" y1="646" x2="2060" y2="646" stroke="#2563EB"/><text class="stereo" x="1810" y="553" text-anchor="middle">&lt;&lt;Stage extension file&gt;&gt;</text><text class="classTitle" x="1810" y="579" text-anchor="middle">SessionSupport</text><text class="member" x="1582" y="616">findAs / getReferenceAs</text><text class="member" x="1582" y="636">createQueryAs / createNativeQueryAs</text><text class="member" x="1582" y="672">CompletionStage results</text><text class="member" x="1582" y="692">same naming as Mutiny</text></g><g><rect class="umlBox" x="120" y="900" width="500" height="205" rx="8" fill="#FFF7ED" stroke="#EA580C"/><line x1="120" y1="962" x2="620" y2="962" stroke="#EA580C"/><line x1="120" y1="1016" x2="620" y2="1016" stroke="#EA580C"/><text class="stereo" x="370" y="923" text-anchor="middle">&lt;&lt;Mutiny stateless file&gt;&gt;</text><text class="classTitle" x="370" y="949" text-anchor="middle">StatelessSessionSupport</text><text class="member" x="142" y="986">getAs / create*QueryAs</text><text class="member" x="142" y="1006">EntityGraph helpers</text><text class="member" x="142" y="1042">Uni results</text><text class="member" x="142" y="1062">no first-level cache</text></g><g><rect class="umlBox" x="1560" y="900" width="500" height="205" rx="8" fill="#FFF7ED" stroke="#EA580C"/><line x1="1560" y1="962" x2="2060" y2="962" stroke="#EA580C"/><line x1="1560" y1="1016" x2="2060" y2="1016" stroke="#EA580C"/><text class="stereo" x="1810" y="923" text-anchor="middle">&lt;&lt;Stage stateless file&gt;&gt;</text><text class="classTitle" x="1810" y="949" text-anchor="middle">StatelessSessionSupport</text><text class="member" x="1582" y="986">getAs / create*QueryAs</text><text class="member" x="1582" y="1006">EntityGraph helpers</text><text class="member" x="1582" y="1042">CompletionStage results</text><text class="member" x="1582" y="1062">no first-level cache</text></g><g><rect class="umlBox" x="760" y="535" width="660" height="220" rx="8" fill="#F8FAFC" stroke="#64748B"/><line x1="760" y1="597" x2="1420" y2="597" stroke="#64748B"/><line x1="760" y1="651" x2="1420" y2="651" stroke="#64748B"/><text class="stereo" x="1090" y="558" text-anchor="middle">&lt;&lt;shared API contract&gt;&gt;</text><text class="classTitle" x="1090" y="584" text-anchor="middle">Same Kotlin Facade</text><text class="member" x="782" y="621">reified type parameters</text><text class="member" x="782" y="641">typed query creation</text><text class="member" x="782" y="661">graph/mapping lookup</text><text class="member" x="782" y="677">Mutiny returns Uni&lt;T&gt;</text><text class="member" x="782" y="697">Stage returns CompletionStage&lt;T&gt;</text><text class="member" x="782" y="717">same extension names across packages</text></g><g><rect class="umlBox" x="810" y="790" width="560" height="150" rx="8" fill="#F5F3FF" stroke="#7C3AED"/><line x1="810" y1="852" x2="1370" y2="852" stroke="#7C3AED"/><line x1="810" y1="906" x2="1370" y2="906" stroke="#7C3AED"/><text class="stereo" x="1090" y="813" text-anchor="middle">&lt;&lt;coroutine bridge&gt;&gt;</text><text class="classTitle" x="1090" y="839" text-anchor="middle">Suspending Factory Helpers</text><text class="member" x="832" y="876">withSessionSuspending</text><text class="member" x="832" y="896">withTransactionSuspending</text><text class="member" x="832" y="932">await Uni or CompletionStage</text><text class="member" x="832" y="952">rethrow CancellationException</text></g></svg>