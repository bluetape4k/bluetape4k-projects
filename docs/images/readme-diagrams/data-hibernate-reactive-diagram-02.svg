<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="1260" viewBox="0 0 2180 1260" role="img" aria-label="Hibernate Reactive API structure"><defs><filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0F172A" flood-opacity=".10"/></filter><style>svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}.canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}.title{font-family:"Architects Daughter";font-size:42px;fill:#0F172A}.subtitle,.sectionTitle{font-family:"Comic Mono";font-size:15px;fill:#475569}.section{fill:#F3F8FF;stroke:#94A3B8;stroke-width:1.6;stroke-dasharray:12 8}.umlBox{filter:url(#softShadow);stroke-width:2}.stereo{font-family:"Comic Mono";font-size:12px;fill:#475569}.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}.member{font-family:"Comic Mono";font-size:12.5px;fill:#475569}.edge{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}.open{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:none}.edgeLabel rect{fill:#fff;stroke:#CBD5E1;stroke-width:1.2;opacity:.96}.edgeLabel text{font-family:"Comic Mono";font-size:11.8px;fill:#475569}</style></defs><rect class="canvas" width="2180" height="1260"/><rect class="frame" x="34" y="30" width="2112" height="1194" rx="8"/><text class="title" x="76" y="86">Hibernate Reactive API Structure</text><text class="subtitle" x="78" y="118">Mutiny and Stage packages intentionally mirror names while preserving their native async return types.</text><rect class="section" x="62" y="140" width="2056" height="1000" rx="8"/><text class="sectionTitle" x="90" y="165">Dashed open arrows show package contributions to the shared Kotlin facade contract.</text><g><path class="edge" d="M 620 300 L 676 300 Q 690 300 690 314 L 690 571 Q 690 585 704 585 L 760 585" stroke="#0D