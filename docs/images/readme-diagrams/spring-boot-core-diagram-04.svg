<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="860" viewBox="0 0 1296 860" role="img" aria-label="WebClient dedicated resource configuration">
  <style>
    text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }
  </style>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b" stroke="#64748b" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
  </defs>
  <rect width="1296" height="860" fill="#ffffff"/>
  <text x="76" y="62" font-size="30" font-weight="700" fill="#111827">WebClient Dedicated Resource Configuration</text>
  <text x="76" y="92" font-size="15" fill="#64748b">AbstractWebClientConfig builds an isolated WebClient resource set from application-owned tuning inputs.</text>


  <g class="lane" data-lane="CONFIG INPUT">
    <rect x="54" y="132" width="310" height="620" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="72" y="158" font-size="14" font-weight="700" fill="#2563eb">CONFIG INPUT</text>
    <text x="72" y="179" font-size="12.5" fill="#6b7280">Application overrides and tuning values.</text>
  </g>

  <g class="lane" data-lane="BASE CONFIG BEANS">
    <rect x="430" y="132" width="318" height="620" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="448" y="158" font-size="14" font-weight="700" fill="#64748b">BASE CONFIG BEANS</text>
    <text x="448" y="179" font-size="12.5" fill="#6b7280">Beans produced by AbstractWebClientConfig.</text>
  </g>

  <g class="lane" data-lane="DEDICATED WEBCLIENT">
    <rect x="844" y="132" width="398" height="620" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5"/>
    <text x="862" y="158" font-size="14" font-weight="700" fill="#16a34a">DEDICATED WEBCLIENT</text>
    <text x="862" y="179" font-size="12.5" fill="#6b7280">Final client uses isolated Reactor resources.</text>
  </g>

  <path class="edge" d="M210 316 L210 390" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M 334 438 L 376 438 Q 390 438 390 424 L 390 262 Q 390 248 404 248 L 468 248" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M 334 438 L 376 438 Q 390 438 390 424 L 390 402 Q 390 388 404 388 L 468 388" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M 334 438 L 376 438 Q 390 438 390 452 L 390 514 Q 390 528 404 528 L 468 528" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M334 644 L468 644" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M586 292 L586 344" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
  <path class="edge" d="M586 432 L586 484" fill="none" stroke="#64748b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M704 528 L882 528" fill="none" stroke="#16a34a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <path class="edge" d="M704 644 L882 644" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>


  <g class="card" data-card="Application Config">
    <rect x="86" y="220" width="248" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="210" y="251" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Application Config</text>
    <text x="210" y="278" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">subclasses AbstractWebClientConfig</text>
<text x="210" y="295" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">overrides resource knobs</text>
  </g>

  <g class="card" data-card="AbstractWebClientConfig">
    <rect x="86" y="390" width="248" height="96" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
    <text x="210" y="421" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">AbstractWebClientConfig</text>
    <text x="210" y="448" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">declares Spring beans</text>
<text x="210" y="465" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">owns client resource wiring</text>
  </g>

  <g class="card" data-card="Tuning Inputs">
    <rect x="86" y="596" width="248" height="96" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
    <text x="210" y="627" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Tuning Inputs</text>
    <text x="210" y="654" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">threadCount, timeouts, SSL</text>
<text x="210" y="671" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">maxInMemorySize</text>
  </g>

  <g class="card" data-card="LoopResources">
    <rect x="468" y="204" width="236" height="88" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
    <text x="586" y="235" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LoopResources</text>
    <text x="586" y="262" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">web-client-thread-</text>
<text x="586" y="279" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">dedicated workers</text>
  </g>

  <g class="card" data-card="ReactorResourceFactory">
    <rect x="468" y="344" width="236" height="88" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
    <text x="586" y="375" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ReactorResourceFactory</text>
    <text x="586" y="402" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">useGlobalResources = false</text>
<text x="586" y="419" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">shutdown timeout</text>
  </g>

  <g class="card" data-card="Client Connector">
    <rect x="468" y="484" width="236" height="88" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <text x="586" y="515" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Client Connector</text>
    <text x="586" y="542" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">SSL context</text>
<text x="586" y="559" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">connect/response timeout</text>
  </g>

  <g class="card" data-card="ExchangeStrategies">
    <rect x="468" y="596" width="236" height="88" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
    <text x="586" y="627" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ExchangeStrategies</text>
    <text x="586" y="654" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">codec memory limit</text>
<text x="586" y="671" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">Spring codecs stay default</text>
  </g>

  <g class="card" data-card="WebClient Bean">
    <rect x="882" y="500" width="288" height="170" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
    <text x="1026" y="531" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">WebClient Bean</text>
    <text x="1026" y="558" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">builder.clientConnector(connector)</text>
<text x="1026" y="575" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">builder.exchangeStrategies(strategies)</text>
<text x="1026" y="592" text-anchor="middle" font-size="13" font-weight="400" fill="#4b5563">uses dedicated resources</text>
  </g>

  <g class="note" data-note="ssl">
    <rect x="912" y="322" width="246" height="104" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="1035" y="354" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">SSL override</text>
    <text x="1035" y="380" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">Default trust store is used.</text>
<text x="1035" y="396" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">insecureSslContext() is</text>
<text x="1035" y="412" text-anchor="middle" font-size="12.5" font-weight="400" fill="#78350f">development/test only.</text>
  </g>
  <path class="edge" d="M 912 374 L 834 374 Q 820 374 820 388 L 820 514 Q 820 528 806 528 L 704 528" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="716,522 704,528 716,534" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <g class="legend" transform="translate(76 814)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#2563eb" stroke-width="3.2" marker-end="url(#arrow-blue)"/>
    <text x="52" y="5" font-size="13" fill="#475569">Application input</text>
    <line x1="238" y1="0" x2="276" y2="0" stroke="#7c3aed" stroke-width="3.2" marker-end="url(#arrow-purple)"/>
    <text x="290" y="5" font-size="13" fill="#475569">Dedicated loop resource</text>
    <line x1="540" y1="0" x2="578" y2="0" stroke="#16a34a" stroke-width="3.2" marker-end="url(#arrow-green)"/>
    <text x="592" y="5" font-size="13" fill="#475569">Connector/WebClient wiring</text>
    <line x1="850" y1="0" x2="888" y2="0" stroke="#64748b" stroke-width="2.7" stroke-dasharray="6 5" marker-end="url(#arrow-gray)"/>
    <text x="902" y="5" font-size="13" fill="#475569">Configuration caveat</text>
  </g>
</svg>
