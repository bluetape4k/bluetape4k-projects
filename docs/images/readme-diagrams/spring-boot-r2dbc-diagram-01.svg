<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="947" viewBox="0 0 1500 947" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="947"/>
<rect class="frame" x="32" y="28" width="1436" height="891" rx="30"/>
<text class="title" x="68" y="84">Core Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="R2dbcConfig" data-to="PostRepository" data-route-color="teal" d="M750 311 L750 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="PostRepository" data-to="Post" data-route-color="amber" d="M612 544 L612 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="PostRepository" data-to="R2dbcEntityOperationsExt" data-route-color="pink" d="M888 544 L888 631" stroke="#C94D68" stroke-dasharray="8 7"/>
<g id="R2dbcConfig">
  <rect class="classCard" x="570" y="165" width="380" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="760" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="760" y="212" text-anchor="middle">R2dbcConfig</text>
  <line x1="570" y1="221" x2="950" y2="221" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="604" y="253">+connectionFactory(): ConnectionFactory</text>
<text class="member" x="604" y="270">+r2dbcEntityOperations():</text>
<text class="member" x="604" y="287">R2dbcEntityOperations</text>
</g>
<g id="PostRepository">
  <rect class="classCard" x="570" y="398" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="750" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="445" text-anchor="middle">PostRepository</text>
  <line x1="570" y1="454" x2="930" y2="454" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="604" y="486">-operations: R2dbcEntityOperations</text>
<text class="member" x="604" y="503">+findById(id): Post?</text>
<text class="member" x="604" y="520">+findAll(): Flow~Post~</text>
</g>
<g id="Post">
  <rect class="classCard" x="375" y="631" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="555" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="555" y="678" text-anchor="middle">Post</text>
  <line x1="375" y1="687" x2="735" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="409" y="719">+id: Long?</text>
<text class="member" x="409" y="736">+title: String</text>
<text class="member" x="409" y="753">+content: String</text>
</g>
<g id="R2dbcEntityOperationsExt">
  <rect class="classCard" x="765" y="631" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="945" y="650" text-anchor="middle">extension</text>
  <text class="classTitle" x="945" y="669" text-anchor="middle">R2dbcEntityOperations</text>
<text class="classTitle" x="945" y="691" text-anchor="middle">Ext</text>
  <line x1="765" y1="695" x2="1125" y2="695" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="799" y="723">+findOneByIdOrNullSuspending(id): T?</text>
<text class="member" x="799" y="740">+selectAllSuspending(): Flow~T~</text>
<text class="member" x="799" y="757">+selectSuspending(query): Flow~T~</text>
</g>
<g>
  <rect x="1085" y="839" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 857 L1161 857" stroke="#3E9868"/>
  <text class="detail" x="1175" y="862">inheritance / implementation</text>
  <path class="dependency" d="M1103 878 L1161 878" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="883">dependency / usage</text>
</g>
<g><rect x="180" y="857" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="883" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
