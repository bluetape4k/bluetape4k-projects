<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="638" viewBox="0 0 1754 638" role="img" aria-label="Core Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5" fill="none" stroke="context-stroke" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="5.5" markerHeight="5" refX="4.75" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.25 0.5 L 4.75 2.5 L 0.25 4.5 Z" fill="#ffffff" stroke="context-stroke" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter";font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono";font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter";font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter";font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono";font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono";font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="638"/>
<rect class="frame" x="32" y="28" width="1690" height="582" rx="28"/>
<text class="title" x="66" y="82">Core Class Structure</text>
<text class="subtitle" x="70" y="104">Source-checked class relationships with readable compartments and routed inheritance.</text>
<path class="line" d="M262 355 L262 122 L672 122 L672 180" style="stroke:#3E9868;stroke:#3E9868" data-route-color="#3E9868"/>
<path class="line" d="M672 180 L672 132 L1082 132 L1082 397" style="stroke:#4F83BF;stroke:#4F83BF" data-route-color="#4F83BF"/>
<path class="line" d="M672 418 L672 456 L1492 456 L1492 180" style="stroke:#2E8F89;stroke:#2E8F89" data-route-color="#2E8F89"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">R2dbcConfig</text>
  <text class="mono" x="18" y="108">+connectionFactory(): ConnectionFactory</text>
<text class="mono" x="18" y="129">+r2dbcEntityOperations():</text>
<text class="mono" x="18" y="150">R2dbcEntityOperations</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
    <text class="label" x="170" y="49" text-anchor="middle">PostRepository</text>
  <text class="mono" x="18" y="108">-operations: R2dbcEntityOperations</text>
<text class="mono" x="18" y="129">+findById(id): Post?</text>
<text class="mono" x="18" y="150">+findAll(): Flow~Post~</text>
<text class="mono" x="18" y="171">+save(post): Post</text>
<text class="mono" x="18" y="192">+update(id, title): Int</text>
<text class="mono" x="18" y="213">+delete(id): Int</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
    <text class="label" x="170" y="49" text-anchor="middle">Post</text>
  <text class="mono" x="18" y="108">+id: Long?</text>
<text class="mono" x="18" y="129">+title: String</text>
<text class="mono" x="18" y="150">+content: String</text>
<text class="mono" x="18" y="171">+authorId: Long</text>
<text class="mono" x="18" y="192">+createdAt: Instant</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extension»</text>
  <text class="label" x="170" y="61" text-anchor="middle">R2dbcEntityOperationsExt</text>
  <text class="mono" x="18" y="108">+findOneByIdOrNullSuspending(id): T?</text>
<text class="mono" x="18" y="129">+selectAllSuspending(): Flow~T~</text>
<text class="mono" x="18" y="150">+selectSuspending(query): Flow~T~</text>
<text class="mono" x="18" y="171">+selectOneSuspending(query): T</text>
<text class="mono" x="18" y="192">+insertSuspending(entity): T</text>
<text class="mono" x="18" y="213">+updateSuspending(query, update): Int</text>
</g>
</svg>
