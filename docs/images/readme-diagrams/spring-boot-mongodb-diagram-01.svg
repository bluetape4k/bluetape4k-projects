<svg data-intent="Redesign the class overview so Reactive Mongo operations extensions sit below their receiver, while Criteria/Query/Update DSL helpers stay grouped by responsibility." data-evidence="spring-boot/mongodb/README.md; spring-boot/mongodb/src/main/kotlin/io/bluetape4k/spring/mongodb" data-source-read="spring-boot/mongodb/README.md; spring-boot/mongodb/src/main/kotlin/io/bluetape4k/spring/mongodb" xmlns="http://www.w3.org/2000/svg" width="1440" height="925" viewBox="0 0 1440 925" role="img" aria-label="MongoDB Coroutine Extension Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1440" height="925"/>
<rect class="frame" x="34" y="30" width="1372" height="865" rx="32"/>
<text class="title" x="72" y="84">MongoDB Coroutine Extension Structure</text>
<text class="subtitle" x="76" y="116">ReactiveMongoOperations stays as the receiver; coroutine extensions move below it and query/update DSL groups stay beside the Spring Data types they build.</text>
<g><rect class="panel" x="82" y="160" width="1276" height="155" rx="22"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Spring Data receiver</text></g>
<g><rect class="panel" x="82" y="390" width="1276" height="225" rx="22"/><text class="panelTitle" x="110" y="426" dominant-baseline="middle">Coroutine and DSL extension groups</text></g>
<g><rect class="panel" x="82" y="690" width="1276" height="155" rx="22"/><text class="panelTitle" x="110" y="726" dominant-baseline="middle">MongoDB query objects</text></g>
<g id="ops">
  <rect class="card" x="505" y="215" width="430" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="720" y="247" text-anchor="middle" dominant-baseline="middle">ReactiveMongoOperations</text>
  <text class="detail" x="720" y="277" text-anchor="middle" dominant-baseline="middle">source receiver for coroutine extension functions</text>
</g>
<g id="coroutines">
  <rect class="card" x="505" y="455" width="430" height="96" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="720" y="487" text-anchor="middle" dominant-baseline="middle">Reactive Mongo operations extensions</text>
  <text class="detail" x="720" y="517" text-anchor="middle" dominant-baseline="middle">Flux -&gt; Flow</text>
  <text class="detail" x="720" y="535" text-anchor="middle" dominant-baseline="middle">Mono -&gt; suspend / nullable suspend</text>
</g>
<g id="criteria">
  <rect class="card" x="145" y="455" width="280" height="86" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="285" y="482" text-anchor="middle" dominant-baseline="middle">Criteria DSL</text>
  <text class="detail" x="285" y="512" text-anchor="middle" dominant-baseline="middle">criteria(), eq/gt/in</text>
  <text class="detail" x="285" y="530" text-anchor="middle" dominant-baseline="middle">andWith/orWith</text>
</g>
<g id="query">
  <rect class="card" x="980" y="455" width="280" height="86" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1120" y="482" text-anchor="middle" dominant-baseline="middle">Query extensions</text>
  <text class="detail" x="1120" y="512" text-anchor="middle" dominant-baseline="middle">queryOf, sort, paginate</text>
  <text class="detail" x="1120" y="530" text-anchor="middle" dominant-baseline="middle">limit/skip helpers</text>
</g>
<g id="update">
  <rect class="card" x="145" y="745" width="280" height="70" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="285" y="773" text-anchor="middle" dominant-baseline="middle">Update DSL</text>
  <text class="detail" x="285" y="803" text-anchor="middle" dominant-baseline="middle">setTo/incBy/push/pull</text>
</g>
<g id="springTypes">
  <rect class="card" x="505" y="745" width="430" height="70" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="720" y="773" text-anchor="middle" dominant-baseline="middle">Spring Data types</text>
  <text class="detail" x="720" y="803" text-anchor="middle" dominant-baseline="middle">Criteria, Query, Update</text>
</g>
<g id="mongo">
  <rect class="card" x="980" y="745" width="280" height="70" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1120" y="773" text-anchor="middle" dominant-baseline="middle">MongoDB reactive driver</text>
  <text class="detail" x="1120" y="803" text-anchor="middle" dominant-baseline="middle">Flux/Mono command results</text>
</g>
<path class="route" data-from="ops" data-to="coroutines" d="M720 293 L720 455" stroke="#4F83BF"/>
<path class="route" data-from="criteria" data-to="springTypes" d="M425 498 L470 498 L470 690 L640 690 L640 745" stroke="#3E9868"/>
<path class="route" data-from="query" data-to="springTypes" d="M1120 541 L1120 635 L865 635 L865 745" stroke="#B9851B"/>
<path class="route" data-from="update" data-to="springTypes" d="M425 780 L505 780" stroke="#C94D68"/>
<path class="route" data-from="coroutines" data-to="mongo" d="M880 551 L880 670 L1120 670 L1120 745" stroke="#2E8F89"/>
</svg>
