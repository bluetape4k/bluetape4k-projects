<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180" role="img" aria-label="MongoDB Coroutine Extension Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-green" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-teal" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-amber" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-pink" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-purple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-dasharray="none"/></marker>
  <marker id="arrow-slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 13 6.5 L 0 13 Z" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-dasharray="none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#CBD5E1;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .band{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.bandTitle{font-family:"Architects Daughter";font-size:23px;fill:#334155}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:14px;fill:#475569}
    .mono{font-family:"Comic Mono";font-size:13px;fill:#475569}.edge{fill:none;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
    .edgeDashed{stroke-dasharray:9 8}.note{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.8}
  </style>
</defs>
<rect class="canvas" width="1700" height="1180"/>
<rect class="frame" x="40" y="34" width="1620" height="1106" rx="30"/>
<text class="title" x="82" y="92">MongoDB Coroutine Extension Structure</text>
<text class="subtitle" x="86" y="126">ReactiveMongoOperations is the receiver; coroutine operation helpers and DSL builders stay separated by responsibility.</text>
<g><rect class="band" x="90" y="168" width="1520" height="185" rx="16"/><text class="bandTitle" x="116" y="204" dominant-baseline="middle">Spring Data receiver</text></g>
<g><rect class="band" x="90" y="430" width="1520" height="255" rx="16"/><text class="bandTitle" x="116" y="466" dominant-baseline="middle">Kotlin extension surfaces</text></g>
<g><rect class="band" x="90" y="755" width="1520" height="315" rx="16"/><text class="bandTitle" x="116" y="791" dominant-baseline="middle">Objects handed to Spring Data MongoDB</text></g>
<g id="receiver"><rect class="card" x="735" y="230" width="480" height="88" rx="12" fill="#EFF6FF" stroke="#2563EB"/>
<text class="cardTitle" x="975" y="264" text-anchor="middle" dominant-baseline="middle">ReactiveMongoOperations</text>
<text class="detail" x="975" y="296" text-anchor="middle" dominant-baseline="middle">receiver for coroutine extension functions</text></g>
<g id="criteriaDsl"><rect class="card" x="120" y="508" width="320" height="104" rx="12" fill="#F0FDF4" stroke="#16A34A"/>
<text class="cardTitle" x="280" y="542" text-anchor="middle" dominant-baseline="middle">Criteria DSL</text>
<text class="detail" x="280" y="574" text-anchor="middle" dominant-baseline="middle">criteria(), eq/gt/inValues</text>
<text class="detail" x="280" y="594" text-anchor="middle" dominant-baseline="middle">andWith / orWith</text></g>
<g id="queryDsl"><rect class="card" x="480" y="508" width="320" height="104" rx="12" fill="#FFF7ED" stroke="#EA580C"/>
<text class="cardTitle" x="640" y="542" text-anchor="middle" dominant-baseline="middle">Query extensions</text>
<text class="detail" x="640" y="574" text-anchor="middle" dominant-baseline="middle">queryOf(), sortAscBy()</text>
<text class="detail" x="640" y="594" text-anchor="middle" dominant-baseline="middle">paginate(), limitTo(), skipTo()</text></g>
<g id="coroutines"><rect class="card" x="840" y="500" width="390" height="120" rx="12" fill="#F0FDFA" stroke="#0D9488"/>
<text class="cardTitle" x="1035" y="534" text-anchor="middle" dominant-baseline="middle">Coroutine operation extensions</text>
<text class="detail" x="1035" y="566" text-anchor="middle" dominant-baseline="middle">Flux&lt;T&gt; -&gt; Flow&lt;T&gt;</text>
<text class="detail" x="1035" y="586" text-anchor="middle" dominant-baseline="middle">Mono&lt;T&gt; -&gt; suspend / nullable</text>
<text class="detail" x="1035" y="606" text-anchor="middle" dominant-baseline="middle">writes await result metadata</text></g>
<g id="updateDsl"><rect class="card" x="1310" y="508" width="250" height="104" rx="12" fill="#FDF2F8" stroke="#DB2777"/>
<text class="cardTitle" x="1435" y="542" text-anchor="middle" dominant-baseline="middle">Update DSL</text>
<text class="detail" x="1435" y="574" text-anchor="middle" dominant-baseline="middle">setTo, incBy</text>
<text class="detail" x="1435" y="594" text-anchor="middle" dominant-baseline="middle">andSet / andInc</text></g>
<g id="springTypes"><rect class="card" x="300" y="810" width="1080" height="104" rx="12" fill="#FAF5FF" stroke="#9333EA"/>
<text class="cardTitle" x="840" y="844" text-anchor="middle" dominant-baseline="middle">Spring Data query objects</text>
<text class="detail" x="840" y="876" text-anchor="middle" dominant-baseline="middle">Criteria, Query, Update</text>
<text class="detail" x="840" y="896" text-anchor="middle" dominant-baseline="middle">used by find/update/remove operations</text></g>
<g id="driver"><rect class="card" x="650" y="945" width="520" height="104" rx="12" fill="#F0FDF4" stroke="#16A34A"/>
<text class="cardTitle" x="910" y="979" text-anchor="middle" dominant-baseline="middle">Reactive Mongo driver</text>
<text class="detail" x="910" y="1011" text-anchor="middle" dominant-baseline="middle">Flux/Mono publisher results</text>
<text class="detail" x="910" y="1031" text-anchor="middle" dominant-baseline="middle">collection command metadata</text></g>
<path class="edge" d="M975 318 L1035 500" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="edge" d="M280 612 L280 735 L520 735 L520 810" stroke="#16A34A" marker-end="url(#arrow-green)"/>
<path class="edge" d="M640 612 L640 810" stroke="#EA580C" marker-end="url(#arrow-amber)"/>
<path class="edge" d="M1435 612 L1435 735 L1240 735 L1240 810" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="edge" d="M1035 620 L1035 810" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
<path class="edge" d="M840 914 L840 945" stroke="#9333EA" marker-end="url(#arrow-purple)"/>
<g><rect x="1058" y="404" width="172" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="1072" y="421" fill="#2563EB">extension receiver</text></g>
<g><rect x="650" y="705" width="180" height="26" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1.4"/><text class="mono" x="664" y="722" fill="#9333EA">builds query inputs</text></g>
</svg>