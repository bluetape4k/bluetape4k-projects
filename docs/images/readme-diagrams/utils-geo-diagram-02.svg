<text class="small" x="1082" y="497" text-anchor="middle">returns</text>
<rect x="511.5" y="370" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="569.5" y="388" text-anchor="middle">returns</text>
<rect x="511.5" y="370" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="569.5" y="388" text-anchor="middle">returns</text>
</svg>
