<svg data-intent="Explain Mutiny processing flow by showing Uni/Multi receivers, coroutine await/Flow bridges, retry/transform helpers, and terminal suspend/Flow outcomes." data-evidence="utils/mutiny/README.md; utils/mutiny/src/main/kotlin/io/bluetape4k/mutiny" data-source-read="utils/mutiny/README.md; utils/mutiny/src/main/kotlin/io/bluetape4k/mutiny" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Mutiny Processing Flow">
<defs>
