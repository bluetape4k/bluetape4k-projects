<path class="route dashed" data-from="multi" data-to="retry" d="M1304 340 L1304 574" stroke="#755BC6"/>
<path class="route" data-from="await" data-to="suspend" d="M358 658 L358 797 L196 797 L196 892" stroke="#2E8F89"/>
<path class="route" data-from="flow" data-to="flowOut" d="M750 658 L1214 892" stroke="#B9851B"/>
<path class="route" data-from="retry" data-to="suspend" d="M1214 658 L376 892" stroke="#755BC6"/>
