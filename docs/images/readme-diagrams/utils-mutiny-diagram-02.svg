  <text class="cardTitle" x="286" y="291" text-anchor="middle" dominant-baseline="middle">Uni&lt;T&gt;</text>
  <text class="detail" x="286" y="321" text-anchor="middle" dominant-baseline="middle">single async value</text>
</g>
<g id="multi">
  <rect class="card" x="1074" y="256" width="280" height="84" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="1214" y="291" text-anchor="middle" dominant-baseline="middle">Multi&lt;T&gt;</text>
  <text class="detail" x="1214" y="321" text-anchor="middle" dominant-baseline="middle">streaming async values</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Extension operations</text></g>
<g id="await">
  <rect class="card" x="146" y="574" width="280" height="84" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="286" y="609" text-anchor="middle" dominant-baseline="middle">await helpers</text>
  <text class="detail" x="286" y="639" text-anchor="middle" dominant-baseline="middle">suspend result</text>
</g>
<g id="flow">
  <rect class="card" x="610" y="574" width="280" height="84" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="750" y="609" text-anchor="middle" dominant-baseline="middle">Flow bridge</text>
  <text class="detail" x="750" y="639" text-anchor="middle" dominant-baseline="middle">Multi -&gt; Flow&lt;T&gt;</text>
</g>
<g id="retry">
  <rect class="card" x="1074" y="574" width="280" height="84" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1214" y="609" text-anchor="middle" dominant-baseline="middle">retry / transform</text>
  <text class="detail" x="1214" y="639" text-anchor="middle" dominant-baseline="middle">failure handling</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="22"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Coroutine outcomes</text></g>
<g id="suspend">
  <rect class="card" x="146" y="892" width="280" height="84" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="286" y="927" text-anchor="middle" dominant-baseline="middle">suspend T?</text>
  <text class="detail" x="286" y="957" text-anchor="middle" dominant-baseline="middle">nullable or throwing result</text>
</g>
<g id="flowOut">
  <rect class="card" x="1074" y="892" width="280" height="84" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1214" y="927" text-anchor="middle" dominant-baseline="middle">Flow&lt;T&gt;</text>
  <text class="detail" x="1214" y="957" text-anchor="middle" dominant-baseline="middle">cold coroutine stream</text>
</g>
