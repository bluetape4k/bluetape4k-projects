<svg xmlns="http://www.w3.org/2000/svg" width="1730" height="1162" viewBox="0 0 1730 1162" role="img" aria-label="Mutiny Processing Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1730" height="1162"/>
<rect class="frame" x="32" y="28" width="1666" height="1106" rx="28"/>
<text class="title" x="66" y="82">Mutiny Processing Flow</text>
<text class="subtitle" x="70" y="118">Grouped architecture from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="204" width="1603" height="176" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="232">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="346" width="1603" height="176" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="374">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="488" width="1603" height="176" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="516">Integration layer</text>
    </g>
    <g id="readme-layer-4">
      <rect class="readmeLayerBand" x="54" y="630" width="1603" height="176" rx="18" fill="#FFF3D9"/>
      <text class="readmeLayerLabel" x="72" y="658">Runtime layer</text>
    </g>
    <g id="readme-layer-5">
      <rect class="readmeLayerBand" x="54" y="772" width="1603" height="176" rx="18" fill="#F1ECFF"/>
      <text class="readmeLayerLabel" x="72" y="800">External layer</text>
    </g>
    <g id="readme-layer-6">
      <rect class="readmeLayerBand" x="54" y="914" width="1603" height="176" rx="18" fill="#FDECEF"/>
      <text class="readmeLayerLabel" x="72" y="942">External layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<g transform="translate(60,160)">
  <rect x="0" y="0" width="350" height="364" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">Mutiny core types</text>
</g>
<g transform="translate(105,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="42" text-anchor="middle">Uni&amp;lt;T&amp;gt; 0 or 1</text>
<text class="smallLabel" x="130" y="63" text-anchor="middle">item (equivalent to</text>
<text class="smallLabel" x="130" y="84" text-anchor="middle">Reactor Mono)</text>
</g>
<g transform="translate(105,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="31.5" text-anchor="middle">Multi&amp;lt;T&amp;gt;</text>
<text class="smallLabel" x="130" y="52.5" text-anchor="middle">stream of 0 or more</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">items (equivalent to</text>
<text class="smallLabel" x="130" y="94.5" text-anchor="middle">Reactor Flux)</text>
</g>
<g transform="translate(480,160)">
  <rect x="0" y="0" width="350" height="932" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">Create Uni</text>
</g>
<g transform="translate(525,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">uniOf(value)</text>
</g>
<g transform="translate(525,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">uniOf { supplier }</text>
</g>
<g transform="translate(525,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">nullUni()</text>
</g>
<g transform="translate(525,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">uni Failure</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Of(exception)</text>
</g>
<g transform="translate(525,804)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Completable</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Future.as Uni()</text>
</g>
<g transform="translate(525,946)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">CoroutineScope.asUni</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">{ suspend }</text>
</g>
<g transform="translate(900,160)">
  <rect x="0" y="0" width="350" height="790" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">Create Multi</text>
</g>
<g transform="translate(945,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">multiOf(1, 2, 3)</text>
</g>
<g transform="translate(945,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">multiRangeOf(0, 100)</text>
</g>
<g transform="translate(945,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">List.asMulti()</text>
</g>
<g transform="translate(945,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Sequence.asMulti()</text>
</g>
<g transform="translate(945,804)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Stream.asMulti()</text>
</g>
<g transform="translate(1320,160)">
  <rect x="0" y="0" width="350" height="932" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">Transform and process</text>
</g>
<g transform="translate(1365,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">map { }</text>
</g>
<g transform="translate(1365,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">filter { }</text>
</g>
<g transform="translate(1365,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">flatMap { }</text>
</g>
<g transform="translate(1365,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">onEach { }</text>
</g>
<g transform="translate(1365,804)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">on Failure().recover</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">With Item()</text>
</g>
<g transform="translate(1365,946)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">RET</text>
</g>
</svg>
