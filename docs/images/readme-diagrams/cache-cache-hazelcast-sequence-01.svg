<rect x="739.5" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="757.5" y="617" text-anchor="start">7. null</text>
<path class="dashed" d="M1053.2 636 L635.8 636"/>
<rect x="948.2" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.2" y="693" text-anchor="start">8. get(key)</text>
<path class="line" d="M635.8 712 L1470.5 712"/>
<rect x="148.5" y="1082" width="1392" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
