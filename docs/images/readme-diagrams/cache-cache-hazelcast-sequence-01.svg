<path class="dashed" d="M1470.5 788 L635.8 788"/>
<rect x="739.5" y="818" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="757.5" y="845" text-anchor="start">11. put(key, value)</text>
<path class="line" d="M635.8 864 L1053.2 864"/>
<rect x="322.2" y="894" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="340.2" y="921" text-anchor="start">12. value</text>
<path class="dashed" d="M635.8 940 L218.5 940"/>
<rect x="148.5" y="1480" width="1392" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="170.5" y="1507" text-anchor="start">ELSE: L2 miss</text>
<rect x="948.2" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="966.2" y="997" text-anchor="start">14. null</text>
<path class="dashed" d="M1470.5 1016 L635.8 1016"/>
<rect x="322.2" y="1046" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="340.2" y="1073" text-anchor="start">15. null</text>
<path class="dashed" d="M635.8 1092 L218.5 1092"/>
<rect x="906.2" y="1122" width="294" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="924.2" y="1149" text-anchor="start">16. EntryEvent (updated/removed)</text>
<path class="line" d="M1470.5 1168 L635.8 1168"/>
<rect x="739.5" y="1198" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="757.5" y="1225" text-anchor="start">17. invalidate(key)</text>
<path class="line" d="M635.8 1244 L1053.2 1244"/>
</svg>
