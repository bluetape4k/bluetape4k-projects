<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="760" viewBox="0 0 1640 760" role="img" aria-labelledby="title desc">
  <title id="title">OpenTelemetry component relationships</title>
  <desc id="desc">Component relationship diagram for infra-opentelemetry showing instrumentation support, tracer and meter providers, processors, readers, exporters, collectors, and testing backends.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .group-title{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card-shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="760"/>
  <rect class="frame" x="34" y="30" width="1572" height="700" rx="28"/>
  <text class="title" x="72" y="88">OpenTelemetry component relationships</text>
  <text class="subtitle" x="76" y="121">Instrumentation feeds SDK providers, processors/readers transform telemetry, and exporters send data to test or production backends.</text>

  <g id="group-instrumentation">
    <rect class="group" x="90" y="178" width="350" height="255" rx="18"/>
    <text class="group-title" x="120" y="202" dominant-baseline="middle">Instrumentation entry</text>
  </g>
  <g id="group-sdk">
    <rect class="group" x="472" y="150" width="312" height="340" rx="18"/>
    <text class="group-title" x="502" y="174" dominant-baseline="middle">SDK providers</text>
  </g>
  <g id="group-pipeline">
    <rect class="group" x="858" y="178" width="312" height="420" rx="18"/>
    <text class="group-title" x="888" y="202" dominant-baseline="middle">Telemetry pipeline</text>
  </g>
  <g id="group-backends">
    <rect class="group" x="1240" y="215" width="310" height="332" rx="18"/>
    <text class="group-title" x="1270" y="239" dominant-baseline="middle">Backends and tests</text>
  </g>

  <path id="route-app-support" class="connector" d="M264 314 L264 338" stroke="#4F83BF"/>
  <path id="route-support-tracer" class="connector" d="M404 360 L438 360 L438 248 L512 248" stroke="#8A72D6"/>
  <path id="route-support-meter" class="connector" d="M404 405 L512 405" stroke="#45A7A1"/>
  <path id="route-tracer-span-processor" class="connector" d="M744 248 L898 248" stroke="#DB7890"/>
  <path id="route-meter-metric-reader" class="connector" d="M744 403 L898 403" stroke="#D9AA4D"/>
  <path id="route-span-processor-exporters" class="connector" d="M1130 261 L1160 261 L1160 525 L1130 525" stroke="#DB7890"/>
  <path id="route-metric-reader-exporters" class="connector" d="M1014 454 L1014 510" stroke="#D9AA4D"/>
  <path id="route-exporters-collector" class="connector" d="M1130 535 L1210 535 L1210 301 L1276 301" stroke="#45A7A1"/>
  <path id="route-exporters-test-backend" class="connector" d="M1130 570 L1230 570 L1230 451 L1276 451" stroke="#6B7D90"/>

  <g id="node-app" transform="translate(124,230)">
    <rect class="card-shape" x="0" y="0" width="280" height="84" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="140" y="23" text-anchor="middle" dominant-baseline="middle">Application instrumentation</text>
    <text class="detail" x="140" y="42" text-anchor="middle" dominant-baseline="middle">trace/span helpers</text>
    <text class="detail" x="140" y="61" text-anchor="middle" dominant-baseline="middle">meter helpers</text>
  </g>
  <g id="node-support" transform="translate(124,338)">
    <rect class="card-shape" x="0" y="0" width="280" height="84" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="140" y="23" text-anchor="middle" dominant-baseline="middle">Bluetape4k OTel support</text>
    <text class="detail" x="140" y="42" text-anchor="middle" dominant-baseline="middle">builder DSL</text>
    <text class="detail" x="140" y="61" text-anchor="middle" dominant-baseline="middle">resource attributes</text>
  </g>
  <g id="node-tracer" transform="translate(512,205)">
    <rect class="card-shape" x="0" y="0" width="232" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="116" y="24" text-anchor="middle" dominant-baseline="middle">SdkTracerProvider</text>
    <text class="detail" x="116" y="43" text-anchor="middle" dominant-baseline="middle">span lifecycle</text>
    <text class="detail" x="116" y="62" text-anchor="middle" dominant-baseline="middle">context propagation</text>
  </g>
  <g id="node-meter" transform="translate(512,360)">
    <rect class="card-shape" x="0" y="0" width="232" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="116" y="24" text-anchor="middle" dominant-baseline="middle">SdkMeterProvider</text>
    <text class="detail" x="116" y="43" text-anchor="middle" dominant-baseline="middle">instruments</text>
    <text class="detail" x="116" y="62" text-anchor="middle" dominant-baseline="middle">aggregation views</text>
  </g>
  <g id="node-span-processor" transform="translate(898,230)">
    <rect class="card-shape" x="0" y="0" width="232" height="82" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="card-title" x="116" y="22" text-anchor="middle" dominant-baseline="middle">SpanProcessor</text>
    <text class="detail" x="116" y="41" text-anchor="middle" dominant-baseline="middle">batch/simple processing</text>
    <text class="detail" x="116" y="60" text-anchor="middle" dominant-baseline="middle">sampling handoff</text>
  </g>
  <g id="node-metric-reader" transform="translate(898,372)">
    <rect class="card-shape" x="0" y="0" width="232" height="82" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="116" y="22" text-anchor="middle" dominant-baseline="middle">MetricReader</text>
    <text class="detail" x="116" y="41" text-anchor="middle" dominant-baseline="middle">periodic export</text>
    <text class="detail" x="116" y="60" text-anchor="middle" dominant-baseline="middle">aggregation collect</text>
  </g>
  <g id="node-exporters" transform="translate(898,510)">
    <rect class="card-shape" x="0" y="0" width="232" height="82" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="116" y="22" text-anchor="middle" dominant-baseline="middle">Exporter set</text>
    <text class="detail" x="116" y="41" text-anchor="middle" dominant-baseline="middle">OTLP, Jaeger, Zipkin</text>
    <text class="detail" x="116" y="60" text-anchor="middle" dominant-baseline="middle">logging, in-memory</text>
  </g>
  <g id="node-collector" transform="translate(1276,270)">
    <rect class="card-shape" x="0" y="0" width="236" height="82" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="118" y="22" text-anchor="middle" dominant-baseline="middle">OTel Collector</text>
    <text class="detail" x="118" y="41" text-anchor="middle" dominant-baseline="middle">OTLP ingest</text>
    <text class="detail" x="118" y="60" text-anchor="middle" dominant-baseline="middle">routing and processing</text>
  </g>
  <g id="node-test-backend" transform="translate(1276,410)">
    <rect class="card-shape" x="0" y="0" width="236" height="82" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="card-title" x="118" y="22" text-anchor="middle" dominant-baseline="middle">Test backend</text>
    <text class="detail" x="118" y="41" text-anchor="middle" dominant-baseline="middle">InMemory exporters</text>
    <text class="detail" x="118" y="60" text-anchor="middle" dominant-baseline="middle">assertions</text>
  </g>

  <g transform="translate(76,686)">
    <rect class="pill" x="0" y="0" width="1488" height="44" rx="10"/>
    <text class="small" x="744" y="17" text-anchor="middle" dominant-baseline="middle">Graphviz: infra-opentelemetry-diagram-02.{dot,plain} + sketch SVG/PNG.</text>
    <text class="small" x="744" y="34" text-anchor="middle" dominant-baseline="middle">Gate: n=9, r=9, seg=17, endpoint/bend/cross/overlap/clear/label=0, margins=124/128/84/94, titleGap=84.</text>
  </g>
</svg>
