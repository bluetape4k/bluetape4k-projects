<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-label="OpenTelemetry Component Overview">
  <defs>
    <filter id="softShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowPurple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#9333EA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGreen" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:50px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#475569;font-weight:700}
      .lane{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.6}
      .laneTitle{font-family:"Architects Daughter";font-size:28px;fill:#0F172A}
      .card{filter:url(#softShadow);stroke-width:2.2}
      .app{fill:#EFF6FF;stroke:#2563EB}
      .trace{fill:#FAF5FF;stroke:#9333EA}
      .flow{fill:#F0FDFA;stroke:#0D9488}
      .metric{fill:#F0FDF4;stroke:#16A34A}
      .web{fill:#FFF7ED;stroke:#EA580C}
      .sdk{fill:#F8FAFC;stroke:#64748B;stroke-dasharray:8 8}
      .note{fill:#FDF2F8;stroke:#DB2777}
      .name{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
      .smallName{font-family:"Architects Daughter";font-size:21px;fill:#0F172A}
      .meta{font-family:"Comic Mono";font-size:14px;fill:#475569;font-weight:700}
      .tiny{font-family:"Comic Mono";font-size:12px;fill:#475569;font-weight:700}
      .line{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .blue{stroke:#2563EB;marker-end:url(#arrowBlue)}
      .purple{stroke:#9333EA;marker-end:url(#arrowPurple)}
      .teal{stroke:#0D9488;marker-end:url(#arrowTeal)}
      .green{stroke:#16A34A;marker-end:url(#arrowGreen)}
      .orange{stroke:#EA580C;marker-end:url(#arrowOrange)}
    </style>
  </defs>

  <rect class="canvas" width="1800" height="1080"/>
  <rect class="frame" x="36" y="34" width="1728" height="1012" rx="8"/>

  <text class="title" x="82" y="100">OpenTelemetry Component Overview</text>
  <text class="subtitle" x="86" y="134">Startup DSLs, span wrappers, coroutine propagation, and exporter helpers stay thin over the OpenTelemetry SDK.</text>

  <g id="app-column">
    <rect class="lane" x="88" y="194" width="354" height="736" rx="8"/>
    <text class="laneTitle" x="120" y="238">Application entry</text>
  </g>
  <g id="helper-column">
    <rect class="lane" x="514" y="194" width="354" height="736" rx="8"/>
    <text class="laneTitle" x="546" y="238">Kotlin helper layer</text>
  </g>
  <g id="sdk-column">
    <rect class="lane" x="940" y="194" width="354" height="736" rx="8"/>
    <text class="laneTitle" x="972" y="238">OTel SDK layer</text>
  </g>
  <g id="output-column">
    <rect class="lane" x="1366" y="194" width="354" height="736" rx="8"/>
    <text class="laneTitle" x="1398" y="238">Runtime output</text>
  </g>

  <g id="app-start">
    <rect class="card app" x="126" y="292" width="278" height="88" rx="8"/>
    <text class="smallName" x="265" y="326" text-anchor="middle">Startup config</text>
    <text class="meta" x="265" y="352" text-anchor="middle">provider + propagators</text>
  </g>
  <g id="helper-start">
    <rect class="card app" x="552" y="292" width="278" height="88" rx="8"/>
    <text class="smallName" x="691" y="326" text-anchor="middle">openTelemetrySdk*</text>
    <text class="meta" x="691" y="352" text-anchor="middle">build or register global</text>
  </g>
  <g id="sdk-start">
    <rect class="card sdk" x="978" y="292" width="278" height="88" rx="8"/>
    <text class="smallName" x="1117" y="326" text-anchor="middle">OpenTelemetrySdk</text>
    <text class="meta" x="1117" y="352" text-anchor="middle">tracer, meter, logger providers</text>
  </g>
  <g id="out-start">
    <rect class="card app" x="1404" y="292" width="278" height="88" rx="8"/>
    <text class="smallName" x="1543" y="326" text-anchor="middle">Process-wide SDK</text>
    <text class="meta" x="1543" y="352" text-anchor="middle">local or GlobalOpenTelemetry</text>
  </g>

  <g id="app-trace">
    <rect class="card trace" x="126" y="448" width="278" height="88" rx="8"/>
    <text class="smallName" x="265" y="482" text-anchor="middle">Service operation</text>
    <text class="meta" x="265" y="508" text-anchor="middle">blocking or suspend work</text>
  </g>
  <g id="helper-trace">
    <rect class="card trace" x="552" y="448" width="278" height="88" rx="8"/>
    <text class="smallName" x="691" y="482" text-anchor="middle">Span wrappers</text>
    <text class="meta" x="691" y="508" text-anchor="middle">withSpan, useSpan, use</text>
  </g>
  <g id="sdk-trace">
    <rect class="card sdk" x="978" y="448" width="278" height="88" rx="8"/>
    <text class="smallName" x="1117" y="482" text-anchor="middle">TracerProvider</text>
    <text class="meta" x="1117" y="508" text-anchor="middle">SpanBuilder + processors</text>
  </g>
  <g id="out-trace">
    <rect class="card trace" x="1404" y="448" width="278" height="88" rx="8"/>
    <text class="smallName" x="1543" y="482" text-anchor="middle">Finished spans</text>
    <text class="meta" x="1543" y="508" text-anchor="middle">OK, ERROR, UNSET cancel</text>
  </g>

  <g id="app-flow">
    <rect class="card flow" x="126" y="604" width="278" height="88" rx="8"/>
    <text class="smallName" x="265" y="638" text-anchor="middle">Coroutine and Flow</text>
    <text class="meta" x="265" y="664" text-anchor="middle">dispatcher changes, collect</text>
  </g>
  <g id="helper-flow">
    <rect class="card flow" x="552" y="604" width="278" height="88" rx="8"/>
    <text class="smallName" x="691" y="638" text-anchor="middle">Context propagation</text>
    <text class="meta" x="691" y="664" text-anchor="middle">withOtelContext, traced*</text>
  </g>
  <g id="sdk-flow">
    <rect class="card sdk" x="978" y="604" width="278" height="88" rx="8"/>
    <text class="smallName" x="1117" y="638" text-anchor="middle">OTel Context</text>
    <text class="meta" x="1117" y="664" text-anchor="middle">storeInContext + element</text>
  </g>
  <g id="out-flow">
    <rect class="card flow" x="1404" y="604" width="278" height="88" rx="8"/>
    <text class="smallName" x="1543" y="638" text-anchor="middle">Trace continuity</text>
    <text class="meta" x="1543" y="664" text-anchor="middle">producer and consumer scopes</text>
  </g>

  <g id="app-metrics">
    <rect class="card metric" x="126" y="760" width="278" height="88" rx="8"/>
    <text class="smallName" x="265" y="794" text-anchor="middle">Metrics and HTTP</text>
    <text class="meta" x="265" y="820" text-anchor="middle">meters, attrs, WebFlux</text>
  </g>
  <g id="helper-metrics">
    <rect class="card metric" x="552" y="760" width="278" height="88" rx="8"/>
    <text class="smallName" x="691" y="794" text-anchor="middle">DSL helpers</text>
    <text class="meta" x="691" y="820" text-anchor="middle">attributes, readers, webfilter</text>
  </g>
  <g id="sdk-metrics">
    <rect class="card sdk" x="978" y="760" width="278" height="88" rx="8"/>
    <text class="smallName" x="1117" y="794" text-anchor="middle">Meters + instrumentation</text>
    <text class="meta" x="1117" y="820" text-anchor="middle">readers, exporters, hooks</text>
  </g>
  <g id="out-metrics">
    <rect class="card web" x="1404" y="760" width="278" height="88" rx="8"/>
    <text class="smallName" x="1543" y="794" text-anchor="middle">Export and boundary</text>
    <text class="meta" x="1543" y="820" text-anchor="middle">logging, in-memory, Boot 3</text>
  </g>

  <path class="line blue" d="M 404 336 H 544"/>
  <path class="line blue" d="M 830 336 H 970"/>
  <path class="line blue" d="M 1256 336 H 1396"/>

  <path class="line purple" d="M 404 492 H 544"/>
  <path class="line purple" d="M 830 492 H 970"/>
  <path class="line purple" d="M 1256 492 H 1396"/>

  <path class="line teal" d="M 404 648 H 544"/>
  <path class="line teal" d="M 830 648 H 970"/>
  <path class="line teal" d="M 1256 648 H 1396"/>

  <path class="line green" d="M 404 804 H 544"/>
  <path class="line green" d="M 830 804 H 970"/>
  <path class="line orange" d="M 1256 804 H 1396"/>

  <g id="warning-note">
    <rect class="card note" x="432" y="972" width="936" height="44" rx="8"/>
    <text class="meta" x="900" y="999" text-anchor="middle">Use the WebFlux helper once per ApplicationContext; reset Reactor hooks in isolated tests.</text>
  </g>
</svg>
