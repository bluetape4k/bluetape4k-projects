<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="780" viewBox="0 0 1774 780" role="img" aria-label="OkHttp3 Client Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1774" height="780"/>
<rect class="frame" x="32" y="28" width="1710" height="724" rx="30"/>
<text class="title" x="68" y="84">OkHttp3 Client Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="OkHttpClient" data-to="OkHttpClientExtensionsCoroutines" data-route-color="teal" d="M1063 271 L1344 271 L1344 398" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="OkHttpClient" data-to="CachingResponseInterceptor" data-route-color="amber" d="M703 271 L450 271 L450 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="OkHttpClient" data-to="CachingRequestInterceptor" data-route-color="pink" d="M791 303 L791 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="OkHttpClient" data-to="LoggingInterceptor" data-route-color="purple" d="M981 303 L981 398" stroke="#755BC6" stroke-dasharray="8 7"/>
<g id="CachingResponseInterceptor">
  <rect class="classCard" x="118" y="398" width="380" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="308" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="308" y="436" text-anchor="middle">CachingResponse</text>
<text class="classTitle" x="308" y="458" text-anchor="middle">Interceptor</text>
  <line x1="118" y1="462" x2="498" y2="462" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="152" y="503">+intercept(chain) Response</text>
</g>
<g id="OkHttpClient">
  <rect class="classCard" x="703" y="165" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="883" y="184" text-anchor="middle">OkHttp3</text>
  <text class="classTitle" x="883" y="212" text-anchor="middle">OkHttpClient</text>
  <line x1="703" y1="221" x2="1063" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="737" y="266">+newCall(request) Call</text>
</g>
<g id="CachingRequestInterceptor">
  <rect class="classCard" x="508" y="398" width="380" height="138" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="698" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="698" y="445" text-anchor="middle">CachingRequestInterceptor</text>
  <line x1="508" y1="454" x2="888" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="542" y="499">+intercept(chain) Response</text>
</g>
<g id="LoggingInterceptor">
  <rect class="classCard" x="898" y="398" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1078" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="445" text-anchor="middle">LoggingInterceptor</text>
  <line x1="898" y1="454" x2="1258" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="932" y="499">+intercept(chain) Response</text>
</g>
<g id="OkHttpClientExtensionsCoroutines">
  <rect class="classCard" x="1296" y="398" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1476" y="417" text-anchor="middle">extension functions</text>
  <text class="classTitle" x="1476" y="436" text-anchor="middle">OkHttpClientExtensions</text>
<text class="classTitle" x="1476" y="458" text-anchor="middle">Coroutines</text>
  <line x1="1296" y1="462" x2="1656" y2="462" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="1330" y="503">+executeSuspending(request) Response</text>
</g>
<g>
  <rect x="1359" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1377 690 L1435 690" stroke="#3E9868"/>
  <text class="detail" x="1449" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1377 711 L1435 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1449" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="1134" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="747" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
