<svg data-intent="Explain Jackson2 serializer selection and conversion flow by separating ObjectMapper configuration, JSON/Smile/CBOR serializers, and ByteArray/String outputs." data-evidence="io/jackson2/README.md; io/jackson2/src/main/kotlin" data-source-read="io/jackson2/README.md; io/jackson2/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-label="Jackson2 Conversion Flow" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="940"/>
<rect class="frame" x="34" y="30" width="1432" height="880" rx="8"/>
<text class="title" x="72" y="84">Jackson2 Conversion Flow</text>
<text class="subtitle" x="76" y="116">ObjectMapper configuration is shared; format choice selects JSON text or Smile/CBOR binary serializers before returning String or ByteArray payloads.</text>
<g id="caller">
  <rect class="card" x="120" y="250" width="300" height="78" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="270" y="282" text-anchor="middle" dominant-baseline="middle">Caller code</text>
  <text class="detail" x="270" y="312" text-anchor="middle" dominant-baseline="middle">serialize or deserialize</text>
</g>
<g id="mapper">
  <rect class="card" x="520" y="230" width="360" height="112" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="700" y="270" text-anchor="middle" dominant-baseline="middle">Jackson2 ObjectMapper</text>
  <text class="detail" x="700" y="300" text-anchor="middle" dominant-baseline="middle">Kotlin module</text>
  <text class="detail" x="700" y="318" text-anchor="middle" dominant-baseline="middle">JavaTime / binary modules</text>
</g>
<g id="format">
  <polygon class="card card-shape" points="1160,210 1320,276 1160,342 1000,276" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1160" y="268" text-anchor="middle" dominant-baseline="middle">Payload format?</text>
  <text class="detail" x="1160" y="297" text-anchor="middle" dominant-baseline="middle">JSON, Smile, CBOR</text>
</g>
<g id="json">
  <rect class="card" x="1030" y="430" width="300" height="80" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="1180" y="463" text-anchor="middle" dominant-baseline="middle">JSON serializer</text>
  <text class="detail" x="1180" y="493" text-anchor="middle" dominant-baseline="middle">string or UTF-8 bytes</text>
</g>
<g id="binary">
  <rect class="card" x="1030" y="575" width="300" height="92" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1180" y="614" text-anchor="middle" dominant-baseline="middle">Smile / CBOR serializers</text>
  <text class="detail" x="1180" y="644" text-anchor="middle" dominant-baseline="middle">binary ByteArray payload</text>
</g>
<g id="stringOut">
  <rect class="card" x="520" y="660" width="300" height="80" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="670" y="693" text-anchor="middle" dominant-baseline="middle">String output</text>
  <text class="detail" x="670" y="723" text-anchor="middle" dominant-baseline="middle">readable JSON</text>
</g>
<g id="bytesOut">
  <rect class="card" x="900" y="760" width="320" height="80" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="1060" y="793" text-anchor="middle" dominant-baseline="middle">ByteArray output</text>
  <text class="detail" x="1060" y="823" text-anchor="middle" dominant-baseline="middle">JSON bytes or binary format</text>
</g>
<g id="error">
  <rect class="card" x="145" y="600" width="300" height="90" rx="8" fill="#F9FAFB" stroke="#6B7280"/>
  <text class="cardTitle" x="295" y="629" text-anchor="middle" dominant-baseline="middle">Error policy</text>
  <text class="detail" x="295" y="659" text-anchor="middle" dominant-baseline="middle">wrap Jackson failures</text>
  <text class="detail" x="295" y="677" text-anchor="middle" dominant-baseline="middle">preserve type context</text>
</g>
<path class="route" data-from="caller" data-to="mapper" d="M420 289 L520 286" stroke="#1D4ED8"/>
<path class="route" data-from="mapper" data-to="format" d="M880 286 L1000 276" stroke="#15803D"/>
<path class="route" data-from="format" data-to="json" d="M1160 342 L1160 430" stroke="#0F766E"/>
<path class="route" data-from="format" data-to="binary" d="M1320 276 L1390 276 L1390 621 L1330 621" stroke="#C2410C"/>
<text class="detail" x="1265" y="386" text-anchor="middle" dominant-baseline="middle">default</text>
<text class="detail" x="1300" y="455" text-anchor="middle" dominant-baseline="middle">binary</text>
<path class="route" data-from="json" data-to="stringOut" d="M1030 470 L670 470 L670 660" stroke="#4D7C0F"/>
<path class="route" data-from="json" data-to="bytesOut" d="M1180 510 L1180 545 L860 545 L860 800 L900 800" stroke="#BE185D"/>
<path class="route" data-from="binary" data-to="bytesOut" d="M1180 667 L1180 760" stroke="#C2410C"/>
<path class="route dashed" data-from="mapper" data-to="error" d="M610 342 L610 520 L295 520 L295 600" stroke="#4B5563"/>
</svg>
