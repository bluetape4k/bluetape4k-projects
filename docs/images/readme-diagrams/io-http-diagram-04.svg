<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="815" viewBox="0 0 960 815">
  <defs>
    <style>
      </style>

    <!-- Arrowhead markers: filled triangles -->
    <marker id="arr-blue" markerWidth="4.5" markerHeight="4.5" refX="4" refY="2.25" orient="auto">
      <path d="M0.5,0.5 L4,2.25 L0.5,4 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arr-amber" markerWidth="4.5" markerHeight="4.5" refX="4" refY="2.25" orient="auto">
      <path d="M0.5,0.5 L4,2.25 L0.5,4 Z" fill="#ca8a04"/>
    </marker>
    <marker id="arr-green" markerWidth="4.5" markerHeight="4.5" refX="4" refY="2.25" orient="auto">
      <path d="M0.5,0.5 L4,2.25 L0.5,4 Z" fill="#16a34a"/>
    </marker>

    <!-- Drop shadow filters -->
    <filter id="shadow-panel" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <filter id="shadow-card" x="-6%" y="-10%" width="112%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#94a3b8" flood-opacity="0.13"/>
    </filter>
  </defs>

  <!-- ╔══════════════════════════════════════════════════════════╗ -->
  <!-- ║  Canvas & outer frame                                    ║ -->
  <!-- ╚══════════════════════════════════════════════════════════╝ -->
  <rect width="900" height="740" fill="#f8fafc"/>
  <rect x="12" y="12" width="876" height="716" rx="16"
        fill="white" stroke="#cbd5e1" stroke-width="1.5"
        filter="url(#shadow-panel)"/>

  <!-- Diagram title -->
  <text x="450" y="48" text-anchor="middle"
        font-family="Architects Daughter"
        font-size="20" font-weight="700" fill="#1e293b">
    bluetape4k — HTTP Client Recommendation
  </text>
  <line x1="72" y1="62" x2="828" y2="62" stroke="#e2e8f0" stroke-width="1.5"/>


  <!-- ╔══════════════════════════════════════════════════════════╗ -->
  <!-- ║  PANEL 1 — Primary (Blue)                               ║ -->
  <!-- ╚══════════════════════════════════════════════════════════╝ -->
  <rect x="28" y="74" width="844" height="278" rx="12"
        fill="#dbeafe" stroke="#3b82f6" stroke-width="2"
        filter="url(#shadow-panel)"/>
  <!-- header -->
  <rect x="28" y="74" width="844" height="40" rx="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <rect x="28" y="98"  width="844" height="16"  fill="#bfdbfe"/>
  <text x="50" y="100" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="15" font-weight="700" fill="#1e40af">
    🔵  Primary — HC5 (Apache HttpComponents 5)
  </text>

  <!-- ── Row 1: Sync high-throughput ── -->
  <rect x="44"  y="130" width="220" height="44" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="152" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Sync high-throughput</text>
  <line x1="264" y1="152" x2="292" y2="152"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="294" y="122" width="536" height="60" rx="8"
        fill="white" stroke="#3b82f6" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="140"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#1e40af">HC5 Classic + VirtualThread</text>
  <text x="314" y="157"
        font-family="Comic Mono"
        font-size="11" fill="#3b82f6">productionVirtualThreadHttpClientOf()</text>
  <text x="314" y="172"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Blocking I/O on Virtual Threads · high connection reuse</text>

  <!-- ── Row 2: Async coroutine-first ── -->
  <rect x="44"  y="196" width="220" height="44" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="218" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Async coroutine-first</text>
  <line x1="264" y1="218" x2="292" y2="218"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="294" y="188" width="536" height="60" rx="8"
        fill="white" stroke="#3b82f6" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="206"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#1e40af">HC5 Async + Coroutines</text>
  <text x="314" y="223"
        font-family="Comic Mono"
        font-size="11" fill="#3b82f6">productionHttpAsyncClientOf()</text>
  <text x="314" y="238"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Non-blocking NIO reactor · Kotlin coroutine integration</text>

  <!-- ── Row 3: Cacheable GETs ── -->
  <rect x="44"  y="262" width="220" height="68" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="287" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Cacheable GETs</text>
  <text x="154" y="306" text-anchor="middle" dominant-baseline="middle"
        font-family="Comic Mono"
        font-size="11" fill="#7c3aed">× 1,233 vs no-cache</text>
  <line x1="264" y1="296" x2="292" y2="296"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="294" y="256" width="536" height="72" rx="8"
        fill="white" stroke="#3b82f6" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="276"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#1e40af">HC5 CachingHttpClient</text>
  <text x="314" y="293"
        font-family="Comic Mono"
        font-size="11" fill="#6b7280">In-Memory · RFC 7234 compliant</text>
  <text x="314" y="310"
        font-family="Comic Mono"
        font-size="11" fill="#3b82f6">memoryCachingHttpClientOf()</text>
  <text x="314" y="324"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Transparent cache · ETag · Vary headers supported</text>


  <!-- ╔══════════════════════════════════════════════════════════╗ -->
  <!-- ║  PANEL 2 — Compatibility (Amber)                        ║ -->
  <!-- ╚══════════════════════════════════════════════════════════╝ -->
  <rect x="28" y="368" width="844" height="180" rx="12"
        fill="#fef9c3" stroke="#ca8a04" stroke-width="2"
        filter="url(#shadow-panel)"/>
  <!-- header -->
  <rect x="28" y="368" width="844" height="40" rx="12" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
  <rect x="28" y="392"  width="844" height="16" fill="#fde68a"/>
  <text x="50" y="394" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="15" font-weight="700" fill="#92400e">
    🟡  Compatibility
  </text>

  <!-- ── Row 1: Cache persistence ── -->
  <rect x="44"  y="422" width="220" height="54" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="442" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Cache persistence</text>
  <text x="154" y="460" text-anchor="middle" dominant-baseline="middle"
        font-family="Comic Mono"
        font-size="11" fill="#78716c">across restarts</text>
  <line x1="264" y1="449" x2="292" y2="449"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="294" y="416" width="536" height="62" rx="8"
        fill="white" stroke="#ca8a04" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="435"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#92400e">OkHttp3 · Disk cache · Android</text>
  <text x="314" y="452"
        font-family="Comic Mono"
        font-size="11" fill="#ca8a04">okhttp3ClientWithCache()</text>
  <text x="314" y="468"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Persistent disk cache · Android-compatible · OkHttp interceptors</text>

  <!-- ── Row 2: Zero dependency ── -->
  <rect x="44"  y="492" width="220" height="44" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="514" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Zero dependency</text>
  <line x1="264" y1="514" x2="292" y2="514"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-amber)"/>
  <rect x="294" y="486" width="536" height="56" rx="8"
        fill="white" stroke="#ca8a04" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="505"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#92400e">JDK HttpClient</text>
  <text x="314" y="522"
        font-family="Comic Mono"
        font-size="11" fill="#ca8a04">java.net.http.HttpClient — built into JDK 11+</text>
  <text x="314" y="537"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">No extra dependency · HTTP/2 · async via CompletableFuture</text>


  <!-- ╔══════════════════════════════════════════════════════════╗ -->
  <!-- ║  PANEL 3 — Ecosystem (Green)                            ║ -->
  <!-- ╚══════════════════════════════════════════════════════════╝ -->
  <rect x="28" y="562" width="844" height="166" rx="12"
        fill="#dcfce7" stroke="#16a34a" stroke-width="2"
        filter="url(#shadow-panel)"/>
  <!-- header -->
  <rect x="28" y="562" width="844" height="40" rx="12" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <rect x="28" y="586"  width="844" height="16" fill="#bbf7d0"/>
  <text x="50" y="588" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="15" font-weight="700" fill="#14532d">
    🟢  Ecosystem-Specific
  </text>

  <!-- ── Row 1: Ktor apps ── -->
  <rect x="44"  y="614" width="220" height="44" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="636" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Ktor apps</text>
  <line x1="264" y1="636" x2="292" y2="636"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="294" y="606" width="536" height="56" rx="8"
        fill="white" stroke="#16a34a" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="626"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#14532d">Ktor CIO</text>
  <text x="314" y="643"
        font-family="Comic Mono"
        font-size="11" fill="#16a34a">HttpClient(CIO) — Ktor native engine</text>
  <text x="314" y="657"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Coroutine-native · Multiplatform · lightweight plugin system</text>

  <!-- ── Row 2: Vert.x apps ── -->
  <rect x="44"  y="676" width="220" height="44" rx="20"
        fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="154" y="698" text-anchor="middle" dominant-baseline="middle"
        font-family="Architects Daughter"
        font-size="12" fill="#374151">Vert.x apps</text>
  <line x1="264" y1="698" x2="292" y2="698"
        stroke="#64748b" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="294" y="668" width="536" height="56" rx="8"
        fill="white" stroke="#16a34a" stroke-width="1.5"
        filter="url(#shadow-card)"/>
  <text x="314" y="688"
        font-family="Architects Daughter"
        font-size="13" font-weight="700" fill="#14532d">Vert.x WebClient</text>
  <text x="314" y="705"
        font-family="Comic Mono"
        font-size="11" fill="#16a34a">WebClient.create(vertx) — reactive HTTP client</text>
  <text x="314" y="719"
        font-family="Comic Mono"
        font-size="10" fill="#64748b">Event-loop driven · RxJava3 / Kotlin coroutines bridge</text>

</svg>
