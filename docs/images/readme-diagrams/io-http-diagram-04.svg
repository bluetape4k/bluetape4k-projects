<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1200" viewBox="0 0 1760 1200" role="img" aria-label="HTTP Client Primary Recommendations">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-teal" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#0D9488" stroke="#0D9488" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-orange" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#EA580C" stroke="#EA580C" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-blue" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 14 8 L 2 14 Z" fill="#2563EB" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
    <style>
      svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
      .canvas{fill:#F8FAFC}
      .frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#softShadow)}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#0F172A}
      .subtitle{font-family:"Comic Mono";font-size:17px;fill:#475569}
      .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}
      .panelTitle{font-family:"Architects Daughter";font-size:27px;fill:#0F172A}
      .card{stroke-width:2;filter:url(#softShadow)}
      .cardTitle{font-family:"Architects Daughter";font-size:25px;fill:#0F172A}
      .cardTitleSmall{font-family:"Architects Daughter";font-size:22px;fill:#0F172A}
      .text{font-family:"Comic Mono";font-size:14px;fill:#475569}
      .textSmall{font-family:"Comic Mono";font-size:13px;fill:#475569}
      .badge{fill:#FFFFFF;stroke-width:1.4}
      .badgeText{font-family:"Comic Mono";font-size:12px;fill:#0F172A}
      .arrow{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect class="canvas" width="1760" height="1200"/>
  <rect class="frame" x="36" y="30" width="1688" height="1140" rx="8"/>
  <text class="title" x="76" y="86">HTTP Client Primary Recommendations</text>
  <text class="subtitle" x="80" y="120">HC5 is the default production recommendation; other clients remain first-class choices when their ecosystem or capability is the better fit.</text>

  <g id="primary">
    <rect class="card" x="110" y="166" width="1540" height="132" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
    <rect class="badge" x="146" y="196" width="160" height="30" rx="8" fill="#CCFBF1" stroke="#0D9488"/>
    <text class="badgeText" x="226" y="212" text-anchor="middle" dominant-baseline="middle">default choice</text>
    <text class="cardTitle" x="880" y="218" text-anchor="middle" dominant-baseline="middle">Apache HttpComponents 5 is primary for production backend calls</text>
    <text class="text" x="880" y="256" text-anchor="middle" dominant-baseline="middle">deepest module investment: production factories, pool tuning, retry, keep-alive fallback, HTTP/2, TLS, cache, virtual-thread support, and coroutine bridge</text>
  </g>

  <g id="hc5-panel">
    <rect class="panel" x="96" y="342" width="930" height="650" rx="8"/>
    <text class="panelTitle" x="136" y="388" dominant-baseline="middle">Use HC5 first when...</text>

    <g id="sync-scenario">
      <rect class="card" x="136" y="440" width="330" height="104" rx="8" fill="#FFFFFF" stroke="#0D9488"/>
      <text class="cardTitleSmall" x="301" y="474" text-anchor="middle" dominant-baseline="middle">Sync backend calls</text>
      <text class="textSmall" x="301" y="510" text-anchor="middle">high throughput with blocking APIs</text>
      <rect class="card" x="616" y="430" width="350" height="124" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
      <text class="cardTitleSmall" x="791" y="465" text-anchor="middle" dominant-baseline="middle">HC5 Classic + VT</text>
      <text class="textSmall" x="791" y="501" text-anchor="middle">productionVirtualThreadHttpClientOf()</text>
      <text class="textSmall" x="791" y="525" text-anchor="middle">production pool, retry, timeout defaults</text>
      <path class="arrow" d="M 466 492 L 616 492" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
    </g>

    <g id="async-scenario">
      <rect class="card" x="136" y="620" width="330" height="104" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
      <text class="cardTitleSmall" x="301" y="654" text-anchor="middle" dominant-baseline="middle">Async backend calls</text>
      <text class="textSmall" x="301" y="690" text-anchor="middle">coroutine-first service code</text>
      <rect class="card" x="616" y="610" width="350" height="124" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
      <text class="cardTitleSmall" x="791" y="645" text-anchor="middle" dominant-baseline="middle">HC5 Async + Coroutines</text>
      <text class="textSmall" x="791" y="681" text-anchor="middle">productionHttpAsyncClientOf()</text>
      <text class="textSmall" x="791" y="705" text-anchor="middle">executeSuspending(...) bridge</text>
      <path class="arrow" d="M 466 672 L 616 672" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
    </g>

    <g id="cache-scenario">
      <rect class="card" x="136" y="800" width="330" height="104" rx="8" fill="#FFFFFF" stroke="#EA580C"/>
      <text class="cardTitleSmall" x="301" y="834" text-anchor="middle" dominant-baseline="middle">Cacheable GETs</text>
      <text class="textSmall" x="301" y="870" text-anchor="middle">maximum in-process cache throughput</text>
      <rect class="card" x="616" y="790" width="350" height="124" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
      <text class="cardTitleSmall" x="791" y="825" text-anchor="middle" dominant-baseline="middle">HC5 in-memory cache</text>
      <text class="textSmall" x="791" y="861" text-anchor="middle">memoryCachingHttpClientOf()</text>
      <text class="textSmall" x="791" y="885" text-anchor="middle">RFC 7234 cache storage helpers</text>
      <path class="arrow" d="M 466 852 L 616 852" stroke="#EA580C" marker-end="url(#arrow-orange)"/>
    </g>
  </g>

  <g id="alternatives-panel">
    <rect class="panel" x="1070" y="342" width="590" height="650" rx="8"/>
    <text class="panelTitle" x="1110" y="388" dominant-baseline="middle">Use another backend when...</text>

    <g id="okhttp-alt">
      <rect class="card" x="1110" y="440" width="510" height="94" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
      <text class="cardTitleSmall" x="1365" y="471" text-anchor="middle" dominant-baseline="middle">OkHttp3 + disk cache</text>
      <text class="textSmall" x="1365" y="505" text-anchor="middle">cache persistence, Android-compatible code, existing OkHttp usage</text>
    </g>

    <g id="ktor-alt">
      <rect class="card" x="1110" y="570" width="510" height="94" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
      <text class="cardTitleSmall" x="1365" y="601" text-anchor="middle" dominant-baseline="middle">Ktor CIO</text>
      <text class="textSmall" x="1365" y="635" text-anchor="middle">Ktor application code and suspend-native plugin ecosystem</text>
    </g>

    <g id="vertx-alt">
      <rect class="card" x="1110" y="700" width="510" height="94" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
      <text class="cardTitleSmall" x="1365" y="731" text-anchor="middle" dominant-baseline="middle">Vert.x HttpClient</text>
      <text class="textSmall" x="1365" y="765" text-anchor="middle">Vert.x event-loop applications already own the Vertx context</text>
    </g>

    <g id="jdk-alt">
      <rect class="card" x="1110" y="830" width="510" height="94" rx="8" fill="#EEF2FF" stroke="#4F46E5"/>
      <text class="cardTitleSmall" x="1365" y="861" text-anchor="middle" dominant-baseline="middle">JDK HttpClient</text>
      <text class="textSmall" x="1365" y="895" text-anchor="middle">zero-dependency services where standard-library features are enough</text>
    </g>
  </g>

  <g id="no-deprecation">
    <rect class="card" x="170" y="1032" width="1420" height="72" rx="8" fill="#F8FAFC" stroke="#64748B"/>
    <text class="cardTitleSmall" x="370" y="1069" text-anchor="middle" dominant-baseline="middle">Compatibility rule</text>
    <text class="text" x="930" y="1069" text-anchor="middle" dominant-baseline="middle">No backend is deprecated by this recommendation; non-HC5 clients stay supported for their target ecosystems.</text>
  </g>
</svg>
