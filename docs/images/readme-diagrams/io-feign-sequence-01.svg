<svg xmlns="http://www.w3.org/2000/svg" width="2476" height="1138" viewBox="0 0 2476 1138" role="img" aria-label="Suspend Function HTTP Request Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2476" height="1138"/>
<rect class="frame" x="32" y="28" width="2412" height="1082" rx="28"/>
<text class="title" x="66" y="82">Suspend Function HTTP Request Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="483.2" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="633.2" y="198.5" text-anchor="middle">Feign interface</text>
<text class="smallLabel" x="633.2" y="219.5" text-anchor="middle">(suspend fun)</text>
<line class="lifeline" x1="633.2" y1="252" x2="633.2" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="886.4" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1036.4" y="198.5" text-anchor="middle">Coroutine</text>
<text class="smallLabel" x="1036.4" y="219.5" text-anchor="middle">Feign.Coroutine</text>
<line class="lifeline" x1="1036.4" y1="252" x2="1036.4" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1289.6" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1439.6" y="209" text-anchor="middle">AsyncClient</text>
<line class="lifeline" x1="1439.6" y1="252" x2="1439.6" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1692.8" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1842.8" y="209" text-anchor="middle">JacksonDecoder2</text>
<line class="lifeline" x1="1842.8" y1="252" x2="1842.8" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="2096" y="166" width="300" height="72" rx="20" fill="#F1ECFF" stroke="#8A72D6"/>
<text class="smallLabel" x="2246" y="209" text-anchor="middle">HTTP Server</text>
<line class="lifeline" x1="2246" y1="252" x2="2246" y2="1078" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="409.2" y="286" width="448" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="427.2" y="313" text-anchor="start">1. coroutineFeignBuilderOf().client&lt;MyApi&gt;(baseUrl)</text>
<path class="line" d="M230 332 L1036.4 332"/>
<rect x="528.2" y="362" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="546.2" y="389" text-anchor="start">2. Return MyApi proxy</text>
<path class="dashed" d="M1036.4 408 L230 408"/>
<rect x="316.6" y="438" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="334.6" y="465" text-anchor="start">3. suspend fun someApi()</text>
<path class="line" d="M230 484 L633.2 484"/>
<rect x="931.4" y="514" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949.4" y="541" text-anchor="start">4. Async HTTP request</text>
<path class="line" d="M633.2 560 L1439.6 560"/>
<rect x="1737.8" y="590" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1755.8" y="617" text-anchor="start">5. HTTP request</text>
<path class="line" d="M1439.6 636 L2246 636"/>
<rect x="1737.8" y="666" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1755.8" y="693" text-anchor="start">6. HTTP response</text>
<path class="dashed" d="M2246 712 L1439.6 712"/>
<rect x="931.4" y="742" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="949.4" y="769" text-anchor="start">7. Response</text>
<path class="dashed" d="M1439.6 788 L633.2 788"/>
<rect x="1119" y="818" width="238" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1137" y="845" text-anchor="start">8. decode(response, type)</text>
<path class="line" d="M633.2 864 L1842.8 864"/>
<rect x="1131" y="894" width="214" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1149" y="921" text-anchor="start">9. Deserialized object</text>
<path class="dashed" d="M1842.8 940 L633.2 940"/>
<rect x="326.6" y="970" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="344.6" y="997" text-anchor="start">10. Return result</text>
<path class="dashed" d="M633.2 1016 L230 1016"/>
</svg>
