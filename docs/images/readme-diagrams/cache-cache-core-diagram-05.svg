<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1160" viewBox="0 0 1780 1160" role="img" aria-labelledby="title desc">
  <title id="title">NearJCache Two-Tier Write-Through</title>
  <desc id="desc">Explain the blocking NearJCache runtime flow, listener invalidation, and configuration boundary.</desc>
  <defs>
    <font-face font-family="Architects Daughter" src="url('file:///Users/debop/Library/Fonts/ArchitectsDaughter-Regular.ttf')"/>
    <font-face font-family="Comic Mono" src="url('file:///Users/debop/Library/Fonts/ComicMono-Bold.ttf')"/>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.11"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.2" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 5 2.5 L 0 5 z" fill="context-stroke"/></marker>
    <marker id="hollow" viewBox="0 0 7 6" markerWidth="7" markerHeight="6" refX="6.5" refY="3" orient="auto"><path d="M 0.8 0.8 L 6.5 3 L 0.8 5.2 z" fill="#FFFFFF" stroke="context-stroke" stroke-width="1.2"/></marker>
    <style>
      .canvas{fill:#F6F9FC}.decor{fill:#FFFFFF;stroke:#C4D6E7;stroke-width:3.2;filter:url(#shadow)}
      .innerFrame{fill:#FBFDFF;stroke:#D9E4EF;stroke-width:2}.group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .cardTitle,.classTitle{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .stereo,.detail,.member,.small{font-family:"Comic Mono";font-weight:400}
      .stereo{font-size:13px;fill:#687789}.detail{font-size:14px;fill:#42556B}.member{font-size:13px;fill:#42556B}.small{font-size:13px;fill:#627184}
      .card{filter:url(#shadow);stroke-width:2}.connector{fill:none;stroke-width:2.7;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.inherit{marker-end:url(#hollow)}.dashed{stroke-dasharray:7 6}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.1}
    </style>
  </defs>
  <rect class="canvas" width="1780" height="1160"/>
  <rect class="decor" x="44" y="36" width="1692" height="1088" rx="34"/>
  <rect class="innerFrame" x="82" y="154" width="1616" height="874" rx="24"/>
  <text class="title" x="72" y="88">NearJCache Two-Tier Write-Through</text>
  <text class="subtitle" x="76" y="121">Blocking JCache callers hit the local front cache first while writes update front and synchronize the back cache.</text>
  <g id="panel-caller">
    <rect class="group" x="90" y="185" width="390" height="175" rx="20"/>
    <text class="groupTitle" x="120" y="213" dominant-baseline="middle">Blocking caller</text>
  </g>
  <g id="panel-facade">
    <rect class="group" x="555" y="165" width="620" height="300" rx="20"/>
    <text class="groupTitle" x="585" y="193" dominant-baseline="middle">NearJCache facade</text>
  </g>
  <g id="panel-tiers">
    <rect class="group" x="165" y="555" width="1450" height="210" rx="20"/>
    <text class="groupTitle" x="195" y="583" dominant-baseline="middle">Two cache tiers</text>
  </g>
  <g id="panel-events">
    <rect class="group" x="245" y="830" width="1285" height="170" rx="20"/>
    <text class="groupTitle" x="275" y="858" dominant-baseline="middle">Back-cache event synchronization</text>
  </g>
  <path class="connector" data-edge="caller-&gt;near" data-label="JCache calls" d="M 455 291 L 670 291" stroke="#4F83BF"/>
  <g transform="translate(508.1,254)">
    <rect class="labelPill" x="0" y="0" width="108.8" height="26" rx="8"/>
    <text class="small" x="54.4" y="13" text-anchor="middle" dominant-baseline="middle" fill="#4F83BF">JCache calls</text>
  </g>
  <path class="connector" data-edge="near-&gt;front" data-label="read first / fill" d="M 670 300 L 620 300 L 620 500 L 435 500 L 435 615" stroke="#45A7A1"/>
  <g transform="translate(454.6,463)">
    <rect class="labelPill" x="0" y="0" width="145.8" height="26" rx="8"/>
    <text class="small" x="72.9" y="13" text-anchor="middle" dominant-baseline="middle" fill="#45A7A1">read first / fill</text>
  </g>
  <path class="connector" data-edge="front-&gt;back" data-label="front miss lookup" d="M 620 687 L 650 687 L 650 748 L 1290 748 L 1290 719" stroke="#D9AA4D"/>

  <path class="connector" data-edge="sync-&gt;back" data-label="write-through" d="M 1005 658 L 1100 658" stroke="#6B7D90"/>

  <path class="connector" data-edge="near-&gt;sync" data-label="mutations" d="M 1060 286 L 1095 286 L 1095 570 L 870 570 L 870 615" stroke="#58A978"/>
  <g transform="translate(939.2,533)">
    <rect class="labelPill" x="0" y="0" width="86.6" height="26" rx="8"/>
    <text class="small" x="43.3" y="13" text-anchor="middle" dominant-baseline="middle" fill="#58A978">mutations</text>
  </g>
  <path class="connector" data-edge="back-&gt;listener" data-label="entry events" d="M 1380 719 L 1380 805 L 950 805 L 950 895" stroke="#DB7890"/>
  <g transform="translate(1110.6,768)">
    <rect class="labelPill" x="0" y="0" width="108.8" height="26" rx="8"/>
    <text class="small" x="54.4" y="13" text-anchor="middle" dominant-baseline="middle" fill="#DB7890">entry events</text>
  </g>
  <path class="connector" data-edge="listener-&gt;front" data-label="invalidate/update" d="M 625 931 L 200 931 L 200 667 L 245 667" stroke="#DB7890"/>

  <path class="connector" data-edge="config-&gt;near" data-label="configures" d="M 865 365 L 865 339" stroke="#8A72D6"/>

  <g id="node-caller" transform="translate(125,250)">
    <rect class="card" x="0" y="0" width="330" height="82" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="cardTitle" x="165" y="22" text-anchor="middle" dominant-baseline="middle">Application / JCache client</text>
    <text class="detail" x="165" y="41" text-anchor="middle" dominant-baseline="middle">javax.cache.Cache&lt;K,V&gt;</text>
    <text class="detail" x="165" y="60" text-anchor="middle" dominant-baseline="middle">blocking API</text>
  </g>
  <g id="node-near" transform="translate(670,235)">
    <rect class="card" x="0" y="0" width="390" height="104" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="cardTitle" x="195" y="23.5" text-anchor="middle" dominant-baseline="middle">NearJCache&lt;K,V&gt;</text>
    <text class="detail" x="195" y="42.5" text-anchor="middle" dominant-baseline="middle">JCache&lt;K,V&gt; by backCache</text>
    <text class="detail" x="195" y="61.5" text-anchor="middle" dominant-baseline="middle">front-first getDeeply()</text>
    <text class="detail" x="195" y="80.5" text-anchor="middle" dominant-baseline="middle">write-through operations</text>
  </g>
  <g id="node-config" transform="translate(690,365)">
    <rect class="card" x="0" y="0" width="350" height="82" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="175" y="12.5" text-anchor="middle" dominant-baseline="middle">NearJCacheConfig DSL</text>
    <text class="detail" x="175" y="31.5" text-anchor="middle" dominant-baseline="middle">Caffeine front factory</text>
    <text class="detail" x="175" y="50.5" text-anchor="middle" dominant-baseline="middle">isSynchronous</text>
    <text class="detail" x="175" y="69.5" text-anchor="middle" dominant-baseline="middle">syncRemoteTimeout</text>
  </g>
  <g id="node-front" transform="translate(245,615)">
    <rect class="card" x="0" y="0" width="375" height="104" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="187.5" y="23.5" text-anchor="middle" dominant-baseline="middle">Front JCache</text>
    <text class="detail" x="187.5" y="42.5" text-anchor="middle" dominant-baseline="middle">local provider</text>
    <text class="detail" x="187.5" y="61.5" text-anchor="middle" dominant-baseline="middle">contains/get are front-only</text>
    <text class="detail" x="187.5" y="80.5" text-anchor="middle" dominant-baseline="middle">clear() clears front</text>
  </g>
  <g id="node-back" transform="translate(1100,615)">
    <rect class="card" x="0" y="0" width="380" height="104" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="cardTitle" x="190" y="23.5" text-anchor="middle" dominant-baseline="middle">Back JCache</text>
    <text class="detail" x="190" y="42.5" text-anchor="middle" dominant-baseline="middle">distributed provider</text>
    <text class="detail" x="190" y="61.5" text-anchor="middle" dominant-baseline="middle">source of invalidation events</text>
    <text class="detail" x="190" y="80.5" text-anchor="middle" dominant-baseline="middle">removeAll chunking</text>
  </g>
  <g id="node-listener" transform="translate(625,895)">
    <rect class="card" x="0" y="0" width="390" height="72" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="cardTitle" x="195" y="17" text-anchor="middle" dominant-baseline="middle">JCacheEntryEventListener</text>
    <text class="detail" x="195" y="36" text-anchor="middle" dominant-baseline="middle">created/updated -&gt; putAll</text>
    <text class="detail" x="195" y="55" text-anchor="middle" dominant-baseline="middle">removed/expired -&gt; removeAll</text>
  </g>
  <g id="node-sync" transform="translate(735,615)">
    <rect class="card" x="0" y="0" width="270" height="86" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="cardTitle" x="135" y="24" text-anchor="middle" dominant-baseline="middle">syncBackCache</text>
    <text class="detail" x="135" y="43" text-anchor="middle" dominant-baseline="middle">put/remove/replace</text>
    <text class="detail" x="135" y="62" text-anchor="middle" dominant-baseline="middle">remote timeout guard</text>
  </g>
  <g transform="translate(76,1056)">
    <rect class="labelPill" x="0" y="0" width="1628" height="48" rx="10"/>
    <text class="small" x="814" y="24" text-anchor="middle" dominant-baseline="middle">Source: cache README files and public cache contract implementations.</text>
  </g>
</svg>
