<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1988" viewBox="0 0 1960 1988" role="img" aria-label="Synchronous FSM Transition Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1988"/>
<rect class="frame" x="32" y="28" width="1896" height="1932" rx="28"/>
<text class="title" x="66" y="82">Synchronous FSM Transition Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1928" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="209" text-anchor="middle">DefaultStateMachine</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1928" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="209" text-anchor="middle">AtomicReference</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1928" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="209" text-anchor="middle">TransitionMap</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1928" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="198.5" text-anchor="middle">On Transition</text>
<text class="smallLabel" x="1820" y="219.5" text-anchor="middle">Callback</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1928" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="245" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="263" y="313" text-anchor="start">1. transition(event)</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="655" y="396" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="673" y="423" text-anchor="start">2. get() → previousState</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="432.5" y="506" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="450.5" y="533" text-anchor="start">3. finalStates.contains(previousState)?</text>
<path class="line" d="M560 564 C624 564 624 598 560 598"/>
<rect x="70" y="636" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="663" text-anchor="start">ALT: final state</text>
<rect x="211" y="704" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="229" y="731" text-anchor="start">5. throw StateMachineException</text>
<path class="dashed" d="M560 762 L140 762"/>
<rect x="760.5" y="814" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="778.5" y="841" text-anchor="start">6. get(TransitionKey(previousState, event::class))</text>
<path class="line" d="M560 872 L1400 872"/>
<rect x="70" y="924" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="951" text-anchor="start">ALT: no transition</text>
<rect x="211" y="992" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="229" y="1019" text-anchor="start">8. throw StateMachineException</text>
<path class="dashed" d="M560 1050 L140 1050"/>
<rect x="432.5" y="1102" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="450.5" y="1129" text-anchor="start">9. guard?.invoke(previousState, event)?</text>
<path class="line" d="M560 1160 C624 1160 624 1194 560 1194"/>
<rect x="70" y="1232" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1259" text-anchor="start">ALT: guard failed</text>
<rect x="207" y="1300" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="225" y="1327" text-anchor="start">11. throw StateMachineException</text>
<path class="dashed" d="M560 1358 L140 1358"/>
<rect x="578.5" y="1410" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="596.5" y="1437" text-anchor="start">12. compareAndSet(previousState, nextState)</text>
<path class="line" d="M560 1468 L980 1468"/>
<rect x="70" y="1520" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="92" y="1547" text-anchor="start">ALT: CAS failure (concurrent transition conflict)</text>
<rect x="207" y="1588" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="225" y="1615" text-anchor="start">14. throw StateMachineException</text>
<path class="dashed" d="M560 1646 L140 1646"/>
<rect x="1039" y="1698" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1057" y="1725" text-anchor="start">15. invoke(previous, event, next)</text>
<path class="line" d="M560 1756 L1820 1756"/>
<rect x="158.5" y="1808" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="176.5" y="1835" text-anchor="start">16. TransitionResult(previous, event, next)</text>
<path class="dashed" d="M560 1866 L140 1866"/>
</svg>
