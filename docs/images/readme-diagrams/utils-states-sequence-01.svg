<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1290" viewBox="0 0 2140 1290" role="img" aria-label="Synchronous FSM Transition Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2140" height="1290"/>
<rect class="frame" x="32" y="28" width="2076" height="1234" rx="28"/>
<text class="title" x="66" y="82">Synchronous FSM Transition Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="500" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="650" y="209" text-anchor="middle">DefaultStateMachine</text>
<line class="lifeline" x1="650" y1="252" x2="650" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="920" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1070" y="209" text-anchor="middle">AtomicReference</text>
<line class="lifeline" x1="1070" y1="252" x2="1070" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1340" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1490" y="209" text-anchor="middle">TransitionMap</text>
<line class="lifeline" x1="1490" y1="252" x2="1490" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1760" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1910" y="198.5" text-anchor="middle">On Transition</text>
<text class="smallLabel" x="1910" y="219.5" text-anchor="middle">Callback</text>
<line class="lifeline" x1="1910" y1="252" x2="1910" y2="1230" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="335" y="286" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="353" y="313" text-anchor="start">1. transition(event)</text>
<path class="line" d="M230 332 L650 332"/>
<rect x="745" y="362" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="763" y="389" text-anchor="start">2. get() → previousState</text>
<path class="line" d="M650 408 L1070 408"/>
<rect x="522.5" y="438" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="540.5" y="465" text-anchor="start">3. finalStates.contains(previousState)?</text>
<path class="line" d="M650 484 C714 484 714 518 650 518"/>
<rect x="160" y="636" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="663" text-anchor="start">ALT: final state</text>
<rect x="301" y="514" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="319" y="541" text-anchor="start">5. throw StateMachineException</text>
<path class="dashed" d="M650 560 L230 560"/>
<rect x="850.5" y="590" width="439" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="868.5" y="617" text-anchor="start">6. get(TransitionKey(previousState, event::class))</text>
<path class="line" d="M650 636 L1490 636"/>
<rect x="160" y="924" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="951" text-anchor="start">ALT: no transition</text>
<rect x="301" y="666" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="319" y="693" text-anchor="start">8. throw StateMachineException</text>
<path class="dashed" d="M650 712 L230 712"/>
<rect x="522.5" y="742" width="351" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="540.5" y="769" text-anchor="start">9. guard?.invoke(previousState, event)?</text>
<path class="line" d="M650 788 C714 788 714 822 650 822"/>
<rect x="160" y="1232" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1259" text-anchor="start">ALT: guard failed</text>
<rect x="297" y="818" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="315" y="845" text-anchor="start">11. throw StateMachineException</text>
<path class="dashed" d="M650 864 L230 864"/>
<rect x="668.5" y="894" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="686.5" y="921" text-anchor="start">12. compareAndSet(previousState, nextState)</text>
<path class="line" d="M650 940 L1070 940"/>
<rect x="160" y="1520" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1547" text-anchor="start">ALT: CAS failure (concurrent transition conflict)</text>
<rect x="297" y="970" width="286" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="315" y="997" text-anchor="start">14. throw StateMachineException</text>
<path class="dashed" d="M650 1016 L230 1016"/>
<rect x="1129" y="1046" width="302" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1147" y="1073" text-anchor="start">15. invoke(previous, event, next)</text>
<path class="line" d="M650 1092 L1910 1092"/>
<rect x="248.5" y="1122" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="266.5" y="1149" text-anchor="start">16. TransitionResult(previous, event, next)</text>
<path class="dashed" d="M650 1168 L230 1168"/>
</svg>
