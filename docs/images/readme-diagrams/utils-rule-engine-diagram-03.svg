<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-label="Rule Engine Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="32" y="28" width="1436" height="724" rx="30"/>
<text class="title" x="68" y="84">Rule Engine Class Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="InferenceRuleEngine" data-to="RuleEngine" data-route-color="green" d="M579 398 L579 311" stroke="#3E9868"/>
<path class="inherit" data-from="DefaultRuleEngine" data-to="RuleEngine" data-route-color="blue" d="M465 398 L465 311" stroke="#4F83BF"/>
<g id="DefaultSuspendRuleEngine">
  <rect class="classCard" x="993" y="165" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1173" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="203" text-anchor="middle">DefaultSuspendRule</text>
<text class="classTitle" x="1173" y="225" text-anchor="middle">Engine</text>
  <line x1="993" y1="229" x2="1353" y2="229" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="1027" y="270">+fire(rules, facts)</text>
</g>
<g id="RuleEngine">
  <rect class="classCard" x="342" y="165" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="522" y="184" text-anchor="middle">interface</text>
  <text class="classTitle" x="522" y="212" text-anchor="middle">RuleEngine</text>
  <line x1="342" y1="221" x2="702" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="376" y="253">+config: RuleEngineConfig</text>
<text class="member" x="376" y="270">+fire(rules: RuleSet, facts: Facts)</text>
<text class="member" x="376" y="287">+check(rules: RuleSet, facts: Facts):</text>
</g>
<g id="RuleEngineConfig">
  <rect class="classCard" x="993" y="331" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="1173" y="350" text-anchor="middle">class</text>
  <text class="classTitle" x="1173" y="378" text-anchor="middle">RuleEngineConfig</text>
  <line x1="993" y1="387" x2="1353" y2="387" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1027" y="419">+skipOnFirstAppliedRule: Boolean</text>
<text class="member" x="1027" y="436">+skipOnFirstFailedRule: Boolean</text>
<text class="member" x="1027" y="453">+skipOnFirstNonTriggeredRule: Boolean</text>
</g>
<g id="DefaultRuleEngine">
  <rect class="classCard" x="147" y="398" width="360" height="146" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="327" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="327" y="445" text-anchor="middle">DefaultRuleEngine</text>
  <line x1="147" y1="454" x2="507" y2="454" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="181" y="486">+fire(rules, facts)</text>
<text class="member" x="181" y="503">+addRuleListener(listener)</text>
<text class="member" x="181" y="520">+addRuleEngineListener(listener)</text>
</g>
<g id="InferenceRuleEngine">
  <rect class="classCard" x="537" y="398" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="717" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="717" y="445" text-anchor="middle">InferenceRuleEngine</text>
  <line x1="537" y1="454" x2="897" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="571" y="499">+fire(rules, facts)</text>
</g>
<g>
  <rect x="1085" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 690 L1161 690" stroke="#3E9868"/>
  <text class="detail" x="1175" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1103 711 L1161 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
