  <text class="stereo" x="1534" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="212" text-anchor="middle">StructuredTaskScopes</text>
  <line x1="1354" y1="221" x2="1714" y2="221" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1388" y="253">+failFast(name, factory, block) T</text>
<text class="member" x="1388" y="270">+firstSuccess(name, factory,</text>
<text class="member" x="1388" y="287">block) T</text>
</g>
<g id="VirtualThreads">
  <rect class="classCard" x="508" y="165" width="360" height="146" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="688" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="212" text-anchor="middle">VirtualThreads</text>
  <line x1="508" y1="221" x2="868" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="542" y="253">+runtime() VirtualThreadRuntime</text>
<text class="member" x="542" y="270">+runtimeName() String</text>
<text class="member" x="542" y="287">+threadFactory(prefix)</text>
</g>
<g id="StructuredTaskScopeAll">
  <rect class="classCard" x="1354" y="815" width="360" height="146" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1534" y="834" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="862" text-anchor="middle">StructuredTaskScopeAll</text>
  <line x1="1354" y1="871" x2="1714" y2="871" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1388" y="903">+fork(task) StructuredSubtask~T~</text>
<text class="member" x="1388" y="920">+join() StructuredTaskScopeAll</text>
<text class="member" x="1388" y="937">+joinUntil(deadline)</text>
</g>
<g id="StructuredTaskScopeAnyT">
  <rect class="classCard" x="1354" y="989" width="360" height="146" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1534" y="1008" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="1036" text-anchor="middle">StructuredTaskScopeAnyT</text>
  <line x1="1354" y1="1045" x2="1714" y2="1045" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1388" y="1077">+fork(task) StructuredSubtask~T~</text>
<text class="member" x="1388" y="1094">+join() StructuredTaskScopeAny~T~</text>
<text class="member" x="1388" y="1111">+joinUntil(deadline)</text>
</g>
<g id="Jdk25VirtualThreadRuntime">
  <rect class="classCard" x="118" y="631" width="380" height="138" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="308" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="308" y="678" text-anchor="middle">Jdk25VirtualThreadRuntime</text>
  <line x1="118" y1="687" x2="498" y2="687" stroke="#9AA8B8" stroke-width="1.4"/>
