  <text class="stereo" x="698" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="698" y="678" text-anchor="middle">Jdk21VirtualThreadRuntime</text>
  <line x1="508" y1="687" x2="888" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="542" y="724">+runtimeName = jdk21</text>
<text class="member" x="542" y="741">+priority = 21</text>
</g>
<g id="PlatformThreadFallback">
  <rect class="classCard" x="898" y="631" width="360" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1078" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1078" y="678" text-anchor="middle">PlatformThreadFallback</text>
  <line x1="898" y1="687" x2="1258" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="932" y="724">+runtimeName = platform-fallback</text>
<text class="member" x="932" y="741">+priority = MIN_VALUE</text>
</g>
<g>
  <rect x="1457" y="1197" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1475 1215 L1533 1215" stroke="#3E9868"/>
  <text class="detail" x="1547" y="1220">inheritance / implementation</text>
  <path class="dependency" d="M1475 1236 L1533 1236" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1547" y="1241">dependency / usage</text>
</g>
<g><rect x="180" y="1215" width="1232" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="796" y="1241" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
