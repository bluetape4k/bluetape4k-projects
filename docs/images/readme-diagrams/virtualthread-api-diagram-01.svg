<svg xmlns="http://www.w3.org/2000/svg" width="1872" height="1305" viewBox="0 0 1872 1305" role="img" aria-label="Api Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1872" height="1305"/>
<rect class="frame" x="32" y="28" width="1808" height="1249" rx="30"/>
<text class="title" x="68" y="84">Api Class Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="StructuredTaskScopeProvider" data-to="StructuredTaskScopeSupervised" data-route-color="teal" d="M1544 544 L1544 631" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="StructuredTaskScopes" data-to="StructuredTaskScopeProvider" data-route-color="amber" d="M1544 311 L1544 398" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="VirtualThreads" data-to="VirtualThreadRuntime" data-route-color="pink" d="M688 311 L688 398" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="inherit" data-from="PlatformThreadFallback" data-to="VirtualThreadRuntime" data-route-color="amber" d="M946 631 L946 512 L868 512" stroke="#B9851B"/>
<path class="inherit" data-from="Jdk25VirtualThreadRuntime" data-to="VirtualThreadRuntime" data-route-color="pink" d="M450 631 L450 512 L508 512" stroke="#C94D68"/>
<path class="inherit" data-from="Jdk21VirtualThreadRuntime" data-to="VirtualThreadRuntime" data-route-color="purple" d="M693 631 L693 544" stroke="#755BC6"/>
<g id="StructuredTaskScopeSupervised">
  <rect class="classCard" x="1354" y="631" width="360" height="156" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="1534" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1534" y="669" text-anchor="middle">StructuredTaskScope</text>
<text class="classTitle" x="1534" y="691" text-anchor="middle">Supervised</text>
  <line x1="1354" y1="695" x2="1714" y2="695" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="1388" y="728">+fork(task) StructuredSubtask~T~</text>
<text class="member" x="1388" y="745">+join()</text>
<text class="member" x="1388" y="762">StructuredTaskScopeSupervised~T~</text>
</g>
<g id="StructuredTaskScopeProvider">
  <rect class="classCard" x="1354" y="398" width="400" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1554" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1554" y="436" text-anchor="middle">StructuredTaskScope</text>
<text class="classTitle" x="1554" y="458" text-anchor="middle">Provider</text>
  <line x1="1354" y1="462" x2="1754" y2="462" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="1388" y="490">+providerName: String</text>
<text class="member" x="1388" y="507">+priority: Int</text>
<text class="member" x="1388" y="524">+isSupported() Boolean</text>
</g>
<g id="VirtualThreadRuntime">
