  <text class="stereo" x="688" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="688" y="445" text-anchor="middle">VirtualThreadRuntime</text>
  <line x1="508" y1="454" x2="868" y2="454" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="542" y="486">+runtimeName: String</text>
<text class="member" x="542" y="503">+priority: Int</text>
<text class="member" x="542" y="520">+isSupported() Boolean</text>
</g>
<g id="StructuredTaskScopes">
