<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1120" viewBox="0 0 1754 1120" role="img" aria-label="Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1120"/>
<rect class="frame" x="32" y="28" width="1690" height="1064" rx="28"/>
<text class="title" x="66" y="82">Class Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 428 C1082 457 467 457 467 486"/>
<path class="line" d="M1492 172 C1492 300 1082 300 1082 428"/>
<path class="line" d="M1287 486 C1287 602 877 602 877 718"/>
<path class="inheritLine" d="M1287 812 C1287 765 877 765 877 718"/>
<path class="inheritLine" d="M877 812 C877 765 877 765 877 718"/>
<path class="inheritLine" d="M467 812 C467 765 877 765 877 718"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopeAll</text>
  <text class="mono" x="18" y="108">+fork(task) StructuredSubtask~T~</text>
<text class="mono" x="18" y="132">+join() StructuredTaskScopeAll</text>
<text class="mono" x="18" y="156">+joinUntil(deadline) StructuredTaskScopeAll</text>
<text class="mono" x="18" y="180">+throwIfFailed(handler) StructuredTaskScopeAll</text>
<text class="mono" x="18" y="204">+close()</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopeAnyT</text>
  <text class="mono" x="18" y="108">+fork(task) StructuredSubtask~T~</text>
<text class="mono" x="18" y="132">+join() StructuredTaskScopeAny~T~</text>
<text class="mono" x="18" y="156">+joinUntil(deadline) StructuredTaskScopeAny~T~</text>
<text class="mono" x="18" y="180">+result(mapper) T</text>
<text class="mono" x="18" y="204">+close()</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopeProvider</text>
  <text class="mono" x="18" y="108">+providerName: String</text>
<text class="mono" x="18" y="132">+priority: Int</text>
<text class="mono" x="18" y="156">+isSupported() Boolean</text>
<text class="mono" x="18" y="180">+withFailFast(name, factory, block) T</text>
<text class="mono" x="18" y="204">+withFirstSuccess(name, factory, block) T</text>
<text class="mono" x="18" y="228">+withSupervised(name, factory, block) R</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopes</text>
  <text class="mono" x="18" y="108">+failFast(name, factory, block) T</text>
<text class="mono" x="18" y="132">+firstSuccess(name, factory, block) T</text>
<text class="mono" x="18" y="156">+supervised(name, factory, block) R</text>
<text class="mono" x="18" y="180">+all(name, factory, block) T ~~deprecated~~</text>
<text class="mono" x="18" y="204">+any(name, factory, block) T ~~deprecated~~</text>
</g>
<g transform="translate(297,494)">
  <rect class="card" x="0" y="0" width="340" height="240" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">StructuredTaskScopeSupervised</text>
  <text class="mono" x="18" y="108">+fork(task) StructuredSubtask~T~</text>
<text class="mono" x="18" y="132">+join() StructuredTaskScopeSupervised~T~</text>
<text class="mono" x="18" y="156">+joinUntil(deadline) StructuredTaskScopeSupervised.</text>
<text class="mono" x="18" y="180">+successfulResults() List~T~</text>
<text class="mono" x="18" y="204">+failedExceptions() List~Throwable~</text>
<text class="mono" x="18" y="228">+close()</text>
</g>
<g transform="translate(707,494)">
  <rect class="card" x="0" y="0" width="340" height="216" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">VirtualThreadRuntime</text>
  <text class="mono" x="18" y="108">+runtimeName: String</text>
<text class="mono" x="18" y="132">+priority: Int</text>
<text class="mono" x="18" y="156">+isSupported() Boolean</text>
<text class="mono" x="18" y="180">+threadFactory(prefix) ThreadFactory</text>
<text class="mono" x="18" y="204">+executorService() ExecutorService</text>
</g>
<g transform="translate(1117,494)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="57" text-anchor="middle">VirtualThreads</text>
  <text class="mono" x="18" y="108">+runtime() VirtualThreadRuntime</text>
<text class="mono" x="18" y="132">+runtimeName() String</text>
<text class="mono" x="18" y="156">+threadFactory(prefix) ThreadFactory</text>
<text class="mono" x="18" y="180">+executorService() ExecutorService</text>
</g>
<g transform="translate(297,820)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Jdk21VirtualThreadRuntime</text>
  <text class="mono" x="18" y="108">+runtimeName = jdk21</text>
<text class="mono" x="18" y="132">+priority = 21</text>
</g>
<g transform="translate(707,820)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">Jdk25VirtualThreadRuntime</text>
  <text class="mono" x="18" y="108">+runtimeName = jdk25</text>
<text class="mono" x="18" y="132">+priority = 25</text>
</g>
<g transform="translate(1117,820)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">PlatformThreadFallback</text>
  <text class="mono" x="18" y="108">+runtimeName = platform-fallback</text>
<text class="mono" x="18" y="132">+priority = MIN_VALUE</text>
</g>
