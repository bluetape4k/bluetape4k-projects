<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940" role="img" aria-labelledby="examples-ktor-observability-ktor-demo-architecture-01-title examples-ktor-observability-ktor-demo-architecture-01-desc">
  <title id="examples-ktor-observability-ktor-demo-architecture-01-title">Ktor Observability Demo Architecture</title>
  <desc id="examples-ktor-observability-ktor-demo-architecture-01-desc">Layered entry, platform, application event, and export responsibilities.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="arrowNeutral" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#758297"/>
    </marker>
    <marker id="arrowRequest" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowService" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#45A7A1"/>
    </marker>
    <marker id="arrowEvent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#58A978"/>
    </marker>
    <marker id="arrowMetrics" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#D6A441"/>
    </marker>
    <marker id="arrowTrace" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#8A72D6"/>
    </marker>
    <marker id="arrowResponse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#DC6B82"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .layerBand{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4;opacity:.72}
      .layerLabel{font-family:"Architects Daughter";font-size:18px;fill:#627184;font-weight:400}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .sequenceEdge{stroke-width:2.3;fill:none}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1420" height="940"/>
  <rect class="frame" x="32" y="28" width="1356" height="864" rx="26"/>
  <text class="title" x="66" y="82">Ktor Observability Demo Architecture</text>
  <text class="subtitle" x="70" y="116">Layered entry, platform, application event, and export responsibilities.</text>
  <g id="entry"><rect class="layerBand" x="54" y="150" width="1312" height="140" rx="18"/><text class="layerLabel" x="72" y="178">Entry layer</text></g>
  <g id="platform"><rect class="layerBand" x="54" y="310" width="1312" height="140" rx="18"/><text class="layerLabel" x="72" y="338">Ktor platform layer</text></g>
  <g id="application"><rect class="layerBand" x="54" y="470" width="1312" height="160" rx="18"/><text class="layerLabel" x="72" y="498">Application event layer</text></g>
  <g id="export"><rect class="layerBand" x="54" y="650" width="1312" height="160" rx="18"/><text class="layerLabel" x="72" y="678">Export layer</text></g>

  <g id="client-routes">
    <path class="edge" d="M365 222 L440 222" stroke="#5B8DEF" marker-end="url(#arrowRequest)"/>

  </g>

  <g id="routes-core">
    <path class="edge" d="M510 274 L510 304 L390 304 L390 326" stroke="#758297" marker-end="url(#arrowNeutral)"/>

  </g>

  <g id="routes-observability">
    <path class="edge" d="M630 274 L630 304 L770 304 L770 326" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="routes-service">
    <path class="edge" d="M560 274 L560 494" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="routes-registry">
    <path class="edge" d="M720 222 L1100 222 L1100 650 L910 650 L910 682" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="observability-registry">
    <path class="edge" d="M930 382 L1120 382 L1120 650 L910 650 L910 682" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="observability-otel">
    <path class="edge" d="M930 366 L1235 366 L1235 682" stroke="#8A72D6" marker-end="url(#arrowTrace)" stroke-dasharray="8 7"/>

  </g>

  <g id="service-eventObs">
    <path class="edge" d="M720 550 L780 550" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="eventObs-registry">
    <path class="edge" d="M930 606 L930 682" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="client">
    <rect class="card" x="120" y="178" width="245" height="88" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="cardTitle" x="242.5" y="193" text-anchor="middle" dominant-baseline="middle">HTTP Client</text>
    <text class="body" x="242.5" y="234" text-anchor="middle" dominant-baseline="middle">POST order event</text>
<text class="body" x="242.5" y="254" text-anchor="middle" dominant-baseline="middle">GET /metrics</text>
  </g>

  <g id="routes">
    <rect class="card" x="440" y="170" width="280" height="104" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="580" y="193" text-anchor="middle" dominant-baseline="middle">Ktor Routes</text>
    <text class="body" x="580" y="234" text-anchor="middle" dominant-baseline="middle">/orders/{orderId}/events</text>
<text class="body" x="580" y="254" text-anchor="middle" dominant-baseline="middle">/metrics + /health</text>
  </g>

  <g id="core">
    <rect class="card" x="260" y="326" width="260" height="112" rx="16" fill="#FFFFFF" stroke="#758297"/>
    <text class="cardTitle" x="390" y="340" text-anchor="middle" dominant-baseline="middle">bluetape4k</text>
<text class="cardTitle" x="390" y="366" text-anchor="middle" dominant-baseline="middle">Ktor Core</text>
    <text class="body" x="390" y="407" text-anchor="middle" dominant-baseline="middle">JSON + errors</text>
<text class="body" x="390" y="427" text-anchor="middle" dominant-baseline="middle">health baseline</text>
  </g>

  <g id="observability">
    <rect class="card" x="610" y="326" width="320" height="112" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="770" y="340" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="cardTitle" x="770" y="366" text-anchor="middle" dominant-baseline="middle">Observability</text>
    <text class="body" x="770" y="407" text-anchor="middle" dominant-baseline="middle">correlation + logging</text>
<text class="body" x="770" y="427" text-anchor="middle" dominant-baseline="middle">metrics + optional tracing</text>
  </g>

  <g id="service">
    <rect class="card" x="420" y="494" width="300" height="112" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="570" y="508" text-anchor="middle" dominant-baseline="middle">OrderEvent</text>
<text class="cardTitle" x="570" y="534" text-anchor="middle" dominant-baseline="middle">TelemetryService</text>
    <text class="body" x="570" y="575" text-anchor="middle" dominant-baseline="middle">publish + consume</text>
<text class="body" x="570" y="595" text-anchor="middle" dominant-baseline="middle">uses ObservationRegistry</text>
  </g>

  <g id="eventObs">
    <rect class="card" x="780" y="494" width="300" height="112" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="930" y="508" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="cardTitle" x="930" y="534" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <text class="body" x="930" y="575" text-anchor="middle" dominant-baseline="middle">event.publish</text>
<text class="body" x="930" y="595" text-anchor="middle" dominant-baseline="middle">event.consume</text>
  </g>

  <g id="registry">
    <rect class="card" x="760" y="682" width="300" height="112" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="910" y="696" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
<text class="cardTitle" x="910" y="722" text-anchor="middle" dominant-baseline="middle">MeterRegistry</text>
    <text class="body" x="910" y="763" text-anchor="middle" dominant-baseline="middle">application-owned</text>
<text class="body" x="910" y="783" text-anchor="middle" dominant-baseline="middle">scraped by route</text>
  </g>

  <g id="otel">
    <rect class="card" x="1110" y="682" width="250" height="112" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="1235" y="696" text-anchor="middle" dominant-baseline="middle">OpenTelemetry SDK</text>
<text class="cardTitle" x="1235" y="722" text-anchor="middle" dominant-baseline="middle">optional</text>
    <text class="body" x="1235" y="763" text-anchor="middle" dominant-baseline="middle">server spans</text>
<text class="body" x="1235" y="783" text-anchor="middle" dominant-baseline="middle">null disables tracing</text>
  </g>
  <text class="note" x="710" y="910" text-anchor="middle">Graphviz DOT/plain/sketch evidence is stored next to this README PNG/SVG asset.</text>
</svg>
