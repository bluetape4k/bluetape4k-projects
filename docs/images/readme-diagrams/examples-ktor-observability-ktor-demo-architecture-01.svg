<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="940" viewBox="0 0 1420 940" role="img" aria-labelledby="examples-ktor-observability-ktor-demo-architecture-01-title examples-ktor-observability-ktor-demo-architecture-01-desc">
  <title id="examples-ktor-observability-ktor-demo-architecture-01-title">Ktor Observability Demo Architecture</title>
  <desc id="examples-ktor-observability-ktor-demo-architecture-01-desc">Layered entry, platform, application event, and export responsibilities.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/></filter>

    <marker id="arrowNeutral" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/>
    </marker>
    <marker id="arrowRequest" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="arrowService" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#45A7A1"/>
    </marker>
    <marker id="arrowEvent" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#58A978"/>
    </marker>
    <marker id="arrowMetrics" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D6A441"/>
    </marker>
    <marker id="arrowTrace" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#8A72D6"/>
    </marker>
    <marker id="arrowResponse" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC6B82"/>
    </marker>
    <marker id="seqArrow-blue" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#5B8DEF"/>
    </marker>
    <marker id="seqArrow-green" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#58A978"/>
    </marker>
    <marker id="seqArrow-amber" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#D6A441"/>
    </marker>
    <marker id="seqArrow-purple" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#8A72D6"/>
    </marker>
    <marker id="seqArrow-pink" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#DC6B82"/>
    </marker>
    <style>
      .canvas{fill:#F6F9FC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .card,.participant{filter:url(#shadow);stroke-width:2}
      .layerBand{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1.4;opacity:.72}
      .layerTitle{font-family:"Architects Daughter";font-size:18px;fill:#627184;font-weight:400;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round}
      .lifeline{stroke:#758297;stroke-width:1.8;stroke-dasharray:7 8}
      .edge{stroke-width:2.4;fill:none}
      .sequenceEdge{stroke-width:2.3;fill:none}
      .labelPill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1;opacity:.94}

      .title{font-family:"Architects Daughter";font-size:42px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:16px;fill:#627184;font-weight:400}
      .cardTitle,.participantTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400}
      .body,.messageLabel,.edgeLabel,.note,.legend{font-family:"Comic Mono";fill:#34465B;font-weight:400}
      .body{font-size:14px}.messageLabel{font-size:13px}.edgeLabel{font-size:12px}.note{font-size:13px}.legend{font-size:12px}

    </style>
  </defs>
  <rect class="canvas" width="1420" height="940"/>
  <rect class="frame" x="32" y="28" width="1356" height="864" rx="26"/>
  <text class="title" x="66" y="82">Ktor Observability Demo Architecture</text>
  <text class="subtitle" x="70" y="116">Layered entry, platform, application event, and export responsibilities.</text>
  <g id="entry"><rect class="layerBand" x="54" y="170" width="1312" height="140" rx="18"/><text class="layerTitle" x="74" y="185" dominant-baseline="middle">Entry</text></g>
  <g id="platform"><rect class="layerBand" x="54" y="330" width="1312" height="140" rx="18"/><text class="layerTitle" x="74" y="345" dominant-baseline="middle">Platform</text></g>
  <g id="application"><rect class="layerBand" x="54" y="490" width="1312" height="160" rx="18"/><text class="layerTitle" x="74" y="505" dominant-baseline="middle">Events</text></g>
  <g id="export"><rect class="layerBand" x="54" y="670" width="1312" height="160" rx="18"/><text class="layerTitle" x="74" y="685" dominant-baseline="middle">Export</text></g>

  <g id="client-routes">
    <path class="edge" d="M425 242 L440 242" stroke="#5B8DEF" marker-end="url(#arrowRequest)"/>

  </g>

  <g id="routes-core">
    <path class="edge" d="M510 294 L510 324 L390 324 L390 346" stroke="#758297" marker-end="url(#arrowNeutral)"/>

  </g>

  <g id="routes-observability">
    <path class="edge" d="M630 294 L630 324 L770 324 L770 346" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="routes-service">
    <path class="edge" d="M560 294 L560 514" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="routes-registry">
    <path class="edge" d="M720 242 L1100 242 L1100 670 L910 670 L910 702" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="observability-registry">
    <path class="edge" d="M930 402 L1120 402 L1120 670 L910 670 L910 702" stroke="#D6A441" marker-end="url(#arrowMetrics)"/>

  </g>

  <g id="observability-otel">
    <path class="edge" d="M930 386 L1235 386 L1235 702" stroke="#8A72D6" marker-end="url(#arrowTrace)" stroke-dasharray="8 7"/>

  </g>

  <g id="service-eventObs">
    <path class="edge" d="M720 570 L780 570" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="eventObs-registry">
    <path class="edge" d="M930 626 L930 702" stroke="#58A978" marker-end="url(#arrowEvent)"/>

  </g>

  <g id="client">
    <rect class="card" x="180" y="198" width="245" height="88" rx="16" fill="#E8F3FF" stroke="#5B8DEF"/>
    <text class="cardTitle" x="302.5" y="213" text-anchor="middle" dominant-baseline="middle">HTTP Client</text>
    <text class="body" x="302.5" y="254" text-anchor="middle" dominant-baseline="middle">POST order event</text>
<text class="body" x="302.5" y="274" text-anchor="middle" dominant-baseline="middle">GET /metrics</text>
  </g>

  <g id="routes">
    <rect class="card" x="440" y="190" width="280" height="104" rx="16" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="cardTitle" x="580" y="213" text-anchor="middle" dominant-baseline="middle">Ktor Routes</text>
    <text class="body" x="580" y="254" text-anchor="middle" dominant-baseline="middle">/orders/{orderId}/events</text>
<text class="body" x="580" y="274" text-anchor="middle" dominant-baseline="middle">/metrics + /health</text>
  </g>

  <g id="core">
    <rect class="card" x="260" y="346" width="260" height="112" rx="16" fill="#FFFFFF" stroke="#758297"/>
    <text class="cardTitle" x="390" y="360" text-anchor="middle" dominant-baseline="middle">bluetape4k</text>
<text class="cardTitle" x="390" y="386" text-anchor="middle" dominant-baseline="middle">Ktor Core</text>
    <text class="body" x="390" y="427" text-anchor="middle" dominant-baseline="middle">JSON + errors</text>
<text class="body" x="390" y="447" text-anchor="middle" dominant-baseline="middle">health baseline</text>
  </g>

  <g id="observability">
    <rect class="card" x="610" y="346" width="320" height="112" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="770" y="360" text-anchor="middle" dominant-baseline="middle">Ktor</text>
<text class="cardTitle" x="770" y="386" text-anchor="middle" dominant-baseline="middle">Observability</text>
    <text class="body" x="770" y="427" text-anchor="middle" dominant-baseline="middle">correlation + logging</text>
<text class="body" x="770" y="447" text-anchor="middle" dominant-baseline="middle">metrics + optional tracing</text>
  </g>

  <g id="service">
    <rect class="card" x="420" y="514" width="300" height="112" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="570" y="528" text-anchor="middle" dominant-baseline="middle">OrderEvent</text>
<text class="cardTitle" x="570" y="554" text-anchor="middle" dominant-baseline="middle">TelemetryService</text>
    <text class="body" x="570" y="595" text-anchor="middle" dominant-baseline="middle">publish + consume</text>
<text class="body" x="570" y="615" text-anchor="middle" dominant-baseline="middle">uses ObservationRegistry</text>
  </g>

  <g id="eventObs">
    <rect class="card" x="780" y="514" width="300" height="112" rx="16" fill="#EAF7EF" stroke="#58A978"/>
    <text class="cardTitle" x="930" y="528" text-anchor="middle" dominant-baseline="middle">Event</text>
<text class="cardTitle" x="930" y="554" text-anchor="middle" dominant-baseline="middle">Telemetry</text>
    <text class="body" x="930" y="595" text-anchor="middle" dominant-baseline="middle">event.publish</text>
<text class="body" x="930" y="615" text-anchor="middle" dominant-baseline="middle">event.consume</text>
  </g>

  <g id="registry">
    <rect class="card" x="760" y="702" width="300" height="112" rx="16" fill="#FFF3D9" stroke="#D6A441"/>
    <text class="cardTitle" x="910" y="716" text-anchor="middle" dominant-baseline="middle">Prometheus</text>
<text class="cardTitle" x="910" y="742" text-anchor="middle" dominant-baseline="middle">MeterRegistry</text>
    <text class="body" x="910" y="783" text-anchor="middle" dominant-baseline="middle">application-owned</text>
<text class="body" x="910" y="803" text-anchor="middle" dominant-baseline="middle">scraped by route</text>
  </g>

  <g id="otel">
    <rect class="card" x="1110" y="702" width="250" height="112" rx="16" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="cardTitle" x="1235" y="716" text-anchor="middle" dominant-baseline="middle">OpenTelemetry SDK</text>
<text class="cardTitle" x="1235" y="742" text-anchor="middle" dominant-baseline="middle">optional</text>
    <text class="body" x="1235" y="783" text-anchor="middle" dominant-baseline="middle">server spans</text>
<text class="body" x="1235" y="803" text-anchor="middle" dominant-baseline="middle">null disables tracing</text>
  </g>
  <text class="note" x="710" y="910" text-anchor="middle">bluetape4k-projects observability examples - github.com/bluetape4k/bluetape4k-projects</text>
</svg>
