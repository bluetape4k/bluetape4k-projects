<svg xmlns="http://www.w3.org/2000/svg" width="1219" height="1236" viewBox="0 0 1219 1236" role="img" aria-label="Serialization Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1219" height="1236"/>
<rect class="frame" x="32" y="28" width="1155" height="1180" rx="28"/>
<text class="title" x="66" y="82">Serialization Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="1.5" y="166" width="277" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="471" y="166" width="277" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="609.5" y="209" text-anchor="middle">ProtobufSerializer</text>
<line class="lifeline" x1="609.5" y1="252" x2="609.5" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="940.5" y="166" width="277" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1079" y="209" text-anchor="middle">Protobuf Runtime</text>
<line class="lifeline" x1="1079" y1="252" x2="1079" y2="1176" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="251.75" y="286" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="269.75" y="313" text-anchor="start">1. serialize(protoMessage)</text>
<path class="line" d="M140 344 L609.5 344"/>
<rect x="729.25" y="396" width="230" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="747.25" y="423" text-anchor="start">2. message.toByteArray()</text>
<path class="line" d="M609.5 454 L1079 454"/>
<rect x="705.25" y="506" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="723.25" y="533" text-anchor="start">3. ByteArray (binary Protobuf)</text>
<path class="dashed" d="M1079 564 L609.5 564"/>
<rect x="269.75" y="616" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="287.75" y="643" text-anchor="start">4. ByteArray</text>
<path class="dashed" d="M609.5 674 L140 674"/>
<rect x="179.25" y="726" width="391" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="197.25" y="753" text-anchor="start">5. deserialize(bytes, MyMessage::class.java)</text>
<path class="line" d="M140 784 L609.5 784"/>
<rect x="709.25" y="836" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="727.25" y="863" text-anchor="start">6. MyMessage.parseFrom(bytes)</text>
<path class="line" d="M609.5 894 L1079 894"/>
<rect x="739.25" y="946" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="757.25" y="973" text-anchor="start">7. MyMessage object</text>
<path class="dashed" d="M1079 1004 L609.5 1004"/>
<rect x="235.75" y="1056" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="253.75" y="1083" text-anchor="start">8. MyMessage (null on failure)</text>
<path class="dashed" d="M609.5 1114 L140 1114"/>
</svg>
