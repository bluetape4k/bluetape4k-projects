<svg data-intent="Explain workflow policy flow by showing condition evaluation, flow policy selection, task transition routing, and terminal state handling." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1390" height="930" viewBox="0 0 1390 930" role="img" aria-label="Sequential Flow Error Strategy" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1390" height="930"/>
<rect class="frame" x="34" y="30" width="1322" height="870" rx="32"/>
<text class="title" x="72" y="84">Sequential Flow Error Strategy</text>
<text class="subtitle" x="76" y="116">Sequential flows run work in order; STOP returns the first failure while CONTINUE accumulates failures and reaches a partial result.</text>
<g id="start">
  <rect class="card" x="110" y="255" width="270" height="76" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="245" y="286" text-anchor="middle" dominant-baseline="middle">Start flow</text>
  <text class="detail" x="245" y="316" text-anchor="middle" dominant-baseline="middle">initial WorkContext</text>
</g>
<g id="work">
  <rect class="card" x="500" y="245" width="330" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="665" y="286" text-anchor="middle" dominant-baseline="middle">Execute next Work</text>
  <text class="detail" x="665" y="316" text-anchor="middle" dominant-baseline="middle">exceptions become Failure</text>
</g>
<g id="failed">
  <polygon class="card card-shape" points="1105,230 1255,293 1105,356 955,293" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="1105" y="285" text-anchor="middle" dominant-baseline="middle">Failure?</text>
  <text class="detail" x="1105" y="314" text-anchor="middle" dominant-baseline="middle">check WorkReport</text>
</g>
<g id="next">
  <rect class="card" x="955" y="470" width="310" height="82" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1110" y="504" text-anchor="middle" dominant-baseline="middle">Advance to next work</text>
  <text class="detail" x="1110" y="534" text-anchor="middle" dominant-baseline="middle">or finish with Success</text>
</g>
<g id="strategy">
  <polygon class="card card-shape" points="680,505 860,573 680,641 500,573" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="680" y="565" text-anchor="middle" dominant-baseline="middle">ErrorStrategy?</text>
  <text class="detail" x="680" y="594" text-anchor="middle" dominant-baseline="middle">STOP or CONTINUE</text>
</g>
<g id="stop">
  <rect class="card" x="220" y="735" width="310" height="76" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="375" y="766" text-anchor="middle" dominant-baseline="middle">Return Failure</text>
  <text class="detail" x="375" y="796" text-anchor="middle" dominant-baseline="middle">STOP exits immediately</text>
</g>
<g id="accumulate">
  <rect class="card" x="770" y="720" width="360" height="92" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="950" y="750" text-anchor="middle" dominant-baseline="middle">Accumulate failure</text>
  <text class="detail" x="950" y="780" text-anchor="middle" dominant-baseline="middle">continue later work</text>
  <text class="detail" x="950" y="798" text-anchor="middle" dominant-baseline="middle">final result becomes PartialSuccess</text>
</g>
<path class="route" data-from="start" data-to="work" d="M380 283 L500 283" stroke="#4F83BF"/>
<path class="route" data-from="work" data-to="failed" d="M830 293 L955 293" stroke="#3E9868"/>
<path class="route" data-from="failed" data-to="next" d="M1105 356 L1105 470" stroke="#3E9868"/>
<path class="route" data-from="failed" data-to="strategy" d="M1055 356 L1055 448 L680 448 L680 505" stroke="#C94D68"/>
<path class="route" data-from="strategy" data-to="stop" d="M500 573 L375 573 L375 735" stroke="#C94D68"/>
<path class="route" data-from="strategy" data-to="accumulate" d="M680 641 L680 685 L950 685 L950 720" stroke="#B9851B"/>
<text class="detail" x="1240" y="414" text-anchor="middle" dominant-baseline="middle">no</text>
<text class="detail" x="955" y="392" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="430" y="654" text-anchor="middle" dominant-baseline="middle">yes STOP</text>
<text class="detail" x="1018" y="666" text-anchor="middle" dominant-baseline="middle">no CONTINUE</text>
</svg>
