<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-label="Kafka4 dependency boundary">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 12 7 L 2 12 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="none"/>
    </marker>
    <marker id="openPurple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .chip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #0f172a; }
      .box { stroke-width: 1.8; filter: url(#softShadow); }
      .choice { fill: #eff6ff; stroke: #2563eb; }
      .kafka4 { fill: #f0fdf4; stroke: #16a34a; }
      .guard { fill: #fff7ed; stroke: #ea580c; }
      .risk { fill: #fef2f2; stroke: #dc2626; }
      .api { fill: #faf5ff; stroke: #9333ea; }
      .external { fill: #f0fdfa; stroke: #0d9488; }
      .name { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .mono { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 11px; fill: #64748b; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .uses { fill: none; stroke: #9333ea; stroke-width: 2.4; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openPurple); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="940"/>
  <rect class="frame" x="36" y="32" width="1428" height="876" rx="8"/>
  <text class="title" x="74" y="86">Kafka4 Dependency Boundary</text>
  <text class="subtitle" x="78" y="116">Use the Kafka 4 line as a single runtime choice: same bluetape4k API package, different dependency stack and Gradle guards.</text>

  <rect class="panel" x="78" y="154" width="1344" height="184" rx="8"/>
  <rect class="chip" x="104" y="176" width="214" height="38" rx="8"/>
  <text class="panelTitle" x="116" y="200">Runtime choice</text>

  <g id="kafka3Line">
    <rect class="box risk" x="128" y="236" width="292" height="70" rx="8"/>
    <text class="name" x="274" y="264" text-anchor="middle">bluetape4k-kafka</text>
    <text class="mono" x="274" y="288" text-anchor="middle">Kafka 3.9 / Spring Kafka 3 / Jackson 2</text>
  </g>

  <g id="classpathBoundary">
    <rect class="box choice" x="514" y="224" width="472" height="94" rx="8"/>
    <text class="name" x="750" y="256" text-anchor="middle">Application classpath boundary</text>
    <text class="mono" x="750" y="282" text-anchor="middle">choose exactly one Kafka utility line</text>
    <text class="small" x="750" y="304" text-anchor="middle">both modules expose io.bluetape4k.kafka APIs</text>
  </g>

  <g id="kafka4Line">
    <rect class="box kafka4" x="1080" y="236" width="292" height="70" rx="8"/>
    <text class="name" x="1226" y="264" text-anchor="middle">bluetape4k-kafka4</text>
    <text class="mono" x="1226" y="288" text-anchor="middle">Kafka 4.2 / Spring Kafka 4 / Jackson 3</text>
  </g>

  <path class="flow" d="M 420 271 H 514"/>
  <path class="flow" d="M 986 271 H 1080"/>

  <rect class="panel" x="78" y="390" width="646" height="394" rx="8"/>
  <rect class="chip" x="104" y="412" width="216" height="38" rx="8"/>
  <text class="panelTitle" x="116" y="436">Gradle guardrails</text>

  <rect class="panel" x="776" y="390" width="646" height="394" rx="8"/>
  <rect class="chip" x="802" y="412" width="212" height="38" rx="8"/>
  <text class="panelTitle" x="814" y="436">API surface</text>

  <g id="versionAlign">
    <rect class="box guard" x="126" y="486" width="252" height="110" rx="8"/>
    <text class="name" x="252" y="516" text-anchor="middle">Kafka artifact lock</text>
    <text class="mono" x="252" y="542" text-anchor="middle">resolutionStrategy</text>
    <text class="small" x="252" y="564" text-anchor="middle">all org.apache.kafka -> kafka4</text>
  </g>

  <g id="lz4Guard">
    <rect class="box guard" x="430" y="486" width="246" height="110" rx="8"/>
    <text class="name" x="553" y="516" text-anchor="middle">LZ4 replacement</text>
    <text class="mono" x="553" y="542" text-anchor="middle">exclude org.lz4</text>
    <text class="small" x="553" y="564" text-anchor="middle">api at.yawk.lz4:lz4-java</text>
  </g>

  <g id="stack">
    <rect class="box external" x="126" y="640" width="550" height="94" rx="8"/>
    <text class="name" x="401" y="672" text-anchor="middle">Aligned runtime stack</text>
    <text class="mono" x="401" y="698" text-anchor="middle">Kafka 4 clients + streams, Spring Kafka 4, Reactor Kafka 4</text>
    <text class="small" x="401" y="720" text-anchor="middle">Jackson 3 codecs, Spring Boot 4 dependencies, KRaft-only embedded tests</text>
  </g>

  <path class="flow" d="M 252 596 V 640"/>
  <path class="flow" d="M 553 596 V 640"/>

  <g id="coreApi">
    <rect class="box api" x="828" y="486" width="252" height="112" rx="8"/>
    <text class="name" x="954" y="516" text-anchor="middle">Core Kafka APIs</text>
    <text class="mono" x="954" y="542" text-anchor="middle">producerOf / consumerOf</text>
    <text class="small" x="954" y="564" text-anchor="middle">same Kotlin-first API shape</text>
  </g>

  <g id="springApi">
    <rect class="box api" x="1128" y="486" width="242" height="112" rx="8"/>
    <text class="name" x="1249" y="516" text-anchor="middle">Spring Kafka 4</text>
    <text class="mono" x="1249" y="542" text-anchor="middle">suspendSend + templates</text>
    <text class="small" x="1249" y="564" text-anchor="middle">non-null generic boundaries</text>
  </g>

  <g id="codecApi">
    <rect class="box api" x="828" y="650" width="252" height="96" rx="8"/>
    <text class="name" x="954" y="680" text-anchor="middle">Codecs</text>
    <text class="mono" x="954" y="706" text-anchor="middle">Jackson 3, Kryo, Fory</text>
    <text class="small" x="954" y="728" text-anchor="middle">allowlist + poison-pill policy</text>
  </g>

  <g id="streamsApi">
    <rect class="box api" x="1128" y="650" width="242" height="96" rx="8"/>
    <text class="name" x="1249" y="680" text-anchor="middle">Streams + Tests</text>
    <text class="mono" x="1249" y="706" text-anchor="middle">DSL helpers</text>
    <text class="small" x="1249" y="728" text-anchor="middle">KRaft embedded broker tests</text>
  </g>

  <path class="uses" d="M 1226 306 V 360 H 401 V 640"/>
  <path class="uses" d="M 1226 306 V 470 H 954 V 486"/>
  <path class="uses" d="M 1226 306 V 470 H 1249 V 486"/>
  <path class="uses" d="M 954 598 V 650"/>
  <path class="uses" d="M 1249 598 V 650"/>

  <g id="warning">
    <rect class="box risk" x="250" y="824" width="1000" height="44" rx="8"/>
    <text class="mono" x="750" y="852" text-anchor="middle">Do not put kafka and kafka4 on the same runtime classpath unless duplicate API-package ownership is managed intentionally.</text>
  </g>
</svg>
