<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Kafka4 module dependency architecture</title>
  <desc id="desc">Architecture diagram for infra-kafka4 showing application usage, bluetape4k Kafka4 adapter roles, serialization hooks, and externally governed Kafka and Spring dependencies.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card-shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="900"/>
  <rect class="frame" x="34" y="30" width="1432" height="840" rx="28"/>
  <text class="title" x="72" y="88">Kafka4 module dependency architecture</text>
  <text class="subtitle" x="76" y="121">The module boundary is separated from producer/consumer helpers and the governed Kafka 4 dependency families.</text>

  <g id="group-application">
    <rect class="group" x="74" y="225" width="290" height="180" rx="18"/>
    <text class="groupTitle" x="104" y="243" dominant-baseline="middle">Application usage</text>
  </g>
  <g id="group-module">
    <rect class="group" x="370" y="200" width="760" height="310" rx="18"/>
    <text class="groupTitle" x="400" y="218" dominant-baseline="middle">bluetape4k-kafka4 module boundary</text>
  </g>
  <g id="group-governance">
    <rect class="group" x="1160" y="245" width="285" height="180" rx="18"/>
    <text class="groupTitle" x="1190" y="263" dominant-baseline="middle">Catalog governance lane</text>
  </g>
  <g id="group-dependencies">
    <rect class="group" x="92" y="610" width="1316" height="170" rx="18"/>
    <text class="groupTitle" x="122" y="628" dominant-baseline="middle">Governed dependency families</text>
  </g>

  <path id="route-app-entry" class="connector" d="M342 321 L455 321" stroke="#4F83BF"/>
  <path id="route-entry-producer" class="connector" d="M595 336 L595 378" stroke="#D9AA4D"/>
  <path id="route-entry-consumer" class="connector" d="M735 320 L760 320 L760 420 L800 420" stroke="#45A7A1"/>
  <path id="route-entry-serialization" class="connector" d="M735 278 L810 278" stroke="#8A72D6"/>
  <path id="route-producer-kafka-clients" class="connector" d="M500 462 L500 540 L105 540 L105 726 L150 726" stroke="#D9AA4D"/>
  <path id="route-consumer-reactor-kafka" class="connector" d="M925 462 L925 690" stroke="#45A7A1"/>
  <path id="route-serialization-json-stack" class="connector" d="M1060 293 L1100 293 L1100 600 L1240 600 L1240 690" stroke="#8A72D6"/>
  <path id="route-governance-json-stack" class="connector" d="M1298 388 L1298 690" stroke="#6B7D90"/>

  <g id="node-app" transform="translate(92,278)">
    <rect class="card-shape" x="0" y="0" width="250" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="125" y="24" text-anchor="middle" dominant-baseline="middle">Application code</text>
    <text class="detail" x="125" y="43" text-anchor="middle" dominant-baseline="middle">producer and consumer use cases</text>
    <text class="detail" x="125" y="62" text-anchor="middle" dominant-baseline="middle">Spring Boot 4 services</text>
  </g>
  <g id="node-entry" transform="translate(455,250)">
    <rect class="card-shape" x="0" y="0" width="280" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="140" y="24" text-anchor="middle" dominant-baseline="middle">Kafka4 extensions</text>
    <text class="detail" x="140" y="43" text-anchor="middle" dominant-baseline="middle">typed send/receive helpers</text>
    <text class="detail" x="140" y="62" text-anchor="middle" dominant-baseline="middle">coroutine-friendly API</text>
  </g>
  <g id="node-producer" transform="translate(455,378)">
    <rect class="card-shape" x="0" y="0" width="250" height="84" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="125" y="23" text-anchor="middle" dominant-baseline="middle">Producer support</text>
    <text class="detail" x="125" y="42" text-anchor="middle" dominant-baseline="middle">records, headers</text>
    <text class="detail" x="125" y="61" text-anchor="middle" dominant-baseline="middle">send result handling</text>
  </g>
  <g id="node-consumer" transform="translate(800,378)">
    <rect class="card-shape" x="0" y="0" width="250" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="125" y="23" text-anchor="middle" dominant-baseline="middle">Consumer support</text>
    <text class="detail" x="125" y="42" text-anchor="middle" dominant-baseline="middle">poll, commit</text>
    <text class="detail" x="125" y="61" text-anchor="middle" dominant-baseline="middle">listener adapter helpers</text>
  </g>
  <g id="node-serialization" transform="translate(810,250)">
    <rect class="card-shape" x="0" y="0" width="250" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="125" y="24" text-anchor="middle" dominant-baseline="middle">Serialization hooks</text>
    <text class="detail" x="125" y="43" text-anchor="middle" dominant-baseline="middle">Jackson3 payloads</text>
    <text class="detail" x="125" y="62" text-anchor="middle" dominant-baseline="middle">byte/string codecs</text>
  </g>
  <g id="node-kafka-clients" transform="translate(150,690)">
    <rect class="card-shape" x="0" y="0" width="260" height="72" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="130" y="17" text-anchor="middle" dominant-baseline="middle">Kafka clients 4.x</text>
    <text class="detail" x="130" y="36" text-anchor="middle" dominant-baseline="middle">producer, consumer</text>
    <text class="detail" x="130" y="55" text-anchor="middle" dominant-baseline="middle">admin client</text>
  </g>
  <g id="node-spring-kafka" transform="translate(470,690)">
    <rect class="card-shape" x="0" y="0" width="260" height="72" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="130" y="17" text-anchor="middle" dominant-baseline="middle">Spring Kafka 4.x</text>
    <text class="detail" x="130" y="36" text-anchor="middle" dominant-baseline="middle">listener containers</text>
    <text class="detail" x="130" y="55" text-anchor="middle" dominant-baseline="middle">template integration</text>
  </g>
  <g id="node-reactor-kafka" transform="translate(790,690)">
    <rect class="card-shape" x="0" y="0" width="260" height="72" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="130" y="17" text-anchor="middle" dominant-baseline="middle">Reactor Kafka</text>
    <text class="detail" x="130" y="36" text-anchor="middle" dominant-baseline="middle">reactive bridge</text>
    <text class="detail" x="130" y="55" text-anchor="middle" dominant-baseline="middle">backpressure surface</text>
  </g>
  <g id="node-json-stack" transform="translate(1110,690)">
    <rect class="card-shape" x="0" y="0" width="260" height="72" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="130" y="17" text-anchor="middle" dominant-baseline="middle">Jackson 3 stack</text>
    <text class="detail" x="130" y="36" text-anchor="middle" dominant-baseline="middle">ObjectMapper</text>
    <text class="detail" x="130" y="55" text-anchor="middle" dominant-baseline="middle">payload codecs</text>
  </g>
  <g id="node-governance" transform="translate(1175,302)">
    <rect class="card-shape" x="0" y="0" width="245" height="86" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="card-title" x="122.5" y="24" text-anchor="middle" dominant-baseline="middle">Catalog governance</text>
    <text class="detail" x="122.5" y="43" text-anchor="middle" dominant-baseline="middle">dependency tag</text>
    <text class="detail" x="122.5" y="62" text-anchor="middle" dominant-baseline="middle">security updates</text>
  </g>


</svg>
