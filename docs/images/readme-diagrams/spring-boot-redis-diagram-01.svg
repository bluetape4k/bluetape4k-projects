<svg xmlns="http://www.w3.org/2000/svg" width="998" height="830" viewBox="0 0 998 830" role="img" aria-label="Redis Serializer Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="998" height="830"/>
<rect class="frame" x="32" y="28" width="934" height="774" rx="28"/>
<text class="title" x="66" y="82">Redis Serializer Class Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M274 428 C274 463 724 463 724 498"/>
<path class="line" d="M274 428 C274 463 274 463 274 498"/>
<path class="implLine" d="M724 498 C724 415 724 415 724 332"/>
<path class="implLine" d="M274 498 C274 415 724 415 724 332"/>
<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="240" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="57" text-anchor="middle">RedisBinarySerializers</text>
  <text class="mono" x="18" y="108">+Jdk: RedisBinarySerializer</text>
<text class="mono" x="18" y="132">+Kryo: RedisBinarySerializer</text>
<text class="mono" x="18" y="156">+Fory: RedisBinarySerializer</text>
<text class="mono" x="18" y="180">+LZ4Fory: RedisBinarySerializer</text>
<text class="mono" x="18" y="204">+LZ4Kryo: RedisBinarySerializer</text>
<text class="mono" x="18" y="228">+ZstdFory: RedisBinarySerializer</text>
</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="380" height="144" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="57" text-anchor="middle">RedisSerializer</text>
  <text class="mono" x="18" y="108">+serialize(T): ByteArray</text>
<text class="mono" x="18" y="132">+deserialize(ByteArray): T</text>
</g>
<g transform="translate(84,506)">
  <rect class="card" x="0" y="0" width="380" height="168" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="57" text-anchor="middle">RedisBinarySerializer</text>
  <text class="mono" x="18" y="108">-serializer: BinarySerializer</text>
<text class="mono" x="18" y="132">+serialize(Any): ByteArray</text>
<text class="mono" x="18" y="156">+deserialize(ByteArray): Any</text>
</g>
<g transform="translate(534,506)">
  <rect class="card" x="0" y="0" width="380" height="168" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
  <text class="small" x="190" y="26" text-anchor="middle"></text>
  <text class="label" x="190" y="57" text-anchor="middle">RedisCompressSerializer</text>
  <text class="mono" x="18" y="108">-compressor: Compressor</text>
<text class="mono" x="18" y="132">+serialize(ByteArray): ByteArray</text>
<text class="mono" x="18" y="156">+deserialize(ByteArray): ByteArray</text>
</g>
