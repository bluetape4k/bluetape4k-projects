<rect class="canvas" width="2400" height="1480"/>
<rect class="frame" x="34" y="30" width="2332" height="1420" rx="8"/>
<text class="title" x="72" y="86">Redis Serializer Class Hierarchy</text>
<text class="subtitle" x="76" y="120">Spring Data Redis serializer implementations backed by bluetape4k binary serializers, compressors, lazy factories, and RedisSerializationContext DSL helpers.</text>
<g id="RedisSerializer">
  <rect class="classBox" x="820" y="230" width="650" height="215" rx="8" fill="#F8FAFC" stroke="#64748B"/>
  <text class="stereotype" x="1145" y="258" text-anchor="middle">&lt;&lt;Spring Data interface&gt;&gt;</text>
  <text class="classTitle" x="1145" y="288" text-anchor="middle">RedisSerializer&lt;T&gt;</text>
  <path class="divider" d="M820 306H1470" stroke="#475569"/>
  <text class="member" x="844" y="332">serialize(value): ByteArray</text>
<text class="member" x="844" y="354">deserialize(bytes): T?</text>
  <path class="divider" d="M820 384H1470" stroke="#475569"/>
  <text class="member" x="844" y="410">Used by RedisTemplate and ReactiveRedisTemplate</text>
<text class="member" x="844" y="432">Key, value, hashKey, hashValue slots</text>
</g>
<g id="RedisBinarySerializer">
  <rect class="classBox" x="240" y="610" width="620" height="290" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="stereotype" x="550" y="638" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="classTitle" x="550" y="668" text-anchor="middle">RedisBinarySerializer</text>
  <path class="divider" d="M240 686H860" stroke="#15803D"/>
  <text class="member" x="264" y="712">serializer: BinarySerializer</text>
<text class="member" x="264" y="734">implements RedisSerializer&lt;Any&gt;</text>
  <path class="divider" d="M240 764H860" stroke="#15803D"/>
  <text class="member" x="264" y="790">serialize(t): serializer.serialize(t)</text>
<text class="member" x="264" y="812">null serialize -&gt; emptyByteArray</text>
<text class="member" x="264" y="834">deserialize(bytes): serializer.deserialize(bytes)</text>
<text class="member" x="264" y="856">factory invoke(bs: BinarySerializer)</text>
</g>
<g id="RedisCompressSerializer">
  <rect class="classBox" x="1440" y="610" width="620" height="290" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="stereotype" x="1750" y="638" text-anchor="middle">&lt;&lt;class&gt;&gt;</text>
  <text class="classTitle" x="1750" y="668" text-anchor="middle">RedisCompressSerializer</text>
  <path class="divider" d="M1440 686H2060" stroke="#1D4ED8"/>
  <text class="member" x="1464" y="712">compressor: Compressor</text>
<text class="member" x="1464" y="734">implements RedisSerializer&lt;ByteArray&gt;</text>
  <path class="divider" d="M1440 764H2060" stroke="#1D4ED8"/>
  <text class="member" x="1464" y="790">serialize(value): compressor.compress(value)</text>
<text class="member" x="1464" y="812">null serialize -&gt; emptyByteArray</text>
<text class="member" x="1464" y="834">deserialize(bytes): compressor.decompress(bytes)</text>
<text class="member" x="1464" y="856">default invoke(): Compressors.LZ4</text>
</g>
<g id="RedisBinarySerializers">
  <rect class="classBox" x="215" y="1065" width="720" height="255" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="stereotype" x="575" y="1093" text-anchor="middle">&lt;&lt;object factory&gt;&gt;</text>
  <text class="classTitle" x="575" y="1123" text-anchor="middle">RedisBinarySerializers</text>
  <path class="divider" d="M215 1141H935" stroke="#C2410C"/>
  <text class="member" x="239" y="1167">lazy singleton constants</text>
<text class="member" x="239" y="1189">object serializers and compression-only serializers</text>
  <path class="divider" d="M215 1219H935" stroke="#C2410C"/>
  <text class="member" x="239" y="1245">Jdk / Kryo / Fory</text>
<text class="member" x="239" y="1267">Gzip/LZ4/Snappy/Zstd compressors</text>
<text class="member" x="239" y="1289">Gzip/LZ4/Snappy/Zstd x Jdk/Kryo/Fory combos</text>
</g>
<g id="ContextSupport">
  <rect class="classBox" x="1290" y="1065" width="800" height="255" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="stereotype" x="1690" y="1093" text-anchor="middle">&lt;&lt;DSL functions&gt;&gt;</text>
  <text class="classTitle" x="1690" y="1123" text-anchor="middle">RedisSerializationContextSupport</text>
  <path class="divider" d="M1290 1141H2090" stroke="#0F766E"/>
  <text class="member" x="1314" y="1167">redisSerializationContext { ... }</text>
<text class="member" x="1314" y="1189">redisSerializationContextOf(...)</text>
  <path class="divider" d="M1290 1219H2090" stroke="#0F766E"/>
  <text class="member" x="1314" y="1245">sets key/value/hash serializers</text>
<text class="member" x="1314" y="1267">String key overload uses StringRedisSerializer.UTF_8</text>
<text class="member" x="1314" y="1289">feeds RedisSerializationContext for ReactiveRedisTemplate</text>
</g>
<g data-from="RedisBinarySerializer" data-to="RedisSerializer">
  <path class="edge dashed" d="M550 610 L550 515 L1030 515 L1030 445" stroke="#15803D" marker-end="url(#triangle-green)"/>
  <rect class="edgeLabelBg" x="650" y="477" width="136" height="24" rx="4"/><text class="edgeLabel" x="658" y="494">implements Any</text>
</g>
<g data-from="RedisCompressSerializer" data-to="RedisSerializer">
  <path class="edge dashed" d="M1750 610 L1750 515 L1260 515 L1260 445" stroke="#1D4ED8" marker-end="url(#triangle-blue)"/>
  <rect class="edgeLabelBg" x="1450" y="477" width="184" height="24" rx="4"/><text class="edgeLabel" x="1458" y="494">implements ByteArray</text>
</g>
<g data-from="RedisBinarySerializers" data-to="RedisBinarySerializer">
  <path class="edge dashed" d="M575 1065 L575 900" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="593" y="970" width="232" height="24" rx="4"/><text class="edgeLabel" x="601" y="987">creates object serializers</text>
</g>
<g data-from="RedisBinarySerializers" data-to="RedisCompressSerializer">
  <path class="edge dashed" d="M935 1244 L1120 1244 L1120 755 L1440 755" stroke="#C2410C" marker-end="url(#arrow-amber)"/>
  <rect class="edgeLabelBg" x="1138" y="981" width="272" height="24" rx="4"/><text class="edgeLabel" x="1146" y="998">creates compression serializers</text>
</g>
<g data-from="ContextSupport" data-to="RedisSerializer">
  <path class="edge dashed" d="M1690 1065 L1690 980 L2140 980 L2140 330 L1470 330" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <rect class="edgeLabelBg" x="2158" y="675" width="176" height="24" rx="4"/><text class="edgeLabel" x="2166" y="692">accepts serializers</text>
</g>
<g data-from="RedisBinarySerializers" data-to="ContextSupport">
  <path class="edge dashed" d="M575 1320 L575 1390 L1690 1390 L1690 1320" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
  <rect class="edgeLabelBg" x="940" y="1352" width="216" height="24" rx="4"/><text class="edgeLabel" x="948" y="1369">typical value serializer</text>
</g>
</svg>