<svg xmlns="http://www.w3.org/2000/svg" width="998" height="963" viewBox="0 0 998 963" role="img" aria-label="Redis Serializer Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="998" height="963"/>
<rect class="frame" x="32" y="28" width="934" height="907" rx="28"/>
<text class="title" x="66" y="82">Redis Serializer Class Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="52" y="148" width="894" height="302" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="70" y="176">Contract layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="52" y="536" width="894" height="239" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="70" y="564">Abstraction layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="line" d="M274 418 L274 501 L724 501 L724 568"/>
<path class="line" d="M274 418 L274 568"/>
<path class="implLine" d="M724 568 L724 334"/>
<path class="implLine" d="M274 568 L274 477 L724 477 L724 334"/>
<g transform="translate(84,180)">
  <rect class="card" x="0" y="0" width="380" height="238" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="190" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="190" y="61" text-anchor="middle">RedisBinarySerializers</text>
  <text class="mono" x="18" y="108">+Jdk: RedisBinarySerializer</text>
<text class="mono" x="18" y="129">+Kryo: RedisBinarySerializer</text>
<text class="mono" x="18" y="150">+Fory: RedisBinarySerializer</text>
<text class="mono" x="18" y="171">+LZ4Fory: RedisBinarySerializer</text>
<text class="mono" x="18" y="192">+LZ4Kryo: RedisBinarySerializer</text>
<text class="mono" x="18" y="213">+ZstdFory: RedisBinarySerializer</text>
</g>
<g transform="translate(534,180)">
  <rect class="card" x="0" y="0" width="380" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#58A978"/>
  <text class="small" x="190" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="190" y="61" text-anchor="middle">RedisSerializer</text>
  <text class="mono" x="18" y="108">+serialize(T): ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(ByteArray): T</text>
</g>
<g transform="translate(84,568)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#D6A441"/>
    <text class="label" x="190" y="49" text-anchor="middle">RedisBinarySerializer</text>
  <text class="mono" x="18" y="108">-serializer: BinarySerializer</text>
<text class="mono" x="18" y="129">+serialize(Any): ByteArray</text>
<text class="mono" x="18" y="150">+deserialize(ByteArray): Any</text>
</g>
<g transform="translate(534,568)">
  <rect class="card" x="0" y="0" width="380" height="175" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="380" y2="78" stroke="#DC6B82"/>
    <text class="label" x="190" y="49" text-anchor="middle">RedisCompressSerializer</text>
  <text class="mono" x="18" y="108">-compressor: Compressor</text>
<text class="mono" x="18" y="129">+serialize(ByteArray): ByteArray</text>
<text class="mono" x="18" y="150">+deserialize(ByteArray): ByteArray</text>
</g>
</svg>
