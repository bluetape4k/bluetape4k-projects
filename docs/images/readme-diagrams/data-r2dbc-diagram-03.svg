<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940" role="img" aria-label="JDBC vs R2DBC comparison">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="1.1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" markerWidth="15" markerHeight="15" refX="13" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7.5 L 1 14 Z" fill="#16a34a" stroke="#16a34a" stroke-width="1.1" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .panelJdbc { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .panelR2dbc { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.8; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 30px; fill: #0f172a; }
      .panelNote { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .card { stroke-width: 1.7; filter: url(#softShadow); }
      .cardTitle { font-family: "Architects Daughter"; font-size: 21px; fill: #0f172a; }
      .mono { font-family: "Comic Mono"; font-size: 13px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .flow { fill: none; stroke-width: 4.4; stroke-linecap: round; stroke-linejoin: round; }
      .split { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 10 8; }
      .criterion { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#softShadow); }
      .chipBlue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.3; }
      .chipGreen { fill: #dcfce7; stroke: #86efac; stroke-width: 1.3; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="940"/>
  <rect class="frame" x="36" y="32" width="1428" height="876" rx="8"/>
  <text class="title" x="74" y="86">JDBC vs R2DBC in bluetape4k</text>
  <text class="subtitle" x="78" y="116">Both reduce database boilerplate; the important difference is blocking ResultSet work versus reactive Flow/suspend work.</text>

  <line class="split" x1="750" y1="158" x2="750" y2="724"/>

  <rect class="panelJdbc" x="84" y="158" width="610" height="566" rx="8"/>
  <text class="panelTitle" x="124" y="210">JDBC module</text>
  <text class="panelNote" x="126" y="238">Thread owns the Connection while the driver blocks.</text>

  <rect class="panelR2dbc" x="806" y="158" width="610" height="566" rx="8"/>
  <text class="panelTitle" x="846" y="210">R2DBC module</text>
  <text class="panelNote" x="848" y="238">Reactive driver emits rows; callers consume Flow or await results.</text>

  <g id="jdbcApp">
    <rect class="card" x="174" y="278" width="430" height="74" rx="8" fill="#ffffff" stroke="#2563eb"/>
    <text class="cardTitle" x="389" y="307" text-anchor="middle">Application Thread</text>
    <text class="mono" x="389" y="333" text-anchor="middle">calls withConnect / runQuery / executeBatch</text>
  </g>
  <g id="jdbcConnection">
    <rect class="card" x="174" y="386" width="430" height="74" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="389" y="415" text-anchor="middle">DataSource + Connection</text>
    <text class="mono" x="389" y="441" text-anchor="middle">use { } closes resources after mapper returns</text>
  </g>
  <g id="jdbcStatement">
    <rect class="card" x="174" y="494" width="430" height="74" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text class="cardTitle" x="389" y="523" text-anchor="middle">Statement / PreparedStatement</text>
    <text class="mono" x="389" y="549" text-anchor="middle">setObject, executeQuery, executeUpdate</text>
  </g>
  <g id="jdbcResult">
    <rect class="card" x="174" y="602" width="430" height="74" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="cardTitle" x="389" y="631" text-anchor="middle">ResultSet Mapping</text>
    <text class="mono" x="389" y="657" text-anchor="middle">while (rs.next()) / toList / mapSingle</text>
  </g>

  <path class="flow" d="M 389 352 V 386" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <path class="flow" d="M 389 460 V 494" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <path class="flow" d="M 389 568 V 602" stroke="#2563eb" marker-end="url(#arrowBlue)"/>

  <g id="r2dbcApp">
    <rect class="card" x="896" y="278" width="430" height="74" rx="8" fill="#ffffff" stroke="#16a34a"/>
    <text class="cardTitle" x="1111" y="307" text-anchor="middle">Coroutine Caller</text>
    <text class="mono" x="1111" y="333" text-anchor="middle">uses flow(), awaitList(), awaitRowsUpdated()</text>
  </g>
  <g id="r2dbcPool">
    <rect class="card" x="896" y="386" width="430" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="1111" y="415" text-anchor="middle">ConnectionFactory / Pool</text>
    <text class="mono" x="1111" y="441" text-anchor="middle">bounded acquire, validation, highThroughput preset</text>
  </g>
  <g id="r2dbcClient">
    <rect class="card" x="896" y="494" width="430" height="74" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text class="cardTitle" x="1111" y="523" text-anchor="middle">DatabaseClient + R2dbcClient</text>
    <text class="mono" x="1111" y="549" text-anchor="middle">bindMap, Query DSL, typed mappingConverter</text>
  </g>
  <g id="r2dbcRows">
    <rect class="card" x="896" y="602" width="430" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="cardTitle" x="1111" y="631" text-anchor="middle">RowsFetchSpec / Flow</text>
    <text class="mono" x="1111" y="657" text-anchor="middle">non-blocking row stream to Kotlin results</text>
  </g>

  <path class="flow" d="M 1111 352 V 386" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <path class="flow" d="M 1111 460 V 494" stroke="#16a34a" marker-end="url(#arrowGreen)"/>
  <path class="flow" d="M 1111 568 V 602" stroke="#16a34a" marker-end="url(#arrowGreen)"/>

  <g id="criteria">
    <rect class="criterion" x="84" y="764" width="1332" height="96" rx="8"/>
    <text class="cardTitle" x="118" y="804">How to choose</text>
    <rect class="chipBlue" x="310" y="786" width="248" height="46" rx="8"/>
    <text class="small" x="434" y="805" text-anchor="middle">JDBC</text>
    <text class="small" x="434" y="823" text-anchor="middle">simple blocking jobs, batch utilities</text>
    <rect class="chipGreen" x="618" y="786" width="304" height="46" rx="8"/>
    <text class="small" x="770" y="805" text-anchor="middle">R2DBC</text>
    <text class="small" x="770" y="823" text-anchor="middle">reactive services, Flow, suspend transactions</text>
    <rect class="chipGreen" x="982" y="786" width="304" height="46" rx="8"/>
    <text class="small" x="1134" y="805" text-anchor="middle">bluetape4k-r2dbc adds</text>
    <text class="small" x="1134" y="823" text-anchor="middle">Query DSL, pool tuning, typed facade</text>
  </g>
</svg>
