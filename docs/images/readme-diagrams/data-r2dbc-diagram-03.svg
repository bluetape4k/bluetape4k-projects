<svg xmlns="http://www.w3.org/2000/svg" width="890" height="1020" viewBox="0 0 890 1020" role="img" aria-label="JDBC vs R2DBC Comparison">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="890" height="1020"/>
<rect class="frame" x="32" y="28" width="826" height="964" rx="28"/>
<text class="title" x="66" y="82">JDBC vs R2DBC Comparison</text>
<text class="subtitle" x="70" y="118">Grouped architecture from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="204" width="763" height="176" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="232">Public layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="346" width="763" height="176" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="374">Core layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="488" width="763" height="176" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="516">Integration layer</text>
    </g>
    <g id="readme-layer-4">
      <rect class="readmeLayerBand" x="54" y="630" width="763" height="176" rx="18" fill="#FFF3D9"/>
      <text class="readmeLayerLabel" x="72" y="658">Runtime layer</text>
    </g>
    <g id="readme-layer-5">
      <rect class="readmeLayerBand" x="54" y="772" width="763" height="176" rx="18" fill="#F1ECFF"/>
      <text class="readmeLayerLabel" x="72" y="800">External layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<g transform="translate(60,160)">
  <rect x="0" y="0" width="350" height="790" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">JDBC</text>
</g>
<g transform="translate(105,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">DataSource</text>
</g>
<g transform="translate(105,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Connection</text>
</g>
<g transform="translate(105,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">PreparedStatement</text>
</g>
<g transform="translate(105,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">ResultSet</text>
</g>
<g transform="translate(105,804)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Synchronous</text>
</g>
<g transform="translate(480,160)">
  <rect x="0" y="0" width="350" height="790" rx="18" fill="#ffffff" stroke="#d8e0ea" stroke-width="1.5"/>
  <text class="smallLabel" x="175" y="44" text-anchor="middle">R2DBC</text>
</g>
<g transform="translate(525,236)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">ConnectionFactory</text>
</g>
<g transform="translate(525,378)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Connection</text>
</g>
<g transform="translate(525,520)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Statement</text>
</g>
<g transform="translate(525,662)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="smallLabel" x="130" y="52.5" text-anchor="middle">Result /</text>
<text class="smallLabel" x="130" y="73.5" text-anchor="middle">Flux&amp;lt;Row&amp;gt;</text>
</g>
<g transform="translate(525,804)">
  <rect class="card" x="0" y="0" width="260" height="112" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="130" y="63" text-anchor="middle">Flow&amp;lt;T&amp;gt; Async</text>
</g>
</svg>
