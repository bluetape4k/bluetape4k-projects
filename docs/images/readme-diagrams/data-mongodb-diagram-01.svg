<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-label="bluetape4k MongoDB core class structure">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="openBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="openGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="openOrange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ea580c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .box { filter: url(#softShadow); stroke-width: 1.7; }
      .name { font-family: "Architects Daughter"; font-size: 22px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .member { font-family: "Comic Mono"; font-size: 12.5px; fill: #334155; }
      .note { font-family: "Comic Mono"; font-size: 12.5px; fill: #475569; }
      .depBlue { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openBlue); }
      .depGreen { fill: none; stroke: #16a34a; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openGreen); }
      .depOrange { fill: none; stroke: #ea580c; stroke-width: 2.3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 6; marker-end: url(#openOrange); }
      .label { font-family: "Comic Mono"; font-size: 12px; fill: #334155; paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1000"/>
  <rect class="frame" x="34" y="30" width="1432" height="940" rx="10"/>
  <text class="title" x="72" y="86">bluetape4k-mongodb Core Class Structure</text>
  <text class="subtitle" x="76" y="118">Thin convenience layer over MongoDB Kotlin Coroutine Driver: no duplicate CRUD wrappers</text>

  <rect class="panel" x="74" y="154" width="1352" height="330" rx="10"/>
  <text class="panelTitle" x="104" y="194">Native coroutine driver types that remain the runtime model</text>

  <g id="settings">
    <rect class="box" x="112" y="238" width="246" height="136" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="stereo" x="235" y="264" text-anchor="middle">&lt;&lt;MongoDB driver&gt;&gt;</text>
    <text class="name" x="235" y="294" text-anchor="middle">MongoClientSettings</text>
    <text class="member" x="136" y="326">Builder configures socket,</text>
    <text class="member" x="136" y="348">connection string, codecs</text>
  </g>

  <g id="client">
    <rect class="box" x="452" y="238" width="246" height="136" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="stereo" x="575" y="264" text-anchor="middle">&lt;&lt;coroutine driver&gt;&gt;</text>
    <text class="name" x="575" y="294" text-anchor="middle">MongoClient</text>
    <text class="member" x="476" y="326">listDatabaseNames()</text>
    <text class="member" x="476" y="348">startSession()</text>
  </g>

  <g id="database">
    <rect class="box" x="792" y="238" width="246" height="136" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="stereo" x="915" y="264" text-anchor="middle">&lt;&lt;coroutine driver&gt;&gt;</text>
    <text class="name" x="915" y="294" text-anchor="middle">MongoDatabase</text>
    <text class="member" x="816" y="326">getCollection(name, Class)</text>
    <text class="member" x="816" y="348">listCollectionNames()</text>
  </g>

  <g id="collection">
    <rect class="box" x="1132" y="238" width="246" height="136" rx="8" fill="#faf5ff" stroke="#9333ea"/>
    <text class="stereo" x="1255" y="264" text-anchor="middle">&lt;&lt;coroutine driver&gt;&gt;</text>
    <text class="name" x="1255" y="294" text-anchor="middle">MongoCollection&lt;T&gt;</text>
    <text class="member" x="1156" y="326">native suspend CRUD</text>
    <text class="member" x="1156" y="348">find(), aggregate() return Flow</text>
  </g>

  <path class="depBlue" d="M 358 306 L 452 306"/>
  <path class="depGreen" d="M 698 306 L 792 306"/>
  <path class="depGreen" d="M 1038 306 L 1132 306"/>

  <rect class="panel" x="74" y="520" width="1352" height="326" rx="10"/>
  <text class="panelTitle" x="104" y="560">bluetape4k additions: factories, cached clients, focused extensions, and DSL builders</text>

  <g id="provider">
    <rect class="box" x="106" y="612" width="292" height="158" rx="8" fill="#eff6ff" stroke="#2563eb"/>
    <text class="stereo" x="252" y="638" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text class="name" x="252" y="668" text-anchor="middle">MongoClientProvider</text>
    <line x1="106" y1="686" x2="398" y2="686" stroke="#bfdbfe" stroke-width="1.2"/>
    <text class="member" x="130" y="716">getOrCreate(connectionString)</text>
    <text class="member" x="130" y="742">getOrCreate(settings)</text>
    <text class="member" x="130" y="764">ConcurrentHashMap caches</text>
  </g>

  <g id="clientSupport">
    <rect class="box" x="434" y="612" width="292" height="158" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="name" x="580" y="656" text-anchor="middle">Client factory APIs</text>
    <line x1="434" y1="686" x2="726" y2="686" stroke="#bbf7d0" stroke-width="1.2"/>
    <text class="member" x="458" y="716">mongoClient { settings DSL }</text>
    <text class="member" x="458" y="742">mongoClientOf(connectionString)</text>
    <text class="member" x="458" y="764">uses MongoClient.create(...)</text>
  </g>

  <g id="dbCollectionApis">
    <rect class="box" x="762" y="612" width="292" height="158" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text class="name" x="908" y="656" text-anchor="middle">Database + collection APIs</text>
    <line x1="762" y1="686" x2="1054" y2="686" stroke="#99f6e4" stroke-width="1.2"/>
    <text class="member" x="786" y="716">getCollectionOf&lt;T&gt;(name)</text>
    <text class="member" x="786" y="742">listCollectionNamesList()</text>
    <text class="member" x="786" y="764">findFirst, exists, upsert</text>
  </g>

  <g id="dslApis">
    <rect class="box" x="1090" y="612" width="292" height="158" rx="8" fill="#fff7ed" stroke="#ea580c"/>
    <text class="name" x="1236" y="656" text-anchor="middle">BSON + pipeline DSL</text>
    <line x1="1090" y1="686" x2="1382" y2="686" stroke="#fed7aa" stroke-width="1.2"/>
    <text class="member" x="1114" y="716">documentOf(...), getAs&lt;T&gt;()</text>
    <text class="member" x="1114" y="742">pipeline { add(stage) }</text>
    <text class="member" x="1114" y="764">match/group/sort/limit/skip</text>
  </g>

  <rect class="panel" x="74" y="874" width="1352" height="56" rx="10"/>
  <text class="panelTitle" x="104" y="910">Reader contract</text>
  <text class="note" x="330" y="902">Native driver keeps suspend CRUD and Flow execution; bluetape4k adds composition shortcuts only where they remove repeated glue.</text>
  <text class="note" x="330" y="924">Cached clients are registered with ShutdownQueue; aggregation helpers build List&lt;Bson&gt; for native aggregate(...).</text>
</svg>
