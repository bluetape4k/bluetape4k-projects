<svg data-intent="Show the ByteBuf extension surface without a panoramic row: ByteBuf is the receiver, BitBuf wraps it, and utility extensions stay below their target types." data-evidence="io/netty/README.md; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufExtensions.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/BitBuf.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/util/ReferenceCountedSupport.kt" data-source-read="io/netty/README.md; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/ByteBufExtensions.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/buffer/BitBuf.kt; io/netty/src/main/kotlin/io/bluetape4k/netty/util/ReferenceCountedSupport.kt" xmlns="http://www.w3.org/2000/svg" width="1500" height="780" viewBox="0 0 1500 780" role="img" aria-label="ByteBuf Extension API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="780"/>
<rect class="frame" x="32" y="28" width="1436" height="724" rx="30"/>
<text class="title" x="68" y="84">ByteBuf Extension API Structure</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="ByteBuf" data-to="ReferenceCountedSupport" data-route-color="teal" d="M930 279 L1033 279 L1033 410" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ByteBuf" data-to="BitBuf" data-route-color="amber" d="M750 311 L750 410" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="ByteBuf" data-to="ByteBufExtensions" data-route-color="pink" d="M570 279 L467 279 L467 410" stroke="#C94D68" stroke-dasharray="8 7"/>
<g id="ByteBufExtensions">
  <rect class="classCard" x="155" y="410" width="360" height="146" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="335" y="429" text-anchor="middle">extensions</text>
  <text class="classTitle" x="335" y="457" text-anchor="middle">ByteBufExtensions</text>
  <line x1="155" y1="466" x2="515" y2="466" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="189" y="498">+readUByteNeg() UByte</text>
<text class="member" x="189" y="515">+readUShortAdd() UShort</text>
<text class="member" x="189" y="532">+readShortSmart() Short</text>
</g>
<g id="ByteBuf">
  <rect class="classCard" x="570" y="165" width="360" height="146" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="750" y="184" text-anchor="middle">Netty</text>
  <text class="classTitle" x="750" y="212" text-anchor="middle">ByteBuf</text>
  <line x1="570" y1="221" x2="930" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="604" y="253">+readByte() Byte</text>
<text class="member" x="604" y="270">+writeByte(value: Int)</text>
<text class="member" x="604" y="287">+readableBytes() Int</text>
</g>
<g id="BitBuf">
  <rect class="classCard" x="570" y="410" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="750" y="429" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="457" text-anchor="middle">BitBuf</text>
  <line x1="570" y1="466" x2="930" y2="466" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="604" y="498">-buf: ByteBuf</text>
<text class="member" x="604" y="515">+readBit() Boolean</text>
<text class="member" x="604" y="532">+writeBit(value: Boolean)</text>
</g>
<g id="ReferenceCountedSupport">
  <rect class="classCard" x="985" y="410" width="360" height="138" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1165" y="429" text-anchor="middle">extensions</text>
  <text class="classTitle" x="1165" y="457" text-anchor="middle">ReferenceCountedSupport</text>
  <line x1="985" y1="466" x2="1345" y2="466" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1019" y="503">+safeRelease()</text>
<text class="member" x="1019" y="520">+refCnt() Int</text>
</g>
<g>
  <rect x="1085" y="672" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 690 L1161 690" stroke="#3E9868"/>
  <text class="detail" x="1175" y="695">inheritance / implementation</text>
  <path class="dependency" d="M1103 711 L1161 711" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="716">dependency / usage</text>
</g>
<g><rect x="180" y="690" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="716" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
