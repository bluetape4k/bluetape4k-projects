<svg data-intent="Explain workflow definition architecture by separating workflow definition, tasks, transitions, execution context, policy, and terminal workflow outcomes." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1530" height="910" viewBox="0 0 1530 910" role="img" aria-label="Workflow Concept Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1530" height="910"/>
<rect class="frame" x="34" y="30" width="1462" height="850" rx="32"/>
<text class="title" x="72" y="84">Workflow Concept Overview</text>
<text class="subtitle" x="76" y="116">Work units execute with shared context, flow implementations choose orchestration semantics, and WorkReport controls the next step.</text>
<g id="dsl">
  <rect class="card" x="120" y="250" width="360" height="96" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="300" y="282" text-anchor="middle" dominant-baseline="middle">Workflow DSL</text>
  <text class="detail" x="300" y="312" text-anchor="middle" dominant-baseline="middle">workflow, sequential, parallel</text>
  <text class="detail" x="300" y="330" text-anchor="middle" dominant-baseline="middle">conditional, repeat, retry</text>
</g>
<g id="work">
  <rect class="card" x="585" y="195" width="360" height="96" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="765" y="236" text-anchor="middle" dominant-baseline="middle">Work / SuspendWork</text>
  <text class="detail" x="765" y="266" text-anchor="middle" dominant-baseline="middle">named units execute with context</text>
</g>
<g id="context">
  <rect class="card" x="585" y="410" width="360" height="96" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="765" y="451" text-anchor="middle" dominant-baseline="middle">WorkContext</text>
  <text class="detail" x="765" y="481" text-anchor="middle" dominant-baseline="middle">shared mutable run state</text>
</g>
<g id="flows">
  <rect class="card" x="1050" y="250" width="360" height="96" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="1230" y="291" text-anchor="middle" dominant-baseline="middle">Flow implementations</text>
  <text class="detail" x="1230" y="321" text-anchor="middle" dominant-baseline="middle">sync, suspend, virtual thread</text>
</g>
<g id="report">
  <rect class="card" x="585" y="670" width="360" height="116" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="765" y="712" text-anchor="middle" dominant-baseline="middle">WorkReport outcomes</text>
  <text class="detail" x="765" y="742" text-anchor="middle" dominant-baseline="middle">Success, Failure, PartialSuccess</text>
  <text class="detail" x="765" y="760" text-anchor="middle" dominant-baseline="middle">Aborted and Cancelled stop immediately</text>
</g>
<path class="route" data-from="dsl" data-to="work" d="M480 298 L585 243" stroke="#4F83BF"/>
<path class="route dashed" data-from="dsl" data-to="context" d="M480 298 L585 458" stroke="#B9851B"/>
<path class="route" data-from="work" data-to="flows" d="M945 243 L1050 298" stroke="#3E9868"/>
<path class="route" data-from="context" data-to="flows" d="M945 458 L1050 298" stroke="#B9851B"/>
<path class="route" data-from="flows" data-to="report" d="M1230 346 L1230 728 L945 728" stroke="#755BC6"/>
<path class="route dashed" data-from="work" data-to="report" d="M765 291 L765 360 L520 360 L520 728 L585 728" stroke="#2E8F89"/>
</svg>
