<svg data-intent="Explain workflow definition architecture by separating workflow definition, tasks, transitions, execution context, policy, and terminal workflow outcomes." data-evidence="utils/workflow/README.md; utils/workflow/src/main/kotlin" data-source-read="utils/workflow/README.md; utils/workflow/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1530" height="910" viewBox="0 0 1530 910" role="img" aria-label="Workflow Concept Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1530" height="910"/>
<rect class="frame" x="34" y="30" width="1462" height="850" rx="8"/>
<text class="title" x="72" y="84">Workflow Concept Overview</text>
<text class="subtitle" x="76" y="116">Work units execute with shared context, flow implementations choose orchestration semantics, and WorkReport controls the next step.</text>
<g id="dsl">
  <rect class="card" x="120" y="250" width="360" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="300" y="282" text-anchor="middle" dominant-baseline="middle">Workflow DSL</text>
  <text class="detail" x="300" y="312" text-anchor="middle" dominant-baseline="middle">workflow, sequential, parallel</text>
  <text class="detail" x="300" y="330" text-anchor="middle" dominant-baseline="middle">conditional, repeat, retry</text>
</g>
<g id="work">
  <rect class="card" x="585" y="195" width="360" height="96" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="765" y="236" text-anchor="middle" dominant-baseline="middle">Work / SuspendWork</text>
  <text class="detail" x="765" y="266" text-anchor="middle" dominant-baseline="middle">named units execute with context</text>
</g>
<g id="context">
  <rect class="card" x="585" y="410" width="360" height="96" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="765" y="451" text-anchor="middle" dominant-baseline="middle">WorkContext</text>
  <text class="detail" x="765" y="481" text-anchor="middle" dominant-baseline="middle">shared mutable run state</text>
</g>
<g id="flows">
  <rect class="card" x="1050" y="250" width="360" height="96" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1230" y="291" text-anchor="middle" dominant-baseline="middle">Flow implementations</text>
  <text class="detail" x="1230" y="321" text-anchor="middle" dominant-baseline="middle">sync, suspend, virtual thread</text>
</g>
<g id="report">
  <rect class="card" x="585" y="670" width="360" height="116" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="765" y="712" text-anchor="middle" dominant-baseline="middle">WorkReport outcomes</text>
  <text class="detail" x="765" y="742" text-anchor="middle" dominant-baseline="middle">Success, Failure, PartialSuccess</text>
  <text class="detail" x="765" y="760" text-anchor="middle" dominant-baseline="middle">Aborted and Cancelled stop immediately</text>
</g>
<path class="route" data-from="dsl" data-to="work" d="M480 298 L585 243" stroke="#1D4ED8"/>
<path class="route dashed" data-from="dsl" data-to="context" d="M480 298 L585 458" stroke="#C2410C"/>
<path class="route" data-from="work" data-to="flows" d="M945 243 L1050 298" stroke="#15803D"/>
<path class="route" data-from="context" data-to="flows" d="M945 458 L1050 298" stroke="#C2410C"/>
<path class="route" data-from="flows" data-to="report" d="M1230 346 L1230 728 L945 728" stroke="#7E22CE"/>
<path class="route dashed" data-from="work" data-to="report" d="M765 291 L765 360 L520 360 L520 728 L585 728" stroke="#0F766E"/>
</svg>
