<svg data-intent="Explain JUnit5 test utility flow by grouping extension context helpers, captured output, stress testers, and assertion/reporting outcomes." data-evidence="testing/junit5/README.md; testing/junit5/src/main/kotlin" data-source-read="testing/junit5/README.md; testing/junit5/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1420" height="720" viewBox="0 0 1420 720" role="img" aria-labelledby="title desc">
  <title id="title">JUnit5 Mermaid report pipeline</title>
  <desc id="desc">Flowchart for bluetape4k-junit5 Mermaid report generation showing Gradle test execution, extension helpers, Mermaid Gantt source, status mapping, and rendered report output.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter";font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono";font-size:18px;fill:#536476;font-weight:400}
      .group{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .groupTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
      .card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}
      .card-shape{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.6;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1420" height="720"/>
  <rect class="frame" x="34" y="30" width="1352" height="660" rx="28"/>
  <text class="title" x="72" y="88">JUnit5 Mermaid report pipeline</text>
  <text class="subtitle" x="76" y="121">Test execution emits a Mermaid Gantt report where each task lane carries status semantics.</text>

  <g id="group-execution">
    <rect class="group" x="123" y="176" width="330" height="430" rx="18"/>
    <text class="groupTitle" x="153" y="194" dominant-baseline="middle">Test execution</text>
  </g>
  <g id="group-report">
    <rect class="group" x="545" y="176" width="330" height="430" rx="18"/>
    <text class="groupTitle" x="575" y="194" dominant-baseline="middle">Report model</text>
  </g>
  <g id="group-output">
    <rect class="group" x="967" y="176" width="330" height="430" rx="18"/>
    <text class="groupTitle" x="997" y="194" dominant-baseline="middle">Reader-facing output</text>
  </g>

  <path id="route-gradle-extensions" class="connector" d="M288 320 L288 394" stroke="#4F83BF"/>
  <path id="route-gradle-gantt" class="connector" d="M411 278 L587 278" stroke="#45A7A1"/>
  <path id="route-extensions-status" class="connector" d="M411 439 L587 439" stroke="#58A978"/>
  <path id="route-gantt-status" class="connector" d="M710 320 L710 394" stroke="#D9AA4D"/>
  <path id="route-gantt-markdown" class="connector" d="M833 278 L1009 278" stroke="#8A72D6"/>
  <path id="route-status-rendered" class="connector" d="M833 439 L1009 439" stroke="#DB7890"/>
  <path id="route-markdown-rendered" class="connector" d="M1132 320 L1132 394" stroke="#8A72D6"/>

  <g id="node-gradle" transform="translate(165,236)">
    <rect class="card-shape" x="0" y="0" width="246" height="84" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="123" y="23" text-anchor="middle" dominant-baseline="middle">Gradle test task</text>
    <text class="detail" x="123" y="42" text-anchor="middle" dominant-baseline="middle">runs JUnit Platform</text>
    <text class="detail" x="123" y="61" text-anchor="middle" dominant-baseline="middle">captures lifecycle events</text>
  </g>
  <g id="node-extensions" transform="translate(165,394)">
    <rect class="card-shape" x="0" y="0" width="246" height="90" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="123" y="26" text-anchor="middle" dominant-baseline="middle">JUnit5 helpers</text>
    <text class="detail" x="123" y="45" text-anchor="middle" dominant-baseline="middle">Stopwatch, TempFolder</text>
    <text class="detail" x="123" y="64" text-anchor="middle" dominant-baseline="middle">OutputCapture, FieldSource</text>
  </g>
  <g id="node-gantt" transform="translate(587,236)">
    <rect class="card-shape" x="0" y="0" width="246" height="84" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="123" y="23" text-anchor="middle" dominant-baseline="middle">Mermaid Gantt source</text>
    <text class="detail" x="123" y="42" text-anchor="middle" dominant-baseline="middle">timeline sections</text>
    <text class="detail" x="123" y="61" text-anchor="middle" dominant-baseline="middle">task rows and dates</text>
  </g>
  <g id="node-status" transform="translate(587,394)">
    <rect class="card-shape" x="0" y="0" width="246" height="90" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="123" y="26" text-anchor="middle" dominant-baseline="middle">Status mapping</text>
    <text class="detail" x="123" y="45" text-anchor="middle" dominant-baseline="middle">active lane: passed</text>
    <text class="detail" x="123" y="64" text-anchor="middle" dominant-baseline="middle">issue lanes: failed/interrupted</text>
  </g>
  <g id="node-markdown" transform="translate(1009,236)">
    <rect class="card-shape" x="0" y="0" width="246" height="84" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="123" y="23" text-anchor="middle" dominant-baseline="middle">README example block</text>
    <text class="detail" x="123" y="42" text-anchor="middle" dominant-baseline="middle">stored as fenced text</text>
    <text class="detail" x="123" y="61" text-anchor="middle" dominant-baseline="middle">extractable with awk</text>
  </g>
  <g id="node-rendered" transform="translate(1009,394)">
    <rect class="card-shape" x="0" y="0" width="246" height="90" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="card-title" x="123" y="26" text-anchor="middle" dominant-baseline="middle">Rendered report image</text>
    <text class="detail" x="123" y="45" text-anchor="middle" dominant-baseline="middle">human-readable timeline</text>
    <text class="detail" x="123" y="64" text-anchor="middle" dominant-baseline="middle">shared PNG/SVG asset</text>
  </g>


</svg>
