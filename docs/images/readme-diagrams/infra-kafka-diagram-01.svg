<rect x="944.25" y="393" width="59.5" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="974" y="409" fill="#ea580c" font-size="12" font-weight="700" text-anchor="middle" >reactor kafka</text>
<path id="codecs-runtime" d="M 600 441 L 612 441 Q 622 441 622 451 L 622 522 Q 622 536 636 536 L 992 536 Q 1006 536 1006 522 L 1006 474 Q 1006 464 1016 464 L 1034 464" fill="none" stroke="#9333ea" stroke-width="3.2" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/>
<polygon points="1022,470 1034,464 1022,458" fill="#9333ea" stroke="#9333ea" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<rect x="786" y="506" width="56" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="814" y="522" fill="#9333ea" font-size="12" font-weight="700" text-anchor="middle" >record bytes</text>
<path id="streams-runtime" d="M 920 640 L 1104 640 Q 1118 640 1118 626 L 1118 508" fill="none" stroke="#16a34a" stroke-width="3.6"  marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1091.75" y="554" width="52.5" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="1118" y="570" fill="#16a34a" font-size="12" font-weight="700" text-anchor="middle" >stream task</text>
<g transform="translate(66 746)">
<line x1="0" y1="0" x2="36" y2="0" stroke="#2563eb" stroke-width="3.6" marker-end="url(#arrow-blue)"/>
<text x="48" y="5" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" >Kafka client API</text>
<line x1="178" y1="0" x2="214" y2="0" stroke="#16a34a" stroke-width="3.6" marker-end="url(#arrow-green)"/>
<text x="226" y="5" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" >Coroutine / Streams</text>
<line x1="402" y1="0" x2="438" y2="0" stroke="#ea580c" stroke-width="3.6" marker-end="url(#arrow-orange)"/>
<text x="450" y="5" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" >Spring bridge</text>
<line x1="602" y1="0" x2="638" y2="0" stroke="#9333ea" stroke-width="3.2" stroke-dasharray="8 5" marker-end="url(#arrow-purple)"/>
<text x="650" y="5" fill="#6b7280" font-size="12" font-weight="600" text-anchor="start" >Codec bytes</text>
</g>
</svg>
