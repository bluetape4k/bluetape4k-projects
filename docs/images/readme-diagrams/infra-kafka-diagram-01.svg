<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-label="Kafka module class hierarchy">
  <defs>
    <filter id="softShadow" x="-8%" y="-10%" width="116%" height="124%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="hollowBlue" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 14 7 L 1 13 Z" fill="#ffffff" stroke="#2563eb" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <marker id="openPurple" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none"/>
    </marker>
    <style>
      svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
      .canvas { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; filter: url(#softShadow); }
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #0f172a; }
      .subtitle { font-family: "Comic Mono"; font-size: 15px; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .chip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.2; }
      .panelTitle { font-family: "Architects Daughter"; font-size: 23px; fill: #0f172a; }
      .classBox { stroke-width: 1.8; filter: url(#softShadow); }
      .interface { fill: #eff6ff; stroke: #2563eb; }
      .abstract { fill: #faf5ff; stroke: #9333ea; }
      .codec { fill: #f0fdf4; stroke: #16a34a; }
      .binary { fill: #fff7ed; stroke: #ea580c; }
      .surface { fill: #f0fdfa; stroke: #0d9488; }
      .spring { fill: #fdf2f8; stroke: #db2777; }
      .name { font-family: "Architects Daughter"; font-size: 20px; fill: #0f172a; }
      .stereo { font-family: "Comic Mono"; font-size: 12px; fill: #64748b; }
      .member { font-family: "Comic Mono"; font-size: 12px; fill: #475569; }
      .small { font-family: "Comic Mono"; font-size: 11px; fill: #64748b; }
      .divider { stroke: #cbd5e1; stroke-width: 1; }
      .implements { fill: none; stroke: #2563eb; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#hollowBlue); }
      .uses { fill: none; stroke: #9333ea; stroke-width: 2.3; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#openPurple); }
    </style>
  </defs>

  <rect class="canvas" width="1500" height="1100"/>
  <rect class="frame" x="36" y="32" width="1428" height="1036" rx="8"/>
  <text class="title" x="74" y="86">Kafka Module API Structure</text>
  <text class="subtitle" x="78" y="116">Codec classes form the inheritance tree; producer, consumer, Spring, and Streams APIs are extension surfaces around Kafka clients.</text>

  <rect class="panel" x="78" y="154" width="724" height="850" rx="8"/>
  <rect class="chip" x="104" y="176" width="238" height="38" rx="8"/>
  <text class="panelTitle" x="116" y="200">Codec hierarchy</text>

  <rect class="panel" x="850" y="154" width="572" height="850" rx="8"/>
  <rect class="chip" x="876" y="176" width="246" height="38" rx="8"/>
  <text class="panelTitle" x="888" y="200">Client support surface</text>

  <g id="kafkaCodec">
    <rect class="classBox interface" x="300" y="238" width="280" height="92" rx="8"/>
    <text class="stereo" x="440" y="262" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text class="name" x="440" y="288" text-anchor="middle">KafkaCodec&lt;T&gt;</text>
    <text class="member" x="440" y="312" text-anchor="middle">Serializer + Deserializer + Closeable</text>
  </g>

  <g id="abstractCodec">
    <rect class="classBox abstract" x="250" y="394" width="380" height="150" rx="8"/>
    <text class="stereo" x="440" y="418" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="name" x="440" y="444" text-anchor="middle">AbstractKafkaCodec&lt;T&gt;</text>
    <line class="divider" x1="250" y1="458" x2="630" y2="458"/>
    <text class="member" x="270" y="482">+ VALUE_TYPE_KEY header contract</text>
    <text class="member" x="270" y="504">+ allowedTypePackages allowlist</text>
    <text class="member" x="270" y="526">+ poison-pill null on decode failure</text>
  </g>

  <path class="implements" d="M 440 394 V 330"/>

  <g id="simpleCodecs">
    <rect class="classBox codec" x="110" y="622" width="190" height="84" rx="8"/>
    <text class="name" x="205" y="650" text-anchor="middle">String</text>
    <text class="name" x="205" y="674" text-anchor="middle">KafkaCodec</text>
    <text class="small" x="205" y="696" text-anchor="middle">UTF-8 string</text>

    <rect class="classBox codec" x="345" y="622" width="190" height="84" rx="8"/>
    <text class="name" x="440" y="650" text-anchor="middle">ByteArray</text>
    <text class="name" x="440" y="674" text-anchor="middle">KafkaCodec</text>
    <text class="small" x="440" y="696" text-anchor="middle">raw bytes</text>

    <rect class="classBox codec" x="580" y="622" width="190" height="84" rx="8"/>
    <text class="name" x="675" y="650" text-anchor="middle">Jackson</text>
    <text class="name" x="675" y="674" text-anchor="middle">KafkaCodec</text>
    <text class="small" x="675" y="696" text-anchor="middle">JSON + type header</text>
  </g>

  <g id="binaryCodec">
    <rect class="classBox abstract" x="280" y="748" width="320" height="84" rx="8"/>
    <text class="stereo" x="440" y="773" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text class="name" x="440" y="798" text-anchor="middle">BinaryKafkaCodec</text>
    <text class="small" x="440" y="820" text-anchor="middle">delegates to BinarySerializer</text>
  </g>

  <path class="implements" d="M 205 622 V 574 H 440 V 544"/>
  <path class="implements" d="M 440 622 V 544"/>
  <path class="implements" d="M 675 622 V 574 H 440 V 544"/>
  <path class="implements" d="M 440 748 V 732 H 96 V 470 H 250"/>

  <g id="binaryVariants">
    <rect class="classBox binary" x="102" y="896" width="132" height="66" rx="8"/>
    <text class="name" x="168" y="924" text-anchor="middle">Kryo</text>
    <text class="small" x="168" y="946" text-anchor="middle">binary</text>

    <rect class="classBox binary" x="250" y="896" width="132" height="66" rx="8"/>
    <text class="name" x="316" y="924" text-anchor="middle">Fory</text>
    <text class="small" x="316" y="946" text-anchor="middle">trusted only</text>

    <rect class="classBox binary" x="398" y="896" width="132" height="66" rx="8"/>
    <text class="name" x="464" y="924" text-anchor="middle">LZ4 / Snappy</text>
    <text class="small" x="464" y="946" text-anchor="middle">Kryo or Fory</text>

    <rect class="classBox binary" x="546" y="896" width="132" height="66" rx="8"/>
    <text class="name" x="612" y="924" text-anchor="middle">Zstd</text>
    <text class="small" x="612" y="946" text-anchor="middle">Kryo or Fory</text>
  </g>

  <path class="implements" d="M 168 896 V 860 H 440 V 832"/>
  <path class="implements" d="M 316 896 V 860 H 440 V 832"/>
  <path class="implements" d="M 464 896 V 860 H 440 V 832"/>
  <path class="implements" d="M 612 896 V 860 H 440 V 832"/>

  <g id="codecFactory">
    <rect class="classBox surface" x="636" y="408" width="132" height="104" rx="8"/>
    <text class="stereo" x="702" y="433" text-anchor="middle">&lt;&lt;object&gt;&gt;</text>
    <text class="name" x="702" y="458" text-anchor="middle">KafkaCodecs</text>
    <text class="small" x="702" y="482" text-anchor="middle">lazy codec</text>
    <text class="small" x="702" y="502" text-anchor="middle">instances</text>
  </g>
  <path class="uses" d="M 636 460 H 630"/>

  <g id="clientFactories">
    <rect class="classBox surface" x="894" y="244" width="230" height="122" rx="8"/>
    <text class="stereo" x="1009" y="268" text-anchor="middle">&lt;&lt;top-level functions&gt;&gt;</text>
    <text class="name" x="1009" y="294" text-anchor="middle">Core clients</text>
    <line class="divider" x1="894" y1="308" x2="1124" y2="308"/>
    <text class="member" x="912" y="332">producerOf(configs)</text>
    <text class="member" x="912" y="354">consumerOf(configs)</text>
  </g>

  <g id="officialClients">
    <rect class="classBox surface" x="1166" y="244" width="210" height="122" rx="8"/>
    <text class="stereo" x="1271" y="268" text-anchor="middle">&lt;&lt;Apache Kafka&gt;&gt;</text>
    <text class="name" x="1271" y="294" text-anchor="middle">Producer / Consumer</text>
    <line class="divider" x1="1166" y1="308" x2="1376" y2="308"/>
    <text class="member" x="1184" y="332">KafkaProducer</text>
    <text class="member" x="1184" y="354">KafkaConsumer</text>
  </g>

  <g id="producerCoroutine">
    <rect class="classBox abstract" x="894" y="424" width="230" height="132" rx="8"/>
    <text class="stereo" x="1009" y="448" text-anchor="middle">&lt;&lt;Producer extensions&gt;&gt;</text>
    <text class="name" x="1009" y="474" text-anchor="middle">Coroutine send</text>
    <line class="divider" x1="894" y1="488" x2="1124" y2="488"/>
    <text class="member" x="912" y="512">suspendSend(record)</text>
    <text class="member" x="912" y="534">sendAsFlow(records)</text>
  </g>

  <g id="springOps">
    <rect class="classBox spring" x="1166" y="424" width="210" height="132" rx="8"/>
    <text class="stereo" x="1271" y="448" text-anchor="middle">&lt;&lt;Spring extensions&gt;&gt;</text>
    <text class="name" x="1271" y="474" text-anchor="middle">KafkaOperations</text>
    <line class="divider" x1="1166" y1="488" x2="1376" y2="488"/>
    <text class="member" x="1184" y="512">suspendSend(...)</text>
    <text class="member" x="1184" y="534">sendDefault(...)</text>
  </g>

  <g id="producerTemplate">
    <rect class="classBox spring" x="894" y="612" width="230" height="146" rx="8"/>
    <text class="name" x="1009" y="642" text-anchor="middle">SuspendKafka</text>
    <text class="name" x="1009" y="666" text-anchor="middle">ProducerTemplate</text>
    <line class="divider" x1="894" y1="680" x2="1124" y2="680"/>
    <text class="member" x="912" y="704">KafkaSender + CoroutineScope</text>
    <text class="member" x="912" y="726">send / transactional send</text>
    <text class="member" x="912" y="748">close cancels scope</text>
  </g>

  <g id="consumerTemplate">
    <rect class="classBox spring" x="1166" y="612" width="210" height="146" rx="8"/>
    <text class="name" x="1271" y="642" text-anchor="middle">SuspendKafka</text>
    <text class="name" x="1271" y="666" text-anchor="middle">ConsumerTemplate</text>
    <line class="divider" x1="1166" y1="680" x2="1376" y2="680"/>
    <text class="member" x="1184" y="704">KafkaReceiver + Flow</text>
    <text class="member" x="1184" y="726">receive / seek / commit</text>
    <text class="member" x="1184" y="748">close cancels scope</text>
  </g>

  <g id="streamsDsl">
    <rect class="classBox surface" x="894" y="804" width="482" height="150" rx="8"/>
    <text class="stereo" x="1135" y="828" text-anchor="middle">&lt;&lt;Kafka Streams DSL helpers&gt;&gt;</text>
    <text class="name" x="1135" y="854" text-anchor="middle">Consumed / Produced / Grouped</text>
    <text class="name" x="1135" y="878" text-anchor="middle">Materialized / Joined</text>
    <line class="divider" x1="894" y1="892" x2="1376" y2="892"/>
    <text class="member" x="912" y="916">Typed factory functions wrap Kafka Streams builder classes.</text>
    <text class="member" x="912" y="938">State stores and serdes stay explicit at call sites.</text>
  </g>

  <path class="uses" d="M 1124 305 H 1166"/>
  <path class="uses" d="M 1271 366 V 398 H 1009 V 424"/>
  <path class="uses" d="M 1271 366 V 424"/>
  <path class="uses" d="M 1009 556 V 612"/>
  <path class="uses" d="M 1271 556 V 612"/>
</svg>
