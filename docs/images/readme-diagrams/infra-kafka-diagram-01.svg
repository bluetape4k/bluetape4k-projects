<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 820" width="1340" height="820">
<style>
  text { font-family: 'Architects Daughter', 'Comic Mono', 'Comic Sans MS', sans-serif; letter-spacing: 0; }
</style>
<defs>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-purple" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#9333ea" stroke="#9333ea" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="arrow-orange" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 0 0 L 14 7 L 0 14 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
</defs>
<rect width="1340" height="820" fill="#ffffff"/>
<text x="670" y="42" fill="#111827" font-size="28" font-weight="700" text-anchor="middle" >Kafka API Structure</text>
<text x="670" y="70" fill="#6b7280" font-size="14" font-weight="500" text-anchor="middle" >Kotlin client helpers, coroutine bridges, codecs, Spring adapters, and Streams DSL wrappers around Apache Kafka</text>
<rect x="48" y="104" width="220" height="612" rx="14" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.6"/>
<text x="70" y="134" fill="#111827" font-size="15" font-weight="700" text-anchor="start" >Application code</text>
<text x="70" y="156" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start" >uses small Kotlin entrypoints</text>
<rect x="304" y="104" width="660" height="612" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6"/>
<text x="326" y="134" fill="#111827" font-size="15" font-weight="700" text-anchor="start" >bluetape4k-kafka module</text>
<text x="326" y="156" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start" >source-backed API groups</text>
<rect x="1004" y="104" width="300" height="612" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="1026" y="134" fill="#111827" font-size="15" font-weight="700" text-anchor="start" >Kafka runtime</text>
<text x="1026" y="156" fill="#6b7280" font-size="12" font-weight="500" text-anchor="start" >external broker and topics</text>
<g id="app">
<rect x="82" y="356" width="152" height="136" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.8"/>
<text x="102" y="387" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >User code</text>
<text x="102" y="414" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >builds records</text>
<text x="102" y="432" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >selects codecs</text>
<text x="102" y="450" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >collects flows</text>
</g>
<g id="clients">
<rect x="344" y="170" width="256" height="132" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.8"/>
<text x="364" y="201" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >Client factories</text>
<text x="364" y="228" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >producerOf(...)</text>
<text x="364" y="246" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >consumerOf(...)</text>
<text x="364" y="264" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >TopicPartition helpers</text>
</g>
<g id="coroutines">
<rect x="644" y="170" width="276" height="132" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.8"/>
<text x="664" y="201" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >Coroutine producer</text>
<text x="664" y="228" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >suspendSend awaits callback</text>
<text x="664" y="246" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >sendAsFlow buffers results</text>
<text x="664" y="264" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >cancels pending Future</text>
</g>
<g id="codecs">
<rect x="344" y="366" width="256" height="150" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.8"/>
<text x="364" y="397" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >KafkaCodecs</text>
<text x="364" y="424" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >String / ByteArray / Jackson</text>
<text x="364" y="442" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >Kryo, Fory and compression</text>
<text x="364" y="460" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >type header allowlist guard</text>
</g>
<g id="spring">
<rect x="644" y="366" width="276" height="150" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.8"/>
<text x="664" y="397" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >Spring coroutine bridge</text>
<text x="664" y="424" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >KafkaOperations.suspendSend</text>
<text x="664" y="442" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >Suspend producer template</text>
<text x="664" y="460" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >Suspend consumer template</text>
</g>
<g id="streams">
<rect x="344" y="590" width="576" height="100" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/>
<text x="364" y="621" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >Streams DSL helpers</text>
<text x="364" y="648" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >consumedOf, producedOf, groupedOf, materializedOf, joinedOf, windowedOf</text>
</g>
<g id="runtime">
<rect x="1034" y="340" width="250" height="168" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
<image data-bluetape4k-icon="testcontainers/mq/apache-kafka.svg" href="data:image/svg+xml;base64," x="1052" y="363" width="52" height="52" preserveAspectRatio="xMidYMid meet"/>
<text x="1112" y="371" fill="#111827" font-size="17" font-weight="700" text-anchor="start" >Apache Kafka</text>
<text x="1112" y="398" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >brokers</text>
<text x="1112" y="416" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >topics</text>
<text x="1112" y="434" fill="#4b5563" font-size="13" font-weight="500" text-anchor="start" >partitions</text>
</g>
<path id="app-clients" d="M 234 392 L 278 392 Q 292 392 292 378 L 292 250 Q 292 236 306 236 L 344 236" fill="none" stroke="#2563eb" stroke-width="3.6"  marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
