<rect x="269.25" y="396" width="45.5" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="292" y="412" fill="#9333ea" font-size="12" font-weight="700" text-anchor="middle" >serialize</text>
<path id="app-streams" d="M 234 462 L 274 462 Q 288 462 288 476 L 288 626 Q 288 640 302 640 L 344 640" fill="none" stroke="#16a34a" stroke-width="3.6"  marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="267" y="536" width="42" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="288" y="552" fill="#16a34a" font-size="12" font-weight="700" text-anchor="middle" >topology</text>
<path id="clients-runtime" d="M 600 236 L 612 236 Q 622 236 622 226 L 622 108 Q 622 94 636 94 L 1196 94 Q 1210 94 1210 108 L 1210 302 Q 1210 316 1196 316 L 1128 316 Q 1118 316 1118 326 L 1118 340" fill="none" stroke="#2563eb" stroke-width="3.4"  marker-end="url(#arrow-blue)" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="820" y="76" width="56" height="22" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="848" y="92" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle" >client calls</text>
<path id="coroutines-runtime" d="M 920 236 L 972 236 Q 986 236 986 250 L 986 362 Q 986 376 1000 376 L 1034 376" fill="none" stroke="#16a34a" stroke-width="3.6"  marker-end="url(#arrow-green)" stroke-linecap="round" stroke-linejoin="round"/>
