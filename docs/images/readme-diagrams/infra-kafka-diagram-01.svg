<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="946" viewBox="0 0 1500 946" role="img" aria-label="Kafka Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1500" height="946"/>
<rect class="frame" x="32" y="28" width="1436" height="890" rx="30"/>
<text class="title" x="68" y="84">Kafka Class Hierarchy</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="inherit" data-from="StringKafkaCodec" data-to="KafkaCodec" data-route-color="amber" d="M1036 398 L1036 303" stroke="#B9851B"/>
<path class="inherit" data-from="BinaryKafkaCodec" data-to="KafkaCodec" data-route-color="pink" d="M750 398 L750 303" stroke="#C94D68"/>
<path class="inherit" data-from="JacksonKafkaCodec" data-to="KafkaCodec" data-route-color="purple" d="M452 398 L452 303" stroke="#755BC6"/>
<g id="SuspendKafkaConsumerTemplate">
  <rect class="classCard" x="140" y="620" width="360" height="138" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="320" y="639" text-anchor="middle">class</text>
  <text class="classTitle" x="320" y="658" text-anchor="middle">SuspendKafkaConsumer</text>
<text class="classTitle" x="320" y="680" text-anchor="middle">Template</text>
  <line x1="140" y1="684" x2="500" y2="684" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="174" y="717">-receiverOptions: ReceiverOptions</text>
<text class="member" x="174" y="734">+receive() Flow~ReceiverRecord~</text>
</g>
<g id="KafkaCodec">
  <rect class="classCard" x="400" y="165" width="700" height="138" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="750" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="212" text-anchor="middle">KafkaCodec</text>
  <line x1="400" y1="221" x2="1100" y2="221" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="434" y="258">+serialize(topic, data) ByteArray</text>
<text class="member" x="434" y="275">+deserialize(topic, bytes) T</text>
</g>
<g id="KafkaCodecs">
  <rect class="classCard" x="570" y="620" width="360" height="146" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="750" y="639" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="667" text-anchor="middle">KafkaCodecs</text>
  <line x1="570" y1="676" x2="930" y2="676" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="604" y="708">+String: StringKafkaCodec</text>
<text class="member" x="604" y="725">+ByteArray: ByteArrayKafkaCodec</text>
<text class="member" x="604" y="742">+Jackson: JacksonKafkaCodec</text>
</g>
<g id="SuspendKafkaProducerTemplate">
  <rect class="classCard" x="1000" y="620" width="360" height="156" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="1180" y="639" text-anchor="middle">class</text>
  <text class="classTitle" x="1180" y="658" text-anchor="middle">SuspendKafkaProducer</text>
<text class="classTitle" x="1180" y="680" text-anchor="middle">Template</text>
  <line x1="1000" y1="684" x2="1360" y2="684" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="1034" y="717">-senderOptions: SenderOptions</text>
<text class="member" x="1034" y="734">+send(topic, value) SenderResult</text>
<text class="member" x="1034" y="751">+send(topic, key, value)</text>
</g>
<g id="JacksonKafkaCodec">
  <rect class="classCard" x="140" y="398" width="360" height="138" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="320" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="320" y="445" text-anchor="middle">JacksonKafkaCodec</text>
  <line x1="140" y1="454" x2="500" y2="454" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="174" y="491">+serialize(topic, data) ByteArray</text>
<text class="member" x="174" y="508">+deserialize(topic, bytes) T</text>
</g>
<g id="BinaryKafkaCodec">
  <rect class="classCard" x="570" y="398" width="360" height="138" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="750" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="750" y="445" text-anchor="middle">BinaryKafkaCodec</text>
  <line x1="570" y1="454" x2="930" y2="454" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="604" y="491">+serialize(topic, data) ByteArray</text>
<text class="member" x="604" y="508">+deserialize(topic, bytes) T</text>
</g>
<g id="StringKafkaCodec">
  <rect class="classCard" x="1000" y="398" width="360" height="138" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="1180" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1180" y="445" text-anchor="middle">StringKafkaCodec</text>
  <line x1="1000" y1="454" x2="1360" y2="454" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="1034" y="491">+serialize(topic, data) ByteArray</text>
<text class="member" x="1034" y="508">+deserialize(topic, bytes) String</text>
</g>
<g>
  <rect x="1085" y="838" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1103 856 L1161 856" stroke="#3E9868"/>
  <text class="detail" x="1175" y="861">inheritance / implementation</text>
  <path class="dependency" d="M1103 877 L1161 877" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1175" y="882">dependency / usage</text>
</g>
<g><rect x="180" y="856" width="860" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="610" y="882" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
</svg>
