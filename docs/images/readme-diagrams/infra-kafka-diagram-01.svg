<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="942" viewBox="0 0 1754 942" role="img" aria-label="Kafka Class Hierarchy">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="942"/>
<rect class="frame" x="32" y="28" width="1690" height="886" rx="28"/>
<text class="title" x="66" y="82">Kafka Class Hierarchy</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="line" d="M1082 418 L1082 477 L1287 477 L1287 568"/>
<path class="line" d="M1082 418 L1082 509 L877 509 L877 568"/>
<path class="line" d="M1082 418 L1082 501 L467 501 L467 568"/>
<path class="implLine" d="M1287 568 L1287 493 L672 493 L672 334"/>
<path class="implLine" d="M877 568 L877 485 L672 485 L672 334"/>
<path class="implLine" d="M467 568 L467 477 L672 477 L672 334"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="170" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#5B8DEF"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Suspend Kafka Consumer</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Template</text>
  <text class="mono" x="18" y="124">-receiverOptions: ReceiverOptions</text>
<text class="mono" x="18" y="145">+receive() Flow~ReceiverRecord~</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">KafkaCodec</text>
  <text class="mono" x="18" y="108">+serialize(topic, data) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(topic, bytes) T</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="238" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«object»</text>
  <text class="label" x="170" y="61" text-anchor="middle">KafkaCodecs</text>
  <text class="mono" x="18" y="108">+String: StringKafkaCodec</text>
<text class="mono" x="18" y="129">+ByteArray: ByteArrayKafkaCodec</text>
<text class="mono" x="18" y="150">+Jackson: JacksonKafkaCodec</text>
<text class="mono" x="18" y="171">+Jdk: BinaryKafkaCodec</text>
<text class="mono" x="18" y="192">+Kryo: BinaryKafkaCodec</text>
<text class="mono" x="18" y="213">+Fory: BinaryKafkaCodec</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="212" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="94" x2="340" y2="94" stroke="#DC6B82"/>
    <text class="label" x="170" y="44.5" text-anchor="middle">Suspend Kafka Producer</text>
<text class="label" x="170" y="69.5" text-anchor="middle">Template</text>
  <text class="mono" x="18" y="124">-senderOptions: SenderOptions</text>
<text class="mono" x="18" y="145">+send(topic, value) SenderResult</text>
<text class="mono" x="18" y="166">+send(topic, key, value) SenderResult</text>
<text class="mono" x="18" y="187">+send(record) SenderResult</text>
</g>
<g transform="translate(297,568)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
    <text class="label" x="170" y="49" text-anchor="middle">JacksonKafkaCodec</text>
  <text class="mono" x="18" y="108">+serialize(topic, data) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(topic, bytes) T</text>
</g>
<g transform="translate(707,568)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
    <text class="label" x="170" y="49" text-anchor="middle">BinaryKafkaCodec</text>
  <text class="mono" x="18" y="108">+serialize(topic, data) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(topic, bytes) T</text>
</g>
<g transform="translate(1117,568)">
  <rect class="card" x="0" y="0" width="340" height="154" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
    <text class="label" x="170" y="49" text-anchor="middle">StringKafkaCodec</text>
  <text class="mono" x="18" y="108">+serialize(topic, data) ByteArray</text>
<text class="mono" x="18" y="129">+deserialize(topic, bytes) String</text>
</g>
