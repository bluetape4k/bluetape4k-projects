  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Compressor</text>
  <text class="mono" x="18" y="108">+compress(plain: ByteArray?) ByteArray</text>
