<g><rect class="labelPill" x="555" y="299" width="142" height="30" rx="8" fill="#FFFFFF" stroke="#58A978" stroke-width="1.2"/><text class="detail" x="626" y="315" text-anchor="middle" dominant-baseline="middle">stream wrapper</text></g>
<g><rect x="140" y="1022" width="1160" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="720" y="1048" text-anchor="middle">bluetape4k-projects / core compressors - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
