<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">bluetape4k-io compressor hierarchy</title>
  <desc id="desc">UML-style map of one-shot Compressor contracts, grouped concrete compressor families, streaming adapters, and ZIP file support in bluetape4k-io.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .member, .small, .footer, .label { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 18px; }
      .panel-title, .lane-title, .class-title { font-family: "Architects Daughter"; fill: #1f3138; }
      .panel-title { font-size: 25px; }
      .lane-title { font-size: 20px; }
      .class-title { font-size: 21px; }
      .member { font-size: 14px; }
      .small { font-size: 13px; }
      .label { font-size: 12px; fill: #546a73; }
      .footer { font-size: 14px; fill: #60727d; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .class-panel { fill: #eef6f8; stroke: #b2cbd2; stroke-width: 2; }
      .stream-panel { fill: #f7f4ed; stroke: #d0c4ad; stroke-width: 2; }
      .rule-panel { fill: #ffffff; stroke: #c6d2d5; stroke-width: 2; }
      .api { fill: #ffffff; stroke: #4f6c77; stroke-width: 2; }
      .abstract { fill: #fffdf7; stroke: #8a7447; stroke-width: 2; }
      .impl { fill: #fdfefe; stroke: #5d7b63; stroke-width: 2; }
      .registry { fill: #f7fbff; stroke: #6c86a1; stroke-width: 2; }
      .stream { fill: #fff8ec; stroke: #b48748; stroke-width: 2; }
      .security { fill: #fffafa; stroke: #b65f68; stroke-width: 2; }
      .sep { stroke: #d6dee2; stroke-width: 1.5; }
      .extends { fill: none; stroke: #263238; stroke-width: 1.9; marker-end: url(#hollowDark); }
      .realize { fill: none; stroke: #455a64; stroke-width: 1.7; stroke-dasharray: 7 5; marker-end: url(#hollowSlate); }
      .usesBlue { fill: none; stroke: #4b74a5; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrowBlue); }
      .usesGold { fill: none; stroke: #a2743d; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrowGold); }
      .usesRed { fill: none; stroke: #b65f68; stroke-width: 1.8; stroke-dasharray: 7 5; marker-end: url(#arrowRed); }
      .flowGreen { fill: none; stroke: #5d7b63; stroke-width: 2; marker-end: url(#arrowGreen); }
      .inheritBus { fill: none; stroke: #263238; stroke-width: 1.9; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#4b74a5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#5d7b63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#a2743d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 14 12" markerWidth="13" markerHeight="11" refX="12" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 13 6 L 1 11" fill="none" stroke="#b65f68" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="hollowDark" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 16 8 L 1 15 Z" fill="#fbfcf8" stroke="#263238" stroke-width="1.7" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <marker id="hollowSlate" viewBox="0 0 18 16" markerWidth="16" markerHeight="14" refX="16" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 1 1 L 16 8 L 1 15 Z" fill="#fbfcf8" stroke="#455a64" stroke-width="1.7" stroke-dasharray="none" style="stroke-dasharray:none"/>
    </marker>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22333b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="1752" height="1132" rx="20" class="frame"/>
  <text x="900" y="78" text-anchor="middle" class="title">bluetape4k-io Compressor Hierarchy</text>
  <text x="900" y="108" text-anchor="middle" class="subtitle">One-shot compressors share a base contract; streaming support is wrapper-backed or one-shot adapted.</text>

  <rect x="72" y="150" width="1128" height="784" rx="16" class="class-panel"/>
  <text x="102" y="190" class="panel-title">One-shot class hierarchy and algorithm choices</text>
  <text x="102" y="218" class="small">Compressor owns the public API. AbstractCompressor centralizes null, empty input, and nullable failure policy.</text>

  <rect x="420" y="262" width="430" height="126" rx="7" class="api" filter="url(#softShadow)"/>
  <text x="635" y="294" text-anchor="middle" class="class-title">Compressor</text>
  <line x1="420" y1="314" x2="850" y2="314" class="sep"/>
  <text x="452" y="340" class="member">+ compress(ByteArray?): ByteArray</text>
  <text x="452" y="362" class="member">+ decompress(ByteArray?): ByteArray</text>

  <rect x="420" y="476" width="430" height="154" rx="7" class="abstract" filter="url(#softShadow)"/>
  <text x="635" y="508" text-anchor="middle" class="class-title">AbstractCompressor</text>
  <line x1="420" y1="528" x2="850" y2="528" class="sep"/>
  <text x="452" y="554" class="member"># doCompress(ByteArray)</text>
  <text x="452" y="576" class="member"># doDecompress(ByteArray)</text>
  <text x="452" y="598" class="member">+ compressOrNull / decompressOrNull</text>

  <rect x="112" y="472" width="250" height="158" rx="7" class="registry" filter="url(#softShadow)"/>
  <text x="237" y="504" text-anchor="middle" class="class-title">Compressors</text>
  <line x1="112" y1="524" x2="362" y2="524" class="sep"/>
  <text x="136" y="550" class="member">lazy shared instances</text>
  <text x="136" y="572" class="member">LZ4, Snappy, Zstd</text>
  <text x="136" y="594" class="member">GZip, Deflate, Zip</text>
  <text x="136" y="616" class="member">Streaming nested registry</text>

  <rect x="908" y="472" width="250" height="158" rx="7" class="registry" filter="url(#softShadow)"/>
  <text x="1033" y="504" text-anchor="middle" class="class-title">API policy</text>
  <line x1="908" y1="524" x2="1158" y2="524" class="sep"/>
  <text x="932" y="550" class="member">throwing APIs propagate</text>
  <text x="932" y="572" class="member">empty input returns empty</text>
  <text x="932" y="594" class="member">OrNull APIs return null</text>

  <rect x="118" y="728" width="306" height="126" rx="7" class="impl" filter="url(#softShadow)"/>
  <text x="271" y="760" text-anchor="middle" class="class-title">Fast latency</text>
  <line x1="118" y1="780" x2="424" y2="780" class="sep"/>
  <text x="146" y="806" class="member">LZ4, BlockLZ4, FramedLZ4</text>
  <text x="146" y="828" class="member">Snappy, FramedSnappy</text>

  <rect x="482" y="728" width="306" height="126" rx="7" class="impl" filter="url(#softShadow)"/>
  <text x="635" y="760" text-anchor="middle" class="class-title">Network balanced</text>
  <line x1="482" y1="780" x2="788" y2="780" class="sep"/>
  <text x="510" y="806" class="member">Zstd, ApacheZstd</text>
  <text x="510" y="828" class="member">GZip, ApacheGZip, Deflate</text>

  <rect x="846" y="728" width="306" height="126" rx="7" class="impl" filter="url(#softShadow)"/>
  <text x="999" y="760" text-anchor="middle" class="class-title">Storage and archive</text>
  <line x1="846" y1="780" x2="1152" y2="780" class="sep"/>
  <text x="874" y="806" class="member">BZip2 for ratio-first storage</text>
  <text x="874" y="828" class="member">Zip for archive compatibility</text>

  <rect x="1256" y="150" width="472" height="784" rx="16" class="stream-panel"/>
  <text x="1286" y="190" class="panel-title">Streaming and ZIP support</text>
  <text x="1286" y="218" class="small">Use real stream wrappers where codecs expose them.</text>
  <text x="1286" y="240" class="small">Fallback adapters preserve the same public contract.</text>

  <rect x="1316" y="294" width="352" height="126" rx="7" class="api" filter="url(#softShadow)"/>
  <text x="1492" y="326" text-anchor="middle" class="class-title">StreamingCompressor</text>
  <line x1="1316" y1="346" x2="1668" y2="346" class="sep"/>
  <text x="1340" y="372" class="member">+ compressing(OutputStream)</text>
  <text x="1340" y="394" class="member">+ decompressing(InputStream)</text>

  <rect x="1316" y="520" width="352" height="148" rx="7" class="stream" filter="url(#softShadow)"/>
  <text x="1492" y="552" text-anchor="middle" class="class-title">StreamingCompressors</text>
  <line x1="1316" y1="572" x2="1668" y2="572" class="sep"/>
  <text x="1340" y="598" class="member">Compressors.Streaming registry</text>
  <text x="1340" y="620" class="member">of(wrapper factories)</text>
  <text x="1340" y="642" class="member">from(Compressor) one-shot adapter</text>

  <rect x="1316" y="748" width="352" height="106" rx="7" class="security" filter="url(#softShadow)"/>
  <text x="1492" y="780" text-anchor="middle" class="class-title">ZipBuilder and ZipFileSupport</text>
  <line x1="1316" y1="800" x2="1668" y2="800" class="sep"/>
  <text x="1340" y="826" class="member">in-memory or file ZIP builder</text>
  <text x="1340" y="848" class="member">Zip Slip and zip bomb guards</text>

  <rect x="92" y="976" width="1616" height="82" rx="14" class="rule-panel"/>
  <text x="122" y="1008" class="panel-title">Reader contract</text>
  <text x="122" y="1036" class="small">Use Compressors for shared one-shot codecs. Choose Compressors.Streaming for stream APIs; wrapper-backed codecs avoid buffering, while one-shot adapters preserve compatibility.</text>

  <path d="M 635 476 L 635 388" class="realize" style="marker-end:none"/>
<polygon points="641,400 635,388 629,400" fill="#455a64" stroke="#455a64" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <rect x="656" y="422" width="90" height="24" rx="12" fill="#ffffff" stroke="#d7e0e4"/>
  <text x="701" y="439" text-anchor="middle" class="label">implements</text>

  <path d="M 635 728 L 635 630" class="extends"/>
  <path d="M 271 728 L 271 696 Q 271 682 285 682 L 635 682" class="inheritBus" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 999 728 L 999 696 Q 999 682 985 682 L 635 682" class="inheritBus" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="648" y="650" width="112" height="24" rx="12" fill="#ffffff" stroke="#d7e0e4"/>
  <text x="704" y="667" text-anchor="middle" class="label">grouped subclasses</text>

  <path d="M 362 544 L 420 544" class="flowGreen"/>
  <path d="M 850 554 L 908 554" class="usesBlue" style="marker-end:none"/>
<polyline points="896,560 908,554 896,548" fill="none" stroke="#4b74a5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <path d="M 1492 520 L 1492 420" class="realize" style="marker-end:none"/>
<polygon points="1498,432 1492,420 1486,432" fill="#455a64" stroke="#455a64" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path d="M 1492 668 L 1492 748" class="usesRed" style="marker-end:none"/>
<polyline points="1486,736 1492,748 1498,736" fill="none" stroke="#b65f68" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>

  <text x="900" y="1116" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/io README</text>
</svg>
