<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-label="Compressor API Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F3F7FB;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#22344A;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .ioPillText{font-family:"Comic Mono";font-size:13px;fill:#22344A}
    .inherit{fill:none;stroke-width:2.45;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .labelPill{fill:#fff;stroke-width:1.2}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1440" height="1120"/>
<rect class="frame" x="32" y="28" width="1376" height="1064" rx="30"/>
<text class="title" x="68" y="84">Compressor API Structure</text>
<text class="subtitle" x="72" y="116">Contracts, adapters, algorithm families, and ZIP helpers are grouped by how a reader chooses and uses compression.</text>
<g>
  <rect x="72" y="150" width="1296" height="270" rx="18" fill="#EEF5FF" stroke="#5B8DEF" stroke-width="2"/>
  <rect x="72" y="150" width="1296" height="48" rx="18" fill="#EEF5FF" stroke="#5B8DEF" stroke-width="0"/>
  <path d="M72 198 L1368 198" stroke="#5B8DEF" stroke-width="1.4"/>
  <circle cx="106" cy="174" r="11" fill="#4F83BF"/>
  <text class="panelTitle" x="126" y="180">Contracts and adapters</text>
</g>
<g>
  <rect x="72" y="450" width="1296" height="330" rx="18" fill="#FFF8E4" stroke="#D6A441" stroke-width="2"/>
  <rect x="72" y="450" width="1296" height="48" rx="18" fill="#FFF8E4" stroke="#D6A441" stroke-width="0"/>
  <path d="M72 498 L1368 498" stroke="#D6A441" stroke-width="1.4"/>
  <circle cx="106" cy="474" r="11" fill="#B9851B"/>
  <text class="panelTitle" x="126" y="480">Registry and byte-array families</text>
</g>
<g>
  <rect x="72" y="810" width="1296" height="165" rx="18" fill="#EEF9F6" stroke="#45A7A1" stroke-width="2"/>
  <rect x="72" y="810" width="1296" height="48" rx="18" fill="#EEF9F6" stroke="#45A7A1" stroke-width="0"/>
  <path d="M72 858 L1368 858" stroke="#45A7A1" stroke-width="1.4"/>
  <circle cx="106" cy="834" r="11" fill="#2E8F89"/>
  <text class="panelTitle" x="126" y="840">ZIP archive helpers</text>
</g>
<g>
  <rect class="soft" x="124" y="225" width="235" height="58" rx="24" fill="#F8FAFC" stroke="#9FB0C3" stroke-width="1.8"/>
  <text class="ioPillText" x="241.5" y="255" text-anchor="middle" dominant-baseline="middle">one-shot payload API</text>
</g>
<g>
  <rect class="soft" x="124" y="305" width="235" height="58" rx="24" fill="#F8FAFC" stroke="#9FB0C3" stroke-width="1.8"/>
  <text class="ioPillText" x="241.5" y="335" text-anchor="middle" dominant-baseline="middle">large stream API</text>
</g>
<g id="compressor">
  <rect class="classCard" x="405" y="205" width="360" height="92" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="585" y="216" text-anchor="middle" dominant-baseline="middle">interface</text>
  <text class="classTitle" x="585" y="236" text-anchor="middle" dominant-baseline="middle">Compressor</text>
  <text class="member" x="585" y="257" text-anchor="middle" dominant-baseline="middle">ByteArray, String, ByteBuffer</text>
<text class="member" x="585" y="274" text-anchor="middle" dominant-baseline="middle">InputStream convenience overloads</text>
</g>
<g id="streaming">
  <rect class="classCard" x="890" y="205" width="360" height="92" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1070" y="216" text-anchor="middle" dominant-baseline="middle">interface</text>
  <text class="classTitle" x="1070" y="236" text-anchor="middle" dominant-baseline="middle">StreamingCompressor</text>
  <text class="member" x="1070" y="257" text-anchor="middle" dominant-baseline="middle">wrap input/output streams</text>
<text class="member" x="1070" y="274" text-anchor="middle" dominant-baseline="middle">large payload streaming contract</text>
</g>
<g id="streamingFactory">
  <rect class="classCard" x="890" y="325" width="360" height="72" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1070" y="334" text-anchor="middle" dominant-baseline="middle">factory object</text>
  <text class="classTitle" x="1070" y="354" text-anchor="middle" dominant-baseline="middle">StreamingCompressors</text>
  <text class="member" x="1070" y="375" text-anchor="middle" dominant-baseline="middle">adapter extensions both ways</text>
</g>
<g id="abstract">
  <rect class="classCard" x="124" y="520" width="360" height="104" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="304" y="529" text-anchor="middle" dominant-baseline="middle">abstract class</text>
  <text class="classTitle" x="304" y="549" text-anchor="middle" dominant-baseline="middle">AbstractCompressor</text>
  <text class="member" x="304" y="570" text-anchor="middle" dominant-baseline="middle">null and empty input policy</text>
<text class="member" x="304" y="587" text-anchor="middle" dominant-baseline="middle">doCompress / doDecompress hooks</text>
<text class="member" x="304" y="604" text-anchor="middle" dominant-baseline="middle">compressOrNull failure recovery</text>
</g>
<g id="registry">
  <rect class="classCard" x="540" y="520" width="360" height="104" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="720" y="529" text-anchor="middle" dominant-baseline="middle">registry object</text>
  <text class="classTitle" x="720" y="549" text-anchor="middle" dominant-baseline="middle">Compressors</text>
  <text class="member" x="720" y="570" text-anchor="middle" dominant-baseline="middle">lazy shared instances</text>
<text class="member" x="720" y="587" text-anchor="middle" dominant-baseline="middle">algorithm selection surface</text>
<text class="member" x="720" y="604" text-anchor="middle" dominant-baseline="middle">nested Streaming registry</text>
</g>
<g>
  <rect x="376" y="650" width="688" height="32" rx="11" fill="#FFFFFF" stroke="#D6A441" stroke-width="1.4"/>
  <text class="detail" x="720" y="667" text-anchor="middle" dominant-baseline="middle">implementation families share AbstractCompressor policy and are exposed through Compressors</text>
</g>
<g id="speed">
  <rect class="classCard" x="124" y="690" width="350" height="84" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="299" y="697" text-anchor="middle" dominant-baseline="middle">implementation group</text>
  <text class="classTitle" x="299" y="717" text-anchor="middle" dominant-baseline="middle">Low-latency family</text>
  <text class="member" x="299" y="738" text-anchor="middle" dominant-baseline="middle">LZ4, BlockLZ4, FramedLZ4</text>
<text class="member" x="299" y="755" text-anchor="middle" dominant-baseline="middle">Snappy, FramedSnappy</text>
</g>
<g id="standard">
  <rect class="classCard" x="545" y="690" width="350" height="84" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="720" y="697" text-anchor="middle" dominant-baseline="middle">implementation group</text>
  <text class="classTitle" x="720" y="717" text-anchor="middle" dominant-baseline="middle">Standard format family</text>
  <text class="member" x="720" y="738" text-anchor="middle" dominant-baseline="middle">GZip, ApacheGZip</text>
<text class="member" x="720" y="755" text-anchor="middle" dominant-baseline="middle">Deflate, ZipCompressor</text>
</g>
<g id="ratio">
  <rect class="classCard" x="966" y="690" width="350" height="84" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1141" y="697" text-anchor="middle" dominant-baseline="middle">implementation group</text>
  <text class="classTitle" x="1141" y="717" text-anchor="middle" dominant-baseline="middle">Ratio-oriented family</text>
  <text class="member" x="1141" y="738" text-anchor="middle" dominant-baseline="middle">Zstd, ApacheZstd, BZip2</text>
<text class="member" x="1141" y="755" text-anchor="middle" dominant-baseline="middle">storage or network payloads</text>
</g>
<g id="zipBuilder">
  <rect class="classCard" x="124" y="870" width="340" height="76" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="294" y="881" text-anchor="middle" dominant-baseline="middle">builder class</text>
  <text class="classTitle" x="294" y="901" text-anchor="middle" dominant-baseline="middle">ZipBuilder</text>
  <text class="member" x="294" y="922" text-anchor="middle" dominant-baseline="middle">in-memory or file ZIP creation</text>
</g>
<g id="zipSupport">
  <rect class="classCard" x="550" y="870" width="340" height="76" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="720" y="881" text-anchor="middle" dominant-baseline="middle">extension file</text>
  <text class="classTitle" x="720" y="901" text-anchor="middle" dominant-baseline="middle">ZipFileSupport</text>
  <text class="member" x="720" y="922" text-anchor="middle" dominant-baseline="middle">gzip, zlib, unzip helpers</text>
</g>
<g id="zipGuards">
  <rect class="classCard" x="976" y="870" width="340" height="76" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1146" y="873" text-anchor="middle" dominant-baseline="middle">constants</text>
  <text class="classTitle" x="1146" y="893" text-anchor="middle" dominant-baseline="middle">ZIP safety guards</text>
  <text class="member" x="1146" y="914" text-anchor="middle" dominant-baseline="middle">max entries 10,000</text>
<text class="member" x="1146" y="931" text-anchor="middle" dominant-baseline="middle">max uncompressed size 1 GB</text>
</g>
