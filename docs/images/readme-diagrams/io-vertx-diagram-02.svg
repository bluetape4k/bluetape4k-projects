<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Vert.x Event Loop + Coroutines Processing Flow</title>
  <desc id="desc">Flow diagram using vertical layers to show route work entering coroutine helpers, awaiting Future completion, and returning success or failure.</desc>
  <defs>
    <style>
      .title { font-family: "Architects Daughter"; font-size: 42px; fill: #263238; }
      .subtitle, .detail, .label, .footer { font-family: "Comic Mono"; fill: #36464f; }
      .subtitle { font-size: 17px; }
      .frame { fill: #fbfcf8; stroke: #41545d; stroke-width: 3; }
      .lane { fill: #ffffff; stroke: #ccd7da; stroke-width: 1.8; }
      .laneTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #263238; }
      .card { stroke-width: 2.2; }
      .cardTitle { font-family: "Architects Daughter"; font-size: 22px; fill: #1f3138; }
      .detail { font-size: 13px; }
      .flow { fill: none; stroke: #7b67a8; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowFlow); }
      .async { fill: none; stroke: #3f7d9c; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowAsync); }
      .success { fill: none; stroke: #6e8f4f; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSuccess); }
      .failure { fill: none; stroke: #b86868; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowFailure); }
      .support { fill: none; stroke: #9b7d54; stroke-width: 2.7; stroke-dasharray: 8 6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowSupport); }
      .pill { fill: #ffffff; stroke: #d7e0e4; stroke-width: 1.4; }
      .label { font-size: 13px; }
      .footer { font-size: 14px; fill: #60727d; }
    </style>
    <marker id="arrowFlow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#7b67a8" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowAsync" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#3f7d9c" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowSuccess" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#6e8f4f" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowFailure" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#b86868" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
    <marker id="arrowSupport" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 11 5.5 L 0 11 Z" fill="#9b7d54" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  </defs>

  <rect x="24" y="24" width="1452" height="932" rx="20" class="frame"/>
  <text x="750" y="78" text-anchor="middle" class="title">Vert.x Event Loop + Coroutines Processing Flow</text>
  <text x="750" y="108" text-anchor="middle" class="subtitle">Future-producing work stays asynchronous; coroutine helpers suspend and resume on completion without blocking the event-loop thread.</text>

  <rect x="76" y="150" width="320" height="535" rx="14" class="lane" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/>
  <text x="106" y="188" class="laneTitle">Request boundary</text>
  <rect x="446" y="150" width="608" height="525" rx="14" class="lane" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/>
  <text x="476" y="188" class="laneTitle">Coroutine bridge</text>
  <rect x="1104" y="150" width="320" height="657" rx="14" class="lane" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/>
  <text x="1134" y="188" class="laneTitle">Runtime and outcome</text>

  <g id="route">
    <rect x="116" y="245" width="240" height="84" rx="10" fill="#eef5fa" stroke="#3f7d9c" class="card"/>
    <text x="236" y="279" text-anchor="middle" class="cardTitle">Route / Verticle</text>
    <text x="236" y="309" text-anchor="middle" class="detail">handler receives work</text>
  </g>
  <g id="scope">
    <rect x="116" y="505" width="240" height="84" rx="10" fill="#eef7f0" stroke="#6e8f4f" class="card"/>
    <text x="236" y="539" text-anchor="middle" class="cardTitle">CoroutineScope</text>
    <text x="236" y="569" text-anchor="middle" class="detail">launch suspend work</text>
  </g>

  <g id="event-loop">
    <rect x="494" y="225" width="240" height="92" rx="10" fill="#f2eef9" stroke="#7b67a8" class="card"/>
    <text x="614" y="260" text-anchor="middle" class="cardTitle">Vert.x event loop</text>
    <text x="614" y="290" text-anchor="middle" class="detail">Context owner</text>
  </g>
  <g id="dispatcher">
    <rect x="776" y="225" width="240" height="92" rx="10" fill="#eef5fa" stroke="#3f7d9c" class="card"/>
    <text x="896" y="260" text-anchor="middle" class="cardTitle">Vert.x dispatcher</text>
    <text x="896" y="290" text-anchor="middle" class="detail">withVertxDispatcher</text>
  </g>
  <g id="await">
    <rect x="746" y="500" width="270" height="96" rx="10" fill="#fff7e8" stroke="#a97b3d" class="card"/>
    <text x="881" y="537" text-anchor="middle" class="cardTitle">coAwait / await</text>
    <text x="881" y="567" text-anchor="middle" class="detail">Future completion callback</text>
  </g>

  <g id="future-api">
    <rect x="1144" y="225" width="240" height="92" rx="10" fill="#fff7e8" stroke="#a97b3d" class="card"/>
    <text x="1264" y="260" text-anchor="middle" class="cardTitle">Future API</text>
    <text x="1264" y="290" text-anchor="middle" class="detail">SQL/Web/client calls</text>
  </g>
  <g id="success">
    <rect x="1144" y="480" width="240" height="82" rx="10" fill="#f4f7f1" stroke="#6e8f4f" class="card"/>
    <text x="1264" y="514" text-anchor="middle" class="cardTitle">Success value</text>
    <text x="1264" y="542" text-anchor="middle" class="detail">resume with result</text>
  </g>
  <g id="failure">
    <rect x="1144" y="650" width="240" height="82" rx="10" fill="#f9eef0" stroke="#b86868" class="card"/>
    <text x="1264" y="684" text-anchor="middle" class="cardTitle">Failure cause</text>
    <text x="1264" y="712" text-anchor="middle" class="detail">ctx.fail / throw / recover</text>
  </g>

  <path class="flow" d="M 356 287 L 410 287 Q 426 287 426 271 L 494 271"/>
  <path class="async" d="M 734 271 L 776 271"/>
  <path class="support" d="M 1016 271 L 1144 271" style="marker-end:none"/>
<polygon points="1132,277 1144,271 1132,265" fill="#9b7d54" stroke="#9b7d54" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="success" d="M 236 329 L 236 505"/>
  <path class="flow" d="M 356 547 L 746 547"/>
  <path class="support" d="M 1264 317 L 1264 376 Q 1264 390 1250 390 L 895 390 Q 881 390 881 404 L 881 500" style="marker-end:none"/>
<polygon points="875,488 881,500 887,488" fill="#9b7d54" stroke="#9b7d54" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
  <path class="success" d="M 1016 530 L 1144 530"/>
  <path class="failure" d="M 1016 566 L 1066 566 Q 1080 566 1080 580 L 1080 677 Q 1080 691 1094 691 L 1144 691"/>

  <text x="750" y="928" text-anchor="middle" class="footer">github.com/bluetape4k/bluetape4k-projects - io/vertx README</text>
</svg>
