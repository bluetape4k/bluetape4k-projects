<svg data-intent="Explain Vert.x Future processing flow from Future-producing work through coroutine await, retry/resilience decorators, and success or failure outcomes." data-evidence="io/vertx/README.md; io/vertx/src/main/kotlin" data-source-read="io/vertx/README.md; io/vertx/src/main/kotlin" xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900" role="img" aria-label="Vert.x Future Processing Flow" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4F83BF"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#3E9868"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#2E8F89"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#B9851B"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C94D68"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#755BC6"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#758297"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A}
    .card{filter:url(#shadow);stroke-width:2}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .labelPill{fill:#fff;stroke:#D6E3EF;stroke-width:1.5}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.plain{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1460" height="900"/>
<rect class="frame" x="34" y="30" width="1392" height="840" rx="32"/>
<text class="title" x="72" y="84">Vert.x Future Processing Flow</text>
<text class="subtitle" x="76" y="116">Vert.x Future helpers bridge callback completion into suspending code while retry and recovery decorators preserve explicit success and failure paths.</text>
<g id="producer">
  <rect class="card" x="120" y="250" width="310" height="78" rx="14" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="275" y="282" text-anchor="middle" dominant-baseline="middle">Vert.x async work</text>
  <text class="detail" x="275" y="312" text-anchor="middle" dominant-baseline="middle">returns Future&lt;T&gt;</text>
</g>
<g id="future">
  <rect class="card" x="540" y="235" width="330" height="108" rx="14" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="705" y="273" text-anchor="middle" dominant-baseline="middle">Future&lt;T&gt;</text>
  <text class="detail" x="705" y="303" text-anchor="middle" dominant-baseline="middle">callback-driven completion</text>
  <text class="detail" x="705" y="321" text-anchor="middle" dominant-baseline="middle">typed result or cause</text>
</g>
<g id="await">
  <rect class="card" x="1010" y="210" width="330" height="86" rx="14" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="1175" y="246" text-anchor="middle" dominant-baseline="middle">Coroutine await</text>
  <text class="detail" x="1175" y="276" text-anchor="middle" dominant-baseline="middle">suspend until complete</text>
</g>
<g id="decorators">
  <rect class="card" x="1010" y="395" width="330" height="96" rx="14" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1175" y="436" text-anchor="middle" dominant-baseline="middle">Retry / resilience decorators</text>
  <text class="detail" x="1175" y="466" text-anchor="middle" dominant-baseline="middle">recover, compose, timeout</text>
</g>
<g id="complete">
  <rect class="card" x="560" y="540" width="320" height="96" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="720" y="581" text-anchor="middle" dominant-baseline="middle">Completion result</text>
  <text class="detail" x="720" y="611" text-anchor="middle" dominant-baseline="middle">success value or failure cause</text>
</g>
<g id="success">
  <rect class="card" x="980" y="690" width="330" height="82" rx="14" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="cardTitle" x="1145" y="724" text-anchor="middle" dominant-baseline="middle">Success result</text>
  <text class="detail" x="1145" y="754" text-anchor="middle" dominant-baseline="middle">resume caller with value</text>
</g>
<g id="failure">
  <rect class="card" x="170" y="690" width="330" height="82" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="335" y="724" text-anchor="middle" dominant-baseline="middle">Failure cause</text>
  <text class="detail" x="335" y="754" text-anchor="middle" dominant-baseline="middle">throw, recover, or map error</text>
</g>
<path class="route" data-from="producer" data-to="future" d="M430 289 L540 289" stroke="#4F83BF"/>
<path class="route" data-from="future" data-to="await" d="M870 289 L1010 253" stroke="#2E8F89"/>
<path class="route" data-from="future" data-to="decorators" d="M870 300 L1010 443" stroke="#B9851B"/>
<path class="route" data-from="future" data-to="complete" d="M705 343 L705 540" stroke="#755BC6"/>
<path class="route" data-from="decorators" data-to="complete" d="M1175 491 L1175 520 L720 520 L720 540" stroke="#B9851B"/>
<path class="route" data-from="complete" data-to="success" d="M880 588 L940 588 L940 650 L1145 650 L1145 690" stroke="#718A35"/>
<path class="route" data-from="complete" data-to="failure" d="M560 588 L500 588 L500 645 L335 645 L335 690" stroke="#C94D68"/>
<text class="detail" x="1010" y="668" text-anchor="middle" dominant-baseline="middle">success</text>
<text class="detail" x="410" y="648" text-anchor="middle" dominant-baseline="middle">failure</text>
</svg>
