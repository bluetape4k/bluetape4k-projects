<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1256" viewBox="0 0 1960 1256" role="img" aria-label="ServiceLoader Selection Sequence">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1960" height="1256"/>
<rect class="frame" x="32" y="28" width="1896" height="1200" rx="28"/>
<text class="title" x="66" y="82">ServiceLoader Selection Sequence</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="-10" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="140" y="209" text-anchor="middle">Application</text>
<line class="lifeline" x1="140" y1="252" x2="140" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="410" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="560" y="209" text-anchor="middle">VirtualThreads</text>
<line class="lifeline" x1="560" y1="252" x2="560" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="830" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="980" y="209" text-anchor="middle">ServiceLoader</text>
<line class="lifeline" x1="980" y1="252" x2="980" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1250" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1400" y="198.5" text-anchor="middle">Jdk21 Virtual</text>
<text class="smallLabel" x="1400" y="219.5" text-anchor="middle">Thread Factory</text>
<line class="lifeline" x1="1400" y1="252" x2="1400" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1670" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1820" y="198.5" text-anchor="middle">Jdk25 Virtual</text>
<text class="smallLabel" x="1820" y="219.5" text-anchor="middle">Thread Factory</text>
<line class="lifeline" x1="1820" y1="252" x2="1820" y2="1196" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="190.5" y="286" width="319" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="208.5" y="313" text-anchor="start">1. VirtualThreads.executorService()</text>
<path class="line" d="M140 344 L560 344"/>
<rect x="578.5" y="396" width="383" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="596.5" y="423" text-anchor="start">2. ServiceLoader.load(VirtualThreadFactory)</text>
<path class="line" d="M560 454 L980 454"/>
<rect x="534" y="506" width="472" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="552" y="533" text-anchor="start">3. [Jdk21Factory(21), Jdk25Factory(25), Fallback(MIN)]</text>
<path class="dashed" d="M980 564 L560 564"/>
<rect x="396.5" y="616" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="414.5" y="643" text-anchor="start">4. filter isSupported() &amp;&amp; sort by priority desc</text>
<path class="line" d="M560 674 C624 674 624 708 560 708"/>
<rect x="1085" y="746" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1103" y="773" text-anchor="start">5. executorService()</text>
<path class="line" d="M560 804 L1820 804"/>
<rect x="800.5" y="856" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="818.5" y="883" text-anchor="start">6. VirtualThreadExecutorService (JDK 25)</text>
<path class="dashed" d="M1820 914 L140 914"/>
<rect x="875" y="966" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="893" y="993" text-anchor="start">7. executorService()</text>
<path class="line" d="M560 1024 L1400 1024"/>
<rect x="590.5" y="1076" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="608.5" y="1103" text-anchor="start">8. VirtualThreadExecutorService (JDK 21)</text>
<path class="dashed" d="M1400 1134 L140 1134"/>
