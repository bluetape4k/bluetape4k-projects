<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-label="Spring Boot Hibernate Lettuce class structure">
  <style>
    text { font-family: 'Architects Daughter', 'Comic Mono', 'Helvetica Neue', Arial, sans-serif; dominant-baseline: alphabetic; }
  </style>
  <defs>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb" stroke="#2563eb" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a" stroke="#16a34a" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 10 10" refX="9" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ea580c" stroke="#ea580c" stroke-width="0" stroke-dasharray="none"  style="stroke-dasharray:none"/>
    </marker>
    <marker id="open-gray" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" viewBox="0 0 18 18" refX="16" refY="9" orient="auto" overflow="visible">
      <path d="M 3 3 L 16 9 L 3 15" fill="none" stroke="#64748b" stroke-width="2.4" stroke-dasharray="none" stroke-linecap="butt" stroke-linejoin="round" style="stroke-dasharray:none" />
    </marker>
  </defs>
  <rect width="1500" height="1080" fill="#ffffff" />
  <text x="74" y="62" font-size="30" font-weight="700" fill="#111827">Spring Boot Hibernate Lettuce Class Structure</text>
  <text x="74" y="92" font-size="15" fill="#64748b">Auto-configuration classes create the Hibernate customizer, metrics binder, and Actuator endpoint around the Lettuce Near Cache region factory.</text>


  <g class="group" data-group="AUTO-CONFIGURATION ENTRYPOINTS">
    <rect x="50" y="132" width="396" height="870" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="68" y="158" font-size="14" font-weight="700" fill="#2563eb">AUTO-CONFIGURATION ENTRYPOINTS</text>
    <text x="68" y="179" font-size="12.5" fill="#6b7280">Conditions decide which beans are created.</text>
  </g>

  <g class="group" data-group="CREATED BEANS AND ADAPTERS">
    <rect x="492" y="132" width="410" height="870" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="510" y="158" font-size="14" font-weight="700" fill="#64748b">CREATED BEANS AND ADAPTERS</text>
    <text x="510" y="179" font-size="12.5" fill="#6b7280">Bean methods adapt Boot to cache contracts.</text>
  </g>

  <g class="group" data-group="RUNTIME CONTRACTS">
    <rect x="1010" y="132" width="410" height="870" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.3" stroke-dasharray="7 5" />
    <text x="1028" y="158" font-size="14" font-weight="700" fill="#16a34a">RUNTIME CONTRACTS</text>
    <text x="1028" y="179" font-size="12.5" fill="#6b7280">Hibernate and observers consume the adapters.</text>
  </g>

  <path class="edge" d="M412 514 L530 514" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M412 687 L530 687" fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" />
  <path class="edge" d="M412 884 L530 884" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M 247 382 L 247 392 Q 247 400 255 400 L 486 400 Q 500 400 500 414 L 500 416 Q 500 430 508 430 L 530 430" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)" />
  <path class="edge" d="M 860 456 L 954 456 Q 968 456 968 442 L 968 305 Q 968 291 982 291 L 1048 291" fill="none" stroke="#16a34a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)" />
  <path class="edge" d="M 860 680 L 976 680 Q 990 680 990 666 L 990 589 Q 990 575 1004 575 L 1048 575" fill="none" stroke="#64748b" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" />

  <polyline points="1030,583 1048,575 1030,567" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
  <path class="edge" d="M 860 884 L 954 884 Q 968 884 968 870 L 968 861 Q 968 847 982 847 L 1048 847" fill="none" stroke="#ea580c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-orange)" />
  <path class="edge" d="M 860 690 L 954 690 Q 968 690 968 704 L 968 833 Q 968 847 982 847 L 1048 847" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)" />


  <g class="card" data-card="LettuceNearCache SpringProperties">
    <rect x="82" y="208" width="330" height="174" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="247" y="229" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;ConfigurationProperties&gt;&gt;</text>
    <text x="247" y="250" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCache</text>
<text x="247" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">SpringProperties</text>
    <line x1="82" y1="282" x2="412" y2="282" stroke="#2563eb" stroke-width="1.1" opacity="0.55" />
    <line x1="82" y1="336" x2="412" y2="336" stroke="#2563eb" stroke-width="1.1" opacity="0.45" />
    <text x="98" y="305" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">enabled, redisUri, codec, useResp3</text>
<text x="98" y="323" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">local, redisTtl, metrics</text>
    <text x="98" y="359" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">prefix: bluetape4k.cache.lettuce-near</text>
  </g>

  <g class="card" data-card="LettuceNearCacheHibernate AutoConfiguration">
    <rect x="82" y="432" width="330" height="164" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8" />
    <text x="247" y="453" text-anchor="middle" font-size="12.5" fill="#0f766e">&lt;&lt;AutoConfiguration&gt;&gt;</text>
    <text x="247" y="474" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCacheHibernate</text>
<text x="247" y="494" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">AutoConfiguration</text>
    <line x1="82" y1="506" x2="412" y2="506" stroke="#0f766e" stroke-width="1.1" opacity="0.55" />
    <line x1="82" y1="542" x2="412" y2="542" stroke="#0f766e" stroke-width="1.1" opacity="0.45" />
    <text x="98" y="529" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">conditions: RegionFactory + EntityManagerFactory</text>
    <text x="98" y="565" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ hibernatePropertiesCustomizer(props)</text>
  </g>

  <g class="card" data-card="LettuceNearCacheMetrics AutoConfiguration">
    <rect x="82" y="636" width="330" height="164" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <text x="247" y="657" text-anchor="middle" font-size="12.5" fill="#7c3aed">&lt;&lt;AutoConfiguration&gt;&gt;</text>
    <text x="247" y="678" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCacheMetrics</text>
<text x="247" y="698" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">AutoConfiguration</text>
    <line x1="82" y1="710" x2="412" y2="710" stroke="#7c3aed" stroke-width="1.1" opacity="0.55" />
    <line x1="82" y1="746" x2="412" y2="746" stroke="#7c3aed" stroke-width="1.1" opacity="0.45" />
    <text x="98" y="733" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">conditions: EntityManagerFactory + MeterRegistry</text>
    <text x="98" y="769" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ metricsBinder(emf, registry)</text>
  </g>

  <g class="card" data-card="LettuceNearCacheActuator AutoConfiguration">
    <rect x="82" y="828" width="330" height="148" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="247" y="849" text-anchor="middle" font-size="12.5" fill="#ea580c">&lt;&lt;AutoConfiguration&gt;&gt;</text>
    <text x="247" y="870" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCacheActuator</text>
<text x="247" y="890" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">AutoConfiguration</text>
    <line x1="82" y1="902" x2="412" y2="902" stroke="#ea580c" stroke-width="1.1" opacity="0.55" />
    <line x1="82" y1="938" x2="412" y2="938" stroke="#ea580c" stroke-width="1.1" opacity="0.45" />
    <text x="98" y="925" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">conditions: Endpoint + EntityManagerFactory</text>
    <text x="98" y="961" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ actuatorEndpoint(emf)</text>
  </g>

  <g class="card" data-card="HibernatePropertiesCustomizer">
    <rect x="530" y="386" width="330" height="168" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <text x="695" y="407" text-anchor="middle" font-size="12.5" fill="#16a34a">&lt;&lt;Spring Boot contract&gt;&gt;</text>
    <text x="695" y="428" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">HibernatePropertiesCustomizer</text>
    <line x1="530" y1="439" x2="860" y2="439" stroke="#16a34a" stroke-width="1.1" opacity="0.55" />
    <line x1="530" y1="493" x2="860" y2="493" stroke="#16a34a" stroke-width="1.1" opacity="0.45" />
    <text x="546" y="462" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">sets region.factory_class</text>
<text x="546" y="480" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">enables second-level cache</text>
    <text x="546" y="516" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">maps Redis, local cache, TTL, metrics flags</text>
  </g>

  <g class="card" data-card="LettuceNearCache MetricsBinder">
    <rect x="530" y="600" width="330" height="174" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8" />
    <text x="695" y="621" text-anchor="middle" font-size="12.5" fill="#475569">&lt;&lt;SmartInitializingSingleton&gt;&gt;</text>
    <text x="695" y="642" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCache</text>
<text x="695" y="662" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">MetricsBinder</text>
    <line x1="530" y1="674" x2="860" y2="674" stroke="#475569" stroke-width="1.1" opacity="0.55" />
    <line x1="530" y1="710" x2="860" y2="710" stroke="#475569" stroke-width="1.1" opacity="0.45" />
    <text x="546" y="697" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">EntityManagerFactory + MeterRegistry</text>
    <text x="546" y="733" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ afterSingletonsInstantiated()</text>
<text x="546" y="751" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ registers aggregate gauges</text>
  </g>

  <g class="card" data-card="LettuceNearCache ActuatorEndpoint">
    <rect x="530" y="806" width="330" height="184" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" />
    <text x="695" y="827" text-anchor="middle" font-size="12.5" fill="#ea580c">&lt;&lt;Endpoint id=nearcache&gt;&gt;</text>
    <text x="695" y="848" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCache</text>
<text x="695" y="868" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ActuatorEndpoint</text>
    <line x1="530" y1="880" x2="860" y2="880" stroke="#ea580c" stroke-width="1.1" opacity="0.55" />
    <line x1="530" y1="916" x2="860" y2="916" stroke="#ea580c" stroke-width="1.1" opacity="0.45" />
    <text x="546" y="903" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">EntityManagerFactory</text>
    <text x="546" y="939" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ getAllRegionStats()</text>
<text x="546" y="957" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ getRegionStats(regionName)</text>
  </g>

  <g class="card" data-card="LettuceNearCache RegionFactory">
    <rect x="1048" y="214" width="370" height="154" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8" />
    <image data-bluetape4k-icon="redis/redis-icon.svg" x="1064" y="292" width="40" height="40" href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
    <text x="1238" y="235" text-anchor="middle" font-size="12.5" fill="#16a34a">&lt;&lt;Hibernate RegionFactory&gt;&gt;</text>
    <text x="1238" y="256" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">LettuceNearCache</text>
<text x="1238" y="276" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">RegionFactory</text>
    <line x1="1048" y1="288" x2="1418" y2="288" stroke="#16a34a" stroke-width="1.1" opacity="0.55" />
    <line x1="1048" y1="342" x2="1418" y2="342" stroke="#16a34a" stroke-width="1.1" opacity="0.45" />
    <text x="1120" y="311" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">owns region cache map</text>
<text x="1120" y="329" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">L1 Caffeine + L2 Redis</text>
    <text x="1064" y="365" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">+ getCaches()</text>
  </g>

  <g class="card" data-card="Hibernate Runtime Contracts">
    <rect x="1048" y="500" width="330" height="150" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" />
    <text x="1213" y="521" text-anchor="middle" font-size="12.5" fill="#2563eb">&lt;&lt;external contracts&gt;&gt;</text>
    <text x="1213" y="542" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Hibernate Runtime Contracts</text>
    <line x1="1048" y1="553" x2="1378" y2="553" stroke="#2563eb" stroke-width="1.1" opacity="0.55" />
    <line x1="1048" y1="607" x2="1378" y2="607" stroke="#2563eb" stroke-width="1.1" opacity="0.45" />
    <text x="1064" y="576" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">EntityManagerFactory</text>
<text x="1064" y="594" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">SessionFactoryImplementor</text>
    <text x="1064" y="630" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">unwrap session factory</text>
<text x="1064" y="648" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">read RegionFactory and Statistics</text>
  </g>

  <g class="card" data-card="Observability Outputs">
    <rect x="1048" y="778" width="330" height="172" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8" />
    <text x="1213" y="799" text-anchor="middle" font-size="12.5" fill="#7c3aed">&lt;&lt;Actuator + Micrometer&gt;&gt;</text>
    <text x="1213" y="820" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Observability Outputs</text>
    <line x1="1048" y1="831" x2="1378" y2="831" stroke="#7c3aed" stroke-width="1.1" opacity="0.55" />
    <line x1="1048" y1="885" x2="1378" y2="885" stroke="#7c3aed" stroke-width="1.1" opacity="0.45" />
    <text x="1064" y="854" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">RegionStats endpoint model</text>
<text x="1064" y="872" text-anchor="start" font-size="12.8" font-weight="400" fill="#475569">Gauge metrics</text>
    <text x="1064" y="908" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">nearcache reads</text>
<text x="1064" y="926" text-anchor="start" font-size="12.8" font-weight="400" fill="#374151">lettuce.nearcache.* gauges</text>
  </g>

  <g class="legend" transform="translate(74 1040)">
    <line x1="0" y1="0" x2="38" y2="0" stroke="#16a34a" stroke-width="2.8" marker-end="url(#arrow-green)" />
    <text x="52" y="5" font-size="13" fill="#475569">creates or configures</text>
    <line x1="252" y1="0" x2="290" y2="0" stroke="#64748b" stroke-width="2.3" stroke-dasharray="6 5" />

    <polyline points="272,8 290,0 272,-8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important"/>
    <text x="304" y="5" font-size="13" fill="#475569">uses runtime contract</text>
    <line x1="526" y1="0" x2="564" y2="0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)" />
    <text x="578" y="5" font-size="13" fill="#475569">publishes metrics</text>
    <line x1="762" y1="0" x2="800" y2="0" stroke="#ea580c" stroke-width="2.6" marker-end="url(#arrow-orange)" />
    <text x="814" y="5" font-size="13" fill="#475569">exposes endpoint</text>
  </g>
</svg>
