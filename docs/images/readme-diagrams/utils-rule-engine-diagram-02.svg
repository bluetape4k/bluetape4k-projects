<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="933" viewBox="0 0 1792 933" role="img" aria-label="Core Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="inheritArrow" markerWidth="8.5" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8 4 L 1 7 Z" fill="#fff" stroke="context-stroke" stroke-width="1.25"/></marker>
  <marker id="depArrow" markerWidth="8" markerHeight="8" refX="7.4" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7.4 4 L 1 7 Z" fill="context-stroke"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .classCard{filter:url(#shadow);stroke-width:2}.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:12px;fill:#102033}
    .inherit{fill:none;stroke-width:2.55;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
    .dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#depArrow)}
    .detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
  </style>
</defs>
<rect class="canvas" width="1792" height="933"/>
<rect class="frame" x="32" y="28" width="1728" height="877" rx="30"/>
<text class="title" x="68" y="84">Core Class Diagram</text>
<text class="subtitle" x="72" y="116">Source-ranked class model with short colored inheritance and dependency routes.</text>
<path class="dependency" data-from="DefaultRule" data-to="Facts" data-route-color="teal" d="M508 500 L483 500 L483 661 L458 661" stroke="#2E8F89" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DefaultSuspendRule" data-to="Action" data-route-color="amber" d="M1068 530 L1068 631" stroke="#B9851B" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DefaultSuspendRule" data-to="Condition" data-route-color="pink" d="M898 500 L873 500 L873 661 L848 661" stroke="#C94D68" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DefaultRule" data-to="Action" data-route-color="purple" d="M848 500 L873 500 L873 661 L898 661" stroke="#755BC6" stroke-dasharray="8 7"/>
<path class="dependency" data-from="DefaultRule" data-to="Condition" data-route-color="olive" d="M678 530 L678 631" stroke="#718A35" stroke-dasharray="8 7"/>
<path class="inherit" data-from="DefaultSuspendRule" data-to="SuspendRule" data-route-color="purple" d="M1068 398 L1068 297" stroke="#755BC6"/>
<path class="inherit" data-from="DefaultRule" data-to="Rule" data-route-color="olive" d="M678 398 L678 297" stroke="#718A35"/>
<g id="Facts">
  <rect class="classCard" x="118" y="631" width="340" height="132" rx="8" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="stereo" x="288" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="288" y="678" text-anchor="middle">Facts</text>
  <line x1="118" y1="687" x2="458" y2="687" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="136" y="712">-map: ConcurrentHashMap~String,</text>
<text class="member" x="136" y="729">Any?~</text>
<text class="member" x="136" y="746">+get(name): T?</text>
</g>
<g id="Action">
  <rect class="classCard" x="898" y="631" width="340" height="132" rx="8" fill="#EAF7EF" stroke="#58A978"/>
  <text class="stereo" x="1068" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="678" text-anchor="middle">Action</text>
  <line x1="898" y1="687" x2="1238" y2="687" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="916" y="729">+execute(facts: Facts)</text>
</g>
<g id="Condition">
  <rect class="classCard" x="508" y="631" width="340" height="132" rx="8" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="stereo" x="678" y="650" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="678" text-anchor="middle">Condition</text>
  <line x1="508" y1="687" x2="848" y2="687" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="526" y="729">+evaluate(facts: Facts): Boolean</text>
</g>
<g id="Rule">
  <rect class="classCard" x="508" y="165" width="340" height="132" rx="8" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="stereo" x="678" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="212" text-anchor="middle">Rule</text>
  <line x1="508" y1="221" x2="848" y2="221" stroke="#D6A441" stroke-width="1.4"/>
  <text class="member" x="526" y="246">+name: String</text>
<text class="member" x="526" y="263">+priority: Int</text>
<text class="member" x="526" y="280">+evaluate(facts: Facts): Boolean</text>
</g>
<g id="SuspendRule">
  <rect class="classCard" x="898" y="165" width="340" height="132" rx="8" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="stereo" x="1068" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="212" text-anchor="middle">SuspendRule</text>
  <line x1="898" y1="221" x2="1238" y2="221" stroke="#DC6B82" stroke-width="1.4"/>
  <text class="member" x="916" y="246">+name: String</text>
<text class="member" x="916" y="263">+priority: Int</text>
<text class="member" x="916" y="280">+evaluate(facts: Facts): Boolean</text>
</g>
<g id="RuleSet">
  <rect class="classCard" x="1334" y="165" width="340" height="132" rx="8" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="stereo" x="1504" y="184" text-anchor="middle">class</text>
  <text class="classTitle" x="1504" y="212" text-anchor="middle">RuleSet</text>
  <line x1="1334" y1="221" x2="1674" y2="221" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="1352" y="246">-rules: TreeSet~Rule~</text>
<text class="member" x="1352" y="263">+add(rule: Rule)</text>
<text class="member" x="1352" y="280">+iterator(): Iterator~Rule~</text>
</g>
<g id="DefaultRule">
  <rect class="classCard" x="508" y="398" width="340" height="132" rx="8" fill="#EEF6D9" stroke="#8BA84D"/>
  <text class="stereo" x="678" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="678" y="445" text-anchor="middle">DefaultRule</text>
  <line x1="508" y1="454" x2="848" y2="454" stroke="#8BA84D" stroke-width="1.4"/>
  <text class="member" x="526" y="479">-condition: Condition</text>
<text class="member" x="526" y="496">-actions: List~Action~</text>
<text class="member" x="526" y="513">+evaluate(facts: Facts): Boolean</text>
</g>
<g id="DefaultSuspendRule">
  <rect class="classCard" x="898" y="398" width="340" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1068" y="417" text-anchor="middle">class</text>
  <text class="classTitle" x="1068" y="445" text-anchor="middle">DefaultSuspendRule</text>
  <line x1="898" y1="454" x2="1238" y2="454" stroke="#9AA8B8" stroke-width="1.4"/>
  <text class="member" x="916" y="479">-condition: SuspendCondition</text>
<text class="member" x="916" y="496">-actions: List~SuspendAction~</text>
<text class="member" x="916" y="513">+evaluate(facts: Facts): Boolean</text>
</g>
<g>
  <rect x="1377" y="825" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1395 843 L1453 843" stroke="#3E9868"/>
  <text class="detail" x="1467" y="848">inheritance / implementation</text>
  <path class="dependency" d="M1395 864 L1453 864" stroke="#758297" stroke-dasharray="8 7"/>
  <text class="detail" x="1467" y="869">dependency / usage</text>
</g>
<g><rect x="180" y="843" width="1152" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="756" y="869" text-anchor="middle">bluetape4k-projects - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
