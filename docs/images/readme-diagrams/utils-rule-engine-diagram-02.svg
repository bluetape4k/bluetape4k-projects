<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1285" viewBox="0 0 1754 1285" role="img" aria-label="Core Class Diagram">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="10" markerHeight="8" refX="8.5" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 8.5 4 L 1 7" fill="none" stroke="#758297" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="11" markerHeight="10" refX="9.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 1 L 9.5 5 L 0.5 9 Z" fill="#ffffff" stroke="#758297" stroke-width="1.7"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}

      /* README_LAYER_BANDS:START */
      .readmeLayerBand{fill-opacity:.42;stroke:#D7E2EC;stroke-width:1.5}
      .readmeLayerLabel{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:18px;fill:#627184;font-weight:400}
      /* README_LAYER_BANDS:END */
    </style>
</defs>
<rect class="canvas" width="1754" height="1285"/>
<rect class="frame" x="32" y="28" width="1690" height="1229" rx="28"/>
<text class="title" x="66" y="82">Core Class Diagram</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
  <!-- README_LAYER_BANDS:START -->
  <g id="readme-layer-bands">
    <g id="readme-layer-1">
      <rect class="readmeLayerBand" x="54" y="148" width="1640" height="281" rx="18" fill="#E8F3FF"/>
      <text class="readmeLayerLabel" x="72" y="176">Contract layer</text>
    </g>
    <g id="readme-layer-2">
      <rect class="readmeLayerBand" x="54" y="491" width="1640" height="260" rx="18" fill="#E9F7F6"/>
      <text class="readmeLayerLabel" x="72" y="519">Abstraction layer</text>
    </g>
    <g id="readme-layer-3">
      <rect class="readmeLayerBand" x="54" y="837" width="1640" height="260" rx="18" fill="#EAF7EF"/>
      <text class="readmeLayerLabel" x="72" y="865">Implementation layer</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->
<path class="dashed" d="M672 869 L672 786 L262 786 L262 397"/>
<path class="dashed" d="M1082 869 L1082 778 L60 778 L60 444 L672 444 L672 313"/>
<path class="dashed" d="M1082 869 L1082 810 L1734 810 L1734 476 L1082 476 L1082 313"/>
<path class="dashed" d="M672 869 L672 802 L30 802 L30 468 L672 468 L672 313"/>
<path class="dashed" d="M672 869 L672 794 L40 794 L40 460 L1082 460 L1082 313"/>
<path class="implLine" d="M1082 869 L1082 786 L672 786 L672 719"/>
<path class="implLine" d="M672 869 L672 778 L1492 778 L1492 376"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="217" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
    <text class="label" x="170" y="49" text-anchor="middle">Facts</text>
  <text class="mono" x="18" y="108">-map: ConcurrentHashMap~String, Any?~</text>
<text class="mono" x="18" y="129">+get(name): T?</text>
<text class="mono" x="18" y="150">+set(name, value)</text>
<text class="mono" x="18" y="171">+contains(name): Boolean</text>
<text class="mono" x="18" y="192">+of(vararg pairs)$</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«funinterface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Action</text>
  <text class="mono" x="18" y="108">+execute(facts: Facts)</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="133" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«funinterface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Condition</text>
  <text class="mono" x="18" y="108">+evaluate(facts: Facts): Boolean</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">Rule</text>
  <text class="mono" x="18" y="108">+name: String</text>
<text class="mono" x="18" y="129">+priority: Int</text>
<text class="mono" x="18" y="150">+evaluate(facts: Facts): Boolean</text>
<text class="mono" x="18" y="171">+execute(facts: Facts)</text>
</g>
<g transform="translate(502,523)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="61" text-anchor="middle">SuspendRule</text>
  <text class="mono" x="18" y="108">+name: String</text>
<text class="mono" x="18" y="129">+priority: Int</text>
<text class="mono" x="18" y="150">+evaluate(facts: Facts): Boolean</text>
<text class="mono" x="18" y="171">+execute(facts: Facts)</text>
</g>
<g transform="translate(912,523)">
  <rect class="card" x="0" y="0" width="340" height="175" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
    <text class="label" x="170" y="49" text-anchor="middle">RuleSet</text>
  <text class="mono" x="18" y="108">-rules: TreeSet~Rule~</text>
<text class="mono" x="18" y="129">+add(rule: Rule)</text>
<text class="mono" x="18" y="150">+iterator(): Iterator~Rule~</text>
</g>
<g transform="translate(502,869)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#F7F1E7" stroke="#B88A44"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#B88A44"/>
    <text class="label" x="170" y="49" text-anchor="middle">DefaultRule</text>
  <text class="mono" x="18" y="108">-condition: Condition</text>
<text class="mono" x="18" y="129">-actions: List~Action~</text>
<text class="mono" x="18" y="150">+evaluate(facts: Facts): Boolean</text>
<text class="mono" x="18" y="171">+execute(facts: Facts)</text>
</g>
<g transform="translate(912,869)">
  <rect class="card" x="0" y="0" width="340" height="196" rx="5" fill="#EEF6D9" stroke="#8BA84D"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8BA84D"/>
    <text class="label" x="170" y="49" text-anchor="middle">DefaultSuspendRule</text>
  <text class="mono" x="18" y="108">-condition: SuspendCondition</text>
<text class="mono" x="18" y="129">-actions: List~SuspendAction~</text>
<text class="mono" x="18" y="150">+evaluate(facts: Facts): Boolean</text>
<text class="mono" x="18" y="171">+execute(facts: Facts)</text>
</g>
</svg>
