<text class="title" x="72" y="84">JDBC Extension API Overview</text>
<text class="subtitle" x="76" y="116">A caller path from SQL and JDBC receivers to prepared execution, row mapping, and update counts.</text>
<g><rect class="layer" x="70" y="165" width="430" height="620" rx="10"/><rect class="layerBadge" x="98" y="189" width="268" height="36" rx="8"/><text class="layerTitle" x="118" y="215">Caller contract</text><text class="layerNote" x="98" y="260">SQL intent and receiver decide which helper path runs.</text></g><g><rect class="layer" x="555" y="165" width="560" height="620" rx="10"/><rect class="layerBadge" x="583" y="189" width="282" height="36" rx="8"/><text class="layerTitle" x="603" y="215">JDBC helper path</text><text class="layerNote" x="583" y="260">Extensions keep resource scope, binding, batch, and transaction code short.</text></g><g><rect class="layer" x="1170" y="165" width="440" height="620" rx="10"/><rect class="layerBadge" x="1198" y="189" width="254" height="36" rx="8"/><text class="layerTitle" x="1218" y="215">Returned value</text><text class="layerNote" x="1198" y="260">Queries map rows; updates and batches return affected counts.</text></g>
