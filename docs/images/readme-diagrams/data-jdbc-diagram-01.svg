<svg data-intent="Explain JDBC extension APIs by showing caller SQL, DataSource/Connection helpers, statement/batch execution, ResultSet typed access, and domain mapping boundaries." data-evidence="data/jdbc/README.md; data/jdbc/src/main/kotlin/io/bluetape4k/jdbc" data-source-read="data/jdbc/README.md; data/jdbc/src/main/kotlin/io/bluetape4k/jdbc" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="JDBC Extension API Overview">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="8"/>
<text class="title" x="72" y="84">JDBC Extension API Overview</text>
<text class="subtitle" x="76" y="116">The module helps callers move from SQL and JDBC resources to typed rows, batch execution, and domain mapping.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Caller boundary</text></g>
<g id="sql">
  <rect class="card" x="146" y="256" width="300" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="296" y="291" text-anchor="middle" dominant-baseline="middle">SQL + parameters</text>
  <text class="detail" x="296" y="321" text-anchor="middle" dominant-baseline="middle">query/update intent</text>
</g>
<g id="ds">
  <rect class="card" x="1024" y="256" width="330" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="1189" y="291" text-anchor="middle" dominant-baseline="middle">DataSource / Connection</text>
  <text class="detail" x="1189" y="321" text-anchor="middle" dominant-baseline="middle">resource receiver</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">JDBC helper layer</text></g>
<g id="tx">
  <rect class="card" x="146" y="574" width="310" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="301" y="609" text-anchor="middle" dominant-baseline="middle">Transaction helpers</text>
  <text class="detail" x="301" y="639" text-anchor="middle" dominant-baseline="middle">commit/rollback boundary</text>
</g>
<g id="stmt">
  <rect class="card" x="610" y="574" width="300" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="760" y="609" text-anchor="middle" dominant-baseline="middle">Statement helpers</text>
  <text class="detail" x="760" y="639" text-anchor="middle" dominant-baseline="middle">prepare, bind, execute</text>
</g>
<g id="batch">
  <rect class="card" x="1064" y="574" width="290" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1209" y="609" text-anchor="middle" dominant-baseline="middle">Batch helpers</text>
  <text class="detail" x="1209" y="639" text-anchor="middle" dominant-baseline="middle">batch update path</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Result boundary</text></g>
<g id="rs">
  <rect class="card" x="146" y="892" width="330" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="311" y="927" text-anchor="middle" dominant-baseline="middle">ResultSet typed access</text>
  <text class="detail" x="311" y="957" text-anchor="middle" dominant-baseline="middle">getAs, nullable reads</text>
</g>
<g id="domain">
  <rect class="card" x="635" y="892" width="290" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="780" y="927" text-anchor="middle" dominant-baseline="middle">Domain mapper</text>
  <text class="detail" x="780" y="957" text-anchor="middle" dominant-baseline="middle">row -&gt; model</text>
</g>
<g id="result">
  <rect class="card" x="1084" y="892" width="270" height="84" rx="8" fill="#F9FAFB" stroke="#6B7280"/>
  <text class="cardTitle" x="1219" y="927" text-anchor="middle" dominant-baseline="middle">Update counts</text>
  <text class="detail" x="1219" y="957" text-anchor="middle" dominant-baseline="middle">affected rows</text>
</g>
<path class="route" data-from="sql" data-to="stmt" d="M368 340 L368 435 L700 435 L700 574" stroke="#1D4ED8"/>
<path class="route" data-from="ds" data-to="stmt" d="M1189 340 L1189 446 L820 446 L820 574" stroke="#15803D"/>
<path class="route" data-from="stmt" data-to="rs" d="M760 658 L760 775 L383 775 L383 892" stroke="#0F766E"/>
<path class="route" data-from="stmt" data-to="batch" d="M910 616 L1064 616" stroke="#C2410C"/>
<path class="route" data-from="batch" data-to="result" d="M1214 658 L1214 892" stroke="#C2410C"/>
<path class="route dashed" data-from="tx" data-to="stmt" d="M456 616 L610 616" stroke="#7E22CE"/>
<path class="route" data-from="rs" data-to="domain" d="M476 934 L635 934" stroke="#BE185D"/>
</svg>
