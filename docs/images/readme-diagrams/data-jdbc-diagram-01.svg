ion APIs</text></g><g><rect class="card" x="625" y="280" width="420" height="112" rx="8" fill="#FAF5FF" stroke="#9333EA"/><text class="cardTitle" x="835" y="322" text-anchor="middle">Transaction scope</text><g><text class="code" x="776.375" y="356"><tspan class="syntax-token" fill="#0F172A">autoCommit</tspan></text><text class="code" x="845.875" y="356"><tspan class="syntax-token" fill="#0F172A"> </tspan></text><text class="code" x="849.675" y="356"><tspan class="syntax-token" fill="#64748B">=</tspan></text><text class="code" x="855.0749999999999" y="356"><tspan class="syntax-token" fill="#0F172A"> </tspan></text><text class="code" x="858.8749999999999" y="356"><tspan class="syntax-token" fill="#C2410C">false</tspan></text></g><text class="detail" x="835" y="379" text-anchor="middle">commit or rollback + restore</text></g><g><rect class="card" x="625" y="455" width="420" height="122" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="cardTitle" x="835" y="497" text-anchor="middle">Prepared execution</text><g><text class="code" x="763.575" y="531"><tspan class="syntax-token" fill="#2563EB">prepareStatement</tspan></text><text class="code" x="874.7750000000001" y="531"><tspan class="syntax-token" fill="#64748B">(</tspan></text><text class="code" x="880.1750000000001" y="531"><tspan class="syntax-token" fill="#0F172A">sql</tspan></text><text class="code" x="901.0250000000001" y="531"><tspan class="syntax-token" fill="#64748B">)</tspan></text></g><text class="detail" x="835" y="554" text-anchor="middle">bind params, execute query/update</text></g><g><rect class="card" x="625" y="640" width="420" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="cardTitle" x="835" y="682" text-anchor="middle">Batch helpers</text><g><text class="code" x="801.8" y="716"><tspan class="syntax-token" fill="#2563EB">addBatch</tspan></text><text class="code" x="857.4" y="716"><tspan class="syntax-token" fill="#64748B">()</tspan></text></g><g><text class="code" x="769.425" y="7