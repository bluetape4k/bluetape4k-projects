<text class="title" x="72" y="84">JDBC Extension API Overview</text>
<text class="subtitle" x="76" y="116">A caller path from SQL and JDBC receivers to prepared execution, row mapping, and update counts.</text>
<g><rect class="layer" x="70" y="165" width="430" height="620" rx="10" fill="#DBEAFE" stroke="#93C5FD" fill-opacity="1"/><rect class="layerBadge" x="98" y="189" width="268" height="36" rx="8"/><text class="layerTitle" x="118" y="215">Caller contract</text><text class="layerNote" x="98" y="260">SQL intent and receiver decide which helper path runs.</text></g><g><rect class="layer" x="555" y="165" width="560" height="620" rx="10" fill="#EDE9FE" stroke="#C4B5FD" fill-opacity="1"/><rect class="layerBadge" x="583" y="189" width="282" height="36" rx="8"/><text class="layerTitle" x="603" y="215">JDBC helper path</text><text class="layerNote" x="583" y="260">Extensions keep resource scope, binding, batch, and transaction code short.</text></g><g><rect class="layer" x="1170" y="165" width="440" height="620" rx="10" fill="#DCFCE7" stroke="#86EFAC" fill-opacity="1"/><rect class="layerBadge" x="1198" y="189" width="254" height="36" rx="8"/><text class="layerTitle" x="1218" y="215">Returned value</text><text class="layerNote" x="1198" y="260">Queries map rows; updates and batches return affected counts.</text></g>
<g><path class="edge" d="M 445 356 L 521 356 Q 535 356 535 370 L 535 502 Q 535 516 549 516 L 625 516" stroke="#2563EB" marker-end="url(#arrow-2563EB)"/><path class="edge" d="M 445 591 L 521 591 Q 535 591 535 577 L 535 530 Q 535 516 549 516 L 625 516" stroke="#16A34A" marker-end="url(#arrow-16A34A)"/><path class="edge dashed" d="M835 392 L835 455" stroke="#9333EA"/>
<polygon points="829,443 835,455 841,443" fill="#9333EA" stroke="#9333EA" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/><path class="edge" d="M 1045 516 L 1126 516 Q 1140 516 1140 502 L 1140 370 Q 1140 356 1154 356 L 1225 356" stroke="#0D9488" marker-end="url(#arrow-0D9488)"/><path class="edge" d="M1390 412 L1390 480" stroke="#DB2777" marker-end="url(#arrow-DB2777)"/><path class="edge" d="M1045 696 L1225 696" stroke="#EA580C" marker-end="url(#arrow-EA580C)"/></g>
<g><g transform="translate(494 323)"><rect width="82" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="41" y="18" text-anchor="middle">SQL</text></g><g transform="translate(493 596)"><rect width="86" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="43" y="18" text-anchor="middle">receiver</text></g><g transform="translate(744 411)"><rect width="182" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="91" y="18" text-anchor="middle">transaction boundary</text></g><g transform="translate(1079 482)"><rect width="118" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="59" y="18" text-anchor="middle">query result</text></g><g transform="translate(1339 431)"><rect width="102" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="51" y="18" text-anchor="middle">typed rows</text></g><g transform="translate(1079 662)"><rect width="118" height="27" rx="8" fill="#fff" stroke="#CBD5E1" opacity=".96"/><text class="edgeLabel" x="59" y="18" text-anchor="middle">batch/update</text></g></g>
<g><rect class="card" x="125" y="300" width="320" height="112" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="cardTitle" x="285" y="342" text-anchor="middle">SQL + parameters</text><text class="detail" x="285" y="376" text-anchor="middle">query/update text</text><g><text class="code" x="224.47500000000002" y="399" fill="#0F172A">params</text><text class="code" x="266.175" y="399" fill="#0F172A"> </text><text class="code" x="269.975" y="399" fill="#64748B">|</text><text class="code" x="275.375" y="399" fill="#0F172A"> </text><text class="code" x="279.175" y="399" fill="#0F172A">batch</text><text class="code" x="313.925" y="399" fill="#0F172A"> </text><text class="code" x="317.725" y="399" fill="#0F172A">rows</text></g></g><g><rect class="card" x="125" y="535" width="320" height="112" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="cardTitle" x="285" y="577" text-anchor="middle">DataSource / Connection</text><g><text class="code" x="221.775" y="611" fill="#0F172A">withConnect</text><text class="code" x="298.225" y="611" fill="#0F172A"> </text><text class="code" x="302.02500000000003" y="611" fill="#64748B">{</text><text class="code" x="307.425" y="611" fill="#0F172A"> </text><text class="code" x="311.225" y="611" fill="#0F172A">conn</text><text class="code" x="339.02500000000003" y="611" fill="#0F172A"> </text><text class="code" x="342.82500000000005" y="611" fill="#64748B">}</text></g><text class="detail" x="285" y="634" text-anchor="middle">delegates to Connection APIs</text></g><g><rect class="card" x="625" y="280" width="420" height="112" rx="8" fill="#FAF5FF" stroke="#9333EA"/><text class="cardTitle" x="835" y="322" text-anchor="middle">Transaction scope</text><g><text class="code" x="776.375" y="356" fill="#0F172A">autoCommit</text><text class="code" x="845.875" y="356" fill="#0F172A"> </text><text class="code" x="849.675" y="356" fill="#64748B">=</text><text class="code" x="855.0749999999999" y="356" fill="#0F172A"> </text><text class="code" x="858.8749999999999" y="356" fill="#C2410C">false</text></g><text class="detail" x="835" y="379" text-anchor="middle">commit or rollback + restore</text></g><g><rect class="card" x="625" y="455" width="420" height="122" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="cardTitle" x="835" y="497" text-anchor="middle">Prepared execution</text><g><text class="code" x="763.575" y="531" fill="#2563EB">prepareStatement</text><text class="code" x="874.7750000000001" y="531" fill="#64748B">(</text><text class="code" x="880.1750000000001" y="531" fill="#0F172A">sql</text><text class="code" x="901.0250000000001" y="531" fill="#64748B">)</text></g><text class="detail" x="835" y="554" text-anchor="middle">bind params, execute query/update</text></g><g><rect class="card" x="625" y="640" width="420" height="112" rx="8" fill="#FFF7ED" stroke="#EA580C"/><text class="cardTitle" x="835" y="682" text-anchor="middle">Batch helpers</text><g><text class="code" x="801.8" y="716" fill="#2563EB">addBatch</text><text class="code" x="857.4" y="716" fill="#64748B">()</text></g><g><text class="code" x="769.425" y="739" fill="#7C3AED">IntArray</text><text class="code" x="825.025" y="739" fill="#0F172A"> </text><text class="code" x="828.8249999999999" y="739" fill="#64748B">|</text><text class="code" x="834.2249999999999" y="739" fill="#0F172A"> </text><text class="code" x="838.0249999999999" y="739" fill="#7C3AED">LongArray</text></g></g><g><rect class="card" x="1225" y="300" width="330" height="112" rx="8" fill="#FDF2F8" stroke="#DB2777"/><text class="cardTitle" x="1390" y="342" text-anchor="middle">ResultSet access</text><g><text class="code" x="1342.9" y="376" fill="#2563EB">getXxxOrNull</text><text class="code" x="1426.3000000000002" y="376" fill="#64748B">()</text></g><text class="detail" x="1390" y="399" text-anchor="middle">label/index operators</text></g><g><rect class="card" x="1225" y="480" width="330" height="112" rx="8" fill="#F7FEE7" stroke="#65A30D"/><text class="cardTitle" x="1390" y="522" text-anchor="middle">Row mapping</text><g><text class="code" x="1324.425" y="556" fill="#0F172A">mapFirst</text><text class="code" x="1380.0249999999999" y="556" fill="#0F172A"> </text><text class="code" x="1383.8249999999998" y="556" fill="#64748B">/</text><text class="code" x="1389.225" y="556" fill="#0F172A"> </text><text class="code" x="1393.0249999999999" y="556" fill="#0F172A">mapSingle</text></g><g><text class="code" x="1310.975" y="579" fill="#0F172A">toList</text><text class="code" x="1352.675" y="579" fill="#0F172A"> </text><text class="code" x="1356.475" y="579" fill="#64748B">/</text><text class="code" x="1361.875" y="579" fill="#0F172A"> </text><text class="code" x="1365.675" y="579" fill="#0F172A">toMap</text><text class="code" x="1400.425" y="579" fill="#0F172A"> </text><text class="code" x="1404.225" y="579" fill="#64748B">/</text><text class="code" x="1409.625" y="579" fill="#0F172A"> </text><text class="code" x="1413.425" y="579" fill="#0F172A">sequence</text></g></g><g><rect class="card" x="1225" y="640" width="330" height="112" rx="8" fill="#F9FAFB" stroke="#64748B"/><text class="cardTitle" x="1390" y="682" text-anchor="middle">Update counts</text><text class="detail" x="1390" y="716" text-anchor="middle">affected rows</text><text class="detail" x="1390" y="739" text-anchor="middle">generated keys optional</text></g>
</svg>