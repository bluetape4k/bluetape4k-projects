<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="892" viewBox="0 0 1500 892" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k Coroutines architecture</title>
  <desc id="desc">Layered module overview for bluetape4k-coroutines showing DeferredValue, deferred helpers, flow extensions, AsyncFlow, coroutine scopes, Reactor context, and test support.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L7 4 L1 7 Z" fill="context-stroke"/>
    </marker>
    <style>
      .canvas{fill:#F7FAFC}
      .frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}
      .title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:46px;fill:#22344A;font-weight:400}
      .subtitle{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:18px;fill:#536476;font-weight:400}
      .layer{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}
      .layer-title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:26px;fill:#22344A;font-weight:400}
      .card-title{font-family:"Architects Daughter","Comic Mono","Comic Sans MS","Comic Sans",cursive;font-size:23px;fill:#22344A;font-weight:400}
      .detail{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:14px;fill:#42556B;font-weight:400}
      .small{font-family:"Comic Mono","Comic Sans MS","Comic Sans",monospace;font-size:13px;fill:#627184;font-weight:400}
      .card{filter:url(#shadow);stroke-width:2}
      .connector{fill:none;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}
      .pill{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1500" height="892"/>
  <rect class="frame" x="34" y="30" width="1432" height="832" rx="28"/>
  <text class="title" x="72" y="88">Bluetape4k Coroutines architecture</text>
  <text class="subtitle" x="76" y="121">Coroutine helpers grouped by deferred primitives, Flow operators, execution scopes, and context bridges.</text>

  <!-- README_LAYER_BANDS:START -->
  <g id="layer-module-entrypoint">
    <rect class="layer" x="72" y="166" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="104" y="209">Module entrypoint</text>
    <g id="node-coroutines" transform="translate(578,190)">
      <rect class="card" x="0" y="0" width="500" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
      <text class="card-title" x="250" y="31" text-anchor="middle">bluetape4k-coroutines</text>
      <text class="detail" x="250" y="55" text-anchor="middle">coroutine-first extension set</text>
      <text class="detail" x="250" y="73" text-anchor="middle">structured async helpers</text>
    </g>
  </g>
  <g id="layer-async-primitives">
    <rect class="layer" x="72" y="328" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="104" y="371">Async primitives</text>
    <g id="node-deferred-value" transform="translate(346,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">DeferredValue</text>
      <text class="detail" x="150" y="55" text-anchor="middle">eager async wrapper</text>
      <text class="detail" x="150" y="73" text-anchor="middle">map, flatMap, await</text>
    </g>
    <g id="node-deferred-helpers" transform="translate(1098,352)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Deferred helpers</text>
      <text class="detail" x="150" y="55" text-anchor="middle">zip, awaitAny</text>
      <text class="detail" x="150" y="73" text-anchor="middle">cancel losing jobs</text>
    </g>
  </g>
  <g id="layer-flow-processing">
    <rect class="layer" x="72" y="490" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="104" y="533">Flow processing</text>
    <g id="node-flow-ext" transform="translate(346,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Flow extensions</text>
      <text class="detail" x="150" y="55" text-anchor="middle">chunked, windowed, sliding</text>
      <text class="detail" x="150" y="73" text-anchor="middle">mapParallel and replay</text>
    </g>
    <g id="node-async-flow" transform="translate(722,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">AsyncFlow</text>
      <text class="detail" x="150" y="55" text-anchor="middle">order-preserving transform</text>
      <text class="detail" x="150" y="73" text-anchor="middle">bounded concurrency</text>
    </g>
    <g id="node-subject" transform="translate(1098,514)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Subject APIs</text>
      <text class="detail" x="150" y="55" text-anchor="middle">publish, replay, multicast</text>
      <text class="detail" x="150" y="73" text-anchor="middle">resumable collectors</text>
    </g>
  </g>
  <g id="layer-runtime-integration">
    <rect class="layer" x="72" y="652" width="1356" height="134" rx="18"/>
    <text class="layer-title" x="104" y="695">Runtime integration</text>
    <g id="node-scopes" transform="translate(346,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Coroutine scopes</text>
      <text class="detail" x="150" y="55" text-anchor="middle">Default, IO, ThreadPool</text>
      <text class="detail" x="150" y="73" text-anchor="middle">virtual-thread scope</text>
    </g>
    <g id="node-reactor" transform="translate(722,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Reactor context bridge</text>
      <text class="detail" x="150" y="55" text-anchor="middle">current ReactiveContext</text>
      <text class="detail" x="150" y="73" text-anchor="middle">coroutine context support</text>
    </g>
    <g id="node-tests" transform="translate(1098,676)">
      <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EEF6D9" stroke="#8BA84D"/>
      <text class="card-title" x="150" y="31" text-anchor="middle">Test support</text>
      <text class="detail" x="150" y="55" text-anchor="middle">Flow assertions</text>
      <text class="detail" x="150" y="73" text-anchor="middle">runTest helpers</text>
    </g>
  </g>
  <!-- README_LAYER_BANDS:END -->

  <g id="route-coroutines-deferred-value">
    <path class="connector" d="M828 276 L828 304 L496 304 L496 352" stroke="#58A978"/>
  </g>
  <g id="route-coroutines-deferred-helpers">
    <path class="connector" d="M828 276 L828 314 L1248 314 L1248 352" stroke="#45A7A1"/>
  </g>
  <g id="route-deferred-value-flow-ext">
    <path class="connector" d="M496 438 L496 486 L496 486 L496 514" stroke="#D9AA4D"/>
  </g>
  <g id="route-deferred-helpers-async-flow">
    <path class="connector" d="M1248 438 L1248 466 L872 466 L872 514" stroke="#DB7890"/>
  </g>
  <g id="route-flow-ext-subject">
    <path class="connector" d="M646 557 L664 557 L664 608 L1080 608 L1080 557 L1098 557" stroke="#8A72D6"/>
  </g>
  <g id="route-async-flow-scopes">
    <path class="connector" d="M872 600 L872 648 L496 648 L496 676" stroke="#45A7A1"/>
  </g>
  <g id="route-subject-reactor">
    <path class="connector" d="M1248 600 L1248 628 L872 628 L872 676" stroke="#8A72D6"/>
  </g>
  <g id="route-flow-ext-tests">
    <path class="connector" d="M496 600 L496 638 L1248 638 L1248 676" stroke="#8BA84D"/>
  </g>

  <g transform="translate(76,816)">
    <rect class="pill" x="0" y="0" width="1348" height="42" rx="10"/>
    <text class="small" x="674" y="17" text-anchor="middle">Graphviz evidence: bluetape4k-coroutines-diagram-01.dot, .plain, -sketch.svg, and -sketch.png.</text>
    <text class="small" x="674" y="33" text-anchor="middle">Geometry gate: nodes=9, routes=8, segments=26, badEndpointAngle=0, badBends=0, interiorCrossings=0, marginImbalance=0, titleGap=69.</text>
  </g>
</svg>
