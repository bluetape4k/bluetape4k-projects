</g>
<g transform="translate(716,336)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">CoroutineScope Impls</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">Default / IO ThreadPool</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">/ VirtualThread</text>
</g>
<g transform="translate(382,502)">
  <rect class="card" x="0" y="0" width="280" height="100" rx="14" fill="#F7F1E7" stroke="#B88A44"/>
  <text class="smallLabel" x="140" y="21" text-anchor="middle">Reactor Context Helpers</text>
<text class="smallLabel" x="140" y="47" text-anchor="middle">currentReactiveContext</text>
<text class="smallLabel" x="140" y="73" text-anchor="middle">Context.getOrNull</text>
