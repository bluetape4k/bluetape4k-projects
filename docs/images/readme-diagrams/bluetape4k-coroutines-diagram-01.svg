  <rect class="card" x="610" y="574" width="300" height="84" rx="14" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="760" y="609" text-anchor="middle" dominant-baseline="middle">AsyncFlow</text>
