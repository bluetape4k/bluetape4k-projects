<svg data-intent="Explain bluetape4k-coroutines by grouping async primitives, Flow operators, scope/runtime helpers, Reactor bridges, and test support around coroutine-first APIs." data-evidence="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines" data-source-read="bluetape4k/coroutines/README.md; bluetape4k/coroutines/src/main/kotlin/io/bluetape4k/coroutines" xmlns="http://www.w3.org/2000/svg" width="1500" height="1158" viewBox="0 0 1500 1158" role="img" aria-label="Bluetape4k Coroutines architecture">
