<rect class="canvas" width="1500" height="1158"/>
<rect class="frame" x="34" y="30" width="1432" height="1098" rx="32"/>
<text class="title" x="72" y="84">Bluetape4k Coroutines architecture</text>
<text class="subtitle" x="76" y="116">Coroutine helpers are grouped by async primitives, Flow processing, runtime scope, and integration bridges.</text>
