<rect class="canvas" width="1500" height="1114"/>
<rect class="frame" x="34" y="30" width="1432" height="1054" rx="8"/>
<text class="title" x="72" y="84">Bluetape4k Coroutines architecture</text>
<text class="subtitle" x="76" y="116">Coroutine helpers are grouped by async primitives, Flow processing, runtime scope, and integration bridges.</text>
<g><rect class="panel" x="82" y="160" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Async primitives</text></g>
<g id="deferredValue">
  <rect class="card" x="146" y="256" width="300" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="296" y="291" text-anchor="middle" dominant-baseline="middle">DeferredValue</text>
  <text class="detail" x="296" y="321" text-anchor="middle" dominant-baseline="middle">map, flatMap, await</text>
</g>
<g id="deferredOps">
  <rect class="card" x="1034" y="256" width="320" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="1194" y="291" text-anchor="middle" dominant-baseline="middle">Deferred helpers</text>
  <text class="detail" x="1194" y="321" text-anchor="middle" dominant-baseline="middle">zip, awaitAny, cancellation</text>
</g>
<g><rect class="panel" x="82" y="478" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="514" dominant-baseline="middle">Flow processing</text></g>
<g id="flowExt">
  <rect class="card" x="146" y="574" width="330" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="311" y="609" text-anchor="middle" dominant-baseline="middle">Flow extensions</text>
  <text class="detail" x="311" y="639" text-anchor="middle" dominant-baseline="middle">chunked, windowed, mapParallel</text>
</g>
<g id="asyncFlow">
  <rect class="card" x="610" y="574" width="300" height="84" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="760" y="609" text-anchor="middle" dominant-baseline="middle">AsyncFlow</text>
  <text class="detail" x="760" y="639" text-anchor="middle" dominant-baseline="middle">bounded parallel transform</text>
</g>
<g id="subjects">
  <rect class="card" x="1044" y="574" width="310" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1199" y="609" text-anchor="middle" dominant-baseline="middle">Subject APIs</text>
  <text class="detail" x="1199" y="639" text-anchor="middle" dominant-baseline="middle">publish, replay, multicast</text>
</g>
<g><rect class="panel" x="82" y="796" width="1336" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Runtime integration</text></g>
<g id="scopes">
  <rect class="card" x="146" y="892" width="330" height="84" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="311" y="927" text-anchor="middle" dominant-baseline="middle">Coroutine scopes</text>
  <text class="detail" x="311" y="957" text-anchor="middle" dominant-baseline="middle">Default, IO, ThreadPool, VT</text>
</g>
<g id="reactor">
  <rect class="card" x="585" y="892" width="330" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="750" y="927" text-anchor="middle" dominant-baseline="middle">Reactor context bridge</text>
  <text class="detail" x="750" y="957" text-anchor="middle" dominant-baseline="middle">ReactiveContext support</text>
</g>
<g id="tests">
  <rect class="card" x="1024" y="892" width="330" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1189" y="927" text-anchor="middle" dominant-baseline="middle">Test support</text>
  <text class="detail" x="1189" y="957" text-anchor="middle" dominant-baseline="middle">Flow assertions, runTest helpers</text>
</g>
<path class="route" data-from="deferredValue" data-to="flowExt" d="M376 340 L376 574" stroke="#15803D" marker-end="url(#arrow-green)"/>
<path class="route" data-from="deferredOps" data-to="subjects" d="M1197 340 L1197 574" stroke="#0F766E" marker-end="url(#arrow-teal)"/>
<path class="route" data-from="asyncFlow" data-to="reactor" d="M755 658 L755 892" stroke="#BE185D" marker-end="url(#arrow-pink)"/>
<path class="route" data-from="subjects" data-to="tests" d="M1194 658 L1194 892" stroke="#7E22CE" marker-end="url(#arrow-purple)"/>
