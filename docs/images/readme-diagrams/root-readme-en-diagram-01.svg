  <text class="detail" x="311" y="639" text-anchor="middle" dominant-baseline="middle">serialization, codecs, HTTP clients</text>
</g>
<g id="data">
  <rect class="card" x="518" y="574" width="300" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="668" y="609" text-anchor="middle" dominant-baseline="middle">data/*</text>
  <text class="detail" x="668" y="639" text-anchor="middle" dominant-baseline="middle">database adapters</text>
</g>
<g id="infra">
  <rect class="card" x="860" y="574" width="330" height="84" rx="8" fill="#F7FEE7" stroke="#65A30D"/>
  <text class="cardTitle" x="1025" y="609" text-anchor="middle" dominant-baseline="middle">infra/*</text>
  <text class="detail" x="1025" y="639" text-anchor="middle" dominant-baseline="middle">messaging, metrics, tracing</text>
</g>
<g id="cache">
