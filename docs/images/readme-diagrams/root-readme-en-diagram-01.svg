  <text class="cardTitle" x="839" y="1245" text-anchor="middle" dominant-baseline="middle">examples/*</text>
  <text class="detail" x="839" y="1275" text-anchor="middle" dominant-baseline="middle">application demos using published modules</text>
</g>
