<svg xmlns="http://www.w3.org/2000/svg" width="1780" height="1240" viewBox="0 0 1780 1240" role="img" aria-labelledby="root-readme-en-diagram-01-title root-readme-en-diagram-01-desc">
  <title id="root-readme-en-diagram-01-title">Repository Module Structure</title>
  <desc id="root-readme-en-diagram-01-desc">Layered repository module structure generated from the current Gradle module directories.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
    <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M0.5 0.5 L4.5 2.5 L0.5 4.5 Z" fill="context-stroke"/></marker>
    <style>
      .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:2}.panel{fill:#F3F7FB;stroke:#D7E2EC;stroke-width:2}.card{filter:url(#shadow);stroke-width:2}.title{font-family:"Architects Daughter";font-size:44px;fill:#22344A;font-weight:400}.subtitle{font-family:"Comic Mono";font-size:17px;fill:#536476;font-weight:400}.panelTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A;font-weight:400;paint-order:stroke;stroke:#F3F7FB;stroke-width:5px;stroke-linejoin:round}.card-title{font-family:"Architects Daughter";font-size:22px;fill:#22344A;font-weight:400}.detail{font-family:"Comic Mono";font-size:14px;fill:#42556B;font-weight:400}.small{font-family:"Comic Mono";font-size:13px;fill:#627184;font-weight:400}.connector{fill:none;stroke-width:2.4;marker-end:url(#arrow);stroke-linejoin:round;stroke-linecap:round}.footer{fill:#FFFFFF;stroke:#D7E2EC;stroke-width:1}
    </style>
  </defs>
  <rect class="canvas" width="1780" height="1240"/>
  <rect class="frame" x="34" y="30" width="1712" height="1180" rx="28"/>
  <text class="title" x="72" y="88">Repository Module Structure</text>
  <text class="subtitle" x="76" y="121">90 source-backed modules grouped by repository boundary and README responsibility.</text>
  <g id="panel-foundation">
    <rect class="panel" x="70" y="150" width="1640" height="160" rx="18"/>
    <text class="panelTitle" x="100" y="168" dominant-baseline="middle">Base</text>
  </g>
  <g id="panel-runtime">
    <rect class="panel" x="70" y="370" width="1640" height="310" rx="18"/>
    <text class="panelTitle" x="100" y="388" dominant-baseline="middle">Runtime library families</text>
  </g>
  <g id="panel-application">
    <rect class="panel" x="70" y="740" width="1640" height="180" rx="18"/>
    <text class="panelTitle" x="100" y="758" dominant-baseline="middle">Application-facing stacks</text>
  </g>
  <g id="panel-evidence">
    <rect class="panel" x="70" y="980" width="1640" height="130" rx="18"/>
    <text class="panelTitle" x="100" y="998" dominant-baseline="middle">Evidence</text>
  </g>
  <path id="route-bluetape4k-io" class="connector" d="M370 276 L370 344 L430 344 L430 412 L270 412 L270 425" stroke="#4F83BF"/>
  <path id="route-bluetape4k-data" class="connector" d="M430 276 L430 340 L660 340 L660 405" stroke="#4F83BF"/>
  <path id="route-bom-infra" class="connector" d="M710 276 L710 344 L1050 344 L1050 425" stroke="#58A978"/>
  <path id="route-baseline-utils" class="connector" d="M1110 276 L1110 344 L1440 344 L1440 405" stroke="#8A72D6"/>
  <path id="route-data-spring-boot" class="connector" d="M820 457 L850 457 L850 720 L720 720 L720 785" stroke="#D9AA4D"/>
  <path id="route-infra-testing" class="connector" d="M1210 477 L1240 477 L1240 720 L1105 720 L1105 785" stroke="#DB7890"/>
  <path id="route-utils-readmes" class="connector" d="M1440 509 L1440 785" stroke="#8BA84D"/>
  <path id="route-spring-boot-examples" class="connector" d="M720 873 L720 950 L440 950 L440 1012" stroke="#8A72D6"/>
  <path id="route-testing-benchmark" class="connector" d="M1105 873 L1105 950 L890 950 L890 1012" stroke="#B88A44"/>
  <path id="route-readmes-diagram-assets" class="connector" d="M1490 873 L1490 950 L1340 950 L1340 1012" stroke="#6B7D90"/>
  <g id="node-bluetape4k" transform="translate(210,190)">
    <rect class="card" x="0" y="0" width="320" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="160" y="24" text-anchor="middle" dominant-baseline="middle">Foundation</text>
    <text class="detail" x="160" y="43" text-anchor="middle" dominant-baseline="middle">5 modules</text>
    <text class="detail" x="160" y="62" text-anchor="middle" dominant-baseline="middle">core, coroutines, logging</text>
  </g>
  <g id="node-bom" transform="translate(560,190)">
    <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">BOM alignment</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">version catalog</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">platform constraints</text>
  </g>
  <g id="node-baseline" transform="translate(960,190)">
    <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Runtime baseline</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">Java 21</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">Kotlin 2.3</text>
  </g>
  <g id="node-split-boundary" transform="translate(1360,190)">
    <rect class="card" x="0" y="0" width="300" height="86" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="card-title" x="150" y="24" text-anchor="middle" dominant-baseline="middle">Standalone repos</text>
    <text class="detail" x="150" y="43" text-anchor="middle" dominant-baseline="middle">AWS, Exposed, image</text>
    <text class="detail" x="150" y="62" text-anchor="middle" dominant-baseline="middle">text, leader, JaVers</text>
  </g>
  <g id="node-io" transform="translate(110,425)">
