  <text class="detail" x="1382" y="639" text-anchor="middle" dominant-baseline="middle">cache APIs and backends</text>
</g>
<g><rect class="panel" x="82" y="796" width="1514" height="234" rx="8"/><text class="panelTitle" x="110" y="832" dominant-baseline="middle">Framework and runtime modules</text></g>
<g id="spring">
  <rect class="card" x="146" y="892" width="330" height="84" rx="8" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="311" y="927" text-anchor="middle" dominant-baseline="middle">spring-boot/*</text>
  <text class="detail" x="311" y="957" text-anchor="middle" dominant-baseline="middle">Spring Boot integrations</text>
</g>
<g id="ktor">
  <rect class="card" x="518" y="892" width="290" height="84" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="663" y="927" text-anchor="middle" dominant-baseline="middle">ktor/*</text>
  <text class="detail" x="663" y="957" text-anchor="middle" dominant-baseline="middle">Ktor integrations</text>
</g>
<g id="vt">
  <rect class="card" x="850" y="892" width="330" height="84" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="1015" y="927" text-anchor="middle" dominant-baseline="middle">virtualthread/*</text>
  <text class="detail" x="1015" y="957" text-anchor="middle" dominant-baseline="middle">runtime selection and APIs</text>
</g>
<g id="testing">
  <rect class="card" x="1222" y="892" width="310" height="84" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1377" y="927" text-anchor="middle" dominant-baseline="middle">testing/*</text>
  <text class="detail" x="1377" y="957" text-anchor="middle" dominant-baseline="middle">test helpers and fixtures</text>
</g>
<g><rect class="panel" x="82" y="1114" width="1514" height="234" rx="8"/><text class="panelTitle" x="110" y="1150" dominant-baseline="middle">Non-published demos</text></g>
<g id="examples">
