    <text class="detail" x="160" y="52" text-anchor="middle" dominant-baseline="middle">16 modules</text>
    <text class="detail" x="160" y="71" text-anchor="middle" dominant-baseline="middle">http/json, okio, grpc</text>
  </g>
  <g id="node-data" transform="translate(500,405)">
    <rect class="card" x="0" y="0" width="320" height="104" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="160" y="33" text-anchor="middle" dominant-baseline="middle">Data access</text>
    <text class="detail" x="160" y="52" text-anchor="middle" dominant-baseline="middle">6 modules</text>
    <text class="detail" x="160" y="71" text-anchor="middle" dominant-baseline="middle">jdbc/r2dbc, mongo, hibernate</text>
  </g>
  <g id="node-infra" transform="translate(890,425)">
    <rect class="card" x="0" y="0" width="320" height="104" rx="12" fill="#FCE7F3" stroke="#DB7890"/>
    <text class="card-title" x="160" y="33" text-anchor="middle" dominant-baseline="middle">Infrastructure</text>
    <text class="detail" x="160" y="52" text-anchor="middle" dominant-baseline="middle">13 modules</text>
    <text class="detail" x="160" y="71" text-anchor="middle" dominant-baseline="middle">redis/kafka, otel, resilience</text>
  </g>
  <g id="node-utils" transform="translate(1280,405)">
    <rect class="card" x="0" y="0" width="320" height="104" rx="12" fill="#EEF6D9" stroke="#8BA84D"/>
    <text class="card-title" x="160" y="33" text-anchor="middle" dominant-baseline="middle">Utilities</text>
    <text class="detail" x="160" y="52" text-anchor="middle" dominant-baseline="middle">13 modules</text>
    <text class="detail" x="160" y="71" text-anchor="middle" dominant-baseline="middle">time/geo, math, workflow</text>
  </g>
  <g id="node-cache" transform="translate(500,560)">
    <rect class="card" x="0" y="0" width="320" height="86" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="160" y="24" text-anchor="middle" dominant-baseline="middle">Cache</text>
    <text class="detail" x="160" y="43" text-anchor="middle" dominant-baseline="middle">5 modules</text>
    <text class="detail" x="160" y="62" text-anchor="middle" dominant-baseline="middle">core, lettuce, redisson</text>
  </g>
  <g id="node-virtualthread" transform="translate(890,560)">
    <rect class="card" x="0" y="0" width="320" height="86" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="160" y="24" text-anchor="middle" dominant-baseline="middle">Virtual Thread</text>
    <text class="detail" x="160" y="43" text-anchor="middle" dominant-baseline="middle">3 modules</text>
    <text class="detail" x="160" y="62" text-anchor="middle" dominant-baseline="middle">api, jdk21, jdk25</text>
  </g>
  <g id="node-ktor" transform="translate(185,785)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#E9F7F6" stroke="#45A7A1"/>
    <text class="card-title" x="150" y="25" text-anchor="middle" dominant-baseline="middle">Ktor</text>
    <text class="detail" x="150" y="44" text-anchor="middle" dominant-baseline="middle">5 modules</text>
    <text class="detail" x="150" y="63" text-anchor="middle" dominant-baseline="middle">core, openapi, resilience</text>
  </g>
  <g id="node-spring-boot" transform="translate(570,785)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#F1ECFF" stroke="#8A72D6"/>
    <text class="card-title" x="150" y="25" text-anchor="middle" dominant-baseline="middle">Spring Boot</text>
    <text class="detail" x="150" y="44" text-anchor="middle" dominant-baseline="middle">8 modules</text>
    <text class="detail" x="150" y="63" text-anchor="middle" dominant-baseline="middle">core, data, demos</text>
  </g>
  <g id="node-testing" transform="translate(955,785)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#F7F1E7" stroke="#B88A44"/>
    <text class="card-title" x="150" y="25" text-anchor="middle" dominant-baseline="middle">Testing</text>
    <text class="detail" x="150" y="44" text-anchor="middle" dominant-baseline="middle">5 modules</text>
    <text class="detail" x="150" y="63" text-anchor="middle" dominant-baseline="middle">junit5, containers, mock servers</text>
  </g>
  <g id="node-readmes" transform="translate(1340,785)">
    <rect class="card" x="0" y="0" width="300" height="88" rx="12" fill="#F6F8FA" stroke="#AAB7C4"/>
    <text class="card-title" x="150" y="25" text-anchor="middle" dominant-baseline="middle">README assets</text>
    <text class="detail" x="150" y="44" text-anchor="middle" dominant-baseline="middle">English and Korean</text>
    <text class="detail" x="150" y="63" text-anchor="middle" dominant-baseline="middle">PNG/SVG pairs</text>
  </g>
  <g id="node-examples" transform="translate(275,1012)">
    <rect class="card" x="0" y="0" width="330" height="74" rx="12" fill="#EAF7EF" stroke="#69B888"/>
    <text class="card-title" x="165" y="18" text-anchor="middle" dominant-baseline="middle">Examples</text>
    <text class="detail" x="165" y="37" text-anchor="middle" dominant-baseline="middle">9 modules</text>
    <text class="detail" x="165" y="56" text-anchor="middle" dominant-baseline="middle">ktor/spring demos, JPA</text>
  </g>
  <g id="node-benchmark" transform="translate(725,1012)">
    <rect class="card" x="0" y="0" width="330" height="74" rx="12" fill="#FFF3D9" stroke="#D9AA4D"/>
    <text class="card-title" x="165" y="18" text-anchor="middle" dominant-baseline="middle">Benchmarks</text>
    <text class="detail" x="165" y="37" text-anchor="middle" dominant-baseline="middle">2 modules</text>
    <text class="detail" x="165" y="56" text-anchor="middle" dominant-baseline="middle">protobuf, web-framework</text>
  </g>
  <g id="node-diagram-assets" transform="translate(1175,1012)">
    <rect class="card" x="0" y="0" width="330" height="74" rx="12" fill="#E8F3FF" stroke="#75A9E8"/>
    <text class="card-title" x="165" y="18" text-anchor="middle" dominant-baseline="middle">Documentation assets</text>
    <text class="detail" x="165" y="37" text-anchor="middle" dominant-baseline="middle">PNG/SVG pairs</text>
    <text class="detail" x="165" y="56" text-anchor="middle" dominant-baseline="middle">README visual index</text>
  </g>
  <g transform="translate(76,1166)">
