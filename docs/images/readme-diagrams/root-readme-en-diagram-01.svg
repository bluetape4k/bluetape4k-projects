      .section { font-family: 'Architects Daughter','Comic Sans MS',Arial,sans-serif; font-size: 24px; fill: #2F4054; }
      .label { font-family: 'Comic Sans MS','Segoe UI',Arial,sans-serif; font-size: 17px; fill: #314256; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: 'Comic Sans MS','Segoe UI',Arial,sans-serif; font-size: 13px; fill: #52657A; }
      .frame { fill: #FFFFFF; stroke: #D6E0EA; stroke-width: 2; rx: 20; filter: url(#shadow); }
      .zone { fill: #F7FAFC; stroke: #E2EAF2; stroke-width: 1.5; rx: 16; }
      .card { stroke-width: 2; rx: 10; filter: url(#shadow); }
      .hub { stroke-width: 2.4; rx: 16; filter: url(#shadow); }
      .line { stroke: #6B7C8F; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #A4B4C5; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
