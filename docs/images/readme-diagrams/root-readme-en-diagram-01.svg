<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Bluetape4k framework module ecosystem map</title>
  <desc id="desc">Pastel architecture map of the bluetape4k-projects root modules, grouped by foundation, I/O, data, infrastructure, Spring Boot integration, testing, utilities, examples, and split repositories.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8FA3B8" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 Z" fill="#6B7C8F"/>
    </marker>
    <style>
      .title { font-family: 'Architects Daughter','Comic Sans MS',Arial,sans-serif; font-size: 38px; fill: #2F4054; }
