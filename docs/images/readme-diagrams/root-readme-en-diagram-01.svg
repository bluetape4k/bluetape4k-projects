<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1100" role="img" aria-labelledby="title desc" data-intent="Explain bluetape4k-projects as a layered architecture where consumer dependency alignment, foundation modules, integration APIs, application stacks, runtime choices, verification, examples, and published artifacts have distinct responsibilities." data-evidence="README.md, README.ko.md, AGENTS.md module groups, settings.gradle.kts, module build.gradle.kts files" data-source-read="README.md;README.ko.md;AGENTS.md;settings.gradle.kts;*/build.gradle.kts">
<title id="title">Repository Module Architecture</title>
<desc id="desc">Architecture diagram based on the current root README module structure and Gradle source tree.</desc>
<style>
    svg { font-family: "Architects Daughter", "Comic Mono", "Comic Sans MS", ui-sans-serif, system-ui, sans-serif; }
    .title { fill: #0f172a; font-size: 32px; font-weight: 800; letter-spacing: 0; }
    .subtitle { fill: #475569; font-size: 17px; font-weight: 500; }
    .layer { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
    .layerTitle { fill: #334155; font-size: 14px; font-weight: 800; letter-spacing: .2px; text-transform: uppercase; paint-order: stroke; stroke: #ffffff; stroke-width: 7px; stroke-linejoin: round; }
    .card { stroke-width: 1.7; filter: url(#cardShadow); }
    .cardTitle { fill: #0f172a; font-size: 16px; font-weight: 800; }
    .cardDetail { fill: #475569; font-size: 12px; font-weight: 600; }
    .iconBadge { stroke-width: 1.5; }
    .iconStroke { fill: none; stroke: #ffffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .iconFill { fill: #ffffff; }
    .route { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    .routeLabel { fill: #1e293b; font-size: 11px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #ffffff; stroke-width: 6px; stroke-linejoin: round; }
    .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; filter: url(#cardShadow); }
    .legendText { fill: #334155; font-size: 12px; font-weight: 700; }
    .footer, .chartFoot { fill: #64748b; font-size: 13px; font-weight: 600; }
    .chartTitle { fill: #352617; font-size: 34px; font-weight: 700; }
    .chartSub { fill: #6f5b3c; font-size: 18px; }
    .chartLabel { fill: #3d3528; font-size: 16px; font-weight: 700; }
    .chartValue { fill: #3d3528; font-size: 15px; font-weight: 700; }
    .chartTick { fill: #7a6a52; font-size: 12px; }
  </style>
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#475569"/>
    </marker>
  </defs>
<rect width="1640" height="1100" fill="#ffffff"/>
<rect x="34" y="34" width="1572" height="1032" rx="8" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5"/>
<text class="title" x="70" y="92">Repository Module Architecture</text>
<text class="subtitle" x="70" y="124">Layered module responsibility from consumer entrypoint to published runtime artifacts.</text>
<g><rect class="layer" x="70" y="140" width="1500" height="165" rx="8"/><text class="layerTitle" x="90" y="168">Consumer entry and version alignment</text></g>
<g><rect class="layer" x="70" y="360" width="1500" height="185" rx="8"/><text class="layerTitle" x="90" y="388">Library architecture</text></g>
<g><rect class="layer" x="70" y="615" width="1500" height="185" rx="8"/><text class="layerTitle" x="90" y="643">Support, examples, and delivery</text></g>
<g data-route="consumer->bom"><path class="route" data-from="consumer" data-to="bom" d="M440,224 L660,224" stroke="#2563eb"/><text class="routeLabel" x="660" y="214">imports</text></g>
<g data-route="catalog->bom"><path class="route" data-from="catalog" data-to="bom" d="M1200,224 L980,224" stroke="#9333ea"/><text class="routeLabel" x="980" y="214">pins</text></g>
<g data-route="bom->foundation"><path class="route" data-from="bom" data-to="foundation" d="M820,268 L820,330 L300,330 L300,395" stroke="#16a34a"/><text class="routeLabel" x="300" y="320">aligns</text></g>
<g data-route="foundation->integration"><path class="route" data-from="foundation" data-to="integration" d="M460,449 L515,449" stroke="#2563eb"/><text class="routeLabel" x="515" y="439">extends</text></g>
<g data-route="integration->appstack"><path class="route" data-from="integration" data-to="appstack" d="M835,449 L890,449" stroke="#0d9488"/><text class="routeLabel" x="890" y="439">feeds</text></g>
<g data-route="appstack->runtime"><path class="route" data-from="appstack" data-to="runtime" d="M1210,449 L1265,449" stroke="#ea580c"/><text class="routeLabel" x="1265" y="439">runs on</text></g>
<g data-route="foundation->state"><path class="route" data-from="foundation" data-to="state" d="M300,503 L300,650" stroke="#2563eb"/><text class="routeLabel" x="300" y="640">shared types</text></g>
<g data-route="integration->test"><path class="route" data-from="integration" data-to="test" d="M675,503 L675,650" stroke="#0d9488"/><text class="routeLabel" x="675" y="640">verified by</text></g>
<g data-route="appstack->examples"><path class="route" data-from="appstack" data-to="examples" d="M1050,503 L1050,650" stroke="#ea580c"/><text class="routeLabel" x="1050" y="640">demonstrates</text></g>
<g data-route="runtime->publish"><path class="route" data-from="runtime" data-to="publish" d="M1395,503 L1395,650" stroke="#65a30d"/><text class="routeLabel" x="1395" y="640">packaged</text></g>
<g data-route="test->publish"><path class="route" data-from="test" data-to="publish" d="M825,704 L1255,704" stroke="#db2777"/><text class="routeLabel" x="1255" y="694">release confidence</text></g>
