<rect class="frame" x="32" y="28" width="1714.4" height="1364" rx="30"/>
<text class="title" x="68" y="84">gRPC Server-Client Communication Sequence</text>
<text class="subtitle" x="72" y="116">Source-checked interaction flow redrawn with compact labels, numbered calls, and readable branch semantics.</text>
