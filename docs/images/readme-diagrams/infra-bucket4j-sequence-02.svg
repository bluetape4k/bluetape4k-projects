<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="1366" viewBox="0 0 2140 1366" role="img" aria-label="Distributed Suspend Rate Limiter — Redis-Based Coroutine Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="2140" height="1366"/>
<rect class="frame" x="32" y="28" width="2076" height="1310" rx="28"/>
<text class="title" x="66" y="82">Distributed Suspend Rate Limiter — Redis-Based Coroutine Flow</text>
<text class="subtitle" x="70" y="118">Sequence messages from the original Mermaid source</text>
<rect class="card" x="80" y="166" width="300" height="72" rx="20" fill="#E8F3FF" stroke="#5B8DEF"/>
<text class="smallLabel" x="230" y="209" text-anchor="middle">Caller</text>
<line class="lifeline" x1="230" y1="252" x2="230" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="500" y="166" width="300" height="72" rx="20" fill="#EAF7EF" stroke="#58A978"/>
<text class="smallLabel" x="650" y="198.5" text-anchor="middle">Distributed Suspend</text>
<text class="smallLabel" x="650" y="219.5" text-anchor="middle">Rate Limiter</text>
<line class="lifeline" x1="650" y1="252" x2="650" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="920" y="166" width="300" height="72" rx="20" fill="#FFF3D9" stroke="#D6A441"/>
<text class="smallLabel" x="1070" y="198.5" text-anchor="middle">Async Bucket Proxy</text>
<text class="smallLabel" x="1070" y="219.5" text-anchor="middle">Provider</text>
<line class="lifeline" x1="1070" y1="252" x2="1070" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1340" y="166" width="300" height="72" rx="20" fill="#FDECEF" stroke="#DC6B82"/>
<text class="smallLabel" x="1490" y="209" text-anchor="middle">AsyncBucketProxy</text>
<line class="lifeline" x1="1490" y1="252" x2="1490" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect class="card" x="1760" y="166" width="300" height="72" rx="20" fill="#E9F7F6" stroke="#45A7A1"/>
<text class="smallLabel" x="1910" y="209" text-anchor="middle">Redis</text>
<line class="lifeline" x1="1910" y1="252" x2="1910" y2="1306" stroke="#b7c2d1" stroke-width="2" stroke-dasharray="10 10"/>
<rect x="329" y="286" width="222" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="347" y="313" text-anchor="start">1. consume(tenant:a, 1)</text>
<path class="line" d="M230 332 L650 332"/>
<rect x="737" y="362" width="246" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="755" y="389" text-anchor="start">2. resolveBucket(tenant:a)</text>
<path class="line" d="M650 408 L1070 408"/>
<rect x="755" y="438" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="773" y="465" text-anchor="start">3. AsyncBucketProxy</text>
<path class="dashed" d="M1070 484 L650 484"/>
<rect x="914.5" y="514" width="311" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="932.5" y="541" text-anchor="start">4. tryConsumeAndReturnRemaining(1)</text>
<path class="line" d="M650 560 L1490 560"/>
<rect x="1561" y="590" width="278" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1579" y="617" text-anchor="start">5. EVALSHA (atomic Lua script)</text>
<path class="line" d="M1490 636 L1910 636"/>
<rect x="160" y="836" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="863" text-anchor="start">ALT: Sufficient tokens</text>
<rect x="1573" y="666" width="254" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1591" y="693" text-anchor="start">7. consumed=1, remaining=99</text>
<path class="dashed" d="M1910 712 L1490 712"/>
<rect x="939" y="742" width="262" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="957" y="769" text-anchor="start">8. CompletableFuture (await)</text>
<path class="dashed" d="M1490 788 L650 788"/>
<rect x="228.5" y="818" width="423" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="246.5" y="845" text-anchor="start">9. RateLimitResult(CONSUMED, 1, 99, diagnostics)</text>
<path class="dashed" d="M650 864 L230 864"/>
<rect x="160" y="1234" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1261" text-anchor="start">ELSE: Insufficient tokens</text>
<rect x="1520.5" y="894" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="1538.5" y="921" text-anchor="start">11. consumed=0, remaining=0, refill wait</text>
<path class="dashed" d="M1910 940 L1490 940"/>
<rect x="935" y="970" width="270" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="953" y="997" text-anchor="start">12. CompletableFuture (await)</text>
<path class="dashed" d="M1490 1016 L650 1016"/>
<rect x="232.5" y="1046" width="415" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="250.5" y="1073" text-anchor="start">13. RateLimitResult(REJECTED, 0, 0, retryAfter)</text>
<path class="dashed" d="M650 1092 L230 1092"/>
<rect x="160" y="1632" width="1820" height="40" rx="16" fill="#F7F1E7" stroke="#B88A44" stroke-width="1.6" opacity="0.96"/>
<text class="strong" x="182" y="1659" text-anchor="start">ELSE: Timeout or store failure</text>
<rect x="965" y="1122" width="210" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="983" y="1149" text-anchor="start">15. failure</text>
<path class="dashed" d="M1490 1168 L650 1168"/>
<rect x="260.5" y="1198" width="359" height="40" rx="12" fill="#ffffff" opacity="0.97"/>
<text class="strong" x="278.5" y="1225" text-anchor="start">16. RateLimitResult(ERROR, errorMessage)</text>
<path class="dashed" d="M650 1244 L230 1244"/>
</svg>
