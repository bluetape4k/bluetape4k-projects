<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="1940" viewBox="0 0 1960 1940" role="img" aria-labelledby="title desc">
<title id="title">distributed suspend rate limiter redis coroutine sequence</title>
<desc id="desc">DistributedSuspendRateLimiter resolves an AsyncBucketProxy, awaits a remote ConsumptionProbe, maps it to RateLimitResult, converts timeout to error, and rethrows coroutine cancellation.</desc>
<defs><style>
  .title{font-family:"Architects Daughter";font-size:42px;fill:#1F2937}
  .subtitle,.msg,.role,.note,.footer{font-family:"Comic Mono";fill:#52616B}
  .subtitle{font-size:18px}.participant{font-family:"Architects Daughter";font-size:21px;fill:#1F2937}
  .role{font-size:13px}.msg{font-size:14px}.note{font-size:13px}.footer{font-size:14px;fill:#60727d}
  .frame{fill:#FEFEFC;stroke:#546E7A;stroke-width:2.5}.inner{fill:#FFFFFF;stroke:#D6E2ED;stroke-width:2}
  .lifeline{stroke:#A8B8C8;stroke-width:2;stroke-dasharray:8 8}
  .activation{rx:6;stroke-width:1.6}.pill{fill:#FFFFFF;stroke-width:1.5}.badge{font-family:"Comic Mono";font-size:12px;font-weight:700;fill:#FFFFFF}
  .alt{fill:#FFFFFF;fill-opacity:.58;stroke:#78909C;stroke-width:2.6;stroke-dasharray:12 8}
</style></defs>
