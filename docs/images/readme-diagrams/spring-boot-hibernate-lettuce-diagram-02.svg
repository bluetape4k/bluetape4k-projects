<svg data-intent="Redesign activation as a decision flow: classpath/property conditions decide whether Hibernate customizer, metrics binder, and actuator endpoint are registered." data-evidence="spring-boot/hibernate-lettuce/README.md; LettuceNearCacheHibernateAutoConfiguration.kt; LettuceNearCacheMetricsAutoConfiguration.kt; LettuceNearCacheActuatorAutoConfiguration.kt" data-source-read="spring-boot/hibernate-lettuce/README.md; LettuceNearCacheHibernateAutoConfiguration.kt; LettuceNearCacheMetricsAutoConfiguration.kt; LettuceNearCacheActuatorAutoConfiguration.kt" xmlns="http://www.w3.org/2000/svg" width="1380" height="940" viewBox="0 0 1380 940" role="img" aria-label="Auto-Configuration Activation Flow" data-layout="decision-flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="seqArrow-blue" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#1D4ED8"/></marker>
  <marker id="seqArrow-green" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#15803D"/></marker>
  <marker id="seqArrow-teal" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#0F766E"/></marker>
  <marker id="seqArrow-amber" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#C2410C"/></marker>
  <marker id="seqArrow-pink" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#BE185D"/></marker>
  <marker id="seqArrow-purple" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#7E22CE"/></marker>
  <marker id="seqArrow-gray" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="#4B5563"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .panel{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#0F172A;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
    .card{filter:url(#shadow);stroke-width:1.7}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}
    .labelPill{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.4}
    .route{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    .seq,.seqReturn{fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.seqReturn{stroke-dasharray:8 7}
    .dashed{stroke-dasharray:8 7}.lifeline{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  </style>
</defs>
<rect class="canvas" width="1380" height="940"/>
<rect class="frame" x="34" y="30" width="1312" height="880" rx="8"/>
<text class="title" x="72" y="84">Auto-Configuration Activation Flow</text>
<text class="subtitle" x="76" y="116">The flow shows the actual Spring Boot conditions that decide Hibernate cache, metrics, and actuator registration.</text>
<g><rect class="panel" x="82" y="160" width="1216" height="700" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">Auto-configuration activation decisions</text></g>
<g id="start">
  <rect class="card" x="540" y="205" width="300" height="72" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="690" y="234" text-anchor="middle" dominant-baseline="middle">Application starts</text>
  <text class="detail" x="690" y="264" text-anchor="middle" dominant-baseline="middle">Spring Boot reads imports</text>
</g>
<g id="classpath">
  <polygon class="card card-shape" points="690,330 885,390 690,450 495,390" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="690" y="382" text-anchor="middle" dominant-baseline="middle">Required classes present?</text>
  <text class="detail" x="690" y="411" text-anchor="middle" dominant-baseline="middle">RegionFactory + EntityManagerFactory</text>
</g>
<g id="enabled">
  <polygon class="card card-shape" points="690,505 885,565 690,625 495,565" fill="#F0FDF4" stroke="#16A34A"/>
  <text class="cardTitle" x="690" y="557" text-anchor="middle" dominant-baseline="middle">lettuce-near enabled?</text>
  <text class="detail" x="690" y="586" text-anchor="middle" dominant-baseline="middle">matchIfMissing = true</text>
</g>
<g id="hibernate">
  <rect class="card" x="905" y="525" width="345" height="82" rx="8" fill="#F0FDFA" stroke="#0D9488"/>
  <text class="cardTitle" x="1077.5" y="559" text-anchor="middle" dominant-baseline="middle">Register customizer</text>
  <text class="detail" x="1077.5" y="589" text-anchor="middle" dominant-baseline="middle">sets RegionFactory and 2LC properties</text>
</g>
<g id="metricsClass">
  <polygon class="card card-shape" points="690,680 885,740 690,800 495,740" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="690" y="732" text-anchor="middle" dominant-baseline="middle">MeterRegistry bean present?</text>
  <text class="detail" x="690" y="761" text-anchor="middle" dominant-baseline="middle">metrics.enabled also true</text>
</g>
<g id="metrics">
  <rect class="card" x="905" y="700" width="345" height="82" rx="8" fill="#FFF7ED" stroke="#EA580C"/>
  <text class="cardTitle" x="1077.5" y="734" text-anchor="middle" dominant-baseline="middle">Register metrics binder</text>
  <text class="detail" x="1077.5" y="764" text-anchor="middle" dominant-baseline="middle">active regions and local size gauges</text>
</g>
<g id="actuator">
  <rect class="card" x="125" y="700" width="310" height="82" rx="8" fill="#FDF2F8" stroke="#DB2777"/>
  <text class="cardTitle" x="280" y="734" text-anchor="middle" dominant-baseline="middle">Optional actuator endpoint</text>
  <text class="detail" x="280" y="764" text-anchor="middle" dominant-baseline="middle">Endpoint + EMF on classpath</text>
</g>
<path class="route" data-from="start" data-to="classpath" d="M690 277 L690 330" stroke="#1D4ED8"/>
<path class="route" data-from="classpath" data-to="enabled" d="M690 450 L690 505" stroke="#7E22CE"/>
<path class="route" data-from="enabled" data-to="hibernate" d="M885 565 L905 565" stroke="#0F766E"/>
<path class="route" data-from="enabled" data-to="metricsClass" d="M690 625 L690 680" stroke="#15803D"/>
<path class="route" data-from="metricsClass" data-to="metrics" d="M885 740 L905 740" stroke="#C2410C"/>
<path class="route" data-from="metricsClass" data-to="actuator" d="M495 740 L435 740" stroke="#BE185D"/>
<text class="detail" x="725" y="478" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="910" y="546" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="910" y="721" text-anchor="middle" dominant-baseline="middle">yes</text>
<text class="detail" x="450" y="704" text-anchor="middle" dominant-baseline="middle">endpoint path</text>
</svg>
