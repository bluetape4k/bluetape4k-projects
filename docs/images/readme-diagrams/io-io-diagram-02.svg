<path class="inherit" data-from="ForyBinarySerializer" data-to="AbstractBinarySerializer" data-route-color="teal" d="M786 631 L786 544" stroke="#2E8F89"/>
<path class="inherit" data-from="KryoBinarySerializer" data-to="AbstractBinarySerializer" data-route-color="amber" d="M981 631 L981 544" stroke="#B9851B"/>
