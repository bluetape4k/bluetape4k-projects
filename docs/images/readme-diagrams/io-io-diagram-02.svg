<g><rect x="180" y="1083" width="1126" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="743" y="1109" text-anchor="middle">Solid routes show inheritance or implementation; dashed routes show dependency or usage.</text></g>
