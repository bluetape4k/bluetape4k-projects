<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1260">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
    <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#203040" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 1.5 1.5 L 11 6.5 L 1.5 11.5 Z" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
  <marker id="openArrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M 2 2 L 11 6.5 L 2 11" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none"/>
  </marker>
</defs>
<style>
  text{font-family:"Architects Daughter","Comic Mono",monospace;letter-spacing:0;fill:#263447}
  .canvas{fill:#F7FAFC}.frame{fill:#FFFFFF;stroke:#D5E0EA;stroke-width:3}
  .title{font-size:47px;font-weight:700;fill:#172033}
  .subtitle{font-family:"Comic Mono",monospace;font-size:19px;font-weight:700;fill:#526174}
  .section rect{fill:#FFFFFF;stroke:#D5E0EA;stroke-width:2.4}
  .sectionTitle{font-size:29px;font-weight:700}.sectionSub{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700;fill:#66788D}
  .card rect{filter:url(#shadow);stroke-width:3;fill:#FFFFFF}
  .blue rect{fill:#EAF3FF;stroke:#3B82F6}.green rect{fill:#EAF9F0;stroke:#21A366}
  .teal rect{fill:#E8FAF8;stroke:#139B91}.amber rect{fill:#FFF4D8;stroke:#D4860B}
  .purple rect{fill:#F2EAFF;stroke:#8B5CF6}.pink rect{fill:#FFEAF1;stroke:#DB2777}
  .gray rect{fill:#F4F6F8;stroke:#64748B}.orange rect{fill:#FFF0E4;stroke:#F05A1A}
  .cardTitle{font-size:27px;font-weight:700}.cardBody{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700;fill:#526174}
  .decision polygon{filter:url(#shadow);fill:#FFF7ED;stroke:#F05A1A;stroke-width:3}
  .edge{fill:none;stroke:#344052;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeBlue{fill:none;stroke:#2563EB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeGreen{fill:none;stroke:#15803D;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeTeal{fill:none;stroke:#0F8B87;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeAmber{fill:none;stroke:#C47A00;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgePink{fill:none;stroke:#BE185D;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .edgeDashed{fill:none;stroke:#BE185D;stroke-width:3.8;stroke-dasharray:11 8;stroke-linecap:round;stroke-linejoin:round}
  .labelBg{fill:#FFFFFF;stroke:#D6E3EF;stroke-width:1.4}.edgeLabel{font-family:"Comic Mono",monospace;font-size:14px;font-weight:700;fill:#526174}
  .note{font-family:"Comic Mono",monospace;font-size:15px;font-weight:700;fill:#526174}
</style>
<rect class="canvas" width="1700" height="1260"/>
<rect class="frame" x="36" y="36" width="1628" height="1188" rx="22"/>
<text class="title" x="84" y="96">Batch and Transaction Processing Flow</text>
<text class="subtitle" x="86" y="132">Batch queues commands and executes once; transaction commits on normal exit and rolls back before rethrowing failures.</text>
<g class="section">
<rect x="88" y="188" width="700" height="960" rx="22"/>
<text class="sectionTitle" x="122" y="236">Batch DSL</text>
<text class="sectionSub" x="122" y="268">Same command path for sync and suspend variants.</text>
</g>
<g class="section">
<rect x="912" y="188" width="700" height="960" rx="22"/>
<text class="sectionTitle" x="946" y="236">Transaction DSL</text>
<text class="sectionSub" x="946" y="268">Same action contract; only commit/rollback call style differs.</text>
</g>
<g id="batch-entry" class="card blue">
<rect x="162" y="302" width="552" height="112" rx="18"/>
<text class="cardTitle" x="438" y="341" text-anchor="middle">Batch entrypoints</text>
<text class="cardBody" x="438" y="376" text-anchor="middle">withBatch / withSuspendedBatch</text>
<text class="cardBody" x="438" y="401" text-anchor="middle">receiver: RBatch</text>
</g>
<g id="batch-create" class="card green">
<rect x="218" y="486" width="440" height="104" rx="18"/>
<text class="cardTitle" x="438" y="525" text-anchor="middle">createBatch(options)</text>
<text class="cardBody" x="438" y="560" text-anchor="middle">RedissonClient creates RBatch</text>
</g>
<g id="batch-action" class="card teal">
<rect x="218" y="666" width="440" height="104" rx="18"/>
<text class="cardTitle" x="438" y="705" text-anchor="middle">action(RBatch)</text>
<text class="cardBody" x="438" y="740" text-anchor="middle">queue async Redis commands</text>
</g>
<g id="batch-execute" class="card amber">
<rect x="218" y="842" width="440" height="104" rx="18"/>
<text class="cardTitle" x="438" y="881" text-anchor="middle">execute once</text>
<text class="cardBody" x="438" y="916" text-anchor="middle">execute()</text>
<text class="cardBody" x="438" y="941" text-anchor="middle">or executeAsync().await()</text>
</g>
<g id="batch-result" class="card orange">
<rect x="506" y="962" width="214" height="82" rx="18"/>
<text class="cardTitle" x="613" y="1001" text-anchor="middle">BatchResult</text>
<text class="cardBody" x="613" y="1036" text-anchor="middle">one Redis round trip</text>
</g>
<path class="edgeBlue" d="M 438 414 L 438 486" marker-end="url(#arrow)"/>
<path class="edgeGreen" d="M 438 590 L 438 666" marker-end="url(#arrow)"/>
<path class="edgeTeal" d="M 438 770 L 438 842" marker-end="url(#arrow)"/>
<path class="edgeAmber" d="M 658 894 L 700 894 Q 714 894 714 908 L 714 962" marker-end="url(#arrow)"/>
<g id="tx-entry" class="card purple">
<rect x="972" y="302" width="552" height="112" rx="18"/>
<text class="cardTitle" x="1248" y="341" text-anchor="middle">Transaction entrypoints</text>
<text class="cardBody" x="1248" y="376" text-anchor="middle">withTransaction / withSuspendedTransaction</text>
<text class="cardBody" x="1248" y="401" text-anchor="middle">receiver: RTransaction</text>
</g>
<g id="tx-create" class="card green">
<rect x="1028" y="486" width="440" height="104" rx="18"/>
<text class="cardTitle" x="1248" y="525" text-anchor="middle">createTransaction(options)</text>
<text class="cardBody" x="1248" y="560" text-anchor="middle">RedissonClient creates RTransaction</text>
</g>
<g id="tx-action" class="card teal">
<rect x="1028" y="666" width="440" height="104" rx="18"/>
<text class="cardTitle" x="1248" y="705" text-anchor="middle">action(RTransaction)</text>
<text class="cardBody" x="1248" y="740" text-anchor="middle">run caller commands</text>
</g>
<g id="tx-decision" class="decision">
<polygon points="1248,803 1373,864 1248,925 1123,864"/>
<text class="cardTitle" x="1248" y="858" text-anchor="middle">action throws?</text>
<text class="cardBody" x="1248" y="884" text-anchor="middle">normal vs exception</text>
</g>
<g id="tx-commit" class="card green">
<rect x="974" y="960" width="326" height="108" rx="18"/>
<text class="cardTitle" x="1137" y="999" text-anchor="middle">Commit path</text>
<text class="cardBody" x="1137" y="1034" text-anchor="middle">commit or commitAsync</text>
<text class="cardBody" x="1137" y="1059" text-anchor="middle">returns success</text>
</g>
<g id="tx-rollback" class="card pink">
<rect x="1368" y="960" width="262" height="108" rx="18"/>
<text class="cardTitle" x="1499" y="999" text-anchor="middle">Rollback path</text>
<text class="cardBody" x="1499" y="1034" text-anchor="middle">rollback attempt</text>
<text class="cardBody" x="1499" y="1059" text-anchor="middle">rethrow original</text>
</g>
<path class="edgeBlue" d="M 1248 414 L 1248 486" marker-end="url(#arrow)"/>
<path class="edgeGreen" d="M 1248 590 L 1248 666" marker-end="url(#arrow)"/>
<path class="edgeTeal" d="M 1248 770 L 1248 803" marker-end="url(#arrow)"/>
<path class="edgeGreen" d="M 1123 864 L 1123 912 Q 1123 922 1133 922 L 1127 922 Q 1137 922 1137 932 L 1137 960" marker-end="url(#arrow)"/>
<rect class="labelBg" x="1020" y="896" width="76" height="27" rx="8"/>
<text class="edgeLabel" x="1058" y="914" text-anchor="middle">no</text>
<path class="edgeDashed" d="M 1373 864 L 1485 864 Q 1499 864 1499 878 L 1499 960"/>
<polygon points="1493,948 1499,960 1505,948" fill="#BE185D" stroke="#BE185D" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<rect class="labelBg" x="1508" y="824" width="76" height="27" rx="8"/>
<text class="edgeLabel" x="1546" y="842" text-anchor="middle">yes</text>
<rect class="labelBg" x="210" y="1170" width="1280" height="40" rx="12"/>
<text class="note" x="850" y="1195" text-anchor="middle">Batch sends queued commands at execute time; transaction rollback failures are ignored while the original failure is rethrown.</text>
</svg>
