<rect class="canvas" width="1600" height="1170"/>
<rect class="frame" x="34" y="30" width="1532" height="1110" rx="8"/>
<text class="title" x="72" y="84">Batch and Transaction Processing Flow</text>
<text class="subtitle" x="76" y="116">Batch reduces Redis round trips by executing queued commands once; transaction wrappers commit on normal exit and rollback before rethrowing on failure.</text>
<g><rect class="panel" x="82" y="160" width="1436" height="180" rx="8"/><text class="panelTitle" x="110" y="196" dominant-baseline="middle">DSL entrypoints</text></g>
<g><rect class="panel" x="82" y="380" width="1436" height="220" rx="8"/><text class="panelTitle" x="110" y="416" dominant-baseline="middle">Batch: queue commands, execute once</text></g>
<g><rect class="panel" x="82" y="670" width="1436" height="410" rx="8"/><text class="panelTitle" x="110" y="706" dominant-baseline="middle">Transaction: commit or rollback contract</text></g>
