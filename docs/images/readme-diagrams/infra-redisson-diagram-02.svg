  <text class="cardTitle" x="1270" y="251" text-anchor="middle" dominant-baseline="middle">RedissonClient</text>
  <text class="detail" x="1270" y="281" text-anchor="middle" dominant-baseline="middle">creates RBatch or RTransaction</text>
</g>
