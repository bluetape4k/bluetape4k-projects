  <text class="cardTitle" x="1105" y="496" text-anchor="middle" dominant-baseline="middle">execute</text>
  <text class="detail" x="1105" y="526" text-anchor="middle" dominant-baseline="middle">execute() or executeAsync().await()</text>
</g>
<g id="batchResult">
