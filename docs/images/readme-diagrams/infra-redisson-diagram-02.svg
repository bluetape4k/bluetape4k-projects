  <text class="cardTitle" x="1405" y="487" text-anchor="middle" dominant-baseline="middle">BatchResult</text>
  <text class="detail" x="1405" y="517" text-anchor="middle" dominant-baseline="middle">one RTT</text>
  <text class="detail" x="1405" y="535" text-anchor="middle" dominant-baseline="middle">result list</text>
</g>
<g id="txDsl">
  <rect class="card" x="135" y="790" width="320" height="86" rx="8" fill="#FAF5FF" stroke="#9333EA"/>
  <text class="cardTitle" x="295" y="826" text-anchor="middle" dominant-baseline="middle">withTransaction block</text>
  <text class="detail" x="295" y="856" text-anchor="middle" dominant-baseline="middle">action receiver: RTransaction</text>
