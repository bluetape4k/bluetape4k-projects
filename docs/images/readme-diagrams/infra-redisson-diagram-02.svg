  <text class="cardTitle" x="295" y="496" text-anchor="middle" dominant-baseline="middle">withBatch block</text>
  <text class="detail" x="295" y="526" text-anchor="middle" dominant-baseline="middle">action receiver: RBatch</text>
</g>
