  <rect class="card" x="150" y="220" width="330" height="76" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <text class="cardTitle" x="315" y="251" text-anchor="middle" dominant-baseline="middle">Sync DSL</text>
  <text class="detail" x="315" y="281" text-anchor="middle" dominant-baseline="middle">withBatch / withTransaction</text>
</g>
