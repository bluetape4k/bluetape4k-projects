<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-label="Batch and Transaction Processing Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#203040" flood-opacity="0.10"/></filter>
  <marker id="arrow" viewBox="0 0 5 5" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto" markerUnits="strokeWidth"><path d="M 0.5 0.5 L 4.5 2.5 L 0.5 4.5 Z" fill="context-stroke"/></marker>
  <marker id="inheritArrow" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 7 3.5 L 1 6 Z" fill="#fff" stroke="context-stroke" stroke-width="1.4"/></marker>
  <style>
    .canvas{fill:#F6F9FC}.frame{fill:#fff;stroke:#C7D7E7;stroke-width:3;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:43px;fill:#22344A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#536476}
    .panel{fill:#F7FBFF;stroke:#D6E3EF;stroke-width:2}.panelTitle{font-family:"Architects Daughter";font-size:24px;fill:#31445A;paint-order:stroke;stroke:#F7FBFF;stroke-width:5px;stroke-linejoin:round}
    .card,.classCard{filter:url(#shadow);stroke-width:2}.cardTitle,.classTitle{font-family:"Architects Daughter";font-size:23px;fill:#22344A}.stereo{font-family:"Comic Mono";font-size:10px;fill:#627184}.member{font-family:"Comic Mono";font-size:13px;fill:#102033}.detail{font-family:"Comic Mono";font-size:13px;fill:#42556B}
    .note{stroke-width:1.6}.flow{fill:none;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.dependency{fill:none;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.inherit{fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#inheritArrow)}
  </style>
</defs>
<rect class="canvas" width="1600" height="980"/>
<rect class="frame" x="32" y="28" width="1536" height="924" rx="30"/>
<text class="title" x="68" y="84">Batch and Transaction Processing Flow</text>
<text class="subtitle" x="72" y="116">Batch reduces round trips; transaction commits on success and rolls back before rethrowing on failure.</text>
<g id="entryLayer"><rect class="panel" x="72" y="170" width="330" height="645" rx="20"/><text class="panelTitle" x="100" y="206">Entry DSL</text></g>
<g id="workLayer"><rect class="panel" x="430" y="170" width="650" height="645" rx="20"/><text class="panelTitle" x="458" y="206">Redisson work object</text></g>
<g id="outcomeLayer"><rect class="panel" x="1120" y="170" width="408" height="645" rx="20"/><text class="panelTitle" x="1148" y="206">Outcome</text></g>
<path class="flow" data-from="batchCall" data-to="rBatch" d="M365 312 L455 312" stroke="#4F83BF"/>
<path class="flow" data-from="rBatch" data-to="batchExecute" d="M695 312 L785 312" stroke="#3E9868"/>
<path class="flow" data-from="batchExecute" data-to="batchResult" d="M1055 312 L1165 312" stroke="#2E8F89"/>
<path class="flow" data-from="txCall" data-to="rTx" d="M365 637 L455 637" stroke="#755BC6"/>
<path class="flow" data-from="rTx" data-to="txCommit" d="M695 620 L740 620 L740 602 L785 602" stroke="#3E9868"/>
<path class="flow" data-from="rTx" data-to="txRollback" d="M695 660 L740 660 L740 737 L785 737" stroke="#C94D68"/>
<path class="flow" data-from="txCommit" data-to="txOutcome" d="M1055 602 L1100 602 L1100 650 L1165 650" stroke="#2E8F89"/>
<path class="flow" data-from="txRollback" data-to="txOutcome" d="M1055 737 L1100 737 L1100 700 L1165 700" stroke="#C94D68"/>
<g id="batchCall">
  <rect class="card" x="125" y="265" width="240" height="94" rx="10" fill="#E8F3FF" stroke="#5B8DEF"/>
  <text class="cardTitle" x="245" y="300" text-anchor="middle" dominant-baseline="middle">withBatch</text>
  <text class="detail" x="245" y="329" text-anchor="middle" dominant-baseline="middle">sync or suspended</text>
<text class="detail" x="245" y="347" text-anchor="middle" dominant-baseline="middle">action: RBatch.()</text>
</g>
<g id="rBatch">
  <rect class="card" x="455" y="265" width="240" height="94" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="575" y="300" text-anchor="middle" dominant-baseline="middle">RBatch</text>
  <text class="detail" x="575" y="329" text-anchor="middle" dominant-baseline="middle">queue Redis commands</text>
<text class="detail" x="575" y="347" text-anchor="middle" dominant-baseline="middle">BatchOptions</text>
</g>
<g id="batchExecute">
  <rect class="card" x="785" y="265" width="270" height="94" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="920" y="300" text-anchor="middle" dominant-baseline="middle">execute</text>
  <text class="detail" x="920" y="329" text-anchor="middle" dominant-baseline="middle">execute()</text>
<text class="detail" x="920" y="347" text-anchor="middle" dominant-baseline="middle">executeAsync().await()</text>
</g>
<g id="batchResult">
  <rect class="card" x="1165" y="265" width="250" height="94" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1290" y="300" text-anchor="middle" dominant-baseline="middle">BatchResult</text>
  <text class="detail" x="1290" y="329" text-anchor="middle" dominant-baseline="middle">single network round trip</text>
<text class="detail" x="1290" y="347" text-anchor="middle" dominant-baseline="middle">result list</text>
</g>
<g id="txCall">
  <rect class="card" x="125" y="590" width="240" height="94" rx="10" fill="#F1ECFF" stroke="#8A72D6"/>
  <text class="cardTitle" x="245" y="625" text-anchor="middle" dominant-baseline="middle">withTransaction</text>
  <text class="detail" x="245" y="654" text-anchor="middle" dominant-baseline="middle">sync or suspended</text>
<text class="detail" x="245" y="672" text-anchor="middle" dominant-baseline="middle">action: RTransaction.()</text>
</g>
<g id="rTx">
  <rect class="card" x="455" y="590" width="240" height="94" rx="10" fill="#EAF7EF" stroke="#58A978"/>
  <text class="cardTitle" x="575" y="625" text-anchor="middle" dominant-baseline="middle">RTransaction</text>
  <text class="detail" x="575" y="654" text-anchor="middle" dominant-baseline="middle">createTransaction</text>
<text class="detail" x="575" y="672" text-anchor="middle" dominant-baseline="middle">TransactionOptions</text>
</g>
<g id="txCommit">
  <rect class="card" x="785" y="555" width="270" height="94" rx="10" fill="#E9F7F6" stroke="#45A7A1"/>
  <text class="cardTitle" x="920" y="590" text-anchor="middle" dominant-baseline="middle">commit path</text>
  <text class="detail" x="920" y="619" text-anchor="middle" dominant-baseline="middle">action completes</text>
<text class="detail" x="920" y="637" text-anchor="middle" dominant-baseline="middle">commit / commitAsync</text>
</g>
<g id="txRollback">
  <rect class="card" x="785" y="690" width="270" height="94" rx="10" fill="#FDECEF" stroke="#DC6B82"/>
  <text class="cardTitle" x="920" y="725" text-anchor="middle" dominant-baseline="middle">rollback path</text>
  <text class="detail" x="920" y="754" text-anchor="middle" dominant-baseline="middle">action throws</text>
<text class="detail" x="920" y="772" text-anchor="middle" dominant-baseline="middle">rollback then rethrow</text>
</g>
<g id="txOutcome">
  <rect class="card" x="1165" y="625" width="250" height="94" rx="10" fill="#FFF3D9" stroke="#D6A441"/>
  <text class="cardTitle" x="1290" y="660" text-anchor="middle" dominant-baseline="middle">Caller outcome</text>
  <text class="detail" x="1290" y="689" text-anchor="middle" dominant-baseline="middle">success returns</text>
<text class="detail" x="1290" y="707" text-anchor="middle" dominant-baseline="middle">original error preserved</text>
</g>
<g><rect class="note" x="120" y="892" width="1360" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF"/><text class="detail" x="800" y="918" text-anchor="middle">bluetape4k-projects / infra:redisson - github.com/bluetape4k/bluetape4k-projects</text></g>
</svg>
