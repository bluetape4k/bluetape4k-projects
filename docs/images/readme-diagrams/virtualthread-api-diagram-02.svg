<svg xmlns="http://www.w3.org/2000/svg" width="1580" height="1000" viewBox="0 0 1580 1000" role="img" aria-label="ServiceLoader-Based Runtime Selection Flow">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.10"/></filter>
  <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#2563EB" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#0D9488" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-green" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#16A34A" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-amber" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#D97706" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#DB2777" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <marker id="arrow-gray" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#64748B" stroke-dasharray="none" style="stroke-dasharray:none"/></marker>
  <style>
    svg{font-family:"Architects Daughter","Comic Mono","Comic Sans MS",ui-sans-serif,system-ui,sans-serif}
    .canvas{fill:#F8FAFC}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;filter:url(#shadow)}
    .title{font-family:"Architects Daughter";font-size:44px;fill:#0F172A}.subtitle{font-family:"Comic Mono";font-size:16px;fill:#475569}
    .card{filter:url(#shadow);stroke-width:1.8}.cardTitle{font-family:"Architects Daughter";font-size:23px;fill:#0F172A}.detail{font-family:"Comic Mono";font-size:13px;fill:#475569}.small{font-family:"Comic Mono";font-size:12px;fill:#64748B}
    .route{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.soft{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}
    .label{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.3}
  </style>
</defs>
<rect class="canvas" width="1580" height="1000"/>
<rect class="frame" x="34" y="30" width="1512" height="940" rx="8"/>
<text class="title" x="72" y="84">ServiceLoader-Based Runtime Selection Flow</text>
<text class="subtitle" x="76" y="116">The API discovers runtime providers lazily, skips broken entries, keeps supported providers, and chooses the highest priority.</text>

<g id="call"><rect class="card" x="120" y="190" width="330" height="90" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="cardTitle" x="285" y="224" text-anchor="middle" dominant-baseline="middle">Application call</text><text class="detail" x="285" y="252" text-anchor="middle" dominant-baseline="middle">VirtualThreads.executorService()</text></g>
<g id="lazy"><rect class="card" x="600" y="190" width="360" height="90" rx="8" fill="#F0FDF4" stroke="#16A34A"/><text class="cardTitle" x="780" y="224" text-anchor="middle" dominant-baseline="middle">Lazy providers list</text><text class="detail" x="780" y="252" text-anchor="middle" dominant-baseline="middle">computed once by VirtualThreads</text></g>
<g id="result"><rect class="card" x="1110" y="190" width="330" height="90" rx="8" fill="#FDF2F8" stroke="#DB2777"/><text class="cardTitle" x="1275" y="224" text-anchor="middle" dominant-baseline="middle">Runtime delegate</text><text class="detail" x="1275" y="252" text-anchor="middle" dominant-baseline="middle">threadFactory / executorService</text></g>

<g id="load"><rect class="card" x="150" y="390" width="300" height="92" rx="8" fill="#EFF6FF" stroke="#2563EB"/><text class="cardTitle" x="300" y="424" text-anchor="middle" dominant-baseline="middle">ServiceLoader iterator</text><text class="detail" x="300" y="452" text-anchor="middle" dominant-baseline="middle">VirtualThreadRuntime entries</text></g>
<g id="safe"><rect class="card" x="560" y="390" width="300" height="92" rx="8" fill="#F0FDFA" stroke="#0D9488"/><text class="cardTitle" x="710" y="424" text-anchor="middle" dominant-baseline="middle">Safe discovery loop</text><text class="detail" x="710" y="452" text-anchor="middle" dominant-baseline="middle">hasNext and next are guarded</text></g>
<g id="support"><rect class="card" x="970" y="390" width="300" height="92" rx="8" fill="#FFF7ED" stroke="#D97706"/><text class="cardTitle" x="1120" y="424" text-anchor="middle" dominant-baseline="middle">Support check</text><text class="detail" x="1120" y="452" text-anchor="middle" dominant-baseline="middle">provider.isSupported()</text></g>

<g id="jdk25"><rect class="card" x="150" y="665" width="320" height="94" rx="8" fill="#FDF2F8" stroke="#DB2777"/><text class="cardTitle" x="310" y="700" text-anchor="middle" dominant-baseline="middle">JDK 25 provider</text><text class="detail" x="310" y="728" text-anchor="middle" dominant-baseline="middle">priority 25 when feature >= 25</text></g>
<g id="jdk21"><rect class="card" x="610" y="665" width="320" height="94" rx="8" fill="#ECFDF5" stroke="#16A34A"/><text class="cardTitle" x="770" y="700" text-anchor="middle" dominant-baseline="middle">JDK 21 provider</text><text class="detail" x="770" y="728" text-anchor="middle" dominant-baseline="middle">priority 21 when feature >= 21</text></g>
<g id="fallback"><rect class="card" x="1070" y="665" width="320" height="94" rx="8" fill="#F8FAFC" stroke="#64748B"/><text class="cardTitle" x="1230" y="700" text-anchor="middle" dominant-baseline="middle">Platform fallback</text><text class="detail" x="1230" y="728" text-anchor="middle" dominant-baseline="middle">used when list is empty</text></g>
<g id="sort"><rect class="card" x="520" y="825" width="540" height="78" rx="8" fill="#F7FEE7" stroke="#65A30D"/><text class="cardTitle" x="790" y="854" text-anchor="middle" dominant-baseline="middle">sortedByDescending(priority).firstOrNull()</text><text class="detail" x="790" y="880" text-anchor="middle" dominant-baseline="middle">otherwise PlatformThreadRuntime</text></g>

<path class="route" d="M450 235 L600 235" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="route" d="M960 235 L1110 235" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="route" d="M 780 280 L 780 321 Q 780 335 766 335 L 314 335 Q 300 335 300 349 L 300 390" stroke="#2563EB" marker-end="url(#arrow-blue)"/>
<path class="route" d="M450 436 L560 436" stroke="#0D9488" marker-end="url(#arrow-teal)"/>
<path class="route" d="M860 436 L970 436" stroke="#D97706" marker-end="url(#arrow-amber)"/>
<path class="soft" d="M 1120 482 L 1120 546 Q 1120 560 1106 560 L 324 560 Q 310 560 310 574 L 310 665" stroke="#DB2777"/>
<polygon points="304,653 310,665 316,653" fill="#DB2777" stroke="#DB2777" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="soft" d="M 1120 482 L 1120 546 Q 1120 560 1106 560 L 784 560 Q 770 560 770 574 L 770 665" stroke="#16A34A"/>
<polygon points="764,653 770,665 776,653" fill="#16A34A" stroke="#16A34A" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="soft" d="M 1120 482 L 1120 546 Q 1120 560 1134 560 L 1216 560 Q 1230 560 1230 574 L 1230 665" stroke="#64748B"/>
<polygon points="1224,653 1230,665 1236,653" fill="#64748B" stroke="#64748B" stroke-width="1" stroke-linejoin="round" stroke-dasharray="none" style="stroke-dasharray:none!important" data-direct-solid-head="true"/>
<path class="route" d="M 310 759 L 310 850 Q 310 864 324 864 L 520 864" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<path class="route" d="M770 759 L770 825" stroke="#16A34A" marker-end="url(#arrow-green)"/>
<path class="route" d="M 1230 759 L 1230 850 Q 1230 864 1216 864 L 1060 864" stroke="#64748B" marker-end="url(#arrow-gray)"/>
<path class="route" d="M 1060 864 L 1466 864 Q 1480 864 1480 850 L 1480 249 Q 1480 235 1466 235 L 1440 235" stroke="#DB2777" marker-end="url(#arrow-pink)"/>
<g><rect class="label" x="528" y="544" width="300" height="28" rx="8"/><text class="small" x="678" y="559" text-anchor="middle" dominant-baseline="middle">broken ServiceLoader entries are skipped</text></g>
</svg>
