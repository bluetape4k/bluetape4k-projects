<rect x="247" y="322" width="16" height="556" rx="5" fill="#E8F3FF" stroke="#5B8DEF" stroke-width="1.4"/>
<rect x="667" y="322" width="16" height="732" rx="5" fill="#EAF7EF" stroke="#58A978" stroke-width="1.4"/>
<rect x="1087" y="410" width="16" height="556" rx="5" fill="#E9F7F6" stroke="#45A7A1" stroke-width="1.4"/>
<rect x="1507" y="498" width="16" height="116" rx="5" fill="#FFF3D9" stroke="#D6A441" stroke-width="1.4"/>
<rect x="1927" y="586" width="16" height="468" rx="5" fill="#FDECEF" stroke="#DC6B82" stroke-width="1.4"/>
