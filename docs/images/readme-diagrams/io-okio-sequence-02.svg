<g id="m2"><rect class="labelPill" x="770" y="375" width="230" height="26" rx="7"/><circle cx="789" cy="388" r="12" fill="#3E9868"/><text class="detail" x="789" y="389" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">2</text><text class="detail" x="903" y="389" text-anchor="middle" dominant-baseline="middle">write chunk</text><path class="seq" d="M675 418 L1095 418" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m3"><rect class="labelPill" x="1170.7" y="463" width="268.6" height="26" rx="7"/><circle cx="1189.7" cy="476" r="12" fill="#2E8F89"/><text class="detail" x="1189.7" y="477" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">3</text><text class="detail" x="1323" y="477" text-anchor="middle" dominant-baseline="middle">compress incrementally</text><path class="seq" d="M1095 506 L1515 506" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g id="m4"><rect class="labelPill" x="1583.4" y="551" width="283.2" height="26" rx="7"/><circle cx="1602.4" cy="564" r="12" fill="#B9851B"/><text class="detail" x="1602.4" y="565" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">4</text><text class="detail" x="1743" y="565" text-anchor="middle" dominant-baseline="middle">flush compressed segment</text><path class="seq" d="M1515 594 L1935 594" stroke="#B9851B" marker-end="url(#seqArrow-amber)"/></g>
<g id="m5"><rect class="labelPill" x="350" y="639" width="230" height="26" rx="7"/><circle cx="369" cy="652" r="12" fill="#C94D68"/><text class="detail" x="369" y="653" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">5</text><text class="detail" x="483" y="653" text-anchor="middle" dominant-baseline="middle">flush()</text><path class="seq" d="M255 682 L675 682" stroke="#C94D68" marker-end="url(#seqArrow-pink)"/></g>
<g id="m6"><rect class="labelPill" x="1190" y="727" width="230" height="26" rx="7"/><circle cx="1209" cy="740" r="12" fill="#755BC6"/><text class="detail" x="1209" y="741" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">6</text><text class="detail" x="1323" y="741" text-anchor="middle" dominant-baseline="middle">flush delegate</text><path class="seq" d="M675 770 L1935 770" stroke="#755BC6" marker-end="url(#seqArrow-purple)"/></g>
<g id="m7"><rect class="labelPill" x="350" y="815" width="230" height="26" rx="7"/><circle cx="369" cy="828" r="12" fill="#4F83BF"/><text class="detail" x="369" y="829" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">7</text><text class="detail" x="483" y="829" text-anchor="middle" dominant-baseline="middle">close()</text><path class="seq" d="M255 858 L675 858" stroke="#4F83BF" marker-end="url(#seqArrow-blue)"/></g>
<g id="m8"><rect class="labelPill" x="770" y="903" width="230" height="26" rx="7"/><circle cx="789" cy="916" r="12" fill="#3E9868"/><text class="detail" x="789" y="917" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">8</text><text class="detail" x="903" y="917" text-anchor="middle" dominant-baseline="middle">finish stream</text><path class="seq" d="M675 946 L1095 946" stroke="#3E9868" marker-end="url(#seqArrow-green)"/></g>
<g id="m9"><rect class="labelPill" x="1190" y="991" width="230" height="26" rx="7"/><circle cx="1209" cy="1004" r="12" fill="#2E8F89"/><text class="detail" x="1209" y="1005" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:12px">9</text><text class="detail" x="1323" y="1005" text-anchor="middle" dominant-baseline="middle">close delegate</text><path class="seq" d="M675 1034 L1935 1034" stroke="#2E8F89" marker-end="url(#seqArrow-teal)"/></g>
<g><rect x="140" y="1162" width="1910" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="1095" y="1188" text-anchor="middle">Every sequence asset uses rectangular participants, dashed lifelines, numbered labels, compact 5x5 arrows, and non-overlapping branch rows.</text></g>
</svg>
