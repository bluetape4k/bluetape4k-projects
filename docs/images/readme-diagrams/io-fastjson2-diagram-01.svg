  <text class="classTitle" x="955" y="922" text-anchor="middle">JSON</text>
  <line x1="790" y1="931" x2="1120" y2="931" stroke="#8A72D6" stroke-width="1.4"/>
  <text class="member" x="808" y="973">+parseObject(text, type)</text>
</g>
<g id="jsonObjectExtensions">
