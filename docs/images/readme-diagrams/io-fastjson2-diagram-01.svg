<g>
  <rect x="1827" y="1115" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/>
  <path class="inherit" d="M1845 1133 L1903 1133" stroke="#3E9868"/>
  <text class="detail" x="1917" y="1138">inheritance / implementation</text>
  <path class="dependency" d="M1845 1154 L1903 1154" stroke="#758297" stroke-dasharray="8 7"/>
