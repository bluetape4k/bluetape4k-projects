<g><rect x="180" y="1133" width="1602" height="42" rx="12" fill="#FFFFFF" stroke="#D6E3EF" stroke-width="1.6"/><text class="detail" x="981" y="1159" text-anchor="middle">bluetape4k-projects / io modules - github.com/bluetape4k/bluetape4k-projects</text></g>
