  <text class="classTitle" x="733" y="283" text-anchor="middle">JsonSerializer</text>
  <line x1="568" y1="292" x2="898" y2="292" stroke="#5B8DEF" stroke-width="1.4"/>
  <text class="member" x="586" y="326">+serialize(graph)</text>
<text class="member" x="586" y="343">+deserialize(bytes, clazz)</text>
</g>
<g id="fastjsonSerializer">
