<svg xmlns="http://www.w3.org/2000/svg" width="1754" height="1072" viewBox="0 0 1754 1072" role="img" aria-label="Class Structure">
<defs>
  <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1f2937" flood-opacity="0.10"/></filter>
  <marker id="openArrow" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 1 1 L 10 5 L 1 9" fill="none" stroke="#758297" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="inherit" markerWidth="14" markerHeight="12" refX="12" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M 0 1 L 12 6 L 0 11 Z" fill="#ffffff" stroke="#758297" stroke-width="1.8"/></marker>
  <style>
    .canvas{fill:#f7f9fc}.frame{fill:#fff;stroke:#d8e0ea;stroke-width:1.5}
    .title{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:43px;font-weight:400;fill:#102033}
    .subtitle{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:15px;font-weight:400;fill:#536273}
    .label{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:25px;font-weight:400;fill:#102033}
    .smallLabel{font-family:"Architects Daughter","Comic Sans MS","Comic Sans",cursive;font-size:21px;font-weight:400;fill:#102033}
    .mono{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#102033}
    .small{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:12px;font-weight:400;fill:#536273}
    .strong{font-family:"Comic Sans MS","Comic Sans","Comic Neue",Arial,sans-serif;font-size:13px;font-weight:400;fill:#102033}
    .card{stroke-width:2.1;filter:url(#shadow)}.compartment{stroke-width:1.5;fill:none}
    .line{stroke:#758297;stroke-width:2.1;fill:none;marker-end:url(#openArrow)}
    .plainLine{stroke:#758297;stroke-width:2.1;fill:none}
    .dashed{stroke:#758297;stroke-width:2.1;stroke-dasharray:7 6;fill:none;marker-end:url(#openArrow)}
    .inheritLine{stroke:#758297;stroke-width:2.2;fill:none;marker-end:url(#inherit)}
    .implLine{stroke:#758297;stroke-width:2.2;stroke-dasharray:8 7;fill:none;marker-end:url(#inherit)}
  </style>
</defs>
<rect class="canvas" width="1754" height="1072"/>
<rect class="frame" x="32" y="28" width="1690" height="1016" rx="28"/>
<text class="title" x="66" y="82">Class Structure</text>
<text class="subtitle" x="70" y="118">UML classes from the original Mermaid source</text>
<path class="dashed" d="M877 716 C877 536 672 536 672 356"/>
<path class="implLine" d="M877 716 C877 681 877 681 877 646"/>
<g transform="translate(92,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#E8F3FF" stroke="#5B8DEF"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#5B8DEF"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">JSONArrayExtensions</text>
  <text class="mono" x="18" y="108">+JSONArray.readValueOrNull() T?</text>
<text class="mono" x="18" y="132">+JSONArray.readList() List~T~</text>
<text class="mono" x="18" y="156">+JSONArray.readArray() Array~T~</text>
</g>
<g transform="translate(502,180)">
  <rect class="card" x="0" y="0" width="340" height="168" rx="5" fill="#EAF7EF" stroke="#58A978"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#58A978"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">JSONBExtensions</text>
  <text class="mono" x="18" y="108">+Any.toJsonBytes() ByteArray</text>
<text class="mono" x="18" y="132">+ByteArray.readBytesOrNull() T?</text>
<text class="mono" x="18" y="156">+InputStream.readBytesOrNull() T?</text>
</g>
<g transform="translate(912,180)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#FFF3D9" stroke="#D6A441"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#D6A441"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">JSONExtensions</text>
  <text class="mono" x="18" y="108">+Any.toJsonString() String</text>
<text class="mono" x="18" y="132">+String.readValueOrNull() T?</text>
<text class="mono" x="18" y="156">+String.readValueAsList() List~T~</text>
<text class="mono" x="18" y="180">+String.readAsJSONObject() JSONObject</text>
</g>
<g transform="translate(1322,180)">
  <rect class="card" x="0" y="0" width="340" height="144" rx="5" fill="#FDECEF" stroke="#DC6B82"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#DC6B82"/>
  <text class="small" x="170" y="26" text-anchor="middle">«extensions»</text>
  <text class="label" x="170" y="57" text-anchor="middle">JSONObjectExtensions</text>
  <text class="mono" x="18" y="108">+JSONObject.readValueOrNull() T?</text>
<text class="mono" x="18" y="132">+JSONObject.readValueOrNull(key) T?</text>
</g>
<g transform="translate(707,446)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#E9F7F6" stroke="#45A7A1"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#45A7A1"/>
  <text class="small" x="170" y="26" text-anchor="middle">«interface»</text>
  <text class="label" x="170" y="57" text-anchor="middle">JsonSerializer</text>
  <text class="mono" x="18" y="108">+serialize(graph: Any?) ByteArray</text>
<text class="mono" x="18" y="132">+deserialize(bytes: ByteArray?, clazz: Class~T~) T?</text>
<text class="mono" x="18" y="156">+serializeAsString(graph: Any?) String</text>
<text class="mono" x="18" y="180">+deserializeFromString(text: String?, clazz: Class.</text>
</g>
<g transform="translate(707,724)">
  <rect class="card" x="0" y="0" width="340" height="192" rx="5" fill="#F1ECFF" stroke="#8A72D6"/>
  <line class="compartment" x1="0" y1="78" x2="340" y2="78" stroke="#8A72D6"/>
  <text class="small" x="170" y="26" text-anchor="middle"></text>
  <text class="label" x="170" y="57" text-anchor="middle">FastjsonSerializer</text>
  <text class="mono" x="18" y="108">+serialize(graph) ByteArray</text>
<text class="mono" x="18" y="132">+deserialize(bytes, clazz) T?</text>
<text class="mono" x="18" y="156">+serializeAsString(graph) String</text>
<text class="mono" x="18" y="180">+deserializeFromString(text, clazz) T?</text>
</g>
<rect x="716.5" y="521" width="116" height="26" rx="13" fill="#ffffff" opacity="0.94"/>
<text class="small" x="774.5" y="539" text-anchor="middle">used internally</text>
</svg>
