  <text class="classTitle" x="1250" y="603" text-anchor="middle">JSONObjectExtensions</text>
  <line x1="1085" y1="612" x2="1415" y2="612" stroke="#45A7A1" stroke-width="1.4"/>
  <text class="member" x="1103" y="646">JSONObject.readValueOrNull()</text>
<text class="member" x="1103" y="663">JSONObject.readValueOrNull(key)</text>
</g>
<g id="jsonObject">
  <rect class="classCard" x="1085" y="236" width="330" height="132" rx="8" fill="#F2F5F9" stroke="#9AA8B8"/>
  <text class="stereo" x="1250" y="255" text-anchor="middle">external class</text>
  <text class="classTitle" x="1250" y="283" text-anchor="middle">JSONObject</text>
