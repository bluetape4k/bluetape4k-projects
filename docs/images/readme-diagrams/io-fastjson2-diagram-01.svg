  <text class="classTitle" x="733" y="603" text-anchor="middle">FastjsonSerializer</text>
  <line x1="568" y1="612" x2="898" y2="612" stroke="#58A978" stroke-width="1.4"/>
  <text class="member" x="586" y="646">implements JsonSerializer</text>
<text class="member" x="586" y="663">JSONB bytes + JSON text</text>
</g>
