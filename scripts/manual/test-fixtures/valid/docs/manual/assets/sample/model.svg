<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80" viewBox="0 0 120 80" role="img" aria-labelledby="title desc">
  <title id="title">Sample manual model</title>
  <desc id="desc">A source node points to a manual node.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="4" y="24" width="42" height="30" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="25" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#172554">Source</text>
  <path d="M 48 39 H 72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="75" y="24" width="41" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
  <text x="95.5" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#172554">Manual</text>
</svg>
