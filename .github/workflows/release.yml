name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.12.0). Must match an existing tag.'
        required: true
        type: string
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean
      catalogRef:
        description: 'bluetape4k-dependencies catalog ref to use during release'
        required: false
        default: ''
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/$VERSION" >> "$GITHUB_OUTPUT"

  testcontainers-manifest-contract:
    name: Verify Testcontainers manifest contract
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify image-gate manifest contract without runtime gate
        run: python3 -m unittest scripts/test_testcontainers_image_gate.py -v

  testcontainers-image-gate:
    name: Verify Testcontainers image gate
    needs: [resolve-version, testcontainers-manifest-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache

      - name: Build mock-webflux-server Docker image
        run: ./gradlew :bluetape4k-mock-webflux-server:jibDockerBuild --no-configuration-cache

      - name: Run full image family gate
        env:
          DOCKER_AUTH_CONFIG: ${{ secrets.TESTCONTAINERS_DOCKER_AUTH_CONFIG }}
        run: >-
          python3 scripts/run_testcontainers_image_gate.py
          --scope full
          --report-dir build/reports/testcontainers-image-gate
          --default-platform-id amd64
          --max-attempts 1
          --pull-timeout-seconds 60
          --timeout-minutes 4
          --diagnostic-timeout-seconds 30
          --job-budget-minutes 360

      - name: Verify stable release gate summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_testcontainers_image_gate import verify_release_summary

          summary_path = Path("build/reports/testcontainers-image-gate/summary.json")
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          errors = verify_release_summary(
              summary,
              expected_coverage="52/52",
              platform_id="amd64",
              expected_tag="2.18.0",
              expected_architecture="amd64",
          )
          if errors:
              raise SystemExit("; ".join(errors))
          print(f"coverage={summary['coverage']}")
          print(f"manifest_digest={summary['manifest_digest']}")
          PY

      - name: Upload image gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-testcontainers-image-gate-${{ github.run_id }}-amd64
          path: |
            build/reports/testcontainers-image-gate/*.json
            build/reports/testcontainers-image-gate/summary.md
          if-no-files-found: error
          retention-days: 30

  testcontainers-ignite2-arm64-image-gate:
    name: Verify Testcontainers Ignite2 arm64 image gate
    needs: [resolve-version, testcontainers-manifest-contract]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Run Ignite2 arm64 image gate
        env:
          DOCKER_AUTH_CONFIG: ${{ secrets.TESTCONTAINERS_DOCKER_AUTH_CONFIG }}
        run: >-
          python3 scripts/run_testcontainers_image_gate.py
          --scope family
          --family-id ignite2
          --platform-id arm64
          --require-selection
          --report-dir build/reports/testcontainers-image-gate
          --max-attempts 2
          --pull-timeout-seconds 300
          --timeout-minutes 30
          --diagnostic-timeout-seconds 120
          --job-budget-minutes 90

      - name: Verify Ignite2 arm64 release gate summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.run_testcontainers_image_gate import verify_release_summary

          summary = json.loads(Path("build/reports/testcontainers-image-gate/summary.json").read_text(encoding="utf-8"))
          errors = verify_release_summary(
              summary,
              expected_coverage="1/1",
              platform_id="arm64",
              expected_tag="2.18.0-arm64",
              expected_architecture="arm64",
          )
          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Upload Ignite2 arm64 image gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-testcontainers-image-gate-${{ github.run_id }}-arm64
          path: |
            build/reports/testcontainers-image-gate/*.json
            build/reports/testcontainers-image-gate/summary.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish RELEASE to Maven Central Portal
    needs: [resolve-version, testcontainers-manifest-contract, testcontainers-image-gate, testcontainers-ignite2-arm64-image-gate]
    runs-on: ubuntu-latest
    environment: maven-central-release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.ref }}
          fetch-depth: 0

      - name: Resolve dependencies catalog ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATALOG_REF: ${{ github.event.inputs.catalogRef || '' }}
          REPOSITORY_CATALOG_REF: ${{ vars.BLUETAPE4K_DEPENDENCIES_CATALOG_REF || '' }}
        run: |
          set -euo pipefail
          DEFAULT_CATALOG_REF=$(sed -nE 's/^[[:space:]]*\.orElse\("([^"]+)"\).*/\1/p' settings.gradle.kts | head -1)

          if [[ -z "$DEFAULT_CATALOG_REF" ]]; then
            echo "::error::Could not resolve checked-in bluetape4k-dependencies catalog default"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$INPUT_CATALOG_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REPOSITORY_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$REPOSITORY_CATALOG_REF"
          else
            SELECTED_CATALOG_REF="$DEFAULT_CATALOG_REF"
          fi

          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_REF=$SELECTED_CATALOG_REF" >> "$GITHUB_ENV"
          echo "catalogRef=$SELECTED_CATALOG_REF"

      - name: Verify dependencies catalog aliases
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="$RUNNER_TEMP/bluetape4k-libs.versions.toml"
          catalog_url="https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}/gradle/libs.versions.toml"
          curl -fsSL "$catalog_url" -o "$catalog_file"

          for alias in bluetape4k-bom bluetape4k-exposed-bom exposed-plugin spring-boot4-dependencies jackson jackson3; do
            if ! grep -Eq "^[[:space:]]*${alias}[[:space:]]*=" "$catalog_file"; then
              echo "::error::Catalog ref '${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}' is missing alias: ${alias}"
              exit 1
            fi
          done

      - name: Verify gradle.properties matches tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          BASE=$(grep -E '^baseVersion=' gradle.properties | cut -d= -f2)
          SNAP=$(grep -E '^snapshotVersion=' gradle.properties | cut -d= -f2 || true)
          if [[ "$BASE" != "$VERSION" ]]; then
            echo "::error::gradle.properties baseVersion ($BASE) does not match tag ($VERSION)"
            exit 1
          fi
          if [[ -n "$SNAP" ]]; then
            echo "::error::snapshotVersion must be empty for release. Got: '$SNAP'"
            exit 1
          fi

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Verify JVM release contract
        run: |
          python3 -m unittest scripts/test_jvm_release_contract.py -v
          python3 -m unittest scripts/test_testcontainers_contract.py -v
          ./scripts/check-jvm-release-contract.sh

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          for name in ("SIGNING_KEY_ID", "SIGNING_KEY", "SIGNING_PASSWORD"):
              value = os.environ.get(name, "")
              print(f"{name} set={bool(value)} length={len(value)}")
          PY

      - name: Validate publication metadata
        run: |
          ./gradlew generatePomFileForBluetape4kPublication generateMetadataFileForBluetape4kPublication \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/validate_module_metadata.rb

      - name: Publish to Central Portal
        run: >-
          ./gradlew nmcpPublishAggregationToCentralPortal
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
