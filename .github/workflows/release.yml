name: Publish Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 1.12.0). Must match an existing tag.'
        required: true
        type: string
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean
      catalogRef:
        description: 'bluetape4k-dependencies catalog ref to use during release'
        required: false
        default: ''
        type: string

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: read

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  resolve-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}

      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          TAG_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="$TAG_NAME"
          else
            VERSION="$INPUT_VERSION"
          fi

          RECEIPT="$RUNNER_TEMP/release-target.txt"
          python3 scripts/ci/resolve_release_target.py resolve \
            --version "$VERSION" \
            --event-name "$EVENT_NAME" \
            --event-sha "$EVENT_SHA" > "$RECEIPT"
          cat "$RECEIPT" >> "$GITHUB_OUTPUT"

          TARGET_SHA=$(sed -n 's/^target_sha=//p' "$RECEIPT")
          {
            echo "### Stable release target"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Tag: \`refs/tags/$VERSION\`"
            echo "- Source commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-full-nightly:
    name: Verify exact-head Full Nightly
    needs: resolve-version
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.nightly.outputs.head_sha }}
      run_id: ${{ steps.nightly.outputs.run_id }}
      run_url: ${{ steps.nightly.outputs.run_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-version.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify immutable release target
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-version.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 scripts/ci/resolve_release_target.py verify \
            --version "$VERSION" \
            --expected-sha "$TARGET_SHA"

      - name: Validate matching Full Nightly
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          run_pages="$RUNNER_TEMP/nightly-runs.json"
          run_json="$RUNNER_TEMP/nightly-run.json"
          jobs_json="$RUNNER_TEMP/nightly-jobs.json"
          validation_output="$RUNNER_TEMP/nightly-validation.txt"

          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-tests.yml/runs?branch=develop&status=completed&per_page=100" \
            > "$run_pages"
          NIGHTLY_RUN_ID="$(jq -r --arg sha "$TARGET_SHA" '
            [.[].workflow_runs[]
              | select(
                  .head_sha == $sha
                  and .status == "completed"
                  and .conclusion == "success"
                  and .path == ".github/workflows/nightly-tests.yml"
                )]
            | sort_by(.run_number)
            | last
            | .id // empty
          ' "$run_pages")"

          if [[ -z "$NIGHTLY_RUN_ID" ]]; then
            echo "::error::No successful Full Nightly candidate found for tag SHA $TARGET_SHA"
            exit 1
          fi

          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${NIGHTLY_RUN_ID}" > "$run_json"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${NIGHTLY_RUN_ID}/jobs?per_page=100" \
            > "$jobs_json"

          python3 scripts/validate_nightly_matrix.py \
            "$run_json" \
            "$jobs_json" \
            "$TARGET_SHA" \
            scripts/nightly_matrix_contract.json \
            | tee "$validation_output"
          if ! grep -qx 'publish_eligible=true' "$validation_output"; then
            echo "::error::Full Nightly validation rejected run $NIGHTLY_RUN_ID"
            exit 1
          fi

          NIGHTLY_RUN_URL="$(jq -r '.html_url' "$run_json")"
          {
            echo "head_sha=$TARGET_SHA"
            echo "run_id=$NIGHTLY_RUN_ID"
            echo "run_url=$NIGHTLY_RUN_URL"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Stable Release Full Nightly attestation"
            echo "- tag SHA: \`$TARGET_SHA\`"
            echo "- Nightly run: [$NIGHTLY_RUN_ID]($NIGHTLY_RUN_URL)"
            echo "- publish eligible: \`true\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish RELEASE to Maven Central Portal
    needs: [resolve-version, verify-full-nightly]
    runs-on: ubuntu-latest
    environment: maven-central-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve-version.outputs.target_sha }}
          fetch-depth: 0

      - name: Verify immutable release target
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET_SHA: ${{ needs.resolve-version.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          python3 scripts/ci/resolve_release_target.py verify \
            --version "$VERSION" \
            --expected-sha "$TARGET_SHA"

      - name: Resolve dependencies catalog ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CATALOG_REF: ${{ github.event.inputs.catalogRef || '' }}
          REPOSITORY_CATALOG_REF: ${{ vars.BLUETAPE4K_DEPENDENCIES_CATALOG_REF || '' }}
        run: |
          set -euo pipefail
          DEFAULT_CATALOG_REF=$(sed -nE 's/^[[:space:]]*\.orElse\("([^"]+)"\).*/\1/p' settings.gradle.kts | head -1)

          if [[ -z "$DEFAULT_CATALOG_REF" ]]; then
            echo "::error::Could not resolve checked-in bluetape4k-dependencies catalog default"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$INPUT_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$INPUT_CATALOG_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REPOSITORY_CATALOG_REF" ]]; then
            SELECTED_CATALOG_REF="$REPOSITORY_CATALOG_REF"
          else
            SELECTED_CATALOG_REF="$DEFAULT_CATALOG_REF"
          fi

          echo "BLUETAPE4K_DEPENDENCIES_CATALOG_REF=$SELECTED_CATALOG_REF" >> "$GITHUB_ENV"
          echo "catalogRef=$SELECTED_CATALOG_REF"

      - name: Verify dependencies catalog aliases
        shell: bash
        run: |
          set -euo pipefail
          catalog_file="$RUNNER_TEMP/bluetape4k-libs.versions.toml"
          catalog_url="https://raw.githubusercontent.com/bluetape4k/bluetape4k-dependencies/${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}/gradle/libs.versions.toml"
          curl -fsSL "$catalog_url" -o "$catalog_file"

          for alias in bluetape4k-bom bluetape4k-exposed-bom exposed-plugin spring-boot4-dependencies jackson jackson3; do
            if ! grep -Eq "^[[:space:]]*${alias}[[:space:]]*=" "$catalog_file"; then
              echo "::error::Catalog ref '${BLUETAPE4K_DEPENDENCIES_CATALOG_REF}' is missing alias: ${alias}"
              exit 1
            fi
          done

      - name: Verify gradle.properties matches tag
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          BASE=$(grep -E '^baseVersion=' gradle.properties | cut -d= -f2)
          SNAP=$(grep -E '^snapshotVersion=' gradle.properties | cut -d= -f2 || true)
          if [[ "$BASE" != "$VERSION" ]]; then
            echo "::error::gradle.properties baseVersion ($BASE) does not match tag ($VERSION)"
            exit 1
          fi
          if [[ -n "$SNAP" ]]; then
            echo "::error::snapshotVersion must be empty for release. Got: '$SNAP'"
            exit 1
          fi

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Verify JVM release contract
        run: |
          python3 -m unittest scripts/test_jvm_release_contract.py -v
          python3 -m unittest scripts/test_testcontainers_contract.py -v
          ./scripts/check-jvm-release-contract.sh

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          for name in ("SIGNING_KEY_ID", "SIGNING_KEY", "SIGNING_PASSWORD"):
              value = os.environ.get(name, "")
              print(f"{name} set={bool(value)} length={len(value)}")
          PY

      - name: Validate publication metadata
        run: |
          ./gradlew generatePomFileForBluetape4kPublication checkPomFileForBluetape4kPublication generateMetadataFileForBluetape4kPublication \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/validate_module_metadata.rb

      - name: Publish to Central Portal
        run: >-
          ./gradlew nmcpPublishAggregationToCentralPortal
          --no-daemon
          --no-configuration-cache
          --no-build-cache
          --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
