name: Nightly Tests (Testcontainers)

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Exposed JDBC/R2DBC (PostgreSQL) ──────────────────────────────────────
  test-exposed-db:
    name: Test / Exposed DB (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed JDBC/R2DBC modules
        run: |
          ./gradlew \
            :bluetape4k-exposed-jdbc:test \
            :bluetape4k-exposed-r2dbc:test \
            :bluetape4k-exposed-postgresql:test \
            :bluetape4k-exposed-mysql8:test \
            :bluetape4k-exposed-trino:test \
            :bluetape4k-exposed-jdbc-tests:test \
            :bluetape4k-exposed-r2dbc-tests:test \
            :bluetape4k-exposed-jdbc-caffeine:test \
            :bluetape4k-exposed-jdbc-lettuce:test \
            :bluetape4k-exposed-jdbc-redisson:test \
            :bluetape4k-exposed-r2dbc-lettuce:test \
            :bluetape4k-exposed-r2dbc-redisson:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-exposed-db
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── Infra (Lettuce / Redisson) ────────────────────────────────────────────
  test-infra:
    name: Test / Infra (Lettuce, Redisson)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test infra modules
        run: |
          ./gradlew \
            :bluetape4k-lettuce:test \
            :bluetape4k-redisson:test \
            :bluetape4k-jackson2:test \
            :bluetape4k-bucket4j:test \
            :bluetape4k-cache-hazelcast:test \
            :bluetape4k-cache-lettuce:test \
            :bluetape4k-cache-redisson:test \
            :bluetape4k-kafka:test \
            :bluetape4k-micrometer:test \
            :bluetape4k-resilience4j:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── Data (Cassandra / MongoDB / Hibernate / JDBC / R2DBC) ────────────────
  test-data:
    name: Test / Data (Cassandra, MongoDB, Hibernate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test data modules
        run: |
          ./gradlew \
            :bluetape4k-cassandra:test \
            :bluetape4k-mongodb:test \
            :bluetape4k-hibernate:test \
            :bluetape4k-hibernate-reactive:test \
            :bluetape4k-hibernate-cache-lettuce:test \
            :bluetape4k-jdbc:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-data
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── I/O heavy (WireMock / MockWebServer / Testcontainers) ────────────────
  test-io-heavy:
    name: Test / IO Heavy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io-heavy modules
        run: |
          ./gradlew \
            :bluetape4k-feign:test \
            :bluetape4k-retrofit2:test \
            :bluetape4k-http:test \
            :bluetape4k-protobuf:test \
            :bluetape4k-tink:test \
            :bluetape4k-vertx:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-io-heavy
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── AWS (LocalStack) ─────────────────────────────────────────────────────
  test-aws:
    name: Test / AWS (LocalStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test aws modules
        run: |
          ./gradlew \
            :bluetape4k-aws:test \
            :bluetape4k-aws-kotlin:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-aws
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── Spring Boot 3 (Cassandra / MongoDB / R2DBC / Redis / Hibernate) ──────
  test-spring-boot3:
    name: Test / Spring Boot 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test spring-boot3 modules
        run: |
          ./gradlew \
            :bluetape4k-spring-boot3-core:test \
            :bluetape4k-spring-boot3-cassandra:test \
            :bluetape4k-spring-boot3-mongodb:test \
            :bluetape4k-spring-boot3-r2dbc:test \
            :bluetape4k-spring-boot3-redis:test \
            :bluetape4k-spring-boot3-hibernate-lettuce:test \
            :bluetape4k-spring-boot3-batch-exposed:test \
            :bluetape4k-spring-boot3-exposed-r2dbc:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-spring-boot3
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── Spring Boot 4 (Cassandra / MongoDB / R2DBC / Redis / Hibernate) ──────
  test-spring-boot4:
    name: Test / Spring Boot 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test spring-boot4 modules
        run: |
          ./gradlew \
            :bluetape4k-spring-boot4-core:test \
            :bluetape4k-spring-boot4-cassandra:test \
            :bluetape4k-spring-boot4-mongodb:test \
            :bluetape4k-spring-boot4-r2dbc:test \
            :bluetape4k-spring-boot4-redis:test \
            :bluetape4k-spring-boot4-hibernate-lettuce:test \
            :bluetape4k-spring-boot4-batch-exposed:test \
            :bluetape4k-spring-boot4-exposed-r2dbc:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-spring-boot4
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── Misc heavy (Batch / Science / JWT / Testcontainers / Timefold) ───────
  test-misc-heavy:
    name: Test / Misc Heavy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test misc-heavy modules
        run: |
          ./gradlew \
            :bluetape4k-batch:test \
            :bluetape4k-science:test \
            :bluetape4k-jwt:test \
            :bluetape4k-testcontainers:test \
            :bluetape4k-exposed-bigquery:test \
            :bluetape4k-timefold-solver-persistence-exposed:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-misc-heavy
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

  # ── 결과 집계 ─────────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs: [test-exposed-db, test-infra, test-data, test-io-heavy, test-aws, test-spring-boot3, test-spring-boot4, test-misc-heavy]
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly tests failed"
            exit 1
          fi
          echo "Nightly tests passed"
