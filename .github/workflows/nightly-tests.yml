      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-infra-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
