name: Nightly Tests (Testcontainers)

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 빌드 (컴파일 only) ───────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # ── Core 모듈 테스트 ──────────────────────────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test bluetape4k core modules
        run: |
          ./gradlew \
            :bluetape4k-core:test \
            :bluetape4k-coroutines:test \
            :bluetape4k-logging:test \
            --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-core
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── I/O 모듈 테스트 ───────────────────────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules (pure JVM)
        run: |
          ./gradlew \
            :bluetape4k-io:test \
            :bluetape4k-okio:test \
            :bluetape4k-csv:test \
            :bluetape4k-avro:test \
            :bluetape4k-json:test \
            :bluetape4k-fastjson2:test \
            :bluetape4k-jackson3:test \
            :bluetape4k-netty:test \
            :bluetape4k-grpc:test \
            --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-avro:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-fastjson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-netty:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-io
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Utils 모듈 테스트 ─────────────────────────────────────────────────────
  test-utils:
    name: Test / Utils
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
