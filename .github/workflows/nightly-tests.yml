name: Nightly Tests (Testcontainers)

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 빌드 (컴파일 only) ───────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Resolve mock server runtime dependencies (pre-cache for Jib)
        run: >
          ./gradlew
          :bluetape4k-mock-web-server:dependencies
          :bluetape4k-mock-webflux-server:dependencies
          --configuration runtimeClasspath
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # ── Detekt 정적 분석 ──────────────────────────────────────────────────────
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Detekt static analysis
        run: ./gradlew detekt --parallel

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 14

  # ── Core 모듈 테스트 ──────────────────────────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test bluetape4k core modules
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-core:test \
              :bluetape4k-coroutines:test \
              :bluetape4k-logging:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-core
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── I/O 모듈 테스트 ───────────────────────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-io:test \
              :bluetape4k-okio:test \
              :bluetape4k-csv:test \
              :bluetape4k-avro:test \
              :bluetape4k-json:test \
              :bluetape4k-fastjson2:test \
                :bluetape4k-jackson2:test \
              :bluetape4k-jackson3:test \
              :bluetape4k-netty:test \
              :bluetape4k-grpc:test \
                :bluetape4k-protobuf:test \
                :bluetape4k-tink:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-avro:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-fastjson2:koverXmlReport \
              :bluetape4k-jackson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-netty:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
              :bluetape4k-protobuf:koverXmlReport \
              :bluetape4k-tink:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-io
          path: '**/build/reports/kover/'
          retention-days: 14

    # ── IO HTTP 클라이언트 모듈 테스트 (Testcontainers) ──────────────────────
  test-io-http:
      name: Test / IO HTTP
      runs-on: ubuntu-latest
      needs: build
      steps:
          -   uses: actions/checkout@v4

          -   uses: actions/setup-java@v4
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}

          -   uses: gradle/actions/setup-gradle@v4
              with:
                  gradle-version: wrapper
                  cache-read-only: true

          -   name: Build mock-web-server Docker image
              run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
              env:
                  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

          -   name: Test io http client modules
              uses: nick-fields/retry@v3
              with:
                timeout_minutes: 60
                max_attempts: 3
                shell: bash
                command: |
                    ./gradlew \
                      :bluetape4k-feign:test \
                      :bluetape4k-http:test \
                      :bluetape4k-retrofit2:test \
                      :bluetape4k-vertx:test \
                      --parallel
              env:
                  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

          -   name: Generate Kover XML report
              if: always()
              run: |
                  ./gradlew \
                    :bluetape4k-feign:koverXmlReport \
                    :bluetape4k-http:koverXmlReport \
                    :bluetape4k-retrofit2:koverXmlReport \
                    :bluetape4k-vertx:koverXmlReport \
                    --parallel
              continue-on-error: true

          -   name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-test-results-io-http
                  path: '**/build/test-results/test/*.xml'
                  retention-days: 14

          -   name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-coverage-io-http
                  path: '**/build/reports/kover/'
                  retention-days: 14

  # ── Utils 모듈 테스트 ─────────────────────────────────────────────────────
  test-utils:
    name: Test / Utils
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test utils modules
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-idgenerators:test \
              :bluetape4k-javatimes:test \
              :bluetape4k-math:test \
              :bluetape4k-money:test \
              :bluetape4k-measured:test \
              :bluetape4k-assertions:test \
              :bluetape4k-junit5:test \
              :bluetape4k-states:test \
              :bluetape4k-workflow:test \
              :bluetape4k-mutiny:test \
              :bluetape4k-rule-engine:test \
              :bluetape4k-geo:test \
              :bluetape4k-science:test \
              -PincludeTags=slow-netcdf \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Duser.language=en -Duser.country=US"
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-idgenerators:koverXmlReport \
            :bluetape4k-javatimes:koverXmlReport \
            :bluetape4k-math:koverXmlReport \
            :bluetape4k-money:koverXmlReport \
            :bluetape4k-measured:koverXmlReport \
            :bluetape4k-assertions:koverXmlReport \
            :bluetape4k-junit5:koverXmlReport \
            :bluetape4k-states:koverXmlReport \
            :bluetape4k-workflow:koverXmlReport \
            :bluetape4k-mutiny:koverXmlReport \
            :bluetape4k-rule-engine:koverXmlReport \
            :bluetape4k-geo:koverXmlReport \
            :bluetape4k-science:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-utils
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-utils
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Misc 모듈 테스트 ──────────────────────────────────────────────────────
  test-misc:
    name: Test / Misc
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test misc modules (no Docker)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-virtualthread-api:test \
              :bluetape4k-virtualthread-jdk21:test \
              :bluetape4k-virtualthread-jdk25:test \
              :bluetape4k-cache-core:test \
              :bluetape4k-opentelemetry:test \
              :bluetape4k-mock-web-server:test \
              :bluetape4k-mock-webflux-server:test \
              :bluetape4k-r2dbc:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-virtualthread-api:koverXmlReport \
            :bluetape4k-virtualthread-jdk21:koverXmlReport \
            :bluetape4k-virtualthread-jdk25:koverXmlReport \
            :bluetape4k-cache-core:koverXmlReport \
            :bluetape4k-opentelemetry:koverXmlReport \
            :bluetape4k-mock-web-server:koverXmlReport \
            :bluetape4k-mock-webflux-server:koverXmlReport \
            :bluetape4k-r2dbc:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-misc
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-misc
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 
  
  # ── Infra 모듈 테스트 (Testcontainers) — Matrix 병렬 ─────────────────────
  # 3 groups run in parallel on separate runners
  test-infra:
    name: Test / Infra (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: redis
            test_tasks: >-
              :bluetape4k-redis:test
              :bluetape4k-redisson:test
              :bluetape4k-lettuce:test
              :bluetape4k-cache-lettuce:test
              :bluetape4k-cache-redisson:test
            kover_tasks: >-
              :bluetape4k-redis:koverXmlReport
              :bluetape4k-redisson:koverXmlReport
              :bluetape4k-lettuce:koverXmlReport
              :bluetape4k-cache-lettuce:koverXmlReport
              :bluetape4k-cache-redisson:koverXmlReport
            needs_mock_server: false
          - group: kafka-resilience
            test_tasks: >-
              :bluetape4k-kafka:test
              :bluetape4k-kafka4:test
              :bluetape4k-resilience4j:test
              :bluetape4k-bucket4j:test
            kover_tasks: >-
              :bluetape4k-kafka:koverXmlReport
              :bluetape4k-kafka4:koverXmlReport
              :bluetape4k-resilience4j:koverXmlReport
              :bluetape4k-bucket4j:koverXmlReport
            needs_mock_server: false
          - group: cache-misc
            test_tasks: >-
              :bluetape4k-micrometer:test
              :bluetape4k-cache:test
              :bluetape4k-cache-hazelcast:test
            kover_tasks: >-
              :bluetape4k-micrometer:koverXmlReport
              :bluetape4k-cache:koverXmlReport
              :bluetape4k-cache-hazelcast:koverXmlReport
            needs_mock_server: true
          -   group: search-messaging
              test_tasks: >-
                  :bluetape4k-elasticsearch:test
                  :bluetape4k-nats:test
              kover_tasks: >-
                  :bluetape4k-elasticsearch:koverXmlReport
                  :bluetape4k-nats:koverXmlReport
              needs_mock_server: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        if: ${{ matrix.needs_mock_server }}
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test infra modules (${{ matrix.group }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            read -ra tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_TASKS: ${{ matrix.test_tasks }}

      - name: Generate Kover XML report
        if: ${{ always() && matrix.kover_tasks != '' }}
        env:
          KOVER_TASKS: ${{ matrix.kover_tasks }}
        run: |
          read -ra tasks <<< "$KOVER_TASKS"
          ./gradlew "${tasks[@]}" --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-infra-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-infra-${{ matrix.group }}
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Data 모듈 테스트 (Testcontainers) — Matrix 병렬 ──────────────────────
  # 2 groups run in parallel on separate runners
  test-data:
    name: Test / Data (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rdb
            test_tasks: >-
              :bluetape4k-jdbc:test
              :bluetape4k-hibernate:test
              :bluetape4k-hibernate-cache-lettuce:test
              :bluetape4k-hibernate-reactive:test
            kover_tasks: >-
              :bluetape4k-jdbc:koverXmlReport
              :bluetape4k-hibernate:koverXmlReport
              :bluetape4k-hibernate-cache-lettuce:koverXmlReport
              :bluetape4k-hibernate-reactive:koverXmlReport
          - group: nosql
            test_tasks: >-
              :bluetape4k-mongodb:test
              :bluetape4k-cassandra:test
                :bluetape4k-jwt:test
            kover_tasks: >-
              :bluetape4k-mongodb:koverXmlReport
              :bluetape4k-cassandra:koverXmlReport
                :bluetape4k-jwt:koverXmlReport
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test data modules (${{ matrix.group }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            read -ra tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_TASKS: ${{ matrix.test_tasks }}

      - name: Generate Kover XML report
        if: ${{ always() && matrix.kover_tasks != '' }}
        env:
          KOVER_TASKS: ${{ matrix.kover_tasks }}
        run: |
          read -ra tasks <<< "$KOVER_TASKS"
          ./gradlew "${tasks[@]}" --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-data-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-data-${{ matrix.group }}
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Spring Boot 3 Docker 테스트 — Matrix 병렬 ───────────────────────────
  # 3 groups run in parallel on separate runners
  test-spring3-docker:
    name: Test / Spring Boot 3 (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-redis-r2dbc
            test_tasks: >-
              :bluetape4k-spring-boot3-core:test
              :bluetape4k-spring-boot3-redis:test
              :bluetape4k-spring-boot3-r2dbc:test
            kover_tasks: >-
              :bluetape4k-spring-boot3-core:koverXmlReport
              :bluetape4k-spring-boot3-redis:koverXmlReport
              :bluetape4k-spring-boot3-r2dbc:koverXmlReport
          - group: batch-nosql
            test_tasks: >-
              :bluetape4k-spring-boot3-mongodb:test
              :bluetape4k-spring-boot3-cassandra:test
              :bluetape4k-spring-boot3-hibernate-lettuce:test
            kover_tasks: >-
              :bluetape4k-spring-boot3-mongodb:koverXmlReport
              :bluetape4k-spring-boot3-cassandra:koverXmlReport
              :bluetape4k-spring-boot3-hibernate-lettuce:koverXmlReport
          - group: demos
            test_tasks: >-
              :bluetape4k-spring-boot3-cassandra-demo:test
              :bluetape4k-spring-boot3-hibernate-lettuce-demo:test
            kover_tasks: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test spring-boot3 modules (${{ matrix.group }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            read -ra tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_TASKS: ${{ matrix.test_tasks }}

      - name: Generate Kover XML report
        if: ${{ always() && matrix.kover_tasks != '' }}
        env:
          KOVER_TASKS: ${{ matrix.kover_tasks }}
        run: |
          read -ra tasks <<< "$KOVER_TASKS"
          ./gradlew "${tasks[@]}" --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-spring3-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-spring3-${{ matrix.group }}
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Spring Boot 4 Docker 테스트 — Matrix 병렬 ───────────────────────────
  # 3 groups run in parallel on separate runners
  test-spring4-docker:
    name: Test / Spring Boot 4 (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core-redis-r2dbc
            test_tasks: >-
              :bluetape4k-spring-boot4-core:test
              :bluetape4k-spring-boot4-redis:test
              :bluetape4k-spring-boot4-r2dbc:test
            kover_tasks: >-
              :bluetape4k-spring-boot4-core:koverXmlReport
              :bluetape4k-spring-boot4-redis:koverXmlReport
              :bluetape4k-spring-boot4-r2dbc:koverXmlReport
          - group: batch-nosql
            test_tasks: >-
              :bluetape4k-spring-boot4-mongodb:test
              :bluetape4k-spring-boot4-cassandra:test
              :bluetape4k-spring-boot4-hibernate-lettuce:test
            kover_tasks: >-
              :bluetape4k-spring-boot4-mongodb:koverXmlReport
              :bluetape4k-spring-boot4-cassandra:koverXmlReport
              :bluetape4k-spring-boot4-hibernate-lettuce:koverXmlReport
          - group: demos
            test_tasks: >-
              :bluetape4k-spring-boot4-cassandra-demo:test
              :bluetape4k-spring-boot4-hibernate-lettuce-demo:test
            kover_tasks: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build mock-webflux-server Docker image
        run: ./gradlew :bluetape4k-mock-webflux-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test spring-boot4 modules (${{ matrix.group }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            read -ra tasks <<< "$TEST_TASKS"
            ./gradlew "${tasks[@]}"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_TASKS: ${{ matrix.test_tasks }}

      - name: Generate Kover XML report
        if: ${{ always() && matrix.kover_tasks != '' }}
        env:
          KOVER_TASKS: ${{ matrix.kover_tasks }}
        run: |
          read -ra tasks <<< "$KOVER_TASKS"
          ./gradlew "${tasks[@]}" --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-spring4-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-spring4-${{ matrix.group }}
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── Testcontainers (nightly 전용) — Matrix 병렬 ──────────────────────────
  # 5 groups run in parallel; test packages filtered via --tests per group
  test-testcontainers:
    name: Test / Testcontainers (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: database
            test_packages: io.bluetape4k.testcontainers.database
            needs_mock_servers: false
          - group: storage
            test_packages: io.bluetape4k.testcontainers.storage
            needs_mock_servers: false
          - group: mq
            test_packages: io.bluetape4k.testcontainers.mq
            needs_mock_servers: false
          - group: infra-http
            test_packages: >-
              io.bluetape4k.testcontainers.infra
              io.bluetape4k.testcontainers.http
            needs_mock_servers: true
          - group: graphdb-misc
            test_packages: >-
              io.bluetape4k.testcontainers.graphdb
              io.bluetape4k.testcontainers
            needs_mock_servers: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        if: ${{ matrix.needs_mock_servers }}
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build mock-webflux-server Docker image
        if: ${{ matrix.needs_mock_servers }}
        run: ./gradlew :bluetape4k-mock-webflux-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test testcontainers (${{ matrix.group }})
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            read -ra pkgs <<< "$TEST_PACKAGES"
            tests_args=()
            for pkg in "${pkgs[@]}"; do
              tests_args+=(--tests "${pkg}.*")
            done
            ./gradlew :bluetape4k-testcontainers:test "${tests_args[@]}"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_PACKAGES: ${{ matrix.test_packages }}

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-testcontainers:koverXmlReport
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-testcontainers-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-testcontainers-${{ matrix.group }}
          path: '**/build/reports/kover/'
          retention-days: 14

  # ── 커버리지 집계 ─────────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs:
      - build
      - detekt
      - test-core
      - test-io
      - test-io-http
      - test-utils
      - test-misc
      - test-infra
      - test-data
      - test-spring3-docker
      - test-spring4-docker
      - test-testcontainers
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # ── 결과 집계 ─────────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs:
      - build
      - detekt
      - test-core
      - test-io
      - test-io-http
      - test-utils
      - test-misc
      - test-infra
      - test-data
      - test-spring3-docker
      - test-spring4-docker
      - test-testcontainers
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly tests failed"
            exit 1
          fi
          echo "Nightly tests passed"
