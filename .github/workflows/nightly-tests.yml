          path: 'build/*/reports/kover/'
          retention-days: 14

  # ── 커버리지 집계 ─────────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test-exposed-db, test-infra, test-data, test-io-heavy, test-aws, test-spring-boot3, test-spring-boot4, test-misc, test-testcontainers]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nightly-coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-all
          path: coverage-artifacts/
          retention-days: 14

  # ── 결과 집계 ─────────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs: [test-exposed-db, test-infra, test-data, test-io-heavy, test-aws, test-spring-boot3, test-spring-boot4, test-misc, test-testcontainers, coverage-report]
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly tests failed"
            exit 1
          fi
          echo "Nightly tests passed"
