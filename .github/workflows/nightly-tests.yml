name: Nightly Tests (Testcontainers)

on:
  schedule:
    - cron: '0 18 * * *'  # 매일 03:00 KST (18:00 UTC)
  workflow_dispatch:

concurrency:
  group: nightly-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── Exposed JDBC/R2DBC (PostgreSQL) ──────────────────────────────────────
  test-exposed-db:
    name: Test / Exposed DB (PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test exposed JDBC/R2DBC modules
        run: |
          ./gradlew \
            :bluetape4k-exposed-jdbc:test \
            :bluetape4k-exposed-r2dbc:test \
            :bluetape4k-exposed-postgresql:test \
            :bluetape4k-exposed-mysql8:test \
            :bluetape4k-exposed-trino:test \
            :bluetape4k-exposed-jdbc-tests:test \
            :bluetape4k-exposed-r2dbc-tests:test \
            :bluetape4k-exposed-jdbc-caffeine:test \
            :bluetape4k-exposed-jdbc-lettuce:test \
            :bluetape4k-exposed-jdbc-redisson:test \
            :bluetape4k-exposed-r2dbc-lettuce:test \
            :bluetape4k-exposed-r2dbc-redisson:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-exposed-jdbc:koverXmlReport \
            :bluetape4k-exposed-r2dbc:koverXmlReport \
            :bluetape4k-exposed-postgresql:koverXmlReport \
            :bluetape4k-exposed-jdbc-tests:koverXmlReport \
            :bluetape4k-exposed-r2dbc-tests:koverXmlReport \
            :bluetape4k-exposed-jdbc-caffeine:koverXmlReport \
            :bluetape4k-exposed-jdbc-lettuce:koverXmlReport \
            :bluetape4k-exposed-jdbc-redisson:koverXmlReport \
            :bluetape4k-exposed-r2dbc-lettuce:koverXmlReport \
            :bluetape4k-exposed-r2dbc-redisson:koverXmlReport \
            --no-daemon --no-configuration-cache
        continue-on-error: true
        env:
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-exposed-db
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-exposed-db
          path: 'build/*/reports/kover/'
          retention-days: 14

  # ── Infra (Lettuce / Redisson) ────────────────────────────────────────────
  test-infra:
    name: Test / Infra (Lettuce, Redisson)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: |
          ./gradlew :bluetape4k-mock-web-server:jibDockerBuild \
            --no-daemon --no-configuration-cache
        env:
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Test infra modules
        run: |
          ./gradlew \
            :bluetape4k-lettuce:test \
            :bluetape4k-redisson:test \
            :bluetape4k-jackson2:test \
            :bluetape4k-bucket4j:test \
            :bluetape4k-cache-hazelcast:test \
            :bluetape4k-cache-lettuce:test \
            :bluetape4k-cache-redisson:test \
            :bluetape4k-kafka:test \
            :bluetape4k-micrometer:test \
            :bluetape4k-resilience4j:test \
            --no-daemon --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-lettuce:koverXmlReport \
            :bluetape4k-redisson:koverXmlReport \
            :bluetape4k-jackson2:koverXmlReport \
            :bluetape4k-bucket4j:koverXmlReport \
            :bluetape4k-cache-hazelcast:koverXmlReport \
            :bluetape4k-cache-lettuce:koverXmlReport \
            :bluetape4k-cache-redisson:koverXmlReport \
            :bluetape4k-kafka:koverXmlReport \
            :bluetape4k-micrometer:koverXmlReport \
            :bluetape4k-resilience4j:koverXmlReport \
            --no-daemon --no-configuration-cache
        continue-on-error: true
        env:
          DOCKER_HOST: "unix:///var/run/docker.sock"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage-infra
          path: 'build/*/reports/kover/'
          retention-days: 14

