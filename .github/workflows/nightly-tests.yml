  # ── Testcontainers (nightly 전용) — Matrix 병렬 ──────────────────────────
  # Heavy Docker families are split into narrower shards so one slow container
  # does not hold the full nightly critical path.
  test-testcontainers:
    name: Test / Testcontainers (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [build, plan]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.testcontainers_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        if: ${{ matrix.needs_mock_servers }}
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build mock-webflux-server Docker image
        if: ${{ matrix.needs_mock_servers }}
        run: ./gradlew :bluetape4k-mock-webflux-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Pre-pull Memgraph Docker image
        if: ${{ matrix.group == 'graphdb-memgraph' }}
        run: timeout --kill-after=60s 10m docker pull memgraph/memgraph:3.12.0

      - name: Test testcontainers (${{ matrix.group }})
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: ${{ matrix.timeout_minutes }}
          max_attempts: ${{ matrix.max_attempts }}
          shell: bash
          command: |
            read -ra patterns <<< "$TEST_PATTERNS"
            tests_args=()
            for pattern in "${patterns[@]}"; do
              tests_args+=(--tests "${pattern}")
            done
            if [[ "$NEEDS_MOCK_SERVERS" != "true" ]]; then
              tests_args+=(
                -x :bluetape4k-mock-web-server:jibDockerBuild
                -x :bluetape4k-mock-webflux-server:jibDockerBuild
              )
            fi
            timeout --kill-after=60s "${TEST_TIMEOUT_MINUTES}m" \
              ./gradlew :bluetape4k-testcontainers:test "${tests_args[@]}" --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          TEST_PATTERNS: ${{ matrix.test_patterns }}
          TEST_TIMEOUT_MINUTES: ${{ matrix.timeout_minutes }}
          NEEDS_MOCK_SERVERS: ${{ matrix.needs_mock_servers }}

      - name: Generate Kover XML report
        if: ${{ always() && needs.plan.outputs.run_testcontainers_coverage == 'true' }}
        timeout-minutes: 10
        run: ./gradlew :bluetape4k-testcontainers:koverXmlReport -x :bluetape4k-testcontainers:test --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-testcontainers-${{ matrix.group }}
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: ${{ always() && needs.plan.outputs.run_testcontainers_coverage == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-testcontainers-${{ matrix.group }}
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 14

  # ── Testcontainers Spring bridge (nightly JVM-only contract) ─────────────
  test-testcontainers-spring:
    name: Test / Testcontainers Spring bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep the JVM-only bridge after the Docker-backed Testcontainers lane so
    # repository-level Testcontainers verification remains sequential.
    needs: [test-testcontainers, plan]
    if: ${{ needs.plan.outputs.scope == 'full' || needs.plan.outputs.scope == 'testcontainers' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Testcontainers Spring bridge
        run: ./gradlew :bluetape4k-testcontainers-spring:test --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: ${{ always() && needs.plan.outputs.run_testcontainers_coverage == 'true' }}
        run: ./gradlew :bluetape4k-testcontainers-spring:koverXmlReport --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-testcontainers-spring
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: ${{ always() && needs.plan.outputs.run_testcontainers_coverage == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-testcontainers-spring
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 14

  # ── 커버리지 집계 ─────────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
      - detekt
      - test-core
      - test-io
      - test-io-http
      - test-ktor
      - test-utils
      - test-misc
      - test-infra
      - test-data
      - test-spring-docker
      - test-testcontainers
      - test-testcontainers-spring
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Prepare expected coverage manifest
        id: expected-coverage
        env:
          EXPECTED_COVERAGE_JOBS: |
            test-core=${{ needs.test-core.result }}
            test-io=${{ needs.test-io.result }}
            test-io-http=${{ needs.test-io-http.result }}
            test-ktor=${{ needs.test-ktor.result }}
            test-utils=${{ needs.test-utils.result }}
            test-misc=${{ needs.test-misc.result }}
            test-infra=${{ needs.test-infra.result }}
            test-data=${{ needs.test-data.result }}
            test-spring-docker=${{ needs.test-spring-docker.result }}
            test-testcontainers=${{ needs.plan.outputs.run_testcontainers_coverage == 'true' && needs.test-testcontainers.result || 'skipped' }}
            test-testcontainers-spring=${{ needs.plan.outputs.run_testcontainers_coverage == 'true' && needs.test-testcontainers-spring.result || 'skipped' }}
        run: |
          mkdir -p coverage-artifacts
          printf '%s\n' "$EXPECTED_COVERAGE_JOBS" > coverage-artifacts/expected-jobs.manifest
          : > coverage-artifacts/expected-modules.manifest
          if grep -q '^test-infra=success$' coverage-artifacts/expected-jobs.manifest; then
            printf '%s\n' \
              'infra/redis' \
              'infra/redisson' \
              'infra/lettuce' \
              'cache/cache-lettuce' \
              'cache/cache-redisson' \
              'infra/kafka' \
              'infra/kafka4' \
              'infra/resilience4j' \
              'infra/bucket4j' \
              'infra/micrometer' \
              'cache/cache-hazelcast' \
              'infra/elasticsearch' \
              'infra/nats' \
              > coverage-artifacts/expected-modules.manifest
          fi
          if grep -q '=success$' coverage-artifacts/expected-jobs.manifest; then
            echo 'has_expected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_expected=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download all coverage artifacts
        id: download-coverage
        if: steps.expected-coverage.outputs.has_expected == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: nightly-coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Aggregate Kover coverage summary
        if: always()
        env:
          COVERAGE_DOWNLOAD_OUTCOME: ${{ steps.download-coverage.outcome }}
        run: |
          expected_module_args=()
          while IFS= read -r module; do
            if [ -n "$module" ]; then
              expected_module_args+=(--expected-module "$module")
            fi
          done < coverage-artifacts/expected-modules.manifest
          python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts \
            --expected-manifest coverage-artifacts/expected-jobs.manifest \
            --download-outcome "$COVERAGE_DOWNLOAD_OUTCOME" \
            "${expected_module_args[@]}"

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggregate-nightly-coverage-all
          path: coverage-artifacts/
          if-no-files-found: error
          retention-days: 14

  # ── 결과 집계 ─────────────────────────────────────────────────────────────
  nightly-status:
    name: Nightly Status
    runs-on: ubuntu-latest
    needs:
      - plan
      - build
      - detekt
      - test-core
      - test-io
      - test-io-http
      - test-ktor
      - test-utils
      - test-misc
      - test-infra
      - test-data
      - test-spring-docker
      - test-testcontainers
      - test-testcontainers-spring
      - coverage-report
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Nightly results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "Nightly tests failed"
            exit 1
          fi
          echo "Nightly tests passed"
