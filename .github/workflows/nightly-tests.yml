name: Nightly

on:
  schedule:
    - cron: '0 18 * * 1-6'  # Daily smoke, 03:00 KST Mon-Sat
    - cron: '0 18 * * 0'    # Weekly full, 03:00 KST Sunday
  workflow_dispatch:
    inputs:
      scope:
        description: 'Nightly scope to run'
        type: choice
        default: full
        options:
          - smoke
          - full
          - testcontainers
          - graphdb
          - aws

permissions:
  contents: read

concurrency:
  group: nightly-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  plan:
    name: Plan Nightly Scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      run_smoke: ${{ steps.plan.outputs.run_smoke }}
      run_standard: ${{ steps.plan.outputs.run_standard }}
      run_testcontainers_coverage: ${{ steps.plan.outputs.run_testcontainers_coverage }}
      testcontainers_matrix: ${{ steps.plan.outputs.testcontainers_matrix }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
          elif [[ "${{ github.event.schedule }}" == "0 18 * * 0" ]]; then
            scope="full"
          else
            scope="smoke"
          fi

          case "$scope" in
            smoke) run_smoke="true"; run_standard="false" ;;
            full) run_smoke="true"; run_standard="true" ;;
            *) run_smoke="false"; run_standard="false" ;;
          esac

          case "$scope" in
            full|testcontainers) run_testcontainers_coverage="true" ;;
            *) run_testcontainers_coverage="false" ;;
          esac

          matrix_json="$(SCOPE="$scope" python3 <<'PY'
          import json
          import os

          all_groups = [
              {
                  "group": "database-core",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.database.MariaDBServerTest",
                      "io.bluetape4k.testcontainers.database.MySQL5ServerTest",
                      "io.bluetape4k.testcontainers.database.MySQL8ServerTest",
                      "io.bluetape4k.testcontainers.database.PostgreSQLServerTest",
                      "io.bluetape4k.testcontainers.database.PgvectorServerTest",
                      "io.bluetape4k.testcontainers.database.PostgisServerTest",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "database-analytics",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.database.ClickHouseServerTest",
                      "io.bluetape4k.testcontainers.database.CockroachServerTest",
                      "io.bluetape4k.testcontainers.database.TrinoServerTest",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "database-contract",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.database.JdbcServerSupportTest",
                      "io.bluetape4k.testcontainers.database.R2dbcServerSupportTest",
                  ]),
                  "timeout_minutes": 10,
                  "max_attempts": 1,
                  "needs_mock_servers": False,
              },
              {
                  "group": "storage-cassandra",
                  "test_patterns": "io.bluetape4k.testcontainers.storage.CassandraServerTest",
                  "timeout_minutes": 20,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "storage-search",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.storage.ElasticsearchOssServerTest",
                      "io.bluetape4k.testcontainers.storage.ElasticsearchServerTest",
                      "io.bluetape4k.testcontainers.storage.OpenSearchServerTest",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "storage-cache",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.storage.HazelcastServerTest",
                      "io.bluetape4k.testcontainers.storage.Ignite2ServerTest",
                      "io.bluetape4k.testcontainers.storage.Ignite3ServerTest",
                      "io.bluetape4k.testcontainers.storage.InfluxDBServerTest",
                      "io.bluetape4k.testcontainers.storage.MinIOServerTest",
                      "io.bluetape4k.testcontainers.storage.MongoDBServerTest",
                      "io.bluetape4k.testcontainers.storage.RedisClusterServerTest",
                      "io.bluetape4k.testcontainers.storage.RedisServerTest",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "mq-kafka",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.mq.KafkaServerTest",
                      "io.bluetape4k.testcontainers.mq.RedpandaServerTest",
                  ]),
                  "timeout_minutes": 20,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "mq-brokers",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.mq.NatsServerTest",
                      "io.bluetape4k.testcontainers.mq.PulsarServerTest",
                      "io.bluetape4k.testcontainers.mq.RabbitMQServerTest",
                  ]),
                  "timeout_minutes": 20,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "aws-core",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.aws.ElasticMqServerTest",
                      "io.bluetape4k.testcontainers.aws.FlociServerTest",
                      "io.bluetape4k.testcontainers.aws.LocalStackServerTest",
                      "io.bluetape4k.testcontainers.aws.MiniStackServerTest",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "aws-localstack",
                  "test_patterns": "io.bluetape4k.testcontainers.aws.localstack.services.*",
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "aws-compatible",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.aws.floci.services.*",
                      "io.bluetape4k.testcontainers.aws.ministack.services.*",
                  ]),
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "infra",
                  "test_patterns": "io.bluetape4k.testcontainers.infra.*",
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "http",
                  "test_patterns": "io.bluetape4k.testcontainers.http.*",
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": True,
              },
              {
                  "group": "graphdb-falkordb",
                  "test_patterns": "io.bluetape4k.testcontainers.graphdb.FalkorDBServerTest",
                  "timeout_minutes": 12,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "graphdb-memgraph",
                  "test_patterns": "io.bluetape4k.testcontainers.graphdb.MemgraphServerTest",
                  "timeout_minutes": 25,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "graphdb-neo4j",
                  "test_patterns": "io.bluetape4k.testcontainers.graphdb.Neo4jServerTest",
                  "timeout_minutes": 12,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "graphdb-postgresql-age",
                  "test_patterns": "io.bluetape4k.testcontainers.graphdb.PostgreSQLAgeServerTest",
                  "timeout_minutes": 12,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "misc-contract",
                  "test_patterns": " ".join([
                      "io.bluetape4k.testcontainers.GenericContainerExtensionsSupportTest",
                      "io.bluetape4k.testcontainers.GenericServerSupportTest",
                      "io.bluetape4k.testcontainers.GenericServerTest",
                      "io.bluetape4k.testcontainers.PropertyExportingServerContractTest",
                      "io.bluetape4k.testcontainers.RegisterSystemPropertiesTest",
                  ]),
                  "timeout_minutes": 8,
                  "max_attempts": 1,
                  "needs_mock_servers": False,
              },
              {
                  "group": "mail",
                  "test_patterns": "io.bluetape4k.testcontainers.mail.*",
                  "timeout_minutes": 12,
                  "max_attempts": 2,
                  "needs_mock_servers": False,
              },
              {
                  "group": "llm-disabled",
                  "test_patterns": "io.bluetape4k.testcontainers.llm.*",
                  "timeout_minutes": 8,
                  "max_attempts": 1,
                  "needs_mock_servers": False,
              },
          ]

          scope = os.environ["SCOPE"]
          groups_by_scope = {
              "smoke": ["database-contract", "misc-contract", "aws-core"],
              "full": [group["group"] for group in all_groups],
              "testcontainers": [group["group"] for group in all_groups],
              "graphdb": [
                  "graphdb-falkordb",
                  "graphdb-memgraph",
                  "graphdb-neo4j",
                  "graphdb-postgresql-age",
              ],
              "aws": ["aws-core", "aws-localstack", "aws-compatible"],
          }
          selected = set(groups_by_scope[scope])
          print(json.dumps({"include": [group for group in all_groups if group["group"] in selected]}, separators=(",", ":")))
          PY
          )"

          {
            echo "scope=$scope"
            echo "run_smoke=$run_smoke"
            echo "run_standard=$run_standard"
            echo "run_testcontainers_coverage=$run_testcontainers_coverage"
            echo "testcontainers_matrix=$matrix_json"
          } >> "$GITHUB_OUTPUT"

  # ── 빌드 (컴파일 only) ───────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: plan
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Build (compile only, excluding examples)
        shell: bash
        run: |
          set -euo pipefail

          excluded_tasks=(
            -x :bluetape4k-examples-coroutines-demo:build
            -x :bluetape4k-examples-jpa-blazepersistence-demo:build
            -x :bluetape4k-examples-jpa-querydsl-demo:build
            -x :bluetape4k-examples-redisson-demo:build
            -x :bluetape4k-examples-virtualthreads-demo:build
          )

          projects="$(./gradlew -q projects --no-configuration-cache)"
          if grep -q -- "--- Project ':idgenerator-ktor-demo'" <<< "$projects"; then
            excluded_tasks+=(-x :idgenerator-ktor-demo:build)
          fi
          if grep -q -- "--- Project ':observability-ktor-demo'" <<< "$projects"; then
            excluded_tasks+=(-x :observability-ktor-demo:build)
          fi
          if grep -q -- "--- Project ':idgenerator-spring-boot-demo'" <<< "$projects"; then
            excluded_tasks+=(-x :idgenerator-spring-boot-demo:build)
          fi
          if grep -q -- "--- Project ':observability-spring-boot-demo'" <<< "$projects"; then
            excluded_tasks+=(-x :observability-spring-boot-demo:build)
          fi

          for attempt in 1 2 3; do
            ./gradlew build -x test "${excluded_tasks[@]}" --parallel --no-configuration-cache && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Resolve mock server runtime dependencies (pre-cache for Jib)
        run: >
          ./gradlew --no-configuration-cache
          :bluetape4k-mock-web-server:dependencies
          :bluetape4k-mock-webflux-server:dependencies
          --configuration runtimeClasspath
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

  # ── Detekt 정적 분석 ──────────────────────────────────────────────────────
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    needs: [build, plan]
    if: ${{ needs.plan.outputs.run_smoke == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Detekt static analysis
        run: |
          for attempt in 1 2 3; do
            ./gradlew detekt --parallel --configuration-cache-problems=fail && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done

      - name: Verify Detekt source coverage
        run: |
          test -s build/reports/detekt/source-coverage.md
          grep -Eq '^- Included modules: [1-9][0-9]*$' build/reports/detekt/source-coverage.md
          grep -Eq '^- Kotlin source files: [1-9][0-9]* \(main: [0-9]+, test: [0-9]+\)$' build/reports/detekt/source-coverage.md
          grep -q '^- Empty included modules: 0$' build/reports/detekt/source-coverage.md

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-detekt-report
          path: |
            **/build/reports/detekt/*.xml
            build/reports/detekt/source-coverage.md
          if-no-files-found: error
          retention-days: 14

  # ── Core 모듈 테스트 ──────────────────────────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    needs: [build, plan]
    if: ${{ needs.plan.outputs.run_smoke == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test bluetape4k core modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew --no-configuration-cache \
              :bluetape4k-annotations:test \
              :bluetape4k-core:test \
              :bluetape4k-coroutines:test \
              :bluetape4k-logging:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew --no-configuration-cache \
            :bluetape4k-annotations:koverXmlReport \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-core
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 14

  # ── I/O 모듈 테스트 ───────────────────────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    needs: [build, plan]
    if: ${{ needs.plan.outputs.run_standard == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew --no-configuration-cache \
              :bluetape4k-io:test \
              :bluetape4k-okio:test \
              :bluetape4k-csv:test \
              :bluetape4k-avro:test \
              :bluetape4k-json:test \
              :bluetape4k-fastjson2:test \
                :bluetape4k-jackson2:test \
              :bluetape4k-jackson3:test \
              :bluetape4k-netty:test \
              :bluetape4k-grpc:test \
                :bluetape4k-protobuf:test \
                :bluetape4k-tink:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew --no-configuration-cache \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-avro:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-fastjson2:koverXmlReport \
              :bluetape4k-jackson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-netty:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
              :bluetape4k-protobuf:koverXmlReport \
              :bluetape4k-tink:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-io
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 14

    # ── IO HTTP 클라이언트 모듈 테스트 (Testcontainers) ──────────────────────
  test-io-http:
      name: Test / IO HTTP
      runs-on: ubuntu-latest
      needs: [build, plan]
      if: ${{ needs.plan.outputs.run_standard == 'true' }}
      steps:
          -   uses: actions/checkout@v7

          -   uses: actions/setup-java@v5.7.0
              with:
                  java-version: ${{ env.JAVA_VERSION }}
                  distribution: ${{ env.JAVA_DISTRIBUTION }}

          -   uses: gradle/actions/setup-gradle@v6.3.0
              with:
                  gradle-version: wrapper
                  cache-read-only: true

          -   name: Build mock-web-server Docker image
              run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
              env:
                  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

          -   name: Test io http client modules
              uses: nick-fields/retry@v4
              with:
                timeout_minutes: 60
                max_attempts: 3
                shell: bash
                command: |
                    ./gradlew --no-configuration-cache \
                      :bluetape4k-feign:test \
                      :bluetape4k-http:test \
                      :bluetape4k-retrofit2:test \
                      :bluetape4k-vertx:test \
                      --parallel
              env:
                  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

          -   name: Generate Kover XML report
              if: always()
              run: |
                  ./gradlew --no-configuration-cache \
                    :bluetape4k-feign:koverXmlReport \
                    :bluetape4k-http:koverXmlReport \
                    :bluetape4k-retrofit2:koverXmlReport \
                    :bluetape4k-vertx:koverXmlReport \
                    --parallel
              continue-on-error: true

          -   name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: nightly-test-results-io-http
                  path: '**/build/test-results/test/*.xml'
                  retention-days: 14

          -   name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: nightly-coverage-io-http
                  path: '**/build/reports/kover/'
                  if-no-files-found: error
                  retention-days: 14

  # ── Ktor 모듈 테스트 ─────────────────────────────────────────────────────
  test-ktor:
    name: Test / Ktor
    runs-on: ubuntu-latest
    needs: [build, plan]
    if: ${{ needs.plan.outputs.run_standard == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Ktor modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew --no-configuration-cache \
              :bluetape4k-ktor-core:test \
              :bluetape4k-ktor-observability:test \
              :bluetape4k-ktor-openapi:test \
              :bluetape4k-ktor-resilience4j:test \
              :bluetape4k-ktor-testing:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew --no-configuration-cache \
            :bluetape4k-ktor-core:koverXmlReport \
            :bluetape4k-ktor-observability:koverXmlReport \
            :bluetape4k-ktor-openapi:koverXmlReport \
            :bluetape4k-ktor-resilience4j:koverXmlReport \
            :bluetape4k-ktor-testing:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-results-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage-ktor
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 14

  # ── Utils 모듈 테스트 ─────────────────────────────────────────────────────
  test-utils:
    name: Test / Utils
    runs-on: ubuntu-latest
    needs: [build, plan]
    if: ${{ needs.plan.outputs.run_standard == 'true' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test utils modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew --no-configuration-cache \
              :bluetape4k-idgenerators:test \
              :bluetape4k-javatimes:test \
              :bluetape4k-math:test \
              :bluetape4k-money:test \
