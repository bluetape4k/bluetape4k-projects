name: Manual Documentation

permissions:
  contents: read

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'docs/manual/**'
      - 'docs/process/module-documentation-checklist.md'
      - 'scripts/manual/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/manual-docs.yml'
  push:
    branches: [develop, main]
    paths:
      - 'docs/manual/**'
      - 'docs/process/module-documentation-checklist.md'
      - 'scripts/manual/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/manual-docs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manual source and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Export Gradle module inventory
        run: ./gradlew exportManualModuleInventory --no-configuration-cache

      - name: Test manual contracts
        run: |
          ruby scripts/manual/generate_manuals_test.rb
          ruby scripts/manual/export_manifest_test.rb
          ruby scripts/manual/release_contract_test.rb
          ruby scripts/manual/sync_navigation_metadata_test.rb
          ruby scripts/manual/validate_manuals_test.rb

      - name: Validate manual source
        run: |
          ruby scripts/manual/validate_manuals.rb
          ruby scripts/manual/sync_navigation_metadata.rb --check
          ruby scripts/manual/export_manifest.rb --check

      - name: Validate 1.11 release provenance
        run: >-
          ruby scripts/manual/validate_release_manuals.rb
          1.11.0
          6187173b58e8b4c5c435c145e00e94708f31ef75
