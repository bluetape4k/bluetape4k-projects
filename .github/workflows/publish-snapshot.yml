name: Publish Snapshot

permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    name: Publish SNAPSHOT to Maven Central
    runs-on: ubuntu-latest
    # workflow_run: Nightly 성공 시에만 실행. 수동 dispatch는 항상 실행.
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 << 'PY'
          import base64, os
          raw_key = os.environ.get("SIGNING_KEY", "")
          key_id = os.environ.get("SIGNING_KEY_ID", "")
          password = os.environ.get("SIGNING_PASSWORD", "")
          print(f"SIGNING_KEY_ID set={bool(key_id)} length={len(key_id)}")
          print(f"SIGNING_PASSWORD set={bool(password)} length={len(password)}")
          print(f"SIGNING_KEY set={bool(raw_key)} length={len(raw_key)}")
          if raw_key.lstrip().startswith("-----BEGIN"):
              source = "armored"
          elif "\\n" in raw_key:
              source = "escaped_newlines"
          else:
              try:
                  base64.b64decode(raw_key.strip())
                  source = "base64"
              except Exception:
                  source = "raw"
          print(f"SIGNING_KEY source={source}")
          PY

      - name: Publish SNAPSHOT
        run: ./gradlew publishAggregationToCentralSnapshots -PsnapshotVersion=-SNAPSHOT --no-daemon --no-configuration-cache --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
