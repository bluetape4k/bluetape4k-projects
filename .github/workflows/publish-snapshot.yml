name: Publish Snapshot
run-name: 'issue-754-snapshot-${{ github.event_name }}-${{ github.run_id }}'

permissions:
  actions: read
  contents: read

on:
  workflow_run:
    workflows: ["Nightly"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 1.12.0 release-candidate SHA to publish as a snapshot'
        required: true
        type: string
      diagnoseSigning:
        description: 'Run signing diagnostics before publishing'
        required: false
        default: false
        type: boolean

concurrency:
  group: publish-snapshot-1.12.0
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  candidate-sha-guard:
    name: Guard exact candidate SHA
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_sha: ${{ steps.guard.outputs.candidate_sha }}
    steps:
      - name: Reject a moved workflow ref
        id: guard
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.candidate_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha must be a full lowercase Git SHA"
            exit 1
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$WORKFLOW_SHA" != "$CANDIDATE_SHA" ]]; then
            echo "::error::github.sha ($WORKFLOW_SHA) != candidate_sha ($CANDIDATE_SHA)"
            exit 1
          fi
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.guard.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify checkout identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.guard.outputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

  release-hold-1-12-0-issue-754:
    name: release-hold-1.12.0-issue-754
    needs: [candidate-sha-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-sha-guard.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Enforce the issue 754 release hold
        run: >-
          python3 scripts/check-release-holds.py
          --manifest .github/release-holds/1.12.0-issue-754.json
          --repository .
          --release-candidate '${{ needs.candidate-sha-guard.outputs.candidate_sha }}'

  issue-754-tag-immutability:
    name: issue-754-tag-immutability
    needs: [candidate-sha-guard, release-hold-1-12-0-issue-754]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-sha-guard.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify any existing production tag is immutable
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/tags/1.12.0 | awk '{print $1}')"
          if [[ -n "$actual" && "$actual" != '${{ needs.candidate-sha-guard.outputs.candidate_sha }}' ]]; then
            echo "::error::tag 1.12.0 targets $actual, not the held candidate"
            exit 1
          fi

  publish:
    name: Publish SNAPSHOT to Maven Central
    needs:
      - candidate-sha-guard
      - release-hold-1-12-0-issue-754
      - issue-754-tag-immutability
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: snapshot-publish-1.12.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.candidate-sha-guard.outputs.candidate_sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Diagnose signing inputs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnoseSigning }}
        shell: bash
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          for name in ("SIGNING_KEY_ID", "SIGNING_KEY", "SIGNING_PASSWORD"):
              value = os.environ.get(name, "")
              print(f"{name} set={bool(value)} length={len(value)}")
          PY

      - name: Publish SNAPSHOT
        run: >-
          ./gradlew nmcpPublishAggregationToCentralPortalSnapshots
          -PsnapshotVersion=-SNAPSHOT
          --no-daemon
          --no-configuration-cache
          --no-build-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
