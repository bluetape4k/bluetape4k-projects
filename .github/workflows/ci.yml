name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed 's/.*"v\([^"]*\)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4

  # ── 2. 전체 빌드 (테스트 제외) + Detekt ──────────────────────────────────
  build:
    name: Build & Detekt
    runs-on: ubuntu-latest
    needs: validate-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: ./gradlew build -x test --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Detekt static analysis
        run: ./gradlew detekt --parallel

      - name: Upload detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: '**/build/reports/detekt/*.xml'
          retention-days: 30

  # ── 3. Core 모듈 테스트 (외부 의존성 없음) ────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test bluetape4k core modules
        run: |
          ./gradlew \
            :bluetape4k-core:test \
            :bluetape4k-coroutines:test \
            :bluetape4k-logging:test \
            --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 4. I/O 모듈 테스트 (순수 JVM) ───────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules (pure JVM)
        run: |
          ./gradlew \
            :bluetape4k-io:test \
            :bluetape4k-okio:test \
            :bluetape4k-csv:test \
            :bluetape4k-avro:test \
            :bluetape4k-json:test \
            :bluetape4k-fastjson2:test \
            :bluetape4k-jackson3:test \
            :bluetape4k-netty:test \
            :bluetape4k-grpc:test \
            --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-avro:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-fastjson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-netty:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-io
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 5. Utils 모듈 테스트 (순수 JVM) ─────────────────────────────────────
  test-utils:
    name: Test / Utils
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

