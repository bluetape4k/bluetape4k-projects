  # ── 7. 핵심 Infra 테스트 (Redis — Testcontainers) ────────────────────────
  test-infra:
    name: Test / Infra (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs.infra == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test key infra modules (Redis)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-redisson:test \
              :bluetape4k-lettuce:test \
              :bluetape4k-cache-lettuce:test \
              :bluetape4k-cache-redisson:test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          # Kover discovers registered Redis characterization tasks as report inputs;
          # keep the aggregate deterministic by measuring the regular test suite only.
          ./gradlew \
            :bluetape4k-redisson:koverXmlReport \
            :bluetape4k-lettuce:koverXmlReport \
            :bluetape4k-cache-lettuce:koverXmlReport \
            :bluetape4k-cache-redisson:koverXmlReport \
            --parallel \
            -x :bluetape4k-lettuce:fencingLeaseTopologyRecoveryTest \
            -x :bluetape4k-lettuce:coordinationLockTopologyRecoveryTest \
            -x :bluetape4k-lettuce:multiKeyLeasePerformanceTest \
            -x :bluetape4k-lettuce:coordinationLockPerformanceTest

      - name: Verify Infra coverage inventory
        if: always()
        run: |
          set -euo pipefail
          for report in \
            infra/lettuce/build/reports/kover/report.xml \
            cache/cache-lettuce/build/reports/kover/report.xml \
            infra/redisson/build/reports/kover/report.xml \
            cache/cache-redisson/build/reports/kover/report.xml; do
            if [ ! -s "$report" ]; then
              echo "Missing or empty Infra Kover report: $report" >&2
              exit 1
            fi
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-infra
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

