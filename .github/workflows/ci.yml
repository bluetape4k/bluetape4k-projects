  # ── 나머지 모듈 → Nightly에서 실행 ─────────────────────────────────
  # utils 전체, misc, spring3-docker, spring4-docker,
  # testcontainers 는 nightly-tests.yml (매일 03:00 KST) 에서 실행
  # exposed 모듈은 bluetape4k-exposed 독립 레포로 분리됨 (#334)

  # ── 8. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-core, test-io, test-io-http, test-testcontainers-spring, test-ktor, test-key-utils, test-infra, test-search-messaging, test-kafka-infra, test-telemetry-infra, test-data]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Prepare expected coverage manifest
        id: expected-coverage
        env:
          EXPECTED_COVERAGE_JOBS: |
            test-core=${{ needs.test-core.result }}
            test-io=${{ needs.test-io.result }}
            test-io-http=${{ needs.test-io-http.result }}
            test-testcontainers-spring=${{ needs.test-testcontainers-spring.result }}
            test-ktor=${{ needs.test-ktor.result }}
            test-key-utils=${{ needs.test-key-utils.result }}
            test-infra=${{ needs.test-infra.result }}
            test-search-messaging=${{ needs.test-search-messaging.result }}
            test-kafka-infra=${{ needs.test-kafka-infra.result }}
            test-telemetry-infra=${{ needs.test-telemetry-infra.result }}
            test-data=${{ needs.test-data.result }}
        run: |
          mkdir -p coverage-artifacts
          printf '%s\n' "$EXPECTED_COVERAGE_JOBS" > coverage-artifacts/expected-jobs.manifest
          : > coverage-artifacts/expected-modules.manifest
          if grep -q '^test-infra=success$' coverage-artifacts/expected-jobs.manifest; then
            printf '%s\n' \
              'infra/lettuce' \
              'cache/cache-lettuce' \
              'infra/redisson' \
              'cache/cache-redisson' \
              > coverage-artifacts/expected-modules.manifest
          fi
          if grep -q '^test-search-messaging=success$' coverage-artifacts/expected-jobs.manifest; then
            printf '%s\n' \
              'infra/elasticsearch' \
              'infra/nats' \
              >> coverage-artifacts/expected-modules.manifest
          fi
          if grep -q '=success$' coverage-artifacts/expected-jobs.manifest; then
            echo 'has_expected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_expected=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download all coverage artifacts
        id: download-coverage
        if: steps.expected-coverage.outputs.has_expected == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false

      - name: Aggregate Kover coverage summary
        id: aggregate-coverage
        if: always()
        env:
          COVERAGE_DOWNLOAD_OUTCOME: ${{ steps.download-coverage.outcome }}
        run: |
          expected_module_args=()
          while IFS= read -r module; do
            if [ -n "$module" ]; then
              expected_module_args+=(--expected-module "$module")
            fi
          done < coverage-artifacts/expected-modules.manifest
          python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts \
            --expected-manifest coverage-artifacts/expected-jobs.manifest \
            --download-outcome "$COVERAGE_DOWNLOAD_OUTCOME" \
            "${expected_module_args[@]}"

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggregate-coverage-all
          overwrite: true
          path: coverage-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Coveralls file list
        id: coveralls-files
        if: ${{ steps.aggregate-coverage.outcome == 'success' && hashFiles('coverage-artifacts/**/reports/kover/report.xml') != '' }}
        run: |
          files=$(find coverage-artifacts -type f -path '*/reports/kover/report.xml' -print | sort | paste -sd ' ' -)
          if [ -z "$files" ]; then
            echo 'No Kover report files found for Coveralls.' >&2
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Coveralls
        if: ${{ steps.aggregate-coverage.outcome == 'success' && steps.coveralls-files.outcome == 'success' }}
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: ${{ steps.coveralls-files.outputs.files }}
          format: jacoco
          fail-on-error: true

  # ── 9. 결과 집계 ──────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-policy, jvm-release-contract, codeql-policy, catalog-governance, gitleaks, validate-wrapper, changes, build, test-core, test-io, test-testcontainers-spring, testcontainers-image-gate, test-ktor, test-key-utils, test-infra, test-search-messaging, test-kafka-infra, test-telemetry-infra, test-data, coverage-report]
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
