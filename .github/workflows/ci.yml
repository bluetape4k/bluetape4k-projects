name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  ORG_GRADLE_PROJECT_excludeBenchmarks: 'true'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: '9698c9d66bea6fcba373143ee8fa5bfbd9812d4b'
  BLUETAPE4K_MANUAL_REF: '4e3c00262adb12cd61e4e8a30b6488aa6a287acc'
  GITLEAKS_VERSION: 'v8.30.1'

jobs:
  release-policy:
    name: Release Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify Maven-only release policy
        run: |
          python3 -m unittest scripts/test_release_workflow_policy.py -v
          python3 -m unittest scripts/ci/resolve_release_target_test.py -v

  manual-contract:
    name: Central Manual Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k.github.io
          ref: ${{ env.BLUETAPE4K_MANUAL_REF }}
          path: .manual-site
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify immutable central manual checkout
        run: |
          test "$(git -C .manual-site rev-parse HEAD)" = "$BLUETAPE4K_MANUAL_REF"
          test -f .manual-site/docs/manual/bluetape4k-projects/manifest.yaml
          echo "central manual commit=$BLUETAPE4K_MANUAL_REF"
          sha256sum .manual-site/docs/manual/bluetape4k-projects/manifest.yaml
      - name: Verify central manual inventory contract
        env:
          BLUETAPE4K_MANUAL_ROOT: ${{ github.workspace }}/.manual-site/docs/manual/bluetape4k-projects
        run: |
          python3 -m unittest scripts/test_central_manual_contract.py -v
          python3 scripts/docs-localization-inventory.py --check

  jvm-release-contract:
    name: JVM Release Contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
      - name: Verify static JVM release contract
        run: python3 -m unittest scripts/test_jvm_release_contract.py -v
      - name: Verify Testcontainers source/documentation parity contract
        run: python3 -m unittest scripts/test_testcontainers_contract.py -v
      - name: Verify Testcontainers image-gate manifest contract
        run: python3 -m unittest scripts/test_testcontainers_image_gate.py -v
      - name: Verify Testcontainers image-gate runner contract
        run: python3 -m unittest scripts/test_run_testcontainers_image_gate.py -v
      - name: Verify Testcontainers image-gate aggregate contract
        run: python3 -m unittest scripts/test_aggregate_testcontainers_image_gate.py -v
      - name: Verify compiled classfile contract
        run: ./scripts/check-jvm-release-contract.sh

  codeql-policy:
    name: CodeQL Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify CodeQL catalog and build policy
        run: python3 -m unittest scripts/test_codeql_workflow_policy.py -v

  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          gitleaks_version="${GITLEAKS_VERSION#v}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.3.0

  # ── 1-b. 변경된 모듈 감지 ─────────────────────────────────────────────────
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      io: ${{ steps.filter.outputs.io }}
      io-http: ${{ steps.filter.outputs.io-http }}
      testcontainers-spring: ${{ steps.filter.outputs.testcontainers-spring }}
      ktor: ${{ steps.filter.outputs.ktor }}
      key-utils: ${{ steps.filter.outputs.key-utils }}
      science: ${{ steps.filter.outputs.science }}
      infra: ${{ steps.filter.outputs.infra }}
      search-messaging: ${{ steps.filter.outputs.search-messaging }}
      kafka-infra: ${{ steps.filter.outputs.kafka-infra }}
      telemetry-infra: ${{ steps.filter.outputs.telemetry-infra }}
      data: ${{ steps.filter.outputs.data }}
      spring-boot: ${{ steps.filter.outputs.spring-boot }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate CSV CI coverage
        run: ruby scripts/validate-ci-csv-coverage.rb

      - name: Test CSV CI coverage validator
        run: ruby scripts/validate-ci-csv-coverage_test.rb
      - name: Validate Kafka4 CI coverage
        run: ruby scripts/validate-ci-kafka4-coverage.rb
      - name: Validate Kover coverage aggregation
        run: python3 .github/scripts/test-aggregate-kover-coverage.py -v
      - name: Validate CI domain dependency graph
        run: python3 .github/scripts/test-ci-domain-parallelization.py -v
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'buildSrc/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.github/actions/**'
              - 'scripts/validate-ci-*.rb'
              - 'scripts/run_testcontainers_image_gate.py'
              - 'scripts/test_run_testcontainers_image_gate.py'
              - 'scripts/aggregate_testcontainers_image_gate.py'
              - 'scripts/test_aggregate_testcontainers_image_gate.py'
              - 'scripts/testcontainers_image_gate.py'
              - 'scripts/testcontainers_image_gate_manifest.json'
            core:
              - 'bluetape4k/annotations/**'
              - 'bluetape4k/core/**'
              - 'bluetape4k/coroutines/**'
              - 'bluetape4k/logging/**'
              - 'bluetape4k/tenant/**'
              - 'bluetape4k/tenant-reactor/**'
              - 'virtualthread/api/**'
              - 'virtualthread/jdk21/**'
              - 'virtualthread/jdk25/**'
            io:
              - 'io/io/**'
              - 'io/csv/**'
              - 'io/okio/**'
              - 'io/json/**'
              - 'io/jackson2/**'
              - 'io/jackson3/**'
              - 'io/protobuf/**'
              - 'io/grpc/**'
              - 'io/tink/**'
            io-http:
              - 'io/feign/**'
              - 'io/http/**'
              - 'io/retrofit2/**'
              - 'io/vertx/**'
              - 'testing/mock-web-server/**'
              - 'testing/mock-webflux-server/**'
            testcontainers-spring:
              - 'testing/testcontainers/**'
              - 'testing/testcontainers-spring/**'
            ktor:
              - 'ktor/**'
            key-utils:
              - 'utils/idgenerators/**'
              - 'cache/cache-core/**'
            science:
              - 'utils/science/**'
            infra:
              - 'infra/redisson/**'
              - 'infra/lettuce/**'
              - 'cache/cache-lettuce/**'
              - 'cache/cache-redisson/**'
            search-messaging:
              - 'infra/elasticsearch/**'
              - 'infra/nats/**'
            kafka-infra:
              - 'infra/kafka/**'
              - 'infra/kafka4/**'
            telemetry-infra:
              - 'infra/opentelemetry/**'
              - 'infra/kafka-logback/**'
            data:
              - 'data/**'
              - 'cache/hibernate-cache-lettuce/**'
            spring-boot:
              - 'spring-boot/**'

  # ── 2. 전체 빌드 (테스트 제외) ──────────────────────────────────────────
  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: |
          set -euo pipefail
          gradle10_removal_pattern='(scheduled (to be removed|for removal)|will (be )?removed|will become (an )?error|will fail with an error)[^[:cntrl:]]*Gradle 10([.][0-9]+){0,2}'
          positive_gradle10_warnings=(
            'This behavior is scheduled to be removed in Gradle 10.'
            'This behavior will be removed in Gradle 10.0.0.'
            'This behavior is scheduled for removal in Gradle 10.'
            'This behavior will become an error in Gradle 10.'
            'This behavior will fail with an error in Gradle 10.'
          )
          for warning in "${positive_gradle10_warnings[@]}"; do
            if ! grep -Eiq "$gradle10_removal_pattern" <<<"$warning"; then
              echo "Gradle 10 warning fixture was not detected: $warning" >&2
              exit 1
            fi
          done
          if grep -Eiq "$gradle10_removal_pattern" <<< 'This behavior will be removed in Gradle 9.7.'; then
            echo 'Gradle 9 warning fixture was incorrectly detected.' >&2
            exit 1
          fi
          if grep -Eiq "$gradle10_removal_pattern" <<< 'Gradle 10 supports this behavior.'; then
            echo 'Non-removal Gradle 10 fixture was incorrectly detected.' >&2
            exit 1
          fi
          warning_log="$(mktemp)"
          trap 'rm -f "$warning_log"' EXIT
          ./gradlew help --no-daemon --no-configuration-cache --warning-mode all --console=plain 2>&1 | tee "$warning_log"
          if grep -Eiq "$gradle10_removal_pattern" "$warning_log"; then
            echo 'Gradle 10 removal warnings detected.' >&2
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-wrapper, catalog-governance]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -x test \
              -x :protobuf-codec-benchmark:build \
              -x :serializer-benchmark:build \
              -x :web-framework-benchmark:build \
              --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Validate publication metadata
        run: |
          ruby scripts/publication/publication_pom_audit_test.rb
          ruby scripts/publication/publication_inventory_audit_test.rb
          ruby scripts/publication/publication_pom_integration_test.rb
          ruby scripts/publication/publication_module_metadata_audit_test.rb
          ./gradlew generatePomFileForBluetape4kPublication checkPomFileForBluetape4kPublication generateMetadataFileForBluetape4kPublication \
            -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/validate_module_metadata.rb

  # ── 3. Core 모듈 테스트 ───────────────────────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test core modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-annotations:test \
              :bluetape4k-core:test \
              :bluetape4k-coroutines:test \
              :bluetape4k-logging:test \
              :bluetape4k-tenant:test \
              :bluetape4k-tenant-reactor:test \
              :bluetape4k-virtualthread-api:test \
              :bluetape4k-virtualthread-jdk21:test \
              :bluetape4k-virtualthread-jdk25:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test TenantContext retention
        timeout-minutes: 2
        run: ./gradlew :bluetape4k-tenant:tenantRetentionStress --no-configuration-cache

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-annotations:koverXmlReport \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            :bluetape4k-tenant:koverXmlReport \
            :bluetape4k-tenant-reactor:koverXmlReport \
            :bluetape4k-virtualthread-api:koverXmlReport \
            :bluetape4k-virtualthread-jdk21:koverXmlReport \
            :bluetape4k-virtualthread-jdk25:koverXmlReport \
            -x test \
            --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: |
            **/build/test-results/test/*.xml
            bluetape4k/tenant/build/test-results/tenantRetentionStress/*.xml
            bluetape4k/tenant/build/reports/tests/tenantRetentionStress/**
            bluetape4k/tenant/build/reports/tenant-retention/**
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 4. I/O 모듈 테스트 ───────────────────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs.io == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-io:test \
              :bluetape4k-csv:test \
              :bluetape4k-okio:test \
              :bluetape4k-json:test \
              :bluetape4k-jackson2:test \
              :bluetape4k-jackson3:test \
              :bluetape4k-protobuf:test \
              :bluetape4k-grpc:test \
              :bluetape4k-tink:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-jackson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-protobuf:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
            :bluetape4k-tink:koverXmlReport \
            -x test \
            --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-io
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 4-b. I/O HTTP 클라이언트 테스트 (Testcontainers) ───────────────────────
  test-io-http:
    name: Test / IO HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs['io-http'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Build mock-webflux-server Docker image
        run: ./gradlew :bluetape4k-mock-webflux-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify default mock-server image tags
        run: |
          docker image inspect bluetape4k/mock-web-server:2.1.0
          docker image inspect bluetape4k/mock-webflux-server:2.1.0

      - name: Test HTTP client modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-feign:test \
              :bluetape4k-http:test \
              :bluetape4k-retrofit2:test \
              :bluetape4k-vertx:test \
              --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-feign:koverXmlReport \
            :bluetape4k-http:koverXmlReport \
            :bluetape4k-retrofit2:koverXmlReport \
            :bluetape4k-vertx:koverXmlReport \
            -x test \
            --no-configuration-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-io-http
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-io-http
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 4-c. Testcontainers Spring bridge (JVM-only) ─────────────────────────
  test-testcontainers-spring:
    name: Test / Testcontainers Spring bridge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs['testcontainers-spring'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Testcontainers Spring bridge
        run: ./gradlew :bluetape4k-testcontainers-spring:test --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: ./gradlew :bluetape4k-testcontainers-spring:koverXmlReport -x test --no-configuration-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-testcontainers-spring
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-testcontainers-spring
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 5. Ktor 모듈 테스트 ──────────────────────────────────────────────────
  test-ktor:
    name: Test / Ktor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs.ktor == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Ktor modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-ktor-core:test \
              :bluetape4k-ktor-tenant:test \
              :bluetape4k-ktor-observability:test \
              :bluetape4k-ktor-openapi:test \
              :bluetape4k-ktor-resilience4j:test \
              :bluetape4k-ktor-testing:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-ktor-core:koverXmlReport \
            :bluetape4k-ktor-tenant:koverXmlReport \
            :bluetape4k-ktor-observability:koverXmlReport \
            :bluetape4k-ktor-openapi:koverXmlReport \
            :bluetape4k-ktor-resilience4j:koverXmlReport \
            :bluetape4k-ktor-testing:koverXmlReport \
            -x test \
            --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ktor
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 6. 핵심 Utils 테스트 (Docker 없음) ───────────────────────────────────
  test-key-utils:
    name: Test / Key Utils
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs['key-utils'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    env:
      BLUETAPE4K_MANUAL_ROOT: ${{ github.workspace }}/.manual-site/docs/manual/bluetape4k-projects
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k.github.io
          ref: ${{ env.BLUETAPE4K_MANUAL_REF }}
          path: .manual-site

      - name: Verify immutable central manual checkout
        run: |
          test "$(git -C .manual-site rev-parse HEAD)" = "$BLUETAPE4K_MANUAL_REF"
          echo "central manual commit=$BLUETAPE4K_MANUAL_REF"

      - uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test key utility modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-idgenerators:test \
              :bluetape4k-cache-core:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify NearJCache documentation contract result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          result = Path(
              "cache/cache-core/build/test-results/test/"
              "TEST-io.bluetape4k.cache.nearcache.jcache.NearJCacheDocumentationTest.xml"
          )
          suite = ElementTree.parse(result).getroot()
          actual = {
              name: int(suite.attrib.get(name, "0"))
              for name in ("tests", "skipped", "failures", "errors")
          }
          expected = {"tests": 6, "skipped": 0, "failures": 0, "errors": 0}
          if actual != expected:
              raise SystemExit(f"NearJCache documentation contract mismatch: {actual}")
          print("NearJCacheDocumentationTest: tests=6, skipped=0, failures=0, errors=0")
          PY

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-idgenerators:koverXmlReport \
            :bluetape4k-cache-core:koverXmlReport \
            -x test \
            --parallel

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-key-utils
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-key-utils
          path: '**/build/reports/kover/'
          if-no-files-found: error
          retention-days: 30

  # ── 6-b. Science 모듈 테스트 (정규 회귀; slow-netcdf는 Nightly 전용) ─────
  test-science:
    name: Test / Science
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [changes, catalog-governance]
    if: ${{ needs.changes.outputs.science == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.0.0
        with:
