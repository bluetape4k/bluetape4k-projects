name: CI

permissions:
  contents: read
  actions: read
  checks: read
  statuses: read
  packages: read

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.editorconfig'
      - '.gitleaks.toml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.omc/**'
      - '.claude/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  BLUETAPE4K_DEPENDENCIES_CATALOG_REF: 'fbb6df78d04fcb9d7252ce0a1338ee67af9fa817'
  GITLEAKS_VERSION: 'v8.30.1'

jobs:
  release-policy:
    name: Release Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify Maven-only release policy
        run: python3 -m unittest scripts/test_release_workflow_policy.py -v

  codeql-policy:
    name: CodeQL Workflow Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify CodeQL catalog and build policy
        run: python3 -m unittest scripts/test_codeql_workflow_policy.py -v

  # ── 0. 시크릿 스캔 ────────────────────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          gitleaks_version="${GITLEAKS_VERSION#v}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Run gitleaks
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── 1. Gradle Wrapper 검증 ────────────────────────────────────────────────
  validate-wrapper:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6.2.0

  # ── 1-b. 변경된 모듈 감지 ─────────────────────────────────────────────────
  changes:
    name: Detect changed modules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate-wrapper
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      core: ${{ steps.filter.outputs.core }}
      io: ${{ steps.filter.outputs.io }}
      io-http: ${{ steps.filter.outputs.io-http }}
      ktor: ${{ steps.filter.outputs.ktor }}
      key-utils: ${{ steps.filter.outputs.key-utils }}
      infra: ${{ steps.filter.outputs.infra }}
      kafka-infra: ${{ steps.filter.outputs.kafka-infra }}
      telemetry-infra: ${{ steps.filter.outputs.telemetry-infra }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate CSV CI coverage
        run: ruby scripts/validate-ci-csv-coverage.rb
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shared:
              - 'buildSrc/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
            core:
              - 'bluetape4k/annotations/**'
              - 'bluetape4k/core/**'
              - 'bluetape4k/coroutines/**'
              - 'bluetape4k/logging/**'
              - 'virtualthread/api/**'
              - 'virtualthread/jdk21/**'
              - 'virtualthread/jdk25/**'
            io:
              - 'io/io/**'
              - 'io/csv/**'
              - 'io/okio/**'
              - 'io/json/**'
              - 'io/jackson2/**'
              - 'io/jackson3/**'
              - 'io/protobuf/**'
              - 'io/grpc/**'
              - 'io/tink/**'
            io-http:
              - 'io/feign/**'
              - 'io/http/**'
              - 'io/retrofit2/**'
              - 'io/vertx/**'
              - 'testing/mock-web-server/**'
              - 'testing/testcontainers/**'
            ktor:
              - 'ktor/**'
            key-utils:
              - 'utils/idgenerators/**'
              - 'cache/cache-core/**'
            infra:
              - 'infra/redisson/**'
              - 'infra/lettuce/**'
              - 'cache/cache-lettuce/**'
              - 'cache/cache-redisson/**'
            kafka-infra:
              - 'infra/kafka/**'
            telemetry-infra:
              - 'infra/opentelemetry/**'
              - 'infra/kafka-logback/**'
            data:
              - 'data/**'
              - 'cache/hibernate-cache-lettuce/**'

  # ── 2. 전체 빌드 (테스트 제외) ──────────────────────────────────────────
  catalog-governance:
    name: Central Catalog Governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ env.BLUETAPE4K_DEPENDENCIES_CATALOG_REF }}
          path: .catalog/bluetape4k-dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify immutable catalog checkout
        run: test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "$BLUETAPE4K_DEPENDENCIES_CATALOG_REF"
      - name: Check central catalog adoption
        run: |
          python3 .catalog/bluetape4k-dependencies/scripts/sync-shared-versions.py \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --repo "${GITHUB_REPOSITORY#*/}" \
            --check \
            --summary
      - name: Resolve Gradle catalog from checked-out source
        env:
          BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
        run: ./gradlew help --no-daemon

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [validate-wrapper, catalog-governance]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build (compile only)
        run: |
          for attempt in 1 2 3; do
            ./gradlew build -x test --parallel && break
            echo "Attempt $attempt failed"
            [ $attempt -lt 3 ] && sleep 10 || exit 1
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Validate publication metadata
        run: |
          ruby scripts/publication/publication_pom_audit_test.rb
          ruby scripts/publication/publication_pom_integration_test.rb
          ruby scripts/publication/publication_module_metadata_audit_test.rb
          ./gradlew generatePomFileForBluetape4kPublication generateMetadataFileForBluetape4kPublication \
            -PsnapshotVersion=-SNAPSHOT \
            --no-daemon --no-configuration-cache --no-build-cache
          ruby scripts/publication/validate_poms.rb
          ruby scripts/publication/validate_module_metadata.rb

  # ── 3. Core 모듈 테스트 ───────────────────────────────────────────────────
  test-core:
    name: Test / Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test core modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-annotations:test \
              :bluetape4k-core:test \
              :bluetape4k-coroutines:test \
              :bluetape4k-logging:test \
              :bluetape4k-virtualthread-api:test \
              :bluetape4k-virtualthread-jdk21:test \
              :bluetape4k-virtualthread-jdk25:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-annotations:koverXmlReport \
            :bluetape4k-core:koverXmlReport \
            :bluetape4k-coroutines:koverXmlReport \
            :bluetape4k-logging:koverXmlReport \
            :bluetape4k-virtualthread-api:koverXmlReport \
            :bluetape4k-virtualthread-jdk21:koverXmlReport \
            :bluetape4k-virtualthread-jdk25:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-core
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 4. I/O 모듈 테스트 ───────────────────────────────────────────────────
  test-io:
    name: Test / IO
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.io == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test io modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-io:test \
              :bluetape4k-csv:test \
              :bluetape4k-okio:test \
              :bluetape4k-json:test \
              :bluetape4k-jackson2:test \
              :bluetape4k-jackson3:test \
              :bluetape4k-protobuf:test \
              :bluetape4k-grpc:test \
              :bluetape4k-tink:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-io:koverXmlReport \
            :bluetape4k-csv:koverXmlReport \
            :bluetape4k-okio:koverXmlReport \
            :bluetape4k-json:koverXmlReport \
            :bluetape4k-jackson2:koverXmlReport \
            :bluetape4k-jackson3:koverXmlReport \
            :bluetape4k-protobuf:koverXmlReport \
            :bluetape4k-grpc:koverXmlReport \
            :bluetape4k-tink:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-io
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-io
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 4-b. I/O HTTP 클라이언트 테스트 (Testcontainers) ───────────────────────
  test-io-http:
    name: Test / IO HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: ${{ needs.changes.outputs['io-http'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Build mock-web-server Docker image
        run: ./gradlew :bluetape4k-mock-web-server:jibDockerBuild --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Test HTTP client modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-feign:test \
              :bluetape4k-http:test \
              :bluetape4k-retrofit2:test \
              :bluetape4k-vertx:test \
              --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-feign:koverXmlReport \
            :bluetape4k-http:koverXmlReport \
            :bluetape4k-retrofit2:koverXmlReport \
            :bluetape4k-vertx:koverXmlReport \
            --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-io-http
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-io-http
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 5. Ktor 모듈 테스트 ──────────────────────────────────────────────────
  test-ktor:
    name: Test / Ktor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.ktor == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Ktor modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-ktor-core:test \
              :bluetape4k-ktor-observability:test \
              :bluetape4k-ktor-openapi:test \
              :bluetape4k-ktor-resilience4j:test \
              :bluetape4k-ktor-testing:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-ktor-core:koverXmlReport \
            :bluetape4k-ktor-observability:koverXmlReport \
            :bluetape4k-ktor-openapi:koverXmlReport \
            :bluetape4k-ktor-resilience4j:koverXmlReport \
            :bluetape4k-ktor-testing:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ktor
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ktor
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 6. 핵심 Utils 테스트 (Docker 없음) ───────────────────────────────────
  test-key-utils:
    name: Test / Key Utils
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs['key-utils'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test key utility modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-idgenerators:test \
              :bluetape4k-cache-core:test \
              --parallel
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-idgenerators:koverXmlReport \
            :bluetape4k-cache-core:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-key-utils
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-key-utils
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 7. 핵심 Infra 테스트 (Redis — Testcontainers) ────────────────────────
  test-infra:
    name: Test / Infra (Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: ${{ needs.changes.outputs.infra == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test key infra modules (Redis)
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-redisson:test \
              :bluetape4k-lettuce:test \
              :bluetape4k-cache-lettuce:test \
              :bluetape4k-cache-redisson:test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-redisson:koverXmlReport \
            :bluetape4k-lettuce:koverXmlReport \
            :bluetape4k-cache-lettuce:koverXmlReport \
            :bluetape4k-cache-redisson:koverXmlReport \
            --parallel
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-infra
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 7-a. Kafka Infra 테스트 (Testcontainers) ────────────────────────────
  test-kafka-infra:
    name: Test / Kafka Infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: ${{ needs.changes.outputs['kafka-infra'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test Kafka infra modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-kafka:test \
              --max-workers=2 \
              --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-kafka:koverXmlReport \
            --max-workers=2 \
            --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-kafka-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-kafka-infra
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 7-b. Telemetry Infra 테스트 (Kafka / OpenTelemetry) ─────────────────
  test-telemetry-infra:
    name: Test / Telemetry Infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: ${{ needs.changes.outputs['telemetry-infra'] == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test telemetry infra modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-opentelemetry:test \
              :bluetape4k-kafka-logback:test \
              --max-workers=2 \
              --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-opentelemetry:koverXmlReport \
            :bluetape4k-kafka-logback:koverXmlReport \
            --max-workers=2 \
            --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-telemetry-infra
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-telemetry-infra
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 7-c. Data 모듈 테스트 (Testcontainers) ───────────────────────────────
  test-data:
    name: Test / Data
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: [build, changes]
    if: ${{ needs.changes.outputs.data == 'true' || needs.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.2.0
        with:
          gradle-version: wrapper
          cache-read-only: true

      - name: Test data modules
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          shell: bash
          command: |
            ./gradlew \
              :bluetape4k-jdbc:test \
              :bluetape4k-hibernate:test \
              :bluetape4k-hibernate-cache-lettuce:test \
              :bluetape4k-hibernate-reactive:test \
              :bluetape4k-r2dbc:test \
              :bluetape4k-mongodb:test \
              :bluetape4k-cassandra:test \
              --max-workers=2 \
              --no-configuration-cache
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Generate Kover XML report
        if: always()
        run: |
          ./gradlew \
            :bluetape4k-jdbc:koverXmlReport \
            :bluetape4k-hibernate:koverXmlReport \
            :bluetape4k-hibernate-cache-lettuce:koverXmlReport \
            :bluetape4k-hibernate-reactive:koverXmlReport \
            :bluetape4k-r2dbc:koverXmlReport \
            :bluetape4k-mongodb:koverXmlReport \
            :bluetape4k-cassandra:koverXmlReport \
            --parallel \
            --no-configuration-cache
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-data
          path: '**/build/test-results/test/*.xml'
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: '**/build/reports/kover/'
          retention-days: 30

  # ── 나머지 모듈 → Nightly에서 실행 ─────────────────────────────────
  # utils 전체, misc, spring3-docker, spring4-docker,
  # testcontainers 는 nightly-tests.yml (매일 03:00 KST) 에서 실행
  # exposed 모듈은 bluetape4k-exposed 독립 레포로 분리됨 (#334)

  # ── 8. 커버리지 집계 ──────────────────────────────────────────────────────
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-core, test-io, test-io-http, test-ktor, test-key-utils, test-infra, test-kafka-infra, test-telemetry-infra, test-data]
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate Kover coverage summary
        if: always()
        run: python3 .github/scripts/aggregate-kover-coverage.py coverage-artifacts

      - name: Upload aggregated coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-all
          path: coverage-artifacts/
          retention-days: 14

      - name: Upload coverage to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          files: coverage-artifacts/**/reports/kover/report.xml
          format: jacoco
          fail-on-error: false

  # ── 9. 결과 집계 ──────────────────────────────────────────────────────────
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-policy, codeql-policy, catalog-governance, gitleaks, validate-wrapper, changes, build, test-core, test-io, test-io-http, test-ktor, test-key-utils, test-infra, test-kafka-infra, test-telemetry-infra, test-data, coverage-report]
    if: always()
    steps:
      - name: Check all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          if echo "$RESULTS" | grep -qE "failure|cancelled"; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed (skipped jobs treated as success)"
