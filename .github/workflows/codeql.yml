name: CodeQL Analysis

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }} / ${{ matrix.scope }})
    runs-on: ubuntu-latest
    env:
      BLUETAPE4K_DEPENDENCIES_CATALOG_PATH: ${{ github.workspace }}/.catalog/bluetape4k-dependencies/gradle/libs.versions.toml
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            scope: workflows
            roots: ''
          - language: python
            scope: python
            roots: ''
          - language: java-kotlin
            scope: foundation
            roots: bluetape4k:cache:utils
          - language: java-kotlin
            scope: data-io
            roots: data:io
          - language: java-kotlin
            scope: infra
            roots: infra
          - language: java-kotlin
            scope: frameworks
            roots: ktor:spring-boot:virtualthread
          # testing/testcontainers remains excluded: its single compileKotlin
          # task timed out after 20 minutes while every other scope passed:
          # https://github.com/bluetape4k/bluetape4k-projects/actions/runs/29648755583
          # See the durable lesson for measurements and reconsideration gates:
          # docs/lessons/2026-07-18-codeql-testcontainers-exclusion.md
          - language: java-kotlin
            scope: testing-core
            roots: testing/assertions:testing/junit5:testing/mock-web-server:testing/mock-webflux-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve dependencies catalog ref
        id: catalog-ref
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          catalog_ref="$(sed -nE 's/^[[:space:]]*\.orElse\("([^"]+)"\).*/\1/p' settings.gradle.kts | head -1)"
          if [[ ! "$catalog_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve an immutable bluetape4k-dependencies catalog ref"
            exit 1
          fi
          echo "ref=$catalog_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout dependencies catalog
        if: matrix.language == 'java-kotlin'
        uses: actions/checkout@v7
        with:
          repository: bluetape4k/bluetape4k-dependencies
          ref: ${{ steps.catalog-ref.outputs.ref }}
          path: .catalog/bluetape4k-dependencies

      - name: Verify dependencies catalog commit
        if: matrix.language == 'java-kotlin'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .catalog/bluetape4k-dependencies rev-parse HEAD)" = "${{ steps.catalog-ref.outputs.ref }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Setup JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        if: matrix.language == 'java-kotlin'
        timeout-minutes: 120
        env:
          CODEQL_JAVA_ROOTS: ${{ matrix.roots }}
        # Keep each CodeQL Kotlin job scoped and compiler-only. Avoid examples,
        # demos, resources, benchmarks, archives, and distributions under
        # CodeQL tracing.
        run: |
          codeql_tasks_file="$(mktemp)"
          printf '%s\n' "$CODEQL_JAVA_ROOTS" | tr ':' '\n' | while IFS= read -r root; do
            [ -d "$root" ] || continue
            if [ -f "$root/build.gradle.kts" ]; then
              printf '%s\n' "$root/build.gradle.kts"
            else
              find "$root" -mindepth 2 -maxdepth 2 -name build.gradle.kts -print
            fi
          done |
            sed 's#/build.gradle.kts$##' |
            grep -Ev '(^|/)([^/]*-)?demo$' |
            while IFS= read -r module_dir; do
              [ -d "$module_dir/src/main" ] || continue
              base="${module_dir%%/*}"
              name="${module_dir#*/}"
              case "$base" in
                bluetape4k|cache|data|infra|io|testing|utils)
                  printf ':bluetape4k-%s:compileKotlin\n' "$name"
                  [ -d "$module_dir/src/main/java" ] && printf ':bluetape4k-%s:compileJava\n' "$name"
                  ;;
                ktor|spring-boot|virtualthread)
                  printf ':bluetape4k-%s-%s:compileKotlin\n' "$base" "$name"
                  [ -d "$module_dir/src/main/java" ] && printf ':bluetape4k-%s-%s:compileJava\n' "$base" "$name"
                  ;;
              esac
            done |
            sort > "$codeql_tasks_file"

          printf 'CodeQL Gradle tasks (%s):\n' "$(wc -l < "$codeql_tasks_file")"
          sed 's/^/  /' "$codeql_tasks_file"
          xargs ./gradlew --no-daemon < "$codeql_tasks_file"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}/${{ matrix.scope }}'
