name: Security

on:
  schedule:
    # 매주 월요일 오전 4시 (KST = UTC+9 → 일요일 UTC 19:00)
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  GITLEAKS_VERSION: 'v8.30.1'

jobs:
  # ── 시크릿 스캔 (전체 히스토리) ───────────────────────────────────────────
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          gitleaks_version="${GITLEAKS_VERSION#v}"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks (full history)
        run: gitleaks detect --source . --redact --config .gitleaks.toml

  # ── OWASP 의존성 취약점 스캔 ─────────────────────────────────────────────
  dependency-check:
    name: OWASP Dependency Check
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: wrapper

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check
        run: ./gradlew dependencyCheckAnalyze --no-daemon
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Verify Dependency Check reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find . -type f -path '*/build/reports/dependency-check-report.*' -print)
          if (( ${#reports[@]} == 0 )); then
            echo "OWASP Dependency Check produced no report" >&2
            exit 1
          fi

      - name: Upload Dependency Check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: '**/build/reports/dependency-check-report.*'
          if-no-files-found: error
          retention-days: 30

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '**/build/reports/dependency-check-report.sarif'

  # ── 전체 보안 게이트 ─────────────────────────────────────────────────────
  security-status:
    name: Security status
    needs:
      - gitleaks
      - dependency-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all security jobs
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          DEPENDENCY_CHECK_RESULT: ${{ needs.dependency-check.result }}
        run: |
          set -euo pipefail
          echo "Security job results: $RESULTS"
          if [[ "$GITLEAKS_RESULT" != "success" ]]; then
            echo "Secret scan must succeed; got $GITLEAKS_RESULT" >&2
            exit 1
          fi
          if [[ "$DEPENDENCY_CHECK_RESULT" != "success" ]]; then
            echo "OWASP Dependency Check must succeed, including report uploads; got $DEPENDENCY_CHECK_RESULT" >&2
            exit 1
          fi
