name: Dependency Submission

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.sha }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'temurin'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dependency-submission:
    name: Dependency Submission
    if: github.event_name == 'push' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Verify dependency submission commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          test "$CHECKOUT_SHA" = "$GITHUB_SHA"
          test "$CHECKOUT_SHA" = "$EXPECTED_SHA"
          echo "run_head_sha=$GITHUB_SHA"
          echo "submission_graph_commit_sha=$CHECKOUT_SHA"
          {
            echo "run_head_sha: \`$GITHUB_SHA\`"
            echo "submission_graph_commit_sha: \`$CHECKOUT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          additional-arguments: --no-configuration-cache --no-daemon
